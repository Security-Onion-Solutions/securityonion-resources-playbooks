<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Security Onion Sigma Playbooks — Generation Provenance</title>
  <style>
    /* Security Onion theme — so-blue (#1976d2) brand accent on a dark navy
       ground, matching securityonionsolutions.com. */
    :root {
      --bg: #090f20; --surface: #111a30; --surface2: #18233f; --border: #22304d;
      --text: #e2e8f0; --text-muted: #8a97b0; --accent: #1976d2; --hl: #5ca8f0;
      --green: #4caf50; --orange: #fb8c00; --red: #ef5350; --purple: #9c8cff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 920px; margin: 0 auto; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.25rem; }
    .subtitle { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }
    a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
    code, .mono { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 0.82rem; }

    .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
    .rollup-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr));
      gap: 0.75rem; margin-bottom: 1rem; }
    .stat { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem 1rem; text-align: center; }
    .stat .num { display: block; font-size: 1.5rem; font-weight: 600; color: var(--hl); }
    .stat .lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    details > summary { cursor: pointer; color: var(--accent); font-size: 0.85rem;
      list-style: none; user-select: none; }
    details > summary::-webkit-details-marker { display: none; }
    details > summary::before { content: '▸ '; }
    details[open] > summary::before { content: '▾ '; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem; }
    .chip { background: var(--surface2); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.15rem 0.6rem; font-size: 0.75rem; }
    .chip b { color: var(--hl); }

    input[type=search] { width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 0.75rem 1rem; font-size: 0.95rem; }
    input[type=search]:focus { outline: none; border-color: var(--accent); }
    .count { color: var(--text-muted); font-size: 0.8rem; margin: 0.75rem 0; }

    .pb { background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
      margin-bottom: 0.6rem; overflow: hidden; }
    .pb-head { padding: 0.85rem 1.1rem; cursor: pointer; display: flex; justify-content: space-between;
      align-items: baseline; gap: 1rem; }
    .pb-head:hover { background: var(--surface2); }
    .pb-name { font-weight: 600; font-size: 0.95rem; }
    .pb-id { color: var(--text-muted); font-size: 0.72rem; }
    .pb-tags { display: flex; gap: 0.35rem; flex-wrap: wrap; justify-content: flex-end; }
    .tag { font-size: 0.68rem; padding: 0.1rem 0.45rem; border-radius: 10px; white-space: nowrap; }
    .tag.set { background: rgba(74,158,255,0.15); color: var(--accent); }
    .tag.tech { background: rgba(179,136,255,0.15); color: var(--purple); }
    .pb-body { display: none; padding: 0 1.1rem 1.1rem; border-top: 1px solid var(--border); }
    .pb.open .pb-body { display: block; }
    .pb-body h3 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
      color: var(--text-muted); margin: 1.1rem 0 0.5rem; }
    .desc { color: var(--text-muted); font-size: 0.85rem; margin-top: 0.9rem; }

    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--text-muted); font-weight: 500; font-size: 0.72rem; text-transform: uppercase; }
    td.src { color: var(--hl); white-space: nowrap; }
    td.src.attack { color: var(--orange); }
    .kv { font-size: 0.8rem; }
    .kv .row { padding: 0.35rem 0; border-bottom: 1px solid var(--border); }
    .kv .row:last-child { border-bottom: none; }
    .kv .k { color: var(--purple); font-weight: 600; }
    .kv .meta { color: var(--text-muted); font-size: 0.75rem; }
    pre.json { background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.75rem; overflow-x: auto; font-size: 0.75rem; color: var(--text-muted); }
    .loading { color: var(--text-muted); padding: 2rem 0; text-align: center; }
  </style>
</head>
<body>
<div class="container">
  <h1>Generation Provenance</h1>
  <p class="subtitle">How each sigma playbook was generated — template/ATT&amp;CK source per
    question, plus the full <code>_generation_meta</code> audit block. Derived from
    <code>sigma/*.yaml</code>; regenerate with <code>python3 _meta/build_generation_meta.py</code>.</p>

  <div class="panel" id="rollup"><div class="loading">Loading generation_meta.json…</div></div>

  <input type="search" id="q" placeholder="Filter by name, id, technique, template set, or source…" autocomplete="off">
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<script>
const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const srcClass = s => (s||'').startsWith('attack:') ? 'src attack' : 'src';

let DOC = null;

function renderRollup(r) {
  const families = Object.entries(r.template_families).slice(0, 12);
  const sets = Object.entries(r.technique_sets_applied);
  const kinds = Object.entries(r.source_kinds);
  const el = document.getElementById('rollup');
  el.innerHTML = `
    <div class="rollup-grid">
      <div class="stat"><span class="num">${r.playbooks}</span><span class="lbl">Playbooks</span></div>
      <div class="stat"><span class="num">${r.total_questions}</span><span class="lbl">Questions</span></div>
      <div class="stat"><span class="num">${Object.keys(r.template_families).length}</span><span class="lbl">Template families</span></div>
      <div class="stat"><span class="num">${Object.keys(r.techniques).length}</span><span class="lbl">ATT&CK techniques</span></div>
    </div>
    <div class="chips">${kinds.map(([k,v]) => `<span class="chip">${esc(k)} <b>${v}</b></span>`).join('')}</div>
    <details style="margin-top:1rem"><summary>Top template families &amp; technique sets applied</summary>
      <div class="chips" style="margin-top:0.6rem">${families.map(([k,v]) => `<span class="chip">${esc(k)} <b>${v}</b></span>`).join('')}</div>
      <div class="chips" style="margin-top:0.6rem">${sets.map(([k,v]) => `<span class="chip" style="border-color:var(--accent)">${esc(k)} <b>${v}</b></span>`).join('')}</div>
    </details>`;
  if (r.playbooks_missing_meta && r.playbooks_missing_meta.length)
    el.innerHTML += `<p class="count" style="color:var(--orange)">⚠ ${r.playbooks_missing_meta.length} playbooks have no _generation_meta</p>`;
}

function listSection(title, items, fn) {
  if (!items || !items.length) return '';
  return `<h3>${esc(title)}</h3><div class="kv">${items.map(fn).join('')}</div>`;
}

function renderBody(p) {
  const m = p.generation_meta || {};
  let h = `<p class="desc">${esc(p.description)}</p>`;

  // Per-question source table
  h += `<h3>Question sources (${p.questions.length})</h3><table><thead><tr><th>#</th><th>source</th><th>question</th></tr></thead><tbody>`;
  h += p.questions.map(q =>
    `<tr><td>${q.n}</td><td class="${srcClass(q.source)} mono">${esc(q.source)}</td><td>${esc(q.question)}</td></tr>`).join('');
  h += `</tbody></table>`;

  h += listSection('Attack-chain coverage', m.attack_chain_coverage, s =>
    `<div class="row"><span class="k">stage ${esc(s.stage)} · ${esc(s.label)}</span> → <span class="mono">${esc(s.mapped_to)}</span>
     <span class="meta">${esc(s.source)}</span><br><span class="meta">${esc(s.description)}</span></div>`);

  h += listSection('Dimension coverage', m.dimension_coverage, s =>
    `<div class="row"><span class="k">${esc(s.dimension)}</span> · ${esc(s.technique)} → <span class="mono">${esc(s.covered_by)}</span>
     <span class="meta">${esc(s.coverage_type)}</span><br><span class="meta">${esc(s.source)}</span></div>`);

  h += listSection('Mutable dispositions', m.mutable_dispositions, s =>
    `<div class="row"><span class="k">${esc(s.element)}</span> · ${esc(s.disposition)} → <span class="mono">${esc(s.target_question)}</span>
     <br><span class="meta">${esc(s.specific_values)}</span>${s.notes ? `<br><span class="meta">${esc(s.notes)}</span>` : ''}</div>`);

  h += listSection('Dedup decisions', m.dedup_decisions, s =>
    `<div class="row"><span class="k">dropped</span> <span class="mono">${esc(s.dropped)}</span> · kept <span class="mono">${esc(s.kept)}</span>
     <br><span class="meta">${esc(s.reason)}</span></div>`);

  h += listSection('Hint dispositions', m.hint_dispositions, s =>
    `<div class="row"><span class="k">${esc(s.disposition)}</span> <span class="meta">${esc(s.hint)}</span>
     ${s.reason ? `<br><span class="meta">${esc(s.reason)}</span>` : ''}</div>`);

  if (m.skipped_templates && m.skipped_templates.length)
    h += listSection('Skipped templates', m.skipped_templates, s =>
      `<div class="row"><span class="mono">${esc(s.template || s)}</span> ${s.reason ? `<span class="meta">${esc(s.reason)}</span>` : ''}</div>`);

  if (m.generation_stats)
    h += `<h3>Generation stats</h3><pre class="json">${esc(JSON.stringify(m.generation_stats, null, 2))}</pre>`;

  // Catch-all: the complete block, so nothing is hidden by the curated sections above
  h += `<h3>Raw _generation_meta</h3><details><summary>Show full block</summary>
    <pre class="json">${esc(JSON.stringify(m, null, 2))}</pre></details>`;

  return h;
}

function renderList(items) {
  const list = document.getElementById('list');
  document.getElementById('count').textContent = `${items.length} playbook${items.length===1?'':'s'}`;
  list.innerHTML = items.slice(0, 400).map((p, i) => {
    const m = p.generation_meta || {};
    const sets = (m.technique_sets_applied || []).map(s => `<span class="tag set">${esc(s)}</span>`).join('');
    const techs = (m.techniques || []).filter(t=>t.role!=='secondary').map(t => `<span class="tag tech">${esc(t.id)}</span>`).join('');
    return `<div class="pb" data-i="${i}">
      <div class="pb-head"><div><div class="pb-name">${esc(p.name)}</div><div class="pb-id mono">${esc(p.id)}</div></div>
        <div class="pb-tags">${techs}${sets}</div></div>
      <div class="pb-body"></div></div>`;
  }).join('');
  if (items.length > 400) list.innerHTML += `<p class="count">Showing first 400 — narrow the filter to see the rest.</p>`;
  list.querySelectorAll('.pb').forEach(el => {
    el.querySelector('.pb-head').onclick = () => {
      const open = el.classList.toggle('open');
      const body = el.querySelector('.pb-body');
      if (open && !body.dataset.done) { body.innerHTML = renderBody(items[+el.dataset.i]); body.dataset.done = '1'; }
    };
  });
}

function filter(items, term) {
  term = term.trim().toLowerCase();
  if (!term) return items;
  return items.filter(p => {
    const m = p.generation_meta || {};
    const hay = [p.name, p.id,
      ...(m.technique_sets_applied||[]),
      ...(m.techniques||[]).map(t=>t.id+' '+t.name),
      ...p.questions.map(q=>q.source)].join(' ').toLowerCase();
    return hay.includes(term);
  });
}

// This viewer is served from the repo-root docs/ (the GitHub Pages web root),
// but the ~10 MB data file is the canonical copy in sigma/_meta — outside the
// web root, so it is never served alongside the page. Try the repo-relative
// copy first (works when browsing the tree locally), then fall back to
// raw.githubusercontent (same cross-origin pattern index.html uses for
// playbook fetches; raw sends CORS + gzip).
const RAW_JSON = 'https://raw.githubusercontent.com/Security-Onion-Solutions/securityonion-resources-playbooks/main/sigma/_meta/generation_meta.json';
const loadDoc = () =>
  fetch('../sigma/_meta/generation_meta.json').then(r => { if (!r.ok) throw 0; return r.json(); })
    .catch(() => fetch(RAW_JSON).then(r => r.json()));

loadDoc().then(doc => {
  DOC = doc;
  renderRollup(doc.rollup);
  let view = doc.playbooks;
  renderList(view);
  let t;
  document.getElementById('q').addEventListener('input', e => {
    clearTimeout(t);
    t = setTimeout(() => renderList(filter(doc.playbooks, e.target.value)), 120);
  });
}).catch(e => {
  document.getElementById('rollup').innerHTML = `<p style="color:var(--red)">Failed to load generation_meta.json — run <code>python3 _meta/build_generation_meta.py</code> first, or check the raw URL. (${esc(e)})</p>`;
});
</script>
</body>
</html>
