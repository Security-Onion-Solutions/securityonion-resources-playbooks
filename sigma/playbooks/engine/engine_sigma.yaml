name: Baseline Playbook - Sigma
id: 0c710b05-8b1b-4eb5-b528-7421fe18f964
description: |
  Baseline playbook for Sigma detections. Provides the investigation questions
  that apply to any Sigma alert regardless of category, and serves as the
  fallback when no category- or rule-specific playbook is available.
type: detection
detection_id: ''
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2025-03-28
questions:
- question: Are there any other alerts associated with the internal system?
  context: >-
    Identifying related alerts can help determine whether the internal system is experiencing
    a broader issue rather than a single isolated detection.
  range: -1d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        related.ip|expand: '%related_ip%'
      condition: selection
    fields:
      - rule.type
      - rule.name
