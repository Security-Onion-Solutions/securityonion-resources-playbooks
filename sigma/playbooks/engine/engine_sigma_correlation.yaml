name: Baseline Playbook - Sigma Correlation
id: e00496f8-1fbc-464e-8680-5bbbba673966
description: |
  The baseline playbook for Sigma correlation rules that have no playbook of their own.
  A correlation alert summarizes many events, so its questions work from the alert itself
  rather than from a single triggering event.
type: detection
detection_id: ''
detection_category: ''
detection_type: sigma_correlation
contributors:
- SecurityOnionSolutions
created: 2026-09-27
questions:
- question: What did the correlation find, and over what window?
  context: >-
    The reason names what was counted and for whom. The window runs from the first to
    the last counted event, and lies well before the alert when the events arrived late.
  query: |
    aggregation: false
    logsource:
      product: alert
    detection:
      selection:
        document_id|expand: '%document_id%'
      condition: selection
    fields:
      - event.reason
      - labels.correlation_group
- question: Has this rule fired before for the same group?
  context: >-
    Earlier alerts for the same account, host or address suggest recurring, possibly expected,
    activity. The week is counted around the window, so alerts for events that arrived much
    later than they happened may fall outside it.
  range: +/-7d
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        rule.uuid|expand: '%rule.uuid%'
        labels.correlation_group|expand: '%labels.correlation_group%'
      condition: selection
    fields:
      - event.reason
- question: Which groups has this rule fired for?
  context: >-
    Alerts for many different groups suggest the threshold is low for this environment; one
    group firing repeatedly points to a single noisy source that a filter can exclude. Only
    the five groups with the most alerts are listed.
  range: +/-7d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        rule.uuid|expand: '%rule.uuid%'
      condition: selection
    fields:
      - labels.correlation_group
- question: Are there other alerts for the addresses or accounts in this group?
  context: >-
    Other detections for the same address or account, from any engine, add weight to this one;
    several correlations for the same group point to real activity rather than a noisy rule.
  range: +/-1d
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection_ip:
        related_ip|expand: '%related_ip%'
      selection_user:
        related.user|expand: '%related.user%'
      condition: 1 of selection_*
    fields:
      - rule.name
