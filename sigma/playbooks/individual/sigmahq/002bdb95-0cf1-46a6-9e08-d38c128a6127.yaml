name: WScript or CScript Dropper - File
id: 5e9fb591-d478-43f4-9b6d-14f02a05ccfe
description: |
  Detects wscript.exe or cscript.exe writing a script file (.js, .jse, .vba, .vbe, .vbs, .wsf, .wsh) into a
  user-writable or temporary location such as Perflogs, ProgramData, Temp, a user profile, a Startup folder, or a
  Temporary Internet directory. The rule requires all three conditions together: the Windows Script Host binary as
  the writing process, one of those directory segments in the path, and one of those script extensions. A script
  host that writes another script instead of only reading one is the staging step of a multi-stage script chain —
  a first-stage downloader unpacking its next stage, or a script installing a copy of itself into a Startup folder.
  Legitimate installers, login scripts, and management tooling do occasionally generate scripts from a script host,
  so the investigation should establish what launched the script host, what the written file contains, whether it
  subsequently executed, and whether this writer and path are routine on this host.
type: detection
detection_id: 002bdb95-0cf1-46a6-9e08-d38c128a6127
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the written file path carry one of the script extensions this rule detects, and did wscript.exe
    or cscript.exe perform the write?
  context: Confirm the alert before investing time. The rule requires a Windows Script Host binary as the writing
    process, a path segment such as Temp, ProgramData, Perflogs, a user profile, or a Startup folder, and an extension
    of .js, .jse, .vba, .vbe, .vbs, .wsf, or .wsh. Check the operation type as well — a creation is a drop, while
    a modification of an existing script may be an update to something already present. The signer columns describe
    the writing process; read them for coherence with a script host writing script content, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to generate script files from a Windows Script Host into a temporary
    or user-writable directory?
  context: Login scripts, software deployment packages, and administrative automation all legitimately produce
    scripts from cscript.exe on some hosts. Developer workstations and build servers generate scripts routinely;
    a general-purpose desktop rarely does. When the account is a machine or service principal, judge by the host's
    role and the writing process rather than by user identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the written script still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives the next step. A script still on disk can be retrieved, hashed,
    and read; a script deleted seconds after it was written points to a self-removing stage and shifts the question
    to what executed in between. A rename shortly after creation is also common when a stage relocates itself into
    a persistence location.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What launched the wscript.exe or cscript.exe process that wrote this file, and what script was it running?
  context: The alert names the writing process but not its origin. Retrieving the script host's own start event
    supplies the parent and the full command line, which names the first-stage script it was executing. A script
    host launched by explorer.exe or by a management agent has a routine explanation; one launched by an Office
    application, mshta.exe, a browser, or an archive utility indicates the script arrived through a document or
    download rather than through administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Is the script host's command line encoded or obfuscated, and what operation does the decoded content
    perform?
  context: The command line names the first-stage script and any arguments passed to it, and those arguments are
    often where the payload hides. Look for base64, hex, URL-encoding, and character-concatenation patterns — VBScript
    Chr() chains and JavaScript String.fromCharCode calls are the common forms for this pair of interpreters. Reconstruct
    the string and identify what it forms; download cradles, in-memory loaders, and staged writes to a Startup folder
    are the usual results. Iterate the decoding when the payload is layered.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What is inside the written script file, and does its content show obfuscation or embedded network indicators?
  context: Retrieve and read the file. Script droppers typically write a next stage that contains an embedded URL
    or IP address, a download-and-execute routine, a WScript.Shell Run call, or a self-registration into a Run key
    or Startup folder. High-entropy content, long single-line string arithmetic, and Chr()/fromCharCode reconstruction
    are the encoding patterns these interpreters support natively. Compare any extracted host names, addresses, and
    string constants against threat intelligence. Content retrieval is a manual step from the endpoint; the query
    confirms the on-disk path and which process placed it there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the written script has executed, what is its hash — and does it have known AV or threat intel detections?
  context: A hash is recorded when a file runs, not when it is written, so the file-creation event carries none.
    A script executes as an interpreter process with the script path in the command line rather than as its own
    image, so the interpreter leg of this query is the one that usually matches — and on that match the recorded
    hash belongs to the interpreter, not to the script. Use the query to establish whether the script ran and under
    which interpreter, then hash the file from its on-disk path and submit that hash to reputation services. A script
    written but never executed will not appear here at all.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What child processes did the script host spawn after writing this file?
  context: The processes a script host spawns reveal what its script actually did. A script host that only reads
    configuration spawns nothing. One that spawns cmd.exe, powershell.exe, certutil.exe, mshta.exe, rundll32.exe,
    or another instance of itself is chaining into a next stage, and each child's command line continues the chain.
    Absence of children alongside a written script suggests the next stage is waiting on a scheduled trigger or a
    Startup-folder launch instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one script often drops several — a first stage unpacking components, a loader staging
    a configuration file alongside its script, or a routine that writes then removes intermediate files. The breadth,
    paths, and extensions of the writer's other file activity distinguish a single artifact from a staging sequence
    and enumerate what else needs review. The correlation covers the script host and its direct children, since droppers
    frequently delegate the write to a spawned interpreter.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What other script files have been written to these staging locations on this host recently, and by which
    processes?
  context: Location drives suspicion for script artifacts. Temp, ProgramData, Perflogs, user profile directories,
    Temporary Internet directories, and Startup folders each have a small set of processes that legitimately write
    scripts there. This query mirrors the rule's path and extension criteria without the script-host constraint,
    so other recent arrivals show whether the location is under active use and whether a browser, mail client, archive
    utility, or installer also delivered scripts into it. A single unfamiliar writer across many files is the signal;
    a Startup-folder entry among the results is the persistence step.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - ':\Perflogs\'
        - ':\ProgramData\'
        - ':\Temp\'
        - ':\Tmp\'
        - ':\Users\'
        - ':\Windows\Temp\'
        - '\AppData\Local\Temp'
        - '\AppData\Roaming\Temp'
        - '\Start Menu\Programs\Startup\'
        - '\Temporary Internet'
        TargetFilename|endswith:
        - '.js'
        - '.jse'
        - '.vba'
        - '.vbe'
        - '.vbs'
        - '.wsf'
        - '.wsh'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Which scripting engine modules did the script host load around the alert, and do they match the language
    of the written file?
  context: 'wscript.exe and cscript.exe load an engine module for whichever language they are interpreting — vbscript.dll
    for VBScript, jscript.dll or jscript9.dll for JavaScript — plus helper modules such as scrrun.dll for file-system
    and shell objects, scrobj.dll for scriptlet loading, and wshom.ocx for WScript.Shell. The loaded set describes
    what the script actually reached for: a file-system runtime load is consistent with writing another script, while
    a scriptlet or XML-HTTP module load points to remote content retrieval. A mismatch between the loaded engine
    and the written file''s extension indicates the process is producing a stage in a different language than the
    one it is running.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
        - '\wscript.exe'
        - '\cscript.exe'
        ImageLoaded|endswith:
        - '\vbscript.dll'
        - '\jscript.dll'
        - '\jscript9.dll'
        - '\scrrun.dll'
        - '\scrobj.dll'
        - '\wshom.ocx'
        - '\msxml3.dll'
        - '\msxml6.dll'
        - '\winhttp.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's criteria scoped to this user, so the result is the user's 90-day history
    of script hosts writing scripts into these locations, aggregated by host. A user who has never produced this
    pattern is a different proposition from one whose account drives it weekly on a build host. Weigh the count against
    the account's role and its normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \wscript.exe
        - \cscript.exe
        TargetFilename|contains:
        - :\Perflogs\
        - :\ProgramData\
        - :\Temp\
        - :\Tmp\
        - :\Users\
        - :\Windows\Temp\
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - \Start Menu\Programs\Startup\
        - \Temporary Internet
        TargetFilename|endswith:
        - .js
        - .jse
        - .vba
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically produced the rule's pattern on this host or across the environment, or
    is it new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior, and a
    file event carries no parent to pivot on. The acting program is the meaningful pivot: the query mirrors the rule''s
    criteria scoped to the alerting binary, so the result is the 90-day history of this script host producing this
    specific write pattern rather than generic use of the binary. A program that is new or rare for this pattern
    is the deviation worth chasing; one already accounting for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \wscript.exe
        - \cscript.exe
        TargetFilename|contains:
        - :\Perflogs\
        - :\ProgramData\
        - :\Temp\
        - :\Tmp\
        - :\Users\
        - :\Windows\Temp\
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - \Start Menu\Programs\Startup\
        - \Temporary Internet
        TargetFilename|endswith:
        - .js
        - .jse
        - .vba
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts shows whether the script staging is confined to this
    endpoint or is one instance of the same account acting in several places. The same user driving comparable activity
    on multiple hosts widens the scope of the investigation. When the alert fires under SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a machine account, this view returns agent telemetry rather than operator activity and the program-scoped
    view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated
    to this host?
  context: 'Under a service principal, asking what else the user did across the network returns agent telemetry,
    and a file event carries no parent to pivot on. The useful question is whether the same program produced the
    same write pattern elsewhere: the query mirrors the rule''s criteria scoped to the alerting binary, fleet-wide,
    in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \wscript.exe
        - \cscript.exe
        TargetFilename|contains:
        - :\Perflogs\
        - :\ProgramData\
        - :\Temp\
        - :\Tmp\
        - :\Users\
        - :\Windows\Temp\
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - \Start Menu\Programs\Startup\
        - \Temporary Internet
        TargetFilename|endswith:
        - .js
        - .jse
        - .vba
        - .vbe
        - .vbs
        - .wsf
        - .wsh
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Was the script host executed from its expected system path, and does its original file name match?
  context: wscript.exe and cscript.exe normally run from System32 or SysWOW64. A copy running from a user profile,
    Temp, or ProgramData directory indicates the binary was relocated to sidestep path-based allowlists, and a mismatch
    between the image name and the compiled OriginalFileName indicates it was renamed. Either condition changes the
    reading of the write itself, since a relocated script host is not part of any standard workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: Script-host staging rarely stands alone. A written script is commonly retrieved or executed through a
    second signed utility, so recent use of other proxy-execution and download binaries on the same host indicates
    the stages around this one. Look at each result's command line for the same paths or host names seen in the written
    script; a match ties the activity together, while an unrelated administrative invocation does not.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host place the script write in a timeline. A document-handling or browser
    process spawning a script host, a download utility running, or a mail attachment being opened shortly before
    the write identifies the delivery step; a detection after it identifies the next stage. The ordering and spacing
    of the alerts also indicate whether the activity tracks a user's working hours or ran unattended.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
