name: Qakbot Regsvr32 Calc Pattern
id: 2599d900-12d8-43f2-a5eb-0f4ddb51c6a9
description: |
  Detects regsvr32.exe running with the silent flag (-s / /s) and a command line that ends in the
  literal argument ' calc'. Both conditions must hold together for the rule to fire. regsvr32 exists
  to register DLLs and normally takes only a module path plus optional switches; a trailing 'calc'
  token is not part of the documented syntax and is a distribution artifact of the Qakbot loader,
  which registers its payload DLL silently and passes an extra argument that the DLL's entry point
  reads. Determine which module was passed to regsvr32, where that module came from, whether it is
  signed, and what the process did after registration — module loads, outbound connections, and
  child processes are where the payload's behavior becomes visible.
type: detection
detection_id: 0033cf83-fb87-446d-9cac-43d63ad4d5a9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line show regsvr32 running silently with a trailing 'calc' argument?
  context: Confirm the alert before investing time. The rule requires the silent flag and a command
    line ending in ' calc' on the same regsvr32 invocation. Read the full command line and note the
    module path that sits between the flag and the trailing token — that path is the payload and
    drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register DLLs with regsvr32?
  context: Registering a component with regsvr32 is a real administrative and installer task, but it
    is normally driven by a setup program or a packaging workflow rather than by a person at a
    console. If the host is a developer workstation or a software-distribution point and the user
    routinely installs components, the invocation may be routine; on a general-purpose endpoint it
    is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did regsvr32 register — which module path was passed, and what do the
    remaining arguments specify?
  context: The command line carries the payload. Note where the module lives (a user-writable
    directory such as a profile, temp, or public path is a different story from a vendor install
    directory), what extension it carries (loader DLLs are frequently renamed to .dat, .tmp, .png,
    or given no extension at all), and what the trailing token is doing — regsvr32 passes surplus
    arguments through, and a payload DLL can read them as an entry-point selector or a simple
    anti-sandbox check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did this regsvr32 process load, and are they signed?
  context: regsvr32 loads the target module into its own address space and calls the module's
    registration export, so the load event names the payload directly and carries its signature
    state and hash. A module from a user-writable path, unsigned, or signed by a publisher unrelated
    to the software installed on the host is the artifact to hash and submit for further analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
  - external_threat_intel
- question: What process spawned this regsvr32 instance and is that parent chain expected?
  context: The parent reveals how the registration was invoked. Installers, msiexec, and vendor
    update services are ordinary parents. Script hosts (wscript.exe, cscript.exe, mshta.exe),
    command interpreters, Office applications, and archive utilities are the delivery chain pattern
    for loaders that arrive as an attachment or a download and register their own payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this regsvr32 process open outbound network connections after the module was
    registered?
  context: regsvr32 registering a local component has no reason to talk to the network. A loader DLL
    hosted inside regsvr32 inherits the process identity and beacons from it, so connections
    attributed to this process — especially repeated contact with the same external address, or
    contact on non-web ports — indicate the registered module is doing more than registering.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What child processes did regsvr32 spawn afterward?
  context: Component registration spawns nothing. Children of regsvr32 come from the loaded module,
    and a loader that has completed its first stage typically hands off — command interpreters,
    script hosts, or a copy of a system binary launched from an unexpected path. Anything here is
    the next stage of the operation and should be triaged in its own right.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other tools ran on this host around the same time?
  context: Loader execution rarely stands alone. Activity in the surrounding window may show the
    delivery step that preceded it (a script host, an archive utility, a browser writing to a temp
    path) or the follow-on steps that came after it — discovery commands, credential access, or a
    persistence mechanism being installed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating parent-child pairs on the host collapses routine agent and service telemetry
    into a few high-count rows while novel pairings stand out at low counts. Scan for parents that
    should not be launching anything and for binaries appearing on this host for the first time in
    the window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Does this host normally run regsvr32 at all?
  context: regsvr32 ships with Windows and is used legitimately by installers, so a non-zero count
    is expected on most hosts. What matters is the distribution across accounts — registration
    normally runs under an installer's context or a machine account, and a history dominated by
    interactive user accounts on an endpoint that installs no software is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired this silent-registration pattern, what parents and
    users normally drive it, and does the current alert fit that history?
  context: The query mirrors the rule's selection scoped to this host, so the parent/user
    distribution reflects how this specific silent-plus-trailing-argument pattern has run here
    rather than generic regsvr32 usage. A count of zero means the pattern is new to this host. A
    new parent process or an unexpected account against an established history is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -s'
        CommandLine|endswith: ' calc'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this registration pattern, and does that history fit
    their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is their
    90-day history of this specific pattern aggregated by host rather than generic regsvr32 use. A
    user who has never produced it is a different case from one who does so regularly; weigh the
    count against whether the role involves software packaging or component installation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -s'
        CommandLine|endswith: ' calc'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven this registration pattern here or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal or machine account, user identity does not
    attribute the behavior; the launch mechanism does. The query mirrors the rule''s selection scoped
    to the alerting parent, giving the 90-day history of that parent driving this pattern. A new or
    rare parent is the deviation; a parent already accounting for a large prior count is packaging
    or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -s'
        CommandLine|endswith: ' calc'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the alert window shows whether the
    same identity was active on other endpoints. Loader delivery through mail or shared storage
    often lands on several recipients at once, and the same account producing execution on multiple
    hosts widens the scope of what needs containment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven registration pattern fire on other hosts in the same window,
    or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did returns agent telemetry from
    every host. The meaningful pivot is the launch mechanism — the query mirrors the rule's selection
    scoped to the alerting parent, fleet-wide, in the alert window. Multiple hosts in the same window
    points to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -s'
        CommandLine|endswith: ' calc'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired this registration pattern in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this specific pattern rather than the binary's general footprint. Many hosts firing it points to
    scripted deployment or vendor automation; one host or a small unrelated set points to operator
    activity or a delivery campaign landing on individual recipients. Use the host distribution to
    calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \regsvr32.exe
        CommandLine|contains|windash: ' -s'
        CommandLine|endswith: ' calc'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may show the stages that preceded execution — a mail
    or browser-delivered archive being opened, a script host running, or defense settings being
    modified. The ordering of alerts reconstructs the timeline and indicates how far back the
    activity started.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
