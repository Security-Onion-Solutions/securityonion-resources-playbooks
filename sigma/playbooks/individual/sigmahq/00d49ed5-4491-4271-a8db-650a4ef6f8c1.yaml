name: Suspicious Download from Office Domain
id: 4df10e3d-6012-4c53-8487-df96e64cf788
description: |
  Detects a command-line download tool (curl.exe, wget.exe) or a PowerShell download cradle (Invoke-WebRequest, iwr, curl, wget, Start-BitsTransfer, .DownloadFile(, .DownloadString() retrieving a file from a Microsoft attachment domain used by Outlook on the web and OneNote (attachment.outlook.live.net, onenoteonlinesync.onenote.com). The rule fires only when both conditions hold: a download mechanism is present AND the command line references one of those domains. These domains host file attachments inserted into emails or OneNote notebooks, and their direct-download links are reachable without authentication, so they are abused to stage payloads from infrastructure that looks trusted. Determine whether the download was an expected automation against these domains or an operator fetching a staged payload, what was retrieved, and whether it executed.
type: detection
detection_id: 00d49ed5-4491-4271-a8db-650a4ef6f8c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain both a download mechanism and one of the monitored Office or OneNote attachment domains?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command line both invokes a download tool (curl.exe or wget.exe, or a PowerShell cradle such as Invoke-WebRequest, Start-BitsTransfer, .DownloadFile(, .DownloadString() AND references attachment.outlook.live.net or onenoteonlinesync.onenote.com. Confirm both parts are present in the exact command that fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to download attachments from Outlook or OneNote with command-line tools?
  context: Legitimate use exists -- some scripts and tools download attachments from these Microsoft domains for backup or migration. A user or host with no business reason to fetch Office attachments through curl, wget, or a PowerShell cradle is a stronger signal than an administrator or automation account that routinely does so.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the download command do? Decode the full command line, the download mechanism, and the target URL.
  context: The full command line reveals which mechanism was used (curl/wget binary versus a PowerShell cradle), the exact attachment URL on the Office or OneNote domain, any output path the file was written to, and follow-on actions chained with semicolons or pipes. Pull the destination path so the downloaded file can be located on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this download command, and is that parent chain expected?
  context: The parent process reveals how the download was invoked. A user-driven download from explorer.exe or a shell differs from one launched by Office applications (winword.exe, onenote.exe), mshta.exe, wscript.exe, or another script host -- those parents suggest a malicious document or macro reached out to the attachment domain. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What is the destination URL, and does it match a legitimate Outlook or OneNote attachment link?
  context: The domain is a fixed Microsoft attachment endpoint, so reputation of the domain itself is not the question -- the host path and the specific attachment identifier in the URL are. These links require no authentication, so any user can publish a file there and share the direct-download link. Examine the full URL path, when the attachment was created, and whether the link resolves to an expected document. The destination is an external Microsoft IP block, so internal-versus-external filtering will not separate this from benign Office traffic.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Did the download land in a user-writable staging directory, and what is its hash once retrieved?
  context: Downloaded payloads are typically dropped into a user-writable staging directory -- Temp, AppData, Downloads, Public, or ProgramData -- rather than a managed install path, and a file-creation event carries no hash. This narrows the files the download command (and any child) wrote to those staging zones, which is the high-priority set to pull from disk and hash; submit any to VirusTotal, Hybrid Analysis, or internal threat intel. A landing in one of these directories is itself a triage signal. If the file was executed, its hash is already captured by the payload-execution question; this step covers the downloaded-but-not-run case and gives you the exact path to retrieve and hash by hand.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_staging:
        TargetFilename|contains:
          - '\AppData\'
          - '\Users\Public\'
          - '\ProgramData\'
          - '\Downloads\'
          - '\Temp\'
      condition: (selection_self or selection_child) and selection_staging
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the downloaded file still on disk for analysis?
  context: The command references a download destination. Checking whether that file still exists on disk enables hash lookups, sandbox submission, and content review. Watch for drops into user-writable staging directories such as Public, Temp, Downloads, or ProgramData, which are common payload landing paths.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination.
  context: A download command does not guarantee the file was retrieved. Network errors, blocked URLs, or security controls may have prevented the transfer. Confirming file creation at the target path establishes whether the activity progressed past delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the downloaded payload was executed, what is its hash and does it have known threat-intel detections?
  context: The hash for a reputation lookup is recorded when the payload runs, not when it is written to disk — file-creation events carry no hash. This query returns what the downloader and the shell that launched it spawned (its children and siblings), with their executable hashes; if the downloaded file was executed as part of the same command, it appears here. If it was run later by an unrelated process, retrieve it from disk and hash it manually — for scripts and text files also check for encoded strings, embedded URLs, and command sequences; for binaries check signing status and imports.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the target directory?
  context: Operators often download multiple files to the same staging directory, or the downloaded file triggers further writes (extraction, decompression, additional downloads). Directory-level file activity reveals the broader scope of the delivery, excluding the file already identified.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
      - Image|endswith:
        - \curl.exe
        - \wget.exe
      - CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - 'curl '
        - 'wget '
        - Start-BitsTransfer
        - .DownloadFile(
        - .DownloadString(
      selection_domains:
        CommandLine|contains:
        - https://attachment.outlook.live.net/owa/
        - https://onenoteonlinesync.onenote.com/onenoteonlinesync/
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
      - Image|endswith:
        - \curl.exe
        - \wget.exe
      - CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - 'curl '
        - 'wget '
        - Start-BitsTransfer
        - .DownloadFile(
        - .DownloadString(
      selection_domains:
        CommandLine|contains:
        - https://attachment.outlook.live.net/owa/
        - https://onenoteonlinesync.onenote.com/onenoteonlinesync/
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar downloads on several hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
      - Image|endswith:
        - \curl.exe
        - \wget.exe
      - CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - 'curl '
        - 'wget '
        - Start-BitsTransfer
        - .DownloadFile(
        - .DownloadString(
      selection_domains:
        CommandLine|contains:
        - https://attachment.outlook.live.net/owa/
        - https://onenoteonlinesync.onenote.com/onenoteonlinesync/
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were any other download LOLBins used on this host recently?
  context: Operators who use one download LOLBin often use several. If curl or wget fetched a file, check whether certutil, bitsadmin, expand, or other transfer-capable LOLBins were also used on this host. Multiple download utilities performing the same objective strengthens the case for staged delivery rather than incidental use.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was the download tool executed from its expected system path?
  context: A download tool executed from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists. A curl.exe running from a user's temp or Downloads directory is more suspicious than one in System32. Compare the Image path against OriginalFileName to spot renamed copies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's download pattern over the past 90 days, and what command-line structures are typical?
  context: A download from these attachment domains with no prior history on a host is more suspicious than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic use of the binary. The command-line projection lets the typical invocation patterns be compared against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_download:
      - Image|endswith:
        - \curl.exe
        - \wget.exe
      - CommandLine|contains:
        - Invoke-WebRequest
        - 'iwr '
        - 'curl '
        - 'wget '
        - Start-BitsTransfer
        - .DownloadFile(
        - .DownloadString(
      selection_domains:
        CommandLine|contains:
        - https://attachment.outlook.live.net/owa/
        - https://onenoteonlinesync.onenote.com/onenoteonlinesync/
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
