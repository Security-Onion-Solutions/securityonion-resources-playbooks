name: RDP Connection Allowed Via Netsh.EXE
id: 3e62f89f-465f-43a3-b817-b619cd223c49
description: |
  Detects netsh.exe opening the local Windows firewall to permit inbound RDP, identified by a
  command line that combines firewall, add, tcp, and 3389 with either portopening or allow. Opening
  port 3389 is a firewall modification that weakens host defenses and prepares the system for inbound
  remote desktop access. Legitimate administration occasionally does this, but unauthorized use is a
  common setup step that precedes interactive RDP by an operator, so the investigation should
  establish who ran it, what firewall change was actually made, whether a new account or other
  remote-access enablement accompanied it, and whether RDP access followed.
type: detection
detection_id: 01aeb693-138d-49d2-9403-c4f52d7d3d62
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line match this rule's netsh firewall pattern opening TCP 3389 for RDP?
  context: >-
    Confirm the alert is a true positive by reviewing the exact command line and process details
    against the detection criteria. The rule fires when netsh.exe (by image name or original file
    name) runs a command that contains firewall, add, tcp, and 3389 together with either portopening
    or allow. Verify all of those tokens are present and that the action genuinely opens inbound port
    3389 rather than a different port or a delete/remove operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify the Windows firewall to allow inbound RDP?
  context: >-
    Legitimate administrative activity can trigger this detection. Knowing whether the user role and
    host function are consistent with opening the firewall for remote desktop is often the fastest
    path to distinguishing routine administration from unauthorized remote-access setup. A workstation
    or a user with no administrative remit opening 3389 is far less expected than a jump host managed
    by an IT team that provisions RDP.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What firewall rule did this netsh command actually create, and exactly which port and direction did it open?
  context: >-
    The command line reveals the precise firewall change. Read the full netsh argument string to
    confirm it adds an allow rule for inbound TCP 3389 (portopening or allow) rather than some other
    port or protocol, and note the rule name, scope, and profile if specified. Identifying exactly what
    was opened determines whether the host is now reachable over RDP and sets the remediation step of
    removing the rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the inbound RDP firewall opening still present, or has the rule since been removed?
  context: >-
    A firewall opening may be temporary or persistent. Checking the current firewall state for an
    inbound allow rule on TCP 3389 reveals whether the host remains reachable over RDP. If the rule is
    still in place, it should be reviewed and removed before further investigation unless RDP exposure
    is an approved configuration for this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the firewall policy modified directly in the registry on this host around the time of the alert?
  context: >-
    Firewall changes can be made through netsh or written straight into the registry under the
    SharedAccess firewall policy keys, which the command-line view does not capture. Registry writes to
    the FirewallPolicy tree that add or modify an allow rule for 3389 confirm the same effect was
    achieved or reinforced outside the netsh invocation. Correlate any such writes with the alerting
    process and user to see whether the firewall change was applied through more than one mechanism.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: What process spawned this netsh execution, and is that parent chain expected for firewall administration?
  context: >-
    The parent process reveals how netsh was invoked. Legitimate firewall changes usually descend from
    an interactive administrative shell or a management tool. A parent such as a script host, an Office
    application, a remote-execution service, or an unfamiliar binary points toward automated or
    operator-driven setup rather than hands-on administration. Note what spawned the parent and what
    else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What activity occurred on this host after the firewall was opened for RDP?
  context: >-
    Opening the firewall for inbound RDP is preparation for what follows. Examining process activity
    immediately after the change can reveal an inbound RDP logon, account creation, credential access,
    or staging that the opening was meant to enable. Correlate this window with logon events and
    network connections to TCP 3389 to confirm whether remote access actually followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Was a new local user account created or a group membership changed on this host around the time of the alert?
  context: >-
    Preparing a host for follow-on RDP access frequently pairs opening the firewall with creating a new
    local account or adding an account to a remote-access group, so a fresh credential is available for
    the inbound session. Look for net user add or net localgroup activity on this host near the alert.
    A new account combined with the firewall opening is a stronger indication of deliberate remote-access
    setup than the firewall change alone.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_account:
        Image|endswith:
          - '\net.exe'
          - '\net1.exe'
        CommandLine|contains:
          - 'user '
          - 'localgroup '
      condition: selection and selection_account
    fields:
      - CommandLine
      - User
- question: Were other defense tampering actions performed on this host beyond the firewall opening?
  context: >-
    Operators who weaken one control often weaken several. Stopping AV/EDR, clearing logs, or deleting
    shadow copies alongside the firewall change indicates a coordinated effort to reduce visibility and
    recovery options. Finding multiple tampering events from the same user or parent process in the same
    window points to a single operation rather than an isolated administrative action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: When this host previously fired this netsh firewall pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even routine tools get abused. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent and user distribution reflects how this specific firewall-opening pattern has
    historically run here rather than generic netsh usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated changes across
    multiple endpoints. If the same user opened the firewall or staged remote access on more than one
    host, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this netsh firewall pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firewall-opening pattern rather than generic netsh usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      condition: all of selection_*
    fields:
    - host.name
- question: Was netsh.exe executed from its expected System32 path?
  context: >-
    netsh executed from a non-standard path outside System32 or SysWOW64 may indicate the binary was
    copied or renamed to evade path-based allowlists. A netsh.exe running from a user temp or profile
    directory is more suspicious than one in System32, where firewall administration normally runs from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this netsh firewall pattern over the past 90 days, and what command-line structures are typical?
  context: >-
    A pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects
    this specific firewall-opening pattern rather than generic netsh usage. The command-line projection
    lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - 'firewall '
        - 'add '
        - 'tcp '
        - '3389'
        CommandLine|contains:
        - portopening
        - allow
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
