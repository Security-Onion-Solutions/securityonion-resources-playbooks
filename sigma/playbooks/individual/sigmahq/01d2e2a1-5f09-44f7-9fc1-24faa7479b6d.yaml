name: Uncommon Svchost Parent Process
id: 06ad0281-a2fc-4035-bf28-e08041b64e3c
description: |
  Detects a process creation where the Image ends in \svchost.exe AND the parent process is not one of the
  known launchers of svchost (services.exe, TiWorker.exe, MsMpEng.exe, Mrt.exe, ngen.exe, rpcnet.exe) AND the
  ParentImage field is populated. On Windows, svchost.exe is started by the Service Control Manager
  (services.exe); a small set of Microsoft components launch it directly, and the rule filters those out.
  Two patterns produce this alert: a file named svchost.exe executing from outside the canonical Windows
  system directories, which is a different program carrying a trusted name and location; or a genuine
  svchost.exe started by an unexpected launcher, which can accompany process hollowing or software that
  starts a service host directly. The investigation should establish the real identity of the alerting
  binary, how it arrived on the host, which parent launched it and how that parent itself started, and
  whether the same parent and pattern appear elsewhere on the host or across the fleet.
type: detection
detection_id: 01d2e2a1-5f09-44f7-9fc1-24faa7479b6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Is the alerting Image really svchost.exe, and is its parent process outside the rule's known-launcher list?
  context: >-
    The rule fires when Image ends in \svchost.exe, the parent is not Mrt.exe, MsMpEng.exe, ngen.exe,
    rpcnet.exe, services.exe or TiWorker.exe, and ParentImage is populated. Blank, dash, and null parent
    values are filtered out by design, so a populated but unexpected parent is what triggered this. Confirm
    the Image path and the parent name on the alerting event before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to launch svchost.exe from the parent process seen in this alert?
  context: >-
    Installers, imaging tools, management agents, and some vendor software start svchost.exe directly rather
    than going through the Service Control Manager, and those launches are routine on the hosts that run them.
    Knowing whether the host's role and the account are consistent with a direct svchost.exe launch is often
    the fastest way to separate normal operations from activity worth pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What service group did this svchost.exe instance run, and how does its command line compare with the other svchost.exe launches on this host in the same window?
  context: >-
    A Service Control Manager launch of svchost.exe carries a -k switch naming a service group (netsvcs,
    LocalService, NetworkService, DcomLaunch and similar) and often a -s switch naming one service. A command
    line with no -k switch, an unrecognised group name, or trailing arguments does not correspond to a service
    host launch. CurrentDirectory is a second tell: service launches start from the system directory, so a
    working directory under a user profile, a temp path, or an application folder points at a different
    launcher.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    The binary shipped with Windows carries OriginalFileName svchost.exe, a Microsoft signature, and a hash
    that is stable per OS build. A file named svchost.exe whose embedded OriginalFileName says something else
    is a different program wearing a trusted name. Submit the hash for reputation checking: a hash that does
    not correspond to the Microsoft binary for this build, or that has no reputation at all, changes what the
    rest of the investigation is looking for. Read this alongside the Image path, since the name and the
    location are the two things this technique borrows.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: When and how was a file named svchost.exe written to this host, and which process wrote it?
  context: >-
    On a clean host the only writers of svchost.exe are Windows servicing components, which place it under
    System32 and under the component store during updates. A write to any other directory, or a write by a
    browser, archiver, script host, or remote administration tool, identifies the delivery step and its
    timing. The 30-day window is the correlation window between file creation and execution, and it covers
    installs and replacements that predate the alert by weeks. If the only results are servicing writes to
    System32, the alerting binary is the shipped one and the parent process becomes the whole question.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What child processes did svchost.exe spawn on this host in the hours after the alert?
  context: >-
    A service-hosting svchost.exe spawns very little: occasional Microsoft maintenance binaries, and for some
    service groups the update or defragmentation components. Command interpreters, script hosts, archivers, or
    network tools appearing as children point at the process hosting something other than a Windows service.
    This query matches on the svchost.exe path, so it returns children of every svchost instance on the host
    during the window; check the parent chain of anything unexpected before treating it as related to the
    alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process launched svchost.exe, how was that parent itself started, and what was its command line?
  context: >-
    The rule fires precisely because the parent is outside the known launcher set, so the parent is the centre
    of the investigation. This lookup returns the parent's own creation event: its full path, its command
    line, and the grandparent that started it. A parent that is itself unsigned, living in a user-writable
    directory, or started by a script host or an Office application moves the investigation further up the
    chain. If ParentProcessGuid is not populated on the alert, pivot on the parent name and the alert
    timestamp instead. The window is long by design, since long-running services and shells can start days
    before the child they spawn.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Are there svchost.exe executions on this host running from outside the canonical Windows system directories?
  context: >-
    The binary shipped with Windows only ever executes from C:\Windows\System32, C:\Windows\SysWOW64, or the
    component store under C:\Windows\WinSxS. This query lists svchost.exe executions on the host over 30 days
    with those three directories excluded, so any row is a copy of the name placed somewhere else: a temp
    directory, a user profile, an application folder. Zero rows mean the location dimension is clean and the
    parent process is the remaining anomaly.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \svchost.exe
      filter_canonical_dirs:
        Image|contains:
          - \Windows\System32\
          - \Windows\SysWOW64\
          - \Windows\WinSxS\
      condition: selection and not filter_canonical_dirs
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - asset_inventory
- question: Does this host normally run the parent binary that launched svchost.exe, and from what path?
  context: >-
    svchost.exe itself runs continuously on every Windows host, so its own frequency carries no information;
    the parent binary is the variable. This 90-day aggregation shows whether the launching binary is a fixture
    on the host, which paths it usually runs from, and which accounts run it. A parent seen for the first time
    around the alert, or one whose usual path differs from the alerting one, is the deviation worth pursuing.
    The 30-day novelty window commonly used to call a process new sits well inside this range, so treat
    anything with no activity before the last month as recently introduced.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, which parents and accounts drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection and filters scoped to this host, so the parent and user
    distribution reflects how this specific firing pattern has run here over two weeks rather than generic
    svchost activity. A parent that already accounts for a steady count is local software that starts a
    service host directly and is a filter candidate for the rule. A parent, or an account, that appears only
    with this alert is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_generic:
        ParentImage|endswith:
        - \Mrt.exe
        - \MsMpEng.exe
        - \ngen.exe
        - \rpcnet.exe
        - \services.exe
        - \TiWorker.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - '-'
        - ''
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection and filters scoped to the alerting account, aggregated by host over
    90 days. An account with a long history of launching svchost.exe outside the normal launchers is usually
    tied to installed software or a service context; an account that has never done so before is worth
    weighing against its role and normal toolset. If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK
    SERVICE, or a computer account, this count describes machine activity rather than a person, and the
    launch-mechanism history is the meaningful pivot instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_generic:
        ParentImage|endswith:
        - \Mrt.exe
        - \MsMpEng.exe
        - \ngen.exe
        - \rpcnet.exe
        - \services.exe
        - \TiWorker.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - '-'
        - ''
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new to this activity?
  context: >-
    When the alert fires under a service principal, user identity attributes nothing and the launch mechanism
    is the meaningful pivot. The query mirrors the rule's selection and filters scoped to the alerting parent
    name, aggregated by host over 90 days. A parent that already accounts for thousands of prior events across
    many hosts is vendor or operating-system software that starts a service host directly. A parent that is
    new to this pattern, or whose history is concentrated on the alerting host alone, is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_generic:
        ParentImage|endswith:
        - \Mrt.exe
        - \MsMpEng.exe
        - \ngen.exe
        - \rpcnet.exe
        - \services.exe
        - \TiWorker.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - '-'
        - ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment in the hour around the alert?
  context: >-
    Tracking the account's process activity across every host shows whether the same identity was active
    elsewhere in the same window, which separates a host-local event from activity spanning endpoints. If the
    alert fired under SYSTEM or another service principal, this returns the constant background of
    machine-owned processes on every host the account touches and should be read as telemetry noise rather
    than a finding; the parent-scoped fleet view is the answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection and filters scoped to the alerting parent name, fleet-wide, in the
    alert window. Several hosts in the same hour points at scheduled or pushed software launching svchost.exe
    directly across the estate, which is a tuning conversation rather than an incident. A single host points
    at a host-local trigger and keeps the investigation local.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_generic:
        ParentImage|endswith:
        - \Mrt.exe
        - \MsMpEng.exe
        - \ngen.exe
        - \rpcnet.exe
        - \services.exe
        - \TiWorker.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - '-'
        - ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process launch on the host in the surrounding half hour by binary and parent collapses
    routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look
    for the steps that would surround a direct svchost.exe launch: an installer or script host running just
    before, a service being configured, an archive being expanded, or a file being written to a user-writable
    path.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection and filters with no host scope, so the result counts this specific
    firing pattern across the fleet over a week rather than generic svchost usage. A wide, even distribution
    across many hosts points at installed software that launches a service host directly and is a filter
    candidate for the rule. One host, or a small unrelated set, keeps the finding local and raises its weight.
    Read the host distribution together with the parent consistency to calibrate how far to take this.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
      filter_main_generic:
        ParentImage|endswith:
        - \Mrt.exe
        - \MsMpEng.exe
        - \ngen.exe
        - \rpcnet.exe
        - \services.exe
        - \TiWorker.exe
      filter_main_parent_null:
        ParentImage: null
      filter_main_parent_empty:
        ParentImage:
        - '-'
        - ''
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host frame what preceded a direct svchost.exe launch: a script host
    executing, a service being installed, a binary dropped to a user-writable path, or defense settings being
    changed. Read the alert sequence for a delivery step followed by execution. An empty result does not clear
    the host; it narrows the timeline to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
