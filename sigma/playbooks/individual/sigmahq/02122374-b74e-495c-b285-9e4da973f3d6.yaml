name: DMSA Service Account Created in Specific OUs - PowerShell
id: 17707d23-1531-4f80-ae34-bb6e978eb889
description: |
  Fires when PowerShell script-block content (EID 4104) contains New-ADServiceAccount together with
  -CreateDelegatedServiceAccount and -path, creating a delegated Managed Service Account (dMSA) in an explicitly chosen
  OU. dMSAs exist only in Windows Server 2025 domains, and creating one in an arbitrary OU is the setup step for the
  BadSuccessor privilege-escalation technique, in which the new account is linked to an existing account as its
  migration successor and inherits that account's privileges from the KDC. Legitimate dMSA creation is rare,
  change-managed identity-administration work; the investigation should establish who ran the cmdlet and from where,
  whether they were authorized, which OU and account names were involved, whether a migration link to an existing
  account was set, and whether the new account was subsequently used to authenticate (T1098 / T1078.002). Note that
  script-block capture is policy-gated per host — on default installs only content matching Microsoft's built-in
  suspicious-strings checks is logged, so absence of surrounding 4104 evidence is not absence of activity.
type: detection
detection_id: 02122374-b74e-495c-b285-9e4da973f3d6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block call New-ADServiceAccount with -CreateDelegatedServiceAccount and a -path argument?
  context: Confirm the alert is a true positive by reading the complete script. The rule fires when a script block contains
    all three of New-ADServiceAccount, -CreateDelegatedServiceAccount, and -path — a delegated Managed Service Account being
    created in an explicitly chosen OU. Long scripts are split across multiple 4104 events, so this retrieves every chunk
    of the alerting block (sequence/total order) and the match is judged on the whole script, not the alerting fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
- question: Is this user expected to create managed service accounts in Active Directory?
  context: dMSA creation is a directory-administration action normally performed by a small set of identity or platform
    administrators from designated admin hosts. The query shows the alerting block's host, user, and on-disk script path
    (blank for interactive or in-memory execution). An account outside that administrative group, or a host that is not an
    admin workstation or management server, moves the alert toward the abuse pattern this rule anticipates. Also weigh
    whether the acting account is sensitive in its own right — the technique's value is escalation, so the acting account
    is often a lower-privilege one that merely holds create-child rights on some OU.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
- question: Which parent process launched the PowerShell host that ran this script?
  context: Script-block events carry no process identity, so this pivots by host and user over the preceding day to list
    the user's PowerShell launches with their parents. An interactive admin console typically descends from explorer.exe,
    a terminal, or a remote-administration client; a PowerShell host descending from an Office application, a browser, a
    web or database server process, or an unexpected service points to a delivery or lateral-movement step that should be
    chased before trusting the admin-activity explanation.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - ParentImage
    - ParentCommandLine
- question: Did this rule fire on other hosts in the last day?
  context: The same dMSA-creation pattern appearing on several hosts in a short window suggests either an authorized
    migration or deployment activity touching multiple systems, or an actor repeating the technique from more than one
    foothold. Aggregating this rule's alerts by host and user shows the spread and whether a single account is behind all
    of them.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the domain controllers in this environment exposed to dMSA migration abuse?
  context: Delegated Managed Service Accounts exist only when at least one domain controller runs Windows Server 2025, and
    the escalation this rule anticipates additionally depends on create-child permission being available on some OU. Check
    with the identity team whether 2025-level domain controllers are present, whether available patches or hardening for
    dMSA migration abuse have been applied, and how broadly OU create-child rights are delegated. The query lists the
    user's PowerShell launches as an execution-context starting point; the substantive answer comes from asset inventory
    and the directory team.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - ParentImage
- question: Was there a change ticket or documented approval for creating this service account?
  context: Creating a service account — particularly a delegated Managed Service Account tied to a specific OU — is the
    kind of change most organizations ticket. A matching ticket or maintenance window closes the alert quickly. Creation
    with no corresponding record when policy requires one, or landing outside business hours and outside any maintenance
    window, supports the unauthorized-manipulation reading; abnormal timing for the acting account matters as much as the
    missing paperwork.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - CommandLine
- question: What does the full script do, and which account name and target OU were passed to New-ADServiceAccount?
  context: Script-block content is logged after decoding, so any -EncodedCommand wrapper is already unwrapped; only
    string-level obfuscation inside the script (concatenation, format operators, backticks) still needs manual work. Read
    the complete reassembled script for the dMSA name, the -path OU value (which reveals where the actor holds create-child
    rights), and any accompanying attribute settings — in particular a migration link tying the new dMSA to an existing
    account (msDS-ManagedAccountPrecededByLink), the step that lets the dMSA inherit that account's privileges. Any account
    referenced by such a link is the escalation target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
- question: What directory account-management events did this user generate around the alert?
  context: The script content shows what was attempted; the Security log on the domain controllers records what actually
    changed. Look for creation of the service-account object and related attribute writes by this account near the alert
    time, and for additions to privileged groups such as Domain Admins or Enterprise Admins (4728/4732/4756). An account
    change landing within minutes of the script block, or a mismatch between the acting account and the object being
    manipulated, is the coupling this technique's detection strategy keys on. If the new dMSA later authenticates, review
    those logons' types and source hosts as well.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4741
          - 4742
          - 5137
          - 4738
          - 4670
          - 4728
          - 4732
          - 4756
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - EventID
      - TargetUserName
- question: Which domain controllers did this host contact over directory and Kerberos ports around the alert?
  context: New-ADServiceAccount performs its writes over LDAP to a domain controller, and any subsequent use of the new
    account produces Kerberos traffic — ticket requests on port 88, password and key operations on 464. Aggregating this
    host's connections on directory-service ports shows which domain controller processed the change and whether directory
    and authentication traffic continued after the creation, the follow-through that separates staged escalation from a
    one-off administrative command. Endpoint-recorded connections carry the owning process; network-sensor records of the
    same traffic may not.
  range: +/-2h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 88
          - 389
          - 464
          - 636
          - 3268
          - 3269
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Did this user's PowerShell session spawn follow-on processes after the script ran?
  context: A 4104 event records script content, not outcome, and carries no process link — this pivots by host, user, and
    time to the children of the user's PowerShell hosts in the half hour after the block was logged. Tooling launched to
    authenticate as the new account, request tickets, or move laterally appears here. If the alert fired under SYSTEM or
    another service principal, the user anchor is broad; read the results with that in mind rather than dropping it.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Actors commonly weaken controls before running meaningful PowerShell — execution-policy bypass flags, AMSI
    tampering (AmsiUtils, amsiInitFailed), Defender preference changes, or downgrading to PowerShell v2 to avoid
    script-block logging. Any of these on the same host in the hour before the alert makes the routine-administration
    explanation harder to sustain and should be folded into the timeline.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other PowerShell script activity occurred on this host around the alert?
  context: Attacker PowerShell rarely runs as a single block — reconnaissance, the account creation, attribute changes, and
    follow-on tooling produce a cluster of script blocks in a short window, and surrounding blocks from the same session
    often contain the linked-account and OU details the alerting fragment lacks. The log.level column shows whether the
    host logs all blocks (verbose) or only automatically flagged content (warning) — on a warning-only host this view is
    partial by design, and absence of surrounding blocks is not evidence nothing else ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — credential access, reconnaissance, defense tampering — may reveal how the
    actor reached a position from which they could run directory cmdlets at all. The preceding alert timeline helps
    reconstruct the sequence that led to the account creation rather than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is full script-block logging enabled on this host, or only suspicious-content logging?
  context: PowerShell logs every script block at verbose level only when the Script Block Logging policy is enabled; by
    default it logs only content matching Microsoft's built-in suspicious-strings checks, at warning level. On a
    warning-only host the alerting block is a fragment of the host's PowerShell activity, and the absence of other 4104
    evidence says little. Use the level distribution here to calibrate how complete every other script-channel result in
    this investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
- always_include: true
  question: Has this user produced this dMSA-creation pattern before, and does that history fit their role?
  context: The query mirrors the rule's own selection scoped to this user — a 90-day history of this specific pattern
    aggregated by host, not generic PowerShell use. An identity administrator who has run staged service-account
    migrations before reads differently from an account producing this pattern for the first time; weigh the count
    against the user's role. History covers only hosts logging the PowerShell channel, and non-flagged content appears
    only where full script-block logging is enabled, so zero history is weaker evidence on a default-logging fleet.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Which hosts have produced this dMSA-creation pattern in the last 90 days, and is the alerting host among them?
  context: When the alert fires under a service principal, user identity does not attribute the behavior, and script-block
    events carry no process identity to pivot on — the pattern itself is the pivot. This mirrors the rule's selection
    fleet-wide over 90 days, aggregated by host. A pattern that appears routinely across many hosts suggests migration or
    deployment automation; one that has never appeared before, or only on this host, is the deviation worth chasing. Only
    hosts shipping the PowerShell channel (and, for non-flagged content, with full logging enabled) can appear, so absence
    elsewhere is weak evidence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      condition: selection
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: The same account acting on several hosts in the alert window widens the scope — directory manipulation from one
    host paired with logons or tooling on others is how use of a freshly gained position looks. Hosts this account does
    not normally touch matter as much as the commands run there. If the alert fired under SYSTEM or another service
    principal, this view degrades to agent-telemetry noise; the fleet-wide pattern question is the meaningful substitute
    in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same dMSA-creation pattern fire on other hosts in the same window?
  context: The query mirrors the rule's selection fleet-wide in the alert window, aggregated by host — the
    service-principal-safe version of the cross-network view, since these events carry no process identity to pivot on.
    Several hosts producing the pattern in the same window points to pushed or scheduled automation; a single host points
    to a host-local action. Coverage is policy-gated per host, so absence elsewhere remains weak evidence on a
    default-logging fleet.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      condition: selection
    fields:
    - host.name
