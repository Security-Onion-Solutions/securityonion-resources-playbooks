name: HackTool - Wmiexec Default Powershell Command
id: 477842e2-acd4-45ee-b2bf-4649779a287a
description: |
  Detects PowerShell launched with the exact flag sequence (-NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc) hard-coded into the wmiexec remote-execution script, which runs commands on a target over WMI and returns output without dropping a persistent service. This flag combination suppresses the profile, logo, and interactive prompts, hides the window, bypasses execution policy, and passes a base64-encoded payload — a pattern that is rare in legitimate automation and characteristic of an operator running commands on a remote host. Investigation should decode the encoded payload, confirm whether the host received an inbound remote-execution connection, and determine which source host or account drove the activity.
type: detection
detection_id: 022eaba8-f0bf-4dd9-9217-4604b0bb3bb0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting command line contain the full -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc flag sequence?
  context: Confirm the alert is a true positive by reviewing the exact command line against the rule's detection criteria. The rule fires on the literal flag string used by the wmiexec script; verify the alerting event carries that whole sequence and note the base64 blob that follows -Enc for decoding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run PowerShell with hidden-window, encoded-payload flags?
  context: Legitimate administrative automation rarely launches PowerShell with this exact suppression-and-encode flag set. Knowing whether the user role and host function involve remote command execution or scripted administration is often the fastest way to separate a sanctioned tool from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this wmiexec-style execution part of an authorized penetration test or red team engagement?
  context: The wmiexec script is part of an offensive tooling collection used in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the base64 payload passed to -Enc decode to?
  context: The -Enc (-EncodedCommand) flag carries a base64-encoded script that hides the actual operation. Decode it to reveal the payload — a download cradle, a reverse shell, in-memory loading of a .NET assembly, or the command the operator wanted to run on this host. The decoded content is the ground truth for what the remote execution accomplished.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What command or capability did the decoded payload invoke on this host?
  context: Remote-execution tooling is a delivery mechanism — the decoded payload reveals what was actually run, whether reconnaissance, credential access, file transfer, or further code execution. Identifying the invoked capability determines the scope of potential compromise and the required response actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated content this command executed?
  context: Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, even when the command line is base64-encoded as it is here. This provides ground truth that bypasses the -Enc obfuscation. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls disabled or weakened on this host before the execution?
  context: Operators often disable or bypass protection before running an encoded payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes, and PowerShell downgrade attacks to v2 which lacks logging. Finding these earlier on the host strengthens the case for malicious activity and identifies what visibility may already be degraded.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: When this host has previously matched the wmiexec flag sequence, what parents and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent/user distribution reflects how this specific flag sequence has historically run here — not generic PowerShell usage. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. Wmiexec runs commands on remote targets, so if the same account drove similar activity on other hosts in this window, the scope of compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did this host receive an inbound remote-execution connection around the time of the alert, and from where?
  context: Wmiexec requires a source and a destination — the encoded PowerShell runs on the target while an operator drives it remotely. Inbound connections on WMI/DCOM and SMB ports identify the originating host, revealing whether the connection came from a known admin jump box, a compromised workstation, or an unexpected source used as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host after the encoded PowerShell ran?
  context: Lateral movement is a means to an end — operators run commands on the target to deploy tools, access data, or move further. Examining processes spawned shortly after the encoded execution reveals the objectives carried out on this host, including any children launched by the PowerShell process itself.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Have other hosts matched the wmiexec flag sequence in the past week, and does the spread look like automation or operator activity?
  context: The query mirrors the rule's selection with no host scope, returning a fleet-wide count of this specific flag sequence rather than generic PowerShell usage. Many hosts matching the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoP -NoL -sta -NonI -W Hidden -Exec Bypass -Enc
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded remote execution and help reconstruct the full timeline leading to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
