name: BloodHound Collection Files
id: b6c84864-f405-4da0-bf69-880d3731b2e3
description: |
  Detects the default output file names produced by the BloodHound collection tool SharpHound. The rule fires when a file
  whose name ends in BloodHound.zip, _computers.json, _containers.json, _gpos.json, _groups.json, _ous.json, or _users.json
  is written, and the write is not svchost.exe producing pocket_containers.json under the Microsoft Store application
  directory. Each JSON output carries one Active Directory object class and the zip bundles them, so the file set on disk
  names how much of the directory was read; the same tooling appears in authorized assessments, in Active Directory hygiene
  reviews, and in post-compromise enumeration that precedes privilege escalation or lateral movement. The investigation
  should establish which program wrote the files and how it was launched, which collection method it used and which domain
  it targeted, whether the run maps to an approved engagement, and what happened to the output afterward.
type: detection
detection_id: 02773bed-83bf-469f-b7ff-e676e7d78bab
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Do the written file name and the process that created it match what this rule detects?
  context: >-
    The rule matches a file whose name ends in BloodHound.zip, _computers.json, _containers.json, _gpos.json, _groups.json,
    _ous.json, or _users.json, and excludes svchost.exe writing pocket_containers.json under the Microsoft Store application
    directory. Confirm the full path, the operation performed, and the responsible process; read the signer columns for
    whether the writing program is coherent with a directory-collection output landing at that path, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this collection run part of an authorized penetration test, red team engagement, or Active Directory review?
  context: >-
    BloodHound collectors are standard components of authorized assessments and of internal directory hygiene work, and the
    output file names are identical whoever runs them. An approved engagement whose scope covers this host and this window,
    with matching tooling and timing, resolves the alert without further analysis. Confirm against change records or with
    the assessment team rather than from the event alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to run Active Directory collection tooling?
  context: >-
    Directory enumeration at this breadth is normally performed by identity administrators, security engineers, or assessment
    staff from a management workstation, and rarely from a general user endpoint. Read the host, the account, and the writing
    program together: an account with no directory-administration role, or a host with no management function, moves the
    activity away from routine operations. When the account is a machine or service principal, judge by the writing program
    and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What collection method was invoked, and how much of the directory did it cover?
  context: >-
    Collectors are parameterised, and the arguments decide the scope of the result. Collection method selections such as All,
    DCOnly, Session, LoggedOn, ACL, Trusts, Container, and GPOLocalGroup determine which object classes and which relationship
    edges were gathered; a named domain or LDAP server shows what was targeted; an output directory or zip name shows where
    the result was staged; throttle and jitter settings show a run deliberately paced to stay under query-rate thresholds.
    PowerShell-hosted collection carries the same options through cmdlet parameters, and encoded or obfuscated arguments
    (-enc, -EncodedCommand, -nop) mean the readable form has to be recovered before the method can be identified. Read the
    writing process's full command line and name the exact method and target domain, since that determines what directory
    information the operator now holds.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is this a genuine collection output file, and which directory objects does its content cover?
  context: >-
    The rule matches on file name alone, so confirm the file is what the name implies before treating it as collection output.
    Each JSON output carries one object class — _users.json, _groups.json, _computers.json, _ous.json, _gpos.json, and
    _containers.json — and BloodHound.zip bundles them. Retrieve the file from the endpoint and read its size, JSON structure,
    the domain named inside, and the object counts; that establishes how much of the directory was actually read and separates
    real output from an unrelated file with a colliding name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
- question: What is the hash of the program that wrote these files, and does it have known threat intel detections?
  context: >-
    File-write events carry no hash; the hash is recorded when the program executes. This retrieves executions of the writing
    program on this host along with any command line that names the output file, so the hash can be submitted to a reputation
    service or internal threat intel and compared against known collector builds. If the collection ran inside an interpreter
    hosting a script, the hash returned belongs to the interpreter rather than to the collection code — in that case retrieve
    the script from its on-disk path and hash it separately.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%Image%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the writing process and its children create around the alert?
  context: >-
    A collection run produces a set of files rather than one: the JSON outputs are written together and then bundled into a
    zip. The full set of paths names which object classes were enumerated, and the staging location changes the next step —
    output under a user profile fits local work, output in a temp directory fits a transient run, and output on a network
    share or removable volume points at movement off the host.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Is the collection output still on disk, or was it deleted or renamed after the alert?
  context: >-
    Output still on disk can be retrieved and read, which settles exactly what was enumerated. Deletion or rename shortly
    after creation is the cleanup pattern for a run whose output has already been moved off the host, and it redirects the
    investigation to what read, archived, or transmitted the file in the interval. Read EventType to tell creation,
    modification, rename, and deletion apart.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process launched the program that wrote the collection files, and is that a normal launch pattern?
  context: >-
    A collector started from an interactive shell under explorer.exe fits an administrator or a tester working at the console.
    Parents such as winword.exe or excel.exe point at macro-driven execution; wscript.exe, cscript.exe, or mshta.exe point at
    a script dropper; wmiprvse.exe and wsmprovhost.exe point at remote execution over WMI or WinRM. The parent command line
    also shows how far back the chain reaches and whether the collection was one step in a scripted sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Which .NET and directory-service libraries were loaded on this host around the collection, and by which process?
  context: >-
    Collection code reads the directory in-process over LDAP and the domain trust APIs rather than by shelling out, so the
    libraries a process loads describe the capability it pulled in. System.Management.Automation.dll loaded by a process that
    is not powershell.exe indicates PowerShell hosted inside another program; clr.dll and clrjit.dll indicate a .NET assembly
    being executed, including assemblies loaded straight into memory; wldap32.dll and the System.DirectoryServices libraries
    indicate directory queries; netapi32.dll, logoncli.dll, and dsrole.dll back the trust-enumeration calls such as
    DSEnumerateDomainTrusts, which are low-prevalence outside domain tooling. amsi.dll absent from a script-hosting process is
    itself worth noting. Read the loading Image alongside the signer columns; system processes load several of these routinely,
    so the signal is an unexpected program holding the set.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.DirectoryServices.dll'
          - '\System.DirectoryServices.Protocols.dll'
          - '\System.DirectoryServices.AccountManagement.dll'
          - '\clr.dll'
          - '\clrjit.dll'
          - '\amsi.dll'
          - '\netapi32.dll'
          - '\logoncli.dll'
          - '\dsrole.dll'
          - '\wldap32.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - image_load
- question: Did PowerShell script block logging capture a collection script running on this host?
  context: >-
    Collection is frequently driven from PowerShell rather than from a standalone binary, and Event ID 4104 records the
    deobfuscated script content that actually executed — the cmdlet name, its collection-method arguments, and the target
    domain — even when the command line was encoded. Short single-cmdlet invocations produce little content, while a bundled
    collection script produces long script blocks split across several events that have to be reassembled in order. If
    PowerShell operational logs are not ingested in this environment, treat an empty result as a visibility gap rather than
    evidence no script ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - manual_review
- question: Did domain controllers log directory-service access or account-enumeration events for this account around the
    collection?
  context: >-
    The enumeration behind these files runs as LDAP and SAMR queries against domain controllers under the collecting account's
    identity, so the reads are recorded on the controllers rather than on the host that wrote the output. Event ID 4662 records
    directory service object access with the object and the properties read, and 4798 and 4799 record local account and group
    membership enumeration. A burst of these events for one account across one or more controllers corroborates that a full
    directory sweep occurred and shows which naming contexts were touched. These events depend on object-level audit settings
    being configured on the controllers; if they are not, or the security channel is not collected, an empty result is a
    visibility gap rather than evidence the enumeration did not happen. When the alert fires under a machine or service
    account, this pivot attributes nothing and should be read together with the acting-program history instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID:
          - 4662
          - 4798
          - 4799
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - ObjectDN
  answer_sources:
  - active_directory
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    The collector performs its enumeration inside its own process over LDAP, so it leaves no net.exe or nltest.exe trail of
    its own. Native discovery binaries in the same window are therefore separate operator activity running alongside the
    collection — three or more distinct recon binaries within 15 minutes fits hands-on enumeration rather than troubleshooting.
    Group and account discovery is commonly correlated with follow-on activity over a 5 to 10 minute window, so read the
    ordering and the acting account, not just the count. PowerShell directory cmdlets such as Get-ADUser, Get-ADComputer,
    Get-ADGroupMember, Get-DomainUser, and [ADSISearcher] queries express the same enumeration without any of these binaries
    and appear in command-line text instead.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is the account's 90-day history of writing
    these collection file names, aggregated by host. An account that has never produced this pattern is a stronger deviation
    than one that produces it on a schedule; weigh the count against the account's directory-administration role and its
    normal toolset. Recurring hits across several hosts fit an assessment cadence or a hygiene job and are worth confirming
    against change records.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - BloodHound.zip
        - _computers.json
        - _containers.json
        - _gpos.json
        - _groups.json
        - _ous.json
        - _users.json
      filter_optional_ms_winapps:
        Image|endswith: \svchost.exe
        TargetFilename|startswith: C:\Program Files\WindowsApps\Microsoft.
        TargetFilename|endswith: \pocket_containers.json
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically written these collection files on this host or across the environment, or is it new
    for this activity?
  context: >-
    When the alert fires under a machine or service principal, account identity attributes nothing, and a file event carries
    no parent to pivot on. The acting program is the meaningful pivot: the query mirrors the rule's selection scoped to the
    alerting program, so the result is that program's 90-day history of producing these file names, aggregated by host. A
    program that is new or rare for this activity is the deviation worth chasing; one that already accounts for a long run of
    prior events is a deployed collection or hygiene job.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - BloodHound.zip
        - _computers.json
        - _containers.json
        - _gpos.json
        - _groups.json
        - _ous.json
        - _users.json
      filter_optional_ms_winapps:
        Image|endswith: \svchost.exe
        TargetFilename|startswith: C:\Program Files\WindowsApps\Microsoft.
        TargetFilename|endswith: \pocket_containers.json
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this account do across the network around this time?
  context: >-
    Directory collection is a staging step, and the account that ran it usually leaves other traces in the same window.
    Tracking the account's process activity across every host shows whether the collection was a single local action or one
    point in a sequence touching several endpoints, which bounds how far the activity reached. When the alert fires under
    SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this returns routine service telemetry from every host and
    the acting-program pivots carry the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program write these collection files on other hosts in the same window, or is the activity isolated
    to this host?
  context: >-
    Under a service principal, asking what the account did across the network returns routine service telemetry from every
    host, and a file event carries no parent to pivot on. The query mirrors the rule's selection scoped to the alerting
    program, fleet-wide, in the alert window. Several hosts producing the pattern at once fits a scheduled or pushed
    collection job; a single host fits a locally triggered run and narrows the investigation to who or what started it there.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - BloodHound.zip
        - _computers.json
        - _containers.json
        - _gpos.json
        - _groups.json
        - _ous.json
        - _users.json
      filter_optional_ms_winapps:
        Image|endswith: \svchost.exe
        TargetFilename|startswith: C:\Program Files\WindowsApps\Microsoft.
        TargetFilename|endswith: \pocket_containers.json
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Directory enumeration usually sits in the middle of a sequence rather than at its start. Earlier detections on the same
    host — initial execution, defense tampering, or credential access — reveal how the operator arrived and what capability
    they already hold; the absence of any earlier detection points the timeline toward a locally initiated run or toward a
    gap in coverage. Read the ordering and severity together to reconstruct the stages that preceded the collection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
