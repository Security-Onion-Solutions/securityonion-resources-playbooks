name: Potential SNAKE Malware Installation CLI Arguments Indicator
id: 3fac3944-d949-41f7-b3b6-0a354bb69e06
description: |
  Detects a process launched with a command line containing a 64-character hexadecimal token followed by a
  16-character hexadecimal token, separated by whitespace. This argument sequence has been observed during
  SNAKE malware installation, where the installer receives a key and an identifier as positional arguments
  rather than named flags. The rule constrains no binary and no parent, so any executable carrying this
  argument pattern fires it: legitimate matches are possible where an application passes a SHA-256 digest
  and a GUID-like or session identifier on the command line (build tooling, package managers, backup and
  imaging agents). The investigation should determine which binary received the tokens, where that binary
  came from, whether the invocation fits an established pattern for this host and user, and whether a driver
  load, service installation, or outbound connection followed it.
type: detection
detection_id: 02cbc035-b390-49fe-a9ff-3bb402c826db
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line contain a 64-character hex token followed by a 16-character hex token?
  context: The rule matches on that two-token sequence alone, with no constraint on the binary or its parent.
    Read the full command line and confirm both tokens are present and hexadecimal, and note what the surrounding
    arguments say about the program's purpose.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run a program that takes a hex key and identifier as positional
    arguments?
  context: Build agents, package managers, imaging tools, and backup clients legitimately pass digests and
    session identifiers on the command line. Knowing whether the host's function and the user's role involve
    that class of tooling is often the fastest way to separate routine operations from an installer that
    arrived from elsewhere.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which binary received the two hex tokens, and what do the remaining arguments say the program
    was asked to do?
  context: The 64-character token is the length of a SHA-256 digest or a 256-bit key; the 16-character token
    is the length of a 64-bit identifier or handle. Determine which of the two readings fits by examining
    the binary's path, its working directory, and the other arguments. During SNAKE installation the tokens
    are passed to a dropped installer that decrypts and stages a kernel component, so a token pair handed
    to an unfamiliar executable in a user-writable or temporary directory is worth resolving before anything
    else. The query scopes to every command line on this host matching the rule's token sequence within the
    alert window, which surfaces sequential invocations that form one logical operation.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned the alerting program, and is that parent chain expected for it?
  context: The parent reveals how the program was invoked. A parent such as explorer.exe or a terminal points
    to hands-on-keyboard execution; services.exe or a scheduler points to automation; mshta.exe, wscript.exe,
    a browser, or an Office application points to delivery through a document or download. The parent lookup
    is unique per process instance, so the long window is intentional — interactive shells and services often
    start hours or days before the alert.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the alerting binary written to disk recently, and which process wrote it?
  context: The rule places no constraint on the executable, so the binary's origin carries most of the triage
    weight. An executable written minutes or hours before it ran, especially by a browser, an archive utility,
    a script host, or a remote-management agent, points to a delivered payload rather than installed software.
    File writes carry no hash, so use the writing process and timing here and pivot to the execution event
    for hash and signature data.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: What child processes did the alerting binary spawn afterward?
  context: The children reveal what the program actually did after receiving the tokens. Installers that
    stage further components commonly spawn cmd.exe, powershell.exe, sc.exe, or rundll32.exe to register
    a service, load a driver, or clean up dropped files. An absence of children with a short process lifetime
    is also informative — it suggests the work happened in-process.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did any driver load on this host in the hours after the alert, and is that driver signed by an
    expected vendor?
  context: SNAKE installation stages a kernel component that is loaded after the user-mode installer runs,
    so a driver load following this alert connects the argument pattern to the outcome it precedes. Review
    each load for an unfamiliar signer, a revoked or unsigned status, or a driver path outside the standard
    system driver directory. Hosts that do not ship driver load telemetry return nothing here, which is a
    visibility gap rather than evidence no driver loaded.
  range: +4h
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: Did the alerting process open outbound network connections, and to what destinations?
  context: An installer that receives a key and an identifier frequently uses them to register with or retrieve
    payloads from a remote endpoint. Connections to a raw IP address with no preceding name resolution, to
    a high or non-standard port, or to a destination outside the ranges this host normally reaches are the
    ones to resolve. No connections from the process narrows the question to what the tokens configured locally.
  range: +4h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other activity occurred on this host around the time of the alert?
  context: Activity surrounding the alert supplies the immediate context — what led to the execution and
    what followed it. Scan for reconnaissance, credential access, service or task creation, and archive or
    transfer utilities. Repetitive agent telemetry collapses into single high-count rows, so novel parent-child
    pairs stand out at low counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this host run the alerting binary before, and how often?
  context: Because the rule constrains only the command line, the executable itself may be unremarkable software
    or a first-time arrival. Zero or very low historical counts point to a binary that was introduced for
    this execution; a long, steady history under the same users points to installed tooling whose argument
    convention happens to match the rule.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously produced the rule's token pattern, what parents and users drove
    that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific argument pattern has historically run here rather than generic binary usage.
    A recurring parent and service account point to established tooling; a new parent, an unexpected user
    account, or no prior history at all is the deviation worth chasing.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced the rule's token pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving their 90-day history of this
    argument pattern aggregated by host. A user with no prior history of it deserves more scrutiny than one
    who produces it regularly; weigh the count against the user's role and the tooling they are expected
    to run.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven the rule's token pattern, or is the parent new for
    this activity?
  context: 'When the alert fires under SYSTEM, a service account, or a computer account, user identity does
    not attribute the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule''s
    selection scoped to the alerting parent process, giving the 90-day history of this parent driving this
    pattern. A parent that already accounts for thousands of prior events is vendor or operating-system automation;
    a new or rare parent for this pattern is the deviation to chase.'
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the execution was isolated or part
    of movement between endpoints. The same account driving comparable activity on several hosts widens the
    scope of the investigation. When the alert fires under a service principal this view returns routine agent
    telemetry, and the parent-driven view is the one that answers the question.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven token pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, within
    the alert window. Multiple hosts in the same hour points to scheduled or pushed automation carrying the
    same argument convention; a single host points to a host-local trigger and keeps the investigation focused
    on how the binary arrived here.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host help reconstruct what preceded the execution — a download
    or archive extraction, defense tampering, credential access, or remote-management activity. The order
    of the alerts often identifies the delivery step that put the binary on the host.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts produced the rule's token pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this argument
    pattern rather than generic usage of any one binary. Many hosts producing it points to scripted deployment
    or vendor automation whose argument convention collides with the rule; one host or a small unrelated set
    points to activity introduced from outside normal software distribution.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|re: \s[a-fA-F0-9]{64}\s[a-fA-F0-9]{16}
      condition: selection
    fields:
    - host.name
