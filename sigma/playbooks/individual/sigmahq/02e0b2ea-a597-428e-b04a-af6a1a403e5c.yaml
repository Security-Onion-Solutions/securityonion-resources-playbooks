name: Exploiting CVE-2019-1388
id: 23376493-4631-42c4-8894-ad248971de85
description: |
  Detects consent.exe (the UAC elevation dialog host) spawning iexplore.exe with an http URL on the command line, where the
  child runs at System integrity or under a SYSTEM-family account. All three child conditions and the elevated-rights
  condition must hold together for the rule to fire. CVE-2019-1388 is an elevation-of-privilege flaw in the Windows
  certificate dialog: the "Issued by" field of a signed binary's certificate is rendered as a clickable hyperlink even on the
  secure desktop, and because the consent dialog runs as SYSTEM, following that hyperlink opens a browser in the SYSTEM
  context, from which a file dialog can be used to launch an interactive SYSTEM shell. The investigation should determine
  which binary requested elevation, what the browser did once it was running as SYSTEM, and whether any child process
  inherited the elevated token.
type: detection
detection_id: 02e0b2ea-a597-428e-b04a-af6a1a403e5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did consent.exe spawn iexplore.exe with an http URL on the command line, at System integrity or under a SYSTEM-family
    account?
  context: Confirm the alert before investing further time. All four elements must be present together — the consent.exe
    parent, the iexplore.exe child, an http URL in the command line, and either an IntegrityLevel of System (S-1-16-16384) or
    a User value containing AUTHORI/AUTORI. A browser launched by the elevation dialog itself has no routine cause; note
    whether the elevated identity came through the integrity level or the account name, since localized SYSTEM account names
    render differently.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - User
      - IntegrityLevel
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to trigger UAC elevation prompts that open a browser?
  context: Legitimate elevation prompts appear whenever a user runs an installer or an administrative tool, but the consent
    dialog does not open a browser as part of any normal flow. Knowing whether the user was actively installing or
    configuring software at the alert time, and whether the host is a workstation where interactive elevation is routine,
    narrows the question quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which binary requested the elevation prompt that produced this consent.exe instance, and what started it?
  context: consent.exe is spawned by the Application Information service on behalf of a program asking for elevation, so its
    own parent and command line identify the elevation vector. The technique requires a binary whose signing certificate
    carries the SpcSpAgencyInfo OID (1.3.6.1.4.1.311.2.1.10), which is what renders the clickable "Issued by" hyperlink in
    the dialog. Determine what the user was prompted to elevate, where that binary came from, and whether the user launched
    it deliberately.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same consent.exe instance spawn?
  context: The consent dialog normally spawns nothing at all; the elevated program is launched by the service, not by
    consent.exe. Any child besides the alerting browser — a shell, a file manager, a script host — is another process that
    inherited the dialog's SYSTEM token, and each one extends the scope of what the elevated session touched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What http URL was iexplore.exe launched with, and what does that destination represent?
  context: The URL on the command line is the certificate's embedded link, taken from the SpcSpAgencyInfo extension of the
    binary the user was prompted to elevate. Read the full host and path — a vendor support page is what the technique
    produces by design, since the attacker only needs the dialog to open any browser as SYSTEM, while an attacker-controlled
    or unresolvable destination points at a purpose-built certificate. Record the URL for reputation review rather than
    browsing to it from a production host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' http'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
  - external_threat_intel
- question: What processes did the elevated browser go on to spawn, and did they also run as SYSTEM?
  context: Opening a browser as SYSTEM is the entry point, not the objective. The technique proceeds by using a dialog inside
    the elevated browser — a Save As or file-open box — to launch an interactive process that inherits the SYSTEM token,
    typically a command interpreter or file manager. Any child here with an IntegrityLevel of System is the step that turned
    the dialog flaw into a usable session, and its own children define the blast radius. A +4h window links the alert to
    follow-on execution while the elevated browser is still open.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
      - User
  answer_sources:
  - process_creation
  - edr_console
- question: Did the Security log record special privileges assigned to a new logon on this host around the alert?
  context: Successful exploitation ends with a token holding privileges the account was never granted, and Event ID 4672
    records that assignment at logon. Compare the SubjectUserName and privilege list against what the interactive user
    normally holds, and correlate the timestamps with the elevated process tree. Service and system logons produce 4672
    routinely, so the value is in the correlation window rather than the raw count. If the Security channel is not collected
    in this environment, treat an empty result as a visibility gap rather than evidence that no privilege was assigned.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        EventID: 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - PrivilegeList
  answer_sources:
  - manual_review
  - organizational_knowledge
- question: Does this host normally run iexplore.exe at all?
  context: Internet Explorer is deprecated and on many estates never launches outside of a handful of legacy line-of-business
    workflows. A 90-day history grouped by user shows whether the browser has any routine footprint on this host; near-zero
    counts mean the alerting execution is the only reason the binary ran, which sharpens the question of what invoked it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has consent.exe ever spawned iexplore.exe on this host before?
  context: This specific parent-child pairing has no supported product behavior behind it — the elevation dialog is not a
    launcher for browsers. A 90-day count establishes whether the pairing is unprecedented on this host or whether some
    local software repeatedly produces it, which would reframe the alert as a recurring condition rather than a one-off.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this same elevated consent.exe to iexplore.exe pattern, and does that history
    fit their role?
  context: The query mirrors the rule's selection criteria scoped to this user, so the result is the user's 90-day history of
    this exact pattern rather than generic browser use, aggregated by host. A user who has never produced it before is a
    different finding than one who produces it on a schedule. Weigh the count against whether the user routinely installs
    software that prompts for elevation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        ParentImage|endswith: \consent.exe
        Image|endswith: \iexplore.exe
        CommandLine|contains: ' http'
      selection_rights:
      - IntegrityLevel:
        - System
        - S-1-16-16384
      - User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has consent.exe historically driven this pattern on this host or across the environment, or is the elevation
    dialog new to this activity?
  context: The rule fires with the child running under a SYSTEM-family identity, so the user field attributes little — the
    launch mechanism is the meaningful pivot. This query mirrors the rule's selection criteria scoped to the alerting parent
    process, giving the 90-day history of the consent dialog driving this exact pattern. A parent already accounting for a
    steady volume of prior events points at a recurring local condition; a first occurrence is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        ParentImage|endswith: \consent.exe
        Image|endswith: \iexplore.exe
        CommandLine|contains: ' http'
      selection_rights:
      - IntegrityLevel:
        - System
        - S-1-16-16384
      - User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window shows whether the elevation attempt was an
    isolated action or one step in a sequence that spans endpoints. When the alert fires under SYSTEM or a machine account
    this view fills with service telemetry and attributes nothing — in that case, read it alongside the parent-scoped
    fleet view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same consent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: Under a SYSTEM-family identity, a user-scoped network view returns agent telemetry from every host and answers
    nothing. This query mirrors the rule's selection criteria scoped to the alerting parent process, fleet-wide, inside the
    alert window. Several hosts at once points to a pushed or scheduled trigger; a single host points to a local action taken
    at the console.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        ParentImage|endswith: \consent.exe
        Image|endswith: \iexplore.exe
        CommandLine|contains: ' http'
      selection_rights:
      - IntegrityLevel:
        - System
        - S-1-16-16384
      - User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Privilege escalation sits between initial access and whatever the operator wanted the elevated token for, so the
    surrounding process activity carries the story. Aggregating by Image and ParentImage collapses routine agent telemetry
    into high-count rows and leaves novel parent-child pairs standing out at low counts — look for the download or extraction
    of the binary that prompted for elevation before the alert, and for account, service, or persistence changes after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Is this consent.exe to iexplore.exe spawning pattern occurring on other hosts?
  context: The same pairing on multiple hosts in a day suggests a common trigger — one binary distributed to several users,
    or an operator working through a set of machines — while a single occurrence points to a host-local action. Fleet-wide
    counts also calibrate how much of the estate still has an unpatched certificate dialog reachable from the secure desktop.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Escalation to SYSTEM usually follows an earlier foothold. Detections in the preceding hours — a download, an
    archive extraction, script execution, or a first-seen binary running from a user-writable path — often identify how the
    binary that prompted for elevation arrived and who put it there.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
