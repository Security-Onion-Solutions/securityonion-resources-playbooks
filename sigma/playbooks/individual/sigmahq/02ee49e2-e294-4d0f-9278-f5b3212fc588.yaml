name: New RUN Key Pointing to Suspicious Folder
id: 7b9719c1-f007-4c75-bece-c7dfa4dd8a7b
description: |
  Detects a new value written under a Run/RunOnce autostart registry key whose data points to an executable or command in a suspicious folder — EITHER a broadly user-writable or temporary location (Temp, ProgramData, AppData, Public, $Recycle.bin, %temp%/%AppData%) OR a user-profile path (:\Users\) combined with a personal subfolder such as Documents, Pictures, Music, or Favorites. Run-key persistence launches the referenced payload at each logon or system startup; legitimate software occasionally registers autostarts from these folders, so the investigation should determine what binary or command the value points to, whether it is signed and expected, whether that payload exists on disk and executed, and which process wrote the key. Because registry key/value deletion is not observable in this telemetry, judge cleanup from the key's re-modification history and whether the payload ran, not from a delete event.
type: detection
detection_id: 02ee49e2-e294-4d0f-9278-f5b3212fc588
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did this alert write a value under a Run/RunOnce key whose data points to a suspicious folder, and which branch fired?
  context: >-
    The rule fires when a value is written under a Run/RunOnce/Policies\Explorer\Run key (TargetObject) AND its data (Details) points EITHER to a broadly user-writable or temporary location (Temp, ProgramData, AppData, Public, $Recycle.bin, %temp%/%tmp%/%AppData%) OR to a user-profile path (:\Users\) combined with a personal subfolder (Documents, Pictures, Music, Favorites, Contacts, Photos). Note which branch matched: a temp/public-folder value and a personal-subfolder-under-a-user-profile value carry different weight for the downstream signing and payload-existence checks. Confirm the alert is not the excluded Windows Update RunOnce cleanup or the Spotify autostart before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register autostart entries pointing at user-writable folders?
  context: >-
    Legitimate installers and updaters occasionally set Run keys, but routine workstation and server use rarely writes autostart values that point at Temp, Public, or personal profile folders. Knowing whether the account and host function fit that activity is often the fastest path to separating a true positive from a software install. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account (HOST$) or SYSTEM, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Run-key variant was written, and what is the value name being registered?
  context: >-
    The three targeted locations differ in scope: HKLM ...\CurrentVersion\Run (and its WOW6432Node view) runs the payload for every user at startup, while ...\Policies\Explorer\Run is a policy-enforced autostart that is unusual outside managed configuration. The value NAME under the key is the autostart entry label an attacker chooses; a name mimicking a known product or a random string, combined with a payload in a user-writable folder, is the persistence signal. Read the exact key path and the writing process here, and let the value-decoding question carry the payload analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable or command does the Run-key value point to, and is that path signed and expected?
  context: >-
    The Details field holds the autostart payload — usually a full path to an executable, sometimes a command line with arguments or an interpreter invocation (cmd, powershell, rundll32, mshta). Extract the target path, confirm it resolves inside one of the suspicious folders the rule matched, and check whether the binary at that path is signed and by whom. An unsigned or mismatched-signer binary in Temp, AppData, or a personal profile folder set to autostart is the core persistence pattern. Details is absent for binary or empty value data (roughly 79% of registry modifications carry it); missing data here does not clear the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this Run key been written on this host before, and with what value?
  context: >-
    A first-time write to an autostart key is more suspicious than a value that changes routinely as software updates itself. Compare the historical Details values on this host: a key that has never been touched, or one whose value suddenly points to a user-writable folder after a history of signed Program Files paths, stands out. Zero history indicates a key that has never been modified before this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who set one Run key for persistence often make several changes together — a second autostart, disabling a security policy, or altering firewall or Defender settings. Clusters of registry writes from the same process within a short window reveal the full scope of the configuration change and whether persistence landed alongside other objectives. The triggering key appears in the results; the signal is what else was modified. If the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the referenced executable or script exist on disk at the path written to the Run key?
  context: >-
    Run-key persistence is only effective if the payload exists at the path the value names. Correlating file activity by the registry-writing process and its children shows whether that binary was created in the same session as the key write — for example a drop into C:\Users\Public or an AppData\Roaming folder immediately before the Run value was set. The file-write event carries no hash; if the payload is present, hash it from a later execution or retrieve it for a reputation lookup. If the file is absent, the persistence is staged but not yet armed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the binary referenced by the Run-key value actually execute on this host?
  context: >-
    Run keys launch their payload at the next logon or startup, but an actor may also run it
    immediately. The query anchors on the value data written to the Run key, returning
    executions on this host whose command line carries that payload path; a match confirms the
    persistence is live and the payload has run at least once. Absence means the mechanism is
    in place but has not yet fired — still active for the next logon.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the same Run key written on other hosts in the environment?
  context: >-
    The same autostart modification across multiple hosts may indicate a policy or software push, widespread malware, or lateral movement; a single-host write is more consistent with targeted persistence. Compare the Details values across hosts — the same value everywhere points to managed software or a common installer, while different payload paths per host point to attacker activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this Run key, and what started that process?
  context: >-
    The writing process (Image on the alert) is the immediate actor; tracing its own parent reveals whether the chain is legitimate — an installer launched by the user, a management agent — or suspicious, such as a script host or Office application spawning the process that set the autostart. If the parent process identifier resolves to NODATA, fall back to the writing process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence rarely lands in isolation. Aggregating process activity around the write surfaces what led to it and what followed — reconnaissance, a download or dropper, privilege escalation, or additional persistence. Novel parent-child pairs stand out at low counts against the high-count agent and OS telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a suspicious download — may reveal the stages that preceded the persistence write and help reconstruct the timeline. A Run-key write following an earlier execution or tampering alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses process-based detection: dropping an executable into a Startup folder or a path named by a Run value achieves autostart without running reg or a scheduling tool. File-event monitoring captures these drops even when the standard persistence utilities are avoided, and a Startup-folder drop alongside the Run-key write points to stacked persistence.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, deployment, or documented approval for this autostart registration?
  context: >-
    Software deployments and approved maintenance can legitimately create Run keys. A corresponding change ticket or deployment record suggests authorized activity; the absence of one when policy requires it, especially for a value pointing at a user-writable folder, points toward unauthorized persistence. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing software or making a change that would set this autostart?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If the user recalls installing software that registers itself to run at startup, the value and its folder should match that product; if no one recalls the action, the credentials may be compromised or the write may be automated malware. When the action confirms, capture why it was done and what was expected to run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
