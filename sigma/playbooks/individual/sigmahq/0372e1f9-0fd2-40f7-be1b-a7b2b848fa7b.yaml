name: Disable Privacy Settings Experience in Registry
id: 823697cf-e2a1-44ac-821d-95161c14df2b
description: |
  Detects a write to the DisablePrivacyExperience policy value under SOFTWARE\Policies\Microsoft\Windows\OOBE
  with DWORD data 0x00000000. This value governs whether Windows presents the privacy-settings wizard at first
  logon and is normally configured only by group policy, provisioning or imaging tooling, or administrative
  scripts. Ransomware deployment chains toggle the same value alongside automatic-logon settings so an
  encrypted host can reboot and log on unattended, so the investigation should establish what process wrote
  the value, whether autologon configuration or other defense tampering accompanied it, and whether the change
  is a managed fleet-wide rollout or isolated to this host.
type: detection
detection_id: 0372e1f9-0fd2-40f7-be1b-a7b2b848fa7b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry write match what this rule detects, the OOBE DisablePrivacyExperience policy value written with DWORD data 0x00000000?
  context: |
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    registry path (TargetObject) ends with \SOFTWARE\Policies\Microsoft\Windows\OOBE\DisablePrivacyExperience
    AND the value data (Details) is exactly DWORD (0x00000000). Review the exact key path, the value data,
    and the writing process against these criteria.
  range: +/-5m
  answer_sources:
  - alert
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to configure OOBE privacy-experience policy?
  context: |
    This policy value is typically written during machine provisioning, imaging, or group policy processing,
    so IT deployment systems and administrators running setup scripts are the common legitimate writers. User
    attribution is present on most endpoint registry events; when the user is SYSTEM or a machine account, the
    write is service-driven (for example group policy processing) and the writing process (Image) is the
    better attribution pivot.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact value data was written to the OOBE policy key, and what state does it represent?
  context: |
    Keys under \SOFTWARE\Policies\ are the group-policy surface of the registry, so writes here normally come
    from policy processing or deployment tooling rather than interactive sessions. DisablePrivacyExperience
    set to 1 suppresses the first-logon privacy wizard, which unattended deployment chains rely on; the
    alerting write sets it to 0, which leaves the wizard enabled or resets a previous suppression. Either
    direction of toggle from an unexpected writing process means someone is manipulating logon-flow policy
    outside managed configuration, and the writing process shown here determines which.
  range: +/-5m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process and command line performed the policy write?
  context: |
    The command line of the writing process reveals the mechanism. A reg.exe invocation such as
    reg add "HKCU\Software\Policies\Microsoft\Windows\OOBE" /v DisablePrivacyExperience /t REG_DWORD is the
    documented scripted pattern; PowerShell Set-ItemProperty is its script equivalent; svchost.exe performing
    the write indicates group policy processing; an unfamiliar binary writing policy values is the case that
    needs the most scrutiny. This retrieves the writing process's creation event.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What spawned the process that wrote the policy value, and is that parent chain expected?
  context: |
    The parent chain reveals how the write was initiated: services.exe or svchost.exe ancestry fits policy
    and deployment machinery, an interactive cmd.exe or explorer.exe chain fits a hands-on administrator or
    attacker, and script hosts or unexpected applications in the chain point to malicious automation. The
    writing process may have started hours or days before the alert, so this looks up its creation event
    over a wide window.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other registry modifications occurred on this host in the same session?
  context: |
    Attackers staging a host rarely change a single value: logon-flow suppression, automatic logon, security
    tool policy, and persistence keys tend to land together within minutes. The triggering key will appear in
    these results; the signal is what ELSE changed and whether the same writing process touched multiple
    policy or persistence locations. If the host is registry-noisy, narrow to the alerting writer's executable
    name or to Policies, Run, Services, Winlogon, and IFEO paths.
  range: +/-30m
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were automatic-logon values under the Winlogon key also modified on this host?
  context: |
    Suppressing the first-logon privacy wizard only matters to an operator who expects the host to log on
    without a human present. Deployment chains that need unattended reboots, including documented ransomware
    staging, pair this OOBE value with AutoAdminLogon, DefaultUserName, and DefaultPassword under
    HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon. Finding those values written in the same
    window converts a low-severity policy tweak into evidence of a staged unattended-reboot operation; also
    note a plaintext DefaultPassword is itself a credential exposure worth capturing.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_autologon:
        TargetObject|contains:
          - '\CurrentVersion\Winlogon\AutoAdminLogon'
          - '\CurrentVersion\Winlogon\DefaultUserName'
          - '\CurrentVersion\Winlogon\DefaultPassword'
          - '\CurrentVersion\Winlogon\DefaultDomainName'
          - '\CurrentVersion\Winlogon\AutoLogonCount'
      condition: selection and selection_autologon
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other defense tampering actions performed on this host?
  context: |
    Operators preparing a host for impact commonly disable several protections in one pass: real-time
    antivirus monitoring, shadow copies, recovery options, firewall rules, event logs, and security services.
    Multiple tampering commands from the same user or parent process around the policy write indicate a
    deliberate defense-degradation sequence rather than an isolated configuration change.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What activity occurred on this host after the policy value was written?
  context: |
    A logon-flow policy change made by an attacker precedes the action it enables, typically payload
    execution and a forced reboot. Aggregated process activity in the following hour shows what the change
    was preparing for: look for unfamiliar executables, mass tool execution under a single user, or a
    shutdown/restart command shortly after the write. Correlate with network connections and file events in
    the same window.
  range: +1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Is the OOBE privacy-experience policy currently in its expected state on this host?
  context: |
    Endpoint registry telemetry records value writes but not value or key deletions, so an attacker's cleanup
    of this value leaves no event. Confirm the current state of DisablePrivacyExperience by direct host
    inspection or configuration management rather than assuming the alerting write is the final state, and
    use the key's re-modification history from the historical-baseline question to see whether it was written
    again after the alert.
  range: +/-30d
  answer_sources:
  - edr_console
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the DisablePrivacyExperience value been modified on this host before?
  context: |
    A policy value that has never been touched in 90 days and suddenly changes deserves more scrutiny than
    one rewritten on every policy refresh cycle. Compare the historical Details values and writing processes
    with the alerting event: the same writer setting the same data on a schedule reads as managed
    configuration, while a first-ever write from a new process reads as manual or malicious change.
  range: -90d
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the value?
  context: |
    A writing process that appears regularly on this host over the past 90 days (policy engine, management
    agent) supports the managed-configuration explanation. Zero or very low historical counts mean the writer
    itself is new to this host, which shifts the investigation toward how that binary arrived and what else
    it did.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same OOBE policy value modified on other hosts in the environment?
  context: |
    A group policy or provisioning rollout writes this value on many hosts in a short window, usually with
    identical Details data and the same writing process. A single host receiving the change from an
    interactive tool is the targeted case. Compare Details values and writers across hosts to separate a
    managed rollout from isolated manipulation, and note which pattern the rule's stated false positive
    (a legitimate admin script) would produce.
  range: -24h
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were process-based persistence mechanisms installed on this host around the policy change?
  context: |
    An operator configuring a host for an unattended reboot usually needs their tooling to survive that
    reboot, so scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions installed in the same
    timeframe are part of the same staging pattern. Multiple persistence installations near the policy write
    indicate intentional stacking rather than isolated administration.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or Run-key paths on this host around the policy change?
  context: |
    File-based persistence bypasses command-line detection entirely: an executable or shortcut dropped into
    a Startup folder runs at the next logon without any schtasks, sc, or reg invocation. On a host being
    configured for automatic logon, a Startup drop is a particularly direct way to guarantee code execution
    after the reboot, so check drops in this window and what they point at.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the immediate context: deployment tooling
    and policy refresh cycles produce recognizable high-count pairs, while novel low-count pairs (script
    hosts, archive tools, unfamiliar binaries) stand out and may represent the operation this policy change
    belongs to.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host, such as initial-access activity, credential access, or other defense
    tampering, may reveal the attack stages that preceded this policy change and help reconstruct the
    timeline. Logon-flow manipulation typically comes late in an intrusion, after access and privileges are
    already established.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
