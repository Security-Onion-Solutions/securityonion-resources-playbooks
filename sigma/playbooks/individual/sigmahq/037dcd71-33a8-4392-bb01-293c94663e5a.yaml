name: File Decryption Using Gpg4win
id: 59f5d142-76e5-40d3-86bf-98a71a9ebf42
description: |
  Detects gpg.exe or gpg2.exe (the Gpg4win OpenPGP command-line tools) invoked
  to decrypt a file, identified by a command line that carries the ` -d `
  decrypt switch together with the literal `passphrase`. The rule fires only
  when both the GnuPG binary metadata and that decrypt-with-passphrase
  command-line structure match. Gpg4win is legitimate end-user encryption software,
  so this can be routine handling of protected mail or files; it is also a
  recurring step in loader chains, where a renamed or silently installed Gpg4win
  is used to decrypt a staged, encrypted payload immediately before it is loaded
  and executed. Investigation should establish what file was decrypted, where it
  came from, what process invoked the decryption, and what ran afterward.
type: detection
detection_id: 037dcd71-33a8-4392-bb01-293c94663e5a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show gpg.exe or gpg2.exe decrypting a file with a passphrase?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the GnuPG OpenPGP binary runs with both the decrypt switch (` -d `) and a passphrase reference in the command line. Read the exact Image, CommandLine, and Description and confirm both conditions are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to decrypt files with command-line GnuPG?
  context: Legitimate use of Gpg4win is common among users who handle encrypted mail or protected files, often through the graphical front end rather than the command line. A user or host with no encryption workflow running command-line GnuPG decryption is a stronger signal than a known encryption user doing routine work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What file did gpg decrypt, and what input and output paths and switches were used?
  context: The full command line reveals the operation. Identify the input ciphertext path (often a .gpg file), any output path set with -o, and batch or passphrase-handling switches such as --batch, --yes, or --passphrase. A decrypt that writes an executable or installer output, or reads from a user-writable staging directory, points to payload deobfuscation rather than routine file handling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What files did the GnuPG process touch on disk during the decryption?
  context: 'The command line shows the requested input and output paths, but the file events show what was actually written. Look for the decrypted output: an executable, DLL, MSI, script, or archive landing in a user-writable directory is consistent with staged-payload decryption, while an ordinary document or mail attachment is consistent with routine encryption use.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: How was the passphrase supplied to the decryption?
  context: The rule fires on a command line containing a passphrase reference, so review how the secret was passed. A passphrase given inline with --passphrase, or read from a config or batch file, is observable here; passphrases supplied over stdin will not appear in the command line. A hardcoded inline passphrase paired with --batch and --yes is characteristic of scripted, unattended decryption rather than interactive use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned gpg, and is that parent chain expected for file decryption?
  context: The parent process reveals how the decryption was invoked. Interactive use is typically launched from explorer.exe or a mail client. Script interpreters such as powershell.exe, wscript.exe, cmd.exe, or mshta.exe spawning GnuPG is consistent with automated payload decryption inside a loader chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What processes ran from the decrypted output shortly after the decryption?
  context: The processes that execute after decryption reveal its purpose. Routine use ends at a readable file. A loader chain decrypts to an executable, DLL, MSI, or script and immediately loads it with rundll32.exe, regsvr32.exe, msiexec.exe, mshta.exe, or a script host. Look for new executions on this host in the minutes following the decryption.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run gpg or gpg2 for file decryption?
  context: A GnuPG binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution, which raises the priority of the other findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched the rule's decrypt-with-passphrase pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific decrypt-with-passphrase pattern has historically run here rather than generic GnuPG usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -d '
        - passphrase
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts matched the rule's decrypt-with-passphrase pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the decrypt-with-passphrase pattern rather than generic GnuPG usage. Many hosts matching the same pattern points to scripted deployment or vendor automation; a single host or a small unrelated set points to manual or targeted activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -d '
        - passphrase
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -d '
        - passphrase
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -d '
        - passphrase
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the decryption is isolated or part of broader activity. If the same user triggered related actions on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -d '
        - passphrase
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the decryption reveals the immediate context: what led to it, what happened after, and whether it is part of a larger sequence. Look for the download or staging that delivered the encrypted input, and for follow-on loading, defense tampering, or persistence.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as drive-by delivery, user execution of an installer, or defense tampering, may reveal the stages that preceded the decryption and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
