name: APT31 Judgement Panda Activity
id: 7a77c4ab-34a6-4fd0-a4cd-a02ebbae9d61
description: |
  Detects a command line that does either of two things: performs an ldifde directory export with the
  `-f -n` switches writing to `eprod.ldf`, or copies staging tooling to a remote `c$` administrative share —
  procdump64.exe, netsess.exe, 7za.exe, or any file into a `\c$\aaaa\` path. Either branch reflects
  hands-on-keyboard activity rather than routine administration: bulk export of directory objects for offline
  analysis, or pre-positioning of credential-dumping, session-enumeration, and archiving utilities on a remote
  host before they are run there. Determine which branch fired, what directory data or which remote host was
  targeted, whether the staged tools subsequently executed or wrote archives and memory dumps, and whether the
  account involved holds directory or administrative rights that widen the impact.
type: detection
detection_id: 03e2746e-2b31-42f1-ab7a-eb39365b2422
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting command line match either branch this rule detects — an ldifde export to eprod.ldf,
    or a copy of staging tooling to a remote c$ administrative share?
  context: The rule fires on either of two independent patterns, and the branch that fired determines the whole
    investigation. One branch requires `ldifde`, `-f -n`, and `eprod.ldf` together in the command line; the other
    requires `copy \\` and `c$` together plus a reference to procdump64.exe, netsess.exe, 7za.exe, or a `\c$\aaaa\`
    path. Note which branch matched before continuing — directory-export questions carry weight for the first,
    remote-staging and credential-dumping questions for the second.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to export directory data or copy executables to remote administrative
    shares?
  context: Directory exports and administrative-share file copies are legitimate operations for directory
    administrators, migration engineers, and some backup or inventory tooling. Confirming whether this account and
    this host have a role that includes those operations is usually the fastest way to separate routine
    administration from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this directory export or tool staging part of an authorized penetration test or red team engagement?
  context: procdump64.exe, netsess.exe, and 7za.exe are all used in authorized security assessments, and a
    directory export is a common early step in one. Check whether an assessment is currently scoped against this
    host or network segment before investing further analysis; matching tool set, source host, and timing resolve
    the alert without deeper work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What credential store does this activity target — directory objects exported by ldifde, or LSASS memory
    reachable by the staged procdump64.exe?
  context: The two branches lead to different credential stores and different remediation. An ldifde export with
    `-n` omits binary values but still yields the full object and attribute inventory of the naming context it was
    pointed at, including service principal names and account metadata usable for offline targeting. A staged
    procdump64.exe points at LSASS memory on the destination host, which yields live credential material for every
    account with a session there. Read the command line to establish which store is in play.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which files were written into the aaaa staging directory or as the eprod.ldf export output on this
    host?
  context: The command line carries the intended scope — the `-d` base DN and `-r` LDAP filter for the export
    branch, the UNC target and source path for the copy branch — and this query shows what that scope actually
    produced on disk. The staging directory contents name every tool that was collected together rather than only
    the one the command line happened to reference. For a copy to a remote share the write lands on the
    destination host, so an empty result here directs the analyst to the remote host named in the command line
    rather than indicating nothing was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\aaaa\'
          - 'eprod.ldf'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - EventType
- question: Was compression or password protection applied to collected data?
  context: 7za.exe accepts `-p` to set an archive password and `-mhe=on` to encrypt the archive headers, which
    hides the filenames inside as well as the contents; `-mx9` indicates maximum compression of a bulk collection.
    Passwords supplied via stdin or a response file will not appear in the command line, so absence of a flag is
    not evidence the archive was unprotected. An ldifde export is plaintext, so for that branch the relevant
    obfuscation check is whether the .ldf was archived afterward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are the staged executables or the exported .ldf file still on disk for analysis?
  context: Files written by the alerting process and its direct children are the local half of this activity — the
    source copy of the staged tooling, or the export output. If they are still present, retrieve them for hashing,
    string review, and sandbox submission; a file already removed narrows the analysis to the process telemetry
    that recorded it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this command interpreter, and is that parent chain expected?
  context: The parent reveals how the command was issued. An interactive shell under explorer.exe or a remote-access
    service points to a person at a keyboard; a scheduled task, a management agent, or a deployment service points
    to automation that can be verified against a change record. Office applications, script hosts, and
    remote-execution service binaries as the parent point to a session the account owner did not start. Known
    administration and backup tooling as the parent is the allowlist case worth confirming before escalating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did any process on this host run LSASS dumping syntax in the hours around this alert?
  context: Staging procdump64.exe is a precursor; the dump itself is a separate execution, typically `procdump -ma
    lsass.exe`, `rundll32 comsvcs.dll MiniDump`, or an Invoke-Mimikatz sekurlsa call. The interval between the
    access and the dump write is usually short — on the order of five minutes — so a match close to this alert
    ties the staging to a completed credential-theft step. The window is widened here because the staged copy and
    the execution may be separated by an operator's manual pause.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dump:
        CommandLine|contains:
          - 'procdump'
          - 'comsvcs.dll'
          - 'minidump'
          - 'invoke-mimikatz'
          - 'sekurlsa'
          - ' -ma '
          - 'lsass'
      condition: selection and selection_dump
    fields:
      - Image
      - CommandLine
      - User
- question: Did cross-process memory-write or execution-hijack API calls occur on this host in the alert window?
  context: Opening a full-access handle (0x1F0FFF) to lsass.exe is the access step this technique depends on, but
    read-side handle telemetry is not collected on endpoints in this environment, so it cannot be queried directly.
    The behavioral API channel records the injection side — WriteProcessMemory, QueueUserAPC, SetWindowsHookEx —
    which corroborates cross-process manipulation when it is present. That is only a partial substitute, because a
    plain memory read of LSASS leaves no record here — treat an empty result as a visibility gap rather than as
    evidence no access occurred.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - User
- question: Were LSA protection or credential-caching registry values modified on this host before this alert?
  context: Two registry changes commonly precede an LSASS dump. Setting
    `HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest\UseLogonCredential` to 1 forces plaintext
    credentials back into LSASS memory, and removing or zeroing `HKLM\SYSTEM\CurrentControlSet\Control\Lsa\RunAsPPL`
    disables LSA protection so the process can be read at all. Either change on this host in the preceding day
    turns tool staging into a prepared dump attempt. Value deletion is not observable in this telemetry, so read
    the modification history of these keys rather than expecting a removal event.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_key:
        TargetObject|contains:
          - '\SecurityProviders\WDigest\UseLogonCredential'
          - '\Control\Lsa\RunAsPPL'
          - '\Control\Lsa\LsaCfgFlags'
          - '\Control\Lsa\DisableRestrictedAdmin'
      condition: selection and selection_key
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the staged tooling load the compression or memory-dump support libraries on this host?
  context: Module loads confirm what the staged binaries actually did. 7za.exe pulls crypt32.dll when archive
    encryption is in use, and procdump64.exe loads dbghelp.dll or dbgcore.dll to call MiniDumpWriteDump — a load
    of those two by anything other than a debugger is the dump capability being initialized. Load events carry the
    signer and hash of the module directly, so a mismatched or unsigned library under one of these tool names also
    surfaces here.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tool:
        Image|endswith:
          - '\procdump64.exe'
          - '\procdump.exe'
          - '\netsess.exe'
          - '\7za.exe'
      selection_lib:
        ImageLoaded|endswith:
          - '\dbghelp.dll'
          - '\dbgcore.dll'
          - '\crypt32.dll'
      condition: selection and selection_tool and selection_lib
    fields:
      - Image
      - ImageLoaded
      - Signature
      - Hashes
- question: Were archive or memory-dump files written on this host after the alert?
  context: Exported directory data and dumped credential material are staged as files before they leave the host —
    .ldf from the export, and .7z, .zip, .rar, .cab, or .dmp from archiving and dumping. Writes under %TEMP% or
    C:\Windows\Temp are the usual staging locations and are worth reading closely; the writing process names which
    tool produced each file, and the size indicates whether bulk collection occurred. A large archive appearing
    shortly after the alert is the output to chase to its destination.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.ldf'
          - '.7z'
          - '.zip'
          - '.rar'
          - '.cab'
          - '.dmp'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - EventType
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this
    event?
  context: A copy to a remote `c$` share is itself an SMB session, and directory exports and credential dumps are
    typically followed by movement to the systems the collected material unlocks. The query returns outbound
    connections from this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in
    the hours after the event, with the originating Image and User showing what drove each one. Two limits apply.
    Credentials exfiltrated and replayed from another machine will not appear here, so also review 4624 logons on
    suspected targets for this account. And if endpoint network telemetry is not collected from this host, treat
    zero rows as a visibility gap rather than as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- always_include: true
  question: Has this user previously produced this rule's export-or-staging pattern, and does that history fit
    their role?
  context: The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this specific firing pattern rather than generic use of a command interpreter, aggregated by
    host. A directory administrator with a recurring monthly export history reads very differently from an account
    producing this pattern for the first time. Weigh the count and its host spread against what the account is
    provisioned to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldifde:
        CommandLine|contains|all:
        - ldifde
        - -f -n
        - eprod.ldf
      selection_lateral_movement:
        CommandLine|contains|all:
        - copy \\\\
        - c$
        CommandLine|contains:
        - \aaaa\procdump64.exe
        - \aaaa\netsess.exe
        - \aaaa\7za.exe
        - \c$\aaaa\
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven this pattern on this host or across the environment, or is
    the parent new for this activity?
  context: When the alert fires under a service principal or a machine account, user identity does not attribute
    the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection structure
    scoped to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern. A parent that already accounts for a long run of prior events is deployment or migration automation; a
    parent that is new for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldifde:
        CommandLine|contains|all:
        - ldifde
        - -f -n
        - eprod.ldf
      selection_lateral_movement:
        CommandLine|contains|all:
        - copy \\\\
        - c$
        CommandLine|contains:
        - \aaaa\procdump64.exe
        - \aaaa\netsess.exe
        - \aaaa\7za.exe
        - \c$\aaaa\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts rather than just this one shows whether the export or
    staging is a single step or part of a sequence running on several systems. The same account producing
    reconnaissance, archiving, or remote-execution activity on other hosts in the same window widens the scope of
    what has to be contained.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: Under a service principal, asking what else the user did across the network returns agent telemetry from
    every host and answers nothing. The query instead mirrors the rule's selection structure scoped to the alerting
    parent process, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger and, for the staging branch, to an operator
    working from this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldifde:
        CommandLine|contains|all:
        - ldifde
        - -f -n
        - eprod.ldf
      selection_lateral_movement:
        CommandLine|contains|all:
        - copy \\\\
        - c$
        CommandLine|contains:
        - \aaaa\procdump64.exe
        - \aaaa\netsess.exe
        - \aaaa\7za.exe
        - \c$\aaaa\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
