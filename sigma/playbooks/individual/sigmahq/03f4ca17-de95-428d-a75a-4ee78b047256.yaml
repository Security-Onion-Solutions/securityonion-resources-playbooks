name: HackTool - Impacket File Indicators
id: 520ed495-2006-46f4-8931-d769526fd137
description: |
  Detects file creation events whose filename matches the sessionresume_ pattern (sessionresume_ followed by eight random letters) written by Impacket's secretsdump-style credential extraction when a large NTDS dump is interrupted and made resumable. The file is a state artifact of an in-progress domain credential dump, so legitimate occurrences are essentially unknown; a random filename collision is the only benign explanation. Investigation should identify the process that wrote the file, confirm which credential store was targeted and how far the extraction progressed, and determine whether harvested credentials were used for lateral movement.
type: detection
detection_id: 03f4ca17-de95-428d-a75a-4ee78b047256
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the created file's name and writing process match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact file path, the operation performed, and the responsible process. The rule fires on a filename of sessionresume_ followed by exactly eight letters; check that the match is not an unrelated application file that happens to fit the naming pattern, and note the directory — secretsdump writes its resume state to the tool's working directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host a plausible source of domain credential auditing activity?
  context: The only quasi-legitimate producer of this artifact is a security assessment run by authorized staff against a domain controller or credential store. The query displays the triggering event's host, user, and writing process; judge them against the host's role and the account's function. When the user is a machine or service account, attribute by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this Impacket activity part of an authorized penetration test or red team engagement?
  context: Impacket's credential extraction scripts are standard components of authorized security assessments. Before investing investigation time, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching timing and scope resolves the alert without further analysis; an NTDS-scale dump outside a declared engagement should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is the sessionresume file still on disk, or was it deleted after the alert?
  context: secretsdump removes its resume file when a dump completes successfully, so deletion shortly after creation suggests the extraction finished rather than that the activity was benign. A file still on disk indicates an interrupted or in-progress dump and can be retrieved to see how far the extraction advanced; either way, look for sibling output files created in the same directory during the window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Which credential store did this extraction target, and what do the tool's arguments reveal?
  context: A sessionresume_ file is written during NTDS extraction over directory replication, which exposes every domain account including krbtgt — treat the potential exposure as domain-wide and cross-reference privileged accounts in the directory service. Decode the writing process's command line for flags such as -just-dc, -just-dc-ntlm, -hashes, -use-vss, -resumefile, and a target in the [USER]@[IP] form; also check the surrounding window for companion LSASS dump syntax (procdump, rundll32 with comsvcs.dll MiniDump) that indicates parallel local scraping.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - active_directory
  - organizational_knowledge
- question: What does the sessionresume file contain, and how far did the extraction progress?
  context: The file stores the identifier of the last directory object processed so an interrupted dump can resume — its content is a progress marker for the credential extraction. Retrieve it from the endpoint and check the same directory for extraction output such as .ntds, .sam, .secrets, or .kirbi files, which show what was actually harvested. Content retrieval requires endpoint access; the query shows the write events for the artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
- question: What binary wrote this file, and does its hash have known threat intel detections?
  context: File-creation events carry no hash; the writing binary's own execution event does. Read the hash from the writer's process event and check it against threat intelligence — compiled Impacket tools circulate widely and are frequently detected by name-independent hash matching, while an unknown hash points to a custom or freshly built variant. A writer named to imitate a system binary or running from a user-writable path strengthens the tool-drop interpretation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process launched the tool that wrote this file, and is that launch chain expected?
  context: The writer's parent reveals the delivery mechanism. A parent of wmiprvse.exe indicates remote execution over WMI, services.exe indicates a service-based launch, and a remote-admin agent parent indicates delivery through that channel — all consistent with an operator working from another machine. An interactive shell parent points to hands-on-keyboard activity under a logged-on session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A credential extraction run rarely leaves a single artifact — expect dump output files, staging copies, or cleanup deletions from the same process or its children within minutes of the resume file. Watch where the writes land, since temp directories and user-writable staging paths are the common destinations for extraction output awaiting exfiltration.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Were credential-related registry keys modified on this host before or around the dump activity?
  context: Credential scraping is commonly preceded by registry changes that widen what can be harvested or blind defenses — enabling cleartext credential caching via the WDigest UseLogonCredential value, weakening LSA protection settings, or disabling security tooling. A modification of these keys in the day before the dump artifact appeared reconstructs the preparation stage and identifies the process that performed it.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Control\SecurityProviders\WDigest'
          - '\Control\Lsa\'
          - '\Windows Defender\DisableAntiSpyware'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections from this host to remote-access ports -- 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating Image and User show what drove each connection. Two limits to keep in mind -- credentials extracted here and replayed from another machine will not appear, so check logon events on suspected targets for the exposed accounts, and if endpoint network telemetry is not collected from this host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: An NTDS extraction exposes every domain account's secrets, including privileged and service accounts and the krbtgt key material that enables forged-ticket attacks, so remediation planning starts from domain-wide scope. Cross-reference the directory service for accounts with elevated group memberships and externally reachable services; a completed dump generally warrants coordinated credential resets rather than single-account response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day history of the rule's specific firing pattern (not generic file activity), aggregated by host. For a credential-dump state artifact, prior history is expected only for security assessment staff; weigh any count against the user's role and declared engagement windows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_names_re:
        TargetFilename|re: \\sessionresume_[a-zA-Z]{8}$
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_names_re) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern (not generic use of the binary). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events points to recurring automation that should be identified and verified.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_names_re:
        TargetFilename|re: \\sessionresume_[a-zA-Z]{8}$
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_names_re) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window reveals whether the account is being used for movement across multiple endpoints — remote execution utilities, credential tools, or archiving binaries appearing on other hosts under the same account widen the compromise scope. If the account is a service principal, this view fills with routine agent noise and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, user-scoped clustering returns agent-telemetry noise. The meaningful question is whether the same launch mechanism produced the rule''s pattern elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts producing resume-state artifacts in the same window points to extraction being run against several systems; a single host points to a host-local operation.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_names_re:
        TargetFilename|re: \\sessionresume_[a-zA-Z]{8}$
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_names_re) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: What other file activity occurred on this host around the time of the alert?
  context: A credential extraction seldom happens in isolation — the surrounding minutes often contain tool drops, output staging, and cleanup deletions. The aggregation collapses each writing process and path into counted rows so repetitive platform noise stands out as high-count entries while novel writer-path combinations surface at low counts; unfamiliar writers touching temp or staging paths are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Earlier detections on the same host may reveal the attack stages that preceded the credential dump and help reconstruct the timeline: exploitation of a public-facing service, defense tampering, account creation, or remote-access tooling installation commonly precede extraction. Review the alert sequence for a progression from initial access through privilege escalation to this credential-access stage.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
