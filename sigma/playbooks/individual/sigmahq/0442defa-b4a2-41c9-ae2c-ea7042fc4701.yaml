name: Potential Credential Dumping Attempt Using New NetworkProvider - REG
id: 090c0bd9-fcdd-4367-92db-9ab32e9c5e1d
description: |
  Detects registration of a new Windows network provider by a registry write to a key
  path containing both \System\CurrentControlSet\Services\ and \NetworkProvider, once the
  three built-in providers (WebClient, LanmanWorkstation, RDPNP) and the in-place-upgrade
  helper poqexec.exe are excluded. Registering an additional network provider points a DLL
  (via its ProviderPath value) into the logon credential-dispatch path; that DLL's
  NPLogonNotify export then receives every interactive user's cleartext password, so a
  malicious provider harvests credentials for each subsequent logon. The same registry
  layout is also reset by legitimate OS upgrades and populated by a small number of
  vendor products, so the investigation should decode the registered value, confirm
  whether the provider was activated in the provider-order list, and determine whether the
  referenced DLL was dropped and loaded.
type: detection
detection_id: 0442defa-b4a2-41c9-ae2c-ea7042fc4701
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert match the rule — a value set on a Services\...\NetworkProvider key outside the built-in providers?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires when the modified key path (TargetObject) contains both
    \System\CurrentControlSet\Services\ and \NetworkProvider AND is not one of the three
    default providers (WebClient, LanmanWorkstation, RDPNP) and was not written by
    poqexec.exe. Review the exact key path, its value data, and the writing process against
    those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register or reconfigure a network provider?
  context: Network-provider registration under Services is a rare, privileged operation
    outside of an OS upgrade or a specific vendor install. Knowing whether the writing
    account and the host's function are consistent with legitimate provider changes is
    often the fastest way to separate a true positive from sanctioned activity. User
    attribution is present on most endpoint registry events; when it is a machine account
    or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this NetworkProvider key, and does it point at a DLL path?
  context: The registered provider's DLL is carried in the ProviderPath value under the
    new NetworkProvider subkey. Decode the Details field for a file path — a DLL under a
    system directory, a user-writable location (Temp, AppData, ProgramData), or an unusual
    path is the credential-capture component. Details is populated for roughly four in five
    registry modifications; when it is empty the value data was binary or absent, so pivot
    to the writing process to recover what was set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which service subkey and value were modified, and is this a network-provider registration outside the known set?
  context: The key path reveals intent. A new subkey under
    HKLM\System\CurrentControlSet\Services\<Name>\NetworkProvider that is not one of the
    built-in providers registers an additional provider into the logon credential path.
    The value name (ProviderPath, Name, Class) and the writing process together determine
    what was configured and whether it resembles a vendor install or a hand-run
    modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What credential-capture mechanism was configured by this write?
  context: Registering a network provider inserts a DLL into the logon credential-dispatch
    sequence, where its NPLogonNotify export receives the cleartext password of every
    interactive logon (local, RDP, and network) on the host. The writing command line shows
    how the provider was registered and what path or name was supplied. Unlike memory-based
    credential dumping, this mechanism captures passwords passively at each future logon
    rather than reading them from an existing process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this key, and is its parent chain expected?
  context: The process that performed the registry write and the parent that launched it
    reveal how the change was made. A provider registration driven by an installer or a
    management agent has a predictable parent chain; the same write from an interactive
    shell, a script host (powershell.exe, wscript.exe, mshta.exe), or an Office application
    is more consistent with hands-on abuse. Walk up from the parent to see what initiated it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was the network-provider order list modified to activate the new provider?
  context: Registering a provider subkey only takes effect once the provider name is added
    to the ProviderOrder (or HwOrder) list under
    HKLM\SYSTEM\CurrentControlSet\Control\NetworkProvider. A companion write to that key
    near the alert time confirms the new provider was activated and will be invoked at the
    next logon; its absence suggests a partial or aborted setup. Compare the resulting
    provider list against the default RDPNP, LanmanWorkstation, and webclient entries plus
    any known vendor providers.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: \Control\NetworkProvider
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What files did the writing process create on this host around the alert time?
  context: The DLL referenced by the ProviderPath value has to exist on disk for the
    provider to load at logon. Files written by the same process that made the registry
    change — correlated by its process identifier — surface the dropped component and any
    staging or credential-output files. A DLL landing in a user-writable or unusual
    directory just before the provider registration is a strong lead for the capture
    component.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: Setting up a credential-capturing provider often accompanies other registry
    changes — a second provider subkey, provider-order edits, or defense-tampering keys.
    Registry modifications from the same host within a short window, grouped by key path
    and writing process, reveal the full scope of the configuration change and whether
    multiple objectives were pursued together. The triggering key appears in the results;
    the signal is what else was modified.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this NetworkProvider key been modified before on this host?
  context: A provider subkey that has never been touched on this host is more suspicious
    than a routine change. Provider configurations should rarely change outside of an OS
    upgrade or a software install, so zero or very low history for this exact key points to
    a first-time modification. Compare historical Details values to see whether the same
    value is being re-set or this is genuinely new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same NetworkProvider key modified on other hosts in the environment?
  context: The same provider registration across multiple hosts can indicate a management
    or software rollout, whereas a modification confined to this one host is more consistent
    with a targeted action. Compare the Details values across hosts — identical values from
    a deployment tool differ from ad-hoc, host-specific paths.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: A captured credential is typically reused to move laterally. The query returns
    outbound connections from this host to remote-access ports -- 3389 (RDP), 445
    (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the
    originating Image and User show what drove each connection. Two limits to keep in mind --
    a provider that captures passwords only fires them on future interactive logons, so
    replay may lag by hours or days, and credentials replayed from another machine will not
    appear here (check logon events on suspected targets for the affected accounts). If
    endpoint network telemetry is not collected from this host, treat zero rows as a
    visibility gap, not evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed, and do any have elevated privileges?
  context: A credential-capturing network provider records the cleartext password of every
    account that logs on to this host after registration, not just the account that made
    the change. Enumerate the accounts that authenticate to this host and prioritize any
    with domain-admin, service-account, or other elevated access — those require escalation
    and password resets. Standard user accounts that logged on interactively should also be
    treated as exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Registry modifications on this host within a
    short window around the alert reveal the immediate context — what configuration changes
    landed together and whether the provider registration was one step in a larger
    sequence. Aggregating by key path and writing process collapses routine noise while
    novel modifications stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    privilege escalation — may reveal the attack stages that preceded the provider
    registration and help reconstruct the timeline. Credential-access setup commonly
    follows an initial foothold and elevation, so preceding alerts help place this event in
    the sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
