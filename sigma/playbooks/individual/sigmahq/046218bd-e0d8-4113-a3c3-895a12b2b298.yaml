name: Session Manager Autorun Keys Modification
id: cc242072-465e-4961-8541-54bbf56d9172
description: |
  Detects modification of an execution value under the Session Manager registry key
  (System\CurrentControlSet\Control\Session Manager) — BootExecute, SetupExecute, Execute,
  S0InitialCommand, KnownDlls, or AppCertDlls — where the new value data is non-empty. These
  entries run native binaries or load DLLs very early during boot and process startup, before
  most user-mode defenses initialize, which makes them a stealthy persistence and
  privilege-escalation primitive. Legitimately these values are set by the OS installer and
  servicing components (the default BootExecute value runs autochk); an unexpected write points
  a boot-time entry at an attacker-controlled binary or forces a malicious DLL into every
  process that creates a child. Investigation should determine what binary or command the value
  now runs, who wrote it and from what process lineage, whether the payload is present on disk
  and executed, and whether the change is isolated or part of a broader configuration push.
type: detection
detection_id: 046218bd-e0d8-4113-a3c3-895a12b2b298
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting registry write target a Session Manager execution value and match this rule's criteria?
  context: >-
    Confirm the modified key is one of the Session Manager execution entries (BootExecute,
    SetupExecute, Execute, S0InitialCommand, KnownDlls, AppCertDlls) beneath
    System\CurrentControlSet\Control\Session Manager, and that the value data is populated —
    the rule deliberately excludes empty writes. The alert panel carries the exact value data
    for this check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to modify Session Manager boot-execution keys?
  context: >-
    Session Manager execution values are normally written only by the OS installer or servicing
    components, so a modification attributed to an interactive user, an unexpected service
    account, or an unusual writing process warrants scrutiny. These writes frequently run as
    SYSTEM or a machine account; when the user is not a human account, pivot on the writing
    process to judge legitimacy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Session Manager value was modified, and what binary or command does it now run?
  context: >-
    The value data determines what executes. BootExecute, SetupExecute, Execute, and
    S0InitialCommand run native binaries at early boot; AppCertDlls and KnownDlls force DLLs to
    load into processes. Read the value data written to the key and identify the binary path,
    command, or DLL it references — a non-default entry such as anything other than autochk on
    BootExecute, or any addition to AppCertDlls, is the payload the attacker installed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that wrote this Session Manager value?
  context: >-
    Writing to Session Manager execution keys is normally performed by the OS installer or the
    servicing stack. Tracing the writing process back to its parent reveals whether the change
    came from a legitimate deployment chain or from a shell, script host, or Office application,
    which points to hands-on or malicious modification. If parent lineage is unavailable on the
    registry event, pivot on the writing process identity instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this Session Manager key been modified before on this host, and with what values?
  context: >-
    Session Manager execution keys are set at OS install and rarely change afterward, so a
    first-time or novel modification is far more notable than a recurring one. Compare the
    historical value data against the current write — if the key has never been touched, or the
    value differs from prior entries, the change stands out.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who modify one registry key often modify several — installing persistence while
    also disabling a security control or changing a policy. Registry changes from the same
    writing process within a short window reveal whether multiple configuration objectives were
    pursued together, which points to a hands-on session or an installer-style implant rather
    than an isolated write.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this Session Manager value re-modified after the alert, and does the entry still reference a non-default payload?
  context: >-
    Registry key and value deletions are not observable in endpoint registry telemetry, so
    attacker cleanup cannot be confirmed directly. Judge persistence instead from the key's
    re-modification history — whether it was overwritten again (for example reverted to a
    default value, or repointed to a new payload) — and from whether the current value still
    references a binary or DLL that is not the expected system default.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the binary referenced by this Session Manager value present on disk, and did the writing process drop it?
  context: >-
    A boot-execution entry is only effective if the referenced payload exists at the configured
    path. Correlating file activity by the registry-writing process and its children shows
    whether the payload was dropped in the same session as the registry write. The file-write
    event carries no hash; if the payload is present, hash it from a later execution or retrieve
    it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the binary or command configured in this Session Manager value execute on the host?
  context: >-
    Session Manager execution values run native binaries very early during boot, before most
    user-mode defenses initialize. The query anchors on the written value data, returning
    executions on this host whose command line carries that payload. Because these payloads
    fire at the next restart, recent execution may be absent until the host reboots — treat
    that as persistence staged but not yet run rather than a clean result. When the modified
    entry is KnownDlls or AppCertDlls the value names a DLL rather than a command, so a zero
    here is expected and the module-load question covers whether that DLL took effect.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this value was modified, what DLLs loaded across processes, and do any match the DLL named in the value data?
  context: >-
    The AppCertDlls value forces the named DLL to load into every process that calls the
    CreateProcess API family, giving code execution inside otherwise-trusted processes. Compare
    loaded module paths against the registry value data — an unsigned or rarely-seen DLL loading
    broadly across unrelated processes shortly after the change indicates injection took effect.
    This pivot applies only to the AppCertDlls entry; boot and setup values run native binaries,
    not DLLs.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains|expand: '%Details%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
      - Image
- question: Was this Session Manager key modified on other hosts in the environment?
  context: >-
    The same modification on many hosts may indicate a policy push or widespread malware, while
    a change on only this host suggests targeted activity. Compare the value data across hosts —
    identical benign values across a fleet look like deployment, while a unique or unusual value
    on one host stands apart.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host around this time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold,
    they commonly install backups using scheduled tasks, services, registry keys, BITS jobs, or
    WMI subscriptions. Multiple persistence installations in the same timeframe indicate
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File-event monitoring captures these drops even when
    the attacker avoids standard persistence tools, revealing parallel footholds alongside the
    Session Manager change.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded the boot-key
    modification and help reconstruct the timeline that led to persistence being installed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or maintenance window authorizing modification of Session Manager boot-execution keys?
  context: >-
    Many organizations require change tickets for system modifications, especially persistence
    mechanisms and boot-time configuration. A corresponding ticket suggests authorized activity;
    absence of one when policy requires it suggests the change was unauthorized. This check can
    quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
