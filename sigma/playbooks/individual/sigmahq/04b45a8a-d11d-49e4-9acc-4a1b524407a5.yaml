name: DNS-over-HTTPS Enabled by Registry
id: 00827f50-34f7-4ea7-9ef6-d85a254ed8b6
description: |
  Detects a registry write that enables DNS-over-HTTPS in a major browser. The rule fires when
  EITHER Edge's BuiltInDnsClientEnabled policy is set to DWORD 1, OR Chrome's DnsOverHttpsMode
  policy is set to 'secure', OR Firefox's DNSOverHTTPS Enabled policy is set to DWORD 1. Enabling
  DoH moves the browser's name resolution into encrypted HTTPS sessions with an external resolver,
  removing query names, types, and responses from DNS-based monitoring — a legitimate privacy or
  enterprise-policy choice when deployed through change control, and a defense-evasion step when
  set to hide command-and-control resolution or data exfiltration. The investigation should
  establish which browser's policy branch fired, what process and account performed the write and
  through what launch chain, whether the change maps to an approved policy deployment, and whether
  the host began reaching DoH resolvers afterward.
type: detection
detection_id: 04b45a8a-d11d-49e4-9acc-4a1b524407a5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry write match one of the three browser DoH policy settings this rule detects?
  context: |
    The rule fires on one of three branches — note which one, because it determines which browser
    is affected and which process should legitimately write the key. Either the Edge policy value
    BuiltInDnsClientEnabled was set to DWORD (0x00000001), or the Chrome policy value
    DnsOverHttpsMode was set to 'secure', or the Firefox policy value DNSOverHTTPS\Enabled was set
    to DWORD (0x00000001). Confirm the key path (TargetObject) and value data (Details) against
    these branches. Details is occasionally absent on endpoint registry telemetry; when missing,
    judge the match from the key path alone.
  range: +/-5m
  answer_sources:
  - alert
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change browser DNS-over-HTTPS policy?
  context: |
    Browser policy values in an enterprise are normally written centrally, not by end users. A
    desktop or browser administrator rolling out a resolver standard is routine; the same write on
    a server, a kiosk, or a standard user's workstation outside any deployment is out of place.
    User attribution is present on most endpoint registry events, but service-driven writes often
    carry SYSTEM or a machine account — in that case attribute the change through the writing
    process (Image) instead.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What started the process that wrote the DoH policy value, and is that launch chain expected?
  context: |
    The writer's origin separates policy machinery from hands-on modification. Group-policy
    processing writes through service host chains started by the service control manager;
    installers write under msiexec.exe or a setup executable; regedit.exe applied interactively
    reflects an admin at the keyboard. A reg.exe or powershell.exe writer spawned from a script
    host, an Office application, or another unexpected parent points to scripted tampering — trace
    the parent and, if needed, the grandparent to establish how the writer was launched.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this browser policy change covered by a change ticket or documented deployment?
  context: |
    DoH policy is the kind of setting organizations roll out deliberately — via a browser-policy
    baseline update, a privacy initiative, or a resolver migration — and such changes usually
    leave a change record or fall inside a maintenance window. A matching record closes the alert
    quickly. A policy-grade change with no record, especially on a single host and outside normal
    change windows, deserves the rest of the investigation.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this how browser policy changes are normally made in your environment?
  context: |
    Managed browsers usually receive DoH settings through group policy or enterprise management
    tooling, which writes policy keys from the policy engine under SYSTEM. A write performed by
    reg.exe in a shell, a PowerShell session, or a .reg file import bypasses that channel — it may
    be an admin shortcut, or it may be a change made outside change control to avoid the
    management tooling's audit trail. Compare against how browser configuration is actually
    deployed in your organization.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which browser's DoH policy was written, and what does the value change about DNS visibility?
  context: |
    Decode the key-and-value pair. Edge BuiltInDnsClientEnabled = DWORD 1 turns on the browser's
    built-in DNS client, the prerequisite for DoH; Chrome DnsOverHttpsMode = 'secure' forces
    DoH-only resolution with no fallback to the system resolver; Firefox DNSOverHTTPS Enabled =
    DWORD 1 switches resolution to DoH. In every branch the affected browser stops sending queries
    through the operating-system resolver, so DNS monitoring loses that browser's query names,
    types, and responses. All three keys sit under machine-wide policy paths that endpoint
    management normally owns — the writing process shown alongside the value indicates whether
    policy machinery or ad-hoc tooling made the change.
  range: +/-5m
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command line launched the registry writer, and under which account did it run?
  context: |
    The registry event names the writing image but not its arguments. The full command line
    separates mechanisms — 'reg add' with the policy path, a PowerShell Set-ItemProperty
    invocation, or a regedit.exe /s import of a .reg file each show a direct scripted or manual
    change, while policy and management engines run with service-style command lines under SYSTEM.
    Note the account context: these are HKLM policy paths, so a write attributed to a standard
    user implies elevation was obtained beforehand.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- question: Was the DoH policy value modified again after the alert, or does the setting remain in effect?
  context: |
    Managed policy keys are rewritten at each policy refresh. A subsequent write restoring the
    previous value shows central management self-corrected — and identifies which engine owns the
    key. No further writes means the DoH setting persists and the browser's resolution stays
    outside DNS telemetry. Key or value deletions are not directly observable in endpoint registry
    telemetry, so judge persistence from this re-modification history and from whether the host
    began reaching DoH resolvers, not from the key's absence.
  range: +24h
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were DoH policy values for the other browsers also modified on this host?
  context: |
    An operator hiding DNS activity cannot know which browser the host uses, so scripted tampering
    often sets the Edge, Chrome, and Firefox policies together. This sweeps the host's registry
    events for all three DoH policy paths — multiple browser families changed in one session
    points to deliberate DNS-visibility tampering, while a single value written by that browser's
    own management tooling reads as configuration.
  range: +/-24h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|endswith:
          - '\SOFTWARE\Policies\Microsoft\Edge\BuiltInDnsClientEnabled'
          - '\SOFTWARE\Google\Chrome\DnsOverHttpsMode'
          - '\SOFTWARE\Policies\Mozilla\Firefox\DNSOverHTTPS\Enabled'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: |
    DNS-visibility tampering rarely travels alone — the same session may adjust proxy settings,
    disable security telemetry, or add Run-key persistence. The triggering DoH key will appear in
    these results; the signal is what else changed. Watch for the same writing process touching
    multiple security-relevant paths (Run, Services, Policies, Winlogon), which indicates a
    hands-on session or an installer-style implant rather than an isolated preference change.
  range: +/-30m
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the policy take effect — is this host now resolving known DoH provider domains?
  context: |
    Before a browser can reach a DoH endpoint it typically resolves the provider's hostname once
    through ordinary DNS, so lookups for common provider domains (chrome.cloudflare-dns.com,
    mozilla.cloudflare-dns.com, dns.google, dns.quad9.net, doh.opendns.com) are the observable
    trace that the setting is active. Note the querying process: provider lookups from the
    affected browser confirm the policy took effect — and after that bootstrap, the browser's
    individual queries move inside TLS and out of DNS telemetry, so treat subsequent quiet DNS
    from that browser as the expected consequence, not as absence of activity.
  range: +4h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|contains:
          - 'cloudflare-dns.com'
          - 'dns.google'
          - 'dns.quad9.net'
          - 'doh.opendns.com'
          - 'nextdns.io'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other process activity occurred on this host around the time of the policy write?
  context: |
    Surveying the surrounding window shows what led to the change and what followed — a software
    deployment run, an interactive admin session, or execution and staging activity consistent
    with an intrusion. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts; those novel pairs are
    what to scan for.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this DoH policy key been modified before on this host?
  context: |
    A policy-managed key shows a rhythm of identical writes from the policy engine at each
    refresh; zero history means the value never existed here and this write introduced DoH for the
    first time. Compare historical Details values and writing images against the alerting write —
    a first-time appearance written by a shell utility is the pattern worth pursuing, while a long
    history of the same value from management tooling reads as routine.
  range: -90d
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed the write?
  context: |
    The writing image has its own history — a browser or policy service host that runs constantly
    is expected, while reg.exe, powershell.exe, or an unfamiliar or unsigned utility appearing for
    the first time in ninety days points to tooling brought in for the change. Zero or very low
    counts indicate first-time or rare execution of the writer on this host.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same DoH policy key modified on other hosts in the environment?
  context: |
    The same value landing on many hosts in the same window is the profile of a group-policy or
    management rollout, confirmable against change records. A single modified host is a local or
    targeted change. Compare Details values and writing images across hosts — identical values
    written by policy machinery differ from ad-hoc writes by shell tools on scattered hosts, which
    would suggest the same actor touching multiple systems.
  range: -24h
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were persistence mechanisms installed on this host around the policy change?
  context: |
    Hiding DNS resolution mostly benefits tooling that is already resident or about to be — an
    operator who tampers with DNS visibility has usually installed a foothold as well. Sweep the
    surrounding hours for scheduled-task, service, registry, BITS, and WMI tool executions;
    persistence tooling clustered around a defense-evasion change indicates stacked objectives
    rather than routine administration.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier alerts on the same host — initial execution, defense tampering, credential access —
    reveal the stages that preceded the DNS-visibility change and help order the timeline. A DoH
    enablement that follows other defense-evasion or execution detections reads very differently
    from one appearing in isolation during a deployment window.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
