name: Potential Exploitation of RCE Vulnerability CVE-2025-33053 - Image Load
id: 4c7c959b-34e3-4a6e-9b2e-6b06afc7da31
description: |
  Detects a process running from a WebDAV DavWWWRoot path under a Windows system-binary name
  (route.exe, netsh.exe, makecab.exe, dxdiag.exe, ipconfig.exe, explorer.exe) loading a module —
  the execution pattern of CVE-2025-33053, where a malicious Internet Shortcut (.url) launches a
  built-in diagnostic utility with its working directory pointed at an attacker WebDAV server, so
  the utility's helper tools resolve to attacker binaries on the share (T1105, T1218). System
  utilities have no routine reason to execute from DavWWWRoot paths, so the investigation
  establishes how the binary was launched, what delivered the shortcut, which modules resolved
  from the share, and what the process spawned, wrote, and connected to afterward.
type: detection
detection_id: 04fc4b22-91a6-495a-879d-0144fec5ec03
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loading process match what this rule detects, a system-binary name executing from a WebDAV DavWWWRoot path?
  context: |
    Confirm the alert from the loading process path (Image), not the module name. The rule fires
    when a process whose image path starts with a UNC prefix and contains \DavWWWRoot\ — and whose
    name ends in route.exe, netsh.exe, makecab.exe, dxdiag.exe, ipconfig.exe, or explorer.exe —
    loads a module. The loaded DLL itself is usually an ordinary system library; the WebDAV image
    path of the process is what makes the event matter. The server name embedded in that UNC path
    identifies the hosting infrastructure.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this user or host expected to execute programs directly from a WebDAV share?
  context: |
    Some environments mount WebDAV for document access, but executing binaries — let alone
    system-utility names like route.exe or ipconfig.exe — from a DavWWWRoot path is not a normal
    administrative or user workflow. If no sanctioned tool on this host is known to stage
    executables over WebDAV, treat the alert as delivery of an external binary rather than a
    policy oddity.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process launched this binary from the WebDAV share, and is that launcher itself legitimate?
  context: |
    In the CVE-2025-33053 chain, a .url shortcut points at a legitimate signed utility (such as
    iediagcmd.exe under Program Files) while setting the working directory to the attacker's
    WebDAV server; the utility then launches its helper tools, which resolve to the attacker's
    binaries on the share. A signed diagnostic utility or explorer.exe as parent fits that
    redirection pattern — the parent's own command line and path show whether it was started from
    a shortcut. Known-good updaters that legitimately fetch remote content do not launch children
    from DavWWWRoot paths.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was an Internet Shortcut (.url) file written to this host shortly before the alert?
  context: |
    The exploit arrives as a .url file whose target and working directory drive the WebDAV
    execution. A .url written to an email attachment cache, Downloads, or Temp in the hour before
    the alert identifies the delivery vector, and the writing process (mail client, browser,
    archive extractor) tells you how it reached the user. Recover the shortcut file if present —
    its URL and WorkingDirectory lines name the attacker server directly.
  range: -1h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.url'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command line and working directory did the WebDAV-hosted binary run with?
  context: |
    The process creation record for this binary shows the arguments the launcher passed and,
    decisively, the working directory — for this exploit pattern the working directory is the
    WebDAV share itself. Note any URLs, share paths, or file arguments in the command line; the
    UNC server name in the image path and working directory is the pivot value for the egress and
    fleet questions.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What modules did the WebDAV-hosted process load, and did any resolve from the share instead of a system path?
  context: |
    A binary executing from a WebDAV working directory can pull system-named DLLs (gdi32.dll,
    netapi32.dll, and similar) from that directory instead of System32 — any ImageLoaded path
    under a DavWWWRoot share is attacker-supplied by construction. A sparse or odd load list also
    matters: loaders that manually map kernel32.dll and ntdll.dll for anti-analysis leave fewer
    load events than a normal utility would.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For each module this process loaded, what is its signing status, hash, and threat-intel reputation?
  context: |
    Genuine Windows libraries are Microsoft-signed and load from system paths; a system-named DLL
    that is Unsigned, Expired, or Invalid — or signed by an unexpected subject — is a planted
    substitute. The Hashes value supports reputation lookups for known loader families. The
    executable's own hash is recorded on its process-creation event; pivot there to check the
    WebDAV-hosted binary itself against threat intelligence.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What child processes did the WebDAV-hosted binary spawn afterward?
  context: |
    Loaders delivered this way typically open a decoy document through cmd.exe while decrypting
    and executing the real payload. Children launched from user-writable paths, script hosts,
    or further command shells are the follow-on stages; their command lines show what the payload
    did first.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did this process or its children write, and are any still on disk?
  context: |
    Payloads in this pattern commonly drop a decoy document to Temp and stage further executables
    under user-writable paths such as C:\Users\Public or AppData. Files written by the alerting
    process and its direct children identify those artifacts; if still on disk, preserve copies
    and capture hashes for analysis. This view covers the process and its direct children, not
    later unrelated writers.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a payload was executed, what is its hash, and is it known to threat intelligence?
  context: |
    The hash needed for a reputation lookup is recorded when a payload runs, not when it is
    written. This view returns the children of the alerting process and its siblings under the
    same launcher — relevant here because the diagnostic-utility parent starts several helper
    tools side by side, so a second attacker binary may appear as a sibling rather than a child.
    If the payload ran later under an unrelated parent, retrieve the file surfaced by the
    file-write question and hash it manually.
  range: +1h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: Did this process initiate outbound network connections?
  context: |
    Direct connections from the WebDAV-hosted process point to second-stage retrieval or
    command-and-control. Note that the WebDAV file transfer itself usually rides the WebClient
    service rather than this process, so also check host egress to the server named in the UNC
    path. External destinations matter far more than internal ones here — an internal WebDAV
    server changes the finding from external delivery to lateral staging.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did other reconnaissance commands run on this host around the same time?
  context: |
    Implants delivered through this chain typically survey the host — running services, network
    configuration, user context — before tasking. Three or more distinct reconnaissance binaries
    inside a fifteen-minute window is the pattern of automated post-compromise enumeration rather
    than one-off troubleshooting.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Has this host run system-named binaries from WebDAV paths before, and under what programs and users?
  context: |
    The query mirrors the rule's selection scoped to this host, so the result is this host's
    history of the exact firing pattern — not generic use of these binaries. This pattern has
    essentially no routine form, so any prior occurrences either expose an unusual but sanctioned
    workflow worth documenting or show the compromise began earlier than this alert.
  range: -14d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img_path:
        Image|startswith: \\\\
        Image|contains: \DavWWWRoot\
      selection_img_bin:
        Image|endswith:
        - \route.exe
        - \netsh.exe
        - \makecab.exe
        - \dxdiag.exe
        - \ipconfig.exe
        - \explorer.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts run system-named binaries from WebDAV paths in the past week?
  context: |
    The query mirrors the rule's selection with no host scope, giving the fleet-wide count of the
    firing pattern. Multiple hosts firing within the same window points at a distributed shortcut
    delivery reaching several recipients; a single host with no fleet history points at targeted
    delivery. Compare the UNC server names across hosts — a shared server ties the fires to one
    operation.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img_path:
        Image|startswith: \\\\
        Image|contains: \DavWWWRoot\
      selection_img_bin:
        Image|endswith:
        - \route.exe
        - \netsh.exe
        - \makecab.exe
        - \dxdiag.exe
        - \ipconfig.exe
        - \explorer.exe
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding sequence — the
    shortcut open before the fire, script or shell activity after it. Novel low-count pairs stand
    out against repetitive agent noise and help place the WebDAV execution inside the larger
    timeline.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — attachment or archive handling, script-host launches, LOLBin activity —
    may capture the delivery stages that preceded the WebDAV execution and help reconstruct the
    timeline from shortcut arrival to payload launch.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
