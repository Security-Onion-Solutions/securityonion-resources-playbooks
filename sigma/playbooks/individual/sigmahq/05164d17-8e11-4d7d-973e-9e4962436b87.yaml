name: ScreenConnect - SlashAndGrab Exploitation Indicators
id: 0f52c486-d1d6-4693-a8ae-1c7f5437da29
description: |
  Detects file creation at paths tied to post-exploitation of the ScreenConnect
  authentication-bypass and path-traversal vulnerabilities (CVE-2024-1709 and
  CVE-2024-1708), in which attackers used newly created administrative sessions to push
  payloads onto hosts through the ScreenConnect service. The rule fires when either
  LB3.exe is written under C:\Windows\Temp\ScreenConnect\, or one of a fixed set of
  observed artifact paths is written; the artifacts map to distinct payload classes,
  including ransomware built with a leaked LockBit 3.0 builder (LB3.exe), MSI-packaged
  ransomware persisted via the Startup folder (mpyutd.msi, 1.msi), a Cobalt Strike beacon
  staged as update.dat, coin miners masquerading as security-product binaries
  (SentinelUI.exe, SentinelAgentCore.dll), secondary remote-access implants (ta.exe,
  spsrv.exe), a WMI-persistence PowerShell stage (RunSchedulerTaskOnce.ps1), and a decoy
  svchost.exe in Windows\Temp. The investigation should confirm which artifact was
  written, trace the writing process back to ScreenConnect components, determine whether
  the payload executed, and sweep the host for companion artifacts and related
  detections.
type: detection
detection_id: 05164d17-8e11-4d7d-973e-9e4962436b87
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file path match one of the known ScreenConnect post-exploitation artifact paths this rule detects?
  context: |
    Confirm the alert from the exact file path, the operation performed, and the
    responsible process. The rule matches either LB3.exe written under
    C:\Windows\Temp\ScreenConnect\, or one of a fixed set of paths observed after
    ScreenConnect auth-bypass exploitation: C:\mpyutd.msi,
    C:\perflogs\RunSchedulerTaskOnce.ps1, C:\ProgramData\1.msi, a Startup-folder copy of
    mpyutd.msi, C:\ProgramData\update.dat, a MilsoftConnect\Files\ta.exe path,
    C:\Windows\Help\Help\SentinelAgentCore.dll or SentinelUI.exe, C:\Windows\spsrv.exe,
    and C:\Windows\Temp\svchost.exe. Note which artifact matched — each maps to a
    different payload class (ransomware, beacon, miner, secondary remote-access implant,
    persistence script) and steers the rest of the investigation.
  range: +/-5m
  answer_sources:
  - alert
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is ScreenConnect legitimately deployed on this host, and would any sanctioned process write to the alerted path?
  context: |
    Establish whether this host runs a ScreenConnect server or client as part of approved
    remote support, and whether the writing process and account fit that deployment. None
    of the watched paths are produced by routine ScreenConnect operation — they were
    payload staging locations — so even where the product is sanctioned, the write itself
    needs explanation. When the user is a machine or service account, judge by the
    writing process and the host's role instead.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this activity part of an authorized penetration test or red team engagement?
  context: |
    The paths this rule watches are published exploitation indicators, and adversary
    simulation teams replay them when validating detection coverage for the ScreenConnect
    auth-bypass. Before investing further effort, check whether a pentest or red team
    exercise is active on this host or network segment and whether its timing and scope
    match the alert. An authorized engagement with matching activity resolves the alert
    without further analysis.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is there a helpdesk ticket or approved support session that explains ScreenConnect activity on this host at this time?
  context: |
    Legitimate ScreenConnect use correlates with an active support ticket, a maintenance
    window, or a user request. Exploitation of the auth-bypass creates administrative
    sessions outside any ticketed work — review the ScreenConnect session and audit
    records for who connected, from where, and under which account, and match that
    against support records. A session with no support context, from an unfamiliar
    operator account, fits the exploitation pattern.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: |
    The file's post-alert lifecycle drives urgency and next steps. A payload still on
    disk can be retrieved, hashed, and analyzed; a file deleted shortly after creation
    points to anti-forensic cleanup, endpoint protection quarantine, or a self-deleting
    dropper — actors in this exploitation pattern deleted payloads before they could be
    collected for analysis. Interpret each returned event by its EventType to reconstruct
    creation, rename, and deletion order.
  range: +4h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What command delivered this artifact, and what download or install operation does it show?
  context: |
    The writing process's command line reveals the delivery method. In this exploitation
    pattern, payloads arrived via certutil and curl downloads (some fetching binaries
    renamed to image extensions to evade filtering), PowerShell Invoke-WebRequest
    cradles, and msiexec installing remote MSI packages from plain HTTP endpoints. Decode
    any URLs, IP:port sources, and flags in the command — the download source feeds the
    egress question and threat-intel lookups.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the file's content confirm the payload its name and path suggest?
  context: |
    Several of the watched names are deliberate masquerades — SentinelUI.exe and
    SentinelAgentCore.dll imitate a security product but carried a coin miner,
    svchost.exe in Windows\Temp imitates the OS binary, and update.dat was a Cobalt
    Strike beacon renamed from a document extension. Retrieve the file and check size,
    signing status, imports, and embedded strings; for RunSchedulerTaskOnce.ps1, read the
    script for a driver.dll download and WMI event-consumer registration; for the MSI
    artifacts, inspect the package contents. Compare findings against threat
    intelligence to confirm or refute the suspected payload class.
  range: +/-5m
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has the dropped artifact executed, and if so what is its hash and threat-intel reputation?
  context: |
    A file's hash is recorded when it runs, not when it is written. The first branch of
    this query finds the artifact launching as a process; the second finds it invoked by
    name on another process's command line, which covers the MSI packages run through
    msiexec, the PowerShell stage run through powershell.exe, and the DLL component,
    which loads into a host process rather than executing directly. Submit any recovered
    hash to threat-intel services to determine whether it is known malicious. If the
    artifact is present but has not executed, retrieve it from disk and hash it manually.
  range: +4h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_image:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      selection_cli:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What processes did ScreenConnect components spawn on this host around the alert?
  context: |
    After the auth-bypass creates an administrative session, commands run on the endpoint
    as children of ScreenConnect binaries — typically cmd.exe, powershell.exe, msiexec.exe,
    or certutil.exe performing the download and write. Children of ScreenConnect that
    fetch files, add users, modify defenses, or clear logs establish the exploitation
    chain; a technician's sanctioned session also spawns children, so judge by what the
    commands actually did. Cross-check whether the process that wrote the alerted file
    appears in this lineage.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: '\ScreenConnect'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other files did the responsible process or its children write or delete around the alert?
  context: |
    A process that drops one payload in this pattern often drops several — an installer
    unpacking components, a stage pulling configuration files, or ransomware beginning to
    touch large numbers of paths. The breadth, locations, and extensions of the writer's
    other file activity distinguish a single artifact from an operation in progress and
    enumerate what else needs review and preservation.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written recently to the staging directories this rule watches, and by which processes?
  context: |
    The rule's artifact locations — the ScreenConnect temp directory under Windows\Temp,
    the fake help directory under Windows\Help, C:\perflogs, and the all-users Startup
    folder — each have a small set of processes that legitimately write there. Other
    recent arrivals in the same directories reveal whether this is an isolated drop or a
    location under active use, and which additional artifacts belong to the same
    activity. A single unfamiliar writer across many files is the signal to chase.
  range: -7d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Windows\Temp\'
          - '\Windows\Help\Help\'
          - '\perflogs\'
          - '\Programs\Startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Are other known artifacts from this exploitation pattern present on this host?
  context: |
    Intrusions following the ScreenConnect auth-bypass frequently dropped several of
    these artifacts in sequence — a downloader stage, a persistence script, and a payload
    — so one match makes the rest of the list worth sweeping directly. Also check
    manually for companions that fall outside the rule's paths: driver.dll fetched by the
    PowerShell stage, a WMI event consumer named System__Cmr, secondary remote-support
    agents under unusual user-document paths, and newly created local administrator
    accounts.
  range: +/-24h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Windows\Temp\ScreenConnect\'
          - 'C:\mpyutd.msi'
          - '\perflogs\RunSchedulerTaskOnce.ps1'
          - 'C:\ProgramData\1.msi'
          - '\Programs\Startup\mpyutd.msi'
          - 'C:\ProgramData\update.dat'
          - '\MilsoftConnect\Files\ta.exe'
          - '\Windows\Help\Help\SentinelAgentCore.dll'
          - '\Windows\Help\Help\SentinelUI.exe'
          - 'C:\Windows\spsrv.exe'
          - '\Windows\Temp\svchost.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What external endpoints did the writing process connect to around the file drop?
  context: |
    Payload retrieval in this pattern used plain HTTP to numeric IP:port endpoints and
    file-sharing services, and the staged implants called back to attacker-controlled
    servers rather than vendor infrastructure. Outbound connections from the writing
    process bracket the download source and any immediate callback. The destination
    hostname is often absent on endpoint network telemetry — pivot on the IP for
    reputation and cross-host searches.
  range: +/-15m
  answer_sources:
  - network_connection
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- always_include: true
  question: Has this user previously produced the rule's file-drop pattern, and does that history fit their role?
  context: |
    The query mirrors the rule's selection structure scoped to this user — the result is
    the user's 90-day history of writes matching the rule's specific artifact paths, not
    generic file activity, aggregated by host. For paths that only appear during
    exploitation, any prior history is itself worth explaining; weigh the count against
    the user's role and whether they administer remote-support tooling.
  range: -90d
  answer_sources:
  - file_event
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains|all:
        - C:\Windows\Temp\ScreenConnect\
        - \LB3.exe
      - TargetFilename|contains:
        - C:\mpyutd.msi
        - C:\perflogs\RunSchedulerTaskOnce.ps1
        - C:\ProgramData\1.msi
        - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\mpyutd.msi
        - C:\ProgramData\update.dat
        - C:\Users\oldadmin\Documents\MilsoftConnect\Files\ta.exe
        - C:\Windows\Help\Help\SentinelAgentCore.dll
        - C:\Windows\Help\Help\SentinelUI.exe
        - C:\Windows\spsrv.exe
        - C:\Windows\Temp\svchost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: |
    When the alert fires under a service principal, user identity does not attribute
    behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule's
    selection structure scoped to the alerting program, so the result is the
    90-day history of this program driving this specific pattern, not generic program
    co-occurrence. A new or rare program for this pattern is the deviation worth chasing;
    a program that already accounts for many prior events points to automation that
    should still be verified against the sanctioned deployment.
  range: -90d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains|all:
        - C:\Windows\Temp\ScreenConnect\
        - \LB3.exe
      - TargetFilename|contains:
        - C:\mpyutd.msi
        - C:\perflogs\RunSchedulerTaskOnce.ps1
        - C:\ProgramData\1.msi
        - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\mpyutd.msi
        - C:\ProgramData\update.dat
        - C:\Users\oldadmin\Documents\MilsoftConnect\Files\ta.exe
        - C:\Windows\Help\Help\SentinelAgentCore.dll
        - C:\Windows\Help\Help\SentinelUI.exe
        - C:\Windows\spsrv.exe
        - C:\Windows\Temp\svchost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: |
    Actors exploiting the ScreenConnect vulnerability moved from initial payload drops to
    account creation and lateral activity, and the same operator account often appeared
    across multiple endpoints. Tracking this account's process activity across all hosts
    in the surrounding window reveals whether the scope is larger than this one machine.
    When the account is SYSTEM or another service principal, this view fills with agent
    noise — the parent-driven fleet question is the meaningful complement.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window — i.e., is this a coordinated automation rollout, or is the activity isolated to this host?
  context: |
    Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism
    fired elsewhere: the query mirrors the rule's selection structure scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts writing
    these artifact paths in the same window points to the exploitation being worked
    across the fleet or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains|all:
        - C:\Windows\Temp\ScreenConnect\
        - \LB3.exe
      - TargetFilename|contains:
        - C:\mpyutd.msi
        - C:\perflogs\RunSchedulerTaskOnce.ps1
        - C:\ProgramData\1.msi
        - C:\ProgramData\Microsoft\Windows\Start Menu\Programs\Startup\mpyutd.msi
        - C:\ProgramData\update.dat
        - C:\Users\oldadmin\Documents\MilsoftConnect\Files\ta.exe
        - C:\Windows\Help\Help\SentinelAgentCore.dll
        - C:\Windows\Help\Help\SentinelUI.exe
        - C:\Windows\spsrv.exe
        - C:\Windows\Temp\svchost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Exploitation of the ScreenConnect vulnerability produces a sequence of detectable
    stages before payloads land — unexpected administrative session creation, defense
    tampering such as exclusion changes or real-time protection disablement, new local
    user creation, and log clearing with wevtutil. Earlier alerts on this host help
    reconstruct the timeline and establish whether this file drop is the first observed
    stage or a mid-chain step.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
