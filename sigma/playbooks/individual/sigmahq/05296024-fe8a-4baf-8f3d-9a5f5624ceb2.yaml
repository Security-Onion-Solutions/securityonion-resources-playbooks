name: Malicious Driver Load
id: bc20cc45-67d0-4fdf-8a41-f3e246719249
description: |
  Detects a kernel driver loading whose hash matches an entry in a catalogue of drivers documented as attacker-supplied
  tooling or as legitimately signed drivers with kernel primitives that are loaded deliberately to disable endpoint
  defenses or escalate privileges. The rule fires on the Hashes field of the driver load event, matching MD5, SHA1,
  SHA256, or IMPHASH values, so the driver's filename and on-disk path are irrelevant to the match — attackers rename
  these files routinely. A driver reaches the kernel through a service registration, so establish which hash type
  matched and what the file is, what service and registry entries were created to load it, what process wrote the file
  and installed the service, and whether privileged behavior, defense tampering, or other persistence followed the load.
type: detection
detection_id: 05296024-fe8a-4baf-8f3d-9a5f5624ceb2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the loaded driver's hash match one of the known-bad driver hashes this rule detects, and which hash type matched?
  context: The rule matches the load event's Hashes field against a list of MD5, SHA1, SHA256, and IMPHASH values for
    drivers catalogued as attacker tooling or as abusable signed drivers. Confirm which value matched, because the hash
    type changes how much the match proves. An MD5, SHA1, or SHA256 match identifies the exact file. An IMPHASH match
    identifies only the import table, which is shared across every build compiled from the same imports and can collide
    with an unrelated driver, so an IMPHASH-only match needs the file's full hash confirmed before it is treated as the
    catalogued driver.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
- question: Is this host expected to load third-party kernel drivers, and does any installed software account for this one?
  context: Driver loads run in kernel context under the service control manager, so the user recorded on the event is
    typically SYSTEM and carries no attribution value — the useful judgment is about the host. Endpoint agents, storage
    and virtualization tooling, hardware utilities, VPN clients, and anti-cheat software all install drivers legitimately,
    and some of those same drivers appear in known-bad catalogues because of the kernel access they expose. Determine
    whether this host's role and installed software inventory account for a driver of this kind, or whether the load has
    no matching product.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - host.name
      - User
- question: What driver file loaded, from what path, and what signing status does it carry?
  context: The load event names the file and its signer, which is what separates a driver that is attacker-built code
    from a legitimately signed vendor driver loaded for the kernel access it provides. Drivers loading from
    %SystemRoot%\System32\drivers\ with a valid signature from a recognized hardware or software vendor are the routine
    case; a load from C:\Users\, C:\Windows\Temp\, C:\ProgramData\, or another user-writable directory is not, regardless
    of signature. A valid signature does not clear the file here — signed drivers with documented arbitrary memory access,
    model-specific register access, or process-termination primitives are loaded intact and abused through their own
    interface, so the load itself is the event of interest even when the signature is genuine. Unsigned, expired,
    distrusted, or invalid status on a driver points to attacker-supplied code or a tampered file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What is the driver's reputation, and is it catalogued as attacker tooling or as an abusable signed driver?
  context: Driver loads carry the file's hash on the load event itself, so the reputation pivot needs no execution
    lookup. Take the SHA256 to a reputation service and to public known-bad driver catalogues, and classify the result.
    A file catalogued as attacker tooling means the driver is itself the payload and the host should be treated as
    compromised. A file catalogued as an abusable signed driver means a legitimate vendor binary was loaded for its
    kernel primitive, which commonly precedes endpoint-agent termination, credential access, or privilege escalation —
    the driver name in that case is frequently randomized or changed to impersonate an unrelated product, so trust the
    hash over the filename. Absence from a catalogue does not clear the driver; newly abused drivers are added
    continuously, and some catalogued entries carry no recovered hash at all.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
      - ImageLoaded
- question: What kernel service was installed to load this driver, and what binary path and account does it use?
  context: A driver cannot reach the kernel without a service registration, so the service install event is the
    installation record for this load. The structured fields name the service, the driver path it points at, its start
    type, and the account it runs under — a kernel driver service starting automatically is loaded at every boot, while
    a demand-start service was loaded deliberately by whatever called it. Service names that imitate a legitimate product
    or that look machine-generated, and image paths outside %SystemRoot%\System32\drivers\, are the entries worth
    expanding. If no install event appears in this window, the service was registered earlier than the load — establish
    that from the service key's own modification history instead, and treat a load with no recent install as an existing
    registration that was started rather than a fresh one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: What service registry entries were written under CurrentControlSet\Services on this host around the load?
  context: Service registration is a registry operation, and the values written there are the durable record of how the
    driver is loaded — ImagePath points at the .sys file, Start controls whether it loads at boot (a value of 0 or 1
    means the driver loads before or with the operating system), and Type identifies it as a kernel driver rather than a
    user-mode service. Writes to these keys can also install a driver without any service-install tooling running, which
    is why this view is checked independently of the service install record. A Start value changed on an existing service
    key, rather than a new key created, means an already-registered driver was reconfigured to load — the writing process
    on those events identifies what made the change.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process loaded this driver, and what launched it?
  context: Driver loads are frequently initiated by the service control manager or by the kernel at boot, so the load
    event may carry no usable process attribution — a result with no process fields is expected for a boot-time load and
    is not itself a finding. Where a loading process does resolve, its own start event names the parent that launched it.
    Service management tools and driver-install utilities run legitimately from deployment and installer processes;
    the same tools launched from a script host, an Office application, a browser child, or a binary in a user-writable
    directory point to an installation performed by an intrusion rather than by software management.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the driver's service still installed and running, and is the driver still loaded in the kernel?
  context: A load event records that the driver reached the kernel at that moment, not that it is still there. Query the
    service state and the loaded-driver list on the host directly to establish whether the registration persists and
    whether the driver is currently resident. A driver that is loaded and whose service is set to start automatically
    survives reboot; one that was loaded and immediately unloaded is consistent with tooling that loads a driver only
    long enough to use its kernel primitive and then removes it, which leaves the service key behind as the remaining
    artifact. The service state and the loaded-driver list are read from the host or the endpoint console directly, not
    from this query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a driver file written to this host's disk around the load, and what process wrote it?
  context: The write that placed the .sys file identifies how the driver arrived and who brought it. A driver dropped by
    an installer or a software-deployment agent into %SystemRoot%\System32\drivers\ is the routine pattern; one written
    by an archive extractor, a script host, a browser child, or an unfamiliar binary into C:\Users\, C:\Windows\Temp\, or
    C:\ProgramData\ points to staging by an intrusion. File-write events carry no hash, so match the write to the load by
    filename and path and take the hash from the load event. A load with no corresponding write in the window means the
    file predates it — check its earlier write history before concluding the driver was already present legitimately.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.sys'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the Security log record a service installation or special-privilege assignment on this host around the load?
  context: Loading a driver to obtain kernel access is the step before the access is used, so the window around the load
    is where the follow-on privileged behavior appears. Event 4697 records a service installation with the service name
    and its file path, corroborating the driver's registration from a second channel. Event 4672 records privileged
    tokens being assigned at logon; it is emitted for every SYSTEM and administrative logon and is high volume by nature,
    so read it for accounts that do not normally receive these privileges on this host rather than for volume. If the
    Security channel is not collected in this environment, zero results is a visibility gap rather than evidence that
    nothing occurred.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4697
          - 4672
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
      - ServiceName
      - ServiceFileName
- question: Does the timing of this driver load align with a boot, a software deployment, or a maintenance window?
  context: When a driver loads is as informative as which one loaded. A load in the seconds after a host boots reflects
    an already-registered auto-start service and points the investigation at when that registration was made, not at the
    load itself. A load mid-session, with no deployment or installation activity around it, means something on the host
    installed and started a driver during normal operation — correlate it with change records, deployment schedules, and
    anything the user or administrator was doing at that time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has a driver with this filename loaded on this host before, and always with the same hash and signer?
  context: A driver name loading for the first time on this host supports a fresh installation. History is not by itself
    reassuring, because these files are renamed freely — the useful comparison is whether the hash and signer behind
    the name have stayed constant. The same driver filename loading for months under one signer and hash, then loading
    with a different hash, means the file behind an established name was replaced. A driver present since the host was
    built and consistent throughout is the routine result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
- question: Is this driver loading on other hosts in the environment?
  context: The same driver loading across several hosts distinguishes a localized event from something distributed —
    which can mean either an intrusion moving between systems or a software package deployed to a group of machines.
    Compare the signer and hash on each host and the pattern of load times — hosts loading it within a narrow window
    around a deployment, all with the same hash and signer, look like distribution by software management, while loads
    scattered across time on hosts with no common software profile do not.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Signature
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around a driver load hold whatever installed it and whatever used it. The aggregated parent-child
    view collapses repetitive agent telemetry into high-count rows so that novel low-count pairs stand out — driver
    install utilities, service control commands, archive extractors, script hosts, or an unfamiliar binary appearing once
    or twice in the window are the rows to expand. Endpoint agent and security tool processes stopping in this window are
    also relevant, because kernel access is commonly obtained to terminate them.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: A driver load is rarely the first stage of an intrusion — the actor needs administrative access before a
    driver can be registered at all. Earlier detections on the same host covering credential access, privilege
    escalation, remote execution, or a delivery chain identify how that access was obtained and when the host was first
    affected, which sets the true starting point of the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around this activity?
  context: A kernel service is one persistence surface, and actors who reach the point of loading a driver commonly hold
    others. Service control activity in this window is directly relevant because the driver's own registration may appear
    here, but the view also surfaces scheduled tasks, registry Run key writes, and management-tool persistence installed
    alongside it. Grouped tool-plus-command rows show which mechanisms were touched; several landing in the same window
    indicates deliberate stacking rather than a single administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence leaves no command line to detect. An executable or script written into a Startup
    folder, or a scheduled-task XML written directly under the Windows task directories, establishes a foothold without
    any persistence tool running. These drops are a distinct mechanism from the kernel service that loaded the driver,
    and their presence in the same window shows the actor placed a user-mode component alongside the kernel one — the
    writing process on those events links the two together.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
