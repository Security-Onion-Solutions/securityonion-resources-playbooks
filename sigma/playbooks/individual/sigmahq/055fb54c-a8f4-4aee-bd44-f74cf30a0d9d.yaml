name: HackTool - SharpMove Tool Execution
id: 20343eb8-570d-403c-9174-159472a8e096
description: |
  Detects execution of SharpMove, a .NET utility for authenticated remote execution that performs lateral movement
  over WMI, including remote service creation or binary-path modification, scheduled task creation, DCOM invocation,
  and VBScript execution. The rule fires when EITHER the binary is identified by its name or PE original filename,
  OR the command line carries BOTH a computername= target AND one of the action= verbs (create,
  dcom, executevbs, hijackdcom, modschtask, modsvc, query, scm, startservice, taskscheduler). Legitimate use is
  effectively limited to authorized red-team or penetration-test engagements; outside that, the execution indicates
  an operator attempting authenticated remote execution against another host. Investigation should confirm which
  branch fired, decode the action and target, identify who and what launched it, and determine whether remote
  execution reached the named target host.
type: detection
detection_id: 055fb54c-a8f4-4aee-bd44-f74cf30a0d9d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did this alert fire on the SharpMove binary name, or on a command line carrying both a computername= target and an action= verb?
  context: >-
    The rule matches when EITHER the image name or PE original filename is SharpMove.exe, OR the command line contains BOTH computername= AND one of the action= verbs (create, dcom, executevbs, hijackdcom,
    modschtask, modsvc, query, scm, startservice, taskscheduler). Confirm which branch fired by reviewing the exact
    Image, OriginalFileName, and CommandLine. Note the branch: a name-only match without a computername= target or an
    action= verb may be a renamed or staged binary, while an action= or computername= match identifies the specific
    remote-execution operation and the named target host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run authenticated remote-execution tooling against other systems?
  context: >-
    SharpMove performs remote service, task, DCOM, and WMI execution against a named target host. Knowing whether this
    user account and originating host normally perform administrative remote execution against other systems is often
    the fastest way to separate authorized administration or testing from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharpMove execution part of an authorized penetration test or red team engagement?
  context: >-
    SharpMove is an offensive lateral-movement utility used in authorized security assessments. Before investing
    investigation time, check whether a penetration test or red team exercise is currently active on this host or
    network segment. An authorized engagement with matching tool usage, source host, and timing resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What action and target did this SharpMove invocation specify? Decode the action= verb, computername= target, and command= payload.
  context: >-
    The full command line reveals the operation. Decode the action= verb to identify the remote-execution method
    (create or modsvc for service binary-path change, modschtask or taskscheduler for scheduled tasks, dcom or
    hijackdcom for DCOM, executevbs for WMI VBScript, scm or startservice for service control, query for WMI
    reconnaissance), the computername= value for the targeted remote host, and the command= value for the payload
    executed on that host. An amsi=true flag signals an attempt to bypass in-process scanning. Multiple sequential
    SharpMove invocations on this host within the window may together form one logical remote-execution chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which remote-execution capability of SharpMove was invoked?
  context: >-
    SharpMove is multi-purpose. The action= verb determines the scope of potential compromise on the target host and
    the required response. Service-modification verbs (modsvc, create, scm) change or create a service binary path so
    a payload runs as the service account; task verbs (modschtask, taskscheduler) install or alter scheduled tasks;
    dcom and hijackdcom invoke or hijack DCOM objects; executevbs runs VBScript via WMI; query performs WMI process
    reconnaissance. Identify the verb to scope what executed remotely.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned SharpMove, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. An interactive shell or a remote-access parent chain points
    to hands-on-keyboard operation, while a script host, Office application, or service parent may indicate the tool
    was staged by earlier activity. Walking up to the parent of the parent helps reconstruct how the operator reached
    this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even sanctioned tooling can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has historically run here, not
    generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharpMove.exe
      - OriginalFileName: SharpMove.exe
      selection_cli_computer:
        CommandLine|contains: computername=
      selection_cli_actions:
        CommandLine|contains:
        - action=create
        - action=dcom
        - action=executevbs
        - action=hijackdcom
        - action=modschtask
        - action=modsvc
        - action=query
        - action=scm
        - action=startservice
        - action=taskscheduler
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Around this execution, were there remote logon events on the targeted host showing who authenticated and from where?
  context: >-
    SharpMove authenticates to the named target host to perform remote execution. Logon events on the target reveal the
    authenticating account, the source address, and the logon type (network logons are typical for service, task, and
    WMI execution). Correlate the logon time and account with this execution to confirm remote access reached the
    target and to identify whether the credentials used are expected for that account. If Security logon events are not
    ingested in this environment, treat absence of results as a visibility gap rather than evidence no remote access
    occurred, and pivot to authentication records on the target host directly.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - host.name
      - TargetUserName
      - IpAddress
      - LogonType
- question: What processes were spawned on the targeted host after this remote-execution attempt?
  context: >-
    Remote execution is a means to an end. The verbs SharpMove offers cause a payload to run on the target host as a
    service, scheduled task, DCOM object, or WMI script. Examining processes spawned on the named target shortly after
    this execution reveals what the operator ran there. Service-installed payloads commonly appear under services.exe,
    WMI-launched payloads under WmiPrvSE.exe, and DCOM payloads under the invoked COM server's host process.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account driven lateral-movement tooling against other hosts in the environment?
  context: >-
    Operators rarely stop at one target. If the same account is invoking remote-execution or lateral-movement tools
    across multiple systems, the scope of compromise is larger. A cluster of such activity from one account within a
    short window indicates active lateral movement across the environment rather than an isolated execution.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
          - '\SharpMove.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharpMove.exe
      - OriginalFileName: SharpMove.exe
      selection_cli_computer:
        CommandLine|contains: computername=
      selection_cli_actions:
        CommandLine|contains:
        - action=create
        - action=dcom
        - action=executevbs
        - action=hijackdcom
        - action=modschtask
        - action=modsvc
        - action=query
        - action=scm
        - action=startservice
        - action=taskscheduler
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharpMove.exe
      - OriginalFileName: SharpMove.exe
      selection_cli_computer:
        CommandLine|contains: computername=
      selection_cli_actions:
        CommandLine|contains:
        - action=create
        - action=dcom
        - action=executevbs
        - action=hijackdcom
        - action=modschtask
        - action=modsvc
        - action=query
        - action=scm
        - action=startservice
        - action=taskscheduler
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts in the alert window, the scope of compromise may be larger
    than this single execution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharpMove.exe
      - OriginalFileName: SharpMove.exe
      selection_cli_computer:
        CommandLine|contains: computername=
      selection_cli_actions:
        CommandLine|contains:
        - action=create
        - action=dcom
        - action=executevbs
        - action=hijackdcom
        - action=modschtask
        - action=modsvc
        - action=query
        - action=scm
        - action=startservice
        - action=taskscheduler
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this execution, what followed, and whether it is part of a larger sequence. Look for reconnaissance, credential
    access, or staging that preceded the remote-execution attempt.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the
    attack stages that preceded this remote-execution attempt and help reconstruct the timeline that led an operator to
    stage a lateral-movement tool here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points to scripted
    deployment or sanctioned tooling; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharpMove.exe
      - OriginalFileName: SharpMove.exe
      selection_cli_computer:
        CommandLine|contains: computername=
      selection_cli_actions:
        CommandLine|contains:
        - action=create
        - action=dcom
        - action=executevbs
        - action=hijackdcom
        - action=modschtask
        - action=modsvc
        - action=query
        - action=scm
        - action=startservice
        - action=taskscheduler
      condition: selection_img or all of selection_cli_*
    fields:
    - host.name
