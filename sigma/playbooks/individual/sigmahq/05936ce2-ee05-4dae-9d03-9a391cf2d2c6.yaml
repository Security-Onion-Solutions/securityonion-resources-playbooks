name: WMI Persistence - Command Line Event Consumer
id: 6cbc9351-a631-455c-8ebf-97cc41b2888b
description: |
  Detects WmiPrvSE.exe loading wbemcons.dll, the provider library that implements WMI
  CommandLineEventConsumer objects — this load occurs when a registered command-line event
  consumer is instantiated, meaning a WMI event subscription (T1546.003) is executing its payload.
  Some management, monitoring, and backup products register legitimate consumers, so the
  investigation determines what command the consumer ran, when and how the subscription was
  registered, and whether the filter-consumer-binding triple in the WMI repository is a sanctioned
  product or planted persistence.
type: detection
detection_id: 05936ce2-ee05-4dae-9d03-9a391cf2d2c6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, wbemcons.dll loaded by WmiPrvSE.exe?
  context: |
    Confirm the alert from the module path (ImageLoaded) and the loading process. The rule fires
    when C:\Windows\System32\wbem\WmiPrvSE.exe loads a module ending in \wbemcons.dll — the
    provider that implements command-line event consumers. The load itself means a registered
    consumer was being instantiated, so a true match here shifts the investigation to what the
    consumer executed and who registered it.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to have WMI event subscriptions that run commands?
  context: |
    Some endpoint-management, monitoring, and backup products register permanent WMI consumers as
    part of normal operation, and those fire on their schedule under the WMI service. If this
    host runs a product known to use command-line event consumers, that pattern should also be
    visible on peer hosts with the same product; a consumer firing on a host with no such product
    is unaccounted-for persistence.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is there a documented deployment or approval that registers WMI event consumers on this host?
  context: |
    Product installations that create permanent WMI subscriptions are normally tied to a software
    deployment, monitoring rollout, or change record. A matching record for this host closes the
    alert quickly; a consumer firing with no corresponding deployment is worth treating as
    unauthorized persistence until the subscription is identified.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What command did the WMI consumer execute?
  context: |
    The consumer's command line appears on the processes this WmiPrvSE instance spawned. Decode
    what you find: persistence payloads in this pattern commonly run powershell.exe with
    -NoProfile and an inline expression that Base64-decodes a payload staged in an HKLM registry
    value, so an encoded command or a registry read in the child's arguments identifies the
    staging location — retrieve and decode that value. The executing account is typically SYSTEM,
    which is expected for WMI-triggered execution and does not by itself indicate an
    administrator acted.
  range: +/-15m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What other modules did this WmiPrvSE instance load alongside the consumer provider?
  context: |
    The provider host's module list shows which consumer types were instantiated: scrcons.dll
    means an ActiveScriptEventConsumer (script-based payload) also ran, and any unsigned module
    or one loaded from outside System32\wbem points to a planted provider rather than the
    built-in consumer machinery. Children from non-standard or user-writable paths in the
    consumer-command question pair with what loads here.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the loaded wbemcons.dll the genuine signed system library?
  context: |
    The real wbemcons.dll is a Microsoft-signed library under C:\Windows\System32\wbem. A module
    by that name loaded from another path, or one whose signature status is Unsigned, Expired, or
    Invalid, is a masquerading substitute — that changes the finding from abuse of the built-in
    consumer mechanism to a planted DLL. The hash supports a reputation lookup either way.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process registered or modified WMI event subscriptions on this host recently?
  context: |
    The firing consumer was registered earlier — through mofcomp.exe compiling a MOF file,
    PowerShell subscription cmdlets, wmic, or direct WMI API calls that reference the
    root\subscription namespace classes. Command lines mentioning __EventFilter,
    CommandLineEventConsumer, or FilterToConsumerBinding identify the registration event and the
    account behind it. If nothing appears in this window, the registration predates retained
    telemetry and the live enumeration question becomes the attribution path.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_tool:
        Image|endswith: '\mofcomp.exe'
      selection_cli:
        CommandLine|contains:
          - 'Register-WmiEvent'
          - 'Register-CimIndicationEvent'
          - 'Set-WmiInstance'
          - 'New-CimInstance'
          - '__EventFilter'
          - 'CommandLineEventConsumer'
          - 'ActiveScriptEventConsumer'
          - 'FilterToConsumerBinding'
          - 'root\subscription'
      condition: selection_host and (selection_tool or selection_cli)
    fields:
      - Image
      - CommandLine
      - User
- question: What event subscriptions exist in this host's WMI repository right now?
  context: |
    The persistence object is a triple in the root\subscription namespace: an __EventFilter (the
    WQL trigger), an __EventConsumer (the payload), and a __FilterToConsumerBinding tying them
    together. Enumerate all three classes on the live host, and also check root\cimv2 for
    __IntervalTimerInstruction and __AbsoluteTimerInstruction objects that serve as timers for
    the filter. Unexpected entries give you the exact trigger condition and payload command, and
    removing the binding is the containment step once confirmed malicious.
  range: +/-30d
  answer_sources:
  - edr_console
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has the WMI provider host been spawning processes repeatedly on this host?
  context: |
    Consumers bound to timer or interval triggers fire on a fixed cadence, so a malicious
    subscription often produces the same child command over and over. Repeated identical spawns
    across the past day show the trigger cadence; a single firing points instead at a one-shot
    trigger such as logon, startup, or a specific event condition. Either result narrows what the
    filter's WQL condition must look like.
  range: -24h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\WmiPrvSE.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did this provider host or the processes it spawned write to disk?
  context: |
    Consumer payloads may drop scripts or executables before running them, and script consumers
    frequently write to Temp or ProgramData staging paths. Files written by this WmiPrvSE
    instance or its direct children identify those artifacts; if still on disk, preserve copies
    and capture hashes before cleanup.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other persistence mechanisms installed on this host around the same timeframe?
  context: |
    Operators who plant one persistence mechanism commonly stack backups using different
    techniques — scheduled tasks, services, registry Run keys, or BITS jobs. Persistence tooling
    activity in the hours around this alert indicates deliberate stacking rather than an isolated
    product behavior, and each mechanism found extends the cleanup scope.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: |
    File-based persistence bypasses command-line detection entirely — an executable or script
    placed in a Startup folder or a Run-key path achieves persistence without running any
    registration tool. Drops into these locations around the alert are a parallel mechanism to
    the WMI subscription and belong in the same cleanup scope.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: How often has this host fired this consumer-load pattern before, and under what users?
  context: |
    The query mirrors the rule's selection scoped to this host. A host whose management or backup
    product fires a legitimate consumer will show this pattern recurring steadily over the past
    two weeks; a first-time load, or a change in cadence coinciding with other suspicious
    activity, marks the point the subscription appeared and is the anomaly worth chasing.
  range: -14d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image: C:\Windows\System32\wbem\WmiPrvSE.exe
        ImageLoaded|endswith: \wbemcons.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this consumer-load pattern in the past week?
  context: |
    The query mirrors the rule's selection with no host scope. A product that legitimately uses
    command-line consumers fires this pattern across every host it is installed on, so broad
    consistent distribution supports the benign explanation; a single host, or a small cluster
    that also shows other detections, supports planted persistence. Compare the firing hosts
    against the deployment footprint of any product identified earlier.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image: C:\Windows\System32\wbem\WmiPrvSE.exe
        ImageLoaded|endswith: \wbemcons.dll
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert place the consumer firing in its
    surrounding sequence — payload children, staging activity before the fire, or follow-on
    tooling after it. Novel low-count pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — registration tooling, script-host activity, credential access — may
    capture the intrusion stages that preceded the consumer firing, including the original
    registration if it happened recently, and help reconstruct the timeline from foothold to
    persistence.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
