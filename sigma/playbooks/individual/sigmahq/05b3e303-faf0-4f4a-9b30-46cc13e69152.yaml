name: Potential Persistence Via PowerShell User Profile Using Add-Content
id: 7b357d2c-0327-410a-9b5f-7d28ce67e44a
description: |
  Detects a PowerShell script block that calls Add-Content against $profile while appending
  a -Value payload beginning with IEX, Invoke-Expression, Invoke-WebRequest, or Start-Process
  (T1546.013). Profile scripts run at every PowerShell session start unless the session is
  launched with -NoProfile, so an appended execution line re-runs the payload on each new
  session and can escalate privileges when a more privileged account loads the modified
  profile. The investigation should read the complete appended payload, identify the user and
  session that performed the append, confirm which profile file on disk changed, and determine
  whether later PowerShell sessions have already executed the appended command. Legitimate
  administration and tuning scripts also append functions to profiles, so confirmation with
  the user and their role is often the fastest path to a disposition.
type: detection
detection_id: 05b3e303-faf0-4f4a-9b30-46cc13e69152
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block both call Add-Content against $profile and append an execution payload?
  context: >-
    Confirm the alert is a true positive by reading the complete script against both detection
    criteria at once. The rule requires a fragment containing "Add-Content $profile" AND an
    appended -Value string that starts with IEX, Invoke-Expression, Invoke-WebRequest, or
    Start-Process. Long scripts are split across multiple script-block events, so this
    reassembles every chunk of the alerting block in sequence order and the match is judged on
    the complete script, not the alerting fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user expected to customize PowerShell profiles on this host?
  context: >-
    Legitimate administration and tuning scripts add functions and shortcuts to PowerShell
    sessions, and the rule's known false positives are exactly that. The query shows the
    alerting block's host, user, and on-disk script path (when the block ran from a file). A
    SYSTEM or machine-account user usually means deployment tooling or a vendor agent — judge
    by the host's role and the script path. An account with no administrative or development
    role appending execution commands to a profile is the case worth pursuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the user or administrator recall adding this line to their PowerShell profile?
  context: >-
    Direct confirmation from the human behind the account is often the fastest disposition. If
    they added it, ask why and what the appended command was meant to accomplish, and whether a
    change ticket or maintenance window covers the customization — profile changes pushed by
    tooling should also be documented. If the user does not recall the change, treat the
    account and host as possibly compromised and continue the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith: '\powershell.exe'
      condition: selection
    fields:
    - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Which PowerShell host process ran this script, and what started it?
  context: >-
    Script-block events carry no process linkage, so the session that appended the profile line
    must be located as a PowerShell launch by the same user on this host — focus on the launch
    events closest before the alert time, keeping in mind an interactive console may have
    started hours or days earlier. The parent of that launch attributes the change. An
    interactive origin (explorer.exe, a terminal host) fits a user typing the command; an
    Office application, script host, or unexpected service as parent points to the profile
    append being performed by other tooling running as this user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
      condition: selection
    fields:
    - Image
    - CommandLine
    - ParentImage
    - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did this user start on this host in the minutes around the profile modification?
  context: >-
    With no process lineage on script-block events, the near-window activity of the same
    account is the closest available sibling view. Download utilities, archive extraction,
    reconnaissance commands, or additional persistence tooling in the minutes around the
    profile append indicate a hands-on sequence of actions rather than an isolated
    customization.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
    - Image
    - CommandLine
  answer_sources:
  - process_creation
- question: What exactly does the appended profile line execute, and is any of it obfuscated?
  context: >-
    Read the full reassembled block to extract the payload being planted. Script-block content
    is post-decoding ground truth — Base64 -EncodedCommand wrappers are already unwrapped —
    so focus on what the appended -Value points at, including any URL fetched by
    Invoke-WebRequest or an IEX download cradle, the executable path handed to Start-Process,
    and any string concatenation, format operators, or backtick escaping that still needs
    manual decoding. Paths and URLs recovered here drive the file and follow-on checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Was this script run from a file on disk, and what created it?
  context: >-
    When the block ran from a file, its path is recorded on the event; a script in a
    user-writable or staging location (Temp, AppData, ProgramData, Downloads) implies a
    delivery step that wrote it — find the file-creation event to identify the process and
    account that staged it. No recorded path means the command ran interactively or in
    memory, which fits both the benign case (an admin typing a profile tweak) and a
    deliberate fileless-execution choice — weigh it against the payload content.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Which PowerShell profile files were created or modified on this host, and by what process?
  context: >-
    The persistence artifact is the profile file itself. $profile resolves per user and host
    program — profile.ps1, Microsoft.PowerShell_profile.ps1, Microsoft.PowerShellISE_profile.ps1,
    and Microsoft.VSCode_profile.ps1 under the user's Documents folder — while the all-users
    variants live under the PowerShell install directory and execute for every account on the
    host, including elevated ones. The writing process and account attribute the change, and a
    write to an all-users profile widens both the blast radius and the privilege-escalation
    potential.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_profile:
        TargetFilename|endswith:
        - '\profile.ps1'
        - '\Microsoft.PowerShell_profile.ps1'
        - '\Microsoft.PowerShellISE_profile.ps1'
        - '\Microsoft.VSCode_profile.ps1'
      condition: selection and selection_profile
    fields:
      - TargetFilename
      - EventType
      - Image
      - User
  answer_sources:
  - file_event
- always_include: true
  question: Did this user start new PowerShell sessions on this host after the change, without the -NoProfile flag?
  context: >-
    Every subsequent PowerShell start by this user loads the modified profile and runs the
    appended line unless the session is launched with -NoProfile — each launch listed here is
    a likely execution of the planted payload. Launches carrying -NoProfile are excluded by
    the query. Routine automation repeats with stable parents and command-line structure; a
    parent or command-line deviation in the follow-on window, or an unusual burst of session
    starts, is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
      filter_noprofile:
        CommandLine|contains: '-nop'
      condition: selection and not filter_noprofile
    fields:
    - Image
    - ParentImage
    - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did PowerShell spawn on this host after the profile was modified?
  context: >-
    An appended Start-Process line surfaces as a child process of the PowerShell host each time
    a session starts, so a repeated identical child following session starts is the signature
    of profile-driven persistence. IEX and Invoke-WebRequest payloads may instead appear as a
    network fetch followed by in-memory execution or a dropped file — correlate any child here
    with the executable or URL recovered from the appended payload. This is not scoped to one
    user because an all-users profile executes for every account that opens PowerShell.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
        - '\powershell.exe'
        - '\powershell_ise.exe'
        - '\pwsh.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before the profile was modified?
  context: >-
    Attackers often disable or bypass PowerShell security controls before planting a payload.
    Common precursors include AMSI bypass (patching amsi.dll in memory), execution policy
    changes (Set-ExecutionPolicy or the -ep bypass flag), constrained language mode escape,
    and PowerShell downgrade to version 2, which lacks script block logging. Finding these in
    the hour before the profile append strengthens the case that the change was staged rather
    than routine tuning.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious blocks at warning level when it is not.
    On a warning-only host this alert is a fragment of the host's PowerShell activity, not all
    of it — the appended payload's later executions at session start may simply not have been
    logged, so absence of further script-block evidence is not absence of activity. The level
    distribution calibrates how much weight every other script-block query in this
    investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is
    confined to this endpoint or the same account is planting persistence elsewhere. If the
    alert fired under SYSTEM, a machine account, or another service principal, this returns
    routine agent telemetry and the fleet-wide pattern question carries the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same profile-append pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, user identity does not attribute behavior, and script-block
    events carry no process identity to pivot on — the meaningful pivot is the pattern itself.
    This mirrors the rule's selection fleet-wide in the alert window, aggregated by host.
    Multiple hosts in the same window points to scheduled or pushed automation touching
    profiles; a single host points to a host-local action. Only hosts shipping the PowerShell
    channel (and, for content Microsoft does not auto-flag, with Script Block Logging enabled)
    can appear here, so absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_add:
        ScriptBlockText|contains: Add-Content $profile
      selection_options:
        ScriptBlockText|contains:
        - '-Value "IEX '
        - -Value "Invoke-Expression
        - -Value "Invoke-WebRequest
        - -Value "Start-Process
        - '-Value ''IEX '
        - -Value 'Invoke-Expression
        - -Value 'Invoke-WebRequest
        - -Value 'Start-Process
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - ps_script
- always_include: true
  question: Has this user produced this profile-append pattern before, and does that history fit their role?
  context: >-
    This mirrors the rule's selection scoped to this user over 90 days, aggregated by host —
    the result is the user's history of this specific profile-append pattern, not generic
    PowerShell use. An administrator whose tuning scripts routinely add functions to profiles
    reads very differently from an account producing this pattern for the first time; weigh
    the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_add:
        ScriptBlockText|contains: Add-Content $profile
      selection_options:
        ScriptBlockText|contains:
        - '-Value "IEX '
        - -Value "Invoke-Expression
        - -Value "Invoke-WebRequest
        - -Value "Start-Process
        - '-Value ''IEX '
        - -Value 'Invoke-Expression
        - -Value 'Invoke-WebRequest
        - -Value 'Start-Process
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - ps_script
  - organizational_knowledge
- always_include: true
  question: Which hosts have historically produced this script pattern, and is the alerting host among them?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior,
    and script-block events carry no process identity to pivot on — the meaningful pivot is
    the pattern itself. This mirrors the rule's selection fleet-wide over 90 days, aggregated
    by host. A pattern that routinely appears across many hosts is deployment tooling or
    vendor automation; one that has never appeared before, or only on this host, is the
    deviation worth chasing. Hosts without Script Block Logging only record content Microsoft
    auto-flags, so an empty history is weaker evidence than it looks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_add:
        ScriptBlockText|contains: Add-Content $profile
      selection_options:
        ScriptBlockText|contains:
        - '-Value "IEX '
        - -Value "Invoke-Expression
        - -Value "Invoke-WebRequest
        - -Value "Start-Process
        - '-Value ''IEX '
        - -Value 'Invoke-Expression
        - -Value 'Invoke-WebRequest
        - -Value 'Start-Process
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually planted after initial access, not before it. Earlier detections on
    the same host — defense tampering, download cradles, reconnaissance, credential access —
    can reveal the stages that preceded the profile modification and help reconstruct the
    timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- always_include: true
  question: Did this same rule fire on other hosts in the past 24 hours?
  context: >-
    A rule firing across many hosts on the same day usually tracks scheduled or pushed
    automation touching PowerShell profiles fleet-wide — a deployment or configuration
    rollout. A single-host firing points to a host-local action and keeps the focus on this
    endpoint and account. For alerts under a service principal this cross-host view replaces
    the user pivot, which would match everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule_name%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - alert
