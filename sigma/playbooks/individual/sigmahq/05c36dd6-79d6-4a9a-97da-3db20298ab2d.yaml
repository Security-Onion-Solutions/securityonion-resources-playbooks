  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific wmic.exe -format XSL pattern rather than generic WMIC usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
