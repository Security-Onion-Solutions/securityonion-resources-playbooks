name: XSL Script Execution Via WMIC.EXE
id: d963e2ae-4403-47a7-860f-e3730664947d
description: |
  Detects wmic.exe running with the -format: flag pointed at a local XSL file, excluding the built-in format names (List, htable, table, value, csv, etc.) and remote sources (URLs or UNC paths). WMIC will load and execute embedded JScript or VBScript from an XSL stylesheet, which lets an operator run arbitrary script code through a signed Microsoft binary and bypass application allow-listing. Legitimate WMIC use almost always sticks to the built-in format names, so a custom XSL path is the anomaly worth investigating; determine what the referenced XSL file contains, how wmic.exe was invoked, and what it spawned next.
type: detection
detection_id: 05c36dd6-79d6-4a9a-97da-3db20298ab2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: 'Does the wmic.exe command line use -format: pointing at a custom XSL file rather than a built-in format name?'
  context: 'Confirm the alert is a true positive by reviewing the exact command line. The rule fires when wmic.exe is invoked with -format: but the argument is NOT one of the built-in format names (List, htable, hform, table, mof, value, rawxml, xml, csv) and is NOT a remote source (no :// or UNC path). A local file path or XSL filename after -format: is the trigger; a built-in name would not have fired.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Hashes
- question: Is this user and host expected to run wmic.exe with a custom XSL format?
  context: Custom XSL transforms via wmic.exe are rare in routine administration; built-in format names cover almost all legitimate reporting. Knowing whether the user role and host function involve scripted WMIC reporting or developer XSL work is often the fastest way to separate a true positive from sanctioned activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What XSL file did wmic.exe load, and what does that stylesheet contain? Decode the full command line.
  context: The full command line names the XSL file passed to -format:. Identify that file path, then inspect the stylesheet itself for embedded JScript/VBScript inside msxsl:script or script blocks — that embedded code is what actually executes. Decode any obfuscation in the file name or surrounding arguments to understand what operation the transform performs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|windash: '-format:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the XSL stylesheet or its embedded script encoded or obfuscated, and what does the decoded content do?
  context: 'Embedded script inside the XSL is the operator''s payload hidden from casual inspection. Look for character concatenation (VBScript Chr() chains, JavaScript String.fromCharCode), base64 blobs, hex, or environment-variable substitution inside the stylesheet. Decoding reveals the actual intent: download cradles, in-memory loaders, reverse shells, or further script execution. Reconstruct the string from any Chr() / fromCharCode chains and identify the command it forms.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this wmic.exe, and is that parent chain expected?
  context: The parent process reveals how WMIC was invoked. Legitimate XSL transforms are usually launched interactively or by a known reporting script (explorer.exe, a scheduled-task host, an admin shell). Unusual parents like mshta.exe, wscript.exe, an Office application, or a process running from a user-writable path point to script-driven or macro-driven abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did wmic.exe load a script-engine module such as jscript.dll or vbscript.dll around the time of the alert?
  context: XSL proxy execution runs because WMIC loads the scripting host engine to interpret the embedded JScript or VBScript. A module load of jscript.dll, jscript9.dll, vbscript.dll, or scrobj.dll into wmic.exe confirms script execution actually occurred rather than a benign format transform. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and rely on the command-line and child-process evidence instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_modules:
        ImageLoaded|endswith:
          - '\jscript.dll'
          - '\jscript9.dll'
          - '\vbscript.dll'
          - '\scrobj.dll'
      condition: selection and selection_modules
    fields:
      - ImageLoaded
      - CommandLine
- question: What child processes did this wmic.exe spawn afterward?
  context: The whole purpose of XSL proxy execution is to run further code through a trusted binary. Child processes spawned by wmic.exe — cmd.exe, powershell.exe, a script host, or an unsigned binary from a user-writable path — reveal the actual payload. Legitimate format transforms spawn nothing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a signed binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific wmic.exe -format XSL pattern (not generic WMIC usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cmd:
        CommandLine|contains|windash: '-format:'
      filter_main_known_format:
        CommandLine|contains:
        - Format:List
        - Format:htable
        - Format:hform
        - Format:table
        - Format:mof
        - Format:value
        - Format:rawxml
        - Format:xml
        - Format:csv
      filter_main_remote_operation:
        CommandLine|contains:
        - ://
        - \\\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time as the alert?
  context: Proxy execution rarely stands alone. Activity surrounding the wmic.exe XSL execution may reveal reconnaissance, credential access, persistence installation, or data staging that gives broader context. Novel low-count tool invocations near the alert window are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cmd:
        CommandLine|contains|windash: '-format:'
      filter_main_known_format:
        CommandLine|contains:
        - Format:List
        - Format:htable
        - Format:hform
        - Format:table
        - Format:mof
        - Format:value
        - Format:rawxml
        - Format:xml
        - Format:csv
      filter_main_remote_operation:
        CommandLine|contains:
        - ://
        - \\\\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      - Hashes|contains:
        - IMPHASH=1B1A3F43BF37B5BFE60751F2EE2F326E
        - IMPHASH=37777A96245A3C74EB217308F3546F4C
        - IMPHASH=9D87C9D67CE724033C0B40CC4CA1B206
        - IMPHASH=B12619881D79C3ACADF45E752A58554A
        - IMPHASH=16A48C3CABF98A9DC1BF02C07FE1EA00
      selection_cmd:
        CommandLine|contains|windash: '-format:'
      filter_main_known_format:
        CommandLine|contains:
        - Format:List
        - Format:htable
        - Format:hform
        - Format:table
        - Format:mof
        - Format:value
        - Format:rawxml
        - Format:xml
        - Format:csv
