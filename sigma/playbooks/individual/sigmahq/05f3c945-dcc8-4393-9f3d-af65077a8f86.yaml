name: Suspicious SYSVOL Domain Group Policy Access
id: cb0b2759-1cfa-4950-8dc4-f9b813891088
description: |
  Detects a process whose command line references both a SYSVOL path and a Group Policy
  policies path, which is the access pattern tools use to read Group Policy Preference (GPP)
  files from the domain-wide SYSVOL share. GPP XML files can carry an AES-encrypted cpassword
  attribute that any authenticated domain user can decrypt with a publicly known key, so this
  access is a recognized path to harvesting cleartext credentials. Legitimate Group Policy
  administration and replication can also touch these paths, so the investigation determines
  whether the access reflects credential harvesting tooling or routine administration, what
  parent launched it, and whether any decrypted credentials enable follow-on access.
type: detection
detection_id: 05f3c945-dcc8-4393-9f3d-af65077a8f86
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line reference both a SYSVOL path and a Group Policy policies path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line. The rule fires only when the command line contains both the
    \SYSVOL\ token AND the \policies\ token, which is the combined access pattern for reading
    Group Policy Preference files from the domain share.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to access Group Policy files in SYSVOL?
  context: Legitimate Group Policy administration and domain controller replication can touch
    SYSVOL policies paths. Knowing whether the user role (domain admin, GP operator) and host
    function (workstation versus domain controller or management server) are consistent with
    reading Group Policy Preference files is often the fastest path to distinguishing routine
    administration from credential harvesting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this command do with the SYSVOL Group Policy files it referenced?
  context: Decode the full command line to determine the operational intent. Group Policy
    Preference harvesting reads XML files (Groups.xml, Services.xml, ScheduledTasks.xml,
    DataSources.xml, Printers.xml, Drives.xml) under the SYSVOL Policies tree and then
    base64-decodes and AES-decrypts the cpassword attribute to recover cleartext passwords.
    Look for the targeted XML file names, recursion or enumeration flags, and any decryption
    or cpassword references that distinguish credential extraction from a simple file listing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which accounts could be exposed by the targeted Group Policy Preferences, and do any have elevated privileges?
  context: The severity depends on the privilege of accounts whose passwords are stored in the
    Group Policy Preference files. Scheduled-task and service GPPs frequently store credentials
    for privileged service or local administrator accounts, and a single decrypted local admin
    password can grant access on every machine the policy targeted. Cross-reference the
    accounts referenced in the targeted XML files with directory group memberships to gauge
    blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the SYSVOL access was invoked. Interactive
    administration usually launches from explorer.exe or a console shell run by an admin, while
    invocation from a script host, an Office application, or a remote-execution service can
    indicate scripted credential harvesting. Walk up to the parent to see what drove the access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously matched the rule's SYSVOL access pattern, what parents and users normally drive it, and does this alert fit?
  context: Even routine Group Policy administration can match this pattern. The query mirrors
    the rule's selection scoped to this host, so the resulting parent and user distribution
    reflects how the SYSVOL-and-policies access pattern has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this command spawn afterward?
  context: The processes spawned after the SYSVOL access reveal its actual impact. Decryption
    and credential staging may spawn helper interpreters or copy tools, and use of recovered
    credentials may spawn remote-execution or network utilities. Unexpected children point to
    post-access activity beyond a simple file read.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the SYSVOL access is an
    isolated action or part of broader activity. If the same user touched multiple endpoints in
    the same window, the scope of credential collection or subsequent use may be larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what
    led to the SYSVOL access and what happened after, and whether it is part of a larger
    sequence such as reconnaissance of the domain share, privilege escalation, or credential
    staging. Novel parent-child pairs stand out against repetitive host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, share enumeration, or
    other reconnaissance, may reveal the attack stages that preceded the SYSVOL access and help
    reconstruct the full timeline leading to credential harvesting.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts matched the rule's SYSVOL access pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count
    of the SYSVOL-and-policies access pattern. Many hosts matching the same pattern points to
    scripted deployment or replication tooling, while one host or a small unrelated set points
    to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \SYSVOL\
        - \policies\
      condition: selection
    fields:
    - host.name
- question: Do Windows security share-access events show this host reading Group Policy files under the SYSVOL share?
  context: Reading Group Policy Preference XML files traverses the domain SYSVOL network share,
    which the Windows security log records as detailed file-share access events when share
    auditing is enabled. These events corroborate the process-level alert with share-side
    visibility of which policy files were opened and by which account. If detailed file-share
    auditing is not enabled in this environment, treat zero results as a visibility gap rather
    than evidence nothing was accessed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 5145
        host.name|expand: '%hostname%'
        ShareName|contains: SYSVOL
      filter:
        RelativeTargetName|contains: Policies
      condition: selection and filter
    fields:
      - SubjectUserName
      - ShareName
      - RelativeTargetName
      - AccessMask
- question: Are the referenced Group Policy Preference files or any decrypted output still on disk for analysis?
  context: If the command referenced or copied Group Policy Preference XML files locally, or
    wrote decrypted credential output, checking whether those files still exist enables deeper
    analysis such as confirming which cpassword-bearing files were read and recovering the
    affected account names.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
