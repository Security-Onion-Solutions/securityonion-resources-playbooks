name: Unsigned Module Loaded by ClickOnce Application
id: 31317869-0ac2-44b5-943b-526b0f366367
description: |
  Detects a process running from the ClickOnce application cache (\AppData\Local\Apps\2.0\)
  loading a module that is unsigned or carries an expired signature. ClickOnce deployments
  inherit the reputation and signature of their published host application, which makes them
  attractive for trusted-code execution — an attacker can backdoor a dependency DLL of a
  legitimately signed ClickOnce application, or wrap a signed .NET assembly into a fresh
  deployment, so malicious code loads inside a trusted host process while skirting
  reputation-based blocking (T1574.001). The investigation establishes what the flagged module
  is, when and how it arrived in the deployment directory, whether the application itself is a
  sanctioned deployment, and what the process did after the load.
type: detection
detection_id: 060d5ad4-3153-47bb-8382-43e5e29eda92
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does this event match the rule's criteria — a process running from the ClickOnce application cache loading a module that is unsigned or has an expired signature?
  context: |
    Confirm the alert from the load event itself. The rule fires when the loading process's
    image path contains \AppData\Local\Apps\2.0\ (the per-user ClickOnce deployment store) AND
    the loaded module is either not signed at all or signed with an expired certificate. Note
    which signature branch matched — an entirely unsigned dependency and an expired but
    otherwise valid signature have different follow-ups. The load event carries the module's
    hash and full signing details directly, so no execution pivot is needed to read them.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Signed
      - SignatureStatus
- question: Is this user and host expected to run this ClickOnce-deployed application?
  context: |
    ClickOnce is a per-user, no-admin deployment channel, so the application in the alert was
    installed under this specific user's profile. If the host belongs to a team that uses a
    known line-of-business ClickOnce application, the load may be routine; an application name
    nobody recognizes, on a host with no business need for it, moves the investigation toward
    delivery-vector questions.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Does the user recall installing or launching this ClickOnce application?
  context: |
    ClickOnce installs are user-driven — they start from a deployment URL opened in a browser
    or from an .appref-ms shortcut, and complete with minimal prompting. If the user recalls
    deliberately installing the application, get the source they installed from and why. If
    they do not recall it, or only remember clicking a link in an email or chat message, treat
    the deployment itself as the delivery vector and identify where that link came from.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this application a documented, sanctioned deployment in this organization?
  context: |
    Internally published ClickOnce applications are normally documented — a publishing team, a
    deployment URL on an internal server, and a record of the release. An application with no
    deployment record, an unrecognized publisher, or a provider URL on external infrastructure
    has no organizational anchor and should be treated as unsanctioned software until its
    origin is established.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other modules did this ClickOnce application load, and did any come from its deployment directory unsigned or under a system-library name?
  context: |
    The full module list places the flagged DLL in context. A backdoored dependency sits among
    the application's legitimate modules, so compare paths and signing across the set — DLLs
    loading from the Apps\2.0 deployment directory instead of the system paths expected for
    their names point to search-order interception, and several unsigned modules from the same
    directory suggest the whole deployment is attacker-authored rather than a single tampered
    dependency. Modules from %TEMP%, ProgramData, or Public are a separate side-loading signal
    worth noting.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What are the signing details, hash, and threat-intel reputation of the flagged module?
  context: |
    Module reputation separates a routine unsigned third-party dependency from a planted one.
    Check the hash against threat intelligence and against any known-good hash for this
    application's dependencies — dependency backdooring changes the DLL's code (and therefore
    its hash) while the host executable keeps its valid signature, so a hash that deviates from
    the version shipped with the deployment is the substitution signal. For the expired-signature
    branch, read the signature subject — an expired certificate from the application's own
    publisher reads differently than an unrelated or untrusted signer.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: How was the ClickOnce application launched, and with what command line and working directory?
  context: |
    The process-creation record for the loading application shows how it started. ClickOnce
    launches normally carry no unusual arguments — the executable path under Apps\2.0 with a
    randomized directory name is expected. Arguments referencing URLs, files outside the
    deployment directory, or script content are not part of the normal launch pattern and
    indicate the host process is being used to run something beyond the deployed application.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this ClickOnce application, and is that parent chain expected?
  context: |
    The standard ClickOnce launch flow runs through dfsvc.exe, the deployment service that
    downloads the manifests and dependencies and then starts the host assembly — so dfsvc.exe
    or explorer.exe (for an installed application started from its shortcut) are the expected
    parents. A browser process as parent indicates a fresh from-the-web launch, which makes the
    deployment's source URL the key artifact to recover. Script hosts, Office applications, or
    command shells as parent fall outside the normal deployment flow entirely.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When was the flagged module written into the ClickOnce deployment directory, and by which process?
  context: |
    A legitimate install or update writes the entire deployment — executable, manifests, and
    dependency DLLs — in one burst via the deployment service. The write history of the flagged
    module tells you which arrival pattern this is: written together with the rest of the
    application at install time (the unsigned dependency shipped with the deployment) versus
    written or modified later, or by a process other than the deployment flow (a substituted
    or patched dependency). Compare the write timestamp with the load time; file-write events
    carry no hash, so hash verification stays with the load event.
  range: -7d
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were autorun or DLL load-point registry values modified on this host around the module load?
  context: |
    Execution-flow hijacks are often seated or reinforced through registry load points —
    Run/RunOnce autoruns, AppInit_DLLs, KnownDLLs entries, or Image File Execution Options.
    ClickOnce dependency resolution itself is manifest-driven and needs none of these, so a
    load-point change in the same window points to additional persistence being stacked
    alongside the deployment. The written value (Details) shows what path the load point now
    references.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\AppInit_DLLs'
          - '\KnownDLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What child processes did the ClickOnce application spawn after loading the module?
  context: |
    Backdoored dependencies run their payload inside the trusted host process, and the next
    observable step is usually a child — a command shell, script host, or a dropped executable
    launched for post-exploitation. Deployed business applications have predictable, often
    empty, child-process profiles, so any unexpected child inherits the investigation.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the ClickOnce application make outbound network connections around the module load?
  context: |
    Deployment downloads normally ride the deployment service rather than the application
    itself, so egress from the application process is its own behavior, not install traffic.
    Compare destinations against the application's documented provider or update endpoint —
    connections to unrelated external infrastructure shortly after an unsigned module loads
    are where second-stage retrieval or command-and-control would appear.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this module been loaded on this host before, and by which processes?
  context: |
    Load history separates a long-standing dependency from a fresh arrival. If the same module
    has been loaded by the same application for weeks, the unsigned dependency likely shipped
    with the deployment and the finding is about software provenance rather than an active
    intrusion. A first-ever load — especially one following a recent write to the deployment
    directory — is the anomaly to chase. Note that some environments legitimately run
    development or niche vendor tools that load modules from user-profile paths.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously loaded unsigned or expired-signature modules from ClickOnce cache paths, what programs and users drove it, and does this alert fit that history?
  context: |
    The query mirrors the rule's selection structure scoped to this host, so the result is the
    host's history of the rule's exact firing pattern — not generic module-load volume. A
    recurring pattern under the same ClickOnce application and user usually maps to one known
    application with unsigned dependencies; a new acting executable, a different user account,
    or a first-time occurrence is the deviation worth chasing. Image-load events carry no
    parent lineage — pivot to the application's process-start event if the launch chain matters.
  range: -14d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_path:
        Image|contains: \AppData\Local\Apps\2.0\
      selection_sig_status:
      - Signed: 'false'
      - SignatureStatus: Expired
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the load reveal the surrounding sequence —
    browser or mail activity before the fire suggests fresh delivery, while script hosts,
    archive tools, or reconnaissance utilities after it suggest the payload is already
    operating. Novel low-count pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were files dropped to persistence locations on this host around the alert?
  context: |
    The ClickOnce deployment is itself a persistence foothold — the application remains
    installed under the user's profile with a launchable shortcut. Attackers commonly stack a
    second, independent mechanism: an executable or script in the Startup folder or a path
    referenced by a Run key survives even if the deployment is removed. Drops into these
    locations near the alert indicate deliberate redundancy rather than routine software
    behavior.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Have other hosts loaded unsigned or expired-signature modules from ClickOnce cache paths in the past week?
  context: |
    The query mirrors the rule's selection structure with no host scope, so the result is the
    fleet-wide count of the rule's firing pattern rather than generic ClickOnce usage. Many
    hosts firing on the same module usually means a widely installed application with unsigned
    dependencies — worth documenting, likely benign. One host, or a small set that shares the
    same delivery timeframe, fits targeted or phishing-driven deployment; compare module names
    and loading applications across hosts to tell the two apart.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_path:
        Image|contains: \AppData\Local\Apps\2.0\
      selection_sig_status:
      - Signed: 'false'
      - SignatureStatus: Expired
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections help reconstruct the delivery chain — browser or mail-client child
    processes, shortcut handling, deployment-service activity, or unrelated defense tampering
    that preceded the module load. The alert timeline places this load inside whatever sequence
    was already underway on the host.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
