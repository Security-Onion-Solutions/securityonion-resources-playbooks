name: Backup Files Deleted
id: 9f12f8cb-3714-496b-a1ce-158293bae7ef
description: |
  Detects a command interpreter or scripting/host binary (cmd.exe, powershell.exe, pwsh.exe, wt.exe, rundll32.exe, or regsvr32.exe)
  deleting files with backup-associated extensions (.VHD, .bac, .bak, .wbcat, .bkf, .set, .win, .dsk). Deleting backups and recovery
  data is an Inhibit System Recovery (T1490) action that commonly precedes or accompanies ransomware encryption, removing the ability
  to restore without paying. Legitimate backup rotation, disk-image cleanup, and administrative maintenance produce the same events,
  so the investigation should establish which files were removed, the full command and parent chain of the deleting process, and
  whether recovery-inhibiting commands, registry changes, or file encryption followed.
type: detection
detection_id: 06125661-3814-4e03-bfa2-1e4411c60ac3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the deleted file's extension and the deleting process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and backup
    extension (.VHD, .bac, .bak, .wbcat, .bkf, .set, .win, .dsk), the operation (deletion), and the responsible process (cmd.exe,
    powershell.exe, pwsh.exe, wt.exe, rundll32.exe, or regsvr32.exe) against the rule's criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to delete backup files?
  context: Backup rotation and disk-image cleanup are routine on file servers, backup servers, and admin workstations. Knowing whether
    the user role and host function normally include backup maintenance is often the fastest way to separate routine housekeeping
    from recovery inhibition. When the user is a machine or service account, judge by the deleting process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which backup files were deleted, and does this look like scheduled rotation or deliberate recovery destruction?
  context: The alert is a file deletion, so the content is gone from disk; the investigative value is in which files were removed
    and why. Deletion of a handful of dated backups on a schedule reads as rotation; deletion of many backup-extension files across
    directories in a short burst, or of the only recent backup, reads as recovery inhibition. Note the directories and how many
    backup files the same process removed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: What was the full command line that deleted the backup file?
  context: The file deletion event names the responsible process but not its arguments. Retrieving the deleting process by its
    identifier shows the full command — a scripted loop removing backup extensions system-wide, a one-off del, or a rundll32/regsvr32
    invocation carrying the deletion logic. cmd.exe and powershell.exe are far too common to scope by binary name, so this pivots
    on the exact process instance from the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: When was this backup last written before it was deleted, and can it be recovered from another source?
  context: A deleted file carries no hash on the deletion event and its content is gone from disk. Looking backward for when the
    backup was created or last updated tells you whether a current restore point was destroyed or only a stale file was cleaned
    up. On-disk recovery paths include Volume Shadow Copies, offline or offsite backups, and the recycle bin.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Ransomware operators chain multiple recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic), disabling
    boot recovery (bcdedit), deleting backups (wbadmin), corrupting boot.ini, disabling Windows Recovery Environment (reagentc),
    and removing system restore points. This query surfaces ALL recovery-inhibiting commands on the host, revealing the full
    scope of recovery destruction. The analyst should then verify whether each action succeeded by checking system state (vssadmin
    list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: Was System Restore disabled through the registry on this host?
  context: Beyond deleting backup files, recovery inhibition frequently disables System Restore by setting DisableSR or DisableConfig
    under the SystemRestore registry keys. A modification to these values around the backup-deletion window strengthens the case
    that recovery inhibition — not routine cleanup — is underway. Registry value deletions are not observable, so focus on values
    being set to the disabled state.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\Windows NT\SystemRestore'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: If PowerShell performed the deletion, did script block logging capture the full script?
  context: When the deleting process is powershell.exe or pwsh.exe, script block logging (Event ID 4104) records the deobfuscated
    script content that actually ran, revealing whether a single file was removed or a loop deleted backup extensions across the
    disk — and any recovery-inhibiting cmdlets in the same script. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: Recovery-inhibiting actions (shadow copy deletion, backup destruction) typically precede file encryption by minutes.
    Checking for file creation events with ransomware-associated patterns (mass file renames, ransom note creation, unusual
    file extensions) determines whether encryption has already started and how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Was the deleted backup recreated or restored after the alert, or is it gone for good?
  context: The file's post-alert lifecycle drives urgency and next steps. A backup that reappears may indicate a normal
    delete-then-rewrite rotation; one that stays gone while other destructive activity unfolds points to recovery inhibition.
    Interpret the operation type on each subsequent event for this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other files did the deleting process write or delete around the alert?
  context: A process that removes one backup often touches several — a script iterating over backup extensions, a tool staging
    output, or ransomware touching thousands of paths. The breadth, paths, and extensions of the process's other file activity
    distinguish a single deletion from a sweep in progress and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: When this host has fired this backup-deletion pattern before, which programs and users drove it, and does the current
    alert fit?
  context: Even routine tools delete backups during maintenance. The query mirrors the rule's selection structure scoped to this
    host, so the resulting program/user distribution reflects how this specific deletion pattern has run here before. A new
    deleting program, an unexpected user account, or a first-ever occurrence is the deviation worth chasing; file-delete events
    lack parent lineage, so pivot to the deleting program's start event if the launch chain matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wt.exe
        - \rundll32.exe
        - \regsvr32.exe
        TargetFilename|endswith:
        - .VHD
        - .bac
        - .bak
        - .wbcat
        - .bkf
        - .set
        - .win
        - .dsk
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user produced this backup-deletion activity before, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day history of this
    specific deletion pattern (not generic use of the binary), aggregated by host. A user who has never produced this pattern is
    more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wt.exe
        - \rundll32.exe
        - \regsvr32.exe
        TargetFilename|endswith:
        - .VHD
        - .bac
        - .bak
        - .wbcat
        - .bkf
        - .set
        - .win
        - .dsk
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program driven this backup-deletion pattern before on this host or across the environment, or is the
    program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot is the
    launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so the result is
    the 90-day history of this program driving this specific pattern (not generic use of the binary). A new or rare program
    for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS
    automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wt.exe
        - \rundll32.exe
        - \regsvr32.exe
        TargetFilename|endswith:
        - .VHD
        - .bac
        - .bak
        - .wbcat
        - .bkf
        - .set
        - .win
        - .dsk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around the time of the deletion?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the
    same user triggered similar activity on multiple hosts, the scope of compromise may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program-driven backup-deletion pattern fire on other hosts in the same window?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry noise (every host
    runs SYSTEM-owned agents constantly). The meaningful question is whether the same launch mechanism fired elsewhere: the query
    mirrors the rule''s selection structure scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts
    in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wt.exe
        - \rundll32.exe
        - \regsvr32.exe
        TargetFilename|endswith:
        - .VHD
        - .bac
        - .bak
        - .wbcat
        - .bkf
        - .set
        - .win
        - .dsk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts deleted backup files matching this pattern in the past week, and does the spread look like automation
    or isolated activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this deletion
    pattern (not generic usage of the binary). Many hosts firing the same pattern points to scripted deployment or vendor automation;
    one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \wt.exe
        - \rundll32.exe
        - \regsvr32.exe
        TargetFilename|endswith:
        - .VHD
        - .bac
        - .bak
        - .wbcat
        - .bkf
        - .set
        - .win
        - .dsk
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the attack stages that preceded this event and help reconstruct the full timeline. Defense tampering and
    credential access often precede impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
