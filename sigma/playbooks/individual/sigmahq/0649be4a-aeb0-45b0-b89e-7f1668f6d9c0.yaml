name: IIS WebServer Log Deletion via CommandLine Utilities
id: 5da77d7d-c8f4-4da1-8afb-862cc53a80a3
description: |
  Detects a command interpreter (cmd.exe, powershell.exe, powershell_ise.exe, or pwsh.exe) running a
  file-deletion command (del, erase, rm, remove-item, or rmdir) whose command line references the IIS log
  directory path \inetpub\logs\. Administrators legitimately prune IIS logs as part of disk-retention
  maintenance, often via scripted cleanup of files older than a set age. The same deletion is abused after
  web-application exploitation to destroy the request logs that would record the initial access, so the
  investigation should determine whether the deletion was scheduled/scripted maintenance or an interactive
  removal that followed suspicious server activity, and whether the deleted logs can be recovered.
type: detection
detection_id: 0649be4a-aeb0-45b0-b89e-7f1668f6d9c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects — a shell running a delete command against the IIS log path?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all three conditions hold together —
    the process is cmd.exe, powershell.exe, powershell_ise.exe, or pwsh.exe; the command line contains a deletion verb (del,
    erase, rm, remove-item, or rmdir); and the command line references the \inetpub\logs\ directory. Read the full command line
    and confirm all three are present and that the target path is the real IIS log directory rather than an incidental string match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to delete IIS log files from the command line?
  context: IIS log pruning is a routine maintenance task, but it is normally performed by a scheduled job or a known
    administrative account rather than an interactive deletion. Knowing whether this host is an IIS web server and whether
    the user account is one that performs log maintenance is often the fastest way to separate routine cleanup from
    anti-forensic deletion following a web-application compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which IIS log files or subfolders were targeted for deletion, and was it a single file, a date range, or the whole log directory?
  context: The deletion scope determines impact. Removing a single recent log file points at hiding one event, while wiping
    an entire date range or the full \inetpub\logs\ tree points at broad anti-forensic destruction. Parse the command line for
    wildcards, recursive flags (rmdir /s, Remove-Item -Recurse), specific W3SVC site subfolders, and date or age filters to
    establish exactly what evidence was destroyed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Can the deleted IIS logs be recovered, and is there another copy of the request records elsewhere?
  context: The deleted artifact is the IIS request log itself, which is the primary record of who accessed the web
    application. Check whether the files can be restored from Volume Shadow Copies, backups, or a forwarded log copy, and
    whether IIS logging was configured to write to a remote system or central collector. Recovering even a partial log window
    around the deletion may reveal the web requests the deletion was meant to erase.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Are any of the referenced IIS log files still on disk, or were file-delete events recorded for them?
  context: If the deletion command did not fully succeed, or if only specific files were targeted, some IIS log files may
    remain on disk for direct analysis. File events for the \inetpub\logs\ path confirm which files were created or removed
    and when, providing a timeline of the log directory's contents around the deletion.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this shell, and is that parent chain expected for IIS log maintenance?
  context: The parent process reveals how the deletion was invoked. Scheduled maintenance typically descends from
    taskeng.exe or svchost.exe (Task Scheduler) or from cscript.exe running a retention script. An interactive parent such as
    explorer.exe, a remote-shell tool, or a web-server worker process (w3wp.exe) spawning the deletion points toward
    hands-on activity rather than a scheduled cleanup job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this deletion pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine IIS log cleanup leaves a stable signature on a given host — the same scheduled-task parent and the
    same maintenance account. The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific deletion pattern has historically run here. A new parent process,
    an unexpected account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - cmd.exe
        - powershell.exe
        - powershell_ise.exe
        - pwsh.dll
      selection_cli_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
        - 'rm '
        - 'remove-item '
        - 'rmdir '
      selection_cli_iis_dir:
        CommandLine|contains: \inetpub\logs\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this IIS log deletion pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, returning a fleet-wide count of this specific
    deletion pattern rather than generic shell usage. Many hosts running the same pattern points to a scripted retention job
    pushed across the IIS fleet; a single host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - cmd.exe
        - powershell.exe
        - powershell_ise.exe
        - pwsh.dll
      selection_cli_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
        - 'rm '
        - 'remove-item '
        - 'rmdir '
      selection_cli_iis_dir:
        CommandLine|contains: \inetpub\logs\
      condition: all of selection_*
    fields:
    - host.name
- question: What other tools ran on this host around the same time as the log deletion?
  context: Anti-forensic log deletion rarely happens in isolation. Activity surrounding the deletion may reveal the web-shell
    or exploitation tooling that preceded it, reconnaissance, credential access, or staging. A cluster of unfamiliar tools in
    the same window broadens the investigation beyond the single deletion event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - cmd.exe
        - powershell.exe
        - powershell_ise.exe
        - pwsh.dll
      selection_cli_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
        - 'rm '
        - 'remove-item '
        - 'rmdir '
      selection_cli_iis_dir:
        CommandLine|contains: \inetpub\logs\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - cmd.exe
        - powershell.exe
        - powershell_ise.exe
        - pwsh.dll
      selection_cli_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
        - 'rm '
        - 'remove-item '
        - 'rmdir '
      selection_cli_iis_dir:
        CommandLine|contains: \inetpub\logs\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same account triggered similar deletions or other suspicious activity on other web servers, the scope of the
    incident may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - cmd.exe
        - powershell.exe
        - powershell_ise.exe
        - pwsh.dll
      selection_cli_del:
        CommandLine|contains:
        - 'del '
        - 'erase '
        - 'rm '
        - 'remove-item '
        - 'rmdir '
      selection_cli_iis_dir:
        CommandLine|contains: \inetpub\logs\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What activity occurred on this host after the IIS logs were deleted?
  context: Log deletion is often the cleanup phase of an intrusion. Examining process activity immediately after the deletion
    reveals whether the operator continued with additional destruction, persistence, or data staging once the request
    records were gone. A gap in IIS logging followed by further process creation in that window points to the activity the
    deletion was meant to obscure.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering or log clearing actions performed on this host?
  context: An operator who deletes IIS request logs often clears other evidence as well — wiping Windows event logs,
    deleting shadow copies, or disabling endpoint protection. Finding multiple tampering events from the same user or parent
    process indicates a deliberate anti-forensic effort spanning several controls rather than an isolated log cleanup.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Anti-forensic log deletion typically follows the activity it is meant to hide. Earlier detections on the same host
    — web-application exploitation, web-shell execution, reconnaissance, or credential access — may reveal the intrusion
    stages that preceded the deletion and help reconstruct the timeline the deleted logs would otherwise show.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
