name: Remote Access Tool - Anydesk Execution From Suspicious Folder
id: 9cdfe894-80af-46b3-a217-5547be304fbf
description: |
  Fires when a process identified as AnyDesk (by image name AnyDesk.exe or AnyDeskMSI.exe, or by AnyDesk vendor metadata in the Description, Product, or Company fields) executes, AND that process is NOT running from a standard install location (the AnyDesk Program Files directories). Remote desktop software like AnyDesk is widely used for legitimate IT support, so the rule narrows on the non-standard launch path: an AnyDesk binary running from a user-writable or otherwise unexpected directory is consistent with an operator dropping a portable copy for unsanctioned interactive access rather than a sanctioned vendor install. Investigation should confirm the binary's identity and launch path, establish whether the tool is authorized and tied to an active support session, and determine whether persistence, outbound beaconing, or operator hands-on-keyboard activity followed the execution.
type: detection
detection_id: 065b00ca-5d5c-4557-ac95-64a6d0b64d86
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Is this binary AnyDesk by name or vendor metadata, and is it running from a folder outside the standard AnyDesk install paths?
  context: Before investing investigation time, confirm the alert is a true positive. The rule matches an AnyDesk identity by image name AnyDesk.exe or AnyDeskMSI.exe, or by the Description, Product, or Company vendor fields, AND it requires the image path NOT to be one of the standard AnyDesk install directories. Confirm both halves hold for this event by reviewing the full image path against the AppData and Program Files AnyDesk locations the rule excludes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Company
      - Description
      - Product
- question: Is this user and host expected to run a remote desktop support tool from a non-standard location?
  context: Legitimate remote support activity is usually performed by IT staff or a known support process, and from sanctioned install paths. Knowing whether the user role and host function are consistent with running AnyDesk from an unexpected folder is often the fastest way to separate a true positive from authorized but unusually deployed support software.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is AnyDesk on the organization's approved remote access software list for this host?
  context: Organizations typically sanction a specific remote access tool for IT support and treat all others as exceptions. AnyDesk not appearing on the approved list for this host -- even though it is well-known commercial software -- may represent shadow IT or attacker-deployed persistence. An unauthorized remote access tool should be checked regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or scheduled support session that explains this AnyDesk execution?
  context: Legitimate AnyDesk usage typically correlates with an active support ticket, a scheduled maintenance window, or a user request. If no support context exists for this session, the tool may have been installed by an operator for persistent interactive access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What full path did this AnyDesk binary run from, and what command-line arguments were passed?
  context: The full image path and command line reveal where the binary was staged and how it was launched. A path under a user profile, temp, or download directory rather than a managed install location points to a portable or operator-dropped copy. Decode any arguments for unattended-access or silent-install switches that configure the tool for remote control without a prompt.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this AnyDesk binary, and is that parent chain expected for remote support software?
  context: The parent process reveals how the tool was invoked. Sanctioned deployment is usually driven by a software-distribution agent, an installer service, or a user double-click via explorer.exe. Unusual parents such as mshta.exe, wscript.exe, powershell.exe, or an exploited server process point to scripted or exploitation-driven delivery rather than a normal install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Where was this AnyDesk binary written to disk, and what process dropped it into that non-standard folder?
  context: A remote desktop tool running from outside its managed install path was usually staged there first by a downloader, archive extractor, or script. Reviewing the file-write that created the binary at this path identifies the writer process and timing, which separates a sanctioned redeploy from an operator dropping a portable copy. Pivot on the directory the alerting image ran from.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\AnyDesk.exe'
          - '\AnyDeskMSI.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What external endpoints did this AnyDesk binary connect to, and are they the vendor's relay infrastructure or a custom address?
  context: Remote desktop tools establish outbound connections to relay servers or cloud infrastructure to carry the interactive session. Connections to the vendor's own relay endpoints are consistent with normal operation, while connections to an unrelated IP or a non-standard high port point to a self-hosted relay or attacker-controlled endpoint. Reviewing the destination and port distinguishes sanctioned use from operator-controlled access.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Was a new auto-start service or autorun entry created on this host around the time AnyDesk ran?
  context: Remote access tooling is frequently made persistent by registering an auto-start service or autorun entry so the operator keeps access across reboots and logoffs. A service-install event close in time to the AnyDesk execution -- especially one pointing at the same binary or directory -- shifts the disposition from a one-off support session toward established persistence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
- question: What child processes did this AnyDesk binary spawn afterward?
  context: The processes spawned by a remote access tool reveal whether an operator took hands-on-keyboard action through the session. A remote desktop agent normally does not spawn command interpreters; child cmd.exe, powershell.exe, or reconnaissance binaries indicate interactive control was used for execution rather than ordinary support.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this host run AnyDesk before, or is this a first-time appearance of the tool here?
  context: A remote desktop tool that has never run on a host is more suspicious than one that appears regularly as part of sanctioned support. Zero or very low historical counts indicate first-time or rare execution, which combined with a non-standard launch path strengthens the case for unsanctioned deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched the rule's pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: Even sanctioned tools can be abused. The query mirrors the rule's selection and exclusion structure scoped to this host, so the resulting parent and user distribution reflects how this rule's specific firing pattern has historically run here rather than generic AnyDesk usage. A new parent process or an unexpected user account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      filter:
        Image|contains:
        - \AppData\
        - Program Files (x86)\AnyDesk
        - Program Files\AnyDesk
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      filter:
        Image|contains:
        - \AppData\
        - Program Files (x86)\AnyDesk
        - Program Files\AnyDesk
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      filter:
        Image|contains:
        - \AppData\
        - Program Files (x86)\AnyDesk
        - Program Files\AnyDesk
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of unsanctioned remote access may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      filter:
        Image|contains:
        - \AppData\
        - Program Files (x86)\AnyDesk
        - Program Files\AnyDesk
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- exploitation of an exposed service, reconnaissance, or credential access -- may reveal the stages that preceded the remote access tool and help reconstruct how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
