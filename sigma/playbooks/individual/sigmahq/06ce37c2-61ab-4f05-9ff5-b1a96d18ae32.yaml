name: WMIC Loading Scripting Libraries
id: 566c4a31-ea70-48e4-be78-9768250a67b7
description: |
  Detects wmic.exe loading jscript.dll or vbscript.dll, the module-load footprint of XSL script
  processing (T1220): the /FORMAT switch makes wmic retrieve and process an XSL stylesheet whose
  embedded JScript or VBScript executes under a signed system binary, bypassing application
  control (the SquiblyTwo pattern). Routine inventory commands such as wmic os get lastbootuptime,
  wmic os get locale, and wmic ntevent also load vbscript.dll, so the load event alone cannot
  separate benign from malicious; the investigation pivots to the wmic command line (was /FORMAT
  present and where did it point), the parent chain, network retrieval by the wmic process, and
  what the embedded script executed afterward.
type: detection
detection_id: 06ce37c2-61ab-4f05-9ff5-b1a96d18ae32
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Is the alerting event wmic.exe loading jscript.dll or vbscript.dll, matching the rule's detection criteria?
  context: |
    Confirm the alert from the exact module path (ImageLoaded) and the loading process (Image).
    The rule fires when wmic.exe loads either scripting engine DLL. The load itself is ambiguous:
    several benign wmic queries (os get lastbootuptime, os get locale, ntevent) load vbscript.dll
    with no script processing involved, so treat this as the entry point and let the command-line
    review carry the true-positive call.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user or host expected to run WMI command-line queries?
  context: |
    wmic is a standard administrative and inventory tool, so asset-management scripts, help-desk
    sessions, and monitoring agents invoke it routinely on many fleets. A wmic execution under an
    administrator or automation account on a managed server reads differently from one under a
    standard user on a workstation with no inventory tooling.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full wmic command line, and does it include a /FORMAT switch?
  context: |
    The command line is the decisive triage signal for this alert. A /FORMAT argument pointing to
    an HTTP(S) or UNC location, or to a local stylesheet file, means wmic retrieved and processed
    script-bearing XSL content; the file extension is irrelevant because wmic processes whatever
    the target contains, so a /FORMAT target ending in .jpeg or another innocuous extension still
    executes script. Command lines without /FORMAT, such as os get lastbootuptime, os get locale,
    or ntevent queries, are the documented benign loaders of vbscript.dll.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched wmic, and is that parent chain expected?
  context: |
    Legitimate wmic use typically parents from interactive shells, management-agent services, or
    inventory scripts under known automation accounts. Script hosts (wscript.exe, cscript.exe,
    mshta.exe), Office applications, or browser processes launching wmic point to macro or
    delivery-stage invocation rather than administration; validate the parent chain before
    accepting the execution as routine.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other modules did this wmic process load, and do any point to script or managed-code execution?
  context: |
    The full module list tells the story beyond the alerting scripting DLL. Watch for .NET CLR
    libraries (clr.dll, mscoree.dll, clrjit.dll) inside wmic.exe, a documented indicator of
    managed-code execution bridged through XSL script; msxml libraries confirming stylesheet
    processing; and any unsigned module or module loaded from a user-writable path, which points
    to planted rather than system components.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Are the scripting DLLs loaded by wmic the genuine signed system libraries?
  context: |
    Authentic jscript.dll and vbscript.dll are Microsoft-signed and live under System32 or
    SysWOW64. The load event carries the module's signing status and hash directly: a scripting
    DLL from any other path, or one whose signature status is Unsigned, Expired, Distrusted, or
    Invalid, changes the investigation from XSL script abuse to DLL substitution. The hash also
    supports a threat-intelligence reputation lookup.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Did the wmic process initiate outbound network connections to retrieve a remote stylesheet?
  context: |
    Remote XSL execution fetches the stylesheet over HTTP(S) or a UNC path from inside wmic
    itself, so egress from this process around the scripting-DLL load indicates remote retrieval
    with no file staged on disk beforehand. Compare the destinations against any URL visible in
    the command line; organizations that legitimately run remote XSL transforms usually have a
    small, stable set of internal destinations, and anything outside that set deserves the full
    payload review.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What child processes did wmic spawn after the scripting engine loaded?
  context: |
    Script embedded in an XSL stylesheet commonly launches its real payload as a child of
    wmic.exe: command shells, PowerShell, script hosts, or download utilities appearing under this
    wmic instance within a tight window of the DLL load complete the execution chain. Benign
    inventory queries spawn no children at all, so any child here shifts weight toward script
    execution.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the XSL stylesheet or any file written by wmic still on disk for analysis?
  context: |
    A local stylesheet referenced by /FORMAT, files dropped by the embedded script, and the .NET
    CLR usage log wmic.exe.log (written when managed code runs inside wmic) are all recoverable
    artifacts. Files written by this wmic instance or its children identify the payload; if any
    survive, capture hashes and preserve copies for content review or sandbox analysis.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: |
    XSL script execution is usually one link in a longer sequence. Aggregated parent-child process
    pairs around the alert reveal the surrounding context, such as reconnaissance commands before
    the wmic invocation or staging activity after it; novel low-count pairs stand out against
    repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously loaded scripting DLLs into wmic, which programs and users drove it, and does this alert fit that pattern?
  context: |
    Hosts with inventory automation fire this exact pattern on a schedule under the same
    account, because routine wmic queries load vbscript.dll too. The query mirrors the rule's
    selection scoped to this host, so the program and user distribution reflects how the rule's
    specific firing pattern has historically run here; a wmic path outside System32\wbem, an
    unexpected user account, or off-schedule timing is the deviation worth chasing. Image-load
    events lack parent lineage — pivot to wmic's process-start event to see what launched it.
  range: -14d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \wmic.exe
        ImageLoaded|endswith:
        - \jscript.dll
        - \vbscript.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Was wmic.exe executed from its expected path?
  context: |
    The genuine binary lives at C:\Windows\System32\wbem\wmic.exe (or the SysWOW64 equivalent),
    and application-control block lists target it by path. A wmic.exe running from a user profile,
    temp directory, or any non-wbem location was copied or renamed to evade path-based
    allowlisting; compare Image against the expected path and OriginalFileName against the PE
    metadata.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: |
    Operators who proxy code through one signed binary often rotate across several to find one the
    environment does not block. Other proxy-execution utilities running on the same host in the
    same day, especially with URLs, script paths, or DLL entrypoints in their command lines,
    strengthen the case that the wmic activity was one attempt among several rather than an
    isolated administrative action.
  range: -24h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host loaded scripting DLLs into wmic over the past 90 days, and what invocations are typical?
  context: |
    A first-time occurrence of this pattern on a host reads very differently from one that fires
    daily under stable inventory automation. The query mirrors the rule's selection scoped to this
    host, so the count reflects the rule's specific firing pattern rather than generic wmic usage,
    and the projected command lines let the analyst compare typical historical invocations against
    the alerting one.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \wmic.exe
        ImageLoaded|endswith:
        - \jscript.dll
        - \vbscript.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: |
    Code execution gained through XSL script processing is transient, so operators commonly follow
    it by installing persistence: scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    event subscriptions (wmic itself can create event consumers). Multiple persistence tool
    invocations in the same window indicate intentional stacking rather than isolated
    administrative work.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: |
    File-based persistence bypasses command-line detection entirely: an executable or script
    placed in a Startup folder or a path referenced by a Run key persists without running
    schtasks, sc, or reg. File monitoring captures these drops even when the payload script
    avoids standard persistence tools, so pair this check with the process-based persistence
    review.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host, such as suspicious downloads, script-host activity, or
    defense tampering, may reveal the delivery stages that preceded the wmic invocation and help
    reconstruct the timeline from initial access to proxy execution.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
