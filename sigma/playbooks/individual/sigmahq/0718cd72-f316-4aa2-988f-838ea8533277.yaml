name: Suspicious Start-Process PassThru
id: f68881ec-cb4b-4da5-a3b6-db0810643e89
description: |
  Detects a PowerShell script block containing the Start-Process cmdlet (or its alias saps)
  invoked with both the -PassThru and -FilePath parameters. -FilePath names the program to
  launch and -PassThru returns the spawned process object — a combination common in legitimate
  installers, deployment scripts, and admin automation that wait on or manage what they start,
  but also used by loaders and test harnesses to launch a staged or renamed executable while
  keeping a handle to it for later control. Investigation should determine what file -FilePath
  points to, whether that binary's on-disk name matches its metadata identity, how it arrived
  on the host, and whether the launch fits the account's and host's normal automation.
type: detection
detection_id: 0718cd72-f316-4aa2-988f-838ea8533277
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain Start-Process or saps with both the -PassThru and -FilePath parameters?
  context: >-
    The rule fires only when the script text contains 'Start-Process ' or the alias 'saps '
    AND both '-PassThru ' and '-FilePath ' (each followed by a space). Long scripts are split
    across multiple 4104 events — this retrieves every chunk of the alerting block in
    sequence/total order so the match is judged on the complete script, not just the alerting
    fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run automation that launches programs from PowerShell scripts?
  context: >-
    Start-Process with -PassThru and -FilePath is a standard construct in installers,
    deployment scripts, and admin tooling that need to wait on or manage the program they
    start. This displays the alerting block's host, user, and on-disk script path (when
    file-based). A SYSTEM user usually means deployment tooling or a vendor agent — judge by
    the host's role and where the script lives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the complete script do, and what program does -FilePath launch?
  context: >-
    The query reassembles the full block by script block id (long scripts chunk across 4104
    events). Script block content is post-decoding ground truth — -EncodedCommand wrappers are
    already unwrapped — but string concatenation, format operators, and backtick escaping
    still need manual decoding. Read the -FilePath value and any -ArgumentList, and note
    options that change how the launch behaves, such as -WindowStyle Hidden (no visible
    window), -Verb RunAs (elevation), -Credential (alternate user), and -PassThru itself,
    which hands the script the process object so it can wait on, inspect, or stop what it
    started.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the alerting script exist on disk, and what created it?
  context: >-
    When the block ran from a file, its path is recorded on the 4104 event. A script in a
    user-writable or staging location (Temp, AppData, ProgramData, Downloads) implies a
    delivery step that wrote it — find the file-creation event to identify the process and
    account that staged it. Interactive or in-memory execution records no path at all; for a
    block that stages a process launch, fileless execution is itself worth noting as an
    evasion choice.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: What is the actual identity of the program the script launched?
  context: >-
    Process events for this user's PowerShell child processes around the alert carry the
    identity evidence. An on-disk name that differs from the PE OriginalFileName metadata is
    the renamed-utility pattern behind this technique — cmd, cscript, wscript, or powershell
    running under another name. Submit the hash for reputation checking, and treat execution
    from a non-standard directory (Temp, AppData, ProgramData, Downloads rather than the
    utility's expected install path) as a second mismatch signal alongside the metadata
    comparison.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - Image
    - OriginalFileName
    - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did the program the script launches arrive on this host?
  context: >-
    Staged or renamed binaries do not appear spontaneously — they are downloaded, extracted
    from an archive, copied over remote-admin channels, or dropped by another process. The
    script-block event does not record the launch target as a field, so read the -FilePath
    value from the script text and locate that name in this listing of the user's file
    activity; the Image column identifies the writing process. Creation shortly before
    execution in a user-writable directory matches deliberate staging, while a system path
    written by an installer long before reads as installed software.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
    - TargetFilename
    - Image
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What processes did this user's PowerShell hosts spawn after the script ran?
  context: >-
    Script-block events carry no process identity, so the closest process-side view is
    children of the user's PowerShell hosts in the hours after the alert — the launch target
    named in -FilePath should appear here as a child. Once identified, pivot on that process
    for its own children, file writes, and network activity to see what it did once running.
    Command interpreters, discovery commands, or unfamiliar binaries launched under
    innocuous-looking names indicate the launch served an operational purpose; the
    fleet-distribution questions show whether the same binary appears on other hosts.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - Image
    - CommandLine
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this script ran?
  context: >-
    Loaders that stage a hidden or renamed launch often first weaken PowerShell defenses.
    Common precursors include AMSI bypass (patching amsi.dll in memory, AmsiUtils or
    amsiInitFailed strings), execution-policy overrides (-ExecutionPolicy Bypass, -ep bypass),
    Defender tampering (Set-MpPreference, DisableRealtimeMonitoring), and downgrade to
    PowerShell v2, which lacks script-block logging. Any of these in the hour before the alert
    moves the reading of the launch away from routine automation and toward deliberate
    evasion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is full script block logging enabled on this host, or only suspicious-content logging?
  context: >-
    PowerShell records every script block at verbose level only when the Script Block Logging
    policy is enabled; by default it logs just the blocks the engine auto-flags as suspicious,
    at warning level. On a warning-only host this alert is a fragment of the host's PowerShell
    activity, not all of it — absence of surrounding 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-history result in
    this investigation can bear.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Has this exact script block run on this host before?
  context: >-
    The script block hash matches byte-identical content only — zero history means this exact
    script is new to the host, while months of routine appearances point to deployment tooling
    or admin automation. A trivially modified script hashes differently, so no history says
    nothing about near-variants; and on a host without full Script Block Logging, history
    contains only auto-flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- always_include: true
  question: Has this user previously run scripts with this Start-Process pattern, and does that fit their role?
  context: >-
    The query mirrors the rule's selection — Start-Process or saps together with -PassThru and
    -FilePath — scoped to this user over 90 days, aggregated by host. An account that has
    never produced the pattern is a stronger deviation than one whose automation produces it
    daily. Weigh the count against the user's role and typical tooling, remembering that only
    hosts logging script blocks (or blocks the engine auto-flagged) contribute history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - 'Start-Process '
        - 'saps '
      selection_param:
        ScriptBlockText|contains|all:
        - '-PassThru '
        - '-FilePath '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Which hosts have historically produced this Start-Process pattern, and is the alerting host among them?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the
    behavior, and script-block events carry no process identity to pivot on — the meaningful
    pivot is the pattern itself. This mirrors the rule's selection fleet-wide over 90 days,
    aggregated by host. A pattern routinely present on many hosts reads as deployment tooling
    or vendor automation; one appearing only on this host, or for the first time, is the
    deviation worth chasing. Only hosts shipping the PowerShell channel can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - 'Start-Process '
        - 'saps '
      selection_param:
        ScriptBlockText|contains|all:
        - '-PassThru '
        - '-FilePath '
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block — recon, staging, and follow-on tooling
    produce a cluster of script blocks in a short window, and surrounding blocks from the same
    session often contain plaintext the alerting fragment lacks. The log level of each event
    also matters here, since verbose entries mean full logging is on while warning-only
    entries mean you are seeing just the auto-flagged subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating the host's process activity in the alert window collapses repetitive agent
    telemetry into high-count rows while novel parent-child pairs stand out at low counts.
    Look for the staging that precedes a masqueraded launch — a download, an archive
    extraction, a scheduled-task registration — and for the discovery or credential-access
    commands that commonly follow one.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is
    confined to this endpoint or the same account is active elsewhere, which changes the scope
    of the investigation. If the alert fired under SYSTEM, a machine account, or another
    service principal, this returns routine agent telemetry — the fleet-pattern question is
    the meaningful substitute in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this Start-Process pattern fire on other hosts in the same window?
  context: >-
    Under a service principal the user pivot degenerates, so this mirrors the rule's selection
    fleet-wide in the alert window, aggregated by host. Several hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
    Only hosts shipping the PowerShell channel — and, for content the engine did not
    auto-flag, with full Script Block Logging enabled — can appear, so absence elsewhere is
    weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - 'Start-Process '
        - 'saps '
      selection_param:
        ScriptBlockText|contains|all:
        - '-PassThru '
        - '-FilePath '
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did the same script block run on other hosts in the environment?
  context: >-
    Identical content across many hosts points to deployment tooling, GPO logon scripts, or
    vendor agents; the same block on a small set of unrelated hosts is the profile of lateral
    movement or hands-on activity. Coverage is policy-gated per host — only hosts logging
    script blocks can appear — so absence on other hosts is weak evidence on a
    default-logging fleet.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A staged launch is rarely the first step. Earlier detections on the same host — defense
    tampering, download activity, reconnaissance, credential access — reconstruct what
    preceded this event and show whether the launch is one stage of a longer sequence rather
    than an isolated script.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
