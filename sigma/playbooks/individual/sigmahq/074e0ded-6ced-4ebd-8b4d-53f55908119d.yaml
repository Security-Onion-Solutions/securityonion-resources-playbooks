name: AWL Bypass with Winrm.vbs and Malicious WsmPty.xsl/WsmTxt.xsl
id: 412535ad-e19e-4ae9-98bb-868727599c55
description: |
  Detects a script host (cscript.exe or wscript.exe, possibly renamed and relocated) executing winrm.vbs with a
  -format:pretty or -format:text argument from a directory outside C:\Windows\System32 or C:\Windows\SysWOW64. The rule
  fires when the command line contains "winrm" AND a format argument (pretty or text, with or without quotes) AND the
  script-host Image does not start from a system folder. winrm.vbs is a Microsoft-signed VBScript that loads WsmPty.xsl or
  WsmTxt.xsl from the script host's own directory; an attacker who copies a script host to a writable directory and drops a
  malicious WsmPty.xsl/WsmTxt.xsl alongside it can have winrm.vbs execute attacker-controlled JScript inside the signed
  chain, bypassing application allow-listing. The investigation determines whether the script host and its on-disk XSL are
  legitimate catalog-signed copies, what JScript any non-catalog XSL would run, and whether the execution led to child
  processes or follow-on activity.
type: detection
detection_id: 074e0ded-6ced-4ebd-8b4d-53f55908119d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did a script host run winrm.vbs with a format:pretty or format:text argument from a non-system folder?
  context: Before investing investigation time, confirm the alert is a true positive. Review the exact command line and the
    script-host Image path against the rule's criteria. The rule fires only when the command line contains "winrm" AND a
    format argument (pretty or text, quoted or unquoted) AND the executing Image does not start from C:\Windows\System32 or
    C:\Windows\SysWOW64. Confirm all three hold and note the full Image path, since a host running from outside a system
    folder is the core anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to administer WinRM from a command-line script host?
  context: Legitimate WinRM administration via winrm.vbs runs from the signed copy in C:\Windows\System32, not from a copied
    or relocated script host. Knowing whether the user role and host function involve scripted remote-management tooling is
    often the fastest way to separate routine administration from a proxy-execution bypass.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this winrm.vbs invocation do? Decode the format argument, the winrm sub-operation, and the host
    path.
  context: The full command line reveals the specific action. Decode the format argument (pretty loads WsmPty.xsl, text loads
    WsmTxt.xsl from the script host's directory), the winrm sub-command (get, enumerate, invoke), and the directory the
    script host ran from. A host path outside System32/SysWOW64 means winrm.vbs reads an XSL from an attacker-writable
    location rather than the catalog-signed System32 copy. A path segment named cscript.exe holding a renamed host satisfies
    winrm.vbs's substring check while running a different binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: winrm
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned this script host and is that parent chain expected?
  context: The parent process reveals how the script host was invoked. Interactive administration typically descends from
    explorer.exe or a console shell; invocation from office applications, mshta.exe, a download utility, or an unexpected
    automation parent points to scripted or operator-driven abuse rather than routine WinRM management.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run a script host from this directory?
  context: A script host executing from outside the system folders is the anomaly this rule flags. Zero or very low historical
    counts for this Image path on this host indicate first-time or rare execution and raise the likelihood that the host was
    copied into a writable directory specifically to read an attacker-controlled XSL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimate WinRM scripting can match loosely. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern (winrm plus a format
    argument from a non-system folder) has historically run here. A new parent process, an unexpected user account, or an
    unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      contains_format_pretty_arg:
        CommandLine|contains:
        - format:pretty
        - format:"pretty"
        - format:"text"
        - format:text
      image_from_system_folder:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      contains_winrm:
        CommandLine|contains: winrm
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this script host spawn afterward?
  context: A malicious WsmPty.xsl or WsmTxt.xsl embeds a JScript block that runs arbitrary code; a proof-of-concept payload
    spawns cmd.exe, while production payloads bridge to unsigned .NET execution. Child processes such as cmd.exe,
    powershell.exe, or a network or download utility descending from this script host reveal the actual payload the XSL
    transform executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Proxy-execution bypasses rarely stand alone. Activity surrounding the script-host execution may reveal the staging
    of the copied host and XSL, reconnaissance, privilege escalation, or persistence that provides broader context for the
    investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic script-host usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      contains_format_pretty_arg:
        CommandLine|contains:
        - format:pretty
        - format:"pretty"
        - format:"text"
        - format:text
      image_from_system_folder:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      contains_winrm:
        CommandLine|contains: winrm
      condition: contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)
    fields:
    - host.name
- question: What WsmPty.xsl, WsmTxt.xsl, or script-host file was written into the directory this host ran from?
  context: The bypass requires two files on disk in an attacker-writable directory, a copied script host (cscript.exe or a
    renamed wscript.exe) and a malicious WsmPty.xsl or WsmTxt.xsl that winrm.vbs reads in place of the catalog-signed System32
    copy. Surfacing recent writes of these filenames, and who wrote them, ties the execution to the staging step. A
    WsmPty.xsl or WsmTxt.xsl whose hash differs from the System32 catalog-signed version is the suspicious artifact; legitimate
    copies rarely change.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_files:
        TargetFilename|endswith:
        - \WsmPty.xsl
        - \WsmTxt.xsl
        - \cscript.exe
        - \wscript.exe
      condition: selection_host and selection_files
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      contains_format_pretty_arg:
        CommandLine|contains:
        - format:pretty
        - format:"pretty"
        - format:"text"
        - format:text
      image_from_system_folder:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      contains_winrm:
        CommandLine|contains: winrm
      _pb_scope:
        User|expand: '%User%'
      condition: (contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      contains_format_pretty_arg:
        CommandLine|contains:
        - format:pretty
        - format:"pretty"
        - format:"text"
        - format:text
      image_from_system_folder:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      contains_winrm:
        CommandLine|contains: winrm
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity on multiple endpoints. If the
    same user triggered similar script-host activity elsewhere, the scope of the operation may be larger than this single
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      contains_format_pretty_arg:
        CommandLine|contains:
        - format:pretty
        - format:"pretty"
        - format:"text"
        - format:text
      image_from_system_folder:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      contains_winrm:
        CommandLine|contains: winrm
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (contains_winrm and (contains_format_pretty_arg and not image_from_system_folder)) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context, what led to
    this event and what happened after, and whether it is part of a larger sequence. Look for the staging of files into a
    writable directory, reconnaissance, privilege escalation, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or file-staging activity, may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
