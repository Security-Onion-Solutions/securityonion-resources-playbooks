name: COM Hijack via Sdclt
id: 65dcf190-d2fe-4855-971e-b0afd750158e
description: >-
  Detects writes to the HKCU\Software\Classes\Folder\shell\open\command\DelegateExecute
  registry value, the setup step for a UAC bypass that hijacks the shell command read by
  sdclt.exe, an auto-elevating Windows Backup and Restore binary. When sdclt.exe subsequently
  runs, it executes the command planted in the hijacked key at high integrity without a
  consent prompt, so a standard-user write to this key can yield elevated code execution.
  The investigation should identify the process that wrote the value, the command stored in
  the key's default value, whether sdclt.exe was launched afterward, and what ran with
  elevated privileges as a result.
type: detection
detection_id: 07743f65-7ec9-404a-a519-913db7118a8d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: >-
    Does the modified registry path match \Software\Classes\Folder\shell\open\command\DelegateExecute?
  context: >-
    Before investing investigation time, confirm the recorded key path matches the rule's
    target. The rule fires on any write where the path contains
    \Software\Classes\Folder\shell\open\command\DelegateExecute; in the sdclt bypass this
    value is created (typically as an empty string) while the payload command is written to
    the same key's default value in the same session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: >-
    Is this user or host expected to modify shell command handler keys under HKCU\Software\Classes?
  context: >-
    Almost nothing legitimate writes a DelegateExecute value under Folder\shell\open\command;
    the key lives in the user hive and needs no elevation to modify, which is exactly why it
    is used for UAC bypass. The write should originate from the logged-on user's own session,
    so a SYSTEM or machine-account attribution makes the writing process (Image) the better
    pivot for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: >-
    Does the user recall running a tool or installer that could modify backup and restore shell handlers?
  context: >-
    Direct confirmation from the person behind the account is often the fastest legitimacy
    check. Normal software installation and Windows maintenance do not touch this key, so if
    the user does not recall running anything unusual around the alert time, treat the write
    as unauthorized and continue with the payload and elevation checks. If they do recall
    something, capture what they ran and why before closing the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: >-
    What parent process started the registry-writing process, and is that chain expected?
  context: >-
    The hijack write can come from reg.exe or PowerShell under a script host, from a dropper
    the user launched, or directly from injected code. Tracing the writing process's own
    parent shows how it arrived on the host; a browser, mail client, archive utility, or
    Office application in the chain suggests the write followed a download or phishing vector.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: >-
    What exact key and value were modified, and is this a known elevation-hijack location?
  context: >-
    HKCU\Software\Classes\Folder\shell\open\command is read by sdclt.exe, an auto-elevating
    Windows Backup and Restore binary, when it opens its backup UI. Because the key lives in
    the user hive, a standard user can plant a command that the elevated read then executes;
    the presence of the DelegateExecute value (typically empty) is what forces the shell to
    use the planted command instead of the normal COM handler.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: >-
    What command is stored in the hijacked key's default value, and what does it launch?
  context: >-
    The alerting write sets DelegateExecute, but the actual payload command sits in the same
    key's default value, written in the same session. Review all writes under
    Folder\shell\open\command for value data containing an executable path or interpreter
    command; paths under Temp, AppData, ProgramData, or Public are typical for staged
    payloads. Details is absent for binary or empty value data, so an empty DelegateExecute
    row here is expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Software\Classes\Folder\shell\open\command'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the hijack staged from a command line using reg.exe, PowerShell, or cmd.exe?
  context: >-
    When the bypass is run through script tooling, the registry write leaves a visible
    command line referencing Classes\Folder, Shell\Open\command, or DelegateExecute. A
    matching command shows exactly what was written and from which interpreter; an empty
    result means the values were set through direct API calls (typical for compiled droppers
    and injected code), not that the write was benign.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Was sdclt.exe launched after the write, and what child processes did it spawn?
  context: >-
    The hijack only pays off when sdclt.exe runs: it auto-elevates, reads the planted
    command, and executes it at high integrity. Public exploit modules launch sdclt.exe
    within seconds of the registry write, often via a hidden cmd.exe, so tight timing between
    the write and this launch indicates automation. Any non-Microsoft child under sdclt.exe
    is the elevated payload; note its path and integrity level.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sdclt:
        host.name|expand: '%hostname%'
        Image|endswith: '\sdclt.exe'
      selection_child:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\sdclt.exe'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
      - ParentImage
      - IntegrityLevel
- question: What ran at High or System integrity on this host after the bypass?
  context: >-
    Elevation is a means to an end. Typical follow-ups within minutes of a successful bypass
    include credential dumping, persistence installation under HKLM or as services and
    scheduled tasks, and security tool tampering. Focus on elevated binaries running from
    user-writable paths such as Temp, AppData, or Public (the planted payload itself usually
    executes from one of these) and on elevated command interpreters with unusual arguments.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: >-
    Did the registry-writing process or its children drop the payload the planted command points to?
  context: >-
    The bypass sequence stages an executable (commonly a randomly named file in the user's
    Temp directory) before triggering sdclt.exe. Correlating file activity by the writing
    process and its children locates that drop and shows whether the file the hijacked
    command references is present. The file-write event carries no hash; if the payload
    exists, hash it from its later execution event or retrieve the file for a reputation
    check.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other registry modifications landed on this host in the same window?
  context: >-
    Bypass tooling writes several values in one pass (the payload command plus
    DelegateExecute), and hands-on operators frequently combine elevation setup with
    persistence Run keys or security setting changes. The triggering key will appear in these
    results; the signal is what else was modified and whether one writing process touched
    multiple security-relevant paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the alert?
  context: >-
    The registry write is one step in a longer sequence. Aggregated parent-child pairs
    collapse routine agent noise into high-count rows while novel pairs stand out at low
    counts; look for script hosts under Office applications, interpreters under unusual
    parents, and binaries launching from user-writable paths.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other privilege-escalation or related detections fire on this host near this alert?
  context: >-
    Operators blocked by one bypass variant commonly try others (fodhelper, eventvwr, and
    computerdefaults use the same registry-hijack pattern against different auto-elevating
    binaries), so multiple bypass detections in a short window indicate deliberate escalation
    activity. Also scan for defense tampering, reconnaissance, or credential access
    detections before and after the write; the alert sequence reconstructs the attack stages
    around this event.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Were persistence mechanisms installed on this host around the elevation attempt?
  context: >-
    A successful bypass is frequently followed by durable footholds: scheduled tasks,
    services, or Run keys written at the elevated level. Executions of the standard
    persistence tools in this window, grouped by command, show whether the temporary
    elevation was converted into something that survives reboot and logoff.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this registry key been modified before on this host?
  context: >-
    Folder\shell\open\command\DelegateExecute should essentially never appear in a host's
    registry history, so any prior writes are notable and worth the same scrutiny as the
    alerting one. Value-deletion events are not emitted by endpoint telemetry, so attacker
    cleanup cannot be observed directly; judge whether the hijack is still active from this
    re-modification history and from whether the planted command executed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same registry key modified on other hosts in the environment?
  context: >-
    This key has no legitimate fleet-wide management use, so the same write appearing on
    multiple hosts suggests a spreading tool or a shared delivery vector rather than policy.
    Compare the value data and writing processes across hosts; identical planted commands on
    several machines point to one operation rather than coincidence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
