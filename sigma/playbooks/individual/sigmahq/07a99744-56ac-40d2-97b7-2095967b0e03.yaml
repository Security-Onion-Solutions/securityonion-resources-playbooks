name: Potential Privilege Escalation Attempt Via .Exe.Local Technique
id: 3f6f4770-83a5-4096-a158-fd2880453951
description: |
  Detects creation of a comctl32.dll inside a "*.exe.local" folder under C:\Windows\System32,
  targeting one of five system binaries (logonUI.exe, werFault.exe, consent.exe, narrator.exe,
  wermgr.exe). A ".local" folder next to a binary forces side-by-side DLL redirection: Windows
  loads DLLs from the redirection folder in preference to System32, so a comctl32.dll planted
  there is loaded in place of the genuine common-controls library the next time the target
  binary runs. Because those binaries run in a SYSTEM context, this converts an arbitrary
  directory-creation primitive into execution as NT AUTHORITY\SYSTEM. Normal Windows servicing
  never creates these redirection folders under System32, so the investigation should confirm
  the exact path and target binary, identify the process that obtained write access there,
  determine whether the planted DLL is a payload, and establish whether a target binary
  actually loaded it.
type: detection
detection_id: 07a99744-56ac-40d2-97b7-2095967b0e03
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was a comctl32.dll written under a *.exe.local folder in C:\Windows\System32?
  context: Before investing analysis time, confirm the alert is a true positive by reviewing
    the full file path. It should show one of the five target-binary redirection folders
    (logonUI.exe.local, werFault.exe.local, consent.exe.local, narrator.exe.local, or
    wermgr.exe.local) under System32 with a comctl32.dll inside it. Note which target binary
    the folder names, because that determines what triggers the SYSTEM-level load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create directories or files under C:\Windows\System32?
  context: Legitimate administration and Windows servicing rarely create new folder structures
    directly under System32, and never the ".exe.local" side-by-side redirection folders this
    rule targets. Knowing whether the user role and host function involve writing to System32
    is often the fastest way to separate a routine servicing operation from an exploit. When
    the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this comctl32.dll the legitimate Windows common-controls library or a planted payload?
  context: The DLL in the redirection folder is loaded in place of the signed System32
    comctl32.dll. Retrieve it and compare against the genuine common-controls library, checking
    signing status, file size, imports, and embedded strings. A payload here typically exports
    the expected entry points to stay loadable while running attacker code in the loading
    process. Content analysis requires manual retrieval from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
        TargetFilename|contains: '.exe.local\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process created the .exe.local directory and DLL, and what was its command line and parent?
  context: The responsible process reveals how write access under System32 was obtained. A
    non-privileged process reaching a protected system directory is the exploit primitive here,
    commonly a directory-creation flaw in a privileged service or a purpose-built tool. The
    command line and parent lineage distinguish a legitimate installer from an escalation attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did a System32 binary load this comctl32.dll from the .exe.local path, and what is its hash and signature?
  context: The escalation only succeeds when one of the target binaries loads the redirected
    DLL, and that load runs in a SYSTEM context. A comctl32.dll loaded from a ".exe.local" path,
    an unsigned or unexpectedly-signed library, or a hash with known detections confirms the
    sideload fired. DLL load events carry the library hash directly; submit it to threat
    intelligence to determine whether it is known malicious, benign, or previously unseen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '.exe.local\'
        ImageLoaded|endswith: '\comctl32.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the planted comctl32.dll still on disk, or was the .exe.local folder removed after the alert?
  context: The file's post-alert lifecycle drives urgency and next steps. A DLL still on disk
    can be retrieved, hashed, and analyzed; a folder deleted shortly after creation suggests
    cleanup or that the sideload already executed and the actor is covering the primitive.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did any of the redirection-target system binaries execute after the DLL was planted?
  context: Each target binary has its own trigger that causes it to load comctl32.dll. logonUI.exe
    and narrator.exe fire on lock, logon, and ease-of-access; werFault.exe on a process crash or
    a FailFast call; wermgr.exe on the Windows Error Reporting scheduled task; consent.exe on a
    UAC elevation prompt. Execution of one of these after the drop is what loads the redirected
    DLL as SYSTEM, so its presence marks the sideload actually triggering.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\logonUI.exe'
          - '\werFault.exe'
          - '\consent.exe'
          - '\narrator.exe'
          - '\wermgr.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ProcessGuid
- question: What other files did the responsible process write or delete around the alert?
  context: Staging a working redirection folder involves more than one write; the side-by-side
    layout requires an amd64_microsoft.windows.common-controls subfolder before the DLL lands,
    and a dropper often stages additional payloads alongside it. The breadth and paths of the
    process's other file activity enumerate what else needs review and distinguish a single
    artifact from broader staging.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the *.exe.local redirection folders on this host, and by which processes?
  context: The ".exe.local" side-by-side folders under System32 are not created by normal Windows
    operation. Other files landing in these folders, or a second target binary getting its own
    ".exe.local" folder, reveal whether this is an isolated attempt or a broader escalation
    effort, and which process is driving it.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '.exe.local\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a comctl32.dll ever been written to a .exe.local folder on this host before?
  context: Legitimate Windows servicing never creates these redirection folders, so any prior
    appearance is itself notable. A zero or near-zero 90-day count marks this write as first-time
    and anomalous; a recurring count would point to an established automation or a persistent
    foothold worth tracing back.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
        TargetFilename|contains: '.exe.local\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has the same .exe.local comctl32.dll pattern appeared on any other hosts?
  context: The same redirection folder on multiple hosts points to scripted or pushed
    exploitation rather than a one-off; a single host suggests a targeted or manual attempt.
    If it appears widely, map the distribution and timeline to understand how the primitive
    is being delivered.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
        TargetFilename|contains: '.exe.local\'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this .exe.local sideload pattern before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving the user's 90-day
    history of this specific redirection-folder write aggregated by host, not generic file
    activity. A user who has never produced this pattern is more suspicious than one who does
    so regularly. These writes frequently occur under a machine or service account, in which
    case user history does not attribute the action and the parent-process history is the
    meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows\System32\logonUI.exe.local
        - C:\Windows\System32\werFault.exe.local
        - C:\Windows\System32\consent.exe.local
        - C:\Windows\System32\narrator.exe.local
        - C:\Windows\System32\wermgr.exe.local
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this .exe.local sideload pattern, or is the program new for this activity?
  context: When the write occurs under a service principal, user identity does not attribute
    behavior; the launch mechanism does. The query mirrors the rule's selection scoped to the
    alerting program, giving the 90-day history of this program driving this specific
    pattern aggregated by host. A program that already accounts for many prior events is vendor
    or OS automation; a new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows\System32\logonUI.exe.local
        - C:\Windows\System32\werFault.exe.local
        - C:\Windows\System32\consent.exe.local
        - C:\Windows\System32\narrator.exe.local
        - C:\Windows\System32\wermgr.exe.local
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the user's activity across all hosts in the alert window can reveal related
    staging, lateral movement, or activity on multiple endpoints. When the alert fires under
    SYSTEM or a machine account this returns broad agent-telemetry noise, in which case the
    parent-driven fleet view is the meaningful cross-host answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven .exe.local pattern fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism planted
    the redirection folder elsewhere in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith:
        - C:\Windows\System32\logonUI.exe.local
        - C:\Windows\System32\werFault.exe.local
        - C:\Windows\System32\consent.exe.local
        - C:\Windows\System32\narrator.exe.local
        - C:\Windows\System32\wermgr.exe.local
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a
    directory-creation or service-abuse flaw, reconnaissance, or a privileged write — may
    reveal how write access under System32 was obtained and help reconstruct the timeline
    that led to the sideload.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does an administrator recall creating a .exe.local directory under System32 or deploying this comctl32.dll?
  context: Direct confirmation from the human behind the account is often the fastest legitimacy
    check. Normal administration does not create side-by-side redirection folders under System32,
    so a confirmed owner is rare; an action no one recognizes points to an automated or exploited
    write and should escalate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were files also dropped to Startup folders or scheduled-task definition paths on this host?
  context: After gaining a SYSTEM foothold, an actor commonly stacks a second, simpler
    persistence mechanism. Drops into the Startup folder or a path referenced by a registry
    Run key achieve persistence without running standard persistence tools, and file event
    monitoring captures these even when command-line-based detection is avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
