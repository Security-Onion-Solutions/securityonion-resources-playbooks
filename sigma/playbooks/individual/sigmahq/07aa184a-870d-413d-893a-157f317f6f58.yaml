name: Suspicious Reconnaissance Activity Via GatherNetworkInfo.VBS
id: 520616ec-5048-473c-8c8d-e58b291de3e7
description: |
  Detects a command line referencing the built-in script gatherNetworkInfo.vbs when it is NOT
  launched through the expected script hosts cscript.exe or wscript.exe. The script is a
  Microsoft-signed VBScript at C:\Windows\System32\gatherNetworkInfo.vbs that performs
  comprehensive host enumeration, dumping event logs, network configuration, and hardware
  details into C:\Windows\System32\config\. Because the rule fires only when the invoker is
  something other than the normal script hosts, the alert points to an unusual launch path for
  built-in reconnaissance. Determine what process invoked the script, whether the user and host
  routinely run it, and whether the activity sits inside a broader enumeration or staging
  sequence.
type: detection
detection_id: 07aa184a-870d-413d-893a-157f317f6f58
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line reference gatherNetworkInfo.vbs while NOT being launched by cscript.exe or wscript.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires when a command line contains gatherNetworkInfo.vbs AND the invoking image is not
    cscript.exe or wscript.exe. Read the full command line and the invoking process to verify
    both conditions hold, since the normal script-host invocation is explicitly excluded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run built-in host enumeration scripts?
  context: Legitimate administrative or imaging activity can reference gatherNetworkInfo.vbs.
    Knowing whether the user role and host function are consistent with running built-in
    reconnaissance scripts is often the fastest path to distinguishing routine operations from
    operator-driven enumeration. A standard user workstation invoking this script outside an
    imaging or support context is harder to explain than a build or provisioning host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this invocation of gatherNetworkInfo.vbs do? Decode the full command line and any arguments.
  context: The full command line reveals how the script was driven and what surrounded it. Decode
    any flags, redirection, chained commands, or output paths. The script writes its enumeration
    results into C:\Windows\System32\config\, so look for follow-on handling of those files. Note
    the invoking binary, since the rule fires precisely because the launcher is not the normal
    script host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: gatherNetworkInfo.vbs
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: Is the command line or the surrounding script content encoded or obfuscated, and what does it reconstruct to?
  context: VBScript-based execution frequently hides intent behind string concatenation or Chr()
    chains, and a launcher that is not the standard script host may pass encoded or assembled
    arguments. Reconstruct any Chr() chains, concatenated strings, or encoded fragments in the
    command line to recover the literal operation. The goal is to determine whether the
    invocation is a plain reference to the built-in script or a wrapper assembling additional
    behavior around it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this invocation, and is that parent chain expected for a built-in script?
  context: The parent process reveals how the script was driven. Because the normal script hosts
    are excluded by the rule, the invoking and parent chain are the central question. Legitimate
    imaging or provisioning often runs from setup or maintenance processes; parents such as
    mshta.exe, an Office application, a download cradle, or an unfamiliar interpreter point toward
    operator-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple
    reconnaissance commands in rapid succession is a signature pattern of post-compromise
    enumeration. Built-in host recon scripts are frequently paired with native discovery binaries
    that dump network configuration, ARP and DNS state, running processes, services, and account
    information. Several distinct recon binaries within the window alongside this script point to
    automated enumeration rather than isolated administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even built-in scripts can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific
    firing pattern has historically run here rather than generic VBScript usage. Deviations such
    as a new parent process, an unexpected user account, or an unusual command-line structure are the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: gatherNetworkInfo.vbs
      filter:
        Image|endswith:
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What processes ran immediately after this invocation, and do they handle the enumeration output?
  context: The script writes consolidated enumeration results into C:\Windows\System32\config\.
    Operator-driven recon typically follows collection with staging — archive creation, file
    copying, encoding, or upload tooling. Child and sibling processes spawned shortly after the
    invocation reveal whether the gathered data is being compressed, moved, or exfiltrated, which
    sharply raises severity over a bare enumeration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: gatherNetworkInfo.vbs
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the detected
    invocation may reveal archive and compression utilities, transfer tooling, or remote-execution
    helpers that turn host enumeration into a collection and staging operation. A cluster of
    built-in utilities running together is a stronger signal than the script appearing alone.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: gatherNetworkInfo.vbs
      filter:
        Image|endswith:
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: gatherNetworkInfo.vbs
      filter:
        Image|endswith:
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration
    spread across multiple endpoints. If the same user invoked this script or related recon on
    several hosts, the scope of the activity is broader than a single workstation and points
    toward a coordinated enumeration sweep.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: gatherNetworkInfo.vbs
      filter:
        Image|endswith:
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic VBScript usage. Many hosts firing
    the same pattern points to scripted deployment or imaging automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: gatherNetworkInfo.vbs
      filter:
        Image|endswith:
        - \cscript.exe
        - \wscript.exe
      condition: selection and not filter
    fields:
    - host.name
- question: Did the invoking process load the VBScript scripting engine modules, confirming actual VBScript interpretation rather than a passing string reference?
  context: A command line that merely names gatherNetworkInfo.vbs does not prove the script was
    interpreted. When VBScript actually executes, the host process loads scripting engine modules
    such as vbscript.dll and scrrun.dll. Correlating the invoking process to a load of those
    modules in the same window confirms the script ran and identifies which process hosted the
    interpreter, which matters because the normal script hosts are excluded by the rule. Absence
    of these loads suggests the command line referenced the script without interpreting it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\vbscript.dll'
          - '\scrrun.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - ProcessGuid
- question: Did object-access auditing on this host record enumeration of Group Policy or directory objects around the same time?
  context: Host enumeration scripts of this kind are often paired with broader discovery that
    reaches into Group Policy and directory objects. Object-access audit events record handle
    requests against directory service objects, which surface enumeration of groupPolicyContainer
    and related attributes that process-creation telemetry alone does not show. Correlating those
    access events with this invocation helps establish whether the activity is confined to local
    host data collection or extends into domain-level Group Policy discovery. If object-access
    auditing is not enabled in this environment, treat zero results as a visibility gap rather
    than evidence nothing occurred.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4661
      condition: selection
    fields:
      - SubjectUserName
      - ObjectType
      - ObjectName
