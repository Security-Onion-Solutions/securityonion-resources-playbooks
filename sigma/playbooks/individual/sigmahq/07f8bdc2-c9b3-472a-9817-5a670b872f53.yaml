name: Potential Reconnaissance For Cached Credentials Via Cmdkey.EXE
id: 53c60eca-6c3c-44e1-ac52-e5b51f408d02
description: |
  Detects cmdkey.exe run with the list flag (-l / /list), which enumerates the stored user names and
  credentials in Windows Credential Manager. The rule fires when the process is cmdkey.exe (by image name
  or original file name) AND the command line contains the list flag. Listing cached credentials is a
  reconnaissance step that lets an operator discover which remote systems a foothold can authenticate to
  transparently, often as a precursor to lateral movement using those cached credentials. Legitimate
  administrative use exists, so the investigation should determine who ran it, whether that user and host
  routinely manage stored credentials, and what activity followed.
type: detection
detection_id: 07f8bdc2-c9b3-472a-9817-5a670b872f53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did cmdkey.exe run with the list flag (-l or /list) as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line and process identity. The rule requires both that the process is cmdkey.exe (by image name
    or original file name) and that the command line contains the list flag, so confirm the flag is present
    and not a substring of an unrelated argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate stored Windows credentials?
  context: Listing cached credentials is a routine step for some administrators managing saved RDP or network
    credentials, but unusual for general users. Knowing whether the user role and host function are consistent
    with credential management is often the fastest path to distinguishing routine work from reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What credentials did the list operation enumerate, and was a specific target named?
  context: cmdkey targets Windows Credential Manager. A bare list flag returns every stored user name and
    credential on the system; a target-qualified form narrows to one host or domain. Identifying which stored
    credentials were exposed determines which remote systems the foothold could reach with transparently cached
    authentication, and therefore which accounts may need rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which accounts are reachable via the cached credentials, and do any have elevated privileges?
  context: The severity of cached-credential reconnaissance depends on what the stored credentials grant. Cached
    domain-admin or service-account credentials enable transparent authentication to high-value systems and
    require escalation; a standard user account may only need monitoring. Cross-reference the listed targets
    and the running user with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned cmdkey.exe and is that parent chain expected?
  context: The parent process reveals how the enumeration was invoked. Interactive use under explorer.exe or a
    console shell driven by an administrator looks different from cmdkey spawned by a script host, a remote
    execution tool, or a process call create from a management utility, which points to scripted or remote
    reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What child processes did cmdkey.exe spawn afterward?
  context: cmdkey is an information utility and does not normally spawn child processes. Children such as
    cmd.exe, powershell.exe, wmic.exe, or other remote-execution tooling launched from the same binary would be
    unexpected and suggest the enumeration was one step in a scripted sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were credential-store files or registry hive exports written on this host shortly after the alert?
  context: Cached-credential reconnaissance often precedes an attempt to extract the credentials themselves
    through registry hive exports or copies of credential and vault files. File-creation artifacts under user
    or vault credential directories, or hive copies near the alert time, escalate this from listing to
    collection. If file events are not collected in this environment, treat zero results as a visibility gap.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_cred:
        TargetFilename|contains:
          - '\Microsoft\Credentials\'
          - '\Microsoft\Vault\'
          - '\Microsoft\Protect\'
          - '.hive'
          - 'sam.save'
          - 'security.save'
          - 'system.save'
      condition: selection and filter_cred
    fields:
      - TargetFilename
      - Image
- question: Does this host normally run cmdkey.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or
    very low historical counts over the past 90 days indicate first-time or rare execution of cmdkey on this
    endpoint, which raises the weight of a credential-reconnaissance interpretation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this cmdkey list pattern, what parents and users drove it, and
    does the current alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific cmdkey list pattern has historically run
    here rather than generic cmdkey usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this cmdkey list pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    cmdkey list pattern rather than generic cmdkey usage. Many hosts firing the same pattern points to scripted
    deployment or management automation; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      condition: all of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar reconnaissance or remote-execution activity on multiple hosts,
    the scope may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \cmdkey.exe
      - OriginalFileName: cmdkey.exe
      selection_cli:
        CommandLine|contains|windash: ' -l'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the
    credential enumeration and what followed it. Look for reconnaissance, remote-execution tooling, or
    persistence mechanisms appearing as novel parent-child pairs at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host such as defense tampering, reconnaissance, or execution may reveal
    the attack stages that preceded the credential enumeration and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
