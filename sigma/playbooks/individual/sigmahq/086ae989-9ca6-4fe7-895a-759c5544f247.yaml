name: Potential Persistence Via TypedPaths
id: f12aca10-dc09-44f7-bd64-821ed3b28948
description: |
  Detects modification of values under the Explorer TypedPaths registry key (the per-user
  history of paths typed into the File Explorer address bar) by any process other than
  explorer.exe. Explorer only flushes this key when a File Explorer window closes, so a
  write from reg.exe, a script host, or other tooling indicates programmatic planting of
  an entry: a low-profile trick that seeds a local payload or UNC target to auto-complete
  for the user, serving persistence staging or lateral-movement bait. The investigation
  should identify the writing process and its origin, decode the planted path, and
  determine whether the referenced payload exists, was launched, and whether other hosts
  saw the same write.
type: detection
detection_id: 086ae989-9ca6-4fe7-895a-759c5544f247
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified key sit under Explorer's TypedPaths path, and was it written by something other than explorer.exe?
  context: This rule fires when a value under \Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\ is modified by any process except C:\Windows\explorer.exe or C:\Windows\SysWOW64\explorer.exe. Confirm the exact key path (TargetObject), the value data (Details), and the writing process (Image) against those criteria before investing further investigation time, since Explorer itself is the only routine writer of this key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to run tooling that edits Explorer's address-bar history?
  context: TypedPaths is normally maintained only by File Explorer when a window closes, so legitimate third-party writers are rare; profile-migration utilities, user-environment managers, and cleanup tools are the usual benign explanations. User attribution is present on most endpoint registry events, but when User is a machine account or missing, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user recall running a script or tool that changed File Explorer's typed-path history?
  context: Direct confirmation from the human behind the account is often the fastest path to a verdict. If the user recently ran a profile cleanup, migration, or automation tool, that may explain the write; if they recall nothing, ask what they were doing at the alert time and whether anyone else has access to the machine, since the account or host may be under someone else's control.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this registry write align with normal work hours and maintenance windows?
  context: Legitimate profile or cleanup tooling generally runs while the user is active or during scheduled maintenance. A TypedPaths write in the middle of the night, or while the user was verifiably away from the machine, points toward automated malware or a remote operator rather than routine activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which TypedPaths value was written, and does the write pattern look programmatic?
  context: TypedPaths stores the last 25 paths typed into the File Explorer address bar as values named url1 through url25, with url1 always the most recent; it is not an autostart location, so a write here plants a path that auto-completes for the user rather than executing directly. Adding one entry shifts existing values down (url1 becomes url2, and so on), so a single tool-driven write typically touches several values at once, which is itself a telltale of programmatic modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What path was planted in the TypedPaths value, and where does it point?
  context: Decode the Details data. A local executable or script path stages a payload for the user to launch via address-bar auto-complete, while a UNC path pointing at a remote host can seed lateral movement or coerce authentication to an attacker-controlled server the next time it is completed. Value data is absent for binary or empty writes; if Details is missing, retrieve the value directly from the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process launched the tool that wrote to TypedPaths, and is that chain expected?
  context: The writing process's creation event shows its parent and full command line. Interactive shells under explorer.exe suggest hands-on activity by whoever controls the session, while script hosts spawned by Office applications, browsers, or unexpected services point at delivered code rather than an administrator at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
- question: What other registry keys were modified on this host in the same session?
  context: Tooling that plants a TypedPaths entry rarely stops there. Look for writes to Run/RunOnce keys, service configurations, Winlogon, or policy keys landing in the same window, which reveal whether this was one step of a broader configuration change; the triggering key will appear in the results, and the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the planted path subsequently launched or referenced in any command line on this host?
  context: TypedPaths does not execute anything by itself; the payoff comes when the user or the attacker opens the planted path, so a later process whose command line references it confirms the mechanism was exercised. If the value data was empty or binary this query returns nothing by construction, so fall back to the decoded value and search for it manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Did the writing process also drop files, and does the path it planted still exist on disk?
  context: A TypedPaths entry pointing at a local payload only matters if that file exists; attackers commonly drop the payload and plant the pointer in the same session. File-write events carry no hash, so if the payload is present, hash it from a later execution event or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the process that wrote to TypedPaths communicate over the network?
  context: Registry-writing implants frequently retrieve payloads or report back in the same execution, so connections from the writing process to unfamiliar external addresses corroborate delivered tooling. If the planted value was a UNC path, also watch for later SMB connections to that host, which indicate the auto-complete bait was taken.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregated parent-child pairs collapse routine agent noise into high-count rows while novel combinations stand out at low counts, so scan the low-count pairs for reconnaissance, staging, privilege escalation, or additional persistence activity surrounding the write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that wrote to TypedPaths?
  context: Ninety days of history calibrates how unusual the writer is. A binary that runs daily under the same user reads very differently from one appearing for the first time minutes before the alert; zero or very low counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this TypedPaths value been modified before on this host?
  context: Routine TypedPaths churn comes from explorer.exe as the user browses, so a history dominated by Explorer with a single non-Explorer writer at alert time sharpens the finding, while a history of the same third-party tool writing it regularly suggests benign software behavior. Registry deletions are not collected in this telemetry, so judge cleanup from the key's re-modification history rather than expecting a removal event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this registry write and help reconstruct the full timeline of the intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did non-Explorer processes write to TypedPaths on other hosts?
  context: The same write appearing across many hosts points at deployed software or an administrative script, while a single host with a unique planted path is more consistent with targeted activity. TypedPaths lives in each user's registry hive, so compare the writing process and Details values across hosts rather than expecting identical key paths.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: '\Software\Microsoft\Windows\CurrentVersion\Explorer\TypedPaths\'
      filter:
        Image:
          - 'C:\Windows\explorer.exe'
          - 'C:\Windows\SysWOW64\explorer.exe'
      condition: selection and not filter
    fields:
      - host.name
      - Image
      - Details
- question: Were conventional persistence mechanisms also installed on this host?
  context: TypedPaths is an unreliable foothold on its own because it depends on the user completing the planted path, so an attacker who touches it often stacks dependable mechanisms alongside it, such as scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions. Executions of schtasks, sc, reg, bitsadmin, or wmic in the surrounding hours reveal that stacking.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or other persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely, since dropping an executable or shortcut into a Startup folder achieves reliable execution at logon without running schtasks or reg. Such a drop paired with the TypedPaths write would indicate the registry entry is bait or staging while the real persistence lives elsewhere.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
