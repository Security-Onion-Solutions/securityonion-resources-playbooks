name: Potential CommandLine Path Traversal Via Cmd.EXE
id: 777b87bf-a9a5-404d-b874-8dc07b55b484
description: |
  Detects cmd.exe invoked with an execution flag (/c, /k, or /r) where the command line also
  contains a /../../ path-traversal sequence. cmd.exe first tries to resolve the whole argument
  string as a single path; the ../ segments cancel out the leading command token, so the file the
  traversal resolves to runs instead of the intended program. This lets an attacker who controls part
  of a cmd.exe argument execute an arbitrary file anywhere on the same volume, regardless of extension
  or PATH. Legitimate hits are rare and usually come from vendor tooling that builds relative paths
  through ../ segments; investigation should establish what the traversal resolves to, what spawned
  cmd.exe, and whether the activity fits the host's normal pattern.
type: detection
detection_id: 087790e3-3287-436c-bccf-cbd0184a7db1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show cmd.exe run with /c, /k, or /r and a /../../ path-traversal sequence?
  context: Before investing investigation time, confirm the alert is a true positive. Review the parent
    and child command lines for cmd.exe invoked with an execution flag (/c, /k, or /r) alongside a
    /../../ sequence, and trace where the traversal resolves. The file the ../ segments resolve to is
    what actually executes, not the command token before it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run cmd.exe with relative path-traversal arguments?
  context: Legitimate administrative or build activity can construct command lines with ../ segments.
    Knowing whether the user role and host function normally involve cmd.exe wrappers that build
    relative paths is often the fastest way to separate vendor tooling from argument hijacking.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What file does the path-traversal sequence actually resolve to, and what arguments wrap it?
  context: The full command line reveals the resolved target. Walk the ../ segments back from the tail
    of the string to determine the absolute path that cmd.exe will execute, then note any arguments
    inserted between the leading command token and that path. The traversal can resolve to a file with
    any extension, including one disguised as a non-executable, so the resolved path matters more than
    the leading token.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: '/../../'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
      - ParentImage
- question: Is this parent expected to spawn cmd.exe with these arguments, and what started the parent?
  context: The parent-child relationship is the core signal here. cmd.exe built with a traversal argument
    is frequently assembled by an application that passes user-controlled input straight into a shell
    string. Tracing the parent's own origin reveals whether the chain is a legitimate wrapper or an
    application relaying attacker-influenced input into cmd.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: If the parent assembled one traversal command, it may have assembled others or spawned the
    resolved payload directly. Examining sibling processes from the same parent reveals the full scope
    of activity from that parent and whether multiple shell invocations were orchestrated together.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What child processes did this cmd.exe invocation spawn afterward?
  context: The processes spawned after the traversal resolves reveal its actual impact. cmd.exe running
    the path-traversed file may launch the resolved payload, which in turn spawns discovery, credential
    access, or download tooling. Unexpected children are the clearest evidence the hijack executed
    something other than the leading command token.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive
    it, and does the current alert fit?
  context: Even routine tooling can build relative paths. The query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how this specific firing
    pattern has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \cmd.exe
      - Image|endswith: \cmd.exe
      - OriginalFileName: cmd.exe
      selection_flags:
      - ParentCommandLine|contains:
        - /c
        - /k
        - /r
      - CommandLine|contains:
        - /c
        - /k
        - /r
      selection_path_traversal:
      - ParentCommandLine: /../../
      - CommandLine|contains: /../../
      filter_java:
        CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic cmd.exe usage. Many hosts firing the same
    traversal pattern points to a shared application or vendor wrapper that builds relative paths; a
    single host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \cmd.exe
      - Image|endswith: \cmd.exe
      - OriginalFileName: cmd.exe
      selection_flags:
      - ParentCommandLine|contains:
        - /c
        - /k
        - /r
      - CommandLine|contains:
        - /c
        - /k
        - /r
      selection_path_traversal:
      - ParentCommandLine: /../../
      - CommandLine|contains: /../../
      filter_java:
        CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
      condition: all of selection_* and not 1 of filter_*
    fields:
    - host.name
- question: Does this host normally run cmd.exe at all, and how often?
  context: A baseline of cmd.exe execution on this host frames the traversal event. Zero or very low
    historical counts indicate cmd.exe is itself unusual here, which raises the weight of any abnormal
    argument structure. High counts mean the discriminator is the traversal pattern rather than the binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \cmd.exe
      - Image|endswith: \cmd.exe
      - OriginalFileName: cmd.exe
      selection_flags:
      - ParentCommandLine|contains:
        - /c
        - /k
        - /r
      - CommandLine|contains:
        - /c
        - /k
        - /r
      selection_path_traversal:
      - ParentCommandLine: /../../
      - CommandLine|contains: /../../
      filter_java:
        CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \cmd.exe
      - Image|endswith: \cmd.exe
      - OriginalFileName: cmd.exe
      selection_flags:
      - ParentCommandLine|contains:
        - /c
        - /k
        - /r
      - CommandLine|contains:
        - /c
        - /k
        - /r
      selection_path_traversal:
      - ParentCommandLine: /../../
      - CommandLine|contains: /../../
      filter_java:
        CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across
    multiple endpoints. If the same user triggered similar shell activity on multiple hosts, the scope of
    the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - ParentImage|endswith: \cmd.exe
      - Image|endswith: \cmd.exe
      - OriginalFileName: cmd.exe
      selection_flags:
      - ParentCommandLine|contains:
        - /c
        - /k
        - /r
      - CommandLine|contains:
        - /c
        - /k
        - /r
      selection_path_traversal:
      - ParentCommandLine: /../../
      - CommandLine|contains: /../../
      filter_java:
        CommandLine|contains: \Tasktop\keycloak\bin\/../../jre\bin\java
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence mechanisms surrounding the cmd.exe
    invocation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host such as defense
    tampering, reconnaissance, or credential access may reveal the attack stages that preceded this event
    and help reconstruct the timeline leading up to the cmd.exe invocation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
