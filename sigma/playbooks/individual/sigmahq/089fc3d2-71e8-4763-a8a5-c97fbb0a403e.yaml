name: Regsvr32 DLL Execution With Suspicious File Extension
id: 2f004dc0-c255-4811-9bc3-f8f748c0087f
description: |
  Detects regsvr32.exe (or a binary whose original filename is REGSVR32.EXE) invoked with a command line ending in a file extension associated with images, documents, or temporary data rather than .dll or .ocx. The rule fires only when both conditions match: the process is regsvr32.exe AND the command line ends in one of the masquerading extensions. Loading code through regsvr32 with a non-DLL extension is a proxy-execution and masquerading pattern used to disguise a malicious DLL as benign data; legitimate COM registration almost always references a .dll or .ocx. Determine what the loaded file actually is, what spawned regsvr32, whether the host or user routinely runs this pattern, and whether the load was followed by network activity or child processes.
type: detection
detection_id: 089fc3d2-71e8-4763-a8a5-c97fbb0a403e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the regsvr32 command line end in one of the masquerading extensions
    this rule detects, and is the process regsvr32.exe?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line and process details. The rule fires only when
    the process is regsvr32.exe (by Image or OriginalFileName) AND the command line
    ends in a non-DLL extension such as .jpg, .png, .dat, .tmp, or .txt. Confirm both
    halves match the loaded file argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register COM objects or load DLLs via
    regsvr32?
  context: Legitimate administrative activity and software installers do invoke regsvr32,
    but almost always against a .dll or .ocx in a system or vendor install path. A
    user or host with no role that involves COM registration loading a file with an
    image or temp extension is harder to explain as routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What file is regsvr32 actually loading, and what does the full command
    line reveal about the load?
  context: The full command line reveals which file was passed to regsvr32 and any
    flags (/i, /u, /s, /n) that change registration behavior. Decode the file path
    and extension to identify whether the target lives in a temporary or user-profile
    directory and whether the extension masks an actual DLL. A file with an image
    or document extension loaded as code by regsvr32 is the masquerading behavior
    this rule fires on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|endswith:
          - .bin
          - .bmp
          - .cr2
          - .dat
          - .eps
          - .gif
          - .ico
          - .jpeg
          - .jpg
          - .log
          - .nef
          - .orf
          - .png
          - .raw
          - .rtf
          - .sr2
          - .temp
          - .tif
          - .tiff
          - .tmp
          - .txt
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned regsvr32, and is that parent chain expected?
  context: The parent process reveals how regsvr32 was invoked. Legitimate COM registration
    is usually launched by installers, explorer.exe, or services.exe. Parents such
    as office applications, wscript.exe, mshta.exe, or a macro host point to delivery
    through a document or script that dropped a disguised DLL and registered it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What modules did regsvr32 load into memory after it started, and were
    any unsigned or loaded from a user-writable path?
  context: Regsvr32 registers a DLL by loading it and calling its entry point, so
    the image-load events for the regsvr32 process show the actual module behind the
    disguised extension. A module loaded from a temporary or user-profile directory,
    or one that is unsigned or has a mismatched original filename, confirms that the
    file with the image or document extension is executable code rather than data.
    If image-load telemetry is not collected in this environment, treat zero results
    as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did regsvr32 make any outbound network connections around the time of
    this load?
  context: Regsvr32 can fetch and execute a remote scriptlet or the registered DLL
    can call out to a command channel after loading. Legitimate COM registration does
    not initiate network traffic, so any outbound connection from regsvr32 is a strong
    pivot toward staging or command-and-control. Note the destination address and
    port for correlation with other host activity.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What child processes did regsvr32 spawn afterward?
  context: The DLL loaded by regsvr32 may spawn follow-on processes for the next stage
    of an operation. Legitimate registration spawns nothing; unexpected children such
    as cmd.exe, powershell.exe, rundll32.exe, or a dropped executable indicate the
    registered module executed post-load activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this regsvr32 pattern, what parents
    and users normally drive it, and does the current alert fit?
  context: Even legitimate software can occasionally register a DLL with an unusual
    extension. The query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has run here before. A new parent process, an unexpected user account, or a first-time
    appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this regsvr32 pattern in the past week, and does
    the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of this firing pattern rather than generic regsvr32
    usage. Many hosts firing the same pattern points to a scripted deployment or vendor
    installer; one host or a small unrelated set points to manual operator activity
    or targeted delivery. Use the host spread and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on other hosts, the scope of the operation may be larger than this single load.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals
    what led to the regsvr32 load and what happened after, and whether it is part
    of a larger sequence. Look for a preceding document or script host, reconnaissance,
    privilege escalation, or persistence mechanisms.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution binary often use several. If regsvr32
    loaded a disguised DLL, check whether rundll32, mshta, msbuild, installutil, or
    similar binaries also ran on this host to execute code. Finding multiple proxy-execution
    LOLBins performing the same kind of code-loading strengthens the case for malicious
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was regsvr32 executed from an expected system path?
  context: Regsvr32 executed from outside System32 or SysWOW64 may indicate the binary
    was copied or renamed to evade path-based allowlists. A regsvr32.exe running from
    a user's temp or profile directory is more suspicious than one in its normal system
    location. Compare the Image path against OriginalFileName to confirm the binary
    identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this regsvr32 pattern over the past 90 days,
    and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than
    one used regularly under stable parents. The query mirrors the rule's selection
    scoped to this host, so the count reflects this specific firing pattern rather
    than generic regsvr32 usage. The command-line projection lets you compare typical
    invocation patterns and loaded-file extensions against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_cli:
        CommandLine|endswith:
        - .bin
        - .bmp
        - .cr2
        - .dat
        - .eps
        - .gif
        - .ico
        - .jpeg
        - .jpg
        - .log
        - .nef
        - .orf
        - .png
        - .raw
        - .rtf
        - .sr2
        - .temp
        - .tif
        - .tiff
        - .tmp
        - .txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
