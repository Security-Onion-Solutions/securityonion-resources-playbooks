name: Add Debugger Entry To AeDebug For Persistence
id: cc905b4d-e409-4b73-bcb8-bec746f71d65
description: |
  This rule fires when a value under the AeDebug\Debugger registry key is written with data ending in .dll, excluding the default Visual Studio JIT debugger command line. The AeDebug Debugger value defines the postmortem debugger command that Windows launches automatically whenever an application crashes, so pointing it at attacker-controlled code yields crash-triggered persistence that is invoked through the error-reporting process rather than the attacker's own process tree. Developer machines legitimately register debuggers here, so the investigation should determine what was written, which process wrote it, whether the referenced DLL exists and executed, and whether related persistence or tampering occurred on the host.
type: detection
detection_id: 092af964-4233-4373-b4ba-d86ea2890288
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Is this a write to the AeDebug Debugger value with data ending in .dll?
  context: >-
    The rule fires when the modified key path (TargetObject) contains the AeDebug Debugger
    value under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion and the value data (Details)
    ends in .dll, while the default Visual Studio JIT debugger command line (vsjitdebugger.exe)
    is filtered out. Confirm the exact path and value data before investing further investigation
    time, since a legitimate debugger registration that merely resembles the pattern can be
    closed quickly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to configure postmortem debuggers?
  context: >-
    Debugger registrations under AeDebug are routine on developer workstations where Visual
    Studio, WinDbg, or similar tooling is installed, and rare on servers or standard user
    machines. User attribution is present on most endpoint registry events; when the account
    shown is SYSTEM or a machine account, pivot on the writing process (Image) instead to
    judge whether the activity fits the host's role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user or an administrator recall configuring a debugger on this machine?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to a
    verdict. Installing or reconfiguring debugging tools sets this key legitimately; if the
    user does not recall installing developer tooling or changing crash-handling settings,
    the write may have come from malware or a compromised session. If they do recall it, ask
    what tool they installed and why the registered debugger is a DLL rather than a debugger
    executable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the written Debugger value fit debugger-based persistence rather than a legitimate debugger registration?
  context: >-
    AeDebug\Debugger is a well-known persistence location because Windows launches whatever
    command it holds each time an application crashes, outside the attacker's own process
    chain. Legitimate registrations point at debugger executables such as vsjitdebugger.exe
    or windbg.exe with process-ID placeholders; value data ending in .dll is atypical and
    suggests a payload meant to be loaded via a hosting binary such as rundll32.exe or a
    phantom-DLL arrangement. Judge the path in the data (user-writable directories like Temp,
    AppData, ProgramData, or Public are more suspect than program-files debugger installs).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was written across the AeDebug key, and was the Auto value set for silent invocation?
  context: >-
    Decode the full set of AeDebug writes, not just the Debugger value. An Auto value of 1
    makes Windows invoke the configured debugger on every crash without prompting the user,
    which attackers pair with a malicious Debugger entry to guarantee unattended execution;
    an AutoExclusionList subkey can exclude specific processes from triggering it. In the
    Debugger data itself, note the DLL's directory, any hosting command in front of the DLL
    path, and whether the path is user-writable.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\AeDebug\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Which process wrote the Debugger value, and what launched that process?
  context: >-
    The registry event carries the writing process identifier; its creation event reveals the
    full command line and parent. A reg.exe or PowerShell write under an interactive shell
    points to hands-on activity, an installer parent (msiexec.exe, setup executables) supports
    a legitimate tooling install, and a write from an unsigned binary in a user-writable path
    or under an unusual parent such as a script host or Office application points to
    compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
- question: What other registry changes landed on this host in the same window?
  context: >-
    Attackers who plant one persistence entry often make several configuration changes in the
    same session, such as additional autorun entries, service changes, or security-setting
    tampering. The triggering AeDebug write will appear in these results; the signal is what
    else was modified by the same writing process or account in the surrounding half hour. If
    the host is registry-noisy, focus on the writing process from the alert and on
    security-relevant paths such as Run, Services, Policies, Winlogon, and Image File
    Execution Options.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the process that wrote the Debugger value also drop a DLL on disk?
  context: >-
    Crash-triggered persistence only functions if the DLL referenced by the Debugger value
    exists at that path. Correlating file activity from the writing process and its children
    shows whether a DLL landed on disk in the same session as the registry write; compare any
    dropped path against the value data. File-write events carry no hash, so if the payload is
    present, hash it from a later load or execution event, or retrieve the file for a
    reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      proc_self:
        ProcessGuid|expand: '%ProcessGuid%'
      proc_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      payload_dll:
        TargetFilename|endswith: '.dll'
      condition: 1 of proc_* and payload_dll
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has an application crash already invoked the configured postmortem debugger?
  context: >-
    When an application crashes, the error-reporting process launches the AeDebug Debugger
    command with the crashing process ID substituted in, so children of werfault.exe reveal
    whether the planted entry has fired. Compare any launched image and command line against
    the value data from the alert; a hosting binary loading the configured DLL confirms the
    persistence is live, while ordinary debugger launches on a developer machine support a
    benign verdict.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\werfault.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentCommandLine
- question: Was the DLL referenced by the new Debugger value loaded by any process?
  context: >-
    A load of the configured DLL confirms the payload executed and yields its signature status
    and hash for a reputation lookup, since DLL load events carry hashes directly. This match
    works when the value data is a bare DLL path; if the data embeds a hosting command with
    arguments in front of the DLL, search on the trailing DLL path portion manually. An
    unsigned DLL loading from a user-writable directory is the pattern to escalate on.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - Hashes
- question: Was the Debugger value re-modified or restored after the alert?
  context: >-
    Registry value deletions are typically not captured by endpoint telemetry, so judge
    cleanup and persistence durability from the value's re-modification history instead. A
    later write restoring the vsjitdebugger.exe default suggests the change was reverted or
    was transient tooling behavior; no later writes means the alerted DLL entry likely still
    governs crash handling on this host; repeated writes cycling different payloads point to
    active attacker maintenance.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has the AeDebug Debugger value been modified on this host before?
  context: >-
    Debugger installs set this value legitimately at install time, so a host with a history of
    writes from developer tooling is consistent with the documented false-positive case. A
    first-ever modification, or a history where earlier writes came from installers but this
    one came from an unfamiliar binary, calibrates the alert toward compromise. Compare the
    Details values across history to see whether the same data has been set before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed this registry write?
  context: >-
    A writing binary that has never executed on this host before is more suspect than a
    routine tool such as reg.exe or an installer that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution of the writer, which pairs with
    the process-lineage findings to distinguish a freshly dropped implant from established
    software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the registry write
    collapses repetitive agent noise into high-count rows while novel parent-child pairs stand
    out at low counts; look for reconnaissance commands, payload staging, or additional
    persistence tooling in the minutes surrounding the write to establish whether this was a
    lone configuration change or one step in a longer sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was the AeDebug Debugger value modified on other hosts in the environment?
  context: >-
    The same value appearing across many hosts with identical data points to a software
    rollout or group-policy change, while the same DLL entry landing on a small set of hosts
    in sequence points to lateral movement. If only this host carries the modification, treat
    it as targeted. Compare the Details data and writing process across hosts to separate the
    two.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Attackers rarely rely on a single foothold. Beyond the crash-triggered AeDebug entry,
    check for scheduled tasks, service installs, autorun keys, BITS jobs, or WMI subscriptions
    created in the surrounding hours; multiple persistence installations in the same timeframe
    indicate deliberate stacking rather than an isolated administrative action. The
    registry-writing tool from this alert may itself appear here, so focus on what else was
    configured.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or Run-key persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely; dropping an executable or
    script into a Startup folder achieves the same goal as the registry entry without running
    any persistence tool. A drop into these locations in the same window as the AeDebug write
    would be a second, parallel persistence mechanism and strengthens the case that the
    activity was deliberate.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or
    credential access, may reveal the attack stages that preceded the persistence attempt and
    help reconstruct the timeline. A quiet host before a lone debugger registration reads
    differently from one with a chain of alerts building toward it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
