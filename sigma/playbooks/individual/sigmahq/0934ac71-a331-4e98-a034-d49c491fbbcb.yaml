name: PaperCut MF/NG Potential Exploitation
id: 286fc07c-35be-480e-8e9a-f21ccbdf6bd5
description: |
  Detects the PaperCut MF/NG application server process (pc-app.exe) spawning a command interpreter,
  script host, or system utility — the rule requires both the pc-app.exe parent AND a child whose Image
  ends in one of bash.exe, calc.exe, certutil.exe, cmd.exe, csc.exe, cscript.exe, dllhost.exe, mshta.exe,
  msiexec.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, scriptrunner.exe, wmic.exe,
  wscript.exe, or wsl.exe. The PaperCut server embeds a scripting runtime for printer templates; an
  authentication bypass followed by a print-script edit (CVE-2023-27350, CVE-2023-27351) lets injected
  script execute with the server's privileges, which on Windows are typically SYSTEM, so every child
  process inherits them. Legitimate print scripts and vendor maintenance can also invoke these binaries.
  Determine what the child process actually did, whether the server was reached from an unexpected source,
  and whether follow-on tooling — download activity, installer execution, or persistence — was created
  under the same parent.
type: detection
detection_id: 0934ac71-a331-4e98-a034-d49c491fbbcb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event show pc-app.exe as the parent and one of the interpreter or utility binaries the rule lists as the child?
  context: The rule requires both conditions together — a parent whose Image ends in pc-app.exe and a child whose Image ends in one of the seventeen listed binaries. Confirm both before investing further time, and note which child binary fired, since the analysis differs between a script host, a download utility, and an installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this print server and this account expected to launch command interpreters or scripting utilities from the PaperCut application server?
  context: The PaperCut application server runs as a service, so the account is usually SYSTEM or a dedicated service principal rather than an interactive administrator. Some deployments do drive maintenance or device automation through print scripts, so establish with the print-service owner whether any scripted child execution is sanctioned on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is pc-app.exe expected to spawn this child, and what started the PaperCut application server process itself?
  context: The parent-child relationship is the whole signal for this detection. The server is normally started by the service control manager at boot and runs for weeks; a pc-app.exe instance started recently, or started from an unexpected launcher, points at a restart that may itself be part of the activity. The parent's own command line also confirms this is the print application server rather than a similarly named binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same pc-app.exe instance spawn?
  context: Script-driven execution through the print server rarely stops at one process. A download step followed by an installer or a shell, all under the same server instance, describes a staged operation; a single isolated child is more consistent with a maintenance script. Reviewing the siblings also surfaces children that fall outside the rule's binary list and would not have alerted on their own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What exactly did the spawned binary do? Decode its full command line and working directory.
  context: The command line carries the operation. Read out any fetch of a remote file, the local path it was written to, any installer invocation and its properties, and any interpreter flags that suppress a window or relax execution policy. The working directory matters here because script-driven execution under the print server commonly writes and then runs payloads from whatever directory the server process happens to be in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Where the child is powershell.exe or pwsh.exe, injected print-script payloads commonly pass a base64 -EncodedCommand or build the string through concatenation and escaping. Decode it and identify the operation — a download cradle fetching a remote installer or script, an in-memory assembly load, or a reverse shell. Where the child is cmd.exe or a script host, read the readable command for the same elements instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content on this host?
  context: Event ID 4104 records the deobfuscated script text PowerShell actually executed, which is ground truth when the command line is encoded or assembled at runtime. If PowerShell operational logs are not ingested in this environment, treat an empty result as a visibility gap rather than evidence that nothing ran, and decode the payload from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: Payloads delivered through a scripting runtime frequently relax controls before running — execution policy bypass, real-time monitoring disabled, AMSI patched in memory, or a downgrade to the version 2 engine that lacks script block logging. Finding these on the same host in the preceding hour places the alerting child in a sequence rather than in isolation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the spawned binary open outbound network connections, and where did they go?
  context: Script execution through the print server is typically a delivery step — the child fetches a remote installer, script, or loader over HTTP. Resolve each destination and check whether it is a known vendor or update endpoint for this environment. Connections to a bare IP on a non-standard port, or to a recently registered domain, indicate the payload came from operator-controlled infrastructure rather than a print vendor.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What files did the PaperCut application server process write on this host around the alert?
  context: The exploitation path edits a printer script template held by the server, so the server process writes its own configuration and script state to disk as the injection lands. File writes from the server process in the alert window can pin the moment the script changed and can surface staged payloads dropped alongside it. Compare the paths against the server's normal data and log directories.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentName%'
      condition: selection
    fields:
      - TargetFilename
      - ProcessGuid
  answer_sources:
  - file_event
- question: Has pc-app.exe spawned this child binary on this host before?
  context: The print server does spawn helper processes in some deployments, so the discriminator is whether this specific pairing has any history. A count of zero over ninety days means the server has never launched this binary on this host and the pairing is new. A steady historical count points at a print script or vendor routine that predates the alert and can be confirmed with the print-service owner.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user, so the result is the user's ninety-day history of the print server spawning these binaries rather than generic use of a shell. A user with no prior history of this pattern is the more notable case; weigh any count against whether that account administers print services. Where the alert fires under SYSTEM or a service account, this pivot attributes nothing on its own.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pc-app.exe
        Image|endswith:
        - \bash.exe
        - \calc.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has the PaperCut application server historically driven this pattern on this host or elsewhere in the environment, or is the parent new for this activity?
  context: 'The print server normally runs as a service principal, and under a service principal user identity does not attribute behavior. The meaningful pivot is the launch mechanism: this query mirrors the rule''s selection structure scoped to the alerting parent process, giving the ninety-day history of pc-app.exe driving this specific pattern. A parent that already accounts for a large steady count across print servers is a deployed script or vendor routine; a first occurrence is the deviation to chase.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pc-app.exe
        Image|endswith:
        - \bash.exe
        - \calc.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: If the alert carries a named account, its activity on other hosts in the same window shows whether the print server was one stop in a wider operation. Where the alert fires under SYSTEM, a service account, or a machine account, this returns routine service and agent telemetry across the fleet and should be read as no answer rather than as scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other print servers in the same window?
  context: 'Under a service principal, asking what else the user did returns fleet-wide service noise. The mechanism is the better pivot: this query mirrors the rule''s selection structure scoped to the alerting parent process across every host in the alert window. Several print servers spawning these binaries within the same hour points at an internet-facing exposure being worked through in sequence, or at a pushed print-script change; a single host points at a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \pc-app.exe
        Image|endswith:
        - \bash.exe
        - \calc.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating every process on the host by binary and parent collapses steady service and agent telemetry into high-count rows while novel parent-child pairs stand out at low counts. Scan for reconnaissance utilities, credential access tooling, installer execution, or remote-access agent binaries appearing for the first time on a print server.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host help reconstruct the sequence — web-facing exploitation attempts, defense tampering, or reconnaissance preceding execution. A print server is normally a quiet host for detections, so any clustering of prior alerts in the same window is worth reading as a timeline rather than as separate events.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: Execution obtained through a print-script injection is transient — it lasts as long as the script and the server process. Operators therefore convert it into durable access, commonly by installing a remote monitoring and management agent or a service, which surfaces as scheduled-task, service-control, registry, or WMI tooling running on the host in the same window. Several of these within the same few hours describes intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
