name: PowerShell Set-Acl On Windows Folder
id: fa9bec76-0ea0-4857-9c40-b42cf2c22622
description: |
  Detects PowerShell using the Set-Acl cmdlet with an -AclObject argument to change
  the access control list on a file or folder under the Windows directory, where the
  applied rule grants a FullControl Allow permission. Set-Acl is dual-use — administrators
  use it for legitimate ACL hardening, while operators use it to grant themselves full
  control over otherwise protected system paths, lock files by denying access, or weaken
  protections on the Windows directory. The investigation should decode the full command
  line to identify the exact target path, the identity being granted access, and the
  rights applied, then determine whether the change is sanctioned administration or an
  attempt to modify permissions on a protected location.
type: detection
detection_id: 0944e002-e3f6-4eb5-bf69-3a3067b53d73
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line match the rule — PowerShell running Set-Acl with -AclObject against a path under C:\Windows and granting a FullControl Allow permission?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule requires all of four conditions together — a PowerShell image, the Set-Acl cmdlet
    with -AclObject, a -Path pointing under the Windows directory (literal C:\Windows,
    %windir%, or $env:windir), and the strings FullControl and Allow. Review the full
    command line and confirm each piece is present and refers to the same operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify access control lists on the Windows directory?
  context: Legitimate administrative activity can trigger this detection — installers,
    configuration scripts, and IT hardening routines sometimes adjust ACLs under the
    Windows directory. Knowing whether the account is an administrator or service principal
    and whether this host's role involves system-path maintenance is often the fastest way
    to separate sanctioned administration from an attempt to grant access to a protected
    location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this Set-Acl command do? Decode the full command line and identify the target path, identity, and rights.
  context: The full command line reveals the specific permission change. Decode the -Path
    value to find the exact file or folder under the Windows directory, the -AclObject
    construction to find which identity is being granted access, and confirm the rights
    (FullControl) and access type (Allow). Watch for SetAccessRuleProtection calls that
    disable inheritance, and for the access rule being built from a New-Object
    FileSystemAccessRule with an explicit identity such as a built-in group or the current
    user. The query scopes to PowerShell executions running Set-Acl on this host so that a
    multi-line operation (Get-Acl, rule construction, then Set-Acl) is captured together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - 'Set-Acl '
          - '-AclObject '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Operators frequently use PowerShell's -EncodedCommand (-enc) parameter or string
    concatenation, backtick escaping, and variable substitution to hide the ACL change.
    Even when the Set-Acl, -AclObject, and path strings are visible, the surrounding script
    may build the target path or the granted identity from concatenated or encoded
    fragments. Decode any encoded segments and resolve variable substitution to confirm
    which path is being modified and which identity receives FullControl.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which file or folder under the Windows directory had its ACL changed, and what does the new access rule grant?
  context: The -Path argument names the protected location whose permissions are being
    rewritten, and the constructed access rule names the identity and rights applied to it.
    Identify the exact target (a specific binary, a system folder, or the Windows root) and
    the principal granted FullControl Allow. Granting a standard user or a newly created
    account full control over a system binary or directory is a setup step for tampering,
    file replacement, or defeating path-based protections; an administrator re-applying a
    known hardening baseline is routine.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '-Path "C:\Windows'
          - "-Path 'C:\\Windows"
          - '-Path %windir%'
          - '-Path $env:windir'
      condition: selection
    fields:
      - CommandLine
      - User
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the ACL change was invoked. A change run by a user
    interactively from explorer.exe or a known management tool differs from one launched by
    an Office application, a script host such as wscript.exe or mshta.exe, or a remote
    execution service. An unusual parent for an ACL modification on the Windows directory
    points toward scripted or remotely driven tampering rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the full script that performed the ACL change?
  context: Script block logging records the deobfuscated script content PowerShell actually
    executed, including the Get-Acl retrieval, the FileSystemAccessRule construction, any
    SetAccessRuleProtection call that disables inheritance, and the Set-Acl write — even
    when the command line was encoded or built from fragments. This provides ground truth
    about which path and identity were involved. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell security controls before modifying
    permissions on protected paths. Common precursors include AMSI bypass (patching
    amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass),
    constrained language mode escape, and downgrade to PowerShell v2 which lacks logging.
    Finding these in the hour before the ACL change strengthens the case that the activity
    is deliberate evasion rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Does the targeted path still exist, and were files written under it around the time of the change?
  context: After a permission change grants access to a protected location, the next step is
    often writing to it — dropping a binary, replacing a system file, or staging a payload.
    Checking for file events under the Windows directory path that was ACL'd, near the time
    of the change, shows whether the granted access was used. The path from the command line
    scopes the search so it returns activity on the targeted location rather than all file
    events on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did this PowerShell instance spawn afterward?
  context: The processes spawned after the ACL change reveal its purpose. A permission change
    followed by writing to the now-accessible path, launching a binary from it, or starting
    a service points to the change being a setup step for further action. Legitimate
    hardening scripts usually end at the ACL write without spawning unexpected children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine administration can match this rule. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific Set-Acl-on-Windows-folder pattern has historically run here,
    not generic PowerShell usage. A new parent process, an unexpected account, or a
    first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
      selection_paths:
        CommandLine|contains:
        - -Path "C:\Windows
        - -Path 'C:\Windows
        - -Path %windir%
        - -Path $env:windir
      selection_permissions:
        CommandLine|contains:
        - FullControl
        - Allow
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
      selection_paths:
        CommandLine|contains:
        - -Path "C:\Windows
        - -Path 'C:\Windows
        - -Path %windir%
        - -Path $env:windir
      selection_permissions:
        CommandLine|contains:
        - FullControl
        - Allow
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
      selection_paths:
        CommandLine|contains:
        - -Path "C:\Windows
        - -Path 'C:\Windows
        - -Path %windir%
        - -Path $env:windir
      selection_permissions:
        CommandLine|contains:
        - FullControl
        - Allow
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    modified permissions or ran PowerShell on other hosts in the same window, the scope of
    the activity is larger than this one system.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
      selection_paths:
        CommandLine|contains:
        - -Path "C:\Windows
        - -Path 'C:\Windows
        - -Path %windir%
        - -Path $env:windir
      selection_permissions:
        CommandLine|contains:
        - FullControl
        - Allow
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of this Set-Acl-on-Windows-folder pattern rather than generic
    PowerShell usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation that hardens system paths; one host or a small unrelated set points to
    manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      selection_cmdlet:
        CommandLine|contains|all:
        - 'Set-Acl '
        - '-AclObject '
      selection_paths:
        CommandLine|contains:
        - -Path "C:\Windows
        - -Path 'C:\Windows
        - -Path %windir%
        - -Path $env:windir
      selection_permissions:
        CommandLine|contains:
        - FullControl
        - Allow
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the permission change and what followed — reconnaissance, defense tampering, or
    persistence staged through the now-accessible path. Aggregating by process and parent
    collapses repetitive agent telemetry into high-count rows while novel parent-child pairs
    stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
