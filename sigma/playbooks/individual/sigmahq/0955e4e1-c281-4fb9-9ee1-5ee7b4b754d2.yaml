name: Use of Pcalua For Execution
id: 61241920-30b8-4560-99bf-033051ff6d89
description: |
  Detects pcalua.exe (the Program Compatibility Assistant launcher) invoked with the -a switch, which opens and runs an
  arbitrary binary on its behalf. Because the launched process is parented by pcalua.exe rather than the shell or script
  host that actually initiated it, this signed Microsoft helper can proxy the execution of attacker payloads and break
  parent-image-based monitoring as well as application allowlists. Legitimate use exists (compatibility shims, the
  occasional admin batch script), so the investigation should determine what binary the -a argument pointed at, where it
  lived, what the launched process then did, and whether the launch mechanism and user fit normal behavior for this host.
type: detection
detection_id: 0955e4e1-c281-4fb9-9ee1-5ee7b4b754d2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show pcalua.exe launching a binary with the -a switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires when the process image ends in pcalua.exe and the command line contains the -a switch, which names the
    binary the Program Compatibility Assistant will run. Read the argument that follows -a to see what was actually launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user/host expected to launch binaries through the Program Compatibility Assistant?
  context: Legitimate use of pcalua.exe -a is uncommon outside of compatibility troubleshooting and a few batch-script
    patterns. Knowing whether the user role and host function are consistent with running an arbitrary binary through this
    launcher is often the fastest path to distinguishing routine operations from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What binary did pcalua.exe run, and where did that target path live?
  context: The argument after -a is the binary pcalua.exe executes on the user's behalf. Decode the full path and any
    additional switches (-c, -p, -d). A target under a temp, download, or user-profile directory, an SMB/UNC path, or a
    .dll/.cpl rather than a plain .exe all point toward proxy execution of attacker-supplied content rather than a
    compatibility shim for an installed application.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned pcalua.exe and is that parent chain expected?
  context: The parent process reveals how pcalua.exe was invoked. This launcher is frequently reached straight from the
    Run dialog or a shell, so an explorer.exe, cmd.exe, or powershell.exe parent is plausible. A parent such as
    mshta.exe, wscript.exe, a Office application, or an unsigned binary suggests the launcher is being used to obscure the
    true origin of the spawned process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did pcalua.exe spawn afterward?
  context: The whole point of this technique is that the launched binary becomes a child of pcalua.exe rather than of the
    shell that started it. The child processes therefore reveal the actual payload and its impact. Unexpected children
    such as cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or a binary from a user-writable directory indicate
    post-exploitation activity proxied through the launcher.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run pcalua.exe?
  context: A launcher that has never been seen on a host is more suspicious than one that runs regularly as part of a
    documented compatibility workflow. Zero or very low historical counts over the baseline window indicate first-time or
    rare execution and raise the weight of the other findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity,
    and does the current alert fit that pattern?
  context: Even a legitimate launcher can be abused. The query mirrors the rule's selection structure scoped to this host,
    so the resulting parent/user distribution reflects how the pcalua.exe -a pattern (not generic pcalua usage) has
    historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: Proxy execution through a LOLBin is usually one step in a sequence. Activity surrounding the pcalua.exe launch
    may reveal reconnaissance, privilege escalation, persistence installation, or data staging that provides broader
    context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    pcalua.exe -a firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to a
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may be larger
    than this single launch.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the attack stages that preceded this launch and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who reach for one indirect-execution LOLBin often use several. If pcalua.exe proxied a binary, check
    whether forfiles, rundll32, regsvr32, mshta, msiexec, or similar signed helpers were also used to spawn arbitrary code
    on this host. Finding multiple LOLBins performing the same proxy-execution role strengthens the case for malicious
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\forfiles.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
          - '\conhost.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was pcalua.exe executed from its expected System32 path?
  context: The legitimate launcher lives at C:\Windows\System32\pcalua.exe. A pcalua.exe running from a user temp,
    download, or profile directory may indicate the binary was copied or renamed to evade path-based allowlists. Confirm
    the image path and the original file name reported in the binary's metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's pcalua.exe pattern over the past 90 days, and what command-line
    patterns are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents.
    The query mirrors the rule's selection structure scoped to this host, so the count reflects the pcalua.exe -a pattern
    rather than generic use of the binary. The command-line projection lets the analyst compare the typical invocation
    patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcalua.exe
        CommandLine|contains: ' -a'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
