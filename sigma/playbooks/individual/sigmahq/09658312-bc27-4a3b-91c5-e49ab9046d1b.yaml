name: WMIC Unquoted Services Path Lookup - PowerShell
id: 5d35b313-98a1-471c-a230-3dc1db30bc09
description: |
  Detects PowerShell script blocks that query Win32_Service through Get-WmiObject or its
  gwmi alias for the Name, DisplayName, PathName, and StartMode properties together — the
  property set used to hunt unquoted service paths and other service misconfigurations
  that enable privilege escalation. The same lookup appears in public enumeration scripts
  and post-exploitation tooling, but administrators and authorized penetration testers run
  it too when auditing service configurations. The investigation should establish who ran
  the script and from where, whether it is part of a broader host-enumeration script, and
  whether follow-on activity (writes into service directories, service reconfiguration,
  WMI method execution) indicates the discovered weaknesses were acted on.
type: detection
detection_id: 09658312-bc27-4a3b-91c5-e49ab9046d1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the full script block contain the WMI service-enumeration pattern this rule detects?
  context: >-
    The rule fires when script text contains 'Get-WmiObject ' or its 'gwmi ' alias together
    with all of ' Win32_Service ', Name, DisplayName, PathName, and StartMode — the property
    tuple of an unquoted-service-path lookup. Long scripts are split across multiple 4104
    events; this retrieves every chunk of the alerting block (sequence/total order) so the
    match is judged on the complete script rather than the alerting fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run service-enumeration PowerShell?
  context: >-
    Service inventories via WMI are routine for administrators, deployment tooling, and
    monitoring agents, but the Name/DisplayName/PathName/StartMode tuple is the standard
    lookup for unquoted service paths specifically. Weigh the user's role and the host's
    function against that intent; a SYSTEM user usually means deployment tooling or a
    vendor agent — judge by the host role and the script's on-disk path when one is
    recorded on the event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the complete script do with the service data, and does any obfuscation remain in the text?
  context: >-
    Script-block content is post-decoding ground truth — encoded-command wrappers are
    already unwrapped when the block is logged, so read the reassembled text directly.
    Public privilege-escalation enumeration scripts pair the Win32_Service query with
    environment, user, group, ACL, and credential collection and often write everything to
    an output file for offline analysis. Note any output paths, URLs fetched, additional
    classes queried, and remaining string-level obfuscation (concatenation, format
    operators, backticks) that still needs manual decoding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the enumeration script exist on disk, and what created it?
  context: >-
    When the script block ran from a file, its path is recorded on the event. Enumeration
    scripts are typically dropped into user-writable or staging locations (Temp, AppData,
    ProgramData, Downloads) — find the file-creation event to identify the process and
    account that staged the script. Interactive or in-memory execution records no path at
    all, which is itself worth noting for this content: a fileless service-enumeration
    one-liner is common in hands-on-keyboard activity.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Did the PowerShell session spawn follow-on processes after the enumeration ran?
  context: >-
    A script-block event records content, not outcome. Enumeration scripts frequently
    shell out — wmic.exe service listings, accesschk.exe permission checks, netstat or
    schtasks — and an operator who found a writable service path typically moves to sc.exe
    or net.exe to reconfigure and restart the target service. The script-block event
    carries no process link, so this pivots by host, user, and time across PowerShell host
    processes; a SYSTEM-owned alert makes the user anchor broad rather than precise.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did script activity on this host move from WMI queries to WMI method execution or event subscriptions?
  context: >-
    The alerting pattern is a read-only query. Adversarial WMI use escalates to method
    invocation — Invoke-WmiMethod or Invoke-CimMethod (for instance against Win32_Process),
    wmic process call, or Register-WmiEvent subscriptions for triggered execution. On
    default hosts only content matching the built-in suspicious-strings list is logged, so
    an empty result does not establish that no such activity ran.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ScriptBlockText|contains:
          - 'Invoke-WmiMethod'
          - 'Invoke-CimMethod'
          - 'wmic process call'
          - 'Register-WmiEvent'
      condition: selection
    fields:
      - user.name
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Did PowerShell open network connections around the alert that would indicate remote WMI enumeration?
  context: >-
    Get-WmiObject accepts -ComputerName and enumerates remote services over DCOM/RPC (TCP
    135 plus a dynamic port) or WinRM (5985/5986). Aggregating the destinations reached by
    PowerShell processes in a tight window around the alert shows whether the enumeration
    stayed local or swept remote hosts — many unique destinations in the window is the
    profile of a multi-host sweep. Network events carry the acting process, so this works
    even though the script-block event itself has no process link.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: Did the WMI-Activity operational log record provider loads or event subscriptions on this host around the alert?
  context: >-
    The script's query side loads WMI providers, recorded as event 5857; WMI persistence
    registers temporary (5860) or permanent (5861) event subscriptions, the latter
    typically under the root\subscription namespace, while the rule's own query targets
    root\cimv2. Subscription registration near a service-enumeration script points to WMI
    being used for triggered execution in addition to discovery. This channel is shipped
    per-host — if the WMI-Activity operational log is not collected in this environment,
    treat zero results as a visibility gap rather than evidence nothing was registered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
  answer_sources:
  - manual_review
- question: Were PowerShell security controls bypassed or weakened before this script ran?
  context: >-
    Attackers often disable or bypass PowerShell security controls before running their
    tooling. Common precursors include AMSI bypass (patching amsi.dll in memory),
    execution policy changes (Set-ExecutionPolicy or the -ep bypass flag), real-time
    protection tampering, and downgrade to PowerShell version 2, which lacks script-block
    logging. Any of these in the hour before a service-enumeration script strengthens the
    case that the enumeration was attacker tooling rather than administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Reconnaissance rarely runs as a single block — surrounding script blocks from the same
    session often carry the rest of the enumeration (user, group, ACL, and credential
    lookups) or the follow-on exploitation in plaintext. The log level also calibrates the
    view — verbose events present means full script-block logging is enabled, while
    warning-only means the host records just the auto-flagged suspicious subset, so the
    surrounding activity you see here may be incomplete.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating the host's process activity around the
    event surfaces the immediate context — what led to this script, what ran after, and
    whether the enumeration sits inside a larger sequence such as initial access followed
    by discovery and privilege escalation. Novel parent-child pairs at low counts stand
    out against the repetitive agent noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or parallel
    enumeration of multiple endpoints. If the same account triggered similar activity on
    several hosts in this window, the scope of the investigation is wider than one
    machine. When the alert fired under a service principal this view fills with agent
    telemetry — the fleet-pattern question alongside it is the meaningful pivot there.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same script pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, user identity does not attribute behavior, and PowerShell
    channel events carry no process identity to pivot on. The meaningful pivot is the
    pattern itself — the query mirrors the rule's selection fleet-wide in the alert
    window, aggregated by host. Multiple hosts in the same window points to scheduled or
    pushed automation; a single host points to a host-local trigger. Only hosts shipping
    the PowerShell channel (and, for non-flagged content, with full script-block logging
    enabled) can appear, so absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'Get-WmiObject '
        - 'gwmi '
        ScriptBlockText|contains|all:
        - ' Win32_Service '
        - Name
        - DisplayName
        - PathName
        - StartMode
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial execution, defense tampering, credential
    access — may reveal the stages that preceded this enumeration and help reconstruct the
    timeline. Discovery activity commonly follows initial access and precedes privilege
    escalation, so the alert sequence often tells the story around this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious blocks (at warning level) when it
    is not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it — surrounding benign-looking blocks may simply not have been
    logged. The level distribution over the past week tells you how complete every other
    script-block view in this investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Has this exact script block run on this host before?
  context: >-
    A script that has run routinely for months (deployment tooling, vendor agents, admin
    automation) reads very differently from one appearing for the first time. The script
    block hash matches byte-identical content only — zero history means this exact content
    is new to the host, though a trivially modified variant would not match. On hosts
    without full script-block logging the history contains only auto-flagged suspicious
    blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's
    90-day history of the specific service-enumeration pattern (not generic PowerShell
    use), aggregated by host. An administrator or auditor who runs service inventories
    regularly reads differently from an account producing this pattern for the first time;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'Get-WmiObject '
        - 'gwmi '
        ScriptBlockText|contains|all:
        - ' Win32_Service '
        - Name
        - DisplayName
        - PathName
        - StartMode
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Which hosts have historically produced this script pattern, and is the alerting host among them?
  context: >-
    When the alert fires under a service principal, user identity does not attribute
    behavior — and PowerShell channel events carry no process identity to pivot on. The
    meaningful pivot is the pattern itself — the query mirrors the rule's selection
    fleet-wide over 90 days, aggregated by host. A pattern that routinely appears on many
    hosts is deployment tooling or vendor automation; one that has never appeared before,
    or only on this host, is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'Get-WmiObject '
        - 'gwmi '
        ScriptBlockText|contains|all:
        - ' Win32_Service '
        - Name
        - DisplayName
        - PathName
        - StartMode
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
