name: ADExplorer Writing Complete AD Snapshot Into .dat File
id: 56ce9f22-d035-463f-8dd1-a6dd3d25e90f
description: |
  Detects the Sysinternals tool ADExplorer writing a complete Active Directory snapshot to a .dat file. The rule fires when a
  process whose image ends in ADExp.exe, ADExplorer.exe, ADExplorer64.exe, or ADExplorer64a.exe writes a file ending in .dat.
  ADExplorer is a legitimate, signed AD viewer that administrators use for offline review and comparison, but its snapshot
  feature pulls the entire readable directory in a single large LDAP query and writes it to a proprietary .dat that can be
  parsed offline for account, group, trust, and certificate-template enumeration -- reconnaissance that commonly precedes
  lateral movement or privilege escalation. Investigation should confirm the writing process and user, establish whether
  ADExplorer use is expected on this host, and determine what the snapshot captured and whether it was staged, parsed, or exfiltrated.
type: detection
detection_id: 0a1255c5-d732-4b62-ac02-b5152d34fb83
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did ADExplorer write a .dat file, and does the path and process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the .dat file path, the
    operation performed (created/renamed), and that the writing process is one of the ADExplorer executables the rule keys on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run ADExplorer and create AD snapshots?
  context: ADExplorer snapshots are legitimate administrative activity on management or tiering workstations, so knowing whether
    the user role and host function fit AD administration is often the fastest way to separate routine review from reconnaissance.
    When the writing account is a machine or service account, judge by the host role and the launching process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was ADExplorer's full command line and working directory?
  context: The file event records the write but not how ADExplorer was invoked. Pivoting to the process record shows the
    command line and working directory -- a scripted or remote invocation may specify a target domain controller or snapshot
    path, whereas an interactive launch typically carries no arguments. This query returns ADExplorer executions on this host
    within the window, which for a single snapshot session is the same event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this .dat a complete AD snapshot, and how large is it?
  context: The .dat is a proprietary binary snapshot of the readable directory produced by a single large LDAP pull. Snapshot
    size is the primary content signal -- a full-domain capture is typically hundreds of megabytes to several gigabytes, while
    a small file may be a partial or aborted capture. A large snapshot that is then copied, compressed, or moved indicates
    staging for offline parsing or exfiltration. Retrieve the file from its on-disk path to confirm scope.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned ADExplorer, and is that a normal launch path?
  context: A legitimate snapshot is usually launched interactively (explorer.exe opening the executable). ADExplorer spawned
    by cmd.exe, powershell.exe, a script host, or a shell created with injected machine-account credentials points to
    operator-driven or automated reconnaissance rather than routine administration. The parent command line shows how the
    launching process was itself running.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did ADExplorer connect to a domain controller over LDAP, and to which DC?
  context: A snapshot is built from one large LDAP query against the connected domain controller, so ADExplorer connecting to
    a DC on LDAP or Global Catalog ports corroborates the directory pull and identifies which DC was read. When ADExplorer is
    routed through a proxy the egress may originate from a separate tunneling process; the absence of a direct DC connection
    from ADExplorer itself is itself worth noting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        DestinationPort:
          - 389
          - 636
          - 3268
          - 3269
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Is the .dat snapshot still on disk, or was it deleted or renamed after the alert?
  context: The snapshot's post-alert lifecycle drives next steps. A snapshot still on disk can be retrieved and its scope
    assessed; a file deleted shortly after creation suggests cleanup after the data was already parsed or moved and shifts the
    focus to what handled it in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the ADExplorer process write or delete around the snapshot?
  context: A snapshot session may produce more than one file -- multiple .dat captures, a compressed archive, or exported
    output staged for transfer. The breadth, paths, and extensions of the writing process's other file activity distinguish a
    single review snapshot from a collection being prepared for exfiltration.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single snapshot may be routine, but ADExplorer running alongside several enumeration tools in a tight window is a
    signature of post-compromise discovery. Native AD enumeration binaries (net.exe, nltest.exe, dsquery.exe) and dedicated
    collectors (adfind.exe, csvde.exe, ldifde.exe), or PowerShell AD cmdlets in command lines, corroborate a broader
    directory-enumeration effort rather than isolated administrative use.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other processes ran on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the snapshot reveals what led to it and
    what followed -- offline parsing utilities, archiving tools, or transfer clients -- and whether the snapshot is one step in
    a larger sequence. Novel parent/child pairs stand out against high-count routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously written an ADExplorer snapshot, what programs and users drove it, and does the current
    alert fit that pattern?
  context: Even legitimate tools have a normal operating profile. This query mirrors the rule's selection scoped to this host,
    so the resulting program/user distribution reflects how ADExplorer snapshots have historically been produced here. An
    ADExplorer copy running from an unusual path or an unexpected user account for this activity is the deviation worth
    chasing; file events lack parent lineage, so pivot to the ADExplorer process-start event if the launch chain matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
        TargetFilename|endswith: .dat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously written an ADExplorer AD snapshot, and does that history fit their role?
  context: This query mirrors the rule's selection scoped to this user, returning the user's history of ADExplorer snapshot
    writes across hosts rather than generic tool usage. A user who has never produced this pattern is more notable than one who
    does so regularly; weigh the count against whether AD administration is part of their role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
        TargetFilename|endswith: .dat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven ADExplorer snapshot writes here or across the environment, or is the
    program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. This query mirrors the rule's selection scoped to the alerting program, returning the history of
    that program driving snapshot writes. A new or rare program is the deviation worth chasing, while a program that already
    accounts for many prior events is scheduled or vendor automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
        TargetFilename|endswith: .dat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the snapshot is part of wider hands-on-keyboard
    activity. If the same account drove reconnaissance or tool execution on multiple endpoints in the same window, the scope of
    the investigation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven snapshot pattern fire on other hosts in this window -- a coordinated rollout, or isolated
    to this host?
  context: Under a service principal, user-wide activity returns agent-telemetry noise, so the meaningful question is whether
    the same launch mechanism fired elsewhere. This query mirrors the rule's selection scoped to the alerting program,
    fleet-wide, within the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
        TargetFilename|endswith: .dat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts written ADExplorer snapshots in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, returning a fleet-wide count of ADExplorer snapshot
    writes. Many hosts producing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ADExp.exe
        - \ADExplorer.exe
        - \ADExplorer64.exe
        - \ADExplorer64a.exe
        TargetFilename|endswith: .dat
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before the snapshot was written?
  context: Reconnaissance rarely happens in isolation. Earlier detections on the same host -- credential access, defense
    tampering, or other discovery activity -- may reveal the stages that preceded the snapshot and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
