name: Audit Policy Tampering Via Auditpol
id: e54d6e84-cee7-46d8-82d2-c0c2604f2364
description: |
  Detects execution of auditpol.exe (or a binary whose original filename is AUDITPOL.EXE) with a command line containing
  disable, clear, remove, or restore. The rule fires when both conditions hold: the image or original filename matches
  auditpol AND the command line contains one of those audit-policy-changing keywords. Disabling or clearing audit policy
  categories suppresses the security events that would normally record subsequent activity, so this often precedes
  credential access, lateral movement, or other actions an operator wants to keep out of the logs. Administrators and
  configuration scripts also adjust audit policy legitimately, so the investigation should establish who ran the command,
  which audit categories were affected, whether the policy was restored, and what happened during the window of reduced
  visibility.
type: detection
detection_id: 0a13e132-651d-11eb-ae93-0242ac130002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show auditpol changing audit policy with disable, clear, remove, or restore?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    and process details. The rule requires both that the image is auditpol.exe (or its original filename is AUDITPOL.EXE)
    and that the command line contains disable, clear, remove, or restore. Confirm both halves are present and note which
    keyword and which audit category appear.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify Windows audit policy?
  context: Legitimate audit-policy changes are normally made by administrators, baseline-configuration tooling, or
    Group Policy on specific management hosts. Knowing whether this account and host routinely manage logging configuration
    is often the fastest way to separate sanctioned hardening from an operator suppressing audit categories.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which audit categories or subcategories were targeted, and was the action a disable, clear, remove, or restore?
  context: Different audit-policy actions have different impact. Disabling a category such as Detailed Tracking or Logon/Logoff
    stops the corresponding security events from being recorded. Clearing or removing the policy wipes the current
    configuration, and restoring a custom policy file can silently substitute an operator-chosen configuration. Decode the
    command line to identify the exact category, subcategory, and success/failure flags affected, since that determines what
    evidence will be missing for the surrounding activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is auditing for the affected categories currently restored, or is the host still running with reduced logging?
  context: Audit-policy tampering may be temporary, where an operator disables a category for a specific action and re-enables
    it afterward, or it may be left in place. Check the current effective audit policy on the host to determine whether the
    affected categories are collecting again. If auditing is still off or a substituted policy is still active, the host
    remains in a reduced-visibility state and the configuration should be restored before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the Security event log cleared or the audit policy changed according to the Security channel on this host?
  context: Tampering with auditpol leaves a record in the Security log itself. Audit-policy changes are recorded as a change
    event, and clearing the Security log is recorded as a log-cleared event. Reviewing these audit-trail events independently
    of process creation confirms the effect of the command, shows the exact subcategories whose auditing was changed, and
    reveals whether the log was also wiped to destroy the evidence of the change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1102
          - 4719
          - 4907
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - AuditPolicyChanges
- question: Were the registry keys that govern event logging or audit configuration modified on this host around the alert?
  context: Audit logging and the EventLog service can also be impaired through the registry rather than the command line.
    Changes under the EventLog service keys, the Autologger configuration, or audit-policy storage can disable channels or
    drop providers in a way that produces the same loss of visibility as an auditpol disable. Correlating registry
    modifications in the same window with the auditpol execution shows whether the logging configuration was attacked from
    more than one direction.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Services\EventLog\'
          - '\WMI\Autologger\'
          - '\Control\Lsa\Audit'
          - '\SecurityProviders\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What activity occurred on this host after the audit policy was changed?
  context: Audit categories are disabled for a reason, to run an action that the operator does not want recorded. Examining
    process activity in the window immediately after the change reveals what the reduced logging was meant to conceal. A gap
    in expected security events followed by process creation in that window points to the activity the tampering enabled,
    such as credential access, discovery, or lateral movement.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who changes audit policy often disables several controls in the same operation, for example stopping
    a security service, clearing event logs, and deleting shadow copies, to maximize coverage. Finding multiple tampering
    actions from the same user or parent process in the surrounding window indicates a deliberate effort to blind defenses
    rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned auditpol and is that parent chain expected?
  context: The parent process reveals how auditpol was invoked. Legitimate audit-policy changes typically descend from
    predictable parents such as Group Policy processing, a configuration-management agent, or an interactive administrative
    shell. Unusual parents such as a script host, an Office application, or a remote-execution service point toward operator
    activity rather than routine configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously ran auditpol with these keywords, what parents and users normally drove it, and does this
    alert fit that pattern?
  context: Even an administrative binary can be abused. This query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here rather
    than generic auditpol usage. A new parent process, an unexpected account, or an unusual command structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \auditpol.exe
      - OriginalFileName: AUDITPOL.EXE
      selection_cli:
        CommandLine|contains:
        - disable
        - clear
        - remove
        - restore
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \auditpol.exe
      - OriginalFileName: AUDITPOL.EXE
      selection_cli:
        CommandLine|contains:
        - disable
        - clear
        - remove
        - restore
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \auditpol.exe
      - OriginalFileName: AUDITPOL.EXE
      selection_cli:
        CommandLine|contains:
        - disable
        - clear
        - remove
        - restore
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same account triggered similar audit-policy changes or other tampering on several hosts, the scope of the operation
    may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \auditpol.exe
      - OriginalFileName: AUDITPOL.EXE
      selection_cli:
        CommandLine|contains:
        - disable
        - clear
        - remove
        - restore
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the attack stages that preceded this event and help reconstruct the timeline that led to
    audit policy being changed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run auditpol with these keywords in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's firing
    pattern rather than generic auditpol usage. Many hosts firing the same pattern points to scripted deployment or
    configuration automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \auditpol.exe
      - OriginalFileName: AUDITPOL.EXE
      selection_cli:
        CommandLine|contains:
        - disable
        - clear
        - remove
        - restore
      condition: all of selection_*
    fields:
    - host.name
