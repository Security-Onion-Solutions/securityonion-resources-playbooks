name: Prefetch File Deleted
id: c95f165e-8c47-4795-a72e-74bec1c5ed2a
description: |
  Detects deletion of a Windows Prefetch (.pf) file from C:\Windows\Prefetch\, excluding the normal system prefetcher activity (svchost.exe running under a built-in authority account). Prefetch files record program execution and the files a program referenced, so deleting them destroys forensic evidence of what ran on the host (T1070.004, File Deletion under Indicator Removal). Legitimate causes are limited to disk-cleanup tooling and imaging; malicious deletion is an anti-forensic step that usually follows the activity the actor is hiding and often travels with other cleanup. Investigation should identify which program's execution record was erased, what process and command performed the deletion, and whether the deletion sits inside a broader tampering or intrusion sequence.
type: detection
detection_id: 0a1f9d29-6465-4776-b091-7f43b26e4c89
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the deleted file match the Prefetch pattern this rule detects — a .pf file under the Windows Prefetch directory?
  context: Before investing time, confirm the alert is a true positive. The deleted path should end in .pf and live in C:\Windows\Prefetch\, and the responsible process should not be the excluded system prefetcher (svchost.exe under a built-in authority account). Note the operation type so the deletion is distinguished from any surrounding activity on the same path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to delete Prefetch files?
  context: Prefetch deletion is not a routine user action — the folder is normally maintained only by the OS prefetcher. Legitimate causes are narrow (disk-cleanup utilities, host imaging or reprovisioning). When the responsible account is a machine or SYSTEM account, judge by the writing process and the host's role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this Prefetch file recreated after the deletion, or does its absence persist?
  context: Prefetch entries regenerate automatically the next time the referenced program runs. If the same .pf reappears shortly after the deletion, the program executed again and its execution record was rebuilt; if the entry stays absent, the erased evidence remains destroyed. EventType separates the deletion from any later recreation on this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What command performed the Prefetch deletion, and how broad was it?
  context: The file-deletion event names the responsible process but not its command line; this pivots to the process_creation record for the same process to reveal the full command. A single targeted .pf removal (a specific program's history) reads differently from a bulk wipe of the whole Prefetch folder (del/erase, SDelete, or PowerShell Remove-Item over the directory), which points to wholesale trail clearing rather than removal of one tool's record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Can the erased program's execution be reconstructed from surviving process telemetry?
  context: A Prefetch filename has the form PROGRAM.EXE-<hash>.pf, so it names the program whose
    execution was recorded. Deleting the .pf removes that on-disk artifact, but process_creation
    records for the same program are not erased by the deletion. The query is an aggregated
    inventory of this host's executions by image and user, so routine telemetry collapses into
    counts; scan the image list for the program named in the deleted .pf, then pivot to its
    individual execution events for the command line and recorded hash the actor tried to hide.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What process launched the tool that deleted the Prefetch file, and is that parent chain expected?
  context: The parent process reveals how the deletion was invoked. A deletion from an interactive shell started by a user (cmd or powershell under explorer.exe) differs from one spawned by a script host such as wscript or mshta, or by an otherwise unexpected parent. Unusual lineage upstream of the deleting process points to an intrusion rather than routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the deleting process remove or write around this time?
  context: A Prefetch wipe is rarely a single file. The responsible process and its direct children may have deleted many .pf entries, cleared other forensic artifacts, or dropped tooling. The breadth, paths, and EventType of the process's file activity separate a targeted single-entry deletion from a wholesale Prefetch-folder wipe and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity touched the Prefetch folder on this host recently, and by which processes?
  context: The Prefetch folder is normally touched only by the OS prefetcher recreating entries as programs run. A burst of activity across many .pf files by a non-system process points to a broad execution-history wipe rather than routine prefetcher churn. The aggregation groups by the responsible process so one unfamiliar writer or deleter stands out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Prefetch\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What executed on this host after the Prefetch deletion?
  context: Erasing execution records is often the cleanup phase around other actions. Process activity in the window after the deletion — or a conspicuous quiet gap — points to what the actor was doing while the trail was being removed. Correlate with file and network activity in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-evasion actions performed on this host?
  context: Prefetch wiping is one anti-forensic step among several. Actors who erase execution history often also clear event logs (wevtutil), delete shadow copies (vssadmin), disable recovery (bcdedit), change the firewall (netsh), or stop services. Several such actions from the same user or parent process indicate a coordinated cleanup rather than isolated maintenance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Is Prefetch generation still enabled, or was the prefetcher itself disabled?
  context: Beyond deleting individual .pf files, an actor can suppress future execution records entirely by disabling the prefetcher through the EnablePrefetcher registry value or stopping the SysMain service. Confirm the prefetcher and its registry setting are intact so execution history keeps recording; the deletion command may itself reveal an accompanying disable. If prefetch collection is off, restore it before continuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before the Prefetch deletion?
  context: Anti-forensic cleanup usually comes after the activity being hidden. Earlier detections on the same host — execution of tooling, reconnaissance, credential access, lateral movement — help reconstruct what happened before the trail was erased and place the deletion in the attack timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user deleted Prefetch files before, and does that history fit their role?
  context: The query counts this user's 90-day history of the rule's exact firing pattern — Prefetch .pf deletions that are not the excluded system prefetcher — aggregated by host. A user who has never produced this pattern is more suspicious than one who does so routinely, though user-driven Prefetch deletion is itself unusual outside imaging or cleanup workflows. Weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|contains: :\Windows\Prefetch\
        TargetFilename|endswith: .pf
      filter_main_svchost:
        Image|endswith: :\windows\system32\svchost.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven Prefetch deletions on this host or across the environment, or is it new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior — the launch mechanism does. The query counts the 90-day history of this program producing the rule's pattern, aggregated by host. A program that already accounts for many prior deletions is likely OS or vendor automation; a new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|contains: :\Windows\Prefetch\
        TargetFilename|endswith: .pf
      filter_main_svchost:
        Image|endswith: :\windows\system32\svchost.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the deletion?
  context: If a real user account drove the deletion, their concurrent activity on other hosts shows whether this is isolated or part of wider movement. Repeated similar actions across endpoints widen the scope of compromise. When the alert fires under a service or machine account, this cross-network view returns mostly agent telemetry and the launch-mechanism history is the more informative pivot.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven Prefetch deletion pattern fire on other hosts in the same window?
  context: Under a service principal, cross-network user activity is agent noise; the meaningful question is whether the same launch mechanism deleted Prefetch entries elsewhere at the same time. Multiple hosts in the window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|contains: :\Windows\Prefetch\
        TargetFilename|endswith: .pf
      filter_main_svchost:
        Image|endswith: :\windows\system32\svchost.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host around the deletion?
  context: Anti-forensic cleanup and persistence often travel together. After erasing execution evidence, actors commonly establish footholds via scheduled tasks, services, registry Run keys, or BITS jobs. Persistence installs clustered with the deletion indicate a deliberate operation rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence sidesteps command-line detection entirely. A drop into a Startup folder or a path referenced by a registry Run key establishes persistence without running schtasks, sc, or reg. Checking these locations around the deletion catches footholds the actor may have laid while clearing the trail.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
