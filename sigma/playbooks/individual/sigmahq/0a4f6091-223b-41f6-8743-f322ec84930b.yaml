name: Suspicious GUP Usage
id: fef8b13b-995b-4e66-9565-574871c4c473
description: |
  Detects execution of the Notepad++ updater binary GUP.exe from a directory other than
  its expected install or per-user update locations. The rule fires when an Image ending in
  GUP.exe runs AND that Image is not one of the known-good Program Files updater paths and not
  one of the per-user AppData updater paths. GUP.exe is a legitimate, signed open-source
  updater that is a known DLL side-loading host: dropping a malicious library (commonly named
  libcurl.dll) next to a relocated copy of GUP.exe causes the trusted binary to load and run
  attacker code. The investigation should confirm the actual path GUP.exe ran from, identify
  which libraries it loaded and from where, look for a co-located payload drop, and determine
  whether the launch fits any legitimate Notepad++ update activity on this host.
type: detection
detection_id: 0a4f6091-223b-41f6-8743-f322ec84930b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did GUP.exe run from a directory other than the legitimate Notepad++ updater locations?
  context: Confirm the alert before investing time. The rule fires when an Image ending in
    GUP.exe runs AND the full path is neither the Program Files updater location nor a per-user
    AppData Notepad++ updater location. Read the exact Image path from the triggering event and
    confirm it sits outside those known-good directories. A GUP.exe under a temporary, profile,
    or staging directory is the suspicious case; a path under the standard Notepad++ updater
    folder would not have fired and points to a tuning gap or a near miss.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run the Notepad++ updater?
  context: Notepad++ is a developer and power-user editor; the updater runs as part of a normal
    Notepad++ update check. A host where Notepad++ is installed and a user who runs it interactively
    is a routine context for GUP.exe. A server, a kiosk, or an account that has no reason to run
    Notepad++ is a much weaker fit and pushes the disposition toward a relocated, side-loading copy
    of the binary rather than a genuine update.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this GUP.exe instance do? Decode its command line and working directory.
  context: The full command line and working directory reveal what this updater invocation was
    actually doing and where it was anchored. For a legitimate update the working directory is the
    Notepad++ updater folder and arguments reference the update feed. A working directory in a
    temporary, profile, or staging path, or unusual arguments, indicate the binary was relocated to
    host a side-loaded library rather than to perform a real update.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this GUP.exe and is that parent chain expected?
  context: A genuine update check is normally launched by notepad++.exe or by the user shell when
    they trigger an update. A GUP.exe spawned by an Office application, a script host, a mail client,
    or a decode-and-rename chain points to the binary being staged and run by another component
    rather than by Notepad++ itself. The parent process and its own command line establish how this
    invocation was initiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which libraries did this GUP.exe process load, and were any loaded from a non-standard directory?
  context: DLL side-loading works by placing a malicious library where the trusted binary will find
    it ahead of the legitimate one. GUP.exe loading a library such as libcurl.dll from its own
    relocated directory, a temporary path, or a profile path rather than from the system or the
    standard Notepad++ install is the core mechanism this rule is meant to surface. Review each
    loaded module path and signature, and treat any library loaded from the same non-standard
    directory the binary ran from as the suspected side-load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Were a library or payload files written into the same directory GUP.exe ran from around this time?
  context: Side-loading requires the loader library and any staged payload to be present next to the
    relocated binary. File write and stream-hash events in the directory GUP.exe ran from often show
    the dropped library and any encrypted blob arriving shortly before execution, including files
    decoded or renamed from an innocuous extension into a DLL. A library or opaque blob written into
    the same staging directory just before the binary ran supports the side-load reading.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_dirs%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were registry values that influence DLL search order or known-DLL resolution modified on this host around this time?
  context: Beyond co-locating a library, an actor can redirect which library a process resolves by
    editing registry values that govern DLL search behavior or known-DLL mappings. Modifications to
    these values near the alert can explain how a trusted binary was steered to load an attacker
    library and represent a more durable redirection than a one-time file drop. Review the changed
    value, the writing process, and whether the change aligns with any documented configuration work.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\ExcludeFromKnownDlls'
          - '\Image File Execution Options\'
          - '\CWDIllegalInDllSearch'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Does this host normally run GUP.exe?
  context: A binary that has rarely or never run on a host is more suspicious than one that runs on
    a regular update cadence. On a host with Notepad++ installed, GUP.exe appears periodically as the
    editor checks for updates. Zero or very low historical counts indicate a first-time or rare
    execution, which fits a relocated copy staged for side-loading rather than the installed updater.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a known binary can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this rule's specific
    firing pattern has run here, not generic GUP.exe usage. A new parent process, an unexpected user
    account, or an unusual launch pattern relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this GUP.exe spawn afterward?
  context: A real update process has predictable, limited children. A side-loaded library running
    inside GUP.exe commonly leads to additional execution such as command shells, script hosts, or
    decode utilities used for post-exploitation. Unexpected child processes following this GUP.exe are
    a strong sign the invocation was a loader rather than an updater.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same account triggered similar relocated-binary or side-loading activity
    on more than one host, the scope of the compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led up to this event, what happened after, and whether it is part of a larger
    sequence. Look for the decode-and-rename utilities, file drops, or follow-on execution that often
    accompany staging a binary for side-loading.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    a malicious document opening, a decode-and-rename chain, or reconnaissance — may reveal the stages
    that preceded this event and help reconstruct how a relocated GUP.exe came to run here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this rule's firing pattern rather than generic GUP.exe usage. Many hosts firing
    the same pattern points to a packaging quirk or a deployment that relocates the updater; one host or
    a small unrelated set points to targeted, manual staging. Use the host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \GUP.exe
      filter_programfiles:
        Image|endswith:
        - \Program Files\Notepad++\updater\GUP.exe
        - \Program Files (x86)\Notepad++\updater\GUP.exe
      filter_user:
        Image|contains: \Users\
        Image|endswith:
        - \AppData\Local\Notepad++\updater\GUP.exe
        - \AppData\Roaming\Notepad++\updater\GUP.exe
      condition: selection and not 1 of filter_*
    fields:
    - host.name
