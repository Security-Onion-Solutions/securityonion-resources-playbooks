name: Uncommon Userinit Child Process
id: 51c60aab-99cc-4aec-ba39-9d4f2bbaf2fa
description: |
  Detects a process whose parent is userinit.exe but whose own image is not one of the well-known legitimate children
  (explorer.exe), a recognized logon script (netlogon.bat, UsrLogon.cmd), PowerShell on Server Core, proquota.exe, or a
  Citrix HDX helper. On a normal interactive logon, userinit.exe launches the shell and a small fixed set of helpers and
  then terminates. An attacker who sets a per-user logon-script value causes their own program to run as a child of
  userinit.exe at every logon, establishing persistence that re-triggers on each sign-in; the launching userinit.exe exits
  immediately, so the persisted process often appears with a missing parent in later inspection. Investigation should
  determine what the child process is, what configured it to run at logon, and whether the user, host, and timing match a
  legitimate custom shell or login script.
type: detection
detection_id: 0a98a10c-685d-4ab0-bddc-b6bdd1d48458
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Is the parent process userinit.exe, and is the child something other than explorer.exe or a known logon helper?
  context: Confirm the alert is a true positive before investing time. The rule fires when the parent image ends in
    userinit.exe AND the child is not explorer.exe, a recognized logon script (netlogon.bat, UsrLogon.cmd), PowerShell on
    Server Core, proquota.exe, a Citrix HDX helper, or a null image. Review the exact child image and command line against
    that set to confirm the spawned process is genuinely uncommon for userinit.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is this user and host expected to launch this program at logon through a custom shell or login script?
  context: Legitimate logon scripts and custom shells exist in many environments. Knowing whether the user's role and the
    host's function make a userinit-launched helper plausible is often the fastest way to separate an approved login script
    from attacker-installed persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is userinit.exe expected to spawn this child, and what started userinit.exe itself?
  context: The userinit.exe-to-child relationship is the core signal for this detection. On a normal logon userinit.exe is
    spawned by winlogon.exe and launches only the shell and a small fixed helper set. Tracing userinit.exe's own origin and
    confirming whether this specific child belongs there distinguishes a legitimate custom shell or login script from an
    attacker program wired to run at every sign-in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exactly did the child process do? Decode its command line and arguments.
  context: The full command line of the userinit child reveals what was actually run. Decode any flags, script paths, encoded
    content, file paths, or URLs to understand the operation. A child pointing at a script or executable under a user-writable
    or unusual path is a stronger lead than one resolving to a standard administrative tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which interactive logon session does this child process correspond to, and when did that logon occur?
  context: Logon-script persistence runs as a child of userinit.exe immediately after authentication, so the child should
    align with a fresh interactive logon on this host. Tie the child's start time to the nearest logon event for the same
    host and account. A child that fires on every logon for a given user, or that aligns with logons outside that user's
    normal hours, points to configured persistence rather than a one-off manual launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What other child processes did this same userinit.exe instance spawn?
  context: If this userinit.exe instance launched an unexpected child, it may have launched others. Examining sibling
    processes from the same parent reveals the full set of programs started at this logon; multiple uncommon children from
    one userinit.exe instance points to orchestrated activity rather than a single benign helper.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this specific userinit.exe-to-child pairing been seen on this host before?
  context: Some userinit.exe children are routine in a given environment (an approved custom shell or a vendor logon helper),
    while a child never previously launched by userinit.exe on this host is the deviation worth chasing. Historical frequency
    of this exact parent-child pairing distinguishes an established login-script configuration from a newly planted one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_explorer:
        Image|endswith: :\WINDOWS\explorer.exe
      filter_optional_logonscripts:
        CommandLine|contains:
        - netlogon.bat
        - UsrLogon.cmd
      filter_optional_windows_core:
        CommandLine: PowerShell.exe
      filter_optional_proquota:
        Image|endswith:
        - :\Windows\System32\proquota.exe
        - :\Windows\SysWOW64\proquota.exe
      filter_optional_citrix:
        Image|endswith:
        - :\Program Files (x86)\Citrix\HDX\bin\cmstart.exe
        - :\Program Files (x86)\Citrix\HDX\bin\icast.exe
        - :\Program Files (x86)\Citrix\System32\icast.exe
        - :\Program Files\Citrix\HDX\bin\cmstart.exe
        - :\Program Files\Citrix\HDX\bin\icast.exe
        - :\Program Files\Citrix\System32\icast.exe
      filter_optional_image_null:
        Image: null
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_explorer:
        Image|endswith: :\WINDOWS\explorer.exe
      filter_optional_logonscripts:
        CommandLine|contains:
        - netlogon.bat
        - UsrLogon.cmd
      filter_optional_windows_core:
        CommandLine: PowerShell.exe
      filter_optional_proquota:
        Image|endswith:
        - :\Windows\System32\proquota.exe
        - :\Windows\SysWOW64\proquota.exe
      filter_optional_citrix:
        Image|endswith:
        - :\Program Files (x86)\Citrix\HDX\bin\cmstart.exe
        - :\Program Files (x86)\Citrix\HDX\bin\icast.exe
        - :\Program Files (x86)\Citrix\System32\icast.exe
        - :\Program Files\Citrix\HDX\bin\cmstart.exe
        - :\Program Files\Citrix\HDX\bin\icast.exe
        - :\Program Files\Citrix\System32\icast.exe
      filter_optional_image_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of this logon?
  context: Tracking the user's activity across all hosts around the alert reveals whether this is an isolated logon or part
    of broader account activity. The same user triggering similar logon-child activity on multiple hosts widens the potential
    scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \userinit.exe
      filter_main_explorer:
        Image|endswith: :\WINDOWS\explorer.exe
      filter_optional_logonscripts:
        CommandLine|contains:
        - netlogon.bat
        - UsrLogon.cmd
      filter_optional_windows_core:
        CommandLine: PowerShell.exe
      filter_optional_proquota:
        Image|endswith:
        - :\Windows\System32\proquota.exe
        - :\Windows\SysWOW64\proquota.exe
      filter_optional_citrix:
        Image|endswith:
        - :\Program Files (x86)\Citrix\HDX\bin\cmstart.exe
        - :\Program Files (x86)\Citrix\HDX\bin\icast.exe
        - :\Program Files (x86)\Citrix\System32\icast.exe
        - :\Program Files\Citrix\HDX\bin\cmstart.exe
        - :\Program Files\Citrix\HDX\bin\icast.exe
        - :\Program Files\Citrix\System32\icast.exe
      filter_optional_image_null:
        Image: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Are there alerts for this user on other hosts?
  context: If the same user triggered detections on multiple hosts, the activity may extend beyond this endpoint. Check for
    lateral movement patterns or credential abuse across the environment associated with this account.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did this same rule fire on other hosts in the past day, and does the cross-host pattern look like coordinated automation or an isolated detection?
  context: When the firing account is omnipresent, alerts for that account match everywhere. Asking whether this specific
    rule fired across many hosts on the same day separates a broadly deployed logon-script change (pushed automation) from a
    single-host deviation worth chasing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Was there a change ticket, maintenance window, or documented approval for this logon script or custom shell?
  context: Many organizations require documented approval before introducing per-user logon scripts or custom shells. A
    corresponding ticket or deployment record suggests authorized activity; absence of one when policy requires it pushes
    the disposition toward unauthorized persistence and can quickly close or escalate the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold, they commonly install
    backups using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Several persistence installations clustered in the same timeframe indicate intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event
    monitoring captures these drops even when the actor avoids the standard persistence tools, complementing the logon-script
    mechanism this rule detects.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded this logon-script execution and help reconstruct the timeline
    leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
