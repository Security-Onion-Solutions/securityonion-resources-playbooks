name: HackTool - Jlaive In-Memory Assembly Execution
id: fdc803ba-33e9-455b-8a99-3aad6012b21d
description: |
  Detects the batch-file launch sequence produced by Jlaive, an assembly-packing utility that smuggles a .NET payload inside a .bat file and runs it in memory. The rule fires when cmd.exe runs a .bat file AND that batch spawns EITHER an xcopy.exe whose command line contains both 'powershell.exe' (or 'pwsh.exe') and '.bat.exe' OR an attrib.exe whose command line contains '+s', '+h', and '.bat.exe'. The behavior is the batch cloning the real PowerShell binary to a sibling file named <basename>.bat.exe, hiding it with system and hidden attributes, then relaunching that renamed PowerShell to AES/GZip-decrypt and reflectively load the inlined assembly. Legitimate use is essentially nonexistent; investigation should confirm which branch fired, recover the source batch and the renamed PowerShell copy, and scope the in-memory payload that ran.
type: detection
detection_id: 0a99eb3e-1617-41bd-b095-13dc767f3def
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did cmd.exe run a .bat file that spawned EITHER an xcopy cloning PowerShell to a .bat.exe name OR an attrib hiding a .bat.exe file?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact parent and child
    command lines against the rule's two-branch logic. The parent must be cmd.exe with a command line ending in .bat. The
    child is EITHER xcopy.exe whose command line contains both a PowerShell binary name (powershell.exe or pwsh.exe) and
    .bat.exe, OR attrib.exe whose command line contains +s, +h, and .bat.exe. Note which branch fired: the xcopy branch is
    the binary-cloning step and the attrib branch is the hide-attributes step of the same sequence, so the other branch
    usually also occurred around the same time even if only one tripped the rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is this user and host expected to run a batch file that copies and hides a PowerShell binary?
  context: >-
    Legitimate administrative activity can trigger many detections, but the cloning of powershell.exe to a renamed .exe with
    system and hidden attributes has no normal administrative purpose. Knowing whether the user role and host function are
    consistent with running this batch file is the fastest path to distinguishing a deliberate evasion attempt from a
    sanctioned test.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Jlaive batch execution part of an authorized penetration test or red team engagement?
  context: >-
    Assembly-packing and AV-evasion tooling is used in authorized security assessments. Before investing investigation time,
    check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized
    engagement with matching tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which stage of the Jlaive sequence does this event represent, and what is the name of the source batch and the renamed PowerShell copy?
  context: >-
    The packing sequence has distinct stages: an xcopy that clones the real PowerShell binary to a sibling file named
    <basename>.bat.exe, an attrib that sets system and hidden attributes on that copy, and a relaunch of the renamed copy
    that decrypts and loads the payload. Reading the command line identifies which stage fired and recovers the basename,
    which is the same as the source .bat and the resulting .bat.exe. Those filenames are the pivot for recovering the
    payload and finding the relaunch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are the renamed PowerShell copy and the inline-compilation artifacts present on the host?
  context: >-
    This sequence leaves characteristic files: the renamed PowerShell binary <basename>.bat.exe, the source <basename>.bat,
    and the temporary inline C# compilation artifacts that PowerShell produces when it builds the AES/GZip helper class via
    Add-Type (a generated .cmdline, a .0.cs source, a compiled .dll, plus CSC and RES temporary files). Finding these files
    confirms execution and the on-disk footprint even after the original processes have exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is cmd.exe expected to run this batch file, and what started the cmd.exe that launched it?
  context: >-
    The parent-child relationship is the core signal: cmd.exe executing a .bat that in turn spawns xcopy or attrib against a
    PowerShell copy. Tracing the cmd.exe's own origin reveals whether the batch ran from a user double-clicking a downloaded
    file, an email attachment handler, an installer, or another process delivering the payload. The batch file path in the
    parent command line shows where it was staged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same cmd.exe spawn?
  context: >-
    The full sequence spawns several children from the same batch-running cmd.exe: the xcopy clone, the attrib hide step, and
    the relaunched renamed PowerShell copy. Examining all children of that parent confirms the complete chain even when only
    one branch tripped the rule, and reveals the renamed-PowerShell process that performs the in-memory load.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Decode the full xcopy or attrib command line - what source PowerShell path is cloned, and to what destination name?
  context: >-
    The full command line reveals the exact operation: for the xcopy branch, the source is typically the real
    powershell.exe under WindowsPowerShell\v1.0 and the destination is a sibling file with the batch basename plus a
    .bat.exe extension; for the attrib branch, the +s +h flags are applied to that same .bat.exe path. Decoding the paths
    recovers the staging directory and the exact renamed-binary name, which are needed to locate the relaunch and the
    payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the cmd.exe that ran the batch, and what is the full path of the .bat it executed?
  context: >-
    The parent cmd.exe command line shows the full path of the batch file it ran, which is the origin of the whole sequence.
    That path indicates how the payload arrived and where it was staged, and its basename matches the renamed PowerShell
    copy. Retrieving the parent's own process event also lets the investigation walk upward to whatever launched the cmd.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did the renamed PowerShell copy load the PowerShell automation and scripting modules that indicate in-memory assembly execution?
  context: >-
    The renamed PowerShell binary behaves exactly like powershell.exe despite its disguised name, so it loads the same core
    modules - the .NET runtime and System.Management.Automation - and, when it compiles the inline AES/GZip helper via
    Add-Type, the C# compiler and its support libraries. Module-load events on a process whose image name ends in .bat.exe
    are strong evidence that a renamed interpreter ran in memory. If image-load telemetry is not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '.bat.exe'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Has cmd.exe on this host previously spawned xcopy or attrib in this way?
  context: >-
    Some parent-child relationships are routine, but cmd.exe spawning xcopy to clone a PowerShell binary or attrib to hide
    one is not. Historical frequency of this specific pairing on the host distinguishes a novel spawning relationship from
    something already established. Zero or very low counts indicate first-time activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      parent_selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|endswith: .bat
      selection1:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - powershell.exe
        - .bat.exe
      selection2:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - pwsh.exe
        - .bat.exe
      selection3:
        Image|endswith: \attrib.exe
        CommandLine|contains|all:
        - +s
        - +h
        - .bat.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (parent_selection and (1 of selection*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      parent_selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|endswith: .bat
      selection1:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - powershell.exe
        - .bat.exe
      selection2:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - pwsh.exe
        - .bat.exe
      selection3:
        Image|endswith: \attrib.exe
        CommandLine|contains|all:
        - +s
        - +h
        - .bat.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (parent_selection and (1 of selection*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same actor triggered similar staging on multiple
    endpoints. If the same user ran comparable batch-launched activity elsewhere, the scope of the compromise may be larger
    than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      parent_selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|endswith: .bat
      selection1:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - powershell.exe
        - .bat.exe
      selection2:
        Image|endswith: \xcopy.exe
        CommandLine|contains|all:
        - pwsh.exe
        - .bat.exe
      selection3:
        Image|endswith: \attrib.exe
        CommandLine|contains|all:
        - +s
        - +h
        - .bat.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (parent_selection and (1 of selection*)) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as initial access, reconnaissance, or
    defense tampering, may reveal the stages that delivered and staged this batch file and help reconstruct the full
    timeline leading to the in-memory execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
