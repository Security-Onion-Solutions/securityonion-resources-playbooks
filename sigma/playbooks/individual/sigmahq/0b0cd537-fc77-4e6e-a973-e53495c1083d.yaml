name: Renamed Office Binary Execution
id: 08680852-eab7-4337-a65a-e5fc5d54a37f
description: |
  Detects a process whose embedded PE metadata identifies it as a Microsoft Office binary (OriginalFileName or
  Description matching Word, Excel, Outlook, PowerPoint, Access, Publisher, or OneNote) while its on-disk Image name is
  NOT one of the legitimate Office executables. Renaming a signed binary lets an actor inherit its trust and metadata
  while running it from an unexpected name or location, often to side-load a malicious DLL or evade name-based controls.
  Legitimate causes are rare; investigate the disk-name-versus-metadata mismatch, where the binary came from, what it
  loaded or spawned, and whether the same renamed file appears on other hosts.
type: detection
detection_id: 0b0cd537-fc77-4e6e-a973-e53495c1083d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this process carry Office PE metadata while running under a non-Office filename?
  context: Confirm the alert is a true positive before investing time. The rule fires when OriginalFileName or Description
    identifies the binary as a Microsoft Office product (Word, Excel, Outlook, PowerPoint, Access, Publisher, OneNote) yet
    the on-disk Image name is none of the legitimate Office executables. Review OriginalFileName and Description against the
    Image path to confirm the metadata-versus-name mismatch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
- question: Is this user and host expected to run an Office application from this name and location?
  context: Legitimate administrative or developer activity can occasionally produce renamed copies of signed binaries. Knowing
    whether this user's role and the host's function include running Office tooling from a non-standard path is often the
    fastest way to separate a true positive from a benign developer or packaging artifact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the original
    tool. The Description and OriginalFileName here claim a Microsoft Office product, but the on-disk Image name does not
    match any legitimate Office executable. The signing party and signature status indicate whether this is genuinely the
    Microsoft-signed Office binary running under a different name or an unsigned/tampered file. The hash enables threat
    intelligence lookups to determine whether it is a known legitimate file, a known sample, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What command line did this renamed Office binary run with, and what does it reveal about its purpose?
  context: A genuine Office launch has predictable arguments (a document path, automation switches). A renamed Office binary
    invoked with unusual arguments, or with arguments that load a DLL or open a payload, points to side-loading or abuse of
    the inherited Microsoft trust. Decode any file paths, switches, or referenced modules in the command line to understand
    what the binary was actually told to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this renamed Office binary arrive on the host?
  context: 'A renamed binary does not appear spontaneously -- it was copied, downloaded, extracted, or dropped by a parent
    process. Tracing the file creation event for this filename reveals the delivery mechanism: a download tool, an archive
    extraction, a manual copy, or a malware dropper. A binary landing in a user-writable location (Desktop, Downloads, Temp,
    AppData) was likely downloaded or extracted; the process shown in Image is the writer.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A genuine Office launch usually descends from explorer.exe
    or an email client; spawning from mshta.exe, wscript.exe, a script host, or an archive utility points to macro- or
    delivery-driven execution. Walk up the chain to see what spawned the parent and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this renamed binary do after execution?
  context: The purpose of renaming a binary is to evade detection while performing its intended function. Examining the child
    processes and command lines launched by this binary reveals its actual objective -- DLL side-loading, persistence
    registration, reconnaissance, or follow-on tooling. Predictable Office children differ sharply from command interpreters
    or network utilities spawned under an Office name.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has a process running under this on-disk name been seen on this host before?
  context: A process name that has never appeared on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate a first-time or rare execution of this binary under this name, which fits the deliberate-rename
    pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimately renamed copies can recur in a benign packaging or deployment flow. The query mirrors the rule's
    selection structure scoped to this host -- the resulting parent/user distribution reflects how the rule's specific
    Office-metadata-mismatch pattern (not generic binary usage) has historically run here. A new parent process, an
    unexpected user account, or a first-time appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - Excel.exe
        - MSACCESS.EXE
        - MSPUB.EXE
        - OneNote.exe
        - OneNoteM.exe
        - OUTLOOK.EXE
        - POWERPNT.EXE
        - WinWord.exe
        - Olk.exe
      - Description:
        - Microsoft Access
        - Microsoft Excel
        - Microsoft OneNote
        - Microsoft Outlook
        - Microsoft PowerPoint
        - Microsoft Publisher
        - Microsoft Word
        - Sent to OneNote Tool
      filter_main_legit_names:
        Image|endswith:
        - \EXCEL.exe
        - \excelcnv.exe
        - \MSACCESS.exe
        - \MSPUB.EXE
        - \ONENOTE.EXE
        - \ONENOTEM.EXE
        - \OUTLOOK.EXE
        - \POWERPNT.EXE
        - \WINWORD.exe
        - \OLK.EXE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern (not generic Office usage). Many hosts firing the same pattern points to a scripted deployment or
    vendor packaging that renames an Office binary; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - Excel.exe
        - MSACCESS.EXE
        - MSPUB.EXE
        - OneNote.exe
        - OneNoteM.exe
        - OUTLOOK.EXE
        - POWERPNT.EXE
        - WinWord.exe
        - Olk.exe
      - Description:
        - Microsoft Access
        - Microsoft Excel
        - Microsoft OneNote
        - Microsoft Outlook
        - Microsoft PowerPoint
        - Microsoft Publisher
        - Microsoft Word
        - Sent to OneNote Tool
      filter_main_legit_names:
        Image|endswith:
        - \EXCEL.exe
        - \excelcnv.exe
        - \MSACCESS.exe
        - \MSPUB.EXE
        - \ONENOTE.EXE
        - \ONENOTEM.EXE
        - \OUTLOOK.EXE
        - \POWERPNT.EXE
        - \WINWORD.exe
        - \OLK.EXE
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - Excel.exe
        - MSACCESS.EXE
        - MSPUB.EXE
        - OneNote.exe
        - OneNoteM.exe
        - OUTLOOK.EXE
        - POWERPNT.EXE
        - WinWord.exe
        - Olk.exe
      - Description:
        - Microsoft Access
        - Microsoft Excel
        - Microsoft OneNote
        - Microsoft Outlook
        - Microsoft PowerPoint
        - Microsoft Publisher
        - Microsoft Word
        - Sent to OneNote Tool
      filter_main_legit_names:
        Image|endswith:
        - \EXCEL.exe
        - \excelcnv.exe
        - \MSACCESS.exe
        - \MSPUB.EXE
        - \ONENOTE.EXE
        - \ONENOTEM.EXE
        - \OUTLOOK.EXE
        - \POWERPNT.EXE
        - \WINWORD.exe
        - \OLK.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - Excel.exe
        - MSACCESS.EXE
        - MSPUB.EXE
        - OneNote.exe
        - OneNoteM.exe
        - OUTLOOK.EXE
        - POWERPNT.EXE
        - WinWord.exe
        - Olk.exe
      - Description:
        - Microsoft Access
        - Microsoft Excel
        - Microsoft OneNote
        - Microsoft Outlook
        - Microsoft PowerPoint
        - Microsoft Publisher
        - Microsoft Word
        - Sent to OneNote Tool
      filter_main_legit_names:
        Image|endswith:
        - \EXCEL.exe
        - \excelcnv.exe
        - \MSACCESS.exe
        - \MSPUB.EXE
        - \ONENOTE.EXE
        - \ONENOTEM.EXE
        - \OUTLOOK.EXE
        - \POWERPNT.EXE
        - \WINWORD.exe
        - \OLK.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName:
        - Excel.exe
        - MSACCESS.EXE
        - MSPUB.EXE
        - OneNote.exe
        - OneNoteM.exe
        - OUTLOOK.EXE
        - POWERPNT.EXE
        - WinWord.exe
        - Olk.exe
      - Description:
        - Microsoft Access
        - Microsoft Excel
        - Microsoft OneNote
        - Microsoft Outlook
        - Microsoft PowerPoint
        - Microsoft Publisher
        - Microsoft Word
        - Sent to OneNote Tool
      filter_main_legit_names:
        Image|endswith:
        - \EXCEL.exe
        - \excelcnv.exe
        - \MSACCESS.exe
        - \MSPUB.EXE
        - \ONENOTE.EXE
        - \ONENOTEM.EXE
        - \OUTLOOK.EXE
        - \POWERPNT.EXE
        - \WINWORD.exe
        - \OLK.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the
    attack stages that preceded this event and help reconstruct the timeline. A renamed binary is often a delivery or
    defense-evasion step within a longer sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
