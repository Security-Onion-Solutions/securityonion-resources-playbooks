name: Imports Registry Key From an ADS
id: c3e55e5f-f223-43fd-8edd-b4c7a4e99ab8
description: |
  Detects regedit.exe importing a .reg file whose path points into an NTFS Alternate Data Stream (ADS).
  The rule fires when the process is regedit.exe (by Image or OriginalFileName) AND the command line both
  carries an import indicator (' /i ' or '.reg') AND contains a colon not preceded by a space or backslash,
  which is the file:stream syntax that hides the .reg payload off the visible filesystem; an export-style
  invocation (-e / -a / -c) is excluded. Legitimately, regedit is rarely launched from a path containing an
  embedded stream colon, so the investigation should determine whether a registry import ran from a hidden
  stream, what registry data it would apply, and what process drove the regedit launch.
type: detection
detection_id: 0b80ade5-6997-4b1d-99a1-71701778ea61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show regedit importing a .reg file from a path that contains an alternate data stream colon?
  context: Before investing investigation time, confirm the alert is a true positive. The triggering event should
    show regedit.exe (or a renamed binary whose OriginalFileName is REGEDIT.EXE) with an import indicator
    (' /i ' or '.reg') and a colon that sits inside a path rather than after a drive letter or space, which is
    the file:stream syntax of an NTFS Alternate Data Stream. Confirm the binary identity and that the path
    carries an embedded stream name rather than a normal file path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to import registry data with regedit from the command line?
  context: Regedit is normally a GUI tool launched by an interactive user, and end users rarely invoke it from
    the command line to import a .reg file. Knowing whether this account and machine routinely perform scripted
    registry imports is often the fastest way to separate routine administration from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the parent that launched regedit expected to do so, and what started that parent?
  context: The parent process reveals how regedit was invoked. A user-driven import usually descends from
    explorer.exe or an interactive shell, while a launch from a script host (wscript.exe, cscript.exe,
    powershell.exe), from mshta.exe, or from an Office application points to automated or staged execution.
    Tracing the parent's own origin shows whether the chain reflects a deliberate human action or an
    upstream payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched regedit also staged the alternate data stream, it likely spawned other
    processes too. Sibling processes such as a tool that wrote the stream (certutil, makecab, expand, type
    redirection) or that executed additional payloads reveal the full scope of activity from that parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is the full alternate data stream path and stream name on the regedit command line?
  context: The command line carries the file:stream target that regedit imports. Decode it to identify the host
    file the stream is attached to (often a benign-looking .log, .txt, or .doc) and the stream name itself,
    which indicates what registry data is hidden there. The stream name and the host file together show whether
    the payload was deliberately hidden off the visible filesystem.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What registry keys and values did this import write, and are any of them known persistence or evasion locations?
  context: The registry data applied by the import reveals intent. Run/RunOnce keys indicate logon persistence,
    keys under the Windows Defender policy tree indicate security tool tampering, and Image File Execution
    Options keys indicate debugger-based hijacking. The registry_set events linked to the same process show the
    actual key paths (TargetObject) and value data (Details) written from the hidden stream.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: An operator who imports one hidden registry payload often makes several registry changes -- setting a
    Run key for persistence while also disabling a security setting or altering firewall rules. Finding other
    reg.exe or regedit.exe write operations from the same host within a short window reveals the full scope of
    the configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the imported registry data reference an executable or script, and is that file still present on disk?
  context: Registry persistence is only effective if the referenced payload exists at the path written by the
    import. If the hidden stream applied a Run key pointing to an executable or script, checking whether that
    file exists and analyzing its hash determines whether the persistence mechanism is active and what would run
    at next logon. If the registry value data does not name a file path, examine the imported keys directly to
    determine what would execute.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Does this host normally run regedit from the command line?
  context: A binary that has rarely or never been launched from the command line on a host is more notable than
    one that runs that way regularly. Zero or very low historical counts of regedit executions here indicate a
    first-time or rare scripted invocation rather than routine administration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even uncommon tools can have a legitimate footprint on a given host. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects how this
    specific ADS-import pattern has historically run here. A new parent process, an unexpected user account, or
    an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - .reg
        CommandLine|re: :[^ \\]
      filter:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this ADS-import pattern rather than generic regedit usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation, while one host or a small unrelated set points to
    manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - .reg
        CommandLine|re: :[^ \\]
      filter:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      condition: all of selection_* and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - .reg
        CommandLine|re: :[^ \\]
      filter:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - .reg
        CommandLine|re: :[^ \\]
      filter:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple
    endpoints. If the same user drove similar registry-import or stream-writing activity on more than one host,
    the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - .reg
        CommandLine|re: :[^ \\]
      filter:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the import reveals what led to it and what
    followed -- the tool that wrote the alternate data stream, additional payload execution, or other
    persistence and evasion steps -- and whether this event is part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: Operators rarely rely on a single persistence mechanism. After establishing one foothold, they
    commonly install backups using different techniques -- scheduled tasks, services, additional registry
    changes, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this registry import?
  context: Many organizations require change tickets for system modifications, especially persistence and
    security configuration changes. A corresponding ticket suggests authorized work; the absence of one when
    policy requires it suggests the action was unauthorized. Importing registry data from a hidden stream is an
    unusual deployment method, so a documented justification is particularly relevant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
