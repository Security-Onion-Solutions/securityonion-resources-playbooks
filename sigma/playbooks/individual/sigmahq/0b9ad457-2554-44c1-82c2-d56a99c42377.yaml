name: Anydesk Temporary Artefact
id: fa1a2687-155d-4406-933b-3d4834f70bff
description: |
  Detects creation of AnyDesk configuration artifacts (user.conf or system.conf) under
  \AppData\Roaming\AnyDesk\, which are written when the AnyDesk remote-access client runs
  under a user profile. AnyDesk is legitimate remote-support software, but adversaries deploy
  it as an interactive command-and-control channel precisely because it blends in with
  sanctioned IT tooling (T1219.002). The investigation should determine whether this
  installation is authorized and tied to a real support activity, how the client arrived and
  was launched, what external endpoints it reached, and whether the session produced
  persistence or hands-on child-process activity.
type: detection
detection_id: 0b9ad457-2554-44c1-82c2-d56a99c42377
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the written file path match an AnyDesk configuration artifact under AppData\Roaming\AnyDesk?
  context: >-
    The rule fires when a file event's path contains \AppData\Roaming\AnyDesk\user.conf or
    \AppData\Roaming\AnyDesk\system.conf. Before investing investigation time, confirm the
    exact path, the operation performed (created, modified, deleted, renamed), and the
    process responsible for the write against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run AnyDesk or receive remote support?
  context: >-
    Help-desk staff, IT administrators, and users with an open support case may legitimately
    produce AnyDesk configuration writes; a server, a domain controller, or a user with no
    support relationship should not. When the user is a machine or service account, judge by
    the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is AnyDesk on the organization's approved remote access software list?
  context: >-
    Organizations typically sanction a small set of remote access tools for IT support. Any
    remote access tool outside that list, even well-known commercial software like AnyDesk,
    may represent shadow IT or attacker-deployed access, and should be checked regardless of
    the tool's reputation. Note that attackers favor whichever RMM product an environment
    does not monitor, so the authorization list is the reference point, not the tool's brand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this AnyDesk activity?
  context: >-
    Legitimate AnyDesk usage typically correlates with an active support ticket, a scheduled
    maintenance window, or a user request. If no support context exists for this session, the
    tool may have been installed by an attacker for persistent access, by social-engineering
    the user into launching it, or by a user circumventing security controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints is the AnyDesk process connecting to?
  context: >-
    AnyDesk normally establishes outbound sessions to the vendor's relay infrastructure
    (*.anydesk.com) over 443, 80, or 6568; RMM software in general can be reconfigured to
    arbitrary or high ports (7070 and 5650 are examples seen with other products), so review
    every destination and port rather than assuming defaults. Connections to addresses
    outside the vendor's relay ranges, or a session that stays connected far longer than the
    support activity explains, point to attacker-controlled use of the channel.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is the AnyDesk configuration file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The configuration files record the installation's AnyDesk ID and settings needed to trace
    the session, so their post-alert lifecycle matters. A configuration still on disk can be
    retrieved and reviewed; deletion shortly after creation suggests anti-forensic cleanup of
    a short-lived attacker session and shifts the investigation to what the tool did while it
    ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What do the AnyDesk configuration files contain?
  context: >-
    Retrieve user.conf and system.conf from the endpoint and read them. system.conf carries
    the installation's AnyDesk ID (ad.anynet.id) — the address a remote party dials to reach
    this host — plus security settings; user.conf records session preferences. Settings that
    enable unattended access or a stored access password mean the host can be reached again
    without any user interaction, which is the configuration attackers leave behind.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the binary that wrote this configuration the genuine AnyDesk client, and what flags was it launched with?
  context: >-
    The writing process's creation event carries its executable path, hash, and command line.
    Compare the hash against threat intelligence to rule out a trojanized or renamed copy,
    and note the path: an installed client runs from Program Files, while a copy launched
    from Downloads or Temp is portable use that never went through software deployment.
    Command-line flags matter too — --install and --start-with-win set the client up to
    survive reboots, and --set-password enables unattended access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What process launched AnyDesk, and is that parent expected?
  context: >-
    The parent process reveals how the client arrived. explorer.exe points to a deliberate
    user launch, a browser parent to a fresh download, and a script host, command
    interpreter, or Office application parent to scripted or phishing-driven delivery.
    Expected parents vary between environments — a software-deployment agent parent is normal
    where IT pushes AnyDesk centrally, and anomalous where it does not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the AnyDesk process spawn command shells or other child processes after the configuration was written?
  context: >-
    Interactive control is the payoff of a remote access tool: a remote operator opening
    cmd.exe or powershell.exe, running discovery commands, or driving file-manager operations
    all appear as child processes of the AnyDesk parent. Children of a remote-support session
    deserve the same scrutiny as the session itself — an idle or benign support session
    typically spawns nothing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was AnyDesk configured to persist on this host through a service installation or autorun entry?
  context: >-
    A full AnyDesk installation registers the AnyDesk service (under
    \CurrentControlSet\Services\AnyDesk) or an autorun value so the client survives reboots
    and keeps the host reachable without a logged-in user. Persistence turns a one-off
    support session into standing remote access, so its presence raises the stakes of the
    authorization question; a portable run with no persistence writes is bounded to the
    session itself.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      host_scope:
        host.name|expand: '%hostname%'
      selection_run:
        TargetObject|contains: '\CurrentVersion\Run'
        Details|contains: 'AnyDesk'
      selection_svc:
        TargetObject|contains: '\Services\AnyDesk'
      condition: host_scope and 1 of selection_*
    fields:
      - TargetObject
      - Details
      - Image
- question: What other files did the AnyDesk process write or delete around the alert?
  context: >-
    Beyond its configuration, the client writes installation files, connection trace logs,
    and — because AnyDesk supports file transfer — any files a remote operator pushes to the
    host. Executables or archives landing in user-writable directories during the session are
    candidates for attacker-staged tooling and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the AnyDesk profile directory recently, and by which processes?
  context: >-
    The \AppData\Roaming\AnyDesk\ directory holds the connection trace log (ad.trace),
    configuration files, thumbnails, and chat history, and its only routine writer is the
    AnyDesk binary itself. A different process writing there suggests configuration tampering
    or manual editing, and the write timeline establishes when remote-access activity on this
    profile began.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\AnyDesk\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Attacker-deployed remote access tools usually arrive mid-chain. Earlier detections on the
    same host — phishing payload execution, defense tampering, credential access — reveal the
    stages that preceded the tool's appearance and help reconstruct the delivery path, while
    a clean prior timeline is more consistent with routine support activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Has this user produced AnyDesk configuration writes before, and does remote-access use fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's
    90-day history of AnyDesk configuration writes, aggregated by host. A help-desk operator
    who produces this pattern regularly is routine; a first-ever occurrence for a user with
    no remote-support relationship is the deviation worth chasing. Weigh the count against
    the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Roaming\AnyDesk\user.conf
        - \AppData\Roaming\AnyDesk\system.conf
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
- question: Has this program historically driven AnyDesk configuration writes on this host or across the environment?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule's
    selection scoped to the alerting program, so the result is the 90-day history of
    this program driving AnyDesk configuration writes, aggregated by host. A program that
    already accounts for many prior events across the fleet is deployment or vendor
    automation; a new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Roaming\AnyDesk\user.conf
        - \AppData\Roaming\AnyDesk\system.conf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the remote-access
    installation is part of wider movement. The same user triggering process activity or
    similar tool installations on multiple endpoints in the same window points to a larger
    scope of compromise than a single host. If the alert fired under SYSTEM or another
    service principal, this pivot returns broad automation noise — the parent-driven
    clustering question is the meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
- question: Did this same program-driven AnyDesk configuration write fire on other hosts in the same window?
  context: >-
    Under a service principal, user-scoped clustering returns agent-telemetry noise, so the
    meaningful question is whether the same launch mechanism produced AnyDesk configuration
    writes elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to a
    scheduled or pushed rollout — sanctioned deployment or scripted mass-installation — while
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Roaming\AnyDesk\user.conf
        - \AppData\Roaming\AnyDesk\system.conf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
