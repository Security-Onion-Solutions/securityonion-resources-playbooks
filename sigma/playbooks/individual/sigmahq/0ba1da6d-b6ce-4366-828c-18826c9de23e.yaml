- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple
    endpoints. If the same user triggered similar activity on multiple hosts, the scope of compromise may be larger,
    which fits the automated lateral-deployment pattern often seen with renamed remote-execution tools.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
