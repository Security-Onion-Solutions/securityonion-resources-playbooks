- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of the rule's firing pattern rather than generic usage of the binary. Many hosts firing the same pattern points
    to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
