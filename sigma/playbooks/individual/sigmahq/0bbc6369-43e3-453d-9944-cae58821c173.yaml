name: Execution via WorkFolders.exe
id: ba56972e-161c-4119-bb85-be5edac8af21
description: |
  Detects WorkFolders.exe spawning a child process named control.exe that does not resolve to the legitimate
  C:\Windows\System32\control.exe. WorkFolders.exe is a Microsoft-signed binary that, when launched, runs a file named
  control.exe from its current working directory — a proxy-execution trick that lets a planted, unsigned payload run under
  the trust of a signed parent. Legitimate use is the uncommon Windows Work Folders feature, which would resolve control.exe
  from System32. Investigation should confirm the spawned control.exe path, establish where that binary came from and whether
  it is signed, and determine what it executed.
type: detection
detection_id: 0bbc6369-43e3-453d-9944-cae58821c173
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Was the child control.exe launched by WorkFolders.exe a copy outside System32, not the legitimate control panel?
  context: Confirm the alert by reviewing the triggering event. The rule fires when WorkFolders.exe spawns a process whose
    image ends in control.exe AND that image is not C:\Windows\System32\control.exe. Verify the parent is WorkFolders.exe and
    that the child control.exe resolves to a path other than System32 — that mismatch is the proxy-execution signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to use the Windows Work Folders feature?
  context: Work Folders is an uncommon Windows file-sync feature, and WorkFolders.exe spawning control.exe from a non-standard
    path is not part of its normal operation. Knowing whether this host or user has any legitimate reason to run Work Folders
    is often the fastest way to separate a genuine deployment from proxy execution under a signed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is WorkFolders.exe expected to spawn control.exe here, and what started WorkFolders.exe itself?
  context: The parent-child relationship is the core signal. Tracing the origin of WorkFolders.exe (its own parent and command
    line) shows whether it was launched by a legitimate Work Folders deployment or invoked deliberately to proxy-execute a
    planted control.exe. A WorkFolders.exe started from a user-writable directory or by a script interpreter is more suspicious
    than one launched by normal system activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What did the spawned control.exe do? Decode its command line and identify the executable's real purpose.
  context: Because the child is a control.exe outside System32, it is an arbitrary executable running under the WorkFolders.exe
    trust chain rather than the genuine control panel. Read the full command line and current directory to determine what code
    ran — the file name control.exe is only the proxy mechanism, not the payload's function.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the full path of the spawned control.exe, and is the binary signed?
  context: The rule excludes C:\Windows\System32\control.exe, so any match is a control.exe living elsewhere — typically the
    working directory of WorkFolders.exe. A control.exe in a user profile, temp, or download directory was placed there to
    be proxy-executed. The path and signing status of that binary are the strongest indicators of whether this is a planted
    payload or an unusual but legitimate file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Where did this control.exe come from — was it written to the working directory shortly before execution?
  context: Proxy execution via WorkFolders.exe depends on a file named control.exe sitting in the working directory. Look for
    a recent file-write of control.exe to the directory the process ran from; a payload dropped minutes before execution,
    or written by a download tool or archive extractor, points to deliberate staging rather than a pre-existing legitimate
    file.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \control.exe
      filter:
        TargetFilename|startswith: 'C:\Windows\'
      condition: selection and not filter
    fields:
      - TargetFilename
      - Image
      - User
- question: What other child processes did this WorkFolders.exe instance spawn?
  context: If WorkFolders.exe was used to proxy-execute a payload, the same parent instance may have spawned additional
    processes. Examining all children of this exact WorkFolders.exe reveals whether the control.exe execution was a single
    action or part of a sequence of tooling launched through the signed parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has WorkFolders.exe ever spawned control.exe on this host before?
  context: This specific parent-child pairing is the discriminator. WorkFolders.exe spawning control.exe is not part of routine
    operation, so zero or very low historical counts indicate a novel spawning relationship and raise the likelihood of proxy
    execution rather than legitimate Work Folders activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith: \WorkFolders.exe
      filter:
        Image: C:\Windows\System32\control.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith: \WorkFolders.exe
      filter:
        Image: C:\Windows\System32\control.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the activity may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith: \WorkFolders.exe
      filter:
        Image: C:\Windows\System32\control.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what
    happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence
    mechanisms surrounding the proxy execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or initial access — may reveal the stages
    that preceded this proxy execution and help reconstruct the timeline leading to the WorkFolders.exe activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one signed-binary proxy often use several. If WorkFolders.exe was used to run control.exe, check
    whether rundll32, regsvr32, mshta, msbuild, or similar binaries were also used to execute arbitrary code. Finding multiple
    proxy-execution LOLBins on the same host strengthens the case for deliberate misuse.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\installutil.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the WorkFolders.exe to control.exe pattern over the past 90 days, and what command
    patterns are typical?
  context: A proxy-execution pattern with no prior history on a host is more notable than one seen routinely. The query mirrors
    the rule's selection structure scoped to this host, so the count reflects this specific firing pattern — WorkFolders.exe
    spawning a non-System32 control.exe — not generic control.exe usage. The command-line projection lets the analyst compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \control.exe
        ParentImage|endswith: \WorkFolders.exe
      filter:
        Image: C:\Windows\System32\control.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - CommandLine
