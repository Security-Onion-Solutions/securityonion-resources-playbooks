name: Adwind RAT / JRAT File Artifact
id: 53a85c41-c25d-48db-b249-b94bb72298c8
description: |
  Detects a file creation that matches an Adwind / JRAT on-disk artifact: either a Java executable
  dropped under %APPDATA%\Roaming\Oracle\bin (java*.exe) or a "Retrive*.vbs" helper script. Adwind is
  a Java-based cross-platform RAT that copies a private Java runtime into a user-writable AppData path,
  re-launches javaw.exe -jar from there, drops VBScript helpers that query installed security tooling
  via WMI, and persists through a Run key. The investigation should confirm which artifact pattern
  fired, decode the dropped script and the process that wrote it, follow the artifact through to
  execution and hash reputation, and reconstruct the surrounding host activity (persistence, injection,
  recon) that accompanies the drop.
type: detection
detection_id: 0bcfabcb-7929-47f4-93d6-b33fb67d34d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file path match either Adwind artifact pattern, and which branch fired?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a created file path
    either ends in a Java executable under \AppData\Roaming\Oracle\bin (java*.exe) or matches a
    \Retrive*.vbs helper. Note which branch fired: the Oracle\bin\java*.exe branch points to the
    relocated private Java runtime, while the Retrive*.vbs branch points to a dropped script helper.
    That distinction steers which downstream questions carry weight. Review the exact path, the
    operation performed, and the responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a private Java runtime or VBScript helper written under their AppData?
  context: >-
    Legitimate software rarely copies a full Java runtime into %APPDATA%\Roaming\Oracle\bin or drops
    Retrive*.vbs scripts; these paths are not standard install locations for Oracle Java. Knowing
    whether the user role and host function involve Java development or a known application that stages
    files there is often the fastest way to separate a true positive from an odd-but-benign install.
    When the writing identity is a machine or service account, judge by the responsible process and
    host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the artifact still on disk, or was it deleted, hidden, or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. Adwind hides its staged files with attrib +h and
    frequently relocates or replaces droppers, so a file present now can be retrieved, hashed, and
    analyzed, while a file removed or renamed shortly after creation points to cleanup or a
    self-relocating dropper. Interpret the operation type to tell which occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of the dropped file, and does it show obfuscation or known Adwind indicators?
  context: >-
    Retrieve and read the artifact's actual content. For the Retrive*.vbs branch, look for Chr() chains,
    string concatenation, WScript.Echo output that queries installed AV/firewall via WMI, and script
    logic that re-launches javaw.exe or writes further helpers. For the Oracle\bin\java*.exe branch,
    treat it as a relocated Java binary and check whether it is a genuine Oracle executable or a decoy.
    Content retrieval from the endpoint or a safe environment is manual; this query locates the artifact
    write and the responsible process to anchor that retrieval.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the full command line of the process that created this artifact, and is it obfuscated or invoking a script host?
  context: >-
    The process that wrote the artifact carries the operation in its command line. Adwind stages files
    through commands such as xcopy of a private JRE into %APPDATA%\Oracle, cmd /C cscript.exe against a
    dropped Retrive*.vbs, and attrib +h to hide files. Decode any encoded arguments, string
    concatenation, or Chr() reconstruction and identify whether the command invokes a script host or
    copy operation. The VBScript file's own content is retrieved separately from disk; this shows what
    the writing process was instructed to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the one that wrote this artifact, and is that parent chain expected?
  context: >-
    The parent process reveals how the drop was initiated. Adwind's chain typically starts with
    javaw.exe -jar launching from a JAR delivered as a disguised document, which then spawns cmd.exe,
    cscript.exe, xcopy, attrib, and reg.exe. A parent such as javaw.exe, wscript.exe, cscript.exe, or an
    Office application launching the writer is consistent with the RAT; explorer.exe or an installer may
    indicate benign activity. Walk further up the tree if the immediate parent is itself a script host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was the dropped artifact executed as a process after it was created?
  context: >-
    A staged file matters most once it runs. For the Oracle\bin\java*.exe branch, execution means the
    relocated javaw.exe re-launched the RAT with -jar; for the Retrive*.vbs branch, execution means a
    script host ran the helper. Correlating the file write with a later process start reveals whether
    the drop progressed from staging to active execution, which raises urgency and produces a hash to
    check.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did a Java runtime or scripting-engine module load from the user-writable Oracle path this rule flagged?
  context: >-
    Adwind relocates a private Java runtime into %APPDATA%\Roaming\Oracle and re-launches javaw.exe from
    there; the loaded jvm.dll (and, when the VBScript helpers run, vbscript.dll or scrrun.dll) carries
    an on-load hash that file-creation events do not record. A Java module loading from a per-user
    AppData path rather than Program Files is the relocation signature. Check the module's signature and
    submit its hash to threat intel to confirm whether it is a genuine or tampered runtime.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\AppData\Roaming\Oracle\'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: If this artifact has executed, what is its hash, and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no
    hash. This query looks for the artifact executing by its filename and reads the execution hash;
    submit that to threat intelligence to determine whether it is known-malicious, benign, or previously
    unseen. If the artifact is present but has not executed, retrieve it from its on-disk path and hash
    it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A dropper rarely writes a single file. Adwind copies an entire Java runtime tree via xcopy and drops
    numerous Retrive*.vbs helpers alongside the flagged artifact, so the breadth, paths, and extensions
    of the writing process's other file activity distinguish an isolated write from a full staging
    operation and enumerate what else needs review. Look at where the writes land, not just how many
    there are.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Oracle AppData directory recently, and by which processes?
  context: >-
    Location drives suspicion. %APPDATA%\Roaming\Oracle is not a standard Java install path, so other
    recent arrivals there reveal whether this is an isolated drop or a directory under active staging,
    and which processes are writing to it. A single unfamiliar writer placing multiple files is the
    signal; genuine Oracle installers write to Program Files, not per-user AppData.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\Oracle\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this artifact been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. First-time appearance of a Java executable under the Oracle AppData path or a
    Retrive*.vbs helper should be treated as notable even if the filename looks innocuous; zero or very
    low historical counts indicate a new or rare drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's artifact pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, returning the user's 90-day history of
    the specific Adwind artifact pattern (not generic file activity), aggregated by host. A user who has
    never produced this pattern is more suspicious than one who does so regularly; weigh the count
    against whether the user's role plausibly involves staging Java runtimes or VBScript helpers in
    AppData.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|contains|all:
        - \AppData\Roaming\Oracle\bin\java
        - .exe
      - TargetFilename|contains|all:
        - \Retrive
        - .vbs
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's artifact pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's selection scoped to the alerting
    program, returning the 90-day history of that program driving this specific artifact pattern.
    A new or rare program for this pattern is the deviation worth chasing; a program that already accounts
    for many prior events is more likely established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|contains|all:
        - \AppData\Roaming\Oracle\bin\java
        - .exe
      - TargetFilename|contains|all:
        - \Retrive
        - .vbs
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the drop is isolated or part of
    activity spanning multiple endpoints. If the same user account triggered related file or process
    activity elsewhere in the same window, the scope of compromise may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven artifact pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what the user did network-wide returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism produced this artifact pattern
    elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide,
    in the alert window. Multiple hosts in the same window points to pushed or scheduled distribution; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
      - TargetFilename|contains|all:
        - \AppData\Roaming\Oracle\bin\java
        - .exe
      - TargetFilename|contains|all:
        - \Retrive
        - .vbs
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. The Adwind drop is usually surrounded by a Run-key persistence
    write via reg.exe, WMI queries against installed security tooling, WMIC enumeration of signed
    drivers, and process injection into WMIC.exe. Examining the process activity around the alert
    surfaces these accompanying stages and shows whether the file drop is part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host may reveal the stages that preceded this drop. Document delivery,
    script-host execution, or defense evasion firing before the artifact appeared helps reconstruct the
    full timeline and confirm whether this is one step in an ongoing intrusion rather than a stray write.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
