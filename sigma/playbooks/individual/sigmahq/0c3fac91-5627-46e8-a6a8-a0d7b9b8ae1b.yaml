name: Suspicious Get-Variable.exe Creation
id: e9858de6-f072-4d44-8f13-f8feb1f48dc4
description: |
  Detects an executable named Get-Variable.exe written to the per-user
  WindowsApps directory (%LOCALAPPDATA%\Microsoft\WindowsApps\). That folder is
  on the user's default PATH, and Get-Variable is a built-in PowerShell cmdlet
  name; PowerShell resolves a same-named executable on the PATH before the
  built-in cmdlet, so the dropped binary runs whenever PowerShell evaluates
  Get-Variable — a search-order-hijacking persistence and code-execution trick
  (T1546 / T1027). Legitimate applications populate WindowsApps with signed
  store-app stubs and do not drop arbitrary cmdlet-named executables there. The
  rule fires when a file whose path ends in
  Local\Microsoft\WindowsApps\Get-Variable.exe is created; investigate where the
  file came from, what wrote it, how the execution is triggered (commonly a
  hidden PowerShell scheduled task), and whether the payload has run.
type: detection
detection_id: 0c3fac91-5627-46e8-a6a8-a0d7b9b8ae1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was a file named Get-Variable.exe written to the per-user WindowsApps directory, and which process created it?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact path (ending in Local\Microsoft\WindowsApps\Get-Variable.exe), the operation performed, and the responsible process against the rule's detection criteria. WindowsApps is user-writable and on the default PATH; an executable named after a built-in PowerShell cmdlet dropped there is the abuse pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write executables into the per-user WindowsApps directory?
  context: Legitimate activity rarely drops arbitrary executables into WindowsApps, which is intended for store-app stubs. Knowing whether the user role and host function are consistent with writing a cmdlet-named binary there is often the fastest path to distinguishing a true positive from routine operations. When the writer is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped Get-Variable.exe a genuine signed binary or a malicious payload, and what do its signature, strings, and structure show?
  context: Because the filename impersonates the built-in Get-Variable cmdlet, the file should be retrieved from disk and inspected directly. Check the digital signature and signer, embedded strings, imports, packer signatures, and high-entropy sections. Contents of WindowsApps are normally signed store-app stubs; an unsigned, packed, or high-entropy binary here is the payload rather than a legitimate application.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If Get-Variable.exe has executed, what is its hash and does it have known threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so this query looks for the binary executing by its path and reads the hash. Submit that hash to reputation and threat-intel services to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process wrote this file, and is its command line encoded or obfuscated? What does it decode to, and what operation does the decoded content perform?
  context: 'The file-creation event carries the writing process''s identifiers, so its full command line can be retrieved. Droppers frequently stage payloads through encoded or obfuscated commands: base64, hex, URL-encoding, character concatenation, backtick escaping, or environment-variable substitution. Decode any encoding to reveal the actual intent — a download cradle, an in-memory loader, or the write of the hijack binary itself. For multi-layer encoding, iterate until the payload is readable.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was Get-Variable.exe executed after it was dropped?
  context: The hijack fires when PowerShell resolves the Get-Variable cmdlet name and finds this executable on the PATH before the built-in cmdlet. Execution of the dropped binary confirms the persistence trigger has fired at least once; correlate the write time with the first observed execution to establish the timing between drop and run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is Get-Variable.exe still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the process chain that led to this drop expected, and what started the writing process's parent?
  context: The parent-child relationship is the core signal here. Tracing the writer's parent origin (the grandparent process) distinguishes a legitimate install from a suspicious chain — for example a document macro or script host that spawned a shell which in turn wrote the cmdlet-named executable into a PATH directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A dropper that writes one hijack binary often stages several — additional cmdlet-named executables or scripts, or a scheduled-task definition file to arm the trigger. The breadth, paths, and extensions of the process's other file activity distinguish a single artifact from a broader staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the per-user WindowsApps directory recently, and by which processes?
  context: WindowsApps is intended for store-app stubs, so the set of processes that legitimately write there is small. Other recent arrivals in the same directory — especially additional executables or scripts named after built-in PowerShell cmdlets — reveal whether this is an isolated drop or a location under active abuse, and which other artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\WindowsApps\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were scheduled tasks or other process-based persistence mechanisms created on this host around the drop?
  context: This hijack is armed by a trigger that invokes PowerShell against the cmdlet name — commonly a hidden PowerShell scheduled task. Executions of schtasks.exe and other persistence tools near the drop reveal how the payload is launched and whether backup persistence was stacked. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was registry autorun persistence (Run or RunOnce) established on this host around the same time?
  context: Search-order hijacking is one persistence path, and event-triggered execution frequently stacks a second. Registry Run and RunOnce modifications near the drop indicate additional autostart persistence that would survive removal of the dropped binary. Value or key deletions are not observable in this telemetry, so focus on which processes modified these keys and what values they set.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has Get-Variable.exe been written to this host before, or is this its first appearance?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. A first-ever write of this file marks the drop; a longer history suggests either an established foothold that has persisted or, rarely, a benign local convention. Zero or very low prior counts indicate a new artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this exact file-drop pattern before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of this specific drop pattern (not generic file activity), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: Local\Microsoft\WindowsApps\Get-Variable.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-drop pattern here or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior — the launch mechanism does. The query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern (not generic use of the binary). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: Local\Microsoft\WindowsApps\Get-Variable.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment in the hour around the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or multi-host staging. If the same user drove similar activity on multiple endpoints, the scope of compromise may be larger. When the alert fires under a service or machine account, this query returns agent-telemetry noise — the parent-pattern view is the meaningful read in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry noise. The meaningful question is whether the same launch mechanism dropped this file elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: Local\Microsoft\WindowsApps\Get-Variable.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
