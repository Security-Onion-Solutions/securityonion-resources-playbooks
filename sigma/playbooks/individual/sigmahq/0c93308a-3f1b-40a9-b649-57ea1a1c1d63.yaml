name: Activate Suppression of Windows Security Center Notifications
id: a980ccbb-c90e-4e66-b83b-a42a8ab1ccb0
description: |
  This detection fires when a registry write sets a value whose path ends with SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration\Notification_Suppress to DWORD (0x00000001), which stops Windows Security Center from displaying Defender detection and health notifications to users and local administrators. Endpoint management tooling or group policy can set this on managed or kiosk systems, but attackers use the same write (T1112) to blind the people who would react to protection warnings, typically alongside broader Defender policy tampering and persistence installation. The investigation should attribute the writing process and its lineage, check for related Defender policy modifications and persistence mechanisms in the surrounding window, and determine whether the change was an authorized configuration deployment.
type: detection
detection_id: 0c93308a-3f1b-40a9-b649-57ea1a1c1d63
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was Notification_Suppress under the Windows Defender UX Configuration policy key set to DWORD (0x00000001)?
  context: >-
    The rule fires when a registry write targets a value path ending in
    SOFTWARE\Policies\Microsoft\Windows Defender\UX Configuration\Notification_Suppress
    with value data DWORD (0x00000001). Confirm the exact key path (TargetObject) and
    value data (Details) match before investing further investigation time; a value of 1
    in this location suppresses Windows Security Center notifications machine-wide.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - manual_review
- question: Is this user or host expected to change Windows Defender notification policy settings?
  context: >-
    Endpoint management tooling and group policy can legitimately set UX Configuration
    values on managed hosts, and kiosk or single-purpose systems sometimes suppress
    Security Center notifications by design. Check the user, the writing process, and the
    host role against that expectation; the User field is occasionally a machine account
    or SYSTEM for service-driven writes, in which case pivot on the writing process
    (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What process wrote this registry value, and is its parent chain expected?
  context: >-
    The writing process and its lineage reveal how the change was made. Group policy
    processing and endpoint management agents have predictable chains under service
    hosts, while reg.exe or powershell.exe spawned by a script host, an Office
    application, or an interactive shell points to hands-on tampering. Even expected
    registry tools such as regedit.exe or msiexec.exe writing this value still need a
    matching administrative explanation, and an unsigned or unusually located writing
    executable raises the priority of the lineage review (verify the signer in the EDR
    console).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
  - edr_console
- question: What other processes did the registry-writing process launch?
  context: >-
    A script or dropper that suppresses Security Center notifications usually performs
    other actions in the same session. Enumerating the writer's child processes shows
    whether this was an isolated configuration write or one step in a longer sequence of
    tampering and payload execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this Defender notification policy change covered by a change ticket or maintenance window?
  context: >-
    Policy changes that suppress security notifications are the kind of modification most
    organizations require documented approval for. A matching ticket or deployment record
    suggests authorized configuration management; the absence of one when policy requires
    it moves the alert toward escalation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the user or administrator recall making this change?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to a
    verdict. If the write ran under a service or SYSTEM account, ask whether any
    administrator was performing maintenance that would explain it. If the user does not
    recall the action, treat the account and host as potentially compromised and continue
    the technical review; if they do, capture why notifications needed to be suppressed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this change align with work hours or a maintenance window?
  context: >-
    Legitimate policy deployment tends to land during business hours or scheduled
    maintenance. A notification-suppression write in the middle of the night, on a
    weekend, or outside any deployment window fits interactive attacker activity better
    than routine administration; for automated writes, check whether the time matches a
    known deployment or policy refresh schedule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: What does setting Notification_Suppress to 1 change on this host?
  context: >-
    Values under SOFTWARE\Policies\Microsoft\Windows Defender control Defender behavior
    machine-wide, and Notification_Suppress set to DWORD 1 stops Windows Security Center
    from displaying notifications, so users and local administrators no longer see
    detection or protection-health warnings. The protection engine keeps running; the
    change blinds the people who would react to its alerts, which is why this policy
    location is a recognized defense-evasion target rather than a routine setting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - manual_review
- question: Was the suppression value later reverted, or is it still in place?
  context: >-
    Endpoint registry telemetry records value writes but not deletions, so judge
    persistence from the key's re-modification history. A later write of DWORD 0 to the
    same value indicates reversion by an administrator, a policy refresh, or an attacker
    covering tracks; no further writes means the suppression persisted and notifications
    remain hidden until someone changes it back.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Were other registry modifications made on this host in the same window?
  context: >-
    Attackers who suppress security notifications often make several registry changes
    together, for example Run-key persistence, service configuration, or firewall policy
    edits in the same session. Grouping the host's registry writes by key path and
    writing process shows whether this value landed alone or as part of a batch of
    configuration changes pursuing multiple objectives.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - manual_review
- question: Were other Windows Defender policy keys modified on this host?
  context: >-
    Notification suppression usually accompanies broader tampering under the same policy
    hive, for example DisableAntiSpyware, real-time protection settings, exclusion paths,
    or Security Center configuration. Reviewing every write under the Defender policy
    paths in the surrounding day separates a single stray setting from a deliberate
    sequence that degrades endpoint protection and silences its warnings.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Policies\Microsoft\Windows Defender\'
          - '\Windows Defender Security Center\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Did protection-tampering commands run on this host after the notifications were suppressed?
  context: >-
    Suppressing notifications hides warnings; disabling protection removes them. Check
    for follow-on commands that change Defender preferences or stop its services, such as
    Set-MpPreference or Add-MpPreference with disable or exclusion switches, or
    service-control commands against WinDefend. Tampering that lands after the
    suppression confirms the notification change was preparation rather than an isolated
    setting.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'Add-MpPreference'
          - 'DisableRealtimeMonitoring'
          - 'DisableAntiSpyware'
          - 'DisableBehaviorMonitoring'
          - 'stop WinDefend'
          - 'delete WinDefend'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating by image and parent collapses repetitive agent noise into high-count rows
    while novel parent-child pairs stand out at low counts. Registry-side context is
    covered by the same-session registry-modifications question; this view catches
    process execution around the write, such as payload launches, reconnaissance
    commands, or tool staging.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Has this registry key been modified before on this host?
  context: >-
    Policy values like Notification_Suppress rarely change outside deployment events. An
    empty 90-day history makes this a first-time write and worth more scrutiny; repeated
    earlier writes of the same value by the same management process point to routine
    configuration enforcement, since group policy rewrites managed values on each
    refresh.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Does this host normally run the process that wrote this value?
  context: >-
    A writing executable never seen on this host in 90 days is more notable than an
    everyday management agent. Zero or very low historical counts indicate first-time or
    rare execution; combine this with the parent-chain review to decide whether the
    writer belongs on this host at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Was this registry key modified on other hosts in the environment?
  context: >-
    The same suppression value appearing across many hosts in the same window suggests a
    group policy or management-tool rollout; a single affected host, or a small set of
    hosts that also carry other alerts, fits targeted tampering or malware. Compare the
    writing process and Details values across hosts to tell the two apart.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - manual_review
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as initial execution, credential access, or
    other defense tampering, help reconstruct the stages that led to this change.
    Notification suppression typically comes after a foothold already exists, so the
    preceding alert timeline often identifies the delivery mechanism.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were persistence mechanisms installed on this host around the time of this change?
  context: >-
    Attackers who silence security notifications commonly install persistence in the same
    session using scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions,
    so the implant survives reboot while its warnings stay hidden. Multiple persistence
    installations in this window indicate intentional stacking rather than isolated
    administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
