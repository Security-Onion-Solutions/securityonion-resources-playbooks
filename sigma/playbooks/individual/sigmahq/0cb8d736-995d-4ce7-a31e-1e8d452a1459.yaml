name: Potential EventLog File Location Tampering
id: 29052a51-8465-4cea-9651-fb9c458aa794
description: |
  Detects modification of a File value under HKLM\SYSTEM\CurrentControlSet\Services\EventLog\,
  the registry location that sets where a Windows event log channel stores its .evtx file, when
  the new value data does not point into the default \System32\Winevt\Logs\ directory. Redirecting
  a channel's log file diverts new event records away from the collected location and degrades
  log collection and alerting (T1562.002); the documented change mechanisms are wevtutil.exe,
  direct registry edits, and the EvtSetChannelConfigProperty API, and legitimate use is largely
  limited to administrators relocating logs to a larger volume. The investigation should establish
  which channel was redirected and where the new path points, identify the writing process and
  account, and determine whether the change accompanied other defense tampering or preceded
  activity the redirect would hide.
type: detection
detection_id: 0cb8d736-995d-4ce7-a31e-1e8d452a1459
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified value match what this rule detects, an EventLog File value pointing outside the default log directory?
  context: |
    The rule fires when a value under HKLM\SYSTEM\CurrentControlSet\Services\EventLog\ ending in
    \File is written AND the new value data does not contain \System32\Winevt\Logs\. Confirm from
    the key path (TargetObject) which channel subkey was touched, and from the value data
    (Details) that the configured path genuinely leaves the default directory rather than being
    an environment-variable form that still resolves under it.
  range: +/-5m
  answer_sources:
  - alert
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to reconfigure Windows event log storage locations?
  context: |
    Relocating a channel's log file is a rare but legitimate administrative action, for example
    moving high-volume logs to a larger data volume during server build-out or under a
    log-management product's configuration. Compare the acting account against the set of
    administrators authorized to change logging configuration; service-driven writes often show
    a machine account or SYSTEM, in which case pivot on the writing process instead of the user.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which event log channel had its File value redirected, and how security-relevant is that channel?
  context: |
    The channel name is the subkey path between Services\EventLog\ and the File value.
    Redirection of the Security, System, or PowerShell operational channels degrades exactly the
    evidence an investigation depends on, while an obscure custom application channel carries
    less impact. The key path, value data, and writing process together establish what changed
    and by which mechanism.
  range: +/-5m
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Where does the newly configured log file path point?
  context: |
    The default location is %SystemRoot%\System32\Winevt\Logs\ with a filename derived from the
    channel name. Evaluate the replacement path in the value data for redirection to a
    user-writable directory (Temp, AppData, ProgramData, Public), a removable or network path, a
    device name such as NUL, or an unexpanded environment variable that resolves somewhere
    unexpected. A log file placed in an attacker-controlled directory both hides new records
    from collection and allows their later deletion.
  range: +/-5m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the File value re-modified or restored after the alert?
  context: |
    Endpoint registry telemetry records value writes but not deletions, so cleanup cannot be
    observed as a delete event; judge persistence from the key's re-modification history instead.
    A redirect that is quickly written back to the default path suggests a scripted change or an
    administrator correcting a mistake, while a value that stays redirected means the channel is
    still writing outside the collected location.
  range: +24h
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What command did the process that wrote the new File value run?
  context: |
    The documented ways to change a channel's log path are wevtutil.exe with the sl
    (set-log) /lfn switch, direct registry edits via reg.exe or PowerShell, and the
    EvtSetChannelConfigProperty API called from arbitrary code. The writing process's own
    command line reveals which mechanism was used, which channel it targeted, and whether the
    path change was one step in a longer command sequence.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What parent process launched the registry-writing process, and is that chain expected?
  context: |
    The registry event identifies the writing process; its process-creation record shows the
    parent. Administrative reconfiguration usually descends from an interactive shell or a
    management console, while script hosts, Office applications, or an unfamiliar service binary
    in the chain point to the change being made by delivered code. Walk further up the tree with
    the parent identifier if the immediate parent is itself unusual.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - ParentProcessGuid
- question: Is the affected channel currently logging to its default location, or is it still redirected?
  context: |
    Until the File value is restored and the EventLog service re-reads the configuration, new
    records for that channel land in the attacker-chosen file and may never reach collection.
    Verify the channel's current configuration directly on the host (for example with wevtutil
    gl for that channel) and restore the default path before relying on that channel's evidence
    for the rest of the investigation.
  range: +/-30d
  answer_sources:
  - edr_console
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the log path was changed?
  context: |
    Redirecting a log file is preparation; the follow-on actions are the point. Because records
    written after the change may be missing from collection, treat this window as partially
    blind, corroborate process activity with registry, file, and network telemetry, and pay
    particular attention to activity the affected channel would normally have captured.
  range: +1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: |
    Log-location tampering rarely travels alone; the same session often stops or reconfigures
    logging services, clears logs with wevtutil, changes audit policy with auditpol, or disables
    recovery and real-time protection. Correlate registry changes, service stops, and
    audit-policy commands within the same window, and widen the range if the host shows slow,
    spaced-out tampering.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\auditpol.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'auditpol'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry keys were modified on this host in the same session?
  context: |
    An attacker who redirects one channel frequently redirects several, and may also touch
    Autologger settings, service Start values, or persistence locations in the same burst. The
    triggering key will appear in the results; the signal is what else changed, especially other
    Services\EventLog\ subkeys receiving the same replacement path.
  range: +/-30m
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the Security event log cleared on this host around the time of the change?
  context: |
    Event record 1102 is written when the Security log is cleared, a complementary tampering
    step that destroys history the redirect cannot hide. A clear event near the redirect
    indicates the operator was sanitizing existing evidence as well as diverting new records.
    If the Security channel's own collection was redirected, treat an empty result as a
    visibility gap rather than evidence that no clearing happened.
  range: +/-24h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1102
      condition: selection
    fields:
      - SubjectUserName
- question: Has this EventLog File value been modified before on this host?
  context: |
    File values under Services\EventLog\ are written at install time and then rarely change.
    Zero prior history makes this a first-time write on this host; repeated past writes with the
    same value data point to a recurring management job, while a history of different paths
    deserves scrutiny of each writing process.
  range: -90d
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed this registry write?
  context: |
    A writer binary with a 90-day history of routine execution under administrative accounts
    fits management tooling; a binary appearing for the first time at the moment of the redirect
    fits delivered code. Low or zero counts justify checking the binary's origin and signature
    before trusting it.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same EventLog File value modified on other hosts in the environment?
  context: |
    The same redirect appearing across many hosts suggests configuration management or a widely
    deployed log-management product, especially when the value data matches everywhere. A
    single-host change, or one where this host received a different replacement path than the
    rest of the fleet, is more consistent with targeted tampering.
  range: -24h
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    The aggregated parent-child pairs collapse repetitive agent noise into high-count rows so
    that novel combinations stand out at low counts. Look for reconnaissance, credential access,
    or staging activity bracketing the registry write, which frames whether the redirect was an
    isolated configuration change or one step in a longer sequence.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host, such as initial execution, privilege escalation, or
    other defense tampering, reveal the stages that preceded the log redirect and help
    reconstruct the timeline. Logging tampering typically arrives mid-intrusion, after code
    execution is established and before actions the operator wants unrecorded.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were persistence mechanisms installed on this host around the log tampering?
  context: |
    An operator who degrades logging often installs persistence while collection is impaired,
    using scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions. Persistence tool
    executions grouped in the same timeframe as the redirect indicate deliberate stacking rather
    than isolated administrative action.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
