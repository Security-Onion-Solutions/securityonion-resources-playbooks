name: Trusted Path Bypass via Windows Directory Spoofing
id: 37a71db0-0718-494b-a36b-4a0f03f7e9bb
description: |
  Detects a DLL loading from a look-alike Windows directory whose name carries a trailing space
  (e.g. "C:\Windows \System32\"), a path Windows trusted-path verification treats as the real
  system directory. Attackers stage that directory with a copied auto-elevating executable and a
  malicious DLL so the executable launches at high integrity without a UAC consent prompt and
  side-loads the payload, combining privilege escalation with execution-flow hijack. The
  investigation should confirm the trailing-space path, establish the loaded DLL's identity and
  signer, find the process that staged the directory, and determine what ran with elevated
  privileges afterward.
type: detection
detection_id: 0cbe38c0-270c-41d9-ab79-6e5a9a669290
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module's path contain a Windows directory name with a trailing space?
  context: >-
    Confirm the alert is a true positive by reading the exact ImageLoaded path. The rule fires
    when the path contains ':\Windows \System32\' or ':\Windows \SysWOW64\' — note the space
    after 'Windows'. The genuine system directories have no such space, so its presence means a
    look-alike directory exists on disk. The load event also carries the module's hash and
    code-signature status for the identity checks that follow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is any legitimate activity on this host expected to create or use a look-alike Windows directory?
  context: >-
    No routine administrative or deployment procedure creates a 'Windows ' directory with a
    trailing space; the plausible benign explanations are narrow — an authorized penetration
    test, an exploit demonstration, or security-tool validation. Check whether the host role and
    the account involved fit any of those before treating this as unauthorized activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Does an administrator or authorized tester recall staging this directory?
  context: >-
    Direct confirmation from the people who could plausibly have done this — the red team, a
    security engineer reproducing a published technique, or the host's administrator — is the
    fastest path to closing a benign case. If nobody recalls creating the trailing-space
    directory, treat the staging as attacker activity and ask what account performed it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other modules did the loading process load, and did any besides the alerting DLL come from the trailing-space path?
  context: >-
    In this technique the relocated executable resolves most of its imports from the real system
    directories while the planted DLL — often carrying a legitimate system DLL name such as
    atl.dll — loads from the look-alike path. Compare every loaded path for the extra space to
    separate planted modules from normal imports, and note any additional unsigned or
    oddly-signed modules in the set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What are the signing status, hash, and threat-intel reputation of the DLL loaded from the look-alike path?
  context: >-
    DLL load events carry the module's hash and code-signature data directly. A planted
    side-load DLL typically shows Unsigned, Invalid, Expired, or Distrusted signature status
    despite wearing a system DLL filename, while a validly Microsoft-signed module at the
    spoofed path would instead point to a copied legitimate DLL staged alongside the payload.
    Pivot the hash through threat intelligence to identify known loader families.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: How was the executable in the look-alike directory launched, and did it run at high integrity?
  context: >-
    The bypass works by copying an auto-elevating executable (perfmon.exe is one published
    example) next to the planted DLL; launched from the trailing-space path, Windows treats it
    as a trusted system binary and elevates it without a consent prompt. The command line and
    working directory show how it was invoked, and a High or System integrity level on the
    execution confirms the elevation succeeded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - IntegrityLevel
- question: What process launched the executable from the look-alike directory, and is that parent expected?
  context: >-
    Auto-elevating system binaries normally start from the real System32 under explorer.exe or
    svchost.exe. A medium-integrity user process — a shell, script host, or freshly downloaded
    program — launching a copy from a trailing-space Windows path is the launcher half of the
    bypass, and the parent-child mismatch (a non-elevated process spawning an auto-elevated one)
    marks the elevation path. Walk further up the tree if the immediate parent is itself unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Which process created the look-alike Windows directory and wrote the executable and DLL into it?
  context: >-
    The technique requires staging before the load — creating a directory literally named
    'Windows ' with a trailing space, then copying a legitimate auto-elevating executable and
    the payload DLL into its System32 or SysWOW64 subdirectory. The writing process, its user,
    and the write timestamps identify the initial foothold and how far ahead of the elevation
    the staging happened; typical spacing is seconds to minutes, but pre-positioning days
    earlier is possible.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: ':\Windows \'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Have processes executed from a trailing-space Windows path on this host or elsewhere in the environment?
  context: >-
    Several auto-elevating executables are vulnerable to this relocation trick, so hunt on the
    path itself rather than specific binary names — any execution whose image path contains
    ':\Windows \' is bypass activity. The same look-alike directory appearing on multiple hosts
    indicates shared tooling or a multi-host operation, and the User grouping shows which
    accounts drove it.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|contains: ':\Windows \'
      condition: selection
    fields:
      - host.name
      - Image
      - User
- question: What actions were performed with elevated privileges after the DLL loaded?
  context: >-
    UAC bypass is a means to an end — the planted DLL executes inside a high-integrity process,
    and its follow-on activity typically starts within seconds to minutes of the load. Review
    High and System integrity process starts for the usual objectives: persistence installation,
    credential dumping, security-tool tampering, or lateral movement preparation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry-based UAC bypass preparations also made on this host?
  context: >-
    Directory spoofing needs no registry change, so a hit here means the operator staged more
    than one elevation method. Command-line writes to ms-settings, mscfile, or shell
    open-command keys shortly before the alert reveal a parallel registry-hijack bypass variant
    and expose the exact payload command it would execute elevated.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were UAC-hijack or PATH environment registry values modified around the alert?
  context: >-
    Registry telemetry catches modifications made through APIs that never appear on a command
    line. Shell open-command and DelegateExecute values are the payload slots for auto-elevated
    COM and registry hijack variants, while edits to the user or system PATH values set up
    path-interception hijacks of binaries named after system tools; the Details field shows the
    value that was written.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\ms-settings\Shell\Open\command'
          - '\mscfile\shell\open\command'
          - '\Folder\shell\open\command'
          - 'DelegateExecute'
          - '\Environment\Path'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other privilege escalation techniques attempted on this host?
  context: >-
    Operators who attempt one UAC bypass often try several methods until one succeeds on the
    local OS version and configuration. A cluster of bypass, defense-tampering, or
    credential-access detections around this alert confirms deliberate escalation activity
    rather than an isolated event; widen the review window manually if the directory staging
    predates the alert by hours.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The DLL load sits between staging (directory creation, file copies) and objective (elevated
    follow-on actions). Aggregated parent-child pairs collapse repetitive agent noise into
    high-count rows while novel pairs — archive extractors, script hosts, or the bypass
    launcher itself — stand out at low counts and frame what led to and followed the load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this module been loaded on this host before, and by which processes?
  context: >-
    Because the matched path includes the trailing-space directory, any prior load history means
    the look-alike directory has existed and been used on this host for some time — evidence of
    longer-standing persistence rather than a fresh escalation. Zero prior loads indicates the
    staging is new, which tightens the timeline for the file-creation and precursor review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Has the executable at the trailing-space path run on this host before?
  context: >-
    Repeated executions across days indicate the bypass is being reused as a persistence
    mechanism rather than a one-off elevation; a single first-time execution points to a fresh
    escalation attempt. The User grouping shows which accounts have driven the executions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is this module being loaded from a look-alike Windows directory on other hosts?
  context: >-
    A single affected host could be a localized incident or an authorized test; the same
    trailing-space module load on several hosts indicates distribution through shared tooling or
    lateral movement. Note the variety of loading processes — different executables loading the
    same planted DLL name across hosts point to a kit being applied broadly.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
