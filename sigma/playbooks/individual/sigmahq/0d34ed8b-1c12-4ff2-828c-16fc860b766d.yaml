name: Suspicious Processes Spawned by Java.EXE
id: 2bba8cbc-a34e-483d-9132-5925f93a3da4
description: |
  Detects a Java host process (an Image ending in java.exe) spawning one of a set of
  living-off-the-land system binaries such as certutil.exe, bitsadmin.exe, curl.exe, mshta.exe,
  regsvr32.exe, rundll32.exe, schtasks.exe, reg.exe, net.exe, whoami.exe, or wscript.exe. The rule
  fires when the parent Image ends in java.exe AND the child Image ends in one of those binaries.
  Java application servers (Tomcat, Jetty, JBoss and similar) do not normally spawn command-line
  system utilities, so a java.exe parent launching one of these tools is a common post-exploitation
  signature, including exploitation of a Java application that logs untrusted input. The
  investigation should confirm which child binary spawned, decode what that child did, trace what
  started the Java process and what request reached it, and determine whether the Java application
  is patched and whether the spawning pattern is routine for this host.
type: detection
detection_id: 0d34ed8b-1c12-4ff2-828c-16fc860b766d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did a process ending in java.exe spawn one of the watched system binaries, and which child binary fired?
  context: Confirm the alert before investing time. The rule fires when the parent Image ends in
    java.exe AND the child Image ends in one of a set of system utilities such as certutil.exe,
    bitsadmin.exe, curl.exe, mshta.exe, regsvr32.exe, rundll32.exe, schtasks.exe, reg.exe, net.exe,
    whoami.exe, or wscript.exe. Read the exact ParentImage and Image from the triggering event and
    note which child binary fired, because the firing binary determines which downstream questions
    carry weight. A certutil or bitsadmin child points at download or decode; schtasks or reg points
    at persistence; net, whoami, or systeminfo points at reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host expected to run a Java application that spawns command-line system tools?
  context: Java application servers run as service accounts and normally spawn only their own helper
    processes, not interactive system utilities. A host whose role is to serve a Java application has
    no routine reason for that application to launch certutil, bitsadmin, schtasks, reg, or net. If
    the host is a developer workstation where a Java build or IDE legitimately shells out to system
    tools, that weakens the signal; a production application server spawning these tools strengthens it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started the Java process, and is this Java instance expected to spawn a child like this?
  context: The Java-parent-to-system-tool relationship is the core signal for this detection. Tracing
    the Java process back to its own origin reveals whether it is a legitimate application server, a
    build tool, or an interactive Java program. A Java application server that was reached over the
    network and then spawned a system utility is the classic exploitation chain, where untrusted input
    drives the server to execute attacker-chosen commands. Identify what launched the Java process and
    what its own command line and working directory indicate about the running application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exactly did the spawned child binary do? Decode its full command line and working directory.
  context: The full command line of the child binary reveals the operation. A bitsadmin or certutil
    invocation may carry a remote URL and an output path for a download or a decode of staged content;
    a schtasks or reg invocation carries the persistence target; net, whoami, or systeminfo carries the
    reconnaissance scope. Decode any flags, encoded arguments, URLs, and file paths to determine what
    the child actually did. The query returns every execution of this binary on the host in a tight
    window, so a multi-step operation split across sequential invocations is visible as one sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other child processes did this same Java instance spawn?
  context: If a compromised Java process spawned the detected child, it likely spawned others in
    sequence. Examining the siblings of the exact Java instance reveals the full scope of activity
    driven through this process, such as a download followed by a decode followed by a persistence
    install. Multiple system utilities spawned by one Java process in a short window points to
    orchestrated post-exploitation rather than a single stray invocation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What request or input reached the Java application immediately before it spawned this child?
  context: When a Java application server is driven to spawn a system tool, the trigger is usually a
    network request carrying untrusted input that the application processes. Identifying the originating
    request, its source address, and the targeted endpoint enables blocking at the perimeter and finding
    other affected systems. The application logs and any web or proxy records for this host around the
    spawn time hold the originating request; the query here returns the Java parent context to anchor
    that timeline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the Java application running a patched version, or is it exposed to a known remote-code-execution flaw?
  context: A Java application spawning system tools after receiving network input commonly indicates
    exploitation of a known vulnerability in the application or one of its libraries, including
    logging-library flaws that evaluate attacker-controlled input. Confirming the installed version and
    its patch level against published advisories determines whether the exploitation path was open, and
    whether other hosts running the same unpatched component are exposed. The query returns the parent
    application to identify what software needs version verification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Is a Java process spawning these system binaries occurring on other hosts in the environment?
  context: The same Java-to-system-tool spawning pattern appearing on multiple hosts points at a wave of
    exploitation against a shared, internet-reachable, or widely deployed Java application rather than a
    single targeted host. A single occurrence is more likely isolated. Comparing across hosts calibrates
    scope and identifies additional servers running the same exposed application that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Is the child command line encoded or obfuscated, and what does it decode to?
  context: Operators frequently hide the payload behind encoding so casual inspection of the command line
    reveals little. Common forms include base64 in a certutil decode, hex, URL-encoding, character
    concatenation, and double-encoding. For a certutil child, look for the decode flags and the named
    source and output files; for a script-host child, reconstruct any concatenated or character-code
    strings. Decoding reveals the real intent, such as a download cradle, an in-memory loader, a reverse
    shell, or staged content written to disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be routine, but several reconnaissance commands in rapid
    succession, such as whoami, net user, systeminfo, and ipconfig, is a signature of post-compromise
    enumeration. After driving a Java application to execute a system tool, operators commonly enumerate
    the host and domain to understand their context before the next stage. Several distinct recon
    binaries within a short window on this host strengthens the post-exploitation interpretation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: If the child was schtasks.exe, what scheduled task was created and what command does it run?
  context: When the firing child is schtasks.exe, the command line carries the task name, trigger
    schedule, and the command or program to execute. A Java process installing a scheduled task is a
    persistence step, so identify the task name, the run command, the schedule type, and the run-as
    account from the arguments. A task that runs at logon or system startup, or that runs as SYSTEM,
    establishes durable execution that survives reboot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If the child was reg.exe, what registry key and value were modified, and is it a known persistence or evasion location?
  context: When the firing child is reg.exe, the targeted path reveals intent. Run and RunOnce keys
    indicate persistence; keys under the Windows Defender policy paths indicate security-tool tampering;
    Image File Execution Options keys indicate debugger-based hijacking. The query returns the registry
    write linked to the same process so the key path and value data appear as structured fields; the
    reg.exe command line carries the same key, value name, and data if the registry event is not available.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \java.exe
        Image|endswith:
        - \AppVLP.exe
        - \bitsadmin.exe
        - \certutil.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \hh.exe
        - \mftrace.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \query.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \java.exe
        Image|endswith:
        - \AppVLP.exe
        - \bitsadmin.exe
        - \certutil.exe
        - \cscript.exe
        - \curl.exe
        - \forfiles.exe
        - \hh.exe
        - \mftrace.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \query.exe
        - \reg.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \scrcons.exe
        - \scriptrunner.exe
        - \sh.exe
        - \systeminfo.exe
        - \whoami.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the spawn reveals the immediate
    context, what led to it and what followed, and whether it is part of a larger sequence. Aggregating by
    process and parent collapses repetitive agent telemetry into high-count rows while novel parent-child
    pairs stand out at low counts, which is what distinguishes the operator's activity from background noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
