name: Potential Tampering With RDP Related Registry Keys Via Reg.EXE
id: e617e480-15c9-4819-ab1f-f023d26c1294
description: |
  Detects reg.exe adding a REG_DWORD value with the force flag under
  HKLM\SYSTEM\CurrentControlSet\Control\Terminal Server, where the value
  written is EITHER the Licensing Core concurrent-sessions pair (Licensing
  Core plus EnableConcurrentSessions) OR one of the RDP control values such as
  fDenyTSConnections, AllowTSConnections, fEnableWinStation, SecurityLayer, or
  WinStations\RDP-Tcp settings, and where SecurityLayer is not being set to
  the value 02. Command-line registry edits to these keys can enable RDP, lift
  the single-session restriction, weaken the connection security layer, or
  permit concurrent sessions, all of which expand remote-access exposure.
  Administrators legitimately make these changes when standing up Remote
  Desktop, but the same edits are used to open or harden a foothold for
  interactive lateral movement. Determine who ran reg.exe, which Terminal
  Server value changed and to what data, and whether interactive or RDP logons
  followed.
type: detection
detection_id: 0d5675be-bc88-4172-86d3-1e96a4476536
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show reg.exe adding a Terminal Server REG_DWORD value, and which control value was written?
  context: >-
    Confirm the alert before investing time. The rule fires when reg.exe runs an
    'add' against a key under CurrentControlSet\Control\Terminal Server with
    REG_DWORD and the /f force flag, and the value is EITHER the Licensing Core
    concurrent-sessions pair (Licensing Core with EnableConcurrentSessions) OR
    one of the RDP control values (for example fDenyTSConnections,
    AllowTSConnections, fEnableWinStation, SecurityLayer, fSingleSessionPerUser,
    or a WinStations\RDP-Tcp setting), and SecurityLayer is not being set to 02.
    Note which branch fired and the data written, because the specific value
    determines whether the change enables RDP, allows concurrent sessions, or
    weakens the connection security layer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to reconfigure Remote Desktop settings from the command line?
  context: >-
    Legitimate Remote Desktop configuration is usually done on servers or jump
    hosts by administrators, often through group policy or system properties
    rather than reg.exe. A workstation or a non-administrative account editing
    Terminal Server values directly is a stronger signal than a server admin
    doing the same on an RDS host. Knowing whether the user role and host
    function fit this operation is often the fastest path to disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact Terminal Server value name and data were written, and what does that setting control?
  context: >-
    The registry_set event tied to the same process gives the actual key path
    (TargetObject) and value written (Details) as structured fields instead of
    parsing them from the reg.exe command line. fDenyTSConnections set to 0
    enables inbound RDP; fSingleSessionPerUser set to 0 plus EnableConcurrentSessions
    permits multiple simultaneous sessions; SecurityLayer or UserAuthentication
    lowered weakens transport security or disables network-level authentication.
    The specific value and data determine whether this opened remote access or
    reduced its protections.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What spawned reg.exe, and what started that parent?
  context: >-
    The launch chain attributes the change. A legitimate edit typically traces
    to an interactive shell an administrator opened, a deployment tool, or a
    configuration script. An unsigned or unusual parent, or a parent that is
    itself a script host or remote-execution service, points to operator-driven
    tampering rather than routine administration. Tracing the parent's own
    origin reveals whether the chain is interactive or automated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: >-
    If the parent that launched reg.exe also spawned other tooling in the same
    window, the registry edit is likely one step in a sequence. Multiple
    children such as additional reg.exe edits, net.exe, schtasks.exe, or a
    script host from the same parent indicate orchestrated activity rather than
    a single isolated configuration change.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was reg.exe executed from its expected System32 path?
  context: >-
    reg.exe normally runs from System32 or SysWOW64. The same binary copied or
    renamed into a user-writable directory, or an unrelated executable carrying
    the reg.exe OriginalFileName, can be used to dodge path-based allowlists.
    Compare the Image path against the OriginalFileName to confirm this is the
    genuine system binary in its standard location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Actors who change one Terminal Server value often change several, or pair
    the RDP enablement with other registry edits such as firewall rules,
    persistence keys, or security-tool settings. Finding a cluster of reg.exe or
    regedit write operations on this host within a short window reveals the full
    scope of the configuration changes and whether more than one objective was
    pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Did interactive or RDP logon events occur on this host shortly after the Terminal Server settings were changed?
  context: >-
    Enabling RDP or relaxing its session and security settings is preparation;
    the payoff is a remote logon. Security logon events on this host in the
    window after the change show whether someone actually connected. RDP and
    session-shadow logons (network-level and session-reconnect events) arriving
    from an uncommon source, or under an account that does not normally log in
    here, indicate the configuration change was used. If Security logs are not
    collected in this environment, treat zero results as a visibility gap rather
    than evidence nothing connected.
  range: +4h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4778
          - 4779
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What processes ran on this host in the hours after the Terminal Server change?
  context: >-
    A registry edit that opens or weakens RDP is a means to an end. Examining
    what executed afterward reveals whether the access was used for hands-on
    activity such as command interpreters, reconnaissance utilities, or
    credential-access tooling. Post-change execution under a newly logged-in
    account is the activity that turns a configuration change into an active
    intrusion.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this is
    isolated or part of broader movement. The same account enabling RDP on one
    host and then appearing on others within a short window suggests the scope
    of the activity extends past the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this Terminal Server tampering pattern, what parents and users normally drove it, and does this alert fit?
  context: >-
    Even routine RDP configuration recurs under stable parents and accounts. The
    query mirrors the rule's selection structure scoped to this host, so the
    parent and user distribution reflects how this specific firing pattern (not
    generic reg.exe usage) has historically run here. A new parent process, an
    unexpected user, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this Terminal Server tampering pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of this specific firing pattern rather than
    generic reg.exe usage. Many hosts editing the same Terminal Server values
    points to scripted deployment or imaging; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_main_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_main_cli:
        CommandLine|contains|all:
        - ' add '
        - \CurrentControlSet\Control\Terminal Server
        - REG_DWORD
        - ' /f'
      selection_values_1:
        CommandLine|contains|all:
        - Licensing Core
        - EnableConcurrentSessions
      selection_values_2:
        CommandLine|contains:
        - AllowTSConnections
        - fDenyTSConnections
        - fEnableWinStation
        - fSingleSessionPerUser
        - IdleWinStationPoolCount
        - MaxInstanceCount
        - SecurityLayer
        - TSAdvertise
        - TSAppCompat
        - TSEnabled
        - TSUserEnabled
        - WinStations\RDP-Tcp
      filter_main_values_tls:
        CommandLine|contains|all:
        - SecurityLayer
        - '02'
      condition: all of selection_main_* and 1 of selection_values_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Was there a change ticket, maintenance window, or documented approval for enabling or reconfiguring Remote Desktop on this host?
  context: >-
    Remote Desktop configuration on managed systems is usually planned work. A
    corresponding ticket or maintenance window suggests authorized activity;
    the absence of one when policy requires it suggests the change was
    unauthorized. This check can quickly close false positives or escalate true
    positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such
    as defense tampering, reconnaissance, or credential access, may reveal the
    stages that preceded the RDP configuration change and help reconstruct the
    timeline. Defense tampering and credential access commonly precede activity
    that prepares a host for remote access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
