name: UAC Secure Desktop Prompt Disabled
id: c4595418-c39f-4a5b-96f6-3fabd172f32a
description: |
  Detects a registry modification that sets the PromptOnSecureDesktop value under
  \Microsoft\Windows\CurrentVersion\Policies\System to DWORD 0, which moves UAC elevation
  prompts off the isolated secure desktop and onto the user's interactive desktop where
  other processes can observe, spoof, or programmatically answer them. Administrators and
  Group Policy occasionally set this value for remote-assistance or accessibility reasons,
  but ransomware and RAT operators change it alongside companion UAC policy values
  (ConsentPromptBehaviorAdmin, EnableLUA) to weaken elevation controls before escalating
  privileges. The investigation should identify the process and user that wrote the value,
  whether other UAC policy values were changed in the same session, and what elevated
  activity followed the change.
type: detection
detection_id: 0d7ceeef-3539-4392-8953-3dc664912714
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry event show PromptOnSecureDesktop being set to 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule
    fires when the registry path (TargetObject) contains
    \Microsoft\Windows\CurrentVersion\Policies\System\PromptOnSecureDesktop AND the value
    data (Details) is exactly DWORD (0x00000000). Verify both criteria against the event;
    a write of 1 to the same value re-enables the secure desktop and does not match this rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change UAC prompt policy?
  context: >-
    UAC policy under Policies\System is normally managed centrally through Group Policy or
    by desktop administrators, so an interactive user account writing it directly is
    unusual. Check whether the user has an administrative role and whether a change record
    or remote-assistance/accessibility justification exists. User attribution is present on
    most endpoint registry events; when it is a machine account or SYSTEM, pivot on the
    writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote PromptOnSecureDesktop, and is this a known UAC-tampering location?
  context: >-
    The Policies\System key holds the UAC configuration that elevation enforcement reads;
    setting PromptOnSecureDesktop to 0 makes consent prompts render on the interactive
    desktop, where malicious software running in the user session can send input to them.
    Group Policy enforcement writes this key from service-hosted processes, while reg.exe,
    a script host, or an unrecognized binary as the writing process points to hands-on
    tampering. The writing process identity is the pivot for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was PromptOnSecureDesktop modified again after this alert?
  context: >-
    Endpoint telemetry records registry value writes but not deletions, so attacker cleanup
    or an administrator reverting the change appears as another modification of the same
    value (Details returning to a non-zero DWORD) rather than a delete event. A value that
    stays at 0 leaves elevation prompts exposed on the interactive desktop until it is
    rewritten; judge persistence from this re-modification history rather than looking for
    a key removal.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other UAC policy values changed on this host around the same time?
  context: >-
    Operators who weaken the secure desktop commonly adjust companion values in the same
    policy key: ConsentPromptBehaviorAdmin 0 elevates administrators without any prompt,
    EnableLUA 0 disables UAC entirely, and LocalAccountTokenFilterPolicy 1 grants remote
    local accounts full tokens. Several UAC values changing together indicates deliberate
    elevation-control tampering rather than a one-off configuration adjustment; compare the
    writing processes across the events.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Policies\System\ConsentPromptBehaviorAdmin'
          - '\Policies\System\ConsentPromptBehaviorUser'
          - '\Policies\System\EnableLUA'
          - '\Policies\System\EnableVirtualization'
          - '\Policies\System\LocalAccountTokenFilterPolicy'
          - '\Policies\System\FilterAdministratorToken'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Was the policy change made through reg.exe, PowerShell, or cmd.exe?
  context: >-
    Scripted and hands-on tampering typically sets this value with commands like reg.exe
    add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System /v
    PromptOnSecureDesktop /t REG_DWORD /d 0 /f, or Set-ItemProperty with -Value 0 in
    PowerShell. Recovering the full command shows whether one value or several were pushed
    in a single invocation and whether the change came from an interactive session or a
    script, which the registry event alone does not reveal.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'PromptOnSecureDesktop'
          - 'ConsentPromptBehaviorAdmin'
          - 'EnableLUA'
          - 'Policies\System'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What is the full command line and parent chain of the process that wrote this value?
  context: >-
    The registry event identifies the writing process but not its command line or parent;
    the process-creation record supplies both. Legitimate policy management runs through
    Group Policy processing or administrative consoles with predictable parents, while a
    script host, Office application, or user-downloaded binary in the chain — or a
    non-elevated parent producing an elevated writer — indicates the uncommon elevation
    paths this technique produces. Walk further up the tree if the immediate parent is
    itself a script interpreter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who weaken UAC rarely stop at one value — the same session often sets Run-key
    persistence, tampers with security tool policies, or alters firewall configuration.
    Aggregating registry writes on the host in the surrounding window reveals the full
    scope of configuration change; the triggering key will appear in the results, and the
    signal is what else was modified alongside it. If the host is registry-noisy, narrow to
    the writing process from the alert or to Run, Services, Policies, Winlogon, and IFEO paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the alert?
  context: >-
    The policy change is one event inside a session; the surrounding process activity shows
    what led to it and what followed. Results are aggregated by parent-child pair so
    repetitive platform noise collapses into high-count rows — scan the low-count, novel
    pairs for script interpreters, archive tools, reconnaissance commands, or installers
    that bracket the registry write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did auto-elevated system binaries load unsigned or unexpected DLLs on this host?
  context: >-
    Several UAC bypass methods plant a DLL that an auto-elevated binary loads at start —
    DismCore.dll for pkgmgr.exe, .NET profiler DLLs for mmc.exe — completing elevation
    without a visible prompt, which pairs naturally with prompt-weakening policy changes.
    Review the DLLs loaded by auto-elevated binaries around the alert for paths outside
    System32 and for missing or failed signatures; tune the binary list (sdclt.exe,
    eventvwr.exe, computerdefaults.exe and peers) to the bypass tradecraft relevant in
    this environment.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\sdclt.exe'
          - '\eventvwr.exe'
          - '\computerdefaults.exe'
          - '\fodhelper.exe'
          - '\mmc.exe'
          - '\pkgmgr.exe'
          - '\wsreset.exe'
          - '\slui.exe'
          - '\changepk.exe'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What ran with elevated privileges after this policy change?
  context: >-
    Weakening elevation prompts is a means to an end — the follow-on actions that require
    high integrity are the objective: credential dumping, persistence installation,
    security tool tampering, or lateral movement preparation. Elevation that lands within
    a tight window of the registry write (tens of seconds to a few minutes) ties the change
    to an active session. Scan the High and System integrity results for those patterns and
    for elevated binaries running from user-writable paths such as Temp, AppData, or
    ProgramData.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were other privilege escalation techniques attempted on this host?
  context: >-
    Attackers who tamper with elevation controls often try multiple methods until one
    succeeds, especially when OS version or configuration blocks a given technique.
    Multiple UAC bypass or privilege escalation detections in rapid succession confirm
    deliberate escalation activity rather than a false positive, and earlier defense
    tampering or credential access detections help reconstruct the stages that preceded
    this change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Does this host normally run the process that wrote this value?
  context: >-
    A writing process that has never appeared on this host in the past 90 days is more
    suspicious than one that runs regularly — configuration management tooling shows up
    routinely, while a first-seen binary writing security policy suggests something new
    arrived on the host. Compare the users it ran under against the account on the
    triggering event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has PromptOnSecureDesktop been modified before on this host?
  context: >-
    Security policy values rarely change outside imaging, policy rollout, or deliberate
    reconfiguration, so zero prior history makes this a first-time change worth scrutiny.
    Recurring modifications by the same management process suggest configuration
    enforcement — though enforcement that repeatedly sets the value to 0 is itself a
    policy decision to verify with the owning team. Compare the historical Details values
    and writing processes against the alerting event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was PromptOnSecureDesktop modified on other hosts in the environment?
  context: >-
    The same value changing across many hosts in the window suggests a Group Policy or
    configuration management rollout — verify a corresponding change record exists. The
    modification appearing on only this host, or spreading to a small set of hosts over
    time, points to targeted tampering or lateral movement instead. Compare Details values
    and writing processes across hosts to distinguish uniform enforcement from ad hoc changes.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
