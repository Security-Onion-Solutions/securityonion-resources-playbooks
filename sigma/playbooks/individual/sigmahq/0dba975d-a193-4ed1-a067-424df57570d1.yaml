name: Uncommon Network Connection Initiated By Certutil.EXE
id: a5223c2a-a82d-4ce0-846b-d450ec1d9aee
description: |
  Detects certutil.exe initiating an outbound network connection to port 80, 135, 443, or 445.
  Certutil is a signed Windows PKI utility, but its -urlcache verb downloads arbitrary files over
  HTTP(S), making it a standard ingress-tool-transfer primitive (T1105); legitimate certificate
  operations (CRL and chain fetches) also produce egress, so the command line decides. The
  investigation should recover the exact certutil verb and URL, characterize the destination,
  and determine whether a downloaded file was written and executed.
type: detection
detection_id: 0dba975d-a193-4ed1-a067-424df57570d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and port match what this rule detects, and did certutil initiate the connection?
  context: |
    Confirm the alert from the connection event. The rule fires when certutil.exe initiates an
    outbound connection to port 80, 135, 443, or 445. Ports 80 and 443 fit both malicious
    downloads and legitimate CRL or certificate-chain fetches; 135 and 445 from certutil are
    unusual in any workflow and deserve attention on their own.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - DestinationPort
      - Initiated
- question: Is this user or host expected to perform certificate management operations?
  context: |
    Certutil egress is routine on certificate-authority servers, PKI admin workstations, and
    hosts running certificate enrollment automation. On a standard user workstation with no PKI
    role, certutil reaching out to the network has little legitimate cause and the
    download-primitive reading becomes more likely.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was certutil executed from its expected system path under its original name?
  context: |
    The genuine binary lives at C:\Windows\System32\certutil.exe (and the SysWOW64 copy).
    Attackers copy or rename it to evade name-based detections; a certutil OriginalFileName
    carried by a differently-named image, or the binary running from a user-writable path, means
    the rule caught a relocated copy and raises the weight of everything else in this
    investigation.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What exact certutil command line produced this connection?
  context: |
    The verb decides the verdict. certutil -urlcache -split -f <URL> <file> is the download
    primitive; -verifyctl and -urlfetch -verify fetch certificate data as part of chain
    validation; -addstore installing into root or AuthRoot is trust tampering. A URL pointing at
    a raw IP, an uncommon TLD, or a file-sharing service, with an output path under a
    user-writable directory, is the ingress-tool-transfer pattern this rule exists to catch.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the command line reference encoded files, and what would they decode to?
  context: |
    Certutil's -decode and -decodehex verbs convert Base64- or hex-wrapped files back into
    executables; attackers commonly download a text-looking payload and decode it in a second
    certutil invocation. If any invocation around this alert references -decode, -decodehex, or
    -encode, identify the input and output paths and review the decoded content, since the
    output is typically the real payload.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is this destination, and what do WHOIS, passive DNS, and threat intelligence reveal about it?
  context: |
    Destination reputation separates a CRL endpoint from attacker infrastructure. Certificate
    operations reach well-known CA hosts; downloads reach whatever the operator staged. Check
    the IP's ownership, hosting type, and passive-DNS history manually; recently registered
    domains, bulletproof hosting ranges, and file-sharing services carry the download reading.
    The DNS-lookup question supplies the hostname when the connection event carries only the IP.
  range: +/-5m
  answer_sources:
  - network_connection
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What DNS lookups did this host make in the minutes before the connection?
  context: |
    The connection event usually carries only the destination IP; the preceding DNS lookup
    carries the domain the operator actually typed. Match resolutions against the alert's
    destination IP to recover the hostname, and review the querying process, since a lookup
    issued by certutil itself ties the domain directly to the alerting invocation.
  range: -15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What spawned certutil, and is that parent chain expected?
  context: |
    Certutil launched by an interactive admin shell during certificate work reads differently
    from certutil under an Office application, a script host, or an unexpected service. Known
    software updaters occasionally shell out to certutil for chain checks; a web-facing or
    document-handling parent points at post-exploitation download activity.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the download succeed, and what file did certutil write?
  context: |
    A successful -urlcache download produces a file write by certutil at the output path from
    the command line (plus URL-cache artifacts). File activity by the alerting process and its
    children in the minutes after the connection confirms delivery; output paths under
    C:\Users\Public, Temp, or other user-writable staging directories fit the malicious pattern.
  range: +15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the downloaded payload executed, and what is its hash?
  context: |
    The payload hash lives on the execution event, not the file write. Executions within the
    download's process family, either children of the certutil invocation or siblings launched
    by the same parent shell, reveal whether the delivered file ran; the Hashes value supports
    the threat-intelligence lookup that classifies it.
  range: +1h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What other files did certutil or its process family write around the alert?
  context: |
    Multi-stage deliveries drop more than one artifact, such as the encoded download, the
    decoded executable, and staging copies. The full file-write footprint of the alerting
    process and its children maps the delivery, and any write into C:\Users\Public or a Temp
    path deserves individual review.
  range: +1h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this host normally communicate with this destination?
  context: |
    Ninety days of history establishes whether this destination is new for the host. Recurring
    connections from system processes fit an established service such as a CRL endpoint;
    a first-contact destination reached only by certutil, only once, fits staged infrastructure.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: How often has this host fired the certutil-egress pattern over the past 90 days?
  context: |
    Hosts with PKI automation fire this pattern on a schedule with stable command-line
    structure; the aggregation makes that regularity visible. A first-ever fire, or a command
    line that breaks from the host's established structure, is the deviation that matters more
    than the raw count.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \certutil.exe
        Initiated: 'true'
        DestinationPort:
        - 80
        - 135
        - 443
        - 445
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the certutil-egress pattern in the past week?
  context: |
    Fleet distribution separates environment-wide PKI automation from targeted activity. The
    same pattern on many hosts at consistent times reads as scheduled certificate work; one or
    two hosts firing it for the first time in the same window as other suspicious activity
    reads as an operator moving through the environment.
  range: -7d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \certutil.exe
        Initiated: 'true'
        DestinationPort:
        - 80
        - 135
        - 443
        - 445
      condition: selection
    fields:
    - host.name
- question: Were other download-capable LOLBins used on this host recently?
  context: |
    An operator whose certutil download failed or who is staging multiple tools typically
    rotates through equivalent living-off-the-land binaries. Executions of the download and
    archive-extraction class within the last day, reviewed alongside their command lines,
    reveal parallel delivery attempts that a single-binary detection misses.
  range: -24h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding sequence,
    such as the shell session that launched certutil, decode activity after the download, or
    execution of the delivered payload. Novel low-count pairs stand out against repetitive
    agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    An ingress transfer rarely opens an intrusion; earlier detections such as initial-access
    execution, script-host activity, or defense tampering reveal what led to the download and
    help place it in the intrusion timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: >-
    Is the referenced file still on disk for analysis?
  context: >-
    If the detected command references a file (downloaded payload, decoded output, script), checking
    whether it still exists on disk enables deeper analysis -- hash lookups, sandbox submission, or
    content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
