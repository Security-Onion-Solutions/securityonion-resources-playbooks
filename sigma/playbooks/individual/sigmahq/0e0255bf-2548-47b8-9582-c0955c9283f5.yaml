name: Suspicious Reg Add BitLocker
id: 95483deb-2baa-42fd-89c2-11fe35d97ced
description: |
  Detects reg.exe adding values under the BitLocker policy key (\SOFTWARE\Policies\Microsoft\FVE)
  using the /v and /f switches together with BitLocker startup-authentication value names
  such as EnableBDEWithNoTPM, UseAdvancedStartup, UseTPM, or RecoveryKeyMessage. Administrators
  and management tooling do legitimately set these policies, so the same command can be routine
  configuration. When it appears outside a change window, it can be the staging step that lets
  an operator turn on full-volume encryption to deny access to data, so the investigation should
  determine who ran it, what other recovery-inhibiting or destructive actions followed, and
  whether the same activity is spreading to other hosts.
type: detection
detection_id: 0e0255bf-2548-47b8-9582-c0955c9283f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show reg.exe adding a BitLocker policy value under \SOFTWARE\Policies\Microsoft\FVE with /v and /f?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires only when a single reg add command writes to the FVE policy key with the /v and /f switches AND one of the
    BitLocker startup value names is present. Read the full command line and confirm all of those parts are there rather than
    an unrelated reg.exe invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to change BitLocker policy via the registry?
  context: Legitimate BitLocker enrollment is normally driven by Group Policy, MDM, or an imaging task, not by an interactive
    reg.exe command from an arbitrary account. Knowing whether this user administers encryption policy and whether this host
    is a management or imaging system is often the fastest way to separate routine configuration from operator staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which specific BitLocker policy value was written, and what data was set?
  context: The value name and data reveal intent. EnableBDEWithNoTPM and UseAdvancedStartup allow encryption on machines without
    a TPM or with a PIN/USB key the operator controls, and RecoveryKeyMessage/RecoveryKeyMessageSource can plant attacker-controlled
    recovery text. Read the exact value name and the data written to determine whether the change weakens startup authentication
    or prepares operator-controlled encryption rather than enforcing a standard policy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: An operator who edits one BitLocker policy value often edits several, and may also disable security tooling or change
    firewall rules in the same window. Finding the full cluster of reg.exe write operations from this host reveals whether this
    was a single policy tweak or part of a broader configuration change.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What recovery-inhibiting commands ran on this host?
  context: 'Operators preparing impact chain multiple recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic),
    disabling boot recovery (bcdedit), deleting backups (wbadmin), or disabling the Windows Recovery Environment (reagentc).
    This query surfaces those commands across the host. The analyst should then confirm whether each succeeded by checking
    system state directly (vssadmin list shadows, bcdedit /enum, reagentc /info, wbadmin get versions) and verify offline or
    cloud backup status through the organization''s backup systems.'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact operations typically chain several destructive actions: deleting shadow copies AND disabling recovery AND
    stopping security services AND clearing event logs. Finding the complete set of destructive commands, and whether they
    share one scripting parent, reveals whether this is an automated destruction sequence rather than an isolated administrative
    change.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Are files being created with unusual extensions or ransom-note names on this host after the policy change?
  context: Full-volume encryption staging is often followed within minutes by file encryption or ransom-note drops. This query
    watches file creation on the host for non-standard or randomly generated extensions and for filenames that look like ransom
    notes, concentrated in user document folders, network shares, or system paths. A burst of such writes in a short window
    indicates encryption has started; the value of this check is the file extension and target folder, not the process that
    wrote them.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ransom_note:
        TargetFilename|contains:
          - 'readme'
          - 'how_to'
          - 'how-to'
          - 'decrypt'
          - 'recover'
          - 'restore-my'
          - 'ransom'
      condition: selection and selection_ransom_note
    fields:
      - TargetFilename
      - Image
- question: Is this same BitLocker policy activity firing on other hosts in the environment?
  context: Impact operators often push the same encryption-staging command across many hosts in rapid succession. Finding this
    same rule firing on multiple hosts indicates network-wide execution and sets the scope for containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: What process spawned this reg.exe instance and is that parent chain expected?
  context: The parent process reveals how the command was launched. Group Policy or imaging-driven BitLocker policy changes
    have predictable service or management parents. An interactive shell, a script host, or an Office application as the parent
    points to hands-on-keyboard activity or macro-driven execution rather than managed configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - REG
        - ADD
        - \SOFTWARE\Policies\Microsoft\FVE
        - /v
        - /f
        CommandLine|contains:
        - EnableBDEWithNoTPM
        - UseAdvancedStartup
        - UseTPM
        - UseTPMKey
        - UseTPMKeyPIN
        - RecoveryKeyMessageSource
        - UseTPMPIN
        - RecoveryKeyMessage
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - REG
        - ADD
        - \SOFTWARE\Policies\Microsoft\FVE
        - /v
        - /f
        CommandLine|contains:
        - EnableBDEWithNoTPM
        - UseAdvancedStartup
        - UseTPM
        - UseTPMKey
        - UseTPMKeyPIN
        - RecoveryKeyMessageSource
        - UseTPMPIN
        - RecoveryKeyMessage
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user staged similar encryption-policy activity on several hosts, the scope of the operation may be much larger
    than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - REG
        - ADD
        - \SOFTWARE\Policies\Microsoft\FVE
        - /v
        - /f
        CommandLine|contains:
        - EnableBDEWithNoTPM
        - UseAdvancedStartup
        - UseTPM
        - UseTPMKey
        - UseTPMKeyPIN
        - RecoveryKeyMessageSource
        - UseTPMPIN
        - RecoveryKeyMessage
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this BitLocker policy pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine policy changes can be abused. The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process,
    an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - REG
        - ADD
        - \SOFTWARE\Policies\Microsoft\FVE
        - /v
        - /f
        CommandLine|contains:
        - EnableBDEWithNoTPM
        - UseAdvancedStartup
        - UseTPM
        - UseTPMKey
        - UseTPMKeyPIN
        - RecoveryKeyMessageSource
        - UseTPMPIN
        - RecoveryKeyMessage
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this BitLocker policy pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern
    rather than generic reg.exe usage. Many hosts firing the same pattern points to scripted deployment or management automation;
    one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - REG
        - ADD
        - \SOFTWARE\Policies\Microsoft\FVE
        - /v
        - /f
        CommandLine|contains:
        - EnableBDEWithNoTPM
        - UseAdvancedStartup
        - UseTPM
        - UseTPMKey
        - UseTPMKeyPIN
        - RecoveryKeyMessageSource
        - UseTPMPIN
        - RecoveryKeyMessage
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance,
    or credential access, may reveal the attack stages that preceded this event and help reconstruct the timeline leading to
    encryption staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
