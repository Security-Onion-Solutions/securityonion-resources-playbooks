name: Potential RjvPlatform.DLL Sideloading From Non-Default Location
id: 94cc4192-2ab0-4ae3-9219-3e40ba823a3e
description: |
  Detects RjvPlatform.dll being loaded by SystemResetPlatform.exe when the executable is running from
  anywhere other than its default C:\Windows\System32\SystemResetPlatform\ directory. Attackers copy the
  legitimate signed executable to a directory they control and place a malicious RjvPlatform.dll beside it;
  the payload then executes inside a trusted, signed process, which can bypass application allow-listing
  that screens executables but not the libraries they load. The investigation should confirm the executable's
  actual path, verify the DLL's signature and hash against the legitimate copy, identify which process staged
  the files, and determine what the sideloaded code did after loading.
type: detection
detection_id: 0e0bc253-07ed-43f1-816d-e1b220fe8971
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Is RjvPlatform.dll being loaded by a SystemResetPlatform.exe copy running outside C:\Windows\System32\SystemResetPlatform\?
  context: >-
    Confirm the alert is a true positive by reviewing the loading process path (Image) and the module path
    (ImageLoaded) against the rule's criteria. The rule only fires when the executable is NOT under
    C:\Windows\System32\SystemResetPlatform\, the one directory where this pairing is expected, so the
    Image path is the deciding field. The library event also carries the DLL's hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user or host expected to run system reset or recovery tooling from a non-default location?
  context: >-
    SystemResetPlatform.exe is a Windows push-button-reset component that normally runs only from its System32
    subdirectory during reset or recovery operations. Some imaging, refurbishment, or OEM servicing workflows
    stage recovery tooling in alternate paths; knowing whether this host and user perform that kind of work is
    the fastest way to separate a servicing edge case from deliberate sideloading. The rule author rated
    false positives as unlikely.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Are the sideloaded DLL and the relocated executable still on disk for analysis?
  context: >-
    If RjvPlatform.dll and the SystemResetPlatform.exe copy remain at the non-default path, they can be
    hashed, submitted to a sandbox, and content-reviewed. The query correlates file activity from the alerting
    process and its direct children; the staged files themselves may have been written earlier by a different
    process, so also check the staging-process question and the path directly on the endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Was an administrator performing system reset, imaging, or recovery maintenance that explains this activity?
  context: >-
    Direct confirmation from the responsible administrator is often the fastest path to a verdict. If someone
    was running recovery or imaging tooling on this host, ask why the binary was executing from a non-default
    path and what tooling staged it there. If no one recalls the activity, treat the relocated executable and
    its DLL as attacker-staged until the file provenance says otherwise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What other modules did this SystemResetPlatform.exe instance load, and did any come from its own directory instead of system paths?
  context: >-
    The full module list tells the story of a sideload. Look for additional DLLs loaded from the executable's
    non-default directory (search-order hijacking rarely stops at one module), unsigned modules where signed
    ones are expected, and system DLL names resolving to non-system paths. Modules loaded from the expected
    Windows directories with valid signatures are routine runtime dependencies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
  answer_sources:
  - image_load
  - manual_review
- question: What are the signing status, hash, and threat-intel reputation of the loaded RjvPlatform.dll?
  context: >-
    The legitimate RjvPlatform.dll lives in C:\Windows\System32\SystemResetPlatform\ and is Microsoft-signed;
    compare the loaded module's hash against that baseline copy to detect substitution. An unsigned DLL
    carrying a Microsoft component's filename, or one whose SignatureStatus is Invalid, Expired, or
    Distrusted, points to masquerading. Pivot the hash through threat intelligence to surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What command line and working directory did the SystemResetPlatform.exe process run with?
  context: >-
    The process-creation record for the loading process reveals its full executable path, arguments, and
    working directory. The path pins down exactly where the executable was staged (user-writable directories
    such as Downloads, Temp, ProgramData, or Public are the classic staging spots), and unusual arguments or
    a working directory matching the staging path corroborate a manual or scripted launch rather than the
    Windows reset flow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process launched SystemResetPlatform.exe, and is that parent expected?
  context: >-
    The genuine reset platform binary is invoked by the Windows recovery infrastructure, not by user
    applications. A parent such as explorer.exe, cmd.exe, powershell.exe, a script host, or an archive
    utility indicates someone or something launched the relocated copy directly, which fits the sideloading
    pattern. Walk further up the tree via the parent's own creation event if the immediate parent is itself
    unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote RjvPlatform.dll or the SystemResetPlatform.exe copy to this host?
  context: >-
    Sideloading requires staging both files, so the file-creation events identify the delivery mechanism:
    an archive extractor, browser download, installer, remote copy, or script. File writes shortly before
    the module load indicate deliberate staging rather than leftover files; the writing process and its user
    are the next pivot for tracing how the attacker reached the host.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\RjvPlatform.dll'
          - '\SystemResetPlatform.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: Did the process that loaded the DLL make any registry modifications?
  context: >-
    Code running in a sideloaded DLL executes with the host process's identity and privileges, and hijack-flow
    tradecraft commonly pairs module staging with registry changes: run keys, service ImagePath values, or
    app-path entries that re-launch the relocated binary. Compare any modified keys against expected service
    and autorun baselines; writes here turn a one-time load into durable persistence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - process_creation
  - manual_review
- question: What child processes did SystemResetPlatform.exe spawn after the DLL load?
  context: >-
    Whatever the sideloaded DLL does happens inside or beneath this trusted process. Children such as cmd.exe,
    powershell.exe, rundll32.exe, or networking utilities reveal the payload's next stage; the legitimate
    reset platform participates in push-button reset and does not spawn interactive shells or download tools.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregated parent-child process pairs around the load surface what led
    to this event and what followed: reconnaissance commands, privilege escalation, persistence installation,
    or data staging. High-count rows are typically routine agent noise; novel low-count pairs are what to
    scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Does this host normally run SystemResetPlatform.exe?
  context: >-
    This binary executes only during Windows reset or recovery operations on most hosts, so any historical
    execution count should be near zero. First-time execution, especially from a non-default path, is more
    anomalous than a host that has legitimately gone through recent recovery workflows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has RjvPlatform.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If this DLL has only ever been
    loaded by the System32-resident reset platform during recovery activity, the current load from a
    non-default path stands out; repeated recent loads by the same relocated binary suggest an established
    foothold rather than a fresh one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program and user distribution reflects how this exact firing pattern (not generic binary
    usage) has historically occurred here. Deviations such as a new acting program or an
    unexpected user account are the anomaly worth chasing; on most hosts this history is empty,
    which itself confirms novelty.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith: \RjvPlatform.dll
        Image: \SystemResetPlatform.exe
      filter_main_legit_path:
        Image|startswith: C:\Windows\System32\SystemResetPlatform\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - image_load
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may
    reveal the attack stages that preceded the sideload and help reconstruct the timeline. Delivery-related
    alerts (archive extraction, download utilities, script execution) shortly before the load are especially
    relevant to how the files were staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of the rule's firing pattern rather than generic usage of the binary. Many hosts firing the same pattern
    points to scripted deployment or servicing automation; a single host or a small unrelated set points to
    targeted manual activity. Use the host distribution to calibrate severity and scope containment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith: \RjvPlatform.dll
        Image: \SystemResetPlatform.exe
      filter_main_legit_path:
        Image|startswith: C:\Windows\System32\SystemResetPlatform\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - image_load
- question: Were other process-based persistence mechanisms installed on this host around the DLL load?
  context: >-
    A sideloaded DLL only persists if something re-launches the relocated binary, and attackers rarely rely
    on a single mechanism. Executions of schtasks, sc, reg, bitsadmin, or wmic in the surrounding hours may
    reveal the scheduled task, service, or run key that anchors the foothold, or backup persistence installed
    alongside it. Multiple installations in the same timeframe indicate intentional stacking rather than
    isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
