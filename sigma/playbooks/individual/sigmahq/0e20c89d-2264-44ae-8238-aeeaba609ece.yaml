name: Potential Persistence Via Microsoft Office Startup Folder
id: 50b26cad-2080-4c14-8a98-015ce30d67ce
description: |
  Detects a Microsoft Office document or template file being written into an Office application startup folder — EITHER a Word template (.doc/.docm/.docx/.dot/.dotm/.rtf) landing in a Word STARTUP folder, OR an Excel workbook/template (.xls/.xlsm/.xlsx/.xlt/.xltm) landing in an Excel XLSTART folder — by a process other than WINWORD.exe or EXCEL.exe. Files placed in these folders auto-load when the corresponding Office application launches, so a macro-bearing template dropped there yields code execution every time the user opens Word or Excel (T1137 Office Application Startup). Legitimate causes include template synchronization, profile or environment restores from backup, and administrative deployment; the investigation should determine what process wrote the file, what the file contains, and whether Office subsequently loaded it and spawned child processes.
type: detection
detection_id: 0e20c89d-2264-44ae-8238-aeeaba609ece
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path and creating process match what this rule detects?
  context: >-
    Confirm the alert before investing time. The rule fires when EITHER a Word template extension
    (.doc/.docm/.docx/.dot/.dotm/.rtf) is written into a Word STARTUP folder, OR an Excel extension
    (.xls/.xlsm/.xlsx/.xlt/.xltm) is written into an Excel XLSTART folder — and the writing process is
    NOT WINWORD.exe or EXCEL.exe. Note which branch fired (Word STARTUP versus Excel XLSTART) and confirm
    the responsible process is something other than the Office application itself, because a non-Office
    process dropping a template into these folders is the core signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to place Office templates into an application startup folder?
  context: >-
    Legitimate template synchronization, roaming-profile restores, and IT-managed deployments do write
    into Office startup folders. Knowing whether the user role and host function are consistent with this
    behavior is often the fastest way to separate a routine operation from a persistence attempt. When the
    user is a machine or service account, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this file into the Office startup folder, and what launched that process?
  context: >-
    The file event names the writing process; its own creation event reveals the parent that launched it
    and the full command line. A user copying a template through explorer.exe or a sync client is routine;
    a script host (wscript.exe, powershell.exe), a command interpreter, or an Office application spawning
    the writer points to macro-driven or scripted persistence installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: What does this Office file contain, and does it carry auto-run macros?
  context: >-
    Retrieve the file from its on-disk path and examine it in a safe environment. Templates that persist
    through the startup folder typically embed a VBA project with auto-run entry points (AutoOpen,
    AutoExec, Document_Open, Workbook_Open) that fire when Office loads the template. Look for obfuscated
    strings, base64, embedded URLs or IP addresses, and shell-out calls that launch interpreters. A plain,
    macro-free template that matches an approved corporate baseline is a strong benign signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If a file with this name later executed, what is its hash, does threat intel flag it, and is it truly a template or a renamed executable?
  context: >-
    File-write events carry no hash; a hash is recorded only when a file runs. Office templates normally
    load inside WINWORD.exe or EXCEL.exe rather than launching as their own process, so this query may
    return nothing for a genuine template. A hit means the dropped file is actually an executable using an
    Office extension as a decoy — retrieve its hash and submit it to threat intel. When no execution row
    exists, retrieve the file from disk and hash it manually to check against known-malicious and
    known-good baselines.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. A template still in the startup folder
    can be retrieved, hashed, and analyzed, and it remains an active persistence mechanism until removed. A
    file deleted seconds after creation suggests anti-forensic cleanup or a stager that hands off to
    another payload, and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After this template was dropped, did Word or Excel spawn child processes on this host?
  context: >-
    A startup-folder template auto-loads the next time the corresponding Office application launches. A
    malicious macro typically executes by spawning script hosts or command interpreters — cmd.exe,
    powershell.exe, mshta.exe, wscript.exe, cscript.exe, rundll32.exe — as children of WINWORD.exe or
    EXCEL.exe. Because execution waits for the next Office launch, the payload may fire hours or days after
    the drop, so the window is forward-looking. Any interpreter or LOLBin child of an Office application
    after the drop is the execution signal that turns this from a staged mechanism into an active
    compromise.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - \WINWORD.exe
          - \EXCEL.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one startup-folder template often drops or stages several — additional templates,
    a payload the macro loads, or output written elsewhere. The breadth, paths, and extensions of the
    writing process's other file activity distinguish a single template from a broader staging operation
    and enumerate what else needs review. The correlation covers the writer and its direct children,
    because droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files have recently been written into the Office startup folders on this host, and by which processes?
  context: >-
    Office STARTUP and XLSTART folders have a small set of processes that legitimately write into them
    (the Office applications themselves, sync clients, deployment tooling). Other recent arrivals in the
    same folders reveal whether this is an isolated drop or a location under active use, and which other
    templates belong to the same activity. A single unfamiliar writer touching multiple files in these
    folders is the pattern to focus on.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Microsoft\Word\STARTUP
          - \Microsoft\Excel\XLSTART
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were Office add-in, template-macro, or Outlook startup registry keys also modified on this host around this time?
  context: >-
    The startup folder is one Office persistence route; the registry is a parallel one. AddIns keys with a
    LoadBehavior value of 3 auto-load a COM add-in at application launch, and Outlook Today and WebView
    homepage keys redirect the mailbox home page to attacker script. Persistence installers frequently set
    both a file drop and a registry hook, so a matching registry modification in the same window strengthens
    the case for deliberate persistence and enumerates additional mechanisms to remediate.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \Outlook\Addins\
          - \Word\Addins\
          - \Excel\Addins\
          - \Outlook\WebView\
          - \Outlook\Today\
          - \Office test\Special\Perf
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- always_include: true
  question: Has this user produced this Office startup-folder drop pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of
    this specific Office-startup drop pattern, aggregated by host, not generic Office usage. A user who has
    never produced this pattern is more suspicious than one who does so routinely; weigh the count against
    the user's role and whether they administer or author Office templates.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      selection_word_extension:
        TargetFilename|endswith:
        - .doc
        - .docm
        - .docx
        - .dot
        - .dotm
        - .rtf
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      selection_excel_extension:
        TargetFilename|endswith:
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
      filter_main_office:
        Image|endswith:
        - \WINWORD.exe
        - \EXCEL.exe
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection_word_* or all of selection_excel_*) and not filter_main_office) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the process that wrote this file historically driven the same Office-startup drop pattern here or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior;
    the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting writer process, returning the 90-day history of that process producing this specific pattern.
    A new or rare writer for this pattern is the deviation worth chasing; a process that already accounts
    for thousands of prior events is deployment or sync automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      selection_word_extension:
        TargetFilename|endswith:
        - .doc
        - .docm
        - .docx
        - .dot
        - .dotm
        - .rtf
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      selection_excel_extension:
        TargetFilename|endswith:
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
      filter_main_office:
        Image|endswith:
        - \WINWORD.exe
        - \EXCEL.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: ((all of selection_word_* or all of selection_excel_*) and not filter_main_office) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account is active on multiple
    endpoints in the same window, which points to lateral movement or a wider scope of compromise. If the
    alert fires under SYSTEM, a service principal, or a machine account, this user pivot returns
    agent-telemetry noise — the parent-driven fleet question is the meaningful answer in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same writer-driven pattern fire on other hosts in the same window — a coordinated automation rollout, or activity isolated to this host?
  context: >-
    Under a service principal, a user pivot returns noise from the SYSTEM-owned agents every host runs. The
    meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule's
    selection scoped to the alerting writer process, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_word_paths:
      - TargetFilename|contains: \Microsoft\Word\STARTUP
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \STARTUP
      selection_word_extension:
        TargetFilename|endswith:
        - .doc
        - .docm
        - .docx
        - .dot
        - .dotm
        - .rtf
      selection_excel_paths:
      - TargetFilename|contains: \Microsoft\Excel\XLSTART
      - TargetFilename|contains|all:
        - \Office
        - \Program Files
        - \XLSTART
      selection_excel_extension:
        TargetFilename|endswith:
        - .xls
        - .xlsm
        - .xlsx
        - .xlt
        - .xltm
      filter_main_office:
        Image|endswith:
        - \WINWORD.exe
        - \EXCEL.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: ((all of selection_word_* or all of selection_excel_*) and not filter_main_office) and _pb_scope
    fields:
    - host.name
- question: Was a file with this name written into Office startup folders on other hosts?
  context: >-
    Finding the same template file across multiple hosts may indicate deliberate distribution or an
    automation push; a single host suggests targeted activity. If the file is widespread, determine the
    distribution timeline and the common writer to tell a managed deployment from an attacker seeding
    persistence broadly.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Were files dropped into other autostart locations, such as the user Startup folder or scheduled-task definition paths, on this host?
  context: >-
    The Office startup folder is one file-based persistence route; attackers rarely rely on a single
    mechanism. Dropping an executable or script into the user or system Startup folder, or into a path
    referenced by a registry Run or RunOnce key, achieves persistence through a distinct channel. Other
    drops into these locations in the same timeframe indicate intentional stacking rather than an isolated
    template write.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually installed after initial access, so earlier detections on the same host —
    phishing-document execution, defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded this template drop and help reconstruct the timeline. The sequence of alerts often
    tells the fuller story of how the actor reached the point of establishing Office persistence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
