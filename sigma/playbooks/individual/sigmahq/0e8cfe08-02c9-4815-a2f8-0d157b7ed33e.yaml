name: File Download with Headless Browser
id: 7ce8c968-1244-4b52-9f58-e5926dc198e1
description: |
  Detects a Chromium-based browser (brave, chrome, msedge, opera, or vivaldi) launched
  in headless mode with the dump-dom command-line argument pointed at an http URL. The
  dump-dom flag prints the rendered HTML of a loaded page to stdout, which lets the
  browser act as a command-line download or fingerprinting harness — the operator
  captures the output to retrieve a remote file or read back data from an attacker URL.
  Legitimate automation and developer tooling occasionally drive headless browsers, so
  the investigation should decode the exact URL and flags, confirm whether a file was
  written to disk, and determine whether the parent chain and user fit expected activity.
type: detection
detection_id: 0e8cfe08-02c9-4815-a2f8-0d157b7ed33e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line match the rule — a Chromium-based browser run with --headless and dump-dom against an http URL?
  context: Before investing investigation time, confirm the alert is a true positive.
    Review the full command line and verify it carries all three of the --headless flag,
    the dump-dom argument, and an http URL, and that the Image is one of the targeted
    browsers (brave, chrome, msedge, opera, vivaldi). The rule excludes a fixed set of
    Edge install-path and managed-Edge command-line structures, so confirm the alerting
    process is not one of those benign Edge invocations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to drive a headless browser to fetch remote content?
  context: Legitimate automation, scraping jobs, and developer workflows do use headless
    browsers, so the fastest triage path is often knowing whether this account and host
    have a reason to run one. A headless browser invoked under an interactive user who
    has no automation role, or on a host with no scraping or build function, is more
    concerning than the same activity on a known automation endpoint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What URL and flags did this headless browser invocation use? Decode the full command line.
  context: The full command line reveals what the browser was told to fetch. Extract the
    http or https URL the dump-dom output was rendered from, and note any redirection of
    stdout to a file. An external IP-discovery or fingerprinting service, an attacker-
    controlled host, or a URL pointing at an encoded payload all change the disposition.
    Decode every flag — extra options such as disabled logging or cache discarding pattern
    how the operator intended to use the rendered output.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - '--headless'
          - 'dump-dom'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this browser and is that parent chain expected?
  context: The parent process reveals how the headless browser was invoked. A browser
    launched by explorer.exe or a known automation runner is routine; a launch from a
    script host (wscript.exe, cscript.exe, powershell.exe), an Office application, or an
    unfamiliar binary in a user-writable path points to a dropper or loader driving the
    browser as a download harness. Trace what started the parent itself to see whether the
    chain originated from user action or automated execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external destination did this browser connect to, and is it a known-bad or uncommon host?
  context: Ingress tool transfer requires the browser to reach an external host to fetch
    the page or payload. Correlating the browser process with its outbound connections
    surfaces the destination IP and port behind the URL seen in the command line. An
    external, uncommon, or reputation-flagged destination — especially a raw IP or an
    IP-geolocation service — supports a malicious download; a connection only to internal
    or well-known infrastructure weakens it. Filter internal address blocks from external
    ones when judging the destination.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Was a file actually written to disk, or did the browser only render the page to stdout?
  context: A dump-dom command renders page HTML to stdout; whether that became a file on
    disk depends on how the caller captured the output. Network errors, blocked URLs, or
    a command that never redirected output may mean nothing was saved. Confirming a file
    creation by the browser process at the expected destination establishes whether the
    operation progressed past retrieval to a staged payload.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What content did the headless browser capture to disk, and can you retrieve and decode it?
  context: The dump-dom flag prints a page's rendered HTML to stdout, which the operator
    captures to a file — frequently base64 or otherwise encoded for a follow-on stage. This
    is data to decode, not a binary to detonate, and file-write events carry no hash, so the
    file itself is the value — retrieve the raw bytes from the path below and decode them to
    reveal what was fetched or read back. This query shows files written by the browser and
    its children; if the output was captured by shell redirection from the parent process
    instead, widen the search to that parent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the retrieved file or rendered output still on disk for analysis?
  context: If the command captured the dump-dom output to a file — a payload, decoded
    output, or a script — checking whether it still exists on disk enables deeper
    analysis through hash lookups, isolated detonation, or content review. A file that
    has already been deleted or moved points to cleanup and is itself worth noting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the directory where the output landed?
  context: Operators often stage multiple files in the same directory, or the captured
    output triggers further writes — decoding, extraction, or additional downloads.
    Examining directory-level file activity around the retrieval reveals the broader
    scope of the delivery operation and any follow-on payloads dropped alongside the
    rendered output.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did this browser spawn afterward?
  context: The processes spawned after the retrieval reveal its actual impact. A headless
    browser used purely to render a page has predictable, browser-internal children;
    cmd.exe, powershell.exe, certutil.exe, or a freshly written binary launched in the
    minutes after the dump-dom command points to a decode-and-execute follow-on stage
    consuming the retrieved content.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate headless-browser automation can be abused. This query mirrors
    the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern — not generic browser usage —
    has historically run here. A new parent process, an unexpected user account, or a
    first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains|all:
        - --headless
        - dump-dom
        - http
      filter_optional_edge_1:
        Image|startswith:
        - C:\Program Files (x86)\Microsoft\Edge\Application\
        - C:\Program Files (x86)\Microsoft\EdgeCore\
        - C:\Program Files (x86)\Microsoft\EdgeWebView\
        - C:\Program Files\Microsoft\Edge\Application\
        - C:\Program Files\Microsoft\EdgeCore\
        - C:\Program Files\Microsoft\EdgeWebView\
        - C:\Program Files\WindowsApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \msedgewebview2.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      filter_optional_edge_2:
        Image|contains:
        - \AppData\Local\Microsoft\WindowsApps\
        - \Windows\SystemApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of the headless-browser download pattern rather than generic browser
    usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains|all:
        - --headless
        - dump-dom
        - http
      filter_optional_edge_1:
        Image|startswith:
        - C:\Program Files (x86)\Microsoft\Edge\Application\
        - C:\Program Files (x86)\Microsoft\EdgeCore\
        - C:\Program Files (x86)\Microsoft\EdgeWebView\
        - C:\Program Files\Microsoft\Edge\Application\
        - C:\Program Files\Microsoft\EdgeCore\
        - C:\Program Files\Microsoft\EdgeWebView\
        - C:\Program Files\WindowsApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \msedgewebview2.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      filter_optional_edge_2:
        Image|contains:
        - \AppData\Local\Microsoft\WindowsApps\
        - \Windows\SystemApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      condition: selection and not 1 of filter_optional_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains|all:
        - --headless
        - dump-dom
        - http
      filter_optional_edge_1:
        Image|startswith:
        - C:\Program Files (x86)\Microsoft\Edge\Application\
        - C:\Program Files (x86)\Microsoft\EdgeCore\
        - C:\Program Files (x86)\Microsoft\EdgeWebView\
        - C:\Program Files\Microsoft\Edge\Application\
        - C:\Program Files\Microsoft\EdgeCore\
        - C:\Program Files\Microsoft\EdgeWebView\
        - C:\Program Files\WindowsApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \msedgewebview2.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      filter_optional_edge_2:
        Image|contains:
        - \AppData\Local\Microsoft\WindowsApps\
        - \Windows\SystemApps\Microsoft.MicrosoftEdge
        Image|endswith:
        - \msedge.exe
        - \MicrosoftEdge.exe
        CommandLine|contains: --headless --disable-gpu --disable-extensions --disable-plugins --mute-audio --no-first-run --incognito --aggressive-cache-discard --dump-dom
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \brave.exe
        - \chrome.exe
        - \msedge.exe
        - \opera.exe
        - \vivaldi.exe
        CommandLine|contains|all:
        - --headless
        - dump-dom
