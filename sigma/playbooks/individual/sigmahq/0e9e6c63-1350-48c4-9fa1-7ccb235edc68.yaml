name: Rorschach Ransomware Execution Activity
id: 07e104c7-be0c-427e-801c-5f920be17179
description: |
  Detects Rorschach ransomware execution activity: a process whose image ends in bcdedit.exe,
  net.exe, net1.exe, netsh.exe, wevtutil.exe, or vssadmin.exe AND whose command line contains the
  repeating digit string '11111111'. Rorschach creates these child processes in a suspended state
  with a placeholder argument string of repeated '1' characters sized to match the real arguments,
  then rewrites the arguments in memory before resuming — so the command line recorded by process
  telemetry is padding rather than the command that actually executed. The six binaries are the
  recovery-inhibiting and log-clearing set the family runs before encryption: shadow copy and
  backup deletion, boot recovery disabling, Application/Security/System/PowerShell log clearing,
  service stopping, and firewall changes. The investigation should establish which recovery and
  logging controls were targeted, whether encryption has already started on the host, what launched
  the utilities, and how many hosts show the same pattern.
type: detection
detection_id: 0e9e6c63-1350-48c4-9fa1-7ccb235edc68
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show bcdedit.exe, net.exe, net1.exe, netsh.exe, wevtutil.exe, or
    vssadmin.exe running with the repeating '11111111' string in its command line?
  context: >-
    Both conditions must hold for this rule to fire: the image is one of the six recovery-inhibiting
    or log-clearing binaries and the command line carries the repeating '1' padding. Confirm both in
    the raw event. The padding is what the in-memory argument rewrite leaves behind in process
    telemetry, so a match here confirms the creation pattern but does not reveal what the binary
    was actually told to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to run boot-configuration, shadow-copy, event-log, or
    network-configuration utilities?
  context: >-
    Backup servers, imaging hosts, and administrator workstations run vssadmin, bcdedit, and
    wevtutil as part of routine maintenance, and net.exe is ubiquitous. Knowing whether the account
    and host function fit that profile is the fastest way to separate maintenance from an execution
    chain that is preparing a host for encryption.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Ransomware operators chain recovery destruction: shadow copy deletion (vssadmin, wmic
    shadowcopy), boot recovery disabling (bcdedit /set recoveryenabled No and bootstatuspolicy
    ignoreallfailures), backup catalog deletion (wbadmin), and Windows Recovery Environment
    disabling (reagentc /disable). This surfaces every recovery-inhibiting command on the host over
    the next day. Because the alerting command line is padded, confirm the outcome against live
    system state rather than the recorded arguments: vssadmin list shadows, bcdedit /enum,
    reagentc /info, and wbadmin get versions, plus the status of offline and off-host backups.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting binaries ran on this host around the alert?
  context: >-
    The execution stage runs several of these utilities back to back rather than one in isolation —
    shadow copy and backup deletion, boot recovery disabling, service and process termination, and
    event log clearing. Seeing which of the set ran within the same half hour, and whether they
    share one parent, distinguishes a scripted destruction sequence from a single administrative
    command.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    Rorschach self-propagates from a domain controller by copying its files to the domain scripts
    folder and creating a group policy object that stages the loader under the public profile of
    every domain workstation and schedules it to run, so the same execution pattern can appear
    across many hosts within a short window. The host count and the first-to-last detection times
    define the containment scope; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    Recovery destruction typically precedes encryption by minutes. This surfaces processes on the
    host outside the usual system paths in the following half hour. The family's execution chain
    runs a signed third-party tool that side-loads a loader DLL, decrypts a payload from an
    accompanying config file, and injects it into notepad.exe, so a notepad.exe process with heavy
    file activity or an unfamiliar signed utility running from a user-writable path are both worth
    pulling. Check the file system for mass renames, a new uniform extension, and ransom notes.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Which specific recovery or logging control did this command target?
  context: >-
    The binary identifies the target even though the arguments are padding — bcdedit.exe reaches
    boot recovery and boot status policy, vssadmin.exe reaches shadow copies, wevtutil.exe clears
    the Application, Security, System, and Windows PowerShell logs, net.exe and net1.exe stop
    services, and netsh.exe alters firewall configuration. Read the recorded command line for any
    fragment that survived the rewrite, then confirm the control's actual state on the host, since
    the padded arguments cannot tell you which log or which service was named.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process spawned this command, and is that parent a normal launcher for it?
  context: >-
    Maintenance invocations of these utilities are normally launched from cmd.exe under
    explorer.exe, from a scheduled task, or from a backup agent. A parent such as notepad.exe or
    another hollowed host process, a signed vendor utility running from a non-standard directory,
    or a policy-driven script host indicates the utilities were driven by injected code rather than
    by an operator. The parent command line is the pivot back to the loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What activity occurred on this host after the security control was disabled or tampered with?
  context: >-
    Recovery destruction and log clearing are preparation steps; what follows in the next hour is
    the payload they were meant to enable. If the event logs on this host were cleared, expect a
    visibility gap in channel-based evidence for that window and rely on process telemetry.
    Correlate the processes seen here with file and network activity in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    net.exe and net1.exe are in this rule's binary list, and the same execution stage commonly
    enumerates shares, sessions, domain accounts, and running processes before acting. Several
    different discovery binaries within the same fifteen minutes, especially under one parent,
    indicates scripted enumeration rather than an administrator troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were modules loaded from user-writable directories on this host, and are they signed?
  context: >-
    The loader in this execution chain is a DLL side-loaded by a signed commercial security tool
    binary, and the policy-driven rollout stages that DLL and its encrypted config file under the
    public profile before running them. Loads from C:\Users\Public, AppData, Temp, ProgramData, or
    PerfLogs are the direct evidence of that staging, and module load events carry the signer and
    signature status on the event itself. An unsigned or vendor-signed module loaded from those
    paths by a binary that also lives there identifies the loader and the process that hosted it.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\Users\Public\'
          - '\AppData\'
          - '\Temp\'
          - '\ProgramData\'
          - '\PerfLogs\'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of this padded-argument pattern across hosts, not generic use of vssadmin or
    net.exe. This pattern has no legitimate producer, so a non-zero historical count for the same
    account is itself a finding worth timelining rather than a reason to close the alert. A zero
    count means this account has not produced it before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \bcdedit.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \wevtutil.exe
        - \vssadmin.exe
        CommandLine|contains: '11111111'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a machine account, user identity does not attribute the
    behavior; the launch mechanism does. The query mirrors the rule's selection structure scoped to
    the alerting parent process, so the result is the 90-day history of that parent driving this
    specific padded-argument pattern. A parent that has never driven it before is the deviation to
    chase; a parent with a long prior history points to something environmental that should still
    be explained, because this pattern has no routine producer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \bcdedit.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \wevtutil.exe
        - \vssadmin.exe
        CommandLine|contains: '11111111'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same
    identity drove execution on more than one endpoint, which sets the containment boundary. If the
    alert fired under SYSTEM or a machine account this returns routine agent telemetry from every
    host and should be read alongside the parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent
    telemetry from every host. The meaningful question is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule's selection structure scoped to the alerting parent
    process, fleet-wide, in the alert window. Multiple hosts in the same window fits a
    policy-driven rollout to domain workstations; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \bcdedit.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \wevtutil.exe
        - \vssadmin.exe
        CommandLine|contains: '11111111'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users drove it, and
    does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this padded-argument pattern has run here over the past two weeks
    rather than generic use of the six binaries. An empty result is the expected outcome and marks
    the alert as first-of-its-kind on the host. Prior hits mean the execution chain has run before
    and the timeline should be extended back to the earliest one.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \bcdedit.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \wevtutil.exe
        - \vssadmin.exe
        CommandLine|contains: '11111111'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: >-
    Have other hosts fired the rule's pattern in the past week, and how is that activity
    distributed across the fleet?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this padded-argument pattern rather than the binaries' generic footprint.
    Many hosts over a short interval fits a policy-driven rollout from a domain controller to
    workstations; a scattered set over days points to separate host-local executions. Use the host
    list to define the containment scope and to look for a common upstream source.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \bcdedit.exe
        - \net.exe
        - \net1.exe
        - \netsh.exe
        - \wevtutil.exe
        - \vssadmin.exe
        CommandLine|contains: '11111111'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections reconstruct the stages that preceded execution — side-loading of a signed
    utility, group policy or scheduled task creation, service and process termination, or
    credential access. The ordering of those alerts against this one tells you whether this host
    was the origin of the activity or a downstream recipient of it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
