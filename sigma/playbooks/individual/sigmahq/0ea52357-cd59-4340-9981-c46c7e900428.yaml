name: Potentially Suspicious Rundll32.EXE Execution of UDL File
id: a707d6b3-7480-4fda-af53-847c2f907df9
description: |
  Detects explorer.exe spawning rundll32.exe to invoke the oledb32.dll connection-dialog
  handler against a Universal Data Link (.udl) file located under a user's Downloads
  directory. The rule fires only when all of the following match together: the parent is
  explorer.exe, the image is rundll32.exe (or carries that original filename), and the command
  line contains oledb32.dll, the ,OpenDSLFile entrypoint, a path under \Users\*\Downloads\,
  and ends in .udl. Opening a .udl presents a database-connection dialog whose Test Connection
  action authenticates to the configured server, so this pattern can be abused to coerce
  NTLM authentication to an attacker-controlled host or to socially harvest plaintext
  database credentials. Determine whether the .udl file arrived as a delivered attachment,
  what server the connection string points to, and whether any outbound authentication
  followed.
type: detection
detection_id: 0ea52357-cd59-4340-9981-c46c7e900428
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did explorer.exe launch rundll32.exe to open a .udl file from a Downloads path
    using the oledb32.dll OpenDSLFile entrypoint?
  context: Confirm the alert is a true positive by reviewing the triggering event against the
    rule's criteria, which require all of these together — parent explorer.exe, image rundll32.exe,
    and a command line that references oledb32.dll, the ,OpenDSLFile entrypoint, a \Users\*\Downloads\
    path, and a .udl file ending. Verify each element is present before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to open database connection files from Downloads?
  context: Universal Data Link files are a legitimate convenience for developers and administrators
    testing database connections, so a database engineer or DBA opening a .udl may be routine.
    For a general user with no database administration role, opening a .udl delivered to Downloads
    is the more concerning pattern and the fastest way to separate routine activity from a
    delivered lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What server and authentication mode does this .udl connection string point to?
  context: The command line names the .udl path, but the connection string inside the file
    determines where Test Connection authenticates and how. Decode the full command line and
    inspect the referenced .udl to identify the target server name (including any comma-port
    override such as servername,80 used to bypass default database-port egress filtering),
    whether integrated Windows authentication or explicit credentials are configured, and
    whether a username is pre-filled. A non-internal or attacker-controlled server name is the
    decisive finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is explorer.exe expected to spawn rundll32.exe this way, and what started this
    explorer.exe instance?
  context: The explorer.exe-to-rundll32.exe relationship is the core signal here. Explorer
    routinely shells out to rundll32 when a user double-clicks a file, so the discriminator is
    what was double-clicked and how the explorer instance itself was started. Tracing explorer's
    own origin distinguishes an interactive user session from an explorer spawned by another
    process as part of an execution chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this explorer.exe instance spawn around the same
    time?
  context: If this explorer instance is part of a malicious chain rather than a normal user
    session, it likely spawned other processes too. Sibling processes from the same explorer
    parent reveal whether the .udl open was an isolated user action or one of several launches,
    such as additional rundll32 invocations or script interpreters.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does explorer.exe on this host normally spawn rundll32.exe to open .udl files?
  context: Explorer spawning rundll32 is common, but the specific pattern of rundll32 invoking
    the OLE DB connection dialog against a .udl is rare in most environments. A near-zero
    historical count for this parent-child-plus-pattern combination on the host indicates a
    novel action worth deeper review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '.udl'
      condition: selection
    fields:
      - CommandLine
- question: Did the same explorer-spawned rundll32 .udl open occur on other hosts recently?
  context: Database connection-file lures are typically delivered to multiple recipients at
    once, so the same pattern appearing on several hosts points to a delivery wave rather than
    a single targeted action. A single occurrence is more likely isolated. The query omits the
    host filter to compare enterprise-wide.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '.udl'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What DLLs did this rundll32.exe instance load, and was oledb32.dll among them?
  context: Process creation shows the command line, but the image-load view confirms which
    libraries rundll32 actually mapped into memory. Confirming oledb32.dll and its dependent
    OLE DB provider DLLs were loaded corroborates that the connection-dialog handler ran, and
    any additional unexpected modules loaded by the same instance broaden the picture of what
    executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
- question: Where did this .udl file come from, and what else was written to the same Downloads
    directory?
  context: The .udl living under Downloads suggests it was delivered rather than locally
    authored. File events for this path reveal which process wrote the file and when, and
    surrounding writes to the same directory may show the delivery vehicle or related staged
    files. A file written shortly before the open by a browser or mail client points to a
    delivered attachment.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Downloads\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did rundll32.exe make any outbound network connections after opening the .udl file?
  context: The harm from this technique occurs when the connection dialog authenticates to the
    configured server, sending an NTLM challenge-response or plaintext credentials outbound,
    often over an application-layer protocol on a non-default port to evade egress filtering.
    Any outbound connection from this rundll32 instance, especially to an external or
    non-domain host, indicates the authentication coercion succeeded and credentials may have
    been exposed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who abuse one signed proxy-execution binary often reach for others. If
    rundll32 was used to invoke the OLE DB dialog, check whether regsvr32, mshta, msbuild, or
    similar binaries were also used to execute code on this host. Multiple proxy-execution
    LOLBins in a short window strengthens the case for deliberate activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was rundll32.exe executed from its expected System32 or SysWOW64 path?
  context: A rundll32 running from a user-writable location outside System32 or SysWOW64 may
    be a copied or renamed binary placed to evade path-based allowlists. Confirm the image
    path and original filename match the genuine system binary location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this rundll32 .udl pattern over the past 90 days,
    and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly
    under stable conditions. The query mirrors the rule's selection structure scoped to this
    host, so the count reflects the rule's specific firing pattern rather than generic rundll32
    usage. The command-line projection lets the analyst compare typical invocation patterns
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - oledb32.dll
        - ',OpenDSLFile '
        - \\Users\\*\\Downloads\\
        CommandLine|endswith: .udl
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - oledb32.dll
        - ',OpenDSLFile '
        - \\Users\\*\\Downloads\\
        CommandLine|endswith: .udl
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - oledb32.dll
        - ',OpenDSLFile '
        - \\Users\\*\\Downloads\\
        CommandLine|endswith: .udl
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same identity
    triggered related activity elsewhere. If the same user opened similar connection files or
    ran other tools on multiple hosts in the same window, the scope is broader than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      selection_cli:
        CommandLine|contains|all:
        - oledb32.dll
        - ',OpenDSLFile '
        - \\Users\\*\\Downloads\\
        CommandLine|endswith: .udl
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
