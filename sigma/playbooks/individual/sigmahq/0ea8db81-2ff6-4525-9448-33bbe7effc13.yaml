name: New DMSA Service Account Created in Specific OUs
id: 107a596a-0de3-481e-83b3-7c1722ab29e5
description: |
  Detects a PowerShell host (powershell.exe, pwsh.exe, or powershell_ise.exe, matched on Image or
  OriginalFileName) whose command line contains New-ADServiceAccount together with both
  -CreateDelegatedServiceAccount and -path. Both conditions must hold for the rule to fire, so the alert
  represents an attempt to create a delegated Managed Service Account (dMSA) into a caller-chosen
  organizational unit. dMSA objects are a Windows Server 2025 Active Directory feature; a principal
  holding create-child rights over any OU can create a dMSA there and link it to another account, after
  which the dMSA inherits that account's access when it authenticates — the BadSuccessor privilege
  escalation pattern. Legitimate dMSA creation is normally performed by directory administrators using
  documented procedures against a planned OU. Determine which account issued the command and whether it
  is authorized to manage service accounts in the supplied OU, what account name and OU path were passed,
  whether the resulting dMSA was subsequently linked to a privileged principal, and whether it was used
  to authenticate.
type: detection
detection_id: 0ea8db81-2ff6-4525-9448-33bbe7effc13
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line contain New-ADServiceAccount with both -CreateDelegatedServiceAccount and -path,
    and is the process a PowerShell host?
  context: >-
    The rule requires both conditions together, so confirm both before investing further time. Read the
    exact command line and confirm the Image or OriginalFileName resolves to powershell.exe, pwsh.exe, or
    powershell_ise.exe rather than a renamed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to create Active Directory service accounts?
  context: >-
    Creating a dMSA is a directory administration task normally performed from a management workstation by
    an account with delegated service-account rights. A user or host with no directory administration role
    producing this command is the fastest distinguisher between routine administration and delegation abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What account name and OU path were passed to New-ADServiceAccount, and what other parameters were set?
  context: >-
    The -path value names the organizational unit the dMSA lands in, and the -Name value identifies the
    object to track through the directory. An OU the operator can write to but that is not the planned
    location for service accounts is the parameter that carries the delegation abuse. Also read any
    -PrincipalsAllowedToRetrieveManagedPassword or -SupersededAccount value, which controls who can use the
    account. The query is scoped to New-ADServiceAccount command lines on this host rather than to all
    PowerShell executions, because PowerShell is far too common for binary-level scoping.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'New-ADServiceAccount'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the command assembled from concatenated strings, backticks, or variables that hide the real OU path?
  context: >-
    The cmdlet name and switches are readable in plain text here, but the argument values may not be. String
    concatenation, backtick escaping, and variable substitution let an operator supply a distinguished name
    that the raw command line does not display literally. Resolve every argument to its literal value before
    judging which OU the account was created in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this PowerShell session and is that parent chain expected?
  context: >-
    An administrator running directory cmdlets usually reaches PowerShell from explorer.exe, an RSAT console,
    or a management console. A parent such as wscript.exe, mshta.exe, an Office application, a remote
    execution service, or an unexpected automation host points at the session being driven by something other
    than the account owner sitting at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the directory record the corresponding account-creation event, and which OU did the object land in?
  context: >-
    The command line states the intent; the directory event states the outcome. Account and directory-object
    creation events carry the resulting distinguished name and the account that performed the creation, which
    confirms whether the object was actually created and where. Compare the OU in the distinguished name
    against the organizational units approved for service accounts, and compare the creating account against
    the account that ran the command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4741
          - 4720
          - 5137
      condition: selection
    fields:
      - ObjectDN
      - ObjectClass
      - TargetUserName
      - SubjectUserName
  answer_sources:
  - active_directory
  - manual_review
- question: Was the new dMSA linked to another account, and does that account hold privileged group membership?
  context: >-
    Creating the object is only the first half of the technique. The escalation comes from writing the
    attributes that tie the dMSA to a successor account — msDS-ManagedAccountPrecededByLink together with
    msDS-DelegatedMSAState — which makes the dMSA inherit that account's access at authentication. Directory
    change events record each attribute write with the value set and the account that set it. A link naming a
    member of Domain Admins, Enterprise Admins, or a domain controller account, or a modifying account that is
    not the account being modified, is the escalation step itself. Attribute writes within a few minutes of the
    creation command indicate one continuous operation rather than separate administrative changes.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 5136
      selection_attr:
        AttributeLDAPDisplayName|contains:
          - 'msDS-ManagedAccountPrecededByLink'
          - 'msDS-DelegatedMSAState'
          - 'msDS-SupersededManagedAccountLink'
          - 'msDS-GroupMSAMembership'
      condition: selection and selection_attr
    fields:
      - ObjectDN
      - AttributeLDAPDisplayName
      - AttributeValue
      - SubjectUserName
  answer_sources:
  - active_directory
  - manual_review
- question: Did a machine or service account authenticate on this host after the dMSA was created, and with what logon type and privileges?
  context: >-
    A dMSA delivers access only once something authenticates as it. Service-account names end in a dollar sign,
    so logon and special-privilege events for accounts matching that form on this host reveal whether the new
    object was put to use. Note the logon type — interactive and remote interactive logons for a service account
    do not match how service accounts are normally consumed, while network and service logons do. Special-privilege
    assignments listing directory or backup privileges mean the linked account's access was actually realized. A
    logon minutes after the creation command indicates the creation and the use are one operation; hours or days of
    separation may mean the account is being staged for later.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4672
      selection_svc:
        TargetUserName|endswith: '$'
      condition: selection and selection_svc
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
  answer_sources:
  - active_directory
  - manual_review
- question: What network destinations did PowerShell reach from this host around the alert?
  context: >-
    Directory cmdlets talk to a domain controller over LDAP and Kerberos, so a session doing only what it claims
    resolves to a domain controller on directory ports. Destinations that are not domain controllers — an internal
    host outside the directory tier, or an external address — mean the session was doing more than account
    creation, and identify where a retrieved managed password or a staged payload may have travelled. If the
    environment collects connections only from network sensors rather than from the endpoint, process attribution
    on these events may be absent.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Were PowerShell security controls bypassed or weakened before the account was created?
  context: >-
    Execution policy bypass flags, AMSI tampering, engine downgrade to version 2, or real-time monitoring being
    disabled in the hour before a directory change indicate the session was prepared to run unlogged or
    uninspected code rather than a console an administrator simply opened. Their absence does not clear the alert,
    but their presence separates a prepared session from an ad-hoc administrative one.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did PowerShell script block logging capture the full script around this account creation?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, after any concatenation or variable
    substitution is resolved. It shows the literal distinguished name passed to -path, any attribute writes issued
    in the same script, and whatever ran before and after the cmdlet — none of which the command line alone
    exposes. If PowerShell operational logs are not ingested in this environment, treat an empty result as a
    visibility gap rather than evidence that nothing else ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how dMSA creation from this host has historically run rather than generic PowerShell
    usage. A directory management workstation with a steady history of the same administrator and the same parent
    reads differently from a first occurrence under a new parent or a new account.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - powershell_ise.exe
      selection_cli:
        CommandLine|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously created delegated service accounts, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of dMSA creation aggregated by host, not their generic PowerShell usage. A directory administrator
    with a recurring history across management hosts is a different finding from an account producing this
    pattern for the first time. Weigh the count against the account's documented directory responsibilities.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - powershell_ise.exe
      selection_cli:
        CommandLine|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven dMSA creation on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service principal, or a computer account, the user field does not
    attribute the behavior and the meaningful pivot is the launch mechanism. The query mirrors the rule's
    selection structure scoped to the alerting parent process, giving the 90-day history of that parent driving
    this pattern. A parent already accounting for a long run of prior events is provisioning automation; a parent
    that has never driven this before is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - powershell_ise.exe
      selection_cli:
        CommandLine|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the account was working
    only on this host or moving between systems. An account that created a delegated service account on one host
    while also running directory reconnaissance, credential tooling, or remote execution elsewhere in the same
    window is operating beyond a single administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the environment returns agent telemetry from
    every host and answers nothing. The query mirrors the rule's selection structure scoped to the alerting parent
    process, fleet-wide, in the alert window. Several hosts creating delegated service accounts under the same
    parent in the same window points to scheduled or pushed provisioning; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - powershell_ise.exe
      selection_cli:
        CommandLine|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    dMSA creation rather than generic PowerShell usage. A steady set of management hosts firing the pattern points
    to a provisioning workflow; one host, or a small unrelated set appearing this week for the first time, points
    to manual operator activity. Use the host distribution and parent consistency to calibrate how far the
    investigation needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      - OriginalFileName:
        - powershell.exe
        - pwsh.dll
        - powershell_ise.exe
      selection_cli:
        CommandLine|contains|all:
        - New-ADServiceAccount
        - -CreateDelegatedServiceAccount
        - -path
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Delegation abuse is normally reached from somewhere — a credential access step, directory or OU permission
    enumeration, or a defense tampering step frequently precedes an account being created in an unexpected OU.
    Earlier detections on the same host help reconstruct how the operator arrived at rights over the target OU
    and what else the session touched.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
