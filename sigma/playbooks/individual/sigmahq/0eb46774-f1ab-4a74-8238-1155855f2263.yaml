name: Disable Windows Defender Functionalities Via Registry Keys
id: 83c02fe4-db94-4221-913e-0706ed7bc280
description: |
  Detects registry writes under the Windows Defender policy keys (HKLM\SOFTWARE\...\Windows Defender and Windows Defender Security Center) that turn off a Defender protection. The rule fires when a value under those keys is set to disable a function, EITHER a Disable... value (such as DisableRealtimeMonitoring, DisableAntiSpyware, DisableBehaviorMonitoring) written as DWORD 0x00000001, OR a protective feature value (such as TamperProtection, PUAProtection, MpEnablePus, EnableControlledFolderAccess) written as DWORD 0x00000000. Legitimately, administrators and some third-party antivirus that manages Defender's enabled state adjust these keys; maliciously, ransomware and hands-on intruders disable Defender before deploying payloads or dumping credentials. The investigation should determine which protection was disabled, which process wrote the value, whether the setting still holds, and what ran on the host afterward.
type: detection
detection_id: 0eb46774-f1ab-4a74-8238-1155855f2263
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting registry write disable a Windows Defender protection by setting a Disable value to 1 or a protective feature to 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path (TargetObject) and value data (Details). The rule fires on either branch of a disjunction: a Disable... value (DisableRealtimeMonitoring, DisableAntiSpyware, DisableBehaviorMonitoring, and similar) written as DWORD 0x00000001, OR a protective feature value (TamperProtection, PUAProtection, MpEnablePus, EnableControlledFolderAccess, and similar) written as DWORD 0x00000000. Note which value fired, because that determines which protection is now off and which downstream checks carry weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows Defender policy keys?
  context: >-
    Administrators, imaging pipelines, and some third-party antivirus products legitimately adjust Defender policy values, and those benign writes are the rule's main false positives. Knowing whether the user role and host function are consistent with security-policy changes is often the fastest way to separate a routine configuration change from tampering. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Defender protection does this value control, and does the written DWORD turn it off?
  context: >-
    Decode the Details field against the value name in TargetObject. A DWORD 0x00000001 written to a Disable... value (DisableRealtimeMonitoring, DisableIOAVProtection, DisableOnAccessProtection, and similar) switches that protection off. A DWORD 0x00000000 written to a protective feature (TamperProtection, PUAProtection, MpEnablePus, EnableControlledFolderAccess) also disables it. The toggle direction is inverted between the two value families, so read the value name and the DWORD together to state exactly which protection is now down.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which Defender policy key was modified, and is this a recognized evasion location?
  context: >-
    The key path reveals intent. Values under HKLM\SOFTWARE\Policies\Microsoft\Windows Defender and the Windows Defender Security Center policy hive are the canonical location for turning off real-time protection, behavior monitoring, tamper protection, and controlled folder access. Confirm the modified value sits under one of those policy paths rather than a benign product-managed subkey, and capture the writing process for the follow-on questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command did the writing process run to modify the Defender policy value?
  context: >-
    Pivoting to the writing process shows how the value was set. A single reg.exe add of one value looks different from a scripted batch that clears and rewrites many Defender values in sequence, or a powershell Set-MpPreference call. The command line often reveals whether this was a one-off administrative change or part of a broader disable-Defender routine. Some writes come from direct registry API calls with no reg.exe, in which case the command line shows the script host or implant that performed the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the disabled setting still hold, or was the value re-modified afterward?
  context: >-
    Tampering may be transient (disabled for one action, then reverted) or persistent (left disabled to keep the host exposed). This telemetry emits no registry key or value deletion events, so cleanup of the value is not directly observable; judge persistence from the value's re-modification history. A value that stays at the disabled setting means the host remains unprotected and the control should be restored.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what launched it?
  context: >-
    Registry writes to Defender policy keys come from reg.exe, powershell.exe, or direct API callers. A parent chain through Office applications, script hosts (wscript.exe, mshta.exe), or a remote-execution service points to intrusion, while a chain through services.exe, trustedinstaller.exe, or a management agent points to legitimate configuration. Parent fields can be sparse on registry events, so pivot the writing process by its ProcessGuid to recover the parent lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is the disabled Defender protection now restored, or is the host still exposed?
  context: >-
    Checking the current status of the targeted control reveals whether the host remains vulnerable. If real-time monitoring, tamper protection, or the other affected function is still off, the control should be restored before further investigation. Current status is best confirmed by direct host inspection or the endpoint management console rather than from the alert alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the Defender protection was disabled?
  context: >-
    Attackers disable defenses so that follow-on actions execute without being blocked or logged. Examining process activity in the window immediately after the write reveals what the tampering was meant to enable, such as payload execution, credential access, or reconnaissance. A burst of new processes right after the value change is what the analyst is scanning for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions taken on this host?
  context: >-
    Operators who disable one Defender function often disable several controls at once, clearing event logs, deleting shadow copies, stopping security services, or changing firewall rules. This registry alert would not surface those command-line tampering actions. Finding them from the same user or writing process indicates multiple controls were targeted in one operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry keys were modified on this host in the same window?
  context: >-
    Clusters of registry changes from the same writer within a short window reveal the full scope of the operation. Additional Defender values, service Start values set to disabled, Run/RunOnce entries, or Winlogon changes landing alongside this write indicate a hands-on session or an installer-style implant rather than an isolated policy edit. The triggering key will appear in the results; the signal is what else was modified.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Defender policy value been changed before on this host?
  context: >-
    Security policy keys should rarely change on a stable host. Zero or very low prior history makes this write stand out as first-time tampering, whereas a value that changes on a recurring cadence is more consistent with a management tool or scripted configuration. Compare the historical Details values and writing processes to calibrate severity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Defender value disabled on other hosts in the environment?
  context: >-
    The same modification across many hosts may indicate a Group Policy push, widespread malware, or lateral movement, while a single affected host suggests targeted tampering. Compare the Details values across hosts: a uniform disabled value pushed fleet-wide reads differently from ad hoc writes on one machine.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this write?
  context: >-
    Defense tampering rarely happens in isolation. Earlier detections on the same host, such as initial-access, reconnaissance, or credential-access alerts, may reveal the stages that preceded the Defender disable and help reconstruct the timeline of the intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host?
  context: >-
    After weakening Defender, actors commonly establish persistence using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence installations in the same timeframe as the tampering indicate intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg. File event monitoring captures these drops even when the actor avoids standard persistence tools.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
