name: Attempts of Kerberos Coercion Via DNS SPN Spoofing
id: 6c00d0d9-57cc-48b9-8d7d-9aa69773310d
description: |
  Detects a command line containing the base64 signature of a marshaled CREDENTIAL_TARGET_INFORMATION
  structure (the "UWhRCA...BAAAA" pattern), an indicator of a Kerberos coercion attempt in which an
  adversary manipulates name resolution to spoof a Service Principal Name and redirect authentication
  to an attacker-controlled host. The rule fires when a process command line contains both the
  "UWhRCA" and "BAAAA" fragments. Legitimate appearances are rare, so the investigation should confirm
  the full decoded command, identify the spoofed SPN or DNS record being added or queried, and
  determine whether the coerced authentication produced follow-on logons or lateral movement.
type: detection
detection_id: 0ed99dda-6a35-11ef-8c99-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line contain both the UWhRCA and BAAAA fragments of the marshaled credential-target signature?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line
    against the rule's detection criteria. The rule fires only when both fragments are present together, so verify both
    appear in the same command line and read the surrounding arguments to see what host or DNS record is referenced.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to manage DNS records or query Service Principal Names from the command line?
  context: Legitimate administrative activity can trigger many detections. Adding or querying DNS records tied to service
    hostnames is normally done by directory or DNS administrators or by automation, not by ordinary user accounts or
    workstations. Knowing whether the user role and host function fit this operation is often the fastest path to
    distinguishing a true positive from routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What SPN or DNS record does the decoded command target, and is it adding a spoofed name or querying for one?
  context: The marshaled CREDENTIAL_TARGET_INFORMATION blob encodes the target the coerced authentication will be bound to.
    Decode the full command line to identify the Service Principal Name or hostname being added to DNS or checked via name
    resolution, and determine whether the action writes a new record (staging the coercion) or merely reads one
    (reconnaissance). The targeted name reveals which service the attacker intends authentication to be relayed toward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command and is that parent chain expected?
  context: The parent process reveals how the command was invoked. A name-resolution or DNS manipulation command launched
    from an interactive admin shell looks different from one spawned by an Office application, a script host, or an
    unexpected service. Unusual parents such as mshta.exe, wscript.exe, or a document handler point toward exploitation
    rather than deliberate administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity,
    and does the current alert fit that pattern?
  context: Even rare signatures can have a benign source such as a security tool or a sanctioned test. The query mirrors
    the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - UWhRCA
        - BAAAA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern. Many hosts firing the same signature points to scripted deployment or a coordinated coercion
    attempt across the environment; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - UWhRCA
        - BAAAA
      condition: selection
    fields:
    - host.name
- question: Do Windows security events show new service creation or multicast name-resolution re-enabling on this host
    around the alert?
  context: Adversary-in-the-middle credential interception is frequently set up by creating a helper service or by
    re-enabling LLMNR and NBT-NS so the host answers spoofed name-resolution requests. The Windows security log records
    service installation as event 4697; correlating it with this command-line alert can reveal the responder or relay
    component staged alongside the DNS manipulation. If service-creation auditing is not enabled in this environment,
    treat zero results as a visibility gap rather than evidence nothing was installed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts or service identities may be exposed by this coercion, and do any have elevated privileges?
  context: The severity of a coercion attempt depends on the privilege of the identity that would be relayed. Coercing
    authentication from a domain controller, a server with a privileged machine account, or a service identity with broad
    access requires escalation; a standard workstation identity may only need monitoring. Cross-reference the host's
    machine account and the logged-on user against directory group memberships to gauge impact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - UWhRCA
        - BAAAA
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple endpoints. If the
    same account drove name-resolution manipulation, responder setup, or authentication attempts on several hosts in this
    window, the scope of the operation is broader than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity surrounding the alert reveals what led to this event and
    what followed, and whether the coercion command sits inside a larger sequence of reconnaissance, name-resolution
    tampering, or relay setup. Novel parent-child process pairs stand out against the repetitive agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may reveal the stages that preceded this coercion attempt. Reconnaissance,
    credential access, or defense tampering ahead of this event helps reconstruct the timeline and shows whether the
    coercion is an opening move or a later step in an established intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or administrator recall performing this DNS or name-resolution action?
  context: Direct confirmation from the human behind the account is often the fastest path to determining legitimacy. If
    no one recalls staging this name record or running this command, the account may be compromised or the activity may be
    automated. If someone does recall it, capture why it was done and against which service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate DNS and directory changes typically occur during business hours or scheduled maintenance windows.
    Name-record manipulation at an odd hour, outside any maintenance window, or on a host whose local time makes the action
    unusual is more suspicious than the same activity during a documented change window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
