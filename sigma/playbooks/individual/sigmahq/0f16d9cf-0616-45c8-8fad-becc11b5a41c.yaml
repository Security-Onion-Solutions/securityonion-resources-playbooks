name: Renamed AutoHotkey.EXE Execution
id: 64b0cf87-dda6-4336-a9f7-c19e6fbbfe88
description: |
  Detects a process whose embedded PE metadata identifies it as AutoHotkey -- Product
  or Description contains AutoHotkey, or OriginalFileName is AutoHotkey.exe or AutoHotkey.rc --
  while the on-disk image name is NOT one of the official AutoHotkey filenames and does not
  contain AutoHotkey in its path. The rule fires when the metadata selection matches AND the
  legitimate-filename filter does NOT match, which means the binary is an AutoHotkey interpreter
  that has been renamed to disguise its identity. AutoHotkey is a legitimate scripting engine
  used for automation and accessibility, so a renamed copy can be benign packaging by an internal
  tool; it is also used to run keylogging and automation scripts as a renamed helper alongside a
  paired .ahk script. Determine the true identity of the binary, how it arrived, what script it
  ran, and what it did after launch.
type: detection
detection_id: 0f16d9cf-0616-45c8-8fad-becc11b5a41c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does this process carry AutoHotkey PE metadata while running under a non-AutoHotkey filename?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the OriginalFileName, Product, or Description metadata identifies the binary as AutoHotkey
    AND the on-disk image name is none of the official AutoHotkey filenames. Read the OriginalFileName,
    Description, and Product against the Image path on disk to confirm the rename mismatch is real
    and not a metadata quirk of a legitimately named copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Description
      - Product
- question: Is this user and host expected to run AutoHotkey-based automation?
  context: Legitimate administrative or developer activity can trigger this detection -- packaged
    automation, accessibility tooling, or an internally built helper may ship an AutoHotkey interpreter
    under a custom name. Knowing whether the user role and host function are consistent with running
    a scripting engine is often the fastest path to distinguishing routine tooling from a renamed
    keylogging or automation helper.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: When an AutoHotkey interpreter is renamed, the PE metadata (OriginalFileName, Product,
    Description) and code-signing details still reflect the original tool. Comparing the Image path
    (the name on disk) against OriginalFileName reveals the rename. The signing party and signature
    status indicate whether this is the official AutoHotkey-signed build, a third-party signed copy,
    or an unsigned or tampered binary. The file hash enables threat intelligence lookups to determine
    whether it matches a known AutoHotkey release, a known malicious sample, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What script and arguments did this renamed AutoHotkey interpreter run? Decode the full command line.
  context: AutoHotkey interprets a script file passed on its command line, so the operational
    behavior lives in the arguments -- typically the path to a .ahk script and any switches. Decode
    the full command line to identify the script path, any inline parameters, and the working
    directory. A paired script in a user-writable location alongside the renamed interpreter is the
    detail that distinguishes packaged automation from a dropped helper.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this renamed AutoHotkey binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously -- they were copied from another location,
    downloaded, or dropped by a parent process. Tracing the file creation event for the binary by
    its current name over a long window reveals the delivery mechanism: a download tool, a malware
    dropper, a manual copy via explorer or remote access, or an installer. A user-writable
    destination such as a Public, AppData, or Temp directory points to download or extraction
    rather than a managed install.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming an interpreter is to evade detection while still running its
    intended script. Examining the child processes and operations launched by the renamed binary
    reveals its actual objective -- a paired keylogging or automation script may itself spawn
    further processes or write capture files. The same renamed binary appearing on multiple hosts
    suggests deliberate distribution rather than an isolated install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this renamed interpreter and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate automation often has
    predictable parents such as explorer.exe for user launches or a task host for scheduled jobs.
    Unusual parents such as wscript.exe, mshta.exe, a scheduled-task host, or an Office application
    may indicate that the rename was launched by a macro, script, or persistence mechanism rather
    than by an interactive user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this execution, what happened after, and whether it is part of a
    larger sequence. Look for reconnaissance, scheduled-task creation, script-host execution, or
    archiving utilities that may accompany a renamed automation helper.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: AutoHotkey
      - Description|contains: AutoHotkey
      - OriginalFileName:
        - AutoHotkey.exe
        - AutoHotkey.rc
      filter:
      - Image|endswith:
        - \AutoHotkey.exe
        - \AutoHotkey32.exe
        - \AutoHotkey32_UIA.exe
        - \AutoHotkey64.exe
        - \AutoHotkey64_UIA.exe
        - \AutoHotkeyA32.exe
        - \AutoHotkeyA32_UIA.exe
        - \AutoHotkeyU32.exe
        - \AutoHotkeyU32_UIA.exe
        - \AutoHotkeyU64.exe
        - \AutoHotkeyU64_UIA.exe
      - Image|contains: \AutoHotkey
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: AutoHotkey
      - Description|contains: AutoHotkey
      - OriginalFileName:
        - AutoHotkey.exe
        - AutoHotkey.rc
      filter:
      - Image|endswith:
        - \AutoHotkey.exe
        - \AutoHotkey32.exe
        - \AutoHotkey32_UIA.exe
        - \AutoHotkey64.exe
        - \AutoHotkey64_UIA.exe
        - \AutoHotkeyA32.exe
        - \AutoHotkeyA32_UIA.exe
        - \AutoHotkeyU32.exe
        - \AutoHotkeyU32_UIA.exe
        - \AutoHotkeyU64.exe
        - \AutoHotkeyU64_UIA.exe
      - Image|contains: \AutoHotkey
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    across multiple endpoints. If the same user triggered similar activity on multiple hosts, the
    scope may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: AutoHotkey
      - Description|contains: AutoHotkey
      - OriginalFileName:
        - AutoHotkey.exe
        - AutoHotkey.rc
      filter:
      - Image|endswith:
        - \AutoHotkey.exe
        - \AutoHotkey32.exe
        - \AutoHotkey32_UIA.exe
        - \AutoHotkey64.exe
        - \AutoHotkey64_UIA.exe
        - \AutoHotkeyA32.exe
        - \AutoHotkeyA32_UIA.exe
        - \AutoHotkeyU32.exe
        - \AutoHotkeyU32_UIA.exe
        - \AutoHotkeyU64.exe
        - \AutoHotkeyU64_UIA.exe
      - Image|contains: \AutoHotkey
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run this binary?
  context: A process that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for this image on this host indicate a first-time
    or rare execution, consistent with a freshly dropped or copied helper rather than established
    tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimately packaged automation can be abused. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user distribution reflects
    how the rule's specific firing pattern -- AutoHotkey metadata without a legitimate AutoHotkey
    filename -- has historically run here. A new parent process, an unexpected user account, or a
    first-time appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: AutoHotkey
      - Description|contains: AutoHotkey
      - OriginalFileName:
        - AutoHotkey.exe
        - AutoHotkey.rc
      filter:
      - Image|endswith:
        - \AutoHotkey.exe
        - \AutoHotkey32.exe
        - \AutoHotkey32_UIA.exe
        - \AutoHotkey64.exe
        - \AutoHotkey64_UIA.exe
        - \AutoHotkeyA32.exe
        - \AutoHotkeyA32_UIA.exe
        - \AutoHotkeyU32.exe
        - \AutoHotkeyU32_UIA.exe
        - \AutoHotkeyU64.exe
        - \AutoHotkeyU64_UIA.exe
      - Image|contains: \AutoHotkey
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic AutoHotkey usage. Many hosts
    firing the same pattern points to scripted deployment or packaged tooling rolled out broadly;
    one host or a small unrelated set points to targeted or manual activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Product|contains: AutoHotkey
      - Description|contains: AutoHotkey
      - OriginalFileName:
        - AutoHotkey.exe
        - AutoHotkey.rc
      filter:
      - Image|endswith:
        - \AutoHotkey.exe
        - \AutoHotkey32.exe
        - \AutoHotkey32_UIA.exe
        - \AutoHotkey64.exe
        - \AutoHotkey64_UIA.exe
        - \AutoHotkeyA32.exe
        - \AutoHotkeyA32_UIA.exe
        - \AutoHotkeyU32.exe
        - \AutoHotkeyU32_UIA.exe
        - \AutoHotkeyU64.exe
        - \AutoHotkeyU64_UIA.exe
      - Image|contains: \AutoHotkey
      condition: selection and not filter
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, credential access, or persistence creation -- may reveal the stages
    that preceded this execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
