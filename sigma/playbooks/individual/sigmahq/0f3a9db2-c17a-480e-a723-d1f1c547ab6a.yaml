name: Potential Raspberry Robin Aclui Dll SideLoading
id: aa8eb39c-7b68-4f1e-81b6-00c4b8451fed
description: |
  Detects OleView.exe loading aclui.dll when the loaded module is not signed and OleView.exe is
  running outside its known install paths (Windows Kits, Microsoft SDKs, Windows Resource Kit).
  OleView.exe is a signed developer utility that is absent from default Windows installs and
  resolves aclui.dll by search order, so placing a malicious copy of the DLL beside the executable
  runs attacker code under a Microsoft-signed process — a side-loading pairing used by Raspberry
  Robin variants and other loaders. The investigation should establish how the executable/DLL pair
  arrived on the host, what the loaded DLL did after loading, and whether persistence or outbound
  command-and-control activity followed.
type: detection
detection_id: 0f3a9db2-c17a-480e-a723-d1f1c547ab6a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match the rule's criteria for a sideloaded aclui.dll?
  context: >-
    Confirm the alert is a true positive: the loaded module path (ImageLoaded) ends in aclui.dll,
    the loading process is OleView.exe running outside the Windows Kits, Microsoft SDKs, and
    Windows Resource Kit directories, and the module is not signed — the rule excludes loads from
    those known install paths and any load where the DLL carries a valid signature. The library
    load event carries the module's signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user or host expected to run OleView.exe at all?
  context: >-
    OleView.exe is a COM-browsing developer utility that ships with the Windows SDK and developer
    kits — it is not present on a default Windows install. On a developer workstation its presence
    may be routine (though the rule already excludes the SDK install paths and signed loads); on a
    non-developer host, the binary existing and running at all is itself the anomaly to explain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the sideloaded DLL and any files it wrote still on disk for analysis?
  context: >-
    The query lists file activity by the alerting process and its direct children — side-loading
    loaders commonly decrypt or write a companion payload file (often the DLL name with an extra
    extension) beside the executable. Also confirm manually whether the aclui.dll copy is still
    sitting next to OleView.exe: a surviving copy enables hash lookups, sandbox submission, and
    content review before remediation removes it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What modules did this OleView.exe process load, and which came from non-canonical or user-writable paths?
  context: >-
    The full module list tells the story of the load. The legitimate aclui.dll lives in
    C:\Windows\System32; a copy loaded from the process's own directory, Temp, AppData,
    ProgramData, or a removable drive is the search-order sideload this rule targets. Check the
    other modules too — the malicious DLL frequently loads additional stages, and an unsigned
    module in a directory where signed ones are expected corroborates the finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What are the signing status, hash, and threat-intel reputation of the loaded aclui.dll?
  context: >-
    The genuine aclui.dll is a Microsoft-signed Security Descriptor Editor library residing in
    System32; compare the loaded module's hash against the System32 copy on a known-good host.
    An unsigned module carrying a Microsoft system-DLL filename is masquerading, and a hash lookup
    against threat intelligence can tie the sample to a known loader family. SignatureStatus values
    of Unsigned, Expired, Distrusted, or Invalid all fail the rule's signed-load exclusion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line and working directory of the OleView.exe execution?
  context: >-
    The working directory usually reveals the staging folder — side-loading requires the
    executable and DLL to sit together, so CurrentDirectory frequently points at the directory the
    pair was dropped into (an extracted archive, a Temp path, a removable drive). OleView.exe run
    with no arguments from an unusual directory is consistent with it being launched purely as a
    signed loading vehicle rather than for COM inspection work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned OleView.exe, and is that parent chain expected?
  context: >-
    The parent process shows how the signed vehicle was launched. explorer.exe points to a user
    double-click (consistent with archive-lure or removable-media delivery); an archiver, browser,
    script host, or Office application as parent points to the delivery mechanism that staged the
    pair; a scripted or scheduled parent suggests automated deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - User
- question: What process wrote aclui.dll and the OleView.exe binary to the load location?
  context: >-
    A search-order sideload requires both files to be dropped together, so the file writes that
    staged them identify the delivery vector — an archive extraction, a browser or messaging-client
    download, a copy from removable media, or a remote file transfer. The interval between the file
    drop and the module load is also worth noting: a load seconds after the drop indicates an
    automated chain, while a long gap suggests staged tooling awaiting later use.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '\aclui.dll'
          - '\OleView.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did the OleView.exe process initiate outbound network connections after the DLL loaded?
  context: >-
    Sideloaded loader DLLs typically establish command-and-control shortly after loading — the
    code runs inside the signed OleView.exe process, so its egress traffic inherits that process
    identity. Raspberry Robin variants also proxy their traffic through separately spawned
    processes such as rundll32.exe or regsvr32.exe, so cross-check the egress of any children
    surfaced by the child-process question as well.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_binary:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
- question: What child processes did OleView.exe spawn after the load?
  context: >-
    OleView.exe has no legitimate reason to spawn children during normal COM browsing. Children of
    the process after a malicious load reveal the payload's next stage — command interpreters,
    script hosts, or system utilities repurposed as network proxies. Raspberry Robin variants have
    used rundll32.exe and regsvr32.exe children to relay their command-and-control traffic.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were registry keys that alter DLL resolution or establish persistence modified around the load?
  context: >-
    DLL-hijack tradecraft correlates module loads with registry changes: Run/RunOnce keys re-launch
    the staged pair at logon, Image File Execution Options and KnownDLLs entries redirect future
    library resolution, and Session Manager environment changes can alter search paths. A
    modification to any of these near the load extends a one-off sideload into durable execution
    flow control on the host.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\Image File Execution Options\'
          - '\KnownDLLs'
          - '\Session Manager\Environment'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens in isolation — the minutes around the load may show the delivery
    stage (archive extraction, removable-media browsing), reconnaissance, or additional tooling.
    The aggregation collapses repetitive agent noise into high-count rows so that novel
    parent/child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has aclui.dll been loaded on this host before, and by which processes?
  context: >-
    aclui.dll is loaded legitimately from System32 by system UI components that render security
    and permissions dialogs, so historical loads by system processes are expected. What matters is
    whether OleView.exe (or any other process from a non-system path) has loaded it before — a
    first-time pairing supports a fresh staging event, while a recurring one may indicate
    longer-standing tooling that needs its own timeline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired the rule's pattern, what programs and users normally drive it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host — the resulting
    program/user distribution reflects how this specific firing pattern (not generic OleView.exe
    usage) has historically occurred here. Any prior occurrences deserve scrutiny of their own;
    a deviation such as a new acting program or an unexpected user account marks the anomaly
    worth chasing first.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \OleView.exe
        ImageLoaded|endswith: \aclui.dll
      filter_main_legit_oleview_paths:
        Image|startswith:
        - C:\Program Files (x86)\Windows Kits\
        - C:\Program Files\Microsoft SDKs\
      filter_optional_known_oleview_paths:
        Image|contains: \Windows Resource Kit\
      filter_main_is_signed:
        Signed: 'true'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - Image
    - User
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — removable-media activity, downloader execution, defense
    tampering, reconnaissance — may reveal the delivery and staging steps that preceded the
    sideload and help reconstruct the timeline from initial access to the module load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the load?
  context: >-
    A sideload executes once; attackers commonly add separate persistence so the payload survives
    reboot — scheduled tasks, services, registry Run keys, or BITS jobs created near the load
    indicate deliberate stacking of mechanisms rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely — copying the staged pair or a
    launcher into a Startup folder re-runs the sideload at every logon without invoking schtasks,
    sc, or reg. File event monitoring captures these drops even when the operator avoids the
    standard persistence utilities.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic OleView.exe usage. Multiple
    hosts firing the same pattern points at scripted deployment or a spreading mechanism such as
    removable media moving between machines; a single host points at targeted or opportunistic
    activity on that machine alone.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \OleView.exe
        ImageLoaded|endswith: \aclui.dll
      filter_main_legit_oleview_paths:
        Image|startswith:
        - C:\Program Files (x86)\Windows Kits\
        - C:\Program Files\Microsoft SDKs\
      filter_optional_known_oleview_paths:
        Image|contains: \Windows Resource Kit\
      filter_main_is_signed:
        Signed: 'true'
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
