name: Potential DLL Injection Via AccCheckConsole
id: 3b995dd0-ff92-457c-bed6-5468a1d8776f
description: |
  Detects execution of AccCheckConsole.exe, a UI Accessibility Checker shipped with the Windows SDK, with command-line switches (-hwnd, -process, or -window) used to target an application window. The rule fires when the image (or its original filename) is AccCheckConsole.exe AND the command line contains one of those targeting switches. The tool accepts a user-supplied managed DLL holding a custom "verification routine," so an attacker can load arbitrary .NET code in the context of a signed Microsoft binary — a known execution and application-allowlist bypass path. Legitimate use is UI accessibility testing by developers or QA; the investigation should determine which DLL was passed, where it lives, and whether the parent chain and user fit expected development activity.
type: detection
detection_id: 0f6da907-5854-4be6-859a-e9958747b0aa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did AccCheckConsole.exe run with a window/process targeting switch (-hwnd, -process, or -window)?
  context: Confirm the alert is a true positive by reviewing the exact image, original filename, and command line. The rule fires when the binary is AccCheckConsole.exe AND the command line contains one of the targeting switches; verify both the binary identity and the switch are present, and note any trailing DLL path argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run UI accessibility testing tools?
  context: AccCheckConsole.exe is a developer/QA tool from the Windows SDK. Knowing whether the user role and host function involve UI or accessibility testing is often the fastest way to separate routine development activity from abuse of the binary as a DLL loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL path and target window/process did this AccCheckConsole invocation specify?
  context: The full command line reveals which managed DLL was loaded and which window or process it targeted. The trailing positional argument is typically the DLL path; check whether it points to a user-writable or temporary location (Downloads, AppData, Temp, ProgramData) versus an expected build output directory. The -window value can be any active window title and carries little signal on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned AccCheckConsole.exe and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Developer-driven testing typically launches from explorer.exe, a shell, or an IDE/build process. Parents such as office applications, mshta.exe, wscript.exe, or a browser/download helper point to execution as a DLL-loading proxy rather than legitimate accessibility testing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run AccCheckConsole.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts on this host indicate first-time or rare execution of the accessibility checker, which is unusual outside developer or QA endpoints.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even legitimate developer tools can be abused. The query mirrors the rule's selection (AccCheckConsole.exe with a targeting switch) scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or a first-time appearance of the pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AccCheckConsole.exe
      - OriginalFileName: AccCheckConsole.exe
      selection_cli:
        CommandLine|contains:
        - ' -hwnd'
        - ' -process '
        - ' -window '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did AccCheckConsole.exe spawn afterward?
  context: The processes spawned after the tool runs reveal the actual impact of the loaded DLL. A DLL used for accessibility testing has no need to spawn shells or scripting hosts; children such as cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or network utilities point to post-load code execution staged through the signed binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to a build farm, test automation, or pushed tooling; a single host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AccCheckConsole.exe
      - OriginalFileName: AccCheckConsole.exe
      selection_cli:
        CommandLine|contains:
        - ' -hwnd'
        - ' -process '
        - ' -window '
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AccCheckConsole.exe
      - OriginalFileName: AccCheckConsole.exe
      selection_cli:
        CommandLine|contains:
        - ' -hwnd'
        - ' -process '
        - ' -window '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AccCheckConsole.exe
      - OriginalFileName: AccCheckConsole.exe
      selection_cli:
        CommandLine|contains:
        - ' -hwnd'
        - ' -process '
        - ' -window '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar tool execution on other hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \AccCheckConsole.exe
      - OriginalFileName: AccCheckConsole.exe
      selection_cli:
        CommandLine|contains:
        - ' -hwnd'
        - ' -process '
        - ' -window '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event and what happened after. Look for reconnaissance, privilege escalation, persistence, or staging of the DLL that AccCheckConsole.exe loaded.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded this execution and help reconstruct the timeline. Use of a signed binary to load a DLL is often a mid-chain action rather than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
