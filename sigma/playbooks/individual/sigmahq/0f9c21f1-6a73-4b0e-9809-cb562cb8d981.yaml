name: Potential Privilege Escalation via Service Permissions Weakness
id: 81a14c03-e28a-43af-adae-2b95b1925185
description: |
  Detects a Medium-integrity process modifying service configuration values under HKLM\SYSTEM\CurrentControlSet\Services
  in the registry, specifically the ImagePath, FailureCommand, or ServiceDll values, via a command line that
  references ControlSet and services together with one of those value names. The rule fires only when ALL of these
  conditions hold at once: the process runs at Medium integrity, the command line contains both ControlSet and
  services, and the command line contains \ImagePath, \FailureCommand, or \ServiceDll. A standard user who can write
  to a service's registry key can repoint that service to an attacker-controlled binary or DLL; when the service
  next restarts under the SYSTEM account, the substituted payload runs with full privileges. Investigation should
  confirm which service key and value were changed, what binary or DLL the new value points to, whether the writing
  user is authorized to manage that service, and whether the service subsequently restarted and executed the new code.
type: detection
detection_id: 0f9c21f1-6a73-4b0e-9809-cb562cb8d981
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show a Medium-integrity process writing ImagePath, FailureCommand, or ServiceDll
    under a CurrentControlSet service key?
  context: Before investing investigation time, confirm the alert is a true positive. Verify that the triggering process
    ran at Medium integrity and that its command line references ControlSet and services together with one of the
    service value names ImagePath, FailureCommand, or ServiceDll. All of these must be present together for the rule
    to fire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - IntegrityLevel
- question: Is this user and host expected to modify service configuration in the registry?
  context: Service registry keys under CurrentControlSet are normally managed by administrators, deployment tooling, or
    the service control manager, not by interactive Medium-integrity users. Knowing whether the account and host
    function are consistent with service management is often the fastest path to distinguishing authorized maintenance
    from a privilege-escalation attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which service key and value were modified, and what binary or DLL does the new value point to?
  context: The specific service key under HKLM\SYSTEM\CurrentControlSet\Services and the value written determine intent.
    ImagePath repoints the service executable, ServiceDll repoints the DLL loaded by a svchost-hosted service, and
    FailureCommand runs on service failure. Read the registry path and the data written to identify which service was
    targeted and what code it now references, then compare that path against the known-good service binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did the targeted service change its configuration or restart under a privileged account after the registry
    modification?
  context: A registry repoint only escalates privileges when the service restarts and the service control manager
    launches the substituted binary or DLL under SYSTEM. Service control manager events record start-type and binary
    path changes and service state transitions, so a configuration-change or start event for the same service shortly
    after the registry write confirms the modification took effect and the new code executed with elevated rights.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      service: system
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Provider_Name: Service Control Manager
      condition: selection
    fields:
      - EventID
      - ServiceName
      - ImagePath
- question: What process spawned the tool that made this registry change, and is that parent chain expected?
  context: The parent process reveals how the registry modification was invoked. Service management driven by deployment
    tooling or the service control manager has predictable parents; a registry write originating from an interactive
    shell, a script host, or an Office application may indicate that a foothold process is staging privilege escalation
    through a writable service key.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this service-registry-write pattern, what parents and users normally
    drive it, and does the current alert fit that pattern?
  context: Even routine deployment workflows can write service registry values. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how this specific Medium-integrity
    service-modification pattern has historically run here. A new parent process, an unexpected account, or an unusual
    command-line structure against this baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - services
        CommandLine|contains:
        - \ImagePath
        - \FailureCommand
        - \ServiceDll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this service-registry-write pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    Medium-integrity service-modification pattern rather than generic tool usage. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - services
        CommandLine|contains:
        - \ImagePath
        - \FailureCommand
        - \ServiceDll
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - services
        CommandLine|contains:
        - \ImagePath
        - \FailureCommand
        - \ServiceDll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - services
        CommandLine|contains:
        - \ImagePath
        - \FailureCommand
        - \ServiceDll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same account drove service-registry changes or other administrative activity on several hosts in
    a short window, the scope of the privilege-escalation attempt may be broader than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        IntegrityLevel:
        - Medium
        - S-1-16-8192
        CommandLine|contains|all:
        - ControlSet
        - services
        CommandLine|contains:
        - \ImagePath
        - \FailureCommand
        - \ServiceDll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the service
    modification and what followed it. Look for reconnaissance that enumerated writable service keys, credential
    access, or additional persistence and privilege-escalation steps that place this event in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may reveal the stages that preceded this event. Service-permission abuse
    is typically a late step that follows reconnaissance to locate a writable service key; defense tampering or
    credential access in the preceding hours helps reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other registry modifications made on this host in the same session?
  context: An actor who repoints one service key often makes related registry changes, such as altering several service
    entries, adjusting service start types, or disabling security tooling. Finding clusters of registry writes from the
    same host within a short window reveals the full scope of the configuration changes and whether multiple objectives
    were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Is the binary or DLL referenced by the modified service value present on disk, and where does it live?
  context: A service repoint is only effective if the executable or DLL written into ImagePath, FailureCommand, or
    ServiceDll exists at that path. If the new value points to a user-writable location such as a profile or temp
    directory, the file's presence and hash determine whether the substituted payload is staged and what would run when
    the service restarts under SYSTEM.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did a service process load a DLL from an unusual or user-writable path on this host after the registry
    change?
  context: When ServiceDll is repointed, the targeted svchost-hosted service loads the substituted library at its next
    start, executing the new code under a privileged account. A module load from a profile, temp, or other
    non-standard directory into a service host process shortly after the registry write confirms the DLL substitution
    took effect. Loads from standard system directories are expected baseline.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\svchost.exe'
          - '\services.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
- question: Were other process-based persistence mechanisms installed on this host?
  context: A repointed service is itself a persistence and escalation foothold, and actors rarely rely on a single
    mechanism. Backup mechanisms commonly appear as scheduled tasks, additional services, registry Run keys, BITS jobs,
    or WMI subscriptions. Several persistence installations in the same timeframe indicate intentional stacking rather
    than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
