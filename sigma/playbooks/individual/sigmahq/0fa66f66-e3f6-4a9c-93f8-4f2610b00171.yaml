name: Potential DLL Sideloading Using Coregen.exe
id: afe96f81-faaa-488d-8acd-280f13334a4b
description: |
  Detects the Microsoft-signed CoreCLR Native Image Generator (coregen.exe, bundled with Microsoft Silverlight)
  loading a DLL from a path outside its expected Silverlight and system directories. Because coregen.exe is
  Microsoft-signed, loading an attacker-supplied module through it executes code under a trusted process and can
  bypass allow-listing. The alert fires when coregen.exe loads a module AND that module is not under the known
  Silverlight or System32/SysWOW64 paths; investigate which module was loaded, where it came from, its signing
  status, and whether coregen.exe was launched with an arbitrary-path load switch.
type: detection
detection_id: 0fa66f66-e3f6-4a9c-93f8-4f2610b00171
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature
    status, and that coregen.exe is the loading process, against the rule's criteria. The rule fires when coregen.exe
    loads a module whose path is not under the Microsoft Silverlight, System32, or SysWOW64 directories. A module
    under those expected paths is routine; one from a user-writable or unexpected location is the anomaly. DLL loads
    carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run coregen.exe and load .NET runtime modules?
  context: The CoreCLR image generator ships with Microsoft Silverlight and is rarely run interactively on modern
    endpoints. Knowing whether this host has a legitimate reason to run coregen.exe, and whether the acting user
    is associated with development or Silverlight tooling, is often the fastest way to separate a routine load from
    abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did coregen.exe load, and are any from non-canonical paths, unsigned, or from user-writable
    directories?
  context: The set of modules coregen.exe loads reveals the operation. A load of coreclr.dll or another module from
    outside the Silverlight platform directory — from a working directory, %TEMP%, AppData, ProgramData, or Public —
    is a strong side-loading signal. Watch for a system-style module name (such as coreclr.dll) loaded from a
    non-system path, which indicates search-order hijacking, and for unsigned modules where signed ones are expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What command line launched coregen.exe, and did it use an arbitrary-path load switch?
  context: The abuse pattern invokes coregen.exe with a load switch (/L, -l, or -L) plus a dummy assembly name to
    load a DLL from an operator-controlled path; a bare dummy assembly name instead causes coreclr.dll to load from
    coregen.exe's own directory. Decode the command line for that switch, the target module path, and the assembly
    name, and note the current working directory the process ran from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: For each module loaded from an unexpected path, what is its signing status, hash, and reputation?
  context: Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A genuinely
    Microsoft-signed module loaded from an unexpected location may still be legitimate staging, but an unsigned
    module — or one carrying a Microsoft-style filename with no valid signature — is a strong masquerading indicator.
    Hash lookups against threat intelligence surface known loaders. Signature statuses to watch are Unsigned,
    Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned coregen.exe and is that parent chain expected?
  context: The parent process reveals how coregen.exe was invoked. A legitimate run is typically driven by an
    installer or a Silverlight component; parents such as script hosts, Office applications, or an interactive shell
    in a user directory point to operator-driven proxy execution rather than routine tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did coregen.exe initiate outbound network connections around the time of the module load?
  context: Proxy-execution chains frequently retrieve a second-stage payload or beacon after the sideloaded module
    runs inside the trusted process. Outbound connections from coregen.exe — a binary that has no routine reason to
    talk to the network — are a strong follow-on signal. Compare destinations against known enterprise services;
    connections to unfamiliar external addresses warrant escalation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What child processes did coregen.exe spawn afterward?
  context: The processes coregen.exe spawns reveal its actual impact. A legitimate image-generation run has no child
    processes of interest; a sideloaded payload often launches cmd.exe, powershell.exe, or other post-exploitation
    tooling from within the trusted parent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this specific module been loaded on this host before, and under what processes?
  context: A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same module
    path has been loaded by coregen.exe or another process repeatedly over the past 90 days, this load is likely
    routine; if this is the first occurrence, or the module has only ever been loaded by unrelated processes, the
    current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run coregen.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very
    low historical counts for coregen.exe over the past 90 days indicate first-time or rare execution, which raises
    the weight of the current load; a steady history points to an installed Silverlight component.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what loading processes and users normally drive
    it, and does the current alert fit?
  context: Even trusted binaries can be abused. This query mirrors the rule's selection structure scoped to this host,
    so the resulting distribution reflects how the rule's specific firing pattern — coregen.exe loading a module
    outside the expected Silverlight and system paths — has historically run here. A new loading context, an
    unexpected user account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \coregen.exe
      filter_main_legit_paths:
        ImageLoaded|startswith:
        - C:\Program Files (x86)\Microsoft Silverlight\
        - C:\Program Files\Microsoft Silverlight\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to the coregen.exe load, what followed, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, or persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of the same firing pattern rather than generic coregen.exe usage. Many hosts loading a module outside the
    expected paths points to scripted deployment or vendor tooling; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \coregen.exe
      filter_main_legit_paths:
        ImageLoaded|startswith:
        - C:\Program Files (x86)\Microsoft Silverlight\
        - C:\Program Files\Microsoft Silverlight\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the stages that preceded the coregen.exe load and help
    reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
