name: Potential Exploitation of CrushFTP RCE Vulnerability (CVE-2025-54309)
id: 96697482-821c-4508-a04a-a99267166853
description: |
  Detects crushftp.exe spawning a child process that matches one of three branches: EITHER a PowerShell
  process (powershell.exe, powershell_ise.exe, pwsh.exe) whose command line carries IEX, enc, Hidden and
  bypass together, OR a cmd.exe whose command line carries one of /c powershell, whoami, net.exe or net1.exe,
  OR one of bitsadmin.exe, certutil.exe, mshta.exe, cscript.exe or wscript.exe on binary name alone. A
  file-transfer server process has no routine reason to launch a command interpreter or a script or transfer
  utility; when it does, the usual cause is that a crafted request reached the application and drove
  server-side command execution, which is the post-exploitation stage of CVE-2025-54309 and of file-transfer
  server exploitation generally. The investigation should establish which branch fired, decode what the child
  actually executed, determine whether the service reached out to an external host afterwards, and check the
  application's version against the patched releases.
type: detection
detection_id: 0fdc7c7f-c690-4217-9ae3-31f5156eed72
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did crushftp.exe spawn either a PowerShell process carrying IEX, enc, Hidden and bypass together,
    a cmd.exe carrying a discovery token, or one of the listed script or transfer binaries?
  context: >-
    The rule fires only when the parent path ends in \crushftp.exe AND at least one of three child branches
    matches, so confirm the parent and then record which branch fired. The PowerShell branch needs IEX, enc,
    Hidden and bypass all present in one command line; the cmd.exe branch needs one of /c powershell, whoami,
    net.exe or net1.exe; the third branch matches bitsadmin.exe, certutil.exe, mshta.exe, cscript.exe or
    wscript.exe on name alone and therefore carries no command-line evidence by itself, which makes the
    command-decoding and egress questions load-bearing for that branch.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this host expected to run a file-transfer server, and is the account behind this execution
    expected to launch command interpreters from it?
  context: >-
    File-transfer servers normally run as a service account with a narrow, repetitive process tree. An
    interpreter launched under that account is either an administrator working through the application, a
    vendor or integration script the server invokes by design, or command execution driven from a request.
    The account identity and the host's role narrow which of those is plausible before deeper analysis.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What request to the file-transfer application preceded this execution?
  context: >-
    Exploitation of a file-transfer server begins with a crafted HTTP(S) request to an administrative or
    function endpoint, which the application then turns into server-side command execution. That request is
    not visible in process telemetry — the parent's own command line only identifies the service instance.
    Reconstruct it from the application's request log for the minutes before the spawn, looking for
    unauthenticated calls to administrative function endpoints, unexpected header use, and the source address
    that issued them.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the CrushFTP installation on this host patched against CVE-2025-54309?
  context: >-
    CVE-2025-54309 is an authentication bypass reachable over HTTP(S) that yields administrative control and
    server-side command execution; it affects version 10 before 10.8.5 and version 11 before 11.3.4_23, and
    is reachable when the DMZ proxy feature is disabled. An unpatched version confirms the execution path was
    available and identifies every other server in the estate running the same build. A patched version moves
    the investigation toward an authenticated administrator action or an unknown execution path.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What other child processes did this same crushftp.exe instance spawn around the alert?
  context: >-
    Server-side command execution rarely stops at one process. The same service instance commonly spawns a
    short sequence — an interpreter, then discovery commands such as whoami or net, then a transfer utility
    to pull the next stage. Listing every child of this exact parent instance in the surrounding window shows
    whether the alert is one step of such a sequence or an isolated event.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this same detection fire on other file-transfer servers in the estate?
  context: >-
    Internet-exposed file-transfer servers are located by scanning and probed in bulk, so the same execution
    pattern reaching several servers points at opportunistic exploitation of a shared version rather than a
    single administrator action. Each additional host returned here is a server that needs the same version
    and request-log review.
  range: -24h
  answer_sources:
  - alert
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the spawned command line actually do, and did other command lines carrying the rule's
    tokens run on this host in the same window?
  context: >-
    Read every argument on the alerting command line and resolve it to an operation — the URL an IEX cradle
    fetches, the file certutil or bitsadmin transfers, the script mshta, cscript or wscript executes, the
    account or share a net command touches. Scoping by the rule's own command-line tokens rather than by
    binary name keeps common interpreters from drowning the result and shows whether the execution arrived as
    one command or as a sequence of related invocations. CurrentDirectory identifies the working directory
    the server handed the child, which is often the application's own installation path.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cli:
        CommandLine|contains:
          - 'IEX'
          - 'enc'
          - 'Hidden'
          - 'bypass'
          - '/c powershell'
          - 'whoami'
          - 'net.exe'
          - 'net1.exe'
      condition: selection and selection_cli
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the payload passed as an encoded blob or as an IEX download cradle, and what does it resolve
    to?
  context: >-
    The PowerShell branch of this rule requires IEX, enc, Hidden and bypass in the same command line, which
    is the download-cradle form — a base64 argument to -EncodedCommand, or an inline expression that fetches
    a remote script and executes it in memory with the window hidden and execution policy bypassed. Decode
    the base64 to UTF-16LE, then read the resulting script for the source URL, the local path anything is
    written to, and any in-memory assembly load, which leaves no file behind.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did script block logging capture the deobfuscated script that ran on this host?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, after any encoding or concatenation
    the command line used, so it is the ground truth for what a hidden, encoded cradle executed. If PowerShell
    operational logs are not ingested in this environment, treat an empty result as a visibility gap rather
    than as evidence nothing ran, and fall back to decoding the alerting command line directly.
  range: +/-5m
  answer_sources:
  - powershell_script_block
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls weakened on this host in the hour before the spawn?
  context: >-
    Execution-policy bypass, AMSI patching, antimalware exclusions and version-2 downgrade are the controls
    an operator removes before running a payload, and they frequently arrive through the same execution path
    moments earlier. Hits here place the alerting command inside a sequence; an empty result means the
    operator relied only on the flags already present on the alerting command line.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Which scripting and .NET runtime modules were loaded on this host around the alert, and by which
    processes?
  context: >-
    PowerShell also runs without powershell.exe — any process that loads System.Management.Automation.dll
    together with the CLR hosts the same engine while presenting a command line this rule never sees. Loads
    of the VBScript, JScript or MSHTML engines identify the script host branch, and an amsi.dll load next to
    a rare or unsigned module points at the interpreter being prepared rather than merely used. Check the
    loading process, the module signer, and whether the assembly is one this host loads routinely.
  range: +/-15m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\clr.dll'
          - '\coreclr.dll'
          - '\mscoree.dll'
          - '\amsi.dll'
          - '\vbscript.dll'
          - '\jscript.dll'
          - '\mshtml.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the spawned interpreters or transfer utilities open outbound connections after the server
    launched them?
  context: >-
    Exploitation of an internet-facing application typically ends with the executed command reaching back out
    — to fetch the next stage, or to open a channel the operator drives. A fifteen-minute window around the
    spawn is the useful correlation horizon between the request, the child process and the callback.
    Destinations outside the addresses the server normally talks to, and ports outside its published service
    ports, are the rows to pursue; a transfer utility connecting anywhere at all is worth resolving to the
    file it moved.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tools:
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\mshta.exe'
          - '\cscript.exe'
          - '\wscript.exe'
      condition: selection and selection_tools
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was an elevated logon or a special-privilege assignment recorded on this host around the spawn?
  context: >-
    Command execution driven through a service inherits that service's token, so the next step is often to
    obtain a more privileged context — a new logon session, or an account being granted sensitive privileges.
    Event 4672 records special privileges assigned at logon and 4624 records the session itself; sessions
    appearing in the hour before or around the spawn, for accounts that do not normally log on to a
    file-transfer server, mark where the execution path gained rights beyond the service account.
  range: -1h
  answer_sources:
  - active_directory
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4672
          - 4624
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - LogonType
- always_include: true
  question: Has this account previously produced this parent-and-child combination, and does that history fit
    the account's role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this specific firing pattern rather than generic use of the binaries, aggregated by
    host. An account that has produced it regularly points at an integration or an administrator who works
    through the application; a first occurrence for an account that only ever runs the service points the
    other way. Weigh the count against what the account is provisioned to do.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftp.exe
      selection_child_powershell:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - IEX
        - enc
        - Hidden
        - bypass
      selection_child_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - /c powershell
        - whoami
        - net.exe
        - net1.exe
      selection_child_others:
        Image|endswith:
        - \bitsadmin.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has crushftp.exe historically driven this same execution pattern on this host or elsewhere, or is
    this new for the service?
  context: >-
    A file-transfer service usually runs under a service principal, and under a service principal the user
    identity attributes nothing — the launch mechanism does. The query mirrors the rule's selection structure
    scoped to the alerting parent process, so the result is the 90-day history of this server driving this
    specific pattern rather than generic co-occurrence of the binaries. A parent that already accounts for
    thousands of prior events is an integration or a vendor job; a parent that has never driven it before is
    the deviation to chase.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftp.exe
      selection_child_powershell:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - IEX
        - enc
        - Hidden
        - bypass
      selection_child_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - /c powershell
        - whoami
        - net.exe
        - net1.exe
      selection_child_others:
        Image|endswith:
        - \bitsadmin.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    If the execution ran under a named account rather than the service principal, that account's activity on
    other hosts in the same window shows whether the alert is one step of a wider session — for example
    administrative work spanning several servers, or credentials being reused after the file-transfer host
    was reached. When the alert fires under SYSTEM or a machine account this view returns routine
    agent telemetry and the parent-scoped fleet view is the meaningful answer instead.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same parent-driven execution fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several file-transfer servers producing it at once points at either a scheduled or
    pushed automation touching them all, or at the same request being replayed against every exposed server;
    a single host points at a host-local trigger. This view stays meaningful when the alert fires under a
    service principal, where identity-based pivots return only agent noise.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftp.exe
      selection_child_powershell:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - IEX
        - enc
        - Hidden
        - bypass
      selection_child_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - /c powershell
        - whoami
        - net.exe
        - net1.exe
      selection_child_others:
        Image|endswith:
        - \bitsadmin.exe
        - \certutil.exe
        - \mshta.exe
        - \cscript.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_child_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Exploitation of an exposed service is usually preceded or followed by other detectable steps —
    reconnaissance against the application, defense tampering, credential access, or persistence installed to
    survive a service restart. The ordering of earlier detections on this host reconstructs how far the
    execution path progressed before this alert and what to review next.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
