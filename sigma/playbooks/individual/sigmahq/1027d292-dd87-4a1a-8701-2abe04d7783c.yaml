name: PSScriptPolicyTest Creation By Uncommon Process
id: d04e778b-a003-4fb3-b536-2a57f1d6aaab
description: |
  Fires when a file whose name contains "__PSScriptPolicyTest_" is created AND the creating process is none of the
  known PowerShell hosts (powershell.exe, powershell_ise.exe, pwsh.exe and its store/preview variants) or the small
  set of Microsoft management binaries that embed the engine (dsac.exe, sdiagnhost.exe, ServerManager.exe,
  wsmprovhost.exe). The PowerShell engine writes this short-lived probe file into the user's temp directory to test
  whether script execution is permitted under AppLocker or WDAC policy, so its creation by any other binary means that
  binary has loaded System.Management.Automation and is running PowerShell in-process — the pattern used to execute
  PowerShell while avoiding the powershell.exe image and its script-block logging. Legitimate causes exist (management
  agents, backup and monitoring products, and in-house .NET tooling all host the engine), so the investigation is to
  identify the creating process, establish whether it has a reason to host PowerShell on this host, and determine what
  the hosted engine went on to do.
type: detection
detection_id: 1027d292-dd87-4a1a-8701-2abe04d7783c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the created file name carry the PowerShell policy-test pattern, and is the creating process outside the known PowerShell host list?
  context: >-
    Confirm both halves of the detection before spending time on it: the file name contains "__PSScriptPolicyTest_",
    and the responsible process is not powershell.exe, powershell_ise.exe, pwsh.exe, or one of the Microsoft binaries
    that legitimately embed the engine. Read the signer columns for coherence with a program that would host PowerShell,
    not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to run software that embeds the PowerShell engine?
  context: >-
    Developer workstations, management servers, and hosts running backup, monitoring, or configuration agents routinely
    run .NET programs that host PowerShell in-process. A general-purpose endpoint with no such tooling has no ordinary
    reason to produce this file from anything but a PowerShell binary. When the user is a machine or service account,
    judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the policy-test file still on disk, or was it deleted shortly after it was created?
  context: >-
    The engine normally removes this probe file within moments of writing it, so a deletion by the same process is the
    expected lifecycle rather than anti-forensic cleanup. A file that lingers, or one deleted by a different process,
    is the deviation worth noting. If it is still present it can be retrieved and read directly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What was the full command line of the process that created this file, and what working directory did it run from?
  context: >-
    The file event names the acting binary but not how it was invoked. Its command line and working directory reveal
    whether it ran with arguments that point at a script, an assembly, or an inline payload, and whether it launched
    from a program directory or from a user-writable location. This scopes to every execution of that binary on the
    host within the alert window, so a multi-step operation is visible as a sequence rather than a single row.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process created this file, and what launched it?
  context: >-
    The file event carries the acting process but not its origin. Retrieving that process's own start event exposes the
    parent that launched it. A vendor agent started by services.exe reads very differently from the same binary started
    by an Office application, a script host, or a browser, and the parent is often the fastest way to tell embedded
    tooling from an execution chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What are the contents and size of the created file, and do they match the engine-generated probe?
  context: >-
    The genuine probe is a short engine-generated stub written only so the policy engine can be asked whether it may
    run. A file carrying this name but holding real script text, base64 blobs, embedded addresses, or a payload of any
    substantial size means the name was reused as cover for a script drop rather than produced by a policy check.
    Reading the bytes requires retrieving the file from the endpoint while it still exists.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this file has executed, what is its hash — and does it have known AV or threat intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so the file-creation event carries none. This looks
    for the path executing and reads the hash from that event; submit it to reputation services or internal threat
    intel. Because the file carries a .ps1 extension it would run as an interpreter process with the path only in the
    command line — in that case the hash belongs to the interpreter, not to the file, and the file must be hashed from
    its on-disk path instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A program hosting the PowerShell engine usually writes more than the policy probe — script files it stages,
    module or assembly caches, transcripts, or output it collects. The paths and extensions of the same process's other
    file activity, and that of its direct children, show what the hosted engine was actually working on and enumerate
    what else needs review. Breadth alone is not suspicion for a busy agent; where the writes land is what matters.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Which processes on this host have created PowerShell policy-test files over the past week?
  context: >-
    The rule pins a file-name pattern rather than a directory, so the useful local context is the host's own history of
    this pattern grouped by the writing process. A host where only PowerShell binaries have ever produced it makes the
    alerting writer a first-time event; a host where the same non-PowerShell binary has produced it hundreds of times
    points to installed tooling that embeds the engine and was never added to the rule's exclusions.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: __PSScriptPolicyTest_
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Was this policy-test file itself executed or passed to another process after it was created?
  context: >-
    The probe exists only to be evaluated by policy; the engine does not run it and removes it. Any process that
    executes the path, or names it on a command line, is doing something the normal lifecycle does not — either the
    name was reused for a real script drop, or a second program picked the file up. No results here is the expected
    outcome and confirms the file behaved as a probe.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - image_load
- question: Does this host normally run the program that created the file?
  context: >-
    A program that embeds the PowerShell engine and belongs on the host has a long execution history under predictable
    accounts. Zero or very low counts over 90 days mean the binary itself is new here, which moves the question from
    "why is this tool hosting PowerShell" to "where did this tool come from". The account column shows whether it
    normally runs as a service principal or interactively.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's own selection and exclusions scoped to the alerting user, so the result is that user's
    90-day history of non-PowerShell binaries writing the policy probe, grouped by host. A developer or administrator
    who runs .NET tooling may have produced it many times; a user who has never produced it before is the deviation.
    Weigh the count against what the person's role would explain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: __PSScriptPolicyTest_
      filter_main_powershell:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_pwsh_preview:
        Image|contains:
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - \AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview
        Image|endswith: \pwsh.exe
      filter_main_generic:
        Image:
        - C:\Windows\System32\dsac.exe
        - C:\Windows\System32\sdiagnhost.exe
        - C:\Windows\System32\ServerManager.exe
        - C:\Windows\System32\wsmprovhost.exe
        - C:\Windows\SysWOW64\sdiagnhost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically produced this pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a machine account, user identity attributes nothing, and a
    file event carries no parent to pivot on. The acting program is the meaningful pivot: this mirrors the rule's
    selection and exclusions scoped to the alerting binary, giving that program's 90-day history of producing this
    specific pattern. A program already accounting for thousands of prior events is embedded automation the rule has
    not excluded; one that is new or rare for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: __PSScriptPolicyTest_
      filter_main_powershell:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_pwsh_preview:
        Image|contains:
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - \AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview
        Image|endswith: \pwsh.exe
      filter_main_generic:
        Image:
        - C:\Windows\System32\dsac.exe
        - C:\Windows\System32\sdiagnhost.exe
        - C:\Windows\System32\ServerManager.exe
        - C:\Windows\System32\wsmprovhost.exe
        - C:\Windows\SysWOW64\sdiagnhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the alerting account's activity across every host in the alert window shows whether the same identity was
    working on more than this endpoint. If the account fired similar activity elsewhere, the scope of the work — or the
    compromise — extends beyond this host. Under a service principal this returns agent telemetry from every host and
    the acting-program view is the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    This mirrors the rule's selection and exclusions scoped to the alerting binary, fleet-wide, across the alert window.
    Several hosts producing the pattern from the same program at the same time points to scheduled or pushed
    automation — a management task or a deployment that carries an embedded engine. A single host points to a
    host-local trigger and keeps the investigation here.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: __PSScriptPolicyTest_
      filter_main_powershell:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell_ise.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_main_pwsh_preview:
        Image|contains:
        - C:\Program Files\WindowsApps\Microsoft.PowerShellPreview
        - \AppData\Local\Microsoft\WindowsApps\Microsoft.PowerShellPreview
        Image|endswith: \pwsh.exe
      filter_main_generic:
        Image:
        - C:\Windows\System32\dsac.exe
        - C:\Windows\System32\sdiagnhost.exe
        - C:\Windows\System32\ServerManager.exe
        - C:\Windows\System32\wsmprovhost.exe
        - C:\Windows\SysWOW64\sdiagnhost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    An in-process PowerShell engine leaves its traces in what the host did next rather than in the probe file itself.
    Aggregating process activity around the alert collapses routine agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts — reconnaissance commands, credential tooling, or persistence steps
    launched in the same minutes are what to look for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Which processes across the environment created PowerShell policy-test files in the last day, and how common is the alerting process among them?
  context: >-
    The file name carries a random component, so the pattern rather than the exact name is what compares across hosts.
    Grouping the last day of these writes by host and writing process gives the environment's own list of programs that
    host the PowerShell engine. A writer that appears on many hosts is deployed software worth adding to the rule's
    exclusions; a writer unique to this host is what the alert is pointing at.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: __PSScriptPolicyTest_
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a sequence — defense tampering followed by execution,
    reconnaissance followed by exploitation, credential access followed by lateral movement. Running PowerShell from
    inside another program is often chosen after logging or policy controls have already been touched, so the preceding
    hours are where that would show.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
