name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols Via CLI
id: d5d050b5-fee7-46eb-b66c-bd06c64ed367
description: |
  Detects a command line that writes the Internet Explorer ZoneMap ProtocolDefaults
  configuration for the http or https protocol to the MyComputer zone (value 0) under
  Internet Settings. The rule fires when a single command contains the ProtocolDefaults
  registry path together with the http protocol token and a zero value, which downgrades
  the default trust level for web protocols to the same level granted to local files.
  The effect removes Mark-of-the-Web tagging and Zone.Identifier handling for downloaded
  content, so files fetched from the internet are treated as local and trusted. This
  is performed via reg.exe or PowerShell registry cmdlets and can be a legitimate (but
  unusual) administrative or testing action, so the investigation should establish who
  ran it, what was changed, and whether other registry or defense changes accompanied it.
type: detection
detection_id: 10344bb3-7f65-46c2-b915-2d00d47be5b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line write the IE ZoneMap ProtocolDefaults http value to the MyComputer zone?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule
    fires only when the command contains the ProtocolDefaults registry path AND the http
    protocol token AND a zero value together, so verify all three are present and that the
    value 0 is the data being written to the http or https protocol.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to modify Internet Explorer security zone settings from the command line?
  context: Legitimate zone configuration is normally pushed through Group Policy or imaging,
    not typed at an interactive command line. Knowing whether the user role and host function
    involve hands-on registry changes to browser trust settings is often the fastest way to
    separate a routine build step from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What specific registry key and value were written, and which protocol and zone do they map to?
  context: The registry path determines intent. ProtocolDefaults sets the default zone applied
    when no per-domain rule matches, so a value of 0 written to the http or https value name
    demotes every unmapped web URL to the MyComputer zone. Confirm the exact protocol name
    affected and whether the change was made under HKCU (per user) or HKLM (machine wide), and
    check for related value names such as https being set in the same operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: Operators who downgrade browser zone trust often make several related registry
    changes in the same window, such as mapping a specific domain into a trusted zone,
    disabling SmartScreen, or adjusting defender settings. Finding a cluster of registry
    writes from the same host within a short window reveals the full scope of configuration
    changes and whether multiple objectives were pursued alongside the zone downgrade.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - 'Set-ItemProperty'
          - 'New-ItemProperty'
          - 'Remove-ItemProperty'
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: What process spawned the tool that made this change, and is that parent chain expected?
  context: The parent process reveals how the registry write was invoked. Interactive zone
    changes typically descend from explorer.exe or a console the user opened, while parents
    such as a script host, an Office application, or an extracted archive's launcher point to
    downloaded or macro-driven execution rather than deliberate administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host written the IE ZoneMap ProtocolDefaults pattern before, or is this the first time?
  context: A zone-downgrade command that has never been seen on a host is more suspicious than
    one that recurs as part of a known build or configuration routine. Zero or very low
    historical counts for this specific registry-write pattern indicate first-time or rare
    activity on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
          - http
          - ' 0'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an occasionally legitimate configuration step has a normal pattern. The query
    mirrors the rule's selection scoped to this host, so the resulting parent and user
    distribution reflects how this specific zone-downgrade pattern has historically run here.
    A new parent process, an unexpected user account, or an unusual command structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did the alerting process spawn afterward?
  context: The processes spawned by the alerting command reveal its actual impact. A registry
    write followed by a download utility, a script host, or another payload launcher points to
    the zone downgrade being a preparatory step ahead of fetching content that the relaxed
    trust level is meant to wave through.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Configuration tampering rarely occurs alone. Activity surrounding the zone-downgrade
    command may reveal a delivered file being run, reconnaissance, or additional persistence and
    defense changes that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this specific zone-downgrade pattern rather than generic registry usage.
    Many hosts writing the same value points to scripted deployment or a configuration tool;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or repeated
    configuration changes on multiple endpoints. If the same user triggered similar activity on
    several hosts, the scope of the change campaign may be wider than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \Microsoft\Windows\CurrentVersion\Internet Settings\ZoneMap\ProtocolDefaults
        - http
        - ' 0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led
    to this event and what happened after, and whether the zone downgrade is part of a larger
    sequence such as a delivered file being executed, defense changes, or persistence being set.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or
    delivery of a downloaded file, may reveal the stages that preceded the zone downgrade and help
    reconstruct the timeline. The order of alerts often tells the story of how the host reached
    this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
