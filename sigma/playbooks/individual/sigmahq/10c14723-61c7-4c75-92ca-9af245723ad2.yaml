name: HackTool - Potential Impacket Lateral Movement Activity
id: 9d95bd20-21ed-4964-90a9-b954cbaf5ca1
description: |
  Detects the command-shell launch pattern produced by the Impacket lateral-movement scripts (wmiexec, dcomexec, atexec, smbexec), which run commands on a remote host and read the output back over SMB. The rule fires when EITHER a child cmd.exe is spawned by wmiprvse.exe, mmc.exe, explorer.exe, or services.exe AND its command line contains all of cmd.exe, /Q, /c, \\127.0.0.1\, and &1 (the wmiexec/dcomexec output-to-loopback-share pattern), OR a child cmd.exe is spawned under a parent whose command line contains svchost.exe -k netsvcs or taskeng.exe AND the child command line contains all of cmd.exe, /C, Windows\Temp\, and &1 (the atexec scheduled-task pattern). Both branches share the fire-and-forget design: the remote tool has no return channel over WMI/DCOM/SMB, so it redirects command output to a temp file or an admin-share path on 127.0.0.1 and reads it back. Legitimate WMI/DCOM administration rarely produces this exact redirect-to-loopback-share pattern; investigation should confirm which branch fired, recover the full command and its output path, identify the remote source that drove the execution, and determine the authentication used.
type: detection
detection_id: 10c14723-61c7-4c75-92ca-9af245723ad2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Did a parent process spawn cmd.exe with EITHER the loopback-share redirect pattern OR the Windows\Temp redirect pattern this rule looks for?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact parent and child command
    lines against the rule's two-branch logic. The first branch is a parent of wmiprvse.exe, mmc.exe, explorer.exe, or
    services.exe spawning cmd.exe whose command line contains all of /Q, /c, \\127.0.0.1\, and &1. The second branch is a
    parent whose command line contains svchost.exe -k netsvcs or taskeng.exe spawning cmd.exe whose command line contains
    all of /C, Windows\Temp\, and &1. Note which branch fired, because it tells you the delivery channel - the loopback-share
    branch points to wmiexec/dcomexec driven over WMI or DCOM, and the Windows\Temp branch points to atexec driven through a
    scheduled task, and that distinction steers the source-host and authentication questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Is this user and host expected to run remote command execution that redirects output to a loopback share or a temp file?
  context: >-
    Legitimate administrative activity can trigger many detections, but the redirect-output-to-loopback-share or
    redirect-to-temp pattern is the signature of a remote-execution tool reading results back over SMB, not normal interactive
    cmd.exe use. Knowing whether the user role and host function are consistent with being a remote-management target, and
    whether an administrator is expected to drive WMI, DCOM, or scheduled-task execution against this host, is often the
    fastest path to distinguishing sanctioned administration from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Impacket-style remote execution part of an authorized penetration test or red team engagement?
  context: >-
    The Impacket lateral-movement scripts are standard tooling in authorized security assessments. Before investing
    investigation time, check whether a penetration test or red team exercise is currently active on this host or network
    segment. An authorized engagement whose scope, timing, and source host match the observed activity resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this parent expected to spawn cmd.exe in this way, and what started the parent?
  context: >-
    The parent-child relationship is the core signal. wmiprvse.exe is the WMI provider host and is the expected parent for
    wmiexec; mmc.exe and explorer.exe appear with DCOM-based execution; services.exe and a svchost.exe -k netsvcs or
    taskeng.exe parent appear with service- and scheduled-task-based execution. Tracing the parent's own origin reveals
    whether the chain is a remotely driven execution path or a legitimate local administrative action, and for the WMI and
    scheduled-task parents it confirms the channel that delivered the command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same parent spawn?
  context: >-
    A remote operator usually runs more than one command per session, and each command is a separate cmd.exe spawned by the
    same provider, COM host, or scheduled-task parent. Examining all children of that parent instance reveals the full set of
    commands executed through the channel, including reconnaissance, credential access, or further movement that did not each
    trip the rule individually.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Decode the full cmd.exe command line - what command ran and to which output path was its result redirected?
  context: >-
    The full command line carries two parts. The redirect tokens (&1 with a \\127.0.0.1\ADMIN$ or C$ share path, or a
    Windows\Temp file) show where the tool captured output so it could read results back over SMB, and the named output file
    is an on-disk artifact to recover. The command between cmd.exe /Q /c (or /C) and the redirect is what actually executed
    on this host. Scoping to all cmd.exe executions on the host in the window catches the sequence of commands a single
    remote session typically issues, not just the one that tripped the rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - cmd.exe
          - '&1'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Beyond cmd.exe, what processes were created under the same provider or COM host on this target around the alert time?
  context: >-
    DCOM- and WMI-based execution instantiates a server process on the target that then creates the payload processes, so the
    identity of the processes spawned under that host is what reveals the operator's objective. Listing the processes created
    under the WMI provider host or COM server, with their own parents, separates the expected cmd.exe shell from additional
    binaries the operator ran - script interpreters, credential-access tools, or copies of system utilities run from unusual
    paths.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - \wmiprvse.exe
          - \mmc.exe
          - \dllhost.exe
          - \svchost.exe
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Do the WMI activity logs show a remote process creation or subscription on this host matching the alert time?
  context: >-
    WMI execution leaves operational records distinct from the spawned cmd.exe: a remote process
    create loads the Win32 provider, recorded as event 5857 with the provider and WmiPrvSE
    instance in winlog.user_data.ProviderName and HostProcess, and any subscription left behind
    as persistence registers as 5859-5861, whose winlog.user_data.Query and CONSUMER columns
    carry the filter and the payload it triggers. Read the message column for the narrative on
    every code. If WMI operational logging is not collected in this environment, treat zero
    results as a visibility gap rather than evidence WMI was not used.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: What host initiated this remote connection, and is it an expected administrative source?
  context: >-
    Lateral movement requires a source and destination. WMI and DCOM execution reach this host over RPC on port 135 with
    follow-on dynamic ports, and SMB output retrieval uses port 445. Identifying the originating address of those inbound
    connections reveals whether the execution came from a known admin jump box, a compromised workstation, or an unexpected
    source pivoting through the environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What authentication method was used to drive this remote execution -- legitimate credentials, pass-the-hash, or Kerberos ticket?
  context: >-
    The authentication that preceded the execution reveals how the operator gained access. Pass-the-hash (NTLM network logons
    with no matching interactive logon) and pass-the-ticket bypass password entry; legitimate credential use suggests the
    operator obtained valid passwords through dumping, phishing, or prior compromise. The account and logon type tied to the
    cmd.exe identify whose credentials drove the remote tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: Where has this user authenticated recently, and from which source addresses?
  context: >-
    Authentication events show which systems the user accessed before and after the detected execution. A network logon from
    a remote source immediately before the cmd.exe, and the same account authenticating to many systems in a short window,
    point to credentials being used for movement. Logon type and source address distinguish a remote network logon driving
    the tool from routine interactive use.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
- question: What processes were spawned on this host after the remote execution was established?
  context: >-
    Remote execution is a means to an end - operators move laterally to run commands, deploy tools, or access data on the
    target. Examining processes created on this host shortly after the redirect-to-share execution reveals the operator's
    objectives, including reconnaissance, credential access, or staging that followed the initial foothold.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_other:
        ParentImage|endswith:
        - \wmiprvse.exe
        - \mmc.exe
        - \explorer.exe
        - \services.exe
        CommandLine|contains|all:
        - cmd.exe
        - /Q
        - /c
        - \\\\127.0.0.1\\
        - '&1'
      selection_atexec:
        ParentCommandLine|contains:
        - svchost.exe -k netsvcs
        - taskeng.exe
        CommandLine|contains|all:
        - cmd.exe
        - /C
        - Windows\Temp\
        - '&1'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_other:
        ParentImage|endswith:
        - \wmiprvse.exe
        - \mmc.exe
        - \explorer.exe
        - \services.exe
        CommandLine|contains|all:
        - cmd.exe
        - /Q
        - /c
        - \\\\127.0.0.1\\
        - '&1'
      selection_atexec:
        ParentCommandLine|contains:
        - svchost.exe -k netsvcs
        - taskeng.exe
        CommandLine|contains|all:
        - cmd.exe
        - /C
        - Windows\Temp\
        - '&1'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same actor drove similar remote execution on multiple
    endpoints. If the same account ran comparable activity elsewhere in the window, the scope of compromise may extend beyond
    this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_other:
        ParentImage|endswith:
        - \wmiprvse.exe
        - \mmc.exe
        - \explorer.exe
        - \services.exe
        CommandLine|contains|all:
        - cmd.exe
        - /Q
        - /c
        - \\\\127.0.0.1\\
        - '&1'
      selection_atexec:
        ParentCommandLine|contains:
        - svchost.exe -k netsvcs
        - taskeng.exe
        CommandLine|contains|all:
        - cmd.exe
        - /C
        - Windows\Temp\
        - '&1'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as credential access, reconnaissance, or
    initial access, may reveal the stages that led to this remote execution and help reconstruct the timeline of how the
    operator reached and used this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
