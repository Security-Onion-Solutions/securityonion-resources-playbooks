name: PUA - System Informer Driver Load
id: 74b2360e-5c9e-49ee-a532-24b1a3bab4b6
description: |
  Detects the load of the System Informer kernel driver, either by a driver path ending in
  \SystemInformer.sys or by a SHA256 matching one of thirteen published driver builds. System Informer
  is a maintained open-source process and handle monitor, and its driver is what gives the tool
  capabilities user-mode APIs withhold: opening handles to protected processes, terminating processes
  that resist termination, and manipulating object handles directly. Administrators and developers run
  it legitimately, so the driver load on its own is not a finding. The same capability is also used to
  terminate or blind security software and to reach protected processes without the tool's interface
  ever running, and the driver is vendor-signed, so it loads where driver-signature enforcement is
  active. The investigation should determine whether the System Informer application is actually present
  and in use on this host, who put the driver file there, what registered it as a service, and whether
  security-tool or credential-access activity followed the load.
type: detection
detection_id: 10cb6535-b31d-4512-9962-513dcbc42cc1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the loaded driver match what this rule detects — a path ending in \SystemInformer.sys,
    or a SHA256 on the rule's list?
  context: The rule fires on either branch independently, so note which one matched. A path match with
    an unlisted hash points to a build the rule does not enumerate or to a different driver carrying the
    name; a hash match under a different file name points to a renamed copy of a known System Informer
    driver, which is the more deliberate of the two.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
- question: Is this host and user expected to run a process and handle monitoring tool that installs a
    kernel driver?
  context: System Informer is standard equipment for administrators and developers troubleshooting stuck
    handles, resource usage, or misbehaving processes on their own workstation. The same tool on a server,
    a kiosk, or a user endpoint with no troubleshooting role is worth resolving. Knowing the host's function
    and the account's role is usually the fastest route to a verdict.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is System Informer on the organization's approved software list, and is it approved for this
    host?
  context: Many organizations sanction a specific set of diagnostic tools and treat everything else as
    unmanaged software, regardless of the tool's reputation. System Informer is frequently approved for
    engineering and support staff and just as frequently absent from a standard endpoint build. An unapproved
    installation is not by itself a compromise, but it moves the question from "is this expected" to "how
    did it get here".
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: From what path did the driver load, who signed it, and which process triggered the load?
  context: An install-directory path under Program Files with a valid Winsider signature fits routine
    use. A driver staged in a temporary, user-writable, or otherwise non-standard directory fits a copy
    brought to the host for a single purpose. Read the signer and signature status alongside the path
    — a valid signature is expected here and does not settle the question, because the driver's legitimate
    signature is exactly what makes it usable without meeting driver-signature enforcement.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Has a driver whose SHA256 matches one of the known System Informer driver builds loaded on
    this host under any file name?
  context: The query drops the file-name constraint and matches only on the rule's hash list, so it surfaces
    loads of the same driver content under a renamed file. Renaming a known driver is a common way to
    evade name-based rules while keeping the signed binary's capability. Several results under different
    names, or a single load under a name unrelated to the tool, are worth resolving; a history of loads
    under the tool's own name alongside normal use is routine.
  range: -90d
  answer_sources:
  - driver_load
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Hashes|contains:
          - 'SHA256=8B9AD98944AC9886EA4CB07700E71B78BE4A2740934BB7E46CA3B56A7C59AD24'
          - 'SHA256=A41348BEC147CA4D9EA2869817527EB5CEA2E20202AF599D2B30625433BCF454'
          - 'SHA256=38EE0A88AF8535A11EFE8D8DA9C6812AA07067B75A64D99705A742589BDD846D'
          - 'SHA256=A773891ACF203A7EB0C0D30942FB1347648F1CD918AE2BFD9A4857B4DCF5081B'
          - 'SHA256=4C3B81AC88A987BBDF7D41FA0AECC2CEDF5B9BD2F45E7A21F376D05345FC211D'
          - 'SHA256=3241BC14BEC51CE6A691B9A3562E5C1D52E9D057D27A3D67FD0B245C350B6D34'
          - 'SHA256=047C42E9BBA28366868847C7DAFC1E043FB038C796422D37220493517D68EE89'
          - 'SHA256=18931DC81E95D0020466FA091E16869DBE824E543A4C2C8FE644FA71A0F44FEB'
          - 'SHA256=B4C2EF76C204273132FDE38F0DED641C2C5EE767652E64E4C4071A4A973B6C1B'
          - 'SHA256=640954AFC268565F7DAA6E6F81A8EE05311E33E34332B501A3C3FE5B22ADEA97'
          - 'SHA256=251BE949F662C838718F8AA0A5F8211FB90346D02BD63FF91E6B224E0E01B656'
          - 'SHA256=E2606F272F7BA054DF16BE464FDA57211EF0D14A0D959F9C8DCB0575DF1186E4'
          - 'SHA256=3A9E1D17BEEB514F1B9B3BACAEE7420285DE5CBDCE89C5319A992C6CBD1DE138'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: Was the System Informer or Process Hacker application running on this host around the driver
    load?
  context: The driver exists to serve the tool's interface, so the tool's absence is the discriminator
    that carries the most weight here. An interactive session with SystemInformer.exe or ProcessHacker.exe
    running under a logged-on administrator matches ordinary troubleshooting. The driver loading with
    no corresponding application process means something loaded the kernel component for its capability
    alone, which is the pattern behind using it to reach protected processes.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_gui:
        Image|endswith:
          - '\SystemInformer.exe'
          - '\ProcessHacker.exe'
      condition: selection and selection_gui
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- question: Which process wrote the driver file to this host, and when?
  context: A driver written by an installer, a software deployment agent, or the tool's own setup routine
    fits managed or self-service installation. A driver written by a browser, an archive utility, a script
    host, a remote-management agent, or an unsigned binary points to the file arriving for this load rather
    than to installed software. File writes carry no hash, so use the writing process, the path, and the
    timing here and take signature and hash data from the load event itself.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: Which process triggered the driver load, and what launched that process?
  context: The acting process is named in the alert but its origin is not. Retrieving that process's own
    start event names the parent that launched it. A parent such as explorer.exe or a console fits a person
    starting a tool; services.exe fits a registered service loading its driver at start; a script host,
    a remote-management agent, or an unfamiliar binary as parent is the case to resolve, since service
    management driven from a non-administrative process is a recognized pattern for installing a driver
    as a capability rather than as software. The long window is intentional — service and shell parents
    often start well before the load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was a service installed on this host around the driver load, and what image path did it register?
  context: A kernel driver reaches memory through a service entry, so a service installation recorded
    within hours of the load usually names the driver file and the account that registered it. Compare
    the registered service name and image path against the tool's own naming — a service pointing at a
    driver in a temporary or user-writable directory, or one whose name is unrelated to the tool, is the
    result to pursue. Service installation auditing is not collected in every environment, so no results
    here is a visibility gap rather than evidence no service was created.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: What service registry entries were created or modified on this host around the driver load,
    and do any reference the driver's file path?
  context: Driver services are configured under HKLM\System\CurrentControlSet\Services, where the subkey
    name is the service name and the ImagePath value names the driver file. Reading these writes shows
    what name the driver was registered under, what start type it was given, and which process wrote the
    entries. A start type that survives reboot, or a service key written by a process unrelated to the
    tool's installer, is worth resolving; a key written by the tool's own setup routine and removed afterward
    fits ordinary use.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this driver loaded on this host before, and under what processes?
  context: A driver that has loaded steadily over the past ninety days on this host fits installed tooling
    that someone uses regularly. A first or near-first load moves the origin questions to the front — where
    the file came from and what registered it. Note the loading processes as well — a consistent loader
    across the history and a new one for this event are different situations.
  range: -90d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this driver loading on other hosts in the environment?
  context: Cross-host distribution separates a local installation from a deployment. The driver on a handful
    of engineering and support workstations fits a tool a team uses. The same driver appearing across
    unrelated hosts — particularly servers, or hosts with no troubleshooting role — points to distribution
    by something other than a person installing software, and widens the investigation to those hosts.
    Hosts not reporting driver load telemetry are absent from this result regardless of what loaded on
    them.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Activity surrounding the load supplies the immediate context — what preceded it and what followed.
    Scan for security service or agent processes stopping, credential-access tooling, archive and transfer
    utilities, and service or task creation. Repetitive agent telemetry collapses into single high-count
    rows, so novel parent-child pairs stand out at low counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections help reconstruct what preceded the load. Defense tampering, credential access,
    or remote-management activity ahead of a driver that grants handle access to protected processes places
    the load in a sequence rather than on its own. Nothing before it, on a host whose owner uses diagnostic
    tooling, points the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is there a current helpdesk ticket, maintenance window, or support session explaining diagnostic
    tooling on this host?
  context: Legitimate use of a process and handle monitor usually has a reason attached — a performance
    complaint, a hung application, a scheduled maintenance task. A support record covering this host and
    this window largely settles the question. No record, on a host nobody was working on, leaves the origin
    of the driver as the open item.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall running System Informer on this host?
  context: Direct confirmation from the person behind the account is often the fastest path to a verdict.
    If they recall it, ask what they were troubleshooting and whether they installed the tool themselves
    or found it already present. If nobody recalls using it, the account or the host warrants the origin
    questions instead — where the driver file came from and what registered it.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this driver load align with normal work hours or a maintenance window?
  context: Interactive diagnostic work tracks the working hours of the person doing it. A driver load
    on an unattended host, outside any maintenance window, or at a time nobody was logged on, fits a load
    driven by automation or by something running without an operator. Check the host's local time rather
    than the console's, and account for administrators who keep non-standard hours.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the driver load?
  context: A driver registered as a service is one persistence mechanism; where the driver was placed
    deliberately, others are commonly added alongside it. This surfaces scheduled tasks, service creation,
    registry writes, and transfer jobs configured on the host within four hours of the load. Several mechanisms
    installed in one window points to intentional stacking; a single sc.exe invocation that registers the
    driver's own service fits installation of the tool.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
