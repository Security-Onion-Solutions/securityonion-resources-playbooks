name: User Added To Highly Privileged Group
id: 89681ff9-5a92-46a6-9ec3-ee4dc8b6a866
description: |
  Detects a command line that adds a user to a highly privileged group, either through the native
  "net localgroup ... /add" path or the PowerShell "Add-LocalGroupMember -Group" path, where the
  targeted group is one of Group Policy Creator Owners or Schema Admins. Adding a principal to one of
  these directory-control groups grants the ability to author or alter group policy or schema, an
  effect that is occasionally legitimate administration but is also a direct privilege-escalation and
  persistence move when performed from an unexpected parent process or by an account that does not
  own that change. Investigation should confirm the exact command and target group, confirm whether
  the change succeeded in the Security event log, determine whether the account making the change
  differs from the account being added, and establish whether the activity was authorized.
type: detection
detection_id: 10fb649c-3600-4d37-b1e6-56ea90bb7e09
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line add a user to a highly privileged group via net localgroup /add or Add-LocalGroupMember -Group, targeting Group Policy Creator Owners or Schema Admins?
  context: >-
    Confirm the alert before investing investigation time. The rule fires only when the command line
    matches one of two add paths -- "localgroup" together with "/add", or "Add-LocalGroupMember"
    together with "-Group" -- AND the command line also references one of the high-privilege groups
    Group Policy Creator Owners or Schema Admins. Read the full command line and note which add path
    fired and which group was named, because both pattern the downstream investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to modify membership of directory-control groups like Group Policy Creator Owners or Schema Admins?
  context: >-
    Membership changes to Group Policy Creator Owners or Schema Admins are normally performed by a
    small set of directory administrators from designated management hosts. If the account and host
    that produced this command are not part of that administrative function, the change is far more
    likely to be unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this command do -- which group was targeted and which member was added?
  context: >-
    The full command line reveals the operational detail behind the alert. Identify the add path used
    (native net localgroup or PowerShell Add-LocalGroupMember), the exact group named, and the member
    being added. Because group management can run as several sequential commands, this scope captures
    all matching add commands on the host within the window, not just the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_native:
        CommandLine|contains|all:
          - 'localgroup '
          - ' /add'
      selection_pwsh:
        CommandLine|contains|all:
          - 'Add-LocalGroupMember '
          - ' -Group '
      condition: selection_host and (selection_native or selection_pwsh)
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the group membership change succeed according to the Security event log?
  context: >-
    A command to add a member to a group does not guarantee the change occurred -- insufficient
    privileges or policy can block it. The Security log records the authoritative result. For an
    add-to-group action the relevant events are 4732 (member added to a security-enabled local group),
    4728 (member added to a security-enabled global group), and 4756 (member added to a
    security-enabled universal group). Absence of a matching success event within minutes of the
    command suggests the add failed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
- question: Does the account that issued the change differ from the account that was added to the group?
  context: >-
    When the account performing the modification is not the same as the account being added, the
    pattern points to one principal granting elevated rights to another rather than an administrator
    adjusting their own tooling. In the Security group-membership events, compare the subject (the
    account that made the change) against the member that was added. A mismatch, especially where the
    added member is a newly created or low-privilege account, raises the priority of the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - MemberName
      - TargetUserName
- question: Is the account that was added to the group normally active, and what is its usual logon pattern?
  context: >-
    A dormant or rarely used account that is suddenly granted directory-control privileges is more
    suspicious than an active administrative account. Check the logon history for the added member to
    establish whether it has recent activity, which hosts it touches, and whether its pattern changed
    around the time of the group addition. Substitute the member name observed in the command for the
    target account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetUserName|expand: '%TargetUserName%'
        EventID:
          - 4624
          - 4625
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - IpAddress
      - LogonType
- question: What activity occurred from the newly privileged account after the change?
  context: >-
    Once an account is granted membership in a directory-control group, an operator typically uses the
    new rights shortly afterward. Process executions, authentications, or network activity from the
    added member after the change indicate the privilege was exercised. Substitute the member name
    observed in the command for the account filter below.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|contains:
          - 'Administrator'
          - 'guest'
          - 'DefaultAccount'
      condition: selection
    fields:
      - host.name
      - Image
      - User
- question: Did this user make other account or group modifications around this time?
  context: >-
    Operators often modify several accounts in sequence -- creating a user, resetting a password, and
    adding members to multiple privileged groups. Finding additional account-management commands from
    the same account in a tight window strengthens the case that the activity is deliberate
    privilege-escalation rather than an isolated administrative edit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_cmd:
        CommandLine|contains:
          - 'net user'
          - 'net localgroup'
          - 'net group'
          - 'Add-LocalGroupMember'
          - 'Remove-LocalGroupMember'
          - 'New-LocalUser'
          - 'Set-LocalUser'
      condition: selection and selection_cmd
    fields:
      - host.name
      - CommandLine
- question: What process spawned this command, and is that parent chain expected for a group-management action?
  context: >-
    The parent process reveals how the add-to-group command was launched. Interactive administration
    usually has a predictable parent such as an explorer-launched console. A group addition spawned by
    remote-access software, a scripting host, or a web-facing service process points to the change
    being driven by an external operator rather than a local administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the issuing account's activity across all hosts reveals whether the group change is part
    of broader hands-on activity. The same account triggering related actions on multiple endpoints in
    the same window suggests the scope extends past this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_main:
      - CommandLine|contains|all:
        - 'localgroup '
        - ' /add'
      - CommandLine|contains|all:
        - 'Add-LocalGroupMember '
        - ' -Group '
      selection_group:
        CommandLine|contains:
        - Group Policy Creator Owners
        - Schema Admins
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Group-membership changes rarely occur in isolation. Examining the surrounding process activity on
    the host reveals what led to the change and what followed it -- reconnaissance, account creation,
    additional privilege grants, or persistence installation. Novel parent-child process pairs stand
    out against the high-count routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A privileged-group addition is itself a persistence and escalation foothold. Operators commonly
    stack additional mechanisms using different techniques -- scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there an authorized change ticket or approval for this group membership change?
  context: >-
    Changes to directory-control groups normally follow a change-management process. Absence of a
    corresponding ticket, or timing outside a documented maintenance window, increases suspicion. This
    check requires consulting organizational systems beyond log data and is one of the fastest ways to
    close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: Does the user or administrator recall performing this group membership change?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to determining
    legitimacy. If the user does not recall adding a member to Group Policy Creator Owners or Schema
    Admins, the credentials may be compromised or the activity automated. If they do recall it,
    capture why the change was made and whether it was approved.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, reconnaissance, credential access,
    remote-access tooling -- may reveal the stages that preceded the group change and help
    reconstruct the timeline. A privilege-escalation step frequently follows initial access and
    discovery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
