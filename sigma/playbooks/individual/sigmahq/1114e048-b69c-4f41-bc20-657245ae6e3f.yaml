name: User Discovery And Export Via Get-ADUser Cmdlet
id: 9d9c9b72-39fb-4223-9858-6a7d84cb8a13
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) running the Get-ADUser cmdlet
  with an unrestricted -Filter * to enumerate every user object in Active
  Directory, where the result is captured to a file or pipeline via a redirect
  (>), Out-File, Set-Content, Add-Content, or Select. The rule fires only when
  both the image/OriginalFileName selection AND the command-line selection match,
  so the alert always represents a domain-wide user enumeration whose output was
  staged rather than read interactively. Exporting the full user list is routine
  for administrators building reports or audit scripts, but the same one-line
  export is a common early step in hands-on intrusions to harvest account names
  for credential attacks and lateral movement targeting. The investigation
  should decode the full command and its output destination, establish whether
  the acting user and host normally perform this enumeration, and look for other
  reconnaissance or follow-on activity around the same window.
type: detection
detection_id: 1114e048-b69c-4f41-bc20-657245ae6e3f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-09
questions:
- question: Did PowerShell run Get-ADUser with an unrestricted -Filter * and
    redirect the output to a file or pipeline, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true
    positive. The rule fires only when both conditions hold together - the image
    is powershell.exe or pwsh.exe AND the command line contains Get-ADUser with
    -Filter * AND an output cmdlet or redirect (>, Out-File, Set-Content,
    Add-Content, or Select). Read the exact command line and note the -Filter
    value, any -Properties requested, and where the output was written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate and export the full
    Active Directory user list?
  context: Domain and IT administrators legitimately run Get-ADUser to build
    reports, audit account states, and feed identity-management scripts.
    Standard users and non-administrative hosts rarely pull the entire user
    inventory. The acting account's role and the host's function are often the
    fastest way to separate routine administration from post-compromise
    harvesting - an unrestricted -Filter * export from an account or endpoint
    that has no reason to inventory the domain is the case worth pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What did the full Get-ADUser command enumerate, and where was the
    output written?
  context: The full command line reveals the scope of the enumeration and its
    staging location. Note the -Filter expression (whether it is the broad * or
    a narrower query), any -Properties requested (a full -Properties * pull
    harvests group memberships, last-logon timestamps, descriptions, and other
    attributes useful for selecting targets), and the output destination from
    the redirect or Out-File/Set-Content/Add-Content target. The query scopes to
    Get-ADUser activity on this host within a few minutes rather than the single
    triggering event, so a multi-step export or a sequence of related
    enumeration commands appears together. powershell.exe is too common to scope
    by image alone, so the command-line pattern bounds the result.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-ADUser '
      condition: selection
    fields:
      - CommandLine
      - User
      - CurrentDirectory
- question: Did PowerShell script block logging capture the full enumeration
    script content?
  context: Script block logging records the deobfuscated script content
    PowerShell actually executed, including the complete Get-ADUser pipeline,
    the properties requested, and any further processing of the result before it
    was written out. This is ground truth for what the enumeration collected,
    even if the process command line was truncated or wrapped. If PowerShell
    operational logs are not ingested in this environment, treat zero results as
    a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned the PowerShell that ran the enumeration, and is
    that parent chain expected?
  context: The parent process shows how the enumeration was launched and helps
    distinguish interactive administration from automated or non-interactive
    execution. A console shell spawned from explorer.exe or a known management
    console fits routine work; a script host (wscript.exe, cscript.exe,
    mshta.exe), an Office application, wmiprvse.exe, or wsmprovhost.exe points
    to macro-driven or remote execution. Enumeration originating from a
    non-interactive shell or a service context is more consistent with automated
    post-compromise discovery than with an administrator at a keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same
    time?
  context: A single user enumeration may be legitimate troubleshooting, but
    several reconnaissance commands clustered together - whoami, net user,
    nltest, dsquery, systeminfo, or additional AD cmdlets such as
    Get-ADComputer, Get-ADGroup, or Get-DomainUser - is a signature of
    post-compromise enumeration before the next stage. Tightly grouped
    discovery from one host or user in a short window is the temporal pattern
    that turns a lone Get-ADUser export into likely hands-on activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were PowerShell security controls bypassed or weakened on this host
    before the enumeration ran?
  context: Enumeration during an intrusion is frequently preceded by steps that
    weaken PowerShell defenses so the operator's later payloads run unimpeded -
    execution policy bypass (-ExecutionPolicy Bypass, -ep bypass), AMSI
    patching, a downgrade to PowerShell v2 which lacks modern logging, or
    real-time monitoring being disabled. Finding these precursors in the hour
    before the Get-ADUser export strengthens the case that the discovery is
    part of hands-on operator activity rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the
    alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding
    the enumeration reveals what led to it and what followed - the parent that
    staged PowerShell, other discovery, credential access, or lateral movement
    attempts. Aggregating by image and parent image collapses routine system
    noise into high-count rows while novel parent-child pairs stand out at low
    counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals
    whether the enumeration was a single event or part of activity spanning
    multiple endpoints. If the same user triggered similar discovery or other
    actions on other hosts in the same window, the scope of the incident is
    larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADUser '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What did this user do next on this host after the export?
  context: Follow-on activity reveals the next steps taken after the user list
    was staged. Look for the export file being read, archived, or transferred,
    further enumeration of groups and computers, credential access tooling, or
    connections toward other systems by the same account - the typical
    progression from account harvesting to credential attack or lateral
    movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Get-ADUser pattern repeat on this host in the following
    hours, and does the parent or command-line structure change?
  context: When the alert fires under a service principal, tracking the user's
    next actions is unbounded - system accounts act constantly. A more focused
    follow-on for automation-driven alerts is to track repeat Get-ADUser
    invocations on the same host - routine scheduled exports repeat with stable
    parents and command-line structures, while a deviation in parent or command-line
    in the follow-on window is the signal worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-ADUser '
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADUser '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADUser '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run Get-ADUser enumeration?
  context: A host where this enumeration has never been seen is more notable
    than one that runs it regularly as part of reporting or identity-management
    jobs. The 90-day aggregation grouped by user shows whether the pattern is
    established here and which accounts normally drive it. powershell.exe is too
    common to baseline by image alone, so the command-line pattern bounds the
    result to Get-ADUser activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-ADUser '
      condition: selection
    fields:
      - User
- question: Are there alerts for this user on other hosts?
  context: If the same account triggered detections on multiple hosts in the
    past day, the activity may extend beyond a single endpoint. Check for
    lateral movement patterns or credential abuse across the environment - a
    user-list export combined with other detections under the same account on
    other machines widens the investigation scope.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        user.name|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Did this same rule fire on other hosts in the past 24 hours, and
    does the cross-host pattern look like coordinated automation or an isolated
    detection?
  context: Under a service principal, alerts for the account match everywhere
    because the account is omnipresent. The triage-useful question is whether
    this rule fires on multiple hosts - a rule firing across many hosts on the
    same day is probably tracking a scheduled or pushed export job, while a rule
    firing on one host alone is the deviation worth chasing.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Did other detections fire on this host in the hours before this
    alert?
  context: Earlier detections on the same host - credential access, defense
    tampering, or other reconnaissance - may reveal the attack stages that
    preceded the user enumeration and help reconstruct the timeline. Account
    discovery is often a mid-sequence step taken after initial access to harvest
    names for credential attacks before lateral movement, so prior alerts give
    the context for why the user list was pulled.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
