name: Remote Access Tool - AnyDesk Silent Installation
id: b67a9552-7191-43cb-8435-fc0ec60faf50
description: |
  Detects a command line that performs a silent, unattended AnyDesk installation by combining the --install, --start-with-win, and --silent flags together. The same automated-deployment primitive that IT teams use for mass rollout is reused by operators to drop a remote access tool as a hands-off persistence backdoor: --start-with-win registers the AnyDesk service to auto-start at boot, and a silent install leaves no interactive prompt. Investigation should determine whether the install is a sanctioned deployment or an unauthorized remote-access foothold by checking the full command line, the launch chain, approval records, the resulting service and outbound connections, and the cross-host spread of the same pattern.
type: detection
detection_id: 114e7f1c-f137-48c8-8f54-3088c24ce4b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line contain the silent-install flags this rule detects (--install, --start-with-win, and --silent together)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the rule's detection criteria. The rule fires only when all three flags appear together, which is the unattended-deployment primitive rather than an interactive install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to deploy remote access software?
  context: Legitimate AnyDesk deployment is usually performed by IT staff or automated software-distribution tooling on managed endpoints. A silent install initiated by a standard user, a developer workstation, or a server with no support role is a stronger signal of unauthorized installation than the same action on an admin's deployment host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full AnyDesk command line do beyond the three detected flags?
  context: The detected flags confirm a silent autostart install, but the full command line often carries more — an install directory in a user-writable or temp path, --create-shortcuts/--create-desktop-icon, or a piped --set-password and --register-licence that establish an attacker-known credential and license. Decode every argument and the install destination to understand the complete operation, including any sequential AnyDesk invocations on this host that together form one deployment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - '--install'
          - '--start-with-win'
          - '--silent'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is AnyDesk on the organization's approved remote access software list?
  context: Organizations typically sanction a single remote support tool for IT use. AnyDesk not appearing on the approved list -- even though it is well-known commercial software -- may represent shadow IT or operator-deployed persistence. An unauthorized remote access tool should be reviewed regardless of the product's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket, change record, or support session that explains this AnyDesk install?
  context: Legitimate remote access tool deployment usually correlates with an active support ticket, a scheduled maintenance window, or a documented rollout. If no support or change context exists for this silent install, the tool may have been planted by an operator for persistent access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the AnyDesk installer, and is that parent chain expected for a software deployment?
  context: The parent process reveals how the install was launched. Sanctioned deployment is typically driven by software-distribution agents, services, or an admin shell. A silent install spawned from a script wrapper such as cmd.exe or powershell.exe running a batch deployment, from an Office application, or from a browser download directory points to operator tradecraft rather than managed rollout.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was an AnyDesk auto-start service created on this host around the time of the install?
  context: The --start-with-win flag registers AnyDesk to launch at boot, which surfaces as a new service installation (System event 7045) and is the persistence side-effect that turns a remote tool into a standing backdoor. A service created from a user-writable or temp install path, or one not matching a sanctioned deployment, indicates the install is intended to survive reboots for ongoing access.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - AccountName
- question: What AnyDesk files and install-directory artifacts were written to this host?
  context: A silent install drops the AnyDesk binary and configuration into an install directory and per-user/program-data paths. Files written to a user-writable or temporary location rather than the standard program-files path, or configuration written immediately before an outbound connection, distinguish an operator drop from a managed deployment and reveal residual artifacts left behind by the install.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: 'AnyDesk'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What external endpoints did AnyDesk connect to after the install?
  context: Remote access tools establish outbound sessions to relay servers and cloud infrastructure. Connections to AnyDesk's own relay infrastructure are consistent with normal operation, while connections to unfamiliar addresses or non-standard high ports suggest a custom relay or attacker-controlled endpoint. The presence of any outbound session confirms the installed tool is actively reachable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: 'AnyDesk'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did the AnyDesk install or service spawn afterward?
  context: A silent deployment script often chains additional steps after the install -- piping a password via echo into --set-password, registering a license, or launching a shell. Child processes such as cmd.exe or powershell.exe spawned in the same window reveal whether this was a single managed install or part of a scripted backdoor setup.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains: 'AnyDesk'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - --install
        - --start-with-win
        - --silent
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - --install
        - --start-with-win
        - --silent
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this install?
  context: Tracking the user's activity across all hosts reveals whether this is an isolated deployment or part of broader hands-on activity. If the same user installed remote access software or ran administrative tooling on multiple endpoints in the same window, the scope of access being established may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - --install
        - --start-with-win
        - --silent
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host previously fired the silent-install pattern, what parents and users drove it, and does the current alert fit?
  context: Even a sanctioned tool can be abused. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific silent-install pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - --install
        - --start-with-win
        - --silent
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this silent-install pattern in the past week, and does the cross-host spread look like automated rollout or one-off activity?
  context: This query mirrors the rule's selection with no host scope, returning a fleet-wide count of the silent-install pattern. Many hosts firing the same pattern points to scripted or vendor deployment, while one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - --install
        - --start-with-win
        - --silent
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this install?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the stages that preceded an operator deploying a remote access foothold and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
