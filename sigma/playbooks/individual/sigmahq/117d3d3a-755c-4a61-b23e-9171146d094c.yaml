name: Suspicious Outlook Macro Created
id: 6f91d96f-e5dd-4cc6-a605-6f0c75706590
description: |
  Detects creation of the Outlook VBA project file (VbaProject.OTM) at the Outlook profile path by a process other than
  outlook.exe. Outlook itself writes this file when a user saves a macro in the VB editor, so writes by outlook.exe are
  excluded; a write by any other process is the deployment signature of a VBA backdoor, where a prebuilt VbaProject.OTM is
  copied into the profile to gain user-land persistence and email-triggered code execution without elevated privileges. The
  investigation should determine which process created the file, what the macro project contains, whether the companion
  macro-security registry values were armed, and whether the macro has already run.
type: detection
detection_id: 117d3d3a-755c-4a61-b23e-9171146d094c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was VbaProject.OTM created at the Outlook profile path by a process other than outlook.exe?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on creation of the Outlook
    VBA project file (ending in \Microsoft\Outlook\VbaProject.OTM) where the responsible process is NOT outlook.exe. Outlook
    writing this file itself is normal macro-save activity and is excluded; a different process writing it is the backdoor
    deployment pattern. Confirm the file path, the operation, and the responsible process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a VBA project written to the Outlook profile by a non-Outlook process?
  context: Legitimate macro development produces VbaProject.OTM through outlook.exe itself, not through a copy or scripted write
    from another process. Knowing whether the user develops Outlook macros and whether the host has a business reason for one
    is often the fastest way to separate a rare-but-legitimate case from an implant. When the responsible process runs under
    a machine or service account, judge by the writing process and host role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the VbaProject.OTM file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A macro project still on disk can be retrieved, hashed, and its
    OLE streams inspected; a file deleted or replaced shortly after creation suggests staged deployment or cleanup and shifts
    focus to what ran in between. Interpret the operation type on each returned event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process created this file, and what started that process?
  context: The responsible process is the core signal — a copy performed by cmd.exe, powershell.exe, or a script host is the
    documented deployment method for this backdoor (for example, cmd /c copying a prebuilt VbaProject.OTM into the Outlook
    profile). Tracing the responsible process back to its own parent reveals whether the chain is user-initiated or driven
    by a macro, a downloaded script, or a remote-execution tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is in this VbaProject.OTM file? Inspect its VBA streams for backdoor logic.
  context: VbaProject.OTM is an OLE compound document whose streams (ThisOutlookSession, _VBA_PROJECT, PROJECT, dir) hold the
    compiled macro code. Retrieve the file and inspect the streams for event-driven handlers that weaponize the macro — an
    Application_Startup handler for persistence, or an ItemAdd handler on the Inbox that runs code when mail arrives and may
    scan message bodies for command markers. Look for shell-out calls, encoded strings, embedded URLs or addresses, and logic
    that deletes triggering messages. Content retrieval is a manual step from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did outlook.exe load the VBA runtime (OUTLVBA.DLL) on this host after the file was created?
  context: A VbaProject.OTM that is armed and loaded causes Outlook to load its VBA add-in runtime. Presence of the Outlook
    VBA runtime loading shortly after the file was written indicates the macro project was activated rather than sitting inert
    on disk, which raises urgency. Absence does not clear the file — Outlook may not have been restarted yet.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\OUTLVBA.DLL'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signature
- question: Did outlook.exe spawn a command interpreter or script host after the macro file was created?
  context: When a weaponized Outlook macro runs, outlook.exe becomes the parent of a shell or script host. Child cmd.exe, powershell.exe,
    wscript.exe, cscript.exe, or mshta.exe under outlook.exe is the execution signature of macro payloads and is a primary confirmation
    that the backdoor is live. Decode the child command lines to identify what the macro executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentCommandLine
- question: Were the Outlook macro-security registry values that arm the macro also modified on this host?
  context: The macro file alone does not run — the backdoor also lowers Outlook's macro-security posture and forces the project
    to load. Look for modification of the Outlook Security\Level value (set to 1 = enable all macros), LoadMacroProviderOnBoot
    (set to 1 to auto-load the VBA project at boot), and related startup keys (Today\UserDefinedUrl, WebView, EnableUnsafeClientMailRules).
    Their presence alongside the file write confirms deliberate arming rather than an incidental copy.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Outlook\Security\Level'
          - '\Outlook\LoadMacroProviderOnBoot'
          - '\Outlook\Today\UserDefinedUrl'
          - '\Outlook\WebView'
          - '\Outlook\Security\EnableUnsafeClientMailRules'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What outbound network connections did outlook.exe make around this time, and are any to unfamiliar external destinations?
  context: An Outlook VBA backdoor can use the mailbox itself as a covert command-and-control and exfiltration channel, or spawn
    a helper that beacons out. Normal Outlook talks to known mail infrastructure; connections to unfamiliar external addresses,
    or on uncommon ports for a mail client, are the fallback-channel signal. Weigh destination, port, and the volume of data
    sent versus received when judging whether a connection looks like beaconing or exfiltration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\outlook.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: A process that stages one macro backdoor often touches several files — a downloaded payload, a copy source, a registry
    export, or additional profile artifacts. The breadth, paths, and extensions of the responsible process's other file activity
    distinguish a single deliberate copy from a wider deployment and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Outlook profile directory recently, and by which processes?
  context: The Outlook profile directory is normally written only by outlook.exe. Other recent arrivals in the same directory,
    or writes by unexpected processes, reveal whether this is an isolated drop or a location under active use — and surface
    additional artifacts (replaced OTM copies, staged payloads) that belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Outlook\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has VbaProject.OTM been written on this host before, or is this the first time?
  context: A macro project file that has never appeared on a host is more suspicious than one that is part of an established
    workflow. A first-time write — especially by a process other than outlook.exe — indicates newly deployed persistence rather
    than routine macro development. Very low historical counts point to a rare or novel event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of a non-Outlook
    process writing VbaProject.OTM (not generic Outlook use), aggregated by host. A user who has never produced this pattern
    is more suspicious than one who does so regularly; weigh the count against whether this user develops or deploys Outlook
    macros as part of their role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      filter:
        Image|endswith: \outlook.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the
    program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result
    is the 90-day history of this program writing VbaProject.OTM as a non-Outlook process. A new or rare program for this pattern
    is the deviation worth chasing; a program that already accounts for many prior events is more likely vendor or management
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      filter:
        Image|endswith: \outlook.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the macro deployment is isolated or part of broader
    account activity. If the same user drove similar file writes or tool executions on multiple hosts in the same window, the
    scope of compromise may be larger than a single mailbox.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern write VbaProject.OTM on other hosts in the same window, or is it isolated to
    this host?
  context: Under a service or machine account, user-wide activity returns agent noise. The meaningful question is whether the
    same launch mechanism produced this file elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scripted or pushed deployment; a
    single host points to a host-local action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \Microsoft\Outlook\VbaProject.OTM
      filter:
        Image|endswith: \outlook.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence is usually installed after an initial foothold. Earlier detections on the same host — phishing-borne
    execution, script activity, credential access, or defense tampering — may reveal the stages that preceded the macro deployment
    and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
