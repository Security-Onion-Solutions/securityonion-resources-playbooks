- question: Which evasion flags and which suspicious-folder references are present in this command line?
  context: 'The rule combines two tunable element sets: engine and bypass flags (-ep bypass,
    -ExecutionPolicy bypass, -w hidden, /e:javascript, /e:Jscript, /e:vbscript) and low-trust folder
    references (Temp, Public, Perflogs, Startup, and per-user profile folders such as Documents,
    Pictures, Contacts, and Favorites). Identify exactly which flags and which folder the alerting
    command line contains. A hidden-window or ExecutionPolicy-bypass flag combined with a script staged
    in a profile or Temp folder indicates deliberate concealment, whereas a single engine selector
    against a vendor install path is closer to routine software behavior. This query re-displays the
    triggering event so the analyst can read the exact flag and folder substrings.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
