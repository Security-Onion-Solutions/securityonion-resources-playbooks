      selection_proc_original:
        OriginalFileName:
        - cscript.exe
        - mshta.exe
        - wscript.exe
      selection_folders_1:
        CommandLine|contains:
        - :\Perflogs\
        - :\Users\Public\
        - \%Public%
        - \AppData\Local\Temp
        - \AppData\Roaming\Temp
        - \Temporary Internet
        - \Windows\Temp
        - \Start Menu\Programs\Startup\
        - '%TEMP%'
        - '%TMP%'
        - '%LocalAppData%\Temp'
      selection_folders_2:
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
