name: Windows Shell/Scripting Application File Write to Suspicious Folder
id: 099281f3-ce2c-4e52-967a-d49f9f91e259
description: |
  Detects a Windows shell, script host, or scripting utility writing a file into a folder that is
  writable by any user and sits outside per-user profiles. The rule fires on either of two branches:
  a shell or script host (bash.exe, cmd.exe, cscript.exe, msbuild.exe, powershell.exe, pwsh.exe,
  sh.exe, wscript.exe) writing to a path that starts with C:\PerfLogs\ or C:\Users\Public\, or a
  scripting utility (certutil.exe, forfiles.exe, mshta.exe, schtasks.exe, scriptrunner.exe,
  wmic.exe) writing to any path containing C:\PerfLogs\, C:\Users\Public\, or C:\Windows\Temp\.
  These folders are also used routinely by installers, backup jobs, and IT deployment scripts, so
  the write alone does not separate the two. This is the delivery or staging step of an interpreter
  workflow; the investigation should establish which branch fired, what operation the writing
  process was performing, what the file contains, and whether the written file was later executed.
type: detection
detection_id: 1277f594-a7d1-4f28-a2d3-73af5cbeab43
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Did this write come from either a shell or script host targeting C:\PerfLogs\ or
    C:\Users\Public\, or from a scripting utility targeting a path containing those folders or
    C:\Windows\Temp\?
  context: >-
    Confirm the alert against the rule's two branches and note which one fired. The first branch
    covers bash.exe, cmd.exe, cscript.exe, msbuild.exe, powershell.exe, pwsh.exe, sh.exe, and
    wscript.exe writing to paths that start with C:\PerfLogs\ or C:\Users\Public\; the second
    covers certutil.exe, forfiles.exe, mshta.exe, schtasks.exe, scriptrunner.exe, and wmic.exe
    writing to any path containing C:\PerfLogs\, C:\Users\Public\, or C:\Windows\Temp\. The branch
    determines which downstream questions carry weight: an interpreter branch fire makes
    command-line decoding and script content the load-bearing evidence, while a utility branch fire
    points at the decode, download, or task-registration behavior of that specific tool, and a
    C:\Windows\Temp\ destination is far more routine than C:\PerfLogs\. The signer columns are
    context for judging whether the writing process is coherent with the file it touched, not a
    verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: >-
    Is this user and host expected to write files into C:\PerfLogs\, C:\Users\Public\, or
    C:\Windows\Temp\ with a shell or scripting binary?
  context: >-
    Software installers, backup jobs, deployment scripts, and vendor tooling all stage files in
    these folders, and a build or admin workstation produces this pattern far more often than a
    general-user endpoint. Knowing whether the user role and host function fit the write is usually
    the fastest way to separate routine operations from a payload drop. When the user is a machine
    or service account, judge by the writing process and host role instead; the signer columns
    attribute that process to a vendor and should be read for coherence with the file being
    written, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still in the
    staging folder can be retrieved, hashed, and analyzed; a file deleted seconds after creation
    points to cleanup or a self-deleting dropper and shifts the investigation to what executed in
    between. Read the operation type on each returned event and compare its timing against the
    original write.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: >-
    What was the full command line of the process that wrote this file, and was any part of it
    encoded or obfuscated?
  context: >-
    The file event names the writing process but not what it was told to do. The command line of
    the writing process places the write inside an operation - a download cradle, a decode step, an
    archive unpack, or a task registration. Base64 (-EncodedCommand or -enc), string concatenation,
    backtick and caret escaping, and environment-variable substitution are the common ways that
    intent is hidden; decode them until the payload is readable. For a certutil.exe write, look for
    -decode or -decodehex with the named source and output files; for a powershell.exe or pwsh.exe
    write, look at what the decoded script fetches and where it saves it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process performed this write, and what spawned it?
  context: >-
    The writing process is named in the alert but its origin is not. Retrieving that process's own
    start event reveals the parent that launched it and the parent's command line. A shell or
    script host started by explorer.exe, a deployment agent, or the task scheduler reads
    differently from one started by an Office application, mshta.exe, or wscript.exe, which points
    to document-borne or script-borne delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What is in the file that was written to this folder?
  context: >-
    Read the file's actual content rather than judging it by name or location. For scripts and text
    files, check for base64 blocks, obfuscated strings, embedded URLs or IP addresses, and
    PowerShell or shell command fragments. For binaries, check imports, embedded strings, packer
    signatures, and signing status. Content retrieval is a manual step on the endpoint or through
    an offline copy; this query confirms the exact path and the process that wrote it so the right
    artifact is pulled.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this file has executed, what is its hash — and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so the write event itself
    carries none. This query looks for the artifact executing on this host either directly as a
    process image or as an argument to an interpreter, and returns the hashes of what ran. On an
    interpreter match the hash belongs to the interpreter, not to the artifact - use the on-disk
    path to hash the artifact itself. Submit the hash to a reputation service or internal threat
    intel; a file that is present but has not executed will not appear here at all, which is itself
    worth noting.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one file into a staging folder often drops several - a dropper unpacking
    components, a tool staging output, or an installer expanding an archive. The breadth, paths,
    and extensions of the writing process's other file activity, and that of its direct children,
    separate a single artifact from a staging operation and enumerate what else needs review. Some
    of these writers are noisy by nature, so read where the writes land rather than counting them.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to these staging folders on this host recently, and by which processes?
  context: >-
    Location drives suspicion for file artifacts. C:\PerfLogs\, C:\Users\Public\, and
    C:\Windows\Temp\ each have a small set of processes that legitimately write there - performance
    collection, installers, and update tooling. Other recent arrivals in the same folders reveal
    whether this is an isolated drop or a location under active use, and which other artifacts
    belong to the same activity. A single unfamiliar writer accounting for many files is the signal
    to follow.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\PerfLogs\'
          - '\Users\Public\'
          - '\Windows\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file with this name been written on this host before?
  context: >-
    A filename that has never appeared on the host is a different proposition from one that is
    rewritten on a schedule by an installer or a logging job. Zero or very low historical counts
    point to a first-time drop; a steady count with the same writing process points to routine
    operation. The writing process column matters as much as the count - the same filename written
    by a new process is still a deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: >-
    When this host has previously produced the rule's pattern, which writer binaries and users
    drove that activity, and does the current alert fit that history?
  context: >-
    Even common interpreters can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting writer/user distribution reflects how the rule's specific firing
    pattern - not generic use of cmd.exe or powershell.exe - has historically run here. A writer
    binary or user account that has never produced this pattern on this host is the deviation worth
    chasing; a large steady count under a service account usually indicates local automation. File
    events carry no parent process, so the acting binary stands in for the parent dimension here.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \msbuild.exe
        - \powershell.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
        TargetFilename|startswith:
        - C:\PerfLogs\
        - C:\Users\Public\
      selection_2:
        Image|endswith:
        - \certutil.exe
        - \forfiles.exe
        - \mshta.exe
        - \schtasks.exe
        - \scriptrunner.exe
        - \wmic.exe
        TargetFilename|contains:
        - C:\PerfLogs\
        - C:\Users\Public\
        - C:\Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - file_event
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific firing pattern - not generic use of the binary,
    which every user produces constantly - aggregated by host. A user who has never staged files
    into these folders with an interpreter is a different proposition from a build engineer or
    administrator who does so weekly. Weigh the count and host spread against the user's role and
    typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \msbuild.exe
        - \powershell.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
        TargetFilename|startswith:
        - C:\PerfLogs\
        - C:\Users\Public\
      selection_2:
        Image|endswith:
        - \certutil.exe
        - \forfiles.exe
        - \mshta.exe
        - \schtasks.exe
        - \scriptrunner.exe
        - \wmic.exe
        TargetFilename|contains:
        - C:\PerfLogs\
        - C:\Users\Public\
        - C:\Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
  always_include: true
- question: >-
    Has this writing program historically produced the rule's pattern on this host or across the
    environment, or is it new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior, and a file event carries no parent to pivot on. The meaningful pivot is the acting
    program: the query mirrors the rule's selection structure scoped to the alerting binary, so the
    result is the 90-day history of this program producing this specific pattern. A program that is
    new or rare for this pattern is the deviation worth chasing; one that already accounts for
    thousands of prior events across many hosts is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \msbuild.exe
        - \powershell.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
        TargetFilename|startswith:
        - C:\PerfLogs\
        - C:\Users\Public\
      selection_2:
        Image|endswith:
        - \certutil.exe
        - \forfiles.exe
        - \mshta.exe
        - \schtasks.exe
        - \scriptrunner.exe
        - \wmic.exe
        TargetFilename|contains:
        - C:\PerfLogs\
        - C:\Users\Public\
        - C:\Windows\Temp\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether the staging
    write is a local event or one step of activity spanning several endpoints. The same user
    driving interpreters on multiple hosts in the same hour points to a broader operation or to a
    scripted rollout. If the alert fired under a machine or service account, this view returns
    routine agent telemetry and the acting-program pivot is the meaningful one instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same program produce this pattern on other hosts in the same window, or is the
    activity isolated to this host?
  context: >-
    Under a machine or service account, asking what else the user did returns agent telemetry from
    every host, and a file event carries no parent to pivot on. The useful question is whether the
    same program staged files into these folders elsewhere: the query mirrors the rule's selection
    structure scoped to the alerting binary, fleet-wide, in the alert window. Multiple hosts in the
    same window points to scheduled or pushed automation; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \msbuild.exe
        - \powershell.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
        TargetFilename|startswith:
        - C:\PerfLogs\
        - C:\Users\Public\
      selection_2:
        Image|endswith:
        - \certutil.exe
        - \forfiles.exe
        - \mshta.exe
        - \schtasks.exe
        - \scriptrunner.exe
        - \wmic.exe
        TargetFilename|contains:
        - C:\PerfLogs\
        - C:\Users\Public\
        - C:\Windows\Temp\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding the write shows
    what led to it and what followed - reconnaissance, credential access, archive utilities, or
    persistence tooling running in the same window change how the staged file should be read. The
    aggregation collapses repetitive agent and service telemetry into high-count rows; novel
    parent-child pairs stand out at low counts and are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Staging a file is a delivery step, and delivery usually follows something. Earlier detections
    on the same host - a document spawning an interpreter, defense tampering, reconnaissance, or a
    download cradle - reveal the stages that preceded this write and help reconstruct the timeline.
    A staging write with no preceding detections and a coherent writing process is more likely
    routine operations.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts produced the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern rather than generic use of the binaries. Many hosts
    producing the same pattern points to scripted deployment or vendor automation that can be
    characterised and tuned; one host, or a small unrelated set, points to manual operator
    activity. Use the host distribution together with the writer-binary consistency to calibrate
    how much weight the alert carries.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \msbuild.exe
        - \powershell.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
        TargetFilename|startswith:
        - C:\PerfLogs\
        - C:\Users\Public\
      selection_2:
        Image|endswith:
        - \certutil.exe
        - \forfiles.exe
        - \mshta.exe
        - \schtasks.exe
        - \scriptrunner.exe
        - \wmic.exe
        TargetFilename|contains:
        - C:\PerfLogs\
        - C:\Users\Public\
        - C:\Windows\Temp\
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - file_event
