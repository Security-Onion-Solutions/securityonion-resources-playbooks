name: HackTool - KrbRelayUp Execution
id: d8264fc3-107c-491b-aefa-f45510b4967c
description: |
  Detects execution of KrbRelayUp, a wrapper that chains Kerberos relay, machine-account
  creation, and Rubeus primitives into a one-shot local privilege escalation on a domain-joined
  Windows host where LDAP signing is not enforced. The rule fires on EITHER the tool's image
  name or original filename, OR one of several command-line argument combinations for its relay,
  krbscm, or spawn subcommands. Because the tool coerces the local machine account to authenticate
  to itself, relays the ticket to write a control primitive on the local computer object, then
  installs a SYSTEM-spawning service, the investigation must determine which subcommand ran,
  whether a privileged service or new machine account was created, and whether stolen tickets
  were subsequently used to reach other hosts. Confirm whether the activity is an authorized
  security assessment before escalating.
type: detection
detection_id: 12827a56-61a4-476a-a9cb-f3068f191073
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line match KrbRelayUp execution by image name or by one of its subcommand argument patterns?
  context: >-
    The rule fires when EITHER the image name or original filename is KrbRelayUp.exe, OR the
    command line contains one of the subcommand argument sets — relay with -Domain and -ComputerName,
    OR krbscm with -sc, OR spawn with -d, -cn, and -cp. Confirm which branch matched, because the
    subcommand determines what the tool did: relay writes the AD control primitive, spawn installs
    the SYSTEM service, krbscm reuses an existing ticket. Review the full command line and image
    details against these criteria before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run domain privilege-escalation tooling?
  context: >-
    Legitimate administrative activity rarely involves running a Kerberos-relay privilege-escalation
    tool. Knowing whether the account and host function are consistent with security testing or
    administrative tooling is often the fastest way to separate an authorized assessment from a
    genuine intrusion on a domain-joined endpoint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this KrbRelayUp execution part of an authorized penetration test or red team engagement?
  context: >-
    Kerberos-relay and privilege-escalation tools are used in authorized security assessments.
    Before investing investigation time, check whether a pentest or red team exercise is currently
    active on this host or network segment. An authorized engagement with matching tool usage and
    timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Kerberos primitive and identity were targeted by this execution?
  context: >-
    The subcommand and flags determine what was written and which identity was abused. A relay run
    writes either msDS-AllowedToActOnBehalfOfOtherIdentity (resource-based constrained delegation)
    or msDS-KeyCredentialLink (shadow credentials) on the local computer object, and may create a
    new machine account (default KRBRELAYUP$). The spawn phase requests a service ticket impersonating
    a chosen local administrator (default Administrator). Decode the -m method, -cn / -cp account
    options, and -i impersonated principal to determine which accounts and computer object were affected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which KrbRelayUp subcommand was invoked, and was it a full chain or a single stage?
  context: >-
    The tool exposes distinct subcommands - full runs relay and spawn end-to-end, relay performs only
    the auth coercion and attribute write, spawn consumes a prior relay primitive to install the SYSTEM
    service, and krbscm installs the service from a ticket already in the credential cache. The chosen
    subcommand reveals whether escalation completed on this host or only one stage ran, which determines
    the scope of potential compromise and required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this tool and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. A privilege-escalation tool launched from
    an interactive shell, a remote-execution service, or an Office or script-host parent points to
    hands-on-keyboard or relayed execution; a parent tied to a known build or test harness points
    toward authorized activity. Walk up the chain to see what invoked the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this process write files associated with ticket handling or service installation on the host?
  context: >-
    The tool and its embedded primitives can drop or read artifacts during operation - exported or
    imported ticket files, certificate material for the shadow-credential and certificate-services
    paths, and service-related artifacts from the local Service Control Manager install. File creation
    events from the tool's process confirm execution and reveal the scope of activity even after the
    process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run here, not generic
    binary usage. For a tool of this kind, prior fires are most often security testing; a new parent
    process, an unexpected account, or a first-ever appearance on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelayUp.exe
      - OriginalFileName: KrbRelayUp.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' relay '
        - ' -Domain '
        - ' -ComputerName '
      selection_cli_2:
        CommandLine|contains|all:
        - ' krbscm '
        - ' -sc '
      selection_cli_3:
        CommandLine|contains|all:
        - ' spawn '
        - ' -d '
        - ' -cn '
        - ' -cp '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Did this process load Kerberos or authentication libraries consistent with ticket request and injection?
  context: >-
    The tool's relay and spawn stages perform Kerberos PKINIT, S4U2Self, and ticket substitution
    in-process, which loads the system Kerberos and security-package libraries. Image-load events
    for these modules from the tool's process corroborate ticket-handling behavior that the
    command-line view alone cannot confirm. If image-load telemetry is not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_kerberos:
        ImageLoaded|endswith:
          - '\kerberos.dll'
          - '\secur32.dll'
          - '\sspicli.dll'
          - '\netapi32.dll'
      condition: selection and filter_kerberos
    fields:
      - ImageLoaded
      - Image
- question: Did this process, or a process it launched, write ticket or credential material to disk as part of the relay or spawn chain?
  context: >-
    Reading or importing Kerberos ticket material out of the local security authority subsystem is not
    directly observable in this environment — there is no cross-process handle-open telemetry available,
    so a zero result here is not evidence that ticket extraction or injection did not happen, only that it
    did not also leave a file. What can be observed is the artifact this activity commonly leaves behind:
    an exported .kirbi or ccache ticket file, or another artifact written by the tool's process or a process
    it spawned. A hit here corroborates in-memory ticket handling that the process-creation and network
    views alone cannot confirm.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were anomalous Kerberos service-ticket requests recorded on the domain controller around this event?
  context: >-
    The tool requests service tickets as part of the spawn phase and may trigger ticket requests using
    weak encryption. Service-ticket request events that use RC4 encryption (etype 0x17), target the local
    host's service principals, or arrive in an unusual burst for the involved account corroborate the
    Kerberos abuse. Review the requesting account, the targeted service name, and the ticket encryption
    type; if security event collection from domain controllers is not in place, treat zero results as a
    visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4769
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - TicketEncryptionType
      - IpAddress
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What authentication method backed this activity - relayed Kerberos coercion or reused credentials?
  context: >-
    This technique abuses Kerberos rather than presenting a password - it coerces the local machine
    account to authenticate to itself and relays the resulting ticket, then uses S4U2Self to obtain a
    privileged service ticket. Distinguishing this relayed-Kerberos path from ordinary credential use
    reveals how the privileged context was obtained. Correlating with domain logon and ticket events
    shows whether interactive logon was absent while privileged tickets appeared.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: Has this host or user account connected to other hosts using stolen ticket material?
  context: >-
    A privileged ticket obtained on this host can be reused to authenticate to other systems without a
    password. If the same account is moving to multiple systems within a short window, the scope of
    compromise is larger than a single endpoint. Connections to many hosts from this source point to
    active lateral movement following the escalation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: What else did this user account do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the escalation is isolated or part
    of broader movement. If the same account triggered similar activity on multiple endpoints in the same
    window, the scope of compromise may be larger. When the alert fires under a machine or service principal,
    the parent-and-binary pivot is the meaningful view rather than this account-wide query.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelayUp.exe
      - OriginalFileName: KrbRelayUp.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' relay '
        - ' -Domain '
        - ' -ComputerName '
      selection_cli_2:
        CommandLine|contains|all:
        - ' krbscm '
        - ' -sc '
      selection_cli_3:
        CommandLine|contains|all:
        - ' spawn '
        - ' -d '
        - ' -cn '
        - ' -cp '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic usage of the binary. Many hosts firing the same
    pattern points to a scripted deployment or a sanctioned assessment sweep; one host or a small unrelated
    set points to targeted operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \KrbRelayUp.exe
      - OriginalFileName: KrbRelayUp.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' relay '
        - ' -Domain '
        - ' -ComputerName '
      selection_cli_2:
        CommandLine|contains|all:
        - ' krbscm '
        - ' -sc '
      selection_cli_3:
        CommandLine|contains|all:
        - ' spawn '
        - ' -d '
        - ' -cn '
        - ' -cp '
      condition: 1 of selection_*
    fields:
    - host.name
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The severity of this escalation depends on the privilege of the accounts involved - the local computer
    object, any newly created machine account, and the impersonated local administrator. Cross-reference the
    impersonated principal and any manufactured machine account against directory group memberships. Domain
    admin or other broadly privileged exposure requires incident escalation; a contained local-only outcome
    may only need monitoring and ticket invalidation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
