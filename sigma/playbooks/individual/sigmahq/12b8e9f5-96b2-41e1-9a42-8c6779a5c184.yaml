name: Potentially Suspicious Execution Of PDQDeployRunner
id: 0e9433f3-8231-4864-bb0d-f3c2b59523e3
description: |
  Detects PDQDeployRunner (the component of the PDQ Deploy software-deployment stack that runs commands and packages on remote machines) spawning a child that either has a name in a set of commonly abused interpreters and LOLBins, or runs from a user-writable staging directory, or carries a command line with download, encoding, or in-memory execution markers. Legitimately, PDQDeploy pushes installers and maintenance scripts fleet-wide, so administrative use can match this pattern. Abused, the same deployment channel becomes a remote-execution and lateral-movement mechanism for dropping and running tooling across many hosts at once. Determine whether the spawned command is expected deployment content for this environment, decode any encoded or download-bearing arguments, and check whether the same parent-child pattern is spreading across hosts.
type: detection
detection_id: 12b8e9f5-96b2-41e1-9a42-8c6779a5c184
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did PDQDeployRunner spawn a child that matches one of the rule's suspicious branches?
  context: >-
    Confirm the alert before investing time. The rule fires when the parent Image contains
    "\PDQDeployRunner-" AND the child matches at least one branch — its name ends in an
    abused interpreter or LOLBin (bash.exe, certutil.exe, cmd.exe, csc.exe, cscript.exe,
    dllhost.exe, mshta.exe, msiexec.exe, regsvr32.exe, rundll32.exe, scriptrunner.exe,
    wmic.exe, wscript.exe, wsl.exe), OR it runs from a staging path (ProgramData, Users\Public,
    Windows\TEMP, AppData\Local\Temp), OR the command line carries a download/encoding/in-memory
    marker (-decode, -enc, -encodedcommand, -w hidden, DownloadString, FromBase64String, http,
    iex, Invoke-). Note which branch fired — that determines which downstream questions carry the
    most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to receive deployment-driven command execution from PDQDeployRunner?
  context: >-
    Deployment tooling normally runs under a service account on managed endpoints, pushing
    installers and scripts. If the host is in scope for PDQ Deploy and the spawned command is
    routine maintenance content, the alert is likely benign. An unmanaged host, an unexpected
    target, or a command that does not resemble packaged software is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the spawned tool do? Decode its full command line.
  context: >-
    The child's command line reveals the operation pushed through the deployment channel.
    Parse every flag, path, and argument; resolve any download URL, decode base64 or hex content,
    and identify what the interpreter or LOLBin was instructed to run. Multi-step tools may issue
    several sequential invocations on the host within the window, so review the full set rather
    than the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the spawned command line encoded or obfuscated? What does it decode to, and what does the decoded content do?
  context: >-
    Several of the rule's markers point at hidden payloads — certutil -decode of a staged file,
    PowerShell -enc/-encodedcommand base64, FromBase64String reconstruction, DownloadString /
    iex download cradles, and -w hidden execution. Decode the content to its readable form and
    identify the actual intent: a download cradle, an in-memory loader, a reverse shell, or
    credential or data handling. For certutil, identify the encoded source file and the decoded
    output path; iterate decoding when the payload is layered.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What started the PDQDeployRunner parent instance, and is that origin expected?
  context: >-
    The parent-child relationship is the core signal here. PDQDeployRunner is normally launched
    by the PDQ Deploy service stack on the managed endpoint. Tracing the parent's own origin
    (the grandparent) confirms whether the chain is the expected deployment service or an
    unexpected launcher standing in for it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same PDQDeployRunner instance spawn?
  context: >-
    A deployment push that runs one suspicious command often runs several in sequence. Listing the
    other children of this exact parent instance reveals the full set of commands executed through
    this deployment, distinguishing a single installer step from a chain of tooling staged and run
    together.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does PDQDeployRunner on this host normally spawn this child binary?
  context: >-
    PDQ Deploy routinely spawns installer engines (msiexec.exe) and packaged scripts, so some
    parent-child pairings are expected on a managed host. A child binary this parent has never
    or rarely spawned here — an interpreter or LOLBin outside the host's normal deployment
    content — is the discriminator between routine deployment and abuse of the channel.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is this PDQDeployRunner-to-child spawning pattern occurring on other hosts?
  context: >-
    Deployment tooling pushes to many endpoints at once, so the same parent-child pattern landing
    on multiple hosts can be a legitimate fleet-wide rollout — or a single operation distributing
    tooling across the environment through the deployment channel. Cross-host distribution helps
    separate routine packaged deployment from a coordinated push, and shows the scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Does this host normally run the spawned binary at all?
  context: >-
    Independent of the deployment parent, a child binary that has never run on this host is more
    notable than one that runs regularly. Zero or very low historical counts indicate first-time
    or rare execution of this interpreter or LOLBin on the endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|contains: \PDQDeployRunner-
      selection_child:
      - Image|endswith:
        - \bash.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      - Image|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\TEMP\
        - \AppData\Local\Temp
      - CommandLine|contains:
        - ' -decode '
        - ' -enc '
        - ' -encodedcommand '
        - ' -w hidden'
        - DownloadString
        - FromBase64String
        - http
        - 'iex '
        - Invoke-
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|contains: \PDQDeployRunner-
      selection_child:
      - Image|endswith:
        - \bash.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      - Image|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\TEMP\
        - \AppData\Local\Temp
      - CommandLine|contains:
        - ' -decode '
        - ' -enc '
        - ' -encodedcommand '
        - ' -w hidden'
        - DownloadString
        - FromBase64String
        - http
        - 'iex '
        - Invoke-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this account do across the network around this time?
  context: >-
    Tracking the owning account's activity across all hosts in the window reveals whether the
    execution is isolated or part of broader movement. The same account triggering similar activity
    on multiple endpoints widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|contains: \PDQDeployRunner-
      selection_child:
      - Image|endswith:
        - \bash.exe
        - \certutil.exe
        - \cmd.exe
        - \csc.exe
        - \cscript.exe
        - \dllhost.exe
        - \mshta.exe
        - \msiexec.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \scriptrunner.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      - Image|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\TEMP\
        - \AppData\Local\Temp
      - CommandLine|contains:
        - ' -decode '
        - ' -enc '
        - ' -encodedcommand '
        - ' -w hidden'
        - DownloadString
        - FromBase64String
        - http
        - 'iex '
        - Invoke-
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining what ran on the host just before and after the
    deployment-driven execution reveals the immediate context — what staged it, what followed, and
    whether reconnaissance, privilege escalation, or persistence accompanied it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the stages that preceded a deployment-channel execution and help reconstruct the
    timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host around the same time?
  context: >-
    A deployment channel that runs tooling on a remote host can also be used to plant persistence.
    After the detected execution, check for scheduled tasks, services, registry Run-key writes,
    BITS jobs, or WMI subscriptions installed in the same timeframe. Several persistence
    installations clustered together indicate intentional stacking rather than an isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
