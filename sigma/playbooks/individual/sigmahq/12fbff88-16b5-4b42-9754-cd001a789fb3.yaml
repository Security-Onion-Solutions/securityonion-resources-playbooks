name: CodePage Modification Via MODE.COM To Russian Language
id: d5fa50e9-c7d8-4f51-a417-169cc10ffa75
description: |
  Detects use of the mode.com utility to change the console code page to a Cyrillic
  encoding (1251 or 866) via the "con cp select=" subcommand. The rule fires when the
  process is mode.com (by Image suffix or OriginalFileName) AND the command line contains
  ' con ', ' cp ', and ' select=' AND ends with =1251 or =866.
  Setting the console code page to a Cyrillic value is sometimes done by ransomware staging
  scripts so operator-supplied or ransom-note text renders correctly, and the change often
  sits next to shadow-copy deletion and persistence writes; it can also be a legitimate action
  by a Russian-speaking user adjusting their console encoding. Determine whether the code-page
  change is an isolated user action or part of a destructive sequence on the host.
type: detection
detection_id: 12fbff88-16b5-4b42-9754-cd001a789fb3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show mode.com setting the console code page to a Cyrillic value?
  context: Confirm the alert is a true positive by reviewing the exact command line and process
    details against the rule's criteria — the process is mode.com (by path or embedded
    OriginalFileName) and the command line carries ' con ', ' cp ', ' select=' and ends in
    =1251 or =866. Note which Cyrillic code page was selected, as 1251 is the Windows ANSI
    Cyrillic value and 866 is the OEM Russian value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user/host expected to change the console code page to a Cyrillic encoding?
  context: A console-locale change to Cyrillic on a system whose installed locale is something
    else is the anomaly. If the user is a Russian-speaking operator working in a Cyrillic
    console, this can be routine; if the host's locale and the user's role have no Cyrillic
    relationship, the change is harder to explain and warrants tracing the surrounding activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this mode.com invocation do? Decode the code-page selection and any adjacent arguments.
  context: The full command line reveals which code page was selected and how the command was
    formed. Decode the select= value and confirm it targets a Cyrillic page (1251 ANSI or 866
    OEM). Because a single staging script may issue mode.com more than once, this scopes to all
    mode.com executions on the host in a short window so multiple sequential invocations that form
    one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' select='
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the actual identity of this binary based on its metadata and hash?
  context: mode.com is a Microsoft-signed system binary, so the embedded OriginalFileName should
    read MODE.COM and the Image should sit under the system directory. Compare the Image path on
    disk against OriginalFileName to confirm this is the real utility and not a renamed binary
    masquerading as it, and submit the file hash for reputation checking to rule out a replaced
    or trojanized copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this mode.com binary arrive on the host, and is it running from the expected system directory?
  context: The legitimate utility ships with the OS under the system directory. If a file named
    mode.com was written to a user-writable location (Temp, AppData, Downloads, Desktop) or
    replaced in place, the file-creation event names the process that dropped it — a download tool,
    an archive extractor, a remote-admin copy, or a dropper. A binary in its canonical system path
    points to the genuine OS tool rather than a planted copy.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did mode.com spawn after execution, and is the same invocation present on other hosts?
  context: A console code-page change is a preparatory step rather than an end in itself. Examine
    any child processes of mode.com to see what followed, and check whether the same code-page
    invocation appears on other hosts, which would suggest a scripted rollout rather than an
    isolated action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned mode.com and is that parent chain expected?
  context: The parent process reveals how the code-page change was driven. A cmd.exe parent that
    issued the command as part of a batch script, especially one spawned in turn from an
    unexpected process, differs sharply from an interactive shell a user typed the command into.
    Walk up the chain to see what launched the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did shadow-copy deletion or recovery-inhibition commands run on this host near the code-page change?
  context: A Cyrillic console code-page change is sometimes issued by a script immediately before
    recovery-inhibition steps such as deleting volume shadow copies, disabling boot recovery, or
    clearing the backup catalog. Finding these commands in the same window on the same host moves
    the disposition from a benign locale change toward pre-encryption staging and is a high-value
    pivot for prioritization.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_recovery:
        - CommandLine|contains|all:
            - 'vssadmin'
            - 'delete'
            - 'shadows'
        - CommandLine|contains|all:
            - 'wmic'
            - 'shadowcopy'
            - 'delete'
        - CommandLine|contains:
            - 'bcdedit'
            - 'wbadmin delete'
            - 'Delete-ShadowCopy'
            - 'recoveryenabled no'
      condition: selection_host and selection_recovery
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Does this host normally run mode.com to change the console code page?
  context: A code-page change via mode.com that has never been seen on this host is more suspicious
    than one that recurs as part of routine operations. Zero or very low historical counts indicate
    first-time or rare execution of this pattern on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' select='
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even a routine utility can be abused. This query mirrors the rule's selection structure
    scoped to this host, so the resulting parent/user distribution reflects how this specific
    code-page-change pattern (not generic mode.com usage) has historically run here. A new parent
    process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mode.com
      - OriginalFileName: MODE.COM
      selection_cli:
        CommandLine|contains|all:
        - ' con '
        - ' cp '
        - ' select='
        CommandLine|endswith:
        - =1251
        - =866
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this code-page-change pattern (not generic mode.com usage). Many hosts firing
    the same pattern points to scripted deployment or imaging; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mode.com
      - OriginalFileName: MODE.COM
      selection_cli:
        CommandLine|contains|all:
        - ' con '
        - ' cp '
        - ' select='
        CommandLine|endswith:
        - =1251
        - =866
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mode.com
      - OriginalFileName: MODE.COM
      selection_cli:
        CommandLine|contains|all:
        - ' con '
        - ' cp '
        - ' select='
        CommandLine|endswith:
        - =1251
        - =866
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mode.com
      - OriginalFileName: MODE.COM
      selection_cli:
        CommandLine|contains|all:
        - ' con '
        - ' cp '
        - ' select='
        CommandLine|endswith:
        - =1251
        - =866
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    action across multiple endpoints. If the same user triggered similar activity on other hosts,
    the scope of the event may be larger than a single console-locale change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \mode.com
      - OriginalFileName: MODE.COM
      selection_cli:
        CommandLine|contains|all:
        - ' con '
        - ' cp '
        - ' select='
        CommandLine|endswith:
        - =1251
        - =866
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the code-page change reveals
    the immediate context: what led to it, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, persistence writes to the Startup folder, or file-encryption
    activity surrounding the event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the stages that preceded this event and help reconstruct the full timeline.
    A code-page change that sits at the tail of a chain of prior alerts reads very differently from
    one that fires with no surrounding detections.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
