name: Potential Winnti Dropper Activity
id: 017efb9d-f384-433c-af25-7ca52c123519
description: |
  Fires when a file is written whose path ends in gthread-3.6.dll, sigcmm-2.4.dll, or
  \Windows\Temp\tmp.bat — three artifact names produced by a Winnti dropper stage. The two DLL names
  imitate common open-source runtime libraries (GLib's gthread and libsigc++'s sigcmm) at versions
  those projects never shipped, so a loader that side-loads them from an application directory reads
  as ordinary dependency loading; the batch file under the Windows Temp directory carries staged
  commands for the next step. The filename match alone says nothing about the file's contents, so the
  investigation is to establish which process wrote the artifact and what launched that process,
  whether the file was later loaded or executed, what else the writer put on disk in the same window,
  and whether the same names appear on other hosts.
type: detection
detection_id: 130c9e58-28ac-4f83-8574-0a4cc913b97e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the written path end in gthread-3.6.dll, sigcmm-2.4.dll, or \Windows\Temp\tmp.bat, and which
    process performed the write?
  context: >-
    The rule matches on the file path ending in any one of the three names and on nothing else, so
    confirm the exact full path, the operation performed (created, modified, renamed), and the
    responsible process before spending further time. The directory the artifact landed in is as
    informative as the name — a DLL name next to an application's own executable points at
    side-loading, while the same name in a download or archive-extraction directory points at
    delivery. Read the signer columns for coherence with the file being written, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to have a runtime library or a batch file written under these names and locations?
  context: >-
    A developer workstation, a build agent, or a host running an application that genuinely bundles
    GLib or libsigc++ can produce nearby library names as part of an install or update, and
    administrative tooling routinely stages batch files in the Windows Temp directory. Knowing whether
    this host has such a role, and whether the account shown is a person, a machine account, or a
    service principal, is usually the fastest way to separate an install from a drop. Where the
    account is a machine or service identity, judge by the writing process and the host's role rather
    than the name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    A dropper stage often removes its own staging artifacts once the next stage is running, and a
    batch file in the Windows Temp directory is the most common thing to disappear that way. A file
    still on disk can be retrieved, hashed, and examined; a deletion within seconds or minutes of the
    creation moves the investigation to what ran in between, since the payload itself is gone.
    Interpret the results by the operation recorded on each event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Retrieve the file and examine its contents — is it the library or batch script its name implies, or a packed payload?
  context: >-
    The rule fires on the name, not on the contents, so reading the file is what settles it. For the
    DLL names, compare against the real GLib and libsigc++ builds — check the export table, the
    embedded version resource, the signing status, and the section entropy; a high-entropy or
    packed section, a near-empty export table, or a version string that does not correspond to any
    published release separates a loader stub from a genuine runtime library. For the batch file,
    read it directly and look for base64 blobs, character concatenation, embedded URLs or IP
    addresses, and calls into rundll32 or regsvr32 that name the dropped DLLs. The query lists the
    file events for this artifact on this host so the on-disk path and the writing process are known;
    the content itself has to be pulled from the endpoint and examined in an isolated environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this artifact has executed, what is its hash, and is it known to reputation or threat-intel sources?
  context: >-
    A file-creation event carries no hash — the hash is recorded when the file runs. This query looks
    for the artifact executing on this host in the hour either side of the write, either directly as
    the image or named on the command line of an interpreter, which is how the batch file would run.
    On an interpreter match the hash shown belongs to the interpreter, not to the artifact, so take
    the artifact's hash from its on-disk path instead. A file that was written but never executed
    produces no rows here and must be hashed manually from the path.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Was the dropped DLL subsequently loaded into a process, and which process loaded it?
  context: >-
    A dropped library only matters once something loads it, and the load event is where a DLL's hash
    and signing status are recorded. The loading process names the delivery path — an application
    loading a library from its own directory indicates side-loading against that application's search
    order, whereas rundll32 or regsvr32 loading it indicates a direct invocation. This leg applies to
    the DLL artifacts; for the batch-file branch of the rule there is no load event and the execution
    evidence is a command interpreter process instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - Hashes
  answer_sources:
  - image_load
  - process_creation
- question: Which process wrote this file, and what launched that process?
  context: >-
    The file event names the writing process but not its origin, and the origin is what distinguishes
    an installer or update service from a dropper. Retrieving the writer's own creation event returns
    its command line and its parent. An installer, a package manager, or a servicing process started
    by services.exe writes libraries as part of its job; a script host, a command interpreter, an
    Office application, an archive utility, or a signed system binary being used as a writer points at
    delivery, and any such parent should be treated as the next link to follow rather than the end of
    the chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Is the writing process's command line encoded or obfuscated, and what does the decoded content do?
  context: >-
    When a drop is delivered by a script or a command interpreter, the command line that produced it
    is often the only surviving record of the delivery step. Look for base64 under -EncodedCommand or
    -enc, hex strings, URL encoding, character concatenation through Chr() or String.fromCharCode,
    backtick escaping, environment-variable substitution, and double encoding; certutil -decode and
    -decodehex name their source and output files directly, which ties the command straight to the
    dropped path. Decode iteratively until the content is readable — download cradles, in-memory
    loaders, and the follow-on invocation of the dropped artifact all resolve at this layer. A
    compiled writer with no arguments produces nothing to decode here, and the file contents become
    the evidence instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A dropper stage rarely writes a single file. The rule names three artifacts that belong to one
    sequence, so the writer's other file activity is where the remaining components are enumerated —
    a second library, a configuration or key blob, an encrypted stage, or the deletion of a staging
    file once it has served its purpose. The correlation covers the writing process and its direct
    children, since droppers commonly delegate the writes. Read the results for where the writes land
    and what extensions they carry rather than for volume alone.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the Windows Temp directory on this host recently, and by which processes?
  context: >-
    The Windows Temp directory is the staging location the rule pins for the batch-file artifact. It
    has a small set of processes that legitimately write there — servicing, installers, and management
    agents running as SYSTEM — so other recent arrivals attributed to an unfamiliar writer identify
    the rest of the staged set and the account behind it. A single writer accounting for several
    unrelated new files in this directory is the pattern to follow. This query does not cover the DLL
    artifacts, whose paths the rule leaves unconstrained; use the directory shown on the alert's own
    file event for those.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file with this name been written on this host before?
  context: >-
    A name that has never appeared on the host over 90 days is a first arrival and there is no
    installed-software history to explain it. A count in the tens or hundreds, spread evenly and
    attributed to a single installer or update process, points instead at an application that
    genuinely ships a library by this name and should be identified so the pattern is understood
    rather than re-triaged. Read the writing process alongside the count — the same name written by a
    different process than before is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file with this name been written on any other hosts in the environment?
  context: >-
    Matching the same artifact name across hosts separates a single targeted drop from distribution.
    Several hosts receiving the name within a short window points at a push mechanism — a deployment
    tool, a logon script, an administrative share write, or a service pushing to its endpoints — and
    the writing process shown for each host names it. One host only keeps the investigation local, and
    the paths recorded per host indicate whether the same application directory is being targeted
    everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is its 90-day history
    of writing these specific names rather than generic file activity, aggregated by host. An account
    with no prior history of it is the deviation worth chasing. On file events the account is
    frequently a machine account or SYSTEM because the write was performed by a service, in which case
    this pivot attributes little and the acting-program history is the more informative reading.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \gthread-3.6.dll
        - \sigcmm-2.4.dll
        - \Windows\Temp\tmp.bat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically written these names on this host or across the environment, or is it new for this activity?
  context: >-
    A file event carries no parent to pivot on, so when the account is a service principal the acting
    program is the attributable dimension. The query mirrors the rule's selection scoped to the
    alerting writer, giving the 90-day history of that program producing these specific names rather
    than its general file activity. A writer that is new or rare for this pattern is the deviation; a
    writer already accounting for a long run of prior events is an installer or update mechanism that
    ships a library by one of these names and should be identified.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \gthread-3.6.dll
        - \sigcmm-2.4.dll
        - \Windows\Temp\tmp.bat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the
    same identity was working on other endpoints, which is how a drop on one host is connected to
    staging or lateral movement on another. Where the account is SYSTEM, a machine account, or another
    service principal, this returns agent telemetry from across the fleet and answers little on its
    own — read it for hosts that stand out rather than for totals, and rely on the acting-program
    pivot for attribution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program write these names on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting writer, fleet-wide, in the alert
    window. Several hosts producing the pattern at once points at scheduled or pushed automation and
    moves the question to what drives that mechanism; a single host points at a host-local trigger and
    keeps the investigation anchored to this endpoint. Read this together with the account-wide
    clustering rather than instead of it — they degenerate under different conditions.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \gthread-3.6.dll
        - \sigcmm-2.4.dll
        - \Windows\Temp\tmp.bat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A drop sits somewhere in a sequence, and the processes running either side of it name the steps
    before and after — the delivery vector that wrote the file, and the loader, interpreter, or
    scheduling call that consumed it. The aggregation by image and parent collapses the repetitive
    agent and service telemetry into single high-count rows so that novel parent-child pairings stand
    out at low counts; those low-count rows are what to read.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A dropper stage is an outcome of an earlier step, not a beginning. Detections on the same host in
    the preceding hours — an exploited service, a script host launched from a document, an archive
    extraction, defense tampering, or reconnaissance — indicate how the writer came to be running and
    let the timeline be reconstructed from the first observable step. Their absence does not clear the
    alert; it may mean the earlier stages produced no detection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
