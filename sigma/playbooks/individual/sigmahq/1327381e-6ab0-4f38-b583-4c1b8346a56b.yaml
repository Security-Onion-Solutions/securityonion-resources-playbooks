name: Potential Command Line Path Traversal Evasion Attempt
id: d2f5bfae-5e97-4418-b4fa-5d61bd818284
description: |
  Detects command lines that use bogus relative path traversal — sequences like \..\Windows\, \..\System32\, \..\..\, or .exe\..\ — to obscure the real resolved path of an executable or argument. The traversal cancels out to a legitimate path at runtime while making the literal command line look benign or breaking path-based detections. This fires when EITHER a process under \Windows\ carries a traversal token in its command line OR any command line contains the .exe\..\ pattern, and no known-benign launcher (Google Drive sync, Citrix virtual smart card) accounts for it. Investigate to determine what the traversal resolves to, whether the obscured execution is a renamed or misplaced binary, and whether the obfuscation precedes further hands-on activity.
type: detection
detection_id: 1327381e-6ab0-4f38-b583-4c1b8346a56b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain a bogus path-traversal sequence that this rule flags, and which branch fired?
  context: Confirm the alert by reading the exact command line. The rule fires on EITHER a process whose Image is under \Windows\ with a command-line token of \..\Windows\, \..\System32\, or \..\..\, OR any command line containing .exe\..\ — and neither the Google Drive sync nor Citrix virtual smart card launcher exclusion applies. Note which branch matched, because the .exe\..\ branch (any binary) and the \Windows\ branch (a system-located process) point investigation in different directions. Resolve the traversal by hand to see the real target path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run processes with relative path-traversal command lines?
  context: Legitimate software occasionally builds paths with relative traversal, but most administrative and user activity uses clean absolute paths. Knowing whether this user role and host function routinely produce traversal-laden command lines is often the fastest way to separate a packaged installer or vendor launcher from operator obfuscation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the path traversal in this command line actually resolve to, and what is the full intended operation?
  context: Resolve every \..\ sequence to its canonical path and decode the remaining flags, arguments, and any referenced files. The traversal is used to make the literal text look benign or to defeat path-based detections; the resolved path reveals which binary or resource is really being invoked. The query returns all traversal-bearing command lines from this host in a tight window so multi-step operations are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - \..\Windows\
          - \..\System32\
          - \..\..\
          - .exe\..\
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this one, and is that parent chain expected for this kind of execution?
  context: The parent process reveals how the obscured command was invoked. Path-traversal obfuscation is commonly produced programmatically — a script host, a document handler, or a downloader assembling the command. A parent like wscript.exe, mshta.exe, or an Office application points toward scripted or macro-driven delivery; explorer.exe or a service host points toward interactive or routine launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What is the true identity of the executed binary based on its embedded metadata and hash?
  context: Path obfuscation hides where a binary really lives; the PE metadata and signing details still describe what it really is. Compare the resolved Image path against OriginalFileName to confirm the binary is what the path implies and not a renamed tool, and check the signing party and signature status to distinguish a Microsoft-signed system binary from a third-party or unsigned one. The file hash enables a reputation lookup to determine whether this is a known-good tool, a known malicious sample, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did the binary behind this command line arrive on the host?
  context: 'A binary invoked through an obscured path was still written to disk somehow — copied, downloaded, extracted, or dropped by a parent process. Tracing the file-creation event for the binary by name reveals the delivery mechanism: a download or extraction tool, a malware dropper, manual copy, or an installer placing it in an expected directory. A creation in a user-writable location (Downloads, Temp, AppData) points toward delivery; creation in a system directory by an installer points toward routine deployment.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this binary do after execution, and did the same binary run on other hosts?
  context: The point of obscuring the path is to carry out the binary's real function while evading path-based scrutiny. Examining the child processes, follow-on command lines, and any file or network activity from this binary reveals its actual objective. The same binary executing on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this binary?
  context: A binary that has never executed on this host is more suspicious than one that runs routinely. Zero or very low historical counts over the window indicate first-time or rare execution and raise the priority of resolving the obscured path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's traversal pattern, what parents and users normally drive it, and does this alert fit?
  context: Even routine software can produce relative-path command lines. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific traversal pattern has historically run here — not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|contains: \Windows\
        CommandLine|contains:
        - \..\Windows\
        - \..\System32\
        - \..\..\
      selection_2:
        CommandLine|contains: .exe\..\
      filter_optional_google_drive:
        CommandLine|contains: \Google\Drive\googledrivesync.exe\..\
      filter_optional_citrix:
        CommandLine|contains: \Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this traversal pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the traversal pattern rather than generic usage of any binary. Many hosts firing the same pattern points to scripted deployment or vendor automation that builds paths with traversal; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|contains: \Windows\
        CommandLine|contains:
        - \..\Windows\
        - \..\System32\
        - \..\..\
      selection_2:
        CommandLine|contains: .exe\..\
      filter_optional_google_drive:
        CommandLine|contains: \Google\Drive\googledrivesync.exe\..\
      filter_optional_citrix:
        CommandLine|contains: \Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\
      condition: 1 of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|contains: \Windows\
        CommandLine|contains:
        - \..\Windows\
        - \..\System32\
        - \..\..\
      selection_2:
        CommandLine|contains: .exe\..\
      filter_optional_google_drive:
        CommandLine|contains: \Google\Drive\googledrivesync.exe\..\
      filter_optional_citrix:
        CommandLine|contains: \Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|contains: \Windows\
        CommandLine|contains:
        - \..\Windows\
        - \..\System32\
        - \..\..\
      selection_2:
        CommandLine|contains: .exe\..\
      filter_optional_google_drive:
        CommandLine|contains: \Google\Drive\googledrivesync.exe\..\
      filter_optional_citrix:
        CommandLine|contains: \Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user produced similar execution on several hosts in the window, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        Image|contains: \Windows\
        CommandLine|contains:
        - \..\Windows\
        - \..\System32\
        - \..\..\
      selection_2:
        CommandLine|contains: .exe\..\
      filter_optional_google_drive:
        CommandLine|contains: \Google\Drive\googledrivesync.exe\..\
      filter_optional_citrix:
        CommandLine|contains: \Citrix\Virtual Smart Card\Citrix.Authentication.VirtualSmartcard.Launcher.exe\..\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in a tight window around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Aggregating by Image and ParentImage collapses repetitive telemetry into high-count rows while novel parent-child pairs stand out at low counts. The correlation window between the obscured execution and surrounding process or service activity is what ties the stages together.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded this evasion attempt and help reconstruct the timeline. Obfuscation often wraps a step in a longer sequence rather than standing alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
