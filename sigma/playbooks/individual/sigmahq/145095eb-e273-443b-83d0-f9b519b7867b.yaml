name: PDF File Created By RegEdit.EXE
id: ac08e358-c32e-4e5d-a3f9-720c896d5e04
description: |
  Detects regedit.exe writing a file with a .pdf extension, which corresponds to using the registry
  editor's print / save-as-PDF path to export a registry key or hive to a human-readable document.
  This is a low-signal way to stage registry contents — including credential-bearing hives such as
  SAM, SECURITY, SYSTEM, and LSA secrets — for offline extraction, sidestepping monitoring focused on
  reg save and binary hive dumps. Legitimate use is rare (a user documenting a registry view);
  investigation should determine which registry data the PDF contains, whether it covers credential
  material, and whether the same host shows follow-on credential-access or exfiltration activity.
type: detection
detection_id: 145095eb-e273-443b-83d0-f9b519b7867b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path and creating process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact file path, the operation performed (created/deleted/renamed), and the responsible process.
    This rule fires when regedit.exe writes a file whose name ends in .pdf, so verify both the .pdf
    target and that regedit.exe is the writer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to export registry contents to a PDF?
  context: Legitimate administrative activity can trigger this detection, but printing a registry view
    to PDF is uncommon. Knowing whether the user role and host function make registry documentation
    plausible is often the fastest way to separate a true positive from a rare-but-benign operation.
    When the writer is a machine or service account, judge by the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Did the same regedit process also modify registry keys, and in which locations?
  context: The export path in the alert reads registry data, but the same regedit instance may also
    have written keys. This retrieves any registry modifications tied to the alerting process, giving
    the registry key path and value data as structured fields. Modifications under Run/RunOnce,
    security-tool policy paths, or LSA locations reframe the activity from documentation to tampering
    or credential staging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What registry data does this PDF contain, and does it cover credential-bearing hives?
  context: Read the exported document's actual content. Determine which registry hive or key was
    printed and whether it includes credential material — SAM (local account hashes), SECURITY (LSA
    secrets and service-account passwords), SYSTEM (boot-key material), or the LSA control keys. A PDF
    covering these locations indicates the export was staged for offline credential reconstruction
    rather than routine documentation. Content retrieval is manual from the endpoint or a copy of the
    file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the PDF still on disk, or was it deleted or moved after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A PDF still on disk can
    be retrieved and inspected to confirm what registry data it holds; a file deleted or moved shortly
    after creation suggests the export was staged for transfer off-host and then cleaned up, shifting
    the investigation toward exfiltration channels.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the regedit process write or delete around the alert?
  context: A process that exports one registry document often produces several — multiple hive
    exports staged together, or intermediate .reg/.hive files alongside the PDF. The breadth, paths,
    and extensions of the responsible process's other file activity distinguish a single documentation
    action from a bulk registry-staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other PDF files have been written on this host recently, and by which processes?
  context: The rule pins only the .pdf extension, so the comparison point is other PDFs on this host.
    Most PDFs are written by browsers, office suites, and print-to-PDF drivers; additional PDFs written
    by regedit.exe or other unusual processes reveal whether this is an isolated export or a pattern of
    registry data being staged into document form. The aggregation groups by path and writing process
    so an unfamiliar writer stands out.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.pdf'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: Registry-export activity often accompanies direct registry changes — enabling access to a
    hive, disabling a protection, or importing modified keys. Finding other reg.exe or regedit.exe
    write operations from the same host within a short window reveals whether the export was part of a
    broader set of registry manipulations rather than an isolated print action.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host has previously produced a regedit-to-PDF export, what programs and users
    drove it, and does the current alert fit that history?
  context: Even benign tools leave a baseline. This mirrors the rule's selection scoped to this host,
    so the resulting program and user distribution reflects how this specific export pattern has run
    here before — the Image column shows regedit itself, so the account and frequency carry the
    signal. An unexpected user account or a first-ever occurrence is the deviation worth chasing;
    file events lack parent lineage, so pivot to regedit's start event to see what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        TargetFilename|endswith: .pdf
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced a regedit-to-PDF export in the past week, and does the cross-host
    distribution look like automation or isolated activity?
  context: This mirrors the rule's selection with no host scope, giving a fleet-wide count of the same
    export pattern. Many hosts producing the pattern points to scripted or pushed automation; a single
    host or a small unrelated set points to hands-on-keyboard operator activity. Use the host
    distribution to calibrate whether this is a targeted credential-staging step.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        TargetFilename|endswith: .pdf
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced this regedit-to-PDF export pattern, and does that history
    fit their role?
  context: This mirrors the rule's selection scoped to this user, giving the user's 90-day history of
    the export pattern aggregated by host. A user who has never produced this pattern is more notable
    than one who does so regularly. Weigh the count against the user's role and whether registry
    documentation is a plausible part of their work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        TargetFilename|endswith: .pdf
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the regedit-to-PDF export pattern, or is the
    program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute
    behavior; the launch mechanism does. This mirrors the rule's selection scoped to the alerting
    program, giving the 90-day history of that program driving this export pattern, aggregated by
    host. A new or rare program is the deviation worth chasing; a program already accounting for many
    prior events is automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        TargetFilename|endswith: .pdf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the registry export is an
    isolated action or part of broader movement. If the same user drove related activity on multiple
    endpoints in the same window, the scope of the investigation grows beyond the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven export pattern fire on other hosts in the same window, or is it
    isolated to this host?
  context: Under a service or machine account, network-wide user activity returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism produced the export elsewhere.
    This mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \regedit.exe
        TargetFilename|endswith: .pdf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the processes running around the export reveals
    the immediate context — reconnaissance, privilege escalation, or credential-access tooling that
    would place this registry export within a larger operation. Novel parent-child pairs stand out at
    low counts against high-volume routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the attack stages that preceded the registry export and help reconstruct the
    timeline. Registry-to-PDF staging typically sits mid-chain between access and exfiltration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
