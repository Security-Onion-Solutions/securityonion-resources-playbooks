name: Use of UltraVNC Remote Access Software
id: 19dd4791-c837-4b60-ad26-686560a3860d
description: |
  Detects execution of the UltraVNC VNCViewer client, identified by its embedded
  binary metadata (Description, Product, Company, or OriginalFileName). Remote access
  tools like VNC are used legitimately for IT support and administration, but the same
  software can give an operator an interactive command-and-control channel into a host.
  The investigation should determine whether the tool is approved for this environment,
  whether a support session or ticket explains it, where it connects, and whether it
  was dropped to disk and run as part of a larger remote-access chain.
type: detection
detection_id: 145322e4-0fd3-486b-81ca-9addc75736d8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the process metadata match UltraVNC VNCViewer — Description VNCViewer, Product UltraVNC VNCViewer, Company UltraVNC, or OriginalFileName VNCViewer.exe?
  context: The rule fires when any one of these embedded metadata fields identifies the binary as UltraVNC VNCViewer, so a single matching field is enough. Confirm the alert is a true positive by reviewing the event's metadata and noting which field matched, since a renamed-on-disk binary still carries its original VNCViewer.exe metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Company
      - Description
      - Product
- question: Is this user and host expected to run VNC remote access software?
  context: Legitimate VNC usage is common on IT-support hosts, jump boxes, and admin workstations and rare on standard user endpoints. Knowing whether the user role and host function are consistent with running a remote-access client is often the fastest path to separating sanctioned support activity from unauthorized access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is UltraVNC on the organization's approved remote access software list?
  context: Organizations typically sanction a specific remote-access tool for IT support and treat anything else as shadow IT or attacker-deployed access. Even well-known software like UltraVNC should be checked against the approved list regardless of its reputation, since the tool's legitimacy depends on whether this environment authorized it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this VNC access?
  context: Legitimate remote-access usage usually correlates with an active support ticket, a scheduled maintenance window, or a user request. If no support context exists for this session, the tool may have been installed by an operator for persistent interactive access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did the VNCViewer command invoke? Decode the command-line arguments, target host, and any connection or password flags.
  context: The full command line reveals what the viewer was told to do — which host or display it connects to, whether a saved connection file or stored credentials were passed, and whether listen mode was enabled to accept inbound sessions. Decode each argument to understand the direction and target of the remote session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned VNCViewer and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Interactive use typically shows explorer.exe or a shell; a service or autorun parent points to persistence, and script-host or Office-application parents point to scripted or macro-driven deployment. Note what spawned the parent and what else the parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoint is VNCViewer connecting to?
  context: VNC clients establish outbound sessions to the host or relay they control. The destination reveals whether the connection targets an internal host being administered, an expected support relay, or an unfamiliar external address. Connections to arbitrary external IPs, or non-standard high ports outside the usual VNC range, raise the likelihood of an attacker-controlled endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Was the VNCViewer binary recently written to disk on this host, and where did it land?
  context: Remote-access tooling is frequently dropped to disk shortly before it runs, and the write location separates sanctioned deployment from operator staging. A binary installed under a standard program directory by a known installer differs from one written to a user-writable or temp path. Correlate the file-write time and writer against the execution time to establish the install-to-run sequence.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\vncviewer.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What child processes did VNCViewer spawn afterward?
  context: An interactive remote session is often used to launch further activity. Child processes such as cmd.exe, powershell.exe, or file-transfer utilities spawned by the viewer indicate hands-on-keyboard control rather than a passive viewing session and mark where post-access activity begins.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: VNCViewer
      - Product: UltraVNC VNCViewer
      - Company: UltraVNC
      - OriginalFileName: VNCViewer.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: VNCViewer
      - Product: UltraVNC VNCViewer
      - Company: UltraVNC
      - OriginalFileName: VNCViewer.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar remote-access activity on several hosts, the scope of the access may be wider than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: VNCViewer
      - Product: UltraVNC VNCViewer
      - Company: UltraVNC
      - OriginalFileName: VNCViewer.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Does this host normally run VNCViewer?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the trailing window indicate first-time or rare execution of the remote-access tool on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the VNCViewer metadata pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even sanctioned remote-access tools can be abused. The query mirrors the rule's metadata selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: VNCViewer
      - Product: UltraVNC VNCViewer
      - Company: UltraVNC
      - OriginalFileName: VNCViewer.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to the remote session and what followed it — reconnaissance, privilege escalation, persistence installation, or data staging that frames the broader context. Novel parent-child pairs stand out against high-count routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the VNCViewer metadata pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's metadata selection with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted or vendor deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: VNCViewer
      - Product: UltraVNC VNCViewer
      - Company: UltraVNC
      - OriginalFileName: VNCViewer.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded the remote session and help reconstruct the timeline. The sequence of alerts on a host often tells the operational story leading up to interactive access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
