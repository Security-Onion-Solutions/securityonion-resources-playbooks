name: Potentially Suspicious Child Process Of WinRAR.EXE
id: 50b15b50-7523-4abc-9680-06a368d24828
description: |
  Detects WinRAR.exe spawning a command interpreter or script host — cmd.exe, cscript.exe,
  mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, or wscript.exe — identified
  by either the child Image name or its OriginalFileName. An archive utility launching an
  interpreter is a strong sign that opening or extracting an archive triggered code execution,
  the pattern behind archive-handling exploitation such as the extension-spoofing flaw where a
  crafted archive runs a same-named script instead of the decoy the user clicked. The same
  spawn can also be benign — a self-extracting archive or an installer packaged in an archive.
  The investigation should confirm the child binary and parent are what the rule matched,
  decode what the child executed, recover the archive that was opened, and determine whether
  the activity is isolated or part of a wider delivery wave.
type: detection
detection_id: 146aace8-9bd6-42ba-be7a-0070d8027b76
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event match the rule — WinRAR.exe as the parent spawning one of the listed interpreters or script hosts?
  context: Before investing investigation time, confirm the true positive. Check that ParentImage
    ends in \WinRAR.exe and the child is one of cmd.exe, cscript.exe, mshta.exe, powershell.exe,
    pwsh.exe, regsvr32.exe, rundll32.exe, or wscript.exe — matched on either the Image name or
    its OriginalFileName, which catches a renamed binary. Note which interpreter fired, since
    that determines which downstream decode and baseline questions carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to extract archives that launch interpreters?
  context: Developers, IT staff, and power users routinely open self-extracting archives and
    installers that legitimately spawn helpers. The same spawn from a general user's workstation,
    triggered by an archive received over email or downloaded from the web, is far more concerning.
    Knowing the account role and the host's function is often the fastest way to separate routine
    extraction from delivery-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the spawned interpreter run? Decode its full command line and working directory.
  context: The child's command line is where the payload lives. Decode any flags, encoded blobs,
    file paths, or URLs to learn what the interpreter actually executed — a download cradle, an
    in-memory loader, a registered COM object via rundll32, or a script read from a temp path.
    The working directory frequently points back at the extraction folder the archive landed in.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: When the interpreter is powershell.exe or pwsh.exe, attackers frequently hide intent
    behind -EncodedCommand (-enc), string concatenation, backtick escaping, or variable
    substitution. Base64-encoded commands are the most common form. Decoding reveals the actual
    payload — a download cradle, a reverse shell, or in-memory execution of a .NET assembly. If
    the child is not PowerShell, this decode does not apply and the command-line decode of the
    spawned interpreter is the relevant artifact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What started WinRAR itself, and was it opening an archive interactively or driven by another process?
  context: The parent-child relationship is the core signal. Tracing WinRAR's own origin shows
    whether a user double-clicked an archive in a mail client or browser download folder, or
    whether a script or loader launched WinRAR non-interactively. The grandparent process and
    WinRAR's command line — which often names the archive path — distinguish a user opening a
    file from automated extraction in an attack chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same WinRAR instance spawn?
  context: A crafted archive can drop and launch several stages. Examining every child of this
    exact WinRAR instance reveals the full scope of what the extraction set in motion — multiple
    interpreters or helpers from the same parent points to orchestrated execution rather than an
    isolated spawn.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What archive was opened, and how did it reach this host?
  context: Archive-handling exploitation begins with a crafted archive delivered by email,
    download, or chat. WinRAR's command line and the parent that launched it usually name the
    archive path; from there, determine whether it arrived as a mail attachment, a browser
    download, or a copied file. Identifying the archive and its source enables blocking it and
    searching for other recipients who received the same file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did WinRAR crash or exit abnormally around the time it spawned the interpreter?
  context: Exploitation for client execution often manifests as the client application crashing
    or terminating abnormally as the malformed input is processed, immediately before or after an
    unexpected child is launched. An application-error event for WinRAR.exe close to the spawn
    time supports memory-corruption or processing-error exploitation rather than a benign
    self-extractor; its absence does not rule out logic-flaw exploitation such as extension
    spoofing, which executes cleanly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Channel: Application
      filter:
        - Provider_Name|contains: 'Error'
        - Data|contains: 'WinRAR'
      condition: selection and filter
    fields:
      - Provider_Name
      - Data
- question: What files did the spawned interpreter write or read in user-writable locations?
  context: Archive exploitation drops payloads and decoys into writable paths — the extraction
    folder, %TEMP%, %APPDATA%, Downloads, or OneDrive — and the interpreter then reads or executes
    them. Reviewing file events tied to the interpreter recovers the dropped script, loader, or
    same-named decoy that the extension-spoofing pattern relies on, and shows where the payload
    landed for containment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the spawned interpreter make outbound network connections shortly after launch?
  context: Successful client-execution exploitation commonly fetches a second stage or beacons to
    command-and-control within a short window of the child spawning. Connections initiated by the
    interpreter to external addresses — especially soon after extraction and to destinations not
    on known update or content-delivery infrastructure — point to payload retrieval or C2 rather
    than benign extraction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did this same detection fire on other hosts or for other users?
  context: A crafted archive distributed to many recipients rarely lands on a single host. If one
    user opened a weaponized archive, others may have received the same file. Correlating this
    detection across the environment reveals the breadth of the delivery and identifies additional
    hosts that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the WinRAR installation on this host up to date?
  context: Archive-handling exploitation often abuses a known vulnerability in the archive utility
    itself, such as the extension-spoofing code-execution flaw (CVE-2023-38831). An outdated WinRAR
    build confirms a known exploit was possible and flags other hosts on the same version as at
    risk; a current build shifts weight toward a self-extracting archive, a packaged installer, or
    user-driven extraction of a malicious script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Does WinRAR normally spawn this interpreter on this host?
  context: WinRAR launching a command interpreter or script host is rare in most environments;
    when it happens routinely it is usually a specific self-extracting installer the user runs
    regularly. Historical frequency of this exact WinRAR-to-interpreter pairing on the host
    distinguishes an established, benign extraction workflow from a first-time spawn worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar archive-extraction or interpreter activity elsewhere, the scope is larger than this
    one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \WinRAR.exe
      selection_binaries:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - mshta.exe
        - PowerShell.EXE
        - pwsh.dll
        - regsvr32.exe
        - RUNDLL32.EXE
        - wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
