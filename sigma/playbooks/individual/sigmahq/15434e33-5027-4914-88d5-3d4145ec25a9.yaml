name: Potential Product Reconnaissance Via Wmic.EXE
id: 7414ddba-81d0-4c15-829f-29722ff31f41
description: |
  Detects execution of wmic.exe (by image name or original filename) with a command line containing 'Product', while excluding install and uninstall operations. The 'wmic product' query enumerates MSI-installed software (names, versions, install paths) from the local Windows Installer database, which adversaries use to fingerprint installed security tooling and applications shortly after gaining a foothold. The same command is also run legitimately by patch-management and inventory tooling, so the investigation should establish who ran it, what was enumerated, and whether the surrounding activity looks like routine inventory or hands-on-keyboard reconnaissance.
type: detection
detection_id: 15434e33-5027-4914-88d5-3d4145ec25a9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line match what this rule detects — wmic.exe running a 'Product' query without an install or uninstall operation?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when the image is wmic.exe (or its original filename is wmic.exe) AND the command line contains 'Product' AND it is not an install or uninstall operation. Confirm all three conditions hold for the triggering event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate installed software via command-line WMI?
  context: Legitimate inventory, patch-management, and software-asset tooling enumerates installed products routinely. Knowing whether the user role and host function are consistent with software-inventory activity is often the fastest path to distinguishing routine operations from hands-on reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this wmic invocation enumerate? Decode the full command line, including any get attributes, output redirection, or vendor filters.
  context: |
    The full command line reveals what was queried and where the output went. Note any 'get' attributes (name, version, installlocation), output redirection (an /output flag or a /format switch writing to a file or HTML report), and WQL-style 'where' filters that narrow results to a specific vendor or product. Redirected output to a text or HTML file suggests the operator intended to collect and exfiltrate the inventory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: 'Product'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic.exe and is that parent chain expected?
  context: The parent process reveals how wmic was invoked. Inventory tooling typically launches it from a service host or a scheduled task; interactive reconnaissance often shows a shell parent (cmd.exe, powershell.exe) or an unusual parent such as mshta.exe, wscript.exe, or an Office application, which may indicate exploitation or a malicious script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did corresponding WMI-activity events show this enumeration running against a remote namespace rather than the local install database?
  context: >-
    A 'wmic product' query normally reads the local Windows Installer database, but wmic can
    also target a remote host or a sensitive namespace such as root\subscription. The
    WMI-Activity channel does not log plain queries, but it records which providers the service
    loaded to answer them (event 5857, winlog.user_data.ProviderName) and any event
    subscription registered in the window (5859-5861), whose winlog.user_data.NamespaceName and
    Query columns name the namespace and filter; the message column carries the narrative. If
    WMI activity logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence the query was local.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.NamespaceName
      - winlog.user_data.Query
      - message
- question: Did wmic.exe open any network connections around the time of this enumeration, and to how many distinct remote hosts?
  context: Local 'wmic product' recon should not generate outbound connections. Network connections originating from wmic.exe — especially to multiple distinct remote hosts in a short window — indicate the tool was used for remote WMI execution or lateral movement rather than local inventory. A single host or no connections is consistent with local enumeration; fan-out to several destinations points to scripted remote operation.
  range: +/-5m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: wmic.exe running from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a wmic.exe running from a user temp or download directory is more suspicious than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: When this host has previously fired this 'wmic product' pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even routine inventory tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: Product
      filter_main_call_operations:
        CommandLine|contains:
        - ' uninstall'
        - ' install'
      filter_main_csproduct:
        CommandLine|contains: csproduct
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the 'wmic product' pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used daily under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic wmic usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: Product
      filter_main_call_operations:
        CommandLine|contains:
        - ' uninstall'
        - ' install'
      filter_main_csproduct:
        CommandLine|contains: csproduct
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- question: What child processes did this wmic.exe spawn afterward?
  context: A 'wmic product' query itself triggers per-product MSI consistency checks but should not spawn unrelated children. Processes such as cmd.exe, powershell.exe, or certutil.exe spawned from wmic indicate the recon was followed by further hands-on activity or post-exploitation rather than a self-contained inventory query.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: Product
      filter_main_call_operations:
        CommandLine|contains:
        - ' uninstall'
        - ' install'
      filter_main_csproduct:
        CommandLine|contains: csproduct
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: Product
      filter_main_call_operations:
        CommandLine|contains:
        - ' uninstall'
        - ' install'
      filter_main_csproduct:
        CommandLine|contains: csproduct
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same account ran similar enumeration or follow-on tooling on multiple endpoints. If the same user triggered comparable activity across several hosts, the scope of the operation may be larger than a single recon command.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: Product
      filter_main_call_operations:
        CommandLine|contains:
        - ' uninstall'
        - ' install'
      filter_main_csproduct:
        CommandLine|contains: csproduct
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what followed. Software-discovery recon is commonly bracketed by other discovery commands (account, network, or process enumeration) and may precede credential access or lateral movement.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were any other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. Software-discovery recon via wmic is frequently accompanied by other built-in enumeration or proxy-execution tools. Finding multiple LOLBins running discovery or code-proxy actions in the same window strengthens the case for hands-on activity rather than isolated inventory.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, other reconnaissance, or initial access — may reveal the attack stages that preceded this enumeration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
