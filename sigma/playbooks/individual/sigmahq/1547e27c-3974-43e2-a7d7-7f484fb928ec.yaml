name: Registry Persistence via Service in Safe Mode
id: 88c7b8c4-3cda-4aca-9898-673749d88507
description: |
  Detects a registry modification that adds a subkey under the SafeBoot control tree
  (\Control\SafeBoot\Minimal\ or \Control\SafeBoot\Network\) whose default value is set to
  the string "Service", registering a service or driver to start when the host boots into Safe
  Mode. Some endpoint-management and security products legitimately register their own Safe
  Mode services, and the rule already excludes several of them. Malicious use keeps a driver or
  service running in Safe Mode, where many protection products do not start, so an attacker's
  component still executes when a victim boots into Safe Mode to clean an infection; the
  investigation should confirm the registered service, identify its payload binary, and
  determine whether it executed.
type: detection
detection_id: 1547e27c-3974-43e2-a7d7-7f484fb928ec
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the SafeBoot registry key and value data match what this rule detects?
  context: Before investing investigation time, confirm this is a true positive. The rule fires
    when TargetObject sits under \Control\SafeBoot\Minimal\ or \Control\SafeBoot\Network\, ends
    in \(Default), and the value data is "Service". Review the exact key path, the value data,
    and the writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a service to load in Safe Mode?
  context: Legitimate installers and endpoint-management agents occasionally register their own
    Safe Mode services. Knowing whether the acting user and host function are consistent with
    installing or maintaining a service is often the fastest way to separate a routine
    deployment from an attacker establishing boot-survival persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which service name was registered under the SafeBoot key, and is this a known
    persistence location?
  context: The service name is the final path segment before \(Default). A subkey under
    \SafeBoot\Minimal loads the named service in Safe Mode without networking; the same subkey
    under \SafeBoot\Network loads it in Safe Mode with networking. Registering a service here
    forces it to run in an environment where many protection products do not start, which is a
    known boot-survival persistence pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the SafeBoot key, and what does it register?
  context: The Details field holds the default value written under the subkey. A value of
    "Service" registers the named subkey as a service to start in Safe Mode; "Driver" would
    register a kernel driver. Registry value data is present on roughly 79% of registry
    modifications and is absent for binary or empty data, so treat a missing value as a
    visibility gap rather than evidence nothing was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does this SafeBoot persistence entry remain, or was it re-modified after creation?
  context: Endpoint telemetry does not emit registry key or value deletion events, so an
    attacker removing the subkey is not directly observable. Judge persistence from the key's
    re-modification history over a longer window and from whether the configured service
    executed, rather than expecting a deletion event to confirm cleanup.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process wrote this registry key, and is its parent chain expected?
  context: The writing process and its lineage reveal how the SafeBoot key was set. A
    service-control or reg utility launched from an interactive shell or a signed installer
    reads differently from one launched by a script host, an Office application, or an
    unexpected parent, which points to macro-driven or exploitation-driven registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Does this host normally run the process that wrote this key?
  context: A writing process that has never been seen on this host is more suspicious than one
    that runs regularly. Zero or very low historical counts for the process that set the
    SafeBoot key indicate first-time or rare execution and warrant closer review of how it
    arrived.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were other registry modifications made on this host in the same session?
  context: Actors who set one persistence key often change several at once -- registering a Safe
    Mode service alongside disabling protection settings or altering service configurations.
    Registry changes from the same window and writing process reveal the full scope of the
    configuration changes and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the service registered for Safe Mode subsequently execute?
  context: Safe Mode service persistence runs its payload when the host boots into Safe Mode or
    when the underlying service otherwise starts, so execution may not occur until a later boot.
    Services launch as children of services.exe, so the query returns service starts on this
    host; match each Image against the binary of the service named by the SafeBoot subkey. If
    the entry registers a driver rather than a service, it loads in the kernel and produces no
    process start — a zero here is expected, and the dropped-file question covers that path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\services.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a service binary or driver file written to disk on this host around this
    modification?
  context: Safe Mode persistence points a service at a binary on disk, and the actor frequently
    drops that service executable or kernel driver in the same session. Executable, driver, or
    library files (.exe, .sys, .dll) written near the modification time identify the likely
    payload; pivot from a dropped path to its later execution to recover the file hash.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .exe
          - .sys
          - .dll
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Has this SafeBoot key been modified before on this host?
  context: SafeBoot control keys should rarely change on a normal host. A first-time
    modification is more suspicious than a recurring one, and zero prior history for this exact
    key indicates it has never been touched before, which raises the priority of the current
    change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this SafeBoot key modified on other hosts in the environment?
  context: The same SafeBoot modification across multiple hosts may indicate a management-driven
    change or widespread malware; a single-host modification looks more targeted. Compare the
    value data across hosts to see whether the same service is being registered everywhere or
    only here.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Process activity in a tight window around the
    registry modification reveals what led to it and what followed, and whether the Safe Mode
    persistence is part of a larger sequence such as tool staging, privilege escalation, or
    defense tampering.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or
    credential access -- may reveal the attack stages that preceded the Safe Mode registration
    and help reconstruct the timeline that led to a boot-survival persistence attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
