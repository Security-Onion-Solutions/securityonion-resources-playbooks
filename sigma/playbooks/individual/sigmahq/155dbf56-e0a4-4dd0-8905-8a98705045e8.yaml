name: UAC Bypass Abusing Winsat Path Parsing - File
id: cf00f28a-6818-4b3a-9a79-c27e15cdc907
description: |
  Detects winsat.exe or winmm.dll being written under C:\Users\...\AppData\Local\Temp\system32\ — a user-writable path crafted to mimic the real system directory. This is the file-planting stage of a UAC bypass that abuses DLL search-order resolution by the auto-elevated winsat.exe: with the legitimate winsat.exe and a malicious winmm.dll staged together in a fake system32 folder, launching winsat.exe causes it to load the planted DLL at high integrity without a consent prompt. Legitimate software rarely recreates a system32 directory under a user Temp path, so the write itself is the primary signal. Investigation should confirm the planted files, identify the writing process and its parent, determine whether winsat.exe then loaded the DLL, and enumerate any elevated actions that followed.
type: detection
detection_id: 155dbf56-e0a4-4dd0-8905-8a98705045e8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was winsat.exe or winmm.dll written under a user-writable Temp\system32 path matching this rule?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path (C:\Users\...\AppData\Local\Temp\system32\winsat.exe or ...\winmm.dll), the operation performed, and the responsible process against the rule's detection criteria. A real system32 directory never lives under a user Temp folder, so a genuine match here indicates deliberate file planting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to stage executables under a Temp\system32 path?
  context: Legitimate administrative activity can trigger many detections, but recreating a system32 directory under a user's Temp folder and dropping winsat.exe or winmm.dll into it is not a normal software pattern. Knowing whether the user role and host function involve developer tooling or installers that write to unusual paths helps separate a true positive from rare-but-benign activity. When the writer is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is inside the planted winmm.dll — is it a legitimate system DLL or a malicious payload?
  context: The bypass works because winsat.exe loads a winmm.dll from its own directory. The staged winsat.exe is typically the genuine auto-elevated binary copied verbatim, while the planted winmm.dll carries the attacker's code. Retrieve the DLL and examine its exports, embedded strings, imports, packer signatures, and signing status; a legitimate winmm.dll is Microsoft-signed and resides in System32, so an unsigned or oddly-signed copy in a Temp path is the payload. Content retrieval requires pulling the file from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the planted winsat.exe ran, what is its hash and does it have known threat-intel detections?
  context: File-write events carry no hash; a hash is recorded when the binary executes. This query looks for the staged winsat.exe running from its Temp path and reads its hash — submit that to reputation and threat-intel sources to determine whether it is the genuine signed Windows binary or a modified copy. The planted winmm.dll is loaded rather than executed, so its hash surfaces on the DLL-load event rather than here; if the files are present but never ran, retrieve them from disk and hash them manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Are the planted files still on disk, or were they deleted or renamed after the alert?
  context: The planted files' post-alert lifecycle drives next steps. Files still on disk can be retrieved, hashed, and analyzed; files deleted seconds after the bypass ran suggest anti-forensic cleanup, since some bypass tooling removes the staged system32 folder once elevation succeeds. A deletion shortly after creation shifts the focus to what executed at high integrity in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did winsat.exe execute from the user Temp\system32 path after it was planted?
  context: Planting the files is only the setup; the bypass completes when the auto-elevated winsat.exe is launched from the fake system32 directory so it loads the neighboring winmm.dll. Confirming that winsat.exe actually ran from the Temp path — rather than the real C:\Windows\System32 copy — establishes that the bypass progressed from staging to execution, and the integrity level on that run shows whether elevation was obtained.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\winsat.exe'
        Image|contains: '\AppData\Local\Temp\system32\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Has winsat.exe or winmm.dll been written to this Temp\system32 path on this host before?
  context: A staged system32 directory that has never appeared on this host is more suspicious than a recurring pattern. Repeated historical writes to this exact user-Temp path could indicate a benign tool that unpacks a private copy of these binaries, whereas a first-time appearance aligned with the alert points to targeted bypass setup.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: A process that stages one file for a bypass often drops several — the paired winsat.exe and winmm.dll, plus any payload the elevated process will run. The breadth, paths, and extensions of the writing process's other file activity distinguish a two-file bypass setup from broader staging or a dropper unpacking multiple components, and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this fake Temp\system32 directory recently, and by which processes?
  context: The staging directory is user-writable and crafted to look like the real system directory. Other files written to this same C:\Users\...\AppData\Local\Temp\system32\ path — additional planted DLLs, payloads, or configuration — reveal whether this is an isolated two-file setup or a location under active use, and which processes are writing there. Legitimate software rarely recreates a system32 folder under Temp, so any writer here is worth identifying.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\system32\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did winsat.exe load the planted winmm.dll from the user Temp\system32 path?
  context: 'This is the moment the bypass elevates: the auto-elevated winsat.exe resolves winmm.dll from its own directory (DLL search order) instead of System32, executing the planted code at high integrity. A load of winmm.dll from a C:\Users\...\AppData\Local\Temp\system32\ path — especially unsigned or with a failed signature — confirms the bypass ran rather than merely being staged. If DLL-load telemetry is not collected in this environment, treat an absence of results as a visibility gap rather than evidence the bypass did not execute.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\winsat.exe'
        ImageLoaded|endswith: '\winmm.dll'
        ImageLoaded|contains: '\AppData\Local\Temp\system32\'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - SignatureStatus
- question: Were registry-based UAC bypass attempts also present around this DLL-planting activity?
  context: This rule's method relies on DLL search-order abuse via a planted file, not registry changes, but attackers commonly try several bypass methods until one succeeds. Registry-based bypasses stage an auto-elevated handler by writing a command under keys such as HKCU\Software\Classes\ms-settings\Shell\Open\command, mscfile\shell\open\command, or HKCU\Environment. Finding such a registry-manipulation command near this file-planting activity indicates deliberate, multi-method privilege escalation rather than an isolated event.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What actions ran at high integrity on this host after the bypass staging?
  context: 'UAC bypass is a means to an end: once winsat.exe loads the planted DLL at high integrity, the attacker''s code runs elevated and typically installs persistence, dumps credentials, tampers with security tooling, or accesses protected resources. Examining processes that ran at High or System integrity shortly after the planting reveals the objective and the true impact.'
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What process wrote these files, and what launched that writer?
  context: The file-write event names the responsible process; walking up to its parent shows how the staging was initiated. A user shell, script host (wscript, mshta, powershell), or Office application launching the writer points to interactive or macro-driven setup, whereas an unexpected parent for this activity is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- always_include: true
  question: Has this user produced this exact file-planting pattern before, and does that fit their role?
  context: The query mirrors the rule's selection — winsat.exe/winmm.dll written under a user Temp\system32 path — scoped to this user across 90 days and grouped by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical tooling. Combine with knowledge of whether this account performs software packaging or testing that could touch such paths.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith:
        - \AppData\Local\Temp\system32\winsat.exe
        - \AppData\Local\Temp\system32\winmm.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven this file-planting pattern before on this host or across the environment?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior — the launch mechanism does. The query mirrors the rule's selection scoped to the alerting program across 90 days, grouped by host, so it shows whether this program routinely stages these files (vendor or OS automation) or is new for this activity (the deviation worth chasing).
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith:
        - \AppData\Local\Temp\system32\winsat.exe
        - \AppData\Local\Temp\system32\winmm.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across other hosts around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether the bypass staging is isolated or part of broader hands-on-keyboard activity. The same user triggering executions on multiple endpoints in the same window widens the scope of the investigation. When the alert fires under SYSTEM or a machine account this view returns agent-telemetry noise, so weigh it against the parent-driven fleet view of the same pattern.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven planting pattern fire on other hosts in the same window?
  context: Under a service or machine account, per-user network activity is dominated by agent telemetry, so the meaningful question is whether the same launch mechanism staged these files elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith:
        - \AppData\Local\Temp\system32\winsat.exe
        - \AppData\Local\Temp\system32\winmm.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other privilege-escalation or bypass detections fire on this host around the alert?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially when OS version or configuration blocks a technique. Other privilege-escalation, defense-tampering, or credential-access detections on this host in a tight window around the planting corroborate deliberate escalation activity and help reconstruct the sequence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
