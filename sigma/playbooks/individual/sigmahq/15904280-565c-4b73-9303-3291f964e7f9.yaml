name: Potential Persistence Attempt Via ErrorHandler.Cmd
id: 4ae06ffe-de4e-4af9-9752-5f840275b0b7
description: |
  Detects creation of a file named ErrorHandler.cmd under C:\WINDOWS\Setup\Scripts\. Several tools in
  C:\WINDOWS\System32\oobe\ (Setup.exe, oobeldr.exe, windeploy.exe, audit.exe) read and run the content of
  this script whenever they fail to run, so an attacker who drops a payload here gains persistence that fires
  on the next setup error. The same path is used legitimately by imaging, sysprep, and unattended-deployment
  workflows, so the investigation must read the file's actual content, identify the process that wrote it, and
  determine whether the script has already been executed.
type: detection
detection_id: 15904280-565c-4b73-9303-3291f964e7f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path match the ErrorHandler.cmd persistence location this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    file path (it must end in \WINDOWS\Setup\Scripts\ErrorHandler.cmd), the operation performed
    (created/modified/renamed), and the responsible process against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write scripts into C:\WINDOWS\Setup\Scripts\?
  context: The Setup\Scripts directory is written to legitimately during imaging, sysprep, and unattended
    deployment, and rarely otherwise. Knowing whether the responsible process and host role fit a
    provisioning workflow is often the fastest way to separate a deployment artifact from a persistence drop.
    When the writer is a machine or service account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is inside ErrorHandler.cmd?
  context: This script's content is what runs when an oobe tool fails, so its lines are the payload. Read the
    file and check for base64 or otherwise encoded strings, embedded URLs or IP addresses, calls to
    powershell.exe/cmd.exe with obfuscated arguments, downloads, or commands that re-establish access. A
    legitimate deployment ErrorHandler typically contains benign logging or cleanup logic; attacker content
    reaches out or launches additional tooling. File content is not in the write event itself and must be
    retrieved from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has the content of ErrorHandler.cmd been executed?
  context: Persistence via this path fires when an oobe tool (Setup.exe and siblings) fails and runs the
    script, typically through cmd.exe. This query surfaces processes whose command line references the script.
    Execution can also appear as child processes spawned under Setup.exe, oobeldr.exe, windeploy.exe, or
    cmd.exe without the script path in the command line, so pair the results with the responsible process's
    child activity. Confirmed execution moves this from an armed persistence mechanism to an active one.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'ErrorHandler.cmd'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is ErrorHandler.cmd still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A script still on disk can be
    retrieved, read, and hashed; a file deleted or renamed shortly after creation suggests anti-forensic
    cleanup or a staging step and shifts the investigation to what ran in between and what the script
    contained before it disappeared.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process wrote ErrorHandler.cmd, and what launched that writer?
  context: The file write event names the responsible process, but its launch context tells you whether the
    write is legitimate. This query retrieves the writer's own process record so you can see its parent and
    command line. A provisioning tool spawned by the deployment chain is expected; a script host, an Office
    application, an archive utility, or an unsigned binary writing this path is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one persistence script often drops several — a dropper unpacking components, a
    tool staging output, or an intruder placing multiple footholds. The breadth, paths, and extensions of the
    writing process's other file activity distinguish a single artifact from a wider staging operation and
    enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to C:\WINDOWS\Setup\Scripts\ recently, and by which processes?
  context: Location drives suspicion for this artifact. The Setup\Scripts directory has a small set of
    processes that legitimately write there during imaging and deployment. Other recent arrivals in the same
    directory reveal whether this is an isolated drop or a directory under active use, and which other files
    belong to the same activity. A single unfamiliar writer across several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\WINDOWS\Setup\Scripts\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has ErrorHandler.cmd been written to this host before?
  context: A script that has never appeared on this host is more suspicious than one that is part of routine
    provisioning. Zero or very low historical counts point to a first-time drop; a recurring pattern tied to
    deployment cycles points to normal imaging activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is ErrorHandler.cmd present on other hosts in the environment?
  context: Finding the same script on multiple hosts may indicate a scripted rollout of persistence or a
    deployment task that touches many endpoints. If it is only on one host, the drop may be targeted; if it is
    on many, determine the distribution pattern and timeline and whether a single writing process accounts for
    all of them.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Was there a change ticket, imaging job, or documented deployment that would explain this file?
  context: Provisioning and re-imaging workflows legitimately place scripts under Setup\Scripts. A
    corresponding change ticket, maintenance window, or deployment record suggests authorized activity;
    absence of one when policy requires it moves the drop toward unauthorized persistence. This check often
    closes false positives or escalates true positives quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user previously produced this ErrorHandler.cmd write pattern, and does that history fit
    their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day
    history of this specific write pattern, aggregated by host. A user who has never produced it is more
    suspicious than one who does so as part of routine provisioning; weigh the count against the user's role
    and typical tasks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \WINDOWS\Setup\Scripts\ErrorHandler.cmd
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write pattern on this host or across the
    environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the
    behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection scoped to
    the alerting program, so the result is the 90-day history of this program driving this specific
    write pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already
    accounts for many prior events is provisioning or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \WINDOWS\Setup\Scripts\ErrorHandler.cmd
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user drove similar activity on several hosts, the scope may be larger than
    this one persistence drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven write pattern fire on other hosts in the same window, or is it
    isolated to this host?
  context: 'Under a service or machine account, asking what else the user did network-wide returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism fired elsewhere: the
    query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window points to a scheduled or pushed rollout; a single host points to
    a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \WINDOWS\Setup\Scripts\ErrorHandler.cmd
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity around the write reveals the
    immediate context: what led to the drop, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or additional persistence mechanisms clustered in the same
    window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were files dropped to other persistence locations on this host around the same time?
  context: Attackers rarely rely on a single foothold. After placing one file-based persistence mechanism they
    commonly stage backups in Startup folders or paths referenced by registry Run keys. File event monitoring
    captures these drops even when the attacker avoids standard persistence tooling, and several drops in the
    same timeframe indicate intentional stacking rather than an isolated provisioning write.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the stages that preceded this persistence drop and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
