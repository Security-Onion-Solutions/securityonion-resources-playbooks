name: Suspicious Process Start Locations
id: b091b5b4-e184-4e03-a014-5a10a5e7d08b
description: |
  Detects a process whose image path either falls inside a hidden/system container (a drive's RECYCLER or
  SystemVolumeInformation folder) or starts from a Windows system directory that should never hold executing
  programs (Tasks, debug, fonts, help, drivers, addins, cursors, or system32\tasks). These locations exist for
  legitimate reasons but are not meant to launch processes, so adversaries stage and run binaries there to blend
  into the operating system and evade path-based scrutiny. Investigation should establish the true identity of the
  binary (path-on-disk vs. embedded PE metadata, signing chain, hash reputation), how it arrived in that directory,
  what it executed, and whether the same pattern has appeared elsewhere on the host or fleet.
type: detection
detection_id: 15b75071-74cc-47e0-b4c6-b43744a62a2b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the process image path match one of the suspicious locations this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the full image path. The rule fires when the path either
    contains a drive's RECYCLER or SystemVolumeInformation container, or starts from a Windows system directory
    that should never run programs (Tasks, debug, fonts, help, drivers, addins, cursors, or system32\tasks). Note
    which branch matched — a path inside RECYCLER/SystemVolumeInformation points to a hidden staging container,
    while a Windows-subdirectory match points to a binary planted in a normally non-executing system folder, and
    that distinction determines the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to launch a process from this directory?
  context: >-
    Legitimate administrative tooling and installers occasionally drop helpers into system directories, but
    routine activity rarely executes from RECYCLER, SystemVolumeInformation, or the listed Windows subfolders.
    Knowing whether the user role and host function explain a process running from one of these locations is often
    the fastest way to separate a benign edge case from a planted binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    A binary planted in a non-executing directory often masquerades as a system tool. Compare the on-disk name in
    the Image path against the embedded PE OriginalFileName — a mismatch means the file was renamed. The signing
    party and signature status indicate whether this is a Microsoft-signed system binary that was relocated, a
    third-party signed tool, or unsigned and tampered. The file hash enables a reputation lookup to classify the
    sample as known-good, known-malicious, or novel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What did this binary actually do? Decode its full command line and working directory.
  context: >-
    The command line reveals the operational purpose of the binary running from the suspicious location. Decode any
    flags, parameters, encoded content, file paths, or URLs, and note the working directory. Because the rule keys
    on location rather than a specific binary, the command line is what tells you whether this is a relocated
    system utility doing benign work or a staged tool performing reconnaissance, download, or execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this binary arrive in this directory?
  context: >-
    A binary in RECYCLER, SystemVolumeInformation, or a Windows subfolder did not appear spontaneously — it was
    copied, downloaded, extracted, or dropped by another process. Tracing the file-creation event for this binary
    by basename over a long window reveals the delivery mechanism: a download tool, an archive extraction, a remote
    admin copy, or a malware dropper. The creating process surfaces in the file event and identifies who placed it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this binary, and is that parent chain expected?
  context: >-
    The parent process reveals how the binary was invoked. Legitimate relocations usually have predictable parents
    (explorer.exe for user actions, an installer, or services.exe for services). Unusual parents such as
    mshta.exe, wscript.exe, or an Office application point to script-driven or exploitation-driven execution of the
    planted file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this binary spawn after execution, and does the same binary run from a suspicious location on other hosts?
  context: >-
    The point of running from a hidden or non-executing directory is to operate while evading path-based scrutiny.
    The child processes spawned by this binary reveal its actual objective — credential access, reconnaissance,
    lateral movement, or further download. The same binary executing from a suspicious location on multiple hosts
    suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this host previously run this binary?
  context: >-
    A binary that has never executed on this host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution. For relocated system utilities, also confirm whether
    the path on disk matches the binary's expected installation directory — execution from an expected signed
    location is routine, execution from a system folder that never holds programs is not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this location pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even relocated legitimate binaries leave a baseline. The query mirrors the rule's location selection scoped to
    this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically
    run here — not generic binary usage. A new parent process, an unexpected user account, or an unusual command
    pattern against that baseline is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - :\RECYCLER\
        - :\SystemVolumeInformation\
      - Image|startswith:
        - C:\Windows\Tasks\
        - C:\Windows\debug\
        - C:\Windows\fonts\
        - C:\Windows\help\
        - C:\Windows\drivers\
        - C:\Windows\addins\
        - C:\Windows\cursors\
        - C:\Windows\system32\tasks\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this location pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's location selection with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that drops helpers into a system folder; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - :\RECYCLER\
        - :\SystemVolumeInformation\
      - Image|startswith:
        - C:\Windows\Tasks\
        - C:\Windows\debug\
        - C:\Windows\fonts\
        - C:\Windows\help\
        - C:\Windows\drivers\
        - C:\Windows\addins\
        - C:\Windows\cursors\
        - C:\Windows\system32\tasks\
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - :\RECYCLER\
        - :\SystemVolumeInformation\
      - Image|startswith:
        - C:\Windows\Tasks\
        - C:\Windows\debug\
        - C:\Windows\fonts\
        - C:\Windows\help\
        - C:\Windows\drivers\
        - C:\Windows\addins\
        - C:\Windows\cursors\
        - C:\Windows\system32\tasks\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - :\RECYCLER\
        - :\SystemVolumeInformation\
      - Image|startswith:
        - C:\Windows\Tasks\
        - C:\Windows\debug\
        - C:\Windows\fonts\
        - C:\Windows\help\
        - C:\Windows\drivers\
        - C:\Windows\addins\
        - C:\Windows\cursors\
        - C:\Windows\system32\tasks\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar process executions on multiple hosts, the scope of the activity
    may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - :\RECYCLER\
        - :\SystemVolumeInformation\
      - Image|startswith:
        - C:\Windows\Tasks\
        - C:\Windows\debug\
        - C:\Windows\fonts\
        - C:\Windows\help\
        - C:\Windows\drivers\
        - C:\Windows\addins\
        - C:\Windows\cursors\
        - C:\Windows\system32\tasks\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this event and what
    followed within the correlation window between the binary's placement and its execution. Aggregating by image
    and parent collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out
    at low counts — those are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded a binary being staged in a hidden or system directory. The alert timeline helps
    reconstruct whether this execution is the start of activity or a later step in a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
