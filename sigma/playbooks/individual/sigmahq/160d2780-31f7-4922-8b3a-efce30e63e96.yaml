name: Potential AMSI COM Server Hijacking
id: 24b3861e-844e-4738-bd25-f6ae805eda51
description: |
  Detects a registry write to the AMSI provider's COM CLSID InProcServer32 (Default) value where the
  data is not the legitimate system32\amsi.dll path. Redirecting this CLSID to a non-existent or
  attacker-controlled DLL causes the in-process scan interface to fail to load, silently disabling
  script scanning so that subsequent interpreter activity runs unscanned. Legitimate changes to this
  key are rare; investigation should confirm the redirected DLL path, identify the process that wrote
  the key and its parent, and determine what script or command activity followed the change.
type: detection
detection_id: 160d2780-31f7-4922-8b3a-efce30e63e96
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the AMSI CLSID InProcServer32 (Default) value point somewhere other than the legitimate amsi.dll?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact key path (TargetObject) and the value data (Details). The rule fires when the AMSI COM server's
    InProcServer32 (Default) value is written AND the data is not the expected system32\amsi.dll path,
    so verify the written path resolves to a non-existent or non-standard DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the AMSI COM server registry key?
  context: Legitimate changes to a security provider's COM CLSID are rare and are almost never made by
    interactive users or script interpreters. Knowing whether the writing process and user account are
    consistent with expected software installation or administration is often the fastest way to separate
    a true positive from routine activity. User attribution is present on most endpoint registry events;
    when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified key the AMSI provider CLSID, and is redirecting it a known evasion pattern?
  context: The CLSID InProcServer32 (Default) value tells COM which DLL to load when the class is
    instantiated. The AMSI provider CLSID normally resolves to system32\amsi.dll; overwriting it points
    the in-process scan interface at a different DLL, so the scanning component fails to instantiate.
    This is a defense-evasion location rather than a persistence one, so the value data itself, not just
    the key name, carries the intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the CLSID value, and does it resolve to a real, signed DLL?
  context: The Details field holds the redirected COM server path. Common evasion values include a
    non-existent path (so COM instantiation simply fails), a path in a user-writable directory such as
    Temp, AppData, or ProgramData, or an older vulnerable copy of amsi.dll staged alongside a relocated
    interpreter. Value data is recorded on roughly four in five registry modifications; when Details is
    absent, inspect the key directly on the host to recover the written path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What command did the writing process run, and does it confirm the AMSI scan interface was the target?
  context: The command line of the process that wrote the key reveals how the change was made -- a
    reg.exe import, a PowerShell Set-ItemProperty, or a script importing crafted registry entries.
    Confirming that the CLSID InProcServer32 value under the AMSI provider was the specific target
    establishes that this is script-scanning evasion and sets the investigation priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this CLSID value been rewritten more than once, and does its history show repeated tampering?
  context: Registry key and value deletions are not observable in endpoint telemetry, so attacker cleanup
    of the redirect cannot be seen directly; judge whether the change is transient or sustained from the
    key's re-modification history instead. Repeated writes to the AMSI CLSID -- for example a redirect
    followed later by a restore, or several redirects -- indicate deliberate, recurring evasion rather
    than a one-time configuration accident.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned the process that wrote the key, and is that parent chain expected?
  context: The parent of the writing process shows how the registry change was launched. A redirect made
    by a scripting interpreter, an Office application, or an unusual parent such as mshta.exe or wscript.exe
    points to exploitation or a malicious script, whereas installer or management-tooling parents are more
    consistent with benign software behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did script interpreters run on this host after the AMSI CLSID was redirected?
  context: The purpose of redirecting the AMSI COM server is to let subsequent scripts execute without
    being scanned. Script interpreters such as powershell.exe, wscript.exe, or cscript.exe launching after
    the change -- especially copied alongside a staged amsi.dll into a user-writable directory -- are the
    payload activity the evasion was meant to enable.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Is the AMSI CLSID value currently restored to amsi.dll, or is the scan interface still redirected?
  context: The redirect may be transient (in place only long enough to run one unscanned payload) or left
    persistent. Because value deletions are not observable, determine the current state by inspecting the
    key's live value on the host and its most recent write. If the CLSID still points away from
    system32\amsi.dll, the scan interface remains disabled and should be restored before further investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the AMSI scan interface was disabled?
  context: Defenses are disabled for a reason -- to run malware, dump credentials, or take other actions
    that would normally be scanned or blocked. Examining process activity in the window immediately after
    the redirect reveals what the evasion was meant to enable. Novel parent-child pairs appearing at low
    counts against the host's usual baseline are the signal to pursue.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An actor who disables one control often disables several -- stopping Defender, clearing event
    logs, deleting shadow copies, or changing firewall rules alongside the AMSI redirect to maximize
    coverage. Multiple tampering events from the same user or parent process indicate several controls
    were targeted in a single operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: Actors who alter one registry key often alter several -- pairing the AMSI redirect with a Run
    key for persistence, a Defender policy change, or a firewall edit. Clusters of registry changes from
    the same writing process within a short window reveal the full scope of the configuration changes and
    whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the AMSI CLSID InProcServer32 value been modified before on this host?
  context: First-time modifications to a security provider's COM CLSID are more suspicious than recurring
    ones. This value should almost never change on a healthy host, so a history with zero or very few prior
    writes points to first-time tampering, while a prior write of the legitimate amsi.dll path may reflect
    a benign repair or reinstall.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the AMSI CLSID redirect made on other hosts in the environment?
  context: The same modification across multiple hosts may indicate a pushed policy or a widely deployed
    tool or malware, whereas a change confined to this one host suggests targeted activity. Comparing the
    written Details values across hosts distinguishes a uniform, legitimate change from divergent
    attacker-controlled DLL paths.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Actors rarely rely on a single foothold. After disabling a control, they commonly install
    backup persistence using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions.
    Multiple persistence installations in the same timeframe indicate deliberate stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance,
    credential access, or other defense tampering -- may reveal the stages that preceded the AMSI redirect
    and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
