name: TeamViewer Remote Session
id: 856a6655-1ac4-41d1-8c07-bde3020e0bbd
description: |
  Detects the creation of TeamViewer log and database files that accompany an active remote session — either the specific
  RemotePrinting database and network log (tvprint.db, TVNetwork.log) OR any file under a TeamViewer directory whose name
  contains _Logfile.log. TeamViewer is legitimate remote-access software widely used for IT support, but the same tool is
  abused as a hands-on-keyboard command-and-control channel and for shadow-IT access that bypasses change control. The
  investigation should determine whether this remote session is a sanctioned, ticketed support activity or an unsanctioned
  or attacker-driven session, using the session logs, the launching binary, its outbound endpoint, and its child activity.
type: detection
detection_id: 162ab1e4-6874-4564-853c-53ec3ab8be01
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path match a TeamViewer session-log pattern, and which branch fired?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when EITHER the specific RemotePrinting
    database or network log is written (a path ending in \TeamViewer\RemotePrinting\tvprint.db or \TeamViewer\TVNetwork.log)
    OR a file under a \TeamViewer directory whose name contains _Logfile.log is created. Note which branch matched: the
    specific named files indicate the printing/networking subsystems of a session, while the _Logfile.log branch is the
    general session log and is the more common signal that a remote session ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run remote-access software?
  context: >-
    Legitimate remote support and administration produce these same log files. Knowing whether the user role and host
    function normally involve inbound remote-access sessions is often the fastest way to separate sanctioned support from
    an unexpected session. When the writing account is a machine or service account, judge by the host role and the
    responsible process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the TeamViewer session log or database record about this session?
  context: >-
    These artifacts carry the session's own record — connection metadata, peer identifiers, timestamps, and printing or
    network activity for the session. Retrieve the file from the host and read it to establish when the session started,
    what remote peer connected, and how long it was active. Content analysis requires manual retrieval from the endpoint
    since the file event itself only records that the file was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is TeamViewer on the organization's approved remote-access software list?
  context: >-
    Organizations typically sanction a specific remote-access tool for IT support. TeamViewer being present does not by
    itself mean it is approved — even well-known commercial software may represent shadow IT or attacker-deployed access
    if it is not the sanctioned tool for this environment. An unauthorized remote-access tool should be treated as
    suspect regardless of its reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: >-
    Sanctioned TeamViewer use normally maps to an active support ticket, a scheduled maintenance window, or a user
    request. If no support context exists for a session at this time on this host, the tool may have been installed for
    persistent attacker access or by a user circumventing security controls. Match the session start time from the logs
    against ticketing and change records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the process that wrote these logs the genuine signed TeamViewer binary, and what is its hash?
  context: >-
    File-write events carry no hash, so confirm the responsible binary by its execution event: read its hash and
    signing status and check whether it is the genuine, vendor-signed TeamViewer executable running from an expected
    install path, or a renamed, unsigned, or relocated copy running from a user-writable or temp directory. Submit the
    hash to threat intelligence to determine whether it is known good, known malicious, or previously unseen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process launched the binary that wrote these logs, and does that launch chain fit an installed service or a user-started session?
  context: >-
    The parent reveals how the remote-access tool started. A launch from services.exe points to an installed, persistent
    service — expected for a sanctioned deployment but also a common persistence route for attacker-deployed access. A
    launch from explorer.exe or a browser points to an interactive or user-initiated start, and an unusual parent such as
    a script host or Office application points to exploitation or a delivered dropper.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What external endpoint is the remote-access tool connecting to?
  context: >-
    Remote-access tools hold a long-lived outbound connection to relay or cloud infrastructure. Connections to the
    vendor's own infrastructure (for example *.teamviewer.com relay servers) are consistent with normal operation, while
    connections to unfamiliar IPs, or on non-standard high ports outside the vendor's documented range, point to a
    custom or attacker-controlled relay. Weigh the destination, port, and session duration together — a sanctioned
    support session and a persistent C2 channel differ in where they connect and for how long.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did the remote-access tool spawn during the session?
  context: >-
    An interactive remote session shows up as child processes under the tool — command shells, file managers, script
    hosts, or reconnaissance binaries launched by the remote operator. Legitimate support may spawn a shell or a
    diagnostic utility; a hands-on-keyboard intruder tends to spawn command interpreters, credential-access tooling, or
    lateral-movement utilities. The set of children distinguishes an idle or benign session from active operator control.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Are the TeamViewer log files still on disk, or were they deleted or renamed after the alert?
  context: >-
    The post-alert lifecycle of the session logs drives next steps. Logs still on disk can be retrieved and read to
    reconstruct the session; logs deleted shortly after they were written suggest deliberate cleanup of session traces
    and shift the investigation toward what ran during the session and who removed the evidence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    Beyond its own logs, the tool's broader file activity shows what the session did on disk — transferred files staged
    into a download or temp folder, configuration or persistence artifacts, or output collected for exfiltration. The
    breadth and location of the writes separate a routine support session from active data staging or tampering and
    enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the TeamViewer directory recently, and by which processes?
  context: >-
    The TeamViewer directory should normally be written only by the TeamViewer executables themselves. Other recent
    arrivals in that directory, or writes by an unexpected process, reveal whether the install is intact or whether
    something has staged additional binaries, configuration, or transferred files alongside the tool's own files.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\TeamViewer\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Are these TeamViewer session logs being written on any other hosts in the environment?
  context: >-
    The distribution of the same session-log pattern across hosts distinguishes a sanctioned, centrally deployed remote
    support tool (present broadly and predictably) from an unsanctioned or attacker-driven footprint. Activity confined
    to one or a few unexpected hosts, or appearing on hosts that have no support reason to run remote access, points to
    shadow IT or targeted access rather than an approved deployment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this TeamViewer session-log pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection scoped to this user, returning the user's 90-day history of this specific
    session-log pattern aggregated by host — not generic use of any tool. A user who has never produced this pattern is
    more suspicious than one who does so regularly as part of support duties; weigh the count and host spread against
    whether this person's role legitimately involves running or receiving remote-access sessions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection1:
        TargetFilename|endswith:
        - \TeamViewer\RemotePrinting\tvprint.db
        - \TeamViewer\TVNetwork.log
      selection2:
        TargetFilename|contains|all:
        - \TeamViewer
        - _Logfile.log
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this session-log pattern, or is the launching process new for this activity?
  context: >-
    When the session runs under a service principal or machine account, user identity does not attribute the behavior;
    the launching process is the meaningful pivot. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of that program driving this specific pattern. A new or rare program for this
    pattern is the deviation worth chasing, while a program that already accounts for thousands of prior events is a
    sanctioned deployment's own service or updater.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection1:
        TargetFilename|endswith:
        - \TeamViewer\RemotePrinting\tvprint.db
        - \TeamViewer\TVNetwork.log
      selection2:
        TargetFilename|contains|all:
        - \TeamViewer
        - _Logfile.log
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the session?
  context: >-
    Tracking the user's activity across all hosts in the same window reveals whether the remote session is an isolated
    support action or one step in broader movement. If the same account triggered similar activity on multiple hosts
    around this time, the scope of the session — sanctioned or not — is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven session-log pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, user-scoped clustering returns agent-telemetry noise; the meaningful question is whether
    the same launch mechanism produced this pattern elsewhere. The query mirrors the rule's selection scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or
    pushed automation — for example a central deployment tool — while a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection1:
        TargetFilename|endswith:
        - \TeamViewer\RemotePrinting\tvprint.db
        - \TeamViewer\TVNetwork.log
      selection2:
        TargetFilename|contains|all:
        - \TeamViewer
        - _Logfile.log
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this session?
  context: >-
    A remote session rarely stands alone in an intrusion. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access, or an initial-access alert — may reveal how the operator arrived and reframe the
    session as one stage of a multi-step operation rather than routine support. The alert timeline helps reconstruct
    what preceded the session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
