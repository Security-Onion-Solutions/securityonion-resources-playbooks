name: Start of NT Virtual DOS Machine
id: a8b82904-8ad1-4750-8c9e-fb958446cb81
description: |
  Fires when a process whose image name ends in ntvdm.exe or csrstub.exe starts. The NT Virtual DOS Machine hosts 16-bit
  MS-DOS and Win16 applications and is invoked automatically when a 16-bit binary executes on 32-bit Windows; it is not
  present on 64-bit Windows. Execution of 16-bit code is extremely rare in modern enterprise environments, so almost any
  ntvdm.exe activity is anomalous. Legitimate triggers include a user double-clicking an old .com or 16-bit .exe, or an
  installer extracting legacy setup tooling. The investigation should determine what 16-bit binary caused the host to spin
  up ntvdm, what spawned it, and whether the host runs legacy applications that explain it.
type: detection
detection_id: 16905e21-66ee-42fe-b256-1318ada2d770
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the process image match what this rule detects (ntvdm.exe or csrstub.exe)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the alerting process image
    and the launching context. The rule fires on the bare presence of the NT Virtual DOS Machine host process, so the image
    name ending in ntvdm.exe or csrstub.exe is the whole match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run 16-bit DOS or Win16 applications?
  context: Legacy 16-bit applications survive in a small number of niche environments (old line-of-business tooling on 32-bit
    endpoints). Knowing whether this host is one of those, and whether the user has a reason to launch such software, is often
    the fastest path to separating a legacy workload from anomalous execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What 16-bit program did ntvdm load, and what command line was passed to it?
  context: The NT Virtual DOS Machine is a host for legacy code; the interesting artifact is the 16-bit binary it was asked
    to run and the working directory it ran from. Review the full command line and current directory to identify which .com
    or 16-bit .exe triggered the subsystem and where that file lives on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ntvdm and is that parent chain expected?
  context: The parent process reveals how the 16-bit code was invoked. A user double-clicking a legacy file shows explorer.exe;
    an installer shows the setup executable. Parents such as script hosts, Office applications, or command interpreters
    point to programmatic invocation of legacy code that may be an evasion attempt rather than a user action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ntvdm spawn afterward?
  context: The processes spawned under the subsystem reveal its actual impact. Canonical NTVDM children are legacy companion
    processes such as command.com. Children outside that legacy set, or general-purpose interpreters and download tools,
    indicate the 16-bit execution was a stepping stone to further activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even a legacy-application host has a normal pattern for 16-bit execution. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how the NT Virtual DOS Machine has
    historically started here. A new parent process, an unexpected user account, or a first-time appearance is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Does this host normally run the NT Virtual DOS Machine?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts over the trailing period indicate first-time or rare 16-bit execution, which on a modern endpoint is
    itself the signal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the NT Virtual
    DOS Machine starting. Many hosts firing the same pattern points to a shared legacy application deployed broadly; one host
    or a small unrelated set points to a localized trigger. Use the host distribution to calibrate how unusual this is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar legacy execution or follow-on tooling on other hosts, the scope of the activity may
    be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \ntvdm.exe
        - \csrstub.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence mechanisms accompanying the legacy execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
