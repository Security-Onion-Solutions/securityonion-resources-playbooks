name: LiveKD Driver Creation
id: 234383e5-8068-467f-9e69-57e634e9292e
description: |
  Fires when livekd.exe or livek64.exe writes the file C:\Windows\System32\drivers\LiveKdD.SYS. LiveKD is
  a live kernel debugging utility; on first use it drops this kernel-mode driver into the system driver
  directory and starts it, which gives the calling user read access to kernel memory and to the memory of
  protected processes without opening a handle to them. Driver installation requires administrative rights,
  so the write itself confirms the acting account already held local administrator on this host. Legitimate
  use is a developer or support engineer debugging a crash or hang; the same driver also provides a signed,
  Microsoft-authored path to kernel memory that can be used to read credential material out of protected
  processes or to inspect and modify kernel structures. Determine who ran the tool and why, whether the
  driver went on to load, and what the acting account did with kernel access afterward.
type: detection
detection_id: 16fe46bb-4f64-46aa-817d-ff7bec4a2352
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the file path and the creating process match what this rule detects?
  context: >-
    The rule requires both halves together: the written path is exactly
    C:\Windows\System32\drivers\LiveKdD.SYS and the writing process ends in livekd.exe or livek64.exe.
    Confirm the operation performed on the path and that the responsible process is the debugging utility
    rather than another program writing the same driver name. The signer columns are context, not a verdict
    — read them for whether the writer's signer is coherent with a kernel driver landing in the system
    driver directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to install a kernel debugging driver?
  context: >-
    Writing a driver into the system driver directory needs local administrator rights, so the acting
    account is privileged by construction and the question is whether it should be doing kernel debugging
    here. A developer workstation, a lab machine, or a host under an active crash-analysis engagement has a
    reason; a file server, a domain controller, or a general-purpose endpoint does not. When the account is
    a machine or service account, judge by the writing process and the host's role instead of the identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the driver still on disk, or was it deleted or renamed after the alert?
  context: >-
    LiveKD removes its driver when it exits cleanly, so a deletion shortly after the write is the tool's
    own housekeeping rather than anti-forensic cleanup. A driver that stays on disk after the debugging
    session ended leaves a kernel memory access path installed on the host and can be retrieved and hashed.
    Read the operation types in sequence to establish which of the two occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is this the genuine LiveKD driver, or a different binary carrying the same file name?
  context: >-
    The file name is fixed by the rule, so the analyst already knows what it claims to be; what is open is
    whether the bytes match. Retrieve the file from its on-disk path and check size, signing status, signer,
    and embedded strings against a known-good copy of the driver the tool ships. A file at this path that is
    unsigned, signed by an unrelated party, or materially different in size is a different kernel module
    occupying a name that reads as routine debugging.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What exactly did the LiveKD process do? Decode its command-line arguments.
  context: >-
    The driver write is a side effect of running the tool; the command line records the intent. Arguments
    naming an output file indicate a memory dump was written and identify where it landed, arguments naming
    a target virtual machine indicate a hypervisor guest was the subject, and an invocation with no
    arguments points to an interactive debugger session whose commands leave no command-line record. The
    working directory shows where the operator was running from. The window spans every execution of the
    binary on this host, since a debugging session is often several sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process wrote the driver, and what launched it?
  context: >-
    The file event names the writing process but not its origin. Retrieving that process's own start event
    reveals the parent and the parent's command line. An interactive launch from explorer.exe or a console
    fits an engineer running the tool by hand; a launch from a remote-execution service, a script host, an
    Office application, or an archive extractor means the tool was driven by something other than a person
    at the keyboard, and the parent's command line usually names what.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: If this driver has loaded, what is its hash and signer, and does threat intel know it?
  context: >-
    A file write carries no hash; a kernel module records one when it loads. Matching the driver load event
    on this file name returns the hash, the signer, and the signature status of what actually entered the
    kernel, and that hash can be submitted for reputation review to establish whether it is the shipped
    debugging driver, a known-abused kernel module, or something unseen. A driver written but never loaded
    produces no result here — retrieve it from its on-disk path and hash it manually in that case. Hosts
    that do not ship driver load telemetry also return nothing, which is a visibility gap rather than
    evidence the driver stayed inert.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What other kernel drivers loaded on this host around the alert?
  context: >-
    The driver write is half the sequence; what entered the kernel is the other half. Reviewing every driver
    load in the window places the debugging driver among the host's other kernel activity and surfaces
    additional modules loaded alongside it — an unsigned driver, one with a revoked or untrusted signature,
    one signed by a party unrelated to the host's installed software, or one loading from a directory
    outside the system driver path. A signed driver being installed to obtain kernel access is a recognized
    pattern, and it rarely arrives alone. Hosts not shipping driver load telemetry return nothing here.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - manual_review
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    LiveKD writing only its own driver and cleaning it up afterward is the tool operating as designed. The
    same process writing a large memory dump identifies a file containing kernel memory — and, on a live
    system, credential material — that now needs to be located and accounted for. Writes into user-writable
    staging directories, archive files, or additional binaries alongside the driver indicate the debugging
    run was a step in a longer sequence rather than the whole of it.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the system driver directory recently, and by which processes?
  context: >-
    The system driver directory is written by Windows servicing, driver installation packages, and a small
    set of vendor installers; a debugging utility is already outside that set. Other recent arrivals there
    reveal whether this host has a pattern of ad-hoc driver installation or whether this write stands alone,
    and the aggregation names every process that placed a file in the directory. An unfamiliar writer
    appearing across several driver files is the row to pursue.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\System32\drivers\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What child processes did the LiveKD process spawn afterward?
  context: >-
    LiveKD is a wrapper that launches a kernel debugger against the live system, so a debugger child is
    expected and its presence confirms an actual debugging session rather than a bare driver install.
    Children that are not debuggers — a command interpreter, a script host, an archive tool, or a file copy
    — indicate the tool's kernel access was a means to something else, and their command lines describe
    what. No children at all means the driver was installed without a session being run through it, which
    leaves the question of why the driver was wanted.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, what processes and users normally drive it, and does this alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the result is the two-week history of
    this specific driver write here rather than generic file activity. A host where debugging is routine
    shows a recurring writer and a small set of engineer accounts, and the current alert either fits that
    or does not. A host with no prior history of the pattern makes this a first occurrence, which is the
    reading that carries weight.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\LiveKdD.SYS
        Image|endswith:
        - \livekd.exe
        - \livek64.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their 90-day history of this driver
    write across the environment rather than generic tool usage, aggregated by host. An account that
    performs kernel debugging as part of its job shows prior occurrences on the hosts it supports; an
    account with none, or one whose role has no debugging component, is the deviation worth pursuing.
    Because the write requires local administrator rights, weigh the result against how that account came
    to hold them on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\LiveKdD.SYS
        Image|endswith:
        - \livekd.exe
        - \livek64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically produced the rule's pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the write happens under a machine or service account, identity does not attribute behavior, and a
    file event carries no parent to pivot on — the acting program is the attributable element. The query
    mirrors the rule's selection scoped to the alerting binary, giving the 90-day history of this program
    producing this write, aggregated by host. A program already accounting for the pattern across many
    hosts is a deployed debugging or diagnostics workflow that should be identifiable by name; one that is
    new or rare for it is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\LiveKdD.SYS
        Image|endswith:
        - \livekd.exe
        - \livek64.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the identity that
    installed the driver was simultaneously active elsewhere, which distinguishes a single maintenance
    session from movement across endpoints. Under a machine or service account this returns routine
    agent volume across the fleet and answers little on its own; read it for hosts that stand out rather
    than for totals.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting binary, fleet-wide, within the alert
    window. Several hosts producing the driver write at once points to a pushed or scheduled diagnostics
    task and moves the question to what initiated the rollout; a single host points to a local trigger and
    keeps the investigation anchored to this endpoint and this operator.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\LiveKdD.SYS
        Image|endswith:
        - \livekd.exe
        - \livek64.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    driver write rather than the tool's general footprint. Many hosts over the week points to a sanctioned
    debugging or diagnostics practice that should be documented and, if so, tuned; a handful of unrelated
    hosts, or hosts whose roles have no debugging function, points to operator-driven activity. Use the
    host distribution to calibrate how far the investigation extends beyond this endpoint.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename: C:\Windows\System32\drivers\LiveKdD.SYS
        Image|endswith:
        - \livekd.exe
        - \livek64.exe
      condition: selection
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Installing a kernel debugging driver requires local administrator rights the acting account already
    held, so the question of how those rights were obtained sits earlier in the timeline. Detections on
    this host in the preceding hours — privilege escalation, credential access, defense tampering, or
    remote execution — identify the step that produced the administrative context this write consumed, and
    let the sequence be reconstructed from its first observable point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
