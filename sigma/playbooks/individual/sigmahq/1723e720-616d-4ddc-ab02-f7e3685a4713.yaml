name: Rundll32 Spawned Via Explorer.EXE
id: e718d5b0-dc5f-4870-a0d4-4af7972e81fb
description: |
  Detects rundll32.exe (matched by image name or original filename) launched directly by explorer.exe, excluding the benign cases where it runs a DLL from C:\Windows\System32\ or registers the known shell -localserver COM object. explorer.exe spawns rundll32 routinely for shell and Control Panel actions that load System32 DLLs; once those are filtered out, an explorer-launched rundll32 loading a DLL from somewhere else is unusual and has been observed delivering malware — a user double-clicking a malicious shortcut or file (for example a USB-borne worm) causes the shell to run rundll32 against an attacker DLL on removable, network, or temporary storage. The investigation should decode which DLL and export rundll32 ran and from what path, establish what the user opened in explorer to trigger it, and trace the module load and what executed next.
type: detection
detection_id: 1723e720-616d-4ddc-ab02-f7e3685a4713
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — rundll32.exe launched by explorer.exe and not loading a System32 DLL?
  context: Confirm the alert before investing time. The rule fires when the parent is explorer.exe and the image (or original filename) is rundll32.exe, with the benign cases excluded — a command line referencing C:\Windows\System32\ or ending in the shell -localserver COM GUID. Read the full command line and confirm rundll32 is loading a DLL from outside System32; the path it points to (a temp folder, a network share, or a removable drive letter) is the first strong signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Which DLL and export did rundll32 run, and from what path?
  context: Decode rundll32's full command line. Recover the DLL it loaded, the exported function or ordinal it called, and — most importantly — where the DLL lives. A DLL under a user temp directory, AppData, a network share, or a removable drive (a bare drive letter) is the delivery signal; a registered ordinal with no readable name, or a path with unusual casing or spacing, points to obfuscation. This classification drives the priority of the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What did the user open in explorer that caused it to spawn rundll32?
  context: explorer.exe spawns rundll32 in response to a user action — double-clicking a file, a shortcut, or a Control Panel item. The explorer parent's context and the surrounding shell activity reveal what was opened. A malicious .lnk or a disguised file on removable or network media is a common trigger for this chain, so establishing what the user interacted with just before the spawn is central to deciding whether this was a deliberate launch of attacker content.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to launch DLLs through rundll32 from the shell?
  context: Most users never knowingly run rundll32 against a non-System32 DLL. Knowing whether this user's role and host function involve software or admin workflows that legitimately do so helps separate an unusual but sanctioned action from delivery of attacker content. A developer or IT host differs from a standard user endpoint where this chain is anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did rundll32 load a DLL from a user-writable or temp location?
  context: Confirming the actual module load corroborates the command line and catches cases where the path is obfuscated. A DLL loaded by this rundll32 instance from a temp, AppData, ProgramData, or public path — rather than from System32 — is the attacker-content signal. Where the DLL was delivered from removable or network media, that path shows in the command line; this question pins down the load from disk and any additional modules the payload pulled in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|contains:
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
          - '\Windows\Temp\'
          - '\Users\Public\'
          - '\ProgramData\'
      condition: selection
    fields:
      - ImageLoaded
- question: What child processes did this rundll32 spawn afterward?
  context: The DLL rundll32 loaded reveals its purpose through what it launches next. Children of this rundll32 instance — a new cmd.exe or powershell.exe, a dropped binary, reconnaissance commands, or a network tool — turn a module load into a follow-on stage. A worm-style loader often spawns further copies of itself or additional rundll32 invocations, so the child activity is where intent becomes clear.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other proxy-execution or download LOLBins used on this host recently?
  context: Operators who proxy execution through one signed binary usually use several. Alongside rundll32, look for the other proxy-execution binaries (regsvr32, mshta, msbuild, installutil, msiexec, cmstp) and download tools (certutil, bitsadmin, curl) that fetch or run a payload. Several of these in the same day on the same host strengthens the case that the explorer-launched rundll32 was one step in a delivery chain rather than a stray shell action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\cmstp.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was rundll32.exe executed from its expected System32 / SysWOW64 path, and is it the genuine signed binary?
  context: The genuine rundll32.exe is a signed Microsoft binary under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, a network share, or a removable drive — or one whose original filename is not RUNDLL32.EXE — suggests the binary was staged alongside the payload to dodge path-based allowlists, which raises the priority of the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has explorer spawned a non-System32 rundll32 on this host over the past 90 days, and what command structures are typical?
  context: An explorer-launched rundll32 loading a non-System32 DLL with no prior history on a host is more notable than one that recurs under a stable application. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing (not all rundll32 usage), and the command-line projection lets you compare the historical DLL paths and exports against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      filter_main_generic:
      - CommandLine|contains: ' C:\Windows\System32\'
      - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- question: Does explorer normally spawn rundll32 this way on this host?
  context: explorer launches rundll32 constantly for shell and Control Panel actions, but those load System32 DLLs and are filtered out. This counts how often the explorer-to-rundll32 pairing has fired the rule's pattern here historically; zero or very low counts mean a novel and suspicious spawning relationship, while a recurring count may reflect a specific application that drives the shell this way.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      filter_main_generic:
      - CommandLine|contains: ' C:\Windows\System32\'
      - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      filter_main_generic:
      - CommandLine|contains: ' C:\Windows\System32\'
      - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user opened or ran similar content on other hosts in the same window, the scope is larger than a single machine — relevant for a USB-borne or share-delivered loader. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \explorer.exe
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      filter_main_generic:
      - CommandLine|contains: ' C:\Windows\System32\'
      - CommandLine|endswith: ' -localserver 22d8c27b-47a1-48d1-ad08-7da7abd79617'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — removable-media activity, a download, defense tampering, or reconnaissance — may reveal how the DLL arrived and help reconstruct the timeline that led to the shell launching rundll32 against it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
