name: Rundll32 Execution Without CommandLine Parameters
id: 40de473b-dd66-4009-a594-c9efcec92fb5
description: |
  Detects rundll32.exe started with no module or export arguments on its command line, where the parent process is not under a per-user AppData\Local path or a Microsoft Edge path. A bare rundll32.exe with no DLL and no exported function does nothing useful on its own, so this pattern is unusual for legitimate use. It matches the default fork-and-run spawn target that some post-exploitation frameworks launch as a host for injected code: a clean rundll32.exe is started and then code is written into it in memory, so the process exists without ever being given the arguments it would normally need. Determine whether the bare rundll32.exe was launched by an expected parent, whether anything was injected or spawned from it, and whether it made outbound connections.
type: detection
detection_id: 1775e15e-b61b-4d14-a1a3-80981298085a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line show rundll32.exe launched with no module or export arguments?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the command line ends with rundll32.exe (with or without a trailing quote) or bare rundll32 AND the parent process is not running from a per-user AppData\Local path or a Microsoft Edge path. Check that the full command line carries no DLL path and no exported function name after the executable, because a legitimate rundll32 invocation almost always names both.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run rundll32.exe with no arguments?
  context: Legitimate administrative or application activity can trigger this detection, but a bare rundll32.exe with no module is rarely something a person or a normal application produces on purpose. Knowing whether the user role and host function fit this behavior is often the fastest way to separate a true positive from a routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Confirm from the full command line that rundll32.exe was given no DLL and no exported function.
  context: The investigative value here is the absence of arguments. Read the complete command line for the alerting process and verify there is no module path and no export name following rundll32.exe. A bare host process is consistent with code being injected into it after launch rather than rundll32 being asked to run a specific library, which is the behavior this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this rundll32.exe and is that parent chain expected?
  context: The parent process reveals how the bare rundll32.exe was created. When a tool launches rundll32 only to inject code into it, the parent is the more meaningful artifact than the rundll32 itself. Walk up from the parent to see what spawned it; an unexpected parent such as a script host, an Office application, or an unsigned binary points to abuse rather than legitimate use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host previously launched rundll32.exe with no arguments?
  context: A no-argument rundll32 launch that has never been seen on a host is more suspicious than one that recurs. This query counts prior firings of the same no-argument pattern on this host rather than all rundll32 usage, so a zero or very low count indicates a first-time or rare occurrence of exactly the behavior the rule detects.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even an unusual pattern can have a benign recurring cause on a given host. This query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific no-argument rundll32 firing has historically run here. A new parent process, an unexpected user account, or a first-time appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this rundll32.exe spawn afterward?
  context: A rundll32 host process used for injected code often runs without spawning visible children, but post-exploitation jobs sometimes launch follow-on processes such as cmd.exe, powershell.exe, or other tooling. Any children spawned by this rundll32 reveal what the injected code actually did and whether the operation moved on to discovery, credential access, or lateral movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this rundll32.exe open any outbound network connections?
  context: A bare rundll32 launched as a host for injected code frequently makes outbound connections that the injected code uses to reach external infrastructure. Outbound connections from a rundll32 process that was started with no module are notable, since legitimate rundll32 work is typically local. Review destination addresses and ports and whether the connection is to internal or external infrastructure.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What files did this rundll32.exe write to disk around the time of the alert?
  context: Injected code running inside a rundll32 host may drop tooling, stage collected data, or write payloads to disk. Files created by this process help characterize the operation and may yield additional indicators to pivot on. Review write locations such as user-writable, temporary, or public directories.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the no-argument rundll32 pattern rather than generic rundll32 usage. Many hosts firing the same pattern can point to scripted deployment or an environment-specific automation; one host or a small unrelated set points to manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      condition: selection and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered related activity on several hosts in this window, the scope of the operation may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|endswith:
        - \rundll32.exe
        - \rundll32.exe"
        - \rundll32
      filter:
        ParentImage|contains:
        - \AppData\Local\
        - \Microsoft\Edge\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining the surrounding process activity reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence around the time the bare rundll32 launched.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline. The alert sequence often tells the story of how the operation reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
