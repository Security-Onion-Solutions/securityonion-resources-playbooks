name: Powershell Defender Exclusion
id: 01e6a74d-49ee-4df9-88df-e987adc19cc6
description: |
  Detects PowerShell cmdlets that add or set Microsoft Defender exclusions for files, folders, processes, extensions, or IP addresses. The rule fires when a command line contains both an Add-MpPreference or Set-MpPreference cmdlet AND one of the exclusion parameters (-ExclusionPath, -ExclusionExtension, -ExclusionProcess, -ExclusionIpAddress).
  Administrators legitimately carve out exclusions for performance or compatibility, so the same command is routine in many environments. Adversaries use the identical primitive to self-whitelist their own tooling so payloads in an excluded path or process are no longer scanned, and these cmdlets are frequently delivered as base64 -EncodedCommand payloads.
  Determine what was excluded, who ran it, whether the user and host are expected to manage Defender, and whether the exclusion preceded other tampering or payload execution on the host.
type: detection
detection_id: 17769c90-230e-488b-a463-e05c08e9d48f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-04
questions:
- question: Does the command line contain an Add-MpPreference or Set-MpPreference cmdlet together with an exclusion parameter?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line against the rule's criteria. The rule requires both a preference-setting cmdlet (Add-MpPreference or Set-MpPreference) AND an exclusion parameter (-ExclusionPath, -ExclusionExtension, -ExclusionProcess, or -ExclusionIpAddress) in the same command line. Note which exclusion type fired.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to manage Microsoft Defender exclusions?
  context: Legitimate exclusion management is typically performed by administrators, security tooling, or software installers on managed endpoints. Knowing whether this user role and host function include Defender configuration is often the fastest path to distinguishing routine maintenance from an operator self-whitelisting their tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly was excluded from Defender scanning, and what kind of exclusion was it?
  context: The exclusion parameter and its value determine the impact. An -ExclusionPath or -ExclusionProcess pointing at a user-writable directory, a temp folder, or an unsigned binary is the configuration adversaries use to hide payloads, whereas a path under a vendor application directory is more likely maintenance. Decode the full command line to identify the exact file, folder, process, extension, or IP address that was carved out.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: These exclusion cmdlets are frequently delivered as base64 -EncodedCommand (-enc) payloads, or hidden with string concatenation, backtick escaping, and variable substitution. Decoding reveals the true exclusion target and whether the same payload performs additional actions beyond the exclusion. If the command line is already plain text, confirm the exclusion value and move on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the exclusion still in place, or has it been removed and Defender coverage restored?
  context: An exclusion may be momentary (added for one action then removed) or persistent. Checking the current Defender exclusion list reveals whether the host still has a coverage gap. If the carved-out path, process, or extension is still excluded, it should be reviewed and removed before further investigation; Get-MpPreference shows the active exclusion lists.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the exclusion command was invoked. Interactive administration typically descends from explorer.exe or a console host, and management tooling from a known agent or installer. Unusual parents such as office applications, wscript.exe, mshta.exe, or an unsigned binary point toward exploitation or a malicious script rather than routine configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were Defender exclusions written directly to the registry on this host around the same time?
  context: Exclusions configured through the cmdlets land under the Defender Exclusions registry keys, and the same values can be written directly to the registry to bypass cmdlet-based monitoring entirely. Registry modifications to the Paths, Processes, Extensions, or IpAddresses subkeys around the alert time confirm the exclusion took effect and may surface additional exclusions added by a method other than the alerting command line.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Windows Defender\Exclusions\Paths'
          - '\Windows Defender\Exclusions\Processes'
          - '\Windows Defender\Exclusions\Extensions'
          - '\Windows Defender\Exclusions\IpAddresses'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: What activity occurred on this host after the exclusion was added?
  context: Operators add an exclusion for a reason, then run the tooling the exclusion was meant to hide from Defender. Examining what executed in the window immediately after the exclusion reveals what the carve-out enabled. Process creation in an excluded path, or a download followed by execution from that path, is the activity the exclusion was meant to protect.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: Operators who add one exclusion often disable several controls — stopping Defender services, clearing logs, deleting shadow copies, or changing firewall rules — to maximize coverage for what follows. Finding multiple tampering events from the same user or parent process indicates several controls were targeted in one operation rather than an isolated configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: When this host previously ran a Defender exclusion command, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even routine maintenance leaves a baseline. The query mirrors the rule's exclusion-command selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
      selection2:
        CommandLine|contains:
        - ' -ExclusionPath '
        - ' -ExclusionExtension '
        - ' -ExclusionProcess '
        - ' -ExclusionIpAddress '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
      selection2:
        CommandLine|contains:
        - ' -ExclusionPath '
        - ' -ExclusionExtension '
        - ' -ExclusionProcess '
        - ' -ExclusionIpAddress '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
      selection2:
        CommandLine|contains:
        - ' -ExclusionPath '
        - ' -ExclusionExtension '
        - ' -ExclusionProcess '
        - ' -ExclusionIpAddress '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated changes across multiple endpoints. If the same user added exclusions or ran other tooling on several hosts in this window, the scope of the activity is larger than one endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
      selection2:
        CommandLine|contains:
        - ' -ExclusionPath '
        - ' -ExclusionExtension '
        - ' -ExclusionProcess '
        - ' -ExclusionIpAddress '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts run a Defender exclusion command in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's exclusion-command selection with no host scope, so the result is a fleet-wide count of this firing pattern. Many hosts running the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
      selection2:
        CommandLine|contains:
        - ' -ExclusionPath '
        - ' -ExclusionExtension '
        - ' -ExclusionProcess '
        - ' -ExclusionIpAddress '
      condition: all of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded the exclusion and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
