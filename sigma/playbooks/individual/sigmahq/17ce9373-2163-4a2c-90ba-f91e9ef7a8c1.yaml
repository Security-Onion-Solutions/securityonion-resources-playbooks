name: Potential CVE-2024-35250 Exploitation Activity
id: 9cc3926b-b08e-4b79-ab62-c900237f9d14
description: |
  Detects the Windows Kernel Streaming proxy library ksproxy.ax being loaded by a process that does NOT
  live in a standard system directory (Program Files, System32, SysWOW64) AND is NOT one of the allow-listed
  browser or collaboration applications. This module is the user-mode entry point into the ks.sys / ksthunk.sys
  streaming subsystem targeted by CVE-2024-35250, an untrusted-pointer-dereference kernel privilege-escalation
  bug; an unexpected loader reaching that subsystem is the observable side effect of an exploitation attempt.
  Legitimate DirectShow media applications also load ksproxy.ax, so the investigation must establish what the
  loading process is, where it lives, whether it is signed, and whether a privilege change or follow-on
  execution occurred after the load.
type: detection
detection_id: 17ce9373-2163-4a2c-90ba-f91e9ef7a8c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting event confirm ksproxy.ax was loaded on this host, matching the rule's module-path criterion?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) against the
    rule's detection criterion. The rule fires only when ksproxy.ax loads from a process outside System32,
    SysWOW64, Program Files, and the allow-listed browser/collaboration apps, so the loader identity and its
    signature are examined in the dedicated loader and module-reputation questions. DLL loads carry a hash and
    signing status directly on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run DirectShow media software that loads Kernel Streaming filters?
  context: Legitimate media capture, streaming, and conferencing software loads ksproxy.ax as part of the
    DirectShow filter graph. Knowing whether the user role and host function normally involve such software
    is often the fastest way to separate a routine media application from an unexpected loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process load around this event, and are any from user-writable or non-canonical paths?
  context: The full set of modules a process loads tells the story when the command line is opaque. Beyond
    ksproxy.ax, look for DLLs loaded from %TEMP%, AppData, ProgramData, or Public; unsigned modules where
    signed ones are expected; and system DLL names loaded from non-system paths. An exploit binary reaching
    the streaming subsystem often also stages its own helper modules.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For ksproxy.ax and the other loaded modules, what is the signing status, hash, and threat-intel reputation?
  context: Module reputation separates the legitimate signed Microsoft ksproxy.ax from a planted or tampered
    copy staged alongside an exploit. A genuinely signed system module loaded from its normal path may be
    benign; an unsigned or invalidly signed module carrying a system-style filename is a masquerading
    indicator. Hash lookups against threat intelligence surface known exploit loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line and working directory of the process that loaded ksproxy.ax?
  context: The command line and working directory reveal how the loading process was invoked and where it
    executes from. An exploit binary typically runs from a user-writable directory (AppData, Temp, Downloads,
    a staging folder) rather than an installed application path, and its arguments may reference the target
    device or IOCTL interaction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the process that loaded ksproxy.ax a signed, installed application or an unsigned binary in a user-writable location?
  context: This is the core discriminator for the rule. The detection already filters out system directories
    and known media/browser applications, so a remaining loader that is unsigned, signed by an unfamiliar
    entity, or running from AppData, Temp, or a user profile path is a strong exploitation indicator. A signed
    application from Program Files that simply is not on the allow list points toward a benign media tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the binary that loaded ksproxy.ax, and is that parent chain expected?
  context: The parent process reveals how the loader was launched. A media application launched from
    explorer.exe or a service is routine; a loader spawned by a script host, an Office application, a
    remote-access tool, or an unusual downloader points toward a delivery chain that dropped and executed
    the exploit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: After ksproxy.ax loaded, did the loading process spawn child processes, and do any run under a higher-privilege account such as SYSTEM?
  context: Successful CVE-2024-35250 exploitation escalates the calling process from medium integrity to
    SYSTEM. Examining what the loader spawned, and under which account, shows whether the exploitation
    achieved its goal — a child process or shell running as SYSTEM shortly after the load is the observable
    outcome of the privilege escalation. This links the module load to the privilege-use stage temporally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Has ksproxy.ax been loaded on this host before, and by which processes?
  context: A first-time load of this module by this process is a stronger anomaly than a recurring one. If
    ksproxy.ax has been loaded repeatedly over the past 90 days by installed media software, this load is
    likely routine; if this is the first occurrence or the loading process is new, the current load is
    anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded ksproxy.ax?
  context: A loading binary that has never been seen on this host is more suspicious than one that runs
    regularly. Zero or very low historical counts over 90 days indicate first-time or rare execution,
    consistent with a freshly dropped exploit tool.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is ksproxy.ax being loaded by unexpected processes on other hosts in the environment?
  context: Cross-host correlation surfaces the scope of the activity. The same module loaded by the same
    unexpected process across multiple hosts suggests a distributed exploitation attempt or shared tooling,
    while a single-host load is more likely a localized incident. Pay attention to the variety of loading
    processes across hosts.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in the minutes around the load reveals the
    immediate context: what delivered and launched the loader, what it did after gaining privileges, and
    whether reconnaissance, credential access, or persistence followed.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or delivery of tooling —
    may reveal the stages that preceded the exploitation attempt and help reconstruct the timeline leading
    up to the module load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the process that loaded ksproxy.ax write any files to disk, and are they still available for analysis?
  context: If the loader dropped a payload, decoded output, or additional tooling, checking whether those
    files still exist enables deeper analysis — hash lookups, sandbox submission, or content review. The
    query correlates file writes to the loading process and its direct children by process lineage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
