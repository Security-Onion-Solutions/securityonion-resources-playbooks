name: Python Function Execution Security Warning Disabled In Excel - Registry
id: d96944fb-9160-4bef-8082-8941ef90c408
description: |
  Fires when a process writes the DWORD value 0x00000001 to a registry value named
  PythonFunctionWarnings under an Excel\Security key inside the Office policy tree
  (TargetObject contains \Microsoft\Office\ and ends with \Excel\Security\PythonFunctionWarnings).
  This policy value governs Excel's security prompt for Python-in-Excel (=PY()) formulas: 0 runs
  Python silently, 1 shows a business-bar security warning, and 2 blocks Python entirely. Because
  the value sits in the Office policy tree, whoever writes it controls whether users are warned
  before attacker-supplied workbook code runs, so the investigation should establish which process
  and user changed it, whether that source is authorized to set Office policy, and whether the change
  is part of a broader configuration-tampering session.
type: detection
detection_id: 17e53739-a1fc-4a62-b1b9-87711c2d5e44
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key path and value data match the Excel Python security-prompt policy value this rule detects?
  context: >-
    The rule fires when a process writes the DWORD value 0x00000001 to a value named PythonFunctionWarnings
    under an Excel\Security key inside the Office policy tree (TargetObject contains \Microsoft\Office\ and
    ends with \Excel\Security\PythonFunctionWarnings). Confirm the exact path and value data against the
    triggering event before investing further time; this value controls whether Excel prompts before running
    Python (=PY()) formulas.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Excel Office security policy values?
  context: >-
    Office policy values under the Policies\Microsoft\Office tree are normally set by administrators, Group
    Policy, or management tooling, not by end users or ad-hoc scripts. A change written by a user-context
    process, a script host, or Office itself on a workstation is more notable than one pushed by a management
    agent. User attribution is present on most endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and is this a known evasion-relevant registry location?
  context: >-
    This value governs Excel's security prompt for Python-in-Excel code: 0 runs =PY() formulas silently, 1
    shows a business-bar security warning, and 2 blocks Python entirely. Because the key sits in the Office
    policy tree, whoever controls it controls whether users are warned before attacker-supplied workbook code
    runs. Confirm the exact value written and which process wrote it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command performed this registry write, and what security control does it target?
  context: >-
    The writing process's command line shows how the value was set, whether a reg.exe write, a PowerShell
    Set-ItemProperty, or an Office or installer process. The target is Excel's Python execution prompt; a
    hands-on operator setting it from a shell or script differs from an administrative deployment. Decode the
    full command to see the exact value written and any surrounding actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the process that made this change, and is that parent chain expected?
  context: >-
    The parent of the writing process shows how the change was launched. A management agent or Group Policy
    service parent is routine; an Office application (EXCEL.EXE, WINWORD.EXE), a script host (wscript.exe,
    mshta.exe), or an interactive shell as the parent points to macro- or phishing-driven execution rather
    than administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does the altered value still stand, or was it later reset to a prompting or blocking value?
  context: >-
    This policy value controls Excel's Python prompt (0 silent, 1 warn, 2 block). Registry value deletions are
    not observable in endpoint telemetry, so judge the current state from the key's modification history.
    Repeated writes, or a later change to 0 (silent execution), would show someone actively steering Excel's
    Python enforcement rather than a one-time setting; if the most recent write is a prompting or blocking
    value, the exposure window was bounded.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry values were modified on this host in the same window?
  context: >-
    A single Office policy change alongside other registry edits from the same process or user, such as
    security-tool policies, Run keys, or other Office trust settings, points to a broader configuration-tampering
    session rather than an isolated change. Group by key path and writing process to see what else landed.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-evasion or security-configuration commands run on this host?
  context: >-
    Operators who weaken one control often weaken several. Command-line writes that clear logs, disable
    Defender, change firewall rules, or stop services in the same window as this Office policy change indicate
    multiple controls were targeted in one session. Exclude the writing process from the current alert to
    surface other tampering activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Registry modifications immediately before and after the alert reveal
    what configured this change and what followed. Aggregating by key path and writing process collapses
    routine noise while novel modifications stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: Has this Excel security-policy value been modified before on this host?
  context: >-
    Policy values like this should rarely change. A long history of writes suggests managed configuration;
    zero prior history means this is the first time the value has been touched on this host, which raises the
    significance of the change. Compare the historical value data against the current write.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Excel security-policy value modified on other hosts recently?
  context: >-
    The same change across many hosts points to a Group Policy push or management deployment; a change on only
    this host looks targeted or endpoint-local. Compare the value data across hosts, since a fleet-wide write
    of the same value is likely policy while scattered one-off writes are not.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process activity occurred on this host after the policy value was changed?
  context: >-
    If the change was meant to enable silent execution of attacker-supplied Excel code, examine what ran
    afterward: Office applications opening documents, script hosts, or follow-on tooling. Python-in-Excel
    formulas execute in a remote isolated container and leave no local process, so focus on the surrounding
    host activity, including what launched Excel and what ran alongside it.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier alerts on the same host, such as phishing-document execution, script activity, or other
    defense-evasion, may show the stages that preceded this change and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host in the surrounding window?
  context: >-
    A defense-evasion change is often one step in a longer operation. Scheduled tasks, services, registry Run
    keys, or BITS jobs created from the same user or timeframe indicate the operator established footholds
    beyond the detected setting change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
