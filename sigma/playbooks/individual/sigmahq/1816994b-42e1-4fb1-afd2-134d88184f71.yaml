name: PowerShell Base64 Encoded WMI Classes
id: e30c3a0a-64cb-442c-b27f-92035a2f97f2
description: |
  Fires when powershell.exe or pwsh.exe runs with a command line that carries the base64-encoded
  fragment of a sensitive WMI class name (Win32_ShadowCopy, Win32_ScheduledJob, Win32_Process,
  Win32_UserAccount, or Win32_LoggedOnUser). The rule matches when the process is PowerShell AND at
  least ONE of those encoded class fragments is present, so any single class match triggers it.
  Encoding the WMI class name hides discovery, account enumeration, shadow-copy deletion, or
  scheduled-job manipulation from plaintext command-line inspection. Legitimate administrative
  scripting and management tooling can reference these classes, so the investigation should decode
  the full command, recover the deobfuscated script, and determine whether the WMI operation fits
  the host and user's normal management activity.
type: detection
detection_id: 1816994b-42e1-4fb1-afd2-134d88184f71
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects — PowerShell carrying an encoded WMI class fragment?
  context: Confirm the alert is a true positive before investing time. The rule fires when the process is powershell.exe or pwsh.exe AND the command line contains the base64-encoded fragment of at least one sensitive WMI class — Win32_ShadowCopy, Win32_ScheduledJob, Win32_Process, Win32_UserAccount, or Win32_LoggedOnUser. Note which encoded class fragment matched, because the class identifies the intended operation (shadow-copy manipulation, scheduled-job control, process or account enumeration) and steers the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run WMI queries against shadow copies, scheduled jobs, processes, or accounts?
  context: Legitimate administration, inventory tooling, and management scripts query these WMI classes. Knowing whether the user role and host function routinely involve PowerShell-driven WMI management is often the fastest way to separate a true positive from sanctioned operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the base64-encoded WMI class fragment, and the surrounding command, decode to?
  context: The class name is base64-encoded specifically to defeat plaintext inspection; the encoding present in multiple byte-offset variants is how the rule catches it regardless of where the fragment lands in the wider blob. Decode the encoded segments and any -EncodedCommand (-enc) payload to recover the full WMI operation — for example, enumerating accounts, listing processes, or deleting shadow copies — and identify which class is targeted and what the script does with the result.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated WMI script content?
  context: Event ID 4104 records the deobfuscated script PowerShell actually executes, even when the command line is base64-encoded. This gives ground truth about the WMI operation — the class queried, any filters or method calls, and what was done with the results — bypassing the encoding the rule fired on. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell defenses before running an encoded payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (Set-ExecutionPolicy or -ep bypass), and downgrade to PowerShell v2 which lacks script-block logging. Finding these in the hour before the encoded WMI command strengthens the case that the encoding was meant to evade detection rather than to satisfy a benign tooling convention.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. Interactive administration usually descends from explorer.exe or a console host; encoded WMI enumeration launched from Office applications, mshta.exe, wscript.exe, or a remote-execution service is far more likely to be operator activity. Walk the parent chain to see what invoked this and what else the parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this PowerShell instance spawn afterward?
  context: WMI-based discovery and account enumeration are frequently a precursor to further action. Children such as cmd.exe, additional powershell.exe instances, certutil.exe, or remote-execution utilities point to post-enumeration activity worth following; a quiet process with no children suggests one-off reconnaissance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run powershell.exe or pwsh.exe?
  context: A PowerShell binary that runs regularly on a host is less notable than one seen rarely. Zero or very low historical counts indicate first-time or unusual execution and raise the weight of the encoded WMI command.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's encoded-WMI pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine management can encode WMI class names. This query mirrors the rule's full selection structure scoped to this host, so the resulting parent/user distribution reflects how the encoded-WMI pattern specifically has run here, not generic PowerShell usage. A new parent process, an unexpected user account, or a never-before-seen pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli_shadowcopy:
        CommandLine|contains:
        - VwBpAG4AMwAyAF8AUwBoAGEAZABvAHcAYwBvAHAAeQ
        - cAaQBuADMAMgBfAFMAaABhAGQAbwB3AGMAbwBwAHkA
        - XAGkAbgAzADIAXwBTAGgAYQBkAG8AdwBjAG8AcAB5A
        - V2luMzJfU2hhZG93Y29we
        - dpbjMyX1NoYWRvd2NvcH
