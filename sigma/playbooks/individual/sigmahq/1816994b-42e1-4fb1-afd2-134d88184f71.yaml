- question: Have other hosts fired the rule's encoded-WMI pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the encoded-WMI firing pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or management automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
