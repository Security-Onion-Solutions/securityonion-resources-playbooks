        - dpbjMyX1NjaGVkdWxlZEpvY
        - XaW4zMl9TY2hlZHVsZWRKb2
      selection_cli_process:
        CommandLine|contains:
        - VwBpAG4AMwAyAF8AUAByAG8AYwBlAHMAcw
        - cAaQBuADMAMgBfAFAAcgBvAGMAZQBzAHMA
        - XAGkAbgAzADIAXwBQAHIAbwBjAGUAcwBzA
        - V2luMzJfUHJvY2Vzc
