name: Process Initiated Network Connection To Ngrok Domain
id: 79ae1060-b489-4fbd-9346-ceb5b174e73b
description: |
  Detects a process making an outbound connection to an ngrok domain. Ngrok is a reverse-tunnel
  relay: a local agent builds an outbound connection to the service, which then forwards inbound
  internet traffic back to the host — exposing an internal service without a public IP or inbound
  firewall change. Developers and support staff use it to demo local apps or reach devices behind
  NAT, but the same relay lets an implant receive command-and-control connections, stage a second
  payload, or move stolen data through a trusted-looking web service (T1572, T1567, T1102). The
  investigation identifies the connecting program, the specific ngrok subdomain and resolved
  endpoint, whether the tunnel is sanctioned, and what data moved through it.
type: detection
detection_id: 18249279-932f-45e2-b37a-8925f2597670
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and direction match what this rule detects, an outbound connection to an ngrok domain?
  context: |
    Confirm the alert from the destination hostname (a subdomain ending in an ngrok domain such
    as .ngrok.io, .ngrok.app, or .ngrok-free.app), the outbound direction, and the initiating
    process. The hostname field is sparsely populated on endpoint connection telemetry, so if it
    is empty here, recover the exact domain from the DNS-lookup question; if the event came from
    network-level telemetry it may carry the hostname but no process attribution, in which case
    the DNS and process questions supply the missing side.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user or host expected to use reverse-tunnel relay services like ngrok?
  context: |
    Legitimate ngrok use concentrates in development and support workflows — demoing a local web
    server, sharing a webhook endpoint, or reaching a device behind NAT. A developer workstation
    with a known demo habit reads differently from a server or a standard user's machine, where an
    outbound relay tunnel has no routine explanation and more often means shadow IT or
    attacker-deployed access.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is tunneling through ngrok authorized on this host?
  context: |
    Even where some tunneling is sanctioned, organizations typically approve specific services and
    hosts and maintain a list of allowed tunneling tools. Ngrok not being on that list makes this
    either shadow IT — a user exposing an internal service to the internet outside policy — or
    attacker-deployed relay access. Both outcomes need action; they differ in urgency, which the
    rest of the investigation establishes.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a documented use case or support session explaining this tunnel?
  context: |
    A sanctioned tunnel usually traces to something concrete: a development demo, a helpdesk
    session, or a documented device-access procedure. Ask the user and check support records. No
    matching context means the tunnel was established by something other than the user's
    intentional workflow — malware or an unauthorized exposure of an internal service.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which ngrok subdomains did this host resolve, and which process performed the lookups?
  context: |
    The DNS lookup carries the full subdomain and reliable process attribution even when the
    connection event lacks them, and it is the anchor for a hostname rule where the connection
    telemetry rarely records the domain. A program that normally has no reason to reach a tunneling
    relay — an Office application, a script interpreter, or an unknown binary from a user-writable
    path — is the identification that matters. Free-tier ngrok accounts get auto-generated
    subdomains while paid accounts choose custom names, so the subdomain hints at the account
    behind the relay, and repeated lookups show how long the tunnel has been active.
  range: -24h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - .ngrok-free.app
        - .ngrok-free.dev
        - .ngrok.app
        - .ngrok.dev
        - .ngrok.io
      condition: selection
    fields:
      - QueryName
      - Image
- question: What program established the tunnel, and what do its command line and working directory show?
  context: |
    Ngrok tunnels typically run through the ngrok agent with a token and a target port on the
    command line, but any tunnel client or custom implant can carry the connection. The command
    line reveals the exposed local port, the auth token or config path, and the account identity
    for a standard agent; a renamed binary, a process running from a user-writable path, or a
    program with no visible tunnel configuration points at malware rather than a known tool.
    Well-known updaters and browsers are not expected sources of ngrok traffic.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the tunnel client, and is that parent chain expected?
  context: |
    A user intentionally starting a tunnel produces an explorer.exe or shell parent; a tunnel
    client launched by a script interpreter, an Office application, a LOLBin, or a service is the
    lineage pattern of attacker-deployed tunneling. The parent's own command line shows what it was
    doing when it started the tunnel and how the tunnel client arrived on the host.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What do the specific subdomain and resolved endpoint reveal about this tunnel?
  context: |
    The service itself is well known, so the verdict comes from the specifics: the subdomain
    identifies the account (custom-named subdomains suggest an established account; auto-generated
    ones fit throwaway use), the resolved IP places it in the provider's hosting ranges, and the
    port shows what protocol rides the tunnel. Threat-intelligence lookups on the exact subdomain
    can surface prior reporting — ngrok subdomains have been used as callback endpoints for
    reverse-shell handlers and second-stage payload hosting precisely because the operator needs no
    public infrastructure of their own.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What does the connection pattern to this endpoint look like over time?
  context: |
    Connection cadence, port, and volume separate the use cases: a long-lived tunnel shows one or
    few persistent connections; command-and-control relay shows periodic reconnects at regular
    intervals; bulk data movement shows sustained transfer, with an outbound-heavy byte ratio and
    volumes beyond roughly a megabyte in a few minutes exceeding what interactive control traffic
    needs. Ngrok rides TLS on standard HTTPS ports, so a proxy-typical or non-standard destination
    port alongside it, or a large asymmetric outbound flow, suggests the tunnel carries exfiltration
    rather than a demoed web service. Byte-volume and ratio figures may require flow or session
    records where connection events do not carry them.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What other external endpoints is the tunnel process connecting to?
  context: |
    The full destination set of the connecting process shows whether it talks only to the ngrok
    relay or also to other infrastructure — a second callback endpoint, a staging server, or
    additional relay services. A standard ngrok agent should contact the provider's endpoints and
    little else; a broader destination set points at multi-channel malware using the tunnel as one
    of several paths.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What files did the tunnel process write or touch around the connection?
  context: |
    Data moving out through the relay often leaves file traces first — archives staged for
    transfer, exported datasets, or a second-stage payload the process fetched and wrote. File
    activity by the connecting process around the alert shows staging artifacts and the tunnel
    configuration itself; an archive appearing shortly before sustained outbound transfer is the
    collection-then-exfiltration sequence, while a new executable written just before or after the
    connection fits a downloaded second stage.
  range: +/-5m
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally resolve ngrok domains?
  context: |
    A host that has resolved ngrok domains regularly for months under the same process is an
    established workflow — still worth an authorization check, but not an emerging intrusion. No
    prior history, or a history that starts abruptly in recent days, marks when the tunnel appeared
    and gives the timeline anchor for the rest of the investigation. Domain history is used here
    rather than a single resolved IP because the relay's addresses rotate.
  range: -90d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - .ngrok-free.app
        - .ngrok-free.dev
        - .ngrok.app
        - .ngrok.dev
        - .ngrok.io
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the connecting program?
  context: |
    A program that has run regularly under the same user for months supports the
    established-workflow reading; one appearing on this host for the first time at the alert points
    at fresh tooling. The user grouping also shows whether the program runs under the interactive
    user or a service context, which changes who to ask about the tunnel.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Which other hosts resolve ngrok domains?
  context: |
    Fleet-wide lookups of ngrok domains show the true footprint: a handful of developer machines
    with distinct subdomains fits scattered individual use, while multiple hosts resolving the same
    subdomain, or servers with no development role appearing in the list, points at coordinated
    tooling or a shared relay endpoint. Each host found needs the same authorization check as this
    one.
  range: -7d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith:
        - .ngrok-free.app
        - .ngrok-free.dev
        - .ngrok.app
        - .ngrok.dev
        - .ngrok.io
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert place the tunnel in its surrounding
    sequence — collection or discovery tooling before it, interactive activity through it after.
    Novel low-count pairs stand out against repetitive agent noise and reveal whether the
    connection is one step in a larger operation.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — credential access, archive tooling, discovery commands, defense tampering
    — may capture the stages that preceded the tunnel: what the operator collected before moving
    it, or how the tunnel client arrived. The alert timeline reconstructs the sequence from foothold
    to relay.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
