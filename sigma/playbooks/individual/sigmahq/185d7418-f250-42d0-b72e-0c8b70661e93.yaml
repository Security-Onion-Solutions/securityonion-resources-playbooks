name: Suspicious Diantz Download and Compress Into a CAB File
id: 77b5ef5b-953d-4607-bc2d-40ae90f997dc
description: |
  Detects diantz.exe invoked with a remote UNC source path and a .cab destination, the
  documented pattern for pulling a file from a remote share and packaging it into a cabinet
  archive on the local machine. diantz is a built-in Windows cabinet utility, so this command
  pattern is a living-off-the-land way to stage or retrieve content without a dedicated download
  tool. Legitimate use is rare and usually tied to administrative packaging or deployment
  scripting; the investigation should establish what remote file was pulled, where the .cab
  landed, who and what launched the command, and whether the transfer actually completed.
type: detection
detection_id: 185d7418-f250-42d0-b72e-0c8b70661e93
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show diantz.exe pulling from a remote UNC path into a .cab file?
  context: Confirm the alert is a true positive by reviewing the full command line. The rule fires
    only when the command contains diantz.exe, a UNC reference ('\\'), and the .cab extension all
    together, which is the documented remote-download-and-compress invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run diantz.exe against remote shares?
  context: Cabinet packaging from a remote UNC source is uncommon outside of deployment or backup
    tooling. Knowing whether this account and endpoint normally perform administrative file
    packaging is often the fastest way to separate routine operations from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full diantz command — what remote source path and what local .cab destination?
  context: Decode the command line to read the exact UNC source ('\\server\share\file') and the
    destination .cab path. The source path identifies what remote system the file came from and
    the destination shows where the packaged archive landed for follow-on file analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - diantz.exe
        - ' \\'
        - .cab
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned diantz.exe and is that parent chain expected?
  context: The parent process reveals how diantz was invoked. Interactive use from explorer.exe or
    a console differs from invocation by a script host (wscript.exe, mshta.exe), an Office
    application, or an unfamiliar automation, which point toward scripted or operator-driven use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously matched this diantz pattern, what parents and users drove it,
    and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the parent and user
    distribution reflects how this specific diantz-to-cab pattern has historically run here. A new
    parent, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - diantz.exe
        - ' \\'
        - .cab
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did diantz.exe spawn afterward?
  context: A cabinet packaging tool normally spawns nothing. Children such as cmd.exe,
    powershell.exe, or certutil.exe following diantz indicate the staged content was unpacked or
    executed, moving past delivery into post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts matched this diantz pattern in the past week, and does the spread look
    like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this diantz-to-cab pattern rather than generic diantz usage. Many hosts firing the same pattern
    suggests scripted deployment or vendor automation; a single host or small unrelated set points
    to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - diantz.exe
        - ' \\'
        - .cab
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - diantz.exe
        - ' \\\\'
        - .cab
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - diantz.exe
        - ' \\\\'
        - .cab
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across
    multiple endpoints. If the same account triggered similar packaging or transfer activity
    elsewhere, the scope of the operation may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - diantz.exe
        - ' \\\\'
        - .cab
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the event reveals the
    immediate context: what led to the diantz invocation, what followed it, and whether it is part
    of a larger sequence such as reconnaissance, staging, or exfiltration preparation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, defense tampering
    — may reveal the stages that preceded this transfer and help reconstruct the timeline that led to
    the staging activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the .cab file actually get created at the destination path?
  context: A diantz command does not guarantee the transfer completed. Network errors, an
    unreachable share, or security controls may have blocked it. Confirming creation of the .cab at
    the destination path establishes whether the operation progressed past delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What files did diantz stage on disk (the .cab and its source), and can you retrieve and expand them for analysis?
  context: diantz pulls a file from the remote share and packages it into a cabinet archive on the
    local machine — both the source file and the .cab are data staged on disk, not something
    executed, and file-creation events carry no hash. The archive itself is the value — retrieve the
    .cab from the path below, expand it (e.g. with expand.exe), and inspect the packaged file —
    submit that file's hash to threat intelligence or detonate it in a sandbox. This query shows
    what diantz and its children wrote.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the .cab destination directory?
  context: Operators often stage multiple files in the same directory, or the packaged archive
    triggers further writes (extraction, additional pulls). Examining directory-level file activity
    reveals the broader scope of the staging operation.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What network or SMB connections did diantz.exe make around the time of the alert?
  context: diantz pulls its source file over a remote path, so a successful transfer leaves an
    outbound connection — typically SMB over port 445 to the remote share, or HTTP(S) for an
    internet source. Identifying the remote endpoint shows where the staged content originated and
    whether the destination is internal or external.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \diantz.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
