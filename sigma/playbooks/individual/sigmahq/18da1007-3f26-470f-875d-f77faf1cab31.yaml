name: Ps.exe Renamed SysInternals Tool
id: d0489373-755f-4832-b343-96bd5d993d06
description: |
  Detects a command line that contains both 'ps.exe -accepteula' and '-s cmd /c netstat' — the invocation
  pattern of a SysInternals remote-execution utility renamed to ps.exe, driving a netstat command on a
  remote host under the SYSTEM account. The -accepteula switch identifies the tool as a SysInternals
  binary regardless of the name it carries on disk, and the -s cmd /c construction runs an arbitrary
  command remotely with elevated context. The unrenamed tool has routine administrative uses, so the
  investigation should establish the binary's true identity from its PE metadata and hash, how it reached
  the host, who invoked it, and whether the renaming and the remote netstat call fit a known
  administrative or assessment workflow rather than reconnaissance performed by an operator.
type: detection
detection_id: 18da1007-3f26-470f-875d-f77faf1cab31
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line contain both 'ps.exe -accepteula' and the '-s cmd /c netstat' remote
    execution construction?
  context: >-
    The rule requires both substrings in the same command line. Confirm the alerting event carries the
    -accepteula switch alongside a -s cmd /c netstat argument before investing further time, and record
    the remote target and credential arguments that appear between them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run SysInternals remote-execution tooling against other
    machines?
  context: >-
    Administrators, deployment systems, and monitoring agents legitimately run SysInternals remote
    execution utilities. Knowing whether this account and this host normally perform remote command
    execution is often the fastest way to separate routine administration from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this renamed SysInternals execution part of an authorized penetration test or red team
    engagement?
  context: >-
    Assessment teams routinely rename SysInternals binaries to test detection coverage and run remote
    commands with them. Check whether an engagement is active on this host or network segment; a
    documented engagement whose scope and timing match the event resolves the alert without further
    analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which remote target, account, and command were passed to the tool on this invocation?
  context: >-
    A SysInternals remote-execution utility can run any command on any reachable host. Read the argument
    order to identify the target machine, the -u/-p credential pair if present, and the command carried
    by -s cmd /c. Explicit credentials on the command line mean a password was exposed in process
    telemetry and the account should be treated as needing rotation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What other commands were run through this renamed tool around the time of the alert?
  context: >-
    Remote-execution tooling is normally used in sequences — enumerate, then act. Scoping to the
    'ps.exe -accepteula' invocation pattern on this host in a short window shows whether the netstat
    call was a single check or one step in a run of remote commands, and which targets were addressed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'ps.exe -accepteula'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is the actual identity of this binary based on its PE metadata and hash?
  context: >-
    Renaming changes the name on disk but not the embedded PE metadata. Compare the Image path against
    OriginalFileName — a SysInternals remote-execution utility retains its original name there. The
    signer tells whether this is the Microsoft-signed original, a third-party build, or an unsigned or
    modified copy, and the hash supports a reputation lookup to distinguish a known-good tool from a
    trojanized or novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this renamed binary arrive on the host?
  context: >-
    A renamed utility was copied, downloaded, extracted, or dropped by some process. Matching the file
    name over a long window surfaces every write of that name to this host and shows the creating
    process — a browser or download utility, an archive extractor, a remote admin tool, or an installer.
    The interval between the file write and this execution also indicates whether the binary was staged
    long ago or placed immediately before use.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What process spawned this tool and is that parent chain expected?
  context: >-
    The parent reveals how the invocation was driven. An interactive shell, a remote-management agent,
    or a deployment service each imply a different origin story; a script host, an Office application,
    or a process launched from a user-writable directory points at execution the user did not initiate.
    Note what else the parent spawned in the same session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did this binary do after execution, and is the same renamed binary present on other
    hosts?
  context: >-
    The point of renaming is to keep the tool's function while changing its label, so the child processes
    show the actual objective. A remote-execution utility launching local command interpreters, archive
    tools, or credential-access binaries indicates the operation continued past the netstat call. The
    same renamed binary running on additional hosts points to deliberate distribution rather than a
    one-off copy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Are known artifacts of this tool present on the host?
  context: >-
    SysInternals remote-execution utilities leave characteristic traces — the EULA acceptance registry
    value, a service binary written to the target's admin share, and output files where command results
    were captured. Files written by this process confirm what the tool produced and can survive after
    the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: When this host has previously fired the rule's pattern, what parents and users normally drive
    that activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this specific invocation pattern has run here rather than generic tool
    usage. A new parent, an unexpected account, or a first occurrence in the window is the deviation
    worth chasing; a steady prior history points at an established administrative practice.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ps.exe -accepteula
        - -s cmd /c netstat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, giving their 90-day history of
    this exact invocation pattern aggregated by host. An account that has never produced it warrants more
    weight than one that does so on a schedule; compare the host list against the systems the account is
    expected to administer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ps.exe -accepteula
        - -s cmd /c netstat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, the user field does not attribute the
    behavior and the launch mechanism becomes the meaningful pivot. This query gives the 90-day history
    of this parent driving this specific pattern, aggregated by host. A parent that already accounts for
    a large prior volume is automation; a parent that is new for this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ps.exe -accepteula
        - -s cmd /c netstat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Remote-execution tooling is used to reach other machines, so the account's activity across the fleet
    in the alert window shows whether the netstat call was isolated or part of a wider sweep. If the
    alert fired under a service principal this view returns routine agent telemetry and the
    parent-driven view is the meaningful one instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, a user-scoped fleet view returns agent telemetry from every machine. This
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several hosts in the same window points at scheduled or pushed automation; a single
    host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ps.exe -accepteula
        - -s cmd /c netstat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity on the host in the surrounding window collapses repetitive agent noise
    into high-count rows and leaves novel parent-child pairs visible at low counts. Look for the stages
    that typically bracket remote command execution — enumeration of accounts, shares, or sessions
    beforehand, and archiving, credential access, or additional remote calls afterward.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of
    this invocation pattern rather than the generic footprint of the binary. Many hosts running it
    consistently points at scripted deployment or vendor automation; one host or a small unrelated set
    points at manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ps.exe -accepteula
        - -s cmd /c netstat
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Remote command execution normally follows access and enumeration steps. Earlier detections on the
    same host — credential access, share or session enumeration, defense tampering, or the arrival of
    tooling — help reconstruct how the operator reached the point of running commands on other machines.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
