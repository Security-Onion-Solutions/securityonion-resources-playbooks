name: Wow6432Node Classes Autorun Keys Modification
id: 60902c4a-2b5f-4c70-80bd-18d9e88af592
description: |
  Detects modification of a shell-extension handler registration under the 32-bit Wow6432Node\Classes hive -- DragDrop, ContextMenu, Column, CopyHook, and PropertySheet handlers, plus specific shell-view CLSID Instance keys -- which Windows loads automatically when Explorer or the shell renders folders and files. Registering a handler here is an autostart extensibility point (ASEP): the referenced COM object (a DLL) is loaded into shell processes without the user launching anything, giving persistence that survives reboot and runs in the logged-on user's context. The rule fires only when the handler value is non-empty, so a populated registration pointing to a COM object is the pattern; legitimate installers and shell-integration software also register these handlers, so the investigation should establish which process wrote the value, what COM object it references, and whether the registration coincides with an approved deployment or with other suspicious activity on the host.
type: detection
detection_id: 18f2065c-d36c-464a-a748-bcf909acb2e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the modified shell-extension handler key and its value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. Review the exact key path (TargetObject) under Wow6432Node\Classes, the value data written (Details), and the writing process against the rule's criteria. The rule fires only when the handler value is non-empty -- an empty registration is filtered out -- so a populated value referencing a COM object is what to verify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register shell-extension handlers in the Classes hive?
  context: Legitimate administrative activity and software installs register shell handlers. Knowing whether the user role and host function are consistent with modifying Classes shell-extension handlers is often the fastest way to separate a routine install from an unexpected persistence write. User attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was this shell-handler registration part of a documented software installation or approved change?
  context: Installers routinely register shell-extension handlers, and this rule's most common benign cause is legitimate software setup. A corresponding deployment record, maintenance window, or change ticket suggests authorized activity; its absence when policy requires one raises the priority. This check can quickly close an install-driven false positive or escalate an unexplained write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this registry value, and what started that process?
  context: The writing process and its parent chain reveal how the handler registration happened. A trusted installer or msiexec chain looks different from a script host, Office application, or shell one-liner writing directly to the Classes hive. Tracing the writer's own parent shows whether the execution chain is a legitimate install or an interactive or scripted modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which shell-extension handler was registered, and is this a known persistence location?
  context: The specific subkey determines what triggers the payload. DragDropHandlers, ContextMenuHandlers, ColumnHandlers, CopyHookHandlers, and PropertySheetHandlers load their COM object when Explorer renders or acts on folders and files, and the listed CLSID Instance keys hook shell-view extensions. All are autostart extensibility points that Windows loads without user action; the value name and data (Details) identify the COM object that will be loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What COM object does the registered value reference, and where is its backing module on disk?
  context: For shell-extension handlers the value data (Details) is typically a CLSID GUID rather than a direct file path; the DLL that actually loads is registered under that CLSID's InprocServer32 subkey. Resolve the GUID to its InprocServer32 path to identify the module Explorer will load, and treat an unsigned DLL in a user-writable location (Temp, AppData, ProgramData) as high-risk. Value data is recorded on most but not all registry modifications, so an absent Details field does not by itself clear the write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does this handler registration persist, or was the value later changed back?
  context: Endpoint telemetry does not emit registry deletion events, so removal of the key cannot be observed directly. Judge whether the persistence is still active from the key's re-modification history over a longer window and from whether the referenced COM module was subsequently loaded or executed. A value that is written once and never reverted remains an active autostart entry across reboots.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications were made on this host in the same session?
  context: Actors who register one persistence handler often make several changes at once -- additional handlers, Run keys, service entries, or security-setting tampering. Registry changes clustered from the same writing process within a short window reveal the full scope of the configuration changes and whether multiple objectives were pursued rather than a single benign edit.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the referenced COM module or payload written to disk in the same session?
  context: A shell-extension hijack is only effective if the DLL named by the CLSID's InprocServer32 entry exists on disk. Correlating file activity from the registry-writing process and its children within a short window (registration and payload drop typically land together, often inside 5-10 minutes) shows whether the backing module was placed. The file-write event carries no hash; if the module is present, hash it from a later load or execution for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this shell-extension handler key been modified before on this host?
  context: Shell handler registrations normally change only during software installs, not routinely. A first-time or rare modification to this key is more suspicious than a value that has been written before. Zero history indicates a handler that has never been touched on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same handler key modified on other hosts in the environment?
  context: The same registration appearing across many hosts often indicates a software rollout or group policy rather than a targeted implant; a change confined to this one host is more likely to be targeted. Compare the value data across hosts to see whether the same COM object is being registered everywhere or only here.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: After the registration, did new or unusual processes execute on this host?
  context: Because the shell loads registered handlers automatically, a hijacked handler's
    payload can run whenever Explorer renders a folder or the shell is restarted. The query is
    an aggregated survey of executions on this host grouped by parent-child pair, so routine
    telemetry collapses into high-count rows; a novel pair at a low count -- especially a
    shell process launching a binary from a user-writable directory -- is the sign the
    handler's module ran. Correlate registration and execution within a short window,
    typically 5-10 minutes for immediate triggers.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: What other activity occurred on this host around the time of the registration?
  context: Alerts rarely occur in isolation. Examining process activity in a tight window around the registration reveals what led to it and what followed -- reconnaissance, privilege escalation, or additional persistence -- and whether this write is part of a larger sequence. Novel parent-child pairs stand out against high-count routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. Alongside a shell-extension handler, they commonly stack backup persistence via scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely -- dropping an executable or script into a Startup folder or a Run-key-referenced path achieves autostart without any persistence tool running. File monitoring captures these drops even when the shell-handler registration is only one of several mechanisms in play.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before the registration?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded this persistence write and help reconstruct the timeline. Persistence is usually established after initial access and execution, so preceding alerts often mark how the actor arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
