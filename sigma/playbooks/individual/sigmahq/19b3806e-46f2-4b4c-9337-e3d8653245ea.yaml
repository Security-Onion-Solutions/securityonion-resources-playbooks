name: Lummac Stealer Activity - Execution Of More.com And Vbc.exe
id: b8cc88b4-ae3a-40f1-9c34-c9b1b44eca21
description: |
  Detects more.com spawning vbc.exe, the .NET Visual Basic command-line compiler. The rule fires
  only when both halves match: the parent path ends in \more.com AND the child is vbc.exe (by Image
  path or by OriginalFileName). Both binaries are signed Microsoft utilities with narrow legitimate
  roles — more.com paginates piped console output, vbc.exe compiles Visual Basic source during a
  build — and neither normally launches the other, so the pairing itself is the signal. This stealer
  family uses the pair as an execution container: a loader runs the signed pager, which starts the
  compiler, and the payload is injected into the vbc.exe process so subsequent activity carries a
  Microsoft-signed process identity. Determine what started more.com, whether the vbc.exe process
  ever behaved like a compiler, and whether cross-process writes or unexpected module loads,
  network egress, or follow-on children indicate code running inside it.
type: detection
detection_id: 19b3806e-46f2-4b4c-9337-e3d8653245ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event show more.com as the parent and vbc.exe as the child?
  context: >-
    The rule requires both halves to match at once — a parent path ending in \more.com and a child
    identified as vbc.exe either by its Image path or by its OriginalFileName. Confirm both before
    investing further time, and note whether the child matched on path or on OriginalFileName: a
    vbc.exe renamed on disk still matches on OriginalFileName and is a stronger starting point than
    a copy running from its normal .NET Framework directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to run the Visual Basic command-line compiler?
  context: >-
    vbc.exe is a build tool. On a developer workstation or a build agent it runs routinely, though
    normally under a build system or an IDE rather than under a console pager. On a general-purpose
    endpoint it has no ordinary reason to run at all. Establishing whether the user writes or builds
    .NET code is often the fastest way to separate a build artifact from a loader chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started more.com, and what was its own command line?
  context: >-
    more.com is a console pager driven by piped input, so it is normally started by a shell as part
    of a command pipeline and it does not spawn compilers. Its own parent and command line show
    whether it came from an interactive shell, a script host, an archive or installer, or a process
    with no console role at all. A more.com started from a user-writable directory or from a
    download-handling application points at a loader stage rather than a console session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same more.com instance spawn?
  context: >-
    A loader that uses a signed pager as an execution container often drives more than one stage
    through it. Listing every child of this exact more.com instance shows whether vbc.exe was the
    only thing launched or one of several, and reveals staging steps such as copies, script hosts,
    or additional signed binaries started from the same point.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What command line did vbc.exe run with, and does it name any source file to compile?
  context: >-
    A genuine compile carries a target and an input — a /target: switch, a response file, or a path
    to a .vb source file — and a working directory that matches a build tree. An empty or minimal
    command line means the process was started to be a host for injected code, not to compile
    anything. The working directory also shows where the chain was operating from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Has more.com spawned vbc.exe on this host before?
  context: >-
    This counts the 90-day history of this exact parent-child pairing on the alerting host. The two
    binaries have unrelated purposes and no build toolchain routes a compiler through a console
    pager, so a zero or near-zero count is the expected result even on developer machines. A
    non-trivial count means something on this host produces the pairing regularly and the command
    lines in the results should identify it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What else did more.com launch on this host in the hours after the alert?
  context: >-
    This widens from the single alerting instance to every more.com on the host over the following
    hours. Repeated use of the pager as a launcher — further compiler starts, script hosts, or
    copies of the same binary from different directories — indicates a chain that continued past the
    detected stage rather than a one-off execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the more.com to vbc.exe spawning pattern appearing on other hosts?
  context: >-
    The same pairing on several hosts in a short period points to a delivery run reaching multiple
    users rather than a single infected endpoint, and each additional host is a separate
    investigation. A single host narrows the entry point to that machine's own recent activity. The
    per-host command lines in the results show whether the invocations are identical, which
    distinguishes a pushed payload from independent activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Does this host normally run vbc.exe at all, and under which accounts?
  context: >-
    Injection chains prefer a target process that would look unremarkable on the host, and signed
    Microsoft binaries such as vbc.exe are chosen for exactly that reason — the technique also
    targets long-lived processes like explorer.exe or lsass.exe when the goal is persistence or
    credential access rather than a disposable host. On a host with no build activity, a 90-day
    count of zero means the compiler's presence is not a background fact and the alerting execution
    is the whole story. A host that compiles regularly needs the accounts in the results checked
    against who normally builds.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- always_include: true
  question: Has this user produced the more.com to vbc.exe pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific pairing rather than generic use of either binary,
    aggregated by host. A user who has never produced it before is a stronger lead than one who
    produces it routinely. Weigh the count against what the user's role would explain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \more.com
      selection_child:
      - Image|endswith: \vbc.exe
      - OriginalFileName: vbc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this more.com parent historically driven this pattern on this host or across the environment?
  context: >-
    When the alert fires under a service principal, user identity attributes nothing. The launch
    mechanism is the meaningful pivot: this query mirrors the rule's selection structure scoped to
    the alerting parent process, giving the 90-day history of this parent driving this exact
    pattern. A parent that already accounts for a large volume of prior events is automation worth
    identifying and tuning; a parent that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \more.com
      selection_child:
      - Image|endswith: \vbc.exe
      - OriginalFileName: vbc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user run across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the
    activity is confined to this endpoint or the same account is active elsewhere. If the alert
    fired under SYSTEM or another service principal, this view fills with routine service and agent
    activity and the parent-driven fleet view is the one that carries meaning.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same more.com-driven vbc.exe pattern fire on other hosts in this same window?
  context: >-
    This query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, within the alert window, so it answers whether the launch mechanism fired elsewhere
    at the same time. Several hosts in one window points to a pushed or scheduled trigger reaching
    them together; a single host points to a host-local origin such as a downloaded file or an
    archive the user opened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \more.com
      selection_child:
      - Image|endswith: \vbc.exe
      - OriginalFileName: vbc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent-child pairs across the host in the alert window collapses repetitive
    background telemetry into high-count rows and leaves novel pairings standing out at low counts.
    Look for what preceded the pager — an archive utility, a browser, a script host, an installer —
    and for what followed, such as reconnaissance commands, copies into user-writable directories,
    or persistence registration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a sequence — a download or
    archive-extraction alert before it suggests the delivery stage, while defense-tampering or
    credential-access alerts after it suggest the injected code has already begun operating. The
    ordering and severity of the surrounding alerts reconstruct the timeline this event belongs to.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did any process on this host make the cross-process API calls that injection into vbc.exe requires?
  context: >-
    Injecting a payload into a running process requires writing into that process's memory and then
    forcing it to execute — observable as WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx
    calls from the writing process. This channel corroborates that code actually landed inside
    vbc.exe rather than the pairing being incidental, and names the process that performed the
    write. The requested access rights on the handle (values such as PROCESS_VM_WRITE) are not
    recorded in this telemetry, and only the injection side is visible — read-side memory access
    against another process leaves no event here, so absence of results is a visibility limit rather
    than evidence that nothing was injected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - process.Ext.api.summary
- question: What modules did vbc.exe load, and are any unsigned or loaded from outside the system directories?
  context: >-
    A compiler doing real work loads the .NET Framework compiler modules from under the Framework
    directory and little else. Injected code frequently brings its own modules or forces the host
    process to load one, so a module loaded from a user-writable directory, an unsigned module, or a
    module with a failed signature status inside a process that never compiled anything points at
    code running under the compiler's identity. If module-load telemetry is not collected in this
    environment, an empty result is a visibility gap rather than a clean process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did vbc.exe make outbound network connections, and to where?
  context: >-
    The compiler has no reason to talk to the network during or after a build. Stealer payloads
    running inside a host process collect browser credentials, wallet files, and system data and
    send them out shortly after execution, so egress attributed to this process is the strongest
    available evidence that the process is doing something other than compiling. Record any external
    destination for containment and for checking against other hosts.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
