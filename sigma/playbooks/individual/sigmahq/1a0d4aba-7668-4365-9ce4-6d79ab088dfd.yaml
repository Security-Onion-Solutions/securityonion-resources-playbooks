name: Ping Hex IP
id: 8fedde51-b17f-41b0-93cd-6acdef408993
description: |
  Detects ping.exe invoked with a hexadecimal-encoded IP address (an 8-hex-digit
  literal such as 0x7F000001). Windows ping accepts a 32-bit integer in place of
  dotted-decimal notation, so encoding the destination as hex hides the real target
  IP from casual inspection of the command line and from naive string-matching.
  Legitimate use is rare — administrators almost never address hosts in hex — so the
  pattern most often appears in offensive tooling that resolves or pings a hidden
  destination. Decode the hex value to the actual IP, determine what that destination
  is and whether a connection followed, and establish how ping was launched and by whom.
type: detection
detection_id: 1a0d4aba-7668-4365-9ce4-6d79ab088dfd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show ping.exe with an 8-digit hexadecimal IP (0x followed by 8 hex characters)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires when the image ends in ping.exe and the command line contains a hex literal of the form 0x then eight hex digits, which is how a 32-bit IP address is encoded in hexadecimal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run ping with a hex-encoded address?
  context: Legitimate administrative use of ping uses hostnames or dotted-decimal IPs; hex-encoded targets are not a normal operator habit. Knowing whether the user role and host function involve any tooling that would produce this form is often the fastest path to distinguishing a true positive from a one-off curiosity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What was the full ping command line on this host, including every argument and any chained commands?
  context: The full command line reveals the specific action taken. Read every flag and parameter beyond the hex address — count, timeout, source interface — and check whether ping was one segment of a chained command (for example joined with &, &&, or a pipe) that does additional work once the destination is reached. This scopes to ping.exe executions on the host so multiple sequential invocations that form one logical operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What dotted-decimal IP does the hex value decode to, and what is that destination?
  context: The 8-hex-digit literal is a 32-bit integer encoding of an IPv4 address. Convert each byte to decimal to recover the real target — for example 0x7F000001 decodes to 127.0.0.1 and 0x08080808 to 8.8.8.8. Identify whether the decoded address is loopback, private (RFC1918), or a routable external host, and whether it corresponds to known infrastructure. The hex form can vary in case and byte order, so reconstruct the address deliberately rather than assuming a layout.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did a network connection to the decoded destination IP follow the ping on this host?
  context: Encoding the IP hides the destination, but the operation only matters if traffic reaches it. After decoding the hex to a dotted-decimal address, look for outbound connections to that IP from this host in the surrounding window — a connection following the ping points to reachability checking ahead of command-and-control or staging, while no connection suggests a probe or test. Substitute the decoded address for the related-IP placeholder when running this.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%related_ip%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
- question: What process spawned ping.exe and is that parent chain expected?
  context: The parent process reveals how ping was invoked. A user-driven ping typically descends from an interactive shell or explorer.exe; ping launched by mshta.exe, wscript.exe, an Office application, or an unexpected script host points to automated or scripted invocation worth tracing further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ping.exe spawn afterward on this host?
  context: ping.exe normally spawns nothing. Children such as cmd.exe, powershell.exe, or certutil.exe following the ping indicate the hex-IP ping was a step within a larger chain — for example a reachability check preceding a download or further execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run ping.exe?
  context: A binary that runs regularly on a host is less notable than one that is rare here. Zero or very low historical counts indicate first-time or unusual use of ping on this host, which raises the weight of a hex-encoded destination.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even common tools can be abused. The query mirrors the rule's selection — ping.exe with a hex-encoded IP — scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically run here rather than generic ping usage. A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ping.exe
        CommandLine|re: 0x[a-fA-F0-9]{8}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of hex-encoded ping activity rather than generic ping usage. Many hosts firing the same pattern points to scripted deployment or a tool packaged into automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ping.exe
        CommandLine|re: 0x[a-fA-F0-9]{8}
      condition: selection
    fields:
    - host.name
- question: What other tools ran on this host around the same time as the ping?
  context: A hex-IP ping is rarely the whole story. Activity surrounding it may reveal reconnaissance, a download cradle, privilege escalation, or staging that frames the ping as a reachability check within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ping.exe
        CommandLine|re: 0x[a-fA-F0-9]{8}
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ping.exe
        CommandLine|re: 0x[a-fA-F0-9]{8}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action across multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \ping.exe
        CommandLine|re: 0x[a-fA-F0-9]{8}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the full timeline around the hex-IP ping.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
