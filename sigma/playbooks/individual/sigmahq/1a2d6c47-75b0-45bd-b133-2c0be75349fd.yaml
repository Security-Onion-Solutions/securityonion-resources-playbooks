name: Wdigest CredGuard Registry Modification
id: 432ffd5f-4af6-4b2c-83ea-665dea3c061e
description: |
  Detects modification of the IsCredGuardEnabled value under HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders\WDigest,
  which controls whether WDigest honors Credential Guard protection. Setting this value to 0 disables Credential Guard for
  WDigest and is commonly paired with UseLogonCredential=1 so that WDigest resumes caching cleartext credentials that can be
  harvested from LSASS on subsequent logons. Legitimate changes to this key are almost always driven by group policy or a
  security-baseline rollout; an ad-hoc modification from an interactive shell or scripting host, especially alongside a
  UseLogonCredential change, points to credential-access hardening being deliberately weakened. Determine what value was
  written, which process wrote it, whether the paired WDigest value was also touched, and whether credential-access activity
  followed.
type: detection
detection_id: 1a2d6c47-75b0-45bd-b133-2c0be75349fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified registry value match the WDigest IsCredGuardEnabled path this rule detects?
  context: Confirm the alert is a true positive by verifying the triggering event modified a value whose path ends in
    \IsCredGuardEnabled under the WDigest SecurityProviders key, and note the writing process. The rule fires on the key path
    alone, so the value data itself is examined in the value-decode question to establish intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Credential Guard or WDigest security-provider settings?
  context: Changes to credential-protection policy keys are normally made by group policy or a small set of administrators
    on managed systems. If the writing user is a standard workstation user, or the host has no reason to have its credential
    protections reconfigured, the modification is harder to explain as routine administration. User attribution is present on
    most endpoint registry events; when it resolves to a machine account or is missing, judge legitimacy from the writing
    process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to IsCredGuardEnabled, and does it disable Credential Guard?
  context: A DWORD of 0 written to IsCredGuardEnabled tells WDigest to ignore Credential Guard protection; a value of 1 leaves
    it enforced. The disable action is meaningful when combined with UseLogonCredential=1, which forces WDigest to cache
    cleartext credentials on the next logon. If the value data is not captured in this environment (binary or empty data is
    not always recorded), treat the modification as suspicious on the key path alone and confirm the value directly on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the WDigest SecurityProviders key a known credential-protection location, and what does modifying it change?
  context: The WDigest key under HKLM\SYSTEM\CurrentControlSet\Control\SecurityProviders governs how WDigest handles cached
    credentials. IsCredGuardEnabled and the sibling UseLogonCredential value together determine whether cleartext credentials
    are exposed to LSASS harvesting. Modifications here are credential-access hardening changes, not routine configuration, so
    the writing process and the exact value written determine whether protection was weakened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the process that wrote this value expected to change security settings, and what started it?
  context: Legitimate credential-protection changes come from group-policy tooling or a management agent, not from an
    interactive shell or scripting host. Tracing the writing process back to its parent reveals whether the change originated
    from a managed workflow or from a hands-on session. Unsigned writing processes or an unusual parent lineage performing a
    security-policy change is a strong reason to escalate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry values modified on this host in the same session, including the paired UseLogonCredential value?
  context: The credential-access effect of disabling Credential Guard depends on WDigest also being told to cache cleartext
    credentials, so the classic pairing is IsCredGuardEnabled=0 together with UseLogonCredential=1 under the same WDigest key.
    Grouping registry modifications on this host in the surrounding window shows whether the sibling value was also set and
    whether other defense or credential settings were changed in the same session, which distinguishes a hands-on operation
    from an isolated change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the IsCredGuardEnabled value been modified before on this host?
  context: Security-provider configuration keys should change rarely and only through managed processes. A history of prior
    modifications with the same value and the same writing process suggests a recurring managed baseline; zero prior history,
    or a change written by a process that has never touched this key before, indicates a first-time reconfiguration that
    deserves scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After Credential Guard was weakened, did credential-access or other suspicious activity run on this host?
  context: Disabling Credential Guard and enabling WDigest cleartext caching takes effect on
    the next logon, at which point credentials become recoverable from LSASS. The payoff for
    the technique is therefore credential harvesting, so the query is an aggregated survey of
    what executed on the host afterward, grouped by image and account; routine telemetry
    collapses into high-count rows, while a credential-dumping tool, an unfamiliar binary, or
    a new account appearing at a low count is the deviation to chase. Drill into any suspect
    image's individual events for its command line and LSASS interaction.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Was IsCredGuardEnabled modified on other hosts in the environment?
  context: The same modification across many hosts with a consistent value and writing process usually reflects a group-policy
    or security-baseline rollout. A change confined to this host, or written by an ad-hoc process, looks targeted. Comparing
    the value data and writing process across hosts separates a managed configuration change from selective credential-access
    hardening tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the modification?
  context: A registry write rarely happens in isolation. Aggregating process executions around the alert surfaces what led to
    the change and what followed it, and lets novel parent-child pairs stand out against routine agent and system noise. This
    complements the registry-only view by showing the execution context that drove the setting change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, privilege escalation, or other defense tampering — may reveal
    the stages that preceded the Credential Guard change and help reconstruct the timeline. Credential-access hardening is
    often weakened only after an actor has already gained privileged access, so preceding alerts help place this event in the
    larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this security-setting change?
  context: Reconfiguring credential protections is a significant, auditable change in most environments. A corresponding change
    record or an active hardening/baseline project suggests authorized activity; the absence of one when policy requires it
    suggests the modification was unauthorized and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this modification align with normal work hours and maintenance windows?
  context: Managed security-configuration changes typically occur during business hours or scheduled maintenance windows. A
    change to credential-protection settings outside those windows, or on a host that is not undergoing documented maintenance,
    is harder to explain as routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this the way your organization normally changes Credential Guard and WDigest settings?
  context: Credential Guard and WDigest configuration is usually enforced through group policy or a device-management platform
    rather than direct edits to the registry. A change made by reg.exe, PowerShell, or a direct API write on a single host may
    indicate an attacker bypassing managed tooling, or an administrator taking a shortcut; knowing the normal procedure
    separates the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other security-tampering or persistence tools run on this host around the same time?
  context: An actor who weakens credential protections often makes additional changes in the same session — installing
    persistence, disabling other defenses, or staging credential-access tooling. Surfacing executions of common configuration
    and persistence utilities within the surrounding window shows whether the Credential Guard change was an isolated action
    or one step in a broader hands-on operation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
