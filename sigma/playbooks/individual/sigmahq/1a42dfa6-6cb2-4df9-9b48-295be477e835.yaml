name: Vulnerable WinRing0 Driver Load
id: f5217946-4322-430a-baf4-7fbaa24b38f7
description: |
  Detects the load of the WinRing0 kernel driver, matched either by an import hash of
  D41FA95D4642DC981F10DE36F4DC8CD7 or by a file name ending in one of the known WinRing0 variants.
  WinRing0 is a legitimate open-source driver that gives a calling user-mode process direct hardware
  access — CPU model-specific registers, physical memory, I/O ports, and PCI configuration space — and
  it ships with hardware-monitoring, fan and voltage control, overclocking, and benchmarking utilities,
  as well as with cryptomining software that uses it to tune MSRs for hashrate. It also carries
  publicly documented flaws that let any local process obtain kernel read/write primitives, which is
  why it is loaded on hosts that run none of that software: the signature carries it past driver
  signature enforcement, and the flaw supplies ring-0 access used to unhook endpoint sensors, disable
  LSA protection, or load a second driver that enforcement would otherwise block. A valid signature is
  expected here and settles nothing. The investigation should determine which process loaded the
  driver and from what path, what wrote the file to disk, what service registered it, whether the host
  runs software that legitimately uses this driver, and whether kernel-level effects followed the load.
type: detection
detection_id: 1a42dfa6-6cb2-4df9-9b48-295be477e835
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which driver file loaded, what is its full path, and does its hash match the WinRing0
    import hash the rule names?
  context: >-
    The rule matches on either of two independent criteria, so read the event to see which one applies.
    A file name ending in WinRing0.sys, WinRing0x64.sys, winring00x64.sys, or the .dll variants is the
    name branch. An import hash of D41FA95D4642DC981F10DE36F4DC8CD7 on a file with an unrelated name is
    the other branch, and it means the driver was renamed — the code is WinRing0 regardless of what it
    is called. A renamed copy is worth resolving on its own, since installed monitoring and mining
    software ships the driver under its published name. Read the full path alongside the name — a
    vendor installation directory, a temporary or AppData path, and a randomly-named directory each
    point at a different origin.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
- question: Is this host expected to run hardware-monitoring, overclocking, or benchmarking software
    that loads this driver?
  context: >-
    This driver has a small set of legitimate consumers — fan and voltage control tools, temperature
    and clock monitors, benchmarking suites, and a few vendor utilities. An engineering or gaming
    workstation whose owner installs that class of tooling accounts for the load. The same load on a
    server, a locked-down endpoint, or a host with no such product installed leaves the driver's
    presence as the open item. The account's role and the host's function are usually the fastest route
    to that distinction.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was the software that loads this driver deployed under a change ticket, maintenance window,
    or documented approval?
  context: >-
    Loading a kernel driver requires local administrator rights and is a system modification most
    organizations put behind a change record. A ticket covering this host and this window, naming a
    monitoring or diagnostic product, largely accounts for the load. No record on a host nobody was
    working on leaves the driver's origin and the account that registered it as the items to resolve.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which process triggered the load, from what path, and what signer and signature status does
    the driver carry?
  context: >-
    The loading process and the path are the discriminators here; the signature is not. This driver is
    validly signed by design — that is the property that makes it usable for kernel access on a host
    with signature enforcement on, so a Valid status is the expected result and is not exculpatory. A
    signer that is not the driver's original publisher, or an expired, revoked, or invalid status, is
    additional information rather than the deciding one. Read the loading process against the path — a
    monitoring or benchmarking product loading the driver out of its own installation directory fits
    installed software, while a load out of a temporary, AppData, ProgramData, Public, or
    randomly-named directory, or by a script host, an archive utility, a remote-management agent, or an
    unfamiliar binary, points at a driver brought to the host for its kernel primitive.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Does the driver file's hash match a published build of this driver, and which process
    loaded it?
  context: >-
    The driver load event carries the file's hash directly, so a reputation lookup is available without
    retrieving the file. Version matters more than signer for this driver family — the flaw lives in
    specific builds, so a hash comparison against known-vulnerable versions answers a question the
    Authenticode signer cannot. A hash matching a build distributed with an installed monitoring
    product supports that product being the origin; a hash with no reputation, or one matching a build
    published for its kernel read/write exposure, changes what the load means. Pair the hash with the
    loading process — the service control manager loading the driver on behalf of a registered service
    reads differently from an ad-hoc process.
  range: +/-15m
  answer_sources:
  - file_event
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Which process wrote the driver file to disk, when, and to what directory?
  context: >-
    The writer names the origin. A vendor installer or setup routine writing the driver into a program
    directory before the load fits installed software. A browser, an archive utility, a script host, a
    remote-management agent, or an unfamiliar binary writing it into a temporary or user-writable
    directory points at a file brought to the host for this load. A driver written days before it
    loaded is a third situation — the file sat staged until something chose to use it. File writes
    carry no hash, so take the writing process, path, and timing from here and read signature and hash
    data from the load event.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: What process triggered the driver load, and what spawned it?
  context: >-
    The acting process is named in the alert but its origin is not. Retrieving that process's own start
    event names the parent that launched it. services.exe or a vendor installer as parent fits a
    registered service or a setup routine loading its own component; explorer.exe or a console fits a
    person running a tool by hand. A script host, an Office application, a remote-management agent, or
    an unfamiliar binary driving service management is the case to resolve, since loading a driver
    requires administrator rights and service creation from a non-administrative process is a
    recognized route to kernel access. The long window is intentional, since service and shell parents
    often start well before the load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What service was installed on this host around the driver load, and what image path and
    start type did it register?
  context: >-
    A kernel driver reaches memory through a service entry, so a service installation recorded in the
    same window usually names the driver file, the service name it was registered under, and the
    account that registered it. Compare the registered image path against the path from the alert. A
    service name matching a monitoring or benchmarking product installed on this host fits that
    product; a generic or unfamiliar name pointing at the same driver file is the result to pursue. A
    start type that survives reboot means the driver loads again on every boot without anyone running
    the tool.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Does the Security log record a service installation on this host around the driver load,
    and which account performed it?
  context: >-
    Service-installation auditing records the registering account, which the system-log service entry
    does not. Loading this driver requires administrator rights, so the account that registered the
    service is the account that held them. Whether that was an installer running under a logged-on
    administrator, a machine account, or SYSTEM on behalf of a deployment agent changes what the load
    means, and an account with no administrative duty registering a driver service is the result to
    pursue. Service-installation auditing is not enabled in every environment, so no results here is a
    visibility gap rather than evidence no service was created.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: What service registry entries were written on this host around the driver load, and do any
    point at the driver file?
  context: >-
    Driver services are configured under HKLM\System\CurrentControlSet\Services, where the subkey name
    is the service name and the ImagePath value names the driver file. Reading these writes shows what
    name the driver was registered under, what start type it was given, and which process wrote the
    entries. A service key written by a process unrelated to any installer, an ImagePath pointing into
    a temporary or user-writable directory, or a Start value set to load at boot are the results to
    pursue; a key written by a vendor setup routine under that vendor's service name fits installation.
    Correlate the write timing against the load — a Start value changed within hours of the load ties
    the two together. Key deletion is not recorded, so cleanup shows up as later rewrites of the same
    key rather than as a removal event.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the driver still loaded and its service still registered, and under what account does it
    run?
  context: >-
    The driver may have been loaded once and unloaded when its consumer exited, or its service may
    remain registered and set to load again at boot. Checking the current state on the host — whether
    the service entry still exists, what its start type is, whether the driver file is still at the
    alerting path, and whether the driver is presently loaded — separates a tool that was run once from
    an entry left in place for reuse. Query the service by the name recorded in the service-installation
    events, and check whether the file still exists at the path from the alert.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this driver loaded on this host before, and under what processes?
  context: >-
    A driver that has loaded repeatedly on this host over the past ninety days, under the same loading
    process, fits installed software whose component it is. A first or near-first load moves the origin
    questions to the front. Note the loading processes as well — a consistent loader across the history
    and a new one for this event are different situations, and a driver that used to load from a
    product's installation directory but loaded from elsewhere this time is worth resolving.
  range: -90d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this driver loading on other hosts in the environment?
  context: >-
    Cross-host distribution separates a local installation from a deployment. The driver on a set of
    hosts that share a hardware model or a software package fits a managed rollout of a monitoring or
    diagnostic product. The same driver appearing on unrelated hosts, or on hosts with no reason to run
    that class of software, points at distribution by something other than software installation and
    widens the investigation to those hosts. Compare the loading processes across hosts too — one
    consistent loader fits a product, while different loaders for the same driver do not. Hosts not
    reporting driver load telemetry are absent from this result regardless of what loaded on them.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did any other kernel driver load on this host around this one, and were any of them unsigned
    or unfamiliar?
  context: >-
    A driver with an exposed kernel read/write primitive is loaded to reach ring 0, and a documented
    use of that access is to load a second driver that signature enforcement would otherwise block. A
    second driver loading minutes after this one — unsigned, with an invalid or revoked status, or with
    a name matching nothing installed here — is the follow-on to look for. Several drivers loading
    together under a vendor installer fits a product setup instead. Read the loading process on each
    result alongside the signature status.
  range: +/-4h
  answer_sources:
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Did this host connect out on ports commonly used by mining pools around the driver load?
  context: >-
    One legitimate consumer of this driver is cryptomining software, which loads it to tune CPU
    registers for hashrate. Sustained outbound connections on pool ports, from a process with no other
    reason to make them, alongside heavy CPU use, points at mining rather than at the kernel-access use
    of the same driver — a different remediation and a different scope. This query covers common pool
    ports (3333, 4444, 5555, 7777, 8888, 14433, 14444, 45560, 45700); mining over 443 to a pool proxy
    will not appear here, so a null result narrows rather than closes the mining question. Read the
    connecting process on each result — the miner and the driver's loader are often the same binary.
  range: +/-4h
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3333
          - 4444
          - 5555
          - 7777
          - 8888
          - 14433
          - 14444
          - 45560
          - 45700
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Activity surrounding the load supplies the immediate context — what preceded it and what followed.
    An installer unpacking, a setup routine running, or a monitoring utility starting in the same
    window corroborates installed software. Endpoint security services or agents stopping,
    credential-access tooling, or archive and transfer utilities in the same window point the other
    way, since the access this driver exposes is used for exactly those follow-ons. Repetitive agent
    telemetry collapses into single high-count rows, so novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Loading a driver requires administrator rights, so the host is already administered by whoever did
    it — earlier detections often show how that was reached. Credential access, remote-management
    activity, or defense tampering ahead of the load places it in a sequence rather than on its own.
    Nothing before it, on a host where a monitoring product was being installed, points the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the driver
    load?
  context: >-
    A driver registered as a service is one persistence mechanism; where the driver was placed
    deliberately, others are commonly added alongside it. This surfaces scheduled tasks, service
    creation, registry writes, and transfer jobs configured on the host within four hours of the load.
    Several mechanisms installed in one window points to intentional stacking; a single sc.exe
    invocation registering the driver's own service fits an installation performed by hand.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
