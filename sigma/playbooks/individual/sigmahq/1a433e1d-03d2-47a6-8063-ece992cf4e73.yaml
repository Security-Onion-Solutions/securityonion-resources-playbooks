name: DarkGate - Autoit3.EXE File Creation By Uncommon Process
id: 55e89b85-dc45-40aa-9958-db3ffc36e54a
description: |
  Detects an Autoit3.exe file being written to disk by an uncommon process — curl.exe, ExtExport.exe,
  KeyScramblerLogon.exe, wmprph.exe, or Autoit3.exe copying itself. AutoIt3 is a legitimate automation
  interpreter, but these writers are not normal ways to place it on disk; in DarkGate delivery a downloader
  (often a renamed curl) fetches the AutoIt3 interpreter alongside a compiled .au3 script that decodes shellcode
  and injects the DarkGate RAT into a legitimate process in memory. Investigation should confirm the writing
  process and its command, inspect the dropped interpreter and script, determine whether Autoit3.exe executed
  and what it connected to, and gauge whether the pattern is isolated or spreading.
type: detection
detection_id: 1a433e1d-03d2-47a6-8063-ece992cf4e73
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path and creating process match what this rule detects?
  context: >-
    Confirm the alert is a true positive: the created file ends in \Autoit3.exe and the responsible process is
    one of the uncommon writers this rule flags (curl.exe, ExtExport.exe, KeyScramblerLogon.exe, wmprph.exe, or
    Autoit3.exe copying itself). AutoIt3 is a legitimate automation interpreter, but none of these processes is
    a normal way to place it on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have Autoit3.exe delivered by one of these processes?
  context: >-
    Legitimate AutoIt deployment usually arrives through an installer or a software-distribution tool, not from
    curl or a relocated system binary writing the interpreter directly. If the user role and host function do not
    involve AutoIt automation, treat the delivery path as suspicious. When the writer runs as a machine or service
    account, judge by the writing process and host role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command did the process that created Autoit3.exe run?
  context: >-
    The writing process's full command line shows how the AutoIt3 interpreter was fetched or placed — a curl
    download from an external host, a copy of a renamed utility, or arguments pointing at the .au3 script. Decode
    any URLs, output paths, and flags; encoded or otherwise unusual argument patterns are the anomaly worth
    chasing. The file event carries the writer's process identifier, so this returns exactly that process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is in the dropped Autoit3 interpreter and its associated .au3 script?
  context: >-
    DarkGate delivery pairs the AutoIt3 interpreter with a compiled AutoIt script (magic bytes AU3!EA06) preceded
    by a long base64 blob; the script decodes shellcode, marks memory executable, and calls it to build and run the
    final payload in memory. Retrieve the dropped files and inspect for base64 sequences, embedded shellcode, and
    known string patterns, and confirm whether Autoit3.exe is the genuine signed interpreter or a renamed decoy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What spawned the process that wrote Autoit3.exe, and is that parent chain expected?
  context: >-
    The parent reveals how the writer was launched. A downloader invoked by a script host (wscript.exe,
    cscript.exe), a shortcut or batch chain, or an Office application points to a phishing-delivered dropper;
    a parent tied to routine software management is more likely benign. Walk up the chain to see what drove the
    delivery and whether a known-good updater accounts for it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. An Autoit3.exe or .au3 still on disk can be
    retrieved, hashed, and analyzed; one deleted moments after creation suggests anti-forensic cleanup or a
    self-deleting stage and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination.
  context: >-
    A download command does not guarantee the AutoIt3 interpreter and its .au3 script actually landed — network
    errors, blocked hosts, or security controls may have stopped the transfer. Confirming their creation by the
    alerting process or its children establishes whether the delivery stage completed and enumerates every file
    the operation wrote.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What external destinations did the creating process connect to around the file write?
  context: >-
    DarkGate delivery uses a downloader — frequently a renamed curl — to pull the AutoIt3 interpreter and script
    from an external host over HTTP(S). External destinations reached by the writing process near the file-creation
    time are candidate download or staging servers; internal-only destinations are usually benign and can be set
    aside. Focus the review on outbound connections to external address blocks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: If this artifact has executed, what is its hash — and does it have known AV/threat intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written. This looks for Autoit3.exe executing on this
    host and reads its hash; submit that to threat intelligence to determine whether it is the genuine signed
    AutoIt3 interpreter or a tampered build, and whether the .au3-driven activity is known. If Autoit3.exe is
    present but has not run, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: If the downloaded payload was executed, what is its hash — and is it known to threat intelligence?
  context: >-
    The AutoIt3 stage typically decodes shellcode and injects the final RAT into a legitimate process rather than
    spawning it as a direct child. This returns the processes the writer and its launching shell spawned — its
    children and siblings — with their executable hashes for reputation lookup. Because the injection is in-memory,
    the final payload may not appear here; pair this with the on-disk artifact and the interpreter's own hash.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A DarkGate dropper rarely writes only the interpreter — it also stages the .au3 script, sometimes a
    copied/renamed curl, and per-host persistence artifacts such as a Start Menu shortcut. The breadth and
    locations of the writer's other file activity distinguish a single download from a full delivery and enumerate
    what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously seen this file-creation pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the program/user distribution
    reflects how this specific Autoit3.exe-by-uncommon-writer pattern has run here before — not
    generic AutoIt usage. A new acting program process, an unexpected user account, or an
    unfamiliar writer is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \Autoit3.exe
        - \curl.exe
        - \ExtExport.exe
        - \KeyScramblerLogon.exe
        - \wmprph.exe
        TargetFilename|endswith: \Autoit3.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this file-creation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, aggregated by host over 90 days — the user's
    history of this specific pattern, not generic use of these binaries. A user who has never produced it is more
    suspicious than one who does so routinely; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \Autoit3.exe
        - \curl.exe
        - \ExtExport.exe
        - \KeyScramblerLogon.exe
        - \wmprph.exe
        TargetFilename|endswith: \Autoit3.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-creation pattern here or across the environment, or is it new?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the behavior — the
    launch mechanism does. This mirrors the rule's selection scoped to the alerting program over 90 days.
    A new or rare program for this pattern is the deviation worth chasing; a program already accounting for many
    prior events is more likely vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \Autoit3.exe
        - \curl.exe
        - \ExtExport.exe
        - \KeyScramblerLogon.exe
        - \wmprph.exe
        TargetFilename|endswith: \Autoit3.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window reveals whether the delivery is isolated or
    part of activity spanning multiple endpoints. If the same account triggered similar drops or tool executions
    elsewhere, the scope of the incident may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, a user-wide sweep returns agent-telemetry noise because every host runs SYSTEM-owned
    agents constantly. The meaningful question is whether the same launch mechanism produced this file-creation
    pattern elsewhere in the alert window: multiple hosts point to scheduled or pushed automation, a single host to
    a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \Autoit3.exe
        - \curl.exe
        - \ExtExport.exe
        - \KeyScramblerLogon.exe
        - \wmprph.exe
        TargetFilename|endswith: \Autoit3.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    DarkGate delivery is multi-stage — a phishing lure, a script host launching a downloader, then the AutoIt3
    stage. Earlier detections on this host in the preceding hours may reveal the initial-access and
    script-execution steps and help reconstruct the timeline that led to the file write.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
