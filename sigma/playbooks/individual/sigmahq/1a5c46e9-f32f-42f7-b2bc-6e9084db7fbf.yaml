name: Trust Access Disable For VBApplications
id: 5a3a65d7-d6c7-44f5-9684-613ac2934c05
description: |
  Detects a registry modification that sets the Office "AccessVBOM" value under the application's Security key to 1, granting programmatic (trust) access to the VBA project object model. With this barrier removed, macros can read and write other macros and run without the usual trust prompts, so the change is a common precursor to macro-based execution and self-spreading document payloads. Investigate which process wrote the value, whether the change was authorized, and whether an Office application subsequently opened a document and spawned child processes consistent with macro execution.
type: detection
detection_id: 1a5c46e9-f32f-42f7-b2bc-6e9084db7fbf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact key path (TargetObject ending in \Security\AccessVBOM), the value data (Details set to 1), and the writing process against the rule's detection criteria before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Office macro-trust settings?
  context: Developers and power users who build Office automation legitimately enable trust access to the VBA project object model. Knowing whether this account and host normally perform Office development or administration is often the fastest way to separate a routine change from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Office application's AccessVBOM setting was modified, and what does enabling it allow?
  context: The AccessVBOM value lives under HKCU\Software\Microsoft\Office\<version>\<app>\Security for a specific Office application (Word, Excel, PowerPoint, Outlook, Access). Setting it to 1 grants trust access to the VBA project object model, which is off by default and is the access macros need to inspect or write VBA code programmatically. The application and version in the key path indicate which product's macro barrier was lowered.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and does it enable trust access to the VBA project object model?
  context: The rule fires on Details set to DWORD 1. A value of 1 turns on trust access to the VBA project object model (0 is the secure default). Read the Details field to confirm the value is 1 and not a benign re-write; a value of 1 removes the barrier that normally blocks macros from reading or modifying other VBA code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this a security-relevant Office key, and does the modification persist rather than get reverted?
  context: The AccessVBOM value is a security setting; once set to 1 it stays until something writes it back to 0. Elastic Defend emits no registry value-deletion events, so attacker cleanup is not directly observable — judge persistence from the key's re-modification history over a longer window and from whether macro execution followed. A value that stays at 1 keeps the macro-trust barrier down for every subsequent document.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the process that wrote this value expected to change Office security settings, and what started it?
  context: The writing process (Image on the registry event) reveals how the change was made. Office applications, group-policy tooling, or an installer writing this value differs sharply from a script host, reg.exe launched by a macro, or an unsigned binary. Tracing the writer's own parent shows whether the change originated from a legitimate configuration action or from a spawned execution chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After trust access was enabled, did an Office application spawn child processes consistent with macro execution?
  context: Enabling AccessVBOM removes a barrier to macro-driven code; the observable effect is an Office application opening a document and launching children such as cmd.exe, powershell.exe, wscript.exe, or mshta.exe. Office applications spawning command interpreters or script hosts shortly after this change suggests the lowered barrier was used to run a macro payload.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\msaccess.exe'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Actors who lower one Office macro barrier often change several related settings — disabling Protected View, enabling macros by policy, or setting other AccessVBOM keys for additional Office applications. Registry changes from the same writing process within a short window reveal whether this was an isolated edit or part of a broader hardening-removal sequence.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this AccessVBOM key been modified before on this host?
  context: A security setting like AccessVBOM should change rarely. First-time or one-off modification is more suspicious than a value that is re-written routinely by a known configuration process. Compare the historical Details values and writing processes to see whether this change fits an established pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Reviewing process and registry activity around the modification reveals what led to it and what followed — reconnaissance, additional configuration changes, or execution that together indicate a larger sequence rather than a lone setting change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this AccessVBOM key modified on other hosts in the environment?
  context: The same modification across many hosts may indicate a group-policy push, a software deployment, or widespread malware; a change on only this host may be targeted. Compare the Details values and writing processes across hosts to tell a fleet-wide configuration change from isolated tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — phishing-document handling, script execution, or other defense-tampering — may reveal the stages that preceded the macro-trust change and help reconstruct the timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, deployment, or documented approval for this Office setting change?
  context: Enabling trust access to the VBA project object model is occasionally part of an approved developer or automation rollout. A corresponding ticket or deployment record suggests authorized activity; absence of one, where policy requires it, suggests the change was unauthorized and helps close or escalate the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host around the same time?
  context: Macro-trust removal often accompanies broader persistence work. Command-line use of scheduling, service, or registry tools within the same window may indicate the actor established durable footholds alongside enabling macros, rather than making an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. A macro that ran after the trust barrier was lowered may drop an executable or script into a Startup folder or a Run-key path. File-write telemetry captures these drops even when the actor avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
