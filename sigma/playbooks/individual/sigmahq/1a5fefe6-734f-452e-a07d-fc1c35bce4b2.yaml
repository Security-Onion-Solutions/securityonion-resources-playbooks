name: Firewall Rule Deleted Via Netsh.EXE
id: fc965009-dfd0-434d-992c-74c017237331
description: |
  Detects netsh.exe (matched by image name or original filename) run with a command line containing both "firewall" and "delete", which removes a Windows Defender Firewall rule, excluding the known-good Dropbox and Avast installer cases. Deleting a firewall rule weakens host network controls — removing a block can expose a service to inbound access for command-and-control or lateral movement, and removing a security product's rule can blind or cut off its communication. Administrators and software installers also delete firewall rules legitimately, so the investigation should decode exactly which rule was removed and what it governed, confirm what process launched netsh, and look for other defense tampering, persistence, and the activity the change was meant to enable.
type: detection
detection_id: 1a5fefe6-734f-452e-a07d-fc1c35bce4b2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — netsh.exe deleting a firewall rule?
  context: Confirm the alert before investing time. The rule fires when the image (or original filename) is netsh.exe and the command line contains both "firewall" and "delete", with the known-good Dropbox and Avast installer deletions excluded. Read the full command line and identify the exact rule that was removed — its name and the port, program, or direction it governed are what determine the impact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Which firewall rule was deleted, and what did it permit or block?
  context: Different rules carry different impact. Removing a block rule can open a port or program to inbound connections for command-and-control or lateral movement; removing an allow rule, or a rule belonging to a security product, can cut off or blind that product. Read the rule name and any port, program, or direction in the command line to determine what protection was removed and set the investigation priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to delete firewall rules?
  context: Administrators and software installers legitimately remove firewall rules during configuration and uninstall, so the question is whether this account and host have a reason to. A documented admin change or a known installer differs from a standard user account, or an unexpected service principal, deleting a firewall rule — the latter is the defense-weakening pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned this netsh, and is that parent chain expected?
  context: A firewall change from an installer (msiexec, a setup executable) or an interactive admin shell is routine; the same netsh spawned by a script (cmd or powershell running a .bat), by a remote-execution tool, or by an Office application points to automated, hands-on tampering. If the netsh deletion shares a parent with other tampering or recovery commands, that parent is the operator's script — its command line and origin are central to scoping the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What activity occurred on this host after the firewall rule was deleted?
  context: Firewall rules are deleted to enable something — an inbound connection to a backdoor, a remote-management session, or a tool that the rule would have blocked. Examining what executed in the window after the change reveals what it unlocked. New processes, especially listeners or remote-access tools, or a fresh inbound connection shortly after the deletion point to the activity the change was meant to allow.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: Operators who weaken one control usually weaken several — deleting a firewall rule AND stopping antivirus AND clearing logs maximizes coverage. This surfaces other tampering tools and verbs on the host around the alert. Multiple tampering actions sharing the same user or parent process confirm a coordinated operation rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Was the firewall weakened through the registry rather than netsh?
  context: Firewall rules and policy live under HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy, so a rule can be removed or the firewall disabled by editing the registry directly, bypassing the netsh command this rule watches. Reviewing registry changes to the firewall policy on this host around the alert catches a registry-based weakening that would otherwise be missed and shows whether the netsh deletion was part of a wider firewall change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was netsh.exe executed from its expected System32 path, and is it the genuine signed binary?
  context: The genuine netsh.exe is a signed Microsoft binary under System32 / SysWOW64. A copy running from a user temp directory, ProgramData, or another non-standard path — or one whose original filename is not netsh.exe — suggests the binary was staged to dodge path-based allowlists, which raises the priority of an otherwise routine-looking firewall command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host deleted firewall rules with netsh over the past 90 days, and what command structures are typical?
  context: A firewall-rule deletion with no prior history on a host is more notable than one that recurs under a stable configuration or update routine. This mirrors the rule's exact pattern scoped to this host, so the count reflects the rule's specific firing, and the command-line projection lets you compare the historical rule names and arguments against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - firewall
        - 'delete '
      filter_optional_dropbox:
        ParentImage|endswith: \Dropbox.exe
        CommandLine|contains: name=Dropbox
      filter_optional_avast:
        ParentImage|endswith: \instup.exe
        CommandLine|contains: advfirewall firewall delete rule name="Avast Antivirus Admin Client"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- question: Were process-based persistence mechanisms installed on this host around this time?
  context: Weakening the firewall is often paired with establishing a foothold — opening a port for a backdoor and then installing it. This surfaces persistence tool executions — schtasks, sc, reg, at, bitsadmin, wmic — clustered around the alert. Multiple persistence installations in the same window indicate intentional staging rather than an isolated firewall change, and identify footholds to remediate.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - firewall
        - 'delete '
      filter_optional_dropbox:
        ParentImage|endswith: \Dropbox.exe
        CommandLine|contains: name=Dropbox
      filter_optional_avast:
        ParentImage|endswith: \instup.exe
        CommandLine|contains: advfirewall firewall delete rule name="Avast Antivirus Admin Client"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - firewall
        - 'delete '
      filter_optional_dropbox:
        ParentImage|endswith: \Dropbox.exe
        CommandLine|contains: name=Dropbox
      filter_optional_avast:
        ParentImage|endswith: \instup.exe
        CommandLine|contains: advfirewall firewall delete rule name="Avast Antivirus Admin Client"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user changed firewalls or ran tooling on other hosts in the same window, the scope is a network-wide operation. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - firewall
        - 'delete '
      filter_optional_dropbox:
        ParentImage|endswith: \Dropbox.exe
        CommandLine|contains: name=Dropbox
      filter_optional_avast:
        ParentImage|endswith: \instup.exe
        CommandLine|contains: advfirewall firewall delete rule name="Avast Antivirus Admin Client"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts deleted firewall rules via netsh in the past week, and does the distribution look like automation or one-off activity?
  context: This mirrors the rule's pattern with no host scope, giving a fleet-wide count of where firewall-rule deletions fired. Many hosts at once points to a configuration push or deployment routine; one host or a small unrelated set points to manual or targeted weakening. Use the distribution to judge how unusual this single alert is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - firewall
        - 'delete '
      filter_optional_dropbox:
        ParentImage|endswith: \Dropbox.exe
        CommandLine|contains: name=Dropbox
      filter_optional_avast:
        ParentImage|endswith: \instup.exe
        CommandLine|contains: advfirewall firewall delete rule name="Avast Antivirus Admin Client"
      condition: all of selection_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, a download cradle, or other defense tampering — may reveal the intrusion stage this firewall change belongs to and help reconstruct the timeline. Firewall weakening often sits just before inbound access or lateral movement, so what follows is as important as what came before.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
