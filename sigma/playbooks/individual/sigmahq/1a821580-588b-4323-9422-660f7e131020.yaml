name: ScreenConnect User Database Modification
id: da19fc39-c349-4fe4-bbf1-6e472285bc71
description: |
  Detects modification of the ScreenConnect server's temporary XML user-database file by ScreenConnect.Service.exe — the artifact written when local ScreenConnect user accounts or permissions change. This fires during exploitation of the ScreenConnect authentication-bypass vulnerability (CVE-2024-1709, server versions before 23.9.8), where an anonymous attacker reaches the setup wizard to create an administrator account, but it also fires on legitimate administrative changes to local users. Determine whether the change corresponds to an authorized administrative action or to unauthenticated account creation, and whether it was followed by extension/webshell drops or code execution from the service.
type: detection
detection_id: 1a821580-588b-4323-9422-660f7e131020
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified file path and the responsible ScreenConnect service process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on a file whose name ends in .xml and whose path contains both Temp and ScreenConnect, modified by ScreenConnect.Service.exe — the temporary copy of the ScreenConnect user database. Confirm the path, the operation, and the responsible process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this ScreenConnect server and its operator expected to be modifying local ScreenConnect user accounts right now?
  context: Legitimate administrative activity — an operator adding or editing a local ScreenConnect user or permission — triggers this same file write. Knowing whether an operator was actively managing accounts on this server is often the fastest way to separate a routine change from unauthenticated account creation. The write runs under the service's own account, so judge by the host role and by whether a human was administering it, not by the User field alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What changed in the ScreenConnect user database — were new administrator accounts added or existing permissions altered?
  context: The temporary XML holds the pending state of the ScreenConnect local user database. Retrieve its content (and the resulting App_Data user database) from disk or the endpoint and compare against the known-good account set. A newly created administrator, an unexpected role change, or an account the operator does not recognize is the account-tampering signature of the authentication bypass. This is a manual content review; the query surfaces the triggering file event to anchor the retrieval.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did ScreenConnect.Service.exe spawn command interpreters or other unexpected child processes around this time?
  context: After the authentication bypass grants administrator access, code execution is typically reached through the Extensions feature or a dropped web handler, which runs under the ScreenConnect service. The service spawning cmd.exe, powershell.exe, or other tooling is a strong exploitation signal — a healthy ScreenConnect server rarely launches interpreters. Review the child processes and their command lines for reconnaissance, download, or account-management activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this ScreenConnect deployment an approved, sanctioned installation on this host?
  context: A ScreenConnect server should correspond to a known, inventoried IT-support deployment. An instance that is not on the organization's approved software list may be shadow IT or an attacker-stood-up server, and its user-database changes carry different weight. Confirm the deployment is expected on this host before treating the account change as routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an active helpdesk ticket, maintenance window, or support session that explains this ScreenConnect account change?
  context: Legitimate changes to ScreenConnect local users usually correlate with an operator task — onboarding a technician, rotating access, or a documented maintenance window. If no support or change context exists for a user-database modification, the change may be attacker-driven account creation for persistent access rather than administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoints is the ScreenConnect service connecting to around this time?
  context: The ScreenConnect service maintains outbound relay and cloud connections as part of normal operation. Connections to the vendor's own infrastructure are expected; connections to unfamiliar addresses in the same window as the user-database change may indicate an attacker-controlled relay or second-stage callout. Review the destinations against the known ScreenConnect endpoints for this environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What other files did the ScreenConnect service write or delete around the alert?
  context: The authentication bypass frequently leads to files being dropped into the ScreenConnect install tree — .aspx or .ashx handlers placed at the root of App_Extensions, which the product never writes there normally. Enumerating the service's other file activity in the same window reveals extension or web-handler drops that accompany the account change and enumerates what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written under the ScreenConnect installation directory recently, and by which processes?
  context: Location drives suspicion. The App_Extensions directory and the App_Data area of a ScreenConnect install have a small set of processes that legitimately write there. Other recent arrivals — especially web-servable files at the App_Extensions root or writes from an unfamiliar process — reveal whether this server is under active exploitation rather than routine administration.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ScreenConnect\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user account previously produced this ScreenConnect user-database modification pattern, and does that history fit its role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of this exact file-write pattern, aggregated by host, not generic use of the service. The write commonly runs under the service's own account, so when the User is a service or SYSTEM identity the count reflects service-driven changes; weigh a user that has never produced this pattern more heavily than one that does so regularly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .xml
        TargetFilename|contains|all:
        - Temp
        - ScreenConnect
        Image|endswith: \ScreenConnect.Service.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this ScreenConnect user-database modification, or is the launching mechanism new for this activity?
  context: When the change runs under a service identity, user attribution is uninformative, so the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of this program driving this specific pattern, aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is routine service operation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .xml
        TargetFilename|contains|all:
        - Temp
        - ScreenConnect
        Image|endswith: \ScreenConnect.Service.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Did this same user-database modification pattern fire on other ScreenConnect servers in the same window?
  context: The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple servers producing this pattern in the same window points to coordinated activity — a pushed change or mass exploitation of the vulnerability across exposed instances; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .xml
        TargetFilename|contains|all:
        - Temp
        - ScreenConnect
        Image|endswith: \ScreenConnect.Service.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What other executions of the ScreenConnect service on this host followed in the next four hours, and does the parent or command-line structure change?
  context: Routine service operation repeats with a stable parent and command-line structure. A restart, a new parent, or a changed command line for the service in the follow-on window can indicate tampering with or reconfiguration of the ScreenConnect installation after the account change — the deviation worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: Did other detections fire on this ScreenConnect server in the hours before this alert?
  context: Exploitation of the server tends to leave a trail — anonymous setup-wizard access, account creation, then handler drops and execution. Earlier detections on the same host in the surrounding hours help reconstruct whether this account change is one stage of an ongoing intrusion or an isolated administrative event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Did this same detection fire on other hosts in the past 24 hours, and does the cross-host pattern look like coordinated activity or an isolated detection?
  context: A detection that fires across many servers on the same day is more consistent with mass exploitation of an exposed vulnerability or a pushed change than with local administration; a detection firing on one server alone is the deviation worth chasing. Use the cross-host spread to gauge whether this is environment-wide.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
- question: Is the temporary user-database file still on disk, or was it modified again or removed after the alert?
  context: The temporary XML is transient by design. Its post-alert lifecycle drives next steps — repeated modifications suggest ongoing account changes, while a modification followed by cleanup can accompany anti-forensic activity. Capturing the current state before it rolls over preserves the record of what the account database looked like at the time of the change.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other process-based persistence mechanisms installed on this server around this time?
  context: An attacker who gains administrator access through the authentication bypass rarely stops at one foothold. Scheduled tasks, services, registry Run entries, BITS jobs, or WMI subscriptions installed in the same timeframe indicate intentional persistence stacking rather than isolated administration. Multiple mechanisms appearing together raise the priority of the account change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
