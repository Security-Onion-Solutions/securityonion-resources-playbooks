name: Winrar Compressing Dump Files
id: 031d3498-4d37-44fa-8e0b-d8ee54742aff
description: |
  Detects execution of the WinRAR command-line utility (rar.exe / winrar.exe, or a binary whose Description identifies it
  as command-line RAR) where the command line references a memory-dump file extension (.dmp, .dump, .hdmp). Compressing a
  dump file is a common staging step that shrinks a large memory image and bundles it for exfiltration; legitimate cases
  include an administrator archiving a crash dump for troubleshooting or a backup job that happens to include a dump file.
  Both selection conditions must match for the rule to fire. The investigation should confirm what dump file was archived,
  where the archive was written, whether it was password-protected, and what produced the dump in the first place.
type: detection
detection_id: 1ac14d38-3dfc-4635-92c7-e3fd1c5f5bfc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show a RAR utility compressing a file with a .dmp, .dump, or .hdmp extension?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions
    hold together — the image is rar.exe/winrar.exe (or a binary describing itself as command-line RAR) AND the command line
    references a .dmp, .dump, or .hdmp file. Review the exact command line to confirm a dump file is being added to an archive
    and is not an incidental string match on an unrelated argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to archive memory-dump files with a command-line compression tool?
  context: Legitimate administrative activity can trigger this detection — crash-dump troubleshooting and backup routines both
    compress .dmp files. Knowing whether the user role and host function are consistent with command-line archiving of dump
    files is often the fastest path to distinguishing a routine operation from collection staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the RAR command do? Decode the full command line, including the dump file path and any switches.
  context: The full command line reveals the specific archiving action — which dump file was targeted, the output archive path,
    and any compression, recursion, or encryption switches. Scoping to all RAR executions on this host within a few minutes
    of the alert captures sequential invocations (for example, an add followed by a move or a second archive) that together
    form one staging operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - .dmp
          - .dump
          - .hdmp
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this RAR utility, and is that parent chain expected?
  context: The parent process reveals how the archiving tool was invoked. Interactive administrative use typically descends
    from explorer.exe or a shell the operator opened; invocation from a script host (wscript.exe, cscript.exe), a remote-access
    or web-server process, or an unexpected service may indicate the archiving step of a hands-on-keyboard operation. Walk up
    from the parent to see what launched it and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the archiving binary a genuine RAR utility, or a renamed or relocated executable masquerading as one?
  context: The rule matches on Image ending in rar.exe/winrar.exe or on the binary's RAR Description, so a renamed copy of the
    real utility still fires while an unrelated binary could also carry a matching name. Confirm the executable path, the signing
    chain, and the original file name. A RAR utility running from a user-writable or staging directory, unsigned, or with a
    file name that does not match its embedded original name is a stronger collection-staging signal than the same tool running
    from a normal install path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - CurrentDirectory
- question: Around the time of the alert, did the archiving process load crypt32.dll or other encryption libraries on this host?
  context: Archive-via-utility staging sometimes pairs compression with encryption so the bundled data resists inspection in
    transit. Loading of crypt32.dll or similar cryptographic libraries by the archiving process indicates the archive may be
    encrypted rather than plain-compressed. If image-load telemetry is not collected in this environment, treat zero results
    as a visibility gap rather than evidence no encryption occurred, and fall back to inspecting the command line for encryption
    switches.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - \crypt32.dll
          - \bcrypt.dll
          - \ncrypt.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: What dump file or files were selected for archiving, and where do they live?
  context: 'The command-line arguments reveal what data was targeted: a specific memory-dump path, a wildcard sweep of a dump
    directory, or recursive collection of multiple files. A dump of a security-sensitive process (for example, an LSASS dump)
    or a wildcard over a directory of dumps raises the severity well above a single benign crash dump. The path and any recursion
    flags also point to the data source location.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was the archive password-protected or header-encrypted? Check for -p, -hp, or -m switches in the command line.
  context: Operators often password-protect or header-encrypt staged archives to prevent inspection of the contents during exfiltration.
    For RAR, -p sets a password, -hp encrypts both data and the file-name headers (so even the contents listing is hidden),
    and -m controls compression level. A password-protected or header-encrypted dump archive is a stronger indicator of deliberate
    data theft than a plain archive. Note that a password supplied via stdin or a config file will not appear in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Where was the archive written after creation, and was it subsequently moved or copied?
  context: Dump-file staging typically writes an archive locally, then moves it to a staging location or pushes it outbound.
    Files created by the archiving tool show where the output landed — a temp or public directory, a user profile, or a network
    share. Pair this with outbound network activity from the same host in the same window to reconstruct the exfiltration path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this host normally run a RAR command-line utility?
  context: A compression tool that has never been seen on a host is more notable than one that runs regularly. Zero or very
    low historical counts over the trailing window indicate first-time or rare execution, which fits ad-hoc collection staging
    rather than an established backup or packaging routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users drove it, and does the current
    alert fit?
  context: Even routine tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific firing pattern — a RAR utility compressing a dump file — has historically
    run here, not generic RAR usage. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description: Command line RAR
      selection_extension:
        CommandLine|contains:
        - .dmp
        - .dump
        - .hdmp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description: Command line RAR
      selection_extension:
        CommandLine|contains:
        - .dmp
        - .dump
        - .hdmp
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description: Command line RAR
      selection_extension:
        CommandLine|contains:
        - .dmp
        - .dump
        - .hdmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether the archiving step is isolated or part of broader hands-on-keyboard
    activity. If the same user triggered similar collection or staging on multiple hosts, the scope of the operation may be
    larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description: Command line RAR
      selection_extension:
        CommandLine|contains:
        - .dmp
        - .dump
        - .hdmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation
    or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern — a RAR utility compressing a dump file — rather than generic use of the binary. Many hosts firing the same
    pattern points to a scripted backup or packaging job; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description: Command line RAR
      selection_extension:
        CommandLine|contains:
        - .dmp
        - .dump
        - .hdmp
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Collection staging rarely happens in isolation. Earlier detections on the same host — credential access, process
    discovery, or defense tampering — may reveal what produced the dump file and the stages that preceded the archiving step,
    helping reconstruct the timeline. Dump creation followed by compression and an outbound transfer is the staging-and-exfil
    sequence to look for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
