name: PowerShell SAM Copy
id: 24131466-b240-4e47-a12b-8402e53136a7
description: |
  Detects PowerShell command lines that read the local SAM registry hive out of a Volume Shadow Copy and copy it to another
  location. The rule fires only when both conditions hold: the command line references a shadow-copy path into
  System32\config\sam AND it performs a copy operation (Copy-Item, cp/cpi/copy of a pipeline object, or [System.IO.File]::Copy).
  Copying the SAM hive from a shadow copy bypasses the file lock the live OS holds on the registry, yielding an offline copy
  from which local account password hashes can be extracted. Legitimate triggers are rare (some backup workflows, or scripts
  remediating the HiveNightmare/SeriousSAM ACL exposure); the investigation should determine whether all three hives
  (SAM, SYSTEM, SECURITY) were taken, which account ran it, and whether the copies were moved off the host.
type: detection
detection_id: 1af57a4b-460a-4738-9034-db68b880c665
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line both reference a shadow-copy path into System32\config\sam AND perform a copy operation?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the command line contains a
    \HarddiskVolumeShadowCopy reference into System32\config\sam together with a copy operation (Copy-Item, cp/cpi/copy of a
    pipeline object, or a .NET File::Copy call). Read the full command line and verify both elements are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to copy the SAM hive from a shadow copy?
  context: Legitimate backup or ACL-remediation activity can trigger this detection. Knowing whether the running account and
    host function are consistent with shadow-copy/registry-hive handling is often the fastest way to separate a true positive
    from sanctioned administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are the copied hive files still on disk for analysis?
  context: The command copies the SAM hive (and often SYSTEM and SECURITY) to a destination path. If those output files still
    exist, they enable hash extraction confirmation, content review, and recovery of what was staged. Their absence may mean
    the copies were already moved or deleted after exfiltration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the SAM database exported, and were the SYSTEM and SECURITY hives also taken?
  context: Extracting local account hashes offline requires both the SAM hive and the SYSTEM hive (SYSTEM holds the boot key
    that decrypts SAM); SECURITY is often grabbed alongside for LSA secrets. Inspect the full command line for whether all
    of SAM, SYSTEM, and SECURITY were copied — taking all of them confirms intent to crack local credentials offline rather
    than a single-file mishap.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the copy command obfuscated or wrapped in a download cradle, and what does it resolve to?
  context: The rule matches a plain-text copy pattern, but the surrounding command may add concatenation, backtick escaping,
    variable substitution, or a -EncodedCommand wrapper to hide the shadow-copy path or the destination. Decode any encoding
    and resolve the actual source hive path and destination so the staged location can be identified and checked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: Script block logging records the deobfuscated script PowerShell actually executed, even when the command line is
    encoded or built dynamically. This provides ground truth about the shadow-copy enumeration and copy loop that ran. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than
    evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Operators often disable or bypass PowerShell controls before running a hands-on payload. Common precursors include
    AMSI bypass (patching amsi.dll in memory), execution policy changes, constrained language mode escape, and downgrade to
    PowerShell v2 (which lacks logging). Finding these shortly before the SAM copy strengthens the case for malicious intent.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Which local accounts may be exposed, and do any have elevated or reused privileges?
  context: Severity depends on what the SAM hive contains on this host. A workstation SAM exposes local accounts, including
    the local Administrator; if that password is shared across the fleet (a common image-build mistake) it enables lateral
    movement to every host with the same hash. Cross-reference the local accounts and any shared local-admin credential
    against organizational records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - \HarddiskVolumeShadowCopy
        - System32\config\sam
      selection_2:
        CommandLine|contains:
        - Copy-Item
        - cp $_.
        - cpi $_.
        - copy $_.
        - .File]::Copy(
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - \HarddiskVolumeShadowCopy
        - System32\config\sam
      selection_2:
        CommandLine|contains:
        - Copy-Item
        - cp $_.
        - cpi $_.
        - copy $_.
        - .File]::Copy(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window reveals lateral movement or parallel action on
    multiple endpoints. If the same user drove SAM access or other credential activity on several hosts at once, the scope of
    compromise is larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - \HarddiskVolumeShadowCopy
        - System32\config\sam
      selection_2:
        CommandLine|contains:
        - Copy-Item
        - cp $_.
        - cpi $_.
        - copy $_.
        - .File]::Copy(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this shadow-copy SAM pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even sanctioned backup or remediation can match this pattern. The query mirrors the rule's selection scoped to this
    host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here. A new
    parent, an unexpected account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - \HarddiskVolumeShadowCopy
        - System32\config\sam
      selection_2:
        CommandLine|contains:
        - Copy-Item
        - cp $_.
        - cpi $_.
        - copy $_.
        - .File]::Copy(
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: Credential dumping rarely occurs in isolation. Examining the surrounding process activity reveals what led to the
    SAM copy and what followed — reconnaissance, shadow-copy creation (vssadmin/wmic), privilege escalation, archiving of the
    copied hives, or staging for exfiltration. Aggregating by Image and ParentImage collapses repetitive telemetry while novel
    pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, shadow-copy creation, or privilege
    escalation — may reveal the stages that preceded the SAM copy and help reconstruct the timeline. The sequence of alerts
    often tells the attack story leading up to credential access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this shadow-copy SAM pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather
    than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or a backup product;
    one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - \HarddiskVolumeShadowCopy
        - System32\config\sam
      selection_2:
        CommandLine|contains:
        - Copy-Item
        - cp $_.
        - cpi $_.
        - copy $_.
        - .File]::Copy(
      condition: all of selection*
    fields:
    - host.name
