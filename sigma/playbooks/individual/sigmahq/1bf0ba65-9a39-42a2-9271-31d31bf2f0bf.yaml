name: Pikabot Fake DLL Extension Execution Via Rundll32.EXE
id: 33dc0a7a-8ce5-42c6-8902-ff988d70ddf1
description: |
  Detects a script host or shell (cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe,
  regsvr32.exe, or wscript.exe) spawning rundll32.exe with a command line that references a file
  under ProgramData, Users\Public, Windows\Installer, AppData\Local\Temp, or AppData\Roaming, where
  that file carries no .dll, .cpl, or .inf extension. rundll32.exe loads a module by path and export
  name regardless of the file's extension, so loader activity renames a fetched DLL to an arbitrary
  extension before loading it, which defeats inspection keyed on the extension; Pikabot loaders use
  this pattern, staging the module in a user-writable directory and calling a named export.
  Legitimate installers, control-panel applets, and setup routines keep the conventional extensions
  the rule filters out, so the investigation should establish what file was loaded, which export was
  called, how that file arrived on disk, and what ran after the module was loaded.
type: detection
detection_id: 1bf0ba65-9a39-42a2-9271-31d31bf2f0bf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Did a script host or shell spawn rundll32.exe against a file in a user-writable directory
    that has no .dll, .cpl, or .inf extension?
  context: >-
    Confirm the alert before investing investigation time. The rule requires all three conditions
    together: the parent is cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe,
    or wscript.exe; the child is rundll32.exe; and the command line references a path under
    ProgramData, Users\Public, Windows\Installer, AppData\Local\Temp, or AppData\Roaming. It fires
    only when the referenced file does not end in .dll, .cpl, or .inf. Read the command line and
    identify the loaded file's actual extension.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32.exe against files staged in temp or profile directories?
  context: >-
    rundll32.exe runs constantly on Windows for legitimate reasons, but almost always against
    modules in System32, Program Files, or a signed application's install directory. Loading a
    module out of a user profile or ProgramData path is the part that is unusual. Software packaging,
    a developer workflow, or an in-house tool can produce it; a user with no such role cannot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this script host or shell expected to spawn rundll32.exe, and what started the parent?
  context: >-
    The parent's own command line usually names the script or batch file that drove the execution,
    and its parent shows how that script arrived. In loader chains the parent is typically a script
    interpreter running a dropped .js or .bat file from a temp directory, itself started from a
    document, archive, or shortcut the user opened. A packaging or management workflow shows a
    different origin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    Loader chains rarely produce a single child. The same shell or script host commonly runs a
    download utility, a rename or copy, and a decoy in sequence around the rundll32 call. Listing
    every child of this exact parent instance shows the full operation the parent orchestrated and
    often reveals the command that staged the loaded file.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What file did rundll32.exe load, and which export was called?
  context: >-
    Parse the rundll32 command line into its two parts. The path names the module on disk; the
    token after the comma or the trailing space names the exported function being invoked. Random
    or word-like file names with arbitrary extensions paired with a non-standard export name are
    the pattern the rule targets. Note the full path so the file's origin and any later executions
    can be traced. This query lists every rundll32 execution on the host in the alert window that
    references one of the rule's staging directories, so multi-step loading is visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \rundll32.exe
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - ':\Windows\Installer\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What processes did the alerting rundll32.exe instance spawn?
  context: >-
    Once a module is loaded, rundll32.exe becomes the execution host for whatever the module does.
    Children of the alerting instance show the next stage directly — discovery utilities such as
    whoami.exe, ipconfig.exe, or netstat.exe, further script hosts, or a copy of the module into a
    persistence location. rundll32.exe with no children does not clear the alert, since loaded code
    commonly stays in-process or injects into another process instead of spawning.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - edr_console
- question: What files did the parent process write to disk around the time of the alert?
  context: >-
    The module rundll32.exe loaded had to reach the disk first. The same parent that made the
    rundll32 call is usually the process that wrote or renamed the file moments earlier, so its file
    activity identifies the staged payload and any companion artifacts such as batch files, scripts,
    or decoy documents. Match the written path against the path in the rundll32 command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Did a download utility fetch a file into the same staging directory shortly before the alert?
  context: >-
    Loader chains fetch the module over HTTP and write it to a user-writable directory under an
    arbitrary name, often renaming it once more before the load. A download to the same directory in
    the minutes before this alert identifies the delivery step and the remote host that served the
    module, which is the pivot for scoping other affected endpoints. Compare the output path against
    the path rundll32.exe loaded.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \curl.exe
          - \wget.exe
          - \certutil.exe
          - \bitsadmin.exe
          - \powershell.exe
          - \pwsh.exe
        CommandLine|contains:
          - 'http://'
          - 'https://'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - network_connection
- question: Has this parent binary spawned rundll32.exe against these staging directories on this host before?
  context: >-
    Script hosts and shells do spawn rundll32.exe in normal operation, but generally against modules
    in system or application directories. Counting only the executions that reference ProgramData,
    Users\Public, Windows\Installer, or the profile temp and roaming paths keeps the baseline on the
    behavior the rule fires on. Zero or very low counts indicate a new pairing; a steady count points
    to an installer or in-house automation that can be identified from the returned command lines.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - ':\Windows\Installer\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run rundll32.exe against modules in these user-writable directories?
  context: >-
    A host-level baseline restricted to the rule's staging directories separates routine rundll32
    volume from the narrow behavior in question. Grouping by user shows whether the history belongs
    to service accounts running packaging tasks or to interactive users. A first-ever occurrence on a
    long-monitored host carries more weight than one more entry in an established pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - ':\Windows\Installer\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of script-host-spawned rundll32 loads from user-writable directories, not generic
    use of rundll32.exe, aggregated by host. A user who has never produced this pattern is a
    different finding than one who produces it weekly; weigh the count against the user's role and
    typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\Installer\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_known_extension:
      - CommandLine|contains:
        - '.cpl '
        - .cpl,
        - '.dll '
        - .dll,
        - '.inf '
        - .inf,
      - CommandLine|endswith:
        - .cpl
        - .cpl"
        - .dll
        - .dll"
        - '.inf'
        - .inf"
        - .cpl'
        - .dll'
        - .inf'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven this pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior. The
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving
    rundll32 loads of extensionless modules from user-writable directories, not generic parent and
    binary co-occurrence. A new or rare parent for this pattern is the deviation worth chasing; a
    parent already accounting for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\Installer\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_known_extension:
      - CommandLine|contains:
        - '.cpl '
        - .cpl,
        - '.dll '
        - .dll,
        - '.inf '
        - .inf,
      - CommandLine|endswith:
        - .cpl
        - .cpl"
        - .dll
        - .dll"
        - '.inf'
        - .inf"
        - .cpl'
        - .dll'
        - .inf'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's process activity across all hosts in the alert window shows whether the
    execution is confined to one endpoint or the same account is active elsewhere. If the alert
    fired under SYSTEM or another service principal, this returns routine agent and service telemetry
    and the parent-scoped fleet question is the meaningful answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent
    telemetry from every host. The meaningful question is whether the same launch mechanism produced
    the same result elsewhere. The query mirrors the rule's selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window point
    to scheduled or pushed automation, or to a delivery wave reaching several recipients; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - :\Windows\Installer\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      filter_main_known_extension:
      - CommandLine|contains:
        - '.cpl '
        - .cpl,
        - '.dll '
        - .dll,
        - '.inf '
        - .inf,
      - CommandLine|endswith:
        - .cpl
        - .cpl"
        - .dll
        - .dll"
        - '.inf'
        - .inf"
        - .cpl'
        - .dll'
        - .inf'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the alert window collapses repetitive agent
    and service telemetry into high-count rows while novel pairings stand out at low counts. Look for
    the stages that surround a loader call — archive or document handlers, script hosts, download
    utilities, and discovery binaries appearing within minutes of each other.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Is this parent-child spawning pattern occurring on other hosts?
  context: >-
    The same script host spawning rundll32.exe against the same staging directories on several hosts
    within a day points to a delivery wave reaching multiple recipients or to a management task
    rolled out fleet-wide; the returned command lines separate the two. A single host is more
    consistent with a targeted or user-initiated execution. Use the result to size the response.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - ':\Windows\Installer\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A module load through rundll32.exe sits in the middle of a chain. Earlier detections on the same
    host frequently cover the delivery and staging steps — script host execution from a temp
    directory, scriptlet execution through regsvr32.exe, or command-line file transfer — and together
    they reconstruct how the module arrived. Absence of earlier alerts narrows the entry point to
    something unmonitored, such as a user opening a delivered file.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
