        - C:\ProgramData\
        - C:\Perflogs\
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      selection_susp_images:
        CommandLine|contains:
        - regsvr32
        - rundll32
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - powershell
