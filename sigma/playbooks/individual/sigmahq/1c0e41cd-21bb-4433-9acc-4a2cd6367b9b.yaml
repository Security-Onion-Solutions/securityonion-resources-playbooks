- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single persistence mechanism. After modifying a scheduled
    task to carry a payload, they commonly add backup footholds using different techniques —
    new services, registry Run keys, BITS jobs, or WMI subscriptions. Several persistence
    installations from the same timeframe indicate intentional stacking rather than an isolated
    task change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Do the Security task-modification audit events corroborate the change, and what task content do they record?
  context: Process creation shows the schtasks command was launched; the Security audit channel
    records the resulting task change independently, including modifications made through APIs
    or management consoles that never spawn schtasks.exe. Task-modified and task-updated audit
    events capture the task name and the full task definition that was written, which confirms
    the change actually registered and lets the analyst recover the stored program and run-as
    account even if the command line was obfuscated. If these audit events are not collected in
    this environment, treat their absence as a visibility gap rather than evidence the change
    did not register.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - TaskContent
- question: Did the Task Scheduler registry cache change for the targeted task around the alert time?
  context: The Task Scheduler stores each task as a registry entry under the TaskCache hive in
    addition to the XML file on disk. A registry write to a TaskCache Tasks or Tree entry around
    the alert time corroborates that the modification persisted and can reveal task changes made
    without schtasks.exe. Pivoting on the registry write also surfaces the writing process, which
    helps attribute the change when the command line alone is ambiguous. If registry value
    monitoring is not collected in this environment, treat the absence of results as a visibility
    gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
