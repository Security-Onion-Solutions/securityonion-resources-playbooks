name: Registry Explorer Policy Modification
id: c61ac50a-a27d-4d76-9c69-47e711fdc94d
description: |
  Detects a write of DWORD 0x00000001 to one of the Explorer restriction policies under
  SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer (NoRun, NoDesktop, NoControlPanel,
  NoFind, NoClose, NoLogOff, NoFileMenu, NoSetTaskbar, NoPropertiesMyDocuments, NoTrayContextMenu).
  Enabling these values strips the affected user of common ways to launch programs, reach the
  control panel, or close the shell — a UI-lockdown and defense-evasion behavior used by
  screenlocker and configuration-tampering malware to restrict a victim's ability to remediate,
  and also a legitimate GPO/admin-script setting in managed environments. Determine which policy
  was set, which process wrote it, whether the change matches an approved policy deployment, and
  whether other tampering landed alongside it.
type: detection
detection_id: 1c3121ed-041b-4d97-a075-07f54f20fb4a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert show an Explorer restriction policy set to 0x00000001, and which policy fired?
  context: >-
    The rule fires when TargetObject ends in one of the Explorer Policies values (NoRun, NoDesktop,
    NoControlPanel, NoFind, NoClose, NoLogOff, NoFileMenu, NoSetTaskbar, NoPropertiesMyDocuments,
    NoTrayContextMenu) AND the value data is DWORD 0x00000001. Confirm the exact TargetObject and
    Details before investing time — note which policy was enabled, because a NoRun/NoControlPanel
    lockdown implies different intent than a NoClose or NoTrayContextMenu restriction, and the
    writing process is the pivot for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Explorer restriction policies?
  context: >-
    Explorer Policies values are legitimately set by group policy, MDM, or admin lockdown scripts —
    typically on kiosk, shared, or tightly managed endpoints. A policy write on a normal
    interactive workstation, or by an account with no administrative or deployment role, is harder
    to explain. User attribution is present on roughly 94% of endpoint registry events; when it is a
    machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Explorer restriction policy was set, and what does enabling it take away from the user?
  context: >-
    The specific value name determines the effect. NoRun removes the Run dialog; NoControlPanel and
    NoFind block the control panel and search; NoClose and NoLogOff prevent shutting down or logging
    off; NoDesktop, NoSetTaskbar, NoTrayContextMenu, NoFileMenu, and NoPropertiesMyDocuments strip
    shell surfaces. Enabling several at once produces a locked-down shell consistent with a
    screenlocker or an attacker trying to keep a user from launching remediation tools. Judge whether
    the specific restriction fits a legitimate kiosk/lockdown policy for this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written, and does it enable or clear the restriction?
  context: >-
    For these policy values, DWORD 0x00000001 enables the restriction and 0x00000000 (or deleting
    the value) clears it. The rule fires only on the enable case. Read the Details field to confirm
    the data is 0x1, and note that value data is present on roughly 79% of endpoint registry writes —
    when Details is empty (binary or absent data), fall back to the value name and the writing process
    to reason about the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process wrote this policy value, and what started that process?
  context: >-
    Legitimate policy writes come from a narrow set of writers — group-policy processing under
    svchost.exe, an MSI installer (msiexec.exe), regedit.exe, or a signed management agent. A write
    from reg.exe or powershell.exe launched interactively, or from an unsigned binary with an
    unusual parent chain (a script host, an Office app, a freshly dropped executable), points to
    hands-on tampering. Trace the writing process back to its parent to see how it was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who enable one Explorer restriction usually set several, and often pair them with other
    tampering — disabling Task Manager or the registry tools, turning off security features, or
    writing a Run key for persistence. Grouping all registry writes on the host by key path and
    writing process shows whether this alert is one value in a broader lockdown/tamper sweep or an
    isolated change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this policy value been re-set or changed again on this host since the alert?
  context: >-
    Registry key and value deletions are not observable in endpoint telemetry, so attacker cleanup of
    the value cannot be seen directly — judge persistence from the value's re-modification history
    instead. Repeated writes of the same policy (for example a script re-asserting the restriction, or
    a flip back to 0x00000000) tell you whether the lockdown is being actively maintained or was a
    one-time change. A single write that is never touched again is consistent with a set-and-forget
    policy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this Explorer policy value been modified before on this host?
  context: >-
    Explorer restriction policies should rarely change on a normal endpoint. A first-time write to
    this value is more suspicious than a routine one; if the same value has been set repeatedly over
    time — for example by a recurring management job — the change is more likely part of an
    established configuration than a novel tampering event. Compare the historical Details values to
    see whether the same data is being reasserted or something new is being set.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Explorer policy value set on other hosts in the environment?
  context: >-
    Explorer Policies are frequently pushed fleet-wide by group policy, so the same value appearing
    on many hosts with the same data and the same writing process points to a legitimate managed
    policy. A change confined to this one host — or one that differs from the fleet's normal value —
    is more likely targeted tampering. Compare the writing process and Details across hosts to tell a
    GPO rollout from a local change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry write on its own says little about how it got there. Aggregating the processes that
    ran on the host near the alert time surfaces the execution context — what launched shortly
    before the policy change, what ran after, and whether reconnaissance, credential access, or
    additional defense-evasion tooling appears alongside it. Novel parent-child pairs stand out at
    low counts against routine agent noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    A UI lockdown is often paired with a way to survive reboot. After restricting the shell, an actor
    commonly installs a backup foothold using a different technique — scheduled tasks, services,
    registry Run keys, or BITS jobs. Several persistence installations in the same timeframe indicate
    intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a Run key achieves persistence without
    running reg, sc, or schtasks. If the Explorer lockdown is part of a screenlocker or trojan
    install, a payload written to a startup location is a common companion. File-monitoring captures
    these drops even when the actor avoids standard persistence tools.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the stages that preceded the policy change and
    help reconstruct the timeline. A lockdown that follows other tampering reads very differently
    from one that appears with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, deployment, or documented approval for this policy change?
  context: >-
    Explorer restriction policies are commonly deployed deliberately for kiosk or locked-down
    endpoints. A corresponding change ticket, GPO rollout record, or lockdown-deployment note points
    to authorized activity; the absence of one where policy requires it points the other way. This
    check often closes or escalates the alert quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this how your organization normally applies Explorer lockdown policies?
  context: >-
    Most organizations push shell-restriction policies through group policy or an MDM/management
    platform rather than a direct reg.exe or PowerShell write on the endpoint. A policy set by
    ad-hoc command-line tooling, outside the normal deployment path, may indicate an attacker
    bypassing standard management — or an admin taking a shortcut. Knowing the normal method makes
    the distinction fast.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
