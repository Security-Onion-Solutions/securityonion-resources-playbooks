name: Exploiting SetupComplete.cmd CVE-2019-1378
id: 94618c97-5328-4458-9ef1-78461d7f7a03
description: |
  Detects a process starting from the Windows setup post-installation hook: the parent command line is cmd.exe
  invoked with /c against a script under C:\Windows\Setup\Scripts\ ending in SetupComplete.cmd or
  PartnerSetupComplete.cmd, and the child image lives outside C:\Windows\System32\, C:\Windows\SysWOW64\,
  C:\Windows\WinSxS\, and C:\Windows\Setup\. Both conditions are required together. That script path is executed by
  the servicing stack as SYSTEM at the end of a feature update or image deployment, and CVE-2019-1378 describes an
  access-control weakness that lets a standard user overwrite the staged script before it runs, so whatever the
  script calls executes with SYSTEM privileges. The same path is also used legitimately by OEM and imaging teams for
  post-setup customization, which makes the servicing context the central discriminator. The investigation should
  establish whether the host was genuinely being serviced, what wrote the script, what the non-system child did, and
  whether privileged execution or persistence followed.
type: detection
detection_id: 1c373b6d-76ce-4553-997d-8c1da9a6b5f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the parent command line show cmd.exe running SetupComplete.cmd or PartnerSetupComplete.cmd from the
    Windows setup scripts directory, and is the child image outside the Windows system directories?
  context: Confirm the alert before investing time. The rule requires the parent command line to contain all of \cmd.exe,
    /c, and C:\Windows\Setup\Scripts\ and to end in SetupComplete.cmd or PartnerSetupComplete.cmd, and it requires
    the child image to fall outside System32, SysWOW64, WinSxS, and Setup. Read the parent command line for the full
    script path, and read the child image path — a child under a user profile, ProgramData, Temp, or a removable
    volume is the combination the rule is built around.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
  answer_sources:
  - alert
  - process_creation
- question: Was this host being serviced or re-imaged at this time, and is this account expected to be involved in
    that work?
  context: The setup scripts hook only runs at the end of a feature update or an image deployment, so establish
    whether the host was in that state at all. A build or imaging host running a documented post-setup
    customization has a routine explanation; a general-purpose workstation that was not being upgraded does not. The
    hook runs as SYSTEM, so judge by the host's role and its servicing state rather than by the account name shown
    on the event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was there a change ticket, maintenance window, or documented approval for a feature update or image
    deployment on this host?
  context: Feature updates and image deployments are normally scheduled and recorded, and post-setup customization
    scripts are normally authored and signed off by whoever owns the image. A ticket covering this host and this time
    supplies the legitimate explanation for the hook running at all; the absence of one when servicing is normally
    tracked means the script ran outside any planned work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this execution line up with the reboot that completes an upgrade, or with unrelated
    working hours on this host?
  context: The hook fires once, during the post-reboot stage of an upgrade, and the staged script sits on disk for a
    window of roughly 30 minutes before the automatic reboot consumes it. Execution that coincides with a recorded
    upgrade reboot is consistent with servicing; execution during ordinary interactive hours on a host with no
    upgrade history points at a script left in the path for a later trigger. Note the local time on the host, not
    just the collection timestamp.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: What launched the cmd.exe instance that ran the setup script, and what was its full command line?
  context: The alert shows the setup script as the parent command line but not what invoked it. Retrieving the
    parent's own start event supplies its launcher and its full arguments. During genuine servicing the launcher is
    the deployment stack — WinDeploy.exe or another setup host running under SYSTEM — and the cmd.exe path is under
    System32. A launcher that is an interactive shell, a user application, a scheduled task, or a script host means
    the setup scripts path was invoked outside the servicing sequence, which changes the reading of everything below
    it. The parent's own path also carries the exploitation vector distinction the technique turns on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What did the non-system process launched by the setup script actually do — read its full command line and
    working directory.
  context: This is the payload leg of the alert and it inherits the SYSTEM token the servicing stack holds. Read
    every argument, decode any encoded or concatenated content, and identify the operation — a copy, an account
    change, a download, an interpreter invocation, or a second binary launch. Note the working directory and the
    image path; a binary staged under Temp, a user profile, ProgramData, or a removable volume is the staging
    location this technique class relies on, whereas a customization tool in a vendor directory referenced by an
    image script is a different proposition. Command chaining operators and switches such as /c ping or /k whoami in
    the parent script line describe what the script was told to run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which process wrote or modified the setup scripts on this host, and when?
  context: The technique works by overwriting a script the servicing stack will execute as SYSTEM before it runs. The
    staged copies live under $GetCurrent\SafeOS and the upgrade sources directory and are copied to
    C:\Windows\Setup\Scripts\ for execution, and the directory's access control is what the vulnerability weakens. A
    write by the servicing stack or an image-deployment tool is the expected origin; a write by a user-context
    process, an interpreter, a text editor, or an archive utility is the tampering step, and its timestamp bounds
    when the payload was introduced. Check the writing process and the account it ran under against the host's
    servicing history.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
        - '\Windows\Setup\Scripts\'
        - '\$GetCurrent\SafeOS\'
        - '\$WINDOWS.~BT\Sources\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: What other processes did the setup script launch on this host?
  context: A batch script normally calls a sequence of commands, so the alerting child is one line of it. Listing
    every process whose parent command line references the setup scripts directory reconstructs what the script
    actually performed. A short run of system utilities matches post-setup customization; a sequence that mixes
    account manipulation, interpreter launches, download utilities, or a binary from a staging directory describes an
    operation that used the SYSTEM context the hook provides. The children that fall inside the system directories
    are excluded from the alert but still part of the same script run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentCommandLine|contains|all:
        - '\cmd.exe'
        - 'C:\Windows\Setup\Scripts\'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which logons were assigned SYSTEM-level privileges on this host around the time the setup script ran?
  context: Privilege escalation is only meaningful if the elevated token was used, and event 4672 records the special
    privileges granted to a new logon. During servicing the elevated logons belong to the system account and the
    deployment stack, which is expected. An additional elevated logon for an interactive or standard account in the
    same window, or a logon whose privilege list includes SeDebugPrivilege, SeImpersonatePrivilege, or
    SeTakeOwnershipPrivilege where that account normally has none, indicates the escalation was converted into
    something usable. If the Security channel is not collected on this host, treat zero results as a visibility gap
    rather than evidence nothing elevated.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - PrivilegeList
  answer_sources:
  - process_creation
  - manual_review
- question: Did the process launched by the setup script load modules from outside the Windows system directories?
  context: Execution flow hijacking continues at the module level — a binary that runs from a staging directory
    commonly loads its own DLLs from the same place, or is itself a system binary relocated so that a
    same-directory DLL wins the search order. This query lists the modules the alerting binary loaded on this host
    with C:\Windows\System32\, C:\Windows\SysWOW64\, and C:\Windows\WinSxS\ excluded, so only loads from outside the
    directories the servicing stack normally sources remain. Read the signer and signature status on each result;
    an unsigned or self-signed module from a user-writable path alongside a signed Microsoft image is the
    side-loading pattern.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_system:
        ImageLoaded|startswith:
        - 'C:\Windows\System32\'
        - 'C:\Windows\SysWOW64\'
        - 'C:\Windows\WinSxS\'
      condition: selection and not filter_system
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
- question: Were service image paths, Run keys, or DLL-search registry values modified on this host around the alert?
  context: A SYSTEM-context window that lasts only as long as a setup script is commonly spent making a change that
    outlives it, and the registry locations that redirect future execution are the usual target — a service
    ImagePath, a Run key, an Image File Execution Options debugger entry, AppInit_DLLs, or AppCertDlls. Compare each
    result against the expected service and startup configuration for this host's image. A value pointing at a binary
    in a user-writable directory, or a debugger entry attached to a system binary, redirects execution flow
    independently of the setup script and persists after the upgrade completes.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
        - '\CurrentVersion\Run'
        - '\CurrentControlSet\Services\'
        - '\Image File Execution Options\'
        - '\Session Manager\AppCertDlls'
        - '\CurrentVersion\Windows\AppInit_DLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's criteria scoped to this account, so the result is its 90-day history of
    non-system processes starting from the setup scripts hook, aggregated by host. Because the hook runs under the
    servicing context, a named user with prior history here usually belongs to an imaging or deployment team; an
    ordinary account with any history at all is worth explaining. A zero result means this account has not driven
    this pattern before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains|all:
        - \cmd.exe
        - /c
        - C:\Windows\Setup\Scripts\
        ParentCommandLine|endswith:
        - SetupComplete.cmd
        - PartnerSetupComplete.cmd
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\Setup\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute the behavior. The
    meaningful pivot is the launch mechanism: the query mirrors the rule''s criteria scoped to the alerting parent
    process, so the result is the 90-day history of this parent driving this specific pattern rather than generic
    parent and binary co-occurrence, aggregated by host. Recurring counts across many hosts describe an image whose
    post-setup script routinely calls a customization tool from outside the system directories; a first-ever
    occurrence on one host describes a one-off.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains|all:
        - \cmd.exe
        - /c
        - C:\Windows\Setup\Scripts\
        ParentCommandLine|endswith:
        - SetupComplete.cmd
        - PartnerSetupComplete.cmd
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\Setup\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the network around this time?
  context: Tracking the account's activity across all hosts shows whether the execution is confined to this endpoint
    or whether the same account was active elsewhere in the same window. When the alert fires under SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account — which is the normal case for the servicing hook — this view
    returns agent and OS telemetry rather than operator activity, and the parent-scoped fleet view is the meaningful
    one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: 'Under a service principal, asking what else the account did across the network returns agent telemetry.
    The useful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s criteria
    scoped to the alerting parent process, fleet-wide, in the alert window. Several hosts completing an upgrade at
    once and all calling the same tool from their post-setup script describes a deployment wave; one host alone
    describes a host-local trigger and keeps the tampering question in scope.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentCommandLine|contains|all:
        - \cmd.exe
        - /c
        - C:\Windows\Setup\Scripts\
        ParentCommandLine|endswith:
        - SetupComplete.cmd
        - PartnerSetupComplete.cmd
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\Setup\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: The setup hook runs inside a recognisable sequence — the deployment stack, its script host, and a short
    run of configuration utilities — so the surrounding process activity shows whether the host really was mid
    upgrade. Aggregating by image and parent collapses repetitive agent telemetry into high-count rows and leaves
    novel parent-child pairs visible at low counts. Reconnaissance, account manipulation, or interpreter activity in
    the same window describes what the elevated context was used for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections place the execution in a timeline. The technique needs a standard user on the host
    first, and it needs the staged script to be located and overwritten during the window before the reboot, so
    preceding detections around file staging, script writing, or local discovery identify how the payload arrived.
    The ordering and spacing of the alerts also indicate whether the activity tracked a person working interactively
    or ran unattended alongside the upgrade.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host around the alert?
  context: A setup script runs once, so anything meant to survive the upgrade has to be established separately while
    the elevated context is available. Scheduled tasks, services, registry writes, BITS jobs, and WMI subscriptions
    created in the same window as the hook are the common follow-ons. Some of these are also legitimate post-setup
    customization steps, so read each command line against what the host's image is documented to configure; entries
    referencing a binary outside the system directories are the ones to pursue.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
