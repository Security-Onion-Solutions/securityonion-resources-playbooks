name: Potential Qakbot Registry Activity
id: 513de904-e3fa-431c-9b81-a18fe6f49337
description: |
  Detects a registry modification whose target path ends in '\Software\firm\soft\Name', a hardcoded
  user-hive location that Qakbot and IcedID loaders use to stash campaign, configuration, or state data
  after a document-delivered payload runs. Legitimate software rarely writes to this exact path, so a true
  positive usually means a loader is already resident and marking the host; the writing process is often a
  common Windows binary the loader has injected into (explorer.exe, wermgr.exe, mobsync.exe) rather than an
  obviously malicious executable. Investigation should confirm the exact key and value data, identify and
  attribute the writing process and its parent chain, and determine whether a payload was dropped or executed
  in the same session.
type: detection
detection_id: 1c8e96cd-2bed-487d-9de0-b46c90cade56
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified registry path end in '\Software\firm\soft\Name'?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    registry path (TargetObject) against the rule's detection criteria. The rule fires on a single condition --
    a registry write whose path ends in '\Software\firm\soft\Name' -- so the path match is definitive. Decoding
    the value data and identifying the writing process are handled by the value-analysis and location-context questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have any software writing to this user-hive path?
  context: This path is not written by mainstream applications, so there is rarely a legitimate role or
    business function that explains it. Knowing the user, the host function, and whether the writing process
    is a signed, expected binary is often the fastest way to separate a true positive from a rare benign
    application. Machine-account or SYSTEM attribution, or a common host binary appearing as the writer,
    points toward loader injection rather than a user action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this a known loader-marker location, and which process wrote the value?
  context: The path '\Software\firm\soft\Name' is a hardcoded artifact key used by Qakbot and IcedID loaders to
    persist campaign or state data under the current user's hive rather than a standard Run/RunOnce persistence
    key. The writing process (Image) matters as much as the key -- loaders commonly write from a legitimate host
    process they have injected into (explorer.exe, wermgr.exe, mobsync.exe) rather than from an obviously
    malicious binary, so an unexpected or unsigned writer strengthens the finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was stored under this key, and does it decode to configuration or an encoded payload?
  context: Loaders store base64 or otherwise encoded and encrypted configuration, bot identifiers, or state
    markers in these keys. Analyze the Details field for base64 blobs, hex, embedded paths, or DWORD flags to
    understand what the loader recorded. The Details field is present on roughly 79% of registry modifications
    and is absent when the value data is binary or empty, so a missing Details value does not by itself mean
    the write was benign.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What spawned the process that wrote this value, and is that parent chain expected?
  context: Tracing the writing process back to its parent reveals whether the chain is legitimate or whether the
    writer was launched by a delivery stage — a document-spawned script host, cmd.exe, or PowerShell decoding
    and reflectively loading a payload. If the writing process is a common host binary but its parent is a
    scripting or Office lineage, that mismatch is consistent with injection following a document-based delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Loaders that write a marker key frequently make several registry changes together — persistence
    entries, security-setting tampering, or additional state keys. Finding a cluster of registry writes from
    the same host and process within a short window reveals the full scope of the configuration changes and
    whether multiple objectives were pursued alongside the marker write.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What files did the writing process and its children create in this session — was a payload dropped alongside the marker write?
  context: The registry write is a marker; the payload itself lands on disk, usually in the same session and
    from the same process lineage. Correlating file activity by the writing process and its children surfaces
    dropped executables, scripts, or batch files placed in user-writable locations such as AppData, ProgramData,
    or Temp. The file-write event carries no hash; if a payload is present, hash it from a later execution or
    retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this registry key been modified before on this host?
  context: A first-time write to this path is more significant than a recurring one. Because mainstream
    software does not use this key, any prior modification history is itself notable and worth comparing —
    zero history indicates the loader marked this host for the first time, while repeated writes may indicate
    an established infection. Compare the Details values across occurrences to see whether the stored data changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same marker key appearing on multiple hosts indicates the loader has spread beyond this endpoint.
    If only this host shows the write, the infection may be contained; if several hosts show it within a narrow
    window, treat it as a multi-host event and compare the Details values to see whether the same campaign data
    was written across them.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: The registry write rarely happens in isolation. Examining process activity in the surrounding window
    reveals what led to the write and what followed — a document-spawned script host, decoding utilities, or
    injection into a host process. Aggregating by Image and ParentImage collapses routine agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: In the hours after the marker was written, what did the writing process go on to run?
  context: After marking the host, a loader typically continues its chain — spawning rundll32 or regsvr32 to
    load a DLL, injecting into a host process, or launching a remote-access payload. Reviewing process activity
    on this host in the hours after the write helps confirm whether the loader stayed active and what its next
    stage was.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Loaders rarely rely on a single foothold. Alongside a registry marker, they commonly install backup
    persistence using scheduled tasks, services, or additional registry keys. Multiple persistence installations
    within the same timeframe indicate intentional stacking rather than isolated activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into the Startup folder or a path referenced by a registry Run key achieves persistence without running
    schtasks, sc, or reg. File-event monitoring captures these drops even when the loader avoids standard
    persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: A registry marker is usually a mid-chain artifact — earlier detections on the same host may capture
    the delivery and execution stages that preceded it, such as a document-spawned script host, obfuscated
    PowerShell, or decoding utilities. The earlier alert timeline helps reconstruct how the loader reached the
    point of marking the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
