name: DNS Query To Devtunnels Domain
id: 0243abd4-405a-4c04-94c5-0ff045bdef15
description: |
  Detects DNS lookups for hostnames ending in .devtunnels.ms, the Azure-hosted Dev Tunnels service that exposes a local port to the internet over a trusted, predictable web-forwarding domain. Legitimate developers use Dev Tunnels to share a local web service during development, so this lookup is expected on developer workstations. The same feature is abused for command and control, data exfiltration, or persistence because only outbound HTTPS/WSS to the service is required, letting an internal host relay an internal service (for example RDP on 3389) out through a trusted domain and bypass inbound firewall controls. Determine which process performed the lookup, whether it is the Dev Tunnels CLI creating or hosting a tunnel versus a browser reaching a forwarded URL, what local service is being exposed, and whether the host has a sanctioned development reason to run a tunnel.
type: detection
detection_id: 1cb0c6ce-3d00-44fc-ab9c-6d6d577bf20b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the queried domain match what this rule detects, and which process queried it?
  context: Confirm the alert by reviewing the exact domain (QueryName) and the querying process against the rule's criterion of a hostname ending in .devtunnels.ms. Note which process performed the lookup, since a browser reaching a forwarded URL and the Dev Tunnels CLI hosting a tunnel are very different situations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user and host expected to use a developer tunneling service?
  context: Dev Tunnels is a developer feature; a lookup from a developer workstation run by an engineer is routine, while the same lookup from a server, a service account, or a user with no development role is harder to explain. Knowing whether the user role and host function fit developer tunneling is often the fastest way to separate benign use from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is a developer tunneling service on the organization's approved software list for this host?
  context: Organizations typically sanction a specific set of remote access and tunneling tools. A tunnel that reaches out through a trusted cloud domain but is not on the approved list may be shadow IT or attacker-deployed persistence, and should be checked regardless of the service's reputation. This is the tuning boundary that separates sanctioned developer use from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a documented development or support reason for this tunnel right now?
  context: Legitimate tunnel usage usually correlates with an active development task, a scheduled test, or a user request. If no such context exists, the tunnel may have been established by an attacker for persistent access or by a user circumventing perimeter controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After resolving the domain, what external endpoint did the querying process actually connect to?
  context: A DNS lookup on its own does not prove a connection. Pivoting to the connections made by the same process shows whether the host followed through and established an outbound session to the service, and whether that session looks like a brief web fetch or a sustained, asymmetric flow consistent with an active tunnel relaying an internal service.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What exact Dev Tunnels hostname was queried, did it resolve, and what does the tunnel identifier reveal?
  context: The alert is a DNS lookup, not a connection. Investigate the full hostname; the web-forwarding form is <tunnelid>-<port>.devtunnels.ms, so the label often reveals which local port is being exposed. Check whether the lookup resolved (dns.resolved_ip) and reserve that IP for confirming an actual connection. Authentication lookups typically precede tunnel-host lookups, so a login-then-host sequence indicates tunnel creation rather than passive browsing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Is the querying process the Dev Tunnels CLI, and what local service or port is being exposed through the tunnel?
  context: Protocol tunneling hides an internal protocol inside a trusted outbound channel. Read the querying process command line — the tunneling CLI (devtunnel.exe) uses host and port flags such as -p 3389 to expose a local service like RDP, and --allow-anonymous adds unauthenticated access, which is a strong abuse indicator. If the process is a browser, the lookup is more consistent with reaching a forwarded URL than with creating a tunnel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other domains did the querying process look up around this time?
  context: A single lookup may be one step in a larger sequence. Reviewing every domain the same process queried in the window can surface the authentication-then-tunnel-host pattern, additional tunnel identifiers, or a burst of algorithmically varied domains that points to beaconing rather than a single developer session.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What process spawned the process that made this lookup, and is that parent chain expected?
  context: The parent process reveals how the querying process was launched. A developer command shell or IDE spawning the tunneling tool is expected, while an Office application, a script host, or a service spawning it points to automated or unattended tunnel creation that no user requested.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally look up Dev Tunnels domains?
  context: A first-time lookup for this domain family on a host is more notable than a routine one. Zero or very low historical counts indicate that tunneling was not previously part of this host's normal activity, which raises the priority of confirming a sanctioned reason.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the process that made this lookup?
  context: A process that has never run on this host before is more suspicious than one that runs regularly. Low historical counts for the querying process indicate first-time or rare execution and, grouped by user, show whether the activity is tied to an expected account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did other hosts in the environment look up this same Dev Tunnels domain?
  context: The distribution across hosts informs the response. A single host reaching this domain suggests a targeted or one-off tunnel, while many hosts resolving the same tunnel identifier suggests a shared script, a widely deployed tool, or broader activity worth scoping.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What files did the querying process write on this host around this time?
  context: A tunneling tool leaves working artifacts on disk, and a process that also downloads or drops payloads points to staged activity beyond the tunnel itself. Files created by the same process on this host help confirm whether this is a self-contained developer session or part of a multi-stage operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity around the lookup reveals the immediate context: what launched the tunneling activity, what ran alongside it, and whether it sits within a larger sequence such as reconnaissance, credential access, or persistence.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded the tunnel and help reconstruct the timeline. Command and control over a trusted-domain tunnel often follows an initial foothold established by other means.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
