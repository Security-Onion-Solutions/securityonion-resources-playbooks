name: Suspicious Rundll32 Invoking Inline VBScript
id: 014749ea-bc30-47c0-a725-598d207beae6
description: |
  Detects rundll32.exe invoked with an inline VBScript command line that calls
  Execute, reads a value from the registry via RegRead, and terminates itself
  with window.close. rundll32.exe legitimately loads DLL exports, but it does
  not normally carry inline scripting on its command line, so this combination
  is a strong fit for a script-based loader that pulls a staged payload out of
  the registry, deobfuscates it in memory, and hands execution back to native
  code. The rule fires only when the command line contains all four tokens
  (rundll32.exe, Execute, RegRead, window.close) together. Investigation should
  decode the inline script to recover the registry path and payload it reads,
  identify the parent that launched it, and determine whether the loaded code
  went on to inject into or load a DLL inside another process.
type: detection
detection_id: 1cc50f3f-1fc8-4acf-b2e9-6f172e1fdebd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line carry inline VBScript that calls Execute, RegRead, and window.close through rundll32.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reading the full command line. All four
    tokens must be present together — rundll32.exe, Execute, RegRead, and window.close. RegRead pulls a value out of the registry,
    Execute runs it as script, and window.close terminates the host window once the payload is delivered. Confirm the inline
    script is genuinely present and not a benign string that happens to contain these words.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run rundll32.exe with an inline scripting payload?
  context: Legitimate administrative activity can trigger many detections. rundll32.exe is a normal Windows utility, but it
    is invoked here with an embedded VBScript payload, which is not a routine administrative pattern. Knowing whether the user
    role and host function involve any tooling that would legitimately call rundll32 with inline script helps separate a true
    positive from an unusual but sanctioned workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the inline VBScript actually do? Decode the registry path it reads and the payload it executes.
  context: The full command line reveals the specific action taken. Recover the registry value RegRead targets, since that is
    where the staged payload lives, and decode anything passed to Execute. Inline loaders of this pattern typically read an obfuscated
    blob from a registry sub-key, decode it in memory, and run it without ever touching disk, so the registry path is the pivot
    to the next stage. The scope is every matching invocation on this host within a few minutes, in case the loader runs in
    more than one step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - rundll32.exe
          - Execute
          - RegRead
          - window.close
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this rundll32 invocation, and is that parent chain expected?
  context: The parent process reveals how the inline script was launched. A loader of this kind is often started by a scripting
    host or a scheduled-task launcher rather than by direct user action, so an unusual parent such as mshta.exe, wscript.exe,
    a task host, or an Office application points toward automated or staged execution. Walk up the chain to see what spawned
    the parent and what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host run rundll32 with this inline VBScript pattern before?
  context: A command-line pattern that has never been seen on a host is more suspicious than one that recurs. Because rundll32.exe
    runs constantly for legitimate DLL loads, the baseline is scoped to the rule's specific token combination rather than to
    rundll32 generally — zero or very low counts indicate first-time or rare execution of this loader pattern here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - rundll32.exe
          - Execute
          - RegRead
          - window.close
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host — the resulting
    parent/user distribution reflects how the rule's specific firing pattern (not generic rundll32 usage) has historically
    run here. Deviations — a new parent process, an unexpected user account, an unusual command-line structure — are the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this rundll32 invocation spawn afterward?
  context: The processes spawned after the loader runs reveal its actual impact. Script-based loaders commonly hand off to
    cmd.exe, powershell.exe, or another rundll32 to run the deobfuscated payload, or write and execute a second-stage file.
    Unexpected children in the minutes after the alert are the operational next stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did any process on this host make a process-injection API call (WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx) around the time the rundll32 loader ran?
  context: Elastic Defend has no cross-process handle-open telemetry, so process injection cannot be verified by access
    rights the way Sysmon's process_access channel would show it. What is observable is the behavioral API layer that
    records the injection-side write primitives an operator issues once code is staged — memory writes, queued APCs,
    and hook installs. Absence of these calls does not rule out injection through mechanisms outside this API set; treat
    it as a narrower substitute, not a full equivalent, and fall back to the child-process and image-load evidence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
- question: Did any process write a memory-dump-style file referencing a high-value target such as lsass.exe or explorer.exe around the alert time?
  context: Injection campaigns favor a small set of long-lived, high-privilege, or user-facing targets to blend in —
    lsass.exe, explorer.exe, svchost.exe, and winlogon.exe are the usual ones. The handle open that would confirm a
    process was actually read or written into is not observable in this environment, so a zero result here is a
    visibility gap, not evidence nothing happened. What can be observed is the artifact a completed read leaves on
    disk — a dump-style file, commonly under a temp or user-writable path, referencing one of these process names.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_ext:
        TargetFilename|endswith:
          - '.dmp'
          - '.dump'
          - '.bin'
      condition: selection and filter_ext
    fields:
      - Image
      - TargetFilename
      - EventType
- question: What other tools ran on this host around the same time as the loader?
  context: Attacks typically involve multiple tools in sequence. Activity surrounding the loader may reveal the scheduled task
    or scripting host that launched it, reconnaissance, persistence installation, or staging of the second-stage payload, all
    of which provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - rundll32.exe
        - Execute
        - RegRead
        - window.close
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential
    access — may reveal the attack stages that preceded the loader and help reconstruct the full timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
