- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the execution is isolated or part of broader movement.
    If the same user triggered similar activity on multiple endpoints in the same window, the scope of compromise may be larger
    than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
