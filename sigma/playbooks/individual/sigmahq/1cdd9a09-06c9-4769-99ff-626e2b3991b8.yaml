- question: Have other hosts fired the double-extension pattern in the past week, and does the cross-host distribution look like a campaign or isolated activity?
  context: The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this masquerading
    pattern rather than generic binary usage. Several hosts firing the same pattern in a short window points to a phishing campaign
    that reached multiple recipients; one host or a small unrelated set points to an isolated delivery. Use the host distribution
    to size the response.
