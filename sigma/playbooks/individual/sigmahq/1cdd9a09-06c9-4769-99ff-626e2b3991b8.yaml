name: Suspicious Double Extension File Execution
id: 2e9c8f06-601f-4e82-8287-be21e5b8e68c
description: |
  Detects execution of a binary whose image path and command line both end in a deceptive double extension — a benign-looking
  type such as .pdf, .doc, .xls, .jpg, or .mp4 immediately followed by .exe or .js, or a name padded with leading spaces,
  underscores, or invisible Braille blank characters that push the real .exe extension out of view in file listings. This
  masquerading pattern is used to trick a user into launching an executable they believe is a document, image, or media file,
  most often after the file arrives as a phishing attachment or download. Investigation should confirm the deceptive name,
  decode the full launch path and command, identify how the file was delivered and which user opened it, and look for the
  surrounding email-delivery, file-write, and outbound-network activity that frames the execution.
type: detection
detection_id: 1cdd9a09-06c9-4769-99ff-626e2b3991b8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the executed file's name and path actually contain a deceptive double extension or a padded/invisible-character extension?
  context: Confirm the alert is a true positive by reading the exact Image path and CommandLine. The rule fires when both end
    in a benign-looking type followed by .exe or .js (for example .pdf.exe, .doc.js, .xls.exe), or when the name is padded
    with leading spaces, underscores, or Braille blank characters (U+2800) that hide the real .exe from view. A legitimately
    named binary that merely contains one of these substrings inside a longer path is a false positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to launch executables that masquerade as documents or media files?
  context: Double-extension and padded-name executables are almost never produced by legitimate software, which uses honest
    file names. Knowing whether the user routinely handles unusual file types, or whether the host is a sandbox or malware-analysis
    machine, is often the fastest way to separate a real user-execution event from a benign one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full launch path and command line of the masqueraded executable, and what real file type and content does it carry?
  context: Decode the complete Image path and CommandLine to recover the true file name, the hidden .exe or .js extension, and
    any arguments, working directory, or referenced paths. Padded names may use leading spaces, underscores, or invisible Braille
    blank characters (U+2800), so inspect the raw bytes rather than the displayed name. A masqueraded media or document file
    often sits in a download or temp directory and may be launched with no arguments by a user double-click.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this masqueraded executable, and is that parent chain consistent with a user opening a delivered file?
  context: The parent reveals how the file was launched. A browser, mail client, archive tool (for example 7zfm.exe or explorer.exe
    extracting an attachment), or a document application as parent points to user-driven execution of a delivered file. An
    Office application spawning the executable, or an unexpected scripting host, points to a malicious-document or macro launch
    path worth tracing further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What email, download, or document delivered this file to the host?
  context: This pattern is most often the first on-host action of a phishing attachment or malicious download. Identify the
    delivery vector — the sending email address, the attachment or download file name, or the originating link — so it can
    be blocked and other recipients can be searched. The parent command line frequently records the original document or archive
    name; mail and proxy logs hold the sender and source.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Was the masqueraded file recently written to disk, and what process and path wrote it?
  context: A spearphishing attachment is stored on disk before it is run, so the file-write event identifies the saving process
    (browser, mail client, or archive extractor) and the directory it landed in — commonly a downloads, temp, or user-profile
    folder. Correlating the write time with the execution time establishes the delivery-to-execution interval and helps confirm
    the file arrived from outside rather than being built locally.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
      - EventType
- question: Did the masqueraded executable make any outbound network connections after launch?
  context: After a phishing payload executes it commonly reaches out to retrieve a second stage or to establish command and
    control. Outbound connections initiated by this process — especially to external addresses on uncommon ports — indicate
    the file is an active payload rather than an inert mislabeled document. Resolve any destinations and pivot on them to find
    other affected hosts.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What child processes did the masqueraded executable spawn afterward?
  context: The processes spawned after launch reveal the payload's intent. Phishing droppers frequently spawn command interpreters,
    scripting hosts (powershell.exe, cmd.exe, wscript.exe, py.exe), or legitimate signed binaries used for DLL side-loading.
    A masquerading file that immediately launches scripting or staging tools is behaving as a dropper, not a document viewer.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the double-extension pattern, what parents and users normally drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects
    how this specific masquerading pattern has fired here before rather than generic binary usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the deviation worth chasing. On most hosts this pattern should
    have little or no history at all.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
