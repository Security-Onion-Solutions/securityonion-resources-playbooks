- question: Did the same detection fire for other users or hosts in the last day?
  context: Phishing campaigns rarely target a single recipient. If one user launched a double-extension attachment, others
    likely received the same lure. Correlating this rule across all hosts reveals the breadth of the delivery and identifies
    additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — earlier delivery attempts, reconnaissance,
    or defense tampering — may reveal the stages that preceded this execution and help reconstruct the timeline from delivery
    to launch.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What application or workflow allowed this masqueraded file to reach execution on the host?
  context: Double-extension files reach a user through email, web download, or removable media, sometimes assisted by mail or
    browser settings that hide known extensions or permit risky attachment types. Identify the receiving application and whether
    its filtering and extension-hiding behavior allowed the deception, so the same path can be closed for other users.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
