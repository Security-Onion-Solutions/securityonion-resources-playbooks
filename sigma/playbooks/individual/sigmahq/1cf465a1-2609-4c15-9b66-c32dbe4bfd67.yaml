name: Legitimate Application Writing Files In Uncommon Location
id: 8b5b1dc4-635e-49de-ad9f-3e0efc6bbc4c
description: |
  Detects a normally-trusted, signed Windows application from a known living-off-the-land set (certutil.exe, bitsadmin.exe,
  mshta.exe, ftp.exe, finger.exe, expand.exe, extrac32.exe, esentutl.exe, ldifde.exe, wordpad.exe, and others) writing a
  file into a location that is uncommon for that binary — Perflogs, ProgramData, Temp, Users\Public, the Windows directory,
  the Recycle Bin, AppData, a Startup folder, or a web root. The rule fires only when both conditions hold: the writing image
  is one of the listed binaries AND the target path falls under one of the watched locations. Legitimately, some of these
  binaries touch some of these paths during installs, updates, or admin tasks, so context matters. Maliciously, an operator
  abuses a trusted binary to stage or download a payload to an out-of-place directory to evade controls (T1105 ingress tool
  transfer, T1218 proxy execution). Determine which binary wrote where, what the written file is and does, whether the write
  fits the binary's normal behavior on this host, and whether the file was later executed.
type: detection
detection_id: 1cf465a1-2609-4c15-9b66-c32dbe4bfd67
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the written file path and the responsible binary match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact target path, the
    operation performed (created, modified, renamed), and the responsible binary against the rule's criteria — one of the
    listed trusted binaries AND a target under a watched uncommon location. Note which binary fired and which location it
    wrote to; both drive the downstream questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have this binary write into this location?
  context: Legitimate administrative activity and software installs can drive these binaries into ProgramData, Temp, or AppData.
    Knowing whether the user role and host function fit a trusted binary dropping a file into the watched location is often
    the fastest way to separate routine operations from abuse. When the user is a machine or service account, judge by the
    writing binary and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command did this binary run when it wrote the file? Decode its full command line and arguments.
  context: The file-write event itself carries no command line, so pivot to the binary's process execution on this host to
    read what it was told to do. Decode flags, source and output paths, and any URLs — certutil -urlcache/-decode, bitsadmin
    /transfer, esentutl copy, expand/extrac32 extraction, or an ftp/finger fetch each reveal a distinct staging or download
    operation. Multi-step tools such as bitsadmin may run as several sequential invocations that together form one logical
    transfer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the content of the file this binary wrote? Check for obfuscation, encoded strings, and known malware indicators.
  context: Read and analyze the written file's actual content. For scripts and text, check for base64 or hex encoding, obfuscated
    strings, embedded URLs or IP addresses, and known malicious string patterns. For binaries, check imports, embedded strings,
    packer signatures, and signing status. This answers what is IN the file, which is distinct from whether the file is already
    known to threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this binary, and is that parent chain expected?
  context: The parent process reveals how the trusted binary was invoked. Legitimate usage tends to have predictable parents
    (explorer.exe for user actions, services.exe or an updater for background tasks). Office applications, script hosts
    (wscript.exe, mshta.exe), or a web-server process launching one of these binaries points to exploitation or a malicious
    document rather than routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the written file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved,
    hashed, and analyzed; a file deleted seconds after it was written suggests anti-forensic cleanup or a self-deleting
    dropper and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the written file has executed, what is its hash, and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written (file-creation events carry no hash). This query
    looks for the written file executing by its name and reads the hash from that execution event; submit the hash to a
    reputation service or internal threat intel to determine whether it is known malicious, benign, or previously unseen.
    If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What child processes did this binary spawn afterward?
  context: The processes a tool spawns reveal its actual impact. A download-and-execute chain shows the written payload, or a
    shell, launching from this binary; a benign administrative use usually spawns nothing unexpected. Unexpected children such
    as cmd.exe, powershell.exe, or a freshly written executable point to post-delivery execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one suspicious file often drops several — a dropper unpacking components, a tool staging
    output, or ransomware touching many paths. The breadth, paths, and extensions of the process's other file activity
    distinguish a single artifact from a broader operation and enumerate what else needs review. Volume alone is not
    suspicion for the noisier binaries here; look at WHERE the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the uncommon locations this rule watches on this host recently, and by which processes?
  context: Location drives suspicion for file artifacts. Web roots, Startup folders, Temp, ProgramData, and system-directory
    look-alikes each have a small set of processes that legitimately write there. Other recent arrivals in the same watched
    locations reveal whether this is an isolated drop or a location under active use, and which unfamiliar writer stands out
    against the routine ones.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - ':\Perflogs'
          - ':\ProgramData\'
          - ':\Temp\'
          - ':\Users\Public\'
          - ':\Windows\'
          - '\$Recycle.Bin\'
          - '\AppData\Local\'
          - '\AppData\Roaming\'
          - '\Contacts\'
          - '\Desktop\'
          - '\Favorites\'
          - '\Favourites\'
          - '\inetpub\wwwroot\'
          - '\Music\'
          - '\Pictures\'
          - '\Start Menu\Programs\Startup\'
          - '\Users\Default\'
          - '\Videos\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the process that wrote this file make outbound network connections around the alert, and to what destinations?
  context: Several of these binaries can pull a file from a remote host before writing it locally (certutil -urlcache,
    bitsadmin /transfer, ftp, finger, esentutl). An outbound connection from the writing process shortly before the drop
    ties the file to an ingress transfer; a connection to an external or unfamiliar destination raises concern, while an
    internal or known-good enterprise destination lowers it. Resolved hostnames are recorded sparsely, so weigh the
    destination IP and port. If no endpoint network telemetry is collected here, treat zero results as a visibility gap
    rather than proof nothing was fetched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: When this host has previously matched the rule's pattern, what programs and users normally drive it, and does the
    current alert fit?
  context: Even trusted binaries writing to these locations can be routine on some hosts. The query mirrors the rule's exact
    selection scoped to this host, so the resulting program and user distribution reflects how this specific firing pattern
    (not generic binary usage) has historically run here. A writing program new to this pattern, an unexpected user account,
    or a first-time appearance of the pattern is the anomaly worth chasing; file events lack parent lineage, so pivot to the
    writer's process-start event if the launch chain matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_img:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \cmdl32.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \bitsadmin.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \expand.exe
        - \extrac32.exe
        - \replace.exe
        - \mshta.exe
        - \ftp.exe
        - \Ldifde.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        - \findstr.exe
      selection_locations:
        TargetFilename|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's exact selection scoped to this user, so the result is the user's 90-day history of
    this specific firing pattern (not generic use of the binary), aggregated by host. A user who has never produced this
    pattern is more notable than one who does so regularly; weigh the count against the user's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_img:
        Image|endswith:
        - \eqnedt32.exe
        - \wordpad.exe
        - \wordview.exe
        - \cmdl32.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \bitsadmin.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \expand.exe
        - \extrac32.exe
        - \replace.exe
        - \mshta.exe
        - \ftp.exe
        - \Ldifde.exe
        - \RdrCEF.exe
        - \hh.exe
        - \finger.exe
        - \findstr.exe
      selection_locations:
        TargetFilename|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern here or across the environment, or is the program
    new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior — the launch
    mechanism does. The query mirrors the rule's exact selection scoped to the alerting program, so the result is the
    90-day history of this program driving this specific pattern (not generic use of the binary). A new or rare
    program for this pattern is the deviation worth chasing; a program already accounting for thousands of prior events is
    vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
