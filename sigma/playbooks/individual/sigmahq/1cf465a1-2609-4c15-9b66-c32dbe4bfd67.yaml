- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's exact selection with no host scope, so the result is a fleet-wide count of this firing
    pattern (not generic usage of the binary). Many hosts matching the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent-and-binary consistency to calibrate severity.
