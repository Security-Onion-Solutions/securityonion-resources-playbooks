    rollout, or isolated to this host?
  context: Under a service or machine account, asking what else the user did across the network returns agent-telemetry noise.
    The meaningful question is whether the same launch mechanism fired elsewhere — the query mirrors the rule's exact selection
    scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
