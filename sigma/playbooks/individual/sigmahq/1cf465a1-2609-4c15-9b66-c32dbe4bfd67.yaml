  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same user drove similar activity on several hosts in the same window, the scope of the incident may be larger than
    a single drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
