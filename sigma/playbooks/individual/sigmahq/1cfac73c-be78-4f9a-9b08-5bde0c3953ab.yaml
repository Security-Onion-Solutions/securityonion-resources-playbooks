name: Operation Wocao Activity
id: 710e842b-cd6a-4fa2-9654-de60c2593f77
description: |
  Fires when a process command line contains one of ten literal strings the rule lists: local-administrator
  enumeration with checkadmin.exe against the loopback address, an inbound firewall rule opened for PowerShell
  via netsh, a bypass-and-encoded PowerShell launch issued through cmd.exe, creation of a scheduled task and of
  a service both named win32times, a DLL path under a remote host's C$ admin share, a KeePass configuration file
  read, a redirected iie.exe run, and a registry query for saved PuTTY session keys. Taken individually, several
  of these are ordinary administrative actions; the strings are written narrowly enough that a match usually means
  the exact recorded form ran, and together they span discovery, defense weakening, persistence, and access to
  stored credentials, all driven from the command line. Determine which string matched, decode any encoded payload,
  confirm whether a task or service named in the command line is still registered, and establish whether an
  administrator, an authorized assessment, or automation accounts for the activity.
type: detection
detection_id: 1cfac73c-be78-4f9a-9b08-5bde0c3953ab
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which of the rule's ten command-line strings appears in this command line, and does the surrounding command make sense?
  context: >-
    The rule matches ten literal substrings covering local-admin enumeration, an inbound netsh firewall rule for
    PowerShell, an encoded PowerShell launch with execution policy bypass, a scheduled task and a service named
    win32times, a DLL under a remote C$ admin share, a KeePass configuration read, an iie.exe run redirected to
    iie.txt, and a PuTTY session registry query. Identify which one matched and read the full command around it
    before spending further time, since the rest of the command line carries the target, the payload, and the
    account the action ran under.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this command execution part of an authorized penetration test or red team engagement?
  context: >-
    Local-admin enumeration, credential-store reads, and command-line persistence are all standard steps in an
    authorized assessment. Check whether a pentest or red team exercise is currently scoped to this host or network
    segment. An engagement whose scope and timing match resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Are the files named in the command line still on disk for analysis?
  context: >-
    Several of the matched strings name files on disk - a PowerShell script at the root of C, a DLL under a remote
    admin share path, a redirected text output file, and a KeePass configuration file. This query correlates file
    activity to the alerting process and its direct children by process lineage, so the file paths in the command
    line can be tied to actual writes. Files still present can be hashed, submitted for analysis, or read directly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What task or service name, schedule, and target command appear in this command line?
  context: >-
    Two of the matched strings register persistence under the name win32times - one through the task scheduler
    (/tn names the task, /tr the command it runs, /sc the schedule, /ru the account) and one through the service
    control manager (binPath names the executable and its arguments). Read the name, the schedule or start type,
    the run-as account, and above all the target command, which is the payload that will run on every trigger.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the command encoded, and what does the base64 payload decode to?
  context: >-
    One matched string is a PowerShell launch combining an execution policy bypass with -enc and a payload whose
    base64 begins JgAg, which decodes in UTF-16LE to an ampersand and a space - the call operator prefixing whatever
    follows. Decode the whole -enc argument rather than the leading bytes; the decoded text carries the actual
    operation, commonly a download cradle, an in-memory assembly load, or a further encoded layer. Another matched
    string launches a script file from the root of C, in which case the script content rather than the command line
    holds the payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The rule keys only on command-line text, so the parent supplies the missing half of the story - how the command
    was issued. A parent of explorer.exe or a shell the user opened points at hands-on administration. Parents such
    as wmiprvse.exe, wsmprovhost.exe, services.exe, or a script interpreter point at remote or automated execution,
    which is the pattern to expect when these commands are driven from another host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single discovery command can be troubleshooting; several different reconnaissance binaries within a few minutes
    is enumeration ahead of a next step. Because the matched strings already include local-admin enumeration and a
    saved-session registry query, other recon binaries in the same window place the alert inside a sequence rather
    than on its own. Three or more distinct binaries in the window generally means the enumeration was scripted.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Did the Security log record a task or service registration on this host, and under what account did it run?
  context: >-
    A task or service created from the command line is also recorded on the Security channel - 4698 for task creation,
    4702 for task modification, 4697 for service installation. These records carry the registering account and the
    binary path independently of the command line, which is how a task or service registered by another mechanism is
    caught. Names that echo Windows components while the binary path points somewhere unexpected, and registrations
    running as SYSTEM where the account has no reason to install services, are the pairings to look at. If the System
    Security Extension audit subcategory is not enabled in this environment, treat an empty result as a visibility gap.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4697
          - 4698
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - ServiceName
      - ServiceFileName
      - SubjectUserName
  answer_sources:
  - manual_review
- question: Was a scheduled task or run-key registered in the registry on this host around the alert?
  context: >-
    Task registration writes the task definition under the Schedule\TaskCache keys, and run-key persistence writes
    under CurrentVersion\Run. These writes appear whether the task was created through the command line, through an
    API, or by dropping a definition, so they catch persistence the command-line strings do not describe. Registry
    reads are not recorded, so the saved-session query in the matched strings leaves no registry evidence of its own -
    it is visible only in the process command line.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Schedule\TaskCache\Tree\'
          - '\Schedule\TaskCache\Tasks\'
          - '\CurrentVersion\Run'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Did any process on this host load the PowerShell automation engine around the time of the alert?
  context: >-
    PowerShell runs wherever System.Management.Automation.dll is loaded, not only in powershell.exe. A process other
    than powershell.exe or pwsh.exe loading that assembly is hosting the engine in its own address space, which leaves
    no PowerShell command line to match on. Because this rule keys entirely on command-line text, this is the pivot
    that surfaces the same activity when it is run through a custom host or an in-memory loader.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_assembly:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
      condition: selection and selection_assembly
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users drove that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how these
    specific command-line strings have run here over the past two weeks - not generic use of cmd.exe. A prior history
    on this host points at a recurring script or an operator who works this way; no history at all makes the alert the
    first occurrence. A new parent process or an unexpected account against an existing history is the deviation worth
    following.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
      selection:
        CommandLine|contains:
        - checkadmin.exe 127.0.0.1 -all
        - netsh advfirewall firewall add rule name=powershell dir=in
        - cmd /c powershell.exe -ep bypass -file c:\s.ps1
        - /tn win32times /f
        - create win32times binPath=
        - \c$\windows\system32\devmgr.dll
        - ' -exec bypass -enc JgAg'
        - type *keepass\KeePass.config.xml
        - iie.exe iie.txt
        - reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result counts fleet-wide occurrences of these
    specific command-line strings rather than generic binary usage. Many hosts firing the same string points at scripted
    deployment or vendor automation. One host, or a small unrelated set, points at manual operator activity and makes the
    host list the starting point for scoping. Use the distribution to calibrate how far the investigation reaches.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
      selection:
        CommandLine|contains:
        - checkadmin.exe 127.0.0.1 -all
        - netsh advfirewall firewall add rule name=powershell dir=in
        - cmd /c powershell.exe -ep bypass -file c:\s.ps1
        - /tn win32times /f
        - create win32times binPath=
        - \c$\windows\system32\devmgr.dll
        - ' -exec bypass -enc JgAg'
        - type *keepass\KeePass.config.xml
        - iie.exe iie.txt
        - reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the account's 90-day history of these
    specific command-line strings, grouped by host. An account that has never produced this pattern is a different
    proposition from one that produces it routinely. Weigh the count and the host spread against what the account is
    for - an administrator or a deployment account with a long history reads very differently from a standard user
    account with none.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
      selection:
        CommandLine|contains:
        - checkadmin.exe 127.0.0.1 -all
        - netsh advfirewall firewall add rule name=powershell dir=in
        - cmd /c powershell.exe -ep bypass -file c:\s.ps1
        - /tn win32times /f
        - create win32times binPath=
        - \c$\windows\system32\devmgr.dll
        - ' -exec bypass -enc JgAg'
        - type *keepass\KeePass.config.xml
        - iie.exe iie.txt
        - reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, the user field attributes nothing and
    the launch mechanism becomes the meaningful pivot. The query mirrors the rule's selection scoped to the alerting
    parent process, giving the 90-day history of that parent driving this specific pattern, grouped by host. A parent
    that already accounts for a long run of prior events is automation; a parent that is new or rare for this pattern is
    the deviation worth following.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
      selection:
        CommandLine|contains:
        - checkadmin.exe 127.0.0.1 -all
        - netsh advfirewall firewall add rule name=powershell dir=in
        - cmd /c powershell.exe -ep bypass -file c:\s.ps1
        - /tn win32times /f
        - create win32times binPath=
        - \c$\windows\system32\devmgr.dll
        - ' -exec bypass -enc JgAg'
        - type *keepass\KeePass.config.xml
        - iie.exe iie.txt
        - reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across every host in the alert window shows whether the same identity was working on
    more than one endpoint, which is what remote execution and lateral movement look like from the identity side. If the
    alert fired under SYSTEM or a machine account, expect this to return large volumes of routine agent telemetry, and
    read the parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host. The question that
    still carries information is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection
    scoped to the alerting parent process, fleet-wide, in the alert window. Several hosts in the same window points at
    scheduled or pushed automation; a single host points at a trigger local to this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: The 'System Security Extension' audit subcategory need to be enabled to log the EID 4697
    detection:
      selection:
        CommandLine|contains:
        - checkadmin.exe 127.0.0.1 -all
        - netsh advfirewall firewall add rule name=powershell dir=in
        - cmd /c powershell.exe -ep bypass -file c:\s.ps1
        - /tn win32times /f
        - create win32times binPath=
        - \c$\windows\system32\devmgr.dll
        - ' -exec bypass -enc JgAg'
        - type *keepass\KeePass.config.xml
        - iie.exe iie.txt
        - reg query HKEY_CURRENT_USER\Software\\*\PuTTY\Sessions\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host give the stages that led here. Defense tampering, reconnaissance, or credential
    access ahead of this alert places it inside a sequence and sets the earliest point the timeline needs to reach back
    to. An isolated alert with no precursors, by contrast, keeps the investigation on this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Persistence is rarely installed once. The matched strings already cover a scheduled task and a service under the same
    name, so the question is whether further mechanisms went in alongside them - run keys through reg.exe, BITS jobs, WMI
    subscriptions, or additional tasks. Several persistence tools running in the same few hours points at deliberate
    stacking rather than a single administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
