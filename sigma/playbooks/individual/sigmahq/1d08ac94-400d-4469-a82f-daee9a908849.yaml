name: Communication To Ngrok Tunneling Service Initiated
id: 227dd425-21eb-4474-a49e-c6805818c3cf
description: |
  Detects a host initiating a network connection to ngrok tunneling domains (tunnel.us / tunnel.eu / tunnel.ap / tunnel.au / tunnel.sa / tunnel.jp / tunnel.in .ngrok.com). ngrok exposes a local service to the internet through an outbound-initiated tunnel, so the traffic looks like an ordinary egress HTTPS connection while inbound access to an internal port is being brokered. Legitimate use exists (developers and IT staff testing webhooks or previewing local services), but the same capability is used for command-and-control tunneling, proxying/bridging, exfiltration staging, and retrieval of second-stage payloads. Determine which process opened the tunnel, whether it is authorized, what local service is exposed, and whether data staging or additional downloads accompanied the connection.
type: detection
detection_id: 1d08ac94-400d-4469-a82f-daee9a908849
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination, port, and direction match the ngrok tunnel domains this rule detects, and which process initiated the connection?
  context: Confirm the alert by reviewing the destination hostname or resolved IP, the destination port, the connection direction, and the initiating process against the rule's ngrok tunnel domains. DNS resolution is recorded as a separate event, so this connection record often shows only the destination IP with the hostname field empty; corroborate the ngrok domain through the DNS lookup for this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
- question: Which process on this host resolved an ngrok tunnel domain, and is that process expected to reach external services?
  context: The connection event may be network-level telemetry with no process fields, so the DNS lookup is often the most reliable way to attribute the tunnel to a process. A process image that has no business making outbound connections (an Office application, a script host, a renamed or unsigned binary) resolving an ngrok domain is more concerning than the ngrok client itself. Compare the resolving image against its expected on-disk location and role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
          - tunnel.us.ngrok.com
          - tunnel.eu.ngrok.com
          - tunnel.ap.ngrok.com
          - tunnel.au.ngrok.com
          - tunnel.sa.ngrok.com
          - tunnel.jp.ngrok.com
          - tunnel.in.ngrok.com
      condition: selection
    fields:
      - QueryName
      - Image
      - User
- question: Is this user and host expected to run tunneling software like ngrok?
  context: Legitimate tunnel usage is usually confined to developer workstations or IT test systems and to specific users. A tunnel opened from a server, a general-purpose workstation, or under a user or service account with no development role is far more likely to be unauthorized. If process context is unavailable on the network event, attribute the user through the process identified from the DNS lookup or endpoint telemetry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is ngrok on the organization's approved software list for this host?
  context: Organizations typically sanction a specific set of remote-access and tunneling tools for defined purposes. A tunneling client such as ngrok not on the approved list -- regardless of its commercial legitimacy -- may represent shadow IT or attacker-deployed access. Unauthorized tunneling tools should be reviewed even when the vendor is reputable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved development or support use case explaining this tunnel?
  context: Legitimate ngrok usage usually correlates with an active support ticket, a scheduled test, or a documented development task. If no such context exists for this host and time, the tunnel may have been established by an attacker for persistent inbound access or by a user circumventing perimeter controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint and port is the tunnel connecting to, and what local service does it expose?
  context: An ngrok tunnel brokers inbound access to a local port through an outbound connection to ngrok edge infrastructure. The destination confirms whether traffic reaches ngrok's service or a custom relay, while the local port being forwarded (visible in the client command line) reveals what internal service is exposed -- RDP, SSH, a web admin panel, or an SMB share are the highest-impact cases.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What do resolution history and threat intel reveal about the ngrok endpoint this host reached?
  context: ngrok tunnel domains are fixed, low-entropy subdomains that resolve to shared ngrok edge infrastructure, so the resolved IP is not itself attributable and domain-generation/entropy analysis does not apply here. Focus instead on whether this specific tunnel identity or destination IP has known-abuse reporting, when the host first resolved it, and whether the certificate and port profile match ngrok's expected service.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What tunnel configuration did the initiating process set up? Decode its command line and config.
  context: The tunnel client's command line reveals the operational intent -- which local port is forwarded, the protocol (http, tcp, tls), the region, and any auth token or config-file reference. A tcp tunnel forwarding 3389 or 22 exposes remote access; an http tunnel forwarding an internal web app exposes that app. Options may also be read from a config file rather than the command line, so absence of flags does not mean absence of configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the tunnel client, and is that parent chain expected?
  context: The parent process shows how the tunnel was launched. An interactive shell started by a developer differs sharply from a tunnel client spawned by an Office application, a script host (wscript, mshta, powershell), or a service -- the latter parents point to exploitation or a malicious loader rather than sanctioned use. Walk further up the tree if the immediate parent is itself unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other connections were made to this destination or by this process, and do they look like a persistent tunnel?
  context: A single connection is rarely the whole story. Repeated or long-lived connections to the same destination, or a steady low-volume keepalive pattern, indicate an established tunnel rather than a one-off lookup. Check the ports and processes involved and whether the same process reached additional external destinations, which may reveal proxying or multi-stage activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What files or directories did the tunnel process read or collect on this host?
  context: Tunneling to an external service is frequently paired with local collection -- specific file types, sensitive shares, or broad wildcards indicating bulk staging. The files the initiating process touched determine the severity of potential data loss and which business units may need notification. This pivots on the process attributed to the tunnel; if the alert carried no process fields, identify it first from the DNS or endpoint attribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where was collected or archived data written, and was outbound volume consistent with an upload?
  context: Data staging typically involves writing an archive or export locally, then moving it out. Check for archive or export files created by the tunnel process, then correlate the same host and window for a sustained outbound transfer through the tunnel -- a high outbound-to-inbound ratio over a short period points to exfiltration rather than interactive use.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
- question: What files or payloads were written by the tunnel process on this host?
  context: A tunnel can be used to pull second-stage payloads as readily as to push data out. Check for file-creation events tied to the process that opened the tunnel; multiple distinct payloads point to staged delivery or a multi-stage operation. Pair this with the tunnel-configuration findings to distinguish an inbound-exposure tunnel from a download channel.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally communicate with this destination?
  context: First-time connections to a destination carry more weight than routine communication. A zero or very low historical count for this destination on this host indicates newly introduced tunnel infrastructure rather than established, sanctioned traffic.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Do other hosts in the environment communicate with this destination?
  context: If only one host reaches this destination, it is more likely a targeted or user-specific tunnel. If many hosts reach it, the pattern may reflect a sanctioned service in wide use or a broader compromise. The spread across hosts and the ports involved inform the scope of the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Process activity in the minutes around the tunnel connection reveals what led to it and what followed -- reconnaissance, credential access, staging, or persistence -- and whether the tunnel is one step in a larger sequence. Novel parent-child process pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the stages that preceded the tunnel and help reconstruct the timeline. A tunnel that follows staging or credential-access alerts is a stronger exfiltration or command-and-control signal than one that appears alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
