name: Potential COLDSTEEL Persistence Service DLL Load
id: 0121c153-e1bc-44ec-968c-6c0ec25a8054
description: |
  Detects an svchost.exe process loading a DLL named newdev.dll from a user's AppData\Roaming directory — the service-DLL path and name COLDSTEEL uses for its service-based persistence. Legitimate Windows service DLLs load from system directories (System32, well-known program paths), so a service host resolving a module out of a roaming user profile is anomalous by location alone. Investigate the loaded module's signature and hash, identify which service registration pointed svchost at the DLL, and check for the RAT's follow-on behavior — a spawned cmd.exe used for interactive command execution and outbound C2.
type: detection
detection_id: 1d7a57da-02e0-4f7f-92b1-c7b486ccfed5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the process that loaded it against the rule's criteria — an svchost.exe process loading newdev.dll from AppData\Roaming. The library event carries the module's signing status and hash directly, so a valid Microsoft signature versus an unsigned or invalid one is visible on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to have a service host load a module from a user's AppData\Roaming directory?
  context: Service DLLs on a healthy system resolve from System32 or vendor program directories, never from a per-user roaming profile. Knowing whether any legitimate software on this host stages a service module under AppData is often the fastest way to separate a broken or portable install from an attacker-registered persistence service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is newdev.dll still on disk at the AppData\Roaming path for analysis?
  context: Preserving the module enables hash lookups, sandbox submission, and static review. Because a service host loads the DLL rather than writing it, the file was dropped by an earlier installer process — correlate file activity for the loading process and its children to locate the write, then pivot to whatever process created the file if it is not captured here.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other modules did this svchost instance load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: The full set of modules a process resolves tells the story when the DLL name alone is opaque. Look for additional DLLs loaded from AppData, ProgramData, %TEMP%, or Public; unsigned modules where signed ones are expected; and system DLL names resolved from non-system paths (search-order hijacking). A single AppData load alongside otherwise-normal System32 modules narrows the operator's staging directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is newdev.dll's signing status, hash, and threat-intel reputation?
  context: Module reputation separates a relocated legitimate DLL from a side-loaded RAT payload. An unsigned module carrying a Microsoft-style filename, or one whose signature is Invalid or Distrusted, is a strong masquerading signal. Pivot the module's hash against threat intelligence — COLDSTEEL service DLLs have known-bad hashes, and a match confirms the RAT loader outright.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Which service is this svchost instance hosting, and what command line launched it?
  context: svchost runs services grouped by its -k parameter, and the -s value names the specific service. COLDSTEEL persists by registering a Windows service whose ServiceDll points at the AppData module, so the launching command line identifies the service group and name. Use it to pivot to the service registration and confirm whether it is a known Windows service or an attacker-created one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process launched this svchost instance, and is it services.exe as expected?
  context: A service-hosting svchost.exe is legitimately started only by services.exe. An svchost parented by anything else — or a binary named svchost.exe running from a non-System32 path — points to masquerading or a hijacked service launch rather than a genuine Windows service host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has newdev.dll been loaded on this host before, and by which processes?
  context: A first-time module load is a stronger anomaly than a recurring one. If newdev.dll has never resolved on this host in the trailing window, or has only ever been loaded by processes other than a service host, the current load is anomalous. A long history of the same DLL loaded by the same process binary would instead suggest an established, if unusual, local install.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously loaded a service DLL matching this pattern, what programs and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how this specific svchost-to-AppData-DLL pattern has historically run here, not generic svchost usage. A new acting program process, an unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \svchost.exe
        ImageLoaded|endswith: \AppData\Roaming\newdev.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did this svchost instance spawn — particularly cmd.exe or rundll32.exe?
  context: A service host should rarely spawn interactive children. COLDSTEEL creates a new cmd.exe process for interactive command execution and uses rundll32.exe to hinder detection, so a command interpreter or rundll32 child under this svchost is a direct indicator of the RAT's command-and-control workflow rather than benign service activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this svchost instance or its child processes make outbound network connections after the DLL load?
  context: COLDSTEEL communicates with its operator over new outbound connections, typically HTTPS on ports such as 443 and 8443, and drives command execution through a spawned cmd.exe. Egress from a service host or its command-interpreter child to an external address shortly after the module load corroborates active C2. Note the destination addresses and ports for reputation lookup and blocking.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the load time surfaces what preceded the persistence install and what followed it — reconnaissance, credential access, or additional payload staging. Novel parent-child pairs stand out at low counts against the high-count repetitive telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — public-facing application exploitation, discovery, or defense tampering — may reveal the stages that preceded this persistence install and help reconstruct the intrusion timeline. Service-DLL persistence is usually installed after an initial foothold rather than as the first observed activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts loaded a service DLL matching this pattern in the past week, and does the distribution look like automation or targeted activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this svchost-to-AppData-DLL pattern rather than generic svchost usage. Several unrelated hosts loading the same named module points to a spreading persistence deployment; a single host or a small cluster points to targeted operator activity. Use the host distribution to calibrate scope and response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \svchost.exe
        ImageLoaded|endswith: \AppData\Roaming\newdev.dll
      condition: selection
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single foothold. Alongside a service-DLL persistence, operators commonly stack backup mechanisms — scheduled tasks, additional services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence-tool executions clustered in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. A payload dropped into a Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures these drops even when the operator avoids standard persistence tooling, revealing persistence that parallels the detected service DLL.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
