name: CVE-2023-22518 Exploitation Attempt - Suspicious Confluence Child Process (Windows)
id: 800ef393-67de-4906-b788-e6e169a407a5
description: |
  Detects a Confluence Tomcat service process (tomcat8.exe, tomcat9.exe, or tomcat10.exe whose command line contains
  "confluence") spawning a Windows command interpreter — cmd.exe or powershell.exe, matched either by image name or by
  OriginalFileName. Both conditions must hold for the rule to fire. CVE-2023-22518 is an improper authorization flaw in
  Confluence Data Center and Server that lets an unauthenticated request reach the setup-restore endpoints; a web
  application server spawning an interpreter is the post-exploitation stage where attacker-supplied input becomes command
  execution on the host. Confluence itself has no routine reason to launch a shell, so the investigation should determine
  what the interpreter ran, whether the request that drove it can be found in web access logs, whether the instance is
  patched, and whether the execution led to payload download, persistence, or outbound callback.
type: detection
detection_id: 1ddaa9a4-eb0b-4398-a9fe-7b018f9e23db
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event really show a Confluence Tomcat parent spawning cmd.exe or powershell.exe?
  context: >-
    Confirm both halves of the detection before spending time on it: the parent Image ends in tomcat8.exe, tomcat9.exe or
    tomcat10.exe with "confluence" in its command line, and the child is cmd.exe or powershell.exe by image name or by
    OriginalFileName. A renamed interpreter matches on OriginalFileName only, which is itself worth noting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this host a Confluence server, and is the account that ran the interpreter the expected Confluence service account?
  context: >-
    A Confluence application server has a narrow, well-known function. The interpreter normally inherits the Tomcat service
    account, so an interactive or administrative account here points to a different origin than exploitation, while the
    service account running a shell points back to the application. Asset inventory and the service configuration answer
    both halves.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    Is the Confluence Tomcat process expected to spawn a command interpreter, and what started Tomcat itself?
  context: >-
    Confluence serves web requests and does not need a shell for normal operation, so this parent-child pairing is the core
    signal. Tracing Tomcat's own origin separates a service-control-manager start (the normal case, meaning the shell came
    from request handling) from an operator-launched instance. Some deployments do run approved children of the app server
    — build or integration helpers, for example — so establish the allowed child list for this instance before treating the
    pairing as novel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: >-
    What web request drove Confluence to execute a command interpreter?
  context: >-
    Exploitation of this flaw is a single unauthenticated HTTP POST to the setup-restore endpoints
    (/json/setup-restore.action, /json/setup-restore-local.action, /json/setup-restore-progress.action) carrying the
    X-Atlassian-Token: no-check header and a multipart upload. Pull the Confluence and any fronting proxy access logs for
    the minutes before the spawn and look for those paths, the source IP, and other exploit-like request patterns —
    traversal sequences, template-injection markers, serialized-Java prefixes — plus any error-rate spike (a burst of
    4xx/5xx from one client, on the order of more than five in five minutes) that indicates probing before the successful
    request. The source IP is the perimeter-blocking artifact; the ParentCommandLine confirms which Confluence instance
    handled it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: >-
    Is this Confluence instance patched against CVE-2023-22518, and is it reachable from the internet?
  context: >-
    All Confluence Data Center and Server versions before the fixed releases are affected, and the flaw needs no
    authentication. An unpatched, internet-reachable instance makes successful exploitation the leading explanation for the
    spawn and puts every other instance at the same version at equal risk. The parent image identifies which installation
    to check its version against.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: >-
    What other child processes did this same Confluence Tomcat instance spawn?
  context: >-
    Hands-on-keyboard use of a web shell or command-execution primitive rarely stops at one command. Siblings of the
    alerting interpreter under the same Tomcat instance show whether the exploitation ran reconnaissance, account creation,
    archiving, or transfer utilities. If ParentProcessGuid resolves to NODATA, the host scope alone still bounds the result
    to this server.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Were other Confluence servers hit by the same exploitation attempt?
  context: >-
    Internet-facing Confluence instances are enumerable in bulk, and exploitation of this flaw has been driven by
    opportunistic scanning rather than targeting. The same rule firing on other hosts identifies every server that reached
    the command-execution stage and needs the same investigation and patching.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: >-
    What did the alerting command line actually do, and was it encoded or obfuscated?
  context: >-
    Post-exploitation commands driven through this endpoint are typically encoded PowerShell — flags such as -exec bypass,
    -nop and -enc carrying a base64 payload — or a cmd.exe /c wrapper around one. Decode the base64 and read the resulting
    script end to end: the pattern to expect is a download cradle that retrieves a remote payload, writes it under the
    executing profile's %TEMP% as an executable, and runs it. Record the source URL or IP and the dropped path; both are
    the pivot for the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script PowerShell actually executed, which is ground truth when the command line
    is base64-encoded. On a server the volume is low, so any 4104 around the alert is worth reading in full. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran, and decode the encoded payload from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: >-
    Were PowerShell security controls bypassed or weakened on this host before the execution?
  context: >-
    Payloads delivered through this endpoint commonly launch with -exec bypass and -nop so the script runs regardless of
    execution policy, and AMSI patching or a downgrade to version 2 removes the logging that would record the script.
    Finding these argument patterns on the host in the preceding hour ties the alerting spawn to a prepared execution
    chain rather than an isolated command. The tunable here is which argument patterns matter in this environment; the list
    below is the common set.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    Did the Confluence Tomcat process load any modules from outside its own installation directory?
  context: >-
    Exploitation of a public-facing application can end in a loaded module rather than a spawned process — an uploaded
    class or native library that gives the attacker a resident command-execution primitive inside the app server. A
    process-only view misses that half of the pattern. Modules loaded by the Tomcat process that are unsigned, signed by an
    unexpected party, or living outside the Confluence installation tree are the ones to pull apart; if the host does not
    ship module-load telemetry, treat an empty result as a visibility gap.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did cmd.exe or powershell.exe on this host open outbound connections around the alert?
  context: >-
    The stage after command execution is retrieval of the real payload or a callback to attacker infrastructure, and a
    download cradle run through the interpreter produces an egress connection from cmd.exe or powershell.exe rather than
    from the app server. Neither binary has a routine reason to talk to the internet from a Confluence host, so any
    external destination here should be resolved against the URL or address recovered by decoding the alerting command
    line.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \cmd.exe
          - \powershell.exe
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- always_include: true
  question: >-
    Has this account previously produced this Confluence-spawns-interpreter pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is its 90-day history of this
    exact pattern rather than generic interpreter use, grouped by host. An account with no prior history of Tomcat spawning
    a shell is the deviation worth chasing; a service account with a long steady history points to an in-house integration
    that runs commands through Confluence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \tomcat8.exe
        - \tomcat9.exe
        - \tomcat10.exe
        ParentCommandLine|contains: confluence
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this Confluence parent historically driven this pattern on this host or across the environment, or is it new?
  context: >-
    The alert fires under the Tomcat service account, so user identity attributes nothing — the launch mechanism does. The
    query mirrors the rule's selection structure scoped to the alerting parent process, giving the 90-day history of this
    parent driving this specific pattern. A parent with no prior history of spawning interpreters makes exploitation the
    leading explanation; a parent already accounting for a steady prior count points to a deployment where Confluence runs
    commands by design.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \tomcat8.exe
        - \tomcat9.exe
        - \tomcat10.exe
        ParentCommandLine|contains: confluence
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    What else did this account do across the environment around the time of the alert?
  context: >-
    If the account is an interactive or administrative identity rather than the Tomcat service principal, its activity on
    other hosts in the same window shows whether the interpreter run was one step of a wider operation. Under a service
    principal this returns broad agent and OS telemetry, in which case the parent-driven fleet view is the meaningful
    answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same Confluence-driven pattern fire on other hosts in the same window, or is it isolated to this server?
  context: >-
    Under a service principal, an identity pivot returns agent-telemetry noise, so the useful question is whether the same
    launch mechanism fired elsewhere. The query mirrors the rule's selection structure scoped to the alerting parent
    process, fleet-wide, in the alert window. Several Confluence servers producing the pattern at once points to
    opportunistic scanning working through a target list; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \tomcat8.exe
        - \tomcat9.exe
        - \tomcat10.exe
        ParentCommandLine|contains: confluence
      selection_child:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: >-
    What other process activity occurred on this server around the time of the alert?
  context: >-
    A Confluence server runs a narrow and repetitive process mix, so the parent-child pairs that appear only once or twice
    in the window stand out against the aggregated background. This is where the stages that follow command execution show
    up — payload execution from a temporary directory, archiving utilities, service or account manipulation. Correlating
    across the request, the spawn, and any egress within roughly a fifteen-minute horizon is what ties the stages into one
    chain.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: >-
    Did other detections fire on this server in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this spawn in a sequence — scanning or probing of the application,
    defense tampering, or credential access before it. On an exploited application server the preceding alerts often mark
    where the request handling first turned into execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
