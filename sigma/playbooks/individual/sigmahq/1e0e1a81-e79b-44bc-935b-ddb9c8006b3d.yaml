name: Potential Script Proxy Execution Via CL_Mutexverifiers.ps1
id: 00dc400c-340a-464b-80b8-e5d3e77f2c20
description: |
  Detects powershell.exe (or pwsh.exe) spawning a child powershell.exe with the command line ' -nologo -windowstyle minimized -file ' AND a file argument located under \AppData\Local\Temp\ or \Windows\Temp\. This launch pattern matches the proxy-execution behavior of the Microsoft-signed CL_Mutexverifiers.ps1 diagnostic script, which exposes a runAfterCancelProcess function that launches an arbitrary file. The signed-script lineage lets an actor run untrusted payloads under the cover of a trusted parent, so the investigation centers on what the proxied script does, where the Temp file came from, and whether the parent-child powershell chain is expected for this user and host.
type: detection
detection_id: 1e0e1a81-e79b-44bc-935b-ddb9c8006b3d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did powershell spawn a child powershell with the minimized -file launch and a Temp-path script argument?
  context: Confirm the alert is a true positive by checking the triggering event has a powershell.exe/pwsh.exe parent, a powershell.exe child, the ' -nologo -windowstyle minimized -file ' command-line fragment, and a file argument under \AppData\Local\Temp\ or \Windows\Temp\. All of these must be present together for the rule to fire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the parent powershell expected to spawn a child powershell this way, and what started the parent?
  context: The parent-child powershell relationship is the core signal here. Tracing the parent's own origin (grandparent process) shows whether the chain is a legitimate diagnostic or script-host workflow or whether something like a macro, scheduled task, or remote shell launched the parent that then proxied the Temp script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to run nested powershell diagnostic scripts from Temp?
  context: Legitimate diagnostic and IT-automation workflows can launch signed PowerShell scripts from Temp. Knowing whether this user role and host function routinely run nested powershell that loads scripts from Temp is often the fastest way to separate routine activity from proxy-execution abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the proxied Temp script and its full command line do? Decode every argument and the -file path.
  context: The full command line names the exact .ps1 file under Temp that the child powershell loads. Read the file path, any additional arguments, and the script contents to determine whether it is a benign diagnostic routine or a download cradle, loader, or reverse shell. The CommandLine filter scopes this to the minimized -file launch pattern rather than all powershell on the host, which is too common to enumerate.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \powershell.exe
        CommandLine|contains: ' -nologo -windowstyle minimized -file '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the proxied script or its command line encoded or obfuscated, and what does it decode to?
  context: Proxy-execution payloads frequently hide intent with base64 (-EncodedCommand / -enc), string concatenation, backtick escaping, or variable substitution. Decoding reveals the real payload — download cradles, reverse shells, or in-memory loading of .NET assemblies. If the launched .ps1 is itself plain text, inspect the script body for IEX, Net.WebClient, Invoke-WebRequest, or Reflection.Assembly::Load patterns.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When and by what process was the proxied .ps1 file written into the Temp directory?
  context: System script proxy execution depends on a script file being staged on disk first. Identifying which process wrote the .ps1 under \AppData\Local\Temp\ or \Windows\Temp\, and when, shows whether the file is a legitimate diagnostic artifact or was dropped by a download, archive extraction, or another stage shortly before execution. A signed parent launching an unsigned or freshly written Temp script is the signed-to-unsigned transition this technique relies on.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \AppData\Local\Temp\
          - \Windows\Temp\
        TargetFilename|endswith: .ps1
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did PowerShell script block logging capture the deobfuscated content of the proxied script?
  context: Script block logging records the deobfuscated script content PowerShell actually executes, even when the command line or file is encoded or obfuscated. This is ground truth for what the proxied Temp script ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Proxy execution through a signed script often follows steps that weaken PowerShell defenses — AMSI bypass (patching amsi.dll in memory), execution-policy changes, constrained language mode escape, or a downgrade to PowerShell v2 which lacks logging. Finding these precursor events strengthens the case that the Temp-script launch is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other child processes did the same parent powershell instance spawn?
  context: If the parent powershell proxied one script, it may have spawned additional children — reconnaissance, credential access, or follow-on stages. Examining siblings of the exact parent instance reveals the full scope of activity orchestrated through this chain.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally see powershell spawning a child powershell?
  context: A powershell process launching another powershell is an unusual lineage outside of specific automation. Historical frequency of this parent-child pairing on this host distinguishes a routine diagnostic or build workflow from a novel nested-powershell chain worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is this nested-powershell spawning pattern occurring on other hosts?
  context: The same powershell-spawns-powershell pairing appearing across multiple hosts may indicate a pushed automation rollout or a multi-host operation rather than an isolated event. A single occurrence is more likely targeted. Enterprise-wide comparison helps calibrate scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \powershell.exe
        CommandLine|contains: ' -nologo -windowstyle minimized -file '
      selection_temp:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \powershell.exe
        CommandLine|contains: ' -nologo -windowstyle minimized -file '
      selection_temp:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar nested-powershell activity on multiple hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pwsh:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \powershell.exe
        CommandLine|contains: ' -nologo -windowstyle minimized -file '
      selection_temp:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence activity near the nested-powershell launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the proxied-script execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
