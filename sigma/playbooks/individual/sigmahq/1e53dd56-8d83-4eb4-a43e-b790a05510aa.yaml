name: Always Install Elevated MSI Spawned Cmd And Powershell
id: 7f3c0e2a-4d61-4a2e-9b8c-2e9a6c1d5b04
description: |
  Detects a Windows Installer temporary binary running from C:\Windows\Installer\
  (an MSIxxxx.tmp custom-action host launched by msiexec.exe) spawning cmd.exe,
  powershell.exe, or pwsh.exe. This is the execution artifact of AlwaysInstallElevated
  abuse: when the AlwaysInstallElevated policy is enabled in the registry, any user can
  install an MSI that runs its custom actions as SYSTEM, so an installer temp binary
  spawning a command interpreter yields an interactive high-integrity shell from a
  standard-user starting point. The rule fires when the parent Image path contains both
  \Windows\Installer\ and "msi" and ends in tmp, AND the child Image ends in cmd.exe,
  powershell.exe, or pwsh.exe (or carries the matching OriginalFileName). The
  investigation should confirm the parent-child pair and integrity level, decode what the
  shell did, check for the AlwaysInstallElevated policy keys that enable the bypass, and
  determine what was performed with the elevated privileges that followed.
type: detection
detection_id: 1e53dd56-8d83-4eb4-a43e-b790a05510aa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alert match the rule — an installer temp binary under \Windows\Installer\ spawning cmd, powershell, or pwsh?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when the parent Image path contains both \Windows\Installer\ and "msi"
    and ends in tmp (an MSIxxxx.tmp custom-action host) AND the child Image ends in cmd.exe,
    powershell.exe, or pwsh.exe, or carries the matching OriginalFileName. Both conditions
    must hold together. Verify the parent path and the child binary against the alert, and
    note the integrity level — a high-integrity shell launched this way is the
    AlwaysInstallElevated payload, while a legitimate installer rarely needs an interactive
    interpreter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to install MSI packages that launch command interpreters?
  context: Legitimate software installs occasionally spawn a shell for a post-install step, so
    a build server or a workstation belonging to an administrator who routinely installs
    packages is less concerning than the same pattern under a standard user with no
    install-related duties. Knowing the account's role and whether the host's function
    involves software packaging is often the fastest way to separate a true positive from
    routine deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What started the installer temp binary that spawned this shell, and was a real installation underway?
  context: The parent-child relationship is the core signal. The parent is a transient
    MSIxxxx.tmp custom-action host that msiexec.exe extracts into C:\Windows\Installer\ while
    processing a package. Tracing what started it — and whether msiexec.exe was invoked
    against a specific MSI by a user, a deployment tool, or an unexpected process — shows
    whether a genuine installation ran or whether a crafted package was used purely to obtain
    an elevated shell. Note the parent command line and the package path if present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same installer temp binary spawn?
  context: If this installer temp binary launched the detected shell, it may have launched
    other children too. Multiple children from the same parent instance points to deliberate
    orchestration staged through one elevated package — reconnaissance, credential access, or
    persistence — rather than a single benign post-install step. The query scopes to the
    exact parent instance and falls back to host scope where the parent identifier is
    unavailable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did the spawned shell do? Decode its command line and working directory.
  context: The full command line of the spawned cmd, powershell, or pwsh reveals what the
    elevated package actually ran — a post-install configuration step, or a download cradle,
    persistence write, or credential-access command running at high integrity. Decode any
    flags, encoded content, file paths, or URLs, and note the working directory. The query is
    scoped to the exact triggering process so the high baseline volume of cmd and powershell
    on the host does not drown the result.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: When the spawned interpreter is powershell.exe or pwsh.exe, an elevated package
    frequently hides its real action behind -EncodedCommand (-enc), string concatenation,
    backtick escaping, or variable substitution. Base64-encoded commands are the most common
    form. Decoding reveals the actual payload — download cradles, reverse shells, or in-memory
    execution of .NET assemblies — run here at high integrity courtesy of the installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: Script block logging records the deobfuscated script content PowerShell actually
    executes, even when the command line is encoded or obfuscated, giving ground truth about
    what ran in the elevated context. If PowerShell operational logs are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran, and
    decode any -EncodedCommand payload from the alerting command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Is the AlwaysInstallElevated policy enabled in the registry on this host?
  context: This bypass works only when the AlwaysInstallElevated value is set to 1 under both
    HKCU and HKLM \SOFTWARE\Policies\Microsoft\Windows\Installer. With both set, msiexec runs
    any package's custom actions as SYSTEM, which is what lets an installer temp binary spawn
    an elevated shell. A registry-set event records the policy write directly, including
    writes made programmatically that a process-creation view would miss. Confirm whether the
    policy is enabled and when it was set — a write shortly before the alert points to
    deliberate setup.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Policies\Microsoft\Windows\Installer\AlwaysInstallElevated'
          - '\Microsoft\Windows\Installer\AlwaysInstallElevated'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the AlwaysInstallElevated policy written through reg.exe, cmd, or PowerShell before the alert?
  context: When the policy is set through a command-line tool rather than programmatically,
    the process-creation view captures the exact command that enabled the bypass. Look in the
    minutes before the elevation for reg.exe, cmd, or PowerShell writing AlwaysInstallElevated
    under the Windows Installer policy keys. Finding the write confirms the mechanism and
    attributes the setup to a specific process and user; this complements the registry-set
    view, which also catches programmatic writes.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'AlwaysInstallElevated'
          - 'Policies\Microsoft\Windows\Installer'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What action was performed with elevated privileges after the shell launched?
  context: The elevated shell is a means to an end — operators use the high-integrity context
    to install persistence, dump credentials, tamper with security tools, or reach protected
    resources. Examine processes spawned at High or System integrity in the window after the
    alert; the detection analytics call for correlating the elevation with follow-on activity
    within a tight window (on the order of tens of seconds is a common tuning) to separate the
    operator's objective from unrelated administrative work.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were other privilege-escalation or UAC-bypass detections raised on this host around the same time?
  context: Operators who try one elevation path often try several until one works, especially
    when configuration blocks a given technique. Multiple bypass or escalation alerts in rapid
    succession from the same host or user confirms deliberate privilege-escalation activity
    rather than a one-off false positive from a routine install.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Has an installer temp binary spawned a command interpreter on this host before?
  context: An installer temp binary spawning cmd or powershell is rare in normal operation —
    most MSI packages complete without launching an interactive interpreter. Because each
    MSIxxxx.tmp name is transient, prior history of this exact pair on the host is itself
    informative. Zero or very low counts confirm a novel spawning relationship, while a
    non-trivial history would point to a recurring deployment tool worth understanding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_parent:
        ParentImage|contains|all:
        - \Windows\Installer\
        - msi
        ParentImage|endswith: tmp
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_parent:
        ParentImage|contains|all:
        - \Windows\Installer\
        - msi
        ParentImage|endswith: tmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user triggered
    similar installer-driven elevation elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - Cmd.Exe
        - PowerShell.EXE
        - pwsh.dll
      selection_parent:
        ParentImage|contains|all:
        - \Windows\Installer\
        - msi
        ParentImage|endswith: tmp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the elevation and what followed — reconnaissance, persistence, or further
    escalation. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
