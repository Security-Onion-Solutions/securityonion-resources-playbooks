name: Arbitrary File Download Via Squirrel.EXE
id: 8313ab1b-a129-4fdc-a9c1-ebe8776fc010
description: |
  Detects squirrel.exe or update.exe running with a download-style switch (--download, --update, or --updateRollback=) and an http URL on the command line. Squirrel is the standard updater shipped inside many Electron applications (Teams, Slack, Discord, and others); because the binary is signed and runs in user context, its download/update switches act as a system-binary proxy-execution primitive that fetches a remote NuGet package or arbitrary file without admin rights. The rule fires only when the binary name, a download switch, AND an http URL are all present, so investigation should confirm the command line, identify the remote URL, and determine whether the fetched payload was staged or executed.
type: detection
detection_id: 1e75c1cc-c5d4-42aa-ac3d-91b0b68b3b4c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — squirrel.exe or update.exe with a download switch and an http URL?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires all three conditions together — the binary name ends in squirrel.exe or update.exe, the command line contains one of --download, --update, or --updateRollback=, and the command line contains an http URL. Read the exact command line and confirm the remote URL is present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to update Electron applications via the command line?
  context: Squirrel-based updaters normally run unattended from the per-user application folder, not invoked by hand with an explicit http URL. Knowing whether this user routinely launches application updaters manually, and whether the host runs the application that ships this updater, is often the fastest way to separate a routine update from operator-driven abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What remote URL and switch did this invocation use? Decode the full command line.
  context: The full command line reveals the remote endpoint the binary was told to contact and which proxy primitive was used. --download retrieves a RELEASES manifest and the referenced package without running it; --update and --updateRollback= retrieve and install the package, executing whatever it bundles. Extract the http URL, note whether it points at an internal update host or an unfamiliar external domain, and record the exact switch so the disposition reflects whether the payload was merely fetched or also executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: http
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this updater, and is that parent chain expected?
  context: A genuine updater is normally launched by the application's main binary, by explorer.exe for a user action, or by a service. An unexpected parent — a shell, a script host, an Office application, or another tool that has no reason to invoke an Electron updater — points to the binary being driven as a proxy rather than performing a real update.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What outbound connections did this binary make, and is the remote endpoint an internal update host or an unfamiliar external destination?
  context: The download switches turn this signed binary into an ingress primitive — it contacts the URL on the command line, reads a RELEASES manifest, and pulls the referenced package. Correlate the connections made by this process against the URL decoded from the command line. Connections to a known internal or vendor update host are consistent with a real update; connections to an unfamiliar external IP or domain shift the disposition toward remote payload retrieval. If the destination is a recognized enterprise update endpoint it can be treated as expected.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did this binary spawn afterward?
  context: Beyond downloading, the same updater family can proxy execution — staging a payload next to the legitimate application binaries and launching it so the updater becomes the parent process, which defeats parent/child detections that expect the application's main binary. Unexpected children such as cmd.exe, powershell.exe, or an executable running from a per-user application folder indicate the fetched package was executed rather than merely staged.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What file did this updater write to disk, and where did it land?
  context: A Squirrel/Update.exe --update or --download writes a file to disk — the update
    package in the benign case, or an attacker-supplied payload in the abuse case. The
    command-line URL alone does not show what actually arrived, so this surfaces the files the
    updater and any child it spawned wrote around the alert, recovering the real path (and, where
    available, hash) of the artifact. A write under the application's own AppData\Local\<app>
    tree is routine; a write to a temp, public, or otherwise unexpected directory is the signal to
    pull the file for hash lookup and content analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this host normally run this updater binary?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Squirrel updaters do run periodically on hosts with the parent application installed, so a moderate recurring count is expected; zero or very low historical counts indicate first-time or rare execution on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even a routine updater can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific download-switch pattern has historically run here — not generic updater usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_download_cli:
        CommandLine|contains:
        - ' --download '
        - ' --update '
        - ' --updateRollback='
      selection_download_http_keyword:
        CommandLine|contains: http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: Proxy-execution and download primitives are rarely used alone. Activity surrounding this event may reveal reconnaissance, payload staging, privilege escalation, or persistence that provides broader context for whether this update was benign or part of a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_download_cli:
        CommandLine|contains:
        - ' --download '
        - ' --update '
        - ' --updateRollback='
      selection_download_http_keyword:
        CommandLine|contains: http
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_download_cli:
        CommandLine|contains:
        - ' --download '
        - ' --update '
        - ' --updateRollback='
      selection_download_http_keyword:
        CommandLine|contains: http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar updater or proxy activity on several hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_download_cli:
        CommandLine|contains:
        - ' --download '
        - ' --update '
        - ' --updateRollback='
      selection_download_http_keyword:
        CommandLine|contains: http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this download-switch firing pattern — not generic updater usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \squirrel.exe
        - \update.exe
      selection_download_cli:
        CommandLine|contains:
        - ' --download '
        - ' --update '
        - ' --updateRollback='
      selection_download_http_keyword:
        CommandLine|contains: http
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
