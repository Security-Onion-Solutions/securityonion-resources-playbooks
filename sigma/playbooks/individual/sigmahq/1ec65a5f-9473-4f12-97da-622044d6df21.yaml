name: Powershell Defender Disable Scan Feature
id: 4248ad77-bdb4-4898-a364-fb7fb0fa0089
description: |
  Detects PowerShell invocations that disable Microsoft Defender scan and protection features. The rule fires when a command line either contains a Defender preference cmdlet (Add-MpPreference or Set-MpPreference) together with a Disable* flag and an enabling value, OR contains the base64-encoded form of those same Disable* options. Disabling real-time monitoring, behavior monitoring, IOAV protection, archive scanning, or block-at-first-seen is a common precursor that operators run to blind Defender before dropping or detonating a payload, but the same cmdlets are also used by legitimate administrators and management tooling. Investigation should confirm which protection features were turned off, whether the change was authorized, and what ran on the host afterward.
type: detection
detection_id: 1ec65a5f-9473-4f12-97da-622044d6df21
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line either invoke a Defender preference cmdlet with a Disable flag, or contain the encoded form of those options?
  context: Confirm the alert is a true positive before investing time. The rule fires when the command line matches any one of several branches — a plaintext Add-MpPreference / Set-MpPreference cmdlet paired with a Disable* option and an enabling value, OR a base64-encoded fragment of a Disable* option. Read the exact command line and note which branch fired, because a plaintext cmdlet is directly readable while an encoded match means the operative content is base64 and must be decoded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to change Defender protection settings?
  context: Legitimate administrators, endpoint-management tooling, and build/test automation do adjust Defender preferences. Knowing whether this user's role and this host's function include Defender configuration is often the fastest way to separate routine administration from an operator weakening protection ahead of a payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which specific Defender protection features were disabled in this command?
  context: Different flags have different impact. DisableRealtimeMonitoring and DisableIOAVProtection remove on-access scanning; DisableBehaviorMonitoring blinds behavioral detection; DisableArchiveScanning lets malware hide in archives; DisableBlockAtFirstSeen and DisableCatchupFullScan/DisableCatchupQuickScan weaken cloud and scheduled coverage. Read the command line and enumerate every Disable* option set to $true (or 1) to gauge how much of Defender was turned off.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: The rule's encoded branches match base64 fragments of the Disable* options, so the operative content may be wrapped in -EncodedCommand or assembled through concatenation and backtick escaping. Decode any base64 or deobfuscate the string to recover the full Defender preference changes and any additional cmdlets chained into the same line — download cradles or in-memory loaders frequently ride alongside the protection-disabling call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually executed, even when the command line is encoded. This provides ground truth about the full set of Defender preference changes and any surrounding logic. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: Operators commonly pair Defender disabling with other PowerShell defense evasion — AMSI patching, execution-policy bypass, or a downgrade to PowerShell v2 that lacks logging. Finding these alongside the Defender changes strengthens the case that this was a deliberate evasion step rather than a routine preference edit.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent reveals how the Defender change was invoked. Interactive administration usually descends from explorer.exe or a console session; management tooling descends from a service or agent. Unusual parents such as office applications, mshta.exe, wscript.exe, or an unsigned binary point to macro execution or operator tooling rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were the same Defender features disabled directly through the registry on this host around the alert?
  context: The Defender preference cmdlets write registry values under the Windows Defender policy keys, and operators frequently set those values directly with reg.exe to avoid the PowerShell layer entirely. A reg.exe write naming DisableAntiSpyware, DisableRealtimeMonitoring, or a Real-Time Protection / SpyNet value in the same window indicates the same defensive impairment was applied through a parallel mechanism this rule does not see.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
          - 'Windows Defender'
          - 'DisableAntiSpyware'
          - 'DisableAntiVirus'
          - 'DisableRealtimeMonitoring'
          - 'DisableBehaviorMonitoring'
          - 'DisableIOAVProtection'
          - 'DisableOnAccessProtection'
          - 'DisableBlockAtFirstSeen'
      condition: selection and selection_reg
    fields:
      - CommandLine
      - User
- question: Is Defender currently restored, or is real-time protection still disabled on this host?
  context: The disabling may have been temporary (scoped to one action) or persistent. Confirm the current state of the affected Defender features through the endpoint console or direct host inspection. If real-time monitoring or behavior monitoring is still off, the protection should be restored before deeper investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after Defender protection was disabled?
  context: Protection is disabled for a reason — to run a payload, dump credentials, or perform actions that would otherwise be blocked or logged. Examining what executed in the window immediately after the Defender change reveals what the operator wanted hidden. Process creation that begins right after the protection drop points to the activity the tampering was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who disables one control often disables several — turning off Defender, clearing event logs, deleting shadow copies, and stopping security services together to maximize coverage. Finding additional tampering from the same user or parent process in the surrounding window indicates a broader defense-evasion stage rather than an isolated preference edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: When this host previously fired this Defender-disable pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: Even routine tooling can flip Defender flags. This query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific firing pattern has historically run here — not generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli_cmdlet:
        CommandLine|contains:
        - 'Add-MpPreference '
        - 'Set-MpPreference '
