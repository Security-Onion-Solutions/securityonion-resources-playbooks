  question: Has this program historically driven the LAYOUTS-write pattern here or across the environment, or is
    the program new for this activity?
  context: When the alert fires under a service identity — as it does when the IIS worker itself writes the file — user
    identity does not attribute the behavior; the launch mechanism does. The query mirrors the rule's selection scoped
    to the alerting program, giving the 90-day history of that program driving this specific pattern. A program
    that already accounts for many prior writes is servicing automation; a new or rare program for this pattern is the
    deviation worth chasing.
  range: -90d
