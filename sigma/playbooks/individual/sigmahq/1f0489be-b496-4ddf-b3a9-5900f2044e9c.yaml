  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the account's activity across all hosts in the alert window reveals whether this write is isolated or
    part of movement across multiple systems. If the same account drove similar activity on other SharePoint servers, the
    scope of compromise is larger. When the alert fired under a machine or service identity this view returns broad agent
    and service noise — the parent-driven cross-host view is the meaningful companion read.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
