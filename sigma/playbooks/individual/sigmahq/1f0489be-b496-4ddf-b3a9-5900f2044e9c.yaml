name: Suspicious File Write to SharePoint Layouts Directory
id: de3da2a5-8a0b-4d63-ac87-7fa3d8f6c712
description: |
  Detects one of a small set of shells or the IIS worker process (cmd.exe, powershell.exe, powershell_ise.exe,
  pwsh.exe, or w3wp.exe) writing a web-servable or script file (.aspx, .ashx, .asmx, .asp, .ps1, .bat, .hta, and
  similar) into the SharePoint Web Server Extensions LAYOUTS directory (the \15\ or \16\TEMPLATE\LAYOUTS\ hive).
  All of these conditions must hold together for the rule to fire. Because LAYOUTS content is served and executed
  by IIS, a file placed there can be requested and run remotely, which is the mechanism of a web shell dropped
  during post-exploitation of a public-facing SharePoint server (associated with the on-premises RCE and
  authentication-bypass chain CVE-2025-49704, CVE-2025-49706, CVE-2025-53770, CVE-2025-53771). Legitimate writes
  come from SharePoint solution or feature deployment and patching; the investigation should determine whether
  this write is a valid deployment or an attacker staging code that executes attacker-supplied commands or
  harvests ASP.NET key material.
type: detection
detection_id: 1f0489be-b496-4ddf-b3a9-5900f2044e9c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path, web-servable extension, and writing process match what this rule detects?
  context: Before investing investigation time, confirm the write landed under the SharePoint Web Server Extensions
    LAYOUTS directory (the \15\ or \16\TEMPLATE\LAYOUTS\ hive), carries a web-servable or script extension (.aspx,
    .ashx, .asmx, .asp, .ps1, .bat, .hta, and similar), and was created by cmd.exe, powershell.exe, powershell_ise.exe,
    pwsh.exe, or w3wp.exe. All three conditions must hold together for the rule to fire; a write to LAYOUTS by an
    unrelated process, or by one of these binaries to a different path, is not this detection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user, host, and process expected to write executable web content into the SharePoint LAYOUTS directory?
  context: The LAYOUTS directory is web-servable, so any script or handler placed there can be requested and executed
    by the IIS worker. Legitimate writes come from SharePoint solution or feature deployment (WSP packages) and
    patching, usually driven by installer or administrative tooling on a SharePoint server; an interactive command
    shell or the IIS worker process writing script files there is not a normal deployment path. When the account is
    a machine or service identity, judge by the host's role and the writing process rather than the user.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What parent process and web request drove the process that wrote this file?
  context: A web shell drop in a public-facing application usually begins with a crafted HTTP request to a vulnerable
    endpoint that causes the server worker to spawn a shell and write the payload. The parent of the writing process
    tells you whether the IIS worker (w3wp.exe) or an interactive session drove the write; when the parent is w3wp.exe,
    correlate the timestamp against the IIS request logs for the originating URL, method, and source address (for the
    SharePoint on-premises RCE chain this is a POST to the ToolPane endpoint under /_layouts/).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this SharePoint server patched against the on-premises RCE and authentication-bypass CVEs?
  context: This write pattern is associated with exploitation of SharePoint on-premises remote code execution and
    authentication-bypass vulnerabilities (CVE-2025-49704, CVE-2025-49706, CVE-2025-53770, CVE-2025-53771). An
    unpatched server confirms the exploitation was possible and flags other similarly unpatched SharePoint servers
    as at risk; a fully patched server shifts the question toward a valid credentialed deployment or a post-patch
    compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Is the written file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A web shell still present in LAYOUTS can be retrieved,
    hashed, and analyzed, and should be collected before removal; a file deleted or renamed shortly after creation
    points to operator cleanup or a stager that wrote and then discarded intermediate content, and shifts focus to
    what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What is the content of the written file — is it a web shell or script payload?
  context: Read the file's actual content from the endpoint or a forensic copy. For an ASPX/ASHX/ASMX handler or a
    script (.ps1, .bat, .hta, .js), look for request-parameter command execution, base64 or otherwise encoded blocks,
    embedded URLs or IP addresses, reflection or assembly-loading calls, and routines that read ASP.NET machine key
    or web.config material. A handler that executes attacker-supplied input, or code that harvests key material to
    forge signed requests, confirms a web shell rather than a benign deployment artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Was the command that wrote this file encoded or obfuscated, and what does it decode to?
  context: The write is frequently performed by a base64-encoded PowerShell command launched from the server worker,
    which decodes to logic that writes the handler into LAYOUTS or dumps configuration files. Decode any -EncodedCommand
    (-enc) payload, backtick or concatenation obfuscation, and download-cradle patterns (Net.WebClient, Invoke-WebRequest,
    Start-BitsTransfer) to recover what the process actually did and any source URL it reached. If the writing process
    is not PowerShell, treat the retrieved command line as the record of how the file was created.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: If the dropped file later executed, what is its hash and does it have known threat-intel detections?
  context: File-creation events carry no hash; the hash is recorded when a file runs as a process. For a dropped script
    or batch file (.ps1, .bat, .cmd, .hta) this query looks for the artifact executing and reads its hash — submit that
    to reputation and threat-intel sources to determine whether it is known malicious, benign, or previously unseen. An
    ASPX/ASHX web shell does not run as a separate process (it is served in-process by the IIS worker), so it will not
    appear here; retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What child processes did the writing process spawn after the file write?
  context: The processes launched by the writer reveal the hands-on-keyboard stage that typically follows a web shell
    drop, such as command shells, discovery utilities (whoami, systeminfo, net, nltest), credential access, or download tooling.
    Children of the IIS worker or of a shell it spawned are a strong indication that attacker-supplied commands are
    executing, not that a deployment finished.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the IIS worker process load any unsigned modules around the alert?
  context: Post-exploitation of a public-facing server often includes loading a malicious module into the web server
    worker — a native or managed IIS backdoor, or a freshly compiled assembly generated from a dropped handler.
    Modules loaded by w3wp.exe that are unsigned, or that load from temporary or user-writable paths, are worth
    reviewing against the baseline set of modules this worker normally loads.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\w3wp.exe'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - edr_console
  - external_threat_intel
  - manual_review
- question: Did this host make outbound connections to external addresses after the file write?
  context: A web shell or the tooling it stages frequently calls out — a reverse proxy or tunnel to command-and-control,
    a download of follow-on payloads, or exfiltration of harvested key material. Reviewing egress connections from this
    host in the hours after the write, and the processes that made them, surfaces command-and-control or staging traffic.
    Resolved hostnames are recorded on separate lookup events, so pivot from any external destination address to confirm
    what domain it belongs to.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
  - edr_console
- question: What other files have been written to the SharePoint LAYOUTS directory recently, and by which processes?
  context: The LAYOUTS directory has a small set of processes that legitimately write there during solution deployment
    and patching. Multiple recently written handlers or scripts — especially several web-servable files created close
    together by a command shell or the IIS worker — are the signature of a staged web shell drop rather than a single
    deployment. Grouping by writing process separates routine installer activity from an unfamiliar writer placing
    several files.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\TEMPLATE\LAYOUTS\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: When this host has previously produced this LAYOUTS-write pattern, what programs and users drove it, and
    does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the program/user distribution reflects how
    this specific write pattern — one of these binaries writing a web-servable file into the SharePoint LAYOUTS hive —
    has historically occurred here, not generic use of the binaries. A writing program new to this pattern, an unexpected
    account, or a first-ever occurrence is the deviation worth chasing; a steady history driven by a known deployment
    account points toward routine servicing. File events lack parent lineage — pivot to the writer's start event if the
    launch chain matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        TargetFilename|startswith:
        - C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\
        - C:\Program Files (x86)\Common Files\Microsoft Shared\Web Server Extensions\
        TargetFilename|contains:
        - \15\TEMPLATE\LAYOUTS\
        - \16\TEMPLATE\LAYOUTS\
        TargetFilename|endswith:
        - .asax
        - .ascx
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cmd
        - .cer
        - .config
        - .hta
        - .js
        - .jsp
        - .jspx
        - .php
        - .ps1
        - .vbs
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: Have other hosts produced this LAYOUTS-write pattern in the past week, and does the distribution look like
    automation or targeted activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific write
    pattern rather than generic binary usage. The same pattern appearing across many SharePoint servers in a short window
    points to a coordinated exploitation sweep or a pushed deployment; a single server or a small unrelated set points to
    a host-local trigger. Use the host distribution to judge how widely to expand the investigation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        TargetFilename|startswith:
        - C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\
        - C:\Program Files (x86)\Common Files\Microsoft Shared\Web Server Extensions\
        TargetFilename|contains:
        - \15\TEMPLATE\LAYOUTS\
        - \16\TEMPLATE\LAYOUTS\
        TargetFilename|endswith:
        - .asax
        - .ascx
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cmd
        - .cer
        - .config
        - .hta
        - .js
        - .jsp
        - .jspx
        - .php
        - .ps1
        - .vbs
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this LAYOUTS-write pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving their 90-day history of this specific
    write pattern aggregated by host, not generic use of these binaries. A user who has never produced this pattern is
    more notable than one who does so during routine servicing; weigh the count against whether the account is a
    SharePoint administrator or deployment identity. If the alert fired under a machine or service account, this pivot
    is less meaningful — the parent-process history is the better read.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        TargetFilename|startswith:
        - C:\Program Files\Common Files\Microsoft Shared\Web Server Extensions\
        - C:\Program Files (x86)\Common Files\Microsoft Shared\Web Server Extensions\
        TargetFilename|contains:
        - \15\TEMPLATE\LAYOUTS\
        - \16\TEMPLATE\LAYOUTS\
        TargetFilename|endswith:
        - .asax
        - .ascx
        - .ashx
        - .asmx
        - .asp
        - .aspx
        - .bat
        - .cmd
        - .cer
        - .config
        - .hta
        - .js
        - .jsp
        - .jspx
        - .php
        - .ps1
        - .vbs
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
