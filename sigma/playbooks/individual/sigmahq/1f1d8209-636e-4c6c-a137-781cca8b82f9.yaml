name: WFP Filter Added via Registry
id: 90d5dcdb-fbb9-4616-aa98-699310311932
description: |
  This detection fires when a registry value is written under the Base Filtering Engine (BFE) persistent-filter policy path (\BFE\Parameters\Policy\Persistent\Filter\) by a process other than svchost.exe. Windows Filtering Platform (WFP) filters persisted through this key survive reboot and can silently block outbound network traffic for a specific application; adversaries abuse this to cut off endpoint security agents from their management consoles while leaving the agent process running, suppressing telemetry without terminating protection.
  Legitimate WFP filter persistence is normally written by svchost.exe hosting the BFE service, so a non-svchost writer here indicates either an administrative firewall-management action or defense-evasion tampering. The investigation should determine which process wrote the filter, what application it targets, whether it persists, and whether security-tool network reporting was interrupted.
type: detection
detection_id: 1f1d8209-636e-4c6c-a137-781cca8b82f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match a WFP persistent-filter write?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path (TargetObject) against the Base Filtering Engine persistent-filter policy path the rule detects. A genuine match is a value written under \BFE\Parameters\Policy\Persistent\Filter\ by a process that is not svchost.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write Windows Filtering Platform filter policy?
  context: Legitimate WFP filter persistence is written by the BFE service under svchost.exe; direct writes from an interactive user or an unusual process are uncommon outside of firewall-management or security tooling. Knowing whether this user role and host function normally manage filtering-platform policy is often the fastest way to separate an administrative change from tampering. User attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was a WFP persistent-filter policy value written, and which process wrote it?
  context: The BFE persistent-filter policy path stores Windows Filtering Platform filters that persist across reboots. A write here that does not originate from svchost.exe hosting the BFE service points at an out-of-band tool creating a persistent network-block rule. Record the exact key, the value data, and the writing process image to judge whether this is a security-critical service key being modified by an unexpected binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What filter value data was written to this key, and which application does it target?
  context: WFP filter definitions are stored as a binary blob rather than readable text, so the value data may render as an opaque byte array or be absent from the event. When the data is not human-readable, identify the blocked application by enumerating the live filter on the host (its provider, weight, and application-id condition) and by examining the writing process. A maximum-weight persistent block filter whose application-id maps to a security-agent executable is the signature of endpoint-telemetry suppression.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What security control did the writing process target — decode its full command line.
  context: The writing process image and command line reveal how the filter was created and what it was meant to block. A tool that enumerates running security-agent processes and adds an outbound-block filter for each is targeting endpoint detection network reporting; a specific application path passed on the command line names the exact executable being cut off. This query pivots from the registry event to the writing process by ProcessGuid to recover its command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which processes normally write WFP persistent filters here, and is this writer one of them?
  context: Legitimate WFP filter persistence is written by svchost.exe hosting the Base Filtering Engine, which the rule already excludes, so the alerting writer is a non-svchost process by construction. Aggregating persistent-filter writes across the environment by writing process shows whether this image is a recognized firewall-management or administrative tool or a first-seen, renamed, or user-path binary. Maintain an allowlist of authorized administrative tools so routine firewall management does not repeatedly surface here.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: '\BFE\Parameters\Policy\Persistent\Filter\'
      condition: selection
    fields:
      - Image
      - host.name
- question: What process spawned the process that wrote the filter, and is that chain expected?
  context: The parent process reveals how the writing tool was launched. A firewall-management action typically descends from an administrative shell or management agent, while a filter-writing tool launched by a scripting host, an Office application, or an unknown binary points at hands-on-keyboard tampering. If the parent linkage is not recorded on the registry event, reconstruct lineage from the writing process's own creation event instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does the WFP filter persist, and was the same key modified again afterward?
  context: WFP filters persisted through this policy key survive agent restarts and host reboots unless explicitly removed, so a single write establishes a durable network block. Registry key and value deletions are not observable on this telemetry, so removal of the filter cannot be confirmed directly; instead judge persistence from whether the same key was written again over a longer window (a rewrite or an updated filter) and from whether the blocked application's activity remained suppressed. Treat the filter as still active until a firewall-platform inspection on the host confirms otherwise.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the targeted security control still blocked, or has network reporting been restored?
  context: The block may be temporary or persistent. Checking the current state of the targeted control reveals whether the host remains blinded. If the security agent still cannot reach its management infrastructure, the filter should be removed and the control restored before continuing the investigation. Confirm current status by inspecting the live filter set on the host and the agent's connectivity rather than from log history alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: After the filter was written, which processes still had outbound connections from this host?
  context: A WFP block filter suppresses outbound traffic for the targeted application while leaving other egress intact, so a successful block shows up as the security agent going quiet on its management channel while other processes continue to connect out. Reviewing outbound connections in the window after the write helps confirm whether the targeted agent's egress stopped and whether new or unusual outbound activity appeared under the resulting visibility gap. If the affected agent's network events are themselves the ones being suppressed, treat their absence as corroboration rather than as an all-clear.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What activity occurred on this host after the filter was written?
  context: Network-layer defense evasion is usually a setup step for actions the operator does not want reported — malware execution, credential access, or lateral movement carried out while the agent is blinded. Examining process activity immediately after the write reveals what the block was meant to hide or enable. A quiet management channel followed by new process creation in that window points to the activity the tampering was protecting.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other registry keys modified on this host in the same session?
  context: An operator who writes one filtering-platform block often makes several related changes — additional persistent filters for other agents, firewall-policy edits, or service configuration changes. Reviewing all registry modifications on the host in a short window, grouped by key path and writing process, reveals whether multiple blocks or configuration changes landed together as part of one hands-on session. If registry volume is high, narrow to the alerting writer's process or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: Operators who block one control often disable several — stopping services, clearing logs, deleting recovery data, or changing firewall configuration to widen the same visibility gap. Finding additional tampering commands from the same user or parent process indicates a coordinated effort to reduce defensive coverage rather than an isolated change. The netsh advfirewall path in particular is a common command-line route to the same network-blocking objective this rule detects.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other process-based persistence mechanisms installed on this host?
  context: After blinding a security agent, operators commonly install backup footholds using different techniques — scheduled tasks, services, registry Run keys, or BITS jobs — so that access survives even if the block is discovered and removed. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this WFP filter key been written before on this host?
  context: A persistent-filter policy value that has never been written on this host before is more suspicious than a key that changes as part of routine firewall management. Zero history indicates a first-time write, which for a security-critical filtering-platform key raises the priority. Compare the historical value data to see whether the same filter is being re-established or whether this is a new block.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this WFP filter key written on other hosts in the environment?
  context: The same persistent-filter write across multiple hosts may indicate a management-driven rollout or a spreading tool blinding agents fleet-wide; a single-host write is more consistent with a targeted action. Comparing the writing process and value data across hosts distinguishes centrally managed firewall policy from ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other processes ran on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the write collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts — the discovery tooling, scripting host, or delivery binary that accompanied the filter write. This process view complements the registry-side view of what else changed in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, process discovery, credential access, or other defense-evasion activity — may reveal the attack stages that preceded the filter write and help reconstruct the timeline. Network-layer agent blinding is frequently a mid-chain step taken to protect subsequent actions, so preceding alerts often name the objective.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
