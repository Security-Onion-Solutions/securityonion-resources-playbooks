name: Adwind RAT / JRAT
id: d419718a-65bc-47ab-8765-a877bd21c58a
description: |
  Detects command lines associated with the Adwind / JRAT Java-based remote access tool: either a Java
  executable invoked from a private runtime copied under \AppData\Roaming\Oracle, or cscript.exe running a
  "Retrive" VBS helper script. This family ships as a JAR that copies a Java runtime into the user's roaming
  profile, re-launches itself with javaw.exe -jar from a random user directory, drops VBS helpers that
  enumerate installed security products through WMI, and writes a Run key for persistence. Because javaw.exe
  and java.exe have heavy legitimate enterprise use, the rule keys on the command-line combination rather
  than the binary name; the investigation should confirm which of the two patterns fired, decode the full
  command line, identify the JAR or script the process was told to run, and determine whether persistence or
  further stages followed.
type: detection
detection_id: 1fac1481-2dbc-48b2-9096-753c49b4ec71
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line match either pattern this rule detects: a Java executable run from
    \AppData\Roaming\Oracle, or cscript.exe running a "Retrive" .vbs script?
  context: >-
    Confirm the alert before investing investigation time. Read the exact command line and note which of the
    two branches fired: the Oracle-under-AppData branch means a Java runtime is being executed from the
    user's roaming profile rather than Program Files, while the cscript/Retrive branch means a VBS helper is
    being run by the script host. The branch determines where the rest of the investigation goes — the Java
    branch points at the JAR passed to -jar, the VBS branch points at the dropped script and what it
    enumerates.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run Java from the roaming profile or execute VBS helper scripts?
  context: >-
    Legitimate Java deployments install under Program Files and are launched by an installer, a shortcut, or
    a service, not from \AppData\Roaming\Oracle. Some developer workstations and vendor tools do ship private
    JREs into user directories, so check whether the user's role and the host's function account for a
    per-user Java runtime or for routine script-host activity before treating the execution as unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this command do? Decode the arguments and identify the JAR, class, or script it was told to run.
  context: >-
    The full command line names the payload. For the Java branch, the argument after -jar is the archive the
    runtime executes and the path it lives in is usually a random directory under the user profile; -cp or a
    bare class name points at loose .class files staged in a temporary directory. For the VBS branch, the
    argument after cscript.exe is the script path. This query returns every matching invocation on the host
    inside the alert window, because the family issues several in sequence and they form one logical
    operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the command line, script, or payload encoded or obfuscated? What does it decode to, and what operation does the decoded content perform?
  context: >-
    Java-based RAT loaders lean on layered obfuscation rather than base64 command lines: the JAR itself is
    usually packed and its class names randomized, and the VBS helpers build strings with Chr() chains and
    concatenation so the WMI queries they issue are not readable at a glance. Reconstruct any Chr() or
    string-concatenation sequence in the script to recover the command it forms, and note random-looking
    directory and file names in the command line — they are generated per infection and are not meaningful
    strings to search for. Detonating the JAR or reading the script in a safe environment recovers the
    operation the loader performs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this execution and is that parent chain expected?
  context: >-
    The parent reveals how the execution was reached. A script host or Office application spawning the Java
    runtime points at document- or script-borne delivery, cmd.exe wrapping cscript.exe matches the loader's
    own helper-launch pattern, and explorer.exe points at a user double-clicking a JAR delivered as an
    attachment. A parent of services.exe or a scheduler suggests an already-installed persistence entry
    rather than first execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this execution spawn afterward?
  context: >-
    The children show what the loader actually did. This family spawns cmd.exe wrappers around cscript.exe to
    run dropped VBS helpers, attrib.exe to hide its staging directory, xcopy.exe to clone a Java runtime into
    the roaming profile, reg.exe to write a Run key, and WMIC to enumerate signed drivers. Any of those under
    this parent moves the investigation from execution to persistence and host reconnaissance.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which scripting-engine or Java runtime modules did the alerting process load, and were they loaded from a system directory or a user-writable path?
  context: >-
    Module loads distinguish a script host that is actually interpreting VBScript (vbscript.dll, scrrun.dll,
    wshom.ocx) from one that was only started, and they show where the Java runtime backing this process
    lives: jvm.dll or java.dll loaded from under the user profile means the process is running a private
    runtime copy rather than an installed one. Check the signer and path of each module. If module-load
    telemetry is not collected on this host, treat zero results as a visibility gap rather than evidence
    nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|contains:
          - \vbscript.dll
          - \scrrun.dll
          - \wshom.ocx
          - \jscript.dll
          - \jvm.dll
          - \java.dll
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What script files did the Windows script hosts run on this host around the alert, and which directories do those scripts live in?
  context: >-
    Scripts run by cscript.exe or wscript.exe from a temporary directory, the user's download folder, the
    roaming profile, or a UNC path are staged rather than deployed; scripts under Program Files or a
    management agent's directory usually belong to software. This family drops a series of similarly named
    .vbs helpers into the temporary directory and runs each one through cmd /C cscript.exe, so several
    executions of short-lived scripts from one directory is the pattern to look for.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \cscript.exe
          - \wscript.exe
        CommandLine|contains:
          - .vbs
          - .vbe
          - .js
          - .jse
          - .wsf
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - CurrentDirectory
- question: Has this host previously run commands referencing the Roaming\Oracle Java directory or "Retrive" scripts?
  context: >-
    This counts near misses as well as exact rule matches over 90 days, so a host with an established history
    of Java running from the roaming profile stands apart from one where the directory appears for the first
    time today. Zero or very low counts point at first-time staging. Weigh the result against which accounts
    produced the earlier events.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - \AppData\Roaming\Oracle
          - Retrive
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution
    reflects how this specific command-line pattern has run here rather than generic Java usage. A new parent
    process, an unexpected account, or an empty history are the deviations worth chasing; a steady history
    under one parent points at a per-user Java deployment that should be tuned out.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is their 90-day
    history of this specific pattern across hosts rather than generic Java usage. A developer or an engineer
    who works with private JREs may have a long history; an account with none, or one that suddenly produces
    the pattern on several hosts, is the case to pursue. Weigh the count against the account's role and usual
    toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven the rule's pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal or a machine account, user identity does not attribute the
    behavior and the launch mechanism is the meaningful pivot. This query mirrors the rule's selection
    structure scoped to the alerting parent, giving the 90-day history of that parent driving this pattern. A
    parent that already accounts for a large volume of prior events is a deployment mechanism; a parent that
    has never driven it before is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same identity
    produced staging or execution activity on more than one endpoint. Loader activity concentrated on a
    single host is a contained infection; the same account driving script hosts or Java runtimes on several
    hosts widens the scope. If the alert fired under SYSTEM or a machine account, this returns routine agent
    telemetry and the parent-driven view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent telemetry from
    every host. The query mirrors the rule's selection structure scoped to the alerting parent, fleet-wide,
    inside the alert window. Several hosts at once points at scheduled or pushed automation; a single host
    points at a host-local trigger such as a user opening a delivered archive.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating parent/child pairs on the host in the alert window collapses routine telemetry into
    high-count rows and leaves novel pairs standing out at low counts. Look for reg.exe or a scheduler
    writing persistence, attrib.exe hiding a directory, xcopy.exe cloning a runtime into the profile, and
    WMIC or script hosts enumerating installed security products — the stages that surround this execution
    and establish whether it is timing, delivery, or the tail of an installed infection.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this command-line pattern rather than the fleet's generic Java footprint. Many hosts firing the same
    pattern points at a packaged deployment that ships a per-user runtime and should be tuned out; one host
    or a small unrelated set points at delivery to individual users. Use the host distribution to calibrate
    how far the investigation reaches.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - \AppData\Roaming\Oracle
        - \java
        - '.exe '
      - CommandLine|contains|all:
        - cscript.exe
        - Retrive
        - '.vbs '
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections reconstruct how the host reached this point. Archive or script delivery, script hosts
    spawned by mail or browser processes, WMI-based enumeration of security products, and Run-key writes all
    commonly precede or accompany this execution. An alert timeline that starts with a user opening a
    delivered file establishes delivery; one with no precursors suggests the loader was already installed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
