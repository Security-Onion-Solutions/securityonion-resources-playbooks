name: Potential CCleanerDU.DLL Sideloading
id: 5d9a15d8-eb12-4957-a2e3-b32c6628cef7
description: |
  Detects a module named CCleanerDU.dll being loaded (ImageLoaded ends with \CCleanerDU.dll)
  by a process that is NOT the legitimate CCleaner.exe or CCleaner64.exe running from the standard
  C:\Program Files\CCleaner\ (or Program Files (x86)) install directory. This pattern is DLL
  sideloading (search-order hijacking): a signed or trusted executable loads an attacker-planted
  DLL of this name from a non-standard location, so the malicious code runs inside a benign process.
  Legitimately, the CCleaner utility loads this component from its own install path (which the rule
  filters out). Investigation should confirm which process loaded the DLL, where the DLL and the
  loading process live on disk, the DLL's signature and hash, and what the loading process did next
  (additional module loads, outbound connections, persistence).
type: detection
detection_id: 1fbc0671-5596-4e17-8682-f020a0b995dc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it against the rule's detection criteria. The
    rule fires only when a module ending in CCleanerDU.dll is loaded by a process that is not
    CCleaner.exe or CCleaner64.exe under the standard CCleaner install directory. DLL loads carry a
    hash and signing status directly on the load event, so most of this can be answered from the
    alert itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the application that loaded this DLL?
  context: >-
    Legitimate activity can trigger this detection if a real CCleaner-related tool is installed in a
    non-standard path. Knowing whether the user role and host function are consistent with running
    this utility (or any process that would legitimately load a DLL of this name) is often the
    fastest path to distinguishing a true positive from a benign relocated install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Does the user or administrator recall installing or running the application tied to this DLL load?
  context: >-
    Direct confirmation from the person behind the account is often the fastest legitimacy check. If
    the user does not recall installing or launching a CCleaner-related tool, and no maintenance was
    underway, the load is more consistent with an attacker-staged binary running under the user's
    session. If they do recall it, capture where they obtained it and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this DLL load align with normal work hours and maintenance windows?
  context: >-
    Legitimate software installs and utility runs usually occur during business hours or scheduled
    maintenance. A load of this component at an unusual hour, on a host that has no history of the
    tool, is more suspicious than the same activity during a documented maintenance window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other modules did the loading process pull in, and are any unsigned or from user-writable directories?
  context: >-
    The full set of modules a process loads tells the story when the loading binary itself looks
    trusted. Beyond CCleanerDU.dll, look for additional DLLs loaded from the same non-standard
    directory, unsigned modules where signed ones are expected, and system-DLL names (for example
    wininet.dll) loaded from a non-system path. A sideloaded DLL of this kind commonly maps further
    libraries into memory itself, so a sparse module list on the load event does not rule out
    in-memory library loading.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded CCleanerDU.dll?
  context: >-
    Module reputation separates a genuine third-party DLL from a side-loaded malicious one. A validly
    signed component may still be legitimate, while an unsigned DLL carrying a well-known product name
    with no valid signature is a strong masquerading indicator. SignatureStatus values worth noting
    are Valid, Unsigned, Expired, Distrusted, and Invalid. The Hashes field on the load event gives
    the module hash directly for a threat-intelligence lookup, with no need to pivot to an execution
    event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Where did the loading process run from, and what was its command line?
  context: >-
    Because the rule already excludes CCleaner running from its standard install directory, the
    loading process's own path and working directory are the key signal. A CurrentDirectory or Image
    under C:\Windows\Tasks, a user profile, ProgramData, or another user-writable location indicates
    the binary and its co-located DLL were staged outside the normal install footprint. The command
    line may also reveal how the process was invoked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: >-
    The parent reveals how the loading binary was launched. A trusted utility started by explorer.exe
    or a service manager looks routine, whereas a launch from cmd.exe, a script host, an archive or
    ISO mount, or a copy-then-start sequence points to attacker staging. Walk up the tree to see what
    ultimately initiated the execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Where on disk did this DLL come from, and which process wrote it to that location?
  context: >-
    Search-order sideloading depends on the malicious DLL being planted next to the loading binary
    first. Finding the file-write event for this module path shows which process dropped it and when,
    and whether the writer differs from the process that later loaded it. A short interval between the
    write and the load, or a writer such as a shell, script host, or copy utility, supports staging
    rather than a legitimate install. This addresses the file-write to module-load correlation window
    for this technique.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Did the loading process make outbound network connections after loading the DLL?
  context: >-
    A sideloaded DLL of this kind typically executes its own code inside the trusted process and then
    initiates outbound communication to retrieve a next stage or beacon to remote infrastructure.
    Outbound connections from the loading process, especially to external addresses shortly after the
    load, indicate the payload ran and reached out. Process-anchored network results land on the
    endpoint-collected subset of connection telemetry.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has a DLL of this name been loaded on this host before, and by which processes?
  context: >-
    A first-time load on a host is a stronger anomaly than a recurring one. If the same module has
    been loaded repeatedly by the same binary over the past 90 days, this load is probably routine
    software behavior. If this is the first occurrence, or the module has only been loaded by
    different processes historically, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is a DLL of this name being loaded on other hosts, and by which processes?
  context: >-
    Cross-host correlation surfaces how widely the module is present. A load on a single host may be a
    localized incident, while the same module loaded across multiple hosts points to broader
    distribution or shared staging. Pay attention to the variety of loading processes: a module loaded
    only by its expected application is benign, whereas the same name loaded by unexpected processes on
    other hosts suggests multi-host activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity in a tight window around the load
    reveals what led to it (staging, copy operations, archive or ISO handling) and what followed
    (child processes, reconnaissance, additional persistence). Novel parent-child pairs stand out at
    low counts while routine agent telemetry collapses into high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that loaded the DLL?
  context: >-
    A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero
    or very low historical counts for the loading process indicate a first-time or rare execution,
    consistent with a staged tool rather than installed software with a usage history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single foothold. After sideloading a DLL into a trusted process, they
    commonly add backup persistence using different techniques such as scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into the Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File-event monitoring captures these drops even when the attacker
    avoids standard persistence tools, and they often accompany a sideloading foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as suspicious downloads, archive or ISO handling,
    script execution, or defense tampering, may reveal the stages that preceded this load and help
    reconstruct the timeline. The alert sequence often tells the fuller story of how the sideloaded
    binary was delivered.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
