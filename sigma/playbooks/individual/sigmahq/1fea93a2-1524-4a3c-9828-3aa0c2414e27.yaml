name: Potential COLDSTEEL Persistence Service DLL Creation
id: 667b7058-aa95-4ec0-a2b8-00f03c8172c7
description: |
  Detects creation of a DLL named newdev.dll under a user's AppData\Roaming directory (path prefix C:\Users\), a filename and location associated with the COLDSTEEL remote access tool's service-based persistence. The file write is the delivery step; the DLL is then typically registered as a Windows service and loaded under svchost.exe, often invoked via rundll32.exe, so the tool runs across reboots. Legitimate software rarely drops a file with this exact name to this path, so the investigation should confirm which process wrote the file, retrieve and hash the DLL, and determine whether a service was registered and the DLL subsequently loaded.
type: detection
detection_id: 1fea93a2-1524-4a3c-9828-3aa0c2414e27
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path and creating process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path, the operation performed (created, deleted, or renamed), and the responsible process against the rule's criteria of newdev.dll written under C:\Users\...\AppData\Roaming\.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have newdev.dll written into an AppData\Roaming path?
  context: Legitimate administrative or software activity can drop files into user profile directories. Knowing whether the account and host function are consistent with a DLL landing at this path is often the fastest way to separate a true positive from routine operations. When the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is newdev.dll still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed, while a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process wrote newdev.dll, and is its parent chain expected?
  context: The file event records the writing process, and its parent reveals how that writer was launched. A drop from an interactive shell, a script host such as wscript.exe or powershell.exe, an Office application, or an unexpected service parent is more suspicious than a drop from a known installer or updater. This delivery step precedes the service registration and DLL load that run the tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the dropped file actually COLDSTEEL's newdev.dll, or a decoy or unrelated file with the same name?
  context: The filename alone is a weak identifier. Retrieve the file and inspect its size, imports, embedded strings, packer signatures, and signing status to confirm whether it is the suspected DLL or an unrelated binary that happens to share the name. Content retrieval is a manual step from the endpoint or an isolated analysis environment, since the file-write event carries no file body.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When newdev.dll was loaded, what was its hash and signing status, and does threat intel flag it?
  context: A DLL's hash and code-signature are recorded on the load event, not on the file-write event. This query looks for the DLL loading and reads its hash and signer; submit the hash to threat intelligence to determine whether it is known malicious, benign, or previously unseen. An unsigned or invalidly signed DLL loaded from a user profile path is a strong deviation from normal system DLL behavior. If the file is present but never loaded, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - SignatureStatus
- question: Was newdev.dll executed after it was written, for example through rundll32.exe or as a service DLL under svchost.exe?
  context: A dropped DLL matters most once something runs it. This tool is typically loaded under svchost.exe as a service DLL or invoked through rundll32.exe with the DLL path on the command line. Command lines on this host that reference the DLL name reveal whether delivery progressed to execution and which process carried it out.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'newdev.dll'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was a service or registry value configured to load newdev.dll for persistence on this host?
  context: This tool persists by registering a Windows service whose ServiceDll or ImagePath points at the dropped DLL, so it is reloaded under svchost.exe on every boot. A registry value whose data references the DLL name is the persistence registration step and confirms the drop was wired for reboot survival rather than a one-off write.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Details|contains: 'newdev.dll'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one persistence DLL often drops or stages several components. The breadth, paths, and extensions of the writer's other file activity distinguish a single artifact from a wider staging operation and enumerate what else needs review. Volume alone is not suspicion for common writers; look at where the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this AppData\Roaming path recently, and by which processes?
  context: A small set of processes legitimately write into a user's Roaming profile. Other recent arrivals in the same directory, and the processes responsible, reveal whether this is an isolated drop or a location under active use, and surface companion artifacts that belong to the same activity. A single unfamiliar writer across several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has newdev.dll been seen at this path on this host before?
  context: A file that has never appeared on a host is more suspicious than one that is part of normal operations. A first-time appearance of this DLL at this path, versus a recurring presence, changes whether this is a new compromise or an already-established foothold being re-triggered.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: This query mirrors the rule's selection scoped to this user, returning the account's 90-day history of this specific drop pattern rather than generic file activity, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Roaming\newdev.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this drop pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior, so the meaningful pivot is the launch mechanism. This query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of that program driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing, while a program already accounting for many prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Roaming\newdev.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope of compromise may be larger. When the alert fires under SYSTEM or a machine account, this view returns agent-telemetry noise, and the parent-driven fleet question is the meaningful companion.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns constant agent noise. The meaningful question is whether the same launch mechanism fired elsewhere. This query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Roaming\newdev.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as exploitation of a public-facing service, defense tampering, or discovery activity, may reveal the stages that preceded this drop and help reconstruct the timeline of how the tool arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the alert?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a service DLL drop, they commonly stack scheduled tasks, additional services, registry Run keys, or BITS jobs using different tooling. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
