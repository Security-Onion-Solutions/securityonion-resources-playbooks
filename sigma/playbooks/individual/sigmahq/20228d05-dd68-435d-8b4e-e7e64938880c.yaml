name: Potential Kapeka Decrypted Backdoor Indicator
id: 5d19c166-79be-4f61-b8b3-5d4597dafe42
description: |
  Detects a file written to disk matching either of two patterns associated with the Kapeka backdoor: a hidden 5 to 6 character
  name with a .wll extension under a Microsoft folder in ProgramData or LocalAppData, OR one of the fixed payload names
  win32log.exe or crdss.exe. The rule fires when EITHER branch matches, so note which one triggered — the .wll form is a DLL
  loaded through rundll32 or a registered service, while the .exe forms run directly. Legitimate add-ins and vendor data
  occasionally land in these paths, so the investigation should confirm the file is a decrypted backdoor payload, identify the
  process that wrote it, and determine whether the payload was subsequently loaded or executed.
type: detection
detection_id: 20228d05-dd68-435d-8b4e-e7e64938880c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file match either Kapeka drop pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact file path and name against the two patterns this rule
    fires on — EITHER a hidden 5 to 6 character name with a .wll extension written under ProgramData or LocalAppData, OR one
    of the fixed names win32log.exe or crdss.exe. Note which branch matched, because the follow-on execution differs. A .wll
    payload is a DLL loaded by rundll32 or a service, while the .exe forms run directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files to ProgramData or LocalAppData?
  context: Legitimate installers and management agents write to these locations, but a randomly named .wll DLL or a win32log.exe
    or crdss.exe payload is not typical. The responsible process on file events is frequently a machine or SYSTEM account, so
    judge by the writing process and host role rather than the user name alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: The payload's post-alert lifecycle drives urgency and next steps. A file still on disk can be retrieved, hashed, and
    analyzed; a file deleted seconds after creation suggests a self-deleting dropper or anti-forensic cleanup and shifts focus
    to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the dropped file actually contain — is it a decrypted backdoor payload rather than a legitimate add-in or log?
  context: The .wll extension poses as a Word add-in and the ProgramData or LocalAppData path poses as vendor data, but the rule
    targets a decrypted backdoor binary. Retrieve the file from disk and inspect imports, embedded strings, packer signatures,
    and signing status. An unsigned PE carrying a .wll extension, or a payload matching known backdoor strings, confirms the
    drop. Content retrieval requires a manual pull from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What was the process that wrote this file doing — decode its full command line and working directory.
  context: The file event names the responsible process but not why it ran. Its command line and working directory reveal whether
    this is a dropper decrypting and writing its payload or a legitimate program. The query returns all executions of that binary
    on this host in a tight window, so a multi-step dropper that runs several commands is visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the payload has executed, what is its hash and does it have known threat-intel or AV detections?
  context: A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash. For the win32log.exe
    or crdss.exe forms this query catches the payload running and reads its process hash — submit it to threat intel to determine
    whether it is known malicious, benign, or previously unseen. The .wll form is a DLL that does not spawn as its own process;
    its hash appears on the DLL load event, or retrieve the file from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was the dropped payload executed or loaded after it was written?
  context: The backdoor runs either as one of the .exe payloads executing directly or as the .wll DLL loaded through rundll32
    or a registered service. This query looks for both — the payload name running as a process, and any process referencing
    the payload name on its command line, which is how a rundll32 or service loader invokes the DLL. Progression from a file
    drop to execution indicates the backdoor is active.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_direct:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      selection_loader:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: 1 of selection_*
    fields:
      - Image
      - CommandLine
      - ProcessGuid
- question: What process spawned the process that wrote this file, and is that parent chain expected?
  context: The parent of the writing process shows how the drop was launched. A payload written by a process descending from
    rundll32, a script host, an Office application, or an unexpected service parent points to malicious delivery, whereas a
    known installer or management-agent chain is more routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: A dropper that writes one payload often stages several — an encrypted blob, the decrypted DLL, a loader, or persistence
    artifacts. The breadth, paths, and extensions of the responsible process's other file activity distinguish a single artifact
    from a full staging sequence and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to these drop locations recently, and by which processes?
  context: Kapeka hides its payload under a Microsoft folder within ProgramData or LocalAppData to blend with vendor data. Other
    recent arrivals in these paths reveal whether this is an isolated drop or a location under active use, and which processes
    are writing there — a single unfamiliar writer across several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - ':\ProgramData\'
        - '\AppData\Local\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this name been seen before on this host?
  context: The payload name is randomly generated per infection (a 5 to 6 character .wll) or a fixed decoy name, so a first-time
    appearance on the host is expected for a genuine drop. A long prior history for this exact name instead points to a legitimate
    recurring file that coincidentally matches the pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is a file with this name present on any other hosts in the environment?
  context: The same payload name appearing on multiple hosts points to distribution or lateral movement; confined to one host,
    the drop may be targeted. Because the generic .wll name is randomized per host, a match elsewhere on the exact name is a
    strong indicator of the same activity rather than coincidence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this drop pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, returning the 90-day history of this user producing the
    drop pattern — not generic file writes — aggregated by host. A user who has never produced it is more suspicious than one
    who does so regularly; weigh any count against whether the account belongs to a person or a service. On file events this
    user is often a machine or SYSTEM account, in which case the parent-process history is the more meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_generic:
        TargetFilename|contains:
        - :\ProgramData\
        - \AppData\Local\
        TargetFilename|re: \\[a-zA-Z]{5,6}\.wll
      selection_specific:
        TargetFilename|endswith:
        - \win32log.exe
        - \crdss.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the writing process's program historically driven this drop pattern, or is the program new for this activity?
  context: When the alert fires under a machine or service account, user identity does not attribute the behavior — the launch
    mechanism does. This query returns the 90-day history of the alerting program driving this specific drop pattern,
    aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts
    for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_generic:
        TargetFilename|contains:
        - :\ProgramData\
        - \AppData\Local\
        TargetFilename|re: \\[a-zA-Z]{5,6}\.wll
      selection_specific:
        TargetFilename|endswith:
        - \win32log.exe
        - \crdss.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the drop is isolated or part of
    broader movement across multiple endpoints. When the alert fires under SYSTEM or a machine account this returns agent-telemetry
    noise, so the parent-driven fleet view is the meaningful companion pivot.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window?
  context: Under a service principal, network-wide user activity is largely agent noise; the meaningful question is whether the
    same launch mechanism dropped the payload elsewhere. This query returns the alerting program driving the drop pattern fleet-wide
    in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_generic:
        TargetFilename|contains:
        - :\ProgramData\
        - \AppData\Local\
        TargetFilename|re: \\[a-zA-Z]{5,6}\.wll
      selection_specific:
        TargetFilename|endswith:
        - \win32log.exe
        - \crdss.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: A payload drop rarely happens alone. Aggregating the host's process activity in a tight window around the alert surfaces
    what led up to the drop and what followed — reconnaissance, privilege escalation, loader execution, or persistence — while
    collapsing repetitive agent telemetry into high-count rows so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages
    that preceded the payload drop and help reconstruct the timeline. A backdoor drop is typically a mid-chain event, so preceding
    alerts often explain how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
