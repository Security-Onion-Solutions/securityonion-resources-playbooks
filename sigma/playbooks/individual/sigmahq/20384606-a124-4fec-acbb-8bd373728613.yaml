name: Suspicious Network Connection Binary No CommandLine
id: 960bd7c9-f6fe-4bbb-af2c-dd3b3c7086fe
description: |
  Detects regsvr32.exe, rundll32.exe, or dllhost.exe initiating an outbound network
  connection while their command line contains only the bare executable path and no
  arguments (the truly empty and null command-line cases are filtered out). These
  Windows binaries normally run with a DLL or COM argument telling them what to load;
  a bare invocation that also beacons outbound is consistent with process hollowing or
  injected code using a signed system binary as a network shell. Determine whether the
  process was legitimately started, what destination it reached, and whether the host
  shows related staging or execution activity around the same time.
type: detection
detection_id: 20384606-a124-4fec-acbb-8bd373728613
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and port match what this rule detects, and which process initiated it?
  context: Confirm the alert by reviewing the exact destination IP and port, the connection
    direction, and the initiating process against the rule's detection criteria. The command
    line should hold only the bare path to regsvr32.exe, rundll32.exe, or dllhost.exe with
    no arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Initiated
  answer_sources:
  - alert
  - network_connection
- question: Is this user and host expected to run regsvr32.exe, rundll32.exe, or dllhost.exe in a way that opens outbound connections?
  context: Legitimate administrative or application activity can trigger this pattern. Knowing
    whether the host role and user account normally drive COM or DLL-host activity that reaches
    external destinations is often the fastest way to separate routine operations from injected
    code beaconing through a signed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What process record backs this connection, and what parent, integrity level, and image hash does it carry?
  context: Because the command line carries no arguments, the process identity is what matters.
    Pull the process_creation record for this exact process to see its parent, integrity level,
    and file hash. A signed system binary launched from an unusual parent, running at an unexpected
    integrity level, or hollowed after start will not reveal itself through the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - IntegrityLevel
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: What is the destination IP, and what do reputation, passive DNS, and registration data reveal about it?
  context: Investigate the destination the process connected to using passive DNS history,
    registration age, hosting, TLS certificate, and threat intelligence. Recently registered
    domains, anonymizing exit nodes, or known malicious infrastructure point to attacker-controlled
    endpoints. The destination hostname is rarely recorded on the connection event, so anchor
    on the IP and pivot to the DNS lookup to recover the name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - DestinationHostname
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What domain resolved to this destination IP on this host before the connection?
  context: The connection event records an IP, not a name. Look at DNS lookups on this host
    that resolved to the same destination address to recover the domain the process actually
    reached. A recently registered or algorithmically generated domain resolving to this IP
    strengthens the case that the endpoint is attacker infrastructure, while no matching lookup
    can mean the process connected to a hard-coded IP, which is itself notable.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        dns.resolved_ip|expand: '%dst_ip%'
      condition: selection
    fields:
      - QueryName
  answer_sources:
  - dns_query
  - external_threat_intel
- question: What process spawned this binary, and is that parent chain expected?
  context: The parent reveals how the binary was launched. regsvr32.exe, rundll32.exe, and
    dllhost.exe are normally started by services.exe, svchost.exe, explorer.exe, or an installer.
    Parents such as an Office application, a script host, or a browser child point to injection
    or a malicious loader. Walk up to the grandparent to see the full launch chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this binary spawn after it started?
  context: A bare-invocation system binary that beacons outbound and then spawns cmd.exe,
    powershell.exe, or other tooling is running follow-on stages. Legitimate COM or DLL-host
    activity rarely spawns interactive shells, so any children here help scope what the injected
    code did next.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally connect to this destination?
  context: First-time connections to a destination are more suspicious than routine traffic.
    A destination this host has never reached, or reached only inside the same window as the
    alert, is more likely new attacker infrastructure than an established business service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
  - dns_query
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. The processes running on the host in the minutes around
    the connection show what led up to it and what followed. Look for a loader that wrote or
    launched the connecting binary, reconnaissance, or credential access nearby.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance,
    a suspicious download, or a LOLBin execution, may reveal the stages that preceded this
    beacon and help reconstruct the timeline. A bare-command-line network connection is often
    a late command-and-control stage that follows earlier execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: When this host has previously fired this pattern, what programs and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the program and user
    distribution reflects how this specific pattern (a bare-command-line system binary beaconing
    outbound) has run here before. A system binary that has not produced this pattern here, an
    unexpected user account, or an unusual cadence is the deviation worth chasing; network events
    lack parent lineage, so pivot to the binary's start event to see what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
        CommandLine|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
      filter_no_cmdline:
        CommandLine: ''
      filter_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired this pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of this exact pattern rather than generic usage of these binaries. Many hosts firing
    the same pattern suggests scripted deployment or vendor automation, while a single host
    or a small unrelated set suggests hands-on-keyboard activity or a targeted infection.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
        CommandLine|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
      filter_no_cmdline:
        CommandLine: ''
      filter_null:
        CommandLine: null
      condition: selection and not 1 of filter*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Actors who abuse one signed binary to run code often reach for several. If regsvr32.exe,
    rundll32.exe, or dllhost.exe was used to proxy execution here, check whether mshta.exe,
    msiexec.exe, installutil.exe, or similar binaries ran nearby. Multiple proxy-execution
    LOLBins converging on the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this binary executed from its expected system path?
  context: regsvr32.exe, rundll32.exe, and dllhost.exe normally live in System32 or SysWOW64.
    The same binary running from a user profile, a temp directory, or under a renamed file
    points to a copied or masqueraded binary placed to evade path-based allowlists. Compare
    the image path and original file name against the expected location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - process_creation
- question: How often has this host fired this bare-command-line beacon pattern over the past 90 days?
  context: A pattern with no prior history on a host is more suspicious than one seen regularly
    under stable conditions. The query mirrors the rule's selection scoped to this host, so
    the count reflects this exact firing pattern rather than generic use of the binaries. The
    command-line projection lets you compare the historical bare invocations against the alerting
    one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
        CommandLine|endswith:
        - \regsvr32.exe
        - \rundll32.exe
        - \dllhost.exe
      filter_no_cmdline:
        CommandLine: ''
      filter_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter*) and _pb_scope
    fields:
    - CommandLine
  answer_sources:
  - process_creation
