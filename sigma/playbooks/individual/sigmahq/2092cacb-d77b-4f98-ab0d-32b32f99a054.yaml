name: Potential Vivaldi_elf.DLL Sideloading
id: 229bcee9-ebbb-40d6-b48d-63ceb4d05743
description: |
  Detects a Windows library load of vivaldi_elf.dll by any process, or from any path, other than the legitimate
  Vivaldi browser loading it out of its own application directory (the rule fires when the load matches AND the
  known-good vivaldi.exe-from-Vivaldi\Application path does NOT match). DLL sideloading places an attacker-controlled
  library where a trusted, signed executable will load it, so the library runs with the host process's legitimacy;
  a vivaldi_elf.dll loaded from outside the canonical Vivaldi\Application directory, or by a process other than
  vivaldi.exe, is a masquerade of that browser component and has been observed acting as a file-hiding evasion module.
  Investigation should confirm the loaded module's path, signature, and hash on the load event, establish whether the
  loading process is a genuine Vivaldi binary, trace where the DLL was written from and by what process, and check for
  follow-on defense evasion (hidden-file registry changes) or additional persistence on the host.
type: detection
detection_id: 2092cacb-d77b-4f98-ab0d-32b32f99a054
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status,
    and the process that loaded it against the rule's criteria. The rule fires on a vivaldi_elf.dll load that is NOT the
    legitimate case of vivaldi.exe loading it from a Vivaldi\Application directory, so note whether the load path sits
    outside that canonical directory or whether the loader is something other than the real Vivaldi browser. Library
    events carry the module's hash and signing status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run the Vivaldi browser and load this module?
  context: >-
    A genuine vivaldi_elf.dll load only occurs on hosts where the Vivaldi browser is installed and run. If Vivaldi is not
    a sanctioned application for this user or host role, a module by that name loading here is far more likely to be a
    sideloaded masquerade than routine browser activity. Confirm whether the user role and host function are consistent
    with a legitimate Vivaldi install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other modules did the process that loaded vivaldi_elf.dll pull in, and are any from user-writable or non-standard directories?
  context: >-
    The full set of modules a process loads exposes a sideloading operation the alerting event alone does not. Look for
    other DLLs loaded from user-writable locations such as AppData, ProgramData, Public, or a temp directory; unsigned
    modules sitting where signed ones are expected; and system DLL names loaded from non-system paths. A cluster of
    non-canonical loads in the same process points to a staged side-load set rather than an isolated event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the loaded vivaldi_elf.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a benign third-party DLL from a sideloaded malicious one. The legitimate browser
    component is vendor-signed; an unsigned module, or one carrying a signature that is expired, distrusted, or invalid,
    is a strong masquerade indicator. The hash on the load event supports a threat-intel lookup that can surface a known
    loader. A HashBaseline of the genuine vivaldi_elf.dll is the direct comparison point for detecting substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: Which process loaded vivaldi_elf.dll, and does it run from the legitimate Vivaldi application directory?
  context: >-
    Sideloading works by having a trusted, signed executable load the planted library, so the identity and location of
    the loading process are decisive. Determine whether the loader is the real vivaldi.exe running from its installed
    Vivaldi\Application path, a renamed or relocated copy of a signed binary staged in a user-writable directory, or an
    unrelated process. A loader running from AppData, ProgramData, Public, or a temp directory rather than the canonical
    install path is the sideloading pattern this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the loader of vivaldi_elf.dll, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the side-load was launched. A genuine browser launch typically traces
    to explorer.exe or a user shell; a loader started by a removable-media launcher, a script host, an archive utility,
    or an unfamiliar dropper points to attacker-driven execution. Walk the parent chain to see what initiated the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote vivaldi_elf.dll to disk, and when relative to the load?
  context: >-
    Sideloading requires the attacker-controlled library to be placed on disk before a trusted binary loads it. Identify
    the process that created the vivaldi_elf.dll file and where it was written. A write by a browser installer or updater
    into the canonical Vivaldi\Application directory is expected; a write by an archive tool, script host, or launcher
    into a user-writable location, shortly before the load, is the plant step of the side-load. The gap between the write
    and the load frames the correlation window for the rest of the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the vivaldi_elf.dll module still on disk for analysis?
  context: >-
    If the sideloaded module is still present, it can be hashed, submitted to a sandbox, or reviewed statically. Checking
    for the file written by the alerting process or its direct children confirms whether the artifact remains available
    or was already removed after execution, which itself is a cleanup signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did activity around this load modify the Explorer hidden-file registry values used to conceal files?
  context: >-
    A vivaldi_elf.dll acting as an evasion module modifies the per-user Explorer Advanced settings that control file
    visibility (the Hidden, HideFileExt, and ShowSuperHidden values) to hide dropped artifacts from the user. These
    values are also toggled legitimately through Folder Options, so weigh the change against the timing of the load and
    the process that made it rather than treating it as malicious on its own.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Explorer\Advanced\Hidden'
          - '\Explorer\Advanced\HideFileExt'
          - '\Explorer\Advanced\ShowSuperHidden'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Has vivaldi_elf.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If the same module has been
    loaded repeatedly by the same genuine Vivaldi binary over the prior 90 days, this load is probably routine. If this
    is the first occurrence, or the module has historically loaded only under different processes, the current load is
    anomalous and consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Is vivaldi_elf.dll being loaded on other hosts, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces how far the activity spread. The same module loaded on a single host may be a
    localized event; the same module loaded across several hosts points to multi-host distribution, such as a
    removable-media or shared-installer vector. Watch the variety of loading processes: a module loaded only by a genuine
    Vivaldi binary is routine, while the same module loaded by unrelated processes elsewhere suggests broader compromise.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is one stage in a chain, and the load event rarely stands alone. Examining process activity in a tight
    window around the load reveals what launched the loader, what the sideloaded module did next, and whether file
    writes, registry changes, and the load line up on the same short timeline. Look for dropper execution, defense
    tampering, and persistence installation in the same interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load. Reconnaissance, execution
    from removable media, or defense tampering ahead of this event helps reconstruct the timeline and shows whether the
    load is an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does the user or administrator recall installing or running the Vivaldi browser on this host?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If the user knowingly
    installed and ran Vivaldi, a load from the genuine install path may be routine. If no one recalls installing Vivaldi,
    or the software is unfamiliar on this host, the module is more likely a sideloaded masquerade riding the browser's
    name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this activity align with normal work hours and expected browser use?
  context: >-
    Legitimate browser installs, updates, and use track a user's normal activity pattern. A vivaldi_elf.dll load on a
    server, an unattended host, or at an hour when the user is not active is harder to explain as routine browsing and
    more consistent with automated execution from a planted side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that survives reboot is often paired with backup persistence. After establishing one foothold, operators
    commonly install additional mechanisms through scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Several persistence installations in the same timeframe indicate intentional stacking rather than an
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File
    monitoring captures these drops even when the operator avoids standard persistence tooling, which is consistent with
    a stealth-focused side-load.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
