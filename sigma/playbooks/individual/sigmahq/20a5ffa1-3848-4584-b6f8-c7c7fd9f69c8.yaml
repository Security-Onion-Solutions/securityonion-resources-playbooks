name: Ruby Inline Command Execution
id: 9e6ef822-707d-41b4-b8a8-f2d644b8fb38
description: |
  Detects ruby.exe (matched by image name or original file name) executing with the inline-code flag ' -e', which runs
  arbitrary Ruby supplied directly on the command line rather than from a script file. Both conditions must be present for
  the rule to fire. Inline Ruby is a common way to launch a reverse shell or run live code without dropping a file to disk;
  it is also used legitimately by developers, build tooling, and packaged Ruby applications. The investigation should
  recover and decode the exact inline expression, establish whether this user and host normally run Ruby this way, and
  determine what the process spawned or connected to afterward.
type: detection
detection_id: 20a5ffa1-3848-4584-b6f8-c7c7fd9f69c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this event match the rule — ruby.exe (by image name or original file name) running with the ' -e' inline-code flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires both conditions
    together. The process must be ruby.exe (identified by either the image name ending in ruby.exe or an original file name
    of ruby.exe) AND the command line must contain ' -e'. Read the full command line and image fields from the triggering
    event to verify both halves are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run inline Ruby code from the command line?
  context: Legitimate inline Ruby ' -e' execution comes from developers, build and packaging tooling, and bundled Ruby
    applications. Knowing whether the user role and host function involve Ruby development or automation is often the fastest
    way to separate routine activity from a hands-on-keyboard reverse-shell attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly does the inline Ruby expression do? Decode the full command line passed after ' -e'.
  context: The inline code supplied after ' -e' is the operation. Decode it for network primitives and shell-spawn behavior
    — a TCPSocket or socket open to a hardcoded IP and port, a require of the socket library, calls that duplicate the socket
    onto standard input/output, or an exec/spawn of cmd.exe or /bin/sh indicate a reverse shell. Benign inline code typically
    performs string manipulation, version checks, or build steps without opening sockets or spawning shells.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ruby.exe and is that parent chain expected?
  context: The parent process reveals how Ruby was invoked. A parent such as a development shell, terminal, or build agent
    fits routine engineering activity; parents such as an Office application, a scripting host, a browser child, or a remote
    services process point to invocation through an exploit, a macro, or a remote operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did ruby.exe spawn afterward?
  context: The processes Ruby launches reveal its actual impact. An inline reverse shell typically execs an interactive
    command shell (cmd.exe) or duplicates the socket and hands control to one; post-exploitation may spawn reconnaissance or
    download tooling. Benign inline Ruby usually spawns nothing or only expected build subprocesses.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this inline-Ruby execution occur inside or outside expected administrative and development time windows?
  context: Interpreter abuse is more suspicious when it runs outside the hours where Ruby development and scheduled build
    automation normally occur. Compare the alert timestamp against this host's historical ruby.exe ' -e' activity to see
    whether the execution falls in a routine window or off-hours. A run that breaks the established time pattern is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      selection_host:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and selection_host
    fields:
      - User
      - ParentImage
- question: Does this host normally run ruby.exe?
  context: A binary that has never appeared on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution of Ruby here, which raises the priority of recovering the inline
    expression; high counts on a developer or build host point toward routine engineering use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even routine developer tooling runs inline Ruby. The query mirrors the rule's selection structure (ruby.exe with
    the ' -e' flag) scoped to this host, so the resulting parent and user distribution reflects how this specific firing
    pattern has historically run here rather than generic Ruby usage. A new parent process, an unexpected user account, or an
    unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar interpreter activity on multiple hosts in this window, the scope of the activity may be
    larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure (ruby.exe with the ' -e' flag) with no host scope, so the result
    is a fleet-wide count of this firing pattern rather than generic Ruby usage. Many hosts firing the same pattern points to
    scripted deployment or build automation; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ruby.exe
      - OriginalFileName: ruby.exe
      selection_cli:
        CommandLine|contains: ' -e'
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this execution, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or data staging surfacing as novel parent-child process pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this execution and help reconstruct the full timeline. Execution of an inline interpreter is often a
    mid-chain step rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
