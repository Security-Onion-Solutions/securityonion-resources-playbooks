name: Suspicious VBScript UN2452 Pattern
id: b6bac094-1bab-49f8-bbaa-be122540a246
description: |
  Detects a command line carrying inline VBScript that combines Execute, CreateObject, RegRead,
  window.close, and a reference to a \Microsoft\Windows\CurrentVersion registry path, while excluding
  command lines that reference the CurrentVersion\Run key. The combination corresponds to a script
  that reads a payload out of a registry value and runs it in the script-host process without writing
  it to disk, with window.close suppressing any visible window; keeping the payload in a CurrentVersion
  subkey other than Run places it outside the registry locations most often reviewed for autostart
  entries. Investigation should identify which registry value the script reads, what data is stored
  there, what launched the script host, whether a second stage was written to disk, and whether an
  autostart entry or scheduled task invokes the script on a recurring basis.
type: detection
detection_id: 20c3f09d-c53d-4e85-8b74-6aa50e2f1b61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting command line contain inline VBScript combining Execute, CreateObject, RegRead,
    window.close, and a \Microsoft\Windows\CurrentVersion registry path?
  context: >-
    Before investing investigation time, confirm the alert by reading the exact command line. All five
    keywords must be present in the same command line, and the rule excludes command lines that
    reference the CurrentVersion\Run key, so the registry path in view should be a CurrentVersion
    subkey other than Run. Note the script-host binary and copy out the full VBScript text for decoding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run inline VBScript that reads data out of the registry and executes it?
  context: >-
    Legitimate administrative activity triggers many detections, but reading a value from the registry
    and executing its contents as code is not a common form for vendor scripts or logon automation.
    Knowing whether the user role and host function involve script-driven configuration work is often
    the fastest path to separating a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this inline VBScript execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling stages payloads in registry values to avoid leaving a file on disk, and the same
    pattern appears during authorized assessments. Check whether a penetration test or red team
    exercise is active on this host or network segment before investing analysis time; an engagement
    whose scope and timing match resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which registry value does the inline VBScript read, and what does it do with the data it retrieves?
  context: >-
    RegRead names the exact key and value the script pulls, and Execute runs the retrieved string as
    code inside the script-host process. Read the full command line to identify the registry path and
    value name, whether the script decodes or decrypts the data before running it, and whether it
    opens a network connection or writes a file. CreateObject names the COM objects the script drives,
    which indicates whether it performs HTTP retrieval, file writes, WMI process creation, or further
    registry access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What launched the script host that ran this VBScript, and what started that parent?
  context: >-
    Inline VBScript reaches a command line through a launcher — mshta.exe, wscript.exe, cscript.exe,
    rundll32.exe, or a scheduled-task host under svchost.exe are the usual carriers. Tracing the
    parent's own origin shows whether the chain begins with a user action, a scheduled task, a
    document or macro, or a remote execution mechanism, which is the difference between an operator
    running this by hand and an installed persistence mechanism firing on schedule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    If the parent that launched this script also launched other processes in the same window, the
    sibling set reveals the wider operation — a download utility, rundll32.exe loading a dropped
    library, or additional script hosts. A parent whose only child is this script is a narrower
    finding than one driving several stages in sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the script-host process write any files to disk after this execution?
  context: >-
    A payload held in a registry value can run entirely in memory, but loaders of this form often
    decode the value and write a second stage before running it. Watch for libraries written under
    system directories or a drivers path, and for misleading extensions such as .sys on a file that
    is loaded by rundll32.exe rather than by the kernel. File writes from this process in the hour
    after execution show whether anything landed on disk and where.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What registry key and value did this process modify, and is that a known persistence or payload-storage location?
  context: >-
    The registry path reveals intent. Registry reads are not recorded in endpoint telemetry, so this
    query surfaces modifications made by the same process — the script writing its payload value,
    updating it, or clearing it after use. Read the value path together with the path visible in the
    command line, then judge the location: Run/RunOnce under CurrentVersion means autostart, while
    another CurrentVersion subkey holding a long string is payload storage rather than a documented
    setting. The signer columns attribute the writing process to a vendor; read them for coherence
    with the key being written, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - process_creation
- question: Were any values under \Microsoft\Windows\CurrentVersion written on this host within 10 minutes of this execution?
  context: >-
    A registry-stored payload has to be written before it can be read, and an autostart entry that
    invokes the script is usually created in the same session. Correlating registry writes under
    \Microsoft\Windows\CurrentVersion with this execution inside a 5-10 minute window links the payload
    write, the autostart entry, and the execution into one sequence. Writes to Run or RunOnce point at
    logon persistence; a long string written to another CurrentVersion subkey is the storage location
    this command line reads from. Registry value deletion is not observable in endpoint telemetry, so
    judge cleanup from re-modification of the same value rather than from its disappearance.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows\CurrentVersion'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - process_creation
- question: Were other registry modifications made through reg.exe or regedit.exe on this host in the same session?
  context: >-
    An operator who stores one payload in the registry commonly makes several changes in the same
    session — writing the payload value, adding an autostart entry, and adjusting security settings.
    Command-line registry edits on this host within half an hour of the alert show whether the activity
    is isolated or part of a set of configuration changes. Changes a script makes through COM do not
    appear here; this covers the reg.exe and regedit.exe path specifically.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this process or its children write the payload to disk, and would it still be there after a reboot?
  context: >-
    A payload that stays in a registry value leaves nothing on disk to collect, but these loaders often
    decode the value and drop a second stage before running it. File writes by the script-host process
    and its children in the minutes after execution show whether a file was created, where it landed,
    and what a scheduled task or autostart entry would run after a reboot. The file-write event carries
    no hash; if the payload is present, hash it from a later execution or retrieve it for a reputation
    lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: When this host has previously produced this VBScript pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution reflects how this specific command-line pattern has run here rather than generic
    script-host usage. A new parent process or an unexpected account against an otherwise steady
    history is the deviation worth chasing; no history at all makes this a first occurrence on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Execute
        - CreateObject
        - RegRead
        - window.close
        - \Microsoft\Windows\CurrentVersion
      filter:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Run
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this VBScript pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is their
    90-day history of this specific pattern aggregated by host rather than generic use of a script
    host. A user who has never produced it is a stronger finding than one who does so regularly;
    weigh the count and the host spread against the user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Execute
        - CreateObject
        - RegRead
        - window.close
        - \Microsoft\Windows\CurrentVersion
      filter:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Run
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven this VBScript pattern here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity does not
    attribute the behavior and the launch mechanism does. The query scopes the rule's selection
    structure to the alerting parent process over 90 days, aggregated by host. A parent that already
    accounts for thousands of prior events is vendor or operating-system automation; a parent that is
    new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Execute
        - CreateObject
        - RegRead
        - window.close
        - \Microsoft\Windows\CurrentVersion
      filter:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Run
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the hour around the alert shows
    whether the same identity was active elsewhere, which widens the scope beyond this host. If the
    alert fired under SYSTEM or a machine account, this view returns routine agent telemetry and the
    parent-driven fleet view is the meaningful pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host.
    The meaningful question is whether the same launch mechanism produced this pattern elsewhere: the
    query scopes the rule's selection structure to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to scheduled or pushed automation; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Execute
        - CreateObject
        - RegRead
        - window.close
        - \Microsoft\Windows\CurrentVersion
      filter:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Run
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Script execution driven from a registry-stored payload sits mid-chain, after initial access and
    after the payload was staged. Earlier detections on the same host — script-host abuse, scheduled
    task creation, remote execution, or credential access — help reconstruct how the script came to
    run and what preceded it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced this VBScript pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this specific command-line pattern rather than generic script-host usage. Many hosts
    producing it points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate how far the
    investigation has to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Execute
        - CreateObject
        - RegRead
        - window.close
        - \Microsoft\Windows\CurrentVersion
      filter:
        CommandLine|contains: \Software\Microsoft\Windows\CurrentVersion\Run
      condition: selection and not filter
    fields:
    - host.name
  answer_sources:
  - process_creation
