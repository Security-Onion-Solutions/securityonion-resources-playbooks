name: Invoke-Obfuscation COMPRESS OBFUSCATION - PowerShell
id: 2ea66e7a-6039-485f-b924-26d057f4d3ee
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  matches the decompress-and-execute idiom produced by the Invoke-Obfuscation COMPRESS
  method. The rule fires when a block contains both "new-object" and "text.encoding]::ascii",
  contains at least one of "system.io.compression.deflatestream" or "system.io.streamreader",
  and ends with "readtoend" — the pattern of a base64 blob inflated through a
  DeflateStream/StreamReader chain and read back for execution, typically piped to IEX.
  Compressing the payload hides its content from string-based inspection; some packaging,
  deployment, and vendor scripts inflate embedded resources with the same classes
  legitimately. The investigation should recover the full script, obtain the decompressed
  payload and identify what it does, establish what launched the PowerShell host, and check
  whether the pattern is new to the user, the host, and the fleet.
type: detection
detection_id: 20e5497e-331c-4cd5-8d36-935f6e2a9a07
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain the decompression idiom this rule detects?
  context: >-
    The rule fires when a single block contains both "new-object" and "text.encoding]::ascii",
    contains at least one of "system.io.compression.deflatestream" or "system.io.streamreader",
    and ends with "readtoend" — the decompress-and-execute idiom that inflates an embedded
    base64 payload through a compression stream. Long scripts are split across multiple 4104
    events, so read every chunk of the alerting block and confirm the matched strings belong
    to a real decompression pipeline feeding execution, rather than incidental mentions in
    comments, help text, or module code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run PowerShell that inflates compressed payloads in memory?
  context: >-
    Some legitimate automation decompresses embedded resources the same way — packaging and
    deployment scripts, installers, and a few vendor modules use DeflateStream over embedded
    base64 data. Check the user's role, the host's function, and the on-disk script path
    shown here against known automation; blocks logged under SYSTEM usually come from
    deployment tooling or agents, and the script path often identifies which one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the script still on disk for analysis, and what process wrote it there?
  context: >-
    A file-based script block records its on-disk path; retrieving the file enables hashing,
    sandboxing, and review of content beyond what the 4104 events captured. The file-creation
    event also identifies the process and account that staged the script — a write into a
    user-writable or staging location (Temp, AppData, ProgramData, Downloads) implies a
    delivery step worth tracing. No recorded path means interactive or in-memory execution,
    which for a block that inflates a hidden payload is itself notable, since memory-only
    delivery is a deliberate evasion choice. Preserve any payload or output paths named in
    the decoded content as well.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What payload does the compression stream inflate, and what does it do when executed?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the complete script.
    The 4104 channel records what PowerShell compiles, so the decompression wrapper itself is
    plaintext — but the payload sits inside a compressed base64 blob that still needs
    recovering. Base64-decode and Deflate-inflate the blob manually, or look for a follow-up
    script block logged when the inflated content is passed to IEX and compiled as new code.
    Decode any residual string obfuscation (concatenation, format operators, backticks) and
    identify the operational purpose — download cradles, reverse shells, AMSI or logging
    bypasses, credential access, in-memory assembly loading — along with any URLs, paths, or
    hosts the payload touches. Whether the inflated content is a hidden payload or routine
    embedded data is the central benign-vs-malicious judgment for this alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Which process launched the PowerShell host that compiled this script block?
  context: >-
    Script block events carry no process linkage, so recover the launch context from process
    telemetry on this host around the alert. An office application, browser, or unusual
    service binary as the parent points to delivery through a document, a download, or an
    exploited service; explorer.exe or a terminal fits interactive use. The projected command
    line also shows flags that script delivery typically sets, such as -nop, -w hidden, or
    -enc, and distinguishes direct powershell.exe invocation from .NET automation hosting.
    Administrative frameworks and remote-management tools can be expected parents on managed
    hosts — weigh the parent against what normally runs there.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Obfuscated payloads are frequently paired with disabling the controls that would inspect
    them. Common precursors include AMSI bypass (patching amsi.dll via AmsiUtils or setting
    amsiInitFailed), execution-policy overrides (-ExecutionPolicy Bypass, -ep bypass),
    real-time monitoring changes (Set-MpPreference, DisableRealtimeMonitoring), and downgrade
    to PowerShell version 2, which lacks script block logging. Any of these on the host in
    the preceding hour reads as preparation for the alerting block rather than routine
    administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did archive or encoded payload files appear on this host around the alert?
  context: >-
    The COMPRESS idiom usually inflates a blob embedded in the script itself, but operators
    also stage compressed payloads on disk for the script to read, and decompressed output or
    collected data may be written back as archives. This surveys creation and modification of
    archive and encoded file formats on the host near the alert. The anchor is content-derived
    — generic archive extensions, not a path taken from the alert — so treat hits as leads to
    correlate against paths in the decoded script, and expect an empty result when the
    payload never touches disk.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.zip'
          - '.7z'
          - '.gz'
          - '.enc'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: Did the PowerShell session spawn follow-on activity after the block was logged?
  context: >-
    A 4104 event records script content, not outcome. If the inflated payload launches tools,
    stages files, or reaches out to the network, the process-side evidence appears as
    children of the user's PowerShell hosts shortly after the block was logged. The event
    carries no process link, so this pivots by host, user, and time. Under SYSTEM the user
    anchor is broad because deployment tooling shares it — weigh individual children rather
    than the raw count.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block — reconnaissance, staging, and
    follow-on tooling produce a cluster of script blocks in a short window. When the inflated
    payload is executed with IEX it compiles as new code, so its plaintext often appears as a
    separate script block in this same window, which is the fastest way to read the hidden
    payload without manual inflation. The log.level column shows whether the host records all
    blocks (verbose) or only the automatically-flagged subset (warning), which bounds how
    complete this picture is.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it is
    not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it, and absence of other 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-block query in this
    investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The aggregated parent-child pairs collapse routine agent noise into high-count rows while
    novel pairs stand out at low counts. Around an obfuscated-execution alert, look for the
    delivery side (office applications or browsers spawning script hosts), staging
    (archivers, downloaders), and follow-on activity from processes that do not normally
    spawn children.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Defense tampering, reconnaissance, or credential-access detections in the preceding hours
    reveal the stages that led up to the obfuscated execution and help reconstruct the
    timeline. Payloads hidden behind compression typically arrive after initial access and
    delivery steps, so earlier alerts often mark where the activity began.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this exact script block run on this host before?
  context: >-
    The hash matches byte-identical content only, so zero history is strong evidence this
    exact script is new to the host, while a block that has recurred for months fits
    deployment tooling or vendor automation. A trivially edited variant hashes differently,
    so history says nothing about near-variants. On hosts without full Script Block Logging
    the history contains only automatically-flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user previously produced this decompress-and-execute pattern, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user, returning their 90-day
    history of script blocks containing this decompression pattern, aggregated by host.
    Packaging, deployment, and tooling engineers may produce it legitimately; a first-ever
    occurrence from a user whose role involves no such scripting reads differently. Weigh the
    count against what the user's job plausibly involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_4104:
        ScriptBlockText|contains|all:
        - new-object
        - text.encoding]::ascii
        ScriptBlockText|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        ScriptBlockText|endswith: readtoend
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_4104) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this decompression pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so the
    pattern itself is the pivot. The query mirrors the rule's selection fleet-wide over 90
    days, aggregated by host. A pattern that routinely appears on many hosts fits deployed
    tooling or a vendor product; one that has never appeared before, or only on this host, is
    the deviation worth chasing. Only hosts shipping the PowerShell channel (and, for
    non-flagged content, with full Script Block Logging enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_4104:
        ScriptBlockText|contains|all:
        - new-object
        - text.encoding]::ascii
        ScriptBlockText|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        ScriptBlockText|endswith: readtoend
      condition: selection_4104
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the obfuscated script may
    be one step of movement between them, and the per-host binary summary shows what else the
    account ran. When the alert fired under SYSTEM or another service principal this view
    fills with routine service activity; in that case the fleet-wide script-pattern question
    is the meaningful breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same decompression pattern fire on other hosts in this window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host, which is the meaningful breadth check when user identity is a service principal and
    no process identity exists on this channel. Several hosts in the same window points to
    scheduled or pushed automation, which change records should corroborate; a single host
    points to a host-local trigger. Coverage is policy-gated per host, so absence elsewhere
    is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_4104:
        ScriptBlockText|contains|all:
        - new-object
        - text.encoding]::ascii
        ScriptBlockText|contains:
        - system.io.compression.deflatestream
        - system.io.streamreader
        ScriptBlockText|endswith: readtoend
      condition: selection_4104
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: Did this exact script block run on other hosts in the environment?
  context: >-
    Byte-identical content across many hosts points to deployment tooling, GPO logon scripts,
    or vendor agents; the same block on a small set of unrelated hosts is the distribution
    lateral movement produces. This complements the pattern-based fleet queries — the hash
    matches this exact script only, so together they distinguish "this file was pushed" from
    "this technique is in use". Only hosts that logged the block can appear, so absence
    elsewhere on a default-logging fleet is weak evidence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - ps_script
