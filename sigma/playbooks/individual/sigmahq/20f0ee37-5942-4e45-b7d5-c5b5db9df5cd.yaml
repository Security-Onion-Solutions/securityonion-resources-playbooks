name: CurrentVersion Autorun Keys Modification
id: 1a2daf9a-dda2-4913-af0a-acdccbf64961
description: |
  Detects modification of Run, RunOnce, and related autostart extensibility point (ASEP) keys under
  ...\SOFTWARE\Microsoft\Windows\CurrentVersion, a common persistence mechanism (T1547.001). The rule
  fires when the written key sits under CurrentVersion AND matches one of the known autostart subkey
  fragments (Run, RunOnce, RunOnceEx, RunServices, credential providers, shell extensions, Group Policy
  scripts), and the write is not from the built-in allowlist of known-good software. Legitimate
  installers and administrators routinely register autostart entries, so the value data and the writing
  process determine whether the entry launches an expected application or an attacker payload at logon
  or boot. Investigation should confirm the exact key and value written, identify and verify the
  referenced payload, attribute the writing process and its lineage, and determine whether the change
  is an isolated approved action or part of a broader persistence effort.
type: detection
detection_id: 20f0ee37-5942-4e45-b7d5-c5b5db9df5cd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting write target a CurrentVersion autostart key, and is this a real
    autostart entry?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    when the written key path is under \SOFTWARE\Microsoft\Windows\CurrentVersion AND matches one of
    the autostart subkeys (Run, RunOnce, RunOnceEx, RunServices, credential providers, shell
    extensions, Group Policy scripts), and the writing process is not on the built-in allowlist of
    known-good software. Review the exact key path against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific autostart key and value were written, and is this a known persistence
    location?
  context: The key path reveals intent. Run and RunOnce launch the value's payload at the next
    logon; RunOnceEx with a Depend subkey can load a DLL and is not shown by some autostart
    enumeration tools; shell-extension, Browser Helper Object, and credential-provider ASEPs load
    code into Explorer or the logon interface. The value name and the data written determine what
    executes.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the autostart value data reference, and is that payload known and legitimate?
  context: The Details field carries the value data — typically a file path with arguments, sometimes
    a DLL path (as in a RunOnceEx Depend value) or an encoded or obfuscated command. Identify the
    referenced executable or script, note unusual locations (Temp, AppData, ProgramData, Public), and
    verify the payload's legitimacy. Value data is present on roughly four of five registry writes;
    when it is empty or binary, pivot to the writing process to understand what was set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this user and host expected to register autostart entries?
  context: Installers and administrators legitimately write Run keys, so knowing whether the user
    role and host function fit the behavior is often the fastest way to separate true positives from
    routine operations. User attribution is present on most endpoint registry events; when it is a
    machine account or SYSTEM, judge from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that wrote this autostart value?
  context: The registry write's own Image is the writing process; tracing its parent reveals whether
    the write came from a legitimate installer or update chain, or from an interactive shell, script
    host, or Office application spawned by a macro or exploit. The lineage is the core signal for
    attributing who set the autostart entry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this autostart key been written on this host before?
  context: A key that changes for the first time is more notable than one an installed application
    rewrites on every update. Zero history for this key on this host indicates a first-time
    modification; a recurring identical value points to routine software behavior. Compare the
    historical Details values to see whether the same value is being set.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry keys modified on this host in the same session?
  context: Attackers who set one autostart key often make several changes together — additional
    persistence keys, security-policy edits, or configuration changes. Clustering registry writes
    from the same process or user in a short window reveals the full scope of the change and whether
    multiple objectives were pursued. The triggering key will appear in the results; the signal is
    what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What processes ran on this host after the autostart key was written?
  context: An autostart entry takes effect only when its payload executes — for Run and RunOnce keys,
    at the next interactive logon or reboot. Registry-write-to-execution correlation typically falls
    within a 5-10 minute window when the payload runs immediately, but Run-key payloads may run only
    at the next logon. Review the executions that followed the write and compare them against the
    executable or script named in the value data; absence within this window does not rule out
    persistence.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the executable or script referenced by the autostart value present on disk, and does
    the change survive reboot?
  context: Registry persistence is only effective if the referenced payload exists at the written
    path. Correlating file activity by the writing process and its children shows whether the payload
    was dropped in the same session. The file-write event carries no hash; if the payload is present,
    hash it from a later execution for a reputation lookup. Registry key and value deletion is not
    observable on endpoint telemetry, so judge durability from the value data and the key's
    re-modification history rather than expecting a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: Autostart changes rarely occur in isolation. Reviewing process activity in a tight window
    around the write reveals what led to it and what followed — reconnaissance, payload staging, or
    additional persistence. Novel parent-child pairs stand out at low counts against the repetitive
    background of agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier alerts on the same host — defense tampering, reconnaissance, or credential access
    — may reveal the stages that preceded the persistence write and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this same autostart key modified on other hosts in the environment?
  context: The same value written across many hosts often reflects a software deployment or a Group
    Policy change; a single host with the modification is more likely targeted. Comparing the value
    data across hosts distinguishes fleet-wide software behavior from isolated activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single autostart entry. After setting a Run key, they commonly
    add backups via scheduled tasks, services, or other tools. Persistence-tool executions clustered
    in the same timeframe point to intentional stacking rather than an isolated change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence bypasses registry and command-line detection. A binary or script
    placed in a Startup folder achieves autostart without a Run-key write; file monitoring captures
    these drops even when the attacker avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was this autostart change part of an approved deployment or maintenance window?
  context: Many organizations require change records for persistence-relevant modifications. A
    matching ticket or software-deployment record points to authorized activity; its absence when
    policy requires one raises the priority. This check can quickly close a false positive or
    escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
