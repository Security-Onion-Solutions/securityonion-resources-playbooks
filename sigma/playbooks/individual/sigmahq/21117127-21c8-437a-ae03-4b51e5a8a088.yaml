name: Small Sieve Malware CommandLine Indicator
id: cac21432-546e-4d47-a705-73082fc19552
description: |
  Detects a process whose command line ends with the literal string ".exe Platypus" — a fixed
  argument the Small Sieve implant passes to its own executable, regardless of what the executable
  is named on disk. The rule constrains only the command line, so the invoked binary can carry any
  filename and live in any directory; the argument itself is the indicator. The associated technique
  is DLL search-order hijacking, where a library is planted in a directory a trusted process
  searches, or a registry or redirection entry is changed to point execution at it, so that the
  hijacked process runs attacker code under a legitimate identity. Determine which binary ran, where
  it came from, which libraries it loaded, and whether a matching file write or registry change
  preceded the execution.
type: detection
detection_id: 21117127-21c8-437a-ae03-4b51e5a8a088
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line end with the literal argument `.exe Platypus`?
  context: >-
    The rule matches a single fixed suffix and nothing else — no binary name, no path, no parent.
    Read the exact command line from the alerting event and confirm the trailing argument is present
    verbatim rather than a truncated, quoted, or coincidental match, and note which executable it was
    passed to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a locally installed executable with a custom single-word argument like this?
  context: >-
    The argument is not a documented switch for any common Windows utility, so there is rarely a
    routine explanation tied to a user role or host function. Establish whether the account is
    interactive or a service principal, and whether the host is a workstation, server, or developer
    machine where custom-built binaries are expected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the user or the team that owns this account recall running this executable?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to settle
    legitimacy. If the alert fired under a service account, ask the owning team whether any
    maintenance or deployment would explain it. If someone confirms the action, capture what they
    were trying to accomplish and where they obtained the executable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Which executable was invoked with the `Platypus` argument, and what directory did it run from?
  context: >-
    The rule carries no binary constraint, so the identity and location of the executable are the
    first facts to establish. An executable running from a user-writable directory such as AppData,
    ProgramData, or Temp, or one whose name imitates a system utility, is a different finding from a
    signed vendor binary in Program Files. The working directory also indicates where the rest of the
    payload is likely staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|endswith: '.exe Platypus'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this executable, and is that parent chain expected?
  context: >-
    The parent reveals how the executable was launched. A shell, script host, Office application, or
    archive utility as parent points to user-initiated or delivery-driven execution; services.exe or
    a scheduled-task host points to an installed persistence mechanism. Walk further up the tree from
    the parent's own parent if the immediate parent is itself a generic host process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which DLLs did this process load, and were any loaded from a non-standard directory or unsigned?
  context: >-
    Search-order hijacking completes at module load — a trusted process resolves a library name to a
    planted copy in its own directory, in the current working directory, or in a path element,
    instead of System32. Loads from user-writable directories, unsigned modules, and modules whose
    signer does not match the loading binary's vendor are the deviations worth chasing; loads from
    the standard system directories signed by the expected vendor are the baseline. Module hashes are
    present on load events, so a substituted library can be compared against a known-good hash
    directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - edr_console
  - manual_review
- question: Did this process write DLLs or executables to disk, and where were they placed?
  context: >-
    Planting or replacing a library is the step that precedes a hijacked load, and the file write is
    the only place the planted path is directly observable. Writes into an application's own install
    directory, into a user-writable directory that appears in the search path, or over an existing
    system library are the patterns to look for. File writes carry no hash, so pair any dropped path
    with the later execution or load of that path to obtain one.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Were library search-order or service binary-path registry values modified on this host around the time of the alert?
  context: >-
    Execution flow can be redirected without touching a file in the target directory, by editing the
    values that control which module or binary path is resolved — AppInit_DLLs, KnownDLLs, App Paths,
    Image File Execution Options, or a service's ImagePath and ServiceDll. Compare any value seen
    here against the expected registry and service baseline for this host role; a value pointing at a
    user-writable directory is the deviation. Correlate the modification timestamp against this
    execution to establish whether the redirection was installed for it.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows NT\CurrentVersion\Windows\AppInit_DLLs'
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\App Paths\'
          - '\Image File Execution Options\'
          - '\Services\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Has this host produced this command-line pattern before, and if so under which parents and users?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent and user distribution
    reflects how this specific argument has run here historically rather than generic binary usage.
    An empty result means the pattern is new to the host. A populated result under a consistent
    parent and account points at something installed rather than something that just arrived.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|endswith: .exe Platypus
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced this command-line pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, aggregated by host, so the result is
    the account's 90-day history of this exact argument rather than generic use of any binary. An
    account that has never produced it is a different finding from one that produces it routinely.
    Weigh the count and host spread against what the account is supposed to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|endswith: .exe Platypus
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven this command-line pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service principal, or a computer account, user identity does
    not attribute the behavior and the launch mechanism is the meaningful pivot. The query mirrors
    the rule's selection scoped to the alerting parent process across the environment, aggregated by
    host. A parent that already accounts for a long history of this pattern points at installed
    automation; a parent that is new for it is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|endswith: .exe Platypus
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user account do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the same
    identity was active elsewhere at the same time, which distinguishes a single-host event from
    activity that has already moved. If the alert fired under a service principal, this view returns
    routine agent and OS telemetry from every host and the parent-scoped view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from the whole
    environment. The query instead mirrors the rule's selection scoped to the alerting parent
    process, fleet-wide, in the alert window. Several hosts in the same window points at scheduled or
    pushed automation; a single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|endswith: .exe Platypus
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process launch on the host in the surrounding window collapses repetitive agent
    and OS telemetry into high-count rows while novel parent-child pairs stand out at low counts.
    Scan for archive extraction, script hosts, reconnaissance utilities, and installers immediately
    before the alert, and for anything the alerting executable set in motion after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts produced this command-line pattern in the past week, and how is it distributed?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this exact argument rather than generic usage of any binary. Because the argument is a fixed
    literal with no legitimate tooling behind it, more than one host is a scoping fact rather than an
    automation explanation. Use the host list to bound the affected set.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|endswith: .exe Platypus
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host frequently mark the stages that led here — delivery, script
    execution, defense tampering, or credential access. Read the preceding alerts as a timeline to
    establish how the executable arrived and whether anything else on the host was already flagged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Search-order hijacking is one foothold; backup mechanisms built with different techniques
    commonly accompany it. Scheduled tasks, services, registry Run keys, BITS jobs, and WMI
    subscriptions created in the same timeframe point at intentional stacking rather than an isolated
    administrative action. Read the command lines returned here for the executable and directory
    identified in this alert.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as Startup folders or scheduled-task definitions on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into a Startup folder, or writing a scheduled-task XML definition directly, achieves persistence
    without running schtasks, sc, or reg. Check whether the executable identified in this alert, or
    anything from the same directory, appears in these paths.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
