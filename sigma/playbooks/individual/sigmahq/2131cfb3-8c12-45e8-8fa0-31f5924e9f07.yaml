name: CVE-2021-1675 Print Spooler Exploitation Filename Pattern
id: bc2efbfe-91cc-4de6-b109-cff70624cb05
description: |
  Detects a file written into the Windows Print Spooler driver backup path whose name matches the known
  proof-of-concept pattern for the Print Spooler driver-install vulnerability (CVE-2021-1675 / CVE-2021-34527).
  Exploitation coerces the spooler service (spoolsv.exe) into copying an attacker-supplied driver DLL into the
  driver path and loading it into the running spooler process, achieving code execution as SYSTEM and privilege
  escalation, and is frequently driven remotely over the print RPC protocols against servers where the spooler
  is reachable. Investigation should confirm the writing process, whether the DLL was loaded, whether the spooler
  spawned any child processes, and whether the payload was fetched from a remote share.
type: detection
detection_id: 2131cfb3-8c12-45e8-8fa0-31f5924e9f07
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the written file path match the Print Spooler driver backup pattern this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact TargetFilename against the spooler driver backup
    path the rule matches. The CVE-2021-1675 proof-of-concept drops a driver file under the spooler's
    \spool\drivers\x64\3\old\1\ backup directory; verify the path and operation type before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and process expected to write printer driver files into the spooler driver directory?
  context: >-
    The Print Spooler service (spoolsv.exe) is normally the only writer of files under \spool\drivers\. A different
    writer, or a driver file appearing on a host that is not a print server, is anomalous. When the writer is a
    service account or SYSTEM, judge by the host role and whether a driver installation was expected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A driver DLL still on disk can be retrieved, hashed, and
    analyzed; a file deleted shortly after creation suggests cleanup after the spooler loaded it into memory,
    shifting the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the dropped file an actual printer driver, or a planted payload DLL?
  context: >-
    Retrieve the file from its on-disk path and inspect it: file size, signing status, exported functions, and
    embedded strings. Exploitation places an attacker-supplied DLL into the driver path so the spooler loads it;
    a legitimate driver is signed and matches a known package, while a planted payload is typically unsigned and
    small.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was this DLL loaded into a process, and what are its hash and signing status?
  context: >-
    Unlike file-write events, DLL load events carry the module hash and code-signature fields. If the spooler
    loaded this DLL, submit its hash to threat intelligence and check whether it is signed by a legitimate driver
    vendor. An unsigned or unknown DLL loaded from the driver path is consistent with exploitation. If the loaded
    module was renamed, review every module the spooler process loaded around the alert.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Did the process that wrote this file spawn any child processes afterward?
  context: >-
    Successful exploitation loads the malicious driver into the spooler and can execute code as SYSTEM. The Print
    Spooler service does not normally spawn interactive tools; command interpreters, script hosts, or rundll32
    launched by the writing process indicate the payload ran. Review the command lines and the user context of any
    children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What outbound network connections did the writing process make around the time of the file write?
  context: >-
    The exploit typically hosts the malicious driver on a remote SMB share and coerces the spooler to fetch it, so
    the writing process may show an outbound connection to an external host on SMB ports. A connection to an
    unfamiliar or external destination around the write supports remote exploitation over the print protocols
    rather than local activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other files did the writing process create or delete around the alert?
  context: >-
    The exploitation flow copies several driver files into \spool\drivers\x64\3\new and \x64\3 and abuses the
    driver-upgrade backup feature to stage the payload. The full set of files the writer touched around the alert
    enumerates the staged driver components and any cleanup, distinguishing a single artifact from the multi-file
    staging the technique uses.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has recently been written to the spooler driver directory, and by which processes?
  context: >-
    The driver install and backup directories under \spool\drivers\x64\3\ are written almost exclusively by the
    spooler service during legitimate driver installation. Other recent arrivals, or writes by an unexpected
    process, reveal whether this is an isolated drop or a directory under active manipulation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\spool\drivers\x64\3\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file matching this name been written to this host before?
  context: >-
    A file appearing in the spooler driver backup path for the first time is more suspicious than a recurring one.
    The specific PoC filename pattern this rule matches should essentially never appear during normal driver
    installation; zero or very low historical counts indicate a first-time, likely exploitation-related drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was the same file written to any other hosts in the environment?
  context: >-
    This exploitation is frequently aimed at domain controllers and other servers where the spooler is reachable.
    The same driver file appearing on multiple hosts in a short window points to a coordinated push against several
    targets rather than an isolated event; map the affected hosts and the timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user account previously produced this spooler driver-drop pattern, and does that fit their role?
  context: >-
    This mirrors the rule's file-write pattern scoped to the acting user over 90 days, aggregated by host. A user
    who has never produced this pattern is more suspicious than one who does so routinely. Because the spooler
    writes as SYSTEM or a machine account, weigh the identity against the host role and the launch mechanism rather
    than treating the account alone as attribution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: C:\Windows\System32\spool\drivers\x64\3\old\1\123
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this spooler driver-drop pattern here or across the environment, or is it new for this activity?
  context: >-
    When the write occurs under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. This mirrors the rule's pattern scoped to the alerting program over 90
    days. A program that already accounts for many prior events is routine driver-installation machinery; a new or
    rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: C:\Windows\System32\spool\drivers\x64\3\old\1\123
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the environment around the time of the alert?
  context: >-
    Tracking the acting account's activity across hosts reveals whether the same identity drove related activity
    elsewhere, such as reconnaissance of spooler RPC endpoints or follow-on execution. If the alert fired under
    SYSTEM or a machine account this view returns service noise; the parent-scoped view is the meaningful read in
    that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    This mirrors the rule's pattern scoped to the alerting program, fleet-wide, in the alert window.
    Multiple hosts producing the same spooler driver-drop in the same window points to an automated or pushed
    operation against several targets; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: C:\Windows\System32\spool\drivers\x64\3\old\1\123
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the alert surfaces novel parent-child
    pairs against the routine background, revealing reconnaissance, privilege escalation, or follow-on execution
    that accompanied the spooler driver drop.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as spooler-service reconnaissance, credential access, or defense
    tampering, may reveal the stages that preceded this event and help reconstruct the timeline leading to the
    driver drop.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
