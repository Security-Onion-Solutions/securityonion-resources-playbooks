name: Private Keys Reconnaissance Via CommandLine Tools
id: 0ed7e3e2-6955-4689-bda4-57792d6ee71b
description: |
  Detects command-line searches for private key and certificate files by their extensions (.key, .pem, .pfx, .ppk, .p12, .pgp, .gpg, .cer, .p7b, .asc). The rule fires when a key-extension reference appears on the command line AND the invoking tool is EITHER cmd.exe (with dir) OR powershell.exe/pwsh.exe (with Get-ChildItem) OR findstr.exe. Listing or grepping for key material is a credential-access reconnaissance step that often precedes exfiltration of the located files; it can also be benign administration or backup tooling. Determine whether the search was operator-driven or automated, what extensions and paths were targeted, whether any matching files exist on the host, and whether the located key material was subsequently read, copied, or sent off-host.
type: detection
detection_id: 213d6a77-3d55-4ce8-ba74-fcfef741974e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line search for private-key extensions using cmd dir, PowerShell Get-ChildItem, or findstr?
  context: Confirm the alert is a true positive by reviewing the exact command line, Image, and OriginalFileName against the rule's criteria. The rule fires when a key extension (.key, .pem, .pfx, .ppk, .p12, .pgp, .gpg, .cer, .p7b, .asc) appears on the command line AND one of three branches matched — cmd.exe with a dir search, powershell.exe/pwsh.exe with Get-ChildItem, or findstr.exe. Note which branch fired and which extensions were named, because the search tool and the targeted extensions pattern every downstream question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to search the filesystem for private-key and certificate files?
  context: Listing key material by extension is normal for certificate administrators, backup jobs, PKI tooling, and developers managing SSH/code-signing keys, but unusual for general user accounts. Knowing whether the user role and host function justify a key-file search is often the fastest path to distinguishing routine operations from reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which key-file extensions and directories did the search target, and does the scope look enumerative?
  context: Decode the full command line to see exactly which extensions were named and which paths were enumerated. A recursive search across user profiles, .ssh directories, or system certificate stores covering several extensions at once points to credential reconnaissance; a single targeted lookup of one known file is closer to routine administration. The extensions present (e.g. .ppk and .pem for SSH keys, .pfx and .p12 for code-signing or TLS) narrow which credential type was sought.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the searching process a genuine cmd.exe, powershell.exe, pwsh.exe, or findstr.exe, or a renamed binary?
  context: The rule matches on both Image path and OriginalFileName, so a renamed copy of a search tool placed elsewhere will still fire. Compare the Image path against OriginalFileName and the on-disk location — a findstr.exe or powershell.exe running from a user-writable or temp directory, or whose OriginalFileName disagrees with its filename, indicates masquerading rather than the in-box utility, which raises the weight of the reconnaissance finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Do any private-key or certificate files matching the searched extensions actually exist on this host?
  context: The command line only proves a search ran, not that key material was present. Pivoting to file events for the matching extensions shows whether the search would have returned hits — confirmed key files on disk make the reconnaissance actionable and identify exactly which credentials are at risk and may need rotation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - .key
          - .pgp
          - .gpg
          - .ppk
          - .p12
          - .pem
          - .pfx
          - .cer
          - .p7b
          - .asc
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
- question: What process spawned this search tool, and is that parent chain expected?
  context: The parent process reveals how the search was invoked. An interactive shell launched from explorer.exe or a known administration console suggests operator or maintenance activity; spawning from a script host, Office application, remote-execution service, or a freshly written binary suggests the search is one step of a scripted intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did the searching process do next, and were any located key files read or copied?
  context: A bare directory listing is reconnaissance; the disposition turns on what followed. Child processes that copy, archive, encode, or transmit the located files (copy, robocopy, certutil, compression utilities, or a transfer client) escalate this from a search to active credential collection and staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were the located key files accessed over an SMB network share around the time of the search?
  context: Key material is frequently pulled from file shares rather than read locally. Windows Security event 5145 records detailed share-access checks; reviewing share accesses to objects with key extensions in the alert window shows whether the reconnaissance was followed by remote retrieval of the files from a server, which would not appear in local process or file telemetry on the alerting host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 5145
      selection_ext:
        RelativeTargetName|contains:
          - .key
          - .pgp
          - .gpg
          - .ppk
          - .p12
          - .pem
          - .pfx
          - .cer
          - .p7b
          - .asc
      condition: selection and selection_ext
    fields:
      - RelativeTargetName
      - ShareName
      - SubjectUserName
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which keys or certificates would the searched paths expose, and do any protect privileged access?
  context: The severity depends on what the located key material protects. A domain code-signing certificate, a CA key, an SSH key for a privileged jump host, or a VPN client certificate warrants escalation and rotation; a self-signed developer key may only need monitoring. Cross-reference the targeted paths and any matching files against the systems and identities those credentials authenticate to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host previously matched the rule's key-search pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine PKI and backup tooling can search for key files. The query mirrors the rule's full selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific key-search pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: 'dir '
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains: 'Get-ChildItem '
      selection_findstr:
      - Image|endswith: \findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_ext:
        CommandLine|contains:
        - .key
        - .pgp
        - .gpg
        - .ppk
        - .p12
        - .pem
        - .pfx
        - .cer
        - .p7b
        - .asc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_ext and (all of selection_cmd_* or all of selection_pwsh_* or selection_findstr)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: 'dir '
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains: 'Get-ChildItem '
      selection_findstr:
      - Image|endswith: \findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_ext:
        CommandLine|contains:
        - .key
        - .pgp
        - .gpg
        - .ppk
        - .p12
        - .pem
        - .pfx
        - .cer
        - .p7b
        - .asc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_ext and (all of selection_cmd_* or all of selection_pwsh_* or selection_findstr)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: 'dir '
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains: 'Get-ChildItem '
      selection_findstr:
      - Image|endswith: \findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_ext:
        CommandLine|contains:
        - .key
        - .pgp
        - .gpg
        - .ppk
        - .p12
        - .pem
        - .pfx
        - .cer
        - .p7b
        - .asc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_ext and (all of selection_cmd_* or all of selection_pwsh_* or selection_findstr)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the key search was an isolated action or part of broader hands-on activity. The same user searching for key material or running other reconnaissance on multiple endpoints in the same window widens the likely scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd_img:
      - Image|endswith: \cmd.exe
      - OriginalFileName: Cmd.Exe
      selection_cmd_cli:
        CommandLine|contains: 'dir '
      selection_pwsh_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_pwsh_cli:
        CommandLine|contains: 'Get-ChildItem '
      selection_findstr:
      - Image|endswith: \findstr.exe
      - OriginalFileName: FINDSTR.EXE
      selection_ext:
        CommandLine|contains:
        - .key
        - .pgp
        - .gpg
        - .ppk
        - .p12
        - .pem
        - .pfx
        - .cer
        - .p7b
        - .asc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_ext and (all of selection_cmd_* or all of selection_pwsh_* or selection_findstr)) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this search?
  context: A key-file search rarely stands alone. Earlier detections on the same host — execution from a script host, defense tampering, or other reconnaissance — may reveal the access stage that preceded this credential-hunting step and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
