name: Curl Download And Execute Combination
id: 4528f5c2-c88d-42cd-81ff-3638a0624424
description: |
  Detects a single command line that runs under a shell command switch (-c, /c or a windash
  variant) and combines a curl invocation, an http URL, an -o output path, and an & command
  chain — all four conditions must be present together for the rule to fire. That combination
  is the download-and-execute form: curl retrieves a remote payload to a chosen path and the
  chained command runs it in the same shell invocation. curl.exe ships with Windows 10 build
  17063 and later and is used heavily by installers, build scripts, and administrators, so the
  binary alone means nothing; the fetch-write-run chain in one command is what the rule keys on.
  The investigation should establish which URL was contacted, where the payload was written,
  what the chained command executed, and whether the parent process and user account make that
  operation routine for this host.
type: detection
detection_id: 21dd6d38-2b18-4453-9404-a0fe4a0cc288
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line contain a curl invocation with an http URL, an -o output path, and an
    & chained command under a shell command switch?
  context: >-
    The rule requires all four elements in one command line, so confirm each is present before
    investing investigation time. A curl call with -o but no & chain, or an & chain with no http
    URL, does not match the download-and-execute pattern the rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to download files with curl and run them from the same command?
  context: >-
    Build agents, packaging hosts, and administrator workstations legitimately fetch and run
    installers this way. Knowing whether the account and the host function match that pattern is
    often the fastest way to separate routine tooling from operator-driven delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the curl command do? Decode the URL, the -o output path, and the command chained after the &.
  context: >-
    The full command line carries the operational detail: the remote host and path being
    retrieved, the local file the payload is written to, and the executable or interpreter the &
    chain hands it to. Record the output path — it is the anchor for the file and execution
    questions. The query returns curl command lines on this host in the alert window, which
    catches multi-step fetches that together form one delivery operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'curl '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this shell and is that parent chain expected?
  context: >-
    The parent reveals how the download was invoked. Packaging and configuration-management
    tooling produces predictable parents such as a scheduler, an installer, or a build agent.
    Office applications, script hosts, browsers, and archive utilities as the parent of a
    fetch-and-run shell point to delivery through a user-opened file rather than administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which remote destinations did the alerting shell and its children connect to?
  context: >-
    The transfer stage of the chain is visible as egress from the shell or from the curl child it
    spawned. Compare the destination against the URL in the command line and against the
    destinations the environment normally allows — a fetch from an internal package mirror or a
    vendor distribution host reads differently from one to a raw IP address, a paste or file-share
    service, or a non-standard port. Destination hostname is frequently absent on endpoint
    telemetry, so anchor on the address and port.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Was the download successful? Check for file creation at the destination.
  context: >-
    A curl command does not guarantee the payload arrived — a blocked URL, a proxy denial, or a
    failed transfer leaves the & chain running against a file that never landed. Confirm a write
    at the -o path from the command line. Drops into user-writable staging directories such as
    the public user profile, the temp directory, or a per-user AppData path are worth noting
    against the same operation performed into a managed software directory.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: If the downloaded payload was executed, what is its hash — and is it known to threat intelligence?
  context: >-
    The hash needed for a reputation lookup or sandbox detonation is recorded when the payload
    runs, not when it is written — file-creation events carry no hash in this telemetry. This
    query returns the processes the shell and the curl child spawned, with their executable
    hashes; for the & chain in this command that is the payload. If the payload was run later by
    an unrelated process it will not appear here — retrieve the file from the -o path and hash it
    manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did any unsigned modules load on this host in the hour after the download?
  context: >-
    Proxy-execution chains often hand the retrieved file to a trusted signed loader rather than
    running it directly, so the payload surfaces as an unsigned module inside a signed process
    rather than as a new executable. Unsigned loads carry their own hash on the load event, so a
    reputation lookup works without pivoting to an execution. Correlate the loading process and
    the module path against the -o output path from the command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Signed: 'false'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signature
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Does this host normally run curl to fetch content over http?
  context: >-
    curl.exe ships with the operating system and is common on build, packaging, and
    administrator systems, so a long history of http fetches on this host reframes the alert as
    tooling that happens to chain its steps. Zero or very low counts over 90 days indicate the
    activity is new for this host. The aggregation groups by user so a single automation account
    is distinguishable from scattered interactive use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - 'curl '
        - http
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users normally drive
    that activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's full selection scoped to this host, so the parent and user
    distribution reflects how this specific fetch-write-run combination has run here before, not
    generic curl usage. A parent and account that already account for most prior events point to
    an established script; a parent or account that appears for the first time is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash: ' -c '
        CommandLine|contains|all:
        - 'curl '
        - http
        - -o
        - '&'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the account's
    90-day history of this specific fetch-write-run combination rather than generic curl use,
    aggregated by host. An account that routinely produces this pattern across many hosts reads
    as automation or a packaging role; an account with no prior history is worth weighing against
    what that user is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash: ' -c '
        CommandLine|contains|all:
        - 'curl '
        - http
        - -o
        - '&'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern across the environment, or is
    the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity
    attributes nothing and the launch mechanism is the meaningful pivot. The query mirrors the
    rule's selection scoped to the alerting parent, so the result is the 90-day history of that
    parent driving this exact combination. A parent already responsible for thousands of prior
    events is vendor or platform automation; a parent that is new for this pattern is the
    deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash: ' -c '
        CommandLine|contains|all:
        - 'curl '
        - http
        - -o
        - '&'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the download is isolated or
    part of activity spanning several endpoints. The same account fetching and running payloads
    on multiple hosts in the same window widens the scope of the investigation. Under a service
    principal this returns routine platform telemetry — read it alongside the parent-scoped
    view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the
    activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns platform
    telemetry from every host. The query instead mirrors the rule's selection scoped to the
    alerting parent, fleet-wide, in the alert window. Several hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash: ' -c '
        CommandLine|contains|all:
        - 'curl '
        - http
        - -o
        - '&'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A delivery step rarely stands alone. Aggregating process and parent pairs around the alert
    collapses routine repetitive telemetry into high-count rows and leaves novel parent-child
    pairs standing out at low counts — reconnaissance, credential access, or persistence set up
    before or after the fetch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place the download in a sequence. Ingress tool
    transfer usually sits between an initial foothold and whatever the payload does next, so
    check for prior script-host execution, defense tampering, or reconnaissance detections that
    would identify how the shell came to run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of this fetch-write-run combination rather than the fleet's generic curl footprint.
    Many hosts firing the same pattern points to a deployment script or vendor automation that
    belongs on a tuning list; one host or a small unrelated set points to operator-driven
    activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|windash: ' -c '
        CommandLine|contains|all:
        - 'curl '
        - http
        - -o
        - '&'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
