name: Delete All Scheduled Tasks
id: 5b2d8e4a-3c1f-4a7e-9f6b-2d8c1a4e7b3f
description: |
  Detects schtasks.exe run with the /delete flag, the /tn * wildcard, and the /f
  force flag together, which deletes every scheduled task on the local computer
  including tasks created by other users. Legitimate use is rare and usually limited
  to scripted host rebuilds or de-provisioning; far more often this is a destructive
  or anti-forensic action that removes defender-installed tasks (telemetry, backup,
  scanning) and any benign scheduling at once. Investigation should confirm the exact
  command and scope, identify the parent and account that ran it, and look for
  surrounding recovery-inhibition or service-stop activity that often accompanies an
  availability-denial sequence.
type: detection
detection_id: 220457c1-1c9f-4c2e-afe6-9598926222c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show schtasks deleting all tasks with /delete, /tn
    *, and /f together?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line against the rule's criteria. The rule fires
    only when all three appear together — the /delete action, the /tn * wildcard
    that targets every task on the computer, and the /f force flag that suppresses
    the confirmation prompt. A single specific task name in /tn instead of the wildcard
    would not match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to bulk-delete scheduled tasks?
  context: Deleting every scheduled task at once is not routine administration. Confirm
    whether the account and host function are consistent with a sanctioned operation
    such as a scripted host rebuild, image teardown, or de-provisioning workflow.
    A workstation or server with no such maintenance scheduled is a stronger signal
    than a build/lab host where teardown scripts run regularly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other destructive or recovery-inhibiting actions occurred on this
    host?
  context: 'Availability-denial sequences typically chain multiple destructive actions:
    deleting shadow copies, disabling recovery, stopping security services, clearing
    event logs, and removing scheduling. Finding the complete set of destructive
    commands around the task deletion reveals whether this is an isolated administrative
    action or one step in a broader impact operation.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Which tasks did this command target, and was the deletion scoped to every
    task or a subset?
  context: The schtasks command line carries the scope of the deletion. With /tn *
    every task on the computer is removed, including tasks owned by other users and
    any defender- or vendor-installed scheduling. Decode the full argument string
    to confirm the wildcard scope, note any /s flag pointing the deletion at a remote
    computer, and identify whether the parent context supplied the command as a
    scripted batch or an interactive operator action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned schtasks.exe, and is that parent chain expected?
  context: The parent process reveals how the deletion was invoked. A legitimate
    administrative action usually descends from an interactive shell or a known
    management agent; an unusual parent such as a script host, an Office application,
    or a freshly dropped binary points to scripted or operator-driven destruction.
    Walk up to the parent's own parent to see what initiated the chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously ran a bulk task-deletion, what parents and users
    drove it, and does the current alert fit that pattern?
  context: Even built-in tools can be abused. The query mirrors the rule's selection
    structure scoped to this host — the resulting parent/user distribution reflects
    how this specific deletion pattern has historically run here. A new parent process,
    an unexpected account, or a first-time appearance of the pattern is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement
    or coordinated activity across multiple endpoints. If the same user triggered
    similar destructive actions on other hosts, the scope of impact may be larger
    than the alerting host alone.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Destructive actions rarely occur in isolation. Examining activity around
    the alert reveals the immediate context: what led to this event, what happened
    after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, service stops, or recovery inhibition.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance,
    credential access, or service stops — may reveal the attack stages that preceded
    the task deletion and help reconstruct the full timeline leading to the impact
    action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was schtasks.exe executed from its expected System32 path?
  context: A built-in utility executed from a non-standard path (outside System32
    or SysWOW64) may have been copied or renamed to evade path-based allowlists.
    Compare the Image path and OriginalFileName against the expected location — a
    schtasks.exe running from a user temp directory is more suspicious than one in
    System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other persist/tamper LOLBins used on this host recently?
  context: Operators who use one built-in utility for destruction often use several.
    Bulk task deletion frequently sits alongside service and recovery tampering
    via sc, net, reg, vssadmin, bcdedit, or wevtutil. Finding multiple such utilities
    acting toward the same availability-denial objective strengthens the case for
    deliberate impact rather than isolated maintenance.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\wmic.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host run the bulk task-deletion pattern over the past
    90 days, and what command-line structures are typical?
  context: A deletion pattern with no prior history on a host is more suspicious than
    one that recurs under stable parents. The query mirrors the rule's selection
    structure scoped to this host, so the count reflects this specific firing pattern
    rather than generic schtasks usage. The CommandLine projection lets you compare
    typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts run the bulk task-deletion pattern in the past week,
    and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of this deletion pattern rather than generic
    schtasks usage. Many hosts firing the same pattern points to scripted deployment
    or a teardown/rebuild rollout; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - ' /delete '
        - /tn \*
        - ' /f'
      condition: selection
    fields:
    - host.name
