name: Vulnerable Driver Blocklist Registry Tampering Via CommandLine
id: 55abe369-720b-41b3-be14-9cae13cb5009
description: |
  Detects command-line tampering with the Windows Vulnerable Driver Blocklist registry configuration, using powershell.exe, pwsh.exe, or reg.exe to write the VulnerableDriverBlocklistEnable value under \Control\CI\Config. The blocklist prevents the loading of known-exploitable signed kernel drivers; disabling it is a common precursor to bring-your-own-vulnerable-driver (BYOVD) activity, where an attacker loads a signed-but-vulnerable driver to run code in kernel mode and disable endpoint protection. The rule fires when all of [a matching binary, a registry-write verb (add / New-ItemProperty / Set-ItemProperty / si), and both the \Control\CI\Config path and the VulnerableDriverBlocklistEnable value name] are present in the command line. Investigation should determine what value was written (enable vs. disable), who and what launched the change, and whether a driver load or further defense tampering followed.
type: detection
detection_id: 22154f0e-5132-4a54-aa78-cc62f6def531
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line modify VulnerableDriverBlocklistEnable under \Control\CI\Config using powershell.exe, pwsh.exe, or reg.exe?
  context: Confirm the alert is a true positive before investing time. The rule fires only when a matching binary, a registry-write verb (add, New-ItemProperty, Set-ItemProperty, or si), and both the \Control\CI\Config path and the VulnerableDriverBlocklistEnable value name all appear together. Read the full command line and the registry value being written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify kernel driver blocklist policy from the command line?
  context: Vulnerable Driver Blocklist configuration is managed centrally through Windows servicing and App Control policy, not by ad-hoc command-line edits. Knowing whether the user role and host function involve security-policy administration is usually the fastest way to separate a sanctioned change from tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What value was written to VulnerableDriverBlocklistEnable, and does it enable or disable the blocklist?
  context: The data written determines impact. A value of 0 disables the Vulnerable Driver Blocklist, leaving the host able to load known-exploitable signed drivers; a value of 1 re-enables it. Decode the full command line to confirm the value name, the data written, and which verb (add / Set-ItemProperty / New-ItemProperty / si) performed the change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key path and value data were actually written by this process?
  context: When the registry write is captured as a structured registry event, the target object and value data are available directly rather than parsed from the command line. Confirm the modification landed under \Control\CI\Config\VulnerableDriverBlocklistEnable and check the written data, since the command line and the committed value can differ if the write failed or was redirected.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned this powershell.exe, pwsh.exe, or reg.exe instance, and is that parent chain expected?
  context: The parent process reveals how the registry edit was invoked. A change driven by a deployment or configuration-management parent looks different from one launched by an interactive shell, a script host (wscript.exe, mshta.exe), or an Office application. Walk up to the parent and note what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was a kernel driver or new service loaded on this host after the blocklist change?
  context: Disabling the Vulnerable Driver Blocklist is typically a setup step for loading a signed-but-vulnerable driver to gain kernel-mode execution (BYOVD). After a disable, look for new kernel service creation (sc create, New-Service) or driver-install tooling on the host. A driver load shortly after the blocklist was disabled is the payoff the tampering enabled.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_driver:
        - Image|endswith:
            - \sc.exe
            - \drvinst.exe
            - \rundll32.exe
        - CommandLine|contains:
            - 'New-Service'
            - 'sc create'
            - 'sc.exe create'
            - 'type= kernel'
            - 'type=kernel'
            - '.sys'
      condition: selection and selection_driver
    fields:
      - Image
      - CommandLine
- question: Is the Vulnerable Driver Blocklist currently enabled again, or does the host remain in the disabled state?
  context: Tampering may be transient (disabled for one action, then restored) or persistent. If the blocklist remains disabled, the host can still load known-exploitable drivers and the setting should be restored before the investigation closes. Check the live registry value and policy status.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the blocklist was modified?
  context: Defenses are weakened for a reason. Examining process activity in the window after the change reveals what the tampering was meant to enable, such as driver installation, payload execution, or credential access that would otherwise be blocked or logged.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the same time?
  context: An actor who disables one control often disables several. Modifying the driver blocklist alongside stopping AV/EDR services, clearing event logs, or deleting shadow copies indicates a coordinated effort to remove protection. Finding multiple tampering events from the same user or parent reveals the full scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli_1:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_2:
        CommandLine|contains|all:
        - \Control\CI\Config
        - VulnerableDriverBlocklistEnable
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli_1:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_2:
        CommandLine|contains|all:
        - \Control\CI\Config
        - VulnerableDriverBlocklistEnable
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether this was an isolated change or part of broader hands-on activity. The same user driving similar changes on multiple endpoints widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli_1:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_2:
        CommandLine|contains|all:
        - \Control\CI\Config
        - VulnerableDriverBlocklistEnable
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host previously fired this same blocklist-tampering pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine binaries can be abused. This query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how this specific firing pattern — not generic powershell or reg usage — has historically run here. A new parent, an unexpected user, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli_1:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_2:
        CommandLine|contains|all:
        - \Control\CI\Config
        - VulnerableDriverBlocklistEnable
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this same blocklist-tampering pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
        - reg.exe
      selection_cli_1:
        CommandLine|contains:
        - 'add '
        - 'New-ItemProperty '
        - 'Set-ItemProperty '
        - 'si '
      selection_cli_2:
        CommandLine|contains|all:
        - \Control\CI\Config
        - VulnerableDriverBlocklistEnable
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded the blocklist change and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: 'Examining activity surrounding the alert reveals the immediate context: what led to the registry change, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs stand out against repetitive system telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
