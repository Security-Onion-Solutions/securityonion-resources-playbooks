name: Process Reconnaissance Via Wmic.EXE
id: e88d4668-00c5-40c5-9a94-99bdbd15edaf
description: |
  Detects wmic.exe being run with a command line that contains 'process'
  while not also containing both 'call' and 'create' together. This pattern
  corresponds to listing or querying running processes through WMI rather than
  using wmic to spawn a new process, and it is a common host-reconnaissance and
  software-inventory step. Administrators, inventory agents, and software
  packaging also enumerate processes this way, so the investigation should
  decode exactly what was queried, establish whether the user, host, and parent
  chain match expected operations, and check whether the enumeration sits inside
  a broader sequence of discovery or follow-on tooling.
type: detection
detection_id: 221b251a-357a-49a9-920a-271802777cc0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line run wmic with the process flag and without a call create together?
  context: Confirm the alert is a true positive by reviewing the exact command line against the
    rule's criteria. The rule fires when wmic.exe (by OriginalFileName or an Image ending in
    \WMIC.exe) is run with a command line that contains 'process' AND does not contain both
    'call' and 'create'. Verify the process keyword is present, confirm this is an enumeration
    rather than a wmic process call create spawn, and note the specific alias, sub-command, or
    filter used to query processes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate processes through wmic?
  context: Legitimate process and inventory queries are common from management agents, software
    packaging, and administrators, but interactive process enumeration via wmic from a regular
    user workstation is less routine. Knowing whether the user role and host function include
    WMI-driven reconnaissance is often the fastest way to separate routine operations from
    discovery activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this wmic process query do? Decode the full command line.
  context: The full command line reveals what was enumerated. Decode the alias or WMI path to see
    whether it listed all processes, filtered for a specific process name, requested particular
    properties, or escaped to a schema class such as Win32_Process, and check for a /node argument
    naming a remote host, which would indicate the query targeted another machine. Process
    enumeration is often a precursor to selecting a target for injection, credential access, or
    defense evasion. The query scopes to wmic executions on this host in the surrounding window,
    constrained to the process keyword, so a sequence of related enumeration commands is visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: process
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did wmic open a remote connection to another host around the time of this command?
  context: WMI queries can run against a remote target. When wmic is pointed at another host with
    /node, it opens an outbound DCOM/RPC connection from this machine rather than reading the
    local process list. A connection from wmic.exe to a remote endpoint in the alert window
    indicates the enumeration was aimed at another host, widening the scope; correlate the
    destination against any host named in the command line and watch for the same wmic process
    reaching several distinct remote hosts, which points to scripted remote discovery.
  range: +/-5m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did the WMI provider record query or method activity on this host in the alert window?
  context: >-
    The WMI-Activity operational channel does not log individual queries, but it records each
    provider the WMI service loaded to answer them: a wmic enumeration leaves an event 5857 for
    the provider backing the queried class. Read winlog.user_data.ProviderName and HostProcess
    for the provider and the WmiPrvSE instance that served it, and the message column for the
    narrative. If WMI activity logs are not collected in this environment, treat zero results
    as a visibility gap rather than evidence nothing ran, and rely on the process and network
    evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID: 5857
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.HostProcess
      - message
- question: What process spawned this wmic instance and is that parent chain expected?
  context: The parent process reveals how wmic was invoked. Enumeration driven by an interactive
    shell, a scripting host such as wscript.exe or mshta.exe, or an Office application is more
    concerning than a launch from a management agent or a scheduled inventory task. Walk the chain
    back from the immediate parent to understand who initiated the query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this wmic instance spawn afterward?
  context: Reconnaissance is usually a setup step for further action. Children such as cmd.exe,
    powershell.exe, or certutil.exe spawned by this wmic process, or additional discovery and
    transfer tooling immediately after, point to a hands-on sequence rather than a single isolated
    inventory query.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding the wmic
    process query reveals what led to it and what followed, and whether it is one step in a larger
    sequence of reconnaissance, privilege escalation, or staging. Process enumeration often runs
    alongside other discovery commands; novel parent-child pairs at low counts stand out against
    repetitive agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run wmic?
  context: A binary that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts of wmic on this host indicate first-time or rare
    use and raise the weight of the detected enumeration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this wmic process-query pattern, what parents and
    users normally drive it, and does the current alert fit?
  context: Even routine tooling can be abused. The query mirrors the rule's selection scoped to
    this host, so the parent and user distribution reflects how this specific process-enumeration
    pattern has historically run here rather than generic wmic usage. A new parent process, an
    unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: process
      filter_main_creation:
        CommandLine|contains|all:
        - call
        - create
      filter_main_terminate:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: process
      filter_main_creation:
        CommandLine|contains|all:
        - call
        - create
      filter_main_terminate:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: process
      filter_main_creation:
        CommandLine|contains|all:
        - call
        - create
      filter_main_terminate:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or actions on
    multiple endpoints. If the same user drove similar enumeration or other discovery tooling on
    several machines, the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: process
      filter_main_creation:
        CommandLine|contains|all:
        - call
        - create
      filter_main_terminate:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Reconnaissance rarely happens in isolation. Earlier detections on the same host, such
    as initial access, defense tampering, or other discovery commands, may reveal the stages that
    preceded this enumeration and help place it in the attack timeline. Process discovery is often
    one step in a chain that continues toward credential access or lateral movement.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. wmic is used here
    for discovery and is also a proxy-execution LOLBin, so check whether other enumeration and
    proxy-execution binaries such as rundll32, regsvr32, mshta, msbuild, or installutil were also
    run on the host. Finding multiple LOLBins working toward the same objective strengthens the
    case for operator activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic executed from its expected System32 or SysWOW64 path?
  context: A LOLBin executed from a non-standard path may have been copied or renamed to evade
    path-based allowlists. wmic.exe running from a user's temp or AppData directory, rather than
    System32 or the wbem subdirectory under SysWOW64, is more suspicious than one in its normal
    location. Compare Image to OriginalFileName to confirm the on-disk name and path match the
    genuine binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this wmic process-query pattern over the past 90 days,
    and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly
    under stable parents. The query mirrors the rule's selection scoped to this host, so the count
    reflects this specific process-enumeration pattern rather than generic wmic usage. The
    command-line projection lets the analyst compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains: process
      filter_main_creation:
        CommandLine|contains|all:
        - call
        - create
      filter_main_terminate:
        CommandLine|contains|all:
        - call
        - terminate
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
