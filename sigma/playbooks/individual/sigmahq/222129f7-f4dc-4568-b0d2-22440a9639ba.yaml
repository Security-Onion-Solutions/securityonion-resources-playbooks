- question: What child processes did cloudflared spawn afterward?
  context: >-
    The processes spawned by the tunnel agent reveal its actual impact. The legitimate agent typically spawns
    little, while a deployment that pairs the tunnel with hands-on-keyboard activity may show command shells,
    archive utilities, or discovery tools running from the same parent shortly after the tunnel comes up.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the tunnel launch reveals the immediate context:
    what led to it, what followed, and whether it is part of a larger sequence. Aggregating by parent and child
    image collapses repetitive agent telemetry while novel parent-child pairs — reconnaissance, archive staging,
    or remote-access tooling — stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this tunnel pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this firing pattern rather than generic cloudflared usage. Many hosts firing the same pattern points to
    scripted deployment or sanctioned automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
