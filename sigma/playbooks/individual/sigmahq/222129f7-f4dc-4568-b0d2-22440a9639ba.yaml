- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A covert tunnel is often a mid-stage step rather than the first action. Earlier detections on the same host
    — reconnaissance, credential access, defense tampering, or remote-execution activity — may reveal the stages
    that preceded the tunnel and help reconstruct the timeline. Reviewing the alert sequence on the host situates
    this event in the larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
