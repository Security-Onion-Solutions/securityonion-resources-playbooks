name: Potential Defense Evasion Activity Via Emoji Usage In CommandLine - 4
id: f4ef35c5-6db3-4606-a28f-06c9be0a4af3
description: |
  Detects a process whose command line contains at least one character drawn from a large list of
  emoji and pictographic Unicode code points (geometric blocks, flags, clock faces, dingbats, arrows,
  hieroglyphs, and multi-codepoint sequences joined by zero-width joiners and variation selectors).
  The rule constrains no binary and no parent — the command line content is the only criterion, so
  the alerting program can be any process on the host. Command interpreters treat most of these
  characters as ordinary literals, which makes them usable as filler in variable names, string
  concatenation, and delimiter tricks that break signature matching on the underlying command, while
  the same characters also appear legitimately in chat clients, localization tooling, build scripts,
  and file names a user chose. The investigation should reconstruct the command that actually
  executed once the pictographic characters are accounted for, establish whether the program and
  parent chain explain their presence, and determine whether the same command line appears elsewhere
  on the host or fleet.
type: detection
detection_id: 225274c4-8dd1-40db-9e09-71dff4f6fb3c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line contain one of the emoji or pictographic characters this rule lists, and which one?
  context: >-
    The rule fires on a single criterion: the command line contains any one character from a list of
    roughly 745 emoji and pictographic code points. Read the exact command line and identify which
    character matched and where it sits, because a character inside a quoted file name or a chat
    message argument reads very differently from one used as a token separator inside a command
    string. Some list members are multi-codepoint sequences, so a rendering client may collapse them
    into one glyph — inspect the raw bytes if the match is not obvious.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run commands that carry emoji or pictographic characters?
  context: >-
    Some roles produce these characters routinely: developers and localization staff test Unicode
    handling, chat and collaboration clients pass message text on argument lists, and build or
    packaging scripts embed decorative markers in console output. Knowing whether the account and the
    host function fit one of those profiles is usually the fastest way to separate routine work from
    an obfuscated command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: With the pictographic characters accounted for, what command actually executed?
  context: >-
    Reconstruct the operation: strip or substitute the pictographic characters, resolve any variable
    expansion, concatenation, or caret and backtick escaping around them, and decode any base64 or
    URL-encoded payload that remains. The characters themselves carry no execution semantics, so what
    matters is the command left underneath — a download, an interpreter invocation, a credential
    dump, or ordinary text a user typed. The query is anchored on the alerting process so the working
    directory is available alongside the full argument list.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which program received this command line, and does its identity and integrity level fit the content?
  context: >-
    Because the rule constrains no binary, the alerting program is whatever happened to be invoked.
    A command interpreter or script host receiving pictographic filler is a different situation from
    a chat client or text editor receiving message text. Compare the on-disk name against the
    compiled original file name for a renamed binary, and note the integrity level, since an elevated
    interpreter carrying obfuscated arguments narrows the investigation considerably.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - IntegrityLevel
- question: What process spawned this command, and does that parent explain the pictographic characters?
  context: >-
    The parent reveals how the command line was constructed. A shell under explorer.exe points to a
    person typing or pasting the text, while a browser, mail client, Office application, script host,
    or scheduled-task host points to the argument list being assembled programmatically. The parent's
    own command line often carries the script or document that generated the alerting string. The
    long lookback is intentional — interactive shells and service parents commonly start hours or
    days before the child event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this command spawn afterward?
  context: >-
    The children reveal what the command line accomplished once it was interpreted. Obfuscation is a
    delivery wrapper rather than an end state, so the payload usually appears as a follow-on process:
    a script host, an archiver, a download utility, or a credential-access tool. Anchoring on the
    alerting process identifier keeps this to actual descendants rather than every execution of the
    same binary on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the alerting process make outbound network connections?
  context: >-
    Obfuscated command lines frequently wrap a retrieval step, so egress from the process itself
    indicates the command reached a remote host. Correlating on the process identifier ties any
    connection to this specific execution rather than to the binary generally. External destinations
    on ports that the program does not normally use, or connections to raw addresses rather than
    resolved names, are the entries worth pursuing.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did the alerting process write any files to disk?
  context: >-
    A reconstructed command that resolves to a download, an extraction, or a staging step leaves file
    writes attributable to the same process identifier. Writes into user-writable directories such as
    the profile tree, the public folder, or temporary locations are the ones worth following, since
    those paths are where a retrieved payload typically lands before it executes.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
- question: Has this exact command line run on this host before?
  context: >-
    The rule pins no binary, so a frequency count on the program name answers little here — what
    matters is whether this specific argument string is part of the host's routine. A command line
    that recurs on a regular cadence over months, under the same account, generally belongs to
    installed software or a scheduled job. A first-ever occurrence points to something introduced
    recently. Note which accounts have run it, since a string that normally appears under a service
    account and now appears under a person is a change worth explaining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - User
- question: Has this exact command line ever appeared on any other host in the fleet?
  context: >-
    Scoping the identical argument string fleet-wide over a long window distinguishes deployed
    software and standard automation, which produce the same string across many hosts over months,
    from activity confined to this host. A string that appears on a handful of hosts only in recent
    days, rather than steadily across the estate, points to something introduced by an operator or a
    tool rather than by the environment's normal software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other tools ran on this host around the same time?
  context: >-
    Obfuscated execution rarely stands alone. The surrounding process activity commonly shows what
    preceded and followed it — reconnaissance utilities, archivers, credential tooling, or
    persistence installers — and gives the alerting command a place in the sequence. The aggregation
    collapses repetitive agent and service telemetry into high-count rows so that infrequent programs
    stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Grouping by program and parent shows the parent-child relationships active on the host in the
    alert window. Repetitive background telemetry collapses into a few high-count rows, while novel
    pairings appear at low counts — an office application or browser launching an interpreter, or a
    service host launching a shell, is the kind of pairing that gives the alerting command its
    context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a sequence. Defense tampering,
    reconnaissance, or credential access preceding an obfuscated command line suggests the command is
    a later stage of activity already underway rather than an isolated event, and the earlier alerts
    usually name the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account across all hosts in the alert window shows whether the activity is confined
    to this endpoint or the same account is active on several at once. Concurrent execution across
    multiple hosts under one account points to remote administration or lateral movement. If the
    alert fired under a service or machine account, expect this view to return background telemetry
    from every host, and rely on the fleet-wide command-line pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same command line run on other hosts within the alert window?
  context: >-
    Under a service or machine account, a user-scoped sweep returns agent telemetry from every
    endpoint, so the meaningful question is whether the identical argument string executed elsewhere
    at the same time. Several hosts producing it within the same window points to a pushed or
    scheduled rollout; a single host points to a local trigger such as one person or one document on
    this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
- question: Is there software or a business process on this host that legitimately emits these characters on a command line?
  context: >-
    Collaboration and chat clients, localization and internationalization test suites, build and
    packaging scripts that decorate console output, and user-chosen file and folder names all put
    emoji and pictographic characters onto argument lists as a normal matter. Confirm against the
    software inventory, recent change records, and the owner of the host or account whether one of
    those explains this execution; a named owner and a matching change record close the alert, while
    an unexplained string on a server or a service account does not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
