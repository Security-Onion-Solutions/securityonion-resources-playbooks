name: Suspicious Service DACL Modification Via Set-Service Cmdlet - PS
id: a05e57bc-a86e-43af-95ad-3c04651b8731
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  combines a Set-Service security-descriptor parameter ('-SecurityDescriptorSddl ' or its
  '-sd ' alias) with 'Set-Service ' and an SDDL deny entry ('D;;') naming interactive users
  (;;;IU), service logon accounts (;;;SU), built-in administrators (;;;BA), SYSTEM (;;;SY),
  or everyone (;;;WD). Rewriting a service's DACL this way denies query and enumerate
  rights, hiding the service from sc.exe, Get-Service, and the services console while it
  keeps running - a concealment step that protects an existing persistence mechanism; the
  -SecurityDescriptorSddl parameter exists only in PowerShell 7's Set-Service, and rare
  hardening scripts set service SDDLs deliberately. The investigation should recover the
  full script, identify the target service and what its SDDL grants or denies, confirm the
  change in the services registry hive, and establish whether the account, timing, and
  fleet distribution fit approved administration.
type: detection
detection_id: 22d80745-6f2c-46da-826b-77adaededd74
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain a Set-Service call with an SDDL deny entry this rule detects?
  context: >-
    The rule fires only when both parts appear in the block content: a security-descriptor
    parameter ('-SecurityDescriptorSddl ' or its '-sd ' alias) AND 'Set-Service ' together
    with an SDDL deny entry ('D;;') naming one of the principals ;;;IU (interactive users),
    ;;;SU (service logon accounts), ;;;BA (built-in administrators), ;;;SY (SYSTEM), or
    ;;;WD (everyone). Long scripts are split across multiple 4104 events, so judge the
    match on every chunk of the alerting block. Because matching is content-based,
    fragments of a longer script can combine into a match that was never one statement -
    the rule's stated false-positive mode - so confirm the parameter and the deny string
    belong to the same Set-Service invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user expected to manage Windows services with PowerShell on this host?
  context: >-
    Changing a service's security descriptor is an administrator-level action, and the
    accounts permitted to modify service configurations should be a short, known list in
    most environments. Check the user's role, the host's function, and the on-disk script
    path shown here against known automation and hardening baselines. A SYSTEM user usually
    means deployment tooling or a vendor agent - judge by the host role and the script path
    rather than the account alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was there a change ticket or documented approval for this service security-descriptor change?
  context: >-
    Deliberately restricting a service's DACL is occasionally legitimate hardening, and the
    rule's known false positives are rare intended uses of hidden services. A matching
    change ticket or maintenance-window record pointing at the same service quickly closes
    the alert; absence of one when policy requires it means the change was unauthorized.
    The query lists the user's PowerShell executions on this host for correlation with the
    ticket timeline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
    - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What does the complete script do, and which service's security descriptor does it rewrite?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the complete
    script. The 4104 channel records what PowerShell compiles, so -EncodedCommand wrappers
    arrive already decoded; only in-script obfuscation such as string concatenation, format
    operators, and backticks still needs manual unwrapping. Identify the service Set-Service
    targets (the -Name argument or a piped service object), then parse the SDDL string:
    deny entries ('D;;...') that strip list and read rights from interactive users,
    administrators, SYSTEM, or everyone are what hide a service from sc.exe and
    Get-Service, while allow entries ('A;;...') granting an unexpected SID start/stop or
    change-config rights hand that account control of the service. Also note any
    New-Service call, binary paths, credentials, or download activity in the surrounding
    script - they identify what the concealed service runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what created it?
  context: >-
    When the script block ran from a file, its path is recorded on the 4104 event. A
    service-tampering script on disk in a user-writable or staging location (Temp, AppData,
    ProgramData, Downloads) implies a delivery step that wrote it - find the file-creation
    event to identify the process and account that staged it. No recorded path means
    interactive or in-memory execution, which for a DACL-rewriting block is itself worth
    noting: typing or injecting the command without a file is a deliberate evasion choice.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Which service registry keys were modified on this host around the alert?
  context: >-
    A DACL set through the Service Control Manager persists under the service's Security
    subkey in the services hive, and execution-flow hijacks also touch ImagePath,
    ServiceDll, FailureCommand, and Parameters values - so this listing names the service
    the script targeted and any accompanying reconfiguration. Compare what changed against
    the service's expected configuration, and treat ImagePath or ServiceDll values pointing
    outside expected system directories as the execution-flow deviation this technique
    produces. The Security value stores a binary security descriptor, so its value-data
    column is often empty - the key path itself names the service; registry telemetry may
    also not capture every services-hive write, so an empty result does not rule the change
    out.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      selection_keys:
        TargetObject|contains:
          - '\Security'
          - '\ImagePath'
          - '\ServiceDll'
          - '\FailureCommand'
          - '\Parameters'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
      - User
  answer_sources:
  - alert
  - organizational_knowledge
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Attackers often disable or bypass PowerShell defenses before running tampering
    commands. Common precursors include AMSI bypass (patching amsi.dll via AmsiUtils or
    amsiInitFailed), execution-policy overrides (-ExecutionPolicy Bypass, -ep bypass),
    real-time protection changes (Set-MpPreference, DisableRealtimeMonitoring), and
    downgrade to PowerShell version 2, which lacks script block logging. Any of these on
    the host in the preceding hour reads as preparation for the alerting block rather than
    routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the PowerShell session spawn follow-on activity after the script ran?
  context: >-
    A 4104 event records script content, not outcome. Children of the same user's
    PowerShell hosts shortly after the block show what the session did next - sc.exe or
    net.exe touching the service, the concealed service's binary starting, or further
    staging and cleanup. The -SecurityDescriptorSddl parameter works only in PowerShell 7,
    so children of pwsh.exe are particularly relevant here. The 4104 event carries no
    process link, so this pivots by host, user, and time; under SYSTEM the user anchor is
    broad because deployment tooling shares it - weigh individual children rather than the
    raw count.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block - reconnaissance, staging, and
    follow-on tooling produce a cluster of script blocks in a short window, and surrounding
    blocks often carry the plaintext the alerting fragment lacks: the New-Service call that
    created the service being hidden, the payload path, or the service name. The log.level
    column shows how complete this picture is - verbose events mean full Script Block
    Logging is on, while warning-only means the host records just the automatically-flagged
    subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The aggregated parent-child pairs collapse routine agent noise into high-count rows
    while novel pairs stand out at low counts. Around a service-concealment block, look for
    service control tooling (sc.exe, the services console), installer or staging activity,
    and unfamiliar binaries running as children of services.exe - the concealed service
    itself executing.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Hiding a service typically comes after the service exists - installation, defense
    tampering, or credential access in the preceding hours mark the stages that led up to
    the concealment step and help reconstruct the timeline. Earlier service-creation or
    persistence detections on this host are the most direct precursors to look for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it
    is not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it - surrounding benign-looking blocks may simply not have been
    logged, and absence of other 4104 evidence is not absence of activity. The level
    distribution calibrates how much weight every other script-block query in this
    investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Has this exact script block run on this host before?
  context: >-
    The hash matches byte-identical content only, so zero history is strong evidence this
    exact script is new to the host, while a block recurring for months fits hardening
    automation or vendor tooling. A trivially edited variant hashes differently, so history
    says nothing about near-variants. On hosts without full Script Block Logging the
    history contains only automatically-flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user previously produced this Set-Service SDDL pattern, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user - their 90-day history of
    script blocks combining Set-Service with SDDL deny strings, aggregated by host. A
    platform or security engineer who runs service-hardening automation may produce this
    pattern legitimately; a first-ever occurrence from an account whose role involves no
    service administration reads differently. Weigh the count against whether this account
    is among those permitted to modify service configurations.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_sddl_flag:
        ScriptBlockText|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        ScriptBlockText|contains|all:
        - 'Set-Service '
        - D;;
        ScriptBlockText|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this Set-Service SDDL pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so
    the pattern itself is the pivot. The query mirrors the rule's selection fleet-wide over
    90 days, aggregated by host. A pattern appearing routinely across many hosts fits
    deployed hardening automation or a vendor product; one that has never appeared before,
    or only on this host, is the deviation worth chasing. Only hosts shipping the
    PowerShell channel (and, for non-flagged content, with full Script Block Logging
    enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_sddl_flag:
        ScriptBlockText|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        ScriptBlockText|contains|all:
        - 'Set-Service '
        - D;;
        ScriptBlockText|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the service tampering
    may be one step of movement between them, and the per-host binary summary shows what
    else the account ran. When the alert fired under SYSTEM or another service principal
    this view fills with routine service activity - in that case the fleet-wide
    script-pattern question is the meaningful breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same Set-Service SDDL pattern fire on other hosts in this window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host - the meaningful breadth check when user identity is a service principal and no
    process identity exists on this channel. Several hosts in the same window points to
    scheduled or pushed automation, which change records should corroborate; a single host
    points to a host-local trigger. Coverage is policy-gated per host, so absence elsewhere
    is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_sddl_flag:
        ScriptBlockText|contains:
        - '-SecurityDescriptorSddl '
        - '-sd '
      selection_set_service:
        ScriptBlockText|contains|all:
        - 'Set-Service '
        - D;;
        ScriptBlockText|contains:
        - ;;;IU
        - ;;;SU
        - ;;;BA
        - ;;;SY
        - ;;;WD
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: Were other persistence mechanisms installed on this host around the alert?
  context: >-
    An attacker who hides a service is protecting a persistence mechanism that already
    exists - and rarely relies on just one. This survey aggregates persistence tooling on
    the host across the surrounding hours: scheduled tasks, service and registry tools,
    BITS jobs, WMI, plus PowerShell service commands (New-Service, Set-Service) visible on
    the command line. Multiple installations in the window point to intentional stacking
    rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      selection_ps_service:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains:
          - 'New-Service'
          - 'Set-Service'
      condition: selection and (selection_persist or selection_ps_service)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
