name: Registry-Free Process Scope COR_PROFILER
id: c899440c-1d5f-4434-912b-af2ec00e0ab8
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) that reference all
  three .NET profiling environment variables together — $env:COR_ENABLE_PROFILING,
  $env:COR_PROFILER, and $env:COR_PROFILER_PATH — the registry-free process-scope variant of
  COR_PROFILER hijacking (T1574.012). When these variables are set in a process's
  environment, the CLR loads the unmanaged DLL named by COR_PROFILER_PATH into every .NET
  process started from that context, which attackers use for execution-flow hijacking,
  persistence, and elevation when the profiler is inherited by a higher-integrity .NET host;
  developers, performance engineers, and application-monitoring tooling set the same
  variables legitimately. The investigation should recover the full script and the DLL path
  and CLSID it assigns, determine whether the variables were also registered in the registry,
  whether the profiler DLL actually loaded into a CLR process, what the triggering session
  spawned afterward, and whether the pattern fits the user, host, and fleet baseline.
type: detection
detection_id: 23590215-4702-4a70-8805-8dc9e58314a2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the full script block reference all three COR_PROFILER environment variables the rule requires?
  context: >-
    The rule fires only when the script content contains $env:COR_ENABLE_PROFILING,
    $env:COR_PROFILER, and $env:COR_PROFILER_PATH together. Long scripts are split across
    multiple 4104 events, so retrieve every chunk of the alerting block (sequence/total
    order) and confirm all three references appear in the complete script rather than
    judging the alerting fragment alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run scripts that configure .NET CLR profiling?
  context: >-
    The COR_PROFILER variables are a documented .NET diagnostics feature. Developers,
    performance engineers, and application-monitoring agents set them legitimately, and
    blocks logged under SYSTEM often come from deployment or agent tooling. Check the
    user's role, the host's function (developer workstation or build server versus an
    ordinary endpoint), and the on-disk script path shown here against known tooling before
    treating the block as attacker activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the complete script do, and what DLL path and CLSID do the profiling variables receive?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the whole script.
    The 4104 channel records what PowerShell actually compiles, so -EncodedCommand wrappers
    are already unwrapped; string-level obfuscation inside the script (concatenation,
    format operators, backticks) still needs manual decoding. Recover the operational
    purpose — the DLL path assigned to COR_PROFILER_PATH, any CLSID assigned to
    COR_PROFILER, whether COR_ENABLE_PROFILING is set to 1, and what the script does
    afterward, since any .NET process it starts from that environment loads the named DLL
    when the CLR initializes. The DLL path and any URLs in the script are derived
    artifacts to chase.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what created it?
  context: >-
    When the script block ran from a file, its path is recorded on the 4104 event. A
    profiler-hijack script in a user-writable or staging location (Temp, AppData,
    ProgramData, Downloads) implies a delivery step that wrote it — find the file-creation
    event to identify the process and account that staged it. No recorded path means
    interactive or in-memory execution, which fits the registry-free variant's evasion
    intent of leaving nothing durable at this stage. The profiler DLL named by
    COR_PROFILER_PATH is a separate on-disk artifact; chase its creation using the path
    recovered from the script content.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Were the COR_PROFILER environment variables also written to the registry on this host?
  context: >-
    The detected variant sets the variables only in process memory, so an empty result is
    expected when the activity stayed registry-free. A hit means durable persistence — user
    scope writes COR_ENABLE_PROFILING, COR_PROFILER, and COR_PROFILER_PATH under
    HKCU\Environment (typically alongside a CLSID registered under
    Software\Classes\CLSID\...\InprocServer32), and system scope writes the same names
    under the HKLM Session Manager Environment key, where they affect every CLR-loading
    process after a restart. The value data shows the assigned CLSID or DLL path; also
    check whether the CLSID recovered from the script content has a matching InprocServer32
    registration.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'COR_ENABLE_PROFILING'
          - 'COR_PROFILER'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Did a process on this host load a DLL from a user-writable path around the time of the alert?
  context: >-
    When a process starts with the profiling variables set, the CLR loads the unmanaged DLL
    named by COR_PROFILER_PATH — the point where the hijack actually executes. Look for the
    DLL path recovered from the script content loading into a .NET-capable host, and weigh
    signature status. Legitimate profilers ship with development and monitoring products
    (Visual Studio, APM agents) and load from their install directories, while an unsigned
    DLL loading from Temp, AppData, ProgramData, or another user-writable path into a
    CLR host is the hijack executing. The load typically follows within minutes of the
    variables being set; an empty window may also mean the trigger process has not run yet.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\Users\'
          - '\ProgramData\'
          - '\Windows\Temp\'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the PowerShell session spawn follow-on processes after the script ran?
  context: >-
    Registry-free process scope only takes effect when a new process loads the CLR after
    the variables are set — the pattern is to start another .NET-capable process, even a
    trivial one, purely to trigger the profiler DLL. A 4104 event records script content,
    not outcome, and carries no process link, so this pivots by host, user, and time.
    Children of the user's PowerShell hosts shortly after the block show the trigger
    process and anything the profiler payload launched, including higher-integrity children
    when the variables were aimed at an auto-elevating .NET binary. SYSTEM-owned alerts
    make the user anchor broad because deployment tooling shares it — weigh individual
    children rather than the raw count.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Profiler hijacks are often staged alongside broader evasion. Common precursors include
    AMSI bypass (patching amsi.dll via AmsiUtils or amsiInitFailed), execution-policy
    overrides (-ExecutionPolicy Bypass, -ep bypass), real-time monitoring changes
    (Set-MpPreference, DisableRealtimeMonitoring), and downgrade to PowerShell version 2,
    which lacks script block logging. Any of these on the host in the preceding hour reads
    as preparation for the alerting block rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block. Staging the profiler DLL, setting
    the variables, and triggering a CLR load produce a cluster of script blocks in a short
    window, and surrounding blocks often contain plaintext the alerting fragment lacks,
    such as the DLL's download or write step. The log.level column shows how complete this
    picture is — verbose events mean full Script Block Logging is on, while warning-only
    means the host records just the automatically-flagged subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or only suspicious-content capture?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it
    is not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it, and absence of other 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-block query in
    this investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The aggregated parent-child pairs collapse routine agent noise into high-count rows
    while novel pairs stand out at low counts. Around a profiler hijack, look for delivery
    (browsers or office applications spawning script hosts), staging (archivers or
    downloaders that wrote the DLL), and unexpected children of .NET applications after the
    variables were set.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Defense tampering, reconnaissance, or credential-access detections in the preceding
    hours reveal the stages that led up to this activity and help reconstruct the timeline.
    Persistence installation typically arrives after initial access and delivery steps, so
    earlier alerts often mark where the activity began.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this exact script block run on this host before?
  context: >-
    The hash matches byte-identical content only, so zero history is strong evidence this
    exact script is new to the host, while a block that has recurred for months fits
    deployment tooling or diagnostic automation. A trivially edited variant hashes
    differently, so history says nothing about near-variants. On hosts without full Script
    Block Logging the history contains only automatically-flagged blocks, which weakens an
    empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user produced scripts referencing the COR_PROFILER variables before, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user — their 90-day history of
    script blocks referencing all three profiling variables, aggregated by host. Developers
    and performance engineers may produce this pattern routinely; a first-ever occurrence
    from a user whose role involves no .NET diagnostics reads differently. Weigh the count
    against what the user's job plausibly involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - $env:COR_ENABLE_PROFILING
        - $env:COR_PROFILER
        - $env:COR_PROFILER_PATH
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this script pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so
    the pattern itself is the pivot. The query mirrors the rule's selection fleet-wide over
    90 days, aggregated by host. A pattern that routinely appears on many hosts fits
    deployed diagnostic tooling or a monitoring product; one that has never appeared
    before, or only on this host, is the deviation worth chasing. Only hosts shipping the
    PowerShell channel (and, for non-flagged content, with full Script Block Logging
    enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - $env:COR_ENABLE_PROFILING
        - $env:COR_PROFILER
        - $env:COR_PROFILER_PATH
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the profiler-hijack
    script may be one step of movement between them, and the per-host binary summary shows
    what else the account ran. When the alert fired under SYSTEM or another service
    principal this view fills with routine service activity; in that case the fleet-wide
    script-pattern question is the meaningful breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same script pattern fire on other hosts in this window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host — the meaningful breadth check when the alert fires under a service principal and
    no process identity exists on this channel. Several hosts in the same window points to
    scheduled or pushed automation, which change records should corroborate; a single host
    points to a host-local trigger. Coverage is policy-gated per host, so absence elsewhere
    is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - $env:COR_ENABLE_PROFILING
        - $env:COR_PROFILER
        - $env:COR_PROFILER_PATH
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: Did this exact script block run on other hosts in the environment?
  context: >-
    Byte-identical content across many hosts points to deployment tooling, GPO logon
    scripts, or vendor agents; the same block on a small set of unrelated hosts is the
    distribution lateral movement produces. The hash complements the pattern-based fleet
    queries — it matches this exact script only, so together they distinguish a pushed
    file from a technique in broader use. Only hosts that logged the block can appear, so
    absence elsewhere on a default-logging fleet is weak evidence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - ps_script
