name: Suspicious Persistence Via VMwareToolBoxCmd.EXE VM State Change Script
id: 06ff9284-2c65-4447-a1b9-421eae51a04a
description: |
  Detects VMwareToolBoxCmd.exe invoked with the "script" and "set" arguments together while the command line also references a writable or staging directory (PerfLogs, Temp, Windows Tasks paths, or a per-user AppData\Local\Temp). The "script" subcommand registers a batch script to run on VM power-state transitions (power on, shutdown, resume, suspend); that configuration persists in a tools.conf file and the script later runs as a child of the VMware Tools service under SYSTEM, making this a signed-binary, registry-free persistence path. The rule fires only when the binary/name match AND the "script ... set" argument pair AND a suspicious-path substring all match, so confirm all three before treating the alert as a true positive. Legitimate operational power scripts exist in some environments, so the investigation should determine whether the referenced script path and the registering user/host are expected.
type: detection
detection_id: 236d8e89-ed95-4789-a982-36f4643738ba
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — VMwareToolBoxCmd.exe with both the 'script' and 'set' arguments and a suspicious script path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three conditions hold together — the binary is VMwareToolBoxCmd.exe (or OriginalFileName toolbox-cmd.exe), the command line contains both ' script ' and ' set ', AND it references one of the staging paths (PerfLogs, Temp, Windows\System32\Tasks, Windows\Tasks, Windows\Temp, or AppData\Local\Temp). Read the exact command line and confirm the script path it registers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register VM power-state scripts via VMware Tools?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role and host function are consistent with configuring VM state-change scripts is often the fastest path to distinguishing an approved operational hook from an attacker establishing persistence. Configuring power-state scripts is an uncommon action outside virtualization administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What script path and VM state did this command register? Decode the full command line.
  context: The full command line reveals which power-state hook was configured (power, shutdown, resume, suspend) and the exact script path the registration points to. A path inside PerfLogs, Temp, Windows Tasks directories, or a user AppData\Local\Temp folder is the load-bearing detail — the registered script runs later as a child of the VMware Tools service under SYSTEM, so the path identifies what would execute. Note any follow-on 'enable' invocation that activates the hook.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned VMwareToolBoxCmd.exe and is that parent chain expected?
  context: The parent process reveals how the registration was invoked. Interactive registration from explorer.exe or a console shell driven by an administrator differs from invocation by a script host, an Office application, or a remote-execution tool, any of which would point toward unattended or malicious setup of the persistence hook.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did VMwareToolBoxCmd.exe spawn afterward?
  context: The processes spawned around the registration reveal whether this was an isolated configuration action or part of a sequence. The registered script does not run at configuration time — it runs on the next VM power event as a child of the VMware Tools service — so also watch for the script path executing under a cmd.exe child of vmtoolsd.exe later, which is the canonical execution chain for this persistence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run VMwareToolBoxCmd.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. VMware Tools utilities run routinely on virtualized hosts, so a nonzero baseline is expected — the deviation worth chasing is the 'script ... set' usage specifically, not the binary's overall presence. Zero or very low counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even routine virtualization tooling can be abused. The query mirrors the rule's selection structure scoped to this host — the resulting parent and user distribution reflects how this specific 'script ... set' registration pattern has historically run here, not generic VMware Tools usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_bin_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_bin_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      selection_susp_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Does the timing of this registration align with normal work hours and maintenance windows?
  context: Legitimate system changes typically occur during business hours or scheduled maintenance windows. Registering a VM power-state script outside normal change windows — late at night or on a weekend with no documented maintenance — is more suspicious than the same action during an approved virtualization-maintenance window. Check the host timezone and whether the user normally works at this time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for registering this VM state-change script?
  context: Many organizations require change tickets for persistence-relevant modifications, including VM power-state hooks. A corresponding ticket suggests authorized virtualization administration; absence of one when policy requires it suggests the registration was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_bin_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_bin_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      selection_susp_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_bin_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_bin_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      selection_susp_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user registered similar persistence or ran related tooling on multiple hosts, the scope of the activity may be larger than this single registration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_bin_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_bin_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      selection_susp_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this registration, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or additional persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded the persistence registration and help reconstruct the full timeline. Establishing persistence is typically a mid-chain action, so prior activity often explains how the operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this 'script ... set' registration pattern, not generic usage of the VMware Tools binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_bin_img:
      - Image|endswith: \VMwareToolBoxCmd.exe
      - OriginalFileName: toolbox-cmd.exe
      selection_bin_cli:
        CommandLine|contains|all:
        - ' script '
        - ' set '
      selection_susp_paths:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Windows\System32\Tasks\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - \AppData\Local\Temp
      condition: all of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold (here, the VM state-change script hook), they commonly install backup mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File event monitoring captures these drops even when the operator avoids standard persistence tools, and complements the script-hook mechanism this alert detected.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
