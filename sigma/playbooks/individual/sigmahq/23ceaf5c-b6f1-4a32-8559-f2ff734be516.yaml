name: Dumping Process via Sqldumper.exe
id: 346531ab-6025-42e1-8b5a-a7608466ab71
description: |
  Detects the signed Microsoft SQL Server debugging utility sqldumper.exe running with a
  command line containing the minidump flags 0x0110 or 0x01100:40. These flags direct
  sqldumper.exe to produce a full process memory dump in a format readable by offline
  credential-extraction tooling; when the target is lsass.exe, the resulting .mdmp file
  yields cached credentials. Legitimate sqldumper.exe activity is driven by SQL Server
  diagnostics and runs under SQL service accounts; abuse repurposes the binary as a
  living-off-the-land alternative to dedicated dumpers. Determine which process was dumped,
  where the dump was written, what spawned the binary, and whether the dump was followed
  by access to other systems.
type: detection
detection_id: 23ceaf5c-b6f1-4a32-8559-f2ff734be516
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did sqldumper.exe run with the 0x0110 or 0x01100:40 minidump flag?
  context: Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact command line against the rule's criteria. The rule fires when an
    Image ending in sqldumper.exe carries a CommandLine containing 0x0110 or 0x01100:40.
    Note the leading numeric argument — the target process PID — and the dump format flag,
    because both drive the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run SQL Server memory-dump tooling?
  context: Legitimate sqldumper.exe activity is generated by SQL Server diagnostics on
    database hosts and runs under SQL service accounts. A dump invocation under an
    interactive user, on a host with no SQL Server role, or from an account that does not
    administer databases is the disposition driver here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which process was dumped, and was lsass.exe the target?
  context: sqldumper.exe takes the target PID as its first command-line argument and the
    0x01100:40 flag produces a Mimikatz-compatible dump. Resolve the PID in the command
    line to a process name at alert time — a dump of lsass.exe is credential theft, while a
    dump of sqlservr.exe or a SQL diagnostic target is consistent with legitimate use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned sqldumper.exe, and is that parent chain expected?
  context: The parent reveals how the dump was invoked. SQL Server diagnostics launch
    sqldumper.exe from SQL service processes; invocation from a shell (cmd.exe,
    powershell.exe), a script host, or a remote-execution tool points to hands-on-keyboard
    abuse rather than database maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was a memory dump file written to disk around the time of the alert, and where?
  context: sqldumper.exe writes its output as an SQLDmprXXXX.mdmp file, by default in the
    invoking process working directory but redirectable to staging locations such as the
    user temp directory or C:\Windows\Temp. The presence, path, and size of the dump
    confirm the operation completed and tell the analyst what credential material left
    memory. A dump under a user-writable or temp path rather than a SQL diagnostics
    directory is the staging signal worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.mdmp'
          - '.dmp'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Which accounts may be exposed in the dump, and do any have elevated privileges?
  context: The severity of an lsass.exe dump depends on which credentials were resident in
    memory on this host — local sessions, domain accounts, or service accounts. Domain admin
    or service-account credentials require incident escalation; cross-reference the accounts
    that recently authenticated to this host against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What child processes did sqldumper.exe spawn afterward?
  context: A legitimate diagnostic dump spawns nothing further. Child processes following
    the dump — shells, archivers, copy or upload tooling — point to the operator collecting
    or exfiltrating the dump file rather than reading it locally for diagnostics.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run sqldumper.exe?
  context: A host that has never run sqldumper.exe is more suspicious than a SQL Server
    host where the binary runs regularly during diagnostics. Zero or very low historical
    counts indicate first-time or rare execution and weigh toward investigation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run sqldumper.exe with these minidump flags, what
    parents and users drove it, and does the current alert fit that pattern?
  context: Even on SQL Server hosts the dump flags should map to a consistent diagnostic
    parent and account. The query mirrors the rule's selection scoped to this host, so the
    parent/user distribution reflects the rule's specific firing pattern. A new parent
    process, an unexpected account, or a first-ever appearance of these flags is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sqldumper.exe
        CommandLine|contains:
        - '0x0110'
        - 0x01100:40
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time as the dump?
  context: Credential dumping rarely occurs in isolation. Activity surrounding the dump may
    reveal reconnaissance, privilege escalation, or staging that frames the operation. Scan
    for low-count, novel binaries against the high-count routine background.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts run sqldumper.exe with these minidump flags in the past week,
    and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide
    count of this specific firing pattern. Many hosts firing the same pattern points to a
    scripted SQL maintenance job or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sqldumper.exe
        CommandLine|contains:
        - '0x0110'
        - 0x01100:40
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sqldumper.exe
        CommandLine|contains:
        - '0x0110'
        - 0x01100:40
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sqldumper.exe
        CommandLine|contains:
        - '0x0110'
        - 0x01100:40
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    parallel activity on multiple endpoints. If the same user triggered similar activity on
    several hosts, the scope of the credential-access operation may be larger than this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \sqldumper.exe
        CommandLine|contains:
        - '0x0110'
        - 0x01100:40
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    privilege escalation — may reveal the stages that preceded the dump and help reconstruct
    the timeline. Credential access late in a sequence often indicates an operator who has
    already established a foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
