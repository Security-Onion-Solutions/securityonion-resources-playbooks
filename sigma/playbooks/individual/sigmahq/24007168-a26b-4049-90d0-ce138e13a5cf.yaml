name: Lazarus APT DLL Sideloading Activity
id: 518e194d-140e-4db1-be90-8600e56f075d
description: |
  Detects DLL sideloading associated with a Lazarus intrusion set, in which a legitimate signed executable loads a
  specifically named trojanized library planted beside it in a non-standard directory. The rule fires when EITHER
  PresentationHost.exe loads mscoree.dll from a \ProgramShared path, OR colorcpl.exe loads colorui.dll from
  C:\ProgramData\Adobe, OR fixmapi.exe loads mapistub.dll from C:\ProgramData\Oracle\Java, OR tabcal.exe loads HID.dll
  from C:\ProgramData\Adobe\ARM — each branch matches only when its loading process and module path match together.
  DLL sideloading runs attacker code inside a trusted signed process by placing a malicious library where that
  process's search order resolves it; the planted DLL here decrypts and executes a follow-on downloader or backdoor
  stage. Investigation should confirm which loader/DLL pair fired and the module's path, signature, and hash on the
  load event, identify the process that wrote the DLL to disk, and check for follow-on execution and additional
  persistence on the host.
type: detection
detection_id: 24007168-a26b-4049-90d0-ce138e13a5cf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status,
    and the process that loaded it against the rule's criteria. The rule fires on four specific loader/DLL pairs
    (PresentationHost.exe with mscoree.dll, colorcpl.exe with colorui.dll, fixmapi.exe with mapistub.dll, tabcal.exe
    with HID.dll), each matching only when the loader and the module path line up together — note which pair fired,
    because that pair identifies the expected loader and the directory the module was planted in. Library events carry
    the module's hash and signing status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run the loading application that pulled in this module?
  context: >-
    Legitimate loads of these modules occur only where the paired application is genuinely installed and run. The
    loading binaries here are ordinary Windows or third-party utilities, but the specific module and directory the rule
    matches are not part of any normal install, so a load on a host or user whose role does not involve that application
    is far more likely to be a planted side-load than routine use. Confirm whether the user role and host function are
    consistent with running that application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other modules did the loading process pull in, and are any from user-writable or non-standard directories?
  context: >-
    The full set of modules a process loads exposes a staged side-load the alerting event alone does not. Look for other
    DLLs loaded from user-writable locations such as ProgramData, AppData, Public, or a temp directory; unsigned modules
    sitting where signed ones are expected; and system DLL names loaded from non-system paths. A cluster of non-canonical
    loads in the same process points to a multi-module side-load set rather than an isolated event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the loaded module, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a benign third-party DLL from a sideloaded malicious one. The genuine system or vendor
    versions of these library names are signed; an unsigned module, or one carrying a signature that is expired,
    distrusted, or invalid, sitting in a ProgramData or ProgramShared directory is a strong masquerade indicator. The
    hash on the load event supports a threat-intel lookup that can surface a known loader, and a baseline hash of the
    legitimate module is the direct comparison point for detecting substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: Which process loaded this module, and does it run from its expected install location?
  context: >-
    Sideloading works by having a trusted, signed executable load the planted library, so the identity and location of
    the loading process are decisive. Determine whether the loader is a genuine copy of the paired binary running from
    its normal install path, a relocated or renamed signed binary staged alongside the module in a user-writable
    directory, or an unrelated process. These campaigns stage the legitimate loader and the malicious DLL together in the
    same non-standard directory, so a loader running from ProgramData or ProgramShared rather than System32 or its normal
    program-files path is the sideloading pattern this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the loader, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the side-load was launched. A benign run of these utilities typically
    traces to explorer.exe or a user shell; a loader started by an archive utility, a script host, a removable-media
    launcher, or an unfamiliar dropper points to attacker-driven execution. This chain is commonly seeded by a
    user-executed lure that drops the loader and module, so walk the parent chain to see what initiated the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote this module to disk, and when relative to the load?
  context: >-
    Sideloading requires the attacker-controlled library to be placed on disk before a trusted binary loads it. Identify
    the process that created the module file and where it was written. A write by a genuine installer or updater into a
    canonical program directory is expected; a write by an archive tool, script host, or dropper into a ProgramData or
    ProgramShared path shortly before the load is the plant step of the side-load. The gap between the write and the load
    frames the correlation window for the rest of the activity on this host.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the loaded module still on disk for analysis?
  context: >-
    If the sideloaded module is still present, it can be hashed, submitted to a sandbox, or reviewed statically.
    Checking for files written by the alerting process or its direct children confirms whether the DLL and any staged
    payloads remain available or were already removed after execution, which itself is a cleanup signal worth recording.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were registry autostart or execution-hijack keys modified on this host around the alert?
  context: >-
    Beyond the file-based side-load, hijack-execution-flow activity often anchors persistence or redirection in the
    registry. Modifications to Run and RunOnce autostart values or Image File Execution Options keys around the time of
    the load point to a second, registry-based foothold installed alongside the sideloaded module. These values are also
    changed by legitimate software deployment, so weigh any hit against the writing process and its timing relative to
    the load rather than treating it as malicious on its own. Registry key deletion is not observable here, so focus on
    what was added or modified.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Image File Execution Options\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Has this module been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If the same module name has
    loaded repeatedly under the same genuine binary over the prior 90 days, this load is more likely routine. If this is
    the first occurrence, or the module has historically loaded only under different processes or from different
    directories, the current load is anomalous and consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's four loader/module pairs with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic usage of these binaries. Several hosts firing the same pair points to
    scripted deployment across an environment; a single host or a small unrelated set points to a targeted, hands-on
    operation. Use the host distribution and which pairs appear to gauge the spread of the activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection_mscoree:
        Image: C:\ProgramShared\PresentationHost.exe
        ImageLoaded: :\ProgramShared\mscoree.dll
      selection_colorui:
        Image: C:\ProgramData\Adobe\colorcpl.exe
        ImageLoaded: C:\ProgramData\Adobe\colorui.dll
      selection_mapistub:
        Image: C:\ProgramData\Oracle\Java\fixmapi.exe
        ImageLoaded: C:\ProgramData\Oracle\Java\mapistub.dll
      selection_hid:
        Image: C:\ProgramData\Adobe\ARM\tabcal.exe
        ImageLoaded: C:\ProgramData\Adobe\ARM\HID.dll
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: When this host has previously matched this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's four loader/module pairs scoped to this host, so the resulting
    program and user distribution reflects how this specific firing pattern has run here
    historically rather than generic binary usage. A new acting program process, an unexpected
    user account, or a first-ever appearance of the pattern on this host is the anomaly worth
    chasing, since a genuine environment rarely produces these exact loader/module pairs at all.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection_mscoree:
        Image: C:\ProgramShared\PresentationHost.exe
        ImageLoaded: :\ProgramShared\mscoree.dll
      selection_colorui:
        Image: C:\ProgramData\Adobe\colorcpl.exe
        ImageLoaded: C:\ProgramData\Adobe\colorui.dll
      selection_mapistub:
        Image: C:\ProgramData\Oracle\Java\fixmapi.exe
        ImageLoaded: C:\ProgramData\Oracle\Java\mapistub.dll
      selection_hid:
        Image: C:\ProgramData\Adobe\ARM\tabcal.exe
        ImageLoaded: C:\ProgramData\Adobe\ARM\HID.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is one stage in a chain, and the load event rarely stands alone. Examining process activity in a tight
    window around the load reveals what launched the loader, what the sideloaded module did next, and whether file
    writes, registry changes, and the load line up on the same short timeline. Look for dropper execution, defense
    tampering, and persistence installation in the same interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load. A user-execution lure,
    reconnaissance, or defense tampering ahead of this event helps reconstruct the timeline and shows whether the load is
    an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Is this sideloading activity part of an authorized red team engagement emulating this actor?
  context: >-
    The rule matches loader/module pairs that have no legitimate counterpart, so the one benign scenario that can
    reproduce them is a red team or adversary-emulation exercise deliberately replicating this DLL-sideloading chain.
    Before investing further analysis, check whether such an engagement is active on this host or network segment. A
    documented exercise with matching tooling and timing resolves the alert; the absence of one leaves the activity
    unexplained and warranting the full investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that survives reboot is commonly paired with backup persistence. After establishing one foothold,
    operators frequently install additional mechanisms through scheduled tasks, services, registry Run keys, BITS jobs,
    or WMI subscriptions — this chain has been observed persisting a stage via a scheduled task under svchost. Several
    persistence installations in the same timeframe indicate intentional stacking rather than an isolated administrative
    action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File
    monitoring captures these drops even when the operator avoids standard persistence tooling, which is consistent with
    the stealth-focused staging seen in this side-load chain.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
