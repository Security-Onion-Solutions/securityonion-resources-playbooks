name: DLL Loaded via CertOC.EXE
id: 7de77167-3049-445c-b70e-f0dbe2b14b50
description: |
  Detects certoc.exe invoked with the -LoadDLL parameter, which causes the signed Microsoft binary to load and execute code from an arbitrary DLL. The rule fires when the process Image ends in certoc.exe (or its OriginalFileName is CertOC.exe) AND the command line contains -LoadDLL. certoc.exe is a living-off-the-land binary normally used to install certificates; the -LoadDLL switch turns it into a proxy execution mechanism comparable to regsvr32, and the same binary can also retrieve remote files. Investigation should confirm which DLL was loaded, where it came from (local path versus downloaded), what spawned certoc.exe, and whether the activity fits any legitimate certificate-management or automation baseline on this host.
type: detection
detection_id: 242301bc-f92f-4476-8718-78004a6efd9f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show certoc.exe running with the -LoadDLL parameter?
  context: Confirm the alert is a true positive by reviewing the exact command line and process identity. The rule fires when the binary resolves to certoc.exe (by Image or OriginalFileName) AND the command line contains -LoadDLL, so verify both the binary and the switch are present and note the DLL path that follows.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to load DLLs or install certificates via certoc.exe?
  context: Legitimate certoc.exe use centers on certificate installation, typically by administrators or provisioning tooling. If the user role and host function have no certificate-management or software-deployment purpose, the -LoadDLL invocation is harder to explain as routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which DLL did certoc.exe load, and where does that DLL live? Decode the full command line.
  context: The full command line names the DLL passed to -LoadDLL. Resolve the DLL path and determine whether it sits in a system directory, a user-writable location (Users, ProgramData, Temp, AppData), or a UNC/remote path. A DLL in a user-writable or recently created location is the artifact that distinguishes proxy execution of attacker code from legitimate certificate work.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the DLL actually loaded into certoc.exe, and is that module signed?
  context: Proxy execution completes when certoc.exe maps the target DLL into its address space. Pivot from the alerting process to image-load telemetry for certoc.exe on this host to confirm the load and to capture the loaded module's path and signature. An unsigned or user-path DLL loaded by a signed system binary is the core of this technique. If image-load events are not collected in this environment, treat the absence as a visibility gap and confirm the load from the command-line DLL path instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \certoc.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did certoc.exe make any outbound network connections around the time of the alert?
  context: The same binary can fetch remote files (the -GetCACAPS download capability), and a loaded DLL may itself initiate command-and-control. An outbound connection from certoc.exe is unusual for local certificate work and points to a downloaded payload or post-load network activity. If no network telemetry exists for the binary, that is a visibility gap rather than confirmation of none.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \certoc.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: What process spawned certoc.exe, and is that parent chain expected?
  context: The parent process reveals how certoc.exe was launched. Certificate provisioning is usually driven by management tooling, scripts, or interactive administrative sessions. Script hosts (wscript.exe, mshta.exe, powershell.exe), Office applications, or unsigned binaries as the parent point toward proxy execution staged by other tooling rather than routine certificate work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did certoc.exe spawn afterward?
  context: The processes spawned after the DLL is loaded reveal its actual impact. Legitimate certificate handling rarely spawns interactive shells or scripting tools; children such as cmd.exe, powershell.exe, rundll32.exe, or certutil.exe suggest the loaded DLL executed post-exploitation activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run certoc.exe?
  context: A binary that has never or rarely run on a host is more suspicious than one that runs regularly. Zero or very low historical counts over 90 days indicate first-time or rare certoc.exe execution; a steady baseline suggests provisioning automation worth confirming.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this certoc.exe -LoadDLL pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tools can be abused. This query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this specific firing pattern has historically run here rather than generic certoc.exe usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|windash: ' -LoadDLL '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this certoc.exe -LoadDLL pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the same firing pattern rather than generic certoc.exe usage. Many hosts firing the identical pattern points to scripted deployment or provisioning automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|windash: ' -LoadDLL '
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|windash: ' -LoadDLL '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|windash: ' -LoadDLL '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity on multiple endpoints. If the same user triggered similar activity elsewhere in the same window, the scope of the activity may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|windash: ' -LoadDLL '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
