name: Potential PSFactoryBuffer COM Hijacking
id: da94774e-d2c2-4475-8e03-5bb07b56c87c
description: |
  Detects the InProcServer32 default value under the PSFactoryBuffer COM CLSID (C90250F3-4D7D-4991-9B69-A5C5BC1C2AE6) being set to a DLL path other than the legitimate System32 ActXPrxy.dll. This CLSID normally resolves to C:\Windows\System32\ActXPrxy.dll and should essentially never change on a healthy host, so a rewrite pointing elsewhere redirects every process that instantiates this COM object into loading an attacker-supplied DLL — a Component Object Model hijack used for persistence and privilege escalation. Investigation should confirm the DLL path written to the key, verify whether that DLL is a legitimate signed system binary, determine whether it was dropped to disk and subsequently loaded or executed, and scope the host and fleet for related registry changes and additional persistence.
type: detection
detection_id: 243380fa-11eb-4141-af92-e14925e77c1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert show the PSFactoryBuffer CLSID InProcServer32 default value set to a DLL path other than the legitimate System32 ActXPrxy.dll?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the InProcServer32\(Default) value under CLSID {c90250f3-4d7d-4991-9b69-a5c5bc1c2ae6} is written AND the value data is NOT the legitimate C:\Windows\System32\ActXPrxy.dll (or its %windir% form). Review the exact key path (TargetObject) and the written value data (Details) in the alert against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify COM CLSID registration keys?
  context: Legitimate installers and system servicing occasionally re-register COM objects, but the PSFactoryBuffer InProcServer32 value is a core system registration that ordinary user or application activity does not touch. Knowing whether the writing account and host function are consistent with COM registration changes is often the fastest way to separate a true positive from routine servicing. If User is a machine account or missing, pivot on the writing process (Image).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL path was written to the InProcServer32 value, and does it point to a legitimate signed system location?
  context: The value data (Details) is the payload of a COM hijack — it is the DLL that will load whenever this CLSID is instantiated. Legitimate resolution is C:\Windows\System32\ActXPrxy.dll. Attacker-supplied paths typically sit in user-writable directories (Public\Libraries, AppData, ProgramData, Temp) and may carry unusual extensions such as .dll0 to sidestep extension-based controls. Read the path and treat any non-System32 or non-standard location as the DLL to run down.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the modified CLSID key a known COM-hijack persistence location, and what process wrote it?
  context: InProcServer32 under a CLSID names the in-process DLL that services that COM object; overwriting its default value is a recognized event-triggered-execution persistence and privilege-escalation primitive because COM-consuming processes will load whatever DLL the value points to. The writing process (Image) indicates whether an installer, a script host, or an unexpected binary made the change. Use this to judge the location; the value decoding is handled separately.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched the process that modified the COM CLSID key, and is that chain expected?
  context: The origin of the writing process reveals whether the registration change is legitimate (e.g., a signed installer or servicing task) or suspicious (e.g., a dropper or script host that unpacked a DLL and rewrote the CLSID). Tracing the parent's own origin shows whether the change came from a normal software-deployment chain or from an unexpected execution path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Actors who hijack one COM object often make several registry changes together — additional CLSID overrides, Run keys, service entries, or security-setting changes. Registry modifications clustered from the same writing process within a short window reveal the full scope of the configuration changes and whether multiple objectives were pursued. The triggering key will appear in the results; the signal is what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the DLL referenced by the hijacked COM key written to disk by this process or its children?
  context: A COM hijack only executes if the DLL named in the InProcServer32 value actually exists at that path. Confirming that the writing process or one of its children created a file at that location determines whether the persistence is armed and what it would load. The file-write event carries no hash; if the DLL is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the DLL written to the COM key subsequently loaded into a process, and is it signed?
  context: A hijacked InProcServer32 value causes any process that instantiates the CLSID to load the attacker DLL in-process; on many systems the object is instantiated by long-running processes such as the shell, which some droppers restart to force the load. Confirming that a DLL at the value's path was loaded turns the registry change into observed execution. Image-load events carry the DLL's signing state and hash directly — an unsigned or untrusted DLL from a user-writable path loading here is the core evidence of an active hijack.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Did any process reference or execute the DLL path written to the COM key?
  context: Beyond in-process COM loading, loader components frequently invoke the payload DLL's exports directly by path (for example via a signed system utility that runs a named export). Finding the DLL path in a process command line confirms the payload was actively executed rather than only registered.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this PSFactoryBuffer CLSID key been modified before on this host?
  context: The InProcServer32 default value for this CLSID should be set once by the OS and effectively never change afterward. Zero prior modification history makes this write stand out as a first-time change; a recurring pattern of writes to the same key may instead reflect a specific application's behavior worth baselining. Compare the historical Details values to see whether the same path or a new one is being set.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same CLSID key modified on other hosts in the environment?
  context: The same COM CLSID override appearing across many hosts may indicate widespread malware deployment or, less commonly, a legitimate software rollout; a change confined to this one host points to targeted activity. Compare the Details values across hosts to see whether the same DLL path or different per-host paths are being written.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the COM key modification?
  context: Alerts rarely occur in isolation. A per-parent view of process activity in the surrounding window reveals what led to the registration change and what followed it — dropper execution, restart of a COM-consuming host process, or invocation of the payload. Repetitive agent telemetry collapses into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the COM key modification?
  context: Earlier detections on the same host — dropper execution, reconnaissance, defense tampering, or credential access — may reveal the stages that preceded the persistence write and help reconstruct the full timeline. The alert sequence on a single host often tells the operation's story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: COM hijacking is one persistence primitive; actors commonly stack backups using different techniques — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions. Persistence-tool executions clustered in the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for this COM registration change?
  context: COM object re-registration can be part of a legitimate software install or system-servicing deployment. A corresponding change ticket or maintenance window suggests authorized activity; the absence of one where policy requires it points toward an unauthorized change and helps quickly close or escalate the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
