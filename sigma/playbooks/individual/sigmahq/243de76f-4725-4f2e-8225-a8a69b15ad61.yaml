name: PowerShell Create Local User
id: c9b3c8a8-9ee1-457b-a570-ad2d684dbefd
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  contains the New-LocalUser cmdlet, which creates a local account on the host.
  Administrators and provisioning automation create local accounts legitimately, but
  attackers create them to hold secondary credentialed access that survives password
  resets and does not depend on remote-access tooling; such accounts are frequently
  added to a privileged or remote-access group immediately after creation. The
  investigation should recover the full script, identify the account it creates,
  confirm in the Security log whether the creation completed and whether group
  membership changed, establish what launched the PowerShell host, and determine
  whether the account fits an approved provisioning action.
type: detection
detection_id: 243de76f-4725-4f2e-8225-a8a69b15ad61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block actually invoke New-LocalUser to create an account?
  context: >-
    The rule fires when script block content contains the string New-LocalUser. That
    string can also appear in comments, function definitions, help text, or
    administrative and audit tooling without an account being created. Long scripts are
    split across multiple 4104 events, so read every chunk of the alerting block
    (sequence/total order) and confirm an actual New-LocalUser invocation, noting the
    account name and any parameters passed to it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to create local accounts with PowerShell?
  context: >-
    Legitimate user creation is the rule's stated false-positive case. Helpdesk staff,
    server administrators, and provisioning or imaging automation create accounts as
    routine work, and blocks logged under SYSTEM often come from deployment tooling.
    Most organizations provision accounts through directory or endpoint-management
    tooling rather than ad hoc PowerShell, so weigh the user's role, the host's
    function, and the on-disk script path shown here against how accounts are normally
    created in this environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was there a change ticket or documented approval for creating this local account?
  context: >-
    Account creation is a change most organizations require a request or ticket for. A
    corresponding ticket naming the account quickly closes the alert as authorized
    work; creation with no request, outside normal provisioning procedures or working
    hours, moves the investigation toward compromise — confirm with the administrator
    or team responsible. The query lists this user's process-level New-LocalUser
    invocations for reference; a script run from a file will not carry the cmdlet in
    the process command line, so an empty result here is expected and the answer comes
    from the ticket system.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        CommandLine|contains: 'New-LocalUser'
      condition: selection
    fields:
    - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What does the full script do, and what account does New-LocalUser create?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the complete
    script. The 4104 channel records what PowerShell actually compiles, so
    -EncodedCommand wrappers are already unwrapped; only in-script obfuscation (string
    concatenation, format operators, backticks) still needs manual decoding. Extract
    the account name, how the password is set, and flags that extend the account's
    life such as -AccountNeverExpires or -PasswordNeverExpires, then look for
    follow-up statements — Add-LocalGroupMember additions to Administrators or Remote
    Desktop Users, RDP or firewall changes, download cradles, or credential handling —
    that reveal what the account is for.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what process wrote it there?
  context: >-
    When the script block ran from a file, its path is recorded on the event. An
    account-creation script in a user-writable or staging location (Temp, AppData,
    ProgramData, Downloads) implies a delivery step that wrote it — find the
    file-creation event to identify the process and account that staged it. No
    recorded path means interactive or in-memory execution, which for account
    creation is itself worth noting: typing or injecting the command rather than
    running approved provisioning tooling fits hands-on-keyboard activity.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Did the account creation succeed according to the Security log?
  context: >-
    The detection fires on script content; the Security channel is the authoritative
    record of the result. Event 4720 confirms the account was created — it typically
    follows the initiating process within seconds to a couple of minutes (5s-2m) —
    while 4722, 4724, and 4738 show it was enabled, given a password, or changed, and
    4728/4732/4756 show it was added to a group (Administrators or Remote Desktop
    Users membership is the promotion attackers commonly perform next). A 4726
    shortly after points to a create-use-delete cleanup pattern. If the host does not
    ship Security-channel events, an empty result is a visibility gap rather than
    evidence the creation failed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4720
          - 4722
          - 4724
          - 4726
          - 4728
          - 4732
          - 4738
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
  answer_sources:
  - alert
  - manual_review
- question: What logon activity occurred on this host after the account was created, and does the new account appear in it?
  context: >-
    Read the created account's name from the New-LocalUser statement in the script —
    it is content-derived, so this survey cannot filter on it directly. A local
    account that logs on soon after creation, particularly with network or remote
    interactive logon types (3 or 10), is being put to operational use; failed 4625
    attempts against it show someone testing the credentials. No logons yet does not
    clear the alert — attacker-created accounts are often dormant backup access held
    for later use.
  range: +24h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
        - 4624
        - 4625
      condition: selection
    fields:
    - EventID
    - TargetUserName
    - IpAddress
    - LogonType
  answer_sources:
  - process_creation
  - active_directory
- question: Which process launched the PowerShell host that ran this script?
  context: >-
    Script block events carry no process linkage, so recover the launch context from
    process telemetry on this host around the alert. An office application, browser,
    or unusual service binary as the parent points to delivery through a document,
    download, or exploited service (Excel, WinWord, and mshta are classic abnormal
    parents); explorer.exe or a terminal fits interactive administration; attackers
    also launch through cmd.exe, wscript.exe, or renamed binaries. The command line
    additionally shows delivery-style flags such as -nop, -w hidden, or -enc, and
    distinguishes direct powershell.exe invocation from .NET automation hosting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: Did a process on this host load the local-accounts PowerShell module library around the alert?
  context: >-
    New-LocalUser is implemented by the Microsoft.PowerShell.LocalAccounts module, and
    importing it loads the module's assembly into the hosting process. Because script
    block events name no process, this load names the executable that ran
    account-management cmdlets, tying the script content to a concrete process (under
    PowerShell 7 the module runs through a Windows PowerShell compatibility session,
    so the load appears in powershell.exe). The module may already have been loaded
    well before the alert, so treat an empty window as weak evidence rather than
    proof the cmdlet never ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\Microsoft.PowerShell.LocalAccounts.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - User
  answer_sources:
  - process_creation
  - edr_console
- question: Were PowerShell security controls bypassed or weakened before this script ran?
  context: >-
    Attackers often disable or bypass PowerShell security controls before running
    their payload. Common precursors include AMSI bypass (patching amsi.dll via
    AmsiUtils or setting amsiInitFailed), execution-policy overrides (-ExecutionPolicy
    Bypass, -ep bypass), real-time monitoring changes (Set-MpPreference,
    DisableRealtimeMonitoring), and downgrade to PowerShell version 2, which lacks
    script block logging. Any of these on the host in the preceding hour reads as
    preparation for the account-creation script rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging
    policy is enabled, and only automatically-flagged suspicious content (at warning
    level) when it is not. On a warning-only host this alert shows a fragment of the
    host's PowerShell activity, not all of it — surrounding benign-looking blocks may
    simply not have been logged. The level distribution calibrates how much weight
    every other script-block query in this investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Account creation is typically a mid-chain step. Earlier detections on the same
    host — defense tampering, reconnaissance, credential access, or lateral-movement
    tooling — reveal the stages that preceded it and help reconstruct the timeline
    from initial access to the point where the attacker established their own
    credentials.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this user run New-LocalUser scripts before, and does that history fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is their
    90-day history of script blocks containing New-LocalUser, aggregated by host.
    Helpdesk, desktop-engineering, and provisioning staff may produce this pattern
    routinely across many hosts; a first-ever occurrence from a user whose role
    involves no account administration reads differently. Weigh the count against
    what the user's job plausibly involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains: New-LocalUser
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this New-LocalUser script pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does
    not attribute behavior, and PowerShell channel events carry no process identity to
    pivot on — the pattern itself is the pivot. The query mirrors the rule's selection
    fleet-wide over 90 days, aggregated by host. A pattern that routinely appears on
    many hosts fits imaging or provisioning automation; one that has never appeared
    before, or only on this host, is the deviation worth chasing. Only hosts shipping
    the PowerShell channel (and, for non-flagged content, with full Script Block
    Logging enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains: New-LocalUser
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the account
    creation may be one step of movement between them, and the per-host binary
    summary shows what else the account ran. When the alert fired under SYSTEM or
    another service principal this view fills with routine service activity; in that
    case the fleet-wide script-pattern question is the meaningful breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same New-LocalUser pattern fire on other hosts in the same window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated
    by host — the meaningful breadth check when the acting identity is a service
    principal and no process identity exists on this channel. Several hosts creating
    accounts in the same window points to scheduled or pushed provisioning, which
    change records should corroborate; the same attacker account name appearing
    host-by-host over time is a lateral-movement pattern; a single host points to a
    host-local trigger. Coverage is policy-gated per host, so absence elsewhere is
    weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains: New-LocalUser
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What ran on this host under the same account in the hours after the script?
  always_include: true
  context: >-
    Account creation is a foothold step — what follows shows what it was for. In the
    projected command lines look for group additions (net localgroup,
    Add-LocalGroupMember), RDP or firewall reconfiguration, further persistence
    installation, or tooling downloads; a parent or command-line profile that deviates
    from the host's routine automation is the entry worth chasing. Script block events
    carry no process identity, so this pivots by host, user, and time; under SYSTEM
    the account anchor is broad because deployment tooling shares it — weigh
    individual entries rather than the raw count.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
    - ParentImage
    - CommandLine
  answer_sources:
  - process_creation
- question: Did this same rule fire on other hosts in the past 24 hours?
  always_include: true
  context: >-
    A rule that fires across many hosts on the same day is probably tracking scheduled
    or pushed provisioning that creates accounts fleet-wide — change records and the
    created account names should corroborate that. A rule that fires on one host alone
    is the deviation worth chasing, and a small set of unrelated hosts is the
    distribution lateral movement produces. This pivots on the rule's name, so it
    works regardless of which identity ran the script.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.name|expand: '%rule_name%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - alert
