name: Potential KamiKakaBot Activity - Lure Document Execution
id: a840ac24-a842-476e-9c0f-bfa35cdb3f92
description: |
  Detects cmd.exe invoked with /c against a Word shortcut in the Start Menu Programs folder followed by a
  tilde-prefixed document argument. All of the conditions must match together: the image ends in \cmd.exe, the
  command line contains all of "/c ", ".lnk ~", and "Start Menu\Programs\Word", and the command line ends in ".doc".
  KamiKakaBot samples use this construction to display a lure document to the user while a second stage continues in
  the background, launching the document through the installed Word shortcut rather than through the document's own
  file association. A person opening a document does not produce this form, and Office deployment tooling does not
  either — the shortcut path plus the tilde separator is a programmatic construction. The investigation should
  establish what process issued the command, where the shortcut and the document came from, and whether script
  interpreters, build utilities, or persistence writes followed on the same host.
type: detection
detection_id: 24474469-bd80-46cc-9e08-9fbe81bfaaca
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line show cmd.exe running /c against a Word Start Menu shortcut with a tilde-prefixed
    .doc argument?
  context: Confirm the alert before investing investigation time. The rule requires every condition together — the
    command line must contain all of "/c ", ".lnk ~", and "Start Menu\Programs\Word", and must end in ".doc". Read
    the full command line for two things, the shortcut name (which carries the Office version the caller expected,
    such as "Word 2016.lnk") and the document path that follows the tilde.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open Word documents through a programmatically invoked Start Menu
    shortcut?
  context: Users open documents by double-clicking them or from Word's recent-files list, not by having a command
    interpreter call the Start Menu shortcut with a trailing document argument. Establish whether any documented
    automation, packaging job, or helpdesk script on this host builds command lines in this form before treating the
    event as routine, and weigh the account against the host's role.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which Word shortcut did this command invoke, and what document path followed the tilde?
  context: The command line carries the two artifacts that drive the rest of the investigation. The shortcut name
    identifies the Office version the caller assumed is installed, and the path after the tilde is the document the
    user is shown. Note the document's directory — a path under a mounted image, an extracted archive, a download
    folder, or a temp directory identifies the delivery container. cmd.exe is far too common for binary-scoped
    retrieval on a host, so this query narrows to the rule's command-line pattern instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - '/c '
          - '.lnk ~'
          - 'Start Menu\Programs\Word'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this cmd.exe, and is that parent chain expected?
  context: The parent identifies how the command was issued. A Word binary running from a user-writable directory
    rather than the Office install path, an archive or disk-image handler, or a script host as the parent all mean
    the command line was constructed programmatically. Walk up from the parent to see what launched it and what else
    it started in the same session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were the Word Start Menu shortcut or the referenced document written to this host shortly before the
    alert, and by what process?
  context: A shortcut planted or rewritten under the Start Menu Word folder, or a document dropped into a temp or
    extracted-archive directory, marks the delivery step and names the writing process. File write events carry no
    hash of what was written, so carry the path forward — if an executable was dropped alongside the document, its
    hash appears on the later execution event, not on the write.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - 'Start Menu\Programs\Word'
          - '.doc'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - process_creation
- question: What child processes did this cmd.exe spawn afterward?
  context: A command that only opens a document spawns the Office application registered for the extension and
    nothing else. Additional children — script hosts, a build utility such as MSBuild, rundll32, regsvr32, or a
    second interpreter — mean the command did more than display a lure. Read each child's command line for the stage
    it carries.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which Office applications and script interpreters ran on this host in the hour around the alert, and in
    what order?
  context: Lure execution sits inside a sequence — a container is opened, an Office binary runs from wherever it was
    unpacked, the document is displayed to keep the user occupied, and an interpreter or build utility runs the next
    stage. Ordering these executions establishes what preceded the command and what it enabled. Interpreter activity
    outside the host's normal working or maintenance window narrows the judgment further.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating every process launch by binary and parent around the alert collapses routine repetition into
    high-count rows and leaves novel parent-child pairs standing out at low counts. Scan for the delivery step before
    the command and for staging, persistence, or credential-store access after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Has this host produced other Start Menu shortcut invocations with a tilde-prefixed argument, regardless
    of document extension or Office application?
  context: The rule pins the argument to ".doc" and the shortcut folder to Word, so a variant pointing at ".docx",
    ".rtf", or an Excel or PowerPoint shortcut does not fire it. Keeping the "/c " plus ".lnk ~" construction while
    dropping the extension and the application folder surfaces those variants on this host. Where the Office install
    uses localized Start Menu folder names, adjust the retained terms accordingly before reading a zero result as
    absence.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - '/c '
          - '.lnk ~'
          - 'Start Menu\Programs'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific command construction has run here before, not generic cmd.exe usage. On
    most hosts the expected answer is no prior history at all. If prior events exist, a new parent process or an
    unexpected account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/c '
        - .lnk ~
        - Start Menu\Programs\Word
        CommandLine|endswith: .doc
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user, so the result is their 90-day
    history of this exact command construction, aggregated by host, rather than their generic use of cmd.exe. A user
    who has never produced this pattern is the more interesting case; weigh any count against the user's role and
    the software they normally handle.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/c '
        - .lnk ~
        - Start Menu\Programs\Word
        CommandLine|endswith: .doc
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment,
    or is the parent new for this activity?
  context: 'When the alert fires under a service principal or a machine account, user identity does not attribute the
    behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule''s selection structure
    scoped to the alerting parent process, giving the 90-day history of that parent driving this construction. A new
    or rare parent is the deviation worth chasing; a parent already accounting for thousands of prior events is
    vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/c '
        - .lnk ~
        - Start Menu\Programs\Word
        CommandLine|endswith: .doc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across every host in the alert window reveals whether the same delivery
    reached more than one endpoint or whether the account moved laterally afterward. Aggregation by host and binary
    keeps the view readable. If the alert fired under SYSTEM or a machine account, expect agent telemetry to
    dominate and read the parent-driven view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: 'Under a service principal, asking what else the user did returns agent-telemetry noise, since every host
    runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule''s selection structure scoped to the alerting parent process, fleet-wide,
    in the alert window. Multiple hosts in the same window points to a pushed or scheduled rollout; a single host
    points to a host-local trigger such as an opened container.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/c '
        - .lnk ~
        - Start Menu\Programs\Word
        CommandLine|endswith: .doc
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this command construction rather than the generic footprint of cmd.exe. Several hosts firing the same pattern
    in a short period points to a distributed delivery reaching multiple recipients; one host or a small unrelated
    set points to a single opened container. Use the host distribution to calibrate how far the response needs to
    reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/c '
        - .lnk ~
        - Start Menu\Programs\Word
        CommandLine|endswith: .doc
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host frequently name the delivery step that preceded the lure — an archive
    or disk image being mounted, a signed application loading an unsigned library from its working directory, or a
    download from an uncommon parent. Read the alert timeline in order to reconstruct how the document arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
