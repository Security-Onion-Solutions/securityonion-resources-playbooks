name: Potential Atlassian Confluence CVE-2021-26084 Exploitation Attempt
id: f461885f-4740-4466-9062-86af76501a6a
description: |
  Detects a process whose parent is the Atlassian Confluence bundled JRE (a path ending in
  \Atlassian\Confluence\jre\bin\java.exe) AND whose command line contains one of the command
  interpreter or LOLBin tokens certutil, cmd /c, cmd /k, cscript, curl, ipconfig, powershell,
  pwsh, regsvr32, rundll32, whoami, or wscript. Both conditions must hold for the rule to fire.
  A Confluence server process normally serves web requests and spawns few or no command
  interpreters, so a shell or LOLBin child of the bundled JRE is the observable result of the
  web layer executing attacker-supplied input — the pattern left by OGNL injection against
  CVE-2021-26084 and by other server-side code execution flaws in the same application.
  The investigation should determine which command ran and what it did, what the Confluence
  process did before and after (module loads, file writes, outbound connections), whether the
  instance is on an affected version, and whether the same pattern appears on other servers.
type: detection
detection_id: 245f92e3-c4da-45f1-9070-bc552e06db11
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the event show the Confluence bundled java.exe as the parent and a command
    interpreter or LOLBin token in the command line?
  context: >-
    Confirm both halves of the detection before investing time. The parent path must end in
    \Atlassian\Confluence\jre\bin\java.exe and the command line must contain one of certutil,
    cmd /c, cmd /k, cscript, curl, ipconfig, powershell, pwsh, regsvr32, rundll32, whoami, or
    wscript. Note which token is present — recon tokens such as whoami and ipconfig point to
    an operator probing the foothold, while certutil, curl, regsvr32, and rundll32 point to
    payload retrieval or execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host and service account expected to run command interpreters underneath
    the Confluence application?
  context: >-
    Confluence runs as a long-lived service, usually under a dedicated service account, and
    the account rarely has a reason to launch shells or LOLBins. Some deployments do run
    add-on scripts, backup helpers, or build integrations through the application, so confirm
    with the application owner whether any documented integration launches child processes on
    this server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the Confluence java.exe expected to spawn this child, and what started the
    Confluence process itself?
  context: >-
    The parent-child relationship is the core signal here. Retrieving the parent's own
    creation event shows the Confluence startup command line — the install path, JVM options,
    and the launcher (a service wrapper, a scheduled start, or an interactive shell). A
    Confluence process started from an interactive shell or from an unexpected directory is
    itself worth explaining before the child is judged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What web request drove the Confluence server to execute this command?
  context: >-
    Server-side code execution starts with a crafted request to the application. The parent
    command line identifies the Confluence install and listener; correlating the request that
    reached it requires the application's own HTTP request records for the alert window. Look
    for OGNL injection markers in the queryString or SpaceKey parameters of
    /pages/createpage-entervariables.action and related endpoints, and for the generic
    exploit-input markers `../`, `union select`, `cmd=`, `${jndi:`, `rO0AB`, `%00`, and
    `${env:}`. A burst of 4xx/5xx responses from one client — more than 5 in 5 minutes is a
    workable starting threshold — around the alert time narrows the originating source
    address, which should then be checked against the public addresses that front this
    application.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Confluence instance running a version affected by CVE-2021-26084?
  context: >-
    CVE-2021-26084 is an OGNL injection in the Confluence web layer that yields code execution
    as the service account, reachable without authentication on affected builds. Affected
    versions are those before 6.13.23, 6.14.0 before 7.4.11, 7.5.0 before 7.11.6, and 7.12.0
    before 7.12.5; fixes shipped in 6.13.23, 7.4.11, 7.11.6, 7.12.5, and 7.13.0. An affected
    build confirms this path was available; a patched build points the investigation at a
    different code-execution route or at an authenticated add-on, and does not by itself clear
    the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What exactly did the interpreter command do? Decode the arguments the Confluence
    process passed to it.
  context: >-
    Read every argument end to end. Decode base64 or escaped payloads, resolve URLs and file
    paths, and identify the operational purpose — host and account enumeration, file download,
    DLL or scriptlet execution, or a follow-on stage. The query returns every command on this
    host in the alert window that carries one of the rule's tokens, not just the alerting
    event, because an operator working through a foothold usually issues several commands in
    sequence and the working directory shows where the payload was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - certutil
        - cmd /c
        - cmd /k
        - cscript
        - curl
        - ipconfig
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - whoami
        - wscript
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What other child processes did the same Confluence java.exe instance spawn?
  context: >-
    Scoping to the exact parent instance shows everything the Confluence process launched
    around the alert, including children that carry none of the rule's tokens. Several
    children in sequence — enumeration, then retrieval, then execution — describe an operator
    working interactively through the web layer; a single child may be a probe or a test.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the Confluence server process write around the time of the alert?
  context: >-
    Beyond spawning processes, the exploited web layer often writes to disk first — a web
    shell into the application's web-accessible directories, a staged script, or a downloaded
    binary in a temporary directory. Files written by the Confluence process outside its own
    data, index, and temp directories are the artifacts to collect and check against the
    command line that ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \Atlassian\Confluence\jre\bin\java.exe
      condition: selection
    fields:
      - TargetFilename
      - User
  answer_sources:
  - file_event
  - process_creation
- question: What modules did the Confluence java process load around the alert, and are any of
    them unsigned or outside the install tree?
  context: >-
    Exploitation of a public-facing application can load code into the server process itself
    rather than only spawning children, so the module list is an independent view of the same
    compromise. A module loaded from a temporary directory, a user-writable path, or the
    application's data directory — or one that is unsigned when its neighbours in the same
    directory are signed — is the load to pull for analysis. If module-load telemetry is not
    collected on this server, treat an empty result as a visibility gap rather than evidence
    nothing loaded.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \Atlassian\Confluence\jre\bin\java.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - edr_console
- question: Did the alerting process or the Confluence process it came from open outbound
    connections around the alert?
  context: >-
    Command execution through a web layer is commonly followed by an outbound callback — a
    download of the next stage, or a connection back to operator infrastructure. Connections
    from the alerting child or from the Confluence process itself to an external address on a
    port the application does not normally use are the ones to resolve; check the destination
    against the retrieval command that ran and against the addresses the application is
    expected to reach.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_child:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_parent:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Does the java.exe parent spawn child processes on this host at all, and which ones?
  context: >-
    A Confluence server that has never spawned a child process in 90 days makes any child
    notable regardless of what it runs. A server with an established child profile needs the
    alerting command compared against it. Known-good children exist — build agents, backup
    helpers, and add-on hooks launch tools such as msbuild.exe or archiving utilities — so
    build the allowed-child list from this result with the application owner rather than
    assuming any child is unexpected. The parent scope here matches on process name, so other
    java installations on the same host also appear.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this account previously produced the rule's pattern, and does that history fit
    its role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this account — the result is the
    account's 90-day history of the Confluence parent driving interpreter and LOLBin
    execution, aggregated by host, not generic use of those binaries. An account that has
    never produced this pattern is the deviation worth chasing. If the alert fired under the
    Confluence service account, SYSTEM, or a machine account, this count attributes the launch
    mechanism rather than a person, and the parent-scoped history is the load-bearing view.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \Atlassian\Confluence\jre\bin\java.exe
        CommandLine|contains:
        - certutil
        - cmd /c
        - cmd /k
        - cscript
        - curl
        - ipconfig
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - whoami
        - wscript
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this Confluence parent driven the rule's pattern before on this host or across
    the environment, or is the parent new for this activity?
  context: >-
    This alert fires under a long-running server service, so user identity does not attribute
    the behaviour and the launch mechanism does. The query mirrors the rule's selection scoped
    to the alerting parent process, giving the 90-day history of this parent driving this
    specific pattern rather than generic parent-and-binary co-occurrence. A parent that
    already accounts for a steady count of prior events is an integration or automation to
    document as expected; a first-time or rare parent for this pattern is the deviation.
  always_include: true
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \Atlassian\Confluence\jre\bin\java.exe
        CommandLine|contains:
        - certutil
        - cmd /c
        - cmd /k
        - cscript
        - curl
        - ipconfig
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - whoami
        - wscript
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  always_include: true
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the
    foothold was used to reach further systems. If the alert fired under the Confluence
    service account or another service principal, this view returns routine service and agent
    telemetry from across the fleet — read it for hosts the account should not be touching at
    all, and rely on the parent-scoped fleet view for the coordinated-activity question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same parent-driven pattern fire on other hosts in the same window?
  always_include: true
  context: >-
    Under a service principal, asking what else the account did returns fleet-wide agent
    noise. The useful pivot is whether the same launch mechanism fired elsewhere, so the query
    mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the
    alert window. Several Confluence servers producing this pattern within the same hour
    points at scanning or automated exploitation across the estate; a single host points at a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \Atlassian\Confluence\jre\bin\java.exe
        CommandLine|contains:
        - certutil
        - cmd /c
        - cmd /k
        - cscript
        - curl
        - ipconfig
        - powershell
        - pwsh
        - regsvr32
        - rundll32
        - whoami
        - wscript
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A 15-minute window either side of the alert is a workable correlation horizon between the
    triggering request, the process spawn, and any follow-on stage. The aggregation collapses
    repetitive service and agent telemetry into high-count rows so that novel parent-child
    pairs stand out at low counts — read the low-count rows for enumeration, credential
    access, or persistence tooling that arrived alongside the alerting command.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Server-side exploitation is usually preceded by scanning and probing and followed by
    enumeration, credential access, or persistence. Earlier detections on the same server
    reconstruct the sequence and can date the initial foothold earlier than this alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other Confluence servers targeted by the same exploitation attempt?
  context: >-
    Exploitation of an internet-facing application rarely targets one host. Correlating this
    rule across every host in the last 24 hours shows how many Confluence instances produced
    the same pattern and which accounts they ran under, which sets the scope of the response
    and identifies further servers that need the same patch and artifact review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
