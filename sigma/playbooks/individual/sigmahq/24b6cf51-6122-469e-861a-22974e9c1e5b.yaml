name: Potential SmadHook.DLL Sideloading
id: 9319fa9e-ad24-4c67-b543-1ccea8fd707d
description: |
  Detects a process loading SmadHook32c.dll or SmadHook64c.dll from a location other than the
  legitimate SmadAV antivirus installation path, or by a process other than the SmadAV executable
  itself. Attackers ship the legitimate SmadavProtect executable alongside a malicious SmadHook DLL
  in a user-writable directory so the trusted, signed binary loads their code (T1574.001); the pair
  typically arrives in an archive and is followed by scheduled-task or Run-key persistence and
  outbound command-and-control traffic. The investigation should establish where the DLL and its
  loading process reside on disk, how the DLL arrived, and what executed after the load.
type: detection
detection_id: 24b6cf51-6122-469e-861a-22974e9c1e5b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, a SmadHook DLL loaded from outside the legitimate SmadAV installation path?
  context: |
    Confirm the alert is a true positive from the exact module path (ImageLoaded) and the loading
    process. The rule fires when SmadHook32c.dll or SmadHook64c.dll is loaded and either the DLL
    is outside the SMADAV Program Files directories or the loader is not the SmadavProtect
    executable there. A SmadHook DLL under a user profile, ProgramData, Public, or a temp
    directory is the side-loading pattern this rule targets.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is SmadAV antivirus actually deployed on this host or anywhere in this environment?
  context: |
    SmadAV is a consumer antivirus product. If the organization does not use it, there is no
    legitimate reason for a SmadavProtect executable or SmadHook DLL to exist on this host, and
    the load is very likely a staged side-loading pair. If SmadAV is genuinely installed, verify
    the installation lives under the standard Program Files path rather than a user-writable
    location.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was SmadAV recently installed or deployed on this host through a documented change?
  context: |
    A recent, documented software installation can explain a first-time SmadHook DLL load. Check
    software deployment records and change tickets for a SmadAV rollout. An undocumented
    appearance of the DLL, particularly outside Program Files, points toward attacker staging
    rather than administration.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are the SmadHook DLL and its loading executable still on disk for analysis?
  context: |
    The DLL path from the alert and the loading executable's path are the primary artifacts. If
    they still exist, capture hashes for reputation lookups and preserve copies for sandbox or
    reverse-engineering analysis before any cleanup. This query surfaces file activity by the
    loading process and its children; the DLL itself may have been written earlier by a different
    process, so also check the alert's ImageLoaded path directly on the host.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other modules did the loading process load, and did any come from user-writable or non-standard paths?
  context: |
    The full module list tells the story around the SmadHook load. Look for other DLLs loaded from
    the same non-standard directory (a side-loading bundle often ships several), unsigned modules
    in directories where signed ones are expected, and system DLL names loaded from non-system
    paths. A single trusted-looking executable whose module list mixes Program Files system DLLs
    with DLLs from a user profile directory is the search-order-hijack pattern.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and threat-intel reputation of the loaded SmadHook DLL?
  context: |
    The legitimate SmadHook DLL ships signed as part of the SmadAV product; a side-loaded
    replacement is typically unsigned or carries an invalid signature. Compare the DLL's hash
    against threat intelligence and against the hash of the DLL in a known-good SmadAV
    installation. SignatureStatus values of Unsigned, Expired, Distrusted, or Invalid on a DLL
    named after a security product are the masquerading signal this rule exists to catch.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Where is the process that loaded the DLL running from, and what was its command line?
  context: |
    For a side-loading pair, the loading executable is a copy of the legitimate SmadavProtect
    binary placed in the same attacker-controlled directory as the malicious DLL. Its path and
    working directory are decisive. A SmadavProtect executable running from a user profile,
    Downloads, an extracted archive directory, or Public is staged; one running from the standard
    SMADAV Program Files directory with its expected DLL is routine.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What spawned the process that loaded the DLL, and is that parent chain expected?
  context: |
    How the loading executable started reveals the delivery mechanism. Side-loading bundles are
    commonly launched by the user opening an archive attachment or shortcut, so parents like
    explorer.exe from an archive-extraction directory, an archiver process, a script host
    (wscript.exe, cmd.exe launching a .bat), or an Office application deserve attention. A
    service-managed start from the standard install path fits legitimate antivirus behavior.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: When was the SmadHook DLL written to disk, and by what process and user?
  context: |
    Correlating the DLL's file-creation event with the load event exposes the staging step. A DLL
    written minutes before its first load by an archiver, browser, or script process indicates
    fresh delivery; a DLL that has existed since a legitimate product install indicates routine
    operation. The writing process and user also identify the delivery vector, such as an
    extracted email attachment or a download.
  range: -7d
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were persistence-related registry values modified on this host around the time of the load?
  context: |
    Side-loading campaigns that use this DLL pair commonly add Run-key persistence pointing at the
    staged executable, alongside or instead of scheduled tasks. Registry changes to Run/RunOnce
    keys or DLL-load-influencing values (AppInit_DLLs, KnownDLLs) near the load event show whether
    the foothold was made durable, and the Details value reveals what the persistence launches.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - 'AppInit_DLLs'
          - 'KnownDLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What child processes did the loading process spawn after the DLL load?
  context: |
    Once the malicious DLL runs inside the trusted process, its next stage typically appears as
    child processes, such as command shells, PowerShell fetching remote content, or schtasks.exe
    registering persistence. Children of an antivirus-named process that look like scripting or
    persistence tooling are the follow-on execution this question is designed to surface.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the loading process initiate outbound network connections after the load?
  context: |
    A side-loaded implant beacons from inside the trusted process or from its children. Outbound
    connections from the loading process, especially to raw IP addresses or uncommon destinations
    shortly after the load, indicate second-stage retrieval or command-and-control. A legitimate
    antivirus process does make update connections; weigh destination reputation and timing
    relative to the load.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has this SmadHook DLL been loaded on this host before, and under what processes?
  context: |
    A first-time load of this DLL on the host is a stronger anomaly than a recurring one. If the
    same DLL path has been loaded repeatedly by the same executable over the past 90 days, this is
    probably an established install. A first occurrence, or a history where the DLL was loaded by
    different processes, points to fresh staging.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Are other hosts in the environment loading this SmadHook DLL?
  context: |
    Cross-host correlation surfaces deployment scope. If the organization does not use SmadAV,
    any host loading this DLL is a finding, and multiple hosts loading it from user-writable
    paths indicates the same delivery reached several targets. Pay attention to the variety of
    loading processes across hosts; the legitimate pairing loads only from the product's install
    directory.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were process-based persistence mechanisms installed on this host around the load?
  context: |
    Campaigns using this side-loading pair establish redundant persistence, commonly multiple
    scheduled tasks that periodically fetch and execute remote commands. Executions of
    schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe within hours of the load show
    whether the foothold was made durable and by what mechanism.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or Run-key paths on this host around the load?
  context: |
    File-based persistence bypasses command-line detection entirely. An executable or shortcut
    dropped into a Startup folder achieves persistence without running schtasks or reg. Check
    drops near the load window, particularly ones pointing back at the directory holding the
    staged executable and DLL.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    The load rarely happens in isolation. Aggregated parent-child process pairs around the alert
    reveal the immediate context, such as archive extraction preceding the load or scripting
    activity following it. Novel low-count pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host, such as archive execution, script-host activity, or
    defense tampering, may reveal the delivery stages that preceded the DLL load and help
    reconstruct the timeline from initial access to persistence.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
