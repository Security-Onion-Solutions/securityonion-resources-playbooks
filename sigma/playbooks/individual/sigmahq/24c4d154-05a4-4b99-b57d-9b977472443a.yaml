- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The branches of this rule sit at different points of one operation, and the neighbouring
    processes are what place the alert in that sequence. Aggregating parent/child pairs in the
    surrounding window collapses repetitive agent telemetry into high-count rows while novel
    pairs stand out at low counts — look for host and account enumeration, archive tooling,
    service or task creation, and remote-execution utilities near the alert.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host reconstruct the stages that led here. Look for the
    ordering that typically precedes hive collection and staged-payload execution — initial
    access or delivery, host and account discovery, then defense tampering — and for later
    alerts that suggest what the collected material was used for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
