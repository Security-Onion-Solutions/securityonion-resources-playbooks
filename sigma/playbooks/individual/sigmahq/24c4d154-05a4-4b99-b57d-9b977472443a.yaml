name: Lazarus Group Activity
id: 379ee841-bf2f-4917-a518-4c49a3fe1e78
description: |
  Detects a process command line that matches at least one of five independent hard-coded
  patterns: a generic branch (a reg.exe save of the SAM hive to a temp file, a fixed archive
  password, a `-hp1q2w3e4` extraction flag, or a `.dat data03 10000 -p ` argument string); a
  netstat branch (`netstat -aon | find ` together with `ESTA` and a redirect to a temp file);
  a network-discovery branch (a `.255 10 C:\ProgramData\IBM\` sweep argument together with
  `.DAT`); a persistence branch (a shell command carrying both ` /c ` and ` -p 0x` alongside a
  path under C:\ProgramData\ or C:\RECYCLER\); or a rundll32 branch (`rundll32 ` plus
  C:\ProgramData\ plus an export invoked from a file with a non-DLL extension such as .bin,
  .tmp, .dat, .io, .ini, or .db). The branches map to different operational stages — credential
  material collection, host and network discovery, and execution of a payload staged in a
  world-writable directory — so the first task is establishing which branch fired, because that
  determines which follow-up carries weight. The patterns are literal argument strings rather
  than behavioral heuristics, so a match is normally either the pattern itself or a rare
  collision with unrelated tooling; determine which by reading the full command line,
  identifying the referenced files, and checking the surrounding command sequence and process
  lineage on the host.
type: detection
detection_id: 24c4d154-05a4-4b99-b57d-9b977472443a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which of the rule's command-line branches does this command line actually match?
  context: >-
    The rule fires when any one of five independent branches matches, so confirm the alert by
    reading the exact command line and identifying which branch is responsible — a SAM-hive
    save or fixed archive password (generic), a netstat capture redirected to a temp file, a
    `.255 10 C:\ProgramData\IBM\` sweep with `.DAT`, a shell command with both ` /c ` and
    ` -p 0x` plus a C:\ProgramData\ or C:\RECYCLER\ path (persistence), or a rundll32 export
    call against a non-DLL file under C:\ProgramData\. Note the branch: the credential and
    discovery branches point the investigation at what was collected, while the persistence and
    rundll32 branches point it at a staged payload file that should be recovered and identified.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this user and host expected to save registry hives, capture netstat output to temp
    files, or run payloads from C:\ProgramData\ or C:\RECYCLER\?
  context: >-
    Backup, inventory, and software-deployment tooling does write to C:\ProgramData\ and does
    run rundll32 against vendor-supplied files, so the user role and host function are the
    fastest way to separate routine operations from operator-driven activity. A workstation
    user account producing a SAM-hive save or a redirected netstat capture is a different
    finding from a service account on a management server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Are the files this command line references still on disk for analysis?
  context: >-
    Every branch of this rule names a file — a saved hive under the temp directory, a `.DAT`
    sweep output, an archive extracted with a fixed password, or a payload under
    C:\ProgramData\ or C:\RECYCLER\. This correlates file activity to the alerting process and
    its direct children, which is what tells you whether the file was created, still exists,
    and can be recovered for hashing and content review before cleanup removes it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Hive dumping, connection enumeration, and running staged binaries out of C:\ProgramData\ are
    all standard assessment steps, and the fixed argument strings this rule keys on are also
    embedded in publicly available tooling that testers reuse. Check whether an engagement is
    active on this host or network segment; matching scope and timing resolves the alert without
    further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What capability does the matching command line invoke, and what are its arguments?
  context: >-
    Decode the command line against the branch that fired. For a `reg.exe save hklm\sam` call,
    the capability is offline credential material collection — check whether a matching
    `hklm\system` save also ran, since both hives are needed to extract secrets. For a
    `-hp1q2w3e4` or `1q2w3e4r@#$@#$@#$` string, the capability is archive extraction with a
    fixed password — identify the archive and its destination. For `netstat -aon | find ESTA`
    redirected to a temp file, it is connection enumeration written to disk for later
    collection. For `rundll32 ` against a `.bin`/`.tmp`/`.dat`/`.io`/`.ini`/`.db` file, the
    named export after the comma is the entry point and any trailing argument is typically a
    key or a log path — record both.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did this binary write on the host in the hour after the alert?
  context: >-
    The branches of this rule all produce disk artifacts — saved hives and redirected output
    under the temp directory, `.DAT` sweep results, extracted archive members, and payload or
    debug-log files under C:\ProgramData\. Enumerating what the alerting binary wrote confirms
    the operation completed and reveals the output paths, which are the next things to recover
    even if the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    What was written under C:\ProgramData\ or C:\RECYCLER\ around the alert, and what is in
    those files?
  context: >-
    Both the persistence and rundll32 branches reference a payload staged in a world-writable
    directory, and the discovery branch writes its `.DAT` output under C:\ProgramData\IBM\.
    Retrieve the files this surfaces and read them — check for a PE header behind a non-executable
    extension, packer or encryption markers, embedded URLs or IP addresses, and whether the
    creation timestamp has been copied from a system binary to blend with its neighbours.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
        - \ProgramData\
        - \RECYCLER\
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: >-
    Did anything staged under C:\ProgramData\ or C:\RECYCLER\ execute on this host, and what is
    its hash?
  context: >-
    A file carries no hash when it is written — the hash is recorded when it runs. This looks
    for a binary in those directories executing directly, and for an interpreter or loader
    invoked with such a path on its command line. Submit the resulting hash to reputation or
    internal threat-intel sources. On an interpreter or rundll32 match the hash belongs to the
    interpreter, not the staged file, so retrieve the on-disk path and hash it separately. A
    file that is present but has not run will not appear here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|contains:
        - \ProgramData\
        - \RECYCLER\
      selection_interpreter:
        CommandLine|contains:
        - C:\ProgramData\
        - C:\RECYCLER\
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The rule constrains only the command line, so the launching process is unconstrained and
    carries most of the signal. A shell or rundll32 call under explorer.exe reflects an
    interactive session; under services.exe or taskeng.exe it reflects a service or scheduled
    task; under an Office application, a browser, a script host, or a binary that itself lives
    in a world-writable directory, the chain is worth walking further up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    A `cmd.exe /c` wrapper delegates the real work to its child, so the children are where the
    operation becomes visible — a `reg.exe` hive save, a `netstat.exe` and `find.exe` pair, an
    archiver, or a `rundll32.exe` loading the staged file. Anchoring on the alerting process's
    own identifier keeps this precise regardless of how common the parent binary is.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: >-
    When this host has previously produced the rule's pattern, what parents and users drove it,
    and does the current alert fit that history?
  context: >-
    The query mirrors the rule's branch structure scoped to this host, so the resulting
    parent/user distribution reflects how these specific argument strings have historically
    appeared here rather than generic use of a shell or rundll32. Zero prior events means the
    pattern is new to the host. A prior history under one consistent parent and account, with
    today's alert under a different one, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_generic:
        CommandLine|contains:
        - reg.exe save hklm\sam %temp%\~reg_sam.save
        - 1q2w3e4r@#$@#$@#$
        - ' -hp1q2w3e4 '
        - '.dat data03 10000 -p '
      selection_netstat:
        CommandLine|contains|all:
        - 'netstat -aon | find '
        - ESTA
        - ' > %temp%\~'
      selection_network_discovery:
        CommandLine|contains|all:
        - .255 10 C:\ProgramData\IBM\
        - .DAT
      selection_persistence:
        CommandLine|contains|all:
        - ' /c '
        - ' -p 0x'
        CommandLine|contains:
        - C:\ProgramData\
        - C:\RECYCLER\
      selection_rundll32:
        CommandLine|contains|all:
        - 'rundll32 '
        - C:\ProgramData\
        CommandLine|contains:
        - .bin,
        - .tmp,
        - .dat,
        - .io,
        - .ini,
        - .db,
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
