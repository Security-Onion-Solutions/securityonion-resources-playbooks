name: Suspicious Schtasks Schedule Types
id: e3380aff-ebe0-400d-92ff-a0957d1277bf
description: |
  Detects creation or modification of a Windows scheduled task via schtasks.exe (or a binary
  whose OriginalFileName is schtasks.exe) where the command line specifies an autostart or
  recurring trigger (ONLOGON, ONSTART, ONCE, or ONIDLE) and does not include the privilege
  markers the rule filters out (NT AUTHORITY, SYSTEM, HIGHEST). These trigger types are used
  by legitimate software deployment and administration, but are also the standard way operators
  install execution-on-boot or execution-on-logon persistence pointing at a payload in a
  user-writable path. The investigation should confirm the task name, the executed command, the
  trigger, whether the task ran or is still registered, and whether the activity fits routine
  administration on this host and account.
type: detection
detection_id: 24c8392b-aa3c-46b7-a545-43f71657fe98
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the schtasks command line specify an ONLOGON, ONSTART, ONCE, or ONIDLE trigger
    without the privilege markers the rule excludes?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires when the process is schtasks.exe (or carries that OriginalFileName) AND the command
    line contains one of the trigger keywords (ONLOGON, ONSTART, ONCE, ONIDLE) AND the command
    line does NOT contain NT AUTHORITY, SYSTEM, or HIGHEST. Review the exact command line and
    process identity against these criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create or modify scheduled tasks from the command line?
  context: Legitimate administration, software installers, and deployment tooling create scheduled
    tasks routinely, so knowing whether this account and host normally perform task scheduling is
    often the fastest path to separating routine operations from operator-installed persistence.
    Direct command-line schtasks use by an account that does not normally administer the host is
    the more suspicious case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What scheduled task was created or modified, and what command does it execute?
  context: The schtasks command line carries the task name (/TN), the program or script to run
    (/TR), the schedule type (/SC), and the run-as account (/RU). Identify each of these from the
    arguments. The /TR value reveals the persistence payload -- often a script, binary, or download
    cradle in a user-writable path -- and a randomized or convention-breaking /TN value is itself a
    tuning signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When is the task scheduled to run, and has the scheduler already executed it?
  context: The trigger schedule determines when the persistence activates. ONSTART fires at the next
    boot and ONLOGON at the next logon, while ONCE fires at a set time and ONIDLE waits for an idle
    threshold. Tasks already triggered run as children of the Task Scheduler service. Checking for
    scheduler-spawned processes after the task was created reveals whether the payload has executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: Persistence is only effective if the task still exists. Some operators delete tasks after
    execution to reduce forensic artifacts. Confirming the task is still present -- via schtasks
    /query /tn <taskname> /v on the host or through an endpoint console -- determines whether the
    mechanism is active and requires removal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the task's command line or its /TR payload encoded or obfuscated, and what does it
    decode to?
  context: Encoded content in a /TR value hides the operator's payload from casual inspection. Look
    for base64 (often via an encoded PowerShell command or certutil -decode), hex, URL-encoding,
    character concatenation, and environment-variable substitution. Decoding reveals the actual
    intent -- download cradle, reverse shell, credential theft, or in-memory loader. For multi-layer
    encoding, iterate decoding until the payload is readable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned schtasks.exe, and is that parent chain expected for task creation?
  context: The parent process reveals how the task creation was invoked. Interactive administration
    typically descends from explorer.exe or a console session, and deployment tooling from a known
    agent or installer. Unusual parents such as a script host, an Office application, or a download
    cradle point to task creation driven by exploitation or a malicious script rather than routine
    administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Do the Task Scheduler registry artifacts confirm a new task was registered, and what
    does the stored definition contain?
  context: Creating or modifying a scheduled task writes the task definition under the Task Scheduler
    registry tree (Schedule\TaskCache\Tree and \Tasks). Tasks imported from XML via /XML, or
    configured with options that are not fully visible on the command line, still leave these
    registry artifacts. A new TaskCache entry that matches the alert timing confirms registration
    and may surface a task name or path that the command line alone did not show.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Do the task-creation security events on this host corroborate the scheduled task and
    show its author and run-as context?
  context: The Security log records scheduled task registration (Event 4698) and update (Event 4702),
    including the task name, the account that created it, and the full task content. These events
    attribute the task to a user and capture XML-imported definitions that the command line may hide.
    If the host's Security channel is not collected in this environment, treat zero results as a
    visibility gap rather than evidence no task was created, and rely on the process-creation and
    registry evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
      - TaskContent
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Operators rarely rely on a single persistence mechanism. After installing a scheduled
    task, they commonly add backup footholds with different techniques -- services, registry Run
    keys, BITS jobs, or WMI subscriptions. Several persistence installations clustered in the same
    window indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      filter_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      filter_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or coordinated
    action on multiple endpoints. If the same user triggered similar task creation on several hosts
    in a narrow window, the scope is broader than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      filter_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Persistence is usually one stage of a longer sequence. Earlier detections on the same host
    -- defense tampering, reconnaissance, credential access, or execution -- may reveal the stages
    that preceded the task creation and help reconstruct the timeline. The ordering of alerts on the
    host tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence or tampering LOLBins used on this host recently?
  context: Operators who reach for one living-off-the-land binary often use several. After scheduling
    a task, the same hands-on activity may also touch sc.exe, reg.exe, at.exe, or vssadmin to install
    backup persistence or weaken defenses. Finding multiple persistence-and-tamper LOLBins in the
    same window strengthens the case for operator activity over routine administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was schtasks.exe executed from its expected System32 or SysWOW64 path?
  context: schtasks.exe executed from outside System32 or SysWOW64 may indicate the binary was copied
    or renamed to evade path-based allowlists, or that a different binary is presenting the
    schtasks.exe OriginalFileName. A schtasks.exe running from a user temp or AppData directory is
    more suspicious than one in the system directory. Compare the Image path against the
    OriginalFileName.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's schtasks scheduling pattern over the past 90
    days, and what command-line structures are typical?
  context: A scheduling pattern with no prior history on a host is more suspicious than one seen
    regularly under stable parents. This count reflects the rule's specific firing pattern -- an
    ONLOGON, ONSTART, ONCE, or ONIDLE trigger without the privilege markers -- rather than generic
    schtasks usage. The command-line projection lets the analyst compare typical invocation patterns
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_time:
        CommandLine|contains:
        - ' ONLOGON '
        - ' ONSTART '
        - ' ONCE '
        - ' ONIDLE '
      filter_privs:
        CommandLine|contains:
        - NT AUT
        - ' SYSTEM'
        - HIGHEST
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - CommandLine
