name: Arbitrary Shell Command Execution Via Settingcontent-Ms
id: e9766a56-ab19-41cc-8fdf-e2bf21759c0a
description: |
  Detects a command line referencing a .SettingContent-ms file, excluding the legitimate
  immersivecontrolpanel reference. The .SettingContent-ms format is an XML "shortcut" to a Windows
  settings page whose DeepLink element accepts an arbitrary binary path and arguments; an attacker
  replaces the canonical control.exe target with cmd.exe, powershell.exe, or regsvr32.exe and the
  file runs the substituted command immediately on double-click, with no Open prompt and no
  Mark-of-the-Web warning even when delivered from the internet. The file can also be OLE-embedded in
  an Office document. The rule fires when a command line contains the .SettingContent-ms reference AND
  the immersivecontrolpanel filter does not match. The investigation should establish what binary and
  arguments the DeepLink actually invoked, how the file was delivered and opened, what parent
  application launched it, and whether outbound network activity or additional recipients followed.
type: detection
detection_id: 24de4f3b-804c-4165-b442-5a06a2302c7e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line reference a .SettingContent-ms file without matching the immersivecontrolpanel filter?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line against the detection criteria. The rule fires when a command line contains the
    .SettingContent-ms substring AND does not contain immersivecontrolpanel (the benign reference used
    by the built-in Settings app). Verify the .SettingContent-ms token is present and that the
    invocation is not the legitimate immersivecontrolpanel path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to open Windows settings shortcut files via the command line?
  context: >-
    Legitimate administrative activity rarely involves .SettingContent-ms files outside the built-in
    Settings app, so knowing whether the user role and host function are consistent with this behavior
    is often the fastest path to separating a routine action from an attacker-crafted file. A standard
    workstation user double-clicking a settings shortcut received as an attachment is far less expected
    than a known administrative or scripted workflow that references these files.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What binary and arguments did the .SettingContent-ms DeepLink actually invoke?
  context: >-
    The DeepLink element of a .SettingContent-ms file takes any binary path plus arguments. The
    canonical legitimate target is control.exe; an attacker substitutes cmd.exe /c, powershell.exe
    -Command, or regsvr32 /s /n /u /i:<URL> scrobj.dll. Read the full command line to identify the
    substituted binary, decode any encoded or obfuscated arguments, and extract any file paths or
    network endpoints the command references. This is the operational payload of the detection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      condition: selection and not filter
    fields:
      - CommandLine
      - CurrentDirectory
- question: What email, document, or downloaded file delivered the .SettingContent-ms file?
  context: >-
    Initial access via this technique typically begins with a phishing email carrying the
    .SettingContent-ms attachment directly, or an Office document with the file OLE-embedded so it
    fires when the user opens the package contents. Identify the parent application and its command
    line to determine the delivery vector -- an Office parent (winword.exe, excel.exe, powerpnt.exe)
    points to an embedded file, while explorer.exe points to a directly double-clicked attachment.
    The parent command line often carries the document or file path; full delivery analysis requires
    reviewing email and download records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What process opened the .SettingContent-ms file, and is that parent chain expected?
  context: >-
    The parent process reveals how the file was launched. A direct double-click runs under
    explorer.exe; an OLE-embedded file fires under an Office application (winword.exe, excel.exe,
    powerpnt.exe). An Office application as the immediate parent of a settings shortcut is the high-risk
    lineage this technique relies on, because Office spawning a settings-page handler that in turn runs
    a shell command is not a normal document workflow. Walk up from the parent to see what spawned it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the .SettingContent-ms file still on disk for analysis?
  context: >-
    The detected command references a .SettingContent-ms file, so checking whether it still exists on
    disk enables deeper analysis -- reading the DeepLink target, hashing the file, or submitting it for
    review. These files are typically written to user-writable paths such as the Downloads folder,
    %TEMP%, or %APPDATA% when delivered as an attachment, and a Mark-of-the-Web zone identifier on the
    file confirms it arrived from the internet.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did outbound network activity follow this execution from the same host?
  context: >-
    The user-execution chain commonly ends in immediate outbound HTTP, HTTPS, DNS, or SMB from the same
    lineage -- the DeepLink command (for example regsvr32 /i:<URL> scrobj.dll or a powershell download
    cradle) reaches out to retrieve or stage a second-stage payload. Outbound connections from this host
    in the minutes after the alert, especially to newly seen or non-corporate destinations, indicate the
    command was not benign. Compare destinations against expected corporate update and CDN endpoints.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter:
        Image|endswith:
          - '\svchost.exe'
          - '\OneDrive.exe'
      condition: selection and not filter
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did the user-facing application that launched this command record an abnormal open or crash event?
  context: >-
    The first stage of the user-execution chain is a user-facing application (an Office app, PDF reader,
    archiver, or browser) recording an open or click immediately before the OS utility runs. An
    application error or hang event from the launching parent around the alert time corroborates that a
    document or attachment was opened and that handling it spawned a child process, which is consistent
    with an OLE-embedded or attachment-delivered .SettingContent-ms file rather than a deliberate
    administrative action.
  range: -15m
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Provider_Name
      - Provider_Name
      - Data
- question: When this host has previously fired this .SettingContent-ms pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    Even files that reference settings pages can be legitimate in narrow workflows. The query mirrors
    the rule's selection scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern -- not generic activity -- has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure relative to that history is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this .SettingContent-ms pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of
    this firing pattern. Many hosts firing the same pattern points to a broad delivery -- a phishing run
    that reached multiple recipients, or scripted/vendor automation that legitimately references these
    files. One host or a small unrelated set points to a targeted or manual trigger. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      condition: selection and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account triggered related
    activity on multiple endpoints, which would widen the scope of the investigation. If the same user
    opened files or ran interpreters on several hosts in this window, the delivery may have reached more
    than one system under that identity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: .SettingContent-ms
      filter:
        CommandLine|contains: immersivecontrolpanel
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding activity reveals what led to this event
    and what happened after -- whether a document or archive was opened just before, and whether
    reconnaissance, additional execution, or staging followed. Novel parent-child pairs at low counts
    are what to scan for against the background of repetitive routine processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- reconnaissance, defense tampering, or other execution -- may
    reveal the stages that preceded this event and help reconstruct the timeline. A delivery that landed
    a .SettingContent-ms file is often one step in a sequence, and prior alerts can show how the user or
    host was first reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other users or systems targeted by the same .SettingContent-ms delivery?
  context: >-
    Phishing deliveries rarely target a single user. If one recipient received a malicious settings
    shortcut, others likely did too. Searching for the same rule firing across other hosts reveals the
    breadth of the delivery and identifies additional systems that need investigation and possible
    containment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the application that opened the file, and the host's defenses, configured to block this technique?
  context: >-
    This technique was mitigated over time by adding .SettingContent-ms to the OLE block list and by the
    Attack Surface Reduction rule that blocks Office applications from creating child processes. Checking
    whether the launching application is current and whether that surface-reduction control is enabled
    indicates whether the execution should have been blocked and whether other similarly configured hosts
    remain exposed. Files installed from the application store may not be covered by that control.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
