name: Hacktool Execution - Imphash
id: fdbd9bb4-069d-4df1-9761-0a12a3e31a5a
description: |
  This rule fires when a process starts whose import hash (imphash) matches one of a fixed list of
  known Windows offensive-tool builds. An imphash is derived from the executable's import table, so it
  identifies the compiled build regardless of the file name or path on disk — renaming the binary does
  not change it, while recompiling or repacking the tool produces a different imphash that would not
  match. The listed builds are largely credential-access and post-exploitation tools that are also used
  in authorized security testing, so the investigation should establish which tool build ran, who
  invoked it and from where, whether an approved engagement covers it, and whether credential stores
  were touched or remote access followed.
type: detection
detection_id: 24e3e58a-646b-4b50-adef-02ef935b9fc8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process's import hash match one of the hacktool imphash values this rule lists?
  context: >-
    The rule matches on the Hashes field carrying one of a fixed list of IMPHASH values; the file name,
    path, and command line play no part in the match. Confirm the IMPHASH entry on the event is one of
    the listed values, and treat the file name as attacker-chosen rather than as corroboration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Hashes
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run offensive security tooling?
  context: >-
    Security engineering workstations, dedicated testing hosts, and incident-response toolkits run these
    builds as part of normal work. The same build starting on a general-purpose endpoint, under a
    standard user account, or under a service principal is a different situation and usually the fastest
    discriminator available before any log analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this tool execution part of an authorized penetration test or red team engagement?
  context: >-
    Tool builds identified by imphash are used in authorized assessments as often as in intrusions.
    Check whether a pentest or red team exercise is active on this host or network segment and whether
    the engagement's scope, operator accounts, and timing line up with this execution. A matching
    authorized engagement resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which tool is this build, and what capability did the command line invoke?
  context: >-
    The imphash names the compiled build, not the action taken. Identify the tool the build corresponds
    to, then read the arguments for the capability that was invoked: a credential-dumping module, a
    Kerberos ticket request, a directory-collection method, a share or session enumeration, or process
    injection. Because the file name is attacker-chosen, the argument syntax is the reliable evidence of
    which tool ran and what it was asked to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Are known artifacts of this tool present on the host?
  context: >-
    Offensive tools leave characteristic output: memory dump files, exported registry hives, .kirbi
    ticket files, JSON or ZIP collection sets in temp directories. The query returns file operations
    performed by the alerting process in the hour after execution, which shows what it produced even
    after the process exits. The scope keys on the path the build ran from, so output written by a
    second copy under another name will not appear here.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What credential stores were targeted?
  context: >-
    Builds in this list target different stores: LSASS memory, the SAM and SECURITY hives, NTDS.dit,
    cached domain credentials, browser password stores, and Kerberos tickets. The arguments identify
    which store was addressed, and that determines which accounts to treat as exposed and what
    remediation the incident needs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    What credential theft costs depends on the privilege of the accounts held on the host. Cross-
    reference the account that ran the tool, any accounts with active sessions on the host, and any
    accounts named in the arguments against directory group memberships. Domain administrator, service
    accounts with broad rights, and krbtgt change the response; a single standard user account may not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: What process spawned this tool, and is that parent chain expected?
  context: >-
    The parent shows how the build was launched. An interactive shell or explorer.exe points to a person
    at the keyboard; services.exe or a task host points to scheduled or service-driven execution; a
    script host, Office application, or remote-execution service points to delivery through another
    channel. Long-running parents often start hours or days before the alert, which is why the lookup
    reaches back that far.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote this binary to disk, and when did it arrive on the host?
  context: >-
    Because the imphash matches the compiled build no matter what the file is called, the write event is
    where the delivery channel becomes visible: a browser or mail client, an archive utility, a
    remote-execution service, or a copy from a share each point to a different route onto the host. A
    build resident for months in an administrator's tooling directory reads differently from one written
    minutes before it ran. If no write event exists in the window, the file may predate retention or
    have arrived on media the endpoint does not record.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: Did any process on this host make cross-process API calls consistent with writing into and executing in another process?
  context: >-
    Credential-access and post-exploitation builds routinely write into another process and force
    execution there, which surfaces as WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx calls from
    the acting program. This channel records the injection side only: opening and reading LSASS memory
    leaves nothing here, so an empty result does not rule out a memory read. Where the behavioral API
    channel is not collected from a host, treat zero rows as a visibility gap rather than as evidence
    nothing was injected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
      - ProcessGuid
  answer_sources:
  - process_creation
  - edr_console
- question: Did the Security channel record handle access to LSASS, the SAM hive files, or directory service objects around this execution?
  context: >-
    Object-access auditing records handle requests against protected objects: 4656 and 4663 on lsass.exe
    or the SAM, SYSTEM, and SECURITY hive files, and 4662 on directory service objects. An AccessMask
    granting full rights (0x1F0FFF) to a program that is not a known security or backup tool is what
    separates an extraction attempt from routine access, so read the mask alongside the requesting
    ProcessName. These codes only exist where object-access auditing is enabled — no rows may mean the
    audit policy is off rather than that nothing was accessed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4656
          - 4663
          - 4662
      condition: selection
    fields:
      - EventID
      - ObjectName
      - ProcessName
      - AccessMask
  answer_sources:
  - manual_review
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by movement to another host. The query returns outbound
    connections from this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22
    (SSH) — in the hours after the event, and the originating Image and User show what drove each one.
    Two limits: credentials taken here and replayed from another machine leave nothing in this result,
    so check 4624 logons on suspected targets for the exposed accounts; and if endpoint network
    telemetry is not collected from this host, zero rows are a visibility gap rather than evidence no
    movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: What child processes did this tool spawn afterward?
  context: >-
    Children of the tool show what happened next: a shell or script host for hands-on follow-up, an
    archive utility for staging collected data, or a copy or remote-execution utility for movement. The
    scope keys on the path the build ran from, so children of a second copy running under another name
    will not be counted here.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this binary run on this host before, and under which accounts?
  context: >-
    A 90-day count of executions of this file name on this host, grouped by account. Zero or a handful of
    prior runs points to first-time or rare execution. A steady count under an administrator or security
    tooling account suggests the build belongs to the host's normal toolset. The count keys on the file
    name, so prior runs of the same build under a different name fall outside it — a low count is not
    proof the tool is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    The account's activity across all hosts in the alert window shows whether the tool run was isolated
    or one step in activity spanning several endpoints, which bounds the scope of the investigation. If
    the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account, this returns
    unbounded agent-telemetry noise and the parent-mechanism clustering question carries the answer
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent process launch this same binary on other hosts in the same window?
  context: >-
    Under a service principal, user identity does not attribute behavior; the launch mechanism does. The
    query counts fleet-wide executions of the alerting file name under the alerting parent process in
    the alert window. Several hosts at once points to scheduled or pushed automation — a deployment
    system or an engagement harness; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts by binary and parent around the alert collapses repetitive agent and OS
    telemetry into a few high-count rows, while novel parent-child pairs stand out at low counts. Those
    low-count rows are where reconnaissance, additional tooling, and persistence setup around this
    execution become visible.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, remote-execution services,
    account manipulation — mark the stages that preceded the tool run and help reconstruct the timeline.
    An execution with no preceding detections is also informative: it points to the delivery being
    unobserved, or to the host being where tooling is staged rather than where access began.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
