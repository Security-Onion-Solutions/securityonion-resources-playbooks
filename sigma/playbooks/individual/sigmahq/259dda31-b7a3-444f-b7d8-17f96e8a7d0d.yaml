name: Potential RjvPlatform.DLL Sideloading From Default Location
id: bbd2b890-6274-4dec-9621-13a8265db682
description: |
  Detects the Windows binary SystemResetPlatform.exe loading RjvPlatform.dll from
  C:\$SysReset\Framework\Stack\, a directory that Windows does not create by default. Because a
  trusted, signed system executable will load a DLL of that name from that path, planting an
  attacker-controlled RjvPlatform.dll there causes it to run with the host process's trust — a DLL
  search-order side-load that can bypass application-control policy focused on executables rather
  than libraries. Legitimate loads of this pairing are rare because the $SysReset directory is not
  present on a default system, so the load itself is the anomaly. Investigation should confirm the
  loaded module's path, signature, and hash on the load event, identify which process wrote the DLL
  and created the $SysReset directory, and check for follow-on persistence on the host.
type: detection
detection_id: 259dda31-b7a3-444f-b7d8-17f96e8a7d0d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects, in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it against the rule's criteria. The rule
    fires when SystemResetPlatform.exe loads RjvPlatform.dll from C:\$SysReset\Framework\Stack\, a
    directory that is not created on a default system, so note whether the load path and the loading
    binary match that pairing. Library events carry the module's hash and signing status directly on
    the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to be performing a system-reset operation that loads this module?
  context: >-
    SystemResetPlatform.exe is the Windows reset-platform binary, so a genuine RjvPlatform.dll load
    would accompany a system-reset workflow on that host. If no reset operation is expected for this
    user role or host function, a load of this module — especially from the non-default $SysReset
    directory — is far more likely to be a planted side-load than routine platform activity. Confirm
    whether the user role and host function are consistent with a legitimate reset operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What modules did SystemResetPlatform.exe load, and are any from non-standard directories, unsigned, or user-writable paths?
  context: >-
    The full set of modules a process loads exposes a side-loading operation the alerting event alone
    does not. Look for DLLs loaded from user-writable or non-default locations such as $SysReset,
    AppData, ProgramData, Public, or a temp directory; unsigned modules sitting where signed ones are
    expected; and system DLL names loaded from non-system paths. A known-safe DLL directory list is
    the comparison point — RjvPlatform.dll loaded out of C:\$SysReset\Framework\Stack\ sits well
    outside it and is the search-order plant this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the loaded RjvPlatform.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a benign library from a side-loaded malicious one. An unsigned
    module, or one whose signature is expired, distrusted, or invalid, is a strong masquerade
    indicator; even a validly signed DLL loaded from the non-default $SysReset path warrants scrutiny.
    The hash on the load event supports a threat-intel lookup that can surface a known loader, and a
    baseline hash of any legitimate RjvPlatform.dll is the direct comparison point for detecting
    substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What was the full command line and working directory of the SystemResetPlatform.exe process that loaded the DLL?
  context: >-
    The loading process runs from the pinned System32 path, so the discriminator is how it was
    launched and what it was doing. Read the command line, working directory, and immediate parent to
    determine whether this was an interactive or scheduled reset workflow, an automated maintenance
    task, or an execution with no legitimate reset context. A working directory or invocation that
    does not match a genuine reset operation strengthens the side-load reading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned SystemResetPlatform.exe, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how the reset binary was launched. A genuine reset
    typically traces to a system or user-initiated maintenance workflow; a loader started by a script
    host, an archive utility, a launcher, or an unfamiliar dropper points to attacker-driven execution
    staged to trigger the side-load. Walk the parent chain to see what initiated the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote RjvPlatform.dll and created the $SysReset directory, and when relative to the load?
  context: >-
    Side-loading requires the attacker-controlled library to be placed on disk, and here it also
    requires creating the $SysReset directory tree that Windows does not build by default. Identify
    the process that wrote RjvPlatform.dll into C:\$SysReset\Framework\Stack\ and when it did so. A
    write by an archive tool, script host, or launcher shortly before the load is the plant step; the
    gap between the write and the load frames the correlation window for the rest of the activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the RjvPlatform.dll module still on disk for analysis?
  context: >-
    If the side-loaded module is still present, it can be hashed, submitted to a sandbox, or reviewed
    statically. Checking for the file written by the alerting process or its direct children confirms
    whether the artifact remains available or was already removed after execution, which itself is a
    cleanup signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Has RjvPlatform.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If the
    same module has been loaded repeatedly by SystemResetPlatform.exe over the prior 90 days, this
    load may be routine for a host that reset before. If this is the first occurrence, or the module
    has historically loaded only under different processes, the current load is anomalous and
    consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that load, and does the current alert fit?
  context: >-
    The query mirrors the rule's exact selection — SystemResetPlatform.exe loading
    RjvPlatform.dll from $SysReset — scoped to this host, so the resulting program and user
    distribution reflects how this specific pairing has run here rather than generic binary
    usage. A new acting program process, an unexpected user account, or a first-ever occurrence
    is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image: C:\Windows\System32\SystemResetPlatform\SystemResetPlatform.exe
        ImageLoaded: C:\$SysReset\Framework\Stack\RjvPlatform.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - image_load
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's exact selection with no host scope, so the result is a fleet-wide
    count of this specific load pattern rather than generic use of the binary. Many hosts loading
    RjvPlatform.dll from $SysReset points to scripted deployment or a shared vector; a single host or
    a small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity and spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image: C:\Windows\System32\SystemResetPlatform\SystemResetPlatform.exe
        ImageLoaded: C:\$SysReset\Framework\Stack\RjvPlatform.dll
      condition: selection
    fields:
    - host.name
  answer_sources:
  - image_load
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Side-loading is one stage in a chain, and the load event rarely stands alone. Examining process
    activity in a tight window around the load reveals what launched the loader, what the side-loaded
    module did next, and whether file writes into $SysReset and the load line up on the same short
    timeline. Look for dropper execution, defense tampering, and persistence installation in the same
    interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load.
    Reconnaissance, dropper execution, or defense tampering ahead of this event helps reconstruct the
    timeline and shows whether the load is an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Was there a change ticket, maintenance window, or documented approval for a system-reset operation on this host?
  context: >-
    A genuine SystemResetPlatform.exe run usually accompanies a deliberate reset or reimaging
    workflow, which mature environments record. A corresponding ticket or maintenance window suggests
    authorized activity; absence of one, when policy requires it, suggests the reset binary was
    driven to load a planted DLL rather than to perform a sanctioned reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this activity align with normal work hours and expected maintenance?
  context: >-
    Legitimate reset and maintenance operations track scheduled windows and business hours. A
    RjvPlatform.dll load on an in-service host, at an hour with no expected maintenance, is harder to
    explain as routine reset activity and more consistent with automated execution from a planted
    side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that survives reboot is often paired with backup persistence. After establishing one
    foothold, operators commonly install additional mechanisms through scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Several persistence installations in the same
    timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File monitoring captures these drops even when the operator avoids
    standard persistence tooling, which is consistent with a stealth-focused side-load.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
