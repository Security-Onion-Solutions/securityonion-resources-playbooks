name: Suspicious Dropbox API Usage
id: 9cdd64d1-0347-4785-b850-13c507064483
description: |
  Detects a process that is not the Dropbox client making an outbound connection to the Dropbox API
  endpoints (api.dropboxapi.com, content.dropboxapi.com); the rule already excludes processes running
  from a Dropbox install path, so a match is some other binary talking to the API directly. Adversaries
  abuse the Dropbox API as a command-and-control and exfiltration channel because the traffic blends
  with sanctioned cloud storage — a downloaded second-stage tool (T1105) and a bulk data upload
  (T1567.002) both ride the same HTTPS API. The investigation identifies the initiating process and its
  lineage, confirms the destination through the DNS lookup, and determines whether files were staged for
  upload or pulled down and executed.
type: detection
detection_id: 25eabf56-22f0-4915-a1ed-056b8dae0a68
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the destination and port match what this rule detects, and which process initiated it?
  context: |
    Confirm the alert from the exact destination and port, the direction, and the initiating process
    against the rule's criteria — an outbound (initiated) connection to a Dropbox API endpoint from a
    process that is not running out of a Dropbox install path. The destination hostname is sparsely
    recorded on connection events because name resolution is a separate event, so anchor on the
    destination address the connection used and treat the Dropbox API domain confirmation as a DNS-lookup
    pivot.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to move data through Dropbox or other cloud storage?
  context: |
    Sanctioned cloud storage is normal on many endpoints, but only from the vendor's own client and only
    for certain accounts. A user with a plausible business reason to use Dropbox reads differently from a
    service account, a server, or a workstation whose role never involves cloud file transfer; for the
    latter cases the staging and transfer questions carry the weight. Whether the account is on the list
    permitted to use external cloud services is the fastest true-positive-versus-routine discriminator.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which process initiated the connection, and what do its command line and working directory show?
  context: |
    A non-Dropbox process reaching the Dropbox API is the signal — the rule fires precisely because the
    client is excluded. The initiating binary separates benign integrations from abuse: a browser or a
    known API integration reads differently from powershell, curl, a script host, or an unrecognized
    binary. The command line may carry the API call, an access token, or the path of the file being sent
    or fetched, and the working directory can point at a staging location. If the alert came from
    network-level telemetry with no process fields, identify the process through the connection's own
    process attribution or the DNS-lookup pivot instead.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which host and process resolved the Dropbox API domain, and what address did it return?
  context: |
    The destination hostname is rarely present on the connection event because resolution is logged
    separately, so the DNS lookup is where the Dropbox API domain is confirmed and tied to the process
    that requested it. The querying program distinguishes a browser or sanctioned client from scripted
    tooling. The resolved address also identifies which entry in the connection results is the Dropbox
    endpoint versus unrelated traffic, since the API is fronted by shared content-delivery infrastructure.
  range: +/-5m
  answer_sources:
  - dns_query
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
          - api.dropboxapi.com
          - content.dropboxapi.com
      condition: selection
    fields:
      - QueryName
      - Image
- question: What process spawned the one that connected, and is that chain expected?
  context: |
    The parent reveals how the connecting process was invoked. A user-driven transfer traces to
    explorer.exe or a browser session, while a binary launched by a command shell, script interpreter,
    an Office application, or a scheduled-task host is the lineage of automated tool transfer or
    exfiltration. Known-good updaters (vendor sync clients, software-management agents) have predictable
    parents; an unexpected parent name is a tuning point and an escalation trigger. The parent's own
    command line shows the script or command that orchestrated the connection.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other connections were made to this destination or from this process, and does the frequency look like beaconing or bulk transfer?
  context: |
    A single connection may be one leg of a larger pattern. Repeated connections at regular intervals fit
    command-and-control beaconing, while a few long-lived transfers with a high outbound-to-inbound ratio
    fit bulk upload; volumes beyond roughly ten megabytes in one session exceed casual use and point at
    data movement. Pairing the destination view with a pivot on the initiating process surfaces every
    endpoint that process contacted, which separates a single Dropbox interaction from a multi-stage
    operation. Aggregating over a time window is how the outbound-volume anomaly becomes visible.
  range: +/-1h
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What files did the initiating process touch around the alert?
  context: |
    Data headed for a cloud upload usually shows up in file activity first — an archive written minutes
    before the connection, exported documents, or a payload arriving from the API in the download
    direction. File paths tell you what is at stake and which direction the transfer runs. Uncommon drop
    locations such as C:\Users\Public or other world-writable directories are a stronger signal than a
    user's own documents folder. An archive found here makes its creating process the next pivot,
    including any password or encryption flags on that process's command line. File reads in sensitive
    directories are the collection side but are not always recorded, so absence of read events does not
    rule out staging.
  range: +/-5m
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Is a downloaded or staged file still on disk for analysis?
  context: |
    If the connection pulled down a second-stage tool or wrote a staged archive, checking whether the
    file still exists lets you retrieve it for a hash lookup, sandbox submission, or content review. This
    view correlates file writes to the alerting process and its direct children, which is the
    download-and-drop or archive-and-stage footprint; grandchildren and unrelated writers will not appear.
    A file present here is the artifact to hash and reputation-check.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a downloaded payload was executed, what is its hash and is it known to threat intelligence?
  context: |
    The hash needed for a reputation lookup or sandbox detonation is recorded when a payload runs, not
    when it is written — file-creation events carry no hash in this telemetry. This view returns the
    processes the initiating binary and the shell that launched it spawned, with their executable hashes;
    for a download-and-execute that is the payload. If the payload was run later by an unrelated process
    it will not appear here — retrieve the file from the on-disk path and hash it manually. A DLL payload
    surfaces instead as an unsigned module load.
  range: +1h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: Did archiving or collection tools run on this host around the alert?
  context: |
    Bulk exfiltration through a cloud API is usually preceded by collection — an archiver compressing a
    directory tree into something uploadable. Archive tooling running shortly before the connection
    completes the collection-then-transfer sequence, and its command lines name exactly what was gathered.
    Password or header-encryption flags on those commands (for example -p, -hp, --passphrase, -mhe=on)
    indicate deliberate content hiding, which frustrates inspection of what left the environment and
    raises the severity of a confirmed upload.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_archivers:
        Image|endswith:
          - '\rar.exe'
          - '\winrar.exe'
          - '\7z.exe'
          - '\7zG.exe'
          - '\tar.exe'
          - '\makecab.exe'
      selection_ps_archive:
        CommandLine|contains: 'Compress-Archive'
      condition: selection and (selection_archivers or selection_ps_archive)
    fields:
      - Image
      - CommandLine
- question: Has this host reached this destination before?
  context: |
    A first-time connection to a destination is a stronger signal than routine communication. Because the
    Dropbox API is fronted by shared content-delivery infrastructure, a nonzero history on the destination
    address may reflect the legitimate Dropbox client or other tenants on the same address rather than this
    process — the Image grouping over the history separates the sanctioned client from the binary that
    triggered the alert. A history that begins abruptly at the alert marks when the behavior started.
  range: -90d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the initiating program?
  context: |
    A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or
    very low historical counts indicate first-time or rare execution, which fits freshly staged tooling.
    The user grouping shows whether the program runs under the interactive user or an automated context.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Do other hosts in the environment reach this destination?
  context: |
    Fleet distribution frames the response. Because the Dropbox API address is shared infrastructure, a
    broad set of hosts may connect for legitimate reasons — the discriminator is the initiating process,
    so read the result grouped by process rather than treating every host as compromised. A cluster of
    hosts running the same non-Dropbox binary against the API points at coordinated tooling or a
    multi-host operation, and each of those hosts needs the same staging-and-transfer review as this one.
  range: -7d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Alerts rarely occur in isolation. Aggregated parent-child process pairs around the alert reveal the
    surrounding sequence — collection or reconnaissance before the connection, cleanup or further transfers
    after it. Novel low-count pairs stand out against repetitive agent noise and are what to scan for.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections tell you where this fits in a larger operation. Reconnaissance or credential access
    before the connection suggests the exfiltration stage of an intrusion, while a preceding download or
    execution alert suggests the ingress-tool stage. Defense-tampering or discovery alerts near this one
    raise the priority of a confirmed transfer, and the alert timeline helps reconstruct the sequence.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
