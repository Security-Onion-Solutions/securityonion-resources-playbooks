name: Suspicious SYSTEM User Process Creation
id: 1da0281e-ff57-4bb6-bb11-61ca2d0d0b08
description: |
  Detects a process running under the SYSTEM security context (System integrity level or the S-1-16-16384 SID, with a User value containing AUTHORI/AUTORI) that is also one of a set of suspicious indicators: a named LOLBin (calc.exe, cscript.exe, forfiles.exe, hh.exe, mshta.exe, ping.exe, wscript.exe), a "net user" command, or a command line carrying a known-bad pattern (encoded PowerShell preambles, credential-dumping module syntax such as sekurlsa::/lsadump::/dpapi::/MiniDump, vssadmin shadow deletion, reg SAVE HKLM, download cradles, or run-key persistence). Several benign cases are filtered out (ping loopback tests, a Java web-start launcher, configuration-manager and DISM-driven invocations).
  Running such tools as SYSTEM is unusual: it means the activity inherited the highest local privilege, which is what an actor seeks after token manipulation or service abuse, and it is the context credential-dumping and log-clearing tooling prefers. Legitimate sources are administrative scripts, deployment tooling, and monitoring agents that already run as SYSTEM. The investigation should confirm the exact command matched, identify which suspicious branch fired (a named binary versus a command-line pattern), establish whether the SYSTEM-owned launch mechanism is routine on this host, and determine whether credential stores or endpoint protection were touched.
type: detection
detection_id: 2617e7ed-adb7-40ba-b0f3-8f9945fe6c09
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process run as SYSTEM and match one of the rule's suspicious binary or command-line patterns?
  context: Confirm the alert is a true positive before investing time. The rule fires only when the process runs at System integrity (User contains AUTHORI/AUTORI) AND the event matches one suspicious branch — a named binary (calc.exe, cscript.exe, forfiles.exe, hh.exe, mshta.exe, ping.exe, wscript.exe), a "net user" command, or a known-bad command-line pattern (encoded PowerShell, credential-dumping module syntax, vssadmin/reg SAVE, download cradle, run-key write). Review the full command line and note which branch fired — a named-binary match and a command-line-pattern match carry different downstream weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - IntegrityLevel
- question: Is this host and its SYSTEM-context tooling expected to run this binary or command pattern?
  context: Legitimate administrative scripts, deployment tooling, and monitoring agents already run as SYSTEM and can match this rule. Determine whether the host's function and its known automation make this binary or command pattern routine. Where an allowlist of permitted service accounts and known admin utilities exists for this environment, check the alerting context against it; a match outside that allowlist is the deviation worth pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are any files referenced by the command line still on disk for analysis?
  context: The command-line patterns this rule matches frequently reference files — decoded output (certutil -decode), downloaded payloads (download cradles), or saved registry hives (reg SAVE HKLM). Checking whether those files still exist enables hash lookups, sandbox submission, or content review. File paths are derived from the command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What credential stores were targeted by this command? Decode the module syntax and named arguments.
  context: The command-line patterns this rule matches include credential-dumping module syntax (sekurlsa::, lsadump::, dpapi::, vault::, token::, kerberos::), LSASS dumping (MiniDump), and registry-hive theft (reg SAVE HKLM). Identify the specific store targeted — LSASS memory (sekurlsa/MiniDump), SAM/SYSTEM/SECURITY hives (reg SAVE), DPAPI masterkeys, cached or vault credentials, or Kerberos tickets — because the target determines which accounts may be compromised and what remediation is needed. Saving all three SAM-related hives, or any LSASS access, confirms credential-theft intent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the command line encoded or obfuscated, and what does it decode to?
  context: 'This rule matches several encoded-PowerShell preambles (-e* JAB, -e* SUVYI, -e* IAB, and related base64 prefixes), the -decode/-urlcache flags, and download-string/download-file cradles. Decode the payload to reveal actual intent: download cradles, in-memory loaders, credential theft, or reverse shells. For base64, decode the -EncodedCommand argument; for certutil-style content, identify the -decode source and output files; iterate decoding for multi-layer encoding until the payload is readable. Entropy and compression heuristics distinguish obfuscation from legitimate packing.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this process or a child it spawned write an LSASS memory-dump-style file to disk, corroborating the credential-dumping module syntax in the command line?
  context: Credential dumping reads LSASS memory directly, but the handle open to lsass.exe that a read requires has
    no equivalent telemetry in this environment, so a zero result there is not evidence the dump did not happen. What
    is observable is the artifact a successful MiniDump or sekurlsa-style extraction leaves on disk. This view is
    scoped to files written by the alerting process itself and by any child it spawned, tying a written file directly
    to this SYSTEM-context command rather than to unrelated activity elsewhere on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What privileged-logon and sensitive-object-access events occurred for this process around the alert time?
  context: 'Token manipulation and credential access leave traces in the security channel that process telemetry does not: a special-privileges logon assignment (the SYSTEM-context token being established) and sensitive-object handle requests against credential stores. These records corroborate whether the SYSTEM context was newly minted for this activity or inherited from a long-running service, and which objects the activity touched.'
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4672
          - 4663
          - 4656
          - 4662
      condition: selection
    fields:
      - EventID
      - winlog.event_data.SubjectUserName
      - ObjectName
      - ProcessName
- question: For any file the command downloaded or decoded, what is in it? Check for obfuscation, encoded strings, and malware indicators.
  context: 'The download-string/download-file and -decode patterns this rule matches write content to disk. Read and analyze that content directly: check scripts for base64, obfuscated strings, embedded URLs or IP addresses, and known malware string patterns; check binaries for imports, embedded strings, packer signatures, and signing status. This is content analysis — distinct from a hash/reputation lookup. Retrieval requires manual access to the endpoint. File paths are derived from the command line.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the downloaded or decoded file execute, and what is the hash of what this activity spawned?
  context: A file's hash is recorded when it runs, not when it is downloaded or decoded — and on a process-creation alert the dropped file's own path is not retained in telemetry, so a hash has to be recovered from execution. This returns the processes spawned by the alerting process and by its parent (its children and siblings), with their executable hashes; if the downloaded or decoded payload ran as part of this activity it appears here — submit its hash to VirusTotal, Hybrid Analysis, or internal threat intel. A payload staged for later, or in-memory-only activity (credential dumping, shadow-copy deletion), will not appear; for a staged file, retrieve it from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        IntegrityLevel:
        - System
        - S-1-16-16384
        User|contains:
        - AUTHORI
        - AUTORI
      selection_special:
      - Image|endswith:
        - \calc.exe
        - \cscript.exe
        - \forfiles.exe
        - \hh.exe
        - \mshta.exe
        - \ping.exe
        - \wscript.exe
      - CommandLine|re: net\s+user\s+
      - CommandLine|contains:
        - ' -NoP '
        - ' -W Hidden '
        - ' -decode '
        - ' /decode '
        - ' /urlcache '
        - ' -urlcache '
        - ' -e* JAB'
        - ' -e* SUVYI'
        - ' -e* SQBFAFgA'
        - ' -e* aWV4I'
        - ' -e* IAB'
        - ' -e* PAA'
        - ' -e* aQBlAHgA'
        - vssadmin delete shadows
        - reg SAVE HKLM
        - ' -ma '
        - Microsoft\Windows\CurrentVersion\Run
        - .downloadstring(
        - .downloadfile(
        - ' /ticket:'
        - 'dpapi::'
        - event::clear
        - event::drop
        - id::modify
        - 'kerberos::'
        - 'lsadump::'
        - 'misc::'
        - 'privilege::'
        - 'rpc::'
        - 'sekurlsa::'
        - 'sid::'
        - 'token::'
        - vault::cred
        - vault::list
        - ' p::d '
        - ;iex(
        - MiniDump
      filter_main_ping:
        CommandLine|contains|all:
        - ping
        - 127.0.0.1
        - ' -n '
      filter_vs:
        Image|endswith: \PING.EXE
        ParentCommandLine|contains: \DismFoDInstall.cmd
      filter_config_mgr:
        ParentImage|contains: :\Packages\Plugins\Microsoft.GuestConfiguration.ConfigurationforWindows\
      filter_java:
        ParentImage|contains:
        - :\Program Files (x86)\Java\
        - :\Program Files\Java\
        ParentImage|endswith: \bin\javaws.exe
        Image|contains:
        - :\Program Files (x86)\Java\
        - :\Program Files\Java\
        Image|endswith: \bin\jp2launcher.exe
        CommandLine|contains: ' -ma '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
