name: HackTool - SharPersist Execution
id: aabbd861-130f-49c1-b19a-e5b9f1b5051f
description: |
  Detects execution of SharPersist, a C# Windows persistence toolkit that deploys
  triggers such as scheduled tasks, services, registry Run keys, and startup-folder
  shortcuts. The rule fires when the process image or product name identifies the
  tool, OR when the command line carries one of the toolkit's persistence-install
  patterns (a schtask/startupfolder create, or a reg/service/schtask add) -- any one
  of these branches matching is sufficient. Legitimate hits are limited to authorized
  penetration tests or red-team engagements; otherwise this indicates an operator
  establishing persistence, often staged after initial access. Investigation should
  confirm the firing branch, decode the persistence technique and payload that was
  installed, determine whether the persistence is still active, and look for parallel
  mechanisms or earlier stages on the host.
type: detection
detection_id: 26488ad0-f9fd-4536-876f-52fea846a2e4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting event match SharPersist by its image/product name, or by a persistence-install command-line pattern?
  context: >-
    The rule fires when EITHER the image name or product is SharPersist, OR the command
    line carries one of its install patterns -- ' -t schtask -c ', ' -t startupfolder -c ',
    or ' -t reg -c ' / ' -t service -c ' / ' -t schtask -c ' combined with ' -m add'.
    Confirm which branch matched: a name/product match identifies the binary directly,
    while a command-line-only match can fire on a renamed binary, so note which one
    you see. Review the full Image, Product, and CommandLine on the triggering event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Product
- question: Is this user and host expected to install persistence mechanisms such as scheduled tasks, services, or registry run keys?
  context: >-
    Persistence installation is rarely routine end-user activity. Knowing whether the
    account and host normally perform administrative persistence changes -- and whether
    the user role matches that -- is often the fastest way to separate an authorized
    operator or admin from an intrusion. SYSTEM or a service account firing this on a
    workstation is a stronger anomaly than an admin account on a managed server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharPersist execution part of an authorized penetration test or red team engagement?
  context: >-
    SharPersist is an offensive persistence toolkit used in authorized security
    assessments. Before investing analysis time, check whether a pentest or red-team
    exercise is currently active on this host or network segment. An authorized
    engagement with matching tool usage and timing resolves the alert without further
    work; absence of one moves the disposition toward unauthorized persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What persistence technique and payload did this command install? Decode the -t technique, -m method, and the -c command it runs.
  context: >-
    The SharPersist command line follows the pattern ' -t <technique> -m <method> [args]'.
    The -t value names the trigger (schtask, startupfolder, reg, service, schtaskbackdoor,
    keepass, tortoisesvn), -m is the action (add installs it; check is a dry run; list/remove
    are inventory/cleanup), -c is the command the persistence will execute, -a its
    arguments, and -k/-v/-n/-f name the registry key, value, task, or file. Decode these
    to identify exactly what payload was made persistent and through which mechanism.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which SharPersist trigger technique and method were invoked, and does the method indicate a committed install or a dry run?
  context: >-
    SharPersist is multi-purpose: -t selects the persistence trigger and -m selects the
    action. ' -m add' commits the persistence; ' -m check' is a dry-run that validates
    arguments without writing; ' -m list'/' -m remove' inventory or clean up. The -t value
    determines scope and privilege -- reg/startupfolder/schtask can run in user context,
    while service and the hklm/userinit registry hives require admin. The combination tells
    you whether persistence was actually established and how privileged it is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If a scheduled task was installed, when is it set to run and has the scheduler already executed its payload?
  context: >-
    The trigger schedule determines when the persistence activates. Tasks set to run at
    boot or logon fire on the next restart or sign-in; recurring tasks (hourly, daily) may
    have already executed multiple times. Scheduled tasks run as children of the Task
    Scheduler service, so process-creation events spawned by svchost.exe running the
    Schedule service after task creation reveal whether the payload has fired.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the installed persistence (scheduled task, service, registry value, or startup shortcut) still present on the system?
  context: >-
    Persistence is only effective if the artifact still exists, and some operators remove
    it after use to reduce forensic traces. Confirm the specific artifact named in the
    command line is still registered -- query the scheduled task, the created service, the
    registry value, or the startup-folder shortcut on the host or via endpoint tooling.
    Its presence determines whether an active persistence mechanism still requires removal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does a scheduled-task creation event in the security log confirm a new task was registered, and under what author and account?
  context: >-
    SharPersist's schtask techniques register a task through the Task Scheduler, which
    emits a task-creation record in the security log independent of the process command
    line. That record names the task author and the account context the task was created
    under -- an unexpected author or account is the deviation worth chasing. If a creation
    event is absent, the alert may have fired on a check/list dry run, a non-task technique
    (reg, service, startupfolder), or a renamed binary that never reached the scheduler.
  range: +4h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4698
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
      - TaskContent
- question: What files did the SharPersist process create on this host?
  context: >-
    The toolkit's persistence techniques leave artifacts on disk: startup-folder LNK
    shortcuts, dropped payload binaries or scripts, and modified config files such as a
    KeePass configuration. The tool can also time-stomp dropped files so they inherit a
    benign timestamp. File-creation events tied to the tool's process surface these
    artifacts even after the original process exits, and reveal payloads the command line
    alone may not fully spell out.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned SharPersist, and is that parent chain expected?
  context: >-
    The parent process reveals how the tool was launched. This toolkit is built for
    reflective in-memory loading, so the parent is frequently not a SharPersist.exe on
    disk but a host process the operator injected into or a script host. A parent such as
    an interactive shell, a remote-execution service, or an unexpected application points
    to operator-driven execution; walk up the parent's own chain to see what initiated it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even a tool with legitimate engagement use leaves a baseline. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how the rule's specific firing pattern has historically run here
    -- not generic binary usage. A new parent process, an unexpected account, or a first-time
    firing on this host is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharPersist.exe
      - Product: SharPersist
      selection_cli_1:
        CommandLine|contains:
        - ' -t schtask -c '
        - ' -t startupfolder -c '
      selection_cli_2:
        CommandLine|contains|all:
        - ' -t reg -c '
        - ' -m add'
      selection_cli_3:
        CommandLine|contains|all:
        - ' -t service -c '
        - ' -m add'
      selection_cli_4:
        CommandLine|contains|all:
        - ' -t schtask -c '
        - ' -m add'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharPersist.exe
      - Product: SharPersist
      selection_cli_1:
        CommandLine|contains:
        - ' -t schtask -c '
        - ' -t startupfolder -c '
      selection_cli_2:
        CommandLine|contains|all:
        - ' -t reg -c '
        - ' -m add'
      selection_cli_3:
        CommandLine|contains|all:
        - ' -t service -c '
        - ' -m add'
      selection_cli_4:
        CommandLine|contains|all:
        - ' -t schtask -c '
        - ' -m add'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharPersist.exe
      - Product: SharPersist
      selection_cli_1:
        CommandLine|contains:
        - ' -t schtask -c '
        - ' -t startupfolder -c '
      selection_cli_2:
        CommandLine|contains|all:
        - ' -t reg -c '
        - ' -m add'
      selection_cli_3:
        CommandLine|contains|all:
        - ' -t service -c '
        - ' -m add'
      selection_cli_4:
        CommandLine|contains|all:
        - ' -t schtask -c '
        - ' -m add'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or persistence
    installed on multiple endpoints. If the same account triggered similar activity on
    several hosts in this window, the scope of the operation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharPersist.exe
      - Product: SharPersist
      selection_cli_1:
        CommandLine|contains:
        - ' -t schtask -c '
        - ' -t startupfolder -c '
      selection_cli_2:
        CommandLine|contains|all:
        - ' -t reg -c '
        - ' -m add'
      selection_cli_3:
        CommandLine|contains|all:
        - ' -t service -c '
        - ' -m add'
      selection_cli_4:
        CommandLine|contains|all:
        - ' -t schtask -c '
        - ' -m add'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is
    a fleet-wide count of the rule's firing pattern rather than generic usage of the binary.
    Many hosts firing the same pattern points to scripted deployment or assessment
    automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \SharPersist.exe
      - Product: SharPersist
      selection_cli_1:
        CommandLine|contains:
        - ' -t schtask -c '
        - ' -t startupfolder -c '
      selection_cli_2:
        CommandLine|contains|all:
        - ' -t reg -c '
        - ' -m add'
      selection_cli_3:
        CommandLine|contains|all:
        - ' -t service -c '
        - ' -m add'
      selection_cli_4:
        CommandLine|contains|all:
        - ' -t schtask -c '
        - ' -m add'
      condition: 1 of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host in the same timeframe?
  context: >-
    Operators rarely rely on a single persistence mechanism. After establishing one
    foothold, they commonly install backups using different techniques -- scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions, sometimes via standard
    tools rather than the same toolkit. Multiple persistence installations from the same
    timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence installation usually sits in the middle of an intrusion, after initial
    access and often after defense evasion or credential access. Earlier detections on the
    same host -- reconnaissance, defense tampering, credential access -- may reveal the
    stages that preceded this event and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
