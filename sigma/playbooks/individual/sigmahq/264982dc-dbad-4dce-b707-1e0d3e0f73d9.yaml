name: Renamed NirCmd.EXE Execution
id: 49a8da74-936a-4361-a7bf-deb08155f81a
description: |
  Detects a process whose embedded PE metadata identifies it as NirCmd (OriginalFileName = NirCmd.exe)
  but whose on-disk filename does NOT end in nircmd.exe or nircmdc.exe — i.e., the utility has been renamed.
  NirCmd is a legitimate, signed command-line tool that performs many UI-less Windows actions (registry writes,
  run-as-SYSTEM elevation, process termination, screenshot capture, system shutdown, remote execution from a
  host list). It is renamed to camouflage those high-impact primitives in process audits, so the rename itself
  is the signal regardless of the subcommand. Investigation should confirm the metadata/filename mismatch,
  determine how the renamed binary arrived, decode what subcommands it ran, and establish whether the same
  renamed binary or launch pattern appears elsewhere in the environment.
type: detection
detection_id: 264982dc-dbad-4dce-b707-1e0d3e0f73d9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process carry NirCmd PE metadata while running under a filename other than nircmd.exe or nircmdc.exe?
  context: Confirm the alert is a true positive before investing time. The rule fires when the embedded
    OriginalFileName equals NirCmd.exe AND the on-disk Image does not end in \nircmd.exe or \nircmdc.exe — a
    renamed copy. Review the OriginalFileName and the Image path together and verify the mismatch is real and
    not a benign tool that happens to share the metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- question: Is this user and host expected to run NirCmd-style administrative utilities?
  context: Legitimate IT scripting and admin automation does use NirCmd for volume control, display settings,
    or scripted housekeeping. Knowing whether the user role and host function routinely involve UI-less admin
    tooling is often the fastest path to separating routine operations from a renamed binary planted by an
    operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The file is named something other than nircmd.exe but its OriginalFileName says NirCmd.exe. Compare
    the Image path on disk against the embedded OriginalFileName to confirm the true tool, and use the file hash
    for a reputation lookup to determine whether this is the genuine signed NirSoft binary, a known-bad sample,
    or a novel file. The signing party and signature status indicate whether the metadata can be trusted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously — they were copied, downloaded, or dropped by a parent
    process. Tracing the file creation event by basename reveals the delivery mechanism: a download tool, a
    dropper, manual copy, or lateral movement. A landing path under Desktop, Downloads, Temp, or AppData points
    to download or extraction; a system directory points to compromise of a privileged process or an installer.
    The Image field in the file event shows which process wrote the file.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this renamed binary do after execution, and is the same renamed binary present on other hosts?
  context: The point of renaming is to evade notice while performing the tool's function. Child processes, file
    operations, and network connections from the renamed binary reveal its actual objective. The same renamed
    binary appearing on multiple hosts points to deliberate distribution rather than an isolated event. Pivot on
    OriginalFileName or the file hash to find the renamed copy elsewhere in the environment.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What NirCmd subcommands and arguments did this binary run? Decode the full command line.
  context: NirCmd's risk is in the subcommand. Decode the arguments to identify high-impact primitives —
    elevatecmd or runassystem (run as SYSTEM), regsetval (registry writes), killprocess or service stop,
    exitwin poweroff/reboot, savescreenshot, multiremote (execute across a host list), or cmdshortcut. The query
    scopes to all executions of this renamed binary on this host within the window, since a single logical
    operation may span several sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Legitimate admin scripting often has
    predictable parents (explorer.exe for user actions, a scheduler or scripting host for automation). Unusual
    parents such as wscript.exe, mshta.exe, a browser, or an Office application point to delivery via a script
    or document rather than deliberate administrative use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this renamed binary or its child processes open outbound network connections after execution?
  context: Indirect-execution utilities frequently chain into outbound transfers — fetching follow-on payloads
    or beaconing to a controller. Correlate network connections from the renamed binary and any process it
    spawned to determine whether execution led to egress. Compare destinations against known-good egress for
    this host; connections to unfamiliar external endpoints raise the priority of the investigation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known_good:
        Image|endswith:
          - \svchost.exe
          - \MsMpEng.exe
      condition: selection and not filter_known_good
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run a binary carrying NirCmd metadata?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. A zero
    or very low historical count for NirCmd-metadata executions on this host indicates first-time or rare use,
    consistent with a planted copy rather than established admin tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the parent/user distribution reflects how the rule's specific firing pattern — a renamed NirCmd —
    has historically run here. A new parent process, an unexpected user account, or an unusual command structure is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: NirCmd.exe
      filter_main_img:
        Image|endswith:
        - \nircmd.exe
        - \nircmdc.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of renamed-NirCmd executions (not generic NirCmd usage). Many hosts firing the same pattern points to
    scripted deployment or vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: NirCmd.exe
      filter_main_img:
        Image|endswith:
        - \nircmd.exe
        - \nircmdc.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: NirCmd.exe
      filter_main_img:
        Image|endswith:
        - \nircmd.exe
        - \nircmdc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: NirCmd.exe
      filter_main_img:
        Image|endswith:
        - \nircmd.exe
        - \nircmdc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user drove similar activity on several hosts in this window, the scope of the event
    may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: NirCmd.exe
      filter_main_img:
        Image|endswith:
        - \nircmd.exe
        - \nircmdc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining surrounding activity reveals the immediate context: what
    led to this event, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, or persistence around the alert window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the attack stages that preceded this event and help reconstruct the timeline. Renamed tooling is
    often a mid-chain step that follows delivery and precedes hands-on actions.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
