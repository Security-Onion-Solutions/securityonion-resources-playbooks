name: Detected Windows Software Discovery - PowerShell
id: 3c97e067-b067-4495-b199-894d8ca8a865
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  contains all of get-itemProperty, \software\, select-object, and format-table together --
  the pattern of enumerating installed software and versions from the registry. Adversaries
  run this inventory to learn which security products are present and whether vulnerable
  software versions exist before choosing their next step (T1518); administrators and
  asset-management automation run the same registry queries legitimately. The investigation
  should recover the full script and identify which registry paths were read and what happens
  to the output, establish what launched the PowerShell host, look for surrounding
  reconnaissance and follow-on activity, and check whether the pattern is new to the user,
  the host, and the fleet.
type: detection
detection_id: 2650dd1a-eb2a-412d-ac36-83f06c4f2282
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain the software-inventory pattern this rule detects?
  context: >-
    The rule fires when a script block contains all four of get-itemProperty, \software\,
    select-object, and format-table -- the combination of reading registry keys under a
    \software\ path and formatting the results into a table. Long scripts are split across
    multiple 4104 events, so read every chunk of the alerting block (sequence/total order)
    and confirm the four strings appear as a registry software inventory rather than as
    incidental content in a larger unrelated script.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run software-inventory PowerShell?
  context: >-
    Registry-based software enumeration is routine for administrators, helpdesk staff, and
    asset-management or patch-compliance automation; standard users rarely have a reason to
    script it. Check the user's role against the host's function and the script's on-disk
    path shown here -- a recognized management-tool path under Program Files reads
    differently from an unnamed script in a user profile. Blocks logged under SYSTEM
    usually come from deployment tooling or a vendor agent; judge those by the host role
    and the path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the complete script do, and does any obfuscated content remain to decode?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the whole script.
    The 4104 channel records what PowerShell actually compiles, so -EncodedCommand wrappers
    are already unwrapped; only in-script obfuscation (string concatenation, format
    operators, backticks, variable substitution) still needs manual decoding. Identify
    which registry paths under \software\ the script reads -- Uninstall keys are a general
    inventory, while queries against security-product keys are attacker-style AV discovery
    -- and what happens to the output: displayed, written to a file, or sent over the
    network. Also note whether the inventory is one fragment of a larger framework script,
    and chase any URLs or file paths it references.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what created it?
  context: >-
    When the script block ran from a file, its path is recorded on the 4104 event. An
    inventory script in a user-writable or staging location (Temp, AppData, ProgramData,
    Downloads) implies a delivery step that wrote it -- find the file-creation event to
    identify the process and account that staged it. No recorded path means interactive or
    in-memory execution, which is common for pasted admin one-liners but is also how
    download-cradle frameworks run their discovery modules; weigh it with the launch and
    network evidence.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: What launched the PowerShell hosts this user ran on this host, and is that launch pattern normal?
  context: >-
    Script block events carry no process linkage, so the launch context comes from process
    telemetry for this user's PowerShell hosts. Interactive inventory work is launched from
    explorer.exe or a terminal, and approved management tooling launches from its known
    service or agent binaries; discovery spawned by Office applications, script hosts
    (wscript, cscript, mshta), wmiprvse.exe, or wsmprovhost.exe points to macro delivery or
    remote execution. The command line also shows delivery-style flags such as -nop,
    -w hidden, or -enc.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - ParentImage
    - ParentCommandLine
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Attacker-run discovery is often preceded by disabling the controls that would record or
    block the rest of the operation. Common precursors include AMSI bypass (AmsiUtils,
    amsiInitFailed), execution-policy overrides (-ExecutionPolicy Bypass, -ep bypass),
    real-time monitoring changes (Set-MpPreference, DisableRealtimeMonitoring), and
    downgrade to PowerShell version 2, which lacks script block logging. Any of these on
    the host in the preceding hour makes the inventory read as one step of a prepared
    intrusion rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single software inventory may be legitimate troubleshooting, but registry-based
    software discovery alongside other enumeration -- whoami, systeminfo, tasklist, net,
    nltest -- within a short window is the pattern of post-compromise reconnaissance, where
    an operator or an automated framework maps the system before its next step. Three or
    more distinct recon binaries inside fifteen minutes typically means scripted
    enumeration rather than a person troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Did the PowerShell session spawn follow-on activity after the script ran?
  context: >-
    A 4104 event records script content, not outcome. Software inventory guides what comes
    next -- an attacker who found a vulnerable version or confirmed which security product
    is present typically proceeds to tool download, exploitation, or tampering with the
    identified product. That activity appears as children of the same user's PowerShell
    hosts shortly after the block was logged; the event carries no process link, so this
    pivots by host, user, and time. Under SYSTEM the user anchor is broad because
    deployment tooling shares it -- weigh individual children rather than the raw count.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did a PowerShell host on this machine make outbound network connections around the script execution?
  context: >-
    Discovery frameworks are frequently pulled onto a host through a PowerShell download
    cradle, and inventory output is sometimes sent out the same way, so outbound
    connections from PowerShell hosts bracket attacker-run enumeration on both sides.
    Script block events carry no process identity, so this pivots by host, PowerShell host
    binaries, and time. Connections to unfamiliar external addresses matter most; note
    that only process-attributed endpoint telemetry appears here, and network-level records
    without process fields may exist separately.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block -- recon commands, staging, and
    follow-on tooling produce a cluster of script blocks in a short window, and the
    surrounding blocks often contain the plaintext context the alerting fragment lacks,
    such as the framework that called the inventory or what was done with its output. The
    log.level column shows how complete this picture is: verbose events mean full Script
    Block Logging is on, while warning-only means the host records just the
    automatically-flagged subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it
    is not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it, and absence of other 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-block query in
    this investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The aggregated parent-child pairs collapse routine agent noise into high-count rows
    while novel pairs stand out at low counts. Around a software-inventory script, look
    for the delivery side (Office applications or browsers spawning script hosts), other
    enumeration tooling, and processes that do not normally spawn children starting
    command interpreters.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Software discovery usually sits in the middle of an intrusion -- after initial access
    and execution, before the attacker acts on what the inventory revealed. Earlier
    detections on the same host, such as delivery, defense tampering, or credential
    access, reveal the stages that preceded the enumeration and help reconstruct the
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this exact script block run on this host before?
  context: >-
    The hash matches byte-identical content only, so zero history is strong evidence this
    exact script is new to the host, while a block that has recurred for months fits
    inventory automation, patch-compliance checks, or vendor agents. A trivially edited
    variant hashes differently, so history says nothing about near-variants. On hosts
    without full Script Block Logging the history contains only automatically-flagged
    blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user previously produced this rule's inventory pattern, and does that history fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user, returning their 90-day
    history of script blocks combining get-itemProperty, \software\, select-object, and
    format-table, aggregated by host. Administrators and asset-management operators may
    produce this pattern regularly; a first-ever occurrence from a user whose role
    involves no system administration reads differently. Weigh the count against what the
    user's job plausibly involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - get-itemProperty
        - \software\
        - select-object
        - format-table
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this script pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so
    the pattern itself is the pivot. The query mirrors the rule's selection fleet-wide
    over 90 days, aggregated by host. An inventory pattern that routinely appears across
    many hosts fits deployed asset-management tooling; one that has never appeared before,
    or only on this host, is the deviation worth chasing. Only hosts shipping the
    PowerShell channel (and, for non-flagged content, with full Script Block Logging
    enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - get-itemProperty
        - \software\
        - select-object
        - format-table
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the inventory may be
    one step of movement between them -- attackers repeat discovery on each host they
    reach -- and the per-host binary summary shows what else the account ran. When the
    alert fired under SYSTEM or another service principal this view fills with routine
    service activity; in that case the fleet-wide script-pattern question is the
    meaningful breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same script pattern fire on other hosts in the same window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host, which is the meaningful breadth check when user identity is a service principal
    and no process identity exists on this channel. Several hosts in the same window
    points to scheduled or pushed automation, such as an inventory or compliance sweep
    that change records should corroborate; a single host points to a host-local trigger.
    Coverage is policy-gated per host, so absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - get-itemProperty
        - \software\
        - select-object
        - format-table
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
