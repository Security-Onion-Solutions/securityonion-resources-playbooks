name: Clear PowerShell History - PowerShell
id: 7fa9893d-8b5f-45d5-aa8f-d48c9f1a0f75
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  indicates clearing or suppression of the PSReadLine command history. The rule fires when a
  block either contains Set-PSReadlineOption together with -HistorySaveStyle (hyphen or en
  dash variant) and SaveNothing, disabling history recording, or combines a deletion command
  (del, Remove-Item, rm) with the (Get-PSReadlineOption).HistorySavePath expression, removing
  the on-disk history file (by default ConsoleHost_history.txt under
  AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine). PSReadLine records every command
  typed in an interactive session, so operators commonly scrub or disable it after
  hands-on-keyboard activity to remove evidence, while administrators and privacy-conscious
  users occasionally do the same legitimately. The investigation should recover the complete
  script block, establish which branch fired, confirm from file telemetry whether the history
  file was actually deleted, and reconstruct what surrounding and prior activity the clearing
  was meant to conceal.
type: detection
detection_id: 26b692dc-1722-49b2-b496-a8258aa6371d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain one of the history-clearing patterns this rule detects?
  context: >-
    The rule fires when the block either contains Set-PSReadlineOption together with
    -HistorySaveStyle and SaveNothing (a hyphen and an en dash variant of the parameter are
    both covered, since pasted commands often carry the formatted dash), or contains one of
    the deletion tokens del, Remove-Item, or rm alongside the
    (Get-PSReadlineOption).HistorySavePath expression. Note which branch fired. The
    SaveNothing branch suppresses future history recording, while the deletion branch
    destroys history already on disk and should leave file-deletion evidence. The deletion
    tokens are short substrings that appear in much benign text, so the discriminating
    element of that branch is the HistorySavePath expression itself. Long scripts are split
    across multiple 4104 events, so judge the match on the complete reassembled block.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user or host expected to clear or suppress PowerShell command history?
  context: >-
    PSReadLine history is per-user and written only by interactive sessions, so this behavior
    implies hands-on keyboard use rather than unattended automation. Some administrators and
    privacy-conscious users clear history legitimately, and some hardening baselines disable
    history saving by policy. Judge the user's role, the host's function, and the on-disk
    script path shown here against known practice; history clearing under SYSTEM or another
    service principal is unusual because service sessions rarely load PSReadLine at all.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the script behind this block still on disk, and what wrote it there?
  context: >-
    A file-based script block records its on-disk path, and the file-activity rows identify
    the process and account that staged the script; for this rule a script file implies the
    history clearing was embedded in prepared tooling rather than typed. Most alerts on this
    rule come from commands typed interactively or run in memory, which record no path, so an
    empty result is common and expected here. When a file does exist, preserve it, and treat
    the history file the script targets as a second artifact to preserve, since deleted
    history content may still be recoverable from shadow copies or backups.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What does the complete script block do once reassembled and decoded?
  context: >-
    Retrieve every chunk of the block in sequence/total order and read the whole script. The
    4104 channel records what PowerShell actually compiles, so -EncodedCommand wrappers are
    already unwrapped; only in-script obfuscation such as string concatenation, format
    operators, and backtick escaping still needs manual decoding. Establish the operational
    purpose. A lone history-clearing one-liner reads as interactive cleanup, while a larger
    script that also stages tooling, touches other files, or reaches out to the network makes
    the clearing one step of a prepared sequence. Any additional paths, hosts, or URLs in the
    script are new leads to chase.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Which history-recording mechanism was targeted, and by what command?
  context: >-
    The branches differ in effect. Deleting the file at (Get-PSReadlineOption).HistorySavePath
    destroys already-recorded commands, Set-PSReadlineOption -HistorySaveStyle SaveNothing
    stops recording from that point on, and related variants such as remove-module psreadline
    or Clear-History (which empties only the in-session buffer, not the file) accomplish
    similar ends. The query surveys history-tampering invocations visible in process command
    lines on this host and user over a wide window, catching variants launched via powershell
    -Command that surround or repeat the alerting block.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      selection_history:
        CommandLine|contains:
          - 'HistorySaveStyle'
          - 'HistorySavePath'
          - 'ConsoleHost_history'
          - 'Clear-History'
      condition: selection and selection_history
    fields:
    - CommandLine
  answer_sources:
  - process_creation
- question: Was the PSReadLine history file created, modified, or deleted on this host around the alert?
  context: >-
    The alert records intent in script content; file telemetry shows effect. This survey is
    anchored on the ConsoleHost_history.txt filename derived from the rule's content, because
    the alert itself carries no placeholder that resolves to the history file. A deletion
    event near the alert confirms the deletion branch executed and names the deleting
    process; re-creation afterward means an interactive session resumed recording. If the
    SaveNothing branch fired, no file event is expected because the change is
    configuration-only. A custom -HistorySavePath relocates the file, so an empty result does
    not rule out deletion at a non-default path, and deleted content may survive in shadow
    copies or backups.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\ConsoleHost_history.txt'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Is PowerShell history recording currently restored on this host?
  context: >-
    Set-PSReadlineOption applies to the running session, so persistent suppression requires
    the command in a PowerShell profile. Review the affected user's profile scripts for
    SaveNothing, check whether the history file is being written again during new sessions,
    and confirm current state directly on the host or through endpoint tooling by reading
    (Get-PSReadlineOption).HistorySaveStyle in that user's context. The query surveys
    PSReadLine-related invocations on this host and user across a wide window, showing
    whether suppression was later reversed or repeated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      selection_psreadline:
        CommandLine|contains: 'PSReadline'
      condition: selection and selection_psreadline
    fields:
    - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: Were PowerShell security controls bypassed or weakened around this activity?
  context: >-
    History clearing removes evidence after the fact; the same operators frequently suppress
    visibility up front with AMSI bypass (AmsiUtils, amsiInitFailed), execution-policy
    overrides (-ExecutionPolicy Bypass, -ep bypass), real-time protection changes
    (Set-MpPreference, DisableRealtimeMonitoring), or a downgrade to PowerShell version 2,
    which lacks script block logging. Any of these in the preceding hour marks deliberate
    anti-forensics around the alerting session rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What ran on this host in the hour after history recording was tampered with?
  context: >-
    Once SaveNothing is active or the history file is gone, subsequent interactive commands
    leave no history trace, so process telemetry becomes the primary record of what the
    suppression was meant to hide. The aggregated image and user summary collapses routine
    noise; look for tooling, script hosts, and account activity that follows the clearing,
    and correlate anything notable with network and file events in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense tampering actions performed on this host?
  context: >-
    Operators who scrub history often tamper with more than one control, such as clearing
    event logs (wevtutil), deleting shadow copies (vssadmin), disabling recovery (bcdedit),
    changing firewall state (netsh), or stopping services (sc). The alerting PowerShell
    activity itself can surface in this survey since it matches the deletion terms; look for
    other tools and targets beyond the history clearing. Multiple tampering actions from the
    same account in one window point to deliberate cleanup across several controls rather
    than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    A history-clearing command rarely stands alone; the commands whose history it scrubs
    often appear as surrounding script blocks in the same window, and those blocks may
    contain the reconnaissance, staging, or credential activity being concealed. The
    log.level column shows whether the host records all blocks (verbose present) or only
    automatically-flagged content (warning only), which determines how complete this picture
    is.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or only suspicious-content capture?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content at warning level when it is
    not. On a warning-only host the surrounding activity this investigation looks for,
    including the commands the history clearing was meant to conceal, was likely never
    logged, so absence of other 4104 evidence is not absence of activity. The level
    distribution calibrates how much weight every other script-block query here can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    History clearing typically follows the activity it conceals. Credential-access,
    reconnaissance, execution, or lateral-movement detections in the preceding hours identify
    what an operator may have been covering, and place the clearing inside a timeline rather
    than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were persistence mechanisms installed on this host around the history clearing?
  context: >-
    Scrubbing interactive history commonly closes out a setup phase. After creating scheduled
    tasks, services, registry run keys, or BITS jobs from an interactive session, an operator
    deletes the history that records those commands. This aggregated survey of persistence
    tooling in the surrounding hours shows whether such setup preceded or followed the
    cleanup; anything found here also survives independently of the erased history.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user cleared or suppressed PowerShell history before, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user, returning their 90-day
    history of this specific clearing pattern aggregated by host. An administrator or
    developer who routinely scrubs history produces a standing count; a first-ever occurrence
    from a user whose role involves no interactive PowerShell reads differently. Weigh the
    count against what the user's job plausibly involves, and remember only hosts logging the
    channel can contribute.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1a:
        ScriptBlockText|contains:
        - del
        - Remove-Item
        - rm
      selection1b:
        ScriptBlockText|contains: (Get-PSReadlineOption).HistorySavePath
      selection_2:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - "–HistorySaveStyle"
        - SaveNothing
      selection_3:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - -HistorySaveStyle
        - SaveNothing
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* or all of selection1*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this history-clearing pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under a service principal, user identity does not attribute
    behavior, and script block events carry no process identity to pivot on, so the pattern
    itself is the pivot. The query mirrors the rule's selection fleet-wide over 90 days,
    aggregated by host. A pattern appearing routinely across many hosts fits a deployed
    baseline or vendor tooling that disables history saving; one that has never appeared
    before, or only on this host, is the deviation worth chasing. Only hosts shipping the
    PowerShell channel, and for non-flagged content only those with full Script Block
    Logging, can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1a:
        ScriptBlockText|contains:
        - del
        - Remove-Item
        - rm
      selection1b:
        ScriptBlockText|contains: (Get-PSReadlineOption).HistorySavePath
      selection_2:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - "–HistorySaveStyle"
        - SaveNothing
      selection_3:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - -HistorySaveStyle
        - SaveNothing
      condition: 1 of selection_* or all of selection1*
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the history clearing may
    be one step of movement between them, and the per-host binary summary shows what else the
    account ran. When the alert fired under SYSTEM or another service principal this view
    fills with routine service noise; the fleet-wide pattern question is then the meaningful
    breadth check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this history-clearing pattern fire on other hosts in the same window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host. Several hosts in the same window points to pushed configuration or scheduled
    automation, which change records should corroborate; a single host points to a hands-on,
    host-local action. Coverage is policy-gated per host, so absence elsewhere is weak
    evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1a:
        ScriptBlockText|contains:
        - del
        - Remove-Item
        - rm
      selection1b:
        ScriptBlockText|contains: (Get-PSReadlineOption).HistorySavePath
      selection_2:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - "–HistorySaveStyle"
        - SaveNothing
      selection_3:
        ScriptBlockText|contains|all:
        - Set-PSReadlineOption
        - -HistorySaveStyle
        - SaveNothing
      condition: 1 of selection_* or all of selection1*
    fields:
    - host.name
  answer_sources:
  - ps_script
