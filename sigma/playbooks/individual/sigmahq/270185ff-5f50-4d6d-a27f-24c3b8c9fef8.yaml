name: Tomcat WebServer Logs Deleted
id: b6834b4f-009d-45df-bb61-cb7f06005f34
description: |
  Detects deletion of Apache Tomcat web-server log files (catalina, localhost, and access logs
  under a Tomcat \logs\ directory). Legitimately this occurs during log rotation, server
  uninstallation, or maintenance; maliciously it is indicator removal — destroying the HTTP
  request record and server events that would document a web-application attack. Investigation
  should confirm the deleted files are Tomcat logs, identify the deleting process and its lineage,
  determine what web activity the erased logs would have recorded, and check for correlated
  tampering or an intrusion preceding the cleanup.
type: detection
detection_id: 270185ff-5f50-4d6d-a27f-24c3b8c9fef8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the deleted file match a Tomcat web-server log under a Tomcat \logs\ directory?
  context: The rule fires on deletion of files whose path contains \Tomcat and \logs\ and whose
    name begins with catalina., _access_log., or localhost.. Confirm the alert's file path is one
    of these Tomcat log files and that the operation was a deletion before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to delete Tomcat web-server logs?
  context: Log rotation, server uninstallation, and maintenance scripts legitimately remove Tomcat
    logs. Knowing whether the host runs Tomcat and whether the responsible user or process is a
    recognized maintenance account is often the fastest way to separate routine cleanup from
    evidence destruction. When the user is a machine or service account, judge by the responsible
    process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which Tomcat logs did the deleting process remove, and what command performed the deletion?
  context: The deleting process's full command line names the specific logs removed — catalina
    (server startup, shutdown, and application events), localhost and access logs (HTTP request
    records — client address, timestamp, method, resource, status code). Which logs were cleared
    indicates what web-activity window is being erased and sets remediation priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Can the deleted Tomcat logs be recovered, and do prior write events confirm what they recorded?
  context: A deletion event carries no file content. The erased logs recorded HTTP requests and
    server events that may be the only record of the web activity being hidden. Recovery paths are
    Volume Shadow Copies, backups, and the recycle bin; prior file-write events on this path confirm
    the log was actively written and bound the window now missing.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: Were the deleted Tomcat logs recreated or restored after the alert, or do they remain missing?
  context: The post-alert lifecycle drives next steps. If Tomcat resumed writing fresh logs, the gap
    is bounded to the deleted window; if the path stays empty, logging may have been stopped as well
    as cleared, extending the loss of visibility beyond the single deletion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process spawned the process that deleted the logs, and is that parent chain expected?
  context: The parent reveals how the deletion was launched. A scheduled maintenance task or installer
    parent fits routine rotation; a web-server worker process spawning a shell, a remote-access tool,
    or a script host as parent points to exploitation of the web application driving the cleanup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is Tomcat logging currently active again, or is the host still not recording web-server logs?
  context: Deletion may be a one-off wipe or paired with stopping the logging pipeline. If new
    catalina, localhost, and access entries are being written, logging recovered; if the logs are
    not repopulating, the visibility gap persists and should be restored before further investigation.
    Confirm current status by direct host inspection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: What activity occurred on this host after the Tomcat logs were deleted?
  context: Logs are often cleared to hide what runs next. With the web-server request record removed,
    process activity in the window immediately after the deletion is the remaining view of what the
    cleanup may have been meant to conceal. A quiet period followed by new process creation points to
    the activity the deletion enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense-tampering or log-clearing actions performed on this host?
  context: Removing one log set often accompanies clearing Windows event logs, deleting shadow copies,
    or disabling recovery to maximize evidence loss. Multiple tampering actions from the same user or
    parent process point to a deliberate anti-forensic sweep rather than routine rotation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other files did the deleting process write or delete around the alert?
  context: A process removing one log rarely stops there. Enumerating the responsible process's other
    file writes and deletions reveals whether it cleared additional logs, staged output, or touched
    many paths — separating a single log rotation from a broader wipe.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to or removed from the Tomcat logs directory recently, and by which processes?
  context: The Tomcat \logs\ directory is written by a small, known set of processes. Other recent
    arrivals or deletions there, and unfamiliar writing processes, reveal whether this is isolated
    cleanup or a directory under active manipulation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|all:
          - '\Tomcat'
          - '\logs\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before the logs were deleted?
  context: Log deletion is usually a late step. Earlier alerts on this host — web-shell drops,
    exploitation of the web application, reconnaissance, or credential access — may reveal the
    intrusion the log wipe is meant to erase and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- always_include: true
  question: Has this user deleted Tomcat logs before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the user's 90-day history of
    Tomcat-log deletion, not generic file activity, aggregated by host. A user who has never removed
    these logs is more suspicious than a maintenance account that rotates them regularly; weigh the
    count against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Tomcat
        - \logs\
        TargetFilename|contains:
        - catalina.
        - _access_log.
        - localhost.
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven Tomcat-log deletion on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute
    the action — the launch mechanism does. The query is the 90-day history of this program driving
    the rule's exact deletion pattern, by host. A program that already accounts for many prior deletions
    is rotation automation; a new or rare program is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Tomcat
        - \logs\
        TargetFilename|contains:
        - catalina.
        - _access_log.
        - localhost.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around the time of the deletion?
  context: Tracking the user's activity across hosts reveals whether the same account was active on
    multiple endpoints in the window — a sign the scope extends beyond this web server. If the alert
    fired under a service or machine account, the parent-pattern view is the meaningful pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven deletion pattern fire on other hosts in the same window?
  context: Under a service principal, per-user network activity is agent noise. The meaningful question
    is whether the same launch mechanism deleted Tomcat logs elsewhere in the alert window — multiple
    hosts points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains|all:
        - \Tomcat
        - \logs\
        TargetFilename|contains:
        - catalina.
        - _access_log.
        - localhost.
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were process-based persistence mechanisms installed on this host around the deletion?
  context: Anti-forensic cleanup on a compromised web server often accompanies persistence installation
    — scheduled tasks, services, registry Run keys, or BITS jobs establishing a foothold that survives
    reboot. Persistence tool executions in the same window indicate the deletion is part of an intrusion,
    not maintenance.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
