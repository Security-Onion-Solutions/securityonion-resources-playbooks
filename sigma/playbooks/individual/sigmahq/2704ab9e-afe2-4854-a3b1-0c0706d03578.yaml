name: HackTool - Dumpert Process Dumper Execution
id: 2c7f30bd-0326-4139-9511-7d2ccfaeac31
description: |
  Detects execution of the Dumpert LSASS memory dumper, identified either by the known Dumpert DLL hash or by a command line that references Dumpert.dll. Dumpert uses direct system calls and API unhooking to read lsass.exe process memory and write a minidump while evading user-mode API hooks, so the resulting dump is typically created on disk in a temporary location and then exfiltrated. This is an offensive credential-access tool; legitimate use is essentially limited to authorized penetration tests or red-team engagements, so the investigation should confirm whether an engagement is active, determine what the tool did to LSASS, identify which accounts may now be exposed, and check for follow-on lateral movement.
type: detection
detection_id: 2704ab9e-afe2-4854-a3b1-0c0706d03578
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this event match the known Dumpert hash or a command line referencing Dumpert.dll?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on either of two conditions
    the known Dumpert DLL hash (MD5 09D278F9DE118EF09163C6140255C690) or a command line that contains the string Dumpert.dll, such as a rundll32 invocation loading the Outflank-Dumpert DLL. Review the exact command line and hash against these criteria and note which condition matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Hashes
- question: Is this user and host expected to load Dumpert.dll or dump LSASS memory?
  context: Legitimate administrative activity rarely involves an LSASS memory dumper. Knowing whether the user role and host function would ever plausibly run a credential-dumping tool is often the fastest path to distinguishing an authorized test from an intrusion. A general workstation or server with no security-testing role running this tool is a strong escalation signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Dumpert execution part of an authorized penetration test or red team engagement?
  context: Offensive LSASS dumpers are used in authorized security assessments. Before investing further investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further analysis; absence of any engagement makes this a hands-on-keyboard credential-access event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was LSASS memory successfully accessed or dumped, and by what method?
  context: Dumpert targets LSASS process memory specifically, using direct system calls and API unhooking rather than the more common comsvcs.dll MiniDump or procdump paths. Identify whether the dump completed and what method was used the technique reveals attacker sophistication, and a successful LSASS dump means any credentials cached in that process (logon passwords, NTLM hashes, Kerberos tickets) may now be in attacker hands.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What loader and arguments invoked Dumpert, and which dumping capability was triggered?
  context: This tool ships as both an executable and a DLL; the DLL form is typically loaded through rundll32 with an exported Dump function, and an sRDI/shellcode form can be injected into an existing process. The command line, module name, and exported function reveal which capability ran and whether the dump was written to disk or kept in memory, which determines the scope of potential credential compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the Dumpert process itself, or a child it spawned, write a file to disk consistent with the LSASS minidump it produces?
  context: Dumpert opens lsass.exe with full access rights before reading and dumping its memory, but that handle
    open has no equivalent telemetry in this environment, so a zero result there does not mean the dump did not
    happen. What can be observed is the artifact the dump produces on disk. This view is scoped tightly to the
    process that triggered this alert and its own children, distinct from the broader host-wide temp-directory
    search below, so a hit here ties a written file directly to this Dumpert execution rather than to unrelated
    activity elsewhere on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned the Dumpert loader, and is that parent chain expected?
  context: The parent process reveals how the tool was launched and whether a known good tool is being allowlisted incorrectly. A handle to LSASS from a security or backup agent has a predictable parent; a dumper launched from a web shell, a remote-execution service, an Office application, or a script host (mshta, wscript, cmd, powershell) points to operator activity. Note the parent's own parentage to reconstruct how execution reached this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was an LSASS minidump file written to a temporary directory on this host?
  context: Dumpert writes the LSASS minidump to disk before exfiltration, commonly into temporary paths such as the user or system TEMP folder or C:\Windows\Temp. A new .dmp or minidump-sized file in those locations around the alert time confirms the dump completed even if the dumping process has exited, and the file path and timestamp anchor the credential-exposure window. Absence of a dump file may mean an in-memory-only variant or that file telemetry is incomplete.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - '\Temp\'
          - '\AppData\Local\Temp\'
          - '\Windows\Temp\'
      condition: selection_host and selection_path
    fields:
      - TargetFilename
      - Image
- question: Were registry values written or modified on this host that are indicative of credential scraping around the alert?
  context: The staged credential-theft chain sometimes pairs LSASS access with registry modification such as flipping the RunAsPPL/LSASS protection value, enabling WDigest credential caching (UseLogonCredential), or staging configuration before dumping. Registry writes to the LSA, WDigest, or SAM-related keys close in time to the LSASS access strengthen the case that this is deliberate credential scraping rather than an isolated tool launch.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_key:
        TargetObject|contains:
          - '\Control\Lsa\'
          - '\SecurityProviders\WDigest\'
          - '\Control\SecurityProviders\'
      condition: selection_host and selection_key
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains: MD5=09D278F9DE118EF09163C6140255C690
      - CommandLine|contains: Dumpert.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains: MD5=09D278F9DE118EF09163C6140255C690
      - CommandLine|contains: Dumpert.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered comparable activity on several hosts in the alert window, the scope of compromise may be larger than the single triggering host. Credential dumping is frequently followed by the operator pivoting with the harvested credentials.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains: MD5=09D278F9DE118EF09163C6140255C690
      - CommandLine|contains: Dumpert.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of an LSASS dump depends on which credentials were resident in memory on this host at the time. Any account with an active or cached logon session privileged users, domain or enterprise admins, and service accounts with broad rights may now be exposed. Domain admin or service-account exposure requires incident escalation and credential rotation; a standalone standard-user session may only need monitoring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern (the Dumpert hash or Dumpert.dll command line), not generic binary usage. Many hosts firing the same pattern points to scripted deployment or a sanctioned tool; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains: MD5=09D278F9DE118EF09163C6140255C690
      - CommandLine|contains: Dumpert.dll
      condition: selection
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even when a tool has run before on a host, the firing context matters. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Hashes|contains: MD5=09D278F9DE118EF09163C6140255C690
      - CommandLine|contains: Dumpert.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
