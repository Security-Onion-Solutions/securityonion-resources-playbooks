name: Windows Suspicious Child Process from Node.js - React2Shell
id: 9645271a-841c-455a-ad6a-97ecbcd95a83
description: |
  Detects a Node.js server process (node.exe) running a Next.js or react-scripts application spawning a child process that
  reads as command execution rather than toolchain work. The rule fires when the parent command line matches an application-server
  pattern AND the child matches any one of three alternatives: an Image on the interpreter / LOLBin list (or a path containing
  \python); a command line carrying a tool token such as powershell, certutil, curl, or whoami; or a cmd.exe child that is not
  one of the known-benign development commands (git config, netstat piped to findstr, mkcert setup). Node.js applications reach
  system commands through the child_process module (spawn, exec, execSync, fork), so unsanitized request input that reaches one
  of those calls yields arbitrary command execution; CVE-2025-55182 in React Server Functions is one route to it. Development
  and build hosts produce this parent-child pairing constantly through package scripts and toolchains, so the investigation
  should establish whether the host is a developer workstation or an application server, decode what the child actually executed,
  and determine whether a web request preceded it.
type: detection
detection_id: 271de298-cc0e-4842-acd8-079a0a99ea65
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does this event match what the rule detects, and which branch of the condition fired?
  context: >-
    The rule requires a node.exe parent whose command line carries a Next.js or react-scripts server pattern, and then any
    one of three alternatives. Either the child Image is on the interpreter, shell, and network/recon binary list (or its path
    contains \python); or the child command line carries a tool token such as powershell, certutil, curl, or whoami; or the
    child is cmd.exe, whether without the default '/d /s /c ' shell flag or with it and not matching the known-benign git,
    netstat, or mkcert command lines. Note which branch fired. An Image-branch match names the executed tool directly, while
    the token and cmd.exe branches mean the payload is wrapped in a shell and the real command has to be read out of the
    command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host a developer or build machine, or a server running a Node.js web application?
  context: >-
    node.exe spawns shells and helper binaries constantly in development and build environments; package scripts, toolchain
    wrappers, and test runners all produce node.exe into cmd.exe into tool chains. On a host whose job is serving an
    application, the same pairing has no routine explanation and points at command execution reaching the runtime through the
    request path. Establish the host's role and the account the server runs under before spending time on the child process
    itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the node.exe parent instance running, and what started it?
  context: >-
    The parent's own command line names the application entry point (start-server.js, next dev, next start, react-scripts
    start) and the directory it was launched from. A server started by a service manager or a CI runner out of an application
    directory is a different situation from a node.exe launched interactively from a developer's shell in a project checkout.
    A parent running out of a temporary directory is worth noting on its own.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What web request reached the Node.js application immediately before this child process started?
  context: >-
    Server-side exploitation of a web framework starts with a crafted request; the process spawn is the tail end of it. Pull
    the application's own access and error logs for the minutes before the spawn and look for exploit-like input in paths,
    query strings, and request bodies, such as path traversal, serialized object payloads, prototype or template references,
    null bytes, and encoded command strings. An error rate above the host's normal baseline (for instance more than five 4xx
    or 5xx responses in five minutes from one client) narrows the originating source address.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the Node.js runtime and the application framework it serves fully patched?
  context: >-
    Rules like this one exist because a specific unpatched code path lets request input reach child_process. CVE-2025-55182
    in React Server Functions is the current example, where a crafted chunk reference resolves to the Function constructor
    and executes attacker-supplied code. Determine the runtime and framework versions the parent is serving; an unpatched
    instance makes exploitation a working explanation for the spawn and identifies the other hosts running the same build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same node.exe instance spawn?
  context: >-
    One command executed through a request path is usually followed by more from the same server process. Several children of
    the same node.exe instance, such as an identity check followed by a download tool followed by a shell, describe hands-on
    activity rather than a single toolchain call. If parent identity is not populated on the alerting event, the host-scoped
    fallback still shows what node.exe spawned in the window.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What does the child command line actually execute once the shell wrapper and any encoding are stripped?
  context: >-
    The command that reached the runtime is what the operator wanted to run. On the default execSync path the command is
    wrapped as cmd.exe /d /s /c "...", and the real command sits inside the quotes; when a shell option is specified the
    payload appears directly, for example powershell -c whoami. Decode -EncodedCommand or -enc base64 content, unwind
    concatenation and backtick escaping, and identify what the payload does, such as an identity check, a download cradle,
    an in-memory assembly load, or a reverse shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Was a Windows service installed on this host around the time of the alert?
  context: >-
    sc.exe is one of the child binaries this rule matches, and service creation is a common step after command execution on a
    server because it survives reboots and runs with system privileges. Event 7045 gives the service name, the binary path it
    executes, the start type, and the account, which is more reliable than parsing sc.exe arguments. Read the binary path as
    the payload, particularly when it points at a user-writable or temporary directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Payloads delivered through a server process often clear the way first. Execution policy flags let unsigned script content
    run, AmsiUtils or amsiInitFailed patching blinds script scanning, a version downgrade selects an engine without script
    block logging, and Set-MpPreference with DisableRealtimeMonitoring turns off real-time inspection. Any of these on the
    host in the hour before the alert, from any parent, adds context to the child that fired.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    The first command run through an exploited request path is typically an identity or environment check, and whoami,
    ipconfig, systeminfo, and net.exe are all on this rule's child list. Several distinct recon binaries within a few minutes
    describe an operator or script orienting on the host, which is different from a single tool call inside a build step. Note
    which account they ran under and whether it is the account the application server runs as.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What modules did this node.exe instance load, and were any loaded from a writable or temporary directory?
  context: >-
    Exploitation of a server process shows up in module loads as well as child processes. A native addon or DLL pulled in from
    a temporary or application-writable directory after the request arrives is a second execution path that leaves no process
    creation event behind. Read the load path and the signature status together: Node.js legitimately loads unsigned native
    modules out of node_modules, so the discriminator is the directory and the load time relative to the alert, not the
    absence of a signature on its own.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
- question: Did the node.exe server or the spawned child process make outbound connections around the alert?
  context: >-
    The stage after command execution on an exploited server is usually a callback or a payload fetch, and several of the
    matched child binaries (curl.exe, wget.exe, bitsadmin.exe, certutil.exe, powershell.exe) exist to pull remote content.
    Connections from the server process itself or from the child within roughly fifteen minutes of the spawn are the ones to
    resolve first. An application server reaching an address that is not a known dependency, database, or update endpoint is
    worth attributing to an owner.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_child:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_parent:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection_host and (selection_child or selection_parent)
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: How often has node.exe spawned this child binary on this host over the last 90 days?
  context: >-
    This is the discriminator between a build environment and an application server. On a developer or CI host, node.exe
    spawning a shell or an interpreter has a long, dense history and the returned command lines read as toolchain work
    (package scripts, git queries, port checks, certificate setup). On a host that only serves an application, the same
    pairing with a near-zero history has no routine explanation. Read the command lines that come back, not only the count.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment in the hour around the alert?
  context: >-
    If the server runs under a named account, that account's activity on other hosts in the same window shows whether the
    execution stayed local or moved outward. When the alert fires under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer
    account, this query returns environment-wide agent and service telemetry rather than an answer; in that case the
    parent-and-child binary pivot is the meaningful version of this question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Where else in the environment did the same parent-and-child binary pairing run in the hour around the alert?
  context: >-
    A Node.js application server usually runs as a service principal or a machine account, and those accounts attribute
    nothing. The mechanism does. Pivoting on the parent binary and the child binary answers the same clustering question
    without the account noise: whether other hosts running the same application produced the same spawn in the same window,
    which separates one exploited host from several.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process start on the host by binary and parent collapses routine agent and service telemetry into a few
    high-count rows and leaves novel parent-child pairs at low counts, which is what the analyst is scanning for. Look for
    other children of node.exe, for shells spawned by other service processes, and for the stages that tend to follow
    execution, such as archive utilities, credential access tooling, or persistence tooling.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did this rule fire on other hosts running the same application in the last 24 hours?
  context: >-
    Internet-facing applications are exploited by scanning, so the same request is usually sent to every reachable instance.
    The same detection on several hosts within a day points at automated exploitation of an exposed version rather than a
    one-off, and the returned host set is what needs the same version check and the same review for follow-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier alerts on the same host help reconstruct what preceded the spawn, such as repeated exploitation attempts against
    the application, other server processes spawning shells, or scanning against the host. Their absence is also informative:
    a first-and-only detection on a server points the investigation back at the application's own request logs rather than at
    an existing foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
