name: VMMap Unsigned Dbghelp.DLL Potential Sideloading
id: d8da51a7-c746-4d02-aff2-2220ef0b141b
description: |
  Detects vmmap.exe or vmmap64.exe loading an unsigned dbghelp.dll out of C:\Debuggers. The rule fires when the module
  path and loading process match AND the loaded DLL's signature is not valid (Signed is not true). Older VMMap builds
  automatically loaded dbghelp.dll from C:\Debuggers and that auto-load was later removed, so a genuinely signed debugger
  DLL in that path can be a benign remnant; an unsigned dbghelp.dll planted at that fixed search path, where the signed
  VMMap tool loads it, is DLL search-order sideloading that runs attacker code under the identity of a trusted binary.
  Investigation should confirm the loaded module's path, signature, and hash on the load event, identify the process that
  wrote the DLL into C:\Debuggers and when, verify the loading process is a genuine VMMap binary, and check for follow-on
  execution or additional persistence on the host.
type: detection
detection_id: 273a8dd8-3742-4302-bcc7-7df5a80fe425
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and
    the process that loaded it against the rule's criteria. The rule fires only when a vmmap.exe or vmmap64.exe process
    loads dbghelp.dll from C:\Debuggers AND that DLL is not validly signed, so note that the load path is the fixed,
    non-standard C:\Debuggers location rather than System32 and that the signer is absent or invalid. Library events carry
    the module's hash and signing status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run VMMap and perform local process-memory debugging?
  context: >-
    VMMap is a legitimate memory-analysis utility, but it is not routine on most endpoints. If this user role and host
    function are not associated with debugging or performance analysis, a VMMap execution — especially one loading a
    debugger DLL from a non-standard path — is harder to explain as routine work. An application allow-list of hosts and
    users expected to load DLLs from non-standard locations (developer or support workstations) is the fastest way to
    separate sanctioned use from a masqueraded side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What other modules did this VMMap process load, and are any unsigned or from user-writable or non-standard directories?
  context: >-
    The full set of modules a process loads exposes a side-load set the alerting event alone does not. Beyond the
    dbghelp.dll from C:\Debuggers, look for other DLLs loaded from user-writable locations such as AppData, ProgramData,
    Public, or a temp directory, unsigned modules sitting where signed ones are expected, and system DLL names loaded from
    non-system paths. A cluster of non-canonical or unsigned loads in the same process points to a staged operation rather
    than an isolated remnant DLL.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For the dbghelp.dll loaded from C:\Debuggers, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a benign debugger DLL from a side-loaded malicious one. A genuine dbghelp.dll is
    Microsoft-signed; an unsigned copy, or one carrying a signature that is expired, distrusted, or invalid, is a strong
    masquerade indicator. The hash on the load event supports a threat-intel lookup that can surface a known loader, and a
    baseline hash of the legitimate dbghelp.dll is the direct comparison point for detecting substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What process spawned this VMMap instance, and is that parent chain expected?
  context: >-
    The parent of the loading process reveals how VMMap was launched. An interactive run typically traces to explorer.exe
    or a user shell; a VMMap started by a script host, an archive utility, a remote-access tool, or an unfamiliar dropper
    points to attacker-driven execution rather than an analyst opening the tool. This pivots on the alerting process's
    ProcessGuid to retrieve its process-creation event and its parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote the dbghelp.dll into C:\Debuggers, and when relative to the load?
  context: >-
    Search-order sideloading requires the attacker-controlled library to be placed on disk before the trusted binary
    loads it. Identify the process that created dbghelp.dll under C:\Debuggers and when. A write by a debugger or SDK
    installer may be expected on a developer host; a write by an archive tool, script host, browser, or unfamiliar
    launcher shortly before VMMap ran is the plant step of the side-load. The interval between the write and the load
    frames the correlation window for the surrounding activity.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Is the dbghelp.dll still on disk for analysis?
  context: >-
    If the loaded module is still present at C:\Debuggers, it can be hashed, submitted to a sandbox, or reviewed
    statically. Checking for the file written by the alerting process or its direct children confirms whether the artifact
    remains available or was already removed after execution, which itself is a cleanup signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Has a dbghelp.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If dbghelp.dll has been
    loaded from this path by VMMap or by genuine debugging tools repeatedly over the prior 90 days, this load may be
    routine on a debugging workstation. If this is the first occurrence, or the DLL has historically loaded only under
    other processes or from other paths, the current load is anomalous and consistent with a newly planted side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Does this host normally run VMMap at all?
  context: >-
    A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts for VMMap over the prior 90 days indicate a first-time or rare execution, which raises the weight of
    the unsigned-DLL load; frequent prior runs on a debugging or support workstation lower it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host previously matched this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection — a VMMap process loading an unsigned dbghelp.dll
    from C:\Debuggers — scoped to this host, so the resulting program and user distribution
    reflects how the rule's specific firing pattern has historically run here, not generic VMMap
    usage. A new acting program process, an unexpected user account, or a first-ever match is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: C:\Debuggers\dbghelp.dll
        Image|endswith:
        - \vmmap.exe
        - \vmmap64.exe
      filter_main_signed:
        Signed: 'true'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: Have other hosts matched this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the specific
    pattern — a VMMap process loading an unsigned dbghelp.dll from C:\Debuggers — not generic VMMap usage. Many hosts
    matching the same pattern points to a staged deployment or a shared build or support image carrying a planted DLL; one
    host or a small unrelated set points to targeted or manual activity. Use the host distribution and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains: C:\Debuggers\dbghelp.dll
        Image|endswith:
        - \vmmap.exe
        - \vmmap64.exe
      filter_main_signed:
        Signed: 'true'
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What child processes did this VMMap instance spawn afterward?
  context: >-
    A side-loaded DLL runs inside the VMMap process, so any code it executes can spawn children that carry the tool's
    trusted context. VMMap has no legitimate reason to launch command interpreters, script hosts, or download utilities;
    children such as cmd.exe, powershell.exe, or certutil.exe under this process point to post-exploitation driven by the
    unsigned module. This anchors on the alerting process's ProcessGuid as the parent for precision.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is one stage in a chain, and the load event rarely stands alone. Examining process activity in a tight
    window around the load reveals what launched VMMap, what the side-loaded module did next, and whether file writes and
    the load line up on the same short timeline. Look for dropper execution, defense tampering, and persistence
    installation in the same interval.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal the stages that preceded the side-load. Reconnaissance, execution from
    a user-writable directory, or defense tampering ahead of this event helps reconstruct the timeline and shows whether
    the load is an entry point or a later stage of an ongoing intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does the user or administrator recall running VMMap for memory or performance analysis on this host?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If an analyst
    knowingly ran VMMap for debugging, the tool's presence is explained, though the unsigned DLL still needs accounting
    for. If no one recalls running it, or VMMap is unfamiliar on this host, the execution and the module it loaded are
    more likely attacker-driven.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A side-load that runs code under a trusted tool is often paired with backup persistence. After establishing one
    foothold, operators commonly install additional mechanisms through scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Several persistence installations in the same timeframe indicate intentional stacking
    rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File
    monitoring captures these drops even when the operator avoids standard persistence tooling, which is consistent with a
    stealth-focused side-load.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
