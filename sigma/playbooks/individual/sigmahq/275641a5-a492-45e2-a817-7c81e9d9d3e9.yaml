name: Add DisallowRun Execution to Registry
id: ca138f18-403a-4daa-9d02-79dc28828c6a
description: >-
  This rule detects a write of DWORD 0x00000001 to the Explorer policy value
  Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun, which
  enables the DisallowRun execution restriction. Once enabled, numbered string
  values under the DisallowRun subkey name specific executables that Windows will
  refuse to launch — used legitimately by group policy for kiosk and lockdown
  configurations, but also abused to block Task Manager, the registry editor,
  command interpreters, or antivirus interfaces so that defensive and
  administrative programs cannot be started. Investigation should confirm which
  executables are being blocked, identify the process and user that set the
  policy, and determine whether the change was an approved administrative push or
  an attacker lockdown.
type: detection
detection_id: 275641a5-a492-45e2-a817-7c81e9d9d3e9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert show DWORD 0x00000001 written to the Explorer DisallowRun policy value?
  context: >-
    Before investing investigation time, confirm this is a true positive. The
    rule fires only when both criteria match together — the TargetObject ends with
    Software\Microsoft\Windows\CurrentVersion\Policies\Explorer\DisallowRun and the
    Details value is the DWORD 0x00000001 that turns the restriction on. Review the
    exact key path, value data, and writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to set execution-restriction policy?
  context: >-
    Setting DisallowRun is normally a managed action on locked-down or kiosk
    hosts. An interactive user or an unexpected host modifying the policy directly
    is more notable than a policy-management workstation doing so. User attribution
    is present on roughly 94 percent of endpoint registry events; when it resolves
    to a machine account or is missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process set this policy value, and what started that process?
  context: >-
    The writing process and its parent chain distinguish a group-policy or
    management-agent push from an ad-hoc or malicious write. A legitimate policy
    change usually traces to a management or policy-deployment lineage; an unsigned
    binary or an unusual parent performing the write is more suspicious. The
    signature of the writer and the legitimacy of the parent lineage are the
    discriminators here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What registry value was modified, and is this a known execution-restriction or evasion location?
  context: >-
    The DisallowRun policy under Software\Microsoft\Windows\CurrentVersion\Policies\Explorer
    controls which executables Windows will block from launching. Enabling it with
    the DWORD 0x00000001 write and populating the DisallowRun subkey is a
    lockdown and defense-evasion pattern when it targets security or administrative
    tools, and it is also a standard restriction control on centrally managed
    endpoints. The specific key and the writing process determine which of the two
    this is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which executables are being blocked by this DisallowRun policy?
  context: >-
    When DisallowRun is enabled, numbered string values under the
    ...\Policies\Explorer\DisallowRun subkey each name an executable Windows will
    refuse to launch — commonly Task Manager, the registry editor, command
    interpreters, or antivirus interfaces when the intent is to block defensive and
    administrative tooling. Read the Details of each numbered value to enumerate the
    blocked list. Details is populated on about 79 percent of registry writes; if it
    is empty for a value, pivot to the writing process to recover what was set.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Policies\Explorer\DisallowRun'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications did this host make in the same session?
  context: >-
    Actors who tamper with execution policy often stack other registry changes in
    the same window — disabling Task Manager through DisableTaskMgr, hiding
    configuration tools, weakening endpoint protection policy, or adding Run-key
    persistence. Clusters of policy and security-setting writes from the same
    process indicate a hands-on lockdown rather than an isolated change. The
    triggering key appears in the results; the signal is what else was modified
    alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the DisallowRun policy been modified before on this host?
  context: >-
    A host that has never carried this policy is more notable than one where it is
    routinely managed. Frequent historical writes suggest a centrally managed
    control; zero or very low history suggests a first-time change that warrants
    closer scrutiny. Compare the historical Details and writing process against the
    current change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this policy value modified on other hosts in the environment?
  context: >-
    The same DisallowRun change across many hosts points to a group-policy or
    deployment action; a change confined to a single host looks targeted. Compare
    the writing process and value data across hosts to separate a managed rollout
    from isolated tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Does this host normally run the process that wrote this policy?
  context: >-
    A writing process that regularly runs on the host, such as a management agent
    or policy tool, is less concerning than one appearing for the first time. Zero
    or very low historical counts indicate a first-time or rare writer that is worth
    identifying before dismissing the change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the
    policy change surfaces what led up to it and what followed, and whether the
    write is part of a larger lockdown or tamper sequence. Novel parent-child pairs
    stand out at low counts while routine agent noise collapses into high-count
    rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded the execution lockdown
    and help reconstruct the timeline. The alert sequence often tells the fuller
    story of how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this policy change?
  context: >-
    Execution-restriction policy is normally deployed through managed change. A
    corresponding ticket or maintenance window suggests authorized lockdown;
    absence of one when policy requires it suggests the change was unauthorized.
    This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing execution policy consistent with how your organization normally makes such changes?
  context: >-
    Many organizations push Explorer restriction policies through group policy or a
    management platform rather than a direct registry write from an interactive
    process. A direct write from an ad-hoc tool may indicate an attacker bypassing
    normal management, or it may indicate an administrator taking a shortcut.
    Understanding the normal procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    A lockdown of execution policy often accompanies other footholds. After
    establishing the detected change, actors commonly install backup persistence
    using scheduling, service, or registry tools. Multiple persistence installations
    in the same timeframe indicate intentional stacking rather than an isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
