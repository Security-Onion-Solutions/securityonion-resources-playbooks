name: Registry Persistence Mechanisms in Recycle Bin
id: ec6498bc-2326-483a-9c8c-7d3bb8cbe8c1
description: |
  Detects registry changes to the shell verb keys under the Recycle Bin COM class identifier
  {645FF040-5081-101B-9F08-00AA002F954E}. The rule fires when either a registry key is renamed into a
  \shell\open path under that CLSID, or a value is written to \shell\open\command\(Default) under it.
  The CLSID is registered under HKEY_CLASSES_ROOT, a merged view whose per-user half is writable without
  elevation, so a non-elevated process can register a command that Explorer runs the next time the user
  opens the Recycle Bin; installed software has no reason to attach a shell verb to this CLSID, which
  makes the Recycle Bin path itself the distinguishing signal rather than the autostart pattern.
  Investigation should decode the command string written to the value, identify the process and parent
  that wrote it, and determine whether the referenced payload exists on disk and subsequently ran.
type: detection
detection_id: 277efb8f-60be-4f10-b4d3-037802f37167
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show either a key rename into the Recycle Bin CLSID's `\shell\open` path, or
    a value write to its `\shell\open\command\(Default)` entry?
  context: >-
    The rule matches on either branch, and which one fired changes what the rest of the investigation
    weighs. A value write to `\shell\open\command\(Default)` puts the command string itself in the
    event's value data, so decoding that value and checking the referenced payload are the load-bearing
    steps. A rename into `\shell\open` restructures the verb without necessarily exposing a payload path
    in this event, so the key's later modification history and what Explorer subsequently launched carry
    the weight instead. Note the CLSID in the path — `{645FF040-5081-101B-9F08-00AA002F954E}` is the
    Recycle Bin. The signer columns say who published the writing process; read them for coherence with
    the key being written rather than as a verdict, since nearly every alerting process is trusted-signed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - EventType
      - NewName
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to modify shell verb keys under the Recycle Bin CLSID?
  context: >-
    Shell verb registration under a special-folder CLSID is not a routine administrative or software
    installation action, so an account and host with no reason to touch it is a fast discriminator. User
    attribution is present on most endpoint registry events; when it resolves to a machine account or
    SYSTEM, pivot on the writing process instead. The signer columns attribute the writing process to a
    vendor — read them for coherence with the Recycle Bin key, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that modified the Recycle Bin CLSID key?
  context: >-
    The writing process is named in the alert but its lineage is not. Looking that process up by its own
    identifier returns the parent that started it, which is what separates a software installer or update
    chain from an interactive shell, script host, or Office application. Autostart registration written by
    an expected deployment parent reads differently from the same write under cmd.exe, powershell.exe,
    wscript.exe, or a browser child, and the expected lineage varies by environment and installed software.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the process that wrote this key spawn?
  context: >-
    A process that registers a shell verb rarely stops there. Listing the children it launched shows
    whether the registry change was an isolated action or one step in a longer chain — payload staging,
    additional persistence, or follow-on tooling. This shows what the writing process started, not what
    started alongside it, because registry telemetry does not record the acting process's own parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this registry change part of a documented deployment, maintenance window, or approved request?
  context: >-
    Many organizations require a change record for modifications that establish persistence. A matching
    ticket points to authorized activity; the absence of one where policy requires it points the other way.
    Shell verb registration under a special-folder CLSID is rarely part of any documented deployment, so a
    ticket that covers it should be read carefully rather than accepted at face value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the user or administrator recall performing this registry change?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to a verdict. If the
    account is a service or machine account, ask the team that owns it whether any maintenance would
    explain the write; if it is a user account and they do not recall it, the write was automated or the
    account is being used by someone else. If they do recall it, get the reason and the tooling used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this registry write align with normal work hours or a maintenance window?
  context: >-
    Configuration changes that establish persistence usually land during business hours or a scheduled
    window. Check the host's local time, the user's normal working hours, and whether any scheduled job or
    deployment ran in that window. Timing on its own does not decide the case, but a write outside every
    known window narrows who could have made it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Which key and value data were modified under the Recycle Bin CLSID, and where in the hive does the write land?
  context: >-
    The exact path decides the reach of the change. `HKCU\Software\Classes\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell\open\command`
    affects only the current user and needs no elevation, while the same path under
    `HKLM\SOFTWARE\Classes\...` affects every user on the host and requires administrative rights. The
    default verb can also be redirected by naming a new verb under `\shell` rather than editing `open`,
    so read the full path rather than assuming the `open` verb. Autostart key paths legitimately vary by
    policy and installed software, but this CLSID is not one that installed software configures. The
    signer columns say who published the writing process — a vendor that plausibly owns the key is
    coherent, a signed system utility writing a payload path into the Recycle Bin's verb is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What command string was written to the value under the Recycle Bin CLSID's command key, and what would it run?
  context: >-
    The value data under `\shell\open\command` is the command line Explorer executes when the Recycle Bin
    is opened, so it names the payload directly. Read it for paths under Temp, AppData, ProgramData, or a
    user profile, for script hosts and interpreters (cmd.exe, powershell.exe, wscript.exe, mshta.exe,
    rundll32.exe), and for encoded or obfuscated arguments. Value data is recorded for string values but
    not for binary or empty data; if it is absent from the event, read the value from the host directly
    rather than treating the blank as an empty key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An actor who registers one shell verb often changes several keys in the same window — a Run value, a
    service configuration, a policy key, or another special-folder CLSID. Grouping every registry write on
    the host by key path and writing process shows what else landed alongside this one. The alerting key
    will appear in the results; the signal is what accompanies it, and a cluster of persistence and
    configuration writes from one process points to a hands-on session or an installer-style implant.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Is the executable or script referenced by the command value present on disk?
  context: >-
    The verb registration only executes if the file it names exists at that path, so confirming the file
    was created determines whether the persistence is armed and what it would run. Correlating file
    activity by the registry-writing process and its children usually surfaces the payload, because the
    drop and the registry write tend to happen in the same session. File write events carry no hash; if
    the payload is present, hash it from a later execution or retrieve the file for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What did explorer.exe launch on this host in the hours after the registry write?
  context: >-
    This persistence is user initiated — the registered command runs as a child of explorer.exe the next
    time the Recycle Bin is opened, so execution can trail the registry write by minutes or by days.
    Grouping the children explorer.exe started on this host after the write lets the analyst compare them
    against the command value read from the key; a match confirms the persistence executed. Explorer
    legitimately launches whatever the user opens, so the volume here is normal and the comparison to the
    value data is what makes the answer meaningful.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - registry_event
- question: What other process activity occurred on this host around the time of the registry write?
  context: >-
    Registry persistence is usually one step in a sequence rather than an isolated event. Grouping process
    activity on the host in the surrounding window by process and parent collapses repetitive agent
    telemetry into single high-count rows while novel parent-child pairs stand out at low counts. Scan for
    reconnaissance, credential access, or staging that preceded the write and for tooling that followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Have the shell verb keys under the Recycle Bin CLSID been modified before on this host?
  context: >-
    A key that has never been written before is a different finding from one that changes on a schedule.
    The Recycle Bin CLSID's verb keys should be untouched on a normal host, so a 90-day history with no
    prior modifications supports a first-time registration, while repeated writes of the same value point
    to something on the host re-applying it. Registry key and value deletions are not recorded by endpoint
    telemetry, so read this history for re-modification rather than expecting to see cleanup.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Have the same Recycle Bin CLSID verb keys been modified on other hosts?
  context: >-
    The same registration across several hosts points to a deployment mechanism, a policy push, or an
    actor working through the environment; a single host points to something local. Comparing the value
    data across hosts separates one command being pushed everywhere from different payload paths per host,
    which is what distinguishes a managed change from hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: '\CLSID\{645FF040-5081-101B-9F08-00AA002F954E}\shell'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    A shell verb under a special-folder CLSID is a low-visibility foothold, and actors who place one
    commonly add a conventional mechanism as a backup. Surfacing persistence tool executions across a wide
    window catches scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions installed before or
    after this registry write. Several mechanisms established in one timeframe point to intentional
    stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped into Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence leaves no command-line trace. Dropping an executable or script into a Startup
    folder, or writing a scheduled-task XML definition directly, establishes autostart without running
    schtasks, sc, or reg. File event monitoring captures these drops even when the standard persistence
    tools are avoided, which makes this a parallel mechanism to the registry verb registration rather than
    the same one.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually established after access, so earlier detections on the same host help
    reconstruct how the actor arrived. Look for execution, defense tampering, reconnaissance, or credential
    access in the preceding hours and read them as a sequence rather than as separate findings. If no
    earlier detections exist, the registry write may be the first observable step and the initial access
    path is still unaccounted for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
