name: Windows Kernel Debugger Execution
id: 6293ec12-c6cc-40e3-a969-87baadc01aa0
description: |
  Detects execution of the Windows Kernel Debugger, kd.exe, matching either an Image path ending in
  \kd.exe or an OriginalFileName of kd.exe — so a renamed copy of the binary still matches on the
  PE metadata branch. kd.exe is a Microsoft-signed console debugger shipped with the Windows Driver
  Kit and Debugging Tools for Windows; on developer, driver-test, and QA systems its execution is
  routine, while on general-purpose workstations and servers it is not part of the normal toolset.
  The debugger can attach to a local or remote kernel, read and write kernel memory, and run
  debugger commands from a script file, so the investigation should establish whether this host is
  a development or driver-test system, whether the debugging toolchain is installed, what the
  command line asked the debugger to do, and whether the boot configuration or driver activity on
  the host changed around the same time.
type: detection
detection_id: 27ee9438-90dc-4bef-904b-d3ef927f5e7e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did this process match on an Image path ending in \kd.exe, or on an OriginalFileName of kd.exe with a different file name on disk?
  context: >-
    The rule fires on either branch, so confirm which one matched. An Image ending in \kd.exe is the
    debugger under its shipped name; an OriginalFileName of kd.exe with an unrelated Image path means
    the binary was copied or renamed, which makes the file's location and origin the more informative
    thread to pull. Record the full Image path either way — a copy under a user-writable directory
    tells a different story than one under the Windows Kits installation tree.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this host a development, driver-test, or QA system, and is this user expected to run kernel debugging tools on it?
  context: >-
    Kernel debugging is a normal part of driver development, crash-dump analysis, and hardware
    bring-up work. A host in a developer or driver-test pool, or a user in an engineering or
    platform-support role, makes this execution routine. The same execution on a general-purpose
    workstation, a server, or under an account with no development function is the case that needs
    an explanation from asset inventory or the system owner.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the debugger command line ask kd.exe to do — which target, and which commands?
  context: >-
    The arguments define the operation. `-k` selects a kernel connection and names its transport
    (net, com, 1394, usb, or a local connection); `-z` opens a crash dump file; `-c` supplies
    debugger commands to run at startup; `-y` sets the symbol path; `-logo`/`-logf` write a session
    log. Note whether the target is a local kernel, a remote machine, or a dump file, and record the
    working directory — the debugger reading a dump file from a share is a different operation than
    one attaching live to the running kernel.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned kd.exe, and is that parent chain consistent with development work?
  context: >-
    The parent tells you how the debugger was invoked. An interactive shell, a developer command
    prompt, an IDE, a build agent, or a test-automation service are the parents that fit driver and
    kernel development. A script host, an Office application, a browser, a remote-management agent,
    or an unfamiliar binary as the parent points the investigation toward how that parent came to
    launch a debugger.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the rest of the Windows debugging toolchain present and in use on this host?
  context: >-
    kd.exe ships alongside cdb.exe, ntkd.exe, ntsd.exe, windbg.exe, kdnet.exe, and the symbol
    utilities symchk.exe and dbghelp-based tools. A host where the wider toolchain also runs is one
    where the Driver Kit or Debugging Tools package is installed and used, which supports the
    development explanation. kd.exe running alone, with none of its companion tools ever seen on the
    host, points toward a single binary carried onto the system rather than an installed toolchain.
  range: -30d
  answer_sources:
  - process_creation
  - asset_inventory
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \cdb.exe
          - \ntkd.exe
          - \ntsd.exe
          - \windbg.exe
          - \windbgx.exe
          - \kdnet.exe
          - \symchk.exe
          - \dbgsrv.exe
      condition: selection
    fields:
      - Image
- question: Was the host's boot configuration changed to enable kernel debugging around this time?
  context: >-
    Live kernel debugging of the local machine requires debugging to be enabled in the boot
    configuration, which is set through bcdedit with /debug, /dbgsettings, /bootdebug, or
    /set testsigning. A boot-configuration change shortly before or after the debugger ran ties the
    two together and also indicates a pending reboot requirement. Such a change on a system that is
    not a development or driver-test host is worth reconciling against change records, since the
    same settings also relax driver signature enforcement.
  range: +/-24h
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \bcdedit.exe
      condition: selection
    fields:
      - CommandLine
      - User
      - ParentImage
- question: Which drivers loaded on this host around the alert, and were any of them unsigned or test-signed?
  context: >-
    Kernel debugging and driver development go together, so a driver load close in time to the
    debugger session is expected on a driver-test system and gives the investigation something
    concrete to check. Note the signer and signature status of anything loaded in the window: a
    driver signed by the organization's own development certificate or carrying a test signature
    fits bring-up work, while an unsigned or unfamiliar third-party driver loading on a
    general-purpose system is the load to account for. No driver loads in the window narrows the
    session to inspection rather than driver testing.
  range: +/-1h
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: What child processes did kd.exe spawn afterward?
  context: >-
    The debugger can launch processes through its `.shell` and `!process` style commands and through
    startup command scripts, so children reveal what the session actually did. Symbol-server helpers
    and editors fit a development session. A command interpreter, a script host, or a
    download utility spawned from the debugger describes an operation that used the debugger as a
    launcher rather than as an analysis tool.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run kd.exe?
  context: >-
    A development or driver-test system typically shows a steady 90-day history of debugger
    executions across one or more engineering accounts. Zero or very low historical counts mean this
    is a first-time or rare execution on the host, which shifts the question to how the binary
    arrived and who ran it.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run the kernel debugger, which parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific pattern has historically run here rather
    than generic binary usage. A debugger that has always been launched from a developer shell by an
    engineering account, now appearing under a different parent or a different user, is the
    deviation worth chasing.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \kd.exe
      - OriginalFileName: kd.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously run the kernel debugger, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this pattern aggregated by host. A driver developer or platform
    engineer with a consistent history across their own machines is routine. A user with no prior
    debugger history, or one whose role has no development function, is the account to reconcile
    against organizational knowledge.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \kd.exe
      - OriginalFileName: kd.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven kernel debugger execution on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior
    and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection
    structure scoped to the alerting parent process, giving the 90-day history of that parent
    driving this pattern. A build agent or test-automation parent with thousands of prior events is
    established engineering automation; a parent that has never driven a debugger before is the
    deviation to chase.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \kd.exe
      - OriginalFileName: kd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts around the alert separates a developer working
    on their own machine from an account touching several systems in the same window. The same user
    driving debugger or driver activity on multiple endpoints changes the scope of the question from
    one host to a set of them.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the environment returns
    agent-telemetry volume from every host. The query instead mirrors the rule's selection structure
    scoped to the alerting parent process, fleet-wide, in the alert window. Several hosts in the same
    window points to a test rollout or a pushed automation job; a single host points to a host-local
    trigger.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \kd.exe
      - OriginalFileName: kd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating the surrounding process activity by binary and parent collapses routine telemetry
    into high-count rows and leaves novel parent-child pairs standing out at low counts. Look for
    compiler and build tooling, driver installation utilities, and dump-file handling — which support
    a development session — against reconnaissance, credential access, or persistence tooling, which
    describe a different operation.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in sequence. Prior alerts covering
    defense tampering, driver or service installation, or privileged access before a kernel debugger
    ran describe a progression; an isolated alert on a host with a quiet timeline is more consistent
    with a one-off local action.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run the kernel debugger in the past week, and does the cross-host distribution look like a development pool or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this firing pattern. A cluster of hosts that also carry the Driver Kit is a
    development or driver-test pool and explains the alert as routine for that population. One host,
    or a small set with nothing else in common, points to manual operator activity and makes the
    identity and parent questions the ones that carry weight.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \kd.exe
      - OriginalFileName: kd.exe
      condition: selection
    fields:
    - host.name
