name: NET NGenAssemblyUsageLog Registry Key Tamper
id: 50d959f2-c57a-4efb-a808-b7270f93a00f
description: |
  Detects modification of the NGenAssemblyUsageLog value under SOFTWARE\Microsoft\.NETFramework. This CLR configuration knob controls where .NET Usage Log files are written; the runtime normally writes a per-process Usage Log (for example powershell.exe.log) under a UsageLogs directory before process exit, and that log is a detection opportunity for processes that host the .NET CLR. Pointing the knob at an arbitrary or nonexistent value suppresses Usage Log creation for that execution context, blinding detections that rely on CLR execution logs. The investigation should confirm the value written, identify what wrote it and its process lineage, and determine which .NET CLR-hosting processes ran afterward — the execution the suppressed log would otherwise have recorded.
type: detection
detection_id: 28036918-04d3-423d-91c0-55ecf99fb892
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the tampered registry value match the NGenAssemblyUsageLog CLR configuration key this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by checking that the modified key path ends with SOFTWARE\Microsoft\.NETFramework\NGenAssemblyUsageLog. This value is the CLR knob that controls Usage Log output location; a write to it is the exact condition the rule fires on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify .NET CLR configuration keys?
  context: Legitimate changes to .NETFramework configuration knobs are rare outside of developer machines and build systems. Knowing whether the user role and host function are consistent with editing CLR configuration is often the fastest path to distinguishing a routine change from a defense-evasion tamper. When the writer is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this registry value, and what started that process?
  context: The value can be set with reg.exe, PowerShell, WMI, or a direct API call from an unmanaged binary. Tracing the writing process back to its parent reveals whether the change came from an interactive administrative session or from an unusual chain such as a script host or Office application spawning the writer. Flag unsigned executables or abnormal parent-child lineage performing the modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket, maintenance window, or documented approval for modifying .NET CLR configuration?
  context: Changes to CLR configuration knobs are unusual enough that a documented deployment, developer task, or maintenance window should exist if the activity is authorized. A corresponding ticket suggests legitimate work; absence of one when policy requires it suggests the change was unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate configuration changes typically occur during business hours or scheduled maintenance. A CLR knob modification at an odd hour, outside any maintenance window, is more suspicious than the same change during documented work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the NGenAssemblyUsageLog knob a known evasion location, and what value was written to it?
  context: The path reveals intent. This CLR configuration knob controls where .NET Usage Log files are written; the runtime writes a per-process log before exit that records CLR-hosting execution. Setting the knob to an invalid or nonexistent output location suppresses that log, which is a defense-evasion pattern rather than a persistence one. The value data written determines whether logging is redirected to a real path or effectively disabled.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the knob, and is it a valid output path or junk?
  context: Legitimate configuration points the knob at a real, writable directory. An arbitrary string, a nonexistent path, or junk data (for example a placeholder word) indicates the log-suppression tamper -- the value is meaningless to the runtime, so no Usage Log file is created for the execution context. Value data is present on most endpoint registry modifications but is absent when the written data is binary or empty, so treat a missing value field as itself worth noting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications occurred on this host in the same session?
  context: An actor who suppresses .NET logging often makes other changes in the same window -- disabling additional logging or protections, adding persistence, or altering other configuration. Registry modifications on this host around the tamper, grouped by key path and writing process, reveal whether the log suppression was part of a broader set of configuration changes or an isolated action.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the tampered value persist, or was the knob re-modified afterward?
  context: Endpoint telemetry emits no registry key or value deletion events, so attacker cleanup of the knob is not directly observable. Judge whether the suppression is still in effect from the key's re-modification history -- a later write restoring a valid output path suggests cleanup or a benign toggle, while a value that stays invalid keeps .NET Usage Log creation suppressed for ongoing execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this CLR configuration key ever been modified on this host before?
  context: A first-time modification of the NGenAssemblyUsageLog knob is more suspicious than a recurring one. This key should rarely if ever change on a normal host; zero prior history indicates a value that has never been touched, which raises the severity of the current write. Compare prior value data to see whether the same value is being reset or this is a unique change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Which .NET CLR-hosting processes executed on this host after the tamper?
  context: The purpose of the knob change is to hide subsequent .NET execution from Usage
    Log-based detection. The query anchors on the common CLR-hosting binaries — PowerShell
    and the .NET build and utility hosts — plus any command line carrying the
    COMPlus_NGenAssemblyUsageLog environment variable, the per-process form of the same
    suppression. These executions are what the suppressed Usage Log would otherwise have
    recorded. An unmanaged binary that hosts the CLR is not identifiable from process
    metadata, so a zero here does not prove no .NET ran — weigh it alongside the
    spawned-process and host-activity questions.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_clr_hosts:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
          - '\dotnet.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\regsvcs.exe'
          - '\regasm.exe'
      selection_env_marker:
        CommandLine|contains: 'COMPlus_NGenAssemblyUsageLog'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_clr_hosts or selection_env_marker) and _pb_scope
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was this CLR configuration key modified on other hosts in the environment?
  context: The same knob modification across multiple hosts may indicate a policy push, a deployment, or widespread tampering; a single-host modification is more likely targeted. Compare value data across hosts -- identical junk values on several hosts point to a common tool or script rather than routine configuration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the tamper?
  context: 'Alerts rarely occur in isolation. Examining process activity around the knob modification reveals the immediate context: what led to it, what ran afterward, and whether it is part of a larger sequence. Novel parent-child pairs stand out against high-count agent telemetry noise.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the tamper?
  context: Earlier detections on the same host -- reconnaissance, credential access, or other defense tampering -- may reveal the stages that preceded this event and help reconstruct the timeline. Log-suppression tampering commonly accompanies other evasion or execution activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the tamper?
  context: Defense tampering often accompanies persistence stacking. After suppressing logging, an actor may install a foothold using scheduled tasks, services, registry Run keys, or other mechanisms. Persistence-tool executions in the surrounding window, grouped by tool and command, indicate intentional stacking rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
