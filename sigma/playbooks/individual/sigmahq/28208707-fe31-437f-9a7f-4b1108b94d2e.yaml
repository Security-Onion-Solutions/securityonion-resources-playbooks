name: Suspicious Startup Folder Persistence
id: e8a67634-c20f-4788-8f9b-657fee0925c2
description: |
  Detects the creation of a script or executable file (.bat, .cmd, .dll, .hta, .jar, .js, .jse, .msi, .ps1, .psd1, .psm1,
  .scr, .url, .vba, .vbe, .vbs, .wsf) inside a Windows Start Menu Startup folder. The rule fires when a file write lands in
  a path containing '\Windows\Start Menu\Programs\Startup\' AND the file name ends in one of those extensions. Anything placed
  in a Startup folder runs automatically at the next user logon, so this is a logon-persistence mechanism. Legitimate software
  installers and administrators occasionally drop shortcuts or helper scripts here; malware droppers and post-exploitation
  tooling use the same location to survive reboots. The investigation should identify what the dropped file is, which process
  and parent wrote it, whether it has executed or will execute at next logon, and whether the same drop appears elsewhere.
type: detection
detection_id: 28208707-fe31-437f-9a7f-4b1108b94d2e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path and creating process match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when a file whose name
    ends in a script or executable extension (.bat, .cmd, .dll, .hta, .js, .jse, .msi, .ps1, .psm1, .scr, .url, .vbs, .wsf,
    and related) is written into a Startup folder path. Review the exact TargetFilename, the extension, and the responsible
    process against those criteria, and note whether the write was a creation or a later modification.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to write scripts or executables into a Startup folder?
  context: >-
    Legitimate installers and administrative deployments occasionally place shortcuts or helper scripts in a Startup folder,
    but for most users and hosts this never happens. Knowing whether the account and host role are consistent with writing
    logon-persistence artifacts is often the fastest way to separate a routine software install from an unexpected drop. The
    writing account on a file event is frequently a machine or SYSTEM account, so judge by the writing process and host role
    when the user is not a human.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is inside the dropped file? Check for obfuscation, encoded strings, and payload indicators.
  context: >-
    The dropped file is what will run at next logon, so its content is the core of the investigation. For scripts and text
    files (.ps1, .vbs, .js, .bat, .cmd, .hta, .url), look for base64 or otherwise encoded blocks, obfuscated strings, embedded
    URLs or IP addresses, download-and-execute cradles, and references to LOLBINs such as wscript, mshta, powershell, or
    rundll32. A .url file simply points at a target, so read the URL or target it launches. For binaries and installers (.dll,
    .msi, .scr, .jar), check strings, imports, packer signatures, and signing status. File-write events carry no content, so
    retrieve the file from the host or an endpoint console for this analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash, and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so the Startup-folder write event carries no hash. Because
    the artifact is placed for logon persistence, it may not have executed yet at all. This query looks for the file running
    by its name and reads the process hash; submit that to a reputation or threat-intel source to judge whether it is known
    malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its Startup-folder
    path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the process that wrote this file expected to write to a Startup folder, and what started it?
  context: >-
    The writing process and its lineage tell you how the file got there. A user double-clicking an installer, an IT deployment
    agent, or a browser saving a download are ordinary origins; a script host (wscript, cscript, mshta), powershell, cmd, or
    an Office application writing a script into the Startup folder points to a dropper chain. Tracing the parent's own origin
    (the grandparent) shows whether the write came from an interactive user action or an automated payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: How did this file arrive on the host before it was written to the Startup folder?
  context: >-
    Startup-folder persistence is usually the tail of a delivery chain that began with a download or an opened attachment.
    Identify the parent that wrote the file and where it came from, such as a browser or mail client save, an archive
    extraction, or a script host fetching content from a URL. Establishing the delivery vector enables blocking at the
    perimeter and searching for other recipients who received the same file. Download provenance, meaning whether the file
    carries a mark-of-the-web from an internet zone, is part of this same delivery question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Has the dropped file already executed on this host, or is it staged to run at next logon?
  context: >-
    A Startup-folder artifact runs automatically the next time the user logs in, so its danger is forward-looking as well as
    immediate. This query checks whether the file has already run as a process. A hit means execution has begun and the
    investigation moves to what that process did; no hit means the payload is staged and will fire at the next logon unless
    the file is removed. Consider also checking whether it loaded as a DLL.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. A payload still sitting in the Startup folder can be
    retrieved, hashed, and analyzed, and it will execute at the next logon until removed. A file deleted seconds after
    creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what ran in between.
    Read the EventType on each returned row to tell creation from later modification, rename, or deletion.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Startup folder recently, and by which processes?
  context: >-
    Location drives suspicion for this artifact. Only a small set of processes legitimately write to a Startup folder, so
    other recent arrivals in the same directory reveal whether this is an isolated drop or a location under active use, and
    which other files belong to the same activity. A single unfamiliar writer appearing across several files in this folder is
    the signal to chase.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Start Menu\Programs\Startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one persistence file often drops several, such as a dropper unpacking components or staging a payload
    the Startup entry points to. The breadth, paths, and extensions of the process's other file activity distinguish a single
    shortcut write from a staging burst and enumerate what else needs review. The correlation covers the writer and its direct
    children, since droppers often delegate the actual write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were files dropped to other persistence locations on this host?
  context: >-
    Attackers rarely rely on a single foothold. After establishing Startup-folder persistence, they commonly stack backup
    mechanisms in other file-visible persistence locations, such as paths referenced by registry Run and RunOnce keys. File
    event monitoring captures these drops even when the attacker avoids running standard persistence tools. Multiple
    persistence drops in the same timeframe indicate intentional stacking rather than an isolated software install.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this Startup-folder drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this specific
    Startup-folder write pattern rather than generic file activity, aggregated by host. A user who has never produced this
    pattern is more suspicious than one who does so regularly, for example an administrator whose deployment routine
    legitimately writes logon shortcuts. Weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Windows\Start Menu\Programs\Startup\
        TargetFilename|endswith:
        - .bat
        - .cmd
        - .dll
        - .hta
        - .jar
        - .js
        - .jse
        - .msi
        - .ps1
        - .psd1
        - .psm1
        - .scr
        - .url
        - .vba
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven Startup-folder drops on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or SYSTEM account, user identity does not attribute the behavior, so the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, giving the
    90-day history of this program producing this Startup-folder pattern rather than generic program activity, aggregated by
    host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands
    of prior events is vendor or operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Windows\Start Menu\Programs\Startup\
        TargetFilename|endswith:
        - .bat
        - .cmd
        - .dll
        - .hta
        - .jar
        - .js
        - .jse
        - .msi
        - .ps1
        - .psd1
        - .psm1
        - .scr
        - .url
        - .vba
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the drop?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints.
    If the same account produced suspicious activity on several hosts in the same window, the scope of compromise may be larger
    than this one Startup-folder write. When the alert fires under SYSTEM or a machine account this view returns mostly
    agent-telemetry noise, in which case the parent-driven fleet view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven Startup-folder pattern fire on other hosts in the same window?
  context: >-
    Under a machine or SYSTEM account, asking what else the user did returns agent-telemetry noise because every host runs
    SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism dropped Startup-folder files
    elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window.
    Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Windows\Start Menu\Programs\Startup\
        TargetFilename|endswith:
        - .bat
        - .cmd
        - .dll
        - .hta
        - .jar
        - .js
        - .jse
        - .msi
        - .ps1
        - .psd1
        - .psm1
        - .scr
        - .url
        - .vba
        - .vbe
        - .vbs
        - .wsf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is usually installed after an initial foothold, so earlier detections on the same host, such as defense
    tampering, reconnaissance, credential access, or a suspicious download, may reveal the stages that preceded this
    Startup-folder drop and help reconstruct the timeline. The sequence of alerts on the host often tells the fuller story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
