name: Powershell Local Email Collection
id: f3ea5b60-0381-4074-b339-7fec40571bd1
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  contains any of the local Outlook mailbox-access markers Get-Inbox.ps1,
  Microsoft.Office.Interop.Outlook, Microsoft.Office.Interop.Outlook.olDefaultFolders, or
  -comobject outlook.application. These calls let a script read a signed-in user's mailbox
  through the Outlook COM automation interface and export messages to a file, which supports
  mailbox migration, backup, and e-discovery automation but is also how attackers collect
  local email for staging and exfiltration (T1114.001). The investigation should recover the
  complete script, determine which folders were read and where any export was written, check
  for compression, password protection, and outbound transfer of the output, and establish
  whether the user and host are expected to run mailbox automation.
type: detection
detection_id: 2837e152-93c8-43d2-85ba-c3cd3c2ae614
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain the Outlook-access strings this rule detects?
  context: >-
    The rule fires when the script content contains any of Get-Inbox.ps1,
    Microsoft.Office.Interop.Outlook, Microsoft.Office.Interop.Outlook.olDefaultFolders, or
    -comobject outlook.application — all markers of PowerShell reading a local Outlook
    mailbox through the COM automation interface. Long scripts are split across multiple
    4104 events, so read every chunk of the alerting block (sequence/total order) and judge
    the match on the complete script rather than the alerting fragment. Note which string
    matched: a Get-Inbox.ps1 reference names a known collection tool, while bare interop or
    -comobject references also appear in legitimate mailbox-automation code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run PowerShell that reads Outlook mailbox data?
  context: >-
    Mailbox migration, backup, e-discovery, and helpdesk automation legitimately drive
    Outlook COM interop from PowerShell, and blocks logged under SYSTEM often come from
    deployment or agent tooling. Check the user's role, the host's function, and the on-disk
    script path shown here against known automation and change records before treating the
    block as attacker collection.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What does the complete script do with the mailbox, and does any obfuscated content remain to decode?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the whole script.
    The 4104 channel records what PowerShell actually compiles, so -EncodedCommand wrappers
    are already unwrapped; only in-script obfuscation such as string concatenation, format
    operators, and backtick escaping still needs manual decoding. Identify the operational
    purpose: which folders are enumerated (olDefaultFolders values such as the inbox), any
    filters on senders, subjects, or date ranges, where the gathered messages are written
    (the known collection script exports to a CSV file), and whether the script compresses,
    uploads, or emails the output. The output path and any URLs found here drive the file
    and network questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what process wrote it there?
  context: >-
    When the block ran from a file, its path is recorded on the event; this also searches
    for the Get-Inbox.ps1 filename the rule names, an anchor derived from the script
    content, in case the alerting block carries no path. A collection script in a
    user-writable or staging location (Temp, AppData, ProgramData, Downloads) implies a
    delivery step that wrote it — find the file-creation event to identify the process and
    account that staged it. No recorded path means interactive or in-memory execution, which
    for mailbox-collection content is itself worth noting.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_alert_path:
        TargetFilename|endswith|expand: '%TargetFilename%'
      selection_known_name:
        TargetFilename|endswith: '\Get-Inbox.ps1'
      condition: selection_host and (selection_alert_path or selection_known_name)
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Were Outlook data files created, copied, or renamed on this host around the alert?
  context: >-
    Outlook stores mail locally in .pst and .ost files, typically under the user's
    Documents\Outlook Files or AppData\Local\Microsoft\Outlook directories. COM-based
    collection reads the mailbox without touching these files directly, and read-only access
    produces no file event, so an empty result does not rule out collection — but a .pst or
    .ost appearing in a staging directory, a fresh export, or a copy under a different name
    is direct evidence that mailbox data was acquired as a file. Weigh which process wrote
    the file and under which account, against processes expected to touch Outlook data.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.pst'
          - '.ost'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: What mail export files were written on this host around the script's execution?
  context: >-
    Mailbox collection produces an output artifact: the known collection script writes
    gathered messages to a CSV file, and other tooling exports individual messages as .eml
    or .msg files. Files with these extensions written by this user around the alert show
    what the collection produced and where it landed; the write location often doubles as
    the staging directory for exfiltration. If the recovered script names a different output
    path or extension, search for that value directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        TargetFilename|endswith:
          - '.csv'
          - '.eml'
          - '.msg'
      condition: selection
    fields:
    - TargetFilename
    - EventType
  answer_sources:
  - file_event
- question: Was the collected data compressed into an archive, and where was the archive written?
  context: >-
    Collection tooling commonly compresses gathered mail before moving it, and scripts of
    this type frequently archive their output for later transfer. An archive appearing after
    the script ran — especially in a staging directory or a location later touched by
    network-capable tooling — marks the hand-off from collection to exfiltration. Check
    whether the archive was subsequently copied, renamed, or deleted, and pivot to outbound
    network activity from the same window.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        TargetFilename|endswith:
          - '.zip'
          - '.7z'
          - '.rar'
          - '.cab'
      condition: selection
    fields:
    - TargetFilename
    - EventType
    - Image
  answer_sources:
  - file_event
  - network_connection
- question: Was encryption or password protection applied to any archive created around the collection?
  context: >-
    Password-protected archives prevent content inspection during transfer. Review the
    projected command lines of archiver invocations for password and encryption flags: -p
    and -hp (rar, with -hp also hiding the file names inside the archive), -p and -mhe=on
    (7z), --symmetric or --passphrase (gpg), and -e or -P (zip). PowerShell's
    Compress-Archive has no password option, so password protection implies a dedicated
    archiver was staged or already present on the host. Passwords passed via stdin or a
    config file will not appear in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      selection_tools:
        - Image|endswith:
            - '\rar.exe'
            - '\winrar.exe'
            - '\7z.exe'
            - '\7za.exe'
            - '\gpg.exe'
            - '\makecab.exe'
            - '\tar.exe'
        - CommandLine|contains:
            - 'Compress-Archive'
            - 'System.IO.Compression'
      condition: selection and selection_tools
    fields:
    - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell make outbound network connections from this host after the script ran?
  context: >-
    Collected mail is typically transferred out shortly after staging. Outbound connections
    from PowerShell hosts in the hour after the block — particularly to external addresses,
    cloud storage services, or SMTP ports such as 25, 465, and 587 — are the transfer side
    of the collection chain. This view is process-anchored endpoint telemetry; if the
    transfer was performed by a different tool identified in the follow-on process question,
    pivot this search to that binary as well.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Did the PowerShell session spawn follow-on processes after the script ran?
  context: >-
    A 4104 event records script content, not outcome. If the script staged archivers,
    launched transfer tooling, or invoked further commands, that activity appears as
    children of this user's PowerShell hosts shortly after the block was logged. The event
    carries no process link, so this pivots by host, user, and time; under SYSTEM the user
    anchor is broad because deployment tooling shares it, so weigh individual children
    rather than the raw count. Archivers, network utilities, and second-stage scripts are
    the children that matter for a collection alert.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    The known collection script is commonly launched with an execution-policy override
    (-executionpolicy bypass), and attacker use of mailbox collection frequently follows
    AMSI bypass, real-time monitoring changes, or a downgrade to PowerShell version 2,
    which lacks script block logging. Any of these on the host in the preceding hour reads
    as preparation for the alerting block rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Collection rarely runs as a single block: mailbox enumeration, output handling, staging,
    and transfer steps produce a cluster of script blocks in a short window, and surrounding
    blocks often contain the plaintext the alerting fragment lacks, such as the output path
    or a destination address. The log.level column shows how complete this picture is —
    verbose events mean full Script Block Logging is on, while warning-only means the host
    records just the automatically-flagged subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or only suspicious-content capture?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it is
    not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it, and absence of other 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-block query in this
    investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Local email collection is a post-access step: initial access, credential use, and
    discovery typically precede it, and staging or exfiltration detections may follow.
    Earlier alerts on the host — script-host launches, defense tampering, credential
    access — help place the collection in a longer sequence and reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this user previously produced this Outlook-access script pattern, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user, returning their 90-day
    history of script blocks containing these Outlook interop strings, aggregated by host.
    Messaging administrators and migration or e-discovery tooling can produce this pattern
    routinely; a first-ever occurrence from a user whose role involves no mailbox automation
    reads differently. On hosts without full Script Block Logging the history contains only
    automatically-flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Get-Inbox.ps1
        - Microsoft.Office.Interop.Outlook
        - Microsoft.Office.Interop.Outlook.olDefaultFolders
        - -comobject outlook.application
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this script pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so
    the pattern itself is the pivot. The query mirrors the rule's selection fleet-wide over
    90 days, aggregated by host. A pattern that appears routinely on many hosts fits
    deployed mailbox tooling or vendor automation; one that has never appeared before, or
    only on this host, is the deviation worth chasing. Only hosts shipping the PowerShell
    channel — and, for non-flagged content, with full Script Block Logging enabled — can
    appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Get-Inbox.ps1
        - Microsoft.Office.Interop.Outlook
        - Microsoft.Office.Interop.Outlook.olDefaultFolders
        - -comobject outlook.application
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the account was active on several hosts in this window, mailbox collection may be one
    step of movement between them, and the per-host binary summary shows what else the
    account ran — archivers or transfer tools on another host extend the collection chain
    there. When the alert fired under SYSTEM or another service principal this view fills
    with routine service activity; the fleet-wide script-pattern question is the meaningful
    breadth check in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same script pattern fire on other hosts in the same window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host — the meaningful breadth check when user identity is a service principal and no
    process identity exists on this channel. Several hosts in the same window points to
    pushed automation or a scripted sweep across mailboxes, which change records should
    corroborate; a single host points to a host-local trigger. Coverage is policy-gated per
    host, so absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Get-Inbox.ps1
        - Microsoft.Office.Interop.Outlook
        - Microsoft.Office.Interop.Outlook.olDefaultFolders
        - -comobject outlook.application
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
