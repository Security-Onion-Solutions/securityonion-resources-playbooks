name: Suspicious Rundll32 Setupapi.dll Activity
id: dc378404-c9cc-404b-980f-d09b53ca004f
description: |
  Detects runonce.exe spawned by rundll32.exe when the rundll32 command line
  invokes setupapi.dll with the InstallHinfSection function. InstallHinfSection
  processes an INF file and always launches runonce.exe regardless of the INF
  content, which is what makes this parent-child pair the signal. INF directives
  can register or unregister scriptlet DLLs, write Run and RunOnce registry
  values, drop files, install drivers, or fetch and execute local or remote
  script and payload code through a Microsoft-signed binary chain. Legitimate
  driver installation tooling also uses setupapi.dll with INF files, so the
  investigation should determine which INF file was processed, what directives
  it carried, and whether the parent rundll32 invocation and the INF source are
  consistent with expected administrative activity.
type: detection
detection_id: 285b85b1-a555-4095-8652-a8a4106af63f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alert show runonce.exe spawned by rundll32.exe with setupapi.dll and InstallHinfSection in the parent command line?
  context: Confirm the alert is a true positive by reviewing the parent rundll32 command line and the spawned runonce.exe against the rule's criteria. The parent command line should contain both setupapi.dll and InstallHinfSection, and it normally also names the INF file path and a section directive. Note the INF path, section name, and any URL or scriptlet reference in the parent command line for downstream analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is this user and host expected to process INF files through rundll32 setupapi.dll?
  context: Driver installation, device provisioning, and some software installers legitimately invoke InstallHinfSection. Knowing whether this host is a workstation, server, or build machine and whether the user performs driver or device administration is often the fastest way to separate routine installation activity from abuse of the INF execution path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is rundll32.exe expected to spawn runonce.exe here, and what started the rundll32 process?
  context: The rundll32-to-runonce pairing through InstallHinfSection is the core signal for this detection. Tracing the rundll32 process back to its own parent shows whether the INF processing was launched by an interactive user action, an installer, a scripting host, or an Office or browser process. A grandparent like a script interpreter or document handler points toward INF abuse rather than legitimate driver installation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What INF file path, section directive, and any script or URL reference appear in the rundll32 setupapi.dll command line?
  context: The parent rundll32 command line carries the operational detail of this technique. Decode the INF file path and the named section, then determine whether the path points to a user-writable or temporary directory and whether the command line or the referenced INF includes a remote URL, a scriptlet DLL such as scrobj.dll, or an UnregisterDlls or RegisterDlls directive. INF processing can run local or remote scriptlet code and write RunOnce registry values for persistence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
          - setupapi.dll
          - InstallHinfSection
      condition: selection
    fields:
      - ParentCommandLine
      - CommandLine
      - CurrentDirectory
- question: What other child processes did the same rundll32 instance spawn around this time?
  context: If the INF processing was malicious, runonce.exe may not be the only thing the rundll32 instance launched, and the INF itself may chain into additional processes. Examining siblings of the runonce.exe child reveals scriptlet hosts, command interpreters, or payload binaries started through the same INF directive set.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What DLLs did rundll32.exe and runonce.exe load on this host around the time of the alert?
  context: InstallHinfSection maps DLLs into memory and INF RegisterDlls or UnregisterDlls directives invoke scriptlet handlers such as scrobj.dll. Reviewing the image loads of the rundll32 and runonce processes shows whether a scriptlet COM DLL, an unsigned module, or a DLL from a user-writable path was pulled in, which distinguishes script and payload execution from a benign driver installation. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \rundll32.exe
          - \runonce.exe
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: What files did the rundll32 and runonce processes write or drop on this host around the time of the alert?
  context: INF directives can copy files, drop scriptlet or payload content, and stage executables before they run. Files written by the rundll32 or runonce processes, especially scriptlet, executable, or INF files landing in temporary or user-writable directories, indicate the INF carried more than driver metadata. If file-event telemetry is not collected here, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \rundll32.exe
          - \runonce.exe
      condition: selection
    fields:
      - Image
      - TargetFilename
      - EventType
- question: Did rundll32.exe or runonce.exe make any external network connections around the time of the alert?
  context: INF directives can reference remote resources, fetching a scriptlet, HTA, or DLL payload from an external host before executing it through the signed binary chain. Outbound connections from rundll32 or runonce to an external address, particularly one retrieving script or payload content, move the disposition toward remote payload execution rather than local driver installation. If network telemetry is not collected here, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \rundll32.exe
          - \runonce.exe
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Were registry Run or RunOnce key modifications recorded on this host in the minutes around the alert?
  context: A documented use of the InstallHinfSection path is writing Run or RunOnce registry values to establish persistence. Correlating the INF processing with registry persistence writes in the same short window ties the execution to a persistence outcome. If registry telemetry is not collected here, treat zero results as a visibility gap rather than evidence no key was written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - \CurrentVersion\Run
          - \CurrentVersion\RunOnce
      condition: selection
    fields:
      - Image
      - TargetObject
      - Details
- question: Does rundll32.exe normally spawn runonce.exe on this host, or is this parent-child pairing new?
  context: A frequency count of the rundll32-to-runonce pairing on this host separates routine driver and device installation activity from a first-time or rare occurrence. Zero or very low historical counts indicate a novel spawning relationship worth deeper inspection, while a steady history points to recurring automation or maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentCommandLine
- question: How often has rundll32 setupapi.dll InstallHinfSection run across the environment, and which hosts and INF paths account for it?
  context: A fleet-wide view of this specific InstallHinfSection invocation distinguishes broad consistent automation, such as a deployment tool installing drivers across many hosts, from a one-off or host-isolated occurrence. Concentration on a single host or an unusual INF path stands out against an established install baseline.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \rundll32.exe
        Image|endswith: \runonce.exe
        ParentCommandLine|contains|all:
          - setupapi.dll
          - InstallHinfSection
      condition: selection
    fields:
      - host.name
      - ParentCommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \runonce.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \runonce.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \runonce.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains|all:
        - setupapi.dll
        - InstallHinfSection
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the timeline around the INF execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
