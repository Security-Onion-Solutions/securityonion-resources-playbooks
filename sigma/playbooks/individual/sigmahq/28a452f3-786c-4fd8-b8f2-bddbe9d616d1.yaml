name: Creation of WerFault.exe/Wer.dll in Unusual Folder
id: cb1e213f-d199-4781-898e-44a200b29861
description: |
  Detects the creation of a file named WerFault.exe or wer.dll outside the standard Windows directories (System32, SysWOW64, WinSxS, SoftwareDistribution, UUS). Windows only ships these Error Reporting components from those locations, so a copy in an unusual folder is the setup stage of a DLL search-order hijack: an attacker places a legitimately signed WerFault.exe alongside a malicious wer.dll so that, when the relocated WerFault runs, it loads the local (attacker-controlled) wer.dll instead of the system one. The investigation should establish what wrote the pair, whether the relocated WerFault.exe executed and loaded the co-located wer.dll, and what the loaded DLL's signature and hash reveal.
type: detection
detection_id: 28a452f3-786c-4fd8-b8f2-bddbe9d616d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was WerFault.exe or wer.dll created outside the standard Windows directories, and which process wrote it?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a file named WerFault.exe or wer.dll is created AND its path is not under System32, SysWOW64, WinSxS, SoftwareDistribution, or the UUS staging folder. Review the exact target path and the responsible process; a copy in a user-writable or application folder is the search-order-hijack setup, not a Windows update artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and the writing process expected to place WerFault.exe or wer.dll outside the standard Windows folders?
  context: >-
    Legitimate error-reporting binaries are serviced only into system directories by Windows itself. Almost no software legitimately writes a WerFault.exe or wer.dll into a user profile, ProgramData, or an application folder. Judge by the writing process and the host's role; when the writer is a machine or service account, weigh the process and destination path rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this file into the folder, and what was its full command line?
  context: >-
    The file event carries no command line, so pivot on the writer's ProcessGuid to its process-creation event. The writing process, its arguments, its parent, and its working directory reveal whether this was a dropper unpacking a sideload pair, an installer, or an interactive copy. A staging tool, script host, or archive utility writing into a non-standard folder is the setup stage of the hijack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - CurrentDirectory
- question: Is the created file the legitimate signed WerFault.exe, or a malicious wer.dll masquerading as the Error Reporting library?
  context: >-
    Retrieve the file and confirm what it is rather than trusting the name. A copied WerFault.exe is typically the genuine Microsoft-signed binary (the attacker reuses the real one so it loads its neighbor), while the co-located wer.dll is the malicious component. For the DLL check imports, embedded strings, packer signatures, and signing status; for the executable confirm size and signer against a known-good copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the relocated WerFault.exe executed, what is its hash and does it have known threat-intel detections?
  context: >-
    A file's hash is recorded on execution, not on creation. This looks for the binary running from the alerting path and reads its hash for submission to threat intel. Note that the copied WerFault.exe is usually the legitimate signed binary, so a known-good hash does not clear the alert; the malicious payload is the co-located wer.dll, whose hash and signature are read from the module-load evidence. If the file is present but never executed, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Did a WerFault.exe process load a co-located wer.dll, and is that DLL signed and from a non-standard path?
  context: >-
    This is the confirmation of the hijack: the relocated, signed WerFault.exe loading a wer.dll from its own (non-System32) folder means search-order hijacking succeeded. The module-load event carries the DLL's hash, signer, and signature status directly, so no execution pivot is needed. A wer.dll loaded from anywhere other than System32/SysWOW64, or an unsigned or wrongly signed one, is the malicious library; a load from System32 with a valid Microsoft signature is benign.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\WerFault.exe'
        ImageLoaded|endswith: '\wer.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a wer.dll deleted seconds after the co-located WerFault.exe ran suggests anti-forensic cleanup after the sideload completed and shifts the focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A search-order hijack needs a pair on disk: a relocated WerFault.exe and a malicious wer.dll in the same folder. The writer that dropped one almost always dropped the other, and may have staged additional payload or configuration files. The breadth, paths, and extensions of the process's other file activity enumerate the full sideload set and reveal whether this is one artifact or a staging operation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a WerFault.exe or wer.dll been written to this host before, outside the system folders?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal operations. First-time appearance of an error-reporting binary outside System32 should be treated as unusual even though the filename is familiar. Zero or very low historical counts indicate a new drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was the same WerFault.exe or wer.dll written to any other hosts in the environment?
  context: >-
    Finding the same relocated error-reporting binary on multiple hosts points to deliberate distribution or lateral movement rather than a single targeted drop. If it appears on one host it may be targeted; across many, determine the distribution pattern and timeline to size the incident.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this file-drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, returning the user's 90-day history of WerFault.exe/wer.dll being written outside the system folders, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \WerFault.exe
        - \wer.dll
      filter_main_known_locations:
        TargetFilename|startswith:
        - C:\Windows\SoftwareDistribution\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\UUS\
      filter_main_process:
        Image|endswith: \wuaucltcore.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-drop pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launch mechanism does. The query mirrors the rule's selection scoped to the alerting program, returning the 90-day history of this program producing the WerFault.exe/wer.dll drop. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \WerFault.exe
        - \wer.dll
      filter_main_known_locations:
        TargetFilename|startswith:
        - C:\Windows\SoftwareDistribution\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\UUS\
      filter_main_process:
        Image|endswith: \wuaucltcore.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the drop is isolated or part of broader movement. If the same user drove similar activity on multiple endpoints in the same window, the scope of compromise may be larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, network-wide user activity returns agent-telemetry noise. The meaningful question is whether the same launch mechanism produced this drop elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \WerFault.exe
        - \wer.dll
      filter_main_known_locations:
        TargetFilename|startswith:
        - C:\Windows\SoftwareDistribution\
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
        - C:\Windows\UUS\
      filter_main_process:
        Image|endswith: \wuaucltcore.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining what ran on the host immediately before and after the drop reveals what staged it and what followed: reconnaissance, the execution of the relocated WerFault.exe, or additional persistence. Novel parent-child pairs standing out at low counts against routine agent telemetry are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host may reveal the stages that preceded the sideload setup. Defense tampering, reconnaissance, or credential access before a WerFault relocation helps reconstruct the timeline and establish how the attacker reached the point of staging a hijack.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    A DLL search-order hijack gives execution but is often paired with a separate autostart so the payload survives reboot. File-based persistence bypasses command-line detection entirely: a file dropped into a Startup folder or a Run key path achieves persistence without running scheduling or registry tools. Drops in the same timeframe as the sideload setup indicate intentional stacking.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Is there a documented deployment, maintenance window, or approval that would place WerFault.exe or wer.dll outside the standard Windows folders?
  context: >-
    Windows itself services these error-reporting components only into system directories, so a copy in an application or user-writable folder rarely has a legitimate deployment behind it. A corresponding software-install or maintenance record can quickly close a false positive; absence of any documented reason for the relocation raises the priority of the hijack hypothesis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
