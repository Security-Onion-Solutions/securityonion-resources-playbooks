name: Windows Registry Trust Record Modification
id: a88a2096-5dfa-4292-ba66-da3e185f944d
description: |
  This rule fires when a process writes to the Office Trusted Documents TrustRecords registry key under a
  user hive at Security\Trusted Documents\TrustRecords. Office writes an entry here, with the value name
  equal to the full document path, when a user clicks Enable Editing or Enable Content on a Protected View
  document, recording a trust decision that is a precondition for macro execution on documents from
  untrusted locations such as internet downloads and email attachments. Because both Enable Editing and
  Enable Content create entries, the event alone confirms a trust decision was made for a specific file but
  does not by itself prove macros ran. A modification tells you which document a user opened and trusted;
  the investigation should determine whether that document was macro-enabled, where it came from, whether
  the Office process then spawned child processes or reached the network, and whether the same file or key
  appears on other hosts.
type: detection
detection_id: 295a59c1-7b79-4b47-a930-df12c15fc9c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match the Trusted Documents TrustRecords pattern this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact registry path (TargetObject) and value data (Details) against the rule's detection criteria. The TargetObject should end in Security\Trusted Documents\TrustRecords with a value name equal to the full path of the trusted document.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to open macro-enabled Office documents from untrusted locations?
  context: Legitimate users routinely enable editing on downloaded or emailed documents, so the writing user and host function matter. Knowing whether this user regularly works with macro-enabled documents, and whether the host is an ordinary workstation rather than a locked-down role account, is often the fastest way to separate routine document handling from a phishing-payload open.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What document path is recorded in the TrustRecords value, and is this a security-relevant trust decision?
  context: The TrustRecords key records a user's decision to bypass Protected View, which is a precondition for macro execution on documents from untrusted locations. The value name carries the full path of the trusted document, and the writing process (Image) identifies the Office application. Read the document path to learn what was opened and from where, such as a Temp folder, a Downloads folder, an email-attachment cache, or a network share.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which document was trusted, and does the value data indicate macros were enabled rather than only editing?
  context: The value name under TrustRecords is the full path of the document the user trusted, and the value data (Details) is a binary trust blob whose final bytes encode the trust level. A trailing marker of FF FF FF 7F indicates the user enabled macros, not merely editing. Value data is present on roughly four in five endpoint registry modifications and may be reported as binary; where it is absent, treat the document path itself as the primary artifact and pivot to whether the Office process spawned children.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What email or document opened the Office application that wrote this trust record?
  context: Initial access typically begins with a phishing email carrying a malicious attachment or link. The Office application's parent process and command line often reveal the document filename and whether it was launched from an email client, a browser download, or a network share. Identifying the delivery vector enables blocking the sender at the perimeter and searching for other recipients. A known-sender allowlist helps separate routine internal documents from externally delivered ones.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Has this document trust record been written on this host before?
  context: A first-time trust record for a given document path is more notable than a repeat open of a routine file. Aggregating prior modifications of this key on the host shows whether this document, or documents like it, have been trusted here before. Zero history points to a newly delivered document.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications occurred on this host in the same window?
  context: A macro payload often changes several registry keys in quick succession, for example writing a Run key for persistence while weakening macro-security settings under the Office Security key. Grouping registry changes from the same window and writing process reveals whether the trust record was an isolated user action or part of a burst of configuration changes. Watch for a VBAWarnings value under the Office Security key, which appears when default macro-security settings are lowered to a more permissive level.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What files did the Office process write to disk around the time it recorded the trust decision?
  context: After a user enables macros, the document's code commonly drops a payload to disk in a user-writable location before executing it. Listing files written by the same Office process surfaces dropped executables and scripts. High-risk file types include .exe, .js, .vbs, .scr, and macro-enabled documents such as .docm and .xlsm; a write of one of these by an Office process shortly after a trust decision is worth correlating with subsequent process execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the Office process spawn child processes such as script hosts or command interpreters?
  context: The core of a macro-based compromise is the Office application spawning a child process. Suspicious lineage patterns include winword.exe or excel.exe launching powershell.exe, cmd.exe, wscript.exe, or mshta.exe. Retrieving processes whose parent is this Office process, within a few hours of the trust decision, shows whether the trusted document actually executed code. The correlation window between the trust write, child-process execution, and any outbound connection is the timeline that confirms or clears the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the host make outbound network connections shortly after the document was trusted?
  context: Macro payloads frequently reach out to download a second stage or to establish command and control immediately after execution. Reviewing outbound connections from the host in the hour after the trust decision, and matching them to the Office process or its children, distinguishes a benign document open from one that initiated network activity. Prioritise destinations that are newly seen for this host.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in a short window around the trust record collapses routine background telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look for reconnaissance, credential access, or persistence steps that followed the document open.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this same document trust record written on other hosts?
  context: The same document path appearing in TrustRecords across multiple hosts suggests a shared or widely distributed attachment rather than a one-off open. Comparing the writing process and value data across hosts shows whether a single document reached many users, which reframes the alert as one instance of a wider delivery.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did this rule fire on other users or hosts in the recent window?
  context: Phishing campaigns rarely target a single recipient. Correlating this detection across hosts and users shows how many systems recorded a trust decision for a delivered document and identifies additional accounts that may have opened the same attachment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the Office installation on this host current with security patches?
  context: Some document-based initial access chains rely on Office parsing or OLE vulnerabilities rather than user-enabled macros. Confirming the Office version and patch level helps distinguish exploitation of a known flaw from a routine macro-trust decision and identifies whether other similarly unpatched hosts are exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did other detections fire on this host in the hours before the trust record was written?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal attack stages that preceded the document open and help reconstruct the full timeline. A quiet history before the trust write is consistent with a fresh initial-access event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
