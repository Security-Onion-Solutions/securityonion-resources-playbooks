name: Vulnerable HackSys Extreme Vulnerable Driver Load
id: ca615aa0-891e-4504-b824-94cb7171e8a5
description: |
  Detects a kernel driver load matching HackSys Extreme Vulnerable Driver (HEVD), either by a driver
  path ending in \HEVD.sys or by an import hash matching one of two published HEVD builds. HEVD is an
  intentionally vulnerable Windows kernel driver written as a teaching target: it implements stack
  overflows, use-after-free, pool overflows, race conditions, and other defects on purpose so that
  security researchers and exploit-development students can practice writing kernel exploits against a
  known target. Loading it on a research workstation, a CTF machine, or a training lab image is exactly
  what the driver exists for and is expected; loading it on a general corporate endpoint or a server
  means a driver whose only property is exploitable kernel defects was registered and loaded there, and
  the same driver is used to obtain kernel code execution from an administrative context on hosts where
  it was never installed as a learning tool. The investigation should establish which kind of host this
  is, whether a person on it was doing exploit-development work, how the driver file arrived, what
  service registered it, and what ran against it after the load.
type: detection
detection_id: 295c9289-acee-4503-a571-8eacaef36b28
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did the loaded driver match this rule by its \HEVD.sys path, by its import hash, or by both?
  context: >-
    The rule fires on either branch independently, so record which one matched. A path match means a file
    named HEVD.sys loaded and the file behind that name still needs identifying, since the name alone is
    trivially reusable. An import-hash match under a different file name means the driver's code matches a
    published HEVD build while carrying a name chosen to avoid the obvious one, which is a deliberate act
    rather than an unpacked training archive. Both branches matching together is the ordinary case for an
    unrenamed release build. Note the full load path as well as the name — a load from a project or
    download directory reads differently from a load out of the system driver directory.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
- question: Is this a security-research, exploit-development, or lab host, and is this account expected to
    load kernel drivers on it?
  context: >-
    This is the question the rest of the investigation turns on. HEVD has one audience — people learning
    or practicing kernel exploitation — so on a researcher's workstation, a training image, or a CTF box
    the load is the tool working as intended and the review can be short. On a finance workstation, a
    domain controller, a build server, or a kiosk there is no role that explains a deliberately vulnerable
    driver being present at all. Resolve the host's function and the account's role from asset inventory
    and the team that owns the machine before spending time on the mechanics. Where the environment records
    such things, a lab designation, a training window, or an approval attached to the person doing the work
    is the documentary form of the same answer and is worth pulling alongside the inventory record.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: From what path did the driver load, what signing status does it carry, and which process
    triggered the load?
  context: >-
    HEVD ships as source and as unsigned pre-built binaries, so it normally loads with no valid signature
    and requires test-signing mode, driver-signature enforcement disabled, or a signature obtained
    separately. Read the three together. A load from a project tree, a downloads folder, a desktop path,
    or C:\Windows\Temp\ fits a build or an unpacked release being exercised where it was placed. A load out
    of %SystemRoot%\System32\drivers\ means the file was installed like a product driver, which HEVD's own
    use does not require. A valid signature on a driver whose purpose is to be exploitable is the result to
    pursue hardest, because it means the file loads on hosts with enforcement intact.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
- question: Is the loaded file a published HEVD build, a locally compiled one, or something else carrying
    the name?
  context: >-
    Driver load events carry the file's hash directly, so the identification needs no execution pivot. Take
    the hash to a reputation service and compare it against the project's published release binaries. A hash
    matching a published release means an unmodified download was used, which fits self-directed study and
    also fits someone who fetched the easiest known-vulnerable driver available. A hash matching no known
    release, on a file that still triggers this rule by import hash or name, means the driver was compiled
    locally or altered — worth resolving, since a local build implies the source tree and a toolchain are on
    the host. A hash belonging to an unrelated signed vendor driver means only the name collided and the
    identification ends there.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
      - SignatureStatus
      - ImageLoaded
- question: What kernel service was installed to load this driver, and what binary path and account does it
    use?
  context: >-
    A driver reaches the kernel through a service registration, so the service install record is the
    installation record for this load. The structured fields name the service, the file path it points at,
    its start type, and the account it runs under. A demand-start service pointing at HEVD in a user's own
    directory fits someone loading it for a session and unloading it afterward, which is how the driver is
    normally exercised. An auto-start entry means the vulnerable driver loads at every boot, which no
    training use requires and which leaves the defect available to any local process indefinitely. If no
    install record appears in this window, the service was registered earlier — read that from the service
    key's own modification history rather than concluding no service exists.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: What service registry entries were written under CurrentControlSet\Services on this host around
    the load?
  context: >-
    Service registration is a registry operation, and those values are the durable record of how a driver
    is loaded. ImagePath names the .sys file, Start controls whether it loads at boot (0 or 1 means the
    driver loads before or with the operating system), and Type identifies it as a kernel driver rather
    than a user-mode service. Writes here can register a driver without any service-install tooling running,
    which is why this view is read independently of the install record. A Start value changed on an existing
    key rather than a new key created means an already-registered driver was reconfigured to load; the
    writing process on those events names what made the change.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process loaded this driver, and what launched it?
  context: >-
    Driver loads are usually initiated by the service control manager or by the kernel at boot, so the load
    event may resolve no useful process — an empty result on a boot-time load is expected and is not itself
    a finding. Where a loading process does resolve, its own start event names the parent that launched it.
    A console, a development environment, or a debugger as the ancestor fits interactive exploit work. A
    script host, a remote-management agent, a service account context with no person behind it, or a binary
    in a user-writable directory as the parent means the registration was driven by automation or by
    something arriving on the host rather than by a person at the keyboard.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the driver's service still installed, and is the driver still resident in the kernel?
  context: >-
    The load event records that the driver reached the kernel at that moment, not that it is still there.
    Read the service state and the loaded-driver list from the host or the endpoint console directly. A
    service still registered and a driver still loaded means the exploitable defect remains reachable by any
    process on the host right now, which sets the remediation step regardless of who put it there. A driver
    loaded and unloaded within a session, with the service removed afterward, matches the exercise pattern
    the tool is built for. A kernel driver service runs as LocalSystem by construction, so the account field
    carries no attribution.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was the driver file written to this host's disk, and what process wrote it?
  context: >-
    The write that placed the .sys file identifies how the driver arrived. The query anchors on the alerting
    driver's own filename across this host's file writes, so a result names the writing process and the
    directory it chose. A write by a compiler toolchain or an archive extractor into a project or downloads
    directory fits a person building or unpacking the driver deliberately. A write by a browser child, a
    script host, a remote-management agent, or an unfamiliar binary into C:\Windows\Temp\, C:\ProgramData\,
    or C:\Users\Public\ points to staging by something other than a person studying it. File-write events
    carry no hash, so match the write to the load by name and path and take the hash from the load event. No
    write in this window means the file predates it — widen the range before concluding it was already
    present.
  range: +/-4h
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did the Security log record a service installation or special-privilege assignment on this host
    around the load?
  context: >-
    Event 4697 records a service installation with the service name and its file path, corroborating the
    driver's registration from a second channel and naming the account that performed it — which is the
    attribution the load event itself lacks. Event 4672 records privileged tokens assigned at logon; it is
    emitted for every SYSTEM and administrative logon and is high volume by nature, so read it for accounts
    that do not normally receive these privileges on this host rather than for volume. Registering a driver
    requires administrative rights already, so the useful finding here is which account held them. If the
    Security channel is not collected in this environment, zero results is a visibility gap rather than
    evidence nothing occurred.
  range: +/-30m
  answer_sources:
  - active_directory
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4697
          - 4672
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
      - ServiceName
      - ServiceFileName
- question: Was exploit-development or kernel-debugging tooling running on this host around the driver load?
  context: >-
    HEVD is not useful on its own — it is a target, and something has to drive it. Kernel debuggers, disassemblers,
    and a build toolchain running in the same window are the corroboration that this host is being used for
    exploit-development work, which supports the expected reading and largely closes the alert when the host's
    role agrees. Their complete absence is the discriminator that matters most: a deliberately vulnerable
    driver loaded with no debugger, no source tree, and no development environment anywhere near it means the
    driver was brought for the kernel access its defects provide, not to be studied. Note the account running
    the tooling and whether it is the same one behind the driver's registration.
  range: +/-4h
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_devtools:
        Image|endswith:
          - '\windbg.exe'
          - '\windbgx.exe'
          - '\kd.exe'
          - '\cdb.exe'
          - '\ntkd.exe'
          - '\x64dbg.exe'
          - '\x32dbg.exe'
          - '\ida.exe'
          - '\ida64.exe'
          - '\devenv.exe'
          - '\msbuild.exe'
          - '\cl.exe'
          - '\ghidraRun.bat'
      condition: selection and selection_devtools
    fields:
      - Image
      - CommandLine
      - User
- question: Does the user or an administrator recall loading this driver, and what were they working on?
  context: >-
    Unlike most kernel driver loads, this one usually has a person behind it who can explain it in one
    sentence. If someone recalls it, ask what they were exercising, where the file came from, whether they
    built it or downloaded it, and whether the work was meant to happen on this machine rather than on a
    dedicated lab system. If nobody recalls it — particularly on a host with no research role — then an
    account with administrative rights registered a deliberately vulnerable driver without its owner
    knowing, and the origin of the file and the identity of the registering account become the open items.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this driver loaded on this host before, and always with the same hash and signer?
  context: >-
    A recurring load history over the past ninety days fits a machine that is used for this work regularly,
    and moves the review toward the host's role rather than the file's origin. A first or near-first load
    puts the origin questions in front — where the file came from and what registered it. The hash and signer
    comparison matters as well: the same filename loading for months under one hash and then loading with a
    different one means the file behind an established name was replaced.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
- question: Is this driver loading on other hosts in the environment?
  context: >-
    Cross-host distribution separates one person's work from something spreading. The driver on a handful of
    hosts belonging to a research or security team fits that team's function and can be confirmed with them
    directly. The same driver on unrelated hosts — servers, user endpoints, hosts with no research role —
    means the file is being placed rather than studied, and each of those hosts needs the same origin and
    service questions asked of it. Compare hashes across hosts as well; differing hashes behind one name
    means more than one file is in play. Hosts not reporting driver load telemetry are absent from this
    result regardless of what loaded on them.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Has a driver whose import hash matches a known HEVD build loaded anywhere in the environment
    under a different file name?
  context: >-
    The name-anchored views only find loads of a file called the same thing, so they cannot see a copy of
    this driver that was renamed before it was registered — which is the case the rule's import-hash branch
    exists to catch. This query drops the name constraint entirely and matches the two import hashes the
    rule carries, across every host, so a result is the same driver code regardless of what it was called.
    Loads under names unrelated to the tool, or on hosts with no research role, mean the driver is being
    placed for the kernel access its defects provide rather than studied. An import hash is a property of a
    binary's import table, so it survives renaming but is also shared by other builds from the same
    toolchain — confirm any result against the file hash and path before treating it as the same file.
  range: -90d
  answer_sources:
  - image_load
  - external_threat_intel
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        Hashes|contains:
          - 'IMPHASH=f26d0b110873a1c7d8c4f08fbeab89c5'
          - 'IMPHASH=c46ea2e651fd5f7f716c8867c6d13594'
      condition: selection
    fields:
      - host.name
      - ImageLoaded
      - Signature
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The minutes around the load hold whatever installed the driver and whatever used it. The aggregated
    parent-child view collapses repetitive agent telemetry into high-count rows so novel low-count pairs
    stand out — service control commands, driver install utilities, debuggers, compilers, script hosts, or a
    single unfamiliar binary appearing once or twice. A newly spawned cmd.exe or powershell.exe running as
    SYSTEM shortly after the load is the outcome a successful kernel exploit produces, and is worth reading
    ahead of everything else in this view.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Registering a driver requires administrative rights, so a driver load is rarely the first stage of an
    intrusion on a host that was not already under someone's control. Earlier detections covering credential
    access, remote execution, defense tampering, or a delivery chain identify how those rights were obtained
    and set the true starting point of the timeline. Nothing before it, on a machine whose owner does kernel
    research, points the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the driver load?
  context: >-
    Service control activity in this window is directly relevant, because the driver's own registration may
    appear here as an sc.exe invocation naming the .sys file. Beyond that, the view surfaces scheduled tasks,
    registry writes, and management-tool persistence configured alongside it. A single sc.exe create that
    registers the driver's service and nothing else fits someone loading a driver to exercise it. Several
    unrelated mechanisms installed in the same window indicate deliberate stacking, which is not part of any
    training exercise.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
