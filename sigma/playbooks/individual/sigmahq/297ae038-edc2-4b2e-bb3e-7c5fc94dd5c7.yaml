name: New Connection Initiated To Potential Dead Drop Resolver Domain
id: 76da8115-36d7-4ad0-89b7-b3ed75136bfc
description: |
  This rule fires when a process that is not a recognized web browser or known application initiates an outbound
  connection to a legitimate public web service commonly abused as a dead drop resolver — paste sites, code
  repositories, social media, cloud storage, and link shorteners. Adversaries hide a secondary command-and-control
  address inside user-controlled content on these trusted services so the initial traffic appears benign; the
  destination itself is not inherently malicious, so the investigative weight falls on which process connected,
  whether that process has any business reaching that service, and what it did with the retrieved content.
  Identify the initiating process and its parent lineage, recover the exact resolver domain that was contacted,
  and look for follow-on connections or dropped payloads that would indicate the process decoded and acted on a
  hidden secondary address.
type: detection
detection_id: 297ae038-edc2-4b2e-bb3e-7c5fc94dd5c7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the destination and port match what this rule detects, and which process initiated the connection?
  context: Confirm the alert by reviewing the exact destination, port, and direction against the rule's criteria,
    and the initiating process. The rule fires only when a non-browser, non-allowlisted process makes an outbound
    connection to one of the listed dead drop resolver services. Destination domain is sparsely recorded on
    network-connection telemetry, so anchor on the destination address and recover the resolver domain through the
    matching DNS lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to run a non-browser process that reaches public web services?
  context: Legitimate software — updaters, sync clients, monitoring agents — routinely contacts cloud storage and
    content-delivery domains, and some run under service or machine accounts rather than an interactive user.
    Knowing whether the account and host role make an outbound connection to this class of service normal is often
    the fastest path to separating a benign application from a process using the service as a covert channel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line and working directory of the process that initiated this connection?
  context: The command line and working directory reveal how the process was launched and what it was doing —
    a scripted download, a loader run from a temporary directory, or a legitimate application started normally.
    If the connection was captured by network-only telemetry with no process attribution, the initiating process
    may not be recorded on the connection event; corroborate from the host's process records at the connection time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which resolver domain did the host look up, and what do DNS, WHOIS, and threat intel reveal about it?
  context: The connection event records the destination address but rarely the domain, and these addresses are
    frequently shared content-delivery endpoints serving many unrelated sites. The DNS lookup performed by the same
    process recovers the exact resolver domain that was requested. Once the domain is known, check registration age,
    passive DNS, certificate details, and reputation — the dead drop service itself is trusted, so the goal is to
    pin down precisely which page or account on it the process was reaching.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
- question: After contacting the resolver, did this process connect to any other previously-unseen destinations?
  context: A dead drop resolver hands back an obfuscated address that the malware decodes in memory and then
    connects to directly. The decoding itself is rarely logged, so the observable evidence is a second egress
    destination from the same process shortly after the resolver contact. A new, unfamiliar destination reached by
    this process — especially a raw address with no domain or a recently registered domain — is a strong candidate
    for the decoded secondary command-and-control endpoint.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - Initiated
- question: What process spawned the process that made this connection, and is that parent chain expected?
  context: The parent process shows how the connecting process was launched. A legitimate application started by
    explorer.exe or a service manager looks different from a process spawned by a script host, an Office
    application, or an unexpected loader. An unusual parent for a process reaching a public web service points
    toward scripted or injected execution rather than routine software behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - ParentProcessGuid
- question: How widely does this executable run across the environment, and is it a common installed application?
  context: A dead drop channel needs a process that can reach the internet without drawing attention. A binary that
    runs on many hosts is likely legitimately deployed software; one that appears on only a single host, or runs
    from a user-writable or temporary path, is a stronger candidate for a planted tool. Also verify the binary's
    signature and original file name to rule out a renamed copy of a trusted executable placed where it would not
    normally live.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- question: How many times, and at what intervals, did this host or process connect to this destination?
  context: A single connection may be part of a repeating pattern. Regular timing intervals, sustained connection
    counts, or a burst of high outbound volume (for example, more than roughly 1MB in a few minutes) suggest
    beaconing or staged transfer rather than a one-off page fetch. Because these destinations are often shared
    content-delivery endpoints, weigh the process and timing together rather than the address alone.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What files or payloads did this process write on the host after the connection?
  context: A process that retrieved content from a resolver may have staged a downloaded payload to disk. Files
    written by the same process around the connection time — executables, scripts, or archives in temporary or
    user-writable directories — indicate the retrieved content was more than configuration data and point to the
    next stage of the operation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally run this executable?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or
    very low historical counts on this host indicate first-time or rare execution, which raises the weight of the
    outbound connection it made.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this host communicated with this destination before, or is this a first-time connection?
  context: First-time connections to a destination carry more weight than routine communication. A long history of
    connections to this address suggests an established, legitimate service relationship; a near-zero count over
    the baseline window points to newly introduced infrastructure or a process reaching the service for the first
    time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the minutes around the connection reveals
    what led to it and what followed — reconnaissance, additional launches, or persistence. Connections made outside
    normal working hours or clustered with other unusual process starts strengthen the case that the resolver contact
    was part of an operator's session rather than background software.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Do other hosts in the environment communicate with this destination?
  context: If only one host connects to this address, it may be a targeted covert channel. If many hosts connect,
    it more likely reflects a legitimate shared service or a widespread deployment. Because these destinations are
    often shared content-delivery endpoints, treat a broad host distribution as evidence the address alone is not
    discriminating and lean on the initiating process and the resolved domain instead.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded this connection and help reconstruct the timeline. Command-and-control contact
    typically follows an initial foothold, so a preceding execution or persistence alert reframes this connection
    as one step in a longer operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
