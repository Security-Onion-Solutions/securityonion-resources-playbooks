name: Potential Maze Ransomware Activity
id: efac138c-5040-45e7-9a54-2e0aee7c8141
description: |
  Detects process characteristics associated with Maze ransomware document droppers and with the
  shadow-copy deletion step that precedes encryption. The rule fires when at least one of three
  independent branches matches: WINWORD.exe spawning a child whose image ends in .tmp; wmic.exe
  running a command line ending in `shadowcopy delete` whose parent path contains \Temp\; or any
  command line ending in `shadowcopy delete` that also contains the `\..\..\system32` traversal
  string. The first branch covers document-delivered dropper execution, the other two cover removal
  of Volume Shadow Copies so local restore is unavailable. The investigation should establish which
  branch fired, decode what the dropper or wmic invocation actually did, determine the current state
  of shadow copies and other recovery points on the host, and check whether the same pattern reached
  other systems.
type: detection
detection_id: 29fd07fc-9cfd-4331-b7fd-cc18dfa21052
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does this event match either the WINWORD-spawned .tmp branch or one of the two `shadowcopy delete` command-line branches?
  context: >-
    The rule fires on any one of three independent branches, and which branch matched decides where the rest of the
    investigation carries weight. Branch one is WINWORD.exe spawning a child whose image ends in .tmp, which points at a
    document that wrote and ran a payload. Branch two is wmic.exe with a command line ending in `shadowcopy delete` and a
    parent process whose path contains \Temp\. Branch three is any command line ending in `shadowcopy delete` that also
    contains `\..\..\system32`, a traversal form that reaches the system binary while obscuring the literal path. Note the
    matching branch before continuing. The dropper branch makes the delivery-vector and file-artifact questions
    load-bearing; the two shadow-copy branches make the recovery-state and destruction-scope questions load-bearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to open documents that spawn temporary executables, or to delete shadow copies?
  context: >-
    Shadow copy deletion appears in some backup, imaging, and disk-maintenance workflows, and a few installers do run
    executables out of a temporary path. Establishing whether the account's role and the host's function match either
    activity is usually the quickest way to separate routine operations from dropper or ransomware execution. Neither
    pattern is expected on a general-purpose workstation under a standard user account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the alerting binary do? Decode its full command line and working directory.
  context: >-
    The command line carries the operation. For a wmic invocation, read whether the call was local shadow-copy deletion or
    a `/node:` remote `process call create`, which would name another host and the payload path it was told to run. For a
    temporary executable spawned by Word, the working directory and any arguments indicate where the file was staged and
    what it was told to do. The query returns every execution of this binary on this host in a five-minute window, so
    multi-step sequences issued by the same script appear together rather than one row at a time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this parent expected to spawn this child, and what started the parent?
  context: >-
    Both parent-child pairs the rule targets are off-profile. WINWORD.exe spawning a .tmp executable indicates a macro or
    embedded object wrote a payload and executed it. A wmic.exe whose parent lives under a \Temp\ path indicates the
    shadow-copy deletion was driven by a dropped binary or script rather than an administrator's shell. Retrieving the
    parent's own creation event shows what document was open, or what launched the temp-resident parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What document, email attachment, or download led to this execution?
  context: >-
    Ransomware document droppers arrive as an attachment or a link, and the handler application records the opened file on
    its own command line. For a WINWORD.exe parent the ParentCommandLine normally carries the document path, which gives
    the filename to search mail and web gateway logs for other recipients. Identifying the delivery artifact also enables
    blocking the sender domain or URL and pulling the same file from other mailboxes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: >-
    A document that drops one executable often also spawns script hosts or command interpreters, and a temp-resident
    parent that runs wmic for shadow-copy deletion typically issues other commands in the same sequence. Listing every
    child of the exact parent instance shows the full set of actions initiated through this chain rather than the single
    step that alerted.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the dropped temporary file still on disk for analysis?
  context: >-
    The dropper branch writes an executable into a user-writable path and runs it from there, and that file is the
    highest-value artifact for hashing, reputation lookup, and sandbox review. This query correlates file activity back to
    the alerting process and its direct children by process lineage, since the path is only visible through the command
    line and not as a queryable field. Alternate-data-stream metadata that would record the file's download origin is not
    available in this event stream, so confirm the file's presence and its origin marking on the host itself or through an
    endpoint console.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the Office installation on this host fully patched?
  context: >-
    A Word process that spawns an executable is usually the result of a macro the user enabled, but it can also follow
    exploitation of an OLE, DDE, or equation-editor vulnerability. Patch level distinguishes the two and indicates whether
    other hosts running the same build are exposed to the same path. The query names the parent application so the version
    can be checked against the deployed patch baseline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Shadow-copy deletion is normally one step in a longer sequence that also disables boot recovery with bcdedit, removes
    backup catalogs with wbadmin, and turns off the Windows Recovery Environment with reagentc. This query sweeps the host
    for that whole family of binaries and for the command-line forms `delete shadows`, `shadowcopy delete`,
    `recoveryenabled`, `bootstatuspolicy`, `delete catalog`, `delete systemstatebackup`, `boot.ini`, `winre.wim`, and
    `/disable`, across the 24 hours following the alert. Process telemetry records that a command ran, not that it
    succeeded. Verify current state on the host with `vssadmin list shadows`, `bcdedit /enum`, `reagentc /info`, and
    `wbadmin get versions`, and confirm off-host backup availability through the backup system.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: Were registry values that control System Restore or the shadow-copy services modified on this host?
  context: >-
    Command-line deletion removes the existing shadow copies; registry changes stop new ones from being created and keep
    the Volume Shadow Copy, software-shadow-provider, and block-level backup services from starting again. Modifications
    to the SystemRestore policy values or to the Start value of VSS, swprv, or SDRSVC around the alert indicate the
    recovery path was closed rather than merely cleared once. Registry deletions are not observable in this event stream,
    so read this as the modification history of those keys and confirm the live values on the host.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\SPP\Clients'
          - '\Services\VSS\Start'
          - '\Services\swprv\Start'
          - '\Services\SDRSVC\Start'
      condition: selection and selection_recovery
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the WMI-Activity channel record provider loads or event subscriptions on this host around the alert?
  context: >-
    A wmic command line only shows the request that was typed; the WMI-Activity operational channel shows what the WMI
    service actually did, including provider loads recorded as event 5857 and event subscriptions registered as 5860 for
    temporary and 5861 for permanent. Subscription registration around a destructive command indicates WMI was used for
    persistence or for triggered execution in addition to the one-shot call. Hosts that do not ship the WMI-Activity
    channel return nothing here, so treat zero results as a visibility gap rather than evidence nothing was registered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.Query
      - message
- question: Did wmic.exe or the WMI provider host make outbound connections from this host around the alert?
  context: >-
    WMI is a remote execution channel as well as a local one, and mass deployment of an encryptor is commonly driven by
    `wmic /node:` calls that create processes on other machines. Outbound connections from wmic.exe or WmiPrvSE.exe to
    port 135 and the dynamic RPC range, or from psexec to 445, name the hosts that were targeted from here. Count the
    unique remote destinations in the window: a handful suggests administrative use, while dozens in a few minutes
    indicates scripted fan-out and defines the containment scope.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wmic.exe'
          - '\WmiPrvSE.exe'
          - '\psexec.exe'
          - '\PSEXESVC.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - Initiated
- question: Are there signs of encryption activity, ransom notes, or unknown binary execution on this host after the alert?
  context: >-
    Recovery destruction usually runs minutes ahead of encryption, so the window after the alert is where the encryptor
    itself appears. This query lists process activity on the host with the common system paths filtered out, which
    surfaces unsigned or unfamiliar executables running from temporary and user-writable directories. Alongside it, check
    the file system for a sudden run of renames or a new extension applied across user data, and for ransom-note files
    written into every affected directory.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Is this same detection firing on other hosts in the environment?
  context: >-
    The same dropper is delivered to many recipients at once, and the deletion command is pushed to many machines from one
    staging host, so this detection firing on several systems in a short window changes the response from single-host
    triage to multi-host containment. The first and last firing times outline how the activity spread and in which
    direction. Isolated firing on one host points instead at a locally opened document.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection structure scoped to this user, so the result is the user's 90-day history
    of this exact firing pattern rather than generic use of wmic or Word. A backup or imaging operator with a steady prior
    count reads very differently from an account that has never produced the pattern before. Weigh the count against the
    user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|endswith: \WINWORD.exe
        Image|endswith: .tmp
      selection2:
        Image|endswith: \wmic.exe
        ParentImage|contains: \Temp\
        CommandLine|endswith: shadowcopy delete
      selection3:
        CommandLine|endswith: shadowcopy delete
        CommandLine|contains: \..\..\system32
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment?
  context: >-
    When the alert fires under SYSTEM or a machine account, the user field attributes nothing and the launch mechanism is
    the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting parent, so the result is
    the 90-day history of this parent driving this specific pattern. A parent already responsible for thousands of prior
    events is vendor or operating-system automation; a parent that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|endswith: \WINWORD.exe
        Image|endswith: .tmp
      selection2:
        Image|endswith: \wmic.exe
        ParentImage|contains: \Temp\
        CommandLine|endswith: shadowcopy delete
      selection3:
        CommandLine|endswith: shadowcopy delete
        CommandLine|contains: \..\..\system32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Operators reach the encryption stage after moving through several hosts with the same credentials, so the user's
    activity on machines other than the alerting one indicates how far the account has already been used. Concentration on
    one host points to a locally triggered document; activity spread across servers and workstations in the same hour
    points to hands-on movement. If the alert fired under a service principal, this view fills with routine agent activity
    and the parent-scoped view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, inside the alert
    window. Several hosts appearing at once points to a pushed or scheduled rollout of the same launcher, which is what
    mass deployment of an encryptor looks like from the endpoint side. A single host points to a host-local trigger such
    as one opened document.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|endswith: \WINWORD.exe
        Image|endswith: .tmp
      selection2:
        Image|endswith: \wmic.exe
        ParentImage|contains: \Temp\
        CommandLine|endswith: shadowcopy delete
      selection3:
        CommandLine|endswith: shadowcopy delete
        CommandLine|contains: \..\..\system32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
