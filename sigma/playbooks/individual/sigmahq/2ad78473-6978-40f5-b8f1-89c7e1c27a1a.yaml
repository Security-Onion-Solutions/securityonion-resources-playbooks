name: RedSun - Conhost.exe Spawned by TieringEngineService.exe
id: 0fa2715c-6fb4-457b-8b55-ad069dcf2b01
description: |
  Fires when either of two process-creation patterns is seen under a SYSTEM, service, or machine
  account: TieringEngineService.exe spawning conhost.exe whose command line is the bare image path
  with no arguments, or a command interpreter (cmd.exe, powershell.exe, powershell_ise.exe, pwsh.exe)
  whose parent is conhost.exe and whose grandparent is TieringEngineService.exe. conhost.exe is the
  console host Windows attaches when a console application starts; TieringEngineService.exe is the
  Storage Tiers Management COM server, a headless service that does not normally run console
  applications, so a console host beneath it implies a console process was started inside that
  service's token context — the standard result of token duplication or session re-stamping used to
  place an interactive process under a privileged token. Determine which branch fired, whether the
  service binary and its children are the files their names and metadata claim, and what the
  SYSTEM-context process went on to do.
type: detection
detection_id: 2ad78473-6978-40f5-b8f1-89c7e1c27a1a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does this event match either branch of the rule — an argument-less conhost.exe under
    TieringEngineService.exe, or a shell under conhost.exe with TieringEngineService.exe as
    grandparent?
  context: >-
    The rule fires on either branch independently, and the branch determines where the evidence sits.
    The conhost branch additionally requires the command line to end with the bare conhost.exe path
    and the user to contain AUTHORI, AUTORI, or $; the full-chain branch requires the grandparent to
    be TieringEngineService.exe, the parent conhost.exe, and the child one of cmd.exe,
    powershell.exe, powershell_ise.exe, or pwsh.exe under the same account condition. The conhost
    branch has no arguments to analyze, so binary identity and later child processes carry the
    weight; the full-chain branch puts the interpreter's own command line in scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - User
      - GrandParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run a console application or an interactive shell under the Storage Tiers Management service account?
  context: >-
    The account on the event will be SYSTEM, a service principal, or a machine account by
    construction, so the identity itself carries no attribution. What matters is whether this host
    has a documented reason for a console process to run in that service's context — a support
    engineer's diagnostic session, a storage-tiering troubleshooting procedure, or a management agent
    that hosts helpers under the service. Absent such a reason, the console host under a headless COM
    server is the finding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    TieringEngineService.exe is normally started by services.exe as a COM server and exits when its
    work is done; conhost.exe is normally attached to a console application by the console host
    subsystem, not used as a launcher. Retrieving the parent's own creation event shows what started
    it, under which account, and with what command line, which distinguishes a service instance the
    service control manager started from one an external caller instantiated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Does the alerting binary's embedded metadata and hash match the system file its name and path claim?
  context: >-
    A service binary in System32 that has been replaced keeps the trusted name and location while the
    PE metadata, signing status, and hash change. Comparing the image path against OriginalFileName
    and submitting the hash for reputation review separates the shipped Windows file from a
    substituted one. A System32 binary with a mismatched OriginalFileName, no Microsoft signature, or
    a hash unknown to reputation sources is the case where the trusted path is doing the work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How and when did the binary with this file name arrive at its location on the host?
  context: >-
    A file matching a trusted system name did not appear on its own — it was written by an installer,
    a servicing operation, a copy, or a process that overwrote the original in place. Matching on the
    file name over a long window surfaces every creation or replacement of that name on the host, and
    the process shown on the file event names the writer. A write by servicing or an installer reads
    differently from a write by a user-context process, an archive extractor, or a security product
    restoring a file it had previously quarantined.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What other child processes did this same parent instance spawn?
  context: >-
    A console host that exists only to carry a privileged session is usually not the sole child. If
    the same parent instance also launched an interpreter, a copy or move, a service control
    operation, or a network utility, the console host is one step of a sequence rather than an
    isolated event. Review each sibling and its command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the alerting process go on to execute on this host?
  context: >-
    The console host branch produces no arguments, so what the process did next is the only direct
    evidence of purpose. Children of an argument-less conhost.exe are the console applications it is
    hosting; children of an interpreter running under the service token are the operations performed
    with that token. Reconnaissance, account manipulation, service or scheduled-task creation, or
    file staging under a privileged account are the outcomes worth tracing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: If the alerting process is a PowerShell host, what does its command line decode to?
  context: >-
    When the full-chain branch fires on powershell.exe, powershell_ise.exe, or pwsh.exe, the command
    line is the payload record. Base64 under -EncodedCommand or -enc, backtick escaping, string
    concatenation, and variable substitution all resolve at this layer; decoding them exposes
    download cradles, reverse shells, and in-memory assembly loads. An interpreter launched with no
    arguments at all points to an interactive session driven over the console rather than a scripted
    payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture what ran in the privileged session?
  context: >-
    Event ID 4104 records the deobfuscated script text PowerShell actually executed, which is the
    only record of an interactive session typed into a console host — no command line exists for
    keystrokes entered after the interpreter starts. Reviewing 4104 around the alert shows what was
    run under the service token. If PowerShell operational logs are not collected in this
    environment, treat an empty result as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened on this host before the alert?
  context: >-
    Execution-policy overrides, AMSI tampering, real-time monitoring changes, and version-2 downgrade
    invocations in the hour before a privileged shell appears indicate the environment was prepared
    for a payload that expects to be inspected. Their absence does not clear the alert, but their
    presence places the console host inside a sequence rather than at its start.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What privileged logon and special-privilege assignments occurred on this host around the alert?
  context: >-
    Placing a process under a duplicated or re-stamped token leaves records on the Security channel:
    4672 shows which logon session was granted sensitive privileges such as SeDebugPrivilege,
    SeImpersonatePrivilege, or SeTcbPrivilege; 4624 shows the logon type and the session the token
    belongs to; 4634 closes it. Correlating the logon ID on those events with the alerting process
    tells whether the console host runs in the service's own session or in an interactive session
    belonging to a different logon — a parent-child security-context mismatch is the discriminator
    between a service doing its job and a token being borrowed. Accounts and binaries that
    legitimately create processes with another token (deployment, backup, and remote-management
    agents) should be on an allow-list before this is treated as a deviation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4634
          - 4672
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - SubjectLogonId
      - PrivilegeList
  answer_sources:
  - process_creation
  - manual_review
- question: Did the service process or its console host make memory-write or APC-injection API calls in the minutes around the alert?
  context: >-
    Token abuse is often paired with writing code into another process, and behavioral API telemetry
    records the injection side of that: WriteProcessMemory, QueueUserAPC, and SetWindowsHookEx. A
    five-to-ten minute window either side of the process creation is the useful correlation span,
    since the API call and the resulting process appear close together. Read-side activity — opening
    a handle to another process, duplicating its token, reading its memory — has no equivalent
    record, so an empty result rules out injection only, not token theft, and should be read as a
    blind spot rather than an all-clear.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
  answer_sources:
  - process_creation
  - manual_review
- question: Has this parent binary spawned this child on this host before?
  context: >-
    A headless COM server that has never produced a console host, or a conhost.exe that has never
    produced an interpreter, makes this pairing novel on the host. A count in the hundreds over 90
    days points instead to a management or diagnostic workflow that routinely runs console tools in
    the service's context and should be identified and documented.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is its
    90-day history of this specific pattern rather than generic use of the binaries, aggregated by
    host. An account with no prior history of it is the deviation worth chasing. Because the rule
    only matches SYSTEM, service, and machine accounts, expect this pivot to be broad or degenerate —
    the launch-mechanism history is the more attributable reading.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_tiering_to_conhost:
        ParentImage|endswith: \TieringEngineService.exe
        Image|endswith: \conhost.exe
        CommandLine|endswith: conhost.exe"
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      selection_shell_full_chain:
        GrandParentImage|endswith: \TieringEngineService.exe
        ParentImage|endswith: \conhost.exe
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is it new for this activity?
  context: >-
    The alert fires under a service principal by construction, so account identity does not attribute
    behavior; the launch mechanism does. The query mirrors the rule's selection structure scoped to
    the alerting parent, giving the 90-day history of that parent driving this specific pattern
    rather than generic parent-and-binary co-occurrence. A parent that is new or rare for this
    pattern is the deviation; one already accounting for thousands of prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_tiering_to_conhost:
        ParentImage|endswith: \TieringEngineService.exe
        Image|endswith: \conhost.exe
        CommandLine|endswith: conhost.exe"
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      selection_shell_full_chain:
        GrandParentImage|endswith: \TieringEngineService.exe
        ParentImage|endswith: \conhost.exe
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    identity was active on other endpoints. Under SYSTEM or a machine account this returns
    agent-telemetry volume across the fleet and answers little on its own; read it for hosts that
    stand out rather than for totals, and rely on the launch-mechanism pivot for attribution.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts producing the pattern at once points to scheduled
    or pushed automation; a single host points to a host-local trigger and keeps the investigation
    anchored to this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_tiering_to_conhost:
        ParentImage|endswith: \TieringEngineService.exe
        Image|endswith: \conhost.exe
        CommandLine|endswith: conhost.exe"
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      selection_shell_full_chain:
        GrandParentImage|endswith: \TieringEngineService.exe
        ParentImage|endswith: \conhost.exe
        Image|endswith:
        - \cmd.exe
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
        User|contains:
        - AUTHORI
        - AUTORI
        - $
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A privileged console session is an outcome, not a beginning. Earlier detections on the same host
    — file writes into system directories, service or driver installation, defense tampering, or
    reconnaissance — reveal how the service context was reached and let the timeline be
    reconstructed from the first observable step rather than from this one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
