name: System Control Panel Item Loaded From Uncommon Location
id: 44f517a9-6921-48f2-83b0-7be127b00e10
description: |
  Detects a system Control Panel item (.cpl — a DLL) named appwiz.cpl, bthprops.cpl, or hdwwiz.cpl
  loading from a path outside the standard system directories (System32, SysWOW64, WinSxS, Prefetch).
  A .cpl is loaded by control.exe or by its native launcher equivalent (fondue.exe, hdwwiz.exe, fsquirt.exe);
  copying that launcher to a user-writable folder and dropping a matching malicious .cpl beside it yields
  code execution and a persistence/proxy-execution vector via Control Panel-item side-loading. Legitimate
  system tooling loads these modules only from the Windows system paths, so a load from AppData, Public,
  ProgramData, or an arbitrary directory is anomalous. Determine which .cpl loaded, from where, whether it
  is signed and its hash, which process loaded it and how that process was launched, and whether the load
  coincides with file drops or registry changes that would persist the foothold.
type: detection
detection_id: 2b140a5c-dc02-4bb8-b6b1-8bdb45714cde
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact .cpl path (ImageLoaded), its
    code-signature status, and the process that loaded it against the rule's criteria. The rule fires
    when a .cpl named appwiz.cpl, bthprops.cpl, or hdwwiz.cpl loads from anywhere other than the Windows
    system directories (System32, SysWOW64, WinSxS, Prefetch). A load from a user-writable directory is
    the anomaly. DLL loads carry a hash and signing status on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to load Control Panel items or run their native launchers?
  context: Legitimate activity can trigger this detection — a user opening a Control Panel applet, or an
    IT-deployed tool that stages its own copy of a launcher. Knowing whether the account and the host's
    function are consistent with running control.exe, fondue.exe, hdwwiz.exe, or fsquirt.exe from a
    non-system path is often the fastest way to separate routine use from side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load, and are any from user-writable or non-system paths,
    unsigned, or unexpected?
  context: The full set of modules a process loads tells the operator's story. Alongside the alerting .cpl,
    look for additional DLLs from %TEMP%, AppData, ProgramData, or Public; unsigned modules in directories
    where signed ones are expected; and system DLL names loaded from non-system paths, which point to
    search-order hijacking. A launcher relocated to a user-writable folder frequently drags its own
    supporting DLLs alongside the malicious .cpl.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded .cpl, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation separates a routine Microsoft Control Panel item from a side-loaded malicious
    one. A genuinely signed system .cpl loaded from an unexpected location may still be legitimate, but an
    unsigned module carrying a system .cpl filename with no valid signature is a strong masquerading
    indicator. SignatureStatus values to watch are Unsigned, Expired, Distrusted, and Invalid (tampered).
    The Hashes field gives the sha256 for a threat-intelligence lookup that can surface a known loader.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What did the process that loaded the .cpl do — decode its full command line and working directory?
  context: The command line and working directory of the loading process reveal how the .cpl was invoked.
    control.exe and the native launchers (fondue.exe, hdwwiz.exe, fsquirt.exe) load their matching .cpl
    implicitly, so a launcher running from a user-writable directory with the malicious .cpl beside it is
    the side-loading pattern. The working directory matters — a launcher executing out of AppData, Public, or
    a staging folder rather than System32 is the load-order abuse this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the binary that loaded the .cpl, and is that parent chain expected?
  context: The parent process shows how the load was initiated. A launcher started by explorer.exe from a
    user double-click looks different from one started by mshta.exe, wscript.exe, an Office application, or
    a script host — parents that point to phishing-delivered execution or a malicious document. Walk up the
    tree from the immediate parent to see what set the chain in motion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this .cpl been loaded on this host before, and by which processes?
  context: A first-time load of this module on the host is a stronger anomaly than a recurring one. If the
    same .cpl has loaded repeatedly under the same process binary over the past 90 days, this load is
    probably routine. If this is the first occurrence, or the module has previously loaded only from the
    system path under different processes, the current load from a non-system location is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this .cpl being loaded on other hosts, and by which processes?
  context: Cross-host correlation surfaces the spread. The same-named .cpl loading from a non-system path on
    multiple hosts points to distribution through a shared delivery mechanism rather than a localized event.
    Pay attention to the variety of loading processes — a module loaded only by its expected system launcher
    on each host is routine, while the same module loaded by unexpected processes on other hosts suggests
    the technique is being reused.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were DLL load-order, Control Panel registration, or persistence registry keys modified on this
    host around the load?
  context: Control Panel-item side-loading is often stapled to a persistence or load-order change so the
    foothold survives a reboot. Registration of a Control Panel item, a Run-key entry, an AppInit_DLLs
    value, or a KnownDLLs modification in the same window as the anomalous .cpl load distinguishes a
    one-off proxy execution from a persisted foothold. Correlate any registry writes in this window against
    the load and the loading process.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\Control Panel\Cpls'
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the loaded .cpl still on disk for analysis?
  context: The .cpl file is the loaded module — if it or its supporting files remain on disk, deeper
    analysis becomes possible — hash lookups, sandbox submission, or content review. This surfaces files written
    by the loading process and its direct children so the analyst can locate the dropped module and any
    staged companions before they are cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in a tight window around the load
    reveals what led to it and what followed — reconnaissance, additional execution, privilege escalation,
    or persistence setup. Novel parent-child pairs stand out at low counts against the routine agent and
    system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access,
    or a delivery event — may reveal the stages that preceded this load and help reconstruct the timeline.
    A .cpl side-load is usually a mid-chain step, so preceding alerts often name how the attacker reached
    this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this activity?
  context: Some environments stage Control Panel launchers or their supporting files as part of a documented
    software deployment or driver-install task. A corresponding ticket or maintenance window suggests
    authorized activity; the absence of one where policy requires it points toward unauthorized execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall performing this action?
  context: Direct confirmation from the person behind the account is often the fastest legitimacy check. If
    no one recalls running the Control Panel item or its launcher from that location, the account may be
    compromised or the activity may be automated. If they do recall it, capture what they were trying to
    accomplish and why it ran from a non-system path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate Control Panel use and IT deployments typically fall within business hours or a
    scheduled maintenance window. The same load out of hours, on a server, or on a host whose local time
    makes interactive use unlikely raises the weight of the anomaly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Around a .cpl side-load, watch for
    backup footholds installed via different tooling — scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Several persistence installations in the same timeframe indicate intentional
    stacking rather than isolated administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable, script,
    or a launcher-and-.cpl pair into the Startup folder or a path referenced by a registry Run key achieves
    persistence without running schtasks, sc, or reg. File event monitoring captures these drops even when
    the attacker avoids standard persistence tooling.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
