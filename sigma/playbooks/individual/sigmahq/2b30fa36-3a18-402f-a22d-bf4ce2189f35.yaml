name: Potential Baby Shark Malware Activity
id: cdd8b70b-d8a5-492e-bb8c-b504ae634a8b
description: |
  Fires when a process command line carries one of several reconnaissance and staging one-liners associated with the
  BabyShark malware family: a "powershell.exe mshta.exe http" invocation that also references a .hta file, a reg query of
  the Terminal Server Client Default key, a "cmd.exe /c taskkill /im cmd.exe" self-restart used to re-trigger a Command
  Processor AutoRun value, or a "(New-Object System.Net.WebClient).UploadFile('http" call. Any one branch matching is
  enough for the rule to fire, and each branch is a generic technique on its own — mshta proxy execution of remotely
  hosted script content (T1218.005), registry-based environment discovery (T1012), command-shell scripting (T1059.003),
  and PowerShell HTTP upload (T1059.001) — so the pattern also matches tooling unrelated to that family.
  The investigation should establish which branch fired, decode what the command reads, fetches, or uploads, and
  determine whether the surrounding process, network, file, and registry activity forms a retrieval, discovery, staging,
  and upload sequence or an isolated administrative command.
type: detection
detection_id: 2b30fa36-3a18-402f-a22d-bf4ce2189f35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Which of the rule's command-line patterns fired — the mshta HTA fetch, the Terminal Server Client registry query,
    the cmd taskkill restart, or the WebClient upload?
  context: >-
    The rule matches on four independent command-line patterns, and the branch that fired sets the weight of everything
    downstream. An mshta/.hta fetch points at remote script retrieval, the reg query is a discovery step, the taskkill
    string is a restart trick that re-fires whatever a Command Processor AutoRun value holds, and the UploadFile call
    is an outbound file transfer. Read the full command line and record which branch matched before going further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: What does the command actually do — which URL does it contact, and which local file does it read or write?
  context: >-
    The patterns this rule matches are plain text rather than base64, so there is nothing to decode; the work is reading
    the cradle. A WebClient.UploadFile call names both a remote endpoint and the local file being sent, and an
    mshta invocation naming an http URL and a .hta file names the remote script that gets executed. Extract the URL, the
    local path, and any trailing del or cleanup commands, then check the endpoint's reputation and ownership.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content around this alert?
  context: >-
    Event ID 4104 records the script content PowerShell actually executed, including content assembled at runtime from a
    downloaded script rather than typed on the command line. For this pattern it is the fastest way to see the body of a
    fetched payload or the full upload cradle. If PowerShell operational logs are not ingested in this environment, treat
    zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Which modules did the alerting process load, and do they show a scripting or .NET engine being hosted?
  context: >-
    The rule matches on command-line text only, so the module list is what confirms which engine the process actually
    hosted. Loads of system.management.automation.dll or clr.dll from a process that is not powershell.exe indicate
    PowerShell hosted indirectly through .NET; vbscript.dll, jscript.dll, or mshtml.dll indicate HTA or script-host
    execution. Modules loaded from user-writable paths or carrying no signature deserve a closer look than the
    Microsoft-signed engine DLLs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command, and is this a normal pattern?
  context: >-
    A command prompt or script launched by explorer.exe generally reflects a person at the keyboard, and a management
    agent parent generally reflects automation. Office applications (winword.exe, excel.exe), script interpreters
    (wscript.exe, cscript.exe, mshta.exe), and wmiprvse.exe as parents indicate the command was driven by document
    content or by a remote execution path instead. The parent command line often carries the script path that supplied
    this one-liner.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: >-
    Is this user expected to query registry keys, fetch remote HTA content, or upload files with scripted HTTP calls
    from this host?
  context: >-
    Administrators and IT staff run reg query and scripted HTTP transfers for troubleshooting and deployment work;
    standard users rarely do. Establish the account's role and whether the host has a documented job that produces this
    command. A machine account or SYSTEM here means identity does not attribute the behavior and the launch mechanism
    is the better pivot.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The children reveal what the one-liner actually set in motion. Retrieval of remote script content typically continues
    into mshta.exe, wscript.exe, or powershell.exe; discovery continues into whoami, net, tasklist, or dir; staging for
    transfer often continues into certutil.exe for base64 encoding. A command with no children did less than its text
    implies and may have failed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did mshta.exe or another script host make outbound connections from this host around the alert, and to where?
  context: >-
    Remote HTA execution and scripted uploads both require an outbound connection, so the network side is where the
    command's text turns into observable transfer. Compare the destinations against the URL seen on the command line and
    against the host's normal egress. Connections from mshta.exe, wscript.exe, or certutil.exe to endpoints outside the
    organization are unusual regardless of which branch of the rule fired.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proxy:
        Image|endswith:
          - '\mshta.exe'
          - '\powershell.exe'
          - '\certutil.exe'
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection and selection_proxy
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Was script content written to disk on this host around the alert, and which process wrote it?
  context: >-
    Remotely fetched HTA and script payloads are frequently saved before execution, and collected discovery output is
    often written to a working file before transfer. Writes of .hta, .vbs, or .js content under user-writable
    directories such as %AppData% or %ProgramData%, produced by a script host or a command shell rather than by an
    installer, tie the command line to a file the analyst can retrieve and read. File writes carry no hash; to check
    reputation, pivot to a later execution of the written path.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.hta'
          - '.vbs'
          - '.js'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
- question: >-
    Were Office macro-trust settings, a Command Processor AutoRun value, or Run-key persistence written on this host
    around the alert?
  context: >-
    The registry query this rule can match on is a read, which leaves no modification event; the observable registry
    activity around it is the writes. A VBAWarnings value set to 1 lowers Office macro prompting, a Command Processor
    AutoRun value runs a command every time cmd.exe starts, and a Run key gives logon persistence. Any of these written
    by a script host or command shell in the same window converts a one-off command into an ongoing execution path.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Software\Microsoft\Command Processor\AutoRun'
          - '\Security\VBAWarnings'
          - '\CurrentVersion\Run'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Retrieval and upload cradles are often preceded by a step that removes the control that would stop them — an
    execution policy bypass flag, an AMSI patch, real-time monitoring turned off, or a downgrade to PowerShell v2 which
    lacks script block logging. Finding one of these in the hour before the alert connects the command to a prepared
    execution path rather than an ad-hoc one.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single registry query or a lone tasklist can be troubleshooting; the same commands arriving in a batch are
    scripted enumeration. The pattern this rule matches sits inside a fixed sequence in the family it is named for —
    account, host, network, and file enumeration run back to back and written to one file for transfer. Three or more
    distinct discovery binaries inside fifteen minutes, especially under one non-interactive parent, is the signal to
    weigh.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: >-
    When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects
    how these specific command-line patterns have run here rather than generic use of a shell. A parent that already
    accounts for most prior events is local automation. A parent or account appearing for the first time is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - powershell.exe mshta.exe http
        - .hta
      - CommandLine|contains:
        - reg query "HKEY_CURRENT_USER\Software\Microsoft\Terminal Server Client\Default"
        - cmd.exe /c taskkill /im cmd.exe
        - (New-Object System.Net.WebClient).UploadFile('http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is a 90-day history of these
    specific command-line patterns under this account, aggregated by host. An account that has never produced them is a
    different situation from one that produces them weekly on the same host. Weigh the count and host spread against the
    account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - powershell.exe mshta.exe http
        - .hta
      - CommandLine|contains:
        - reg query "HKEY_CURRENT_USER\Software\Microsoft\Terminal Server Client\Default"
        - cmd.exe /c taskkill /im cmd.exe
        - (New-Object System.Net.WebClient).UploadFile('http
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: >-
    When the alert fires under a service principal or a machine account, user identity does not attribute the behavior;
    the launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting parent process,
    giving the 90-day history of that parent producing these patterns. A parent already accounting for thousands of
    prior events is vendor or operating-system automation; a new or rare parent for this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - powershell.exe mshta.exe http
        - .hta
      - CommandLine|contains:
        - reg query "HKEY_CURRENT_USER\Software\Microsoft\Terminal Server Client\Default"
        - cmd.exe /c taskkill /im cmd.exe
        - (New-Object System.Net.WebClient).UploadFile('http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the command was one step of a
    wider session or an isolated event. The same account producing script-host and shell activity on several hosts at
    once points to remote execution rather than local work. When the alert fires under SYSTEM or a machine account,
    expect agent telemetry to dominate this result and rely on the parent-scoped view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
