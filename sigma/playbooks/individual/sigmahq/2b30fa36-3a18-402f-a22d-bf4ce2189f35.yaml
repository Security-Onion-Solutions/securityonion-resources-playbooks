  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host. The meaningful
    question is whether the same launch mechanism produced the rule's pattern elsewhere in the alert window. Several
    hosts at once points to scheduled or pushed automation; a single host points to a host-local trigger such as a
    document, a startup value, or an interactive session.
  range: +/-1h
