- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of these
    command-line patterns rather than generic shell usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation that can be confirmed and tuned. One host, or a small unrelated set, points to
    operator-driven activity and raises the value of the per-host timeline.
  range: -7d
