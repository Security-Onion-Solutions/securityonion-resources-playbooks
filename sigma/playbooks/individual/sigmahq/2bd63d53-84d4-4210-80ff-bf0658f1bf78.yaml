name: Pingback Backdoor File Indicators
id: b95cf5b6-a64f-43f0-ad5a-c563f1067c94
description: |
  Detects the Pingback backdoor's on-disk file indicator: a process named updata.exe writing oci.dll into the C:\Windows directory. Pingback is a Windows backdoor that gains execution through DLL search-order hijacking -- the hijacked oci.dll is loaded by the msdtc service, which the installer sets to start automatically for persistence -- and communicates with its command-and-control over an ICMP tunnel that opens no listening ports. Because the alert is the file write itself, the investigation should confirm the dropped DLL, identify the installer that wrote it and how it arrived, and trace the downstream service and DLL sideload that turn the file into running code.
type: detection
detection_id: 2bd63d53-84d4-4210-80ff-bf0658f1bf78
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert show updata.exe writing oci.dll into the C:\Windows directory?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path (C:\Windows\oci.dll), the operation performed, and the responsible process (updata.exe) against the rule's detection criteria. A legitimate oci.dll normally lives in the Windows system directory, so a fresh write of it there by a standalone installer is the DLL search-order hijack this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write oci.dll into the Windows directory?
  context: Legitimate placement of oci.dll (a database-client library) is done by vendor installers or sanctioned deployment tooling, not by a standalone updata.exe. Knowing whether the responsible process, user, and host role are consistent with authorized software deployment is often the fastest way to separate a real backdoor drop from a benign install. When the writer is a machine or service account, judge by the writing process and host function.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is oci.dll still on disk, or was it deleted or renamed after the alert?
  context: The dropped DLL's post-alert lifecycle drives next steps. A payload still on disk can be retrieved, hashed, and analyzed; a DLL deleted or swapped seconds after creation suggests anti-forensic cleanup or a staged replacement. Because this backdoor is loaded by a service at process start, the file usually persists on disk to survive reboots.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did updata.exe do when it ran -- decode its full command line and working directory.
  context: The file event names updata.exe as the writer but carries no command line. Pivoting to the process-creation events for updata.exe on this host reveals how the installer was invoked, what arguments it carried, and where it ran from. This installer stages oci.dll into the system directory and arms a service for persistence, so its arguments and working directory frame the intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched updata.exe, and what is the hash of the updata.exe that wrote oci.dll?
  context: The file event identifies updata.exe by its process GUID but not its parentage or hash. Its own process-creation event reveals the parent that spawned the dropper (a browser, script host, or archive tool points to an initial-access delivery), its command line, and its executable hash for reputation lookup. Establishing what delivered and ran the installer scopes the intrusion beyond the single dropped file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - Hashes
- question: Confirm the dropped oci.dll is the Pingback backdoor by checking its size, embedded strings, and signing status.
  context: This backdoor DLL carries recognizable static traits -- ICMP-tunneling command-and-control logic, a set of backdoor command strings (download, upload, exec, exep, rexec, shell), a cmd.exe reference, and it is unsigned. Retrieve the file from its on-disk path and inspect it in a safe environment; a legitimate oci.dll is a signed database-client library of a very different size. This confirms whether the drop is the real backdoor or a false-positive filename collision.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When oci.dll was loaded, which process loaded it, is the DLL signed, and what is its hash?
  context: Pingback achieves execution by having oci.dll loaded through DLL search-order hijacking -- the msdtc service resolves oci.dll from the Windows directory at startup and runs the backdoor inside a trusted service process. Module-load events record the loading process, the DLL's signature status, and its hash directly. A load of oci.dll by msdtc.exe (or another service binary) from C:\Windows, unsigned, is the sideload; submit the hash to threat intelligence to confirm, and compare the hash and signer against the known-good oci.dll baseline.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Was the msdtc service registry configuration modified around the time oci.dll was dropped?
  context: This backdoor's persistence pairs the hijacked oci.dll with the msdtc service set to start automatically, so the service loads the DLL on every boot. Registry modifications under the msdtc service key -- the Start value flipping to automatic, or an ImagePath or ServiceDll change -- around the drop time indicate the persistence was armed. Compare against the expected service configuration baseline; msdtc is normally demand-start.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\MSDTC'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other files did updata.exe write or delete around the time it dropped oci.dll?
  context: A dropper rarely writes a single file. The installer that stages oci.dll may also drop the backdoor's configuration, additional payloads, or the executable that first ran. Examining the full breadth of files written or deleted by updata.exe and its direct children distinguishes a lone artifact from a multi-component install and enumerates what else needs review and containment.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has recently been written into the Windows directory on this host, and by which processes?
  context: The DLL search-order hijack works because oci.dll is placed where a trusted process will resolve it. A small, known set of processes legitimately writes into the Windows system directory; other recent arrivals there -- especially executables and DLLs from non-system writers -- reveal whether this is an isolated drop or a location under active abuse, and surface sibling artifacts of the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user account previously produced this exact drop pattern, and does that fit their role?
  context: The query mirrors the rule's own selection -- updata.exe writing oci.dll into C:\Windows -- scoped to the alerting user and aggregated by host. A user who has never produced this specific pattern is far more suspicious than one who does so routinely (which would itself be unexpected for a backdoor artifact). Weigh any history against the user's role and normal software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: updata.exe
        TargetFilename: C:\Windows\oci.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this drop pattern here or across the environment, or is the program new for it?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior -- the launch mechanism does. This query mirrors the rule''s selection scoped to the alerting program, aggregated by host, showing the 90-day history of that program writing oci.dll via updata.exe. A new or rare program for this pattern is the deviation worth chasing; a program already accounting for many prior events would point to automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: updata.exe
        TargetFilename: C:\Windows\oci.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the alerting user's activity across all hosts in the alert window reveals whether the drop is isolated or part of broader movement. If the same account produced installer executions or file drops on multiple endpoints, the scope of compromise is larger than the single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: 'Under a service principal, cross-user activity is dominated by agent noise. The meaningful question is whether the same launch mechanism dropped oci.dll elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to pushed or scheduled deployment; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: updata.exe
        TargetFilename: C:\Windows\oci.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Does any administrator recall installing this software or running updata.exe on this host?
  context: Direct confirmation from the people who administer the host is often the fastest way to resolve a rare false positive. If no one recalls deploying software that would place oci.dll via updata.exe, the activity is most likely automated malware rather than a sanctioned install. If someone does recall it, capture what was being installed and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before oci.dll was dropped?
  context: A backdoor drop is usually preceded by earlier stages -- initial access, execution of the delivery binary, or defense tampering. Earlier detections on the same host help reconstruct how the dropper arrived and what ran before it, and may reveal the first-access vector.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host around the same time?
  context: This backdoor persists through a service and a hijacked DLL, but attackers commonly stack persistence. Files dropped into Startup folders or paths referenced by registry Run and RunOnce keys achieve persistence without invoking scheduling tools, and file monitoring captures those drops even when standard persistence utilities are avoided. Additional persistence installs from the same timeframe indicate intentional stacking.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Beyond the service-and-DLL hijack this backdoor uses, operators frequently add backup footholds with scheduled tasks, services, registry Run entries, or BITS jobs. Executions of persistence tools within the same window indicate deliberate stacking rather than isolated administrative action, and each mechanism needs its own removal.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
