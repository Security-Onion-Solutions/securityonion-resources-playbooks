name: IcedID Malware Suspicious Single Digit DLL Execution Via Rundll32
id: 6faea3bb-1687-41d5-87a5-6b0a48b055a6
description: |
  Detects rundll32.exe executing a DLL with a single-digit filename (1.dll) and the export function
  DllRegisterServer. Both conditions must hold together: the image ends in \rundll32.exe AND the command
  line ends with a single-digit DLL name followed by the DllRegisterServer export. Loader families
  routinely stage a payload DLL under a short throwaway name in a writable directory and invoke it through
  rundll32.exe so that execution is proxied by a signed Microsoft binary (T1218.011); DllRegisterServer is
  a real COM registration export, so the invocation looks like ordinary component registration while the
  DLL is arbitrary code. Legitimate installers do register components this way, but they use vendor
  installer parents and DLLs under Program Files or System32 rather than one-character names in temp or
  profile directories. The investigation should establish which DLL path was passed, where that file came
  from and which process wrote it, what the parent chain was, and whether execution was followed by child
  processes or outbound connections.
type: detection
detection_id: 2bd8e100-5b3b-4b6a-bbb5-b129d3ddddc5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line end with a single-digit DLL name followed by the DllRegisterServer export?
  context: >-
    Confirm the alert before investing time. The rule requires both halves together: the image must end in
    \rundll32.exe and the command line must end with `1.dll, DllRegisterServer` (with either a backslash or
    a space before the digit). Read the exact command line and note the full DLL path that precedes the
    export name, since that path drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register COM components from the command line with rundll32.exe?
  context: >-
    Legitimate component registration is normally performed by vendor installers and update services, not
    by an interactive user typing rundll32.exe. A build server, a software packaging workstation, or a host
    running a known deployment tool can produce this legitimately. Knowing whether the account and the host
    function fit that description is often the fastest way to separate routine software installation from
    payload execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What DLL path was passed to rundll32.exe, and does that path sit in a user-writable directory?
  context: >-
    The command line carries the operative detail the alert name does not: the fully qualified path of the
    DLL. A DLL under \Users\<name>\AppData\, \Users\Public\, \Windows\Temp\, \ProgramData\, or the current
    working directory is user-writable and is where staged payloads normally land; a DLL under
    \Program Files\ or \Windows\System32\ points at software registration. The window also surfaces any
    other rundll32.exe invocations around the alert, which for a loader often means the same DLL being run
    more than once or a second DLL being run in sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which DLLs did the alerting rundll32.exe process actually map into memory, and are they signed?
  context: >-
    Proxy execution through a signed binary means the host process is trusted but the loaded module is not.
    The module-load events for this process identify the DLL that was mapped, its signer, and its hash, and
    a module load from a writable directory with no signature or an unverified signature is the concrete
    evidence that the DLL is not a registered system component. The hash is present on the load event and
    can be checked against reputation sources directly. If module-load telemetry is not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Was the single-digit DLL written to this host shortly before it was executed, and by what process?
  context: >-
    A payload DLL has to arrive before it can be run. File-write events for a DLL with this filename on this
    host identify the writing process, which is usually the more interesting artifact than the execution
    itself: a browser or mail client points at a download, a script host or Office application points at a
    macro or script dropper, and a remote-execution service account points at lateral movement onto this
    host. Pivot from the writing process by its process identifier to reconstruct how it was launched.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\1.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
  answer_sources:
  - file_event
- question: What process spawned this rundll32.exe, and is that parent a plausible launcher for component registration?
  context: >-
    The parent identifies the launch mechanism. Vendor installers, msiexec.exe, and service hosts are
    plausible parents for a genuine DllRegisterServer call. Command shells, script hosts such as wscript.exe
    or mshta.exe, Office applications, and archive or ISO mount handlers are not, and are the parents
    associated with document-delivered and script-delivered loaders. Note what the parent's own command line
    was and what else it started.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did rundll32.exe spawn on this host after the alert?
  context: >-
    A DLL run through rundll32.exe inherits the process, so anything it starts appears as a child of
    rundll32.exe. Component registration spawns nothing. Loaders commonly spawn cmd.exe or powershell.exe
    for discovery, or a second stage from a writable path. An absence of children does not clear the event,
    since code can run inside rundll32.exe or be injected into another process instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did rundll32.exe make outbound network connections from this host after the alert, and to what destinations?
  context: >-
    rundll32.exe registering a local component has no reason to talk to the internet. A DLL executed through
    it that immediately connects outbound is retrieving a next stage or checking in to an operator-controlled
    endpoint. Judge the destinations against what is normal egress for this environment: connections to
    addresses outside the organization's own ranges and its known vendor and update infrastructure are the
    ones to pursue, and repeated connections on a fixed interval to one destination indicate a beaconing
    implant rather than a one-off fetch.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - ProcessGuid
  answer_sources:
  - network_connection
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Correlating the rundll32.exe invocation with the surrounding process activity in a short window is what
    turns a single execution into a sequence. Look at the low-count parent-child pairs rather than the
    high-count rows, which are agent and operating-system telemetry. Discovery commands, credential access
    tooling, or archiving utilities appearing in the same window place this execution inside a
    hands-on-keyboard operation rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- always_include: true
  question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window reveals whether the same identity was
    active elsewhere, which is what distinguishes a single infected endpoint from movement across the estate.
    If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a computer account, this count is
    dominated by routine service telemetry and answers nothing on its own; use the parent-scoped view of the
    same window instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, user-scoped counts return service telemetry rather than an answer. The
    meaningful pivot is the launch mechanism, so this query mirrors the rule's selection scoped to the
    alerting parent process across the whole environment in the alert window. Several hosts in the same
    window points to pushed or scheduled automation; a single host points to a host-local trigger such as a
    document or a dropped script.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|endswith:
        - \1.dll, DllRegisterServer
        - ' 1.dll, DllRegisterServer'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Over the past 90 days, has rundll32.exe on this host routinely executed DLLs from user-writable directories?
  context: >-
    rundll32.exe itself runs constantly on every Windows host, so its raw count says nothing. What matters
    is whether this host has a history of rundll32.exe being pointed at DLLs under AppData, Public, Temp, or
    ProgramData. A host where that is routine has a local application or deployment tool with that habit and
    the alert needs to be judged against it; a host where the count is zero or near zero makes the alerting
    invocation a first-of-its-kind event. Review the returned command lines for DLL names and calling
    conventions that resemble the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_writable_dir:
        CommandLine|contains:
        - '\AppData\'
        - '\Users\Public\'
        - '\Windows\Temp\'
        - '\ProgramData\'
        - '\Temp\'
      condition: selection and selection_writable_dir
    fields:
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: >-
    This mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how
    this exact invocation pattern has run here over the past two weeks rather than generic rundll32.exe
    usage. A recurring parent and user pair suggests a local application whose behaviour matches the rule; a
    parent or account that has never produced this pattern before is the deviation worth chasing. Zero prior
    hits means the pattern is new to this host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|endswith:
        - \1.dll, DllRegisterServer
        - ' 1.dll, DllRegisterServer'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user account previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's selection scoped to the alerting account, so the result is that account's 90-day
    history of this specific invocation pattern broken out by host, not its generic use of rundll32.exe. An
    account that has never produced this pattern carries more weight than one that produces it on a schedule.
    Weigh the count and the host spread against the account's role: a packaging or deployment account with a
    history across many hosts reads differently from an ordinary user account with a single hit.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|endswith:
        - \1.dll, DllRegisterServer
        - ' 1.dll, DllRegisterServer'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal the account does not attribute the behaviour, so the
    launch mechanism is the pivot that does. This mirrors the rule's selection scoped to the alerting parent
    process across 90 days and aggregates by host. A parent already accounting for many prior events across
    many hosts is an installer or management agent whose registration behaviour matches the rule; a parent
    that is new to this pattern is the deviation. Compare the answer with the user-scoped history rather than
    substituting one for the other.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|endswith:
        - \1.dll, DllRegisterServer
        - ' 1.dll, DllRegisterServer'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This mirrors the rule's selection with no host scope, so the result is an environment-wide count of this
    exact invocation pattern rather than the binary's general footprint. Many hosts with consistent parents
    points to a packaged application or deployment job that registers a component this way and is a tuning
    candidate. One host, or a small unrelated set such as a workstation and a domain controller, points to
    operator activity, since staging the same short-named DLL onto additional hosts and running it through
    rundll32.exe is a common way of executing a payload after lateral movement.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \rundll32.exe
        CommandLine|endswith:
        - \1.dll, DllRegisterServer
        - ' 1.dll, DllRegisterServer'
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Loader execution sits in the middle of a sequence, not at its start. Earlier detections on the same host
    covering document or script execution, renamed system utilities, or scheduled task creation identify how
    the payload arrived and whether it was made persistent. Detections after this point covering credential
    access, discovery, or remote execution indicate the operation progressed past the loader stage.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
