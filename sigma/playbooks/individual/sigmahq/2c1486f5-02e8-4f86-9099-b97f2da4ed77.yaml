name: Insecure Proxy/DOH Transfer Via Curl.EXE
id: 4ebcfd55-f93e-4ce4-a57b-6b9a8d4b1810
description: |
  Detects curl.exe executed with a flag that skips TLS verification on the proxy CONNECT or DoH path
  (--proxy-insecure or --doh-insecure). The rule fires when the process is curl.exe (by Image name or
  OriginalFileName) AND the command line contains one of those insecure-transfer flags. Skipping
  certificate verification lets a transfer succeed against a proxy or DoH resolver presenting an
  untrusted certificate, which can mask man-in-the-middle interception or attacker-controlled
  infrastructure; --doh-insecure additionally routes DNS resolution over HTTPS, bypassing local DNS
  logging. Legitimate use is largely limited to badly maintained internal or development systems with
  self-signed certificates. The investigation should determine what was transferred, where it went,
  what invoked curl, and whether the same insecure pattern recurs on this host or across the fleet.
type: detection
detection_id: 2c1486f5-02e8-4f86-9099-b97f2da4ed77
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show curl.exe run with --proxy-insecure or --doh-insecure?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when the process is curl.exe (by Image name or OriginalFileName) AND the command line contains
    --proxy-insecure or --doh-insecure. Review the exact command line and confirm both conditions hold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run command-line transfer tools with TLS verification disabled?
  context: Legitimate use of these flags is mostly confined to development or internal systems with
    self-signed certificates. Knowing whether this user's role and the host's function involve scripted
    transfers, build tooling, or testing against internal endpoints is often the fastest way to separate
    routine work from suspicious activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this curl invocation actually transfer, and to where? Decode the full command line.
  context: The full command line reveals the destination URL, proxy or DoH resolver, HTTP method, and any
    upload or output options. Look for -x/--proxy and SOCKS targets, --doh-url, -o/-O/-T file paths,
    -d/--data POST bodies, -L redirect following, and spoofed -A/-H headers. Together with the
    --proxy-insecure or --doh-insecure flag, these reveal whether this is a download, an upload, or a DNS
    redirection through an untrusted endpoint. The host+binary scope captures any sequential curl
    invocations on this host within the window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned curl.exe, and is that parent chain expected?
  context: The parent process reveals how curl was invoked. A scripted transfer launched from a build
    agent, scheduler, or interactive shell looks different from one spawned by a script host (wscript,
    mshta), an Office application, or an unsigned binary in a user-writable path. Walk up the tree to see
    what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did curl.exe spawn afterward?
  context: The processes spawned after a transfer reveal its impact. A downloaded payload being executed,
    or a follow-on cmd.exe, powershell.exe, or certutil.exe, points to post-transfer execution rather than
    a benign file fetch.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run curl.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly.
    Zero or very low historical counts indicate first-time or rare execution of curl on this endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's insecure-transfer pattern, what parents and
    users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how the insecure-transfer pattern (not
    generic curl usage) has historically run here. A new parent process, an unexpected user account, or an
    unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the
    activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this transfer, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, persistence, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, credential access - may reveal the attack stages that preceded this transfer and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one transfer LOLBin often use several. If curl was used to fetch or push a
    file insecurely, check whether certutil, bitsadmin, or other built-in download utilities were also
    used around the same time. Finding multiple transfer LOLBins performing the same action strengthens
    the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was curl.exe executed from an expected path?
  context: curl.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or
    renamed to evade path-based allowlists or to ship a specific version. A curl.exe running from a user's
    temp or download directory is more suspicious than one in System32. OriginalFileName confirms the true
    identity even if the on-disk name was changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the curl insecure-transfer pattern over the past 90 days, and
    what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects the insecure-transfer pattern specifically (not generic curl usage). The CommandLine
    projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the curl insecure-transfer pattern in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the insecure-transfer pattern (not generic curl usage). Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
        CommandLine|contains:
        - --doh-insecure
        - --proxy-insecure
      condition: all of selection_*
    fields:
    - host.name
