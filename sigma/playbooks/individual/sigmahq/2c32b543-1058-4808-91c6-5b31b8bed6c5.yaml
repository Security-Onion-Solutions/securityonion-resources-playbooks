name: PUA - Crassus Execution
id: 1a3289a1-65ff-4482-9841-d141c2cb4986
description: |
  Detects execution of Crassus, an offensive-security tool that parses Process Monitor boot logs to discover Windows
  privilege-escalation opportunities (weak file/directory ACLs on privileged processes) and auto-generates proxy-DLL
  source for DLL hijacking. The rule fires when a process matches any of the tool's identity signals: an image path ending
  in Crassus.exe, an OriginalFileName of Crassus.exe, or a Description containing Crassus. Legitimate appearances are limited
  to sanctioned penetration tests or red-team engagements; outside an authorized engagement this tool's presence points to
  hands-on privilege-escalation discovery, and the investigation should determine who ran it, what it parsed, and what
  DLL-hijack or installer-permission weaknesses it may have surfaced for follow-on abuse.
type: detection
detection_id: 2c32b543-1058-4808-91c6-5b31b8bed6c5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match Crassus by image name, OriginalFileName, or Description?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the triggering event. The
    rule matches on any one of three identity signals — an image path ending in Crassus.exe, an OriginalFileName of Crassus.exe,
    or a Description containing Crassus — so note which signal carries the value (a renamed or copied binary may match only
    on OriginalFileName or Description, not the on-disk name).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
- question: Is this user and host expected to run a privilege-escalation discovery tool?
  context: Legitimate Crassus execution is confined to sanctioned security testing. Knowing whether the user role (pentester,
    red-teamer, security engineer) and host function (test bench, lab endpoint) are consistent with running an offensive
    privesc-discovery tool is often the fastest path to distinguishing an authorized engagement from unexpected operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is Crassus on the organization's approved software list for this host?
  context: Organizations typically sanction offensive-security tooling only for named testers on designated hosts during a
    scheduled engagement. Crassus appearing outside that approval — on a production endpoint, under a non-tester account, or
    with no engagement on the books — points to shadow use or operator-deployed tooling regardless of how well-known the tool
    is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an authorized penetration test or red-team engagement that explains this execution?
  context: Legitimate use of a privilege-escalation discovery tool correlates with an active, scheduled engagement and a named
    operator. If no engagement record, change ticket, or approval covers this host and timeframe, the tool may have been
    deployed by an attacker performing hands-on privesc reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did Crassus do? Decode its command-line arguments and identify the boot-log target.
  context: The full command line reveals the specific action taken. Crassus is invoked as crassus.exe <PMLFILE> with optional
    --verbose / --debug flags; the PML path identifies which Process Monitor boot log was parsed for privesc opportunities,
    and the working directory is where it writes results.csv and a stubs\ folder of generated proxy-DLL source. Decode the
    arguments to learn what was analyzed and where its output landed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession
    — whoami, ipconfig, net user, systeminfo, tasklist — is a signature pattern of post-compromise enumeration. An operator
    discovering privesc paths often pairs that work with native host and account enumeration to understand their context before
    escalating.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned Crassus, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. An interactive shell under explorer.exe suggests a hands-on
    operator at the keyboard; script interpreters (wscript.exe, cscript.exe, mshta.exe, powershell.exe download cradles),
    Office applications, or remote-execution parents (wmiprvse.exe, wsmprovhost.exe) suggest automated or remote deployment
    rather than a person running a test locally.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What spawned the parent process, and what else did that parent launch?
  context: The immediate parent is visible in the alert; walking one level up shows the broader launch context. A parent that
    is itself a long-running interactive shell or a remote-execution host, and that also spawned other tooling, reframes a
    single tool execution as part of a hands-on session. Long-running parents frequently start hours or days before the alert,
    so this lookup uses a wide window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run Crassus?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. For an offensive
    privesc-discovery tool, any prior history at all is unusual outside a recurring test environment; zero or very low
    historical counts indicate first-time execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously matched the rule's pattern, what parents and users drove it, and does the current alert
    fit?
  context: Even tools with some local history can be abused. The query mirrors the rule's selection structure scoped to this
    host — the resulting parent/user distribution reflects how this specific firing pattern (not generic binary usage) has
    run here before. A new parent process, an unexpected user account, or an unusual launch pattern is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Crassus.exe
      - OriginalFileName: Crassus.exe
      - Description|contains: Crassus
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did Crassus spawn afterward?
  context: The processes a tool spawns reveal its actual impact. Crassus itself parses logs offline and writes source files,
    so it should spawn little to nothing; child processes such as cmd.exe, powershell.exe, a compiler (cl.exe, mingw g++),
    or certutil.exe would indicate the operator moved from discovery to weaponizing a proxy DLL or staging payloads.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Privilege-escalation discovery is one stage of a longer operation. Activity surrounding this execution may reveal
    the Process Monitor capture that produced the boot log, compilation of proxy DLLs, file writes into weak-ACL directories,
    or other tooling that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host spread look like automation
    or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern rather than generic binary usage. Many hosts matching the same pattern points to a scripted or
    pushed deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Crassus.exe
      - OriginalFileName: Crassus.exe
      - Description|contains: Crassus
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Crassus.exe
      - OriginalFileName: Crassus.exe
      - Description|contains: Crassus
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Crassus.exe
      - OriginalFileName: Crassus.exe
      - Description|contains: Crassus
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user ran similar discovery or escalation activity on other hosts, the scope of the operation may be larger
    than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Crassus.exe
      - OriginalFileName: Crassus.exe
      - Description|contains: Crassus
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential access, or
    other discovery activity — may reveal the attack stages that preceded this execution and help reconstruct the timeline
    leading up to privilege-escalation reconnaissance.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
