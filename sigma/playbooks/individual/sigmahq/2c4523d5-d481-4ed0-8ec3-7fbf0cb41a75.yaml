name: Driver Load From A Temporary Directory
id: 8303d2a7-b5ed-4aa9-8e85-b853c82626c7
description: |
  Detects a kernel driver loading from a file path containing \Temp\. A driver reaches kernel memory
  through a service entry, and the file it points at normally lives under \Windows\System32\drivers or
  a vendor's installation directory; a temporary directory is a staging location, not an installation
  location. Installers, hardware setup routines, and some deployment agents do stage and load drivers
  from a temporary path, so the load on its own is not a finding and the false-positive rate depends on
  what software the environment runs. The same pattern also covers a driver brought to a host for a
  single use — vulnerable signed drivers loaded to disable security tooling, or an unsigned component
  loaded on a host where signature enforcement is off. The investigation should determine what the
  driver is, whether it is signed and by whom, which process wrote it to the temporary directory and
  which registered it as a service, and whether the load fits an installation already under way on this
  host.
type: detection
detection_id: 2c4523d5-d481-4ed0-8ec3-7fbf0cb41a75
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did the driver load from a path containing \Temp\, and what is the full path?
  context: The rule matches on the loaded driver's path alone, with no constraint on the driver name,
    signer, or loading process. Read the full path and note which temporary directory it is — a per-user
    \AppData\Local\Temp\ path, the system-wide \Windows\Temp\, or an application's own temp folder each
    point at a different origin. An installer's own extraction directory reads differently from a driver
    dropped into \Windows\Temp\ by an unrelated process.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
        ImageLoaded|contains: '\Temp\'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and user expected to install software or hardware that loads a kernel driver?
  context: Driver installation is tied to a small set of activities — setting up hardware, installing an
    endpoint agent or virtualization product, applying a vendor update package. A host in the middle of
    a software rollout, or an engineering workstation whose owner installs their own tooling, fits the
    load. The same load on a locked-down endpoint or a production server with no maintenance under way
    is worth resolving. The account's role and the host's function are usually the fastest route to that
    distinction.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was this driver or service deployment covered by a change ticket, maintenance window, or
    documented approval?
  context: Driver and service installation is a system modification that most organizations put behind a
    change record, and vendor installers that stage drivers to a temporary path usually run as part of a
    planned rollout. A ticket covering this host and this window largely closes the question. No record,
    on a host nobody was working on, leaves the driver's origin as the open item rather than settling it.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What driver loaded from the temporary directory, is it signed, and which process triggered
    the load?
  context: The signer is the first discriminator. A driver signed by a hardware or software vendor whose
    product is installed here fits an installation staging its component before copying it into place. An
    unsigned driver, or one with an expired, revoked, or invalid signature status, only loads where
    signature enforcement is off or bypassed and needs the origin questions answered. A valid signature
    from a vendor with no presence on this host is its own case — signed drivers with known kernel
    primitives are loaded from staging paths precisely because the signature carries them past
    enforcement. Read the loading process alongside the signer.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Does the driver file's hash match a known legitimate driver, and which process loaded it?
  context: The driver load event carries the file's hash directly, so a reputation lookup is available
    without retrieving the file. A hash matching a published vendor driver build points at real software;
    a hash with no reputation, or one matching a driver known for exposed kernel read/write or process
    termination primitives, changes what the temporary path means. Pair the hash with the loading process
    — a driver loaded by the service control manager on behalf of a registered service reads differently
    from one loaded by an ad-hoc process.
  range: +/-15m
  answer_sources:
  - file_event
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Which process wrote the driver file into the temporary directory, and when?
  context: The writer names the origin. An installer, a vendor setup routine, or a software deployment
    agent writing the driver minutes before the load fits an installation in progress. A browser, an
    archive utility, a script host, a remote-management agent, or an unfamiliar binary as the writer
    points at a file brought to the host for this load. A driver written days before it loaded is a
    different situation again — the file sat staged until something chose to use it. File writes carry no
    hash, so take the writing process, path, and timing here and read signature and hash data from the
    load event.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
        TargetFilename|contains: '\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: What process triggered the driver load, and what spawned it?
  context: The acting process is named in the alert but its origin is not. Retrieving that process's own
    start event names the parent that launched it. services.exe or a vendor installer as parent fits a
    registered service or a setup routine loading its own component; explorer.exe or a console fits a
    person running an installer by hand. A script host, an Office application, a remote-management agent,
    or an unfamiliar binary driving service management is the case to resolve — service creation from a
    non-administrative process is a recognized route to loading a driver as a capability rather than as
    software. The long window is intentional, since service and shell parents often start well before the
    load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What service was installed on this host around the driver load, and what image path and start
    type did it register?
  context: A kernel driver reaches memory through a service entry, so a service installation recorded in
    the same window usually names the driver file, the service name it was registered under, and the
    account that registered it. Compare the registered image path against the temporary path from the
    alert — a service pointing straight at the temp copy, rather than at a driver relocated into the
    system driver directory, means the staging path became the permanent one. A start type that survives
    reboot on a driver in a temporary directory is worth resolving, since temporary directories are
    cleaned.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Does the Security log record a service installation on this host around the driver load, and
    which account performed it?
  context: Service-installation auditing records the registering account, which the system-log service
    entry does not. Whether the driver was registered by an installer running under a logged-on
    administrator, by a machine account, or by SYSTEM on behalf of a deployment agent changes what the
    temporary path means. An account with no administrative duty registering a driver service is the
    result to pursue. Service-installation auditing is not enabled in every environment, so no results
    here is a visibility gap rather than evidence no service was created.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: What service registry entries were written on this host around the driver load, and do any
    point at the temporary path?
  context: Driver services are configured under HKLM\System\CurrentControlSet\Services, where the subkey
    name is the service name and the ImagePath value names the driver file. Reading these writes shows
    what name the driver was registered under, what start type it was given, and which process wrote the
    entries. An ImagePath left pointing into a temporary directory, a start type set to load at boot, or
    a service key written by a process unrelated to any installer are the results to pursue; a key
    written by a vendor setup routine and then rewritten to a system driver path fits installation.
    Correlate the write timing against the load — a Start value changed within hours of the load ties the
    two together. Key deletion is not recorded, so cleanup shows up as later rewrites of the same key
    rather than as a removal event.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the driver still loaded and its service still registered, and under what account does it
    run?
  context: A driver may have been loaded once and unloaded, or its service may remain registered and set
    to load again at boot. Checking the current state on the host — whether the service entry still
    exists, what its start type is, whether the file is still in the temporary directory, and whether the
    driver is presently loaded — separates a completed installation from an entry left in place. Query
    the service by the name recorded in the service-installation events, and check whether the driver file
    still exists at the alerting path.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this driver loaded on this host before, and under what processes?
  context: A driver that has loaded repeatedly on this host over the past ninety days fits installed
    software whose component happens to live in a staging path. A first or near-first load moves the
    origin questions to the front. Note the loading processes too — a consistent loader across the
    history and a new one for this event are different situations, and a driver that used to load from an
    installation directory but loaded from a temporary path this time is worth resolving.
  range: -90d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this driver loading on other hosts in the environment?
  context: Cross-host distribution separates a local installation from a deployment. The driver on a set
    of hosts that share a hardware model or a software package fits a managed rollout, and the temporary
    path is then the installer's staging directory. The same driver appearing on unrelated hosts, or on
    hosts with no reason to run the associated product, points at distribution by something other than
    software installation and widens the investigation to those hosts. Hosts not reporting driver load
    telemetry are absent from this result regardless of what loaded on them.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Activity surrounding the load supplies the immediate context — what preceded it and what
    followed. An installer unpacking, a setup routine running, and a vendor updater in the same window
    corroborate an installation. Security service or agent processes stopping, credential-access tooling,
    or archive and transfer utilities in the same window point the other way. Repetitive agent telemetry
    collapses into single high-count rows, so novel parent-child pairs stand out at low counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections help reconstruct what preceded the load. Defense tampering, credential
    access, or remote-management activity ahead of a driver loaded from a staging path places the load in
    a sequence rather than on its own. Nothing before it, on a host with an installation under way, points
    the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or administrator recall installing software or hardware on this host?
  context: Direct confirmation from the person behind the account is often the fastest path to a verdict.
    If they recall it, ask what product they were installing and where the installer came from — a
    download from a vendor site and a package handed over by someone else are different answers. If
    nobody recalls any installation, the driver's origin becomes the open item — what wrote the file and
    what registered the service.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this driver load align with normal work hours or a maintenance window?
  context: Installation work tracks the working hours of the person or the schedule of the deployment
    system doing it. A driver load on an unattended host, outside any maintenance window, or at a time
    nobody was logged on fits a load driven by something running without an operator. Check the host's
    local time rather than the console's, and account for deployment systems that intentionally patch
    overnight.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the driver load?
  context: A driver registered as a service is one persistence mechanism; where the driver was placed
    deliberately, others are commonly added alongside it. This surfaces scheduled tasks, service creation,
    registry writes, and transfer jobs configured on the host within four hours of the load. Several
    mechanisms installed in one window points to intentional stacking; a single sc.exe invocation
    registering the driver's own service fits an installation performed by hand.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
