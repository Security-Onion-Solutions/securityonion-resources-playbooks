name: Raspberry Robin Initial Execution From External Drive
id: d463c186-bc6a-4fa3-b208-56b7b68480e4
description: |
  Detects an msiexec.exe process carrying both a quiet-install switch and an http(s) URL on its
  command line, spawned by a cmd.exe parent whose own command line contains /r and ends in a file
  with a .bin, .ico, .lnk, .lo, .sv, or .usb extension. All three conditions must hold together.
  This structure matches the initial execution stage of the Raspberry Robin worm, which spreads on
  removable drives: a shortcut on an inserted drive runs cmd.exe to read a small randomly named
  file, and that shell launches msiexec.exe to fetch and install a remote package. Removable-media
  autorun-style execution has legitimate analogues — IT provisioning or vendor installer media that
  stages an installer from a USB drive — so the investigation should determine whether the drive,
  the referenced file, and the download URL are known and authorized, and whether the msiexec child
  went on to load a module, write a payload, or launch further binaries.
type: detection
detection_id: 2c6bea3a-ef58-4f2e-a775-4928f6b7c58a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the msiexec.exe command line carry a quiet switch and an http(s) URL, and did a cmd.exe
    parent using /r on an external-drive-style file launch it?
  context: >-
    Before investing investigation time, confirm all three parts of the trigger are present in the
    event. The parent must be cmd.exe with /r in its command line and a trailing .bin, .ico, .lnk,
    .lo, .sv, or .usb file; the child must be msiexec.exe with /q or -q; and the child command line
    must contain http: or https:. The rule requires all three together, so record the drive letter
    of the file the shell read and the full URL msiexec was pointed at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to install software from an external drive using msiexec.exe?
  context: >-
    Software installed from a removable drive rather than a management share or a vendor download
    path is unusual on a managed endpoint but routine on build benches, field-service laptops, and
    provisioning stations. Establishing the host's role and whether the user handles installer media
    is often the fastest way to separate a provisioning workflow from worm execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is cmd.exe expected to spawn msiexec.exe here, and what started the cmd.exe parent?
  context: >-
    The grandparent tells you how the shell was invoked. An explorer.exe grandparent means a user
    opened a shortcut or a file, which is the removable-media entry path this rule targets; a
    management agent, installer, or scheduled task grandparent points to provisioning. The parent's
    own command line also names the file it read with /r, including the drive it lived on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same cmd.exe instance spawn?
  context: >-
    This family's initial execution stage launches explorer.exe alongside msiexec.exe from the same
    short-lived shell, often with mixed-case binary names and an argument naming the drive or the
    shortcut. Enumerating every child of that one cmd.exe instance shows whether the shell drove a
    single install or a multi-stage sequence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What exactly did msiexec.exe do? Read the full command line and the directory it ran from.
  context: >-
    The command line names the remote package msiexec was told to install and the switches that
    suppress its interface. Record the URL host, port, and path, and note whether the working
    directory sits on the same drive the parent shell read from. This query returns every msiexec
    execution on the host in the window, so a second install invocation in the same minutes is
    visible here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the command line obfuscated, and what does the URL it carries resolve to?
  context: >-
    The command is already readable, so the analytical task is the fetch target rather than a decode.
    This stage typically uses mixed-case spelling of the binary and switches, a short recently
    registered domain, a non-standard HTTP port such as 8080, and a URL path built from random
    characters followed by the victim hostname and username. Resolve the domain, check its
    registration age and reputation, and note whether the path embeds local identifiers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - external_threat_intel
- question: What modules did msiexec.exe load on this host around the alert, and were any unsigned or loaded from a user-writable path?
  context: >-
    The install stage of this family drops a DLL into the installer cache or a temp directory and
    then loads it, so the module list is where a downloaded payload first becomes visible. msiexec
    normally loads Microsoft-signed installer components from system directories; a module under a
    temp path, with a random name or a non-standard extension, or with a missing or invalid
    signature, is the rare load worth chasing. Record its path for the execution pivot that carries
    the hash.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: After the msiexec execution, did fodhelper.exe, odbcconf.exe, rundll32.exe, regsvr32.exe, or dllhost.exe run on this host?
  context: >-
    The stage following the download in this family is a UAC bypass through fodhelper.exe, which runs
    at high integrity without a prompt, then rundll32.exe invoking odbcconf.exe with a regsvr action
    to load the installed DLL while sidestepping application control. The later command-and-control
    processes run with empty command lines. Any of these binaries with an fodhelper.exe parent or no
    arguments at all is the follow-on stage to confirm.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \fodhelper.exe
          - \odbcconf.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \dllhost.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did msiexec.exe actually connect out, and to what address and port?
  context: >-
    The command line states an intended fetch target but not whether the transfer happened. A
    completed egress connection means a remote package was likely retrieved and the execution moved
    past the download step. Non-standard HTTP ports such as 8080 fit this stage's pattern; compare
    the destination address against the URL host seen on the command line, and check whether the
    address belongs to internal software distribution infrastructure.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What files did the alerting msiexec.exe process write to disk?
  context: >-
    A package fetched over HTTP lands on disk before anything loads it. In this family the payload
    appears as a DLL in the installer cache under a temporary MSI-prefixed name, and sometimes as a
    second copy under the user's temp directory with a random name and a non-standard extension.
    Record the exact paths. File writes carry no hash, so the recorded path is the pivot to a later
    load or execution event where the hash is available for reputation lookup.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: Has this host previously run msiexec.exe with an http(s) URL on the command line?
  context: >-
    msiexec.exe runs constantly on a managed endpoint, so raw execution counts carry no signal.
    Installing from a URL rather than a local path or a distribution share is the rare form, and this
    90-day count isolates it. Zero or near-zero means the invocation style is new to the host; a
    steady count grouped under a service or deployment account points to an established software
    distribution workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'http:'
          - 'https:'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Does cmd.exe normally spawn msiexec.exe on this host?
  context: >-
    Scripted installs and login scripts do launch msiexec from a shell, so this pairing is not
    inherently rare on every host. The 90-day count tells you which side of that line this endpoint
    sits on, and the returned command lines show whether prior shell-driven installs pointed at local
    paths and internal shares rather than external URLs.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this specific shell-to-quiet-msiexec-with-URL pattern rather than generic use
    of msiexec, aggregated by host. A user who has never produced this pattern warrants more scrutiny
    than one who does so regularly; weigh the count against whether their role involves installer
    media or software packaging.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains: /r
        ParentCommandLine|endswith:
        - .bin
        - .ico
        - .lnk
        - .lo
        - .sv
        - .usb
      selection_child_img:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: /q
      selection_child_http:
        CommandLine|contains:
        - 'http:'
        - 'https:'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior, and
    the meaningful pivot becomes the launch mechanism. This query mirrors the rule's selection
    structure scoped to the alerting parent process, so the result is the 90-day history of this
    parent driving this specific pattern. A new or rare parent for this pattern is the deviation
    worth chasing; a parent already accounting for thousands of prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains: /r
        ParentCommandLine|endswith:
        - .bin
        - .ico
        - .lnk
        - .lo
        - .sv
        - .usb
      selection_child_img:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: /q
      selection_child_http:
        CommandLine|contains:
        - 'http:'
        - 'https:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    A worm that spreads on removable drives moves when the drive moves, so the same account touching
    several endpoints in the same window is the pattern to look for. Tracking the user's activity
    across all hosts also reveals whether the install was one step in a wider session of manual
    administration. If the alert fired under a machine or service account, expect this view to return
    routine background telemetry.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns background agent telemetry from
    every host. The meaningful question is whether the same launch mechanism fired elsewhere, so this
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide,
    in the alert window. Multiple hosts in the same window points to pushed or scheduled automation,
    or to one drive being carried between machines; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains: /r
        ParentCommandLine|endswith:
        - .bin
        - .ico
        - .lnk
        - .lo
        - .sv
        - .usb
      selection_child_img:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: /q
      selection_child_http:
        CommandLine|contains:
        - 'http:'
        - 'https:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the surrounding half hour collapses repetitive
    agent telemetry into high-count rows and leaves novel pairings standing out at low counts. That
    is where the surrounding stages of an execution chain appear, and where a drive-insertion
    workflow shows itself as a burst of activity starting from a user shell.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a timeline. For an
    external-drive entry path there is usually little before it, and a clean six hours supports
    initial access rather than a later stage of an existing intrusion; earlier defense-tampering or
    reconnaissance alerts would point the other way.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
