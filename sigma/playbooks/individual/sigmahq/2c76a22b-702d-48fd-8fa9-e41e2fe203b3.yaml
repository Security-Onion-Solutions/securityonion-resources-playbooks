name: FunkLocker Ransomware File Creation
id: 67b239b0-c424-4d21-bcb9-9fa679a39e2f
description: |
  Detects creation of files with the .funksec extension, which this ransomware
  appends to each file as it encrypts it (for example, 1.jpg becomes
  1.jpg.funksec). The extension is exclusive to this family, so a true positive
  means encryption is already underway on the host rather than merely attempted.
  Investigation should identify the encrypting process and its file-write breadth,
  locate the dropped ransom note, determine whether recovery options were
  inhibited, and scope how many hosts are affected for containment.
type: detection
detection_id: 2c76a22b-702d-48fd-8fa9-e41e2fe203b3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: 'Do the file path and creating process match what this rule detects — a file whose name ends in .funksec?'
  context: 'Confirm the alert is a true positive by reviewing the exact file path, the operation performed, and the responsible process against the rule''s detection criteria. The .funksec extension is appended to files as they are encrypted, so each alert marks one file the encrypting process has already processed.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'Is this host expected to have files written with the .funksec extension by this process?'
  context: 'Legitimate activity does not append the .funksec extension; it is unique to this ransomware family. When the responsible User is a machine or service account, judge by the writing process and the host role rather than the account name.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What other files did the responsible process write or delete around the alert?
  context: 'A ransomware encryptor touches many files in rapid succession — the breadth, paths, and extensions of this process''s other file activity separate a single encrypted file from an encryption sweep in progress and enumerate what else has been hit. Rapid writes and renames across a high file count within seconds is the encryption signature.'
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a ransom note dropped on this host, and which process wrote it?
  context: 'This ransomware drops a ransom note named in the pattern README-[random].md alongside the encrypted files. Locating the note and the process that wrote it confirms the encryption stage and ties the file writes to the ransomware payload.'
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: 'README'
        TargetFilename|endswith: '.md'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What is the hash and reputation of the process that encrypted these files?
  context: 'File-creation events carry no hash, but the encrypting process records its hash when it runs. Retrieve the responsible process image and its hash, then submit that hash to threat intelligence to confirm the ransomware binary and pull related indicators. If the binary is still on disk, hash it manually from its path.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What unknown or suspicious processes ran on this host as encryption began?
  context: 'The rule already confirms encryption is underway, so the priority shifts to identifying the encrypting binary and assessing recovery. This query surfaces non-system executables running around the alert — processes launched from user-writable or temporary paths, or command interpreters spawning unknown binaries, are candidates for the ransomware payload. Confirm the scope of encrypted data and whether a decryptor or clean backup exists.'
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Ransomware operators delete shadow copies (vssadmin, wmic), disable boot recovery (bcdedit), and remove backups (wbadmin) so victims cannot restore without paying. This query surfaces all recovery-inhibiting commands on the host; verify whether each succeeded by checking system state with vssadmin list shadows, bcdedit /enum, and wbadmin get versions.'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Ransomware typically chains destructive actions — deleting shadow copies, stopping security services, clearing event logs, and changing file permissions. A cluster of these commands under one parent process confirms scripted ransomware execution rather than isolated administration.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Is the encrypted file still on disk, or was it renamed or deleted after the alert?
  context: 'The file''s post-alert lifecycle drives next steps. An encrypted file still on disk can be recovered from backup or shadow copy if recovery was not inhibited; a rename or deletion history shows how the encryptor is progressing through the file system on this host.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Have files with the .funksec extension been seen on this host before?
  context: 'The .funksec extension is created only by this ransomware, so any historical count above zero points to an earlier stage of the same incident or a prior infection. A first-time appearance dates the start of encryption on this host.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this same alert firing on other hosts in the environment?
  context: 'Ransomware often executes across many hosts in rapid succession, and this family is reported to self-propagate over network shares and removable media. Counting how many hosts show this alert and the first-to-last timeline determines the containment scope and whether network isolation is warranted.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are files with the .funksec extension present on other hosts?
  context: 'Finding encrypted files on additional hosts confirms the encryption has spread beyond this endpoint even where an alert did not fire. Map which hosts are affected and the timeline to scope the incident for response.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user account previously produced .funksec file writes, and does that history fit their role?
  context: 'The query mirrors the rule''s pattern scoped to this user across 90 days, aggregated by host. Any prior history of this account writing .funksec files is itself significant because the extension is exclusive to this ransomware; weigh the result against whether the account is a person, a service, or a machine account.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .funksec
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven .funksec file writes on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior — the launch mechanism does. This query scopes the rule''s pattern to the alerting program over 90 days. A new or rare program for this pattern is the deviation to chase; a program already responsible for many prior events is more likely established automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .funksec
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: 'Tracking the account''s activity on other hosts in the alert window can reveal lateral movement or a wider set of affected endpoints. When the alert fires under SYSTEM or a machine account this view returns agent-telemetry noise, so read it alongside the parent-process rollout view.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven .funksec pattern fire on other hosts in the same window?
  context: 'This scopes the rule''s pattern to the alerting program fleet-wide within the alert window. Multiple hosts firing the same program-driven pattern at once points to pushed or scheduled execution across the environment; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .funksec
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: 'Encryption rarely occurs in isolation — reconnaissance, credential access, service stops, and the encryptor launch cluster around the same window. Aggregating process activity by image and parent collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Encryption is usually the final stage of an intrusion. Earlier detections on this host — defense tampering, reconnaissance, credential access, or lateral movement — help reconstruct how the operator reached the impact stage and what else to contain.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
