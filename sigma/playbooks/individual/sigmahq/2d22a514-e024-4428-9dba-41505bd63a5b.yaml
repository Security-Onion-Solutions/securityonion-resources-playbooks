name: Indirect Command Execution From Script File Via Bash.EXE
id: 4fd89197-2f8a-4806-8034-dabd759a99eb
description: |
  Detects the Windows Subsystem for Linux launcher bash.exe running without any command-line flags, which causes it to
  execute the contents of a bash script file directly. Because the actual command logic lives inside the script rather than
  on the command line, this form of invocation can run Linux or Windows binaries while bypassing controls that inspect
  process command lines, making it a defense-evasion path. The rule fires when bash.exe (by Image path or OriginalFileName)
  runs AND none of the filters for a normal flagged invocation, bare interactive launch, or empty command line match.
  Investigation should determine what the script did, what child processes or network connections followed, and whether
  this user and host legitimately use WSL.
type: detection
detection_id: 2d22a514-e024-4428-9dba-41505bd63a5b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did bash.exe run without command-line flags, so it executed a script file directly?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when bash.exe (matched
    by Image path under System32 or SysWOW64, or by OriginalFileName) runs AND the command line is not a flagged invocation
    (bash.exe - / bash -), not a bare interactive launch (bash.exe / bash), and not empty. Review the exact command line and
    process details to confirm the flagless, script-driven form actually matched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run the Windows Subsystem for Linux and execute bash scripts?
  context: Legitimate administrative or developer activity can trigger this detection. WSL and bash.exe are common on
    developer workstations and some admin jumphosts but unusual on general-purpose endpoints or servers. Knowing whether
    this user role and host function include Linux-subsystem usage is often the fastest path to separating routine activity
    from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the bash invocation actually run? Identify the script file and the command line on this host.
  context: The full command line and working directory reveal which script file bash.exe executed and from where. Because
    the flagless form runs the script's contents rather than an inline command, identify the referenced script path, decode
    any wrapped or chained commands, and note any file paths or network endpoints the script targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned bash.exe, and is that parent chain expected?
  context: The parent process reveals how bash.exe was invoked. Interactive launches typically descend from explorer.exe or
    a terminal host; script-runner, Office applications, mshta.exe, wscript.exe, or remote-management parents point to
    automated or operator-driven execution that warrants closer review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did bash.exe spawn after it ran?
  context: Indirect execution matters because of what it launches next. The script run by bash.exe may spawn secondary
    programs such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe, msiexec.exe, curl.exe, or bitsadmin.exe,
    or arbitrary attacker binaries. Children that perform download, scripting, or further execution shift the disposition
    toward abuse.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did bash.exe or its child processes open outbound network connections around the time of the alert?
  context: The Linux subsystem can carry outbound traffic — reverse shells, data exfiltration over /dev/tcp, or download of
    a second-stage payload — initiated by the script rather than visible on the command line. Connections from bash.exe or
    its children to external or unexpected destinations indicate the script reached out beyond local execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was the user's SSH client configuration file written or modified on this host before the alert?
  context: Some indirect-execution paths persist by adding LocalCommand or ProxyCommand entries to the SSH client config so
    that a command runs whenever a connection is made. A recent write to a per-user .ssh config file is a precursor worth
    correlating with this execution; an unmodified config makes the SSH-persistence path less likely.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: Does this host normally run bash.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare WSL usage on this endpoint; a steady count suggests an established
    developer or admin workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the
    current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how the rule's specific flagless-bash firing pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      filter_main_cli_flag:
        CommandLine|contains:
        - bash.exe -
        - bash -
      filter_main_no_cli:
        CommandLine: null
      filter_main_empty:
        CommandLine: ''
      filter_main_no_flag:
        CommandLine:
        - bash.exe
        - bash
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      filter_main_cli_flag:
        CommandLine|contains:
        - bash.exe -
        - bash -
      filter_main_no_cli:
        CommandLine: null
      filter_main_empty:
        CommandLine: ''
      filter_main_no_flag:
        CommandLine:
        - bash.exe
        - bash
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      filter_main_cli_flag:
        CommandLine|contains:
        - bash.exe -
        - bash -
      filter_main_no_cli:
        CommandLine: null
      filter_main_empty:
        CommandLine: ''
      filter_main_no_flag:
        CommandLine:
        - bash.exe
        - bash
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on several hosts, the scope of the activity may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      filter_main_cli_flag:
        CommandLine|contains:
        - bash.exe -
        - bash -
      filter_main_no_cli:
        CommandLine: null
      filter_main_empty:
        CommandLine: ''
      filter_main_no_flag:
        CommandLine:
        - bash.exe
        - bash
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context — what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence, or data staging near the bash.exe execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the
    stages that preceded this execution and help reconstruct the timeline. The alert sequence often tells the story of how
    the activity unfolded.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
