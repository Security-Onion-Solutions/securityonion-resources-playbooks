name: Suspicious Response File Execution Via Odbcconf.EXE
id: 1e5d2c7e-2691-41c5-a4f2-38d99ec6eb8f
description: |
  Detects odbcconf.exe invoked with the -f flag to load a response file whose extension is not .rsp. odbcconf.exe is a Microsoft-signed ODBC configuration utility; its response-file mode reads directives (including REGSVR, which is equivalent to regsvr32.exe) from a file, so an attacker can hide a DLL-registration directive in an arbitrary-extension file and proxy-execute code through a trusted signed binary while evading application allowlisting. The rule fires when the image is odbcconf.exe (by name or OriginalFileName) AND the command line contains -f, and the command line does not reference a .rsp file and is not the benign runonce.exe-driven odbcconf.tmp pattern. Legitimate odbcconf response files normally carry the .rsp extension; a non-.rsp response file is the anomaly. Investigate what the response file directs odbcconf to load, which DLL was registered, and what executed afterward.
type: detection
detection_id: 2d32dd6f-3196-4093-b9eb-1ad8ab088ca5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show odbcconf.exe loading a response file with -f, and is the response file extension non-.rsp?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when odbcconf.exe (by image name or OriginalFileName) runs with a -f flag AND the command line does not reference a .rsp file AND is not the benign runonce.exe / odbcconf.tmp pattern. Read the exact command line and identify the response-file path and extension it points at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to configure ODBC drivers or run odbcconf.exe with a response file?
  context: odbcconf.exe is a deprecated ODBC management utility rarely run interactively. Knowing whether the user role (database administration, application install/packaging) and host function (database server, build host) are consistent with response-file-driven driver registration is often the fastest path to separating routine configuration from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the response file direct odbcconf.exe to do? Decode the full command line and the response-file path and extension.
  context: The full command line reveals which response file odbcconf was told to load and via which switch (-f / -a). Response files mirror command-line actions; the directive of interest is REGSVR (equivalent to regsvr32.exe), which registers and runs a DLL. Identify the response-file path and extension, whether silent mode (/s) or erase-after (/e) switches are present, and which DLL the file is likely registering. The host+binary scope here surfaces every odbcconf invocation in the window, which may include the directive that drops or stages the response file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the running binary genuinely odbcconf.exe, or a renamed copy whose OriginalFileName says odbcconf.exe?
  context: The rule matches on either the image name ending in odbcconf.exe or the PE metadata OriginalFileName of odbcconf.exe, so a renamed copy of the tool also fires. Comparing the Image path on disk against OriginalFileName reveals whether the file was renamed. The signing party and signature status indicate whether this is the Microsoft-signed system binary from System32/SysWOW64 or an unsigned/tampered copy. The file hash enables a reputation lookup to confirm it is the genuine tool versus a planted or modified one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this odbcconf.exe binary arrive on the host, and was it placed outside System32/SysWOW64?
  context: The genuine binary ships at C:\Windows\System32\odbcconf.exe and C:\Windows\SysWOW64\odbcconf.exe. A copy in a user-writable location (Desktop, Downloads, Temp, AppData) was downloaded, extracted, or dropped rather than shipped with the OS. Tracing the file-creation event for the binary by basename over a long window reveals the delivery mechanism and which process created it, distinguishing a relocated/renamed copy from the in-place system binary.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned odbcconf.exe, and is that parent chain expected for ODBC configuration?
  context: The parent process reveals how odbcconf was invoked. Legitimate response-file usage is typically driven by an installer or an administrator shell. Unusual parents such as mshta.exe, wscript.exe, powershell.exe, or an Office application point to a script-driven proxy-execution chain rather than driver configuration. Walk up the tree to see what spawned the parent and what else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which DLLs did odbcconf.exe load shortly after this execution, and are any unsigned or in user-writable paths?
  context: The point of the response-file REGSVR directive is to make odbcconf.exe load and register an attacker-supplied DLL through a trusted signed process. The loaded module is the payload. Review the modules odbcconf.exe loaded around the alert, focusing on DLLs outside System32/SysWOW64, in user-writable directories, or lacking a valid signature. A non-standard or unsigned module load confirms the proxy-execution objective; only the ODBC driver DLLs Windows itself loads are expected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What child processes did odbcconf.exe spawn after execution, and what did they do?
  context: A registered DLL can launch follow-on processes for post-exploitation. Examining the child processes spawned by odbcconf.exe reveals the actual objective. Unexpected children such as cmd.exe, powershell.exe, regsvr32.exe, rundll32.exe, or certutil.exe indicate the loaded DLL kicked off a further stage rather than configuring an ODBC driver.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did odbcconf.exe make any network connections after this execution?
  context: A DLL proxy-executed through odbcconf.exe may reach out to retrieve a further payload or beacon to a command-and-control endpoint. odbcconf.exe configuring local ODBC drivers has no routine reason to initiate outbound network traffic, so any connection from this process is a strong follow-on signal. Review the destination addresses and resolve whether they are internal or external.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a benign-looking utility can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern (odbcconf with -f and a non-.rsp file) has historically run here, not generic odbcconf usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      filter_main_rsp_ext:
        CommandLine|contains: .rsp
      filter_main_runonce_odbc:
        ParentImage: C:\Windows\System32\runonce.exe
        Image: C:\Windows\System32\odbcconf.exe
        CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      filter_main_rsp_ext:
        CommandLine|contains: .rsp
      filter_main_runonce_odbc:
        ParentImage: C:\Windows\System32\runonce.exe
        Image: C:\Windows\System32\odbcconf.exe
        CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      filter_main_rsp_ext:
        CommandLine|contains: .rsp
      filter_main_runonce_odbc:
        ParentImage: C:\Windows\System32\runonce.exe
        Image: C:\Windows\System32\odbcconf.exe
        CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      filter_main_rsp_ext:
        CommandLine|contains: .rsp
      filter_main_runonce_odbc:
        ParentImage: C:\Windows\System32\runonce.exe
        Image: C:\Windows\System32\odbcconf.exe
        CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this execution, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, or persistence mechanisms near the odbcconf invocation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this firing pattern (odbcconf with -f and a non-.rsp file), not generic odbcconf usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|windash: ' -f '
      filter_main_rsp_ext:
        CommandLine|contains: .rsp
      filter_main_runonce_odbc:
        ParentImage: C:\Windows\System32\runonce.exe
        Image: C:\Windows\System32\odbcconf.exe
        CommandLine|contains: .exe /E /F "C:\WINDOWS\system32\odbcconf.tmp"
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as script-host execution, defense tampering, or reconnaissance, may reveal the stages that preceded this proxy-execution event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
