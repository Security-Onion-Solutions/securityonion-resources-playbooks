name: Suspicious Binary Writes Via AnyDesk
id: 83a4d8ab-d6de-42bd-8d4a-3eb4e48b875b
description: |
  Detects a remote access tool (AnyDesk / AnyDeskMSI) writing an executable or library to disk that is not gcapi.dll,
  the one DLL it legitimately writes. The tool normally does not drop binaries, so any other .exe or .dll it writes is
  abnormal and is a common staging step when an operator uses the tool for hands-on-keyboard access to place a follow-on
  stage. Investigation should identify the dropped binary, whether it executed, what launched the tool, where it connects,
  and whether the tool is sanctioned on this host.
type: detection
detection_id: 2d367498-5112-4ae5-a06a-96e7bc33a211
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did the remote access tool write this executable or library, and does the file match what the rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file written, its extension (.exe or .dll), and that the
    creating process is the remote access tool binary. The rule excludes gcapi.dll -- the only DLL this tool legitimately
    writes -- so any other executable or library it drops is the anomaly. Note where the file landed: user-writable or temp
    locations such as Windows\Temp or ProgramData are common malicious drop directories.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and user expected to run a remote access tool that drops executables?
  context: >-
    Legitimate remote support is normally tied to a known IT function and an approved tool. A remote access tool writing
    binaries on an endpoint with no support role, or under a user who does not perform remote administration, is more likely
    operator activity than sanctioned use. When the writer runs as a machine or service account, judge by the host role and
    the writing process rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this remote access tool on the organization's approved software list?
  context: >-
    Organizations typically maintain a list of remote access tools sanctioned for IT support. A tool not on that list --
    even well-known commercial software such as AnyDesk -- may represent shadow IT or attacker-deployed persistence, and
    should be reviewed regardless of the tool's reputation. Maintaining the approved-tool inventory is also how expected
    support agents are distinguished from anomalous ones during triage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session that explains this remote access?
  context: >-
    Legitimate remote access usage typically correlates with an active support ticket, a scheduled maintenance window, or
    a user request. If no support context exists for this activity, the tool may have been installed by an attacker for
    persistent access or by a user circumventing controls -- and a binary write with no matching support record is a stronger
    reason to treat the session as unsanctioned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the dropped binary -- is it signed, and what do its strings and imports reveal?
  context: >-
    The written file is an executable or library, not a document. Retrieve it and examine signing status, embedded strings,
    imports, and packer signatures to determine whether it is a known tool, a renamed legitimate binary, or a novel payload.
    A remote access tool writing an unsigned or obfuscated binary is a staging step for a follow-on stage rather than routine
    operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command line did the remote access tool run under around this write?
  context: >-
    The file event carries no command line, so pivot to the tool's own process execution on this host. The command line
    distinguishes normal interactive use from operator setup -- in particular, setting an unattended-access password from
    the command line is essentially never part of legitimate enterprise use and frequently precedes hands-on-keyboard activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the dropped binary has executed, what is its hash and does threat intel flag it?
  context: >-
    File-creation events carry no hash; the hash is recorded when the file runs. This looks for the dropped path executing
    and reads its hash for a reputation lookup against threat intel to determine whether it is known malicious, benign, or
    previously unseen. If the binary is present on disk but has not executed, retrieve it from its path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process launched the remote access tool?
  context: >-
    The parent reveals how the tool started. A remote access tool launched by explorer.exe or a service is consistent with
    an install or interactive start; one launched by a script host, mshta.exe, or an exploitation chain points to attacker
    deployment. Walk further up the parent chain if the immediate parent is itself unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: What child processes did the remote access tool spawn afterward?
  context: >-
    Interactive control through a remote access tool shows up as child processes under the tool -- command shells, script
    hosts, or discovery utilities the operator launches during a session. Shells or reconnaissance binaries spawned by the
    tool are a stronger signal of hands-on activity than the file write alone; compare any child shells against what this
    tool legitimately launches.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What external endpoints is the remote access tool connecting to?
  context: >-
    Remote access tools establish outbound sessions to relay servers or cloud infrastructure. Connections to the vendor's
    own infrastructure (for example *.anydesk.com relay hosts) are expected; connections to unfamiliar IPs, or to configurable
    high ports such as 7070 or 5650, warrant scrutiny. Compare session duration and connection counts against normal support
    use to spot long-lived tunnels.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is the dropped binary still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed,
    and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts
    the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the remote access tool write or delete around this alert?
  context: >-
    A remote access tool that drops one binary may stage several -- additional tools, scripts, or configuration. The breadth,
    paths, and extensions of its other file activity distinguish a single dropped artifact from an operator staging multiple
    stages, and enumerate what else needs review. Watch for writes into user-writable or temp directories.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously written binaries via the remote access tool, which programs and users drove it?
  context: >-
    The query mirrors the rule's own selection scoped to this host, so the program and user
    distribution reflects how this specific pattern -- the tool writing an executable or library
    other than gcapi.dll -- has historically run here. A new acting program process or an
    unexpected user account against that history is the deviation worth chasing, not generic use
    of the binary.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_dlls:
        TargetFilename|endswith: \gcapi.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - Image
    - User
- question: Did other detections fire on this host in the hours before this write?
  context: >-
    Dropping a binary via a remote access tool is often a mid-chain step. Earlier detections on the same host -- exploitation,
    credential access, reconnaissance, or defense tampering -- help place this write in a timeline and indicate whether an
    operator already had hands-on access before the drop.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously written binaries via the remote access tool, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their history of producing this specific pattern
    across hosts. A user who has never done this is more suspicious than one who does so as part of a support role; weigh
    the count against what the account is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_dlls:
        TargetFilename|endswith: \gcapi.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the tool's binary writes, or is the program new for this activity?
  context: >-
    When the write runs under a service or machine account, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting program, showing its 90-day history
    of driving this pattern. A new or rare program is the deviation; a program that already accounts for many prior events is
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_dlls:
        TargetFilename|endswith: \gcapi.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across other hosts around this time?
  context: >-
    Tracking the account's activity across the environment reveals whether the same user drove similar actions on other
    endpoints, which would widen the scope beyond this host. Concurrent activity under one account on multiple hosts is a
    lateral-movement signal worth following.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven pattern write binaries on other hosts in this window?
  context: >-
    Under a service or machine account, per-user activity is dominated by agent noise, so the meaningful question is whether
    the same launch mechanism fired elsewhere at the same time. The query mirrors the rule's selection scoped to the alerting
    program, fleet-wide, in the alert window. Multiple hosts point to pushed or scheduled automation; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \AnyDesk.exe
        - \AnyDeskMSI.exe
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_dlls:
        TargetFilename|endswith: \gcapi.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
