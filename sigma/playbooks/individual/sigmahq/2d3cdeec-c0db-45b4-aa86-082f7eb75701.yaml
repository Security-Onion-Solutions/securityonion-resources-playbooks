name: Microsoft IIS Service Account Password Dumped
id: e8df9d73-8d55-4f3a-b583-80afd49aa727
description: |
  Detects the IIS command-line tool appcmd.exe being used to list configuration in a form that decrypts and reveals
  application-pool or virtual-directory service-account passwords stored in applicationHost.config. The rule fires when the
  command targets appcmd.exe (by image name or original file name) with a 'list ' verb AND EITHER references the IIS config
  (/config, /xml) OR uses one of the value-dumping flags (/text, /@t, /show, including the undocumented variants) together with a password-revealing token (:\* or 'password'). Legitimate administrators do enumerate IIS configuration, but reading the
  cleartext processmodel password is a credential-access action; an operator who has reached the IIS host via a web shell or
  RDP uses this same command to extract the service-account credential and pivot. The investigation should confirm which
  credential store was targeted, who and what launched the command, and whether the stolen credential was immediately reused.
type: detection
detection_id: 2d3cdeec-c0db-45b4-aa86-082f7eb75701
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the appcmd command line match this rule — a 'list' verb on appcmd.exe combined with either an IIS config reference, or a value-dumping flag together with a password token?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when appcmd.exe (by image name or original
    file name) runs 'list ' AND at least one of two branches matched: an IIS config reference (/config, /xml), or a value-dumping flag (/text, /@t, /show and their undocumented variants) together with a password-revealing token (:\* or the literal 'password').
    Note which branch fired — a bare /config or /xml dump exposes the whole applicationHost.config including encrypted-then-decrypted
    secrets, while /text:processmodel.password or /text:* targets the cleartext credential directly, and that distinction
    determines how aggressively to treat the result.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate IIS configuration and read application-pool credentials with appcmd?
  context: >-
    Legitimate IIS administration includes listing pools and sites, but reading the decrypted processmodel password is a
    narrower action. A web server whose administrators routinely run appcmd, under a known admin account, is a different
    disposition than the same command appearing under an application-pool identity or a service account that should never be
    interactive. Knowing whether this host is an IIS server and whether the user is its expected administrator is often the
    fastest triage step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which credential store did this command target — a specific application pool, a virtual directory, or the whole applicationHost.config?
  context: >-
    appcmd reads credentials that IIS stores encrypted at rest in applicationHost.config and decrypts them in place. Parse
    the command to identify the scope: 'list apppool <name>' or 'list vdir <name>' narrows to one identity, while 'list
    apppool' with /text:* or a config dump exposes every encrypted identity on the server. The object named (or its absence)
    tells you whether a single service account or every IIS credential on the host should be treated as exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this command use a value-extraction flag that returns the cleartext password rather than only listing object names?
  context: >-
    Not every appcmd list reveals secrets. /text:processmodel.password and /text:* return the decrypted credential, and the
    undocumented /show, /@t, and /@text variants do the same while evading rules that only watch for /text:*. A bare 'list
    apppool' that returns names is reconnaissance; a value-dumping flag turns it into credential extraction. This query scopes
    to appcmd executions on this host that carry one of those value-dumping flags so the analyst can see whether the credential
    itself, not just the inventory, was pulled.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_value_flags:
        CommandLine|contains:
          - ' /@t'
          - ' /text'
          - ' /show'
          - ' -@t'
          - ' -text'
          - ' -show'
          - ':\*'
          - 'password'
      condition: selection_base and selection_value_flags
    fields:
      - host.name
      - CommandLine
      - User
- question: What process spawned appcmd, and is that parent chain consistent with administrative use rather than a web shell?
  context: >-
    The parent process distinguishes routine administration from post-exploitation. An IIS administrator running appcmd
    typically descends from an interactive shell or a management console. A parent of w3wp.exe, a scripting host, cmd.exe
    launched by the IIS worker process, or any child of the application pool indicates the command originated from web-server
    code execution — the classic web-shell-to-credential-dump path on an IIS host. Walk up the tree: what spawned the parent,
    and what else did it spawn?
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which service accounts may be exposed, and do any have elevated or domain privileges?
  context: >-
    The severity depends on the privilege of the application-pool or virtual-directory identity whose password was read. A
    pool running under a low-privilege ApplicationPoolIdentity is far less serious than one configured with a domain service
    account or a local administrator. Cross-reference the identities named in the command (or every IIS identity, if the dump
    was server-wide) against directory group memberships; domain or admin-level service accounts require escalation and a
    credential reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously fired the rule's appcmd credential-listing pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even on a managed IIS server, the rule's specific firing pattern has a historical pattern. The query mirrors the rule's
    selection structure scoped to this host, so the resulting parent/user distribution reflects how this credential-listing
    pattern (not generic appcmd usage) has run here before. A new parent process, an unexpected user, or the application-pool
    worker showing up as the launcher is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base_name:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_base_list:
        CommandLine|contains: 'list '
      selection_standalone:
        CommandLine|contains:
        - ' /config'
        - ' /xml'
        - ' -config'
        - ' -xml'
      selection_cmd_flags:
        CommandLine|contains:
        - ' /@t'
        - ' /text'
        - ' /show'
        - ' -@t'
        - ' -text'
        - ' -show'
      selection_cmd_grep:
        CommandLine|contains:
        - :\*
        - password
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_base_* and (selection_standalone or all of selection_cmd_*)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did appcmd spawn afterward, and do any stage or exfiltrate the dumped credentials?
  context: >-
    The processes that follow reveal the actual impact. Credential dumping is often followed by writing the output to a file,
    compressing it, or piping it to a network tool for exfiltration, and sometimes by immediate reuse of the stolen account.
    Unexpected children such as cmd.exe, powershell.exe, or archive and transfer utilities indicate the credential left the
    host or fed a follow-on action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the dumped credential written to a file on this host around the time of the alert?
  context: >-
    appcmd prints the decrypted password to standard output, so operators commonly redirect or export it to disk before
    moving it off the host — for example a CSV or text file under a user-writable or temporary path. A file written in the
    same window with a name suggesting configuration, passwords, or an export is evidence the credential was captured for
    reuse. This pivots to file-write evidence rather than the process_creation event the alert fired on.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_ext:
        TargetFilename|endswith:
          - '.txt'
          - '.csv'
          - '.log'
          - '.xml'
          - '.config'
          - '.tmp'
      condition: selection and filter_ext
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base_name:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_base_list:
        CommandLine|contains: 'list '
      selection_standalone:
        CommandLine|contains:
        - ' /config'
        - ' /xml'
        - ' -config'
        - ' -xml'
      selection_cmd_flags:
        CommandLine|contains:
        - ' /@t'
        - ' /text'
        - ' /show'
        - ' -@t'
        - ' -text'
        - ' -show'
      selection_cmd_grep:
        CommandLine|contains:
        - :\*
        - password
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_base_* and (selection_standalone or all of selection_cmd_*)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base_name:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_base_list:
        CommandLine|contains: 'list '
      selection_standalone:
        CommandLine|contains:
        - ' /config'
        - ' /xml'
        - ' -config'
        - ' -xml'
      selection_cmd_flags:
        CommandLine|contains:
        - ' /@t'
        - ' /text'
        - ' /show'
        - ' -@t'
        - ' -text'
        - ' -show'
      selection_cmd_grep:
        CommandLine|contains:
        - :\*
        - password
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_base_* and (selection_standalone or all of selection_cmd_*)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the
    same user triggered credential listing or other administrative actions on several IIS servers in this window, the scope
    is broader than a single host and the dumped credentials may already be in use elsewhere.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base_name:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_base_list:
        CommandLine|contains: 'list '
      selection_standalone:
        CommandLine|contains:
        - ' /config'
        - ' /xml'
        - ' -config'
        - ' -xml'
      selection_cmd_flags:
        CommandLine|contains:
        - ' /@t'
        - ' /text'
        - ' /show'
        - ' -@t'
        - ' -text'
        - ' -show'
      selection_cmd_grep:
        CommandLine|contains:
        - :\*
        - password
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_base_* and (selection_standalone or all of selection_cmd_*)) and _pb_scope
    fields:
    - host.name
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this
    credential listing, what happened after, and whether it is part of a larger sequence on the web server. Look for prior
    web-server code execution, reconnaissance, or staging, and novel parent-child pairs that stand out at low counts against
    the host's routine telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — web-shell activity, defense tampering, or
    reconnaissance — may reveal the attack stages that preceded the credential listing and help reconstruct how the operator
    reached the point of reading IIS service-account passwords.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's appcmd credential-listing pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific
    credential-listing pattern, not generic appcmd usage. Many IIS servers firing the same pattern points to scripted
    deployment or configuration tooling; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate whether this is routine web-tier management or targeted credential extraction.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_base_name:
      - Image|endswith: \appcmd.exe
      - OriginalFileName: appcmd.exe
      selection_base_list:
        CommandLine|contains: 'list '
      selection_standalone:
        CommandLine|contains:
        - ' /config'
        - ' /xml'
        - ' -config'
        - ' -xml'
      selection_cmd_flags:
        CommandLine|contains:
        - ' /@t'
        - ' /text'
        - ' /show'
        - ' -@t'
        - ' -text'
        - ' -show'
      selection_cmd_grep:
        CommandLine|contains:
        - :\*
        - password
      condition: all of selection_base_* and (selection_standalone or all of selection_cmd_*)
    fields:
    - host.name
