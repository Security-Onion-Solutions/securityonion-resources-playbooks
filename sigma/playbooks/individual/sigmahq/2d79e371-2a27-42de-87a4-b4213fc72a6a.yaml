name: Suspicious Process Spawned by CentreStack Portal AppPool
id: a39e6122-5134-47a4-812d-43eadc829d2c
description: |
  Detects cmd.exe spawned by the IIS worker process w3wp.exe when the worker's own command
  line references the CentreStack portal application pool (portal\portal.config). All three
  conditions must hold together: the parent is w3wp.exe, the parent command line names the
  portal config, and the child is cmd.exe. A portal application pool has no routine reason to
  launch a command interpreter, so this pattern is the execution stage that follows server-side
  code execution against the portal — for example deserialization of a payload crafted with a
  known machineKey (CVE-2025-30406) — or the use of a script planted under the portal web root.
  The investigation should establish what the shell was asked to do, whether files were written
  into the portal directories or staging paths around the same time, whether the portal build
  predates the fixed version, and whether the same parent-driven pattern reaches other web servers.
type: detection
detection_id: 2d79e371-2a27-42de-87a4-b4213fc72a6a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the event show w3wp.exe running the portal application pool spawning cmd.exe?
  context: Confirm all three conditions the rule requires before investing investigation time -
    ParentImage ends in w3wp.exe, ParentCommandLine contains portal\portal.config, and Image ends
    in cmd.exe. A worker process serving a different application pool, or a child other than
    cmd.exe, is not what this rule fires on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run a command interpreter under the portal application pool
    identity?
  context: The alert fires under the application pool identity of a long-running web worker, not
    under an interactive user. A web server whose portal pool has a documented maintenance script
    or health-check helper can produce this legitimately; on a server with no such helper, an
    application-pool-owned shell has no expected origin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the spawned command shell run? Decode its arguments and working
    directory.
  context: The command line carries the operator's actual request - the /c or /k argument, any
    chained commands joined with && or ^, redirected output paths, and any encoded or quoted
    payload. The working directory is often the portal web root or a staging directory, which
    tells you where the shell was invoked from. Because cmd.exe runs constantly on a busy server,
    this is anchored on the alerting process instance rather than on the binary name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is any part of the command line encoded or obfuscated, and what does the decoded
    content do?
  context: Server-side execution paths commonly pass their payload through the request, so the
    argument reaching cmd.exe is frequently base64, hex, URL-encoded, or assembled by character
    concatenation and caret escaping. Decode it in layers until it is readable, then identify the
    operation - a download cradle, a reverse shell, credential collection, or a write of a script
    into the portal web root.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Is w3wp.exe expected to spawn cmd.exe, and what started this worker process?
  context: An IIS worker process is started by the WWW publishing service and normally spawns
    nothing at all - its work happens inside the worker. Retrieving the worker's own creation
    event confirms which application pool it serves and when it started, which bounds the window
    in which the request that produced this shell could have arrived.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same worker process spawn?
  context: Server-side execution rarely stops at one command. Listing every child of the alerting
    worker instance shows whether the same request path also launched script interpreters,
    discovery utilities, archive tools, or transfer tools, which distinguishes a single probe from
    hands-on activity through the portal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What web request reached the portal immediately before this shell started?
  context: The delivery vector for a web-facing application pool is an HTTP request. The parent
    command line identifies the application pool and site, which is what you need to select the
    right access log; correlate on the alert timestamp to recover the requesting URL, method, body
    size, user-agent, and source address. That source address is what gets blocked and what you
    search for against other portal servers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Were files written into the portal web root or into staging directories on this host
    around the alert?
  context: The persistence stage of this pattern is a script left behind in a web directory so the
    portal itself will execute it on later requests. Files appearing under \inetpub\wwwroot\ or a
    \portal\ directory - especially .aspx, .ashx, .asmx, or .config content written by the worker
    process or by the shell it spawned - are the artifact to recover and hash. \Windows\Temp\,
    \Users\Public\, and \AppData\Local\Temp\ are the common staging paths for second-stage tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\inetpub\wwwroot\'
          - '\portal\'
          - '\Windows\Temp\'
          - '\Users\Public\'
          - '\AppData\Local\Temp\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did the IIS worker process load any unsigned or unexpected modules on this host?
  context: A portal application pool can also be backed by a native or managed module registered
    into the server, which executes on every request without leaving a file in the web root. The
    modules a worker loads are visible on the load event together with their signer and hash - an
    unsigned module, or one signed by a party unrelated to the server platform or the portal
    vendor, is the one to pull for analysis.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\w3wp.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: Did any logons or explicit-credential use occur on this server around the time of the
    shell execution?
  context: Command execution under an application pool identity is unprivileged and short-lived,
    so the next step is usually to obtain an account. Security-channel logon events (4624) and
    explicit-credential events (4648) in the same window show whether the activity moved from the
    web tier into an account context, and which account and source address it used. If the
    Security channel is not collected from this server, treat zero results as a visibility gap
    rather than evidence that no logon occurred.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - IpAddress
  answer_sources:
  - active_directory
  - manual_review
- question: Did other command shells on this host chain commands or run discovery utilities around
    the alert?
  context: Hands-on activity through a web-facing shell has a recognisable pattern - commands
    joined with && or ^, /c and /k one-liners, and immediate discovery of the account, host, and
    domain before anything else happens. This narrows the host's cmd.exe traffic to invocations
    carrying those constructs so routine service and installer shells fall away.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\cmd.exe'
      selection_patterns:
        CommandLine|contains:
          - ' /c '
          - ' /k '
          - '&&'
          - '^'
          - 'whoami'
          - 'ping '
          - 'net '
          - 'nltest'
          - 'systeminfo'
      condition: selection and selection_patterns
    fields:
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: Is the portal software on this server patched to a build that is not vulnerable to
    known remote code execution issues?
  context: The parent image identifies the server platform and the parent command line identifies
    the application pool, which together tell you which product build to check. CVE-2025-30406 is
    a deserialization issue fixed in CentreStack 16.4.10315.56368 - builds through
    16.1.10296.56315 ship a hardcoded machineKey that lets anyone who knows it craft a payload the
    portal deserializes server-side. An unpatched build with an unrotated machineKey makes this
    execution path reachable from the network without credentials, and any other portal server on
    the same build is reachable the same way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Does the timing of this activity align with a maintenance window or a scheduled job on
    this server?
  context: Web servers do have legitimate shell activity - deployment scripts, certificate
    renewals, log rotation - but it lands inside a known window and comes from a known job. A
    shell under the portal application pool at a time with no scheduled work, or repeatedly at
    irregular intervals, points at request-driven execution rather than at maintenance. Check the
    server's local time as well as the scheduler for jobs bound to the portal pool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Has this account previously produced this portal-pool-to-shell pattern, and does that
    history fit its role?
  context: This returns the account's 90-day history of the rule's exact firing pattern rather
    than of generic cmd.exe use, aggregated by host. Under an application pool identity the count
    is usually zero, and zero is the meaningful answer - the pool has no history of launching
    shells. A non-zero count points at a recurring helper worth identifying before treating the
    alert as new.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: \portal\portal.config
        Image|endswith: \cmd.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this worker process historically driven this pattern on this host or across the
    environment, or is it new for this activity?
  context: 'The alert fires under a long-running application pool identity, so the account name
    attributes nothing; the launch mechanism does. This returns the 90-day history of w3wp.exe
    driving the rule''s exact pattern, aggregated by host. A worker that already accounts for a
    steady volume of these events is a deployed helper or vendor automation; a first occurrence on
    a server that has run this pool for months is the deviation to chase.'
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: \portal\portal.config
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: If the alert fires under a named account rather than a pool identity, its activity on
    other hosts in the same window shows whether the portal server was one stop in a wider
    sequence. Under a machine or service identity this returns routine platform telemetry from
    every host, and the parent-anchored view of the same window is the answer that carries signal.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the
    activity isolated to this server?
  context: This mirrors the rule's selection scoped to the alerting worker process, fleet-wide,
    within the alert window. Several portal servers producing the pool-to-shell pattern in the
    same hour points at a request path being exercised against every reachable instance, which
    changes the containment decision from one host to the whole portal tier. A single host points
    at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: \portal\portal.config
        Image|endswith: \cmd.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were other servers in the environment hit by the same portal execution path?
  context: A network-reachable execution path against a portal is exercised against every instance
    that answers, not just this one. Correlating this rule across all hosts over the last day
    shows which other servers reached the same execution stage and therefore need the same file,
    module, and logon review. Pair the host list with the requesting source address recovered from
    the access logs to separate targeted access from indiscriminate scanning.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
