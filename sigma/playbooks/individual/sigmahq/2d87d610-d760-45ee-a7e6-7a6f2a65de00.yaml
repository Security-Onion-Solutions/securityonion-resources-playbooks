name: Mustang Panda Dropper
id: d2db384c-8c5a-4c2c-9c9c-01dcbac99bad
description: |
  Detects a dropper pattern that stages renamed copies of signed Windows binaries in a user Temp
  directory and drives them from obfuscated command lines. The rule fires disjunctively: EITHER the
  command line carries one of several markers (an invocation of `Temp\wtask.exe /create`, a scheduled
  task named with the prefix `Security Script `, or cmd.exe environment-variable substring expansions
  such as `%windir:~-1,1%` and `%windir:~-3,1%%PUBLIC:~-9,1%`), OR the command line combines
  `/E:vbscript`, `C:\Users\`, `.txt` and `/F` all together (a script host forced to interpret a text
  file as VBScript), OR the process image path ends in `Temp\winwsh.exe`, a renamed copy of
  wscript.exe. Software installers do run scripts out of Temp, but they rarely rename schtasks.exe or
  wscript.exe to do it and rarely assemble arguments out of environment-variable substrings.
  Determine which branch fired, decode the full command line, identify the file the script host was
  pointed at, establish whether a scheduled task was registered, and recover the staged binaries for
  hashing before they are cleaned up.
type: detection
detection_id: 2d87d610-d760-45ee-a7e6-7a6f2a65de00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event actually match one of this rule's branches, and which one fired?
  context: >-
    This rule fires disjunctively, so confirm the alert against whichever branch applies. Either the
    command line contains one of the marker strings (`Temp\wtask.exe /create`, the task-name prefix
    `Security Script `, or an environment-variable substring expansion such as `%windir:~-1,1%` or
    `%windir:~-3,1%%PUBLIC:~-9,1%`); or the command line contains `/E:vbscript`, `C:\Users\`, `.txt`
    and `/F` all together; or the process image path ends in `Temp\winwsh.exe`. Which branch fired
    steers the rest of the work: the marker branches point at scheduled-task registration and
    obfuscated cmd.exe usage, while the image branch points at a renamed script host running from a
    Temp directory, where the binary's origin and signature become the load-bearing questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run script hosts or register scheduled tasks from a user Temp directory?
  context: >-
    Legitimate administrative activity triggers many detections, and installers and IT automation do
    run scripts out of Temp. What they rarely do is reach that Temp directory through a renamed copy
    of a system binary or a command line assembled from environment-variable substrings. Knowing
    whether this user's role and this host's function involve scripted deployment is usually the
    fastest way to separate routine work from staged activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Are the files this command line references still on disk for analysis?
  context: >-
    The rule's branches reference a text file under `C:\Users\` handed to a script host and a
    `wtask.exe` binary staged in a Temp directory. This query lists the file operations performed by
    the alerting process and its direct children. Files that still exist can be hashed, submitted for
    analysis, or read directly; if they have already been removed, these file events may be the only
    surviving record that they existed and where they were written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Renaming system binaries and building command lines out of environment-variable substrings are
    also common in authorized security assessments and in some commercial software-protection
    wrappers. Before investing investigation time, check whether an assessment is currently running
    against this host or network segment. An authorized engagement whose scope and timing match this
    activity resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What specific capability was invoked in this command line?
  context: >-
    Read the arguments end to end and name the operation. A `/create` invocation of a renamed
    schtasks.exe defines a scheduled task, so record its `/tn` name, its `/tr` action, its `/sc`
    schedule and the account it runs as. A `/E:vbscript` invocation with `/F` points a script host at
    a file whose `.txt` extension hides script content, so record the path it was handed.
    Environment-variable substring expansions such as `%windir:~-1,1%` resolve to single characters
    at run time; expand them by hand to recover what the command actually reads as. Which capability
    was used determines whether the outcome is persistence, script execution, or both.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting binary write in the hour after it ran?
  context: >-
    This pattern leaves recognisable artifacts on disk: copies of system binaries under new names in
    a Temp directory, a text file holding VBScript, a decoy document opened to occupy the user, and a
    scheduled-task definition. Listing what the alerting binary wrote confirms which of those it
    actually produced and gives the analyst the paths to collect, even if the process has already
    exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What did this command actually do, and what other steps of the same operation ran on this host in the same minutes?
  context: >-
    A single staging operation is usually spread across several sequential invocations — a copy that
    renames a system binary, the renamed binary running, the script host reading its payload file.
    This query returns the alerting binary plus any `wtask.exe` or `winwsh.exe` execution on this
    host within the same few minutes, with the working directory, so the arguments can be decoded as
    one sequence rather than one line at a time. Expand any environment-variable substrings, resolve
    relative paths against the working directory, and note every file path the command touches.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      scope:
        host.name|expand: '%hostname%'
      selection_alerting:
        Image|endswith|expand: '%Image%'
      selection_staged:
        Image|endswith:
          - \wtask.exe
          - \winwsh.exe
      selection_staged_cli:
        CommandLine|contains:
          - \wtask.exe
          - \winwsh.exe
          - /E:vbscript
      condition: scope and 1 of selection_*
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: If the staged binaries have executed, what are their hashes and do they have known detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written — file-creation events carry no
    hash. This query looks for `wtask.exe` or `winwsh.exe` executing on this host and reads the hash
    from the execution event; submit it to a reputation service or to internal threat intel. A hash
    that resolves to the stock schtasks.exe or wscript.exe confirms these are renamed copies of
    signed system binaries, which is itself the finding; a hash that resolves to an unknown or
    flagged sample means the familiar name is covering a different payload. On a command-line match
    the hash belongs to the interpreter rather than to the script it read, so retrieve the script
    from its on-disk path and hash it separately. A file that is present but has not executed will
    not appear here at all.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith:
          - \wtask.exe
          - \winwsh.exe
      selection_interpreter:
        CommandLine|contains:
          - \wtask.exe
          - \winwsh.exe
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned this activity, and is that parent chain expected?
  context: >-
    The parent reveals how the activity was invoked. Delivery through a user-opened file typically
    reaches command execution via a run of script hosts — a shortcut or attachment launching
    mshta.exe, wscript.exe, or powershell.exe, sometimes brokered through WMI so that the immediate
    parent appears as wmiprvse.exe. Any of those parents points at document-borne delivery, and the
    file the user opened becomes the next thing to find. A parent of explorer.exe or a
    software-deployment agent points instead at a user or IT action that may be explainable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    What a process spawns afterward shows what the command achieved. Look for a renamed task binary
    being invoked, a script host reading a text file, a document viewer opening a decoy file, a copy
    operation producing another renamed binary, or network-capable binaries starting. Children that
    the command line did not imply widen the scope; no children at all where the command line implied
    one suggests the operation failed or was blocked.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, what parents and users drove it, and does this alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user
    distribution it returns reflects how this specific pattern has run here rather than generic use
    of any one binary. Given how narrow the rule's markers are, an empty result is the expected
    outcome and establishes the current event as a first occurrence on this host. If prior events do
    exist, a consistent parent and a consistent account suggest packaged software that happens to
    build its command lines this way; a new parent or an unexpected account is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains:
        - Temp\wtask.exe /create
        - '%windir:~-3,1%%PUBLIC:~-9,1%'
        - '/tn "Security Script '
        - '%windir:~-1,1%'
      - CommandLine|contains|all:
        - /E:vbscript
        - C:\Users\
        - .txt
        - /F
      selection_img:
        Image|endswith: Temp\winwsh.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is a 90-day
    history of this specific pattern under this account, aggregated by host, rather than generic use
    of a binary. An account that has never produced this pattern is a different situation from one
    that produces it routinely; weigh any count against the user's role and normal toolset. Results
    spread across several hosts under one account point to that account being used to stage the same
    activity in more than one place.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains:
        - Temp\wtask.exe /create
        - '%windir:~-3,1%%PUBLIC:~-9,1%'
        - '/tn "Security Script '
        - '%windir:~-1,1%'
      - CommandLine|contains|all:
        - /E:vbscript
        - C:\Users\
        - .txt
        - /F
      selection_img:
        Image|endswith: Temp\winwsh.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity does
    not attribute the behavior and the launch mechanism does. The query mirrors the rule's selection
    structure scoped to the alerting parent process, giving the 90-day history of that parent driving
    this pattern, aggregated by host. A parent that already accounts for a large volume of prior
    events across many hosts is packaged automation; a parent that is new for this pattern, or that
    only ever drove it on this host, is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains:
        - Temp\wtask.exe /create
        - '%windir:~-3,1%%PUBLIC:~-9,1%'
        - '/tn "Security Script '
        - '%windir:~-1,1%'
      - CommandLine|contains|all:
        - /E:vbscript
        - C:\Users\
        - .txt
        - /F
      selection_img:
        Image|endswith: Temp\winwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity across every host, rather than just the alerting one, shows
    whether the same identity was active elsewhere in the same window and bounds the scope of what
    has to be reviewed. This is a different question from the user's long-run history: it asks what
    the account was doing right now. If the alert fired under a service principal, expect this to
    return routine agent and operating-system activity in volume, in which case the parent-driven
    fleet view is the one that carries the answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal a user-scoped sweep returns agent telemetry rather than an answer, so
    the meaningful pivot is whether the same launch mechanism fired elsewhere. The query mirrors the
    rule's selection structure scoped to the alerting parent process, fleet-wide, across the alert
    window. Several hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger such as a file that one user opened.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains:
        - Temp\wtask.exe /create
        - '%windir:~-3,1%%PUBLIC:~-9,1%'
        - '/tn "Security Script '
        - '%windir:~-1,1%'
      - CommandLine|contains|all:
        - /E:vbscript
        - C:\Users\
        - .txt
        - /F
      selection_img:
        Image|endswith: Temp\winwsh.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating the host's process activity by binary and parent
    collapses repetitive agent traffic into a few high-count rows and leaves novel parent-child pairs
    standing out at low counts, which is what to scan for. Around a staging operation, look for a
    document viewer opening a file, script hosts starting, copy operations writing into Temp, and
    scheduled-task registration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct the stages that preceded this event. For a
    staging pattern like this one, look backward for document-borne execution, script-host activity,
    and writes into user-writable directories, and treat any later persistence or command-and-control
    detections on the same host as part of the same timeline rather than as separate alerts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced the rule's pattern in the past week, and how is it distributed across them?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific pattern rather than the general footprint of any one binary.
    Many hosts producing it points to packaged software or a scripted deployment that happens to
    match the rule's markers, which makes an environment-wide tuning decision the right outcome. One
    host, or a small set with no common deployment story, points to activity driven by an operator or
    by a file that reached those particular users, and the host list becomes the containment scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cli:
      - CommandLine|contains:
        - Temp\wtask.exe /create
        - '%windir:~-3,1%%PUBLIC:~-9,1%'
        - '/tn "Security Script '
        - '%windir:~-1,1%'
      - CommandLine|contains|all:
        - /E:vbscript
        - C:\Users\
        - .txt
        - /F
      selection_img:
        Image|endswith: Temp\winwsh.exe
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
