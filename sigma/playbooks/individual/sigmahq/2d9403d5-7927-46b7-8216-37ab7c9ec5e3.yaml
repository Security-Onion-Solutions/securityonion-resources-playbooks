name: Suspicious Set Value of MSDT in Registry (CVE-2022-30190)
id: be9b1857-3fa9-47b7-be23-8909c9105420
description: |
  Detects a registry value being set under the HKCR\ms-msdt\ handler key, the
  local artifact of CVE-2022-30190 (Follina). The ms-msdt URL protocol handler
  is normally static; a write to this key can hijack the command that runs when
  the ms-msdt protocol is invoked, a path typically reached by a malicious Office
  document that calls MSDT to achieve arbitrary code execution with the calling
  application's privileges. Investigation should confirm the exact key and value
  written, identify the process that wrote it and its parent, and determine
  whether msdt.exe or a script host subsequently executed a payload.
type: detection
detection_id: 2d9403d5-7927-46b7-8216-37ab7c9ec5e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match the ms-msdt handler modification this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact registry path (TargetObject) under HKCR\ms-msdt\, the
    value data written (Details), and the writing process against the rule's
    detection criteria. A write to the ms-msdt handler key is the CVE-2022-30190
    exploitation artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the ms-msdt protocol handler key?
  context: >-
    Legitimate administrative or software-installation activity can touch registry
    handler keys, but the ms-msdt handler is rarely modified in normal operation.
    Knowing whether the user role and host function are consistent with editing
    protocol handler registration is often the fastest way to separate a true
    positive from routine activity. When the recorded user is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific ms-msdt subkey and value were modified, and is this a known exploitation or hijack location?
  context: >-
    The registry path reveals intent. The command that runs for the ms-msdt
    protocol lives under HKCR\ms-msdt\Shell\Open\Command; overwriting it hijacks
    what executes when the protocol is invoked. Identify the exact subkey, the
    value name, the data written (Details), and the writing process to judge
    whether this is a handler hijack rather than a benign repair-tool update.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or value data was written to the ms-msdt handler, and what would it execute?
  context: >-
    The value data is the payload. Analyze the Details field for a command line,
    a path to a binary or script in a user-writable location (Temp, AppData,
    ProgramData), base64 or hex-encoded content, or an invocation of a script host
    such as powershell.exe or cmd.exe. Whatever is set here runs when the ms-msdt
    protocol is next invoked, so decoding it establishes what the exploitation
    achieves. Details is absent for binary or empty value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the ms-msdt handler modification persist, or was the key re-modified afterward?
  context: >-
    Attacker cleanup of a registry key is not directly observable on this
    telemetry because value and key deletions are not emitted; judge persistence
    from the key's re-modification history and from whether the configured payload
    executed. Repeated writes, or a later write that restores the original handler,
    tell you whether the hijack is still live or was reverted after use.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this key, and what parent chain launched that writing process?
  context: >-
    The writing process (Image on the alert) is the immediate actor. Pivot on its
    ProcessGuid to retrieve its own creation event and parent, then judge whether
    that chain is expected. A handler write launched from reg.exe under an
    interactive shell, from an Office application, or from an unsigned binary in a
    user-writable path is very different from one performed by a signed installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was msdt.exe launched on this host around the alert, and what parent process invoked it?
  context: >-
    The signature of this exploitation is msdt.exe spawned by a document
    application such as winword.exe, excel.exe, or powerpnt.exe, which is an
    anomalous child for those processes. Review the parent and the msdt.exe command
    line for an ms-msdt URI or an embedded IT_BrowseForFile payload. An Office
    application spawning msdt.exe close in time to the handler write strongly
    corroborates active exploitation rather than a benign diagnostic run.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\msdt.exe'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
      - ProcessGuid
- question: Did Office applications or msdt.exe make external network connections around the time of the alert?
  context: >-
    Template-injection and ms-msdt payloads commonly reach out to fetch a remote
    template or a second-stage payload. Correlate document-application and msdt.exe
    network activity within the alert window and inspect the destinations against
    known-good external resources; connections to unfamiliar domains or addresses
    from these processes are a strong follow-on indicator. Destination hostnames
    resolve through a separate lookup, so anchor on the destination address.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\msdt.exe'
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: After the ms-msdt handler was modified, did msdt.exe or a script host execute a payload on this host?
  context: >-
    The hijacked handler command runs the next time the ms-msdt protocol is
    invoked, so confirm whether the payload actually executed. Look for
    powershell.exe, cmd.exe, mshta.exe, or a Windows scripting host launched after
    the key write, often with msdt.exe or an Office application as parent. Execution
    confirms the exploitation succeeded rather than a modification that was never
    triggered.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\wscript.exe'
          - '\cscript.exe'
      condition: selection
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Hands-on exploitation and implants often modify several keys together, for
    example hijacking the ms-msdt handler while also setting persistence or
    disabling protections. Registry changes from the same host clustered in a short
    window reveal the full scope of the configuration changes and whether multiple
    objectives were pursued. If the host is registry-noisy, narrow to the writing
    process or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the ms-msdt handler key been modified before on this host?
  context: >-
    The ms-msdt protocol handler should almost never change during normal
    operation, so a first-time modification is far more suspicious than a routine
    one. Compare historical value data on this host to see whether the same data is
    set repeatedly by legitimate software or whether this write is unique. Zero
    history indicates a key that has never been touched before this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote this key?
  context: >-
    A writing process that has never been seen on this host, or that runs only
    rarely, is more suspicious than a routine one. Low or zero historical counts
    for the binary that modified the handler key point to first-time or unusual
    execution and help calibrate how much weight to put on the modification.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the ms-msdt handler key modified on other hosts in the environment?
  context: >-
    The same handler modification across multiple hosts may indicate a
    configuration-management push, widespread malware, or lateral movement, whereas
    a single affected host suggests targeted activity. Compare the value data
    across hosts to see whether the same command is being set everywhere or whether
    each host received a distinct payload.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in the window
    around the handler write surfaces what led to the event and what followed,
    including document applications opening, msdt.exe running, or script hosts and
    reconnaissance tools appearing. Novel parent-child pairs stand out at low counts
    while routine agent telemetry collapses into high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as phishing-document handling,
    defense tampering, or reconnaissance, may reveal the attack stages that preceded
    the handler modification and help reconstruct the timeline. Look for a document
    or delivery-related alert followed by this exploitation artifact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
