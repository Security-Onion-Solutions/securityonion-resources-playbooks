name: Potentially Suspicious Regsvr32 HTTP IP Pattern
id: 1bc8c8fc-587d-4dfe-afa0-a440927d1277
description: |
  Detects regsvr32.exe invoked with an install argument (/i: or -i:) pointing at an http or https URL whose host begins
  with a numeric octet, i.e. a raw IP address. regsvr32.exe is a signed Microsoft DLL/COM registration utility, and passing
  it a remote URL via /i drives it to fetch and execute a remote scriptlet or DLL in its own process context, proxying
  unsigned code past application allowlists. Legitimate COM registration is local and rarely references a bare IP over the
  network, so this pattern usually means a download-and-execute stage. The rule fires when ALL of the binary identity
  (Image ends in regsvr32.exe or OriginalFileName REGSVR32.EXE) AND the IP-URL install argument are present; investigate
  what the fetched payload is, where it came from, and what regsvr32.exe did next.
type: detection
detection_id: 2dd2c217-bf68-437a-b57c-fe9fd01d5de8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show regsvr32 with an install flag (/i or -i) pointing at an http or https IP address?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires BOTH that the process
    is regsvr32 (Image ends in regsvr32.exe, or OriginalFileName is REGSVR32.EXE even if renamed) AND that the command line
    carries an install argument referencing a raw-IP http or https URL. Read the full command line and the binary identity
    from the triggering event and confirm both halves are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register DLLs or COM objects from a remote IP via regsvr32?
  context: Legitimate COM/DLL registration is almost always local (System32 or SysWOW64) and tied to software installation.
    A user or host fetching an install argument from a bare IP address over the network is well outside routine administrative
    activity. Knowing whether this user role and host function ever do remote registration is often the fastest path to
    distinguishing a true positive from a rare-but-legitimate operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did this regsvr32 invocation do? Decode every flag and the full install URL.
  context: The full command line reveals the operation. Decode the flag combination — /s (silent), /n (skip DllRegisterServer),
    /u (unregister/run DllUnRegisterServer entry point), /i:<url> (pass install argument) — and read the complete URL,
    including the IP, port, path, and any scriptlet (.sct, .ocx) or DLL extension. The classic remote-proxy form pairs /i:<url>
    with scrobj.dll to host a scriptlet, but a bare DLL URL runs the DLL's register/unregister export in regsvr32 context.
    This scopes to all regsvr32 executions on the host within a few minutes, since a single logical operation can span
    sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is the remote IP and URL in the install argument, and what do reputation, WHOIS, and threat intel reveal?
  context: 'The install argument names attacker-controlled infrastructure: a raw IP host, a port, and a path to the fetched
    scriptlet or DLL. Extract the IP and URL from the alerting command line and investigate it — registration age and owner
    (WHOIS), passive DNS history, hosting reputation, and known threat-intel hits. A bare IP with no DNS name, a high or
    non-standard port, or a recently flagged host points to attacker-controlled retrieval rather than a software vendor
    endpoint. The destination here lives in the command line, not in a separate network record, so read it from the process
    event.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What process spawned this regsvr32 instance, and is that parent chain expected?
  context: The parent process reveals how regsvr32 was invoked. Legitimate registration is usually launched by an installer,
    explorer.exe for a user action, or services.exe. Unusual parents — mshta.exe, wscript.exe, cscript.exe, an Office
    application, or a shell spawned from a document — point to macro or script-driven execution rather than software
    installation. The immediate parent is in the alert; walk up to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously fired this regsvr32 IP-URL pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even a signed utility can be abused. This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern — regsvr32 with an IP-URL install
    argument — has historically run here, not generic regsvr32 usage. A new parent process, an unexpected user account, or an
    unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_ip:
        CommandLine|contains:
        - ' /i:http://1'
        - ' /i:http://2'
        - ' /i:http://3'
        - ' /i:http://4'
        - ' /i:http://5'
        - ' /i:http://6'
        - ' /i:http://7'
        - ' /i:http://8'
        - ' /i:http://9'
        - ' /i:https://1'
        - ' /i:https://2'
        - ' /i:https://3'
        - ' /i:https://4'
        - ' /i:https://5'
        - ' /i:https://6'
        - ' /i:https://7'
        - ' /i:https://8'
        - ' /i:https://9'
        - ' -i:http://1'
        - ' -i:http://2'
        - ' -i:http://3'
        - ' -i:http://4'
        - ' -i:http://5'
        - ' -i:http://6'
        - ' -i:http://7'
        - ' -i:http://8'
        - ' -i:http://9'
        - ' -i:https://1'
        - ' -i:https://2'
        - ' -i:https://3'
        - ' -i:https://4'
        - ' -i:https://5'
        - ' -i:https://6'
        - ' -i:https://7'
        - ' -i:https://8'
        - ' -i:https://9'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: What child processes did this regsvr32 instance spawn afterward?
  context: The processes spawned by regsvr32 reveal the payload's actual impact. A remote scriptlet or DLL executed in
    regsvr32 context frequently launches follow-on stages — cmd.exe, powershell.exe, certutil.exe, or other download or
    discovery tools. Unexpected children shortly after the alert indicate the fetched code ran and moved to post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What DLLs or scriptlet-runtime modules did regsvr32 load shortly after launch, and were any unsigned or loaded
    from an unusual path?
  context: After fetching the remote install argument, regsvr32 loads the code into its own process. Look for scrobj.dll (the
    Script Component Runtime that executes .sct scriptlets), a .NET CLR loaded into regsvr32 (anomalous — regsvr32 does not
    normally host managed code), or any unsigned DLL loaded from a temp or user-writable directory shortly after the process
    started. Correlate the module-load timing with the process creation; a load within seconds of launch, from outside
    System32 or SysWOW64, is the proxy-execution payload. If image-load events are not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the regsvr32 invocation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, persistence installation, or additional download or proxy-execution tools running in the same
    window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
