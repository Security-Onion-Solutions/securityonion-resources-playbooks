- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, a
    macro-spawned shell, or credential access — may reveal the attack stages that preceded the regsvr32 download-and-execute
    and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one proxy-execution LOLBin often use several. If regsvr32 was used to run remote code, check
    whether rundll32, mshta, msbuild, installutil, msiexec, or similar signed binaries were also used to proxy execution in
    the same timeframe. Multiple proxy-execution LOLBins performing the same objective strengthens the case for hands-on
    malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was regsvr32 executed from an expected path under System32 or SysWOW64?
  context: regsvr32 executed from a non-standard path — outside C:\Windows\System32 or C:\Windows\SysWOW64 — may indicate the
    binary was copied or renamed to evade path-based allowlists. Compare the Image path against OriginalFileName — a process
    whose OriginalFileName is REGSVR32.EXE but whose Image path is a temp or user-writable directory, or a different file
    name, is more suspicious than one running from the canonical system location.
