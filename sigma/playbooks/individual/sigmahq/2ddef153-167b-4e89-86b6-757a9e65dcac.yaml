name: File Download Via Bitsadmin To A Suspicious Target Folder
id: fe8e62fd-ee00-4f88-9587-a6a035fbf158
description: |
  Detects bitsadmin.exe invoked with a job-management flag (/transfer, /create, or /addfile) AND a destination
  path that lands in a suspicious folder such as ProgramData, Temp, Users\Public, an AppData subtree, a Startup
  folder, or a web root. All three conditions must be present together: the bitsadmin binary (by image name or
  PE OriginalFileName), a transfer/job flag, and a suspicious target folder. bitsadmin is a Microsoft-signed
  Background Intelligent Transfer Service utility that legitimately downloads files for updaters and admins, but
  it is also a living-off-the-land download primitive that retrieves attacker-hosted payloads under user-level
  privileges and can chain into execution via SetNotifyCmdLine or establish long-lived persistent jobs. The
  investigation should confirm what was downloaded, where it landed, whether the transfer succeeded, and what ran
  next.
type: detection
detection_id: 2ddef153-167b-4e89-86b6-757a9e65dcac
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show bitsadmin with a /transfer, /create, or /addfile flag AND a destination in a suspicious folder?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when all three
    conditions hold together - the binary is bitsadmin (by image name or PE OriginalFileName), a job flag (/transfer,
    /create, or /addfile) is present, AND the command line references a suspicious destination folder (ProgramData, Temp,
    Users\Public, an AppData subtree, a Startup folder, a web root, or similar). Read the full command line and confirm all
    three are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files with command-line transfer tools?
  context: Legitimate administrative activity and software updaters can invoke bitsadmin. Knowing whether the user role and
    host function are consistent with command-line file downloads to these folders is often the fastest path to separating a
    true positive from routine operations. A developer workstation or a server running a vendor updater is a different
    disposition than an ordinary user account suddenly transferring a file into ProgramData.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The rule matches bitsadmin either by image name or by PE OriginalFileName of bitsadmin.exe, so a renamed copy
    still triggers. Compare the Image path on disk against the embedded OriginalFileName to confirm whether this is the
    genuine signed bitsadmin or a renamed copy, and check the signing chain - the real binary is Microsoft-signed from
    System32 or SysWOW64. The file hash enables reputation lookups to determine whether this is the stock utility or a
    tampered or unexpected build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Decode the full bitsadmin command - what URL or source was fetched, what destination path, and was a notify command or custom header set?
  context: The full command line reveals the operation. Parse the source (a remote URL or UNC path is a download; a local
    path is a copy), the destination path, the job name, and any chained flags. Pay particular attention to /SetNotifyCmdLine
    (runs a command when the job completes - a download-then-execute primitive), /setcustomheaders, /resume, and
    /setminretrydelay. A notify command pointing at powershell.exe, cmd.exe, or a dropped executable in Temp or ProgramData
    turns a download into code execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the downloaded file still on disk at the destination path for analysis?
  context: If the bitsadmin command references a destination file, checking whether it still exists on disk enables deeper
    analysis - hash lookups, sandbox submission, or content review. Attackers frequently delete the payload after execution,
    so absence does not clear the alert but presence enables triage.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination path.
  context: A bitsadmin transfer command does not guarantee the file was actually retrieved. Network errors, blocked URLs, or
    security controls may have stopped the transfer. Confirming a file-creation event at the destination path establishes
    whether the attack progressed past the delivery stage. The suspicious folders the rule keys on (ProgramData, Temp,
    Users\Public, AppData) are common staging locations for retrieved payloads.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What outbound network connections did bitsadmin make around the time of the alert?
  context: BITS jobs perform the actual HTTP, HTTPS, or SMB transfer while the owning user is logged on, so a successful
    download leaves a network connection initiated by bitsadmin to the source host. Identifying the destination address and
    port establishes where the payload came from and whether it is an external or non-corporate endpoint rather than a
    sanctioned update or content-delivery service. If no connection is present, the job may have been queued but not yet
    transferred, or BITS may have carried the transfer under svchost rather than the bitsadmin process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \bitsadmin.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: If the downloaded payload was executed, what is its hash and does it have known threat-intel detections?
  context: The hash for a reputation lookup is recorded when the payload runs, not when bitsadmin writes it to disk —
    file-creation events carry no hash. bitsadmin frequently stages second-stage loaders and DLLs into ProgramData for
    LATER execution by a separate process, so this family-scoped query (the alerting process's children and siblings)
    may be empty; when the payload is run as part of the same command it appears here with its hash. Otherwise retrieve
    the staged file from its path and hash it manually, and check the host's later process activity.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What process spawned bitsadmin and is that parent chain expected?
  context: The parent process reveals how bitsadmin was invoked. Legitimate use often comes from a script, an updater, or an
    interactive shell an admin opened. Unusual parents - mshta.exe, wscript.exe, an Office application, a web server worker
    process, or an exploited service - point to delivery through a macro, an exploit, or a remote-access tool rather than
    deliberate administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did bitsadmin spawn afterward?
  context: A bitsadmin job configured with /SetNotifyCmdLine launches a command when the transfer completes, turning a
    download into a download-then-execute chain. Examining processes that bitsadmin spawned reveals whether the transfer was
    immediately followed by execution of the retrieved payload - common next steps are rundll32.exe loading a downloaded DLL,
    cmd.exe, or powershell.exe running the dropped file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_folder:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
        - '%ProgramData%'
        - '%public%'
        - '%temp%'
        - '%tmp%'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_folder:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
        - '%ProgramData%'
        - '%public%'
        - '%temp%'
        - '%tmp%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Attackers who use one download LOLBin often use several - if bitsadmin transferred a file, check whether certutil,
    curl, expand, or extrac32 were also used to pull or stage content. Finding multiple download utilities performing the
    same action in the same timeframe strengthens the case for deliberate tool transfer rather than a one-off administrative
    download.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was bitsadmin executed from its expected System32 or SysWOW64 path?
  context: bitsadmin executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or
    renamed to evade path-based allowlists. The genuine utility lives at C:\Windows\System32\bitsadmin.exe or
    C:\Windows\SysWOW64\bitsadmin.exe; a copy running from a user's temp directory, Downloads, or AppData is more suspicious
    than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: When this host has previously fired the rule's bitsadmin download pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped to this host - the
    resulting parent and user distribution reflects how the rule's specific firing pattern (not generic bitsadmin usage) has
    historically run here. Deviations - a new parent process, an unexpected user account, an unusual command-line structure - are
    the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_folder:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
        - '%ProgramData%'
        - '%public%'
        - '%temp%'
        - '%tmp%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the rule's bitsadmin download pattern over the past 90 days, and what command-line structures are typical?
  context: A download pattern with no prior history on a host is more suspicious than one used daily under stable parents. The
    query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's specific
    firing pattern (not generic bitsadmin usage). The CommandLine projection lets the analyst compare the typical invocation
    patterns against the alerting one - the same updater fetching to the same folder daily reads very differently from a
    first-ever transfer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \bitsadmin.exe
      - OriginalFileName: bitsadmin.exe
      selection_flags:
        CommandLine|contains:
        - ' /transfer '
        - ' /create '
        - ' /addfile '
      selection_folder:
        CommandLine|contains:
        - :\Perflogs
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\
        - \$Recycle.Bin\
        - \AppData\Local\
        - \AppData\Roaming\
        - \Contacts\
        - \Desktop\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
        - '%ProgramData%'
        - '%public%'
        - '%temp%'
        - '%tmp%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: BITS jobs themselves can persist across reboots and re-run a notify command, so a bitsadmin transfer can be the
    first step in establishing a foothold. Attackers rarely rely on a single mechanism - they commonly stack scheduled tasks,
    services, registry Run keys, additional BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe indicate intentional stacking rather than isolated administrative action. Enumerating all BITS jobs on the host
    (for example via bitsadmin /list /allusers /verbose) surfaces long-lived jobs created for download or execution
    persistence.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance,
    credential access, or an initial-access exploit - may reveal the attack stages that preceded this download and help
    reconstruct the timeline. A download to a suspicious folder following an exploitation or tampering alert reads very
    differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
