name: Peach Sandstorm APT Process Activity Indicators
id: f022818c-4231-40f3-aaeb-2bf36a8a16c4
description: |
  Detects a process whose command line contains one fixed literal string (QP's\*(58vaP!tF4) that has
  been observed in the process activity of a backdoor implant. The match is an exact indicator rather
  than a behavioral pattern, and the rule constrains nothing else — no image, no parent, no path — so
  any process on any host can raise it, and the string carries no meaning in ordinary software
  operation. The realistic benign source is a security assessment or a test payload that reuses the
  same literal. Investigation should confirm the string is present verbatim in the alerting command
  line, identify the binary that carried it and how it was launched, and determine whether that
  process wrote files, spawned children, or reached a remote endpoint.
type: detection
detection_id: 2e7bbd54-2f26-476e-b4a1-ba5f1a012614
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting command line contain the exact indicator string this rule matches on?
  context: >-
    The rule matches a single literal substring anywhere in the command line, with no constraint on
    the executing binary or its parent. Read the full command line and confirm the string is present
    verbatim before spending further time on the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run software that carries this string on its command line?
  context: >-
    The string is not an argument of any documented administrative tool, so there is rarely a
    legitimate owner for it. Establish whether the host runs in-house or vendor software that could
    embed such a literal, and whether the account is a real user or a service principal — that
    determines which identity pivots attribute the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Assessment tooling and test payloads reuse published indicator strings, and an authorized
    engagement is the most common non-hostile source for an exact-string match like this one. Check
    whether a pentest or red team exercise is active on this host or network segment; matching scope
    and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What did the rest of the command line ask the binary to do?
  context: >-
    The indicator string identifies the tooling; the surrounding arguments say which function ran.
    Record the full argument list and decode any encoded or obfuscated segments, and note file paths,
    hostnames, ports, and output targets — these set the scope of what to check next.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting binary write on this host after it ran?
  context: >-
    Implants write configuration, staging, and output files next to their executable or under
    user-writable directories, and those files persist after the process exits. The paths written in
    the hour after execution show what was staged or collected, and give file names to search for on
    other hosts.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What is the full command line of every process on this host carrying the indicator string, and what does each one decode to?
  context: >-
    The rule keys on the command line only, so the same literal can ride on more than one process in
    the same window — a launcher and its payload, or repeated invocations of one operation. Listing
    every carrier of the string with its working directory and binary shows the whole operation rather
    than the single event that alerted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What process launched the alerting binary, and is that parent chain expected?
  context: >-
    The rule places no constraint on the parent, so the launcher is unknown until it is read. A parent
    of explorer.exe points to user execution of a dropped file; a browser, mail client, archiver, or
    script host points to delivery; services.exe or a scheduled-task host points to something already
    installed on the machine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    Children reveal what the execution actually accomplished — command interpreters and script hosts
    for hands-on activity, archivers for staging, or native tools used for discovery. Scoping on the
    alerting process rather than on its binary name keeps the result tied to this execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the alerting process open outbound network connections after it started?
  context: >-
    An implant's command-line stage is normally followed by remote communication. Connections from
    this process to external addresses, particularly on non-standard ports or to destinations the
    environment has not seen before, show whether it reached a remote endpoint; no connections point
    to a stage that failed or had not yet run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: When this host has previously produced the rule's pattern, what parents and users drove that activity?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent/user distribution
    reflects the history of this exact string on this machine, not generic binary usage. For an
    exact-indicator rule the expected answer is no prior history; a recurring parent and account
    instead points to installed software or a test harness that embeds the literal.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts produced the rule's pattern in the past week, and how is that activity distributed?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this exact
    string. Many hosts producing it points to a pushed package, an assessment sweep, or a software
    build that embeds the literal; a single host or a small unrelated set points to hands-on activity
    and sets the containment scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their 90-day history of this
    exact string aggregated by host. A user with no prior history is the ordinary case for an
    exact-indicator rule; a user with recurring hits across several hosts is either a tester or an
    account whose credentials are being used to run the same payload repeatedly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern here or elsewhere, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity attributes nothing and the
    launch mechanism is the meaningful pivot. This gives the 90-day history of this parent driving
    this exact string, by host. A parent that already accounts for many prior events is packaged
    software or automation; a parent that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the same identity
    drove execution elsewhere, which widens the scope beyond the alerting machine. If the alert fired
    under SYSTEM or a machine account, this returns routine agent telemetry and the parent-driven
    view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did the same parent-driven pattern fire on other hosts in this window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points to scheduled or pushed execution; a single
    host points to a machine-local trigger and keeps the scope narrow.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: QP's\*(58vaP!tF4
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The aggregation collapses repetitive service and agent activity into high-count rows, leaving
    novel parent-child pairs standing out at low counts. Scan for discovery commands, archivers,
    credential tooling, or new script hosts in the same window — they say whether this execution was
    an isolated event or one step of a longer sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same machine — delivery, script execution, defense tampering, or
    credential access — reconstruct how the payload arrived and what preceded it. An exact-indicator
    match late in a sequence of related alerts changes the timeline the response is built on.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
