name: File Creation Related To RAT Clients
id: bdf1afbf-3939-4cd4-bfe4-0a8ddfe73572
description: |
  Detects creation of files under the user's AppData\Roaming directory whose path
  and name match configuration or logging artifacts associated with commodity
  remote-access trojan (RAT) clients. The rule fires only when all conditions hold
  together: the path lies under \AppData\Roaming\, the path contains a RAT-related
  segment (\mydata\, \datalogs\, \hvnc\, or \dcrat\), and the file name ends in a
  known artifact name (datalogs.conf, hvnc.conf, or dcrat.conf). These filenames map
  to runtime artifacts that RAT clients write while operating; a legitimate
  application coincidentally using the same name is the primary false positive.
  Investigation should determine which artifact was written, the process that wrote
  it, whether that binary is a known RAT client, and whether it then executed
  further or beaconed to command-and-control.
type: detection
detection_id: 2f3039c8-e8fe-43a9-b5cf-dcd424a2522d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file path under AppData\Roaming and the responsible process match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact file path under AppData\Roaming, the matched RAT-artifact
    filename (a \mydata\, \datalogs\, \hvnc\, or \dcrat\ path segment ending in
    datalogs.conf, hvnc.conf, or dcrat.conf), and the responsible process against
    the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a process writing RAT-style config files into AppData\Roaming?
  context: >-
    Legitimate administrative activity can trigger many detections, but these
    filenames map to runtime artifacts of remote-access trojans, so a routine
    business process writing them is unusual. When the user is a machine or service
    account, judge by the writing process and host role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A config artifact still on
    disk can be retrieved and analyzed alongside the responsible process; a file
    deleted seconds after creation suggests anti-forensic cleanup or a self-deleting
    component and shifts focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is written inside this config file, and does its content reveal C2 addresses, keys, or captured host data?
  context: >-
    These .conf artifacts are written by a running RAT client and typically hold
    configuration or logged data such as command-and-control endpoints, encryption
    keys, mutex names, or captured host and user fields. Retrieve the file from the
    endpoint and inspect its bytes; small text files may be readable directly, while
    structured or encoded blobs need decoding. Compare any embedded indicators
    against threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote this file, and what was its full command line?
  context: >-
    The file event records the responsible process identifier; pivoting to its
    process-creation event exposes how the client was launched, including the binary
    path, working directory, and command-line arguments. A payload run from a
    user-writable directory, a script host, or a copy-concatenated dropper reads
    very differently from a signed vendor process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What is the hash and reputation of the process that wrote this artifact?
  context: >-
    A file-creation event carries no hash, so the pivot is to the responsible
    process's own execution record, which does carry one. Read that hash and submit
    it to threat intelligence to determine whether the writing binary is a known RAT
    client, a benign tool, or previously unseen. If a separate payload was dropped
    and executed, hash it the same way; if the writer's execution record is missing,
    retrieve the binary from disk and hash it manually.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What parent process spawned the process that wrote this file, and is that chain expected?
  context: >-
    The parent process reveals how the client was launched. Droppers frequently
    chain through script hosts (wscript.exe, cscript.exe), cmd.exe copy-concatenation,
    or Office applications; a config write parented by explorer.exe after a user
    double-click tells a different story from one parented by a scripting engine or
    a scheduled-task host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A client that drops one config artifact usually drops several, including
    additional configs, logs, staged payloads, or persistence files. The breadth,
    paths, and extensions of the responsible process's other file activity
    distinguish a single artifact from an active infection dropping multiple
    components and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written under AppData\Roaming recently, and by which processes?
  context: >-
    Location drives suspicion. The user's Roaming AppData folder holds legitimate
    application data but is also a common staging directory for commodity RAT
    clients. Other recent arrivals in the same tree, and the processes writing them,
    reveal whether this is an isolated drop or a directory under active use by the
    same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Roaming\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the responsible process make network connections after writing this file?
  context: >-
    The .conf artifacts are written by a live RAT client, so the follow-on to watch
    is beaconing. Correlating outbound connections from the responsible process
    after the file write reveals whether the client reached command-and-control; a
    process that drops a config and immediately connects to an external address is
    executing its core function.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has a file with this name been created on this host before?
  context: >-
    A RAT config filename appearing for the first time on a host is more concerning
    than one with a long benign history. Zero or very low historical counts point to
    a first-time drop; a steady history may indicate a legitimate application
    coincidentally using the same name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced this file-creation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the
    user's 90-day history of this specific RAT-artifact write pattern rather than
    generic file activity, aggregated by host. A user who has never produced this
    pattern is more notable than one who does so regularly; weigh the count against
    the user's role and typical software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_required:
        TargetFilename|contains: \AppData\Roaming\
      selection_variants:
        TargetFilename|contains:
        - \mydata\
        - \datalogs\
        - \hvnc\
        - \dcrat\
        TargetFilename|endswith:
        - \datalogs.conf
        - \hvnc.conf
        - \dcrat.conf
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-creation pattern here or across the environment, or is it new for this activity?
  context: >-
    When the write occurs under a service or machine account, user identity does not
    attribute the behavior; the launch mechanism does. The query mirrors the rule's
    selection scoped to the alerting program, giving the 90-day history of
    this program driving this specific pattern. A new or rare program for this pattern
    is the deviation worth chasing; a program already accounting for thousands of
    prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_required:
        TargetFilename|contains: \AppData\Roaming\
      selection_variants:
        TargetFilename|contains:
        - \mydata\
        - \datalogs\
        - \hvnc\
        - \dcrat\
        TargetFilename|endswith:
        - \datalogs.conf
        - \hvnc.conf
        - \dcrat.conf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account
    produced related activity elsewhere. If the user triggered similar drops or other
    suspicious execution on multiple endpoints, the scope of the incident is larger
    than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, cross-network user activity is dominated by
    agent telemetry, so the meaningful question is whether the same launch mechanism
    produced this pattern elsewhere in the alert window. Multiple hosts point to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_required:
        TargetFilename|contains: \AppData\Roaming\
      selection_variants:
        TargetFilename|contains:
        - \mydata\
        - \datalogs\
        - \hvnc\
        - \dcrat\
        TargetFilename|endswith:
        - \datalogs.conf
        - \hvnc.conf
        - \dcrat.conf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the file
    write reveals what launched the client and what followed, such as reconnaissance,
    scheduled-task or Startup-folder persistence, or additional payload execution.
    Aggregating by process and parent collapses routine noise while novel
    parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has a file with this name been created on any other hosts in the environment?
  context: >-
    Finding the same RAT-artifact filename on multiple hosts may indicate a
    distribution campaign or a shared delivery vector rather than an isolated
    infection. If the file appears only on one host it may be targeted; if on many,
    map the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, whether
    delivery, execution, or persistence signals, may reveal the stages that preceded
    the RAT config write and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
