name: Potential Conti Ransomware Database Dumping Activity Via SQLCmd
id: e96d2663-69bb-41c8-b32a-486e66bcce19
description: |
  Detects sqlcmd being used to enumerate or back up SQL Server content on the local instance.
  The rule fires when a process is identified as sqlcmd — either by an Image ending in
  \sqlcmd.exe or by a command line referencing 'sqlcmd ' or 'sqlcmd.exe' — and that same
  command line both connects to the local instance with ' -S localhost ' and carries one of
  sys.sysprocesses, master.dbo.sysdatabases, or BACKUP DATABASE. Conti ransomware operations
  run this parameter combination to inventory sessions and databases and to write backup
  copies before encryption; the identical three elements also appear in routine database
  administration — instance inventory scripts, pre-maintenance backups, migration tooling,
  and reporting jobs — which is the discriminator this investigation has to settle. Determine
  which account and parent process drove the invocation, what the command actually targeted,
  where any output landed, and whether recovery-inhibiting or encryption activity followed on
  the same host.
type: detection
detection_id: 2f47f1fd-0901-466e-a770-3b7092834a1b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting command line show sqlcmd connecting with ' -S localhost ' and running one of the rule's database enumeration or backup statements?
  context: >-
    Confirm the alert before investing investigation time. Three elements must be present together: sqlcmd identified
    by its image name or by a command-line reference, the ' -S localhost ' server argument, and one of sys.sysprocesses,
    master.dbo.sysdatabases, or BACKUP DATABASE. Note which of the three query strings matched, and whether sqlcmd was
    identified by its image or only by a command-line mention — a command-line-only match can come from a wrapper script
    or a cmd.exe line that never executed sqlcmd at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run local SQL Server enumeration or backup commands?
  context: >-
    Database administrators, backup agents, and monitoring tooling run sqlcmd against a local instance as routine work,
    so the account and the host role are often the fastest discriminator. Establish whether the account is a DBA or a
    service identity registered for this instance, and whether the host actually runs SQL Server, before treating the
    invocation as unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What did this sqlcmd run actually do — which instance and database were targeted, and where was output written?
  context: >-
    Decode every argument. -S names the instance, -d the database, -Q or -q the inline query, -i an input script, -o the
    output file, -E a trusted connection, and -U/-P explicit credentials. sys.sysprocesses lists active sessions and
    master.dbo.sysdatabases lists every database on the instance, both of which are inventory steps; BACKUP DATABASE
    writes a copy of a database to the path named in the statement, which is where the data landed. This query returns
    every sqlcmd execution on the host in the surrounding window, because operators and maintenance scripts alike chain
    several invocations that together form one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What files did sqlcmd read or write on this host?
  context: >-
    The command line names the query, but the file events show what reached disk: BACKUP DATABASE output (.bak, .trn),
    -o redirected result files, and -i input scripts. The set of files written, their destination directory, and their
    size determine how much data left the database engine and which business systems are affected. The working directory
    of the process often reveals where the operator was staging the output.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
  answer_sources:
  - process_creation
- question: Were database backups, exports, or sensitive document types written anywhere on this host around the sqlcmd activity?
  context: >-
    Local data collection stages content on disk before it moves anywhere. Backup and export artifacts (.bak, .trn, .dmp,
    .csv, .txt) and sensitive document types (.xls, .xlsx, .db, .pdf) written in the alert window — particularly into
    temporary or user-writable directories rather than a designated backup volume — show the activity went beyond a
    read-only inventory. Files of these types written by a process other than sqlcmd in the same window may be a
    second-stage archiver working on the same data.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.bak'
          - '.trn'
          - '.dmp'
          - '.csv'
          - '.txt'
          - '.xls'
          - '.xlsx'
          - '.db'
          - '.pdf'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: Where did the exported or backed-up data go after sqlcmd wrote it?
  context: >-
    Collected database output is normally moved before it is useful to an operator — copied to a staging directory, added
    to an archive, or transferred off the host. Follow the files sqlcmd created and look for subsequent copies, archive
    creation, or outbound transfers from the same host in the following hour; a backup that stays on the designated
    backup path and is picked up by the backup agent reads very differently from one copied into a user profile.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
  answer_sources:
  - file_event
  - network_connection
- question: How was authentication supplied to sqlcmd, and where was the result set directed?
  context: >-
    sqlcmd authenticates either with -E, using the running account's own Windows token, or with explicit -U and -P
    credentials; a password can also be passed through the SQLCMDPASSWORD environment variable so it never appears in the
    command line at all. -C tells sqlcmd to trust the server certificate without validating it. An -E invocation means the
    data was reachable with the rights the process already had, while explicit credentials mean an account for the instance
    was already in hand. Check -o for the output destination — a path outside the designated backup location points at a
    copy made for removal rather than for maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What process launched sqlcmd, and is that parent chain expected for database work on this host?
  context: >-
    Scheduled backup jobs, SQL Server Agent job steps, and monitoring tooling produce predictable parents such as cmd.exe
    under the agent service, services.exe, or a task scheduler host. An interactive shell reached over remote access, a
    script host, an Office application, or a binary running from a user-writable directory is a different launch path and
    should be walked further up the tree. The parent also indicates whether this invocation was one step of a scripted
    sequence — check what else the same parent spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced this sqlcmd enumeration-and-backup activity, what parents and users normally drive it?
  context: >-
    The query mirrors the rule's selection criteria scoped to this host, so the resulting parent and user distribution
    reflects how this specific sqlcmd usage has historically run here rather than generic sqlcmd volume. A database server
    with a nightly inventory or backup job shows a stable parent and a consistent service account. A first occurrence, a
    new parent, or a human account where automation normally runs is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
      - Image|endswith: \sqlcmd.exe
      - CommandLine|contains:
        - 'sqlcmd '
        - sqlcmd.exe
      selection_svr:
        CommandLine|contains: ' -S localhost '
      selection_query:
        CommandLine|contains:
        - sys.sysprocesses
        - master.dbo.sysdatabases
        - BACKUP DATABASE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts produced this same sqlcmd enumeration-and-backup activity in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection criteria with no host scope, so the result is a fleet-wide count of this
    specific sqlcmd usage rather than the binary's general footprint. A recurring set of database hosts producing it on a
    regular cadence points to a standard inventory or backup script; a single host, or a group of hosts that share no
    database role, points to operator-driven activity. Weigh the host list against which systems are supposed to run
    SQL Server at all.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
      - Image|endswith: \sqlcmd.exe
      - CommandLine|contains:
        - 'sqlcmd '
        - sqlcmd.exe
      selection_svr:
        CommandLine|contains: ' -S localhost '
      selection_query:
        CommandLine|contains:
        - sys.sysprocesses
        - master.dbo.sysdatabases
        - BACKUP DATABASE
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user produced this sqlcmd enumeration-and-backup activity before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection criteria scoped to this user, so the result is that account's 90-day history of
    this specific usage, grouped by host. A DBA or backup service account with a long record across the database estate
    reads differently from an account that has never touched sqlcmd, or one that has but is now producing the activity on
    hosts outside its normal scope. Weigh the count and the host spread against what the account is provisioned to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
      - Image|endswith: \sqlcmd.exe
      - CommandLine|contains:
        - 'sqlcmd '
        - sqlcmd.exe
      selection_svr:
        CommandLine|contains: ' -S localhost '
      selection_query:
        CommandLine|contains:
        - sys.sysprocesses
        - master.dbo.sysdatabases
        - BACKUP DATABASE
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven this sqlcmd activity, or is the launch mechanism new?
  context: >-
    When the alert fires under a service principal such as SYSTEM, a computer account, or a SQL Server service identity,
    the user field does not attribute the behavior and the launch mechanism becomes the meaningful pivot. The query mirrors
    the rule's selection criteria scoped to the alerting parent process, giving that parent's 90-day history of driving
    this specific usage, grouped by host. A parent already accounting for hundreds or thousands of prior events is
    scheduled maintenance; a parent that is new for this activity is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
      - Image|endswith: \sqlcmd.exe
      - CommandLine|contains:
        - 'sqlcmd '
        - sqlcmd.exe
      selection_svr:
        CommandLine|contains: ' -S localhost '
      selection_query:
        CommandLine|contains:
        - sys.sysprocesses
        - master.dbo.sysdatabases
        - BACKUP DATABASE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    If the account is being operated rather than running its normal automation, its activity in the surrounding hour
    usually spans more than one host — remote execution, credential tooling, archivers, or transfer utilities alongside
    the database access. If the alert fired under SYSTEM or a machine account, expect this to return routine agent
    telemetry and rely on the parent-process history instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven sqlcmd activity fire on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host rather than an
    answer. The query instead mirrors the rule's selection criteria scoped to the alerting parent process, fleet-wide,
    within the alert window. Several hosts in the same hour points to a scheduled or pushed job running across the
    database estate; a single host points to a host-local trigger, which is what operator-driven collection looks like.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_tools:
      - Image|endswith: \sqlcmd.exe
      - CommandLine|contains:
        - 'sqlcmd '
        - sqlcmd.exe
      selection_svr:
        CommandLine|contains: ' -S localhost '
      selection_query:
        CommandLine|contains:
        - sys.sysprocesses
        - master.dbo.sysdatabases
        - BACKUP DATABASE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What recovery-inhibiting commands ran on this host after the database was enumerated?
  context: >-
    Collection of database content commonly precedes encryption, and the encryption stage is normally preceded by removal
    of the recovery paths: shadow copy deletion (vssadmin, wmic), boot recovery disabling (bcdedit), backup catalog
    deletion (wbadmin), and Windows Recovery Environment disabling (reagentc). This query surfaces those commands on the
    host across the following day. Verify state directly on the host with vssadmin list shadows, bcdedit /enum, reagentc
    /info, and wbadmin get versions, and confirm offline or off-site backup status through the backup system itself.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host in the surrounding window?
  context: >-
    Ransomware operations chain actions rather than run a single one: shadow copy deletion, recovery disabling, security
    service stops, file permission changes, and event log clearing tend to appear together within minutes. Aggregating
    these binaries around the alert shows whether the sqlcmd run sits inside such a sequence or stands alone; a cluster of
    them under the same account inside the window is the pattern to look for, while an isolated sqlcmd invocation on a
    database server points back toward maintenance.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Are there signs of encryption activity or unfamiliar binaries executing on this host after the database access?
  context: >-
    Data collection and recovery destruction typically precede encryption by minutes. This query lists processes on the
    host across the following half hour with the common system paths filtered out, which surfaces unknown executables,
    binaries running from temporary or user-writable directories, and command interpreters launching unfamiliar payloads.
    Ransom notes and mass file renames are not visible here and should be checked separately through file activity records
    for the same window.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is this same sqlcmd database-dumping activity firing on other hosts in the environment?
  context: >-
    Operators run the same collection commands against every reachable database host, often inside the same hour.
    Searching this detection across the estate gives the affected host count and the first-to-last timeline, which sets
    the containment boundary and shows whether the activity is still moving. A wide spread across hosts that all run
    SQL Server, driven by one account, describes a different response than a single isolated hit.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
  answer_sources:
  - process_creation
  - alert
