name: Potential Persistence Via Security Descriptors - ScriptBlock
id: 443fd05e-f85c-430d-88d4-a69f5b6dbf90
description: >-
  Detects PowerShell script blocks (Script Block Logging, Event ID 4104) whose content
  combines all five security-descriptor manipulation components (win32_Trustee, win32_Ace,
  .AccessMask, .AceType, .SetSecurityDescriptor) with at least one of the Lsa boot-key
  registry paths (\Lsa\JD, \Lsa\Skew1, \Lsa\Data, \Lsa\GBG). Rewriting the DACL on these
  keys grants a chosen user or group remote read access to the material from which the boot
  key is derived, a persistence backdoor that enables later remote retrieval of
  machine-account and SAM hashes and domain cached credentials without membership in the
  local administrators group; setting the descriptor requires administrator rights, and
  authorized security-assessment or ACL-audit tooling is the narrow legitimate context. The
  investigation should recover the full script, identify the trustee granted access and the
  objects modified, establish who launched the block and whether the keys were touched, and
  check whether the pattern is new to the user, the host, and the fleet.
type: detection
detection_id: 2f77047c-e6e9-4c11-b088-a3de399524cd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain the security-descriptor functions and Lsa key paths this rule detects?
  context: >-
    The rule fires when a script block contains all five security-descriptor manipulation
    components (win32_Trustee, win32_Ace, .AccessMask, .AceType, .SetSecurityDescriptor)
    together with at least one of the Lsa boot-key registry paths (\Lsa\JD, \Lsa\Skew1,
    \Lsa\Data, \Lsa\GBG). Long scripts are split across multiple 4104 events, so read every
    chunk of the alerting block and judge the match on the complete script, not the alerting
    fragment. Confirm the strings appear as working code that builds and applies a security
    descriptor rather than as inert text such as comments or documentation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this user and host expected to run PowerShell that rewrites security descriptors on registry keys?
  context: >-
    Changing permissions on the Lsa boot-key keys requires local administrator rights, and
    the legitimate contexts are narrow: authorized security assessments and ACL-audit
    tooling may touch descriptors, but hardening baselines and routine administration do
    not rewrite these keys. Check the user's role, the host's function, and the on-disk
    script path shown here against known administrative or assessment activity. Blocks
    logged under SYSTEM usually come from deployment or agent tooling; judge those by the
    host role and the script path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was there a change ticket, maintenance window, or documented approval for this security-descriptor change?
  context: >-
    Rewriting permissions on system registry keys is an administrative action that
    change-managed environments document, and authorized penetration tests or red-team
    engagements that use this pattern are normally scheduled and approved. A corresponding
    ticket, engagement record, or confirmation from the responsible administrator or team
    can close the alert quickly; the absence of any record for a change this uncommon
    leaves the activity unaccounted for and supports escalation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
    - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What does the reassembled script do, and what does any encoded or obfuscated content decode to?
  context: >-
    Reassemble every chunk of the block (sequence/total order) and read the complete
    script. The 4104 channel records what PowerShell actually compiles, so -EncodedCommand
    wrappers are already unwrapped; only in-script obfuscation (string concatenation,
    format operators, backtick escaping) still needs manual decoding. Identify which
    securable objects the script sets descriptors on, which trustee or SID the Win32_Trustee
    is built for, and what rights the AccessMask value encodes. Tooling that follows this
    pattern grants the chosen principal remote read access to the keys whose class data
    derives the boot key, enabling later retrieval of machine-account and SAM hashes and
    cached credentials from another host. Any hostnames, account names, or SIDs in the
    script are pivots for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Does the script exist on disk, and what process wrote it there?
  context: >-
    When the script block ran from a file, its path is recorded on the 4104 event. A
    descriptor-modification script in a user-writable or staging location (Temp, AppData,
    ProgramData, Downloads) implies a delivery step that wrote it; find the file-creation
    event to identify the process and account that staged it. No recorded path means
    interactive or in-memory execution, which for content like this is itself worth noting,
    since memory-only delivery of backdoor tooling is a deliberate evasion choice.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Was anything written to the Lsa boot-key registry keys on this host around the alert?
  context: >-
    The JD, Skew1, Data, and GBG keys under the Lsa control set hold the class data from
    which the boot key is derived; they are maintained by the operating system and normal
    software does not write them. The anchor here is content-derived from the rule's script
    patterns, since the alert itself carries no registry event to pivot on. A
    security-descriptor change is a permission rewrite rather than a value write and may
    emit no registry modification event, so an empty result does not show the keys were
    untouched; the decoded script remains the authority on what was targeted. Any write
    that does appear names the process and account that made it and is unusual on its own.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Lsa\JD'
          - '\Lsa\Skew1'
          - '\Lsa\Data'
          - '\Lsa\GBG'
      condition: selection
    fields:
      - TargetObject
      - EventType
      - Details
      - Image
      - User
  answer_sources:
  - manual_review
- question: Were PowerShell security controls bypassed or weakened before this script ran?
  context: >-
    Backdoor tooling of this kind is frequently preceded by disabling the controls that
    would catch it. Common precursors include AMSI bypass (AmsiUtils, amsiInitFailed),
    execution-policy overrides (-ExecutionPolicy Bypass, -ep bypass), real-time monitoring
    changes (Set-MpPreference, DisableRealtimeMonitoring), and downgrade to PowerShell
    version 2, which lacks script block logging. Any of these on the host in the preceding
    hour reads as preparation for the alerting block rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the PowerShell session spawn follow-on processes after the script block was logged?
  context: >-
    A 4104 event records script content, not outcome, and carries no process link, so this
    pivots by host, user, and time across children of the PowerShell hosts. A descriptor
    backdoor pays off later, often from another machine, but the same session frequently
    verifies the change with follow-on commands (reg.exe queries, permission checks),
    stages additional tooling, or installs further persistence, and those appear as child
    processes shortly after the block was logged. Under SYSTEM the user anchor is broad
    because deployment tooling shares it; weigh individual children rather than the raw
    count.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block. The function definitions for
    descriptor modification, the invocation that names the target and trustee, and
    privilege or environment checks often land as separate blocks in a short window, and
    surrounding blocks may contain the plaintext operands the alerting fragment lacks. The
    log.level column shows how complete this picture is: verbose events mean full Script
    Block Logging is on, while warning-only means the host records just the
    automatically-flagged subset.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
  answer_sources:
  - ps_script
- question: Is full script block logging enabled on this host, or only suspicious-content capture?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only automatically-flagged suspicious content (at warning level) when it
    is not. On a warning-only host this alert shows a fragment of the host's PowerShell
    activity, not all of it, and absence of other 4104 evidence is not absence of activity.
    The level distribution calibrates how much weight every other script-block query in
    this investigation can carry.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Setting a security descriptor on these keys requires administrator rights, so earlier
    privilege-escalation, credential-access, or defense-tampering detections on the host
    may show how that access was obtained and where the activity began. The alert timeline
    in the preceding hours helps reconstruct the stages that led up to the descriptor
    change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this exact script block run on this host before?
  context: >-
    The hash matches byte-identical content only, so zero history is strong evidence this
    exact script is new to the host, while a block that has recurred for months fits
    scheduled tooling, though routine automation has little reason to carry boot-key ACL
    modification code. A trivially edited variant hashes differently, so history says
    nothing about near-variants. On hosts without full Script Block Logging the history
    contains only automatically-flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Has this user previously produced this security-descriptor script pattern, and does that fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection scoped to this user, returning their 90-day
    history of script blocks that combine the security-descriptor components with the Lsa
    key paths, aggregated by host. Security engineers and authorized assessment teams may
    produce this pattern during ACL audits or red-team work; a first-ever occurrence from a
    user whose role involves neither reads differently. Weigh the count against what the
    user's job plausibly involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - win32_Trustee
        - win32_Ace
        - .AccessMask
        - .AceType
        - .SetSecurityDescriptor
        ScriptBlockText|contains:
        - \Lsa\JD
        - \Lsa\Skew1
        - \Lsa\Data
        - \Lsa\GBG
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have produced this script pattern in the past 90 days, and is the alerting host among them?
  always_include: true
  context: >-
    When the alert fires under SYSTEM or another service principal, user identity does not
    attribute behavior, and script block events carry no process identity to pivot on, so
    the pattern itself is the pivot. The query mirrors the rule's selection fleet-wide over
    90 days, aggregated by host. A pattern that routinely appears on many hosts fits
    deployed assessment tooling; one that has never appeared before, or only on this host,
    is the deviation worth chasing. Only hosts shipping the PowerShell channel (and, for
    non-flagged content, with full Script Block Logging enabled) can appear here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - win32_Trustee
        - win32_Ace
        - .AccessMask
        - .AceType
        - .SetSecurityDescriptor
        ScriptBlockText|contains:
        - \Lsa\JD
        - \Lsa\Skew1
        - \Lsa\Data
        - \Lsa\GBG
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  always_include: true
  context: >-
    If the same account was active on several hosts in this window, the descriptor change
    may be one step of movement between them, and a backdoor of this kind is often set on
    multiple machines in one pass; the per-host binary summary shows what else the account
    ran. When the alert fired under SYSTEM or another service principal this view fills
    with routine service activity, and the fleet-wide script-pattern question is the
    meaningful breadth check instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same script pattern fire on other hosts in this window, or is it isolated to this host?
  always_include: true
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host, which is the meaningful breadth check when user identity is a service principal
    and no process identity exists on this channel. Several hosts in the same window points
    to scheduled or pushed automation, which change records should corroborate, or to a
    scripted rollout of the same backdoor across machines; a single host points to a
    host-local trigger. Coverage is policy-gated per host, so absence elsewhere is weak
    evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains|all:
        - win32_Trustee
        - win32_Ace
        - .AccessMask
        - .AceType
        - .SetSecurityDescriptor
        ScriptBlockText|contains:
        - \Lsa\JD
        - \Lsa\Skew1
        - \Lsa\Data
        - \Lsa\GBG
      condition: selection
    fields:
    - host.name
  answer_sources:
  - ps_script
- question: Did this exact script block run on other hosts in the environment?
  context: >-
    Byte-identical content across many hosts points to deployment tooling, GPO logon
    scripts, or vendor agents; the same block on a small set of unrelated hosts is the
    distribution lateral movement produces. The hash matches this exact script only, so
    this complements the pattern-based fleet queries, and together they distinguish a
    pushed file from a technique in use. Only hosts that logged the block can appear, so
    absence elsewhere on a default-logging fleet is weak evidence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - ps_script
- question: Were other persistence mechanisms installed on this host around this activity?
  context: >-
    A security-descriptor backdoor is itself the persistence, but attackers rarely rely on
    a single mechanism. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions installed in the same window indicate deliberate stacking rather than an
    isolated administrative action. The aggregated view groups executions of the common
    persistence tools on this host within four hours either side of the alert.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
