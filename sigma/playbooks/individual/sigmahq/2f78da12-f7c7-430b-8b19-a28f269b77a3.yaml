name: Disable Windows Event Logging Via Registry
id: fbbd079e-30da-43e5-9a8e-598041f9e323
description: |
  Detects a registry modification that sets the Enabled value of a Windows event log channel
  (a key under ...\Microsoft\Windows\CurrentVersion\WINEVT\Channels\...) to DWORD 0x00000000,
  which turns off logging for that channel at the source. The rule excludes known-legitimate
  writers (wevtutil.exe, TiWorker.exe, svchost.exe, TrustedInstaller.exe) so it fires on
  channel-disabling writes that do not come from routine servicing. Disabling event logging is
  a defense-evasion tamper commonly performed just before other malicious activity, so the
  investigation should identify which channel and value were disabled, which process wrote the
  key, and what happened on the host while that channel was blinded.
type: detection
detection_id: 2f78da12-f7c7-430b-8b19-a28f269b77a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the targeted event log channel key and its value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact channel key path under WINEVT\Channels (TargetObject), the value data written to
    Enabled (Details, normally DWORD 0x00000000 when a channel is being turned off), and the
    writing process, against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Windows event log channel configuration keys?
  context: Legitimate channel changes come from a small set of servicing and administrative
    processes (wevtutil, TrustedInstaller, svchost) that the rule already excludes. A write to a
    channel's Enabled value from an interactive user, an unexpected account, or an unusual process
    is the profile worth scrutinising; when User is a machine account or missing, pivot on the
    writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which event log channel was set to Enabled=0, and is this a known logging-evasion location?
  context: The channel name embedded in the key path under WINEVT\Channels identifies exactly which
    stream of events was silenced -- Security, PowerShell/Operational, Windows Defender, Sysmon, or
    another channel. Setting a channel's Enabled value to zero suppresses that channel at the source,
    and the specific channel disabled (a security-relevant logger versus a noisy diagnostic one) sets
    the investigation priority.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process performed the write, and did it run with a visible command line?
  context: This surfaces the command line of the process that wrote the Enabled value. A console tool
    such as reg.exe or powershell.exe leaves the channel name and value in its arguments, whereas a
    direct registry-API write from a malware binary or a script host shows no descriptive command
    line -- the absence of tooling arguments is itself informative and shifts the focus to the binary
    that made the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What parent process launched the process that disabled the channel, and is that chain expected?
  context: The parent reveals how the writing process was invoked. A servicing or administrative parent
    (services.exe, an installer, a management agent) fits routine maintenance, while parents such as a
    script host, an Office application, or a freshly written binary point to scripted or hands-on
    tampering. If ParentProcessGuid is absent on the registry event, reconstruct lineage from the
    writing process's own creation event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was the disabled channel left off, or was its Enabled value later restored?
  context: A channel disabled only briefly around a specific action differs from one left silenced for
    persistence. Registry key and value deletions are not observable on this telemetry, so persistence
    is judged from the channel key's later modification history -- whether Enabled was set back to 1,
    and when -- rather than from a delete event. A value that stays at zero means the logging gap is
    still open.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is event logging for the affected channel currently restored, or is the host still blind on that stream?
  context: Tampering may be momentary or persistent. Confirm the channel's current Enabled state through
    host inspection or endpoint management before proceeding, because if the channel is still off the
    environment continues to lose those events and the gap should be closed as a remediation step. The
    redisplayed write event identifies which channel to check.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What executed on this host after the event log channel was disabled?
  context: Logging is usually disabled to hide what comes next -- payload execution, credential access,
    or lateral movement that would otherwise be recorded. Reviewing process activity in the window
    immediately after the write reveals what the blinded channel was meant to conceal. Correlate this
    window with the specific channel that was silenced, since only certain event types stop appearing
    while the rest of telemetry continues.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host in the same window?
  context: Operators who disable one channel frequently disable several protections at once -- clearing
    logs, stopping the event log or security services, deleting shadow copies, or turning off Defender
    and the firewall. Finding multiple tampering actions from the same user or process indicates a
    deliberate blinding sweep rather than a single isolated change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same session?
  context: Attackers who disable one event channel via the registry often modify several keys together
    -- disabling additional channels, setting Run keys for persistence, or changing Defender and
    firewall policy. Grouping registry writes on the host by key path and writing process in the
    surrounding window shows whether other channels were silenced or other configuration objectives
    were pursued alongside this one.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this event log channel key been modified before on this host?
  context: Channel Enabled values are set at provisioning and then rarely touched on a healthy host. A
    key with no modification history over the baseline period, or one whose only prior writes came from
    servicing processes, makes this write stand out; a key that changes routinely points toward a
    management or software-driven cause.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same channel key disabled on other hosts in the environment?
  context: The same channel disabled across many hosts can reflect a policy or software rollout, whereas
    a modification confined to this host looks targeted. Comparing the writing process and value data
    across hosts distinguishes a centrally managed change from host-specific tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the minutes around the write
    collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low
    counts, which is what points to the reconnaissance, escalation, or staging that surrounded the
    tampering.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- reconnaissance, credential access, or other evasion --
    may reveal the stages that preceded the logging change and help reconstruct the timeline. Defense
    tampering often lands in the middle of an operation rather than at its start, so prior alerts
    frequently frame why the channel was silenced.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the surrounding window?
  context: Disabling a logging channel is often paired with establishing a foothold while that channel is
    blind. Scheduled tasks, services, registry Run keys, and BITS jobs created in the same window suggest
    persistence was set up under cover of the reduced logging rather than as isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely -- dropping an executable or
    script into a Startup folder or a Run-key path establishes persistence without running a persistence
    tool. File-write telemetry captures these drops even when the channel silenced by this alert would
    have hidden the corresponding process or service creation.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
