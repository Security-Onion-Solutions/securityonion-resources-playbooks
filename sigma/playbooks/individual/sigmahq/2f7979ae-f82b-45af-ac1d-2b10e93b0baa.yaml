name: Potential DCOM InternetExplorer.Application DLL Hijack
id: cfc49e01-c2dc-4f90-8bc0-7b9e4f385fde
description: |
  Detects the System process writing a file named iertutil.dll into the Internet Explorer program folder,
  the DLL that the DCOM InternetExplorer.Application COM object loads into iexplore.exe. A write of this file
  by System usually means the file arrived over an administrative share (C$/ADMIN$) from a remote host and was
  landed to disk by the kernel/SMB path, which is the delivery half of a DCOM search-order hijack used for
  lateral movement. Legitimate iertutil.dll changes arrive through Windows servicing rather than a fresh remote
  copy, so the investigation should confirm the writer and remote source, verify whether iexplore.exe actually
  loaded the planted DLL, and determine what executed afterward.
type: detection
detection_id: 2f7979ae-f82b-45af-ac1d-2b10e93b0baa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path and creating process match what this rule detects?
  context: >-
    Confirm the alert is real by checking that the written file is iertutil.dll under the Internet Explorer
    folder and that the responsible process is System. A System-owned write to this specific hijack path is
    the trigger; a write by any interactive process or to a different path is a different event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to have iertutil.dll written into the Internet Explorer folder by System?
  context: >-
    A file landed by System into the Internet Explorer directory is characteristic of a remote SMB copy, not
    routine servicing. Because the writer is System, the User field is typically a machine or SYSTEM account and
    does not attribute a human actor; judge instead by whether this host normally receives DCOM/SMB administrative
    activity and whether Internet Explorer is even in use here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the planted iertutil.dll still on disk, or was it deleted or renamed after the alert?
  context: >-
    The DLL's post-alert lifecycle drives next steps. A payload still on disk can be retrieved, hashed, and
    inspected; a copy deleted or overwritten shortly after the write suggests cleanup after the load succeeded or
    a swap back to the legitimate library. Read the operation type on later events for this path to see what
    happened to the file.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the planted iertutil.dll the legitimate Microsoft library or a substituted payload?
  context: >-
    Retrieve the file from its on-disk path and inspect it in a safe environment. Compare its size, embedded
    strings, imports, and signing metadata against a known-good Microsoft iertutil.dll. A hijack DLL is usually
    unsigned or invalidly signed and exports only the handful of functions needed to proxy the load while running
    attacker code; a genuine servicing update is Microsoft-signed and matches the shipping library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did an Internet Explorer host process load this iertutil.dll, and what is its hash and signature?
  context: >-
    The hijack only succeeds when iexplore.exe actually loads the planted DLL from the Internet Explorer folder.
    This query looks for that module load and reads the loaded DLL's hash and signing status, which are recorded
    on the load event. Submit the hash to threat intelligence and check the signature; an unsigned or unknown
    iertutil.dll loaded from this path confirms the search-order hijack executed rather than a serviced library.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\Internet Explorer\iertutil.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: Has iertutil.dll been written into this Internet Explorer folder on this host before?
  context: >-
    A legitimate iertutil.dll is placed by the operating system at install and updated only through servicing,
    so repeated fresh writes of this file to the Internet Explorer path are unusual. Zero or very low historical
    counts mark this as a first-time arrival consistent with a remote drop rather than routine maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which remote host and account wrote iertutil.dll to this system over an administrative share?
  context: >-
    A System-landed write of this DLL is the disk side of a remote copy over an admin share such as C$ or ADMIN$.
    Detailed file-share auditing records the remote write with the source IP, the authenticating account, and the
    share name. Identify the source host and account and confirm whether it is a sanctioned administrative source;
    an unexpected origin writing to the Internet Explorer path is the lateral-movement pivot.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 5145
        RelativeTargetName|endswith: '\Internet Explorer\iertutil.dll'
      condition: selection
    fields:
      - SubjectUserName
      - IpAddress
      - ShareName
      - RelativeTargetName
- question: What host initiated the inbound SMB or DCOM connection, and is it an expected administrative source?
  context: >-
    DCOM-based delivery reaches the target over the RPC endpoint mapper on 135 with follow-on high ports, and the
    file copy rides SMB on 445. Inbound connections on these ports around the write identify the originating host.
    A connection from a known admin jump box reads differently than one from a workstation that should never
    initiate administrative sessions to this system.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes did the Internet Explorer host spawn after the DLL was loaded?
  context: >-
    A successful DCOM search-order hijack runs attacker code inside iexplore.exe, which typically launches
    follow-on tooling. Look for child processes of iexplore.exe in the minutes after the write, especially
    command interpreters and remote-execution helpers such as cmd.exe, powershell.exe, runonce.exe, or
    wmiprvse.exe. These children are the actual objective of the lateral-movement step.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\iexplore.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A remote copy that plants one hijack DLL often lands additional components in the same window. The file
    events sharing the alert's process identifiers reveal whether this was a single drop or a staged set of
    payloads, and enumerate what else needs to be reviewed on disk.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written into the Internet Explorer folder recently, and by which processes?
  context: >-
    The Internet Explorer program folder has a small set of processes that legitimately write there, and
    servicing writes come from trusted installer processes. Other recent arrivals in this directory show whether
    this is an isolated planted DLL or part of a broader tampering with the folder's contents.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Internet Explorer\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Have other hosts had this same iertutil.dll write in the past week, and does the spread look like coordinated automation or a targeted set?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the same
    System-written hijack DLL. Several hosts firing the same pattern in a short window points to a scripted
    rollout across the environment; a small targeted set points to hands-on lateral movement. Use the host
    distribution to gauge how far the activity has spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \Internet Explorer\iertutil.dll
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this account previously produced this iertutil.dll write pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to the alerting account, returning its 90-day history of this
    exact write pattern aggregated by host. Because the writer is System, this account is usually a machine or
    service identity; a first-time appearance of this pattern under it is more notable than a recurring one that
    aligns with routine servicing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \Internet Explorer\iertutil.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service identity, the launching mechanism attributes the behavior
    better than the account. This query mirrors the rule's selection scoped to the alerting program,
    returning the 90-day history of that program driving this specific write. A new or rare program for this
    pattern is the deviation worth chasing; a program already accounting for many prior events is servicing or
    platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \Internet Explorer\iertutil.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts can reveal lateral movement fanning out from a single
    identity. When the alert fires under SYSTEM or a machine account this view returns broad agent-telemetry
    volume, so weigh it alongside the parent-driven view rather than on its own.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven write pattern fire on other hosts in the same window?
  context: >-
    Under a machine or service identity, the account-wide view is dominated by routine agent activity, so the
    meaningful question is whether the same launching mechanism produced this write elsewhere at the same time.
    The query mirrors the rule's selection scoped to the alerting program across the fleet in the alert
    window. Multiple hosts in the same window points to pushed or scheduled automation; a single host points to
    a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \Internet Explorer\iertutil.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What process activity occurred on this host around the time of the write?
  context: >-
    A DCOM lateral-movement step leaves execution traces beyond the file write itself, such as RPC service
    processes, script hosts, and the Internet Explorer host process starting. Aggregating process activity in
    the surrounding window collapses routine noise into high-count rows while novel parent-child pairs stand out
    at low counts, which is what points to the follow-on execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Lateral-movement delivery is rarely the first step. Earlier detections on the same host, such as remote
    logons, credential access, or reconnaissance, may reveal how the operator reached this system and help
    reconstruct the sequence that led to the DLL being planted.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
