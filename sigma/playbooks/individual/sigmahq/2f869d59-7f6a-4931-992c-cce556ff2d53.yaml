name: Potential Adplus.EXE Abuse
id: e259047a-d160-4da2-b95a-42fdee44ccce
description: |
  Detects execution of adplus.exe, a Windows SDK debugging tool, with command-line flags that drive process attachment
  and memory dumping or arbitrary command execution under a trusted Microsoft-signed binary. The rule fires when the image
  is adplus.exe (by name or original filename) AND the command line carries one of the process/dump/config flags. Because
  adplus can dump lsass.exe memory and run commands via a config file, the central question is whether this is a developer
  debugging a process or an operator staging credential theft under cover of a signed binary.
type: detection
detection_id: 2f869d59-7f6a-4931-992c-cce556ff2d53
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, naming adplus.exe with one of its process or config flags?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the image is
    adplus.exe (or its original filename) AND the command line contains one of the process-attach or config flags such as
    -hang, -pn, -pmn, -p, -po, -c, or -sc. Read the exact command line and confirm which flag fired and what process or
    config file it points at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a debugging tool against process memory?
  context: Legitimate adplus usage comes from developers, support engineers, or crash-analysis tooling. Knowing whether the
    user role and host function involve debugging is often the fastest way to separate routine diagnostics from an operator
    using a signed debugger to scrape credentials.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process was adplus targeting, and was lsass.exe the dump target?
  context: Adplus attaches to a process by name (-pn) or PID (-p/-pmn) and writes a memory dump, or runs a config file (-c)
    that can dump memory or execute commands. The dump target determines exposure. An adplus invocation naming lsass.exe is
    a direct credential-store hit; a config-file invocation hides the target inside the referenced .xml, so the config path
    itself must be retrieved and read. Decode the flag and its argument to identify exactly what was attached to or executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the adplus process itself, or a child it spawned, write a file to disk consistent with a process-memory dump?
  context: Memory dumping requires opening a handle to the target process, but that handle open has no equivalent
    telemetry in this environment, so a zero result there is not evidence the dump did not happen. What can be
    observed is the artifact a completed dump leaves on disk. This view is scoped tightly to the alerting adplus
    process and its own children, distinct from the broader host-wide dump-file search below, so a hit here ties a
    written file directly to this adplus execution rather than to unrelated activity elsewhere on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a memory dump file written on this host shortly after the alert, and where?
  context: A successful dump leaves a file on disk. Adplus writes to an output directory passed with -o, commonly under
    user-writable or temp locations such as %TEMP% or C:\Windows\Temp. A new .dmp or large binary written to such a path
    in the minutes after the alert corroborates that memory was actually captured and tells the responder what to contain
    and where the credentials now reside.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_ext:
        TargetFilename|endswith:
          - .dmp
          - .dump
      condition: selection and filter_ext
    fields:
      - Image
      - TargetFilename
      - User
- question: Did other known credential-dumping command patterns run on this host around the same time?
  context: Adplus is one of many ways to reach lsass. Operators frequently chain or fall back to other dumpers, so nearby
    use of comsvcs.dll MiniDump, procdump, rundll32 against lsass, or PowerShell mimikatz-style cradles raises confidence
    that this is staged credential theft rather than isolated debugging. This surfaces those adjacent command structures on the
    same host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cli:
        CommandLine|contains:
          - 'comsvcs.dll'
          - 'MiniDump'
          - 'procdump'
          - 'lsass'
          - 'Invoke-Mimikatz'
          - 'sekurlsa'
      condition: selection and selection_cli
    fields:
      - Image
      - CommandLine
      - User
- question: What process spawned adplus and is that parent chain expected for a debugging tool?
  context: The parent process reveals how adplus was invoked. Interactive debugging typically descends from explorer.exe,
    a console host, or a development tool. Parents such as wscript.exe, mshta.exe, a web shell, or an Office application
    point to scripted or exploitation-driven launch rather than a developer at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did adplus spawn afterward?
  context: With the -sc and -c flags, adplus can launch arbitrary commands and binaries from the context of a signed
    debugger. Children such as cmd.exe, powershell.exe, certutil.exe, or unexpected binaries indicate the tool was used for
    execution rather than, or in addition to, memory capture.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run adplus?
  context: Adplus ships with the Windows SDK Debugging Tools and is absent from most production endpoints. Zero or very low
    historical counts indicate first-time or rare execution and raise the weight of every other deviation; routine appearance
    on a developer or build host lowers it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even a legitimately installed debugger can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \adplus.exe
      - OriginalFileName: Adplus.exe
      selection_cli:
        CommandLine|contains:
        - ' -hang '
        - ' -pn '
        - ' -pmn '
        - ' -p '
        - ' -po '
        - ' -c '
        - ' -sc '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \adplus.exe
      - OriginalFileName: Adplus.exe
      selection_cli:
        CommandLine|contains:
        - ' -hang '
        - ' -pn '
        - ' -pmn '
        - ' -p '
        - ' -po '
        - ' -c '
        - ' -sc '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \adplus.exe
      - OriginalFileName: Adplus.exe
      selection_cli:
        CommandLine|contains:
        - ' -hang '
        - ' -pn '
        - ' -pmn '
        - ' -p '
        - ' -po '
        - ' -c '
        - ' -sc '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user drove similar debugging or dumping activity on several hosts, the scope of compromise may be larger than
    this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \adplus.exe
      - OriginalFileName: Adplus.exe
      selection_cli:
        CommandLine|contains:
        - ' -hang '
        - ' -pn '
        - ' -pmn '
        - ' -p '
        - ' -po '
        - ' -c '
        - ' -sc '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege of the accounts whose secrets were in lsass at dump
    time. Domain admin or service-account credentials require incident escalation; a standard user account may only need
    monitoring. Cross-reference the accounts active on this host with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    privilege escalation — may reveal the stages that preceded a credential-dump attempt and help reconstruct the full
    timeline leading to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
