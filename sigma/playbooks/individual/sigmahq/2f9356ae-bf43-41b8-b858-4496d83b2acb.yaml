name: ISO File Created Within Temp Folders
id: 7fe71c46-72c6-4d7a-97db-f837e1a943bf
description: |
  Detects creation of an .iso file in a Windows temporary location — either an .iso extracted from a downloaded .zip
  into a user %LOCALAPPDATA%\Temp path, or an .iso saved into the Outlook attachment cache (Content.Outlook). The rule
  fires when EITHER branch matches. Disk images and other container formats are used to smuggle payloads past
  Mark-of-the-Web protections: files mounted or extracted from a container are treated as local and run without the
  SmartScreen and Protected-View restrictions applied to files tagged as internet-downloaded. Investigation should
  determine which process wrote the .iso, whether it was mounted and its contents executed, and what any executed
  payload did afterward.
type: detection
detection_id: 2f9356ae-bf43-41b8-b858-4496d83b2acb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: 'Was an .iso file written either into a Local\Temp path that also contains an extracted .zip, or into the Outlook attachment cache?'
  context: 'Before investing investigation time, confirm the alert is a true positive and note which branch fired. One branch is an .iso landing in a user %LOCALAPPDATA%\Temp path whose path also contains a .zip folder (an .iso extracted from a downloaded archive); the other is an .iso written into the Outlook Content.Outlook attachment cache. The delivery path differs between the two, so the email-versus-download questions carry different weight downstream. Review the exact file path and the responsible process against the rule''s criteria.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'Is this user and host expected to receive or extract .iso container files into temporary folders?'
  context: 'Legitimate activity — a sysadmin opening a .zip that contains an .iso, or software that ships disk images — can trigger this detection. Knowing whether this user and host routinely handle .iso attachments is often the fastest way to separate a benign extraction from a delivery attempt. The User field on a file write is frequently a machine or service account, so judge by the writing process and host role when user identity is not attributable.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'What email or download produced the .iso, and which process wrote it?'
  context: 'A container dropped into a Temp or Outlook cache folder usually arrives as a mail attachment or a browser download. The writing process identifies the vector — a mail client writing into Content.Outlook points to an attachment opened from email, while a browser writing into %LOCALAPPDATA%\Temp points to a web download or an archive extraction. Identifying the sender or source enables blocking at the perimeter and finding other recipients. Sender allowlists live in mail-gateway logs, not endpoint telemetry, so pair this with a review of inbound mail for the same attachment.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: 'Is the .iso still on disk, or was it deleted or renamed after the alert?'
  context: 'The container''s post-alert lifecycle drives next steps. An .iso still on disk can be retrieved, mounted in a safe environment, and its contents hashed; an .iso deleted seconds after creation suggests cleanup after the payload was mounted and run. Interpret the operation type recorded on each subsequent event for this path.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: 'What is inside the .iso — what files does the container hold?'
  context: 'A container delivered for Mark-of-the-Web bypass typically hides an executable, a script, or a shortcut (.lnk) that launches a signed proxy binary. Mount the .iso in a safe environment and enumerate its contents; look for a .lnk that invokes cmd.exe, rundll32.exe, or regsvr32.exe, a sideloaded DLL sitting next to a legitimate signed .exe, or a decoy document. The file-write event itself carries no hash, so content analysis requires retrieving the .iso from its on-disk path.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: 'Was the .iso mounted and did any process execute from it after it was written?'
  context: 'Mounting an .iso exposes its contents on a virtual drive letter, so a contained payload runs from that drive rather than from the .iso path — matching execution by the .iso filename may return nothing even when the container was opened. If so, pivot to processes launched from an unusual or newly-appeared drive letter in the window after creation, and to signed proxy binaries (rundll32.exe, regsvr32.exe) or script hosts spawned shortly after. Execution is what turns a delivered container into code running on the host.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: 'If a payload from the .iso has executed, what is its hash and does it have known detections?'
  context: 'A file''s hash is recorded when it runs, not when it is written. Once content analysis identifies the payload name inside the container, match its execution and read the hash, then check it against threat intelligence to determine whether it is known malicious, benign, or previously unseen. If the payload has not executed, retrieve it from the mounted or on-disk path and hash it manually.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: 'After the .iso was written, did new outbound connections appear from this host?'
  context: 'A container-delivered payload that runs typically reaches out to command-and-control shortly after execution. New egress to unfamiliar external destinations in the hours after the .iso appeared — especially from processes that do not normally initiate connections — corroborates that the payload executed and identifies infrastructure to block and hunt for on other hosts. High-count destinations that predate the alert are the host''s normal traffic.'
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: 'What other files did the writing process create or delete around the alert?'
  context: 'A process that drops one container often drops or extracts several files — an archive unpacking components, a mounted payload staging its own artifacts. The breadth, paths, and extensions of the writing process''s other file activity distinguish an isolated download from an unpacking or staging sequence and enumerate what else needs review. This covers the writer and its direct child processes.'
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: 'What else has been written to the Temp folder recently, and by which processes?'
  context: 'Location drives suspicion for dropped files. A user %LOCALAPPDATA%\Temp path and the Outlook attachment cache each have a small set of processes that legitimately write there. Other recent arrivals in the same directory — additional containers, extracted executables, or scripts — reveal whether this is an isolated drop or a location under active use, and which artifacts belong to the same activity. A single unfamiliar writer across many files is the signal.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: 'Has an .iso with this name been seen before on this host?'
  context: 'A container file that has never appeared on a host is more suspicious than one that recurs as part of normal operations. Zero or very low historical counts for this filename indicate a first-time arrival; a filename that recurs may be a legitimately distributed image. Delivered payloads often use plausible but unique filenames, so treat a novel name as a point of interest rather than proof on its own.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: 'Has this user produced this .iso-in-Temp pattern before, and does that history fit their role?'
  context: 'This counts the user''s 90-day history of the rule''s specific firing pattern — an .iso written to these temp locations — not generic file activity, aggregated by host. A user who has never produced this pattern is more suspicious than one who does so routinely. Weigh the count against the user''s role and whether handling disk images is normal for them.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip\
        TargetFilename|endswith: .iso
      selection_2:
        TargetFilename|contains: \AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\
        TargetFilename|endswith: .iso
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: 'Has the writing process historically produced this .iso-in-Temp pattern on this host or across the environment, or is it new for this activity?'
  context: 'When the alert fires under a machine or service account, user identity does not attribute the behavior — the meaningful pivot is the launch mechanism. This counts the 90-day history of this program driving the exact firing pattern, aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip\
        TargetFilename|endswith: .iso
      selection_2:
        TargetFilename|contains: \AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\
        TargetFilename|endswith: .iso
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: 'What else did this user do across the environment around the time of the alert?'
  context: 'Tracking the user''s activity across all hosts in the alert window reveals whether the same account was active on multiple endpoints, which would widen the scope. This asks what the user did right now across the network, distinct from their long-term baseline. When the alert fires under a service or machine account this view returns broad agent-telemetry noise, so weigh it alongside the launch-mechanism view.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: 'Did this same writing-process pattern fire on other hosts in the same window, or is it isolated to this host?'
  context: 'Under a service or machine account, asking what the user did network-wide returns agent-telemetry noise. The meaningful question is whether the same launch mechanism produced this .iso-in-Temp pattern elsewhere in the alert window. Multiple hosts at once points to scheduled or pushed automation or a broad delivery wave; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_1:
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip\
        TargetFilename|endswith: .iso
      selection_2:
        TargetFilename|contains: \AppData\Local\Microsoft\Windows\INetCache\Content.Outlook\
        TargetFilename|endswith: .iso
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: 'What other process activity occurred on this host around the time of the alert?'
  context: 'The container write rarely happens in isolation. Process activity on the host in the surrounding window reveals what led to the write and what followed — a mail client or browser opening the attachment, a mount operation, or a payload launching afterward. Novel parent-child pairs at low counts are what to scan for; repetitive agent telemetry collapses into high-count rows.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: 'Did other detections fire on this host in the hours before this alert?'
  context: 'Earlier detections on the same host — reconnaissance, prior delivery attempts, or defense tampering — may reveal the stages that preceded this container write and help reconstruct the timeline. The sequence of alerts on a host often tells the fuller story.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: 'Did this same detection fire for other users or hosts?'
  context: 'Delivery attempts rarely target a single user. If one user received a container-bearing attachment, others likely did too. The same rule firing across other hosts reveals the breadth of the delivery and identifies additional systems that need investigation.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
