name: Network Connection Initiated via Finger.EXE
id: ef5a47b6-c1c7-4656-957a-3bba07471dfa
description: |
  Detects finger.exe initiating an outbound network connection. The finger client is effectively unused on
  modern Windows endpoints, but it can be abused as a living-off-the-land binary to retrieve attacker-supplied
  text over the finger protocol (TCP/79) and pipe that output straight into a command interpreter for execution,
  or to move data outbound. Because legitimate finger activity is rare, any finger.exe network connection is
  worth confirming. Establish the destination and its reputation, decode the finger command line (the queried
  user@host encodes the remote target), identify the parent process and any command interpreter that consumed
  finger's output, and determine whether follow-on download or execution occurred.
type: detection
detection_id: 2fdaf50b-9fd5-449f-ba69-f17248119af6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and port match what this rule detects, and which process initiated the connection?
  context: Confirm the alert by reviewing the exact destination IP and port, the connection direction, and that
    finger.exe is the initiating process, against the rule's detection criteria. finger.exe making any outbound
    connection is the core trigger, so the destination and direction are the first facts to establish.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to run the finger client and make outbound finger connections?
  context: Legitimate finger usage is essentially nonexistent on modern Windows endpoints, so a user or host with
    no administrative or diagnostic reason to run finger.exe is a strong signal. Knowing the host role and the
    account quickly separates rare legitimate use from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did finger.exe query? Decode the finger command line and the queried user@host target.
  context: The finger command line carries the remote target as user@host, for example root@example.tld. The host
    portion is the server contacted over TCP/79, and the returned text is often piped directly into a command
    interpreter. Decoding the full command line reveals the destination the operator chose and any piping into
    cmd.exe or powershell.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is this destination, and what do DNS, WHOIS, and threat intelligence reveal about it?
  context: Investigate the destination address using passive DNS history, domain registration age, and known
    threat-intel hits. Recently registered domains or infrastructure with no legitimate business purpose point to
    attacker-controlled finger servers used to stage remote commands. The destination hostname is frequently
    blank on connection events, so anchor on the IP and pivot through the DNS lookup for the domain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process spawned finger.exe, and is that parent chain expected?
  context: finger.exe is rarely launched interactively. In LOLBIN abuse it is typically spawned by a command
    interpreter that was itself started from a browser, script host, or Office application as part of a
    copy-and-paste lure. An unexpected parent such as cmd.exe launched by a browser, mshta.exe, or wscript.exe
    points to abuse rather than an administrator running finger by hand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this host run finger.exe before, and how often?
  context: A binary that has never executed on a host is more suspicious than one that runs on a schedule.
    finger.exe should show zero or near-zero historical executions on a typical Windows endpoint, so any prior
    count above baseline noise is itself worth explaining.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously initiated finger connections, what programs and users drove that activity,
    and does the current alert fit that pattern?
  context: The query mirrors the rule's selection (finger.exe initiating a connection) scoped to this host. The
    resulting program and user distribution reflects how finger network activity has historically run here. Any
    fire against a near-empty history, or an unexpected user account, is the anomaly worth chasing; network
    events lack parent lineage, so pivot to finger.exe's start event to see what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \finger.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Did finger.exe directly spawn any child process?
  context: The finger client does not normally spawn child processes. Any process whose parent is finger.exe is
    abnormal and may represent execution of content returned over the finger session. Compare any children against
    the fetched-command execution path, such as a command interpreter, curl.exe, or a renamed downloader.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What commands ran on this host in the minutes after finger returned its output, and are any of them
    encoded or obfuscated?
  context: In finger-based LOLBIN abuse the retrieved text is piped into a command interpreter that runs as a sibling
    of finger.exe under the same parent shell. That sibling cannot be isolated from this telemetry, because a
    network-connection event does not record the acting process's parent, so this is an aggregated survey of
    process starts on the host in the 10 minutes after the alert, grouped by image and command line. Routine
    system noise collapses into high-count rows; the fetched payload stands out as a novel low-count entry -
    directory creation under %TEMP% or C:\Users\Public, a renamed curl.exe used to download an archive, or
    command chaining with && and ^. Encoded or obfuscated arguments here indicate the fetched commands were
    staged to evade inspection.
  range: +10m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts initiated finger connections in the past week, and does the cross-host distribution
    look like automation or isolated activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of finger.exe
    network activity. finger is rare enough that any second host firing the same pattern is meaningful. Several
    hosts point to a scripted or lure-driven operation, while a single host points to isolated operator activity.
    Use this to size the potential intrusion.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \finger.exe
      condition: selection
    fields:
    - host.name
- question: Has this host communicated with this destination before?
  context: First contact with a destination is more suspicious than routine communication. If this host has no
    prior connection history to the address finger reached, that supports newly staged attacker infrastructure
    rather than a known internal or business service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Have other hosts in the environment connected to this same destination address?
  context: Part of the value of this detection is surfacing attacker infrastructure. Counting which hosts reached
    the same destination separates a single-host event from shared infrastructure contacted across the fleet, and
    any additional host contacting the finger server is a candidate for the same lure or command retrieval.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
- question: After finger connected, what other outbound connections did this host initiate, and did any fetch a
    remote payload?
  context: The finger LOLBIN chain typically ends in a download, where the fetched commands copy or rename curl.exe
    and pull an archive disguised as another file type from a second server. Reviewing outbound connections from
    the host in the hours after the finger activity can reveal that download stage and the second-stage
    infrastructure.
  range: +2h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in a tight window around the finger
    connection surfaces the lure execution that preceded it and the payload execution that followed, while
    collapsing routine agent telemetry into high-count rows. Novel parent-child pairs at low counts are what to
    scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, defense tampering, or a suspicious parent
    execution, may reveal the stages that preceded the finger connection and help reconstruct the intrusion
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
