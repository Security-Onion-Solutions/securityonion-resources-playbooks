name: Onyx Sleet APT File Creation Indicators
id: 220cf83b-daf6-40eb-93ec-5feb93222105
description: |
  Detects creation of a file whose path ends in \Windows\ADFS\bg\inetmgr.exe. This path and
  filename are associated with the HazyLoad proxy tool that the Onyx Sleet actor stages on
  compromised hosts, where the binary reuses the name of the legitimate IIS Manager executable
  (inetmgr.exe normally lives under System32\inetsrv, not under the ADFS directory). Investigation
  should confirm which process wrote the file, whether the dropped binary subsequently executed or
  began proxying traffic, and whether related staging, account-creation, or discovery activity
  occurred on the host.
type: detection
detection_id: 2fef4fd9-7206-40d1-b4f5-ad6441d0cd9b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file path and the writing process match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path, the operation performed,
    and the responsible process against the rule's detection criteria. The rule fires on any file
    created at a path ending in \Windows\ADFS\bg\inetmgr.exe, a location tied to staged proxy tooling
    rather than the legitimate IIS Manager binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and account expected to have an executable created under the ADFS directory?
  context: >-
    Legitimate ADFS servers do not normally receive executables written to \Windows\ADFS\bg\. Knowing
    whether the host is an ADFS server and whether the writing account routinely stages binaries there
    distinguishes routine servicing from an implant drop. When the account is a machine or service
    principal, judge by the writing process and host role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this file drop part of an authorized penetration test or red team engagement?
  context: >-
    Offensive-security assessments occasionally stage tooling that mimics known actor artifacts.
    Before deeper analysis, check whether a red team exercise is active on this host or segment; an
    authorized engagement with matching timing resolves the alert. A drop that reproduces this actor's
    exact path and filename outside a sanctioned test is unlikely to be benign.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the created binary the legitimate IIS Manager executable or a masqueraded payload?
  context: >-
    The dropped file uses the name inetmgr.exe but sits under \Windows\ADFS\bg\ rather than
    System32\inetsrv, where the genuine IIS Manager binary lives. Retrieve the file and compare its
    size, digital signature, and embedded strings against a known-good inetmgr.exe. The HazyLoad proxy
    loads and decrypts an embedded PE resource into memory, so an unsigned or oversized binary with
    network-related strings points to the implant rather than the legitimate system binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did the process that created this file do, and what were its command-line arguments?
  context: >-
    The writing process and its command line reveal how the file arrived. A PowerShell download
    cradle, a script host, or an interactive shell each imply a different delivery path. Decode any
    encoded arguments, URLs, or paths to understand the staging step that produced the artifact.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that wrote this file, and is that parent chain expected?
  context: >-
    The parent of the writing process shows how the drop was initiated. A drop staged by a service
    account tied to a public-facing application (for example a build or federation service) is
    consistent with exploitation of that service, whereas an interactive shell parent points to
    hands-on-keyboard activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If this binary has executed, what is its hash and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so file-creation events carry no
    hash. This query looks for the binary executing from its dropped path and reads its hash; submit
    that hash to reputation and threat-intel sources to determine whether it is known tooling. If the
    file is present but has not executed, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Was the dropped binary executed after it was created, and what did it do?
  context: >-
    Progression from file drop to execution is the pivot from staging to active use. If the binary
    ran, its command line and child activity indicate whether it began proxying traffic or
    establishing persistence; if it never executed, the investigation shifts to how it was staged and
    whether it was removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A binary still on disk can be retrieved,
    hashed, and analyzed; a file deleted seconds after creation suggests cleanup or a self-removing
    stager and shifts focus to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that stages one implant component often writes several — a loader, an encrypted config,
    or a scheduled-task helper. The breadth and locations of the writing process's other file activity
    enumerate what else needs review and distinguish a single artifact from a staged toolset.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the \Windows\ADFS\bg directory recently, and by which processes?
  context: >-
    The \Windows\ADFS\bg\ directory has a small set of processes that legitimately write there. Other
    recent arrivals in the same location reveal whether this is an isolated drop or a staging directory
    under active use, and which co-located files belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\ADFS\bg\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a file with this name and path been seen before on this host?
  context: >-
    A binary appearing for the first time at this ADFS path is more notable than one present across
    prior baselines. Zero or very low historical counts indicate a first-time drop rather than an
    existing, expected file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has the same file path been created on any other hosts in the environment?
  context: >-
    Finding the same drop path on multiple hosts indicates broader staging or lateral movement; a
    single host suggests a targeted drop. Where multiple hosts show the artifact, establish the
    distribution timeline and whether a common process or account is responsible.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this account previously produced this file-creation pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's file-creation pattern scoped to the alerting user over 90 days,
    aggregated by host. An account that has never staged a binary at this path is more notable than
    one that does so routinely; weigh the count against whether the account has any legitimate reason
    to write to the ADFS directory.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: :\Windows\ADFS\bg\inetmgr.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this file-creation pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior; the launch mechanism does. This query mirrors the rule's pattern scoped to the alerting
    program over 90 days. A new or rare program for this drop is the deviation worth chasing,
    while a program that already accounts for many prior events is likely established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: :\Windows\ADFS\bg\inetmgr.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across hosts in the alert window reveals whether the drop is part
    of wider hands-on activity — discovery commands, account creation, or additional staging — or an
    isolated event. Concentrated activity across multiple hosts widens the likely scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven file-creation pattern fire on other hosts in the alert window, or is it isolated to this host?
  context: >-
    Under a machine or service account, activity clustered by user returns agent-telemetry noise, so
    the meaningful pivot is the launch mechanism. This query checks whether the same program
    produced this drop pattern on other hosts in the same window; multiple hosts point to pushed or
    scheduled automation, a single host to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: :\Windows\ADFS\bg\inetmgr.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Staging of a proxy tool rarely happens in isolation. Earlier detections on the same host —
    exploitation of a public-facing service, credential access, or discovery activity — help
    reconstruct how the actor reached the point of dropping this binary.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
