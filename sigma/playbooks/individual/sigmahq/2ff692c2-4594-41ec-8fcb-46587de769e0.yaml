name: CrashControl CrashDump Disabled
id: 56fc2846-6664-4131-99eb-3ff4ed3a62de
description: |
  Detects a registry write that disables Windows memory crash dump generation by setting a value under
  SYSTEM\CurrentControlSet\Control\CrashControl (typically CrashDumpEnabled) to DWORD 0 (0x00000000).
  Administrators occasionally disable crash dumps to reclaim disk space or during troubleshooting, so the
  change can be legitimate. It is also an anti-forensics and recovery-inhibition step that destructive
  malware performs before wiping or encrypting a host, removing memory-capture evidence and impeding
  post-incident analysis. Determine which process and account made the change, whether it was authorized,
  and whether other tamper or destructive activity occurred on the host in the same window.
type: detection
detection_id: 2ff692c2-4594-41ec-8fcb-46587de769e0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact key path under CrashControl, the
    value data written (DWORD 0, which disables crash dump generation), and the writing process against
    the rule's detection criteria before investing further investigation time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to disable crash dumps or modify the CrashControl key?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role
    and host function make a crash-dump configuration change routine is often the fastest path to
    distinguishing a maintenance action from tampering. User attribution is present on most endpoint
    registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific CrashControl value was modified, and is this a known evasion or recovery-inhibition location?
  context: The CrashControl key governs memory dump behavior. Setting CrashDumpEnabled to 0 turns off
    kernel and complete memory dumps, which removes a source of forensic evidence and prevents crash
    diagnostics. The specific value name and data determine exactly which dump behavior was suppressed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value is being written to this key, and does it disable crash dump generation?
  context: Read the Details field to confirm the data set on the CrashControl value. A DWORD of 0 on
    CrashDumpEnabled disables memory crash dumps outright; other CrashControl values (AutoReboot,
    LogEvent, DumpFile) change dump handling in narrower ways. Confirm which value and data were written
    so the effect on host forensics is understood.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the CrashControl value re-applied, reverted, or modified again after the alert?
  context: Elastic Defend emits no registry key or value deletion events, so attacker cleanup of the
    change is not directly observable. Judge whether the tamper persisted by reviewing the key's
    re-modification history in the hours after the alert. A single write that is never reverted keeps
    crash dumps disabled; a later write restoring the value may indicate a test, a rollback, or an
    administrator undoing an unauthorized change.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is this parent expected to spawn this child? What started the parent?
  context: The writing process and its parent lineage reveal whether the change came from an allowlisted
    administrative tool (regedit.exe, msiexec.exe, a management agent) or from an abnormal chain such as
    a script host, an Office application, or an unsigned binary. Tracing the parent's own origin shows
    whether the registry write is part of a legitimate configuration action or a hands-on intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: An actor disabling crash dumps often changes several security-relevant keys together -- for
    example turning off defenses, deleting shadow-copy configuration, or setting persistence -- as part
    of preparing a host for destructive action. Registry changes clustered from the same writing process
    within a short window reveal whether the tamper was a single action or one step in a larger sequence.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the CrashControl key been modified before on this host?
  context: Crash dump configuration rarely changes on a stable host. A first-time or very rare
    modification is more suspicious than a key that changes on a regular schedule. Compare the value data
    across prior modifications to see whether this write matches a known baseline change or is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did destructive or recovery-inhibition activity follow this tamper on the host?
  context: Disabling crash dumps is frequently a precursor to impact. Look for execution of tools that
    delete backups or shadow copies, edit boot configuration, or wipe data in the hours after the change
    -- vssadmin, wbadmin, bcdedit, wmic, fsutil, and cipher are commonly used for this. Their appearance
    shortly after the tamper reframes the alert as part of an active destructive operation.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_impact:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wbadmin.exe'
          - '\bcdedit.exe'
          - '\wmic.exe'
          - '\fsutil.exe'
          - '\cipher.exe'
      condition: selection and selection_impact
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the alert reveals what
    led to the tamper and what happened after -- reconnaissance, privilege escalation, defense tampering,
    or execution of an unfamiliar binary. Novel parent-child pairs stand out at low counts against
    routine background telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was there a change ticket, maintenance window, or documented approval for disabling crash dumps?
  context: Many organizations require change records for modifications to system diagnostic and security
    settings. A corresponding ticket suggests authorized maintenance; the absence of one when policy
    requires it points toward unauthorized tampering. This check can quickly close a false positive or
    escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing crash dump settings consistent with how the organization normally manages this host?
  context: Configuration changes are commonly pushed through group policy, management tooling, or imaging
    workflows. A direct write to CrashControl from an interactive process or ad hoc tooling may indicate
    an admin taking a shortcut, or an attacker bypassing normal change mechanisms. Understanding the
    standard method helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with normal work hours and maintenance windows?
  context: Legitimate configuration changes usually occur during business hours or scheduled maintenance.
    A crash-dump-disabling write at an odd hour, outside any documented window, is more suspicious than
    the same action during a planned change. Consider the host's timezone and whether an automated job
    could account for the timing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other persistence mechanisms installed on this host in the same timeframe?
  context: Actors preparing a host for impact often stack persistence and staging tooling alongside
    defense tampering. Executions of scheduled-task, service, registry, and job-management utilities in
    the same window indicate deliberate footholding rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was the CrashControl key modified on other hosts in the environment?
  context: The same change across multiple hosts may indicate a group-policy rollout, widespread malware,
    or a coordinated push ahead of destructive activity. If only this host shows the modification, it may
    be targeted. Compare the value data across hosts to see whether the same setting was applied everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access,
    or lateral movement -- may reveal the attack stages that preceded the crash-dump change and help
    reconstruct the timeline. A cluster of tamper and impact alerts around this event points to an active
    operation rather than a routine configuration edit.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
