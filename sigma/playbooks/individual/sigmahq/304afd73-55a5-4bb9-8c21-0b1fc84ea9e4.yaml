name: PSEXEC Remote Execution File Artefact
id: 259d2166-6f5d-47bd-a0ea-96e552ded2a8
description: |
  Detects creation of the PSEXEC key file (PSEXEC-<source-host>-<8 chars>.key in C:\Windows), which
  PsExec v2.30+ writes on the target host whenever a remote PsExec session runs. The filename encodes the
  hostname that launched the session, making this artifact a direct pointer to the source of remote execution.
  PsExec is a legitimate Sysinternals administration tool, so the investigation is to distinguish sanctioned
  remote administration from an attacker using PsExec for lateral movement, service-based execution, or
  ransomware deployment. Confirm the source host, the account and logon used, and what ran on this host under
  the resulting PSEXESVC service.
type: detection
detection_id: 304afd73-55a5-4bb9-8c21-0b1fc84ea9e4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file match the PSEXEC-<host>-<id>.key pattern in C:\Windows, and which process wrote it?
  context: >-
    Confirm the alert is a true positive by reviewing the file path and the responsible process. The rule fires
    on a file whose name starts with C:\Windows\PSEXEC- and ends in .key — the artifact PsExec writes on the
    target of a remote session. The writing process is normally PSEXESVC.exe running as SYSTEM.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host an expected target of PsExec remote administration?
  context: >-
    Some environments use PsExec routinely for remote administration, patch deployment, or scripted maintenance
    from a known jump host. Knowing whether remote PsExec execution against this host is normal — and from whom —
    is often the fastest way to separate sanctioned administration from unexpected lateral movement.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for remote execution against this host?
  context: >-
    Remote administration tools are frequently used under approved maintenance. A corresponding ticket or an
    on-call admin who confirms the work suggests authorized activity; absence of one when policy requires it
    raises the priority. This check often closes or escalates the alert quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which source host launched this PsExec session? Decode the hostname embedded in the .key filename.
  context: >-
    The artifact follows the naming convention PSEXEC-<source-hostname>-<8 characters>.key, so the filename itself
    reveals the host that initiated the remote session. If the source hostname equals this host's own name, the
    session was launched locally against itself; a different name identifies the pivot host and is the anchor for
    scoping the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What service was installed on this host at the time of the alert, and what binary and account does it run?
  context: >-
    A PsExec session installs a service (PSEXESVC by default, or a custom name via the -r flag) that executes as
    LocalSystem. The service-install record shows the service name, image path, start type, and account. A default
    PSEXESVC running from %SystemRoot% is the standard signature; an unusual service name or a binary path outside
    System32 points to a renamed or tampered PsExec-style tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: When PSEXESVC.exe executed, what is its hash — and is it the genuine signed Sysinternals binary?
  context: >-
    The file-creation event carries no hash; the hash is recorded when the service binary runs. Read the hash from
    the PSEXESVC.exe execution and check its signature and reputation. The authentic binary is Microsoft-signed;
    an unsigned or unknown binary using the PsExec artifact convention indicates a renamed or trojanized tool.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\PSEXESVC.exe'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What inbound connection on SMB/RPC ports correlates with this session, and is the source an expected admin origin?
  context: >-
    PsExec reaches the target over SMB (445) and RPC (135). An inbound connection on those ports around the alert
    time corroborates the source host decoded from the filename. Compare the originating address against known
    admin jump hosts — a connection from an ordinary workstation or an unexpected subnet is the pivot worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes ran on this host under the PsExec service after the session was established?
  context: >-
    PsExec is a means to an end — the operator runs commands, deploys tools, or accesses data on the target.
    Processes spawned under PSEXESVC.exe shortly after the artifact appears reveal what the remote session actually
    did on this host. Legitimate administration and hands-on-keyboard attacker activity look very different here.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has the account tied to this session executed lateral-movement tooling against other hosts?
  context: >-
    Attackers rarely stop at one target. If the same account is running PsExec or other remote-
    execution tools across multiple systems in a short window, the scope of compromise is larger
    than this one host. A single source reaching many hosts is a strong indicator of active
    lateral movement. If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account (name ending in $), this query intentionally returns nothing — a user pivot
    on a service principal matches every host's background automation, not an actor; assess
    movement through the host- and program-scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A remote session that drops one artifact often touches many others — staged tools, output files, or payloads.
    The breadth, paths, and extensions of the writing process's other file activity distinguish a routine
    administrative task from a tool-staging or deployment campaign and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Remote-execution artifacts rarely occur in isolation. Examining activity around the alert reveals what led to
    the session and what followed — reconnaissance, privilege escalation, or additional persistence — and whether
    this is one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the remote session and help reconstruct the full timeline. Lateral movement onto a host is
    usually preceded by activity elsewhere in the chain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced the PSEXEC .key artifact on hosts, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the user's 90-day history of producing this exact
    artifact, aggregated by host. A user who routinely runs remote administration will show prior activity; a user
    who has never produced it is more suspicious. Weigh the count against the user's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\PSEXEC-
        TargetFilename|endswith: .key
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this artifact on this host or across the environment, or is it new?
  context: >-
    When the artifact is written under a service principal such as SYSTEM, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the
    alerting program, giving its 90-day history of producing this artifact. A new or rare program is the
    deviation worth chasing; a program behind thousands of prior events is established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\PSEXEC-
        TargetFilename|endswith: .key
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: >-
    A remote session often installs backup footholds using different techniques — scheduled tasks, additional
    services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    window indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was a PSEXESVC service key created under CurrentControlSet\Services, and where does its ImagePath point?
  context: >-
    Installing the PsExec service writes a service key under HKLM\System\CurrentControlSet\Services. On endpoint
    telemetry the registry write is often observable even where the Windows service-install log is not collected.
    An ImagePath in %SystemRoot% matching PSEXESVC is the default signature; a service key naming a binary in a
    user-writable or temp directory indicates a renamed tool or unauthorized persistence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\PSEXESVC'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What network logon on this host correlates with the session, and from what source address and account?
  context: >-
    PsExec authenticates to the target and produces a network logon (Type 3) at nearly the same moment as the
    service install. That logon record ties the artifact to a source address and the account used, and the logon
    type distinguishes credentialed access from other methods. If Security logs are not collected in this
    environment, correlate the source from the filename decode and the inbound SMB/RPC connection instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4624
        LogonType: 3
      condition: selection
    fields:
      - IpAddress
      - TargetUserName
      - LogonType
