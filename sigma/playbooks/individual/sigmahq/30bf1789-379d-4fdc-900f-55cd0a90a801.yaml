name: Visual Studio Code Tunnel Service Installation
id: c99429fd-799c-42a6-bc78-35d6cdee49f4
description: |
  Detects a command line that installs the Visual Studio Code remote tunnel
  (code-tunnel) as a persistent service — the command contains 'tunnel ', the
  service subcommand, internal-run, and the tunnel-service.log artifact path
  together. The code CLI is a Microsoft-signed binary, so when run as a tunnel
  service it can expose an authenticated reverse tunnel (interactive terminal,
  file browser, port forwarding) over outbound HTTPS/WebSocket to dev-tunnel
  infrastructure, surviving reboots under a service. Legitimate developers and
  IT-managed remote-development setups also install this service, so the
  investigation should determine whether the user, host, and parent chain are
  consistent with sanctioned remote development or whether this is an operator
  establishing covert remote access.
type: detection
detection_id: 30bf1789-379d-4fdc-900f-55cd0a90a801
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain the tunnel-service install pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires only when one command line contains all of 'tunnel ', service, internal-run, and tunnel-service.log together — the signature of the code CLI registering its remote tunnel as a persistent Windows service. Confirm all four substrings are present in the triggering event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to install remote development tunnels as a service?
  context: Legitimate developers and IT-managed remote-development workflows install the code tunnel service routinely. Knowing whether this user's role and the host's function involve sanctioned remote development is often the fastest path to distinguishing approved setup from an operator establishing covert remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full tunnel command line specify — the tunnel name, cli-data-dir path, and any license/auth flags?
  context: The full command line reveals the operational details of the tunnel registration. Decode the --name value (the persistent tunnel identifier used to reach this host), any --cli-data-dir override (which relocates the code_tunnel.json state file away from the default user profile path), and license-consent or accept-server-license-terms flags. The query scopes to the same tunnel-install pattern on this host within a tight window rather than to all code CLI usage, because the binary itself is high-volume on developer endpoints.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'tunnel '
          - service
          - internal-run
          - tunnel-service.log
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the tunnel install, and is that parent chain expected?
  context: The parent process reveals how the tunnel service was invoked. A user double-clicking from explorer.exe or a managed software-deployment agent points toward sanctioned setup; a script host, shortcut-spawned interpreter, or download utility (a PowerShell or cmd parent that just fetched and expanded the portable CLI) points toward operator-driven installation. Walk up from the immediate parent to see what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host run the tunnel-service install pattern before, and how often?
  context: A first-time tunnel-service registration on a host is more suspicious than one that recurs as part of a managed remote-development setup. The query counts prior occurrences of the same tunnel-install command pattern on this host over 90 days, scoped to the rule's signature rather than to all code CLI usage so routine editor launches do not drown the signal. Zero or very low counts indicate first-time installation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - 'tunnel '
          - service
          - internal-run
          - tunnel-service.log
      condition: selection
    fields:
      - User
- question: When this host has previously fired the tunnel-service pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned remote-development tooling has a normal launch profile. The query mirrors the rule's selection scoped to this host — the resulting parent/user distribution reflects how this specific tunnel-install pattern has historically run here. A new parent process, an unexpected user account, or an unusual command structure relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'tunnel '
        - service
        - internal-run
        - tunnel-service.log
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did the tunnel process spawn afterward?
  context: The processes spawned after the tunnel registers reveal what the remote session actually drives. The documented abuse chain spawns a Node.js helper and then interactive shells (cmd.exe, powershell.exe) and helper agents under the tunnel process. A tree that fans out into interactive interpreters and reconnaissance binaries points toward hands-on remote use rather than a quiet managed service.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: A covert remote-access setup rarely stands alone. Activity surrounding the tunnel install may reveal the download and extraction of the portable CLI, reconnaissance, credential access, or staging that establishes broader context. Scan the surrounding process activity for the steps that led to or followed the tunnel registration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the tunnel-service pattern in the past week, and does the cross-host distribution look like managed automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, returning a fleet-wide count of the tunnel-install pattern rather than generic code CLI usage. Many hosts firing the same pattern points to scripted or policy-driven remote-development rollout; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'tunnel '
        - service
        - internal-run
        - tunnel-service.log
      condition: selection
    fields:
    - host.name
- question: Did this host make outbound connections to dev-tunnel or visualstudio.com tunnel infrastructure after the install?
  context: An installed tunnel maintains an authenticated outbound HTTPS/WebSocket channel to dev-tunnel relay infrastructure, and traffic on that channel is strongly asymmetric — outbound data (the interactive session) substantially exceeds inbound. Look for sustained outbound connections from this host to tunnel relay endpoints (the global relay and the per-cluster region domains the host pulls after registration), with outbound byte volume dominating. This is the network half of the chain that the process-creation alert opens; correlate it against the install time.
  range: +24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        DestinationPort:
          - 80
          - 443
      condition: selection and filter_known
    fields:
      - DestinationHostname
      - DestinationIp
      - DestinationPort
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'tunnel '
        - service
        - internal-run
        - tunnel-service.log
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'tunnel '
        - service
        - internal-run
        - tunnel-service.log
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether remote-access setup is isolated or part of broader movement. If the same user established tunnels or ran related tooling on multiple endpoints, the scope of the activity is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'tunnel '
        - service
        - internal-run
        - tunnel-service.log
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the tunnel install reveals the immediate context: what led to it, what happened after, and whether it is part of a larger sequence. Look for download and extraction of the portable CLI, reconnaissance, privilege escalation, or other persistence mechanisms surfacing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, ingress tool transfer, reconnaissance — may reveal the stages that preceded the tunnel install and help reconstruct the full timeline. The chain that establishes covert remote access often involves a prior download and an attempt to evade default application controls.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
