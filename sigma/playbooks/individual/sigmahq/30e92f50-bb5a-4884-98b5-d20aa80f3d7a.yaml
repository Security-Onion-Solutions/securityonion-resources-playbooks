name: Hidden Powershell in Link File Pattern
id: 59e7b2ec-57d9-404b-b0c1-9f5ce0d15cd6
description: |
  Detects cmd.exe launched by explorer.exe with a command line that contains both "powershell" and ".lnk" — the
  process pattern produced when a user opens a shortcut file whose target embeds a PowerShell command. A link file
  can carry an arbitrary command line, an icon that imitates a document or folder, and a window style that keeps the
  console off-screen, so the click looks like opening a file while a script runs behind it. Shortcuts that invoke
  PowerShell do exist legitimately — installers, IT-deployed helpers, and user-built launchers — so the investigation
  should decode what the embedded command actually does, establish where the link file came from, and determine what
  executed after the click.
type: detection
detection_id: 30e92f50-bb5a-4884-98b5-d20aa80f3d7a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the cmd.exe command line contain both a PowerShell invocation and a .lnk path, launched from explorer.exe?
  context: >-
    Confirm the alert before investing time. The rule fires only when explorer.exe spawns C:\Windows\System32\cmd.exe
    and the command line contains both "powershell" and ".lnk" together. Read the full command line and note the
    shortcut path it references, the PowerShell arguments that follow, and any window-style or execution-policy
    switches — those are the anchors for the rest of the investigation.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to open shortcut files that run PowerShell commands?
  context: >-
    Some environments ship shortcuts that legitimately wrap a PowerShell command — software deployment helpers,
    self-service IT launchers, or a user's own automation. Knowing whether this user's role and this host's function
    involve such shortcuts is often the fastest way to separate routine use from a delivered link file. A general
    user with no scripting duties opening a PowerShell-bearing shortcut is the case that needs the full chain walked.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is explorer.exe expected to spawn cmd.exe here, and what does the parent's own event show about the session?
  context: >-
    explorer.exe as the parent means the execution began with a user interaction — a double-click on a shortcut or a
    file — rather than a service or scheduled task. Retrieving the parent's own process event establishes the session
    this happened in and confirms the interactive path. An explorer.exe parent narrows the entry point to something
    the user opened, which makes identifying the link file and its origin the decisive step.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did this same explorer.exe instance spawn around the alert?
  context: >-
    A shortcut that runs a command is one action in a user session. The other children of the same explorer.exe
    instance show what else the user opened in the same window — an archive extractor, a document viewer, a browser
    download, or a second shortcut. Those siblings frequently identify the container the link file arrived in and
    whether more than one staged item was opened.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What does the embedded PowerShell command actually do, and which shortcut file carried it?
  context: >-
    Parse the command line end to end. Identify the .lnk path — it names the file the user clicked and the directory
    it was staged in. Then read the PowerShell portion: the window style (a hidden or minimized console means the
    user sees nothing run), the execution-policy switch, and the payload itself, whether that is an inline script, an
    encoded blob, a download cradle, or a path to a second file. The working directory shows where the click
    originated from.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - powershell
          - .lnk
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the PowerShell portion of the command encoded or obfuscated, and what does it decode to?
  context: >-
    Link-file payloads are commonly encoded because the target field is not something the user reads. Look for
    -EncodedCommand or -enc followed by base64, and for string concatenation, backtick escaping, character-code
    arithmetic, or variable substitution. Decode whatever is present: the result is usually a download cradle, an
    in-memory .NET load, or a command that copies a second stage out of the shortcut file itself. If the command is
    already plain text, read it directly and pursue any URL or file path it names.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the script the shortcut ran?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually compiles, which is ground truth when
    the command line is encoded or hidden behind a shortcut target. It also captures whatever the first stage
    downloaded and executed in memory, which never appears in any command line. If PowerShell operational logs are
    not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and
    decode the payload from the alerting command line instead.
  range: +/-5m
  answer_sources:
  - powershell_script_block
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Which PowerShell and .NET runtime modules were loaded on this host around the alert, and by what processes?
  context: >-
    PowerShell can be hosted without powershell.exe ever appearing in a command line: any process that loads
    System.Management.Automation.dll runs the engine directly, which is how script content executes while the
    command line stays innocuous. Module loads also record whether the CLR was pulled into an unexpected host and
    whether amsi.dll was loaded before the script ran. A loading process other than powershell.exe or the usual
    management tooling is the load worth pursuing.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
          - '\clr.dll'
          - '\clrjit.dll'
          - '\amsi.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Shortcut targets routinely carry -ExecutionPolicy Bypass because the script would otherwise be blocked, and a
    first stage frequently follows with an AMSI patch, a downgrade to the v2 engine that lacks script block logging,
    or a real-time monitoring change. Finding those events in the hour before the click shows preparation rather
    than a one-off user action, and tells you which subsequent evidence is likely to be missing.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What else did explorer.exe launch on this host in the hours after the click?
  context: >-
    The shortcut's PowerShell command is the first stage; what the user session produced afterward shows whether it
    landed. Later user-initiated launches from explorer.exe can reveal a dropped executable being run, an archive
    being reopened, or a decoy document being displayed to make the click look successful. The sequence and timing
    of those launches reconstruct the post-click activity.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has a shortcut on this host ever launched a PowerShell command through cmd.exe before, and what did those commands look like?
  context: >-
    explorer.exe spawning cmd.exe is ordinary on its own, so the discriminator is the command content: cmd.exe
    invoked with both a PowerShell command and a .lnk path. The 90-day history of that specific pattern on this host,
    grouped by command line, distinguishes a recurring deployment or launcher shortcut from a first-ever occurrence.
    Prior command lines that all resemble one another point to a sanctioned shortcut; a lone novel one does not.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - powershell
          - .lnk
      condition: selection
    fields:
      - CommandLine
- question: Have other hosts run a PowerShell-bearing shortcut through explorer.exe and cmd.exe in the last day?
  context: >-
    Link files are delivered in volume — mail attachments, archive contents, or a share that several people open.
    The same pattern appearing on multiple hosts within a day, under different users, points to a delivery wave
    rather than one person's local action, and the host list becomes the set to check for follow-on execution. A
    single host with no peers points to something staged on that machine specifically.
  range: -24h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - powershell
          - .lnk
      condition: selection
    fields:
      - host.name
      - CommandLine
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — a 90-day history of this user opening shortcuts that
    run PowerShell, aggregated by host, rather than generic use of cmd.exe. A user who does this routinely likely has
    a launcher shortcut in their workflow; a user who has never produced the pattern, and whose role involves no
    scripting, makes the origin of the link file the question to answer.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\explorer.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|contains|all:
        - powershell
        - .lnk
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting parent, giving the 90-day history
    of that parent driving shortcut-launched PowerShell rather than generic parent-and-binary co-occurrence. A parent
    already responsible for thousands of prior events is deployment tooling; a parent new to this pattern is the
    deviation to chase.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\explorer.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|contains|all:
        - powershell
        - .lnk
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    A user who opened a staged shortcut on one host may be signed in elsewhere, and the account itself may be the
    thing being used rather than the person. Their process activity across all hosts in the alert window shows
    whether the click is isolated or one of several actions under the same identity. Note that when the alert fires
    under a machine or service account, this view fills with routine background activity and answers little.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns background noise from every host. The meaningful
    question is whether the same launch mechanism produced the same pattern elsewhere in the alert window. Several
    hosts inside the same hour points to a pushed or scheduled trigger — or to several people opening the same
    delivered file; a single host points to a trigger local to this machine.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\explorer.exe
        Image: C:\Windows\System32\cmd.exe
        CommandLine|contains|all:
        - powershell
        - .lnk
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process launch on the host by binary and parent in the window around the click collapses
    routine background activity into a few high-count rows and leaves novel parent-child pairs standing out at low
    counts. Those low-count pairs are what to scan for: an unfamiliar binary running from a user-writable directory,
    a script host spawned by the PowerShell stage, or reconnaissance commands minutes after the click.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A shortcut click is usually the delivery step of a longer sequence, and what preceded it often names the source —
    an archive extraction, a browser download, a mail client writing to a temp directory. Earlier detections on this
    host reconstruct the timeline leading to the click and may identify the delivery channel the link file arrived
    through.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
