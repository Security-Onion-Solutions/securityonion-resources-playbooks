name: Potential AMSI Bypass Via .NET Reflection
id: b21e630a-d03d-4efe-9f7f-86398e1d848a
description: |
  Detects command lines that use .NET reflection to reach the in-process AmsiUtils
  type and flip the amsiInitFailed field, which forces the Antimalware Scan Interface
  to return "not detected" for everything scanned afterward in that process. The rule
  fires when a command line contains the System.Management.Automation.AmsiUtils and
  amsiInitFailed strings together, or the reflection sequence [Ref].Assembly.GetType
  with SetValue($null,$true) and the NonPublic,Static binding flags. This is almost
  never a legitimate administrative action; the investigation should confirm the
  reflection pattern fired, decode the surrounding command to see what the bypass was
  meant to enable, and check whether other defenses were weakened or whether
  execution followed in the same window.
type: detection
detection_id: 30edb182-aa75-42c0-b0a9-e998bb29067c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain the .NET reflection AMSI-bypass pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reading the full command line. The rule fires on either of two string sets in
    the same command — the AmsiUtils type name together with amsiInitFailed, or the
    reflection call [Ref].Assembly.GetType combined with SetValue($null,$true) and the
    NonPublic,Static binding flags. Note which set is present and whether the strings
    appear in plain form or are reconstructed from concatenation, encoding, or hex.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run .NET reflection code that disables AMSI?
  context: Legitimate administrative activity rarely reaches into private AmsiUtils
    fields via reflection. Knowing whether the account is a developer or security
    tester working in a sanctioned context, and whether the host is a workstation
    where such tooling is plausible, is often the fastest way to separate red-team or
    research activity from an actual intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full command line — what was the AMSI bypass embedded in, and what did it set up to run?
  context: The reflection one-liner that flips amsiInitFailed is usually a prefix to a
    larger payload that AMSI would otherwise have flagged. Read the full command to
    identify what follows the bypass — an encoded blob, a download cradle, an
    in-memory assembly load, or a credential-access script. Trigger strings are
    frequently reconstructed from concatenation, Base64, or hex to evade the
    signature, so the visible form may differ from the canonical text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command and is that parent chain expected?
  context: The parent process reveals how the bypass was invoked. A bypass launched
    from an interactive shell under explorer.exe looks different from one spawned by
    an Office application, a script host such as wscript.exe or mshta.exe, or a remote
    execution service — the latter chains point to exploitation or remote operator
    activity rather than local testing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is AMSI scanning currently effective on this host, or does it remain bypassed?
  context: The amsiInitFailed flag is set per-process and dies with the process, but a
    bypass that ran inside a long-lived or repeatedly spawned host process can leave a
    window where scanning is ineffective. Verify current protection status through the
    endpoint console or direct host inspection, and confirm whether the process that
    ran the bypass is still alive before treating scanning as restored.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the AMSI bypass ran?
  context: The bypass exists to let something run that AMSI would otherwise block.
    Examining process creation immediately after the bypass reveals what it was meant
    to enable — script execution, credential dumping, or download of a follow-on
    stage. Correlate this window with network connections and file writes to see what
    the unscanned execution actually did.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host in the surrounding window?
  context: An operator who disables AMSI commonly disables several controls — stopping
    Defender, clearing event logs, adding scan exclusions, or truncating the
    script-block-logging signature set. Finding multiple tampering actions from the
    same user or parent process in the same window indicates a deliberate effort to
    blind the host rather than an isolated action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
          - 'cachedGroupPolicySettings'
          - 'ScriptBlockLogging'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were Defender or script-logging registry keys modified on this host around the alert?
  context: Beyond the in-memory AMSI flag, the same operator may persist defense
    evasion by editing registry values that disable real-time monitoring, add
    exclusions, or turn off PowerShell script-block logging. Registry modification
    events surface tampering that survives the process and reboots, which the
    command-line bypass alone does not.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Windows Defender\'
          - '\Windows Defender Security Center\'
          - '\PowerShell\ScriptBlockLogging'
          - '\PowerShell\ModuleLogging'
          - '\PowerShell\Transcription'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: When this host has previously fired this AMSI-bypass pattern, what parents and users drove it, and does this alert fit?
  context: Even research and red-team activity follows a pattern on a given host. The
    query mirrors the rule's selection scoped to this host, so the resulting
    parent/user distribution reflects how this specific bypass pattern — not generic
    command activity — has run here before. A new parent process, an unexpected
    account, or a first-ever appearance is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - System.Management.Automation.AmsiUtils
        - amsiInitFailed
      - CommandLine|contains|all:
        - '[Ref].Assembly.GetType'
        - SetValue($null,$true)
        - NonPublic,Static
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this AMSI-bypass pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a
    fleet-wide count of this specific bypass pattern rather than generic command
    usage. Many hosts firing the same pattern can point to a sanctioned security
    tool or scripted assessment; a single host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - System.Management.Automation.AmsiUtils
        - amsiInitFailed
      - CommandLine|contains|all:
        - '[Ref].Assembly.GetType'
        - SetValue($null,$true)
        - NonPublic,Static
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - System.Management.Automation.AmsiUtils
        - amsiInitFailed
      - CommandLine|contains|all:
        - '[Ref].Assembly.GetType'
        - SetValue($null,$true)
        - NonPublic,Static
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - System.Management.Automation.AmsiUtils
        - amsiInitFailed
      - CommandLine|contains|all:
        - '[Ref].Assembly.GetType'
        - SetValue($null,$true)
        - NonPublic,Static
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the alert window
    reveals lateral movement or parallel activity on multiple endpoints. If the same
    user ran commands on several hosts close in time, the scope of the operation may
    extend beyond the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains|all:
        - System.Management.Automation.AmsiUtils
        - amsiInitFailed
      - CommandLine|contains|all:
        - '[Ref].Assembly.GetType'
        - SetValue($null,$true)
        - NonPublic,Static
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert
    reveals the immediate context: what led to this event, what happened after, and
    whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, or persistence installation surrounding the bypass.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or
    other defense-evasion alerts — may reveal the attack stages that preceded the
    bypass and help reconstruct the full timeline. Defense tampering frequently sits
    in the middle of a chain rather than at its start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
