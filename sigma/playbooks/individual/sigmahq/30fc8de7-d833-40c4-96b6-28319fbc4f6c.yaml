name: UAC Bypass Using Event Viewer RecentViews
id: 40fb042b-eca2-46bb-9e64-db6e984cb4fc
description: |
  Detects a command line that writes a redirected payload to the Event Viewer RecentViews file under the
  user's local profile. The rule fires when a command line both references the RecentViews path
  (\Event Viewer\RecentViews or its short-name form \EventV~1\RecentViews) AND contains an output redirect
  ('>') — the pattern used to plant a crafted RecentViews file that eventvwr.exe later deserializes, yielding
  code execution at high integrity without a consent prompt. Legitimately this path is rarely written by a
  command line at all; the redirect-to-RecentViews pattern is the staging step of a UAC bypass. Investigation
  should confirm the exact command and redirect, identify what process generated the payload, and determine
  whether eventvwr.exe was launched afterward to execute it at elevated integrity.
type: detection
detection_id: 30fc8de7-d833-40c4-96b6-28319fbc4f6c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line both reference the Event Viewer RecentViews path and redirect output to it?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    a single command line contains BOTH a reference to the RecentViews path (\Event Viewer\RecentViews or the
    short-name form \EventV~1\RecentViews) AND an output redirect ('>'). Read the full command line and verify
    both elements are present and that the redirect target is the RecentViews file rather than an unrelated use
    of those tokens.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to write files into the Event Viewer profile directory from a command line?
  context: Writing a redirected payload into the per-user Event Viewer RecentViews file is not a routine
    administrative action. Knowing whether this user role and host function ever legitimately touch that path
    from a command line is often the fastest way to separate a true positive from an unusual but benign action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly does this command line do? Decode the redirected payload and the RecentViews target.
  context: The full command line reveals the staging operation. Decode the tool generating the payload (for
    example a deserialization gadget generator), the redirect target, and any chained commands that copy the
    output into the Event Viewer profile path. The query returns all command lines on this host that reference
    the RecentViews path within the window so chained or repeated staging invocations appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - \Event Viewer\RecentViews
          - \EventV~1\RecentViews
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the command that wrote the RecentViews payload, and is that parent chain expected?
  context: The parent process reveals how the staging command was invoked. A redirect-to-RecentViews command
    launched from an interactive shell, a script host, or an Office application is a different story from one
    launched by a known automation. The immediate parent is visible in the alert; this looks up the parent's
    own details so the analyst can walk further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was eventvwr.exe launched on this host shortly after the RecentViews payload was written?
  context: Planting the RecentViews file is only the staging step; the payload runs when eventvwr.exe is
    launched and deserializes it at high integrity. A process_creation for eventvwr.exe on this host in the
    minutes after the staging command, especially one spawning a child other than mmc.exe, indicates the bypass
    was executed rather than merely prepared.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\eventvwr.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    activity, and does the current alert fit that pattern?
  context: Even when a path is occasionally written legitimately, the redirect-to-RecentViews pattern is rare. The
    query mirrors the rule's selection structure scoped to this host — the resulting parent/user distribution
    reflects how this specific firing pattern has historically run here. A new parent process, an unexpected
    user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
        - \Event Viewer\RecentViews
        - \EventV~1\RecentViews
      selection_redirect:
        CommandLine|contains: '>'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic usage. Many hosts writing redirected payloads to the
    RecentViews path points to scripted deployment or testing; one host or a small unrelated set points to
    manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
        - \Event Viewer\RecentViews
        - \EventV~1\RecentViews
      selection_redirect:
        CommandLine|contains: '>'
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
        - \Event Viewer\RecentViews
        - \EventV~1\RecentViews
      selection_redirect:
        CommandLine|contains: '>'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
        - \Event Viewer\RecentViews
        - \EventV~1\RecentViews
      selection_redirect:
        CommandLine|contains: '>'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or staging on multiple
    endpoints. If the same user triggered similar activity on more than one host, the scope of the operation
    may be larger than a single bypass attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_path:
        CommandLine|contains:
        - \Event Viewer\RecentViews
        - \EventV~1\RecentViews
      selection_redirect:
        CommandLine|contains: '>'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context:
    what led to the staging command, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, privilege escalation, or persistence mechanisms in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, credential access — may reveal the attack stages that preceded this staging step and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What action was performed with elevated privileges after the UAC bypass?
  context: 'UAC bypass is a means to an end — attackers elevate to perform actions that require high integrity:
    installing persistence, dumping credentials, tampering with security tools, or accessing protected
    resources. Examining processes spawned at high or system integrity shortly after the staging command reveals
    the objective.'
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry modifications made to set up an alternate UAC bypass on this host?
  context: The RecentViews vector deserializes a planted file rather than relying on a registry handler hijack,
    but operators often try multiple bypass methods until one succeeds. Registry writes to per-user handler keys
    such as HKCU\Software\Classes\mscfile\shell\open\command or ms-settings\Shell\Open\command around the same
    time indicate an alternate or fallback bypass attempt and confirm deliberate escalation activity.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege escalation techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially if the
    OS version or configuration blocks certain techniques. Finding multiple bypass or escalation detections from
    the same user or process confirms deliberate privilege escalation rather than a false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
