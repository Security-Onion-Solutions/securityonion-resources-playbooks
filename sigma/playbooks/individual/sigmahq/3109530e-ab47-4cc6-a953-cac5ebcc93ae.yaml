name: ADS Zone.Identifier Deleted By Uncommon Application
id: 88256130-2dbd-4c62-b2b7-3f81e9013090
description: |
  Detects deletion of the Zone.Identifier Alternate Data Stream (the Mark-of-the-Web tag Windows attaches to
  downloaded files) by a process outside the expected set of browsers, Explorer, and PowerShell. Removing this
  stream strips the origin marker that Office, SmartScreen, and other controls use to treat a file as
  internet-sourced, so a document or executable that was downloaded can then bypass those protections. Legitimate
  archive tools and installers occasionally clear the stream, so the investigation is to identify which file lost
  its Mark-of-the-Web, which process removed it, and whether that file was subsequently opened or executed.
type: detection
detection_id: 3109530e-ab47-4cc6-a953-cac5ebcc93ae
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was a :Zone.Identifier stream deleted, and which process performed the deletion?
  context: >-
    Confirm the alert by reviewing the deleted stream path and the responsible process. The rule fires on deletion
    of a file's :Zone.Identifier stream by a process that is not one of the expected browsers, Explorer, or
    PowerShell hosts. The responsible process is the first thing to judge — an archiver or installer clearing the
    marker looks very different from an unknown binary doing so.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this process and user expected to remove the Mark-of-the-Web from files on this host?
  context: >-
    Some archive utilities, deployment tools, and content-management applications legitimately clear the
    Zone.Identifier stream as part of extracting or provisioning files. Knowing whether this application and user
    routinely handle downloaded content on this host is often the fastest way to separate benign extraction from a
    deliberate protection bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process removed the Mark-of-the-Web, and what was its full command line?
  context: >-
    The responsible process and its command line reveal how and why the origin marker was stripped. A signed
    archive tool extracting a download is routine; an interpreter, a renamed binary, or a process launched from a
    user-writable directory removing the stream points to a deliberate attempt to make a downloaded file appear
    locally trusted. The command line often names the target file directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which file had its Mark-of-the-Web removed, and is it an executable or document that benefits from appearing trusted?
  context: >-
    The stream path identifies the host file — the portion before :Zone.Identifier. Determine what that file is: an
    installer, script, macro-enabled Office document, or archive that would otherwise be blocked or warned about
    because it was downloaded. A payload type that MOTW protections specifically gate is the strongest signal that
    the removal was an evasion step rather than incidental cleanup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: After the stream was deleted, was the underlying file moved, renamed, executed, or re-tagged?
  context: >-
    The file's post-deletion lifecycle drives next steps. A file that is opened or executed shortly after losing its
    Mark-of-the-Web confirms the removal enabled a bypass; a file re-tagged or quarantined suggests the control
    recovered. Tracking the file's subsequent operations shows whether the evasion succeeded.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the affected file still lack its Mark-of-the-Web, or was the stream restored?
  context: >-
    Zone.Identifier removal may be a one-off for a single file or part of a broader habit of stripping origin
    markers. Checking whether the file still lacks the stream — and whether the same process cleared it from other
    files — reveals whether downloaded content on this host remains able to bypass origin-based controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the Mark-of-the-Web was removed?
  context: >-
    Origin markers are stripped to enable something that would otherwise be blocked or warned about — opening a
    macro document, running a downloaded installer, or launching a script. Process activity in the window right
    after the deletion reveals whether the now-trusted file was executed and what it did.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering or indicator-removal actions performed on this host?
  context: >-
    An actor who strips one origin marker often removes other evidence too — clearing event logs, deleting shadow
    copies, or disabling protections. Finding other tampering from the same user or parent process in the same
    window indicates a coordinated evasion effort rather than isolated file handling.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process handling one downloaded file often touches many — extracting an archive, staging payloads, or
    clearing markers from a batch of files. The breadth, paths, and extensions of the process's other file activity
    distinguish a single extraction from a wider staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the deletion reveals what led to it — a download, an
    archive extraction, or a phishing-delivered file — and what followed. Novel parent-child process pairs at low
    counts are what to scan for against the routine host baseline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, a phishing artifact, or an execution attempt — may
    reveal how the marked file arrived and why its origin marker needed removing. The alert timeline helps
    reconstruct the delivery-to-execution sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the user's 90-day history of stripping the
    Zone.Identifier stream through a non-standard application, aggregated by host. A user who has never produced
    this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and
    typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith: :Zone.Identifier
      filter_main_generic:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\explorer.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\explorer.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_optional_browsers_chrome:
        Image:
        - C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
        - C:\Program Files\Google\Chrome\Application\chrome.exe
      filter_optional_browsers_firefox:
        Image:
        - C:\Program Files (x86)\Mozilla Firefox\firefox.exe
        - C:\Program Files\Mozilla Firefox\firefox.exe
      filter_optional_browsers_msedge:
        Image:
        - C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        - C:\Program Files\Microsoft\Edge\Application\msedge.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this pattern on this host or across the environment, or is it new?
  context: >-
    When the deletion runs under a service principal such as SYSTEM, user identity does not attribute the behavior;
    the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting
    program, giving its 90-day history of driving this exact pattern. A new or rare program is the deviation
    worth chasing; a program behind thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith: :Zone.Identifier
      filter_main_generic:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\explorer.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\explorer.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_optional_browsers_chrome:
        Image:
        - C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
        - C:\Program Files\Google\Chrome\Application\chrome.exe
      filter_optional_browsers_firefox:
        Image:
        - C:\Program Files (x86)\Mozilla Firefox\firefox.exe
        - C:\Program Files\Mozilla Firefox\firefox.exe
      filter_optional_browsers_msedge:
        Image:
        - C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        - C:\Program Files\Microsoft\Edge\Application\msedge.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the marker removal is isolated or part of wider
    handling of downloaded content across multiple endpoints. The same user stripping origin markers on several
    hosts in a short window widens the potential scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window — a coordinated rollout, or isolated?
  context: >-
    Under a service principal, the user pivot returns agent-telemetry noise; the meaningful question is whether the
    same launch mechanism stripped Zone.Identifier streams elsewhere in the alert window. Multiple hosts point to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith: :Zone.Identifier
      filter_main_generic:
        Image:
        - C:\Program Files\PowerShell\7-preview\pwsh.exe
        - C:\Program Files\PowerShell\7\pwsh.exe
        - C:\Windows\explorer.exe
        - C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        - C:\Windows\SysWOW64\explorer.exe
        - C:\Windows\SysWOW64\WindowsPowerShell\v1.0\powershell.exe
      filter_optional_browsers_chrome:
        Image:
        - C:\Program Files (x86)\Google\Chrome\Application\chrome.exe
        - C:\Program Files\Google\Chrome\Application\chrome.exe
      filter_optional_browsers_firefox:
        Image:
        - C:\Program Files (x86)\Mozilla Firefox\firefox.exe
        - C:\Program Files\Mozilla Firefox\firefox.exe
      filter_optional_browsers_msedge:
        Image:
        - C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        - C:\Program Files\Microsoft\Edge\Application\msedge.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host around the same time?
  context: >-
    Defense evasion and persistence frequently travel together — an actor who removes an origin marker to run a
    downloaded payload often establishes a foothold in the same session. Scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions installed in the same window indicate intentional stacking rather than
    isolated file handling.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
