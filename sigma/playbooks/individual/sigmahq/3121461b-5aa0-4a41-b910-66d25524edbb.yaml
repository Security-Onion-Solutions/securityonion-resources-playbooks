name: Winnti Malware HK University Campaign
id: 7a4bf158-5e9e-4b53-a2e2-18fc2646e9f2
description: |
  Detects process creations matching execution patterns associated with the Winnti malware family, which
  side-loads an attacker-supplied DLL into a legitimate signed vendor executable staged in a world-writable
  directory, copies the patched host process into C:\ProgramData\DRM and registers it as a service for
  persistence, and injects into a suspended media-player process. The rule fires when any one of five
  parent/child pairings matches — either a child under C:\ProgramData\DRM spawned by a parent running from
  C:\Windows\Temp or named hpqhvind.exe, or wmplayer.exe spawned by a parent under C:\ProgramData\DRM or by
  Test.exe, or execution of C:\ProgramData\DRM\CLR\CLR.exe, or SearchFilterHost.exe spawned by a parent under
  C:\ProgramData\DRM\Windows. Determine which branch fired, whether the parent and child binaries were written
  into those directories shortly beforehand, which modules the process loaded from non-standard paths, and
  whether a service entry now points at a staged binary.
type: detection
detection_id: 3121461b-5aa0-4a41-b910-66d25524edbb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which of the five parent/child pairings did this event match, and do the parent and child paths read exactly as the rule describes?
  context: >-
    The rule fires when any one of five pairings matches, so identify the branch before anything else: either a
    child under C:\ProgramData\DRM launched by a parent in C:\Windows\Temp or named hpqhvind.exe, or wmplayer.exe
    launched by a parent under C:\ProgramData\DRM or by Test.exe, or a direct execution of
    C:\ProgramData\DRM\CLR\CLR.exe, or SearchFilterHost.exe launched by a parent under C:\ProgramData\DRM\Windows.
    Four of the five branches require the parent AND the child to match together; the CLR.exe branch keys on the
    child path alone, so for that branch the parent identity is an open question rather than part of the trigger.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host or user expected to run executables out of C:\ProgramData\DRM or C:\Windows\Temp?
  context: >-
    Neither directory is a normal install location. Some vendor installers and update routines do stage
    executables in C:\Windows\Temp briefly, so establish whether this host runs software that legitimately does
    so, and whether the account behind the event is a person, a service principal, or a machine account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive-security exercises sometimes stage payloads under C:\ProgramData and C:\Windows\Temp and name them
    after system binaries, which reproduces the same parent/child pairings. An active engagement whose scope,
    host list, and timing line up with this event resolves the alert without further analysis; the absence of one
    means the staged paths need to be explained another way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this parent expected to spawn this child, and what started the parent itself?
  context: >-
    The parent/child pairing is the core signal here. This family gets its parent onto the host by side-loading a
    DLL into a legitimate signed executable, so the parent may look benign by name while running from a staging
    directory. Walking up to the grandparent shows what placed and launched the parent — an installer, a service
    control manager start, an interactive shell, or something else.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same parent instance spawn?
  context: >-
    A loader that spawns one staged binary commonly spawns others in the same window — an injection host, a
    persistence installer, a copy of itself under a different name. Listing every child of this exact parent
    instance shows whether the alerting process was one step of a sequence or the only thing the parent did.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What was the full command line and working directory of the alerting binary?
  context: >-
    The rule matches on paths alone, so the command line is where the operational detail sits — a service name, an
    injection target, a configuration path, or nothing at all. A staged binary launched with no arguments from a
    working directory it was written into is consistent with a self-contained loader; explicit arguments point at
    what it was told to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What capability did this binary invoke, and does the command line name a service, module, or injection target?
  context: >-
    This family is modular — the same staged executable can install a service, load plugins, open a listener, or
    inject into a host process, and which one ran determines the response. Read the alerting command line for a
    service name, a module or plugin argument, or a target process path, and treat an empty command line as a
    signal that the behavior is compiled in rather than passed at launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did this process write after it started, and did any land in a staging or system directory?
  context: >-
    The characteristic artifacts of this pattern are files rather than command lines — a DLL and a renamed vendor
    executable dropped together into a temp directory, a copy of the patched executable placed under
    C:\ProgramData\DRM, and a module written into C:\Windows\System32. Files written by the alerting process
    confirm execution scope even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Which modules did the alerting process load from outside the standard system and program directories, and are they signed?
  context: >-
    Side-loading works by placing an attacker-supplied DLL next to a legitimate executable so the loader resolves
    it first, so the discriminator is a module loaded from a path that is neither System32/SysWOW64 nor a Program
    Files install root. This query suppresses those known-safe directories and returns everything else with its
    signature state and hash. Development tools and some vendor agents legitimately load modules from custom
    paths, so weigh the loading process against what the host is supposed to run, and compare the returned hashes
    against a known-good baseline for the module name. Hashing of alternate data streams is not available from log
    queries; if a module needs to be confirmed byte-for-byte, do it through endpoint tooling or manual collection.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_known_paths:
        ImageLoaded|startswith:
          - 'C:\Windows\System32\'
          - 'C:\Windows\SysWOW64\'
          - 'C:\Program Files\'
          - 'C:\Program Files (x86)\'
      condition: selection and not filter_known_paths
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - edr_console
  - manual_review
- question: Was a service registry entry created or modified on this host that points at a binary under C:\ProgramData or C:\Windows\Temp?
  context: >-
    Persistence for this pattern is a service whose name imitates a platform component (a .NET optimization
    service is the recurring choice) and whose image path points at the staged copy of the patched executable.
    This query returns service-key writes whose value data references a staging directory. Compare any hit against
    the host's expected service inventory — a legitimate service pointing into C:\ProgramData is unusual but not
    unheard of for line-of-business software. Registry deletions are not observable here, so judge cleanup by
    whether the key was later rewritten rather than by its absence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
      selection_staged_path:
        Details|contains:
          - 'C:\ProgramData\'
          - 'C:\Windows\Temp\'
          - '\CLR.exe'
      condition: selection and selection_staged_path
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: What was written into C:\ProgramData\DRM or C:\Windows\Temp on this host, and which process wrote it?
  context: >-
    Both directories are world-writable and neither is a normal install target, which is why they are used to
    stage a signed host executable and the DLL that hijacks its load order. The writer process is the pivot: an
    installer or update service writing there is routine, while a browser, mail client, script host, or an
    unsigned binary writing an executable there is the origin of the staged file. Note the file names and
    extensions returned, since the loader and its DLL are typically written within seconds of each other.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_staging_paths:
        TargetFilename|contains:
          - 'C:\ProgramData\DRM\'
          - 'C:\Windows\Temp\'
      condition: selection and selection_staging_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What else executed from C:\ProgramData\DRM or C:\Windows\Temp on this host, and how soon after the staging writes did those executions run?
  context: >-
    The interval between a file being written into a staging directory and that file first executing is the
    correlation that separates hijacked execution flow from ordinary temp-directory use. Installer-staged binaries
    typically run within seconds of being written and then never again; a binary that sits for hours or days and
    then runs, or one that runs repeatedly across reboots, points at persistence. This query lists every process
    started from either directory in a four-hour window around the alert so the sequence can be lined up against
    the write times.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_staging_paths:
        Image|startswith:
          - 'C:\ProgramData\DRM'
          - 'C:\Windows\Temp\'
      condition: selection and selection_staging_paths
    fields:
      - Image
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user produced this rule's parent/child pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection structure scoped to this user, so the result is the user's 90-day
    history of these specific pairings rather than generic use of the binaries involved, aggregated by host. A
    user who has never produced the pattern is a stronger finding than one who produces it routinely; weigh the
    count against what the account is for. If the alert fired under SYSTEM or a machine account, this count
    attributes a mechanism rather than a person.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|contains:
        - C:\Windows\Temp
        - \hpqhvind.exe
        Image|startswith: C:\ProgramData\DRM
      selection2:
        ParentImage|startswith: C:\ProgramData\DRM
        Image|endswith: \wmplayer.exe
      selection3:
        ParentImage|endswith: \Test.exe
        Image|endswith: \wmplayer.exe
      selection4:
        Image: C:\ProgramData\DRM\CLR\CLR.exe
      selection5:
        ParentImage|startswith: C:\ProgramData\DRM\Windows
        Image|endswith: \SearchFilterHost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process driven the rule's pattern before on this host or elsewhere, or is the parent new for this activity?
  context: >-
    When an alert fires under a service principal, user identity attributes nothing and the launch mechanism is
    the meaningful pivot. This query mirrors the rule's selection structure scoped to the alerting parent process,
    so the result is the 90-day history of this parent driving these exact pairings, aggregated by host. A parent
    that already accounts for a long tail of prior events is vendor or platform automation; a parent that is new
    for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|contains:
        - C:\Windows\Temp
        - \hpqhvind.exe
        Image|startswith: C:\ProgramData\DRM
      selection2:
        ParentImage|startswith: C:\ProgramData\DRM
        Image|endswith: \wmplayer.exe
      selection3:
        ParentImage|endswith: \Test.exe
        Image|endswith: \wmplayer.exe
      selection4:
        Image: C:\ProgramData\DRM\CLR\CLR.exe
      selection5:
        ParentImage|startswith: C:\ProgramData\DRM\Windows
        Image|endswith: \SearchFilterHost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user run across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across every host in the alert window reveals whether the same identity was
    active elsewhere at the same time, which separates a host-local event from movement across endpoints. If the
    alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this returns routine
    agent and platform telemetry and the parent-driven view is the one that carries the answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts within the same window?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process and runs fleet-wide
    across the alert window, so it answers whether the launch mechanism reached more than one endpoint. Several
    hosts in the same window points at scheduled or pushed automation; a single host points at a host-local
    trigger, which for this pattern means the staging directories on that host are where the investigation
    continues.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        ParentImage|contains:
        - C:\Windows\Temp
        - \hpqhvind.exe
        Image|startswith: C:\ProgramData\DRM
      selection2:
        ParentImage|startswith: C:\ProgramData\DRM
        Image|endswith: \wmplayer.exe
      selection3:
        ParentImage|endswith: \Test.exe
        Image|endswith: \wmplayer.exe
      selection4:
        Image: C:\ProgramData\DRM\CLR\CLR.exe
      selection5:
        ParentImage|startswith: C:\ProgramData\DRM\Windows
        Image|endswith: \SearchFilterHost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent/child pair on the host in the surrounding window collapses repetitive agent and
    platform telemetry into high-count rows and leaves novel pairings standing out at low counts. Scan for
    reconnaissance binaries, firewall or service configuration tools, and any second process launched out of a
    staging directory.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the staged files arrived — a download or archive
    extraction, a script host execution, or a remote-service start. The order of the alerts is the timeline;
    execution flow hijacking is usually a mid-chain step rather than the first thing that happened.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
