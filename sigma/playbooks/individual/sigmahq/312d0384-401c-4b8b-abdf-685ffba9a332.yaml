name: Email Exifiltration Via Powershell
id: dfa7e6ad-960b-4313-9fbd-148ea924dc41
description: |
  Detects a PowerShell command that enumerates Exchange recipient email addresses by
  chaining Add-PSSnapin, Get-Recipient, and -ExpandProperty EmailAddresses, then
  projecting the SmtpAddress field with table headers suppressed (-hidetableheaders) so
  the output is a clean, parseable list of addresses. The rule fires only when powershell.exe
  or pwsh.exe runs with all of those cmdlet and parameter tokens present, which is a
  narrow signature of mailbox-directory harvesting rather than routine administration.
  Legitimate Exchange administration can produce similar one-off queries, so the
  investigation should confirm the exact command, determine the user and host context,
  establish where the harvested address list went, and look for the surrounding
  reconnaissance or impact activity that often accompanies bulk recipient enumeration.
type: detection
detection_id: 312d0384-401c-4b8b-abdf-685ffba9a332
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the rule — powershell.exe or pwsh.exe running Add-PSSnapin with Get-Recipient, -ExpandProperty EmailAddresses, SmtpAddress, and -hidetableheaders?
  context: Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact command line and process image against the rule's criteria. The
    rule requires all of the cmdlet and parameter tokens together; verify each is present
    and that the binary is powershell.exe or pwsh.exe, since the combination is what makes
    this recipient-enumeration pattern distinctive rather than an ordinary mailbox lookup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to enumerate Exchange recipient email addresses from the command line?
  context: Legitimate Exchange administration can trigger this detection. Knowing whether
    the account is an Exchange administrator or service account, and whether the host is a
    mail server or administrative jump box, is often the fastest path to distinguishing
    routine directory queries from mailbox harvesting. A workstation or a non-mail account
    running this query is a stronger signal than the same query from an Exchange management host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this recipient-enumeration command do? Decode every argument and identify what mailbox data it returned.
  context: The full command line reveals the specific harvesting action. Read the Get-Recipient
    pipeline end to end — any -Filter or -ResultSize arguments, whether it targets all
    recipients or a subset, and where the SmtpAddress output was written or redirected. The
    -hidetableheaders flag and SmtpAddress projection together produce a clean address list
    suitable for downstream phishing or exfiltration, so determining the scope of recipients
    returned is the core analytical task here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - Get-Recipient
          - EmailAddresses
          - SmtpAddress
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the recipient-enumeration command obfuscated or concatenated, and does the readable form match the harvesting pattern?
  context: This command is plain-text and human-readable, but attackers sometimes split
    cmdlet names with backticks, string concatenation, or variable substitution to evade
    keyword matching. Reconstruct the deobfuscated command and confirm it resolves to the
    Get-Recipient EmailAddresses SmtpAddress pipeline. If the command was assembled from
    fragments, that is itself a sign of deliberate evasion rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full deobfuscated content of this command?
  context: Script block logging records the deobfuscated script content PowerShell actually
    executed, even when the command line is concatenated or wrapped. This provides ground
    truth about the exact recipient query and any surrounding script that ran in the same
    session. If PowerShell operational logs are not ingested in this environment, treat
    zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before the enumeration ran?
  context: Attackers often disable or bypass PowerShell security controls before running
    their payload. Common techniques include AMSI bypass (patching amsi.dll in memory),
    execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language mode
    escape, and downgrade attacks (powershell.exe v2, which lacks logging). Finding these
    precursor events in the hour before the recipient enumeration strengthens the case for
    malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What files did the PowerShell process write while the recipient enumeration ran?
  context: The recipient query produces a list of SmtpAddress values that is usually
    redirected to a file for later use. This query shows files the PowerShell process touched
    on the host, which reveals whether the harvested address list was written to disk and
    where. A file written into a user-writable or staging directory indicates the enumeration
    output was captured for collection rather than read interactively on screen.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where was the harvested address list written or sent after the enumeration ran?
  context: Recipient enumeration is usually a staging step — the address list is redirected
    to a file, copied to the clipboard, or piped to a transfer command, then moved off the
    host. Checking for files written by the same PowerShell process and for outbound
    transfers from the host in the following hour reveals the exfiltration path. A list that
    was written to disk and then uploaded or copied elsewhere is a stronger indicator of
    data theft than an interactive query whose output stayed on screen.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the harvested output redirected to a file, compressed, or password-protected for staging?
  context: Operators often write enumerated data to a file and then compress or encrypt it
    before moving it, so security tools cannot inspect the contents in transit. Look in the
    command line for output redirection (Out-File, >, Set-Content, Export-Csv) and for any
    follow-on compression or encryption flags. Output that was deliberately packaged for
    transfer is a stronger sign of intended exfiltration than a one-off screen query.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected for Exchange administration?
  context: The parent process reveals how PowerShell was invoked. Interactive administration
    typically descends from explorer.exe or a management console; automation runs under a
    service or scheduled-task host. Unusual parents such as a web server process, mshta.exe,
    wscript.exe, or an Office application point to exploitation of a public-facing service or
    a malicious script rather than a legitimate Exchange management session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's recipient-enumeration pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate Exchange tooling runs recipient queries. The query mirrors the
    rule's exact selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific enumeration pattern has historically run here — not generic
    PowerShell usage. Deviations such as a new parent process, an unexpected account, or a
    first-ever appearance of the pattern are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Add-PSSnapin
        - Get-Recipient
        - -ExpandProperty
        - EmailAddresses
        - SmtpAddress
        - -hidetableheaders
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's recipient-enumeration pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this exact enumeration pattern rather than generic PowerShell usage.
    Many hosts firing the same pattern points to a scripted or scheduled mailbox-export job;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Add-PSSnapin
        - Get-Recipient
        - -ExpandProperty
        - EmailAddresses
        - SmtpAddress
        - -hidetableheaders
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Add-PSSnapin
        - Get-Recipient
        - -ExpandProperty
        - EmailAddresses
        - SmtpAddress
        - -hidetableheaders
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Add-PSSnapin
        - Get-Recipient
        - -ExpandProperty
        - EmailAddresses
        - SmtpAddress
        - -hidetableheaders
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or
    parallel activity on multiple endpoints. If the same user triggered similar enumeration
    or staging activity on other hosts, the scope of compromise may be larger than the single
    alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        CommandLine|contains|all:
        - Add-PSSnapin
        - Get-Recipient
        - -ExpandProperty
        - EmailAddresses
        - SmtpAddress
        - -hidetableheaders
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, exploitation of a public-facing service, credential access, or reconnaissance
    — may reveal the attack stages that preceded the recipient enumeration and help
    reconstruct the full timeline. Bulk address harvesting frequently sits between an initial
    foothold and a later phishing or impact stage.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
