name: Install New Package Via Winget Local Manifest
id: 180c7076-7a7d-45a5-90dd-5451f6dcc9e8
description: |
  Detects winget.exe invoked with an install (or 'add') verb together with a local-manifest flag ('-m' or '--manifest'). Winget is a Microsoft-signed package manager; the local-manifest path lets a caller install a package from a YAML file on disk instead of a curated, signed source, which bypasses the source signing and curation chain and can download and run an installer the manifest points at. The rule fires only when all three conditions match: the binary is winget.exe (by Image or OriginalFileName), an install/add verb is present, AND a manifest flag is present. Legitimate use exists where teams install and test custom or internal applications via manifests; malicious use abuses the trusted binary to fetch and execute an attacker-supplied payload. Determine what the manifest installed, who and what launched winget, and whether this user, host, and parent chain routinely perform manifest-based installs.
type: detection
detection_id: 313d6012-51a0-4d93-8dfc-de8553239e25
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the winget command line show an install or add verb together with a local-manifest flag?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when winget.exe (matched by Image or OriginalFileName) runs with an install or add verb AND a manifest flag ('-m' or '--manifest') all present together. Read the full command line and confirm all three are there, and note the manifest path or directory the install points at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to install packages via winget local manifests?
  context: Legitimate administrative or developer activity can trigger this detection where teams install and test custom or internal applications from manifest files. Knowing whether the user role and host function are consistent with manifest-based package installs is often the fastest path to distinguishing routine work from abuse of the trusted binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this winget invocation install? Decode the full command line and resolve the manifest path it points at.
  context: The full command line reveals the specific install action. Identify the manifest path or directory passed to '-m'/'--manifest', and decode any flags that weaken trust controls — '--ignore-local-archive-malware-scan' skips the archive malware scan, '--ignore-security-hash' skips the installer hash check, and '--custom'/'--override' append or replace installer arguments. The manifest's installer URL is what determines whether this fetched and ran an external payload, so the manifest content itself must be retrieved and reviewed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned winget and is that parent chain expected?
  context: The parent process reveals how winget was invoked. Interactive installs typically descend from explorer.exe or a console the user opened; manifest installs driven from a script or downloaded launcher may descend from a shell, a script host such as wscript.exe or powershell.exe, or an Office application, which points toward automated or operator-driven abuse rather than a hands-on user install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run winget?
  context: A binary that has never run on a host is more suspicious than one that runs regularly. Zero or very low historical counts of winget on this host indicate first-time or rare execution and raise the weight of the manifest-install finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously run winget with an install and manifest flag, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even a trusted package manager can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific manifest-install pattern (not generic winget usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_install_flag:
        CommandLine|contains:
        - install
        - ' add '
      selection_manifest_flag:
        CommandLine|contains:
        - '-m '
        - --manifest
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did winget spawn afterward?
  context: The processes spawned after winget runs reveal the actual impact of the install. A manifest install that fetches and runs an external payload often leads to the installer executable, a script host, or a command shell starting under winget; unexpected children such as cmd.exe, powershell.exe, or certutil.exe point toward post-exploitation rather than a routine package install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts run winget with an install and manifest flag in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this manifest-install pattern rather than generic winget usage. Many hosts firing the same pattern points to scripted deployment or a packaging workflow; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_install_flag:
        CommandLine|contains:
        - install
        - ' add '
      selection_manifest_flag:
        CommandLine|contains:
        - '-m '
        - --manifest
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_install_flag:
        CommandLine|contains:
        - install
        - ' add '
      selection_manifest_flag:
        CommandLine|contains:
        - '-m '
        - --manifest
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_install_flag:
        CommandLine|contains:
        - install
        - ' add '
      selection_manifest_flag:
        CommandLine|contains:
        - '-m '
        - --manifest
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar tool execution on several hosts in this window, the scope of the activity may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \winget.exe
      - OriginalFileName: winget.exe
      selection_install_flag:
        CommandLine|contains:
        - install
        - ' add '
      selection_manifest_flag:
        CommandLine|contains:
        - '-m '
        - --manifest
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the winget invocation, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence around the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the timeline leading up to the manifest install.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
