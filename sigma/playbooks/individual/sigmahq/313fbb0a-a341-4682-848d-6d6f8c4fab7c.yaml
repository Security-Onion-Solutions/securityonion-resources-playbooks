name: Suspicious PowerShell WindowStyle Option
id: 21f5b2c2-5f73-44ae-8d6c-ff3ed85340c4
description: |
  Fires when PowerShell script-block content (EID 4104) combines a powershell invocation with the
  WindowStyle and Hidden options — the T1564.003 pattern of launching a process whose window is
  concealed from the logged-on user; one known-benign virtual-desktop provisioning script family is
  excluded by the rule's filter. Administrators legitimately suppress windows so maintenance scripts
  do not disrupt users, while the same option keeps payload execution out of sight, so the
  discriminator is what the hidden command actually does and who launched it. Investigation should
  read the full reassembled script, confirm whether a hidden PowerShell process actually started and
  under what parent, and sweep for accompanying concealment (registry window settings,
  file-attribute changes) and follow-on activity. Script-block capture is policy-gated per host — on
  default installs only content matching Microsoft's built-in suspicious-strings checks is logged,
  so absence of surrounding 4104 evidence is not absence of activity.
type: detection
detection_id: 313fbb0a-a341-4682-848d-6d6f8c4fab7c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain a powershell launch with the WindowStyle Hidden option?
  context: Confirm the alert is a true positive by reading the complete script against the rule's
    criteria — the block must contain a powershell invocation together with the WindowStyle and
    Hidden options. The rule excludes one known-benign virtual-desktop provisioning script family,
    so content matching that path pattern should not have alerted. Long scripts are split across
    multiple 4104 events; this retrieves every chunk of the alerting block (sequence/total order) so
    the judgment is made on the whole script, not the alerting fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
- question: Is this user and host expected to run scripts that launch hidden PowerShell windows?
  context: Administrators and deployment tooling legitimately suppress windows to avoid disrupting
    users during maintenance, so a hidden-window launch from a management server or under a known
    automation account can be routine. The query shows the alerting block's host, user, and on-disk
    script path (blank for interactive or in-memory execution). A SYSTEM user usually means
    deployment tooling or a vendor agent — judge by host role and script path. An ordinary
    workstation user with no automation duties producing this pattern is the case worth pursuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
- question: What does the full script do, and what command does it run in the hidden window?
  context: Script-block content is logged after decoding, so any -EncodedCommand wrapper is already
    unwrapped; only string-level obfuscation inside the script (concatenation, format operators,
    backticks) still needs manual work. Read the complete reassembled script for the command handed
    to the hidden PowerShell launch — download cradles (IEX, Net.WebClient, Invoke-WebRequest),
    base64 or compressed payloads, files written, and any AMSI or logging tampering. Paths or URLs
    named in the script are derived artifacts worth chasing in file and network telemetry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
- question: Does the script exist on disk, and what created it?
  context: When a script block runs from a file, its path is recorded on the 4104 event and hydrates
    this file-activity pivot; a script staged in Temp, AppData, ProgramData, or Downloads implies a
    delivery step, and the file-creation event identifies the process and account that wrote it.
    A substantial share of script blocks are interactive or in-memory and carry no path at all — for
    those this query returns nothing, and the absence is itself worth noting, since fileless
    execution of a hidden-window launcher is a deliberate evasion choice.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
- question: Did a PowerShell process actually start with a hidden window on this host, and what parent launched it?
  context: The alerting event records script content, not execution, and carries no process
    identity. Process telemetry closes that gap — this lists PowerShell processes whose command line
    carries the WindowStyle Hidden option on this host around the alert, with their parent lineage.
    An interactive shell or terminal parent fits an admin running a script by hand; an Office
    application, browser, scheduled task, or service parent launching hidden PowerShell fits the
    concealment pattern this rule anticipates. Hidden execution matters most where a visible window
    would be expected, such as interactive user sessions.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
        CommandLine|contains|all:
          - 'WindowStyle'
          - 'Hidden'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
- question: Were console window-position or transparency settings modified in the registry around the alert?
  context: Beyond command-line options, window concealment can be achieved by registry edits that
    push a console window off screen or make it transparent — per-application console settings live
    under the user's Console registry key (WindowPosition, WindowSize, WindowAlpha,
    ScreenBufferSize). A write to these values near the alert is an alternative concealment
    mechanism worth folding into the timeline. Zero results are common; most environments rarely
    touch these values, which is what makes a hit notable.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Console'
      selection_values:
        TargetObject|endswith:
          - '\WindowPosition'
          - '\WindowSize'
          - '\WindowAlpha'
          - '\ScreenBufferSize'
      condition: selection and selection_values
    fields:
      - TargetObject
      - Details
      - Image
- question: Was attrib.exe used to set hidden or system attributes on files around this alert?
  context: Hiding activity often extends beyond the window to the artifacts themselves — attrib.exe
    with +h or +s flags removes files from default directory views, and alternate data streams hide
    payload content inside innocuous files. A hidden-window script paired with attribute changes on
    dropped files strengthens the concealment reading. Which file types were touched matters;
    scripts, executables, and archives being hidden reads differently from a vendor installer
    adjusting its own working directory.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\attrib.exe'
        CommandLine|contains:
          - '+h'
          - '+s'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Actors commonly weaken controls before running meaningful PowerShell — execution-policy
    bypass flags, AMSI tampering (AmsiUtils, amsiInitFailed), Defender preference changes, or a
    downgrade to PowerShell v2 which lacks script-block logging. Any of these on the same host in
    the hour before a hidden-window launch makes the routine-administration explanation harder to
    sustain and should be folded into the timeline.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did the PowerShell session spawn follow-on processes after the script ran?
  context: A 4104 event records script content, not outcome, and carries no process link — this
    pivots by host, user, and time to the children of the user's PowerShell hosts in the half hour
    after the block was logged. The hidden PowerShell launched by the script appears here too, along
    with anything it started in turn. If the alert fired under SYSTEM or another service principal,
    the user anchor is broad; read the results with that in mind rather than dropping it.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other PowerShell script activity occurred on this host around the alert?
  context: Attacker PowerShell rarely runs as a single block — reconnaissance, staging, and
    follow-on tooling produce a cluster of script blocks in a short window, and surrounding blocks
    from the same session often contain plaintext the alerting fragment lacks. The log.level column
    shows whether the host logs all blocks (verbose) or only automatically flagged content
    (warning); on a warning-only host this view is partial by design, and absence of surrounding
    blocks is not evidence nothing else ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating the host's process activity by image and parent collapses repetitive agent
    telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look for
    reconnaissance commands, staging, persistence mechanisms, or additional scripting hosts in the
    minutes around the hidden-window block — when the launch is part of an intrusion it rarely
    stands alone.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — delivery, defense tampering, credential access —
    may reveal the stages that preceded the hidden-window launch and help reconstruct the timeline.
    Window concealment is typically a mid-chain stealth step rather than the start of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is full script-block logging enabled on this host, or only suspicious-content logging?
  context: PowerShell logs every script block at verbose level only when the Script Block Logging
    policy is enabled; by default it logs only content matching Microsoft's built-in
    suspicious-strings checks, at warning level. On a warning-only host the alerting block is a
    fragment of the host's PowerShell activity, and absence of other 4104 evidence says little. Use
    the level distribution here to calibrate how complete every other script-channel result in this
    investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
- question: Has this exact script block run on this host before?
  context: The script-block hash matches byte-identical content only, so zero history means this
    exact content is new to the host — though a trivially edited variant produces a different hash.
    A block that has recurred for months fits deployment tooling or scheduled automation;
    first-time content deserves the full decode treatment. On hosts without full script-block
    logging the history contains only automatically flagged blocks, which weakens an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
- always_include: true
  question: Has this user previously produced this hidden-window pattern, and does that history fit their role?
  context: The query mirrors the rule's own selection scoped to this user — a 90-day history of
    scripts combining a powershell launch with WindowStyle Hidden, aggregated by host, not generic
    PowerShell use. An operations engineer whose automation regularly suppresses windows reads
    differently from an account producing the pattern for the first time. History covers only hosts
    logging the PowerShell channel, and non-flagged content appears only where full script-block
    logging is enabled, so zero history is weaker evidence on a default-logging fleet.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - powershell
        - WindowStyle
        - Hidden
      filter:
        ScriptBlockText|contains|all:
        - :\Program Files\Amazon\WorkSpacesConfig\Scripts\
        - $PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Which hosts have produced this hidden-window script pattern in the last 90 days, and is the alerting host among them?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior, and script-block events carry no process identity to pivot on — the pattern itself is
    the pivot. This mirrors the rule's selection fleet-wide over 90 days, aggregated by host. A
    pattern appearing routinely across many hosts suggests deployment tooling or vendor automation;
    one that has never appeared before, or only on this host, is the deviation worth chasing.
    Coverage is policy-gated per host, so absence elsewhere is weak evidence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - powershell
        - WindowStyle
        - Hidden
      filter:
        ScriptBlockText|contains|all:
        - :\Program Files\Amazon\WorkSpacesConfig\Scripts\
        - $PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule
      condition: selection and not filter
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: The same account acting on several hosts in the alert window widens the scope — hidden
    execution on one host paired with logons or tooling on others is how lateral movement looks.
    Hosts this account does not normally touch matter as much as the commands run there. If the
    alert fired under SYSTEM or another service principal, this view degrades to agent-telemetry
    noise; the fleet-wide pattern question is the meaningful substitute in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same hidden-window script pattern fire on other hosts in the same window?
  context: The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host — the service-principal-safe version of the cross-network view, since these events carry
    no process identity to pivot on. Several hosts producing the pattern in the same window points
    to pushed or scheduled automation; a single host points to a host-local action. Only hosts
    shipping the PowerShell channel can appear, so absence elsewhere remains weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        ScriptBlockText|contains|all:
        - powershell
        - WindowStyle
        - Hidden
      filter:
        ScriptBlockText|contains|all:
        - :\Program Files\Amazon\WorkSpacesConfig\Scripts\
        - $PSScriptRoot\Module\WorkspaceScriptModule\WorkspaceScriptModule
      condition: selection and not filter
    fields:
    - host.name
