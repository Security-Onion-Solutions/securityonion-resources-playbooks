name: File Creation In Suspicious Directory By Msdt.EXE
id: 832c1db7-eee3-4d59-a4c7-7b35d3b985cb
description: |
  Detects msdt.exe creating files in Desktop, Startup, PerfLogs, ProgramData, or Public directories — a pattern
  associated with exploitation of the Follina (CVE-2022-30190) and Dogwalk msdt.exe vulnerabilities, where a
  crafted document or protocol handler drives the Microsoft Support Diagnostic Tool to drop a payload into an
  autostart or staging location. msdt.exe writing into these directories is not part of its normal diagnostic
  function, so the investigation centres on what launched msdt.exe, what file it dropped, and whether that file
  was set up to execute at logon.
type: detection
detection_id: 318557a5-150c-4c8d-b70e-a9910e199857
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did msdt.exe create a file in one of the flagged directories, and what is the file path?
  context: >-
    Confirm the alert by reviewing the writing process and the target path. The rule fires when msdt.exe writes a
    file whose path contains Desktop, Startup, PerfLogs, ProgramData, or Public. Which directory was written is
    itself a signal — a drop into the Startup folder is autostart persistence, while PerfLogs or Public are common
    staging locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is msdt.exe expected to write files into these directories on this host?
  context: >-
    The Microsoft Support Diagnostic Tool has legitimate uses, but writing executables or scripts into Startup,
    Public, or ProgramData is not part of normal troubleshooting. Knowing whether a diagnostic session was
    underway — an IT-driven support case, for example — helps separate a sanctioned run from exploitation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the content of the file msdt.exe dropped — is it a script, executable, or shortcut set up to run?
  context: >-
    Read and analyze the dropped file. A Startup-folder or Public drop from msdt.exe is typically a payload staged
    for execution — check for a script, a shortcut pointing at a payload, or an executable, and inspect it for
    encoded strings, embedded URLs, or known malicious patterns. Retrieval from the endpoint or EDR is required for
    full content analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the same process also modify any registry keys, such as a Run or autostart value?
  context: >-
    Exploitation frequently pairs a file drop with a registry autostart entry. Retrieving any registry writes made
    by the same process shows whether a Run/RunOnce key, a service, or another persistence value was set alongside
    the dropped file — the actual key path and value data reveal what would execute and when.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: If the dropped file executed, what is its hash — and does it have known AV or threat-intel detections?
  context: >-
    The file-creation event carries no hash; the hash is recorded when the file runs. If the dropped file was
    later executed, read its hash and check reputation. If it is present but has not executed, retrieve it from its
    on-disk path and hash it manually for a reputation lookup.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the dropped file still on disk, or was it deleted, renamed, or executed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A payload still on disk can be retrieved, hashed, and
    analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and
    shifts the focus to what executed in between. A file that persists in Startup remains a logon-time threat.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did msdt.exe write or delete around the alert?
  context: >-
    A process that drops one file into a staging directory often drops several — an unpacked component set, a
    shortcut plus its payload, or multiple staged artifacts. The breadth, paths, and extensions of msdt.exe's other
    file activity distinguish a single drop from a broader staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What launched msdt.exe, and is that parent expected to start it?
  context: >-
    The launching process is the crux of this detection. Follina-style exploitation drives msdt.exe from a document
    handler or an Office application rather than from a user-initiated troubleshooting flow. Tracing msdt.exe's
    parent — and what started that parent — reveals whether the execution chain began with a user opening a file or
    a protocol handler invoked by exploit content.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host previously produced this msdt.exe file-drop pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a signed system tool can be abused. The query mirrors the rule's selection scoped to
    this host — the resulting program/user distribution reflects how this specific pattern has
    historically run here. A new acting program process or an unexpected user account for this
    activity is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        TargetFilename|contains:
        - \Desktop\
        - \Start Menu\Programs\Startup\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this msdt.exe file-drop pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific pattern.
    Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        TargetFilename|contains:
        - \Desktop\
        - \Start Menu\Programs\Startup\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Users\Public\
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the user's 90-day history of this exact
    msdt.exe file-drop pattern, aggregated by host. A user who has never produced this pattern is more suspicious
    than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        TargetFilename|contains:
        - \Desktop\
        - \Start Menu\Programs\Startup\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Users\Public\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the alerting program historically driven this pattern on this host or across the environment, or is it new?
  context: >-
    When the drop runs under a service principal such as SYSTEM, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, giving its 90-day history of driving this exact pattern. A new or rare program is the deviation worth
    chasing; a program behind thousands of prior events is established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \msdt.exe
        TargetFilename|contains:
        - \Desktop\
        - \Start Menu\Programs\Startup\
        - C:\PerfLogs\
        - C:\ProgramData\
        - C:\Users\Public\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Was msdt.exe executed from its expected System32/SysWOW64 path, and does its original filename still read as msdt.exe?
  context: >-
    A LOLBin run from a non-standard path, or one whose internal original filename does not match its on-disk name,
    may be a copied or renamed binary used to evade path-based allowlists. Confirming msdt.exe ran from its genuine
    system location and carries its expected original filename distinguishes the real tool from a planted look-alike.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other proxy-execution LOLBins used to achieve the same objective on this host recently?
  context: >-
    Operators who abuse one signed binary for proxy execution often reach for others — rundll32, regsvr32, mshta,
    control, or similar. Finding additional proxy-execution LOLBins running on this host around the same window
    strengthens the case that msdt.exe's activity is part of a deliberate exploitation chain rather than an
    isolated diagnostic event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\control.exe'
          - '\mavinject.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious document open, an Office application spawning unexpected
    children, or a protocol-handler abuse alert — may reveal how the msdt.exe invocation was triggered and
    reconstruct the delivery-to-drop sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to other persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Beyond the directory this rule flagged,
    additional drops into Startup folders or paths referenced by registry Run keys reveal whether more than one
    autostart mechanism was staged in the same session.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the drop reveals what led to it — a document open,
    an exploit, or a download — and what followed. Novel parent-child process pairs at low counts are what to scan
    for against the routine host baseline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
