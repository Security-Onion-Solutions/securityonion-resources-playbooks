name: Antivirus Filter Driver Disallowed On Dev Drive - Registry
id: ff4bcc7b-5e60-43ce-baa1-6b195a6a488f
description: |
  Detects a registry modification that sets the Filter Manager value FltmgrDevDriveAllowAntivirusFilter to DWORD 0, which
  disallows the antivirus minifilter driver from inspecting files on a Windows "Dev Drive." With the filter disabled, files
  written to or executed from that volume are not scanned, creating a scan-blind location on the host. This is a defense-evasion
  action: legitimate use is rare and by-design for developer performance, while malicious use stages a payload or build artifacts
  where endpoint file inspection cannot reach. Investigation should confirm the value data, identify the writing process and
  user, and determine what activity followed once inspection was disabled.
type: detection
detection_id: 31e124fb-5dc4-42a0-83b3-44a69c77b271
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path (the
    FltmgrDevDriveAllowAntivirusFilter value under the Filter Manager key), the value data (Details should be DWORD 0, meaning
    the antivirus minifilter is disallowed on the Dev Drive), and the process that performed the write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change antivirus filter-driver policy on a Dev Drive?
  context: Legitimate developer or IT-provisioning activity can toggle Dev Drive settings, but for most users and hosts this
    value should never change. Knowing whether the user role and host function are consistent with reconfiguring endpoint file
    inspection is often the fastest path to distinguishing a sanctioned change from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry key and value were modified, and is this a known evasion location?
  context: The FltmgrDevDriveAllowAntivirusFilter value under the Filter Manager key governs whether the antivirus minifilter
    attaches to a Dev Drive. A DWORD 0 detaches it, so files on that volume are no longer scanned. This is a documented antivirus-bypass
    setting rather than a persistence key; the writing process (Image) and the exact value data determine whether this was a
    deliberate evasion action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What did the process that disabled the antivirus filter run, and how was the value set?
  context: The write to FltmgrDevDriveAllowAntivirusFilter can be made by reg.exe, a PowerShell cmdlet, a signed installer,
    or custom code. Decoding the full command line of the writing process reveals whether this was an interactive administrative
    change, a scripted step in a larger operation, or an implant configuring a scan-blind volume before staging a payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this Filter Manager value been modified before on this host?
  context: Dev Drive antivirus-filter policy should rarely change. A first-time or very rare modification is more suspicious
    than a value that has been toggled before as part of routine developer provisioning. Compare the historical Details values
    to see whether the same setting was applied previously or whether this is the first time inspection was disabled.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does the disabled state persist, or was the antivirus filter re-enabled afterward?
  context: Endpoint telemetry records registry value writes but not value deletions, so attacker cleanup of the key is not directly
    observable. Judge whether inspection is still disabled from the key's re-modification history over a longer window -- a
    later write restoring the value to 1 indicates the change was temporary, while no such write means the Dev Drive likely
    remains scan-blind.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is antivirus filtering on the Dev Drive currently restored, or is the host still unprotected?
  context: The tampering may have been temporary for a single action or left in place. If the minifilter is still detached from
    the Dev Drive, files on that volume continue to bypass endpoint file inspection and the setting should be restored before
    further investigation. Confirm current state through host inspection of the Filter Manager value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the antivirus filter was disabled?
  context: Defenses are disabled for a reason -- to write or execute code that would otherwise be scanned. Examining process
    activity immediately after the value was set reveals what the scan-blind Dev Drive was used for. New processes launching
    from or writing to that volume in the window after the change point to the activity the tampering was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Did a payload run from or land on the Dev Drive after inspection was turned off?
  context: The purpose of detaching the antivirus minifilter is to run or stage files where they will not be scanned. Look for
    process execution originating from the Dev Drive volume in the hours after the change, which confirms the scan-blind location
    was actually used rather than configured and left idle. Dev Drives mount as a separate volume, so the query
    keeps only executions whose image path is off the system drive (C:); confirm the actual Dev Drive letter from
    the host's volume configuration, and expect zero results if the scan-blind volume was never used.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_sysdrive:
        Image|startswith: 'C:\'
      condition: selection and not filter_sysdrive
    fields:
      - Image
      - CommandLine
- question: Were other defense tampering actions performed on this host?
  context: Attackers who disable one control often disable several -- detaching the Dev Drive filter AND stopping services AND
    clearing logs AND deleting shadow copies maximizes coverage. Finding additional tampering events from the same user or
    parent process indicates multiple controls were targeted in the same operation rather than an isolated setting change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: Attackers who change one registry value often change several -- disabling file inspection alongside adding a Run
    key for persistence or altering firewall policy. Clusters of registry writes from the same user and writing process within
    a short window reveal the full scope of the configuration changes and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was this Filter Manager value modified on other hosts in the environment?
  context: The same modification across multiple hosts may indicate a policy or provisioning rollout, whereas a change isolated
    to this one host is more consistent with targeted tampering. Compare the Details values and writing processes across hosts
    to tell a fleet-wide configuration change apart from a one-off evasion action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining what ran shortly before and after the registry change reveals the immediate
    context -- what invoked the change, what followed it, and whether it is one step in a larger sequence. Novel parent-child
    process pairs stand out against the routine background of agent and system activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- reconnaissance, credential access, or other defense tampering -- may reveal
    the attack stages that preceded disabling file inspection and help reconstruct the timeline. Defense tampering commonly
    sits mid-chain, after initial access and before the actions it is meant to hide.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Defense tampering frequently accompanies persistence installation. After creating a scan-blind location, an actor
    commonly stacks footholds using scheduled tasks, services, registry Run keys, BITS jobs, or WMI. Multiple persistence installations
    in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: File-based persistence bypasses command-line detection entirely -- dropping an executable or script into the Startup
    folder or a path referenced by a registry Run key achieves persistence without running scheduling or service tools. File
    event monitoring captures these drops even when the actor avoids the standard persistence utilities.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
