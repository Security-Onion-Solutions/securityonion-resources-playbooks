name: Suspicious LNK Double Extension File Created
id: 6e6165c6-397a-40ef-9a7e-fbb86beef595
description: |
  Detects creation of a shortcut (.lnk) file whose name embeds a deceptive second
  document extension (for example invoice.pdf.lnk or report.xls.lnk), excluding the
  legitimate Office and Recent shortcut folders. Windows hides the .lnk extension by
  default, so such a file is presented to the user as a document while it is actually
  an executable shortcut that runs an embedded target command when opened. Benign
  matches are typically recent-file shortcuts written by Office applications (filtered
  out by the rule); malicious use is a common phishing lure that drops a disguised .lnk
  which launches a script host or living-off-the-land interpreter. Investigation should
  confirm the double-extension pattern, inspect what the shortcut actually points to,
  identify the process that wrote it and how it arrived, and check for follow-on
  execution on the host.
type: detection
detection_id: 3215aa19-f060-4332-86d5-5602511f3ca8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file match the double-extension .lnk pattern this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file name and path. The
    rule fires when a file ends in .lnk AND its name also contains an embedded document
    extension (.doc, .docx, .jpg, .pdf, .ppt, .pptx, .xls, .xlsx) — a shortcut disguised
    as a document — and did not land in the excluded Office or Recent shortcut folders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have a document-named shortcut written to this location?
  context: >-
    Legitimate activity can create .lnk files, but a shortcut carrying a hidden second
    document extension outside the Office recent-file folders is unusual for normal use.
    Knowing whether the user role and host function are consistent with generating this
    file is often the fastest path to distinguishing a benign artifact from a phishing
    lure. When the user is a machine or service account, judge by the writing process and
    host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does this shortcut actually point to? Retrieve the .lnk and inspect its target and arguments.
  context: >-
    A .lnk file embeds a target path, command-line arguments, working directory, and icon.
    A shortcut disguised as a document typically points to a script host (mshta.exe,
    wscript.exe, powershell.exe, cmd.exe) or fetches a remote payload. The file event only
    records the creation, so retrieve the .lnk and parse its target to see what runs when
    it is opened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process launched the process that wrote this shortcut, and is that chain expected?
  context: >-
    The lineage above the writing process reveals how the shortcut was delivered.
    Extraction from an archive (7z, WinRAR, the built-in zip handler), a save from a
    browser or mail client, or a drop by a script host each imply a different delivery
    path. A shortcut written by an interactive user copy looks different from one dropped
    by an automated child of mshta.exe or a mail client. If the parent identifier is not
    populated on the file event, pivot on the writing process and host instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one disguised shortcut often drops several artifacts — a lure
    document alongside the shortcut, a staged payload, or a batch of decoys. The breadth,
    paths, and extensions of the writing process's other file activity distinguish a
    single artifact from a staging operation and enumerate what else needs review. This
    correlation covers the writer and its direct children, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a shortcut with this name been seen before on this host?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of
    normal operations. First-time appearance of a document-named shortcut should be
    checked even when the name looks benign. Zero or very low historical counts indicate a
    new or unusual artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is a shortcut with this deceptive name present on any other hosts?
  context: >-
    The same disguised shortcut appearing on multiple hosts points to a distributed
    phishing lure or deliberate staging rather than an isolated event. If the file is only
    on one host it may be a targeted delivery; if on many, establish the distribution
    pattern and timeline to size the affected population.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: After this shortcut was written, did script hosts or living-off-the-land interpreters launch on the host?
  context: >-
    A disguised .lnk is meant to be opened, at which point its embedded target runs. The
    file event cannot record what the shortcut points to, so the execution stage surfaces
    as an interpreter starting shortly after the drop (mshta.exe, wscript.exe,
    powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe), especially one spawned from
    explorer.exe. Examine the command line for a downloaded or embedded payload. Because
    this is a host-and-time correlation, weigh it against normal interpreter usage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \mshta.exe
          - \wscript.exe
          - \cscript.exe
          - \powershell.exe
          - \pwsh.exe
          - \cmd.exe
          - \rundll32.exe
          - \regsvr32.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- always_include: true
  question: Has this user previously produced this double-extension shortcut pattern, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection scoped to this user — the result is the user's
    90-day history of this specific double-extension .lnk pattern (not generic file
    activity), aggregated by host. A user who has never produced this pattern is more
    suspicious than one who does so regularly; weigh the count against the user's role and
    typical activity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .lnk
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpg.
        - .pdf.
        - .ppt.
        - .pptx.
        - .xls.
        - .xlsx.
      filter_main_recent:
        TargetFilename|contains: \AppData\Roaming\Microsoft\Windows\Recent\
      filter_optional_office_recent:
        Image|endswith:
        - \excel.exe
        - \powerpnt.exe
        - \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
      filter_optional_office_excel:
        Image|endswith: \excel.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Excel
      filter_optional_office_powerpoint:
        Image|endswith: \powerpnt.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\PowerPoint
      filter_optional_office_word:
        Image|endswith: \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Word
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this writing process historically driven this shortcut pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not
    attribute behavior; the meaningful pivot is the launch mechanism. This query mirrors
    the rule's selection scoped to the alerting program — the 90-day history of that
    process driving this double-extension pattern. A new or rare program for this pattern is
    the deviation worth chasing; one accounting for many prior events is likely automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .lnk
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpg.
        - .pdf.
        - .ppt.
        - .pptx.
        - .xls.
        - .xlsx.
      filter_main_recent:
        TargetFilename|contains: \AppData\Roaming\Microsoft\Windows\Recent\
      filter_optional_office_recent:
        Image|endswith:
        - \excel.exe
        - \powerpnt.exe
        - \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
      filter_optional_office_excel:
        Image|endswith: \excel.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Excel
      filter_optional_office_powerpoint:
        Image|endswith: \powerpnt.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\PowerPoint
      filter_optional_office_word:
        Image|endswith: \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Word
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether this shortcut drop is
    isolated or part of broader activity. If the same user triggered similar activity on
    multiple hosts, the scope may be larger than a single endpoint. When the alert fires
    under a service or machine account this view returns agent-telemetry noise — read it
    alongside the parent-process view of the same window.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same writing-process pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns constant
    agent noise. The meaningful question is whether the same launch mechanism produced this
    shortcut pattern elsewhere in the alert window. This query mirrors the rule's selection
    scoped to the alerting program, fleet-wide. Multiple hosts in the same window
    point to a pushed or scheduled rollout; a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: .lnk
        TargetFilename|contains:
        - .doc.
        - .docx.
        - .jpg.
        - .pdf.
        - .ppt.
        - .pptx.
        - .xls.
        - .xlsx.
      filter_main_recent:
        TargetFilename|contains: \AppData\Roaming\Microsoft\Windows\Recent\
      filter_optional_office_recent:
        Image|endswith:
        - \excel.exe
        - \powerpnt.exe
        - \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Office\Recent\
      filter_optional_office_excel:
        Image|endswith: \excel.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Excel
      filter_optional_office_powerpoint:
        Image|endswith: \powerpnt.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\PowerPoint
      filter_optional_office_word:
        Image|endswith: \winword.exe
        TargetFilename|contains: \AppData\Roaming\Microsoft\Word
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the shortcut
    creation reveals what led to it and what happened after — an archive extractor or mail
    client immediately before, or a script host and follow-on tooling immediately after.
    Novel parent-child pairs stand out at low counts against the repetitive high-count
    rows of routine host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, defense tampering, or other
    delivery activity — may reveal the stages that preceded this shortcut being written and
    help reconstruct the timeline. The alert sequence on a host often tells the fuller
    story of how the artifact arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is the shortcut still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A shortcut still on
    disk can be retrieved, parsed, and its target analyzed; a file deleted seconds after
    creation suggests anti-forensic cleanup or a self-removing dropper and shifts the
    investigation toward what executed in between. Interpret the operation type: a deletion
    shortly after creation is the cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
