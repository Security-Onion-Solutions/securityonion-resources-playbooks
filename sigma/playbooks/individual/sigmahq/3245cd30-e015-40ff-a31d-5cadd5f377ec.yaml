name: HackTool - Rubeus Execution - ScriptBlock
id: 3c64c07b-2669-47a8-9047-cebeaa932517
description: |
  Detects the Kerberos-abuse tool Rubeus by matching its characteristic action strings
  (asreproast, kerberoast, asktgt, s4u, ptt, renew, harvest, dump, golden, silver,
  createnetonly, impersonateuser) in PowerShell script-block content. Rubeus is a .NET
  toolset that requests, forges, and injects Kerberos tickets by sending raw Kerberos
  traffic to a domain controller — it does not read LSASS memory and often needs no
  elevation, which is why it appears as loaded .NET code rather than a credential-dump
  process. Legitimate matches are essentially limited to authorized penetration tests and
  red-team exercises; outside those, the presence of these strings points to credential
  access (Kerberoasting / AS-REP roasting), ticket theft or forgery, and pass-the-ticket
  lateral movement. Investigation should confirm which Rubeus action ran, read the full
  script block, corroborate against Kerberos ticket-request logs, and determine which
  accounts and tickets were exposed.
type: detection
detection_id: 3245cd30-e015-40ff-a31d-5cadd5f377ec
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block content match Rubeus action strings this rule detects?
  context: Confirm the alert is a true positive by reading the full script block against the
    rule's Rubeus patterns (asreproast, kerberoast, asktgt, s4u, ptt, renew, harvest, dump,
    golden, silver, createnetonly, impersonateuser). Long scripts are split across multiple
    4104 events — this retrieves every chunk of the alerting block in sequence/total order so
    the match is judged on the complete script, not the alerting fragment. A single fragment
    quoting one of these strings inside a comment or a defensive script reads very differently
    from a block that actually invokes the action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
  answer_sources:
  - alert
  - ps_script
- question: Is this Rubeus execution part of an authorized penetration test or red team engagement?
  context: Rubeus is standard tradecraft in authorized security assessments, and an active
    engagement is by far the most common benign explanation for these strings. Before investing
    further analysis, check whether a pentest or red-team exercise is currently scoped to this
    host or network segment. An authorized engagement with matching tooling and timing resolves
    the alert; absence of one, or activity outside the agreed window and scope, keeps it live.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this user and host expected to run Kerberos ticket tooling?
  context: Legitimate use of raw Kerberos tooling is rare and normally confined to security
    testers or specific administrative automation. Knowing whether the acting account and host
    function are consistent with that is often the fastest way to separate a sanctioned test
    from unexpected activity. A SYSTEM or machine-account context usually means the block ran
    under an agent or scheduled mechanism — judge by the host role and the on-disk script path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which Rubeus action was invoked, and what does it tell you about the objective?
  context: Rubeus is multi-purpose, and the action string that matched determines the scope of
    potential compromise. kerberoast and asreproast request crackable ticket material for offline
    password recovery; asktgt / s4u / ptt / renew request and inject tickets for impersonation and
    pass-the-ticket movement; golden and silver forge tickets from a stolen key; dump and harvest
    collect ticket material from the host. Read the specific action and its arguments (target user,
    SPN, /impersonateuser, /ticket, encryption flags) from the decoded script block. This query
    shows the acting user's process activity in the window, which surfaces the case where Rubeus
    ran as an on-disk Rubeus.exe (its command line and flags visible directly) rather than as an
    in-memory .NET assembly, where the arguments live only in the script block.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What does the full script block do beyond the matched Rubeus string — any download cradle, encoding, or in-memory assembly load?
  context: 4104 content is the post-decoding ground truth — PowerShell logs what it actually
    compiled, so any -EncodedCommand or base64 wrapper is already unwrapped here. Read the
    reassembled block for how Rubeus was delivered and driven — a download cradle (IEX,
    Net.WebClient, Invoke-WebRequest), a reflectively loaded .NET assembly
    (Reflection.Assembly.Load / [Reflection.Assembly]::Load of the Rubeus bytes), and the
    arguments passed to it. String-level obfuscation inside the script (concatenation, format
    operators, backticks) is the only layer that may still need manual decoding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
  answer_sources:
  - ps_script
  - manual_review
- question: Which accounts, SPNs, or tickets were targeted?
  context: For Kerberos abuse the target set is the compromise set. kerberoast targets accounts
    with a Service Principal Name (request RC4 service tickets for offline cracking); asreproast
    targets accounts with pre-authentication disabled; asktgt / s4u / ptt name a specific user
    (/user, /impersonateuser) and often a service (/msdsspn); golden and silver forge tickets for
    a chosen principal. Read the action's arguments from the script block to list the targeted
    principals, then weigh their privilege — a targeted Domain Admin, krbtgt, or high-value
    service account raises the severity and drives which credentials must be reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: Did the script run from a file on disk, and what created it?
  context: When the block ran from a file, its path is recorded on the 4104 event. A Rubeus
    loader script staged in a user-writable or delivery location (Temp, AppData, ProgramData,
    Downloads) implies a prior write step — find the file-creation event to identify the process
    and account that dropped it. Interactive or in-memory execution logs no path at all, which
    for a Kerberos-abuse block is itself notable — fileless, reflectively loaded execution is a
    deliberate evasion choice, and the fallback is the script-block and process context rather
    than an on-disk artifact.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: PowerShell logs script blocks at verbose level when the Script Block Logging policy is
    enabled, and only Microsoft's automatically-flagged suspicious blocks (at warning level) when
    it is not. Rubeus strings are exactly the kind of content the suspicious-only subset captures,
    so on a warning-only host this alert may be the one block that surfaced while surrounding
    activity went unlogged. The level distribution tells you how complete your view of this host's
    PowerShell activity is before you read absence of other evidence as meaningful.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
  answer_sources:
  - ps_script
- question: Were PowerShell or AV controls bypassed or weakened before this execution?
  context: Loading an offensive .NET assembly in memory usually requires getting past AMSI, and
    operators often weaken controls just before running the payload — AMSI bypass (patching
    amsi.dll, AmsiUtils / amsiInitFailed), an execution-policy change (-ExecutionPolicy Bypass or
    -ep bypass), Defender tampering (Set-MpPreference, DisableRealtimeMonitoring), or a downgrade
    to PowerShell v2 which lacks this logging. Finding these precursors in the preceding window
    strengthens the case that the session was chosen for evasion.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Do Kerberos ticket-request logs show anomalous service-ticket or AS-REQ activity around the alert?
  context: Kerberoasting and AS-REP roasting leave a signature in domain controller security logs
    that corroborates what the script block did. Service-ticket requests (4769) with RC4 encryption
    (ticket encryption type 0x17) in an environment that should use AES, or many 4769 requests for
    different service accounts from one account in a short window, is the on-the-wire signature of
    kerberoast; authentication requests (4768) without pre-authentication point to AS-REP roasting.
    If domain controller security logs are not ingested in this environment, treat zero results as
    a visibility gap rather than evidence nothing ran, and rely on the decoded script action instead.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4768
          - 4769
      condition: selection
    fields:
      - TargetUserName
      - ServiceName
      - TicketEncryptionType
      - IpAddress
  answer_sources:
  - manual_review
  - active_directory
- question: Are Rubeus output artifacts present on the host?
  context: Rubeus writes recognizable artifacts. Roasting output is hashcat-format hash files
    (often named or redirected to disk via /outfile); ticket operations produce base64 .kirbi
    blobs, and the common decode step writes a .kirbi file directly
    ([IO.File]::WriteAllBytes("ticket.kirbi", ...)). createnetonly spawns a hidden process under
    a new logon session. Checking for these files and their creating process confirms execution
    and reveals the extent of ticket collection even after the original session has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Did the PowerShell session spawn follow-on processes after the script ran?
  context: A 4104 event records script content, not execution outcome, and it carries no process
    identity to join on — so follow-on activity is pivoted by host, user, and time. Children of the
    host's PowerShell processes shortly after the block are the closest process-side view of what
    Rubeus led to — a createnetonly-spawned process running under a new logon session, remote-access
    or reconnaissance tooling, or further script hosts. A SYSTEM-owned alert makes the user anchor
    broad; read the results against the host's normal automation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Ticket theft and forgery are a means to lateral movement — a pass-the-ticket (ptt) or
    s4u action exists to authenticate somewhere else. The query returns outbound connections from
    this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the
    hours after the event, with the originating Image and User. Two limits. A ticket injected here
    and replayed from another machine will not appear (check 4624 logons on suspected targets for
    the exposed accounts), and where network-connection telemetry is not collected, treat zero rows
    as a visibility gap rather than proof no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Has this user previously produced the rule's Rubeus pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the
    user's 90-day history of these specific Rubeus action strings (not generic PowerShell use),
    aggregated by host. A user who has never produced this pattern is more suspicious than one who
    does so regularly, such as a security tester with a standing testing cadence; weigh the count
    against the account's role. On hosts without full Script Block Logging the history contains only
    Microsoft-flagged blocks, so an empty result is weaker evidence than it looks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Which hosts have historically produced this Rubeus pattern, and is the alerting host among them?
  context: When the alert fires under a service principal, user identity does not attribute behavior,
    and PowerShell channel events carry no process identity to pivot on. The meaningful pivot is the
    pattern itself — the query mirrors the rule's selection fleet-wide over 90 days, aggregated by
    host. A pattern that routinely appears on many hosts is more likely standing security-testing
    automation; one that has never appeared before, or only on this host, is the deviation worth
    chasing. Coverage is limited to hosts shipping the PowerShell channel with sufficient logging.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      condition: selection
    fields:
    - host.name
  always_include: true
  answer_sources:
  - ps_script
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals whether
    Kerberos abuse is isolated or part of movement across multiple endpoints. If the same user
    triggered similar tooling elsewhere, the scope of compromise is larger than this host. When the
    alert fires under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, a fleet-wide user
    pivot returns background agent telemetry rather than an actor trail — read the fleet-pattern
    question instead for those cases.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same Rubeus pattern fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: Under a service principal, "what else did this user do across the network" returns
    agent-telemetry noise, and PowerShell channel events carry no process identity to pivot on. The
    meaningful question is whether the same script pattern fired elsewhere — the query mirrors the
    rule's selection fleet-wide in the alert window, aggregated by host. Multiple hosts in the same
    window points to scheduled or pushed automation (including standing security testing); a single
    host points to a host-local trigger. Only hosts shipping the PowerShell channel with sufficient
    logging can appear, so absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - 'asreproast '
        - 'dump /service:krbtgt '
        - dump /luid:0x
        - 'kerberoast '
        - 'createnetonly /program:'
        - 'ptt /ticket:'
        - '/impersonateuser:'
        - 'renew /ticket:'
        - 'asktgt /user:'
        - 'harvest /interval:'
        - 's4u /user:'
        - 's4u /ticket:'
        - 'hash /password:'
        - 'golden /aes256:'
        - 'silver /user:'
      condition: selection
    fields:
    - host.name
  always_include: true
  answer_sources:
  - ps_script
- question: Did other detections fire on this host in the hours before this alert?
  context: Kerberos abuse is usually a mid-chain step, not the start. Earlier detections on the same
    host — reconnaissance, defense tampering, or initial credential access — may reveal the stages
    that preceded this execution and help reconstruct the timeline. A cluster of prior alerts moving
    toward credential access strengthens the case that this is an active operation rather than a
    one-off script.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
