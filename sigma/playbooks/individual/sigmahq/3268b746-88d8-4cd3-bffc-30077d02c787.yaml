name: HackTool - Empire PowerShell UAC Bypass
id: 3ee393eb-f365-4673-b943-bf6390adbe42
description: |
  Detects PowerShell command lines matching Empire's auto-elevated UAC bypass bootstrap, which reads a
  staged payload from the HKCU\Software\Microsoft\Windows Update registry value and re-launches it with
  -NoP -NonI -w Hidden to run hidden and non-interactive. The bypass works by writing a command into a
  registry key that an auto-elevated binary (eventvwr.exe or fodhelper.exe) reads and executes at high
  integrity without a consent prompt. The investigation should confirm the exact command matched, decode
  what the staged payload does, locate the registry write that set up the bypass, and determine what ran
  at high integrity afterward.
type: detection
detection_id: 3268b746-88d8-4cd3-bffc-30077d02c787
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match the Empire UAC bypass bootstrap this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line. The rule fires on PowerShell launched with the -NoP -NonI -w Hidden flags running a -c
    block that reads a staged payload from the HKCU\Software\Microsoft\Windows Update Update value and
    re-executes it. Confirm those flags and the registry read are present verbatim.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run hidden non-interactive PowerShell that re-executes a registry-staged payload?
  context: Legitimate administrative activity can trigger many detections, but the staged-payload-from-registry
    pattern this rule matches has essentially no benign administrative equivalent. Knowing whether the user
    role and host function involve any scripted automation that mirrors this pattern is the fastest path to
    distinguishing a true positive from a rare benign case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Empire UAC bypass execution part of an authorized penetration test or red team engagement?
  context: This bootstrap is a known offensive framework module used in authorized security assessments. Before
    investing investigation time, check whether a penetration test or red team exercise is currently active on
    this host or network segment. An authorized engagement with matching tooling and timing resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which UAC bypass variant does the staged command indicate, and what does the staged payload do?
  context: The command reads its payload from the HKCU\Software\Microsoft\Windows Update Update value, so the
    visible command line is only the launcher. Identify which auto-elevated trigger the variant relies on
    (eventvwr.exe or fodhelper.exe), then recover the staged payload content to determine what was set to run
    at high integrity. The payload determines the scope of potential compromise and required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full PowerShell command line - what does the registry-staged payload resolve to and execute?
  context: The full command line reveals the specific action taken. This launcher reads the staged payload from
    the registry and runs it, so the meaningful content is what that value holds. Decode any base64, string
    concatenation, or download cradle in the recovered payload to understand what the bypass was set up to run
    with elevated privileges.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the staged payload encoded or obfuscated, and what does it decode to?
  context: Attackers frequently encode or obfuscate the payload that this launcher stages and re-executes -
    base64, string concatenation, backtick escaping, or variable substitution. Decoding reveals the actual
    payload, such as a download cradle, reverse shell, or in-memory execution of a .NET assembly. The value
    read from the registry is the content to decode, since the visible command line only re-runs it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a payload written to the registry key this bypass reads from shortly before the alert?
  context: This bypass relies on staging a command into a user-writable registry value that an auto-elevated
    process reads and executes. The launcher reads from HKCU\Software\Microsoft\Windows Update, and Empire
    variants also write the auto-elevation trigger to HKCU\Software\Classes\mscfile\shell\open\command
    (eventvwr) or ms-settings\Shell\Open\command (fodhelper). Finding the write confirms the bypass mechanism
    and recovers the exact payload set to run at high integrity.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Software\Microsoft\Windows Update'
          - '\mscfile\shell\open\command'
          - '\ms-settings\Shell\Open\command'
          - '\ms-settings\shell\open\command'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Did PowerShell script block logging capture the deobfuscated content of the staged payload?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes,
    even when the staged payload is encoded or read indirectly from the registry. This provides ground truth
    about what ran, bypassing obfuscation in the launcher. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What action was performed with elevated privileges after the UAC bypass?
  context: UAC bypass is a means to an end. After elevation the operator typically installs persistence, dumps
    credentials, tampers with security tools, or accesses protected resources. Examining processes spawned at
    high or system integrity on this host shortly after the bypass reveals the objective.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Was a memory-dump-style file written to disk on this host after the UAC bypass, consistent with a subsequent LSASS read at the newly elevated integrity level?
  context: After a successful UAC bypass the high-integrity process is positioned to access protected memory, most
    notably to read lsass.exe for credential material, but the handle open that a read requires — by the auto-elevated
    trigger (eventvwr.exe, fodhelper.exe) or a PowerShell child — has no equivalent telemetry in this environment, so
    a zero result there does not mean nothing happened. What is observable is the artifact a completed read leaves on
    disk — a .dmp/.dump/.bin file, commonly under a temp or user-writable path, appearing after the bypass.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_ext:
        TargetFilename|endswith:
          - '.dmp'
          - '.dump'
          - '.bin'
      condition: selection and filter_ext
    fields:
      - Image
      - TargetFilename
      - EventType
- question: Were other UAC bypass or privilege escalation techniques attempted on this host?
  context: Operators who attempt one UAC bypass often try multiple methods until one succeeds, especially when
    the OS version or configuration blocks certain techniques. Other privilege-escalation detections on the
    same host from the same user or process confirm deliberate escalation activity rather than an isolated
    false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: When this host previously fired this Empire bypass pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's command-line selection scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run here, not generic PowerShell
    usage. A new parent process, an unexpected user account, or a first-ever appearance of this pattern is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)'
        - ' -NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)'
        - ' -NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered related activity on several hosts, the scope of the operation may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)'
        - ' -NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering,
    reconnaissance, or credential access - may reveal the attack stages that preceded the bypass and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this Empire bypass pattern in the past week, and does the distribution look like automation or isolated activity?
  context: The query mirrors the rule's command-line selection with no host scope, so the result is a fleet-wide
    count of this specific firing pattern rather than generic PowerShell usage. Many hosts firing the same
    pattern points to scripted deployment; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' -NoP -NonI -w Hidden -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update)'
        - ' -NoP -NonI -c $x=$((gp HKCU:Software\Microsoft\Windows Update).Update);'
      condition: selection
    fields:
    - host.name
