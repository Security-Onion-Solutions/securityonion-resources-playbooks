- question: How often has this host fired the rule's LOLBin pattern over the past 90 days, and what command-line structures
    are typical?
  context: A registration pattern with no prior history on a host is a different proposition from one that runs on a schedule
    under a stable parent. The query mirrors the rule's selection structure scoped to this host, so the count reflects this
    specific pattern rather than generic regsvr32 usage, and the command-line projection lets the alerting invocation be compared
    against the typical ones — same module path and switches means the same routine, a new module path or a newly added /i
    string means something changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_path_1:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - \Windows\Registration\CRMLog
        - \Windows\System32\com\dmp\
        - \Windows\System32\FxsTmp\
        - \Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - \Windows\System32\spool\drivers\color\
        - \Windows\System32\spool\PRINTERS\
        - \Windows\System32\spool\SERVERS\
        - \Windows\System32\Tasks_Migrated\
        - \Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - \Windows\SysWOW64\com\dmp\
        - \Windows\SysWOW64\FxsTmp\
        - \Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - \Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - \Windows\Tasks\
        - \Windows\Tracing\
      selection_path_2:
        CommandLine|contains:
        - ' "C:\'
        - ' C:\'
        - ' ''C:\'
        - D:\
      selection_exclude_known_dirs:
        CommandLine|contains:
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\ProgramData\
        - C:\Users\
        - ' C:\Windows\'
        - ' "C:\Windows\'
        - ' ''C:\Windows\'
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (selection_path_1 or (selection_path_2 and not selection_exclude_known_dirs)) and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
  answer_sources:
  - process_creation
