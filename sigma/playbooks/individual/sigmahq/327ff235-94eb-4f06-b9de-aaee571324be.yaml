- question: Was regsvr32 itself executed from its expected path under System32 or SysWOW64?
  context: The rule matches on either the image name or the original filename, so a copy of regsvr32.exe renamed to something
    else and placed elsewhere still fires it. Compare the Image path against System32 and SysWOW64, and compare the image name
