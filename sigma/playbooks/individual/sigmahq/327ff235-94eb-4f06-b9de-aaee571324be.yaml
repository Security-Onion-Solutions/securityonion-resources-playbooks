name: Regsvr32 Execution From Highly Suspicious Location
id: 2ad061cd-a3f6-4715-bc5c-720236bca71e
description: |
  Detects regsvr32.exe — matched either by image name or by original filename, so a renamed copy still matches — invoked with a command line that either references one of a fixed list of non-standard directories (PerfLogs, Temp, the print-spooler and fax staging folders, Registration\CRMLog, the MachineKeys store, Tasks, Tasks_Migrated and Tracing), or references a drive-letter path that is not under Program Files, Program Files (x86), ProgramData, Users, or Windows. Empty and absent command lines are filtered out.
  regsvr32.exe is a signed system binary whose normal job is registering and unregistering COM servers, so installers, software-deployment agents, and administrative scripts invoke it routinely from installation directories; the discriminating detail here is the directory the module is read from, not the binary. Proxy execution through regsvr32 lets code run under a signed process, and the module can be a DLL, an .ocx, or a scriptlet (.sct/.wsc) whose registration entry point executes attacker-controlled script.
  Determine which module the command line points at, which process wrote it into that directory, whether the loaded module is signed and previously known, whether regsvr32 made outbound connections or spawned children afterward, and whether this user, parent, or host has produced the same pattern before.
type: detection
detection_id: 327ff235-94eb-4f06-b9de-aaee571324be
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line either reference one of the rule's listed non-standard directories, or a drive-letter path outside Program Files, ProgramData, Users, and Windows?
  context: >-
    The rule fires on regsvr32.exe (by image name or original filename) plus one of two alternatives: the command line contains
    one of the enumerated directories such as PerfLogs, Temp, Windows\Tasks, Windows\Tracing, the spooler or FxsTmp staging
    folders, or the MachineKeys store; or it contains a drive-letter path that is not under Program Files, ProgramData, Users,
    or Windows. Read the full command line and note which alternative matched, because that determines what carries weight next.
    A match on the enumerated-directory alternative names the directory outright; a match on the drive-letter alternative means
    the module sits somewhere outside every allowed root, and the module's own origin and signing become the load-bearing detail.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register COM servers from a directory outside the normal installation roots?
  context: COM registration is a routine step of software installation and of some administrative scripts, but it normally
    reads the module from the product's own installation directory. A developer, packaging engineer, or deployment host may
    legitimately register modules from staging directories; a general-purpose workstation account doing so is a different
    proposition. Establish the role of the account and the function of the host before spending further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the referenced module still on disk, and did the alerting process or its children write any other files?
  context: The module named in the command line can be retrieved for hashing, string review, or sandbox submission while it
    still exists; registration routines and follow-on payloads frequently delete their input afterward. This query lists file
    operations by the alerting process and its direct children, which also surfaces anything regsvr32 wrote or dropped during
    registration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What exactly did regsvr32 do? Decode the command line to identify the module path, the switches, and the entry point.
  context: >-
    The full command line names the module and the operation. /i passes a string to DllInstall and is the switch that carries
    a URL or an arbitrary argument into the module; /u unregisters; /s suppresses the message box; /n suppresses DllRegisterServer.
    Note the module extension — .dll and .ocx register native code, while .sct and .wsc are script components whose registration
    entry point runs script content. Also note the working directory, which shows where the invocation was issued from.
    This query returns every regsvr32 execution on the host in the surrounding five minutes, so sequential registration steps
    that form one logical operation appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which process wrote a module into one of these directories, and what else was written there?
  context: >-
    The directories the rule enumerates are not places software normally installs COM servers into; they are chosen because
    they are writable by unprivileged users or by service accounts and are excluded from many path-based allowlists. This query
    lists writes of module and scriptlet files (.dll, .ocx, .sct, .wsc, .wsf) into those directories on this host, which names
    the process that staged the module and shows whether other modules were staged alongside it. Once the module is identified,
    retrieve it and review its content — imports, embedded strings, packer signatures for native modules; embedded script,
    encoded blobs, and URLs for scriptlets.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dirs:
        TargetFilename|contains:
          - ':\PerfLogs\'
          - ':\Temp\'
          - '\Windows\Registration\CRMLog'
          - '\Windows\System32\com\dmp\'
          - '\Windows\System32\FxsTmp\'
          - '\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\'
          - '\Windows\System32\spool\drivers\color\'
          - '\Windows\System32\spool\PRINTERS\'
          - '\Windows\System32\spool\SERVERS\'
          - '\Windows\System32\Tasks_Migrated\'
          - '\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\'
          - '\Windows\SysWOW64\com\dmp\'
          - '\Windows\SysWOW64\FxsTmp\'
          - '\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\'
          - '\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\'
          - '\Windows\Tasks\'
          - '\Windows\Tracing\'
      selection_ext:
        TargetFilename|endswith:
          - '.dll'
          - '.ocx'
          - '.sct'
          - '.wsc'
          - '.wsf'
      condition: selection and selection_dirs and selection_ext
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What module did regsvr32 actually load, is it signed, and does its hash have known threat-intel detections?
  context: >-
    Module load events carry the loaded path, the signing status and signer, and the module hash, so the module can be identified
    and reputation-checked without waiting for it to execute as its own process. Submit the hash to an internal or external
    intelligence source to determine whether the module is known malicious, known good, or previously unseen. An unsigned module,
    or one signed by a party unrelated to the software that is supposedly being installed, loaded from a directory outside
    System32, SysWOW64, or a product installation root, is the outcome to follow up. Scriptlets registered via a .sct or .wsc
    reference produce script-host loads rather than a module of their own — in that case identify the referenced file from
    the command line and hash it on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did regsvr32 open any outbound network connections around the time of the alert?
  context: >-
    regsvr32 registering a local COM server has no reason to talk to the network. A connection from regsvr32 in the same window
    as the registration indicates the module or the string passed to DllInstall drove a retrieval or a callback, which is the
    remote-scriptlet form of this technique. Correlate the connection times against the registration time and against the module
    load; a connection within seconds of process start points at the command line itself, one later points at the loaded module.
    Compare any destination against the destinations this environment expects for software distribution before treating it
    as external.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What child processes did regsvr32 spawn afterward?
  context: Native COM registration runs inside the regsvr32 process and normally spawns nothing. A scriptlet registration entry
    point, on the other hand, commonly reaches a script host or a shell — cmd.exe, powershell.exe, wscript.exe, mshta.exe,
    certutil.exe — and those children carry the operational payload. An empty result does not clear the alert; it means the
    code ran in-process and the module content is where the answer lives.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects
    how this specific pattern has run here rather than generic regsvr32 usage. A packaging or deployment host may show a stable
    parent such as a software-distribution agent or a scheduled-task host driving the same registration repeatedly. A parent
    that appears only in this alert — a script host, an Office application, a browser, an interactive shell — or a user account
    absent from the prior distribution is the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      selection_path_1:
        CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - \Windows\Registration\CRMLog
        - \Windows\System32\com\dmp\
        - \Windows\System32\FxsTmp\
        - \Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - \Windows\System32\spool\drivers\color\
        - \Windows\System32\spool\PRINTERS\
        - \Windows\System32\spool\SERVERS\
        - \Windows\System32\Tasks_Migrated\
        - \Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - \Windows\SysWOW64\com\dmp\
        - \Windows\SysWOW64\FxsTmp\
        - \Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - \Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - \Windows\Tasks\
        - \Windows\Tracing\
      selection_path_2:
        CommandLine|contains:
        - ' "C:\'
        - ' C:\'
        - ' ''C:\'
        - D:\
      selection_exclude_known_dirs:
        CommandLine|contains:
        - C:\Program Files (x86)\
        - C:\Program Files\
        - C:\ProgramData\
        - C:\Users\
        - ' C:\Windows\'
        - ' "C:\Windows\'
        - ' ''C:\Windows\'
      filter_main_empty:
        CommandLine: ''
      filter_main_null:
        CommandLine: null
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (selection_path_1 or (selection_path_2 and not selection_exclude_known_dirs)) and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
