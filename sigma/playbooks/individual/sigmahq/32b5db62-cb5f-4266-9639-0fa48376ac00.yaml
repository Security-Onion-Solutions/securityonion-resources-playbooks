name: CVE-2021-31979 CVE-2021-33771 Exploits
id: ae1f1c55-0f95-445a-b0b5-ea1ba752ec17
description: |
  Fires when a process overwrites the InprocServer32 default value of one of two WMI-related COM CLSIDs
  (CF4CC405-E2C5-4DDD-B3CE-5E7582D8C9FA or 7C857801-7381-11CF-884D-00AA004B2E24) AND that value points to a DLL
  that is not the legitimate system32\wbem WMI library. This is COM hijacking: the next time a host process
  instantiates that class (WMI runs under svchost as SYSTEM), Windows loads the attacker DLL instead of the genuine
  one, giving both persistence and execution. It has been observed as the foothold at the end of a client-side
  exploit chain against CVE-2021-31979 and CVE-2021-33771. Determine which DLL the CLSID now resolves to, whether
  that DLL was written to and loaded from a non-standard location, how the value was written, and what exploit or
  delivery preceded it.
type: detection
detection_id: 32b5db62-cb5f-4266-9639-0fa48376ac00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the modified CLSID key and its value data match what this rule detects?
  context: >-
    Confirm the alert before investing time. The rule fires when the InprocServer32 default value of one of the two
    WMI COM CLSIDs is set to a path other than the legitimate system32\wbem WMI DLL. Review the exact TargetObject
    key path and the writing process against the detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to modify WMI COM-class registry keys?
  context: >-
    The InprocServer32 value of a system WMI CLSID is set by Windows servicing, not by routine user or administrative
    activity. A standard user, an unexpected host role, or an unusual writing process modifying this key points away
    from a benign change. User attribution is present on most endpoint registry events; when it is a machine account
    or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exploit, document, or web request preceded this registry change?
  context: >-
    This COM-hijack write is typically installed at the end of a client-side exploit chain: a browser or reader
    process compromised through a malicious link or document, then escalated to SYSTEM. Identifying the parent
    process and the delivery vector (a link opened from a messaging application, an email attachment, or a crafted
    web response) enables perimeter blocking and a search for other recipients. High-risk delivery file types include
    .exe, .js, .vbs, .scr, and macro-enabled documents.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What DLL path is the hijacked CLSID now set to point to?
  context: >-
    The default value of this WMI CLSID normally resolves to system32\wbem\wmiutils.dll or wbemsvc.dll. Decode the
    Details value: a DLL under an Input Method Editor (IME) folder, a config subfolder, or any path outside
    system32\wbem, especially one whose filename is not a genuine Windows component, is the hijack payload that will
    load in place of the real WMI library. Details is populated on most registry modifications but can be absent for
    binary or empty value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Is this CLSID InprocServer32 key a known COM-hijack persistence and execution location?
  context: >-
    InprocServer32 under a CLSID tells Windows which in-process DLL to load when that COM class is instantiated.
    Overwriting the default value of a class that a SYSTEM host process routinely instantiates (WMI runs under svchost
    as SYSTEM) causes the attacker DLL to load with high privilege on the next instantiation, giving both persistence
    and execution. This maps to COM hijacking, MITRE T1546.015.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What credential stores would the DLL loaded by this hijack target?
  context: >-
    A DLL loaded through this COM hijack runs inside a SYSTEM host process and can read local secrets directly:
    browser password and cookie stores, saved messaging-application data, and OS credential material. Identify which
    of these stores exist on this host so subsequent access to them can be checked and the exposed accounts scoped.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: Was the DLL that the hijacked CLSID now points to written to disk on this host in a non-standard location?
  context: >-
    Legitimate resolution of this CLSID points into system32\wbem. A DLL written into an IME subfolder, a config
    subfolder, or another user- or attacker-writable path, with a filename that does not match a genuine Windows
    component, is the hijack payload staged on disk. Compare each file-write path against the DLL path decoded from
    the registry value. File-write events carry no hash; to hash or reputation-check the DLL, pivot to its later load
    or execution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - manual_review
- question: Was the DLL now referenced by the hijacked CLSID loaded into a WMI or svchost host process?
  context: >-
    The hijack takes effect when a host process next instantiates the COM class and loads the DLL named in the
    InprocServer32 value; WMI classes load under svchost. An unsigned or unexpected DLL loaded into a svchost host
    process, from a path outside system32\wbem, confirms the payload executed with the privileges of that process.
    Load events carry the DLL hash and signature directly, so the loaded module can be reputation-checked without a
    further pivot.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\svchost.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - ProcessGuid
  answer_sources:
  - edr_console
  - manual_review
- question: Does the hijacked value persist, and how often has this CLSID key been re-modified?
  context: >-
    Endpoint telemetry does not emit registry key or value deletion events, so attacker cleanup cannot be observed
    directly. Judge persistence from the key's re-modification history over a longer window (a legitimate servicing
    event may later restore the genuine WMI DLL path, whereas repeated writes or a value that stays pointed at a
    non-wbem DLL indicate an active hijack) and from whether the referenced DLL was loaded or executed.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: What other registry modifications occurred on this host in the same window?
  context: >-
    Installing this foothold usually accompanies other registry changes: staging configuration, disabling
    protections, or additional persistence. Registry writes clustered from the same window and writing process reveal
    whether this was an isolated change or part of a hands-on session or installer-style implant. If the host is
    registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Has this CLSID InprocServer32 value been modified before on this host?
  context: >-
    The default value of a system WMI CLSID should essentially never change outside Windows servicing. Zero or
    near-zero prior modifications over the baseline window mark this as a first-time change and raise its
    significance; a recurring modification history may reflect a servicing or software pattern to validate.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: What process wrote to the hijacked CLSID key, and what is its parent chain?
  context: >-
    The registry write comes from whatever process the exploit chain landed code in. A writer such as rundll32, a
    browser child, an unsigned binary, or a process running from a user-writable path, together with an unexpected
    parent above it, indicates exploitation rather than servicing. Walk the lineage upward to reconstruct how code
    reached the point of modifying this key.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes ran on this host around the time of the alert?
  context: >-
    The exploit-to-persistence chain unfolds within a short window: a client-application crash or abnormal exit, a
    dropped file, an unexpected child process, then outbound connections. Aggregating process activity around the
    alert surfaces novel parent-child pairs against routine noise. Child processes that should rarely spawn from a
    browser, reader, or Office parent include powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe, msiexec.exe, and curl.exe.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Were outbound remote-access or C2 connections initiated from this host after this change?
  context: >-
    A loaded implant of this class typically beacons outbound and may enable movement to other systems. The query
    returns outbound connections to remote-access ports (3389, 445, 5985, 5986, 22) in the hours after the event,
    with the originating process and user. Credentials replayed from another machine will not appear here; check
    authentication logs on suspected targets for this account. Known update, CDN, and proxy egress destinations can be
    suppressed to reduce noise. If endpoint network telemetry is not collected here, treat zero rows as a visibility
    gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    This registry write sits late in an intrusion. Earlier alerts on the same host, such as a client-application
    exploit, a suspicious file write, or a privilege-escalation attempt, help reconstruct the chain that led to the
    COM-hijack install and confirm the exploitation path.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Did this same detection fire on other hosts?
  context: >-
    A client-side exploit and its follow-on persistence are rarely aimed at a single machine. The same rule firing
    across multiple hosts indicates a broader operation and identifies additional systems that need the same
    investigation and containment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Is this host patched against CVE-2021-31979 and CVE-2021-33771?
  context: >-
    This activity has been tied to exploitation of these two elevation-of-privilege vulnerabilities as part of a chain
    that reaches SYSTEM. An unpatched host confirms the exploited path was available and flags other similarly
    unpatched systems as at risk. Patch state also distinguishes exploitation of these known CVEs from a novel vector.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
