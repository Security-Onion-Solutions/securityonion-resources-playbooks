name: Potential Homoglyph Attack Using Lookalike Characters
id: 23401ed4-6232-4e27-835c-9143db5939f3
description: |
  Detects a command line that contains at least one Unicode character which is a "perfect" homoglyph — a Cyrillic or Greek
  letter that is visually indistinguishable from an ASCII letter. The rule fires when the command line matches EITHER the
  uppercase-homoglyph set OR the lowercase-homoglyph set; either branch alone is sufficient. Homoglyphs are used to masquerade
  filenames, paths, domains, or arguments so they look legitimate to a human reader while remaining distinct to string
  comparison (for example, an update lure named with a Cyrillic letter that resembles a Latin one). Legitimate hits occur in
  environments that genuinely use Cyrillic or Greek text in commands, so the investigation should determine what string the
  homoglyph belongs to, what the executing process did with it, and whether the activity fits this host's and user's normal
  pattern.
type: detection
detection_id: 32e280f1-8ad4-46ef-9e80-910657611fbc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain an uppercase OR lowercase homoglyph character, and which string does it sit in?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the command line
    matches either the uppercase Cyrillic/Greek homoglyph set or the lowercase set — only one branch needs to match. Read the
    full command line and note which character is the lookalike and which token it belongs to (a filename, path, URL, domain,
    or argument). Note which branch fired, because an uppercase homoglyph in a token versus a lowercase one in a filename can
    point the rest of the investigation in different directions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run commands containing Cyrillic or Greek text?
  context: Legitimate Cyrillic or Greek characters appear in commands in environments where those alphabets are in normal use,
    or where a user's locale, filenames, or installed software legitimately contain them. Knowing whether this user role and
    host function would routinely produce such command lines is often the fastest way to separate a true masquerade from
    benign localized text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the executing process do with the homoglyph-bearing string? Decode the full command line.
  context: The full command line reveals what the lookalike character was used for. Identify the token holding the homoglyph
    and decode the rest of the command — flags, parameters, encoded content, file paths, or URLs. A homoglyph inside a filename
    or path argument typically means the command references a masqueraded artifact (for example, a script or installer named
    to resemble a legitimate one); decode any encoded payloads to see what the process was actually instructed to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: Which exact homoglyph character was used, and what legitimate string does it impersonate?
  context: The masquerade only works because a specific Cyrillic or Greek code point visually substitutes for an ASCII letter
    (for example, Cyrillic resembling Latin a, c, e, o, p, s, or x). Identify each lookalike character and reconstruct what the
    token would read as if the homoglyphs were normalized to ASCII — that normalized string is what the attacker is trying to
    impersonate (a known filename, a trusted domain, a system path, or a brand name). An impersonation of a real artifact name
    is materially more concerning than an isolated foreign-language word.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What is the actual identity of the executing process based on its metadata and hash?
  context: The homoglyph may sit in the executing process's own name or in one of its arguments. Comparing the Image path (the
    name on disk) against OriginalFileName (embedded PE metadata) reveals whether the process itself is a renamed binary, while
    the signing party and signature status indicate whether it is a system-signed binary, a third-party signed tool, or
    unsigned. The file hash enables a reputation lookup to determine whether this is a known legitimate tool, a known malicious
    sample, or a novel binary requiring deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did the homoglyph-named artifact referenced in the command arrive on the host?
  context: A homoglyph in a filename or path argument points at a file that was placed on disk — copied, downloaded, or dropped
    by a parent process. Tracing the file-creation event for that artifact reveals how it was delivered, whether by a download
    tool, an archive extraction, a manual copy, or a dropper. If the file landed in a user-writable location such as Downloads,
    Temp, or AppData, it was likely downloaded or extracted; the process that created it shows who or what put it there.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did the executing process do after it ran?
  context: The point of using a homoglyph is to evade notice while carrying out the intended action. Examining the child
    processes and follow-on commands launched by the alerting process reveals its actual objective — credential access,
    reconnaissance, persistence, or download of a second stage. Whether the same pattern reached other hosts is answered by the
    fleet-wide and cross-host clustering questions; here, focus on what this process did locally.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned the alerting process, and is that parent chain expected?
  context: The parent process reveals how the command was invoked. Legitimate command execution often has predictable parents
    (explorer.exe for user actions, services.exe for services). Unusual parents such as wscript.exe, mshta.exe, or an Office
    application may indicate a script-driven lure or macro delivery, which is a common path for homoglyph-named update bait.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the homoglyph pattern, what parents and users normally drive it, and does the
    current alert fit that pattern?
  context: Even benign localized text can trip this rule repeatedly on a host that uses Cyrillic or Greek legitimately. The
    query mirrors the rule's homoglyph selection scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern has historically run here. A new parent process, an unexpected user, or an unusual command-line
    pattern against an otherwise quiet baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_upper:
        CommandLine|contains:
        - "А"
        - "В"
        - "Е"
        - "К"
        - "М"
        - "Н"
        - "О"
        - "Р"
        - "С"
        - "Т"
        - "Х"
        - "Ѕ"
        - "І"
        - "Ј"
        - "Ү"
        - "Ӏ"
        - "Ԍ"
        - "Ԛ"
        - "Ԝ"
        - "Α"
        - "Β"
        - "Ε"
        - "Ζ"
        - "Η"
        - "Ι"
        - "Κ"
        - "Μ"
        - "Ν"
        - "Ο"
        - "Ρ"
        - "Τ"
        - "Υ"
        - "Χ"
      selection_lower:
        CommandLine|contains:
        - "а"
        - "е"
        - "о"
        - "р"
        - "с"
        - "х"
        - "ѕ"
        - "і"
        - "ӏ"
        - "ј"
        - "һ"
        - "ԁ"
        - "ԛ"
        - "ԝ"
        - "ο"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the homoglyph pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's homoglyph selection with no host scope, so the result is a fleet-wide count of this
    firing pattern. Many hosts matching the same pattern can point to a localized software deployment or a broadly distributed
    lure; one host or a small unrelated set points to targeted or manual activity. Use the host distribution to calibrate
    severity and decide whether this is environment-wide localized text or a contained masquerade.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
