- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    download of a staged file — may reveal the stages that preceded this event and help reconstruct the full timeline. A
    homoglyph-named lure is frequently an early step, so look in both directions for what surrounds it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
