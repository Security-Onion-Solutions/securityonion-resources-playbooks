name: Findstr Launching .lnk File
id: c99345e3-3f0c-4663-b788-12a592ed0c5f
description: |
  Detects find.exe or findstr.exe (by Image name or by PE OriginalFileName FIND.EXE / FINDSTR.EXE) running with a command
  line that ends in a .lnk path. The rule fires when both conditions hold: the process is the find/findstr utility AND the
  command line references a shortcut file. A text-search utility resolving and launching a shortcut is an indirect-execution
  pattern -- the LOLBIN acts as a launcher so the real payload (the .lnk target, often cmd or a script host that unpacks an
  obfuscated downloader) does not appear as a direct child of the delivery process. Legitimate use is rare; investigate the
  parent that invoked findstr, decode the full command line and the .lnk it points to, and determine what the shortcut target
  ran and pulled down.
type: detection
detection_id: 33339be3-148b-4e16-af56-ad16ec6c7e7b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is this process find.exe or findstr.exe, and does its command line end in a .lnk path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions
    hold together -- the Image ends in find.exe or findstr.exe (or its PE OriginalFileName is FIND.EXE / FINDSTR.EXE) AND the
    command line ends in a .lnk, .lnk", or .lnk' path. Read the exact Image, OriginalFileName, and CommandLine and confirm
    the shortcut path the utility was pointed at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a text-search utility that resolves and launches a shortcut file?
  context: Legitimate administrative activity can trigger many detections. A text-search tool like findstr launching a .lnk
    is not a normal workflow on most endpoints, so knowing whether this user role and host function ever involve scripted
    shortcut handling is often the fastest way to separate a true positive from a rare-but-benign automation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did findstr do? Decode the full command line and identify the .lnk path it resolved.
  context: The full command line reveals the specific action taken. Decode the switches passed to findstr, the search string,
    and -- most importantly -- the full path to the .lnk file at the end of the line. Note where the shortcut lives (Downloads,
    Temp, AppData are user-writable staging spots) and whether its name uses a double-extension masquerade such as name.doc.lnk
    or name.pdf.lnk that renders as a document when file extensions are hidden.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The rule matches both the on-disk name (find.exe / findstr.exe) and the PE OriginalFileName (FIND.EXE / FINDSTR.EXE).
    Compare the Image path against OriginalFileName -- a mismatch means a renamed binary masquerading as the search utility,
    while a match from a non-standard directory means a copy placed outside the expected system path. Confirm the signing party
    and signature status (a genuine utility is Microsoft-signed and lives under System32 or SysWOW64), and submit the hash for
    reputation checking to tell a stock utility from a planted look-alike.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this binary arrive on the host, and what process created it?
  context: A find/findstr binary running from a non-standard path did not appear spontaneously -- it was copied, downloaded,
    or dropped by a parent process. Tracing the file-creation event for the binary by basename over a long window reveals how
    it was delivered, whether by a download tool, an archive extraction, a manual copy via remote access, or a dropper. If the
    binary lives in a user-writable location it was likely downloaded or extracted; if in a system directory it may be a routine
    OS update -- the creating process in the file event disambiguates.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What child processes did this binary spawn after execution, and is the same binary active on other hosts?
  context: The point of indirect execution through a search utility is to hide the real payload from the delivery chain. Examining
    the processes spawned after findstr runs reveals the actual objective -- a script host, command interpreter, or downloader
    launched by way of the shortcut target. The same binary or shortcut-launch pattern appearing on multiple hosts suggests
    deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned findstr and is that parent chain expected?
  context: The parent process reveals how the utility was invoked. The parent is not part of the rule's detection, so identifying
    it is load-bearing. Legitimate search usage is typically launched from a console or a script the user started; parents
    such as a mail client, browser, Office application, wscript.exe, mshta.exe, or an unpacked shortcut handler point to a
    delivery chain that placed and ran the .lnk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did findstr, its parent, or any child process make an outbound network connection around the alert time?
  context: Indirect-launch chains commonly end in an ingress tool transfer -- the shortcut target unpacks a script that reaches
    out over http or https to pull a second-stage payload. Correlating outbound connections from the launcher and its descendants
    in the window around the alert surfaces the download leg of the chain and the remote address it contacted, which becomes
    a pivot for scoping other affected hosts.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: true
      filter_known_good:
        Image|startswith:
          - 'C:\Windows\System32\'
          - 'C:\Windows\SysWOW64\'
      condition: selection and not filter_known_good
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Is the .lnk target or any spawned command line encoded or obfuscated? What does it decode to, and what operation
    does it perform?
  context: 'Shortcut-delivery chains routinely stage an obfuscated payload behind the .lnk: the target launches a script host
    that reconstructs a downloader from character concatenation (VBScript Chr() chains, JavaScript String.fromCharCode), base64,
    hex, or environment-variable substitution. Decode the shortcut target and any descendant command line to reveal the actual
    intent -- a download cradle, an in-memory loader, or a drop-and-execute of a second-stage binary. For multi-layer encoding,
    iterate until the payload is readable.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the referenced .lnk file (and any payload it dropped) still on disk for analysis?
  context: The command line references a shortcut path, and the chain it triggers often drops a second-stage file. Checking
    whether these artifacts still exist on disk enables deeper analysis -- parsing the .lnk target and arguments, hashing the
    dropped payload, sandbox submission, or content review. The file-creation events for these paths also show which process
    wrote them.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even common utilities can be abused. The query mirrors the rule's selection -- find/findstr launching a .lnk --
    scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has historically
    run here, not generic findstr usage. A new parent process, an unexpected user account, or an unusual shortcut path is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - .lnk
        - .lnk"
        - .lnk'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of find/findstr launching a
    .lnk (not generic usage of the binary). Many hosts firing the same pattern points to scripted deployment or a benign vendor
    automation that wraps shortcut handling; one host or a small unrelated set points to manual or targeted delivery. Use the
    host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - .lnk
        - .lnk"
        - .lnk'
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - .lnk
        - .lnk"
        - .lnk'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - .lnk
        - .lnk"
        - .lnk'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar shortcut-launch or downloader activity on other hosts, the scope of the incident may
    be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - .lnk
        - .lnk"
        - .lnk'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    the shortcut launch, what the chain spawned afterward, and whether this is part of a larger sequence. Look for the delivery
    parent, reconnaissance, privilege escalation, or persistence mechanisms appearing as novel parent-child pairs.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- phishing-delivery indicators, defense
    tampering, or reconnaissance -- may reveal the stages that preceded this shortcut launch and help reconstruct the full
    timeline, including how the .lnk arrived on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
