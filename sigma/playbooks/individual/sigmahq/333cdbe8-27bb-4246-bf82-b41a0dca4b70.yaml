name: Suspicious Volume Shadow Copy VSS_PS.dll Load
id: 5c2a3669-a18b-4df3-a87b-27f459e3c215
description: |
  Detects a process outside a known-good allowlist loading vss_ps.dll, the COM proxy/stub DLL for the Volume Shadow Copy Service. The rule fires when the loaded module ends in vss_ps.dll AND the loading process is not one of the expected system binaries under C:\Windows, not a WinRE/DISM update helper, not null-Image, and not under Program Files. Loading this DLL lets a process drive VSS through COM interfaces directly, which legitimate backup, servicing, and indexing components do routinely. When an uncommon process loads it, the module load frequently precedes deletion or manipulation of shadow copies as recovery-inhibition or ransomware preparation — and because the operation runs through COM, it may never spawn vssadmin/wmic at all. Determine whether the loading process is legitimate, whether the vss_ps.dll on disk is the genuine signed system DLL, and whether shadow-copy deletion or other recovery-inhibiting actions followed.
type: detection
detection_id: 333cdbe8-27bb-4246-bf82-b41a0dca4b70
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the process that loaded it against the rule's detection criteria. The rule fires when a module ending in vss_ps.dll is loaded by a process that is not one of the expected Windows system binaries, not a WinRE/DISM servicing helper, and not under Program Files. The library load event carries the module's signing status and hash directly, so confirm both that the loaded DLL is the genuine signed system copy and that the loading process is genuinely outside the allowlist.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run a process that drives Volume Shadow Copy through COM?
  context: Backup software, servicing/update routines, and search indexers legitimately load the VSS COM proxy. Knowing whether the loading process, the user context, and the host function (file server, backup host, workstation) are consistent with routine VSS use is often the fastest way to separate a true positive from expected administrative or servicing activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process load, and are any from non-canonical paths, unsigned, or user-writable directories?
  context: 'The full set of modules a process loads alongside vss_ps.dll shows how it is set up to operate. Look for: (1) DLLs from %TEMP%, AppData, ProgramData, or Public — side-loading; (2) unsigned modules where signed ones are expected; (3) .NET assemblies loaded reflectively by a PE binary — in-memory execution; (4) system DLL names loaded from non-system paths — search-order hijacking. A process that pulls in the VSS COM proxy plus reflectively-loaded or side-loaded modules is a stronger signal than one loading only signed system DLLs.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded vss_ps.dll and any other suspicious module, what is the signing status, hash, and reputation?
  context: vss_ps.dll is normally a genuine Microsoft-signed system DLL in the System32/SysWOW64 path, so a valid signature on the DLL alone is expected and is not what makes this alert interesting. Verify the loaded copy is that genuine signed system module (Valid signature, canonical path) rather than a planted or search-order-hijacked file (Unsigned, Expired, Distrusted, Invalid, or an unexpected path with a Microsoft-style name). Hash lookups on the loaded module and on any other anomalous DLL surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the loading process and what did its command line do?
  context: The loading process is the discriminator here — the DLL itself is a legitimate system component, so the signal is which uncommon binary loaded it and what that binary was doing. Decode the full command line, working directory, and any flags, encoded content, or file paths. A process invoking VSS through COM to enumerate or delete shadow copies may carry no obvious shadow-copy arguments, so read the command line together with the module set and the file activity to reconstruct intent.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: The parent reveals how the loading process was launched. VSS-consuming system binaries normally have predictable parents (services.exe, svchost.exe, explorer.exe for interactive admin action). Parents such as powershell.exe, wscript.exe, mshta.exe, or an Office application handing off to the loader point to scripted or exploitation-driven invocation. Tuning recovery-inhibition detection around common parent-child chains (for example powershell to diskshadow) is a known refinement, so note the exact parent binary and its own launch context.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the loading process binary?
  context: A binary that has never or rarely executed on this host is more suspicious than one that runs regularly as part of backup or servicing routines. Zero or very low historical counts for the loading process indicate first-time or rare execution and raise the weight of the VSS COM load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Which processes have loaded vss_ps.dll on this host historically, and is the alerting loader new to that set?
  context: vss_ps.dll is loaded routinely on most hosts by legitimate VSS, backup, and indexing components, so its presence is not itself anomalous — the loading process is. Aggregating the historical loaders by process shows the normal set (vssvc.exe, svchost.exe, backup agents). If the alerting binary has never loaded this DLL before, or only entirely different processes have, the current load is the outlier.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: What files did the loading process and its direct children write to disk?
  context: The command line of a COM-driven VSS operation can be opaque, so file writes by the loading process and its children help reconstruct what it staged or produced — dropped tooling, exported data, or a follow-on payload. The correlation follows process lineage (the process itself and processes it spawned) rather than any command-line-derived path, and surfaces files still on disk for hashing, content review, or sandbox submission.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Recovery inhibition chains multiple actions: deleting shadow copies (vssadmin, wmic shadowcopy delete, with destructive flags such as /all, /quiet, and delete), disabling boot recovery (bcdedit /set recoveryenabled no, bootstatuspolicy), deleting backups (wbadmin delete catalog / systemstatebackup), and disabling the Windows Recovery Environment (reagentc /disable). The vss_ps.dll load can drive shadow-copy deletion through COM without a command-line utility, so a clean result here does not rule out recovery inhibition — but any of these commands around the alert corroborates it. Verify each action''s effect on the host (vssadmin list shadows, bcdedit /enum, reagentc /info, wbadmin get versions).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact activity typically chains several destructive actions in a short window: shadow-copy deletion alongside recovery disabling, security-service stopping, permission changes, and event-log clearing. Finding the complete set of destructive commands close in time to the VSS COM load distinguishes a scripted destruction sequence from an isolated administrative action, and the shared parent (often cmd.exe or powershell.exe running a script) confirms automation.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Is this same VSS COM load and recovery-inhibition alert firing on other hosts?
  context: Recovery inhibition and encryption are often executed across many hosts in rapid succession. Searching for the same alert firing network-wide determines whether this is a single-host event or a coordinated multi-host operation, which drives containment scope and the incident-response decision.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the load?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. After the VSS COM load, watch for unknown or suspicious binaries executing from temp or user-writable paths, processes with heavy file I/O, and command interpreters launching unfamiliar executables — these indicate the encryption phase has begun. Ransom notes (readme/how-to-decrypt style files) and mass file renames are corroborating artifacts to check via file events or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Were recovery-related registry values modified on this host around the alert?
  context: Recovery inhibition also has a registry surface — disabling System Restore, turning off the Windows Recovery Environment, or altering the VSS/software-shadow-provider service configuration. Because driving VSS through COM can pair with registry edits instead of command-line utilities, checking modifications to recovery-related keys catches inhibition that leaves no vssadmin or bcdedit process. Deletion of a key is not observable here, so focus on modifications to these values around the alert.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\SystemRestore\'
          - '\Services\VSS\'
          - '\Services\swprv\'
          - '\WindowsRE\'
          - 'DisableSR'
          - 'DisableConfig'
          - 'RecoveryEnabled'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Aggregating the surrounding process activity reveals the immediate context: what launched the loading process, what ran alongside it, and what followed. Look for reconnaissance, privilege escalation, defense tampering, or staging that frames the VSS COM load within a larger sequence.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or lateral movement — may reveal the stages that led to this recovery-inhibition step and help reconstruct the full timeline. Recovery destruction usually sits late in an intrusion, so preceding alerts often mark the entry and escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
