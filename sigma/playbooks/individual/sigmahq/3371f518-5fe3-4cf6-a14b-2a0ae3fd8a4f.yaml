name: Sysinternals PsService Execution
id: 8be1bbb8-b6b3-453f-a805-5e97e22ba431
description: |
  Detects execution of the signed Sysinternals PsService tool, identified either by an OriginalFileName of psservice.exe or by an Image ending in \PsService.exe or \PsService64.exe. PsService is a redistributable service viewer and controller (functionally close to sc.exe) that can query, configure, start, stop, restart, and change the start type of Windows services locally or against a remote host with alternate credentials, and can search the network for hosts running a named service. Legitimate administrators use it for service maintenance; abuse includes enumerating or disabling security services, auditing service ACLs to find weakly-secured services for hijacking, and changing start types to break protection. Because the rule fires on binary identity with no command-line constraint, the investigation centers on decoding the subcommand actually issued and confirming whether the user, host, and timing fit known administrative activity.
type: detection
detection_id: 3371f518-5fe3-4cf6-a14b-2a0ae3fd8a4f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the process match what this rule detects — psservice.exe by original filename, or an image ending in PsService.exe or PsService64.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the process image and original filename against the rule's criteria. The rule matches either the OriginalFileName psservice.exe or an Image path ending in PsService.exe or PsService64.exe, so a renamed copy can still fire on the embedded original filename.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run a service control tool like PsService?
  context: Legitimate administrative activity can trigger this detection. PsService is a service management utility, so an IT administrator or service-account context on a server is far more routine than a standard user on a workstation. Knowing whether the user role and host function fit service maintenance is often the fastest path to distinguishing true positives from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this service activity?
  context: Many organizations require change tickets for service modifications, especially changes to start type or stopping protective services. A corresponding ticket suggests authorized maintenance; absence of one when policy requires it suggests the action was unauthorized. This check can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What subcommand and target service did PsService invoke, and was it a read-only query or a state-changing action?
  context: PsService's behavior is entirely in its arguments. Read-only subcommands (the default service list, query, config, depend, security, find) are discovery; state-changing subcommands (setconfig disabled/auto/demand, start, stop, restart, pause, cont) modify a service and are the persistence or impair-defenses angle. A target service name resembling a security product (for example WinDefend, Sense, MsSense, or a third-party AV/EDR service) alongside setconfig disabled or stop is the highest-priority pattern. Remote use against another host appears as a leading \\computer argument, optionally with -u and -p for alternate credentials.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did PsService issue any state-changing service subcommands on this host in the surrounding window?
  context: A single PsService invocation runs one subcommand, but operators often chain several sequential calls that together form one logical operation — enumerate services, then disable or stop a target. This surfaces other PsService executions on the host that carry the state-changing keywords (setconfig, disabled, stop, start, restart, pause), so a quiet query-only run can be separated from a run that actually altered a service's configuration or run state.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_tool:
      - OriginalFileName: psservice.exe
      - Image|endswith:
        - \PsService.exe
        - \PsService64.exe
      selection_action:
        CommandLine|contains:
        - 'setconfig'
        - 'disabled'
        - 'stop'
        - 'start'
        - 'restart'
        - 'pause'
      condition: selection_host and selection_tool and selection_action
    fields:
      - CommandLine
      - User
- question: Did a new or modified service install on this host that PsService could have driven, and what binary does it execute?
  context: PsService changes services through Service Control Manager APIs rather than always emitting an sc.exe command line, so confirming the effect means checking for a service installation event. The structured service fields reveal the service name, the executable path (the persistence payload, which attackers often place in world-writable directories such as C:\Users\Public or C:\Windows\Temp), the start type, and the account the service runs under. A service that appears around the PsService activity should be correlated with the subcommand that was issued.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: For any service PsService targeted, is the service currently running and what account is it using?
  context: A service whose start type was changed may not have started yet (demand start) or may have been stopped after detection, so the current status reveals whether the change is active. Services running as LocalSystem have full system privileges; a service stopped or disabled by PsService that protects the host (AV/EDR) is the impair-defenses outcome. Re-read the alerting command line to identify the target service name before checking its live state on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: PsService's default listing and its query, config, depend, security, and find subcommands are service-discovery actions. A single discovery command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession — whoami, net, nltest, tasklist, systeminfo — is a signature pattern of post-compromise enumeration as an operator orients before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned PsService, and is that parent chain normal for service administration?
  context: The parent process reveals how PsService was invoked. Legitimate use typically comes from cmd.exe or powershell.exe under explorer.exe (an interactive admin) or from an automation or deployment agent. Discovery tools spawned by unusual parents — Office applications, script interpreters such as wscript.exe or mshta.exe, wmiprvse.exe, or wsmprovhost.exe — indicate automated or remote post-exploitation rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative service discovery and control commands?
  context: Network administrators and IT staff legitimately query and manage services for troubleshooting. Standard users rarely need to enumerate or change service configuration. The user's role and typical behavior baseline determine whether the PsService activity is routine or anomalous; pair this with the launch-mechanism baseline when the alert fires under a service principal rather than a named user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What spawned the parent of PsService, and what else did that parent launch?
  context: The immediate parent is visible in the alert. Walking one level higher shows how the session that ran PsService began — an interactive shell and login session, a scheduled task, or a remote-execution surrogate — and reveals whether the same parent launched other tools as part of a sequence. Long-running parents such as shells or services frequently start hours or days before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run PsService?
  context: A tool that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution of PsService here, which raises the priority of decoding exactly what it did.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even signed administrative tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific PsService firing pattern has historically run here. Deviations — a new parent process, an unexpected user account, an unusual invocation pattern — are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: psservice.exe
      - Image|endswith:
        - \PsService.exe
        - \PsService64.exe
        - \PsService64a.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: psservice.exe
      - Image|endswith:
        - \PsService.exe
        - \PsService64.exe
        - \PsService64a.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: psservice.exe
      - Image|endswith:
        - \PsService.exe
        - \PsService64.exe
        - \PsService64a.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this PsService firing pattern rather than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or operational automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: psservice.exe
      - Image|endswith:
        - \PsService.exe
        - \PsService64.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the attack stages that preceded the service activity and help reconstruct the timeline. Service enumeration or tampering often follows initial access and precedes impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After modifying a service, they commonly install backup mechanisms using different techniques — scheduled tasks, other service changes, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations from the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
