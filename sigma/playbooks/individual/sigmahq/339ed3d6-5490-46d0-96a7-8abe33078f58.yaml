name: Qakbot Rundll32 Exports Execution
id: b87722ee-7470-497f-991a-383f25a66d67
description: |
  Detects rundll32.exe launched by a shell or script host (cmd.exe, cscript.exe, curl.exe, mshta.exe,
  powershell.exe, pwsh.exe, wscript.exe) where the command line both references a user-writable staging
  directory (ProgramData, Users\Public, AppData\Local\Temp, AppData\Roaming) and ends with one of a fixed
  list of DLL export names associated with Qakbot loader modules. Both halves must match for the rule to
  fire. Legitimate rundll32 activity loads DLLs from System32 or a vendor's Program Files directory and is
  launched by the OS or an installer, not by an interpreter reading a downloaded script; the combination of
  interpreter parent, user-writable DLL path, and a short opaque export name is what separates the two.
  The investigation should recover the DLL path and export name from the command line, trace what started
  the interpreter parent, acquire the staged DLL, and determine whether the same parent produced additional
  loaders, discovery commands, or persistence on this host or elsewhere in the environment.
type: detection
detection_id: 339ed3d6-5490-46d0-96a7-8abe33078f58
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the rundll32 command line reference a user-writable staging directory and end with one of the listed DLL export names?
  context: >-
    The rule fires only when both halves match. The first half requires a parent of cmd.exe, cscript.exe,
    curl.exe, mshta.exe, powershell.exe, pwsh.exe, or wscript.exe, an Image of rundll32.exe, and a command
    line containing a path under ProgramData, Users\Public, AppData\Local\Temp, or AppData\Roaming. The
    second half requires the command line to end with one of a fixed export list (aslr, bind, DrawThemeIcon,
    GG10, GL70, jhbvygftr, kjhbhkjvydrt, LS88, Motd, N115, next, Nikn, print, qqqb, qqqq, RS32, Test, Time,
    Updt, vips, Wind, WW50, X555, XL55, xlAutoOpen, XS88). Confirm both in the alerting event before
    investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32.exe against a DLL staged in a user-writable directory?
  context: >-
    rundll32.exe is a legitimate Windows utility that the OS and installed software invoke constantly, but
    those invocations load DLLs out of System32 or a vendor directory under Program Files. A DLL path under
    ProgramData, Users\Public, or AppData is the discriminator. Establish whether the account's role or a
    known local deployment, packaging, or testing process accounts for loading modules from those locations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this shell or script host expected to spawn rundll32.exe here, and what started the parent itself?
  context: >-
    The parent-to-child pairing is half the detection. Retrieving the parent's own creation event exposes its
    command line and its grandparent, which is where the delivery path usually becomes visible. A wscript.exe
    or mshta.exe started from a browser or mail-client download directory, or a powershell.exe started from an
    Office application, points at a script or document that fetched and staged the DLL. A parent started by a
    management agent or a packaging tool points the other way and can usually be named.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn?
  context: >-
    Loader execution is normally one step in a sequence. The same interpreter that invoked rundll32.exe often
    also writes the DLL, runs discovery commands, or launches a second loader with a different export name.
    Listing every child of this exact parent instance shows whether the alert captured a single action or one
    link in a chain, and any sibling worth pivoting on will appear here with its full command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What DLL path and export name did rundll32.exe load, and were other staged-path rundll32 invocations made on this host in the same window?
  context: >-
    The command line carries the whole operation - the path to the module and, after the comma or space
    separator, the export that rundll32 calls into. Read the path so the file can be acquired and examined,
    and record the export name. The query restricts to rundll32 invocations whose command line references a
    user-writable directory, which keeps the far larger volume of routine System32 rundll32 activity out of
    the result. A second row means a second staged module was invoked in the same window.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What else did this parent binary launch on the host in the hours after the alert?
  context: >-
    An interpreter that staged and invoked a module frequently continues working - additional loaders,
    account and domain discovery, archive utilities, or scheduled-task and registry writes for persistence.
    This lists every process launched by the same parent binary on this host over the following window with
    no command-line restriction, so routine use of the interpreter appears alongside anything related and the
    timestamps are what separate them.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the parent binary make network connections from this host around the time of the alert?
  context: >-
    The parents this rule keys on are the same binaries used to retrieve the module in the first place -
    curl.exe, powershell.exe, and the script hosts all fetch over HTTP. Egress from the parent binary in the
    minutes around the execution can identify the download source, and egress after it can identify a command
    channel opened by the loaded module's own thread. Endpoint network events carry the process, so a
    connection here is attributable to the parent rather than merely concurrent with it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentName%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has this parent binary launched rundll32.exe against a user-writable directory on this host before?
  context: >-
    Holding the 90-day history to rundll32 launches whose command line references ProgramData, Users\Public,
    or AppData filters out the routine System32 rundll32 work that every shell parent generates, so the count
    reflects the pairing the rule cares about. Zero or near-zero prior events means this parent-child
    combination is novel for the host. A steady count usually traces to an installer or management agent that
    stages modules locally, and that process should be named before the alert is set aside.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Which accounts have run rundll32.exe against a DLL in a user-writable directory on this host over the last 90 days?
  context: >-
    This drops the parent constraint and asks how common staged-path rundll32 execution is on the host at
    all, grouped by account. An account list that is empty apart from the alerting event indicates the
    behavior is new to the host. A recurring account, especially a service or machine account, points at
    local software that stages modules into ProgramData - identify that software before treating the count as
    evidence the alerting event is routine, since it may be a different mechanism that happens to match.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's full selection - interpreter parent, rundll32.exe child, user-writable path,
    and one of the listed export names - scoped to this user over 90 days and aggregated by host. It counts
    the exact firing pattern rather than generic use of the binary, so a user who has never produced it is a
    different proposition from one who produces it regularly. Weigh any non-zero count against the user's
    role and the software they are known to run.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_exports:
        CommandLine|endswith:
        - aslr
        - bind
        - DrawThemeIcon
        - GG10
        - GL70
        - jhbvygftr
        - kjhbhkjvydrt
        - LS88
        - Motd
        - N115
        - next
        - Nikn
        - print
        - qqqb
        - qqqq
        - RS32
        - Test
        - Time
        - Updt
        - vips
        - Wind
        - WW50
        - X555
        - XL55
        - xlAutoOpen
        - XS88
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior
    and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection scoped to the
    alerting parent process, so the result is the 90-day history of this parent driving this specific pattern
    rather than generic parent-and-rundll32 co-occurrence. A new or rare parent for this pattern is the
    deviation worth chasing; a parent already accounting for thousands of prior events is vendor or OS
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_exports:
        CommandLine|endswith:
        - aslr
        - bind
        - DrawThemeIcon
        - GG10
        - GL70
        - jhbvygftr
        - kjhbhkjvydrt
        - LS88
        - Motd
        - N115
        - next
        - Nikn
        - print
        - qqqb
        - qqqq
        - RS32
        - Test
        - Time
        - Updt
        - vips
        - Wind
        - WW50
        - X555
        - XL55
        - xlAutoOpen
        - XS88
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user run across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the activity
    is confined to one endpoint or the account is active in several places at once, which is what lateral
    movement looks like from the process side. If the alert fired under a service or machine account this
    view returns agent and OS telemetry from every host and should be read as background rather than signal.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns telemetry from every host in the estate.
    The mechanism is the better pivot: the query mirrors the rule's selection scoped to the alerting parent
    process, fleet-wide, in the alert window. Several hosts firing together points to a pushed or scheduled
    rollout, or to a delivery wave reaching multiple recipients at once; a single host points to a host-local
    trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_paths:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \curl.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \wscript.exe
        Image|endswith: \rundll32.exe
        CommandLine|contains:
        - :\ProgramData\
        - :\Users\Public\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      selection_exports:
        CommandLine|endswith:
        - aslr
        - bind
        - DrawThemeIcon
        - GG10
        - GL70
        - jhbvygftr
        - kjhbhkjvydrt
        - LS88
        - Motd
        - N115
        - next
        - Nikn
        - print
        - qqqb
        - qqqq
        - RS32
        - Test
        - Time
        - Updt
        - vips
        - Wind
        - WW50
        - X555
        - XL55
        - xlAutoOpen
        - XS88
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by binary and parent in the alert window collapses
    repetitive agent and OS telemetry into single high-count rows, leaving novel parent-child pairs standing
    out at low counts. That is what to scan for - a second interpreter, an archive utility, a credential or
    discovery tool, or a persistence mechanism appearing once alongside the alerting execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Loader execution sits in the middle of a delivery sequence, so earlier detections on the same host often
    carry the front of it - a script host launched from a document, a download utility reaching an untrusted
    host, or defense tampering ahead of execution. Reading the prior alert timeline reconstructs how the
    module reached the staging directory.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Are other hosts running rundll32.exe against user-writable directories from the same parent binary?
  context: >-
    This searches the environment rather than the single host, and constrains on the parent binary plus a
    rundll32 command line referencing ProgramData, Users\Public, or AppData while leaving the export list
    out. That deliberately catches variants - the same delivery method invoking a module with an export name
    the rule does not list would be missed by a pattern-exact fleet query but appears here. Several hosts
    over the same day indicates a delivery wave rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ':\ProgramData\'
          - ':\Users\Public\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
