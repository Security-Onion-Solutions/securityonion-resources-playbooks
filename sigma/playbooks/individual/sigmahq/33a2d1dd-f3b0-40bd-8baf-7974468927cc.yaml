name: APT PRIVATELOG Image Load Pattern
id: 4c8e2b17-9a6d-4f3e-b1c2-5e7a9d0f3b64
description: |
  Detects an svchost.exe process loading clfsw32.dll, the Common Log File System (CLFS) API library. This image-load pattern is used by the PRIVATELOG malware family, which abuses CLFS to stash an encrypted second-stage payload inside registry transaction-log container files and relies on DLL search-order hijacking under a service-hosting svchost. A genuine svchost rarely loads clfsw32.dll, so the investigation should confirm the hosting service group and command line, verify the loaded module's path and signature, and check for co-loaded transaction modules (ktmw32.dll, a planted dbghelp.dll) and downstream execution.
type: detection
detection_id: 33a2d1dd-f3b0-40bd-8baf-7974468927cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the loading process against the rule's criteria — an svchost.exe loading a DLL that ends in clfsw32.dll. The library event carries the DLL's hash and signing status directly, so a genuine System32 clfsw32.dll with a valid Microsoft signature reads very differently from a copy loaded from an unexpected path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host and service account expected to run an svchost.exe service group that loads clfsw32.dll?
  context: A genuine svchost hosting the print/notification service can legitimately touch CLFS, but this is rare. Knowing whether the host role and the account under which the service runs are consistent with CLFS usage is often the fastest way to separate a routine service load from an injected or hijacked process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did the loading process or its children write files to disk that are still available for analysis?
  context: This pattern stages an encrypted payload inside registry transaction-log container files (a .blf file and a .TMContainer .regtrans-ms file under a user profile) and plants a legitimate DLL copy at a non-standard path. Checking whether those artifacts still exist enables hash lookups, sandbox submission, or content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What modules did this svchost.exe process load, and are any from non-canonical paths, unsigned, or otherwise unexpected for a service host?
  context: The full set of modules a process loads tells the operator's story. Look for DLLs from user-writable directories (AppData, ProgramData, Public), unsigned modules where signed ones are expected, and system DLL names loaded from non-system paths (search-order hijacking). A service-hosting svchost that loads CLFS libraries alongside instrumentation or hooking modules is the pattern of interest here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What was the full command line of the svchost.exe that loaded clfsw32.dll, and which service group does it host?
  context: The loader in this pattern verifies that its hosting process command line is svchost.exe -k print before executing, so the -k service group is discriminating. Decode the command line and confirm whether that group legitimately uses CLFS, or whether the group and CLFS load are mismatched. The query is scoped to the exact process instance rather than all svchost.exe on the host, because svchost runs continuously in many instances.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: For clfsw32.dll and any other suspicious module this process loaded, what are the signing status, hash, and reputation?
  context: Module reputation separates a routine Microsoft DLL from a side-loaded or masqueraded copy. A validly signed clfsw32.dll from System32 may be legitimate; an unsigned module with a system-style filename, or a signed DLL loaded from an unexpected directory, is a masquerading or search-order-hijack indicator. Hash lookups against threat intelligence surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned this svchost.exe, and is that parent chain legitimate?
  context: A genuine service-hosting svchost.exe is launched by services.exe. Any other parent, or an svchost that was reparented or hollowed, is anomalous and points to the process itself being the injection or hijack target rather than a benign service instance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is svchost.exe or another unexpected process also loading ktmw32.dll or a dbghelp.dll on this host?
  context: This pattern co-loads the Kernel Transaction Manager library (ktmw32.dll) alongside CLFS, and stages a legitimate dbghelp.dll copy at a non-standard path to support the transaction chain. Aggregating loads of these two modules by loading process shows whether the same svchost is pulling the full CLFS/transaction module set, and whether dbghelp.dll is being loaded from a location other than System32.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - \ktmw32.dll
          - \dbghelp.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Has clfsw32.dll been loaded on this host before, and by which processes?
  context: A first-time module load is a stronger anomaly signal than a recurring one. If clfsw32.dll has been loaded on this host historically only by non-svchost processes, or never before, the current svchost load is anomalous. If a specific service host has loaded it routinely, this load is more likely benign.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the svchost-loads-clfsw32 pattern, what programs and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how this specific load pattern has historically run here. A new acting program process, an unexpected account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        ImageLoaded|endswith: \clfsw32.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Did this svchost.exe make outbound network connections after loading clfsw32.dll?
  context: A second-stage payload staged via CLFS may beacon or retrieve further tooling. A service-host process connecting to external addresses outside its normal service endpoints, shortly after the load, points to active command-and-control or staging rather than a benign service operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What child processes did this svchost.exe spawn after loading clfsw32.dll?
  context: A hijacked or injected service host often spawns follow-on processes for reconnaissance or execution (cmd.exe, powershell.exe, or living-off-the-land binaries). Unexpected children under this svchost reveal the actual post-load impact. The query correlates on the process lineage of the alerting instance for precision.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load collapses repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts, revealing reconnaissance, privilege escalation, or persistence that surrounds the event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts matched the svchost-loads-clfsw32 pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific load pattern. Many hosts firing the same pattern points to scripted or vendor automation; one host or a small unrelated set points to targeted activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \svchost.exe
        ImageLoaded|endswith: \clfsw32.dll
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or hijack-execution-flow signals — may reveal the attack stages that preceded this load and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
