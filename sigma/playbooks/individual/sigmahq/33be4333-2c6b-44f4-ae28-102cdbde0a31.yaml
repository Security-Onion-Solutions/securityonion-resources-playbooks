name: Suspicious Msbuild Execution By Uncommon Parent Process
id: 312762c0-2247-4982-9a32-e79934638009
description: |
  Detects MSBuild.exe (matched by Image name or OriginalFileName) launched by a parent process that
  is not on the expected list of developer-tooling parents (devenv.exe, cmd.exe, msbuild.exe,
  python.exe, explorer.exe, nuget.exe). MSBuild can compile and execute inline C# tasks from project
  or response files, so it is a recognized proxy-execution path that runs attacker code under a signed
  Microsoft binary. Legitimate builds are normally driven by an IDE, a build script, or a package
  manager; an unusual parent such as a script host, an Office application, or a shell spawned from one
  of those suggests the binary is being used to run code rather than to build a project. Determine what
  the invocation actually compiled or executed, why the parent launched it, and whether the same
  pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 33be4333-2c6b-44f4-ae28-102cdbde0a31
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this process match the rule — MSBuild.exe launched by a parent outside the expected developer-tooling list?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when
    the Image ends in MSBuild.exe (or OriginalFileName is MSBuild.exe) AND the parent process is not
    devenv.exe, cmd.exe, msbuild.exe, python.exe, explorer.exe, or nuget.exe. Review the alerting event
    and confirm both the binary identity and that the parent really is outside that allowed set.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to compile or run MSBuild projects?
  context: Legitimate MSBuild usage concentrates on developer workstations, build agents, and CI hosts.
    Knowing whether the user role and host function involve software builds is often the fastest way to
    separate a routine build from a binary being used to run arbitrary code. A build tool firing on a
    workstation that does no development is a stronger lead than the same event on a build server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this MSBuild invocation actually build or execute? Decode the full command line and target file.
  context: The full command line reveals what MSBuild was pointed at. Identify the project, solution, or
    response file argument and any inline task references, since MSBuild can compile and run C# tasks
    embedded in those files. A path to a .csproj or .xml file in a temp or user-writable directory, or
    arguments that reference an inline task, point to proxy execution rather than a normal build.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What parent process spawned MSBuild, and what else did that parent do?
  context: This rule fires specifically because the parent is outside the expected developer-tooling set,
    so the launch mechanism is the core of the investigation. Identify the immediate parent and what
    spawned it. A script host, an Office application, or a shell descended from one of those is consistent
    with MSBuild being driven to execute code rather than to build a project.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this MSBuild instance spawn afterward?
  context: The processes spawned after MSBuild ran reveal its actual impact. A normal build invokes
    compilers and linkers; an inline-task or proxy-execution use often spawns command interpreters,
    script hosts, or download utilities. Unexpected children such as cmd.exe, powershell.exe, or
    certutil.exe shift the disposition toward post-exploitation activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a tool that runs here regularly can be abused. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how the rule's
    specific firing pattern has historically run on this host rather than generic MSBuild usage. A new
    parent process, an unexpected user account, or an unusual command-line structure is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter_parent) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern rather than generic MSBuild usage. Many hosts firing
    the same pattern points to a scripted deployment or vendor build automation that uses an unusual
    parent; one host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      condition: selection and not filter_parent
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter_parent) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter_parent) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on several hosts in the same window,
    the scope of the activity may be larger than a single build host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter_parent) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this
    event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, persistence installation, or data staging that gives broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the attack stages that preceded this event and help reconstruct the timeline. Proxy
    execution via a build tool is frequently a middle stage rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often reach for several. If MSBuild was used to
    run code, check whether rundll32, regsvr32, mshta, installutil, or similar binaries were also used to
    execute arbitrary code in the same period. Multiple proxy-execution binaries achieving the same
    objective strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was MSBuild.exe executed from an expected installation path?
  context: MSBuild normally lives under the Visual Studio install tree or the .NET Framework directories
    under Windows\Microsoft.NET. A copy running from a user temp, Downloads, or other user-writable
    directory may indicate the binary was relocated or renamed to evade path-based allowlists, which is
    more suspicious than execution from a standard install path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this rule's MSBuild pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects the rule's specific firing pattern rather than generic MSBuild usage. The CommandLine
    projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \MSBuild.exe
      - OriginalFileName: MSBuild.exe
      filter_parent:
        ParentImage|endswith:
        - \devenv.exe
        - \cmd.exe
        - \msbuild.exe
        - \python.exe
        - \explorer.exe
        - \nuget.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter_parent) and _pb_scope
    fields:
    - CommandLine
