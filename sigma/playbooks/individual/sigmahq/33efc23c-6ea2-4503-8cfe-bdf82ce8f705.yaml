name: Potential Persistence Via New AMSI Providers - Registry
id: cca4082b-37ab-41ca-ad62-f934e424e585
description: |
  Detects a new value written under the Windows AMSI provider registry key (SOFTWARE\Microsoft\AMSI\Providers\ or its WOW6432Node path), which registers a CLSID that Windows loads as an in-process AMSI scan provider. Registering an attacker-controlled provider causes the referenced DLL to load into every process that initializes AMSI (PowerShell, Office, and other script hosts), giving both persistence and a way to neuter script scanning by always reporting content as clean. Known antivirus products register their own providers, so the investigation must determine which CLSID and DLL were registered, which process wrote the key, and whether the referenced DLL is a trusted security component or an unexpected payload.
type: detection
detection_id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f705
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting registry write land under the AMSI Providers key, and what CLSID was registered?
  context: Before investing investigation time, confirm the write targets SOFTWARE\Microsoft\AMSI\Providers\ (or its WOW6432Node path) and note the CLSID (GUID) that was added — the rule fires on either the native or the 32-bit compatibility path. Known antivirus RegSvr registrations for their own provider CLSIDs are filtered out, so a match here is already outside those exclusions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register an AMSI provider?
  context: Registering an AMSI provider is an administrative, install-time action normally performed by a security product's installer under SYSTEM or an admin account. A write from an interactive user account, a workstation with no security-product deployment, or an unexpected writing process points away from routine activity. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or missing, pivot on the writing process (Image).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What CLSID was registered as an AMSI provider, and what does registering a provider at this location do?
  context: The AMSI Providers key is a known evasion and persistence location. Each subkey is a CLSID that Windows resolves to an in-process COM DLL and loads into every process that initializes AMSI. A provider that always reports content as clean blinds script scanning; because the DLL loads automatically into AMSI consumers, the registration also functions as persistence. Record the exact CLSID and the writing process for the CLSID-to-DLL resolution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the AMSI provider key?
  context: The default value written under the provider CLSID is typically the provider's display name (attacker PoCs use arbitrary strings). The name itself is not the payload — it labels the provider — but an unfamiliar or randomized name alongside a CLSID that no installed security product uses is a signal to resolve the CLSID to its DLL. Details is populated on roughly 79% of registry modifications; absence means the value data was binary or empty.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What DLL does the registered provider CLSID resolve to on this host?
  context: A provider registration only points at a CLSID; the payload is the DLL registered at that CLSID's InProcServer32 value under Classes\CLSID. Cross-reference the GUID from the alerting provider key against InProcServer32 writes on this host in the same window — the Details field of that write is the DLL path. A path in a user-writable location (AppData, Temp, ProgramData, Public) rather than a signed security-product directory indicates an attacker-controlled provider.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\InProcServer32'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the referenced provider DLL signed, and did it load into AMSI-consuming processes?
  context: A registered AMSI provider DLL loads into every process that initializes AMSI (PowerShell, Office applications, WScript and other script hosts). Filter these image-load results to the DLL path resolved from the CLSID's InProcServer32 registration. An unsigned or untrusted-path DLL loading into powershell.exe or an Office process confirms the provider is active in memory; a signed DLL from a recognized security vendor's directory points back toward a legitimate product.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Image
- question: Does the AMSI provider key entry persist, or was it re-modified after the initial write?
  context: Endpoint telemetry emits no registry key or value deletion events, so attacker cleanup of the provider entry is not directly observable. Judge durability from the key's re-modification history over a longer window and from whether the referenced DLL subsequently loaded into AMSI consumers. A provider written once and left in place is a standing persistence and evasion mechanism until the CLSID is removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this AMSI provider key been modified before on this host?
  context: A first-time write to the AMSI Providers key is more suspicious than a recurring one. Legitimate security-product installs touch this key rarely and predictably. Zero prior history for this specific CLSID path indicates the provider was newly introduced rather than reconfigured, which raises the priority of resolving its DLL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: An actor registering a rogue AMSI provider often makes related changes in the same session — writing the CLSID's InProcServer32 DLL path, disabling other defenses, or adding a second persistence mechanism. Registry changes grouped by key path and writing process in the surrounding window reveal the full scope. The triggering key will appear in the results; the signal is what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the referenced provider DLL written to disk by the same process or its children?
  context: The provider is only effective if the DLL named in the CLSID's InProcServer32 value exists at that path. Correlating file activity by the registry-writing process and its children shows whether the provider DLL was dropped in the same session. The file-write event carries no hash; if the DLL is present, hash it from a later load or execution for a reputation lookup. Reboot durability is a judgment call — the provider survives reboot as long as the CLSID entry and the DLL both remain.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process wrote the AMSI provider key, and is its parent chain expected?
  context: The rule already excludes registrations by known antivirus RegSvr binaries, so the writing process here is something else. A registration written by regsvr32.exe, rundll32.exe, powershell.exe, or an unrecognized binary — especially one whose parent is a script host, an Office application, or an unexpected shell — points to an attacker-driven COM registration rather than a product installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was the AMSI Providers key modified on other hosts in the environment?
  context: The same provider registration across multiple hosts may indicate a group-policy or software push (legitimate) or a widespread implant (malicious). If only this host carries the modification, it may be targeted. Compare the CLSID and Details values across hosts to tell a uniform product deployment from divergent, host-specific registrations.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the registration?
  context: Alerts rarely occur in isolation. A rogue AMSI provider is often paired with the script-based or fileless activity it exists to hide. Aggregating process activity around the registration surfaces novel parent-child pairs — script hosts, LOLBins, or reconnaissance tools — that ran alongside the provider write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this registration?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a script-host launch — may reveal the stages that preceded the provider registration and help reconstruct the timeline. Installing an AMSI-scanning bypass is frequently a mid-chain step taken to protect subsequent script execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a rogue AMSI provider they commonly install backup footholds using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the same timeframe indicate intentional stacking rather than an isolated product installer action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
