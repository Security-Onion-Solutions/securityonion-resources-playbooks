name: Lsass Full Dump Request Via DumpType Registry Settings
id: 8b2f1c4a-9d63-4e0a-bb27-6f3e5a1d0c84
description: |
  Detects a registry write that sets the Windows Error Reporting LocalDumps DumpType value
  to DWORD 2 (Full Dump), either under the global LocalDumps key or under the lsass.exe
  per-application subkey. WER LocalDumps is disabled by default and requires administrator
  rights; setting DumpType to a full dump configures Windows to write a complete memory dump
  of the target process the next time it crashes. Applied to lsass.exe, this arms a
  credential-theft primitive: on the next crash -- which an attacker can force by submitting
  a synthetic Windows Error Reporting hang report for LSASS -- WerFault.exe writes a full
  LSASS memory dump to disk without the attacker's own process ever opening an LSASS handle,
  evading tools that watch for direct LSASS access. A small number of legitimate applications
  configure full user-mode dumps for debugging, so the investigation should confirm which key
  and value were written, whether the value persists, whether a resulting dump file was
  produced, and whether the account and host are expected to change WER dump settings.
type: detection
detection_id: 33efc23c-6ea2-4503-8cfe-bdf82ce8f719
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert match the rule -- a WER LocalDumps DumpType value set to full dump (DWORD 2)?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    fires when the modified key path (TargetObject) ends in \Windows Error Reporting\LocalDumps\DumpType
    -- either the global key or the lsass.exe per-application subkey -- and the value data
    (Details) is DWORD (0x00000002), which selects a full memory dump. Review the exact key
    path, value data, and writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Windows Error Reporting dump settings?
  context: Configuring WER LocalDumps is a rare, privileged operation outside of a developer
    debugging a crashing application or a sanctioned diagnostic change. Knowing whether the
    writing account and the host's function are consistent with legitimate WER configuration
    is often the fastest way to separate a true positive from routine activity. User
    attribution is present on most endpoint registry events; when it is a machine account or
    missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the DumpType key, and which process is being configured for a full dump?
  context: DumpType controls the crash-dump format, where 0 is a custom dump, 1 a mini dump,
    and 2 a full dump that captures the entire process address space. A value of DWORD 2 under
    the global LocalDumps key applies to every crashing process, while the same value under the
    lsass.exe subkey targets LSASS specifically. Confirm the value data and note whether the
    path scopes to lsass.exe, since a full dump of LSASS yields its in-memory credentials.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which LocalDumps key was modified, and is this a known credential-access or evasion configuration?
  context: The key path reveals intent. A DumpType write under \Windows Error Reporting\LocalDumps\lsass.exe
    is a direct credential-access configuration, while the global LocalDumps\DumpType affects
    all processes and can be a broader debugging change. Companion values under the same
    LocalDumps key -- DumpFolder (where dumps are written) and DumpCount -- further characterize
    how the dump capture was set up. The value name, data, and writing process together
    determine whether this resembles a diagnostic change or a hands-on credential-theft setup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What credential store does this configuration target, and by what dump method?
  context: This technique targets LSASS memory, which holds cleartext credentials, NTLM hashes,
    and Kerberos tickets for interactive sessions. Unlike procdump, comsvcs.dll MiniDump, or
    direct memory-read tooling, the WER LocalDumps path never opens an LSASS handle from the
    attacker's process -- WerFault.exe performs the dump on the next crash, so the usual loud
    dumping command lines are absent by design. The writing command line shows how the DumpType
    value was set; check whether the LocalDumps\lsass.exe subkey was used, which scopes the
    full dump specifically to LSASS.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this key, and is its parent chain expected?
  context: The process that performed the registry write and the parent that launched it reveal
    how the change was made. A WER configuration change driven by an installer, a debugging
    tool, or a management agent has a predictable parent chain; the same write from an
    interactive shell, a script host (powershell.exe, wscript.exe, mshta.exe), or an Office
    application is more consistent with hands-on abuse. Walk up from the parent to see what
    initiated it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was a full memory dump file written to disk on this host after the configuration change?
  context: The registry write only arms the capture; the credential-theft artifact is the .dmp
    file WerFault.exe produces when the configured process next crashes. WER writes dumps to the
    DumpFolder value or, by default, to %LOCALAPPDATA%\CrashDumps (for services, under
    %WINDIR%\System32\Config\SystemProfile). A dump file appearing after the DumpType change --
    especially one referencing lsass -- is the memory image an attacker would collect for
    offline credential extraction. If a full LSASS dump is confirmed, treat every credential
    resident on this host as exposed.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dmp'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Does the DumpType value persist, or was it reset after the alert?
  context: The full-dump configuration stays armed until the value is changed back, so the key
    remains a latent credential-theft trigger for every subsequent crash of the target process.
    Endpoint telemetry does not emit registry value-deletion events, so judge persistence from
    the key's re-modification history over a longer window. If no later write resets DumpType to
    0 or 1, the full-dump setting is still active. A value that flips to full dump and is quickly
    reverted may indicate a one-off dump-and-clean, while a value left in place keeps LSASS
    dumping armed for the next crash.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: Configuring a WER full dump for credential theft often accompanies other registry
    changes -- a DumpFolder redirect, defense-tampering keys, or persistence entries. Registry
    modifications from the same host within a short window, grouped by key path and writing
    process, reveal the full scope of the change and whether multiple objectives were pursued
    together. The triggering key appears in the results; the signal is what else was modified.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this DumpType key been modified before on this host?
  context: A LocalDumps DumpType value that has never been touched on this host is more
    suspicious than a routine change. WER dump configuration should rarely change outside of a
    deliberate debugging exercise, so zero or very low history for this exact key points to a
    first-time modification. Compare historical Details values to see whether a full dump was
    ever configured before or this is genuinely new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same DumpType key modified on other hosts in the environment?
  context: The same WER dump configuration across multiple hosts can indicate a management
    rollout or a debugging policy, whereas a modification confined to this one host is more
    consistent with a targeted action. Compare the Details values across hosts -- identical
    values pushed by a deployment tool differ from ad-hoc, host-specific changes that flip
    DumpType to full dump.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Credentials extracted from an LSASS dump are typically reused to move laterally. The
    query returns outbound connections from this host to remote-access ports -- 3389 (RDP), 445
    (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating
    Image and User show what drove each connection. Two limits to keep in mind -- offline
    cracking or extraction from a dump can delay reuse by hours or days, and credentials
    replayed from another machine will not appear here (check logon events on suspected targets
    for the affected accounts). If endpoint network telemetry is not collected from this host,
    treat zero rows as a visibility gap, not evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed, and do any have elevated privileges?
  context: A full LSASS memory dump exposes the credentials of every account with an active
    session on this host at the time of the dump, not just the account that made the registry
    change. Enumerate the accounts that authenticate to this host and prioritize any with
    domain-admin, service-account, or other elevated access -- those require escalation and
    password resets. Standard user accounts with interactive sessions should also be treated as
    exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Registry modifications on this host within a short
    window around the alert reveal the immediate context -- what configuration changes landed
    together and whether the WER change was one step in a larger sequence. Aggregating by key
    path and writing process collapses routine noise while novel modifications stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or
    privilege escalation -- may reveal the attack stages that preceded the WER configuration
    change and help reconstruct the timeline. Credential-access setup commonly follows an
    initial foothold and elevation, so preceding alerts help place this event in the sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
