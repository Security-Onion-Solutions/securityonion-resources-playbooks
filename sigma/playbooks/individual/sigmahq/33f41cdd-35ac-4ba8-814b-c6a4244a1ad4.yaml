name: WMI Persistence - Script Event Consumer File Write
id: c7f95219-c370-4be5-b243-56cfbe8b9ae5
description: |
  Detects a file write performed by scrcons.exe, the WMI ActiveScript event consumer host. When a permanent WMI event
  subscription (an __EventFilter plus an ActiveScriptEventConsumer bound by a __FilterToConsumerBinding) fires, its script
  runs inside scrcons.exe, and a file write from that process usually means the consumer staged or dropped a payload — a
  classic Windows Management Instrumentation event-subscription persistence mechanism. Legitimate power/management software
  occasionally registers script consumers, so a benign write is possible, but attacker-registered consumers run under a
  WmiPrvSE.exe lineage that hides the true author and survive reboots. Determine what file was written, what subscription
  drove the consumer, and whether the dropped artifact went on to execute.
type: detection
detection_id: 33f41cdd-35ac-4ba8-814b-c6a4244a1ad4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did scrcons.exe write this file, and does the path match what the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file that was
    written, the operation performed (created/deleted/renamed), and that the responsible process is the WMI script consumer
    host scrcons.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to run WMI script event consumers that write files?
  context: Legitimate power and management software occasionally registers ActiveScript consumers, so knowing whether this
    host's role and the account behind the write are consistent with that is often the fastest way to separate a benign
    consumer from an attacker-registered one. When the write occurs under a machine or SYSTEM account, judge by the host
    role and the written file rather than the identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What spawned scrcons.exe, and is that WMI provider lineage expected?
  context: A permanent WMI subscription runs its script inside scrcons.exe, which is spawned under the WmiPrvSE.exe provider
    host. Tracing the parent's own origin reveals whether the chain is a routine WMI query or a subscription firing on an
    attacker-defined trigger. The provider lineage is what hides the real author of the consumer, so establishing it is
    central to attribution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is in the file the script consumer wrote? Check for encoded or obfuscated content.
  context: Read and analyze the written file's actual content. WMI script consumers commonly stage a second-stage payload,
    a script, or a loader — check for base64-encoded blocks, obfuscated strings, embedded URLs or IP addresses, and inline
    PowerShell or command interpreter invocations. The consumer's ScriptText often contains an iex/FromBase64String cradle,
    so the written file may be its decoded output.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the written file has executed, what is its hash and does threat intel flag it?
  context: A file's hash is recorded when it runs, not when it is written, so this looks for the dropped artifact executing
    and reads its hash; submit that to a reputation or threat-intel service to determine whether it is known malicious,
    benign, or previously unseen. If the file was written but has not executed, retrieve it from its on-disk path and hash
    it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What processes did scrcons.exe spawn after writing this file?
  context: The processes launched by the script consumer reveal the payload's actual effect. A WMI ActiveScript consumer
    that goes on to spawn cmd.exe, powershell.exe, mshta.exe, or a freshly written binary indicates triggered execution
    of a staged payload rather than an in-process configuration task.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What modules did scrcons.exe load, and are any unsigned or unexpected?
  context: The script consumer host loads a scripting engine (vbscript.dll or jscript.dll) and, for some payloads, .NET or
    COM components. An unsigned or unusually located module loaded into this process points to a malicious script pulling
    in its own dependency rather than a stock script consumer. Review the signer and signature status of each loaded module.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Which WMI event subscription drove this consumer, and is it a known-good or attacker-registered consumer?
  context: The file write is the visible artifact of a permanent WMI subscription — an __EventFilter (a WQL trigger query),
    an ActiveScriptEventConsumer (holding the ScriptText that ran), and a __FilterToConsumerBinding tying them together.
    Enumerate root\subscription (EventFilter, EventConsumer, FilterToConsumerBinding) and the root\cimv2 interval and
    absolute timer instructions used by some frameworks, then compare the registered consumer and its trigger against
    known-good management software. This artifact is not visible in the event stream and must be enumerated on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other files did the script consumer write or delete around the alert?
  context: A consumer that drops one file often drops several — staging a loader, unpacking components, or writing then
    deleting a scratch file. The breadth, paths, and extensions of the consumer's other file activity distinguish a single
    staged artifact from a broader payload deployment and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this file been written on this host before?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. Zero or
    very low historical counts for this path indicate a first-time drop by the script consumer, which raises the priority
    of the content and execution checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When scrcons.exe has previously written files on this host, which user accounts drove that activity, and
    does the current alert fit?
  context: Even a host that legitimately runs script consumers has a stable set of accounts behind those writes. The
    query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how
    scrcons.exe file writes have historically occurred here — the Image column shows scrcons.exe itself, so the account
    and frequency carry the signal. An unexpected account or a first-ever occurrence is the deviation worth chasing;
    file events lack parent lineage, so pivot to scrcons.exe's start event if the WMI consumer chain matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: C:\WINDOWS\system32\wbem\scrcons.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts seen scrcons.exe file writes in the past week, and does the distribution look like automation
    or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of scrcons.exe file writes.
    Many hosts producing the same activity points to a pushed subscription or management automation; one host or a small
    unrelated set points to a host-local trigger. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: C:\WINDOWS\system32\wbem\scrcons.exe
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced scrcons.exe file writes, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving their 90-day history of scrcons.exe file
    writes aggregated by host. A user who has never produced this activity is more notable than one who does so routinely;
    weigh the count against the user's role, noting that WMI-driven writes frequently surface under a machine or service
    account rather than an interactive user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: C:\WINDOWS\system32\wbem\scrcons.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven scrcons.exe file writes here or across the environment, or is the
    program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior, so the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program,
    giving the 90-day history of that program driving these writes. A new or rare program for this activity is the deviation
    worth chasing; a program that already accounts for many prior events is provider or management automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: C:\WINDOWS\system32\wbem\scrcons.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Persistence rarely stands alone. Examining the activity around the write reveals what led to it and what followed
    — reconnaissance, credential access, or the registration commands (mofcomp.exe, PowerShell WMI cmdlets) that created
    the subscription. Novel parent-child pairs at low counts are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the subscription being registered and help reconstruct the timeline leading to the payload write.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to other persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: The WMI subscription is one foothold; attackers commonly stack backups. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without additional tooling, and file
    monitoring captures these drops. Additional persistence-location writes in the same timeframe indicate intentional
    stacking rather than an isolated consumer.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
