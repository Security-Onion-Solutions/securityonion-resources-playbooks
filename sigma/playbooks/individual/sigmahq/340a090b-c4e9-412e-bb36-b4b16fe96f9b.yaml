name: Renamed ZOHO Dctask64 Execution
id: c9e20a07-db24-4325-bbbe-b9583e4a95d9
description: |
  Detects execution of dctask64.exe (a signed ZOHO ManageEngine Endpoint Central
  binary) under a different file name, matched by import hash while the on-disk name
  does not end in dctask64.exe. The binary exposes subcommands that inject a DLL into
  an arbitrary process (injectDll), run arbitrary cmd.exe commands (executecmd64), and
  create new processes from an arbitrary executable (invokeexe), so a renamed copy is a
  signed proxy for DLL injection and command execution. The rule fires when the import
  hash matches AND the image name is not the legitimate dctask64.exe; renaming a signed
  vendor tool is rarely a routine action, so the investigation should establish the
  binary's true identity, how it arrived, and what it injected, spawned, or contacted.
type: detection
detection_id: 340a090b-c4e9-412e-bb36-b4b16fe96f9b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting process match the dctask64 import hash while running under a name other than dctask64.exe?
  context: Confirm the alert is a true positive by reviewing the process Hashes against the known dctask64 import hashes and
    checking that the Image path does not end in dctask64.exe. The rule fires only when both hold simultaneously, so a process
    that is genuinely named dctask64.exe at its install path would be filtered out and is not what this alert represents.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Hashes
- question: Is this user and host expected to run ManageEngine Endpoint Central tooling, and under a renamed binary?
  context: Endpoint Central agents run on managed endpoints, but the legitimate component keeps its dctask64.exe name. A user
    or host with no ManageEngine management role, or a context where the vendor tool would never be renamed, shifts the
    disposition toward deliberate masquerading rather than routine management activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The import hash matches dctask64.exe, so the embedded PE metadata (OriginalFileName) and ZOHO Corporation code
    signature still reflect the original vendor tool even though the on-disk name differs. Comparing the Image path against
    OriginalFileName confirms the rename, and the signature status tells you whether the file is the intact signed ZOHO
    binary, a re-signed copy, or a tampered build. Submit the hash for reputation lookup to confirm it is the known utility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Which dctask64 subcommand did this invocation run, and what target did it act on?
  context: dctask64 exposes injectDll (inject a DLL into a process by PID), executecmd64 (run an arbitrary cmd.exe command),
    and invokeexe (launch an arbitrary executable). Decode the command line to identify which subcommand ran and its
    arguments — the DLL path and PID for injectDll, the wrapped command for executecmd64, or the executable path for
    invokeexe. The subcommand and its argument define exactly what the renamed binary was directed to do.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'injectDll'
          - 'executecmd64'
          - 'invokeexe'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did any process on this host make a process-injection API call (WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx) around the time this renamed binary ran?
  context: The injectDll subcommand injects a DLL into a target process, which normally requires opening a process
    handle with rights such as PROCESS_VM_WRITE and PROCESS_CREATE_THREAD, but Elastic Defend has no cross-process
    handle-open telemetry to confirm that directly. What is observable is the behavioral API layer that records the
    injection-side write primitives — memory writes, queued APCs, and hook installs — an operator issues once the
    handle is open. This channel does not carry a target-process field, so cross-reference any hits here by timing
    and by the source Image against this renamed binary's own execution window; absence does not rule out injection
    performed through mechanisms outside this API set.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
- question: What DLL was loaded into the process targeted by this binary, and is it signed and from a standard path?
  context: A successful injectDll call results in the specified DLL being loaded into the target process. Image-load events on
    this host around the alert window reveal which module was loaded and whether it is unsigned, untrusted, or staged from a
    user-writable or non-standard path — a strong indicator that the loaded code is attacker-supplied rather than a legitimate
    plugin. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_signed:
        Signed: 'true'
      condition: selection and not filter_signed
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: What child processes did the renamed binary spawn after execution?
  context: The executecmd64 and invokeexe subcommands cause dctask64 to launch cmd.exe or an arbitrary executable, so the
    binary's child processes are the actual delivered payload. Predictable management children differ sharply from
    interpreters, reconnaissance tools, or unexpected executables, which point to the renamed binary being used as an
    execution proxy.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the renamed binary or its children open outbound network connections after execution?
  context: Proxying execution through a signed binary is often paired with retrieving a payload or establishing command and
    control. Outbound connections initiated by this binary, or by the processes it spawned, may reveal payload download or
    operator infrastructure. Compare any destinations against known ManageEngine update and management endpoints to separate
    vendor traffic from attacker-controlled hosts.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: How did this renamed binary arrive on the host?
  context: 'A renamed copy of the vendor tool did not appear on its own — it was downloaded, copied, or dropped by another
    process. Tracing the file-creation event for this file name reveals the delivery mechanism: a download tool, an archive
    extraction, a remote-admin copy, or a malware dropper. The process that created the file, and whether it landed in a
    user-writable directory, tells you who placed the renamed binary and how.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this renamed binary, and is that parent chain expected for managed-endpoint tooling?
  context: The parent process reveals how the renamed binary was invoked. The legitimate component is launched by the
    ManageEngine agent service chain; an interactive shell, a script host, an Office application, or a remote-execution
    parent indicates the renamed copy was run by hand or by another tool rather than by the vendor agent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host — the resulting parent and user distribution reflects
    how the renamed-dctask64 pattern has historically run here, not generic binary usage. A new parent process, an unexpected
    user account, or a first-ever firing is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      filter_main_legit_name:
        Image|endswith: \dctask64.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      filter_main_legit_name:
        Image|endswith: \dctask64.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      filter_main_legit_name:
        Image|endswith: \dctask64.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      filter_main_legit_name:
        Image|endswith: \dctask64.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the renamed-dctask64
    pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      filter_main_legit_name:
        Image|endswith: \dctask64.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded the proxy execution and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
