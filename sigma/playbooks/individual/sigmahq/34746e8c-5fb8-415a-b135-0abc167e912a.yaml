name: WinSxS Executable File Creation By Non-System Process
id: 4d20be18-5a3d-4c33-baff-1bfc915956d6
description: |
  Detects the creation of a file ending in .exe under C:\Windows\WinSxS\ by a process whose own image does not
  start with one of the system locations the rule excludes (SysWOW64, WinSxS itself, and the rule's System32
  entry). WinSxS is the Windows component store: the servicing stack populates it during updates and feature
  installs, so almost every legitimate executable arriving there is written by servicing components rather than
  by ordinary user or application processes. Writing a binary into WinSxS places it among thousands of
  component directories under a system path, which makes it blend with trusted OS content and survive casual
  review of user-writable locations. The investigation should attribute the write to a specific process and its
  parent, establish whether that process belongs to the servicing stack, determine whether the dropped
  executable is signed and consistent with a real component, and check whether it was executed afterward.
type: detection
detection_id: 34746e8c-5fb8-415a-b135-0abc167e912a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the created file sit under C:\Windows\WinSxS\ with an .exe extension, and which process wrote it?
  context: >-
    Confirm the alert by reading the full target path, the operation performed, and the responsible process.
    The rule fires on an .exe arriving anywhere under the WinSxS component store while the writing process's
    image is outside the excluded system locations, so the two facts that settle triage are the exact path and
    the identity of the writer. Servicing components such as TiWorker.exe and TrustedInstaller.exe write here
    routinely; the exclusion list is narrow, so a servicing binary that lives outside SysWOW64 and WinSxS still
    produces this alert. Read the signer columns for coherence with the file being written, not as a verdict.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to have an executable written into the Windows component store?
  context: >-
    Component-store writes normally accompany a Windows update, a feature installation, or a servicing
    operation, and they run under SYSTEM or a machine account rather than an interactive user. An interactive
    or application-owned identity writing an .exe into WinSxS is the deviation worth chasing. When the user
    field shows a machine or service account, judge the event by the writing process and the host's role
    instead — a build server or an imaging host has a different baseline from a standard workstation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the executable still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives the next steps. A binary still in place can be retrieved from its
    WinSxS path, hashed, and analyzed. A file removed shortly after it was written points to a self-deleting
    dropper or staged cleanup and moves the investigation toward what executed in the interval. Interpret the
    results by operation type — creation followed quickly by deletion is the cleanup pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process wrote the executable, and what spawned it?
  context: >-
    The file event names the acting process but not its origin, and it carries no command line or parent of its
    own. Retrieving the writing process's own start event supplies the command line, the parent, and the parent's
    command line. Servicing writes descend from services.exe or the update stack; a writer launched by a browser,
    an Office application, a script host, or an unpacked installer in a temporary directory points at delivery
    rather than maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What was the writing process doing around the alert — decode its command line and working directory.
  context: >-
    The file event does not carry a command line, so the operation the writing process was performing has to be
    read from its process telemetry. Scoping to every execution of that binary on this host within a few minutes
    of the alert captures multi-step operations that span sequential invocations, such as an installer extracting
    and then registering components. Decode any flags, source paths, archive names, or URLs, and check the working
    directory for the staging location the payload came from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is this executable — is it a genuine servicing component or a planted binary using the path for cover?
  context: >-
    Retrieve the file from its WinSxS path and examine it directly. A real component-store executable sits inside
    a versioned component directory whose name encodes the package, architecture, and version, and it carries a
    Microsoft signature matching that package. Check the signer, the version resources, the imports, embedded
    strings, and packer indicators, and compare the file size against the same component elsewhere in the store.
    A renamed or trojanized binary borrowing the path will diverge on at least one of these.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this executable has run, what is its hash and does it have known threat intel detections?
  context: >-
    A hash is recorded when a file runs, not when it is written, so the hash for this artifact appears on a later
    execution event rather than on the creation event. This query looks for the dropped name executing on the host
    and reads the recorded hash; submit it to reputation and threat intel services to determine whether it is known
    good, known bad, or unseen. If the match lands on an interpreter that referenced the path on its command line,
    the recorded hash belongs to the interpreter, not to the artifact. If the file never ran, retrieve it from its
    WinSxS path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that places one executable in the component store often touches more than one path — an installer
    unpacking a payload set, a dropper staging components, or a tool writing configuration alongside its binary.
    The breadth, locations, and extensions of the writer's other file activity separate a single artifact from a
    staged set and enumerate what else needs review. This covers both the writing process and its direct children,
    since droppers frequently delegate the write. If the writer is a servicing or installer component, volume alone
    is not the signal — read where the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written into the component store on this host recently, and by which processes?
  context: >-
    The component store has a small set of processes that legitimately write to it, and their activity clusters
    around update and servicing windows. Grouping recent WinSxS writes by path and writing process shows whether
    the alerting write belongs to a servicing burst or stands alone under an unfamiliar writer. A single unfamiliar
    process appearing across several component paths, or an isolated write with no surrounding servicing activity,
    is the pattern to pull on.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\WinSxS\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Was the executable run after it was written?
  context: >-
    Placing a binary in the component store is a staging step; execution is what turns it into activity on the
    host. Correlating the dropped name against later process starts reveals whether the artifact progressed from
    delivery to execution, and under what parent. Both a direct launch and an invocation via another process's
    command line are covered. No execution within the window does not close the case — the binary may be waiting
    on a scheduled task, a service, or a side-loading path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - image_load
- question: Has a file with this name been written to this host before?
  context: >-
    Component-store executables are written and rewritten across update cycles, so a name with a long history on
    this host and consistent writers is likely a real component being serviced again. Zero prior appearances, or a
    history that shows the name arriving only now and only via this writer, marks the file as new to the host and
    raises the value of the content and signature checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file with this name been written into the component store on other hosts?
  context: >-
    The same name appearing across many hosts is consistent with a pushed update or a widely deployed component;
    appearance on one or a handful of hosts is consistent with a targeted drop. Read the distribution alongside the
    writing process on each host — the same name written by servicing on most hosts but by something else on this
    one narrows the question considerably. Genuine component names are shared fleet-wide, so weigh the writers, not
    just the count.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of
    executables arriving in the component store from non-excluded writers, grouped by host — not generic file
    activity. A user with no prior occurrences of this pattern is the deviation worth chasing; a user whose role
    covers imaging, packaging, or software deployment may produce it routinely. Weigh the count against what this
    identity is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: .exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\Systems32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically written executables into the component store, or is it new for this activity?
  context: >-
    Component-store writes usually run under SYSTEM or a machine account, where user identity attributes nothing,
    and the file event carries no parent to pivot on. The program itself is the meaningful pivot. This query mirrors
    the rule's selection scoped to the alerting binary, so the result is the 90-day history of this program producing
    this specific pattern across hosts. A program that already accounts for a large volume of prior occurrences is
    servicing or vendor automation; one that is new or rare for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: .exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\Systems32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the identity's activity across all hosts in the alert window shows whether the component-store write
    was an isolated action or one step in a sequence that also touched other endpoints. Look for remote execution,
    administrative tooling, or repeated staging on multiple hosts. When the alert fires under SYSTEM or a machine
    account, this view returns routine agent and service telemetry and attributes nothing — read the program-scoped
    view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program write executables into the component store on other hosts in the same window?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host, and the file
    event carries no parent to pivot on. Whether the same program produced the pattern elsewhere in the same window
    is the question that separates a pushed or scheduled rollout from a host-local trigger. Several hosts inside the
    window points to deployment or update automation; a single host points to something that started here.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: .exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\Systems32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The write is one event in a sequence. Grouping process starts on this host in the surrounding window by binary
    and parent collapses repetitive service and agent telemetry into high-count rows while novel parent-child pairs
    stand out at low counts. Look for the delivery step that preceded the write — an archive utility, a script host,
    an installer running from a temporary directory — and for what followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this write in a timeline. Defense tampering, reconnaissance, or
    credential access before a binary lands in a system path suggests the write is a later stage of activity already
    underway rather than a servicing artifact. An empty result is also informative — an isolated write with no
    preceding detections is more consistent with maintenance.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
