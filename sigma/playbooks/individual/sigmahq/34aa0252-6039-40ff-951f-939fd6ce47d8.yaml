name: Suspicious Keyboard Layout Load
id: 8aee748f-22a4-4b7b-9535-b31a21cf0f19
description: |
  Detects a Keyboard Layout Preload or Substitutes registry value being set to a Persian/Farsi (language IDs 00000429 or 00050429) or Vietnamese (0000042a) layout in a user session. The rule fires only when both conditions hold: the modified key is under a Keyboard Layout Preload/Substitutes path AND the value data is one of the flagged locale IDs. Legitimate causes include genuine multilingual users, contractors, or localized deployments; the malicious pattern is a foreign-locale operator working interactively (often over a remote session) on a host intended for US-locale staff only, or tooling that sets a locale programmatically. Investigation should confirm which account's session loaded the layout, how the value was written (an interactive language change versus a scripted write), and whether that locale is expected for this user and host.
type: detection
detection_id: 34aa0252-6039-40ff-951f-939fd6ce47d8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and layout value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The TargetObject should be a Keyboard Layout Preload or Substitutes value, and the Details data should be one of the flagged locale IDs (00000429 or 00050429 for Persian/Farsi, 0000042a for Vietnamese). Note the writing process and the account whose hive was modified.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to use a Persian/Farsi or Vietnamese keyboard layout?
  context: Legitimate multilingual users, contractors, or localized deployments can load non-US layouts. Knowing whether the account role and host function are consistent with this locale is often the fastest way to separate a benign language preference from a foreign-locale operator on a system meant for US-locale staff only. User attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact keyboard-layout value was written, and is this a locale key or a persistence/evasion location?
  context: The Preload and Substitutes subkeys under HKCU Keyboard Layout hold the language IDs a user session can switch between; they are locale indicators rather than classic persistence keys such as Run/RunOnce, Services, or Image File Execution Options. The specific value name and data determine which layout became available in the session and which account it applies to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What language does the loaded layout ID map to?
  context: The Details value is a hexadecimal Windows language ID. 00000429 and 00050429 are Persian/Farsi (Iran) layouts and 0000042a is Vietnamese. Decode the value to establish which locale was made available in the user session and whether it matches any legitimate language need for this account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Have these flagged foreign-layout IDs appeared on this host before, or is this their first occurrence?
  context: First-time appearance of a Persian/Farsi or Vietnamese layout on a host intended for US-locale staff is more significant than a recurring entry reflecting a known multilingual user. Registry key/value deletions are not observable in endpoint telemetry, so persistence cannot be confirmed by looking for a removal; judge it instead from recurrence — whether these language IDs have been written to a keyboard-layout key on this host previously.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
        - \Keyboard Layout\Preload\
        - \Keyboard Layout\Substitutes\
        Details|contains:
        - '00000429'
        - '00050429'
        - '0000042a'
      condition: selection
    fields:
      - Details
      - Image
      - User
- question: Which account's session loaded the layout, and did that session originate at the console or from a remote connection?
  context: The Preload and Substitutes values live in a user hive, so the layout applies to a specific account. A foreign locale appearing under an interactive remote session on a US-staff host is more concerning than one set at the physical console by the assigned user. Establish the account and the session origin from logon session and remote-access records for this host and time.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - User
      - host.name
      - Image
  answer_sources:
  - active_directory
  - organizational_knowledge
  - manual_review
- question: What process wrote the keyboard-layout value, and what launched it?
  context: An interactive language change is typically written by a settings mechanism (control.exe or rundll32 loading the international control panel, the settings application, or explorer.exe). A write by a script host, an installer, or a dropped binary points to a programmatic or automated change rather than a user adjusting their language bar. Reviewing the writer and its parent chain distinguishes an interactive locale change from a scripted one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other keyboard-layout entries exist under this user's hive on this host?
  context: A single foreign layout among many configured languages fits a genuinely multilingual user, whereas a lone Persian/Farsi or Vietnamese entry on an otherwise US-only profile stands out. Enumerating all Preload and Substitutes entries for this account shows whether the flagged locale is part of a broad language set or an isolated addition.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        TargetObject|contains: \Keyboard Layout\
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
- question: Were other registry modifications made on this host in the same session?
  context: A locale change accompanied by writes to persistence, security-policy, or service keys from the same account within a short window points to a hands-on session doing more than adjusting a language bar. Reviewing all registry modifications in the window, grouped by key path and writing process, reveals whether the layout load stands alone or sits inside a cluster of configuration changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: What interactive process activity followed the layout load on this host?
  context: A keyboard layout only matters when someone is typing at the keyboard, so process activity in the hours
    after the change indicates whether a hands-on operator was present. This is an aggregated survey of process
    starts grouped by image and user - routine services and agents collapse into high-count rows, while
    interactive tools, reconnaissance commands, or remote-administration utilities launched after the layout was
    loaded stand out as novel low-count entries, corroborating an active session rather than a passive
    configuration artifact.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the surrounding window collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts, revealing what led to the layout load and what followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Which other hosts loaded these flagged foreign layouts?
  context: The same foreign locale appearing across multiple hosts can indicate an operator moving through the environment with a consistent language profile, or a broad configuration push. A single host with the modification is more consistent with targeted or isolated activity. Compare which accounts and hosts show the flagged language IDs.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains:
        - \Keyboard Layout\Preload\
        - \Keyboard Layout\Substitutes\
        Details|contains:
        - '00000429'
        - '00050429'
        - '0000042a'
      condition: selection
    fields:
      - host.name
      - User
      - Details
  answer_sources:
  - registry_event
- question: Did this same account load these flagged foreign layouts on any other host?
  context: If the account tied to the alert has loaded the same Persian/Farsi or Vietnamese layout on additional hosts, that ties the locale to a roaming operator identity rather than a one-off setting on a single machine. Grouping by host for this specific account shows the spread of the account's foreign-locale activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        TargetObject|contains:
        - \Keyboard Layout\Preload\
        - \Keyboard Layout\Substitutes\
        Details|contains:
        - '00000429'
        - '00050429'
        - '0000042a'
      condition: selection
    fields:
      - host.name
      - Details
  answer_sources:
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — remote-access activity, reconnaissance, or credential access — may reveal the stages that preceded the locale change and help reconstruct the session timeline. The alert sequence on a host often tells the story around a single event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
