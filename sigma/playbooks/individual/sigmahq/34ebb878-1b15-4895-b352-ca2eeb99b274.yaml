name: Suspicious Execution of Shutdown
id: 6f2d8a41-9c3e-4b07-bc2a-1e5f7d930a8c
description: |
  Detects shutdown.exe invoked from the command line with a shutdown (/s) or restart (/r) switch. The
  rule fires when the image ends in shutdown.exe AND the command line contains '/r ' or '/s '. This is a
  legitimate native administration action — planned maintenance reboots, patch cycles, and remote-host
  restarts are routine — but a forced or unannounced shutdown/reboot can also be the impact stage of a
  destructive operation, the cleanup step after recovery inhibition, or a denial-of-service action against
  a single host. Determine whether the invocation matches expected administrative patterns (reason codes,
  comments, planned timing, an admin/helpdesk actor) and whether it is accompanied by recovery-inhibiting
  or destructive commands that would change its disposition from routine to malicious.
type: detection
detection_id: 34ebb878-1b15-4895-b352-ca2eeb99b274
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — shutdown.exe with a /s or /r switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    command line and process. The rule fires when the image ends in shutdown.exe AND the command line
    contains '/r ' (restart) or '/s ' (shutdown). Note which switch fired and whether force (/f), an
    immediate timeout (/t 0), a remote target (/m \\host), or an abort (/a) is also present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to initiate a system shutdown or reboot from the command line?
  context: Legitimate shutdown/reboot activity is normally driven by administrators, helpdesk staff, patch
    automation, or a service account with the Shut down the system user right. A standard user account, an
    unexpected service principal, or a host that is not normally rebooted on demand shifts the disposition.
    Absence of administrative context — the actor not belonging to an admin or helpdesk group — is a core
    part of what distinguishes routine from suspicious here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this shutdown command do? Decode every switch and parameter on the command line.
  context: The full command line reveals whether this is a planned admin reboot or an abrupt destructive one.
    Decode each switch — /s shutdown, /r restart, /g full restart, /f force-close apps with no warning, /t
    countdown (/t 0 means immediate), /m \\host targets a remote machine, /d p|u:xx:yy supplies a reason code,
    /c adds a comment, /a aborts an in-progress shutdown. Planned admin use typically carries a reason code
    and a comment; a forced, immediate, unannounced shutdown without reason codes is the suspicious pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned shutdown.exe and is that parent chain expected?
  context: The parent process reveals how the shutdown was invoked. Admin-driven reboots typically descend
    from explorer.exe, an interactive shell, a management agent, or a scheduled-task host. Unusual parents
    such as mshta.exe, wscript.exe, an Office application, or an unknown binary in a user-writable path
    suggest the shutdown was driven by a script or payload rather than an operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this rule's shutdown/restart pattern, what parents and users
    normally drive it, and does the current alert fit that pattern?
  context: Even routine maintenance reboots leave a stable history. The query mirrors the rule's selection
    scoped to this host, so the parent and user distribution reflects how this specific shutdown/restart
    pattern has historically run here. A new parent process, an unexpected user account, or a first-time
    appearance of the pattern on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains:
        - '/r '
        - '/s '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this shutdown/restart pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    shutdown/restart pattern rather than generic shutdown.exe usage. Many hosts firing the same pattern in a
    short window points to a patch wave or scheduled maintenance rollout; one host or a small unrelated set
    points to manual operator activity that deserves closer scrutiny.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains:
        - '/r '
        - '/s '
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains:
        - '/r '
        - '/s '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains:
        - '/r '
        - '/s '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether a forced reboot is isolated or part
    of broader action. If the same user triggered destructive or reconnaissance activity on multiple hosts
    around this time, the scope of the operation may be larger than a single shutdown.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \shutdown.exe
        CommandLine|contains:
        - '/r '
        - '/s '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: A forced shutdown rarely occurs in isolation. Examining process activity in the minutes around the
    reboot reveals what preceded it and what ran immediately before the host went down. Look for recovery
    inhibition, security-service tampering, mass file activity, or reconnaissance that would reframe the
    shutdown as the final stage of a destructive sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or
    recovery inhibition — may reveal the attack stages that preceded a forced reboot and help reconstruct the
    timeline. A shutdown following a chain of destructive alerts is materially different from an isolated
    maintenance reboot.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did a corresponding system shutdown or restart event get logged on this host around this time?
  context: Process execution of shutdown.exe records intent; the host status change events confirm the system
    actually initiated a shutdown or restart and capture the reason and the initiating account. Correlating
    the command line with these events confirms the action took effect and exposes the recorded reason code —
    an unexpected or unplanned reason, or no corresponding event at all, changes the disposition. If these
    operational events are not collected in this environment, treat their absence as a visibility gap rather
    than evidence the shutdown did not occur.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 1074
          - 6006
        Computer|expand: '%hostname%'
      condition: selection
    fields:
      - host.name
      - EventID
      - User
- question: What recovery-inhibiting commands were executed on this host around the shutdown?
  context: 'A forced reboot is sometimes the final step after recovery is sabotaged. Operators chain
    recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic), disabling boot recovery (bcdedit),
    deleting backups (wbadmin), corrupting boot.ini, and disabling the Recovery Environment (reagentc). This
    query surfaces all such commands on the host. The analyst should then verify whether each action succeeded
    by checking system state (vssadmin list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Destructive operations typically chain several actions: deleting shadow copies AND disabling
    recovery AND stopping security services AND clearing event logs, with a forced reboot at the end. Finding
    the complete set of destructive commands reveals whether the shutdown caps an impact sequence or is an
    isolated administrative action.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Is this same shutdown/restart activity firing on other hosts in the environment?
  context: Destructive operations often issue the same command across many hosts simultaneously or in rapid
    succession. Finding this alert firing on multiple hosts in a short window indicates a network-wide forced
    reboot rather than a single planned maintenance action, and determines the scope for containment and
    incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host before
    the shutdown?
  context: Recovery-inhibiting actions and a forced reboot often bracket a file-encryption or wiper phase.
    Checking for unknown or suspicious binaries executing from user-writable or temp paths around the
    shutdown helps determine whether destruction or encryption preceded the reboot and how far it progressed.
    Ransom notes (README.txt, HOW_TO_DECRYPT) should also be checked via file events or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Where has this user authenticated recently?
  context: Authentication events show which systems the user accessed before and after the shutdown. A user
    authenticating to many hosts in a short period — especially remote logons preceding forced reboots —
    suggests the activity spans the environment rather than a single planned maintenance window. Network and
    RDP logon types are the ones of interest for remote-initiated shutdowns.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
