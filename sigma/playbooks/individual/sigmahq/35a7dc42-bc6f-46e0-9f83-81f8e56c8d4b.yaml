name: Pingback Backdoor DLL Loading Activity
id: 5db8cdbb-5c91-4585-84f0-6ff793ed0e7b
description: |
  Detects the Windows Distributed Transaction Coordinator service process (msdtc.exe) loading a module named oci.dll from C:\Windows. This is the signature of the Pingback backdoor, which achieves persistence through DLL search-order hijacking: a planted oci.dll is placed where msdtc.exe resolves it ahead of any legitimate copy, and the msdtc service is configured to auto-start so the backdoor loads at boot. The loaded DLL establishes covert command-and-control over ICMP echo traffic, so no listening ports appear in netstat. Investigate the loaded module's signature and hash, how and when oci.dll reached disk, whether the msdtc service configuration was altered for persistence, and any processes msdtc spawned to execute backdoor commands.
type: detection
detection_id: 35a7dc42-bc6f-46e0-9f83-81f8e56c8d4b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (msdtc.exe loading
    C:\Windows\oci.dll), its code-signature status, and the loading process against the rule's
    criteria. A legitimate oci.dll is an Oracle client library that lives in Oracle install
    directories, not C:\Windows; msdtc.exe loading an oci.dll out of the Windows directory is
    the search-order-hijack pattern this rule targets. The load event carries the module's hash
    and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to run the MSDTC service, and would any legitimate software place an oci.dll in C:\Windows?
  context: >-
    MSDTC runs legitimately on many database and application servers, so the msdtc.exe process
    alone is not suspicious — the planted oci.dll is. Determine whether the host's role explains
    an oci.dll on disk (for example, Oracle client tooling installed into its own directory,
    not C:\Windows) and whether any deployment would stage that module. A host with no Oracle
    footprint loading oci.dll through msdtc has no benign explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is oci.dll's signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a benign library from a planted backdoor. A valid Microsoft or
    Oracle signature on oci.dll would point toward a legitimate component; an unsigned module,
    or one with an invalid or distrusted signature, carrying an Oracle-style filename in
    C:\Windows is a masquerading indicator. Pivot the module hash against threat intelligence —
    the Pingback loader has known hashes. SignatureStatus values to weigh: Valid (likely benign),
    Unsigned, Invalid, or Distrusted (suspicious for a system-directory DLL).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\oci.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did msdtc.exe load in this session, and are any from non-canonical or user-writable paths?
  context: >-
    The full set of modules a process loads shows whether oci.dll is an isolated planted library
    or part of a broader side-loading pattern. Look for additional DLLs loaded from C:\Windows,
    %TEMP%, AppData, ProgramData, or Public rather than System32, and for unsigned modules where
    signed ones are expected. msdtc.exe has a well-defined set of legitimate dependencies;
    modules outside that set loaded from unusual directories corroborate search-order hijacking.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Has oci.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If oci.dll has never
    been loaded here, or has only been loaded by unrelated processes, this msdtc load is
    anomalous. A host that legitimately runs Oracle tooling may show oci.dll loaded by Oracle
    binaries from Oracle directories — that profile differs from msdtc loading it out of
    C:\Windows. Baselines of allowed DLL paths and expected loading processes inform which
    module, path, and process combinations are normal here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: How was msdtc.exe started on this host — as an auto-start service, or launched by another process?
  context: >-
    DLL search-order hijacking via a service depends on the loading process starting
    automatically. If msdtc.exe was launched by services.exe as an auto-start service, the
    backdoor loads at every boot; an msdtc.exe spawned by an interactive shell or an unusual
    parent is itself suspicious. Compare the parent and command line against the normal
    service-controlled launch.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\msdtc.exe'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
      - User
- question: Was the msdtc service configuration modified around the alert — Start type set to auto-start, or ImagePath altered?
  context: >-
    Pingback's installer sets the msdtc service to start automatically so the hijacked DLL loads
    at boot; that change appears as a registry modification under the MSDTC service key. Review
    the Start value (a shift to automatic), ImagePath, or dependency changes, and note their
    timing against the DLL's appearance on disk — a tight correlation between the service change,
    the file drop, and the module load is the persistence-installation chain. Compare against the
    expected service baseline for this host.
  range: -90d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\MSDTC'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: When and by what process was oci.dll written to disk on this host?
  context: >-
    The malicious oci.dll is planted before msdtc ever loads it, so the file-creation event
    reveals the origin — a dropper, an unpacked archive, or a manual copy — and the process that
    wrote it. A recent write of oci.dll into C:\Windows by an unexpected process, close in time
    to the module load, confirms the planted-DLL stage. If the write predates available
    telemetry, treat the module load as the earliest visible point and pivot on the writing
    process once identified.
  range: -90d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\oci.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What child processes did msdtc.exe spawn after the module load?
  context: >-
    The Pingback backdoor executes received commands (exec, exep, shell) on the host, which
    surface as child processes of the loading process — commonly cmd.exe or other interpreters.
    A service process like msdtc.exe normally spawns few or no children; command interpreters,
    reconnaissance utilities, or file-transfer tools spawned by msdtc.exe indicate the backdoor
    is servicing operator commands.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: When this host has previously matched the rule's pattern, what loading processes and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's exact selection (msdtc.exe loading C:\Windows\oci.dll) scoped to
    this host, so the resulting distribution reflects how this specific pattern has fired here
    historically rather than generic msdtc activity. Any prior match is itself notable — a
    legitimate host should have no history of msdtc loading oci.dll from C:\Windows. A new match
    with no prior baseline points to first-time compromise.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \msdtc.exe
        ImageLoaded: C:\Windows\oci.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the distribution look like a single host or a spreading foothold?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of msdtc
    loading C:\Windows\oci.dll. Because this pattern has no legitimate cause, any additional hosts
    represent parallel infections rather than benign automation. Multiple hosts point to a broader
    intrusion; a single host narrows the affected footprint.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \msdtc.exe
        ImageLoaded: C:\Windows\oci.dll
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Activity in the minutes around the module load —
    reconnaissance, credential access, additional persistence, or file staging — helps place the
    backdoor load in a larger sequence. Aggregating process activity by parent-child pair
    collapses routine agent noise while novel combinations stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential
    access — may reveal the stages that preceded the backdoor load and help reconstruct the
    timeline. The delivery of the dropper that planted oci.dll may itself have generated a
    prior alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single foothold. Alongside a hijacked service DLL, operators
    commonly stack scheduled tasks, additional services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same window indicate deliberate
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection. Dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without
    running standard persistence tools. Additional drops in the same window as the DLL hijack
    point to a layered persistence strategy.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
