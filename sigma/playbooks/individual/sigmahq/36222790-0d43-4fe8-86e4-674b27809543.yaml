- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across every host in the surrounding hour shows whether the activity is confined to
    one endpoint or the account is being used to reach others. Interactive logons, remote execution utilities, or the
    same script hosts appearing on additional hosts under this account widen the scope. If the alert fired under a
    service principal, this view fills with routine agent telemetry and the parent-driven view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
