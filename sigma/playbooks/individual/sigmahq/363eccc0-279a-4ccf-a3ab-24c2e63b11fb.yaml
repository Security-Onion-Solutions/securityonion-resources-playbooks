name: Powershell Create Scheduled Task
id: 96b995be-cf38-4668-8409-21544c2ef81e
description: |
  Fires when PowerShell script-block content (EID 4104) creates a scheduled task by either of two routes: the
  ScheduledTask module cmdlets (New-ScheduledTaskAction, New-ScheduledTaskTrigger, New-ScheduledTaskPrincipal,
  New-ScheduledTaskSettingsSet, New-ScheduledTask, Register-ScheduledTask), or a WMI call — Invoke-CimMethod against
  the PS_ScheduledTask class in Root\Microsoft\Windows\TaskScheduler, which performs the same registration while
  evading detections keyed on schtasks.exe command lines. Content from the ScheduledTask module's own auto-generated
  cmdletization script is filtered out. Scheduled tasks provide recurring, logon-, or boot-triggered execution and can
  run as SYSTEM, making them a standard persistence and privilege-escalation mechanism, while the same cmdlets also
  serve routine deployment and administrative automation. Investigation should establish which branch fired, decode the
  full script for the task name, action, trigger, and run-as principal, confirm whether a task actually registered
  (Security audit and task-cache registry artifacts), and determine whether its payload has already executed. Note that
  script-block capture is policy-gated per host — default installs log only content matching built-in
  suspicious-strings checks, so absence of surrounding 4104 evidence is not absence of activity.
type: detection
detection_id: 363eccc0-279a-4ccf-a3ab-24c2e63b11fb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the script block create a scheduled task — either through the ScheduledTask cmdlets or through an
    Invoke-CimMethod call against the PS_ScheduledTask class?
  context: >-
    The rule has two branches, and which one fired matters. The cmdlet branch matches any one of
    New-ScheduledTaskAction, New-ScheduledTaskTrigger, New-ScheduledTaskPrincipal, New-ScheduledTaskSettingsSet,
    New-ScheduledTask, or Register-ScheduledTask — a single helper call that builds a task component without
    registering anything can trigger it. The WMI branch requires Invoke-CimMethod together with -ClassName
    PS_ScheduledTask and -NameSpace Root\Microsoft\Windows\TaskScheduler all in the same block — a complete
    registration through the WMI class that performs the same operation as Register-ScheduledTask while avoiding
    schtasks.exe. Content from the ScheduledTask module's auto-generated cmdletization script is excluded by the rule.
    Long scripts are split across multiple 4104 events, so judge the match on the complete reassembled script, not the
    alerting fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
- question: Is this user expected to create scheduled tasks with PowerShell on this host?
  context: >-
    Deployment tooling, configuration-management agents, and administrator automation register tasks routinely — often
    as SYSTEM — so the account and host role are the fastest discriminator. The query shows the alerting block's host,
    user, and on-disk script path (blank for interactive or in-memory execution). An ordinary user account producing
    task-registration script content on a workstation reads very differently from a management server running a signed
    deployment script; also weigh whether the run-as principal configured inside the script is more privileged than the
    account that created it, since task registration is a common route to SYSTEM-level execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
- question: Was there a change ticket, maintenance window, or documented approval for this scheduled task?
  context: >-
    Scheduled-task creation is the kind of change most organizations ticket, and tasks are normally deployed through
    group policy or software-deployment platforms rather than ad-hoc PowerShell. A matching ticket or maintenance
    window closes the alert quickly. A registration with no corresponding record, landing outside business hours and
    outside any maintenance window, or performed by hand when policy routes task deployment through management tooling,
    supports the unauthorized-persistence reading. The query lists this user's PowerShell launches on the host as an
    execution-context reference; the substantive answer comes from change records and the responsible team.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
    - CommandLine
- question: What task does the complete script configure — its name, action, trigger, and run-as principal?
  context: >-
    Script-block content is logged after decoding, so any -EncodedCommand wrapper is already unwrapped; only
    string-level obfuscation inside the script (concatenation, format operators, backticks) still needs manual work.
    Read the reassembled script for the Register-ScheduledTask or Invoke-CimMethod call and its inputs — the task name,
    the New-ScheduledTaskAction executable and arguments (the persistence payload, sometimes itself an encoded
    PowerShell command), the trigger (logon, startup, or a repetition interval), the New-ScheduledTaskPrincipal user
    and run level (SYSTEM or highest-privilege principals created by a lower-privileged account are the escalation
    pattern), and any settings that hide the task from listing. Heavily encoded or high-entropy action arguments are
    themselves a signal worth decoding fully.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
- question: Did the task-creation commands also appear on a PowerShell command line, and which invocation carried them?
  context: >-
    Cmdlet-driven registration frequently arrives through a -Command argument, which lands in process telemetry as a
    readable command line naming the task, action, and schedule as typed. When the script ran from a file or an
    interactive console, the command line shows only the host invocation and this returns little — the script-channel
    decode question then carries the task details. Matches from earlier in the window also reveal whether this user has
    registered or re-registered tasks on this host before.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        CommandLine|contains:
          - 'New-ScheduledTask'
          - 'Register-ScheduledTask'
          - 'PS_ScheduledTask'
      condition: selection
    fields:
    - CommandLine
- question: Was a task actually registered — what task name and creating account does the audit trail record?
  context: >-
    The script content shows what was attempted; the Security log records what registered. Event 4698 logs task
    creation and 4702 logs modification, each carrying the task name and the account that performed it. Randomized or
    convention-breaking task names, and a creating account that is not the usual deployment identity for this host, are
    the anomalies worth weighing. Task-lifecycle auditing is policy-dependent — if these events are not collected in
    this environment, zero results are a visibility gap rather than proof nothing registered, and the task-cache
    registry question covers the same registration from endpoint telemetry.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4698
          - 4702
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
- question: Did a task-cache registry write record the new task's registration?
  context: >-
    Every successful registration writes the task definition under the Task Scheduler's TaskCache Tree key, whose leaf
    is the task name — endpoint registry telemetry captures this even where Security-channel task auditing is off. The
    writing process is normally the Task Scheduler service host rather than the PowerShell process that requested the
    registration, so judge the write by the key name and timing rather than the writer. The same key's later
    modification history doubles as the cleanup check, since a task removed after execution leaves its trace here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Schedule\TaskCache\Tree\'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: When is the task scheduled to run, and has it already executed?
  context: >-
    Scheduled-task payloads run as children of the Task Scheduler service host, so processes spawned by it after the
    registration show whether the persistence has already activated. Match what appears here against the trigger
    decoded from the script — a repetition-interval task may have run several times inside this window, while a logon-
    or boot-triggered task fires at the next logon or restart and may not appear yet. Watch for the configured action
    binary, script hosts, or anything launching from user-writable paths; how tightly the first execution follows the
    registration is also worth noting, since attacker tasks are commonly run immediately to verify the foothold.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the task still registered, or was it queried or removed after creation?
  context: >-
    Persistence is only active while the task exists, and some operators delete tasks after their payload runs to
    reduce artifacts. Confirm the task's current state directly on the host with a task-scheduler query through your
    management tooling, using the task name decoded from the script. The query surfaces task-management command lines
    on the host — Unregister-ScheduledTask or schtasks invocations around the alert reveal whether the task was
    inspected, modified, or cleaned up after creation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'Unregister-ScheduledTask'
          - 'schtasks'
      condition: selection
    fields:
    - CommandLine
- question: Did the PowerShell session spawn follow-on activity after the script ran?
  context: >-
    A 4104 event records script content, not outcome, and carries no process link — this pivots by host, user, and
    time to the children of the user's PowerShell hosts in the half hour after the block was logged. Cmdlet-based task
    registration itself completes in-process, so children here reveal the session's other actions: staging the payload
    the task will run, reconnaissance, or launching the payload directly without waiting for the trigger. The task's
    own scheduled executions appear under the Task Scheduler service host instead, in the trigger-and-timing question.
    If the alert fired under SYSTEM or another service principal, the user anchor is broad; read results with that in
    mind rather than dropping it.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Operators commonly weaken controls before running meaningful PowerShell — execution-policy bypass flags, AMSI
    tampering (AmsiUtils, amsiInitFailed), antivirus preference changes, or downgrading to PowerShell v2 to avoid
    script-block logging. Any of these on the same host in the hour before the alert makes the routine-administration
    explanation harder to sustain, particularly when the task being registered runs an encoded or user-writable
    payload.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block — reconnaissance, payload staging, the task registration, and
    follow-on tooling produce a cluster of script blocks in a short window, and surrounding blocks from the same
    session often contain the payload content or task parameters the alerting fragment lacks. The log.level column
    shows whether the host logs every block (verbose) or only automatically flagged content (warning) — on a
    warning-only host this view is partial by design, and absence of surrounding blocks is not evidence nothing else
    ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Task-based persistence is usually a mid-chain step — something delivered the script and gained execution first.
    Earlier detections on the same host, such as initial-access activity, defense tampering, or credential access, help
    reconstruct how the actor reached the point of installing persistence and whether this registration is part of a
    longer sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs every script block at verbose level only when the Script Block Logging policy is enabled; by
    default it logs only content matching built-in suspicious-strings checks, at warning level. On a warning-only host
    the alerting block is a fragment of the host's PowerShell activity, and the absence of other 4104 evidence says
    little. Use the level distribution here to calibrate how complete every other script-channel result in this
    investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
- always_include: true
  question: Has this user produced this task-creation pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection scoped to this user — a 90-day history of this specific task-creation
    pattern aggregated by host, not generic PowerShell use. An administrator or deployment operator who registers tasks
    regularly reads differently from an account producing the pattern for the first time; weigh the count against the
    user's role. History covers only hosts logging the PowerShell channel, and non-flagged content appears only where
    full script-block logging is enabled, so zero history is weaker evidence on a default-logging fleet.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - New-ScheduledTaskAction
        - New-ScheduledTaskTrigger
        - New-ScheduledTaskPrincipal
        - New-ScheduledTaskSettingsSet
        - New-ScheduledTask
        - Register-ScheduledTask
      selection_cimmethod:
        ScriptBlockText|contains|all:
        - Invoke-CimMethod
        - -ClassName
        - PS_ScheduledTask
        - -NameSpace
        - Root\Microsoft\Windows\TaskScheduler
      filter_main_legitimate_scripts:
        ScriptBlockText|contains|all:
        - Microsoft.PowerShell.Core\Export-ModuleMember
        - Microsoft.Management.Infrastructure.CimInstance
        - __cmdletization_methodParameter
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Which hosts have produced this task-creation pattern in the last 90 days, and is the alerting host among them?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior, and script-block
    events carry no process identity to pivot on — the pattern itself is the pivot. This mirrors the rule's selection
    fleet-wide over 90 days, aggregated by host. A pattern appearing routinely across many hosts is what deployment
    tooling and vendor automation look like; one that has never appeared before, or only on this host, is the deviation
    worth chasing. Only hosts shipping the PowerShell channel (and, for non-flagged content, with full logging enabled)
    can appear, so absence elsewhere is weak evidence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - New-ScheduledTaskAction
        - New-ScheduledTaskTrigger
        - New-ScheduledTaskPrincipal
        - New-ScheduledTaskSettingsSet
        - New-ScheduledTask
        - Register-ScheduledTask
      selection_cimmethod:
        ScriptBlockText|contains|all:
        - Invoke-CimMethod
        - -ClassName
        - PS_ScheduledTask
        - -NameSpace
        - Root\Microsoft\Windows\TaskScheduler
      filter_main_legitimate_scripts:
        ScriptBlockText|contains|all:
        - Microsoft.PowerShell.Core\Export-ModuleMember
        - Microsoft.Management.Infrastructure.CimInstance
        - __cmdletization_methodParameter
      condition: 1 of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    The same account acting on several hosts in the alert window widens the scope — task registration on one host
    paired with logons or tooling on others is how persistence installed from a compromised account spreads. Hosts this
    account does not normally touch matter as much as the commands run there. If the alert fired under SYSTEM or
    another service principal, this view degrades to agent-telemetry noise; the fleet-wide pattern question is the
    meaningful substitute in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same task-creation pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection fleet-wide in the alert window, aggregated by host — the
    service-principal-safe version of the cross-network view, since script-block events carry no process identity to
    pivot on. Several hosts producing the pattern in the same window points to pushed or scheduled automation rolling
    out tasks; a single host points to a host-local action. Coverage is policy-gated per host, so absence elsewhere
    remains weak evidence on a default-logging fleet.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection_cmdlet:
        ScriptBlockText|contains:
        - New-ScheduledTaskAction
        - New-ScheduledTaskTrigger
        - New-ScheduledTaskPrincipal
        - New-ScheduledTaskSettingsSet
        - New-ScheduledTask
        - Register-ScheduledTask
      selection_cimmethod:
        ScriptBlockText|contains|all:
        - Invoke-CimMethod
        - -ClassName
        - PS_ScheduledTask
        - -NameSpace
        - Root\Microsoft\Windows\TaskScheduler
      filter_main_legitimate_scripts:
        ScriptBlockText|contains|all:
        - Microsoft.PowerShell.Core\Export-ModuleMember
        - Microsoft.Management.Infrastructure.CimInstance
        - __cmdletization_methodParameter
      condition: 1 of selection_* and not 1 of filter_main_*
    fields:
    - host.name
