name: Potential Persistence Via GlobalFlags
id: 5487f08f-e505-40d6-b7b6-1fbd19cb9e45
description: |
  Detects a registry write that either sets a GlobalFlag value under an Image File Execution Options (IFEO) key OR
  configures a SilentProcessExit subkey (ReportingMode / MonitorProcess) for a target executable. Together these two
  registry entries register a chosen binary to launch whenever the monitored target process exits, giving persistence
  and execution that does not appear in Autoruns. Legitimate use is rare and requires local-admin rights (the keys live
  under HKLM); the investigation should determine which target image is being monitored, which MonitorProcess payload it
  is configured to launch, and whether that payload has executed.
type: detection
detection_id: 36803969-5421-41ec-b92f-8500f79c23b0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key match either the GlobalFlag or the SilentProcessExit branch this rule detects?
  context: >-
    The rule fires when EITHER a GlobalFlag value is set under an Image File Execution Options key OR a SilentProcessExit
    subkey (ReportingMode or MonitorProcess) is written for a target executable. Confirm the exact TargetObject path and
    value data, and note which branch fired: a GlobalFlag write alone enables silent-exit reporting for the target, while
    a MonitorProcess write names the binary that will launch when the target exits. Both branches carry investigative
    weight, so record which one triggered before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Image File Execution Options or SilentProcessExit registry keys?
  context: >-
    These keys require local-admin rights and are almost never touched during normal operation. Confirm whether the
    writing account and host role make an IFEO or SilentProcessExit change plausible. User attribution is present on
    roughly 94% of endpoint registry events; when the account is a machine account or SYSTEM, pivot on the writing
    process instead, and apply service-account expectations rather than treating a person as the actor.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: >-
    IFEO and SilentProcessExit configuration is an unusual administrative action; a corresponding change record suggests
    an authorized deployment or debugging session, while its absence when policy requires one points toward unauthorized
    activity. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What specific registry key and value were modified, and is this a known persistence or evasion location?
  context: >-
    The registry path reveals intent. Image File Execution Options keys are abused for debugger-based hijacking and
    silent-exit persistence; a SilentProcessExit subkey with a MonitorProcess value registers a binary to run when the
    named target exits. The exact value name (GlobalFlag, ReportingMode, MonitorProcess) and its data determine what
    executes and under which target. Use this to judge whether the location is a recognized abuse path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this key, and does it name a payload path or a reporting flag?
  context: >-
    A MonitorProcess value holds the file path of the binary that Windows launches when the monitored target exits;
    inspect the Details field for that path and treat any location under Temp, AppData, ProgramData, or a public
    directory as suspicious. GlobalFlag and ReportingMode are DWORD values that enable silent-exit reporting rather than
    naming a payload. Value data is absent on roughly a fifth of registry writes when the data is binary or empty; a
    missing MonitorProcess path does not rule the mechanism out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which target image is registered for silent-exit monitoring, and what payload is its MonitorProcess configured to launch?
  context: >-
    The persistence hinges on the pairing of a GlobalFlag value on a target executable's IFEO key with a SilentProcessExit
    entry that points MonitorProcess at a chosen binary. Pulling every IFEO and SilentProcessExit write on this host shows
    which target images are monitored and which payloads they launch. Registering lsass.exe as the monitored target is a
    known credential-access variant that causes WerFault.exe to write a memory dump of the target rather than running an
    arbitrary payload, so note the target name specifically.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SilentProcessExit\'
          - '\Image File Execution Options\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is this a recognized persistence location, and does the configuration remain in place over time?
  context: >-
    IFEO GlobalFlag and SilentProcessExit keys are established persistence and evasion locations that Autoruns does not
    enumerate, which is part of their appeal. Registry key and value deletions are not observable on this telemetry, so
    the removal of the entry cannot be confirmed directly; judge whether the configuration is still active from the key's
    re-modification history over a longer window and from whether the configured payload has run.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What other registry modifications were made on this host in the same session?
  context: >-
    Silent-exit persistence usually requires more than one registry write — a GlobalFlag value on the target plus a
    ReportingMode and MonitorProcess value under SilentProcessExit — and an operator often stacks additional changes such
    as defense tampering or service configuration. Reviewing all registry writes on the host in the window, grouped by key
    path and writing process, reveals whether the entries form a complete silent-exit configuration and what else landed
    alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: After the registry change, did an unexpected process launch when the monitored target exited?
  context: >-
    The persistence only executes when the monitored target process next exits, at which point Windows launches the
    configured MonitorProcess binary — frequently as a child of WerFault.exe (Windows Error Reporting). Review process
    launches on the host after the registry write, paying attention to WerFault.exe spawning unusual children or the
    payload path seen in the MonitorProcess value data starting to run. Execution may lag the registry change by hours,
    since it is gated on the target's exit. The query anchors on WerFault.exe activity and on command lines carrying
    the written value data; if the flagged write was the GlobalFlag or ReportingMode DWORD rather than the
    MonitorProcess path, the value-data anchor is a number and a zero here is expected — the MonitorProcess
    question identifies the registered payload in that case.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_wer:
        Image|endswith: '\WerFault.exe'
      selection_wer_child:
        ParentImage|endswith: '\WerFault.exe'
      selection_payload:
        CommandLine|contains|expand: '%Details%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: Was the referenced MonitorProcess payload created on disk, and does the persistence survive reboot?
  context: >-
    Silent-exit persistence is only effective if the binary named in the MonitorProcess value exists at that path. Confirm
    whether the writing process or its children dropped a file at the referenced location; the payload can also be hidden
    in an NTFS alternate data stream to evade file listing. The file-write event carries no hash, so if the payload is
    present, hash it from a later execution or retrieve it for a reputation lookup. Reboot survival is a judgment call
    based on the value data and the key's re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process wrote this registry key, and what started that process?
  context: >-
    IFEO and SilentProcessExit keys live under HKLM and require elevation, so the writing process and its origin matter.
    Tracing the writing process back to its own parent reveals whether the change came from a legitimate elevated context
    (an installer, a management agent, an administrator's shell) or from an unexpected chain such as a script host or an
    Office application. A non-standard parent for the writing process is the tuning parameter that most often separates a
    legitimate elevated change from an operator-driven one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this registry key been modified before on this host?
  context: >-
    IFEO GlobalFlag and SilentProcessExit keys should rarely change on a normal endpoint. A first-time modification is
    more suspicious than a recurring one, and comparing the historical value data shows whether the same configuration was
    set before or whether this write is new. Zero history for the key strengthens the case that the entry was introduced
    deliberately.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Registry persistence rarely occurs in isolation. Aggregating process activity on the host around the alert time
    collapses routine agent noise into high-count rows while novel parent-child pairs stand out at low counts, which is
    what to scan for. Look for reconnaissance, privilege escalation, or additional persistence that frames how the
    registry change fits into the surrounding activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was the same IFEO or SilentProcessExit key modified on other hosts?
  context: >-
    The same registry modification across multiple hosts may indicate a management push or widespread implant, while a
    change confined to this host suggests targeted activity. Comparing the value data across hosts distinguishes a
    consistent legitimate configuration from bespoke MonitorProcess payloads pointing at different binaries per host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other persistence mechanisms installed on this host in the same timeframe?
  context: >-
    Operators rarely rely on a single foothold. After configuring silent-exit persistence, they commonly add backup
    mechanisms using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence
    installations in the same window point to intentional stacking rather than an isolated administrative change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded the registry change and help reconstruct the timeline. A persistence write that follows earlier
    execution or tampering alerts tells a different story than one that appears on its own.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
