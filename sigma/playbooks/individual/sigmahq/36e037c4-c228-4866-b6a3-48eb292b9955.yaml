name: DNS Query Request By Regsvr32.EXE
id: 6f245ebb-7643-4722-b83b-6c6d7a75c487
description: |
  Detects a DNS name resolution initiated by regsvr32.exe. regsvr32.exe registers and unregisters DLLs and ActiveX controls and has no routine need to resolve domains, so a DNS query from it typically means the binary is being used as a signed proxy to fetch and execute a remote scriptlet or DLL (the /i:<URL> scrobj.dll "Squiblydoo" pattern). Because it is Microsoft-signed, proxy-aware, and leaves no on-disk trace of a remotely hosted script, regsvr32 is a common AppLocker and script-control bypass. Investigate which domain was queried, the full regsvr32 command line that drove the lookup, whether the host then connected to the resolved infrastructure, and what DLLs, child processes, or files followed.
type: detection
detection_id: 36e037c4-c228-4866-b6a3-48eb292b9955
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the queried domain match what this rule detects, and which process queried it?
  context: Confirm the alert by reviewing the exact domain (QueryName) and the querying process against the rule's detection criteria, and whether the lookup resolved. The rule fires when the querying process is regsvr32.exe, so verify the process path and note the resolved IP for the connection pivot.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run regsvr32.exe in a way that resolves external domains?
  context: Legitimate regsvr32 use registers local DLLs and ActiveX controls and rarely needs a DNS lookup. A developer workstation or software-deployment host performing COM registration is a different profile than an end-user machine where regsvr32 suddenly resolves an unfamiliar domain. Knowing the expected role is often the fastest way to separate routine registration from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What domain was queried, is it malicious, and did it resolve?
  context: 'The alert is a DNS lookup, not a connection — investigate the queried domain itself: registration age (WHOIS), DGA characteristics, passive DNS, and threat intel. A recently registered or algorithmically generated domain, or a known-C2 domain, points to attacker-controlled infrastructure hosting a remote scriptlet. Check whether the query resolved (dns.resolved_ip); a resolved IP is the pivot for confirming an actual outbound connection.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What was the full regsvr32 command line on this host, and does it carry a /i scriptlet or remote path?
  context: The DNS event carries the querying process but not its command line, so pivot to process activity for regsvr32 on this host to recover what actually drove the lookup. The proxy-execution pattern is regsvr32 /s /n /u /i:<path-or-URL> scrobj.dll; treat a /i argument pointing at a URL or a .sct/.ocx scriptlet, or any reference to scrobj.dll, as the operative indicator. Decode every argument and note the working directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned regsvr32.exe, and is that parent chain expected?
  context: The parent reveals how regsvr32 was invoked. Legitimate COM registration is typically launched by explorer.exe, an installer, or a deployment agent. Parents such as mshta.exe, wscript.exe, cscript.exe, winword.exe, or excel.exe point to script- or macro-driven proxy execution rather than routine registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: What child processes did regsvr32.exe spawn afterward?
  context: The processes a proxy-execution binary launches reveal its actual payload. A remote scriptlet commonly instantiates WScript.Shell and runs cmd.exe or powershell.exe, or stages a follow-on binary. Unexpected children of regsvr32 — command interpreters, script hosts, or unfamiliar executables — indicate the fetched code executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What DLLs did regsvr32.exe load on this host, and are they signed and from expected paths?
  context: T1218.010 execution surfaces as regsvr32 loading a scriptlet or DLL shortly after invocation. The scriptlet-proxy pattern loads scrobj.dll to run remote JScript; a payload DLL may be unsigned or loaded from a temporary or user-writable directory. Loads from outside System32 or SysWOW64, or unsigned or untrusted signatures, corroborate proxy execution over routine COM registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\regsvr32.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did regsvr32.exe make any outbound connection on this host after resolving the domain?
  context: A DNS lookup only proves resolution was attempted; the connection is a separate event. regsvr32 has no legitimate reason to open an outbound session, so an egress connection from it confirms the remote-retrieval path completed and identifies the contacted infrastructure. Correlate the destination with the resolved IP from the domain lookup rather than reading the DNS event's own destination, which is the resolver.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\regsvr32.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did regsvr32.exe write any files to disk on this host around the alert?
  context: COM-based execution can drop a scriptlet, a fetched DLL, or a staged payload before or during registration. A remotely hosted scriptlet often leaves no on-disk trace, so any file written by regsvr32 — especially a .sct, .ocx, .dll, or an executable in a temporary or user-writable directory — is worth confirming and hashing via its later execution event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\regsvr32.exe'
      condition: selection
    fields:
      - TargetFilename
- question: Does this host normally resolve this domain?
  context: First-time resolutions of a domain are more suspicious than routine lookups. A count of zero or very low over the trailing window indicates a new or unusual domain and distinguishes fresh attacker infrastructure from an established business destination the host regularly contacts.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: When this host has previously fired the rule's pattern, what programs and users normally drive regsvr32 DNS activity, and does the current alert fit?
  context: Even signed binaries get abused. The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how regsvr32 DNS lookups have historically run here — not generic regsvr32 usage. A new acting program process, an unexpected account, or a first-of-its-kind pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms surrounding the regsvr32 lookup.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access, or an initial-access lure — may reveal the stages that preceded this lookup and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of regsvr32 DNS lookups (not generic regsvr32 usage). Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to targeted operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
      condition: selection
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who use one signed-binary proxy often use several. If regsvr32 was used to run a remote scriptlet, check whether rundll32, mshta, msbuild, installutil, msiexec, or similar binaries were also used to execute code. Finding multiple proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\installutil.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was regsvr32.exe executed from its expected System32 or SysWOW64 path?
  context: regsvr32 run from outside System32 or SysWOW64 may have been copied or renamed to evade path-based allowlists. A regsvr32.exe launched from a user's temp or download directory, or with an OriginalFileName that does not match, is more suspicious than one from its standard location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the regsvr32 DNS pattern over the past 90 days, and what command-line structures are typical?
  context: A regsvr32 DNS pattern with no prior history on a host is more suspicious than one seen regularly under stable parents. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern rather than generic regsvr32 usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        Image|endswith: \regsvr32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
