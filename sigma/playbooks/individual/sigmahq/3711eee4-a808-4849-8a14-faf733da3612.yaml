    Under a service principal, asking what else the user did returns agent telemetry from every host rather than an answer.
    The query instead mirrors the rule's branch structure scoped to the alerting parent process, fleet-wide, within the alert
    window. Multiple hosts in the same hour points at a pushed or scheduled rollout; a single host points at a host-local
    trigger and keeps the immediate scope narrow.
  range: +/-1h
