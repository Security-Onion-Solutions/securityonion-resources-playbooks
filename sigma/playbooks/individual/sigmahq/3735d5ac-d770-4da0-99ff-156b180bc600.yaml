name: Potential CCleanerReactivator.DLL Sideloading
id: 9a267c83-5604-44f6-bd1e-05875467e6cf
description: |
  Detects a module named CCleanerReactivator.dll being loaded by a process other than the
  legitimate signed CCleanerReactivator.exe running from the standard CCleaner install directory
  (C:\Program Files\CCleaner\ or C:\Program Files (x86)\CCleaner\). This is a DLL search-order
  sideloading pattern (T1574.001): an attacker plants a malicious DLL of that name alongside a
  trusted signed loader so the loader executes attacker code from its own directory. A custom
  CCleaner install path can produce a benign match, so the investigation should determine whether
  the loaded DLL is signed and legitimate or planted, where the DLL and its loader executed from,
  what launched the loader, and whether persistence was established on the host.
type: detection
detection_id: 3735d5ac-d770-4da0-99ff-156b180bc600
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded),
    its code-signature status, and the process that loaded it. The rule fires when a module ending
    in \CCleanerReactivator.dll is loaded by any process other than the signed CCleanerReactivator.exe
    in the standard CCleaner install directory. A load from a copied or user-writable folder, or by
    an unexpected loader, is the sideloading condition; a load by CCleanerReactivator.exe under a
    non-standard but legitimately installed CCleaner path is the common false positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the CCleaner reactivator component or load this DLL?
  context: Legitimate CCleaner installs on managed endpoints load this DLL from Program Files under
    the product's own updater. Knowing whether this host runs CCleaner at all, and whether the user
    context matches how the product is normally deployed, is often the fastest way to separate a
    routine (or custom-path) install from a planted loader running under a trusted binary name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process pull in, and are any from user-writable directories,
    unsigned, or manually mapped?
  context: The full set of modules the loading process loaded exposes the operator's staging when the
    DLL name alone is opaque. Look for additional DLLs loaded from %TEMP%, AppData, ProgramData, Public,
    or a copied task/staging folder; unsigned modules where signed ones are expected; and system
    libraries such as wininet.dll appearing outside their normal load path, which can indicate a
    sideloaded stage that maps further libraries manually to evade standard load monitoring.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and threat-intel reputation of the loaded CCleanerReactivator.dll?
  context: Module reputation distinguishes a genuine third-party DLL from a planted one. A DLL load
    event carries the module's signing status and hash directly. A validly signed copy from the CCleaner
    vendor is likely benign; an unsigned module, one with an invalid or distrusted signature, or a valid
    hash that does not match the vendor's known-good build is a strong sideloading indicator. Pivot the
    hash to threat intelligence to surface known loader samples, and compare every load of this DLL name
    on the host to see whether a legitimate signed copy also exists alongside the flagged one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What command line launched the loading process, and which directory did it run from?
  context: DLL search-order sideloading resolves the planted DLL from the loader's own working directory,
    so the loader's launch path and current directory identify where the attacker staged the payload.
    A CCleanerReactivator.exe running from a copied or non-standard folder (for example, a temporary
    tasks or staging directory) rather than the product's install path is the core sideloading condition;
    the command line and working directory reveal that origin.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loader, and is that parent chain expected?
  context: The parent that launched the loading process reveals how the sideload was initiated. A trusted
    updater started by services.exe or the product's own scheduler is routine; a loader launched by
    cmd.exe, a script host, a shortcut handler, or a file-copy utility that staged content into the
    loader's directory points to an intrusion chain rather than normal product behavior. This retrieves
    the loader's own creation record and its parent details.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Is the planted DLL still on disk, and what files did the loader or its children write?
  context: If the loaded DLL was planted rather than installed, checking whether it still exists on disk
    enables hash lookup, sandbox submission, and content review. Correlating file writes to the loading
    process and its direct children also surfaces additional staged payloads or dropped stages written
    into the same directory.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were autorun or DLL-load registry keys modified on this host around the alert?
  context: Sideloading is frequently paired with a registry autorun entry so the trusted loader relaunches
    at logon or boot, and DLL-redirection keys can be used to force libraries to load from attacker paths.
    Modifications to Run/RunOnce keys, KnownDLLs, or AppInit_DLLs around the time of the load indicate an
    attempt to make the execution persistent or to broaden the hijack beyond this single process. Registry
    value data (Details) shows what the key was pointed at.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\Session Manager\KnownDLLs'
          - '\AppInit_DLLs'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Has CCleanerReactivator.dll been loaded on this host before, and under which processes?
  context: A first-time load of this DLL on a host is a stronger anomaly than a recurring one. If the same
    DLL has been loaded repeatedly by the same signed loader over the past 90 days, this load is likely
    routine product activity. If this is the first occurrence, or the DLL has historically only loaded
    under a different process, the current load is anomalous and consistent with a newly planted copy.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the CCleaner reactivator loader binary?
  context: A loader binary that has never been seen on a host is more suspicious than one that runs on a
    schedule. Zero or very low historical counts indicate first-time or rare execution and argue against a
    resident CCleaner install; a steady recurring count over 90 days suggests a genuine (possibly
    custom-path) product deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is this DLL being loaded on other hosts, and under which loading processes?
  context: Cross-host correlation surfaces how widely the DLL is present. The same DLL loaded on a single
    host may be a localized event; the same DLL loaded across multiple hosts points to shared distribution
    or a deployed product. Compare the variety of loading processes — a DLL loaded only by its expected
    signed loader looks like normal software, while the same DLL loaded under unexpected processes on other
    hosts suggests the sideload spread beyond this endpoint.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Loads rarely occur in isolation. Examining process activity in a tight window around the alert
    reveals what launched the loader, what ran alongside it, and what followed. Correlating file writes,
    module loads, and registry changes within a short interval is how DLL-hijack behavior is distinguished
    from a normal product update, so look for staging utilities, script hosts, or reconnaissance running
    close to the load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — phishing-payload execution, staging utilities, reconnaissance,
    or defense tampering — may reveal the stages that preceded the sideload and help reconstruct the timeline.
    The sequence of alerts often tells the fuller story of how the loader arrived on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, deployment, or documented approval for installing or updating CCleaner on this host?
  context: Many organizations track software deployments through change tickets or a software catalog. A
    corresponding record for a CCleaner install or update — including a non-standard install path — suggests
    authorized activity and explains a benign match. Absence of any deployment record for a product loading
    from an unusual directory raises the likelihood the loader was staged rather than installed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall installing or running CCleaner on this host?
  context: Direct confirmation from the account holder or the endpoint owner is often the fastest legitimacy
    check. If nobody recalls installing or running CCleaner and the product is not part of the standard build,
    the loader is more likely to have been staged by an intrusion; if the user confirms a deliberate install,
    capture where it was installed from and why.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses process and registry command-line detection. Dropping an executable
    or script into a Startup folder, or into a path referenced by a Run key, achieves relaunch without invoking
    schtasks, sc, or reg. If the sideload is part of an intrusion, additional payloads dropped to these
    locations around the same time indicate deliberate persistence stacking.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single foothold. After establishing sideloaded execution, they commonly
    install backup persistence using different techniques — scheduled tasks, services, registry Run keys, BITS
    jobs, or WMI subscriptions. Multiple persistence installations in the same window indicate intentional
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
