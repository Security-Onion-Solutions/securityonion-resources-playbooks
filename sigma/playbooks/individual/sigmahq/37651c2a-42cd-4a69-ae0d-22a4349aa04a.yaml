name: Unsigned AppX Installation Attempt Using Add-AppxPackage
id: e58b43fe-d23f-4849-9bb7-a6c23b699dd1
description: |
  Detects PowerShell installing an unsigned AppX/MSIX package via Add-AppxPackage (or its
  alias Add-AppPackage) with the -AllowUnsigned flag. The rule fires when all of the
  selection groups match: the process is powershell.exe or pwsh.exe, the command line
  contains the Add-AppxPackage/Add-AppPackage cmdlet, and the -AllowUnsigned flag is present.
  Installing unsigned packages bypasses the normal signature requirement that protects against
  tampered or spoofed app identities; it is a legitimate developer test path but also a way to
  install attacker-controlled application content that can register protocol handlers, startup
  tasks, or background services. The investigation should determine what package was installed,
  where it came from, whether the user and host normally perform this action, and whether the
  install is part of a broader persistence or staging sequence.
type: detection
detection_id: 37651c2a-42cd-4a69-ae0d-22a4349aa04a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line install an unsigned AppX package, with Add-AppxPackage or Add-AppPackage and the -AllowUnsigned flag both present?
  context: Confirm the alert is a true positive before investing time. The rule fires only when powershell.exe or pwsh.exe runs the Add-AppxPackage/Add-AppPackage cmdlet together with the -AllowUnsigned flag. Verify all three elements appear in the actual command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to install unsigned application packages?
  context: Installing unsigned AppX packages is a developer and packaging-test activity. A workstation owned by a developer or a packaging engineer makes this routine; the same action on a server, a kiosk, or a standard user's machine is harder to explain and points toward unauthorized application staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What package path and full set of Add-AppxPackage arguments were used, and where does the package come from?
  context: The full command line names the package being installed. Read the -Path value to see whether the package sits on a local developer path, a removable drive, a network share, or a recently downloaded location, and check for additional switches like -Register or -DependencyPath that change install behavior. A package pulled from an untrusted or remote location is more concerning than one built locally.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'Add-AppPackage '
          - 'Add-AppxPackage '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: A straightforward Add-AppxPackage invocation is readable as-is, but attackers wrap the same action in base64 -EncodedCommand payloads, string concatenation, or backtick escaping to hide the package source. If the command line is encoded or obfuscated, decode it to recover the real -Path value and any chained commands that run before or after the install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected for a package install?
  context: The parent process reveals how the install was launched. An interactive explorer.exe or a developer IDE parent fits a human running a test install; mshta.exe, wscript.exe, an Office application, or an unexpected service parent suggests the install was driven by a script or a foothold rather than a person.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were PowerShell security controls bypassed or weakened before this install?
  context: Operators frequently relax PowerShell protections before running their payload. Execution policy bypass, AMSI patching, real-time monitoring disablement, and version-2 downgrade attacks in the hour before the install strengthen the case that the unsigned package is not a benign developer test.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content around this install?
  context: Script block logging records the deobfuscated script content PowerShell actually executed, providing ground truth even when the command line is encoded. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Does this host normally run PowerShell to install AppX packages?
  context: A host that has never run powershell.exe or pwsh.exe before is rare, but the historical frequency still calibrates expectations. Pair the count with the command-pattern check below; zero or very low PowerShell history on a host that just installed an unsigned package raises the priority.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this unsigned-AppX-install pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how this specific install pattern has historically run here, not generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains:
        - 'Add-AppPackage '
        - 'Add-AppxPackage '
      selection_flag:
        CommandLine|contains: ' -AllowUnsigned'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains:
        - 'Add-AppPackage '
        - 'Add-AppxPackage '
      selection_flag:
        CommandLine|contains: ' -AllowUnsigned'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains:
        - 'Add-AppPackage '
        - 'Add-AppxPackage '
      selection_flag:
        CommandLine|contains: ' -AllowUnsigned'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the install is an isolated action or part of activity spanning multiple endpoints. The same user staging packages or running tooling on several hosts in this window widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains:
        - 'Add-AppPackage '
        - 'Add-AppxPackage '
      selection_flag:
        CommandLine|contains: ' -AllowUnsigned'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the install and what followed it, exposing reconnaissance, privilege escalation, or additional persistence that provides broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded the package install and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this unsigned-AppX-install pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific install pattern rather than generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or vendor packaging automation; one host or a small unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cmdlet:
        CommandLine|contains:
        - 'Add-AppPackage '
        - 'Add-AppxPackage '
      selection_flag:
        CommandLine|contains: ' -AllowUnsigned'
      condition: all of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After installing application content, they commonly stack backup mechanisms using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
