name: Suspicious Volume Shadow Copy Vssapi.dll Load
id: 1d0b67ed-7a27-45eb-84f9-72021fa423ad
description: |
  Detects a process outside the known-good set (explorer.exe, SystemSettings.exe,
  binaries under System32/SysWOW64/WinSxS/Program Files, and installer package caches)
  loading vssapi.dll, the Volume Shadow Copy API. Backup agents, imaging tools, and some
  installers load this module legitimately to create or enumerate shadow copies. An
  unfamiliar executable loading it can indicate direct VSS-API shadow-copy deletion that
  bypasses vssadmin/wmic command-line detection (T1490, Inhibit System Recovery) — a common
  recovery-inhibition step ahead of ransomware encryption. Investigation should establish
  which process loaded the module, whether it legitimately performs backup work, and whether
  shadow copies or recovery features were actually removed.
type: detection
detection_id: 37774c23-25a1-4adb-bb6d-8bb9fd59c0f8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — vssapi.dll loaded by a process outside the known-good set?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), the
    loading process, and the code-signature status against the rule's criteria. The rule fires
    when vssapi.dll (the Volume Shadow Copy API) is loaded by a process that is not one of the
    expected system or installer binaries — explorer.exe, SystemSettings.exe, anything under
    System32/SysWOW64/WinSxS/Program Files, or a package-cache installer. The library event
    carries the DLL hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run software that interacts with the Volume Shadow Copy service?
  context: >-
    Backup agents, imaging tools, and some installers legitimately load vssapi.dll to create or
    enumerate shadow copies. Knowing whether the host's role (file server, backup client,
    workstation) and the acting account are consistent with VSS-interacting software is often the
    fastest way to separate routine backup activity from shadow-copy tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the loaded vssapi.dll the genuine Microsoft-signed module, or an unsigned or relocated copy?
  context: >-
    vssapi.dll normally ships as a signed Microsoft binary under System32/SysWOW64. A copy loaded
    from a user-writable or application directory, or one that is unsigned or carries an invalid
    signature, points to a masqueraded module or side-loading rather than a genuine VSS
    interaction. Signature-status values of note: Valid (expected for the real module), Unsigned,
    Expired, and Invalid (tampered). The load event carries the module hash for a threat-intel
    lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith: '\vssapi.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process loaded vssapi.dll, and what was its full command line and working directory?
  context: >-
    The Volume Shadow Copy API can be driven directly from code to delete or enumerate shadow
    copies without ever calling vssadmin or wmic, which is exactly how command-line-based
    recovery-inhibition detections are bypassed. The loading process's binary path, command line,
    and working directory reveal whether this is a known backup tool or an unfamiliar executable
    running from a user-writable location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
      - User
- question: What other modules did this process load, and are any from non-canonical paths or unsigned?
  context: >-
    The full set of modules a process loads corroborates its purpose. Alongside vssapi.dll, look
    for other VSS-related modules (vsstrace, the COM VSS coordinator, ole32) and for DLLs loaded
    from %TEMP%, AppData, ProgramData, or Public, or unsigned modules where signed ones are
    expected — either can indicate side-loading or an injected worker inside the process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the executable that loaded vssapi.dll, and is that parent chain expected?
  context: >-
    The parent process shows how the loader was launched. Backup software is normally started by
    services.exe or a scheduled-task host; a shadow-copy-interacting process spawned by a script
    host (wscript.exe, mshta.exe), an Office application, or an interactive cmd.exe/powershell.exe
    session is a stronger indicator of hands-on-keyboard or scripted recovery inhibition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has vssapi.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of the Volume Shadow Copy API by a given process is a stronger anomaly than
    a recurring one. If vssapi.dll has historically been loaded only by backup or installer
    binaries and this load comes from a different process, the current event is anomalous; if the
    same process loads it routinely, it is more likely benign.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the executable that loaded vssapi.dll?
  context: >-
    A loader binary that has never been seen on the host is more suspicious than one that runs
    regularly. Zero or very low historical counts indicate first-time or rare execution — common
    for a purpose-built shadow-copy-deletion tool dropped onto the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is vssapi.dll being loaded by unexpected processes on other hosts in the environment?
  context: >-
    Cross-host correlation surfaces the scope. The same unfamiliar process loading the Volume
    Shadow Copy API across multiple hosts points to a coordinated recovery-inhibition step rather
    than a localized event. Note the variety of loading processes: a single expected backup binary
    is routine; the same unusual loader on several hosts suggests staged impact ahead of
    encryption.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were recovery-related registry keys modified on this host to disable System Restore or recovery features?
  context: >-
    Beyond deleting shadow copies, recovery inhibition is also carried out by writing registry
    values that turn off System Restore (DisableSR, DisableConfig under the SystemRestore key).
    Modifications to these keys around the time of the alert corroborate a deliberate effort to
    prevent rollback rather than an isolated VSS interaction.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did the loading process or its child processes write files that are still on disk for analysis?
  context: >-
    If the process that loaded vssapi.dll — or a child it spawned — dropped a tool, staged output,
    or wrote a ransom note, those files are the best artifacts for hashing, sandbox submission, or
    content review. Correlating file writes to the loader's process lineage preserves evidence
    before any cleanup step removes it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Recovery inhibition often chains multiple commands: deleting shadow copies (vssadmin, wmic),
    disabling boot recovery (bcdedit), deleting backups (wbadmin), and disabling the Windows
    Recovery Environment (reagentc). Destructive invocations vary in their flags (/all, /quiet,
    -delete); this query keys on the recovery-destruction verbs rather than any single flag. Verify
    whether each action succeeded by checking system state (vssadmin list shadows, bcdedit /enum,
    reagentc /info).
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Recovery inhibition typically chains multiple destructive actions: deleting shadow copies AND
    disabling recovery AND stopping security services AND clearing event logs. Finding the complete
    set of destructive commands reveals the operator's playbook and distinguishes automated
    ransomware activity from an isolated administrative action.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Is this same destructive activity occurring on other hosts in the environment?
  context: >-
    Recovery inhibition often executes the same sequence across many hosts simultaneously or in
    rapid succession. Finding this alert firing on multiple hosts indicates network-wide execution
    and determines the scope for containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    Recovery-inhibiting actions typically precede file encryption by minutes. Checking for
    processes running from temp or user-writable paths after the load, and for ransomware-associated
    patterns (mass file renames, ransom-note creation, unusual extensions), determines whether
    encryption has already started and how far it has progressed.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the load reveals what led to it,
    what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, defense tampering, or persistence in the surrounding window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the stages that preceded this load and help reconstruct the timeline. Defense
    tampering and credential access commonly precede impact.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Where has this user authenticated recently?
  context: >-
    Authentication events show which systems the account accessed before and after the detected
    activity. A user authenticating to many systems in a short period, especially alongside
    recovery-inhibition on multiple hosts, suggests lateral movement in progress. If the alert
    fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account (name ending in $),
    this query intentionally returns nothing — service-principal logons are background noise,
    not an actor trail. For a human account, zero results can also mean the Security channel is
    not ingested for the relevant hosts; confirm 4624 visibility before reading zero as "no
    authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
