name: Potentially Suspicious Electron Application CommandLine
id: 3a655b6f-ec44-4a10-9b57-c13cc1b973fe
description: |
  Detects a signed Electron or Chromium-based application (chrome.exe, msedge.exe, msedgewebview2.exe, msteams.exe, slack.exe, discord.exe, code.exe, and similar) running with a Chromium subprocess-launcher switch — --browser-subprocess-path, --gpu-launcher, --renderer-cmd-prefix, or --utility-cmd-prefix. The rule fires only when both conditions match: the process image (or OriginalFileName) is one of the known Electron binaries AND the command line contains one of those launcher switches. These switches let the trusted parent spawn an arbitrary user-supplied path or command as a child process, which is the proxy-execution abuse pattern; they otherwise appear in rare debugging scenarios. Investigation should decode the launcher argument to recover the spawned command, confirm what child process resulted, and determine whether the user, host, and parent chain are consistent with developer or IT debugging activity rather than operator abuse of a signed binary.
type: detection
detection_id: 378a05d8-963c-46c9-bcce-13c7657eac99
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process a known Electron binary running with a Chromium subprocess-launcher switch?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both criteria hold — the image or OriginalFileName is one of the known Electron binaries AND the command line contains one of --browser-subprocess-path, --gpu-launcher, --renderer-cmd-prefix, or --utility-cmd-prefix. Read the full command line and the OriginalFileName from the triggering event and confirm both halves match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run an Electron application with subprocess-launcher switches?
  context: These switches almost always appear only when a developer or IT staff member is debugging an Electron or Chromium build. Knowing whether the user role and host function are consistent with that activity — a developer workstation, a build agent, a packaging machine — is often the fastest path to separating a true positive from routine debugging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command or path is embedded in the subprocess-launcher switch, and what does it spawn?
  context: The launcher switch carries the payload — --gpu-launcher and --renderer-cmd-prefix prepend a command to a child process, --browser-subprocess-path replaces the subprocess executable, and --utility-cmd-prefix prefixes the utility process. Decode the quoted value after the switch to recover the exact path or shell command, and note any paired sandbox-disable flag (--disable-gpu-sandbox, --no-sandbox) that the switch requires to take effect. Scoping to all executions of this binary on the host within the window captures sequential invocations that together form one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this Electron application, and is that parent chain expected?
  context: The parent process reveals how the application was launched. Interactive user launches typically descend from explorer.exe or a shell; a launch from a URI handler, a scripting host (wscript.exe, mshta.exe), or an Office application may indicate the switch was injected through argument injection rather than typed by a developer. Walk up to the parent's own parent if the immediate parent looks unremarkable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this Electron application spawn afterward?
  context: The whole point of these switches is to spawn a child process under a trusted signed binary. Legitimate debugging usually spawns the application's own helpers; abuse spawns command interpreters (cmd.exe, powershell.exe) or download and discovery tools. The children spawned reveal the actual impact of the launcher argument.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this Electron binary at all?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Several of the covered binaries (msedge.exe, msedgewebview2.exe) are near-ubiquitous, while others (keybase.exe, discord.exe) may be unexpected on a managed endpoint. Zero or very low historical counts indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine debugging can fire this rule. The query mirrors the rule's selection structure scoped to this host — the resulting parent and user distribution reflects how the rule's specific firing pattern (not generic Electron usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \chrome.exe
        - \code.exe
        - \discord.exe
        - \GitHubDesktop.exe
        - \keybase.exe
        - \msedge_proxy.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \msteams.exe
        - \slack.exe
        - \Teams.exe
      - OriginalFileName:
        - chrome.exe
        - code.exe
        - discord.exe
        - GitHubDesktop.exe
        - keybase.exe
        - msedge_proxy.exe
        - msedge.exe
        - msedgewebview2.exe
        - msteams.exe
        - slack.exe
        - Teams.exe
      selection_cli:
        CommandLine|contains:
        - --browser-subprocess-path
        - --gpu-launcher
        - --renderer-cmd-prefix
        - --utility-cmd-prefix
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \chrome.exe
        - \code.exe
        - \discord.exe
        - \GitHubDesktop.exe
        - \keybase.exe
        - \msedge_proxy.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \msteams.exe
        - \slack.exe
        - \Teams.exe
      - OriginalFileName:
        - chrome.exe
        - code.exe
        - discord.exe
        - GitHubDesktop.exe
        - keybase.exe
        - msedge_proxy.exe
        - msedge.exe
        - msedgewebview2.exe
        - msteams.exe
        - slack.exe
        - Teams.exe
      selection_cli:
        CommandLine|contains:
        - --browser-subprocess-path
        - --gpu-launcher
        - --renderer-cmd-prefix
        - --utility-cmd-prefix
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \chrome.exe
        - \code.exe
        - \discord.exe
        - \GitHubDesktop.exe
        - \keybase.exe
        - \msedge_proxy.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \msteams.exe
        - \slack.exe
        - \Teams.exe
      - OriginalFileName:
        - chrome.exe
        - code.exe
        - discord.exe
        - GitHubDesktop.exe
        - keybase.exe
        - msedge_proxy.exe
        - msedge.exe
        - msedgewebview2.exe
        - msteams.exe
        - slack.exe
        - Teams.exe
      selection_cli:
        CommandLine|contains:
        - --browser-subprocess-path
        - --gpu-launcher
        - --renderer-cmd-prefix
        - --utility-cmd-prefix
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Proxy execution through a signed binary is rarely the whole operation. Activity surrounding the detected process may reveal reconnaissance, privilege escalation, persistence installation, or data staging that provides broader context. Aggregating by image collapses repetitive agent noise so novel binaries stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \chrome.exe
        - \code.exe
        - \discord.exe
        - \GitHubDesktop.exe
        - \keybase.exe
        - \msedge_proxy.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \msteams.exe
        - \slack.exe
        - \Teams.exe
      - OriginalFileName:
        - chrome.exe
        - code.exe
        - discord.exe
        - GitHubDesktop.exe
        - keybase.exe
        - msedge_proxy.exe
        - msedge.exe
        - msedgewebview2.exe
        - msteams.exe
        - slack.exe
        - Teams.exe
      selection_cli:
        CommandLine|contains:
        - --browser-subprocess-path
        - --gpu-launcher
        - --renderer-cmd-prefix
        - --utility-cmd-prefix
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Aggregating by image and parent image collapses repetitive noise while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern, not generic usage of these binaries. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \chrome.exe
        - \code.exe
        - \discord.exe
        - \GitHubDesktop.exe
        - \keybase.exe
        - \msedge_proxy.exe
        - \msedge.exe
        - \msedgewebview2.exe
        - \msteams.exe
        - \slack.exe
        - \Teams.exe
      - OriginalFileName:
        - chrome.exe
        - code.exe
        - discord.exe
        - GitHubDesktop.exe
        - keybase.exe
        - msedge_proxy.exe
        - msedge.exe
        - msedgewebview2.exe
        - msteams.exe
        - slack.exe
        - Teams.exe
      selection_cli:
        CommandLine|contains:
        - --browser-subprocess-path
        - --gpu-launcher
        - --renderer-cmd-prefix
        - --utility-cmd-prefix
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
