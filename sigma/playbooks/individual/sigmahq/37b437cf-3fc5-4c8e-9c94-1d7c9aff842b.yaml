name: Allow RDP Remote Assistance Feature
id: fd5ff482-d886-45dd-97f3-842ecd9450e1
description: |
  Detects a write of the value 1 (DWORD 0x00000001) to the fAllowToGetHelp value under
  HKLM\System\CurrentControlSet\Control\Terminal Server, which enables inbound Remote Assistance
  on the host. Administrators enable this to permit remote support sessions, but the same change
  gives an attacker a durable remote-access and lateral-movement channel and can serve as a
  defense-evasion foothold. Investigation should establish which process and account made the
  change, whether it was authorized, whether a Remote Assistance or remote session was subsequently
  used, and what other configuration changes landed alongside it.
type: detection
detection_id: 37b437cf-3fc5-4c8e-9c94-1d7c9aff842b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact registry path (the fAllowToGetHelp value under the Terminal Server key), the value
    data (a DWORD of 1 that turns Remote Assistance on), and the writing process against the rule's
    detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to enable Remote Assistance?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the
    account and host function are consistent with enabling inbound Remote Assistance is often the
    fastest path to distinguishing an authorized support-tooling change from an attacker opening a
    remote-access channel. User attribution is present on most endpoint registry events; when it is
    a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the Terminal Server key, and is enabling Remote Assistance meaningful on this host?
  context: The fAllowToGetHelp value governs whether inbound Remote Assistance is permitted. A DWORD
    of 1 enables it; a workstation or server that has no support workflow requiring Remote Assistance
    should not normally have this toggled on. Confirm the exact value data and the writing process to
    judge whether the change reflects sanctioned remote-support configuration or a foothold being
    opened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the Remote Assistance setting stay enabled, or was it changed again afterward?
  context: A durable remote-access change is more concerning when it persists. Endpoint telemetry
    does not emit registry key or value deletion events, so attacker cleanup of the value cannot be
    observed directly; judge persistence from the value's re-modification history over a longer
    window and from whether the feature was subsequently exercised. Repeated flips of the same value
    can indicate scripted configuration or an operator toggling the setting around a session.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same session?
  context: Attackers who enable one remote-access path often make several changes together -- for
    example, also disabling firewall rules, relaxing security policy keys, or adding a Run key for
    persistence. Registry changes from the same writing process within a short window reveal the full
    scope of the configuration changes and whether multiple objectives were pursued alongside the
    Remote Assistance toggle.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process wrote this registry value, and what started that process?
  context: The writing process and its origin reveal how the change was made. Configuration pushed
    through management tooling (a policy engine, an installer such as msiexec.exe, or the registry
    editor invoked interactively by an admin) looks different from a value set by a script host,
    a shell spawned from a document, or an unsigned binary with abnormal lineage. Tracing the
    parent's own origin distinguishes a sanctioned change from a hands-on-keyboard modification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After Remote Assistance was enabled, did a Remote Assistance session actually run on this host?
  context: Enabling the feature only matters if it is used. The Remote Assistance host and client
    processes (msra.exe, raserver.exe) and the modern remote-support helper (quickassist.exe)
    indicate an actual session following the enablement. If any appear shortly after the registry
    change, pivot to network connections on the host to confirm whether an inbound remote session
    was established and from where.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ra:
        Image|endswith:
          - '\msra.exe'
          - '\raserver.exe'
          - '\quickassist.exe'
      condition: selection and selection_ra
    fields:
      - Image
      - CommandLine
      - User
- question: Has the fAllowToGetHelp value been modified before on this host?
  context: This value governs a durable feature toggle and should rarely change on a given host.
    A first-time or very rare modification is more suspicious than a key that flips regularly as part
    of a known support workflow. Compare the historical value data to see whether the same setting
    is routinely applied or whether this enablement is new to the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Remote Assistance value enabled on other hosts in the environment?
  context: The same modification across multiple hosts may reflect a policy or deployment change,
    while enablement isolated to one host may be targeted. A cluster of hosts receiving this change
    in a short window can also indicate remote-access being opened for lateral movement. Compare the
    value data and writing process across hosts to tell a fleet-wide policy from selective targeting.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process activity occurred on this host around the time of the change?
  context: Configuration changes rarely happen in isolation. Aggregating process executions around
    the registry write surfaces what led to the change and what followed -- reconnaissance, remote-access
    tooling, credential access, or other persistence steps. Novel parent-child pairs stand out at low
    counts against routine agent and system telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this change?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential
    access -- may reveal the stages that preceded the Remote Assistance enablement and help
    reconstruct the timeline. Enabling a remote-access channel late in an intrusion is a different
    story from a lone configuration change with no surrounding activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for enabling Remote Assistance?
  context: Many organizations require change tickets for configuration modifications that expand
    remote access. A corresponding ticket suggests authorized activity; absence of one when policy
    requires it suggests the change was unauthorized. This check can quickly close false positives or
    escalate true positives. The redisplayed alert event can be ignored while answering from the
    change-management record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall enabling Remote Assistance on this host?
  context: Direct confirmation from the person behind the account is often the fastest path to
    determining legitimacy. If no one recalls making the change, the account may be compromised or
    the activity may be automated. If someone does recall it, capture why Remote Assistance was
    needed and whether the enablement was expected to be temporary. The redisplayed alert event can
    be ignored while answering from human recall.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run the process that made this change?
  context: A writing process that has never been seen on the host is more suspicious than one that
    runs routinely as part of management or support tooling. Zero or very low historical counts point
    to first-time or rare execution of whatever tool set this value, which raises the weight of the
    change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were other persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single foothold. After opening one remote-access path, they
    commonly add backup persistence using different techniques -- scheduled tasks, services, or
    registry Run keys. Persistence tool executions clustered in the same timeframe indicate
    intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
