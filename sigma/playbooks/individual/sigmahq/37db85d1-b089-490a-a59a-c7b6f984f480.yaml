name: Sysmon Discovery Via Default Driver Altitude Using Findstr.EXE
id: eda4fe95-5bb4-4b21-802f-e96a758989c5
description: |
  Detects findstr.exe (or find.exe) invoked with the argument 385201, the
  default driver altitude assigned to the Sysmon monitoring driver. Searching
  driver listings for this altitude value identifies an installed Sysmon
  service even when its service and driver names have been renamed, so the
  pattern is a security-software discovery step that commonly precedes defense
  evasion. Legitimate use is rare; confirm the command line, establish whether
  the user and host routinely perform this kind of enumeration, and determine
  what process drove the search and what ran around it.
type: detection
detection_id: 37db85d1-b089-490a-a59a-c7b6f984f480
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with find/findstr searching for the altitude value 385201?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when find.exe or findstr.exe (by Image or OriginalFileName) runs with 385201 in its arguments, so verify that string is present and that the match is not an incidental substring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate installed security tooling from the command line?
  context: Legitimate administrative activity can trigger this detection, but searching driver altitudes for the Sysmon value is not routine troubleshooting. Knowing whether the user role and host function include security tooling inventory or detection-engineering work is often the fastest path to distinguishing a true positive from sanctioned activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the full find/findstr command search for beyond the 385201 altitude, and what input was it reading?
  context: The full command line reveals the specific search target. Determine what file, pipe, or piped command output the search was reading and whether other altitude values or driver names were also queried, which indicates broader enumeration of monitoring drivers rather than a single check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' 385201'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this find/findstr command and is that parent chain expected?
  context: The parent process reveals how the search was invoked. Discovery commands run interactively typically descend from explorer.exe via cmd.exe, while parents such as script interpreters, Office applications, or remote-execution hosts point to automated post-compromise enumeration. The immediate parent is in the alert; trace what spawned it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What process spawned the discovery command, and is this a normal pattern?
  context: Legitimate discovery commands are typically run from cmd.exe spawned by explorer.exe or from automation scripts. Discovery commands spawned by unusual parents such as Word macros, script interpreters, or WMI and WinRM provider hosts indicate automated post-exploitation enumeration rather than an operator at a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative discovery commands?
  context: Detection engineers, administrators, and IT staff occasionally inventory installed monitoring tooling, but standard users rarely search driver altitudes. The user's role and behavior baseline determine whether searching for the Sysmon altitude is routine work or anomalous enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did the Sysmon driver load on this host, and was its altitude or driver name altered from the defaults?
  context: The 385201 search assumes Sysmon is present under the default driver altitude even if the service and driver were renamed. Driver-load events show whether the monitoring driver is actually loaded, under what image name, and whether it sits at the default altitude. A renamed driver still loading at altitude 385201 is exactly what this search is built to find. If driver-load events are not collected in this environment, treat zero results as a visibility gap rather than evidence the driver is absent.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\SysmonDrv.sys'
          - '.sys'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signature
- question: What child processes did this command spawn afterward?
  context: A discovery step that resolves the Sysmon altitude often precedes an attempt to tamper with or unload the monitoring driver. Processes launched after the search reveal whether the operator moved on to service control, driver unloading, or other defense-evasion actions.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession is a signature pattern of post-compromise enumeration. Three or more distinct discovery binaries within the window alongside the altitude search points to automated host enumeration before the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: When this host has previously fired the altitude-search pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a benign-looking utility can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected user account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains: ' 385201'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains: ' 385201'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains: ' 385201'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar enumeration on other hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|contains: ' 385201'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or defense tampering.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack stages that preceded this enumeration and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
