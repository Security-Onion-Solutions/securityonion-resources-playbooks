name: Remote Access Tool - NetSupport Execution From Unusual Location
id: 7b1c4a53-934f-4a45-a75a-8e39fab5fe07
description: |
  Detects execution of the NetSupport remote control client (client32.exe) from a
  directory outside C:\Program Files or C:\Program Files (x86). The rule fires when a
  process matches the NetSupport client by filename, product metadata, original
  filename, or import hash AND the image path is not under a standard Program Files
  location. Legitimately installed remote management software runs from its vendor
  install directory; execution from a user-writable or temporary path is consistent
  with an operator dropping the tool for unsanctioned remote access or persistence,
  including renaming the binary to blend in. Investigation should confirm the true
  identity of the binary, determine how it arrived on the host, establish whether the
  remote access is authorized, and identify the external endpoint it contacts.
type: detection
detection_id: 37e8d358-6408-4853-82f4-98333fca7014
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match the NetSupport client running from outside Program Files?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule matches when the binary is identified as the NetSupport client by filename
    (client32.exe), product metadata (NetSupport Remote Control), original filename, or
    import hash, AND the image path is not under C:\Program Files or C:\Program Files
    (x86). Review the Image path, OriginalFileName, Product, and Hashes on the triggering
    event to confirm both the identity match and the out-of-Program-Files location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
      - Product
- question: Is this user and host expected to run remote access management software?
  context: Legitimate remote support activity is usually confined to specific support
    staff and managed endpoints. Knowing whether this user role and host function are
    consistent with running a remote control client is often the fastest path to
    separating sanctioned IT support from unauthorized or operator-deployed remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: A remote access client can be renamed to blend in while its embedded metadata
    still reflects the original tool. Compare the Image path (the name on disk) against
    OriginalFileName and Product to see whether the file on disk is presenting itself as
    something other than the NetSupport client. The signing details indicate whether the
    binary is signed by the expected vendor or is unsigned or tampered. The file hash
    enables a reputation lookup to determine whether this is a known-good build, a known
    malicious sample, or a novel binary; a renamed binary still loads its canonical
    dependency libraries, which is an additional anchor when the filename has been changed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly did this NetSupport client do? Decode its full command line and working directory.
  context: The full command line and working directory reveal how the client was
    launched and what it was configured to do. Decode any configuration flags, gateway
    or relay parameters, session passwords, or referenced config files. This query scopes
    to all executions of this binary on this host within a few minutes of the alert, so a
    multi-step launch sequence (installer, then client, then session setup) appears as the
    full operation rather than just the single triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is NetSupport on the organization's approved remote access software list?
  context: Organizations typically sanction a specific set of remote access tools for IT
    support. A remote control client that is not on the approved list, even well-known
    commercial software, may represent shadow IT or operator-deployed persistence.
    Unauthorized tools should be checked regardless of the tool's reputation, and an
    out-of-Program-Files install path makes an unmanaged deployment more likely.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: Legitimate remote access typically correlates with an active support ticket, a
    scheduled maintenance window, or a user request. If no support context exists for this
    session, the client may have been installed by an operator for persistent access or by
    a user circumventing controls. Match the user and host against support records for the
    time of the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint is this remote access client connecting to?
  context: Remote access clients establish outbound connections to relay or gateway
    servers. The destination reveals whether the client is contacting the vendor's
    expected infrastructure or a custom or attacker-controlled endpoint. A connection to
    an unfamiliar gateway, paired with an out-of-Program-Files install, points away from a
    managed deployment. If network telemetry is not available for this host, fall back to
    analyzing gateway and connection parameters in the client command line and configuration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: How did this NetSupport client arrive on the host?
  context: A relocated or renamed remote access client does not appear spontaneously; it
    was copied, downloaded, or dropped by a parent process. Tracing the file creation event
    for the binary by basename over a long window reveals the delivery mechanism — a
    download tool, an installer, a manual copy via remote access, or lateral movement from
    another host. The Image field on the file creation event identifies the process that
    wrote the binary. A user-writable or temporary drop location is consistent with
    download or extraction rather than a managed install.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this client spawn after execution, and does the same binary appear on other hosts?
  context: Examining the child processes, file operations, and follow-on activity launched
    by this binary reveals its actual objective beyond establishing a remote session;
    unexpected children such as command shells, script hosts, or reconnaissance utilities
    indicate hands-on-keyboard activity rather than passive remote support. The same binary
    appearing on multiple hosts suggests deliberate distribution rather than an isolated
    install. Pivot on OriginalFileName or Hashes to find the same binary fleet-wide when
    the on-disk name has been changed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this client and is that parent chain expected?
  context: The parent process reveals how the client was invoked. A managed deployment is
    usually launched by an installer, a management agent, or an interactive session via
    explorer.exe. Unusual parents such as script hosts, office applications, archive
    utilities, or another remote access tool point to an operator-driven drop. For deeper
    context, walk up the tree to see what spawned the parent and what else that parent
    launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run the NetSupport client?
  context: A remote access client that has never been seen on a host is more notable than
    one that runs regularly. Zero or very low historical counts over the baseline window
    indicate first-time or rare execution, which weighs toward an unmanaged or
    operator-deployed install rather than a sanctioned tool the host routinely uses.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired this rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even an approved tool can be abused. This query mirrors the rule's selection and
    filter structure scoped to this host, so the resulting parent and user distribution
    reflects how the rule's specific firing pattern (the NetSupport client outside Program
    Files), not generic binary usage, has historically run here. A new parent process, an
    unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \client32.exe
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
      filter:
        Image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection and filter structure with no host scope,
    so the result is a fleet-wide count of the rule's firing pattern rather than generic
    usage of the binary. Many hosts firing the same pattern points to a scripted or pushed
    deployment, possibly a sanctioned but mis-located rollout; one host or a small unrelated
    set points to manual operator activity. Use the host distribution and parent consistency
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \client32.exe
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
      filter:
        Image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
      condition: selection and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \client32.exe
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
      filter:
        Image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \client32.exe
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
      filter:
        Image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity on
    several hosts in the same window, the scope of the unauthorized access may be larger
    than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \client32.exe
      - Product|contains: NetSupport Remote Control
      - OriginalFileName|contains: client32.exe
      - Hashes|contains: IMPHASH=a9d50692e95b79723f3e76fcf70d023e
      filter:
        Image|startswith:
        - C:\Program Files\
        - C:\Program Files (x86)\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as
    defense tampering, reconnaissance, or credential access, may reveal the stages that
    preceded the remote access tool's appearance and help reconstruct the timeline. The
    sequence of prior alerts often tells the operational story leading up to this event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
