name: Potential Persistence Attempt Via Existing Service Tampering
id: e497c64d-d3a7-4390-9bd4-47f79a068871
description: |
  Detects modification of an existing Windows service so it executes an attacker-chosen
  payload when the service starts or fails, a persistence and privilege-escalation method
  that hijacks a service already present rather than installing a new one. The rule fires
  when a command line matches EITHER an sc.exe service reconfiguration (config with binpath=,
  or failure with command=) OR a reg.exe modification of a service registry value
  (FailureCommand or ImagePath) carrying an executable extension. Legitimate administrators
  and deployment tooling do reconfigure services, so the investigation should determine which
  branch fired, what service and binary path were involved, whether the payload path is a
  standard service-binary location or a user-writable directory, and whether the change was
  authorized.
type: detection
detection_id: 38879043-7e1e-47a9-8d46-6bec88e201df
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — an sc.exe service reconfiguration
    or a reg.exe modification of a service registry value?
  context: Confirm the alert is a true positive before investing time. The rule fires when the
    command line matches EITHER an sc.exe selection (sc config with binpath=, or sc failure with
    command=) OR a reg add against a service registry value (FailureCommand or ImagePath) that
    carries an executable extension. Read the exact command line and note which branch fired —
    an sc.exe reconfiguration and a reg.exe registry edit reach the same persistence outcome
    through different surfaces, and the branch determines whether downstream service-event or
    registry questions carry the evidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to reconfigure existing Windows services or edit
    service registry values?
  context: Reconfiguring a service binary path or failure command, or editing a service's
    ImagePath/FailureCommand registry value, requires Administrator or SYSTEM privileges and is
    normally done by a small set of administrators or by deployment tooling. Knowing whether this
    account and host routinely manage services is often the fastest way to separate routine
    maintenance from operator-driven persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this
    service reconfiguration?
  context: Many organizations require change records for service modifications. A corresponding
    ticket or maintenance window suggests authorized administrative work; absence of one when
    policy requires it shifts the disposition toward unauthorized persistence. This check can
    quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What service was created or modified, and what binary path does it now execute?
  context: System service-control events provide structured service fields instead of parsed
    command-line arguments. The image path is the persistence payload — attackers point a service
    at a binary in a user-writable directory such as C:\Users\Public or C:\Windows\Temp, or
    masquerade the path as a legitimate service binary. Low-use services such as Fax, W32Time,
    AppMgmt, and RemoteRegistry are common hijack targets because reconfiguring them rarely
    disrupts operations. Check the image path, start type, and the account the service runs under;
    LocalSystem grants full privileges and auto-start persists across reboots.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Were service registry values under HKLM\System\CurrentControlSet\Services modified
    on this host around the alert?
  context: When the reg.exe branch fires, the persistence is written directly to a service's
    registry value rather than through the service-control manager. Modifications to ImagePath,
    FailureCommand, ServiceDll, or FailureActions under
    HKLM\System\CurrentControlSet\Services redirect what the service executes. Registry-set
    evidence captures these edits even when the value is changed by tooling other than reg.exe,
    and reveals the new value pointing at the payload path. Watch for image paths in uncommon
    directories such as C:\Users or C:\Temp, and for .sys driver paths, which indicate
    driver-based execution rather than a normal service binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      selection_values:
        TargetObject|endswith:
          - '\ImagePath'
          - '\FailureCommand'
          - '\ServiceDll'
          - '\FailureActions'
      condition: selection and selection_values
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the modified service currently running, and what account is it using?
  context: A reconfigured service may not have started yet (demand start) or may have been
    stopped after the change. Checking the current status reveals whether the persistence is
    active right now. A service running as LocalSystem has full system privileges; a service
    running under a specific account indicates the access level the change runs with. The
    analyst should run sc query and sc qc against the affected service name from the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this command, and is that parent chain expected for service
    management?
  context: The parent process reveals how the service-tampering command was invoked. Service
    reconfiguration driven by deployment tooling or an interactive administrator session has
    predictable parents; a command interpreter spawned by a scripting host, an Office
    application, or a freshly written binary points toward a non-administrative origin. Walk up
    the tree to see what spawned the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users
    normally drive that activity, and does the current alert fit?
  context: Even routine service maintenance can resemble tampering. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here — not
    generic command usage. A new parent process, an unexpected account, or an unusual
    command-line structure against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - CommandLine|contains|all:
        - 'sc '
        - 'config '
        - binpath=
      - CommandLine|contains|all:
        - 'sc '
        - failure
        - command=
      selection_reg_img:
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - FailureCommand
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - ImagePath
      selection_reg_ext:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin$
        - .bat
        - .cmd
        - .js
        - .msh$
        - .reg$
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_sc or all of selection_reg_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result
    is a fleet-wide count of the tampering pattern rather than generic command usage. Many hosts
    firing the same pattern points to scripted deployment or vendor automation reconfiguring
    services at scale; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - CommandLine|contains|all:
        - 'sc '
        - 'config '
        - binpath=
      - CommandLine|contains|all:
        - 'sc '
        - failure
        - command=
      selection_reg_img:
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - FailureCommand
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - ImagePath
      selection_reg_ext:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin$
        - .bat
        - .cmd
        - .js
        - .msh$
        - .reg$
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
      condition: selection_sc or all of selection_reg_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - CommandLine|contains|all:
        - 'sc '
        - 'config '
        - binpath=
      - CommandLine|contains|all:
        - 'sc '
        - failure
        - command=
      selection_reg_img:
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - FailureCommand
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - ImagePath
      selection_reg_ext:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin$
        - .bat
        - .cmd
        - .js
        - .msh$
        - .reg$
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_sc or all of selection_reg_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - CommandLine|contains|all:
        - 'sc '
        - 'config '
        - binpath=
      - CommandLine|contains|all:
        - 'sc '
        - failure
        - command=
      selection_reg_img:
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - FailureCommand
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - ImagePath
      selection_reg_ext:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin$
        - .bat
        - .cmd
        - .js
        - .msh$
        - .reg$
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_sc or all of selection_reg_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or parallel
    activity on multiple endpoints. If the same user triggered service changes or other
    hands-on activity on several hosts in the window, the scope is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_sc:
      - CommandLine|contains|all:
        - 'sc '
        - 'config '
        - binpath=
      - CommandLine|contains|all:
        - 'sc '
        - failure
        - command=
      selection_reg_img:
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - FailureCommand
      - CommandLine|contains|all:
        - 'reg '
        - 'add '
        - ImagePath
      selection_reg_ext:
        CommandLine|contains:
        - .sh
        - .exe
        - .dll
        - .bin$
        - .bat
        - .cmd
        - .js
        - .msh$
        - .reg$
        - .scr
        - .ps
        - .vb
        - .jar
        - .pl
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_sc or all of selection_reg_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what
    led to the service change and what followed — reconnaissance, privilege escalation, payload
    drops, or additional persistence. Novel parent-child pairs stand out against the repetitive
    agent telemetry that dominates a busy host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the stages that preceded the service change. Service
    tampering for persistence typically follows initial access and privilege escalation, so a
    preceding alert timeline often reconstructs how the operator reached the point of modifying a
    service.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After hijacking a service,
    they commonly install backup footholds using different techniques — scheduled tasks, other
    service changes, registry Run keys, BITS jobs, or WMI subscriptions. Several persistence
    installations within the same window indicate intentional stacking rather than an isolated
    administrative action, and the correlated timing distinguishes a campaign from routine work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or Run key
    paths on this host?
  context: The persistence payload binary must be written to disk before the service is pointed
    at it, and operators often establish parallel file-based persistence that bypasses
    command-line detection entirely. Dropping an executable into a Startup folder or a path
    referenced by a registry Run key achieves persistence without running sc or reg. File event
    monitoring captures these drops even when standard persistence tools are avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
