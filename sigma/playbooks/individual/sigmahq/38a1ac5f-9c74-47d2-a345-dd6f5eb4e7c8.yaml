name: HKTL - SharpSuccessor Privilege Escalation Tool Execution
id: be560d1a-0ed3-4dd4-91f7-3d824ac55349
description: |
  Detects execution of SharpSuccessor, a proof-of-concept tool that automates the dMSA
  (Delegated Managed Service Account) abuse primitive for domain privilege escalation in modern
  Active Directory. The rule fires on the tool's binary name, OriginalFileName, the literal
  SharpSuccessor token, or the full add /impersonate /path /account /name command-flag set.
  Legitimate appearances are limited to authorized penetration tests or red team engagements;
  outside an engagement, the execution stages the creation of a malicious dMSA that the directory
  treats as the successor to a privileged account, so the investigation should determine whether
  a dMSA object was created and whether Kerberos ticket requests followed that would let an
  operator inherit Administrator-level rights.
type: detection
detection_id: 38a1ac5f-9c74-47d2-a345-dd6f5eb4e7c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alerting process match SharpSuccessor by binary name, OriginalFileName, or the add/impersonate command-flag set?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact Image, OriginalFileName, and CommandLine against the rule's criteria. The rule
    matches on any one of several signals — the binary ending in SharpSuccessor.exe, an
    OriginalFileName of SharpSuccessor.exe, the literal SharpSuccessor token in the command line,
    or the full add /impersonate /path /account /name flag combination. Note which signal matched,
    because a full flag-set match indicates the dMSA-creation operation actually ran with operator
    parameters, whereas a bare binary-name match could be a renamed or staged copy that was not
    yet invoked with the takeover arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run Active Directory privilege-escalation tooling?
  context: Legitimate appearances of this tool are confined to authorized security testing. Knowing
    whether the user role and host function are consistent with running dMSA-manipulation tooling
    is often the fastest path to distinguishing an authorized test from operator activity. A
    standard workstation or a non-tier-0 account running this tool is harder to explain than a
    dedicated assessment host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SharpSuccessor execution part of an authorized penetration test or red team engagement?
  context: Offensive tools that abuse dMSA and Kerberos primitives are used in authorized security
    assessments. Before investing investigation time, check whether a penetration test or red team
    exercise is currently active on this host or network segment. An authorized engagement with
    matching tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What dMSA-creation parameters were passed — which target account, OU path, and successor name?
  context: This tool takes the dMSA takeover parameters on the command line. Decode the add
    arguments to identify the impersonation target (the privileged account whose rights the new
    dMSA will inherit), the OU path where the dMSA is created (/path), the operator-controlled
    account with write rights on the target (/account), and the dMSA name (/name). These values
    name the exact AD objects to inspect for cleanup and reveal which account the operator was
    attempting to escalate to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned SharpSuccessor and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. An interactive shell, a remote
    execution service, or a script host as parent points to hands-on operator activity, while an
    expected assessment-harness parent supports an authorized-test reading. Walk up the chain to
    see what launched the parent and whether anything else was spawned alongside it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this process write any files on the host that would corroborate the dMSA-creation operation?
  context: Even when the original process has exited, files written by the tool's process can
    corroborate what ran — output, ticket material, or configuration artifacts staged for the
    companion Kerberos chain. Checking for file creations from this process confirms execution and
    reveals the scope of activity beyond the single command line.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did SharpSuccessor spawn afterward, and did Kerberos ticket tooling follow on this host?
  context: The processes spawned by or following the tool reveal its actual impact. The dMSA
    primitive is only the first stage; the takeover completes when an operator requests Kerberos
    tickets for the new dMSA. Child processes such as ticket-request utilities, command shells, or
    credential tooling spawned by this process indicate the operation progressed past dMSA creation
    toward privilege use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did Security-log Kerberos ticket requests or special-privilege assignments follow this execution on the domain controllers?
  context: The dMSA primitive resolves into unusual token behavior — a newly created dMSA account
    requesting Kerberos service tickets, and that ticket carrying a privileged account's effective
    rights. Security-channel ticket-request events (4769) where the requesting account is a
    just-created service account, and special-privileges-assigned events (4672) for that account,
    record the privilege-use stage that process-creation telemetry on the source host does not
    show. Correlating these in the window after the tool ran helps establish whether the escalation
    actually completed. If directory-service and Kerberos auditing are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4769
          - 4672
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
      - ServiceName
      - IpAddress
- question: Does this host normally run SharpSuccessor?
  context: A binary that has never been seen on a host is more notable than one that runs
    regularly. Zero or very low historical counts over the trailing window indicate first-time or
    rare execution, which for a dMSA-abuse tool weighs against a routine-operations explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has historically run
    here — not generic binary usage. A new parent process, an unexpected user account, or an
    unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpSuccessor.exe
      - OriginalFileName: SharpSuccessor.exe
      - CommandLine|contains: SharpSuccessor
      - CommandLine|contains|all:
        - ' add '
        - ' /impersonate'
        - ' /path'
        - ' /account'
        - ' /name'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time?
  context: AD takeover chains involve multiple tools in sequence — the dMSA-creation step is
    typically followed by Kerberos ticket requests and access verification against the domain
    controller. Activity surrounding the detected tool may reveal reconnaissance, the companion
    ticket-request tooling, or access attempts that provide broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpSuccessor.exe
      - OriginalFileName: SharpSuccessor.exe
      - CommandLine|contains: SharpSuccessor
      - CommandLine|contains|all:
        - ' add '
        - ' /impersonate'
        - ' /path'
        - ' /account'
        - ' /name'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpSuccessor.exe
      - OriginalFileName: SharpSuccessor.exe
      - CommandLine|contains: SharpSuccessor
      - CommandLine|contains|all:
        - ' add '
        - ' /impersonate'
        - ' /path'
        - ' /account'
        - ' /name'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity across endpoints. If the same user drove similar AD tooling or domain-controller
    access on multiple hosts, the scope of the privilege-escalation attempt may be larger than the
    single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpSuccessor.exe
      - OriginalFileName: SharpSuccessor.exe
      - CommandLine|contains: SharpSuccessor
      - CommandLine|contains|all:
        - ' add '
        - ' /impersonate'
        - ' /path'
        - ' /account'
        - ' /name'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context: what led to this execution, what happened after, and whether it is part of
    a larger sequence. Look for reconnaissance, additional credential or directory tooling, or
    persistence mechanisms near the alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance,
    credential access, or directory enumeration — may reveal the stages that preceded this
    execution and help reconstruct the timeline that led to a domain-privilege-escalation attempt.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the rule's firing pattern, not generic usage of the binary. Many hosts
    firing the same pattern points to a scripted assessment deployment; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent/binary
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SharpSuccessor.exe
      - OriginalFileName: SharpSuccessor.exe
      - CommandLine|contains: SharpSuccessor
      - CommandLine|contains|all:
        - ' add '
        - ' /impersonate'
        - ' /path'
        - ' /account'
        - ' /name'
      condition: selection
    fields:
    - host.name
