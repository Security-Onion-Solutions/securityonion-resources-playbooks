name: Small Sieve Malware File Indicator Creation
id: ca3e26b2-2cb5-424d-88f7-8d2000e0c195
description: |
  Detects file paths associated with the Small Sieve backdoor, a Python implant packaged
  as a standalone Windows executable that keeps its working files under the user profile
  and names them after Microsoft components. The rule fires when EITHER a file is written
  under a user's AppData Roaming or Local folder with the characteristic misspelling
  "Microsift" somewhere in its path (both the AppData location and the misspelling must
  match together), OR a file is written whose path ends with
  \AppData\Local\MicrosoftWindowsOutlookDataPlus.txt, a working-file name the implant
  uses. Legitimate software has no known reason to produce either pattern. The
  investigation should confirm which branch matched, identify the process that wrote the
  file and how that binary arrived, recover the file's content and hash, and determine
  whether the implant executed, persisted, or reached its command-and-control channel,
  and whether the same artifacts exist on other hosts.
type: detection
detection_id: 39466c42-c189-476a-989f-8cdb135c163a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerted file path match either the Microsift misspelling pattern or the known Small Sieve artifact path?
  context: |
    Before investing investigation time, confirm the alert is a true positive and note which
    branch fired. The misspelling branch requires the path to sit under a user profile's
    AppData Roaming or Local folder AND to contain the string "Microsift" — both together.
    The indicator branch requires the path to end with
    \AppData\Local\MicrosoftWindowsOutlookDataPlus.txt. The indicator branch is a specific
    known implant working file; the misspelling branch can also catch related artifacts such
    as the implant's executable or other files named with the same typo.
  range: +/-5m
  answer_sources:
  - alert
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is any legitimate application on this host known to write files with these names under AppData?
  context: |
    The rule's false-positive rate is rated unlikely — no mainstream software misspells
    Microsoft as "Microsift" or produces the MicrosoftWindowsOutlookDataPlus.txt name.
    Review the user, host role, and writing process shown here. When the user is SYSTEM or
    a machine account, the write is service-driven and the writing process (Image) is the
    better attribution pivot; an internally developed tool with a genuine typo is the only
    plausible benign explanation and can be confirmed with the software owner.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the content of the dropped file?
  context: |
    Retrieve the file from the endpoint and review its content — the query locates the
    creation event and the responsible process for retrieval. Text-named working files
    dropped by implants typically hold configuration, staging, or output data rather than
    user documents. Check for base64 or otherwise encoded strings, embedded URLs or API
    tokens, and captured command output; content that is clearly not user-created supports
    the implant reading, and recovered tokens or addresses feed the network-side checks.
  range: +/-5m
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has the dropped file executed, and if so what is its hash and reputation?
  context: |
    A file's hash is recorded when it runs, not when it is written — file-creation events
    carry no hash. This query looks for the artifact executing within four hours either
    side of the drop and reads its hash for threat-intelligence lookup. The
    MicrosoftWindowsOutlookDataPlus.txt working file is data and is not expected to run,
    but misspelling-branch matches can include the implant's executable itself. If the
    file is present but has not executed, retrieve it from its on-disk path and hash it
    manually.
  range: +/-4h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: |
    The file's post-alert lifecycle drives next steps. A working file still on disk can be
    retrieved, hashed, and analyzed; implants that stage command output in text files also
    rewrite and remove them, so a deletion shortly after creation is consistent with
    routine implant cleanup and shifts the investigation to the process that performed the
    delete and to what executed in between.
  range: +4h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the process that wrote this file what its name claims to be?
  context: |
    The alert carries the writing process's identifiers, and this retrieves its creation
    event. Compare the on-disk name (Image) against the PE metadata (OriginalFileName) —
    a mismatch means the writer itself is renamed. The signature status separates signed
    system or third-party binaries from unsigned droppers, and the hash enables a
    reputation lookup. This family has circulated as an installer named to resemble a
    messaging application, so a plausible-looking writer name still needs its metadata and
    hash checked.
  range: +/-30d
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did the process that wrote this file arrive on the host?
  context: |
    The writer did not appear spontaneously — it was downloaded, extracted from an
    archive, copied from another host, or dropped by another process. This query returns
    the 30-day creation history of the writer's own binary on this host; the Image field
    on those events identifies the delivery mechanism (browser, archive utility,
    installer, remote-admin copy, or another dropper). A writer that landed in Downloads,
    Temp, or AppData shortly before the alert points to fresh delivery rather than
    long-installed software.
  range: -30d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command launched the writing process, and what parent spawned it?
  context: |
    The writer's own creation event exposes its command line and parent chain. An
    explorer.exe parent suggests a user double-click; a logon-time chain launching the
    implant path is consistent with persistence already installed — this family registers
    a Run key whose value name carries the same Microsift misspelling, so a
    registry-driven launch at logon means persistence predates this alert. An unfamiliar
    parent such as a script host or Office application points instead at initial
    delivery in progress.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other files did the writing process create or delete around the alert?
  context: |
    A process that drops one implant artifact often drops several — an installer unpacking
    the implant executable, its working files, and persistence components in one burst.
    The correlation covers the writer and its direct children, since droppers frequently
    delegate. The breadth, paths, and extensions of this activity distinguish a single
    artifact from a staged install and enumerate every file that needs review or removal.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this user's AppData folders recently, and by which processes?
  context: |
    The query reuses the rule's own location anchors — user-profile AppData Roaming and
    Local paths — over the past week on this host, aggregated by path and writing process.
    AppData is high-volume, so the signal is not count but names and writers. Scan for
    other Microsoft-look-alike or misspelled file names and for unfamiliar writers placing
    executables or dot-named working files, which reveal additional implant components
    beyond the alerted path.
  range: -7d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|all:
        - ':\Users\'
        - '\AppData\'
        TargetFilename|contains:
        - '\Roaming\'
        - '\Local\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did this host look up the Telegram Bot API domain around the alert?
  context: |
    This family's command-and-control runs over the Telegram Bot API, reached via HTTPS to
    api.telegram.org, so the network side of an active implant appears as DNS lookups of
    telegram.org names. Review the process performing each lookup — the official desktop
    messenger resolving these domains is expected on hosts where it is installed, while a
    lookup from an unsigned binary under AppData or from a process tied to the alerted
    write corroborates an active backdoor. Recovered bot tokens from the file-content
    review can confirm the channel.
  range: +/-4h
  answer_sources:
  - network_connection
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: telegram.org
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other file activity occurred on this host around the time of the alert?
  context: |
    Alerts rarely occur in isolation. This aggregates the host's file events in the
    surrounding window by writing process and path, collapsing repetitive agent noise into
    high-count rows so that novel writer-and-path pairs stand out at low counts. Look for
    persistence components, staged payloads, or captured-output files written near the
    alert that belong to the same operation.
  range: +/-15m
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
- always_include: true
  question: What else did this user do across the environment around this time?
  context: |
    Tracking the user's activity across all hosts in the surrounding window reveals
    whether this drop is isolated or part of activity spanning multiple endpoints. The
    same user producing similar writes or tool executions on other hosts widens the scope
    that needs review. When the alert fired under SYSTEM or a machine account, this view
    fills with agent-telemetry noise — the parent-anchored clustering question is the
    meaningful variant in that case.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: |
    Under a service principal, user-scoped clustering returns agent-telemetry noise
    (every host runs SYSTEM-owned agents constantly). The meaningful question is whether
    the same launch mechanism produced the rule's file pattern elsewhere: the query
    mirrors the rule's selection structure scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to pushed
    or scheduled distribution; a single host points to a host-local trigger.
  range: +/-1h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_typo_path:
        TargetFilename|contains|all:
        - :\Users\
        - \AppData\
        TargetFilename|contains:
        - \Roaming\
        - \Local\
      selection_typo_keyword:
        TargetFilename|contains: Microsift
      selection_ioc:
        TargetFilename|endswith: \AppData\Local\MicrosoftWindowsOutlookDataPlus.txt
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_typo_* or selection_ioc) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced the rule's file pattern, and does that history fit their role?
  context: |
    The query mirrors the rule's selection structure scoped to this user — the result is
    the user's 90-day history of writing files matching this rule's specific pattern (not
    generic AppData activity), aggregated by host. For a malware file indicator the
    expected answer is zero prior events; any history that does exist should trace back to
    an identifiable internal tool, and repeated recent counts suggest the implant has been
    active longer than this alert.
  range: -90d
  answer_sources:
  - file_event
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_typo_path:
        TargetFilename|contains|all:
        - :\Users\
        - \AppData\
        TargetFilename|contains:
        - \Roaming\
        - \Local\
      selection_typo_keyword:
        TargetFilename|contains: Microsift
      selection_ioc:
        TargetFilename|endswith: \AppData\Local\MicrosoftWindowsOutlookDataPlus.txt
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_typo_* or selection_ioc) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment?
  context: |
    When the alert fires under a service principal, user identity does not attribute
    behavior. The meaningful pivot is the launch mechanism: the query mirrors the rule's
    selection structure scoped to the alerting program, so the result is the 90-day
    history of this program driving this specific file pattern, aggregated by host. A new
    or rare program for this pattern is the deviation worth chasing; a program already
    accounting for many prior events would indicate an internal automation whose owner can
    confirm the typo'd file names.
  range: -90d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_typo_path:
        TargetFilename|contains|all:
        - :\Users\
        - \AppData\
        TargetFilename|contains:
        - \Roaming\
        - \Local\
      selection_typo_keyword:
        TargetFilename|contains: Microsift
      selection_ioc:
        TargetFilename|endswith: \AppData\Local\MicrosoftWindowsOutlookDataPlus.txt
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (all of selection_typo_* or selection_ioc) and _pb_scope
    fields:
    - host.name
- question: Is this file name, or any path containing the Microsift misspelling, present on other hosts?
  context: |
    The query searches fleet-wide for both the alerted file name and any path carrying the
    family's characteristic misspelling. The same artifact on multiple hosts indicates
    deliberate distribution or lateral movement and defines the containment scope; a
    single host is consistent with an isolated or targeted delivery. For each additional
    host found, the writing process and timestamp establish the distribution order.
  range: -24h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection_ioc:
        TargetFilename|endswith|expand: '%file_basename%'
      selection_typo:
        TargetFilename|contains: Microsift
      condition: 1 of selection_*
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    A masquerading file drop sits in the middle of an intrusion chain. Earlier detections
    on the same host — delivery-stage alerts, script-host execution, defense tampering, or
    persistence writes — reveal how the implant arrived and what preceded the drop, and
    help reconstruct the timeline from initial access to this artifact.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
