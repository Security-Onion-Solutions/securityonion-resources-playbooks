name: Potential Persistence Via Outlook LoadMacroProviderOnBoot Setting
id: 8e3c68bc-97ed-47ba-af5d-ce68da22c2d8
description: |
  Detects a registry write that sets Outlook's LoadMacroProviderOnBoot value to 1 (value data 0x00000001) under a per-user Office profile key (HKCU\Software\Microsoft\Office\<version>\Outlook), which forces Outlook to load its VBA macro provider — and run any VBA project stored in the user's VbaProject.OTM file — every time the application starts. The setting is off by default and rarely changes outside deliberate developer or add-in configuration; the same write paired with a lowered Outlook macro security Level value and a planted VbaProject.OTM gives user-level persistence, code execution, and an email-borne command channel that blends into normal mail traffic. The investigation should identify the process that wrote the value, check for companion Outlook security or homepage modifications and a VBA project file drop, and determine whether Outlook subsequently loaded the macro provider or spawned child processes.
type: detection
detection_id: 396ae3eb-4174-4b9b-880e-dc0364d78a19
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the registry write set an Outlook LoadMacroProviderOnBoot value to 0x00000001?
  context: >-
    The rule fires when a registry value path ending in \Outlook\LoadMacroProviderOnBoot receives value data containing
    0x00000001 (enabled). Confirm the exact key path — which Office version and which user hive — and the value data
    before investing further effort. A write that disables the setting (0x00000000) or touches a different value name
    under the Outlook key does not match what this rule detects.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to have Outlook VBA macros enabled?
  context: >-
    LoadMacroProviderOnBoot lives under the per-user Office profile, so the change arms macro loading for one specific
    mailbox. Developers who maintain Outlook VBA automation legitimately enable it; most users never do. The mailbox's
    role also matters for follow-up — an email-resident backdoor in an administrator, finance, or executive mailbox
    reaches more sensitive mail flow. User attribution is present on roughly 94% of endpoint registry events; when it
    is a machine account or SYSTEM, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the user or a support technician recall enabling Outlook macro loading?
  context: >-
    A developer maintaining Outlook VBA automation, or a technician configuring a legacy add-in, may have made this
    change deliberately. If the user does not recall it, ask what they were doing at the alert time — whether they
    opened attachments, ran an installer, or granted anyone remote access — since the write would then have been made
    by something running in their session rather than by them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the LoadMacroProviderOnBoot value, and what started that process?
  context: >-
    The writing process (Image on the alert) is the immediate actor. reg.exe invoked from a command shell or script
    host points to hands-on or scripted modification; outlook.exe writes the key itself when the setting changes
    through the application's own options; a management agent suggests deployed configuration. Tracing the writer's own
    parent shows how it was launched — an Office application or script host in that chain points to a
    phishing-delivered loader. If the parent process identifier resolves to NODATA, fall back to the writing process
    name plus host and a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exact Outlook key path received this value, and what does enabling it change?
  context: >-
    LoadMacroProviderOnBoot sits under HKCU\Software\Microsoft\Office\<version>\Outlook and defaults to 0. Setting it
    to 1 makes Outlook load its VBA macro provider at every start, which in turn runs whatever VBA project is stored in
    the user's VbaProject.OTM file. The key path identifies the Office version and user profile affected. On its own
    the value only arms automatic loading — the payload lives in the VBA project file, and the macro security Level
    value determines whether it runs unprompted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were other Outlook security or homepage persistence values modified on this host?
  context: >-
    Enabling macro loading is rarely done in isolation. The same tradecraft lowers the Outlook macro security Level
    value (data 1, enable-all) or sets EnableUnsafeClientMailRules under Outlook\Security, and related Outlook
    persistence variants write homepage or start-page URLs under Outlook\WebView or Outlook\Today. Any of these landing
    near the alert corroborates deliberate mailbox persistence and identifies which variant was staged alongside the
    macro provider flag.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Outlook\Security\'
          - '\Outlook\WebView\'
          - '\Outlook\Today\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who enable macro loading typically make several writes within seconds — the macro security Level, the
    LoadMacroProviderOnBoot flag, sometimes mail-rule or homepage values — often through repeated reg.exe invocations.
    Grouping all registry modifications on the host in the surrounding window by key path and writing process shows
    what else changed and whether one process performed a batch of configuration writes spanning multiple objectives.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was an Outlook VBA project file or custom form written on this host?
  context: >-
    The registry flag only arms automatic loading; the code that runs lives in VbaProject.OTM under the user's roaming
    Outlook folder (AppData\Roaming\Microsoft\Outlook), and the related Outlook Forms variant drops files under
    AppData\Local\Microsoft\Forms. A write to either location near the registry change is the payload half of the
    mechanism. Note which process wrote the file — a copy performed by cmd.exe or a script host rather than outlook.exe
    indicates the project was planted rather than compiled by the application.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Microsoft\Outlook\VbaProject.OTM'
          - '\Microsoft\Forms\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the process that set this value also write files, and does the change persist?
  context: >-
    Correlating file activity by the registry-writing process and its children shows whether the same session that
    armed macro loading also planted the VBA project or staged other tooling. Registry value removal is not observable
    in this telemetry, so judge persistence from the value's re-modification history and from whether Outlook later
    loaded the macro provider. The file write itself carries no hash — if a payload is present, hash it from a later
    execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did Outlook load its VBA macro provider after this change?
  context: >-
    When LoadMacroProviderOnBoot is set, the next Outlook start loads the VBA runtime for Outlook (OUTLVBA.DLL) and
    runs the stored project. Observing that library load after the registry write confirms the persistence armed and
    executed. No load within a day may simply mean Outlook has not restarted yet — re-check after the user's next logon
    rather than concluding the change was inert.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\OUTLVBA.DLL'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Did outlook.exe spawn command interpreters or script hosts after this change?
  context: >-
    Outlook rarely spawns children in normal use — mail handling and add-in activity stay in-process. A VBA project
    executing attacker commands typically shells out, so cmd.exe, powershell.exe, wscript.exe, cscript.exe, or
    mshta.exe with outlook.exe as the parent after this change is the execution half of the mechanism. Capture the full
    child command lines to see what ran.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What network destinations did outlook.exe reach, and do any fall outside normal mail infrastructure?
  context: >-
    An Outlook VBA backdoor can drive its command channel through mail itself — polling the mailbox for trigger markers
    and exfiltrating over outbound messages — so its traffic often blends into the mail session; it may also open a
    fallback channel directly. Aggregate the process's egress by destination and port, and look for endpoints outside
    the organization's mail and collaboration infrastructure, direct-to-IP connections, uncommon or high-entropy ports,
    and outbound volume out of proportion to normal send-and-receive activity.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\outlook.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Were WMI event subscriptions created on this host around this change?
  context: >-
    Event-triggered persistence rarely stops at one mechanism. Permanent WMI event subscriptions — recorded by the
    WMI-Activity operational channel as event 5861, with 5860 for temporary subscriptions — are a common companion
    foothold that survives independently of Outlook. Hosts that do not ship the WMI-Activity channel return no data
    here, so treat zero results as a visibility gap rather than evidence nothing was registered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: Were other persistence mechanisms installed on this host near the alert?
  context: >-
    The detected value is itself a persistence install, and operators commonly stack backup mechanisms — scheduled
    tasks, services, Run keys via reg.exe, BITS jobs, or WMI consumers — in the same session. Grouping
    persistence-capable tool executions in the surrounding hours shows whether the Outlook change is one part of a
    broader foothold or a lone configuration event. Give particular attention to path deviations, such as these tools
    invoked with payloads in user-writable directories.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Has the LoadMacroProviderOnBoot value been modified before on this host?
  context: >-
    This setting defaults to off and is not touched by routine Office servicing, so most hosts show no modification
    history for it at all. Prior writes by the same management tooling with the same value data point to deployed
    configuration; zero history makes this a first-time change on the host and shifts weight to the payload-plant and
    macro-load checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same Outlook value modified on other hosts in the environment?
  context: >-
    The same write appearing across many hosts in a short window points to group policy or a packaged Office
    configuration rather than targeted activity — compare the writing process and value data across hosts for
    consistency. A single host carrying the change, particularly with a non-management writing process, is more
    consistent with targeted mailbox persistence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Mailbox persistence usually arrives late in a chain — phishing delivery, a macro or loader execution, and staging
    typically precede it. Earlier detections on the same host, particularly Office-spawned processes, script execution,
    or defense tampering, help reconstruct how the ability to write this value was obtained.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
