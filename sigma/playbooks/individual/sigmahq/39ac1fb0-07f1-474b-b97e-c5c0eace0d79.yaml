name: Potential MOVEit Transfer CVE-2023-34362 Exploitation - Dynamic Compilation Via Csc.EXE
id: 6ad76cd4-26a3-4513-be10-d79d7bb0e629
description: |
  Detects csc.exe, the .NET C# compiler, launched by the IIS worker process w3wp.exe whose
  command line references the "moveitdmz pool" application pool. Exploitation of MOVEit Transfer
  via CVE-2023-34362 writes an .aspx page into the MOVEit web root; ASP.NET compiles that page on
  first request, and the compilation runs csc.exe under the MOVEit application pool's worker
  process, leaving App_Web_[random].dll artifacts under the Temporary ASP.NET Files tree. The same
  parent-child pattern occurs during MOVEit installation, upgrades, and configuration changes, so
  the investigation should determine what the compiler read and wrote, whether a new or modified
  .aspx page appeared in the web root, and what web request preceded the compilation.
type: detection
detection_id: 39ac1fb0-07f1-474b-b97e-c5c0eace0d79
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does this event show csc.exe spawned by w3wp.exe with "moveitdmz pool" in the parent command line?
  context: >-
    The rule requires all three conditions together: the parent Image ends in w3wp.exe, the parent
    command line contains "moveitdmz pool", and the child Image ends in csc.exe. Confirm all three
    on the alerting event before investing further time, and note the exact application pool name
    so the rest of the investigation is scoped to the MOVEit site rather than any IIS site on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run MOVEit Transfer, and is dynamic ASP.NET compilation expected on it right now?
  context: >-
    Dynamic compilation is routine on an IIS host the first time a page is requested after an
    install, an upgrade, or a web root change. Establish whether this host is a MOVEit Transfer
    server at all, and whether a change window, deployment, or patch was in progress at the alert
    time. If nothing changed on the server, a fresh compilation implies a page appeared in the web
    root that was not put there by an administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this w3wp.exe worker process the expected launcher for csc.exe, and what started the worker?
  context: >-
    The parent-child relationship is the core signal here. Retrieving the worker process's own
    creation event shows the full application pool arguments and which service started it, which
    confirms the pool identity and the account the compilation ran under. An IIS worker started
    normally by the WWW publishing service that then compiles code points the investigation at what
    was requested, not at how the worker itself was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What web request drove the MOVEit worker process to compile code?
  context: >-
    Server-side exploitation begins with a crafted HTTP request rather than an email. ASP.NET
    compiles a page the first time it is requested, so the compile time brackets the request that
    reached the new page. Review the web server access logs for the MOVEit site around this
    timestamp for requests to unfamiliar .aspx endpoints, requests carrying non-standard custom
    headers, and the source IP that issued them; that IP and endpoint are what can be blocked at
    the perimeter and hunted for on other MOVEit servers.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What did csc.exe compile, and where did it write the output assembly?
  context: >-
    An ASP.NET dynamic compilation invokes csc.exe with a generated response file and an output
    path, typically an App_Web_[random].dll under the Temporary ASP.NET Files tree. The command
    line names both, and the response file's directory identifies which site and which source page
    was compiled. Read the source path out of the arguments: a page under the MOVEit web root that
    no administrator deployed is the artifact the rest of the investigation hangs on. Multiple
    csc.exe invocations in the same window are normal for one compilation, since ASP.NET may
    compile several generated files together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What files did this csc.exe process write on disk?
  context: >-
    The compiler's file writes are the durable evidence of what was compiled. Expect generated
    source, a response file, and the output assembly under the Temporary ASP.NET Files tree. Take
    the output assembly name and search the MOVEit web root for an .aspx page with a matching or
    nearby write timestamp; a page in the web root that was not deployed by an administrator, and
    that carries a per-host unique password rather than a reusable one, is the pattern this
    exploitation leaves behind. File-write events carry no hash, so hash the file on disk or wait
    for an execution event if reputation is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
  - manual_review
- question: What other child processes did this same w3wp.exe worker spawn?
  context: >-
    A compilation on its own only proves a page was requested. If the same worker instance also
    spawned command interpreters, archive utilities, or network tools, the web application is
    executing attacker-supplied code rather than merely compiling a page, and the scope moves from
    "a file appeared" to "commands ran under the application pool identity". Note anything the
    worker spawned that is not part of the .NET compilation toolchain.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this MOVEit Transfer installation patched against CVE-2023-34362?
  context: >-
    CVE-2023-34362 is a SQL injection in the MOVEit Transfer web front end that leads to code
    execution through the web application. Check the installed MOVEit Transfer version against the
    fixed releases; an unpatched version means the observed compilation could have been driven by
    an unauthenticated request, and it means any other MOVEit servers on the same build are exposed
    the same way. A patched version does not clear the alert, but it moves the likely explanation
    toward an install or upgrade of the application itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: How often has w3wp.exe spawned csc.exe on this host over the last 90 days?
  context: >-
    This counts the parent-child pairing across all IIS application pools on the host, not just the
    MOVEit pool, so it measures how routine dynamic compilation is on this server. A host that
    compiles regularly is one where pages change often, and the pairing alone carries little weight;
    a host where this pairing has never occurred, or occurred only around known deployment dates,
    makes an unscheduled compilation the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: How often has csc.exe run on this host over the last 90 days, and under which accounts?
  context: >-
    The rule's known benign trigger is initial software installation and updates, and this
    aggregation is how that gets tested. Compare the counts and accounts against the host's change
    history: compilation clustered around install and patch dates under an installer or
    administrator account fits the benign explanation, while compilation under the application pool
    identity at a time with no corresponding change record does not. Use the account distribution to
    decide which identity to pivot on.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to the alerting account, so the result is that
    account's 90-day history of MOVEit-pool compilation specifically, aggregated by host. An
    application pool identity that has driven this pattern before, on the same host, around known
    change windows, reads differently from one producing it for the first time. If the alert fired
    under a service or machine account, the count here attributes to the pool rather than to a
    person, and the launch-mechanism history is the more meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: moveitdmz pool
        Image|endswith: \csc.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this worker process historically driven MOVEit-pool compilation on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal, account identity does not attribute behavior;
    the launch mechanism does. The query mirrors the rule's selection scoped to the alerting parent
    process name, so the result is the 90-day history of the IIS worker driving this exact pattern
    rather than generic worker-plus-compiler co-occurrence. A worker that already accounts for a
    long history of this pattern on this host points to routine recompilation after deployments; a
    first occurrence points at whatever changed in the web root.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: moveitdmz pool
        Image|endswith: \csc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    If the alert fired under a named account, its activity on other hosts in the same window shows
    whether the operation extended beyond this server. If it fired under the application pool
    identity, a machine account, or SYSTEM, this query returns broad service and agent activity
    rather than a person's actions, and the launch-mechanism clustering is the answer that carries
    signal; treat a large, host-spanning result as a property of the account type rather than as
    evidence of scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same worker-driven compilation pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, account-pivoted clustering returns agent and service noise. The
    meaningful question is whether the same launch mechanism produced this pattern elsewhere: the
    query mirrors the rule's selection scoped to the alerting parent process name, fleet-wide, in
    the alert window. Several MOVEit servers compiling in the same window fits a coordinated
    deployment or a coordinated set of requests against the same exposed application; a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: moveitdmz pool
        Image|endswith: \csc.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity by binary and parent in the window around the compile collapses
    steady agent and service telemetry into high-count rows and leaves novel parent-child pairs
    standing out at low counts. On a file transfer server, watch for archive utilities, database
    clients, and command interpreters appearing under the web stack, which would indicate the
    compilation was one step in a sequence rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Are other hosts in the environment showing w3wp.exe spawning csc.exe in the last 24 hours?
  context: >-
    This search is deliberately not scoped to the alerting host, and it is not scoped to the MOVEit
    application pool either, so it returns dynamic compilation across every IIS host in the
    environment. Use it to separate a fleet-wide pattern, which usually means a deployment or a
    patch wave, from compilation confined to the MOVEit servers. Read the returned command lines for
    the site paths to tell which application each host was compiling.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Were other MOVEit servers targeted by the same exploitation attempt?
  context: >-
    Internet-facing file transfer applications are exploited in sweeps rather than one server at a
    time, so a single affected host is rarely the whole picture. Correlating this same detection
    across the environment shows which other MOVEit servers produced the pattern and under which
    accounts. Every host returned needs the same web root review and access log review as the
    alerting one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same server help place this compilation in a timeline. Web
    exploitation is usually followed rather than preceded by other activity, so an empty result is
    common and is not itself reassuring; what matters is whether reconnaissance, credential access,
    or data staging detections bracket the compile time. Read the results in order and note the gap
    between the earliest detection and this one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
