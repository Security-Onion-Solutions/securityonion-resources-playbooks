name: Malicious Driver Load By Name
id: cc64048b-291b-4647-9b4d-208569509704
description: |
  Detects a kernel driver loading whose file path ends with any one of roughly seventy filenames catalogued as
  attacker-supplied kernel tooling or as drivers loaded deliberately for the kernel access they expose. The rule
  matches on the filename alone, so it fires when any of those names appears regardless of the file's hash, signer,
  or on-disk location; a legitimate vendor driver that happens to carry a listed name will also match, and an
  attacker-supplied driver renamed to anything else will not. Establish which name matched, whether the file behind
  that name is the catalogued driver or an unrelated one with the same filename, what service and registry entries
  were created to load it, what process wrote the file and registered the service, and whether privileged behavior,
  defense tampering, or other persistence followed the load.
type: detection
detection_id: 39b64854-5497-4b57-a448-40977b8c9679
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which of the known-bad driver filenames this rule lists does the loaded driver match?
  context: The rule fires when a loaded driver's path ends with any single entry from its list of catalogued driver
    filenames, so exactly which name matched is the first thing to record — it determines what the file is expected
    to be and how the rest of the investigation reads. Some entries are descriptive names of attacker tooling
    (mimidrv.sys, mimikatz.sys, gmer64.sys), some are hex strings standing in for samples recovered without a better
    name, and some are short or generic names that a legitimate driver could plausibly carry. Note the full path as
    well as the name, because a listed name loading from outside the standard system driver directory is a different
    finding from the same name loading from an installed product's location.
  range: +/-5m
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host expected to load third-party kernel drivers, and does any installed product account for
    this one?
  context: Driver loads are performed by the service control manager in kernel context, so the account recorded on
    the event is normally SYSTEM and carries no attribution value — the useful judgment is about the host. Endpoint
    agents, storage and virtualization tooling, hardware and diagnostic utilities, VPN clients, and anti-cheat
    software all install kernel drivers as a matter of course, and a name collision with one of those products is
    the documented false-positive mode for this rule. Determine whether the host's role and software inventory
    account for a driver of this kind, or whether the load has no matching product behind it.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - host.name
      - User
- question: From what path did the driver load, and what signing status does it carry?
  context: The load event names the file's full path and its signer, which is what separates attacker-built kernel
    code from a legitimately signed vendor driver. A load from %SystemRoot%\System32\drivers\ with a valid signature
    from a recognized hardware or software vendor is the routine case; a load from C:\Users\, C:\Windows\Temp\,
    C:\ProgramData\, or another user-writable directory is not, whatever the signature says. A valid signature does
    not clear the file — signed drivers with documented arbitrary memory access, model-specific register access, or
    process-termination primitives are loaded intact and driven through their own interface, so the load is the event
    of interest even when the signature is genuine. Unsigned, expired, distrusted, or invalid status points to
    attacker-supplied code or a tampered file.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Is the file behind this filename actually the catalogued driver, or an unrelated driver carrying the
    same name?
  context: This rule matches on a name, and a name is the weakest identifier a driver has — it is renamed freely by
    the tooling that loads it, and a vendor driver can independently ship under a listed name. The driver load event
    carries the file's hash, so the identification needs no execution pivot — take the SHA256 to a reputation service
    and to public known-bad driver catalogues and settle what the file is. A hash matching a catalogued entry tagged
    as attacker tooling means the driver is itself the payload. A hash matching an entry tagged as an abusable signed
    driver means a legitimate vendor binary was loaded for its kernel primitive, which commonly precedes
    endpoint-agent termination, credential access, or privilege escalation. A hash matching a current, signed release
    of a shipping product, with the signer to match, is the name-collision case the rule's own tuning notes call out.
    Absence from a catalogue clears nothing — some catalogued entries carry no recovered hash at all, and newly
    abused drivers are added continuously.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
      - ImageLoaded
- question: What kernel service was installed to load this driver, and what binary path and account does it use?
  context: A driver cannot reach the kernel without a service registration, so the service install record is the
    installation record for this load. The structured fields name the service, the driver path it points at, its
    start type, and the account it runs under — a kernel driver service starting automatically loads at every boot,
    while a demand-start service was loaded deliberately by whatever called it. Service names that imitate a
    legitimate product or that look machine-generated, and image paths outside %SystemRoot%\System32\drivers\, are
    the entries worth expanding. If no install event appears in this window, the service was registered before the
    load — establish that from the service key's own modification history, and read a load with no recent install as
    an existing registration that was started rather than a fresh one.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: What service registry entries were written under CurrentControlSet\Services on this host around the load?
  context: Service registration is a registry operation, and the values written there are the durable record of how
    a driver is loaded — ImagePath points at the .sys file, Start controls whether it loads at boot (a value of 0 or
    1 means the driver loads before or with the operating system), and Type identifies it as a kernel driver rather
    than a user-mode service. Writes to these keys can register a driver without any service-install tooling running,
    which is why this view is checked independently of the service install record. A Start value changed on an
    existing service key, rather than a new key created, means an already-registered driver was reconfigured to load;
    the writing process on those events identifies what made the change.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process loaded this driver, and what launched it?
  context: Driver loads are frequently initiated by the service control manager or by the kernel at boot, so the load
    event may carry no usable process attribution — an empty result is expected for a boot-time load and is not
    itself a finding. Where a loading process does resolve, its own start event names the parent that launched it.
    Driver-install utilities and service management tools run legitimately from deployment and installer processes;
    the same tools launched from a script host, an Office application, a browser child, or a binary in a
    user-writable directory point to an installation performed by an intrusion rather than by software management.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the driver's service still installed and running, and is the driver still resident in the kernel?
  context: A load event records that the driver reached the kernel at that moment, not that it is still there. Read
    the service state and the loaded-driver list from the host or the endpoint console directly to establish whether
    the registration persists and whether the driver remains loaded. A driver whose service is set to start
    automatically survives reboot; one that was loaded and immediately unloaded fits tooling that loads a driver only
    long enough to use its kernel primitive and then removes it, leaving the service key behind as the remaining
    artifact. Note the account the service runs under, since a kernel service runs as LocalSystem by construction.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was a file with this driver's name written to this host's disk, and what process wrote it?
  context: The write that placed the .sys file identifies how the driver arrived and what brought it. The query
    anchors on the alerting driver's filename across this host's file writes, so a result names the writing process
    and the path it chose. A driver written by an installer or a software-deployment agent into
    %SystemRoot%\System32\drivers\ is the routine pattern; one written by an archive extractor, a script host, a
    browser child, or an unfamiliar binary into C:\Users\, C:\Windows\Temp\, or C:\ProgramData\ points to staging by
    an intrusion. File-write events carry no hash, so match the write to the load by name and path and take the hash
    from the load event. No write in the window means the file predates it — widen the range before concluding the
    driver was already present legitimately.
  range: +/-4h
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the Security log record a service installation or special-privilege assignment on this host around
    the load?
  context: Loading a driver to obtain kernel access is the step before that access is used, so the window around the
    load is where the follow-on privileged behavior appears. Event 4697 records a service installation with the
    service name and its file path, corroborating the driver's registration from a second channel. Event 4672 records
    privileged tokens assigned at logon; it is emitted for every SYSTEM and administrative logon and is high volume
    by nature, so read it for accounts that do not normally receive these privileges on this host rather than for
    volume. If the Security channel is not collected in this environment, zero results is a visibility gap rather
    than evidence that nothing occurred.
  range: +/-30m
  answer_sources:
  - active_directory
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4697
          - 4672
      condition: selection
    fields:
      - SubjectUserName
      - PrivilegeList
      - ServiceName
      - ServiceFileName
- question: Does the timing of this driver load align with a boot, a software deployment, or a maintenance window?
  context: When a driver loads is as informative as which one loaded. A load in the seconds after a host boots
    reflects an already-registered auto-start service and points the investigation at when that registration was
    made, not at the load itself. A load mid-session, with no installation or deployment activity around it, means
    something on the host registered and started a driver during normal operation — correlate it against deployment
    schedules, maintenance windows, and what the user or an administrator was doing at that time.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was there a change ticket, deployment record, or documented approval for installing a driver on this
    host?
  context: Because this rule matches on filename alone, a legitimately deployed vendor driver that ships under a
    listed name will fire it, and a deployment record is the fastest way to resolve that reading. A ticket or package
    record naming the product, the version, and the driver it installs, with timing that matches the load, supports
    the name-collision explanation and should be confirmed against the file's signer and hash. No record covering
    this host and window, on a system where driver installation is change-controlled, leaves the load unaccounted for
    and the investigation open.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has a driver with this filename loaded on this host before, and always with the same hash and signer?
  context: A listed name loading for the first time on this host supports a fresh installation, whether by a product
    or by an intrusion. History alone is not reassuring, because these files are renamed freely — the useful
    comparison is whether the hash and signer behind the name have stayed constant. The same filename loading for
    months under one signer and hash, then loading with a different hash, means the file behind an established name
    was replaced. A driver present since the host was built and consistent throughout is the routine result and
    strengthens the name-collision reading.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
      - Signature
- question: Is a driver with this filename loading on other hosts in the environment?
  context: The same driver name loading across several hosts distinguishes a localized event from something
    distributed — which can mean an intrusion moving between systems, or a software package deployed to a group of
    machines. Compare the signer and hash on each host and the pattern of load times. Hosts loading it within a
    narrow window around a deployment, all with the same hash and signer, look like distribution by software
    management; loads scattered across time on hosts with no common software profile do not. Differing hashes behind
    the same name across hosts means more than one file is involved and each needs identifying separately.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Signature
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around a driver load hold whatever installed it and whatever used it. The aggregated
    parent-child view collapses repetitive agent telemetry into high-count rows so that novel low-count pairs stand
    out — driver install utilities, service control commands, archive extractors, script hosts, or an unfamiliar
    binary appearing once or twice in the window are the rows to expand. Endpoint agent and security tool processes
    stopping in this window are also relevant, since kernel access is commonly obtained to terminate them.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: A driver load is rarely the first stage of an intrusion — administrative access is needed before a driver
    can be registered at all. Earlier detections on the same host covering credential access, privilege escalation,
    remote execution, or a delivery chain identify how that access was obtained and when the host was first affected,
    which sets the true starting point of the timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around this activity?
  context: A kernel service is one persistence surface, and actors who reach the point of loading a driver commonly
    hold others. Service control activity in this window is directly relevant because the driver's own registration
    may appear here, but the view also surfaces scheduled tasks, registry Run key writes, and management-tool
    persistence installed alongside it. Grouped tool-plus-command rows show which mechanisms were touched; several
    landing in the same window indicates deliberate stacking rather than a single administrative action.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: File-based persistence leaves no command line to detect. An executable or script written into a Startup
    folder, or a scheduled-task XML written directly under the Windows task directories, establishes a foothold
    without any persistence tool running. These drops are a distinct mechanism from the kernel service that loaded
    the driver, and their presence in the same window shows a user-mode component was placed alongside the kernel
    one — the writing process on those events links the two together.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
