name: Potential Webshell Creation On Static Website
id: 4324b6ac-ad31-4c3f-a2de-b04835a1c432
description: |
  Detects the creation of files with server-executable script extensions in web-served
  directories on Windows hosts. The rule fires on either branch — a file written under
  \inetpub\wwwroot\ whose path contains .ashx, .asp, .ph, or .soap, OR a file written under a
  \www\, \htdocs\, or \html\ directory whose path contains .ph — excluding writes to Temp
  directories, writes by the System process, and paths under \xampp. Dropping a server-side
  script into web content is the T1505.003 web-shell persistence pattern: the file executes in
  the web server's security context on any later HTTP request, requiring no logon. Legitimate
  developer or administrator deployments produce the same write, so the investigation should
  establish what wrote the file and through which channel, whether its content is application
  code or command-execution script, and whether the web server spawned interpreters afterward.
type: detection
detection_id: 39f1f9f2-9636-45de-98f6-a4046aa8e4b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file match one of the rule's web-root path and extension branches?
  context: >-
    Confirm the true positive and note which branch fired. The rule fires when EITHER the path
    contains \inetpub\wwwroot\ and the name contains .ashx, .asp, .ph, or .soap, OR the path
    contains \www\, \htdocs\, or \html\ and the name contains .ph. Writes under Temp
    directories, by the System process, or under \xampp are excluded. The extension checks are
    substring matches — .ph also catches .php and .phtml, .asp also catches .aspx — and still
    match double-extension names such as shell.php.jpg. The wwwroot branch points to an
    IIS-served path (ASP-family shells); the www/htdocs/html branch points to Apache-style
    stacks (PHP shells), which steers the content and execution-chain checks that follow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host an expected web server, and is the writing user or process expected to deploy content to its web root?
  context: >-
    Web roots receive legitimate writes from a small set of sources — deployment pipelines,
    content-management processes, the web application itself, or administrators publishing
    content. The query projects the host, user, and writing process for the triggering event.
    When the user is a machine or service account, judge legitimacy by the writing process and
    the host's role instead: a web application worker writing a script into its own served
    directory is the upload pattern this rule targets, while a deployment agent or file-copy
    tool may reflect routine publishing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the created file still on disk, or was it deleted or renamed after the alert?
  context: >-
    A file still present can be retrieved, hashed, and content-reviewed. Deletion shortly after
    creation is consistent with an upload test or cleanup after use — web shells are sometimes
    dropped, used once, and removed — and shifts attention to what the web server executed in
    between. A rename can move the file to an extension the server executes or hide it under an
    innocuous name; interpret each event by its EventType.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process wrote the file, and what request or session delivered it?
  context: >-
    The writing process identifies the delivery channel. A web application worker (w3wp.exe,
    php-cgi.exe, a Java or application-server process) writing the file means it arrived
    through the application — review web server access logs for POST or PUT requests to upload
    endpoints just before the creation time and note the source IP and URI. An FTP, WebDAV, or
    file-share service points to those transfer logs; an interactive process (explorer.exe, an
    editor, a deployment tool) points to a logged-on session, which the logon-correlation
    question examines.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Did this rule fire on other web servers in the environment?
  context: >-
    Exploitation of a file-upload weakness is commonly repeated against every reachable server
    running the same application. The aggregation groups this rule's alerts by host and user
    over the last day; multiple servers receiving script files in the same period points to a
    repeated upload operation against a common vulnerability, and each affected host needs the
    same content and execution review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Is the web application and server stack patched against known upload and remote-code-execution vulnerabilities?
  context: >-
    Web-shell drops typically follow exploitation of an unrestricted file upload, an unpatched
    deserialization or remote-code-execution flaw in the application, or weak upload handling —
    extension filters bypassed with double extensions, trailing characters, or alternate data
    streams. Identify the application serving the target directory and its version; an
    unpatched known CVE both explains the write and defines which other servers are exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Was there a change ticket, deployment record, or maintenance window covering this write to the web root?
  context: >-
    The main false-positive path for this rule is a developer or administrator legitimately
    publishing application files. A matching deployment record, CI/CD job, or change ticket for
    this server and time quickly closes the alert; a script file arriving in the web root with
    no corresponding deployment activity — especially outside normal release processes — leaves
    the upload unexplained and keeps the investigation open.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Is the created file's content legitimate application code or a command-execution script?
  context: >-
    Retrieve the file from disk and read it. Web-shell content typically takes request
    parameters and passes them to execution — eval, assert, system, exec, or shell_exec in PHP;
    Execute or Eval over Request items in ASP; ProcessStartInfo or cmd.exe invocation in ASPX —
    often minified to a single line, wrapped in base64 or character-code decoding, or prefixed
    with image magic bytes to pass upload filters. Legitimate files contain recognizable
    application code that matches the deployed codebase or framework; compare against source
    control or the vendor package when available.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What is the file's hash, and does it match known web-shell or malware signatures?
  context: >-
    File-creation events carry no hash, and a server-side script is interpreted inside the web
    server process rather than launched as its own process, so hash evidence usually requires
    retrieving the on-disk file and hashing it manually; submit the hash to threat-intelligence
    and reputation services to check for known web-shell families. The query covers the
    narrower case where the created file was itself launched as an executable, which does
    record a hash on the execution event.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did a web server process on this host spawn a command interpreter or script host around the alert?
  context: >-
    A web shell executes when the server handles a request to it, so the observable execution
    evidence is the server worker — w3wp.exe for IIS, php-cgi.exe or php.exe, httpd.exe,
    apache.exe, nginx.exe — spawning cmd.exe, powershell.exe, or a script host. Any such child
    is worth reading in full, because its command line is the operator's command. Note the
    delay between the file creation and the first spawn: immediate use suggests an active
    operator, a long gap suggests a foothold staged for later. Renamed or wrapper server
    binaries will not match the parent list, and a shell that runs entirely in-process leaves
    no child here — weigh this alongside the file-content review. A child that establishes
    outbound connections extends the chain; pivot on any child process found.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_parent:
        ParentImage|endswith:
          - '\w3wp.exe'
          - '\php-cgi.exe'
          - '\php.exe'
          - '\httpd.exe'
          - '\apache.exe'
          - '\nginx.exe'
      selection_child:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cscript.exe'
          - '\wscript.exe'
      condition: selection and selection_parent and selection_child
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Are requests to the created file carrying encoded parameters, and what do they decode to?
  context: >-
    Operator commands to a web shell travel as HTTP request parameters, frequently base64-,
    hex-, or URL-encoded — sometimes doubly. Pull the web server access logs for requests to
    the created path and decode the parameter values; the decoded content reveals what was
    actually run, such as reconnaissance commands, credential access, download cradles, or
    lateral-movement tooling. Apply the same decoding to any encoded blocks embedded in the
    file content itself, iterating until the payload is readable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
- question: Which accounts logged on to this server around the file creation?
  context: >-
    A web shell uploaded through the application requires no Windows logon, so a file arriving
    with no correlated logon session is consistent with delivery over HTTP. A matching logon
    (4624) or explicit-credential use (4648) by an administrator or deployment account at the
    creation time supports a legitimate publish or an interactive copy. Note the logon type (2
    interactive, 3 network, 10 remote desktop) and the source address, and whether the account
    plausibly deploys content to this server.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - IpAddress
  answer_sources:
  - organizational_knowledge
- question: What other files did the writing process create, rename, or delete around the alert?
  context: >-
    A single exploited upload handler often receives several files in one session — additional
    shell variants under different names, configuration drops such as web.config or .htaccess
    that enable script execution for otherwise-blocked extensions, or staging output. The
    correlation covers the writer and its direct children; review where each write landed and
    whether other web-served paths received script content.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to this server's web-content directories recently, and by which processes?
  context: >-
    Web-served directories have few legitimate writers — the deployment mechanism, the
    application itself, and content-management processes. The aggregation groups seven days of
    writes to the rule's web-root paths by file and writing process: a single unfamiliar writer
    across several files points to sustained use of an upload channel, and earlier script or
    configuration-file arrivals may mark when the foothold was first established. If this
    server serves content from a custom directory outside these standard roots, review that
    path the same way.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\inetpub\wwwroot\'
          - '\www\'
          - '\htdocs\'
          - '\html\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously written files matching this rule's web-root pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of producing this exact web-root write pattern, aggregated by host —
    not generic file activity. A developer or administrator who routinely publishes to web
    roots may show a steady history; an account that has never produced this pattern writing a
    server-executable script is the deviation worth chasing. Weigh the count against the
    user's role and typical duties.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_wwwroot_path:
        TargetFilename|contains: \inetpub\wwwroot\
      selection_wwwroot_ext:
        TargetFilename|contains:
        - .ashx
        - .asp
        - .ph
        - .soap
      selection_htdocs_path:
        TargetFilename|contains:
        - \www\
        - \htdocs\
        - \html\
      selection_htdocs_ext:
        TargetFilename|contains: .ph
      filter_main_temp:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      filter_main_system:
        Image: System
      filter_main_legitimate:
        TargetFilename|contains: \xampp
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection_wwwroot_* or all of selection_htdocs_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this rule's pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal or machine account, user identity does not
    attribute the behavior — the launch mechanism does. The query mirrors the rule's selection
    structure scoped to the alerting program, giving the 90-day history of this program
    driving this specific web-root write pattern, aggregated by host. A deployment agent that
    accounts for thousands of prior events is routine automation; a web-server worker or an
    unfamiliar program producing this pattern for the first time is the lead worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_wwwroot_path:
        TargetFilename|contains: \inetpub\wwwroot\
      selection_wwwroot_ext:
        TargetFilename|contains:
        - .ashx
        - .asp
        - .ph
        - .soap
      selection_htdocs_path:
        TargetFilename|contains:
        - \www\
        - \htdocs\
        - \html\
      selection_htdocs_ext:
        TargetFilename|contains: .ph
      filter_main_temp:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      filter_main_system:
        Image: System
      filter_main_legitimate:
        TargetFilename|contains: \xampp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: ((all of selection_wwwroot_* or all of selection_htdocs_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether this
    write is part of wider hands-on activity — process activity on other servers, or similar
    writes elsewhere. If the account is a service principal or machine account, expect this
    pivot to return broad automation noise; the parent-driven clustering question is the
    meaningful counterpart in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, user-pivot clustering returns agent and automation noise, so
    the meaningful check is whether the same launch mechanism fired elsewhere. This query
    mirrors the rule's selection structure scoped to the alerting program, fleet-wide,
    in the alert window. Several hosts producing the same web-root writes under the same
    program points to pushed automation or a repeated exploitation run against multiple
    servers; a single host points to a host-local upload.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_wwwroot_path:
        TargetFilename|contains: \inetpub\wwwroot\
      selection_wwwroot_ext:
        TargetFilename|contains:
        - .ashx
        - .asp
        - .ph
        - .soap
      selection_htdocs_path:
        TargetFilename|contains:
        - \www\
        - \htdocs\
        - \html\
      selection_htdocs_ext:
        TargetFilename|contains: .ph
      filter_main_temp:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Windows\Temp\
      filter_main_system:
        Image: System
      filter_main_legitimate:
        TargetFilename|contains: \xampp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: ((all of selection_wwwroot_* or all of selection_htdocs_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
