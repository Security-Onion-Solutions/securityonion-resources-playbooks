name: APT29 2018 Phishing Campaign File Indicators
id: 59abf0f8-0ce5-4d31-848d-4a1c40937fe2
description: |
  Detects the delivery-artifact filenames ds7002.lnk, ds7002.pdf, and ds7002.zip written to disk, which correspond to a known 2018 spear-phishing chain. In that chain a malicious archive is delivered, extracts a Windows shortcut, and the shortcut runs a PowerShell command that reads base64-encoded content from byte offsets inside the LNK, carves a decoy PDF and a loader DLL to user-writable paths, then executes the DLL via rundll32.exe by export name (T1218.011 system-binary proxy execution) to establish HTTP(S) command-and-control. Because the rule matches on filename alone, the investigation must confirm the artifacts, reconstruct the writer and its parent, and follow the chain forward into rundll32 DLL loading and outbound connections.
type: detection
detection_id: 3a3f81ca-652c-482b-adeb-b1c804727f74
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file name and creating process match the phishing-delivery indicators this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path — one of ds7002.lnk, ds7002.pdf, or ds7002.zip — the operation performed (created, deleted, renamed), and the responsible process against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to receive or extract archive and shortcut files with these names?
  context: Legitimate activity rarely produces these exact indicator filenames. Knowing whether the user role and host function are consistent with receiving a shared document and extracting an archive is often the fastest way to separate a benign coincidence from a real delivery. When the writer is a machine or service account, judge by the responsible process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this activity part of an authorized penetration test or red team engagement emulating this phishing chain?
  context: Red teams routinely emulate well-documented phishing delivery chains, sometimes reusing the same indicator filenames. Before deeper analysis, check whether an authorized exercise is currently active on this host or network segment. A matching engagement with consistent timing resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is inside the delivered file — does the shortcut or archive embed an encoded loader or command?
  context: Read and analyze the artifact's actual content rather than trusting the filename. The shortcut in this chain embeds a PowerShell command that reads base64-encoded bytes from offsets inside the LNK itself, reconstructs a deobfuscation routine, and carves a decoy PDF and a loader DLL to disk. Inspect the retrieved file for embedded base64, byte-offset reads, split-string constructions of FromBase64String, and referenced output paths. Content analysis requires manual retrieval from the endpoint or EDR.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If a payload carved from these files executed, what is its hash and does it have known detections?
  context: A file's hash is recorded when it runs, not when it is written. These indicators are not themselves executable — the shortcut writes a loader DLL and decoy PDF, and the DLL runs via rundll32. If one of the named files did run as a process (for example a renamed executable), this surfaces its hash for reputation lookup. Otherwise retrieve the on-disk artifact and the carved loader DLL and hash them manually; the DLL's load-time hash is surfaced by the module-load question.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process wrote these files, and what launched that process?
  context: The parent chain reveals how the artifacts were delivered — an archive utility or browser extracting a downloaded zip, or explorer opening a shortcut. Unusual parents such as mail clients, Office applications, or script hosts point to phishing delivery rather than routine file activity. Profile the writer against the parents that legitimately produce files with these names on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Are these files still on disk, or were they deleted or renamed after the alert?
  context: The artifacts' post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; files deleted seconds after creation suggest anti-forensic cleanup or a self-deleting dropper and shift the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one artifact in this chain typically drops several — the loader carves a decoy PDF and a beacon DLL to user-writable paths alongside the delivered files. The breadth, paths, and extensions of the writer's other file activity distinguish a single dropped file from a staged delivery and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What rundll32.exe executions occurred on this host after the alert, and do their command lines reference an unusual DLL path or export name?
  context: In this chain a loader DLL carved from the delivered files is run via rundll32.exe by export entrypoint from a user-writable path — the defining pattern of system-binary proxy execution. Inspect each rundll32 command line for a non-standard DLL path (for example under AppData\Local or Temp) and a named export. Baseline against the signed binaries and arguments rundll32 legitimately runs on this host to isolate the anomaly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
- question: What DLLs did rundll32.exe load on this host after the alert, and are any unsigned or from user-writable paths?
  context: Proxy execution maps a loader DLL into rundll32; the module of interest is unsigned or signed by a non-Microsoft entity and lives outside system directories. Compare the loaded modules against the DLLs rundll32 normally loads in this environment to isolate the outlier, and use the module's load-time hash for reputation lookup.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Did rundll32.exe initiate outbound connections after the alert, and to which external destinations?
  context: A beacon payload loaded via rundll32 initiates command-and-control over HTTP(S), often with a malleable profile that masquerades as legitimate web traffic. Correlate rundll32 egress with destination addresses outside the enterprise range, and resolve destinations through the corresponding DNS lookups where an IP alone is ambiguous.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Have files with these names been seen before on this host?
  context: A file that has never appeared on a host is more suspicious than one that is part of normal operations. These are campaign-specific indicator filenames, so any prior appearance is itself worth explaining. Zero or very low historical counts confirm a first-time delivery.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Are files with these names present on any other hosts in the environment?
  context: Finding the same indicator filenames on multiple hosts points to a broader delivery wave rather than a single targeted recipient. If the artifacts are isolated to one host, the delivery was narrow; if spread across many, establish the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced these file indicators, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of these specific indicator filenames, aggregated by host, not generic file activity. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ds7002.lnk
        - ds7002.pdf
        - ds7002.zip
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically written these file indicators on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of this program driving these indicators. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ds7002.lnk
        - ds7002.pdf
        - ds7002.zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered related activity on several hosts, the scope of the delivery may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern write these indicators on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did network-wide returns agent-telemetry noise. The meaningful question is whether the same launch mechanism fired elsewhere — the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window point to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ds7002.lnk
        - ds7002.pdf
        - ds7002.zip
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access, or other execution — may reveal the stages that preceded this delivery and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
