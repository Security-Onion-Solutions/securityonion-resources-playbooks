name: NTDS Exfiltration Filename Patterns
id: b18cf316-fb6c-4927-87a7-ddd19f930123
description: |
  Detects creation of files whose names match staging artifacts of NTDS.dit credential dumping: a cabinet ending in \All.cab
  that bundles the Active Directory database with the SAM and SYSTEM registry hives, or a file ending in .ntds.cleartext holding
  extracted plaintext credentials. Legitimate domain controller backups and install-from-media exports can produce similar
  archives, so investigation should confirm the responsible process and its parent chain, the sibling files written and deleted
  around the alert, and where the output was staged or moved. A genuine NTDS.dit capture exposes every domain account and is a
  domain-wide credential compromise.
type: detection
detection_id: 3a8da4e0-36c1-40d2-8b29-b3e890d5172a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file's name end in \All.cab or .ntds.cleartext, and is the writing process consistent with credential
    staging?
  context: Confirm the alert is a true positive by reviewing the exact file name and the responsible process against the rule's
    criteria. These names are the output artifacts of NTDS.dit dumping — a compressed cabinet of the AD database with the SAM
    and SYSTEM hives, or a cleartext credential export. The default database lives at %SystemRoot%\NTDS\ntds.dit, but a custom
    domain controller storage path shifts where staging occurs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce NTDS.dit staging or credential-export files?
  context: Legitimate domain controller backups and install-from-media exports can create similar archives. Knowing whether
    the host is a domain controller or backup server and whether the user or service account performs that role separates routine
    maintenance from theft. When the writer is a machine or SYSTEM account, judge by the responsible process and the host role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was NTDS.dit copied or accessed, and were the SAM and SYSTEM hives captured alongside it?
  context: NTDS.dit holds every domain account's password hash; capturing it with the SYSTEM hive (which holds the boot key)
    yields offline-crackable credentials for the whole domain. Confirm which stores the responsible process touched — the database
    file, registry hive saves (reg save SYSTEM/SAM), or a cabinet bundling all three. Direct handle-access masks are not visible
    in file telemetry, so the command line and the sibling file writes are the evidence here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the staged file actually contain, and is it the real NTDS credential archive or a decoy?
  context: For filename-pattern detections the name is the trigger, but the contents confirm intent. Retrieve the file from
    the host and inspect it — an All.cab should unpack to ntds.dit, SAM, and SYSTEM; a .ntds.cleartext file holds extracted
    plaintext credentials. File size and structure distinguish a genuine dump from an empty or renamed decoy. Contents must
    be pulled manually from the endpoint or EDR, since the write event carries no payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the staged file still on disk, or was it deleted or renamed after the alert?
  context: Credential-dumping tooling routinely deletes its staging files — the cabinet and the intermediate ntds.dit, SAM,
    and SYSTEM copies — immediately after exfiltration to reduce forensic footprint. A file still on disk can be retrieved and
    analyzed; a deletion seconds after creation is the cleanup signature and shifts focus to what was transferred in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: This dumping pattern produces several files in quick succession — a shadow-copy copy of ntds.dit, reg-save exports
    of the SYSTEM and SAM hives, then a single cabinet bundling them, followed by deletion of the intermediates. Seeing the
    sibling writes and deletions from the same process confirms the full extraction sequence and enumerates every credential
    artifact that needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process launched the one that wrote this file, and is that parent chain expected on this host?
  context: The parent chain shows how the dump was driven — an interactive admin shell, a remote-execution service, or a scheduled
    task. Remote command execution as the ancestor (a transient service, a WMI-spawned process, or a shell launched from a network
    logon) points to hands-on credential theft rather than a local backup job. Known backup or maintenance parents can be treated
    as expected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Where did the responsible process write or move its output, and was the archive staged for transfer?
  context: NTDS staging typically ends with a cabinet or copy written to a working directory, then moved toward an exfiltration
    path — a share, removable media, or a location a network tool can reach. The files this process created reveal the staging
    location; pair that with outbound connections from the host to reconstruct whether the archive left the environment.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
- question: Has a file with this name appeared on this host before?
  context: All.cab and .ntds.cleartext are not names normal operations produce on a domain controller. A first-time appearance
    is far more suspicious than a recurring one; a recurring All.cab may belong to a scheduled backup that deserves confirmation
    rather than escalation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did files matching this name pattern appear on any other hosts in the environment?
  context: The same staging filenames across multiple hosts point to a repeated dumping routine — several domain controllers
    targeted, or an automated tool pushed across the fleet. A single host suggests a targeted, hands-on operation. The distribution
    and timing separate the two.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Credential theft is typically followed by lateral movement. This returns outbound connections from this host to
    remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the hours after the event, with the originating
    process and user. Two limits apply. Credentials replayed from another machine will not appear here (check logon events on
    suspected targets for these accounts), and if host network telemetry is not collected, treat zero rows as a visibility gap
    rather than proof of no movement.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts are exposed by this dump, and do any hold domain-wide privilege?
  context: A full NTDS.dit capture exposes every domain account — including Domain Admins, Enterprise Admins, and the krbtgt
    account whose hash enables forged Kerberos tickets. This is a domain-wide compromise requiring credential resets at scale,
    not a single-account monitoring case. Cross-reference the host's role and the responsible account against directory group
    memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user produced these staging filenames before, and does that history fit their role?
  context: This mirrors the rule's filename pattern scoped to the acting user over 90 days, aggregated by host — the user's
    own history of producing NTDS staging files, not generic file activity. A user who has never produced this pattern is more
    suspicious than one who does so as part of a documented backup role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \All.cab
        - .ntds.cleartext
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven these staging filenames here or across the environment, or is it new
    for this activity?
  context: When the write occurs under a service or machine account, user identity does not attribute the behavior; the launching
    process does. This mirrors the rule's filename pattern scoped to the alerting program over 90 days — a new or rare program
    for this pattern is the deviation worth chasing, while a program that already accounts for many prior events is backup or
    platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \All.cab
        - .ntds.cleartext
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: Tracking the acting user's activity across all hosts in the alert window reveals whether the dump is part of broader
    hands-on activity — reconnaissance, additional collection, or movement to other systems. Concentration on one host versus
    spread across many changes the scope of the response.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven staging pattern fire on other hosts in the same window?
  context: Under a service or machine account, user-pivot activity is dominated by routine agent noise. The meaningful question
    is whether the same launch mechanism produced these staging files elsewhere in the alert window — multiple hosts point to
    scheduled or pushed automation, a single host to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - \All.cab
        - .ntds.cleartext
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: The dump rarely happens in isolation. Activity in the minutes around the write — shadow-copy creation, registry
    hive saves, archive tooling, or the process ancestry that set it up — reconstructs the extraction sequence and the immediate
    context. Novel parent-child pairs at low counts are what to scan for against high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier alerts on the same host — reconnaissance, defense tampering, privilege escalation, or shadow-copy abuse —
    may reveal the stages that preceded credential staging and help place this event in the attack timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
