name: VsCode Powershell Profile Modification
id: f0b67371-4b0c-4feb-8f8e-b7a198a3e495
description: |
  Detects creation or modification of a Visual Studio Code PowerShell profile script (Microsoft.VSCode_profile.ps1).
  PowerShell profiles auto-execute every time a PowerShell session or a VSCode integrated terminal starts, so writing
  to one plants code that runs on each launch -- a common persistence and privilege-escalation mechanism (event-triggered
  execution). Legitimately, developers and administrators edit these profiles to customize their shell; investigate what
  process wrote the file, what the profile now contains, and whether a PowerShell session subsequently launched and ran it.
type: detection
detection_id: 3a9fa2ec-30bc-4ebd-b49e-7c9cff225502
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert correspond to a write to a VSCode PowerShell profile (Microsoft.VSCode_profile.ps1)?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and
    the operation performed (created or modified) against the rule's detection criteria. The rule fires on a single
    condition -- a file write whose path ends in Microsoft.VSCode_profile.ps1.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to create or modify a PowerShell profile script?
  context: Developers using VSCode legitimately edit their PowerShell profile to customize their shell, so a developer
    workstation editing this file is routine. The same write on a server, a kiosk, or an account that never uses PowerShell
    interactively is harder to explain. When the writer is a machine or service account, judge by the writing process and
    host role instead of the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote to the PowerShell profile, under what account, and what parent launched it?
  context: The writing process attributes the modification. Legitimate edits come from an interactive editor (Code.exe,
    powershell.exe, or notepad) run by the logged-in user. A profile that auto-runs is a privilege-escalation vector, so a
    write performed under Administrator or SYSTEM, or by a script host, a remote-execution tool, or an unexpected parent
    chain, is the deviation to chase. The file event carries the writer's ProcessGuid; this looks that process up to show
    its command line, account, and parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
      - ParentCommandLine
- question: What does the modified PowerShell profile script contain?
  context: The profile auto-runs on every PowerShell and VSCode-terminal launch, so its content is the payload. Read the
    actual script for added Import-Module calls, invocations of external binaries, download cradles (Net.WebClient,
    Invoke-WebRequest, Start-BitsTransfer), Invoke-Expression / IEX, or base64 and otherwise obfuscated strings. The file
    event only names the path and the writer -- the content itself must be retrieved from the endpoint or EDR.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: After the profile was modified, did a PowerShell session or VSCode terminal launch on this host?
  context: The profile only executes when a host application starts PowerShell without the -NoProfile flag, so a launch
    shortly after the modification is the persistence trigger firing. Check each launch's command line for -NoProfile (its
    presence means the profile did not load) and note the account the session ran under -- an elevated session executing a
    freshly modified profile is the privilege-escalation path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\Code.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- question: Was the command that modified the profile encoded or obfuscated, and what does it decode to?
  context: A profile can be written by an encoded PowerShell one-liner (-EncodedCommand / -enc) or by obfuscated
    Add-Content / Set-Content calls that hide what gets appended. Decode any base64 or concatenated content in the writing
    process's command line to recover the actual text placed in the profile. If the modification was made by an interactive
    editor (Code.exe, notepad) there is no command to decode -- the payload lives in the file content instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the profile script or the code it ran?
  context: Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, including profile
    scripts loaded at session start. Look for the profile path in the Path field and for the profile's contents in
    ScriptBlockText -- this is ground truth even when the on-disk file or the writing command was obfuscated. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence
    nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened around this time?
  context: A profile that auto-runs is only useful to an attacker if scripts are allowed to execute, so profile tampering
    is often paired with execution-policy changes, AMSI bypass, or a downgrade to PowerShell v2 (which lacks logging).
    Finding these precursor events on the host strengthens the case that the profile modification is malicious rather than
    a routine developer edit.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Is the modified profile still on disk, or was it deleted or reverted after the alert?
  context: A persistence profile is meant to stay in place, so a profile still on disk can be retrieved, hashed, and
    analyzed. A quick deletion or revert shortly after the write suggests test-and-clean activity or a tool that rewrites
    the file, and shifts the investigation toward what executed in between. Interpret the results by EventType.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the process that modified the profile write or delete around this time?
  context: A process that tampers with one profile often touches several -- additional profile variants, dropped modules,
    or staged payloads. The breadth, paths, and extensions of the writing process's other file activity distinguish a
    single edit from broader tampering and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the user's PowerShell profile directory recently, and by which processes?
  context: The PowerShell profile directory holds a small, stable set of profile scripts that the user and VSCode edit
    infrequently. Other recent arrivals -- additional profile variants (Microsoft.PowerShell_profile.ps1, profile.ps1),
    dropped modules, or writes by an unexpected process -- reveal whether this is an isolated edit or a location under
    active tampering.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Documents\PowerShell\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this PowerShell profile been modified before on this host, and by what processes?
  context: Profiles are edited infrequently, so a first-time or rare modification -- or a modification by a process other
    than the user's usual editor -- stands out against a developer's routine edits. The aggregation shows the historical
    write frequency for this profile on this host and the processes that performed those writes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user modified a VSCode PowerShell profile before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user -- the result is the user's 90-day history of this
    specific profile-write pattern, aggregated by host, not generic file activity. A user who has never produced this
    pattern is more suspicious than a developer who edits their profile regularly; weigh the count against the user's role
    and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \Microsoft.VSCode_profile.ps1
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this profile-write pattern on this host or across the environment,
    or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior -- the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the
    result is the 90-day history of this program producing this specific pattern. A new or rare program for this write is the
    deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \Microsoft.VSCode_profile.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals whether the profile modification is isolated or part of
    broader hands-on-keyboard activity. If the same user triggered similar changes on multiple endpoints in the same
    window, the scope of compromise may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven profile modification fire on other hosts in the same window?
  context: Under a service principal, asking what else the user did returns agent-telemetry noise. The meaningful question
    is whether the same launch mechanism modified this profile elsewhere -- the query mirrors the rule's selection scoped
    to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled
    or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: \Microsoft.VSCode_profile.ps1
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the profile write reveals the immediate
    context -- what led to it and what followed. Look for reconnaissance, privilege escalation, or additional persistence
    mechanisms clustered in the same window; novel parent-child pairs stand out at low counts against the aggregated
    routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal
    the attack stages that preceded the profile modification and help reconstruct the full timeline. Persistence is usually
    installed after an initial foothold, so a preceding execution or tampering alert reframes this write as a later stage.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
