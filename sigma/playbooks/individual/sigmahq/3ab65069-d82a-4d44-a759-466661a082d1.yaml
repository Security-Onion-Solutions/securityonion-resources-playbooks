name: Communication To LocaltoNet Tunneling Service Initiated
id: a9932210-f9ce-4cd8-8d6c-3d8c7a378e38
description: |
  Detects a process initiating an outbound connection to a LocaltoNet subdomain. LocaltoNet is a
  reverse proxy that exposes a localhost or private-network service to the internet without port
  forwarding, a static IP, or router configuration — the client runs on the host and the service
  relays external traffic back to it. Developers and support staff use it to demo local apps or
  reach devices behind NAT, but the same relay lets an implant receive command-and-control
  connections or move data out (T1572 protocol tunneling, T1090 proxy, T1102 web service) without
  attacker-owned infrastructure. The investigation identifies the connecting program, the specific
  LocaltoNet subdomain, whether the tunnel is sanctioned, and what rides through it.
type: detection
detection_id: 3ab65069-d82a-4d44-a759-466661a082d1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and direction match what this rule detects, an outbound connection to a LocaltoNet domain?
  context: |
    Confirm the alert from the destination hostname (a subdomain of localto.net or localtonet.com),
    the outbound direction, and the initiating process. The hostname field is sparsely populated on
    endpoint connection telemetry, so if it is empty here, recover the exact domain from the
    DNS-lookup question; if the event came from network-level telemetry it may carry the hostname
    but no process attribution, in which case the DNS and process questions supply the missing side.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user or host expected to use reverse-proxy tunneling services?
  context: |
    Legitimate LocaltoNet use concentrates in development and support workflows — demoing a local
    web server or API to a client, exposing a device behind NAT, or remote assistance. A developer
    workstation with a known demo habit reads differently from a server or a standard user's
    machine, where an outbound reverse-proxy tunnel has no routine explanation.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is tunneling through LocaltoNet authorized on this host?
  context: |
    Even where some tunneling is sanctioned, organizations typically approve specific services and
    hosts and keep an allowed-tools list. LocaltoNet not being on the approved list makes this
    either shadow IT — a user exposing an internal service to the internet outside policy — or
    attacker-deployed relay access. Both outcomes need action; they differ in urgency, which the
    rest of the investigation establishes.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a documented use case or support session explaining this tunnel?
  context: |
    A sanctioned tunnel usually traces to something concrete: a development demo, a helpdesk
    session, or a documented device-access procedure. Ask the user and check support records. No
    matching context means the tunnel was established by something other than the user's
    intentional workflow — malware or an unauthorized exposure of an internal service.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which LocaltoNet domains did this host resolve, and which process performed the lookups?
  context: |
    The DNS lookup carries the full subdomain and reliable process attribution even when the
    connection event lacks them. LocaltoNet accounts get subdomains under localto.net or
    localtonet.com — auto-generated on free tiers, custom on paid ones — so the subdomain hints at
    the account behind the relay. Repeated lookups over the day also show how long the tunnel has
    been active and whether it re-establishes on a schedule.
  range: -24h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
          - .localto.net
          - .localtonet.com
      condition: selection
    fields:
      - QueryName
      - Image
- question: What program established the tunnel, and what do its command line and working directory show?
  context: |
    LocaltoNet tunnels run through its client application, but any tunnel client or custom implant
    can carry the connection. The command line reveals the auth token, tunnel type, and forwarded
    port for a standard client; a renamed binary, a process running from a user-writable path, or a
    program with no visible tunnel configuration points at malware rather than a known tool.
    Well-known updaters and browsers are not expected sources of LocaltoNet traffic.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the tunnel client, and is that parent chain expected?
  context: |
    A user intentionally starting a tunnel produces an explorer.exe or shell parent; a tunnel
    client launched by a script interpreter, an Office application, a LOLBin, or a service is the
    lineage pattern of attacker-deployed proxy tooling. The parent's own command line shows what it
    was doing when it started the tunnel.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What do the specific subdomain and relay endpoint reveal about this tunnel?
  context: |
    The service itself is well known, so the verdict comes from the specifics: the subdomain
    identifies the account (custom-named subdomains suggest an established account; auto-generated
    ones fit throwaway use), the relay IP places it in the provider's hosting ranges, and the port
    shows what protocol rides the tunnel. LocaltoNet supports HTTP/S, raw TCP, TLS passthrough, and
    HTTP/SOCKS5 proxy tunnels, so the port is the main clue to whether this carries a demoed web
    service or an interactive proxy channel. Threat-intelligence lookups on the exact subdomain can
    surface prior reporting.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What does the connection pattern to this relay endpoint look like?
  context: |
    Connection cadence and count separate the use cases: a long-lived tunnel shows one or few
    persistent connections; command-and-control relay shows periodic reconnects at regular
    intervals; bulk data movement shows sustained, asymmetric outbound transfer, with volumes
    beyond roughly a megabyte in a few minutes exceeding what interactive control traffic needs.
    Watch the ports too — proxy-typical ports such as 1080, 8080, or 4444 alongside standard HTTPS
    suggest the tunnel carries something other than a demoed web service.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: What other external endpoints is the tunnel process connecting to?
  context: |
    The full destination set of the connecting process shows whether it talks only to the relay or
    also to other infrastructure — a second callback endpoint, a staging server, or additional
    tunnel services. A standard tunnel client should contact the provider's endpoints and little
    else; a broader destination set points at multi-channel malware.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What files did the tunnel process write or touch around the connection?
  context: |
    A reverse proxy that carries data out often leaves file traces first — archives staged for
    transfer, exported datasets, or configuration files the client wrote. File activity by the
    connecting process around the alert shows staging artifacts and the tunnel configuration
    itself; an archive appearing shortly before sustained outbound transfer is the
    collection-then-exfiltration sequence.
  range: -24h
  answer_sources:
  - file_event
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally communicate with this relay endpoint?
  context: |
    A tunnel that has run daily for months under the same process is an established workflow — still
    worth an authorization check, but not an emerging intrusion. A first-time connection, or history
    that starts abruptly in recent days, marks when the tunnel appeared and gives the timeline
    anchor for the rest of the investigation.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the connecting program?
  context: |
    A tunnel client that has run regularly under the same user for months supports the
    established-workflow reading; a program appearing on this host for the first time at the alert
    points at fresh tooling. The user grouping also shows whether the program runs under the
    interactive user or a service context.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Which other hosts resolve LocaltoNet domains?
  context: |
    Fleet-wide lookups of the service's domains show the true footprint: a handful of developer
    machines with distinct subdomains fits scattered individual use, while multiple hosts resolving
    the same subdomain, or servers with no development role appearing in the list, points at
    coordinated tooling. Each host found needs the same authorization check as this one.
  range: -7d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith:
          - .localto.net
          - .localtonet.com
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert place the tunnel in its surrounding
    sequence — collection tooling before it, interactive activity through it after. Novel low-count
    pairs stand out against repetitive agent noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — credential access, archive tooling, discovery commands — may capture the
    stages that preceded the tunnel: what the operator collected before moving it, or how the tunnel
    client arrived. The alert timeline reconstructs the sequence from foothold to relay.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
