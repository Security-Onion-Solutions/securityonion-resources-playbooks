name: Disable Windows Security Center Notifications
id: 275a2e25-e6ae-47c6-8ac9-49635a99f1ea
description: |
  Detects a registry write that sets the UseActionCenterExperience value under
  ...\CurrentVersion\ImmersiveShell to DWORD 0, which turns off Windows Security
  Center / Action Center notifications. Administrators and provisioning tooling
  sometimes disable these notification prompts, but adversaries also silence them
  to keep security warnings from surfacing while other activity proceeds
  (registry-based defense evasion, T1112). The investigation should confirm the
  exact key and value, identify the process that made the change and its lineage,
  and determine what the suppressed notifications may be concealing.
type: detection
detection_id: 3ae1a046-f7db-439d-b7ce-b8b366b81fa6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by checking that the modified key ends in
    ImmersiveShell\UseActionCenterExperience and the value data is DWORD (0x00000000),
    which switches off Windows Security Center notifications. The rule fires only when
    both the key path and the zero value are present, so verify both before spending
    further time, and note the writing process for attribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to disable Windows notification settings?
  context: >-
    Legitimate provisioning, imaging, or administrative tuning can toggle notification
    settings. Knowing whether the user role and host function are consistent with changing
    Security Center notification behavior is often the fastest way to separate a routine
    configuration change from tampering. User attribution is present on most endpoint
    registry events; when it resolves to a machine account or is missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this key a known evasion location, and what setting does the value change?
  context: >-
    The ImmersiveShell\UseActionCenterExperience value controls whether Windows surfaces
    Action Center / Security Center notifications; writing DWORD 0 disables them. This is a
    security-relevant setting rather than a payload path, so the intent to judge here is
    defense evasion — suppressing the prompts that would otherwise warn a user about
    protection state or detections. Confirm the exact key, the value data, and the process
    that wrote it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this key and what does it turn off?
  context: >-
    Read the Details field to confirm the written value. DWORD (0x00000000) on this key
    disables Security Center notifications; a non-zero value would re-enable them. Value
    data is recorded on roughly four in five registry modifications and may be absent for
    binary or empty writes, in which case corroborate the change from the writing process
    and surrounding registry activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the setting stay disabled, or was the value changed again after this write?
  context: >-
    Endpoint telemetry records registry writes but not key or value deletions, so attacker
    cleanup of the key is not directly observable. Judge whether the change is durable from
    the value's re-modification history in the window after the alert — whether the setting
    was left at zero, flipped back, or repeatedly rewritten — rather than looking for a
    deletion event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this value, and what started that process?
  context: >-
    The writing process and its lineage are the core attribution signal. A change pushed by
    a management or provisioning tool reads differently from the same value set by a script
    host, an Office child, or an unsigned binary. Trace the parent's own origin to see whether
    the chain looks like routine administration or an interactive or malicious session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who silences notifications often makes other changes at the same time — disabling
    protections, adding persistence, or adjusting policy. Grouping registry modifications on this
    host in the surrounding window shows what else was changed alongside the notification setting
    and whether multiple objectives were pursued in one session.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this registry key been modified before on this host?
  context: >-
    A first-time change to this value is more notable than a recurring one. Some hosts have this
    setting toggled by imaging or policy; others should rarely see it change. Comparing historical
    Details values and the writing process helps calibrate whether this write is routine or novel.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same registry key modified on other hosts in the environment?
  context: >-
    The same change across many hosts often points to a policy or software deployment, while a
    change confined to one host looks more targeted. Comparing the value data and writing process
    across hosts distinguishes a fleet-wide configuration push from isolated tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the registry write shows
    the immediate context — what ran before and after — and whether the notification change sits
    inside a broader sequence such as reconnaissance, protection tampering, or persistence setup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — protection tampering, reconnaissance, or credential
    access — may reveal the stages that preceded this change and help reconstruct the timeline.
    Suppressing notifications is frequently paired with other defense-evasion steps, so nearby
    alerts help place this event in the operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or approved maintenance window for this configuration change?
  context: >-
    Many organizations require a ticket for system configuration changes. A matching ticket suggests
    authorized imaging or tuning; the absence of one where policy requires it suggests the change was
    unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing the setting consistent with how the organization manages configuration?
  context: >-
    Organizations typically push settings like notification behavior through group policy or a
    management platform rather than an ad hoc local registry edit. A direct write by a script host or
    interactive process, outside the normal tooling, may indicate an operator bypassing standard
    procedures — or an admin taking a shortcut. Knowing the normal method helps separate the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host around this time?
  context: >-
    Disabling notifications can be preparation for activity the actor does not want surfaced. Check
    whether persistence tooling ran on the host in the surrounding window — scheduled tasks, services,
    registry edits, or BITS jobs launched close to the notification change point to intentional
    stacking rather than an isolated setting tweak.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or Run-key paths on this host around this time?
  context: >-
    File-based persistence bypasses command-line detection entirely, and a suppressed notification
    surface is exactly when such a drop would go unremarked. File events into a Startup folder or a
    path referenced by a Run key capture these drops even when the actor avoids the usual persistence
    tools.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
