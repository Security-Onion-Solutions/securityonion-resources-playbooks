name: Suspicious Explorer Process with Whitespace Padding - ClickFix/FileFix
id: c4067995-8d3f-4234-bb5d-1739d7e11208
description: |
  Detects a process spawned by explorer.exe whose command line contains a '#' character together with long runs of
  whitespace, a pattern consistent with the ClickFix and FileFix social-engineering techniques. In these techniques a
  user is lured into pasting a clipboard payload into the Run dialog or the File Explorer address bar; the visible portion
  is a benign-looking file path or comment, while extensive whitespace padding pushes the actual command (often a
  PowerShell one-liner) out of view to the right.
  Investigation should decode the full command line past the padding, confirm whether explorer.exe is the true parent
  and trace what launched it, identify any first-stage file drops or outbound connections, and determine whether the
  same user or host shows other signs of pasted-command execution.
type: detection
detection_id: 3ae9974a-eb09-4044-8e70-8980a50c12c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting command line show explorer.exe as the parent and contain a '#' followed by long whitespace padding?
  context: Confirm the alert is a true positive by reviewing the exact command line and parent process. The rule fires only
    when the parent ends in explorer.exe AND the command line contains both a '#' character and an extended run of whitespace.
    Verify the padding is present and read what sits to the right of it, since that is where the real command is hidden.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
- question: What is the full command hidden past the '#' and whitespace padding, and what operation does it perform?
  context: The visible left portion of the command line is a decoy file path or comment; the operational payload is pushed
    far to the right by the padding. Read the entire command line, decode any base64 or character-concatenation obfuscation,
    and identify what it does -- a download cradle, an in-memory loader, a file copy, or a local script. Resolve any URLs,
    file paths, or markers it references.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the command line, script, or payload encoded or obfuscated? What does it decode to, and what operation does the decoded content perform?
  context: 'Beyond the whitespace padding, pasted one-liners frequently layer additional concealment. Common encodings: base64
    (-enc / -EncodedCommand, FromBase64String), character concatenation, environment-variable substitution, and double-encoding.
    Decoding reveals the actual intent -- download cradles, reverse shells, credential theft, or in-memory loaders. Iterate
    decoding until the payload is readable.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Do other commands run on this host carry the same concealment markers -- a '#' followed by large whitespace runs?
  context: The whitespace-and-comment padding is a reusable concealment trick. Other processes on this host launched with the
    same '#'-plus-padding pattern point to repeated pasted-command execution rather than a single one-off, which raises the
    likelihood of an ongoing social-engineering chain.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - '#         '
          - '#       '
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to paste and run command-line one-liners from the File Explorer address bar or Run dialog?
  context: Pasting commands into the Explorer address bar or Run dialog is uncommon for most users and is the core delivery
    surface for these techniques. Knowing whether this user routinely performs such actions, and whether the host belongs to
    a role that would, is often the fastest way to separate a true positive from unusual but benign behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is explorer.exe the genuine parent here, and what spawned explorer.exe itself?
  context: The rule keys on explorer.exe as the parent, but in the address-bar variant a browser file-upload dialog can present
    as an Explorer-hosted window, and conhost.exe may sit between the address bar and the interpreter. Trace the parent's own
    origin to confirm this is an interactive Explorer session rather than a browser- or script-driven chain masquerading as one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same explorer.exe instance spawn around this time?
  context: If the Explorer session that launched this command also spawned other interpreters or helpers, the same parent
    instance reveals the full scope of pasted activity. Multiple suspicious children from one Explorer instance points to a
    multi-step pasted chain rather than a single command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does explorer.exe normally spawn this child binary on this host?
  context: explorer.exe legitimately launches many user-initiated applications, so the child binary is the discriminator. A
    command interpreter or script host spawned by explorer.exe with no prior history on this host is a stronger signal than a
    routinely launched application.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What web page, document, or message led the user to paste this command?
  context: These techniques begin with a lure -- a phishing page, shared document, or message instructing the user to open
    the Run dialog or File Explorer address bar and paste a "file path" that is actually a command. Identifying the originating
    page or message enables blocking it and finding other recipients who may have followed the same instructions. The browsing
    or mail activity immediately preceding the paste is the place to look.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did this process or its children make outbound connections shortly after execution?
  context: A pasted one-liner commonly fetches a follow-on stage from an external host or copies it from a local cache before
    egress. Outbound connections from this process or its descendants in the minutes after execution indicate a first-run
    egress and identify the remote infrastructure to block. Absence of egress fits the cache-smuggling variant, where the
    payload is read from an existing browser cache rather than downloaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- question: Did the pasted command drop or stage a file, and is it still on disk for analysis?
  context: The decoded command often writes a first-stage artifact into a user-writable path such as the user profile,
    %TEMP%, %APPDATA%, or %PUBLIC%, or assembles one from cached data (for example a staged archive or executable). Checking
    whether those files still exist on disk enables hashing, reputation lookup, and content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_explorer:
        ParentImage|endswith: \explorer.exe
        CommandLine|contains: '#'
      selection_space_variation:
        CommandLine|contains:
        - "\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000"
        - "\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001"
        - "\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002"
        - "\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003"
        - "\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004"
        - "\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005"
        - "\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006"
        - "\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007"
        - "\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008"
        - "\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009"
        - "\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A"
        - "\_\_\_\_\_\_\_\_\_\_\_\_"
        - '            '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_explorer:
        ParentImage|endswith: \explorer.exe
        CommandLine|contains: '#'
      selection_space_variation:
        CommandLine|contains:
        - "\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000"
        - "\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001"
        - "\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002"
        - "\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003"
        - "\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004"
        - "\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005"
        - "\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006"
        - "\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007"
        - "\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008"
        - "\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009"
        - "\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A"
        - "\_\_\_\_\_\_\_\_\_\_\_\_"
        - '            '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of this alert?
  context: Tracking the user's activity across all hosts in a tight window reveals whether the pasted command was an isolated
    event or part of broader activity spanning multiple endpoints. Repeated similar activity under the same user widens the
    likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_explorer:
        ParentImage|endswith: \explorer.exe
        CommandLine|contains: '#'
      selection_space_variation:
        CommandLine|contains:
        - "\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000\u2000"
        - "\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001\u2001"
        - "\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002\u2002"
        - "\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003\u2003"
        - "\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004\u2004"
        - "\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005\u2005"
        - "\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006\u2006"
        - "\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007\u2007"
        - "\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008\u2008"
        - "\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009\u2009"
        - "\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A\u200A"
        - "\_\_\_\_\_\_\_\_\_\_\_\_"
        - '            '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did this same detection fire for other users or hosts, indicating a phishing wave?
  context: These social-engineering campaigns rarely target a single user. Correlating the same detection across the
    environment reveals how many users were lured into pasting the command and identifies additional systems that need
    investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, defense tampering, or
    other execution events -- may reveal the stages that preceded this paste and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
