name: Lolbas OneDriveStandaloneUpdater.exe Proxy Download
id: 4062aec9-b387-4873-84b6-b7b1af86d568
description: |
  Detects a custom download URL being written to the registry value UpdateRingSettingURLFromOC under
  SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig. When this value points at an attacker-controlled URL, the
  signed OneDriveStandaloneUpdater.exe reads it and downloads a file to %localappdata%\OneDrive\StandaloneUpdater\,
  giving an ingress tool transfer (T1105) proxied through a trusted, signed binary with no anomalous command line.
  Legitimately this key is driven by OneDrive/Office update configuration; the investigation determines whether the
  value data is a non-Microsoft URL, whether the updater subsequently reached out and wrote a file, and whether any
  downloaded content was executed.
type: detection
detection_id: 3aff0be0-7802-4a7e-a4fa-c60c74bc5e1d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified registry key path match the OneDrive updater download-URL value this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path
    (TargetObject) against the rule's criterion — a value name ending in UpdateRingSettingURLFromOC under
    SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig. This is the value OneDriveStandaloneUpdater.exe reads to decide
    what URL to fetch from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change the OneDrive updater download-URL configuration?
  context: The UpdateRingSettingURLFromOC value is normally written by Microsoft OneDrive/Office update tooling, not by
    interactive users or unrelated processes. Knowing whether the writing process and account are consistent with routine
    update activity is often the fastest way to separate a genuine config push from an attacker redirecting the updater.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What URL was written into this registry value, and is it a Microsoft-controlled host?
  context: The value data (Details) is the download URL OneDriveStandaloneUpdater.exe will fetch from — it is the primary
    IOC for this rule. Decode it and compare the host against Microsoft's own update endpoints. A non-Microsoft or
    otherwise unexpected URL means the signed updater is being used to proxy-download attacker-chosen content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the UpdateRingSettingURLFromOC value a known living-off-the-land download-redirect location?
  context: This value under SOFTWARE\Microsoft\OneDrive\UpdateOfficeConfig is a documented abuse point — setting it to a
    custom URL makes the signed OneDrive updater retrieve a file from the Internet without any anomalous executable or
    command line. Confirm the writing process (Image) and value data are consistent with that redirect pattern rather than
    a legitimate update ring change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were the companion OneDrive updater values set on this host in the same window?
  context: The proxied download only fires when several values are set together — the URL value alongside
    ODSUUpdateXMLUrlFromOC, UpdateXMLUrlFromOC, and a large UpdateOfficeConfigTimestamp QWORD that marks the URL cache as
    fresh. Finding these companion writes from the same process in the same window confirms the technique was fully staged
    rather than a single incidental value change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the custom URL value persist, or was it overwritten after the download was triggered?
  context: Registry value deletion is not directly observable in this telemetry, so persistence is judged from the value's
    re-modification history rather than a removal event. A value that is set, used to trigger a fetch, then quickly
    overwritten back to a Microsoft URL points to deliberate cleanup; a value that remains points at ongoing redirect of
    the updater.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this OneDrive updater URL value been modified before on this host?
  context: First-time modification of this value is more suspicious than a recurring one. Compare historical Details values
    to see whether the same Microsoft URL is set routinely by update tooling or whether this is the first time the value
    has been pointed anywhere. Zero history indicates a value that has never been touched before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What process wrote this registry value, and what parent chain launched it?
  context: The writing process reveals how the redirect was staged. A legitimate change comes from OneDrive/Office update
    components with predictable parents; an interactive shell, script host, or Office application writing this value points
    at hands-on staging of the download.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did OneDriveStandaloneUpdater.exe make an outbound connection after the URL value was set?
  context: The proxied download is an outbound connection made by the signed updater to the host named in the URL value.
    Surfacing the updater's egress connections around the alert confirms whether the fetch actually happened and to which
    destination; an external, non-Microsoft IP or hostname is the delivery leg of the transfer. Note whether the
    destination is an internal or an external address block.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\onedrivestandaloneupdater.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did OneDriveStandaloneUpdater.exe write a downloaded file into its StandaloneUpdater directory?
  context: A successful proxied download lands as a file under %localappdata%\OneDrive\StandaloneUpdater\ (the documented
    drop is PreSignInSettingsConfig.json), written by the updater itself. A write there timed to the URL change confirms
    content was retrieved; the drop path and file are the artifact to retrieve for analysis.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\onedrivestandaloneupdater.exe'
        TargetFilename|contains: '\OneDrive\StandaloneUpdater\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the process that set the registry value or its children write any files to disk?
  context: Beyond the updater's own drop, the process that staged the redirect may itself write files — a stager, a
    companion config, or a second-stage download. This correlates file writes to the registry-writing process and its
    direct children, establishing whether the delivery progressed past setting the value.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did OneDriveStandaloneUpdater.exe run after the URL value was set?
  context: The redirect only takes effect when the updater actually executes and reads the cached URL. Confirming the
    updater ran after the value change — and what it spawned — establishes whether the configured download was acted on
    rather than merely staged.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: If any downloaded content was executed, what is its hash and is it known to threat intelligence?
  context: The proxied download typically fetches non-executable content, so an execution hash may not exist — in that case
    retrieve the file from the on-disk drop path and hash it manually. If a payload was executed, its hash is recorded on
    the execution event; this returns the processes the writer and its shell spawned, with their executable hashes, for a
    reputation lookup.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What other process activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Aggregating the process activity around the value change reveals the immediate
    context: what staged the redirect, what ran after, and whether it is part of a larger sequence. Novel parent-child pairs
    stand out at low counts against routine, high-count agent noise.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this OneDrive updater URL value modified on other hosts in the environment?
  context: The same value set across many hosts may indicate a legitimate configuration push; the same non-Microsoft URL
    across several hosts indicates a widespread redirect. A modification isolated to this one host is more consistent with
    targeted use of the updater. Compare Details values across hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or execution of a stager — may reveal
    the stages that preceded the redirect and help reconstruct the timeline leading to the proxied download.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
