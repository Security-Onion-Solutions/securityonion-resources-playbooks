name: Arbitrary File Download Via MSPUB.EXE
id: 2b25839f-d154-4ab4-b3c9-160c0432cbdf
description: |
  Detects Microsoft Publisher (MSPUB.exe) running with a URL argument (ftp, http, or https) on its command line. MSPUB is a Microsoft-signed Office component that fetches a remote URL passed as a positional argument and writes the payload into the user's INetCache directory, so an operator can stage a download through a trusted, allow-listed binary without using a browser or a known download tool. The rule fires only when both the Office binary (Image ending in MSPUB.exe or OriginalFileName MSPUB.exe) AND a URL pattern in the command line are present; investigation should confirm the URL and destination, identify the parent that launched MSPUB, verify whether the payload landed and what it is, and determine whether this user, host, and parent normally drive this activity.
type: detection
detection_id: 3b3c7f55-f771-4dd6-8a6e-08d057a17caf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this alert show MSPUB.exe running with a ftp, http, or https URL on its command line?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions hold together — the process is MSPUB.exe (Image ending in MSPUB.exe or OriginalFileName MSPUB.exe) AND the command line contains a ftp, http, or https URL. Read the exact command line and process identity against those two criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to fetch remote URLs through Microsoft Publisher?
  context: Legitimate users rarely invoke MSPUB.exe with a URL argument; the binary is an Office authoring application, not a download utility. Knowing whether this user role and host function would plausibly drive command-line URL retrieval through an Office binary is often the fastest way to separate a routine action from operator misuse of a signed LOLBin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What URL did MSPUB.exe fetch, and what does the full command line reveal about the requested payload?
  context: The command line carries the URL passed to MSPUB as its positional argument and any additional flags. Decode the full URL — scheme (ftp, http, https), host, path, and file extension of the requested object — to understand what was requested and where it was retrieved from. The download lands in the user's INetCache directory by default, so the command line is the primary record of the requested resource.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the download destination, and what do DNS, WHOIS, and threat intel reveal about it?
  context: Investigate the outbound destination that MSPUB contacted — resolution history, registration age, TLS certificate details, and known threat-intel hits. Outbound network traffic from an Office binary to a non-Office destination (a raw IP, a code-hosting raw URL, or a recently registered domain) is the cleanest signal here, since the downloaded file lands in a directory that browsers and Office processes also write to and does not stand out by path alone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Does this host normally make outbound connections from MSPUB.exe to this destination?
  context: First-time connections to a destination are more suspicious than routine traffic. MSPUB rarely originates outbound network connections at all, so a baseline that shows zero or near-zero prior connections from this binary on this host strengthens the case that the URL retrieval is operator-driven rather than a normal Office feature reaching a Microsoft endpoint.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Did the download succeed? Check for file creation by MSPUB.exe in the INetCache directory.
  context: A download command does not guarantee the file was retrieved — network errors, blocked URLs, or security controls may have stopped the transfer. MSPUB writes the fetched payload into the user's INetCache directory under a random subfolder and name, so confirming a file-creation event by MSPUB establishes whether the operation progressed past delivery.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file MSPUB downloaded was executed, what is its hash and does it have known threat-intel detections?
  context: MSPUB fetches the file into the shared INetCache directory, where path alone does not distinguish it from browser/Office writes — and file-creation events carry no hash anyway. The hash is recorded when the payload runs, so this query returns MSPUB's child and sibling processes with their executable hashes; if the downloaded file was executed as part of the same activity, it appears here. If it was run later by an unrelated process, retrieve it from INetCache and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What process spawned MSPUB.exe, and is that parent chain expected for a URL download?
  context: The parent process reveals how MSPUB was invoked. A user double-clicking a document yields a familiar interactive parent; a launch from cmd.exe, powershell.exe, wscript.exe, or another Office application (Word, Excel, PowerPoint, Outlook) rather than the normal UI path indicates scripted or macro-driven invocation, which is the pattern that turns a signed Office binary into a download proxy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run MSPUB.exe at all?
  context: MSPUB is an Office authoring application and is uncommon on most endpoints, especially with a URL argument. A historical count of zero or very low executions on this host indicates first-time or rare use and raises the priority of the alert; a regular cadence may point to a specific user who authors publications.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even Microsoft-signed binaries can be abused. This query mirrors the rule's selection structure scoped to this host — the resulting parent and user distribution reflects how the rule's specific firing pattern (MSPUB plus a URL argument), not generic MSPUB usage, has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSPUB.exe
      - OriginalFileName: MSPUB.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did MSPUB.exe spawn afterward?
  context: The processes spawned by MSPUB after the download reveal whether the fetched payload was executed. MSPUB has no legitimate need to launch command interpreters or scripting hosts; children such as cmd.exe, powershell.exe, rundll32.exe, regsvr32.exe, or certutil.exe shortly after the URL retrieval indicate the downloaded payload was run, advancing the operation from delivery to execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern (MSPUB plus a URL argument), not generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSPUB.exe
      - OriginalFileName: MSPUB.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSPUB.exe
      - OriginalFileName: MSPUB.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSPUB.exe
      - OriginalFileName: MSPUB.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar download or execution activity on more than one host, the scope of the operation may be broader than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSPUB.exe
      - OriginalFileName: MSPUB.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded a download via a signed Office binary and help reconstruct the timeline leading to payload delivery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
