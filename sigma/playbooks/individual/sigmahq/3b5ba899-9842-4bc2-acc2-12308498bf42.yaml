name: Office Application Initiated Network Connection Over Uncommon Ports
id: 622fa6c6-889c-418c-817f-cdd6a065ff73
description: |
  Detects a Microsoft Office application (winword.exe, excel.exe, powerpnt.exe, outlook.exe,
  or wordview.exe) initiating an outbound network connection on a port outside the common set
  the rule allows (53, 80, 139, 389, 443, 445, 3268, plus the standard mail ports for Outlook
  running from the installed Office directory). Office productivity applications normally reach
  the network only for document rendering, Office 365 services, and mail, all of which use those
  common ports, so an egress on an uncommon port is unusual. Malicious documents and macro or
  exploit payloads frequently make the office process itself the network client — reaching
  command-and-control or a staging host on a non-standard port. Investigation should confirm the
  office process really initiated the connection, decode and reputation-check the destination and
  port, and determine whether the office process opened an untrusted document, spawned child
  processes, or wrote payload files that would separate a real exploit from a benign plugin or
  add-in reaching an internal service.
type: detection
detection_id: 3b5ba899-9842-4bc2-acc2-12308498bf42
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Did an Office application initiate this outbound connection, and is the destination port outside the rule's allowed set?
  context: Confirm the alert against the rule's criteria. The initiating process should be one of
    winword.exe, excel.exe, powerpnt.exe, outlook.exe, or wordview.exe, and Initiated should be
    true (the office process opened the connection rather than receiving it). The rule allows the
    common web, directory, and file-sharing ports (53, 80, 139, 389, 443, 445, 3268) and the
    standard mail ports for Outlook running from the installed Office directory, so the alerting
    connection is to some other port. The query anchors on the destination the alert fired on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to have an Office application make an outbound connection on an uncommon port?
  context: Legitimate cases exist — a line-of-business add-in reaching an internal application
    server, a plugin update service, or a corporate mail gateway on a non-standard port. Knowing
    whether this host runs such tooling and whether the user's role fits is often the fastest way
    to separate a sanctioned integration from an exploited document. A general workstation whose
    Office install has no reason to talk to an odd port is harder to explain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is this destination, and what do DNS, WHOIS, and threat intel reveal about it?
  context: Investigate the destination address and port. Check registration age, hosting provider,
    passive DNS history, TLS certificate details, and any threat-intel reputation. A recently
    registered domain, a self-signed certificate, a raw IP with no PTR record, or a known
    command-and-control host points to attacker-controlled infrastructure. Destination hostname is
    only sparsely recorded on connection events, so treat an empty hostname here as expected and
    resolve the address from DNS history instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: How was the Office application launched, and what document did it open?
  context: The office process's own launch record shows its parent and command line. The command
    line usually carries the path of the document that was opened, and the parent shows how it was
    reached — a mail client, browser, archive tool, or script host handing a file to Office is the
    common delivery path for a weaponized document. A document opened from a mail attachment
    directory, a download folder, or a temporary extraction path is more suspect than one from a
    known project share.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Did the Office application spawn any child processes around the time of the connection?
  context: Office applications opening a document do not normally spawn command interpreters or
    script hosts. Children such as cmd.exe, powershell.exe, wscript.exe, cscript.exe, mshta.exe,
    rundll32.exe, or regsvr32.exe under an office parent are the signature of macro or exploit
    execution, and they often carry out the download or staging that the observed connection is
    part of. A clean result with no unusual children weakens the exploit reading.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Office application write any executable or script files to disk around this time?
  context: A document that reaches the network on an odd port is frequently downloading or staging
    a payload. Files written by the office process — especially under TEMP, APPDATA, ProgramData,
    the public profile, or a startup location, or carrying executable or script extensions — are
    the artifact of that stage. Office normally writes only documents, autosave copies, and cache
    files to expected working directories, so an executable or script drop is the notable case.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What domains did this host resolve shortly before the connection, and which process requested them?
  context: Because the destination hostname is rarely recorded on the connection event itself, the
    domain behind the destination address is best recovered from the host's DNS lookups just before
    the connection. A lookup requested by the office process, or a lookup for a newly seen or
    algorithmically generated domain that resolves to the destination, identifies what the office
    application was actually reaching. Correlate the timing and the requesting process with the
    alerting connection.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally communicate with this destination?
  context: A first-time connection to a destination is more suspicious than routine communication.
    A destination this host has reached many times, on consistent ports, is more likely part of an
    existing integration; zero or very low history points to newly introduced infrastructure. The
    port breakdown shows whether the uncommon port is a one-off or an established pattern for this
    host and destination.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What destinations and ports does this Office application normally reach on this host?
  context: Profiling the alerting office application's own connection history on this host shows
    whether reaching non-standard ports is part of its normal behavior — a bundled add-in that
    routinely talks to an internal service on a fixed port looks different from a one-off egress to
    a new address. A tight, repeated set of internal destinations reads as an integration; a single
    novel external destination on an odd port stands out against that baseline.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Have other hosts connected to this same destination, and were those connections also from Office applications?
  context: Pivoting on the destination address across the environment shows whether this is an
    isolated event or shared infrastructure that several hosts reached. Multiple hosts connecting to
    the same address — particularly other office processes on the same uncommon port — points to a
    campaign against several endpoints or a common malicious document; a single host points to a
    host-local trigger. The process breakdown distinguishes office-driven egress from unrelated
    traffic to the same address.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - Image
      - DestinationPort
- question: When this host has previously fired the rule's pattern, what programs and users drove that activity, and does the current alert fit?
  context: Even common applications can be abused. The query mirrors the rule's selection structure
    scoped to this host, so the resulting application and user distribution reflects how this specific
    firing pattern — an Office application reaching an uncommon port — has historically run here, not
    generic Office usage. An Office application new to this pattern, an unexpected user account, or a
    first-time appearance is the deviation worth chasing; network events lack parent lineage, so pivot
    to the application's start event if the launcher matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith:
        - \excel.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        - \wordview.exe
      filter_main_common_ports:
        DestinationPort:
        - 53
        - 80
        - 139
        - 389
        - 443
        - 445
        - 3268
      filter_main_outlook_ports:
        Image|contains: :\Program Files\Microsoft Office\
        Image|endswith: \OUTLOOK.EXE
        DestinationPort:
        - 143
        - 465
        - 587
        - 993
        - 995
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the same firing pattern — Office applications reaching uncommon ports — not
    generic Office network usage. Many hosts firing the same pattern points to a shared add-in,
    plugin update mechanism, or vendor automation; one host or a small unrelated set points to
    targeted or manual activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith:
        - \excel.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        - \wordview.exe
      filter_main_common_ports:
        DestinationPort:
        - 53
        - 80
        - 139
        - 389
        - 443
        - 445
        - 3268
      filter_main_outlook_ports:
        Image|contains: :\Program Files\Microsoft Office\
        Image|endswith: \OUTLOOK.EXE
        DestinationPort:
        - 143
        - 465
        - 587
        - 993
        - 995
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the connection reveals
    what led to it and what followed — reconnaissance, credential access, or persistence that gives
    the office-initiated egress broader context. Aggregating by process and parent collapses routine
    agent noise into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — phishing or
    document-delivery signals, defense tampering, reconnaissance, or credential access — may reveal
    the stages that preceded this connection and help reconstruct the timeline. An office process
    reaching command-and-control is often a mid-chain step rather than the start.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
