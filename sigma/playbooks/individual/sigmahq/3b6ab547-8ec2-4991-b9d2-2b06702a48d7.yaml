name: PowerShell Download Pattern
id: 05680074-2c4b-4958-8dd9-16c8433b6ad8
description: |
  Detects a PowerShell process (powershell.exe, powershell_ise.exe, or pwsh.exe) whose command line
  contains a Net.WebClient download-cradle pattern: the rule fires when the binary is a PowerShell host
  AND the command line contains all of 'new-object', 'net.webclient).', and 'download' together with
  either 'string(' or 'file('. This is the canonical fileless download cradle — (new-object
  net.webclient).downloadstring(...) or .downloadfile(...) — used to fetch and execute remote script or
  binary payloads directly in memory. Legitimate administrative scripts occasionally use this idiom, so the
  investigation should decode the cradle to identify the source URL, determine what was fetched and whether
  it ran, and confirm whether the user, host, and parent process are expected to invoke command-line
  downloaders.
type: detection
detection_id: 3b6ab547-8ec2-4991-b9d2-2b06702a48d7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the Net.WebClient download cradle this rule detects?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires only
    when a PowerShell host binary runs with a command line containing all of 'new-object',
    'net.webclient).', and 'download' plus either 'string(' or 'file(' — the .downloadstring or
    .downloadfile cradle. Review the full command line and confirm the Image is powershell.exe,
    powershell_ise.exe, or pwsh.exe and that the cradle fragments are actually present and not a benign
    coincidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files via command-line PowerShell?
  context: Legitimate administrative scripting and software-deployment tooling can produce Net.WebClient
    download calls. Knowing whether the user role and host function routinely involve command-line
    downloaders is often the fastest way to separate routine automation from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this PowerShell command do? Decode the cradle and identify the source URL and
    destination.
  context: The full command line reveals the specific download action. Identify the remote URL passed to
    DownloadString or DownloadFile, the local path any payload is written to, and whether the fetched
    content is piped into Invoke-Expression for in-memory execution. The query scopes to all PowerShell
    host executions on this host within the window because a download cradle is frequently one stage of a
    longer scripted sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does the cradle decode to?
  context: PowerShell download cradles are routinely hidden with backtick escaping, string concatenation,
    format-string operators, and cmdlet-name splitting (for example .("new-"+"o"+"bject")), or wrapped in
    a base64 -EncodedCommand. Deobfuscate the command line to recover the literal source URL and the
    DownloadString/DownloadFile target, then check the URL reputation and determine whether the fetched
    content was executed in memory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated cradle content?
  context: Script block logging (Event ID 4104) records the deobfuscated script PowerShell actually
    executes, giving ground truth about the cradle even when the command line is obfuscated. Look for the
    resolved DownloadString/DownloadFile call and any Invoke-Expression that runs the fetched content. If
    PowerShell operational logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or endpoint security controls bypassed or weakened on this host before the
    download ran?
  context: Operators often weaken protection before fetching a payload — patching AMSI, disabling Defender
    real-time monitoring, or relaxing execution policy. Finding these precursor events on the host in the
    hour before the cradle strengthens the case for malicious intent. This query also surfaces AV/EDR
    tamper attempts on the host, so a separate generic tamper sweep is not needed.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how the cradle was launched. Download cradles are frequently spawned
    by Office applications, mshta.exe, wscript.exe, or macro-bearing documents rather than an interactive
    shell or explorer.exe. An unusual or document-borne parent shifts the disposition toward user-execution
    of a malicious lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this host load the .NET automation assemblies that indicate in-memory PowerShell execution
    around the alert?
  context: PowerShell download cradles can run through .NET automation rather than the powershell.exe
    console, and fetched assemblies may be loaded directly into memory via Reflection.Assembly::Load.
    Loads of System.Management.Automation, clr.dll, or mscoree.dll into a non-PowerShell host, or
    never-before-seen assemblies, point to fileless or hosted execution that the process command line
    alone would not reveal. If image-load events are not ingested in this environment, treat zero results
    as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|contains:
          - '\System.Management.Automation'
          - '\clr.dll'
          - '\mscoree.dll'
          - '\mscorlib'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
- question: What outbound network connections did this host make around the alert, and do any match the
    cradle's source URL?
  context: The download cradle's purpose is to fetch a remote payload, so the in-memory cradle is normally
    followed by an outbound HTTP or HTTPS connection to the URL recovered from the command line. Correlate
    the destination addresses here against the URL decoded from the cradle, and check the reputation of any
    external host the PowerShell process reached.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What child processes did this PowerShell instance spawn afterward?
  context: A download cradle's actual impact shows in what it executes next. A fetched payload written to
    disk and run, or an in-memory loader spawning cmd.exe, rundll32.exe, or a second PowerShell stage,
    reveals post-download execution. Predictable, signed children point to benign automation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this download-cradle pattern, what parents and users drove
    it, and does the current alert fit?
  context: Even routine tooling can produce Net.WebClient calls. This query mirrors the rule's full
    selection scoped to this host, so the resulting parent and user distribution reflects how this specific
    cradle pattern has historically run here — not generic PowerShell usage. A new parent, an unexpected
    user, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - new-object
        - net.webclient).
        - download
        CommandLine|contains:
        - string(
        - file(
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this download-cradle pattern in the past week, and does the cross-host
    distribution look like automation or one-off activity?
  context: This query mirrors the rule's full selection with no host scope, so the result is a fleet-wide
    count of this specific cradle pattern rather than generic PowerShell usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to
    manual operator activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - new-object
        - net.webclient).
        - download
        CommandLine|contains:
        - string(
        - file(
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - new-object
        - net.webclient).
        - download
        CommandLine|contains:
        - string(
        - file(
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - new-object
        - net.webclient).
        - download
        CommandLine|contains:
        - string(
        - file(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar download activity on several hosts, the scope of
    the operation may be larger than a single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell_ise.exe
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell_ISE.EXE
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - new-object
        - net.webclient).
        - download
        CommandLine|contains:
        - string(
        - file(
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to the download cradle, what happened after, and whether it is part of a larger
    sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms running near the
    alert time.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access —
    may reveal the attack stages that preceded the download cradle and help reconstruct the full timeline.
    A delivery or user-execution alert shortly before this one would corroborate a multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
