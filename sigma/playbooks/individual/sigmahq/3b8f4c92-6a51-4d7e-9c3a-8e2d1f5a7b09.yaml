  question: Has this program historically driven this rule's pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior; the meaningful pivot is the launch mechanism. This query mirrors the rule's selection structure scoped to the alerting program, giving the 90-day history of that program driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is routine automation.
