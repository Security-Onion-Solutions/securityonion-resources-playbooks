name: Uncommon File Created by Notepad++ Updater Gup.EXE
id: 3b7b2078-2870-46c9-9b71-15583ac8aead
description: |
  Detects the Notepad++ updater gup.exe creating a file that does not fall inside the known-good update, install, temporary-installer, or plugin paths. The updater legitimately writes signed installers (npp*.Installer.exe) and update archives (.zip) under the user Temp directory and program files under the Notepad++ install tree; a write elsewhere is uncommon. The pattern is consistent with a hijacked update channel, where an attacker intercepting the updater's traffic causes gup.exe to fetch and drop a tampered binary instead of the legitimate update, which then commonly sideloads an unsigned DLL and beacons to an unapproved host. Legitimate causes include portable or custom Notepad++ installs in non-standard directories. Determine what gup.exe wrote, whether it is an executable/DLL rather than a normal update artifact, whether it executed, and whether the updater reached anything other than the approved update endpoints.
type: detection
detection_id: 3b8f4c92-6a51-4d7e-9c3a-8e2d1f5a7b09
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file's path and the gup.exe process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when gup.exe creates a file outside the known Notepad++ update, install, temporary-installer, generic-zip, recycle-bin, and plugin paths. Review the exact TargetFilename and the responsible process against those criteria; a write into the Notepad++ install tree or the standard npp*.Installer.exe / .zip temp artifacts is expected and benign.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to run Notepad++ and its updater, and is the writing account consistent with that?
  context: Legitimate updater activity is normal on developer or general-user endpoints that have Notepad++ installed. Knowing whether the host is expected to run Notepad++ and whether the writing user matches routine use is often the fastest way to separate a normal (if oddly-located) update from a tampered one. When the user is a machine or service account, judge by the host role and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What file did gup.exe create, and is it an executable, DLL, script, or archive rather than a normal update artifact?
  context: The updater legitimately drops signed npp*.Installer.exe and .zip update packages under the user Temp directory and program files under the Notepad++ tree (the ProgramPaths the rule allow-lists). A dropped .exe, .dll, or script in another location is the artifact of interest. Read the file name and extension here; actual content analysis (embedded strings, imports, packer or obfuscation markers, signing status) requires retrieving the file from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What operation did the updater perform -- decode gup.exe's full command line and any payload path or URL it references?
  context: A hijacked update channel redirects the updater to download and run an attacker-supplied binary in place of the legitimate update, which is where adversary-in-the-middle interception of the update traffic turns into code execution. Decode gup.exe's command line to understand what it was invoked to do and whether it references a downloaded-payload path or update source. The command line is read from the process event that shares this ProcessGuid.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If the created file has executed, what is its hash and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so file-creation events carry no hash. This query looks for the dropped file executing by its name and reads the hash; submit that to reputation and threat-intel sources to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What child processes did gup.exe spawn after the file was written?
  context: On a tampered update, the dropped payload runs on first use, so the updater's children are the pivot from a file write to execution. The updater's only expected children are explorer.exe and npp* installer processes; unexpected children such as cmd.exe, powershell.exe, rundll32.exe, or a renamed binary point to first-run of a tampered payload. Correlate children within a short window of the write (roughly 90 minutes covers write to first run).
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What DLLs did gup.exe load around the alert, and are any unsigned or signed by an unexpected publisher?
  context: Tampered-update payloads commonly gain execution through DLL sideloading -- a legitimate or renamed binary loads an attacker-supplied unsigned DLL from the drop directory. The genuine updater and installer binaries carry a valid code-signing signature from the expected publisher (the ApprovedSigners baseline); an unsigned or unexpectedly-signed module loaded by the updater is the anomaly. The signature status and hash are recorded on the load event itself, so the hash can be checked directly against reputation sources.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What outbound network connections did gup.exe make around the time of the alert?
  context: The updater should only reach its approved update endpoints (the vendor site, the code-hosting domain, and the release-asset host). A connection to any other destination in the window around the file write indicates the update traffic was hijacked to an attacker-controlled server, which is the delivery step of a tampered update and the network side of adversary-in-the-middle interception. Resolved hostnames are frequently absent because name resolution is a separate event -- anchor on the destination IP and pivot to the DNS lookup for the domain.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What other files did gup.exe or its child processes create or delete around the alert?
  context: A tampered updater often drops several files -- an installer plus its sideloaded components, or a payload plus its staging artifacts. The breadth, paths, and extensions of the process's other file activity distinguish a single odd write from a staged payload and enumerate what else needs review. Watch for writes into hidden or unusual per-user application-data subfolders, a common staging location.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file with this name been created on this host before, or is this its first appearance?
  context: A file that has never been seen on the host is more suspicious than one that recurs as part of normal operation. First-time appearance of this artifact supports the tampered-update hypothesis; a recurring name may reflect a benign, if oddly-located, updater behavior. Zero or very low historical counts indicate a new or rare file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: Even a routinely-present updater can be abused. This query mirrors the rule's selection structure scoped to this host, so the resulting program and user distribution reflects how the rule's specific firing pattern -- not generic gup.exe activity -- has historically run here. A new acting program process, an unexpected user, or an unusual write location relative to that history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \gup.exe
      filter_main_legit_paths:
        TargetFilename|startswith:
        - C:\Program Files\Notepad++\
        - C:\Program Files (x86)\Notepad++\
      filter_main_temp_update_installer:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - npp.
        - .Installer.
        - .exe
      filter_main_temp_generic_zip:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip
      filter_main_recycle_bin:
        TargetFilename|startswith: C:\$Recycle.Bin\S-1-5-21
      filter_main_plugins:
      - TargetFilename|contains:
        - \plugins\JsonTools\testfiles\
        - \Notepad++\plugins\ComparePlugin\
      - TargetFilename|contains|all:
        - npp.
        - .portable.
        - \plugins\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this rule's pattern in the past week, and does the cross-host distribution look like a pushed update or isolated activity?
  context: This query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of the rule's firing pattern rather than generic updater usage. Many hosts producing the same pattern in a narrow window points to a hijacked update server serving the malicious payload to many clients; a single host or a small unrelated set points to a host-local trigger. Use the host distribution to calibrate scope and severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \gup.exe
      filter_main_legit_paths:
        TargetFilename|startswith:
        - C:\Program Files\Notepad++\
        - C:\Program Files (x86)\Notepad++\
      filter_main_temp_update_installer:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - npp.
        - .Installer.
        - .exe
      filter_main_temp_generic_zip:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip
      filter_main_recycle_bin:
        TargetFilename|startswith: C:\$Recycle.Bin\S-1-5-21
      filter_main_plugins:
      - TargetFilename|contains:
        - \plugins\JsonTools\testfiles\
        - \Notepad++\plugins\ComparePlugin\
      - TargetFilename|contains|all:
        - npp.
        - .portable.
        - \plugins\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- always_include: true
  question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: This query mirrors the rule's selection structure scoped to this user, giving the user's 90-day history of the rule's specific firing pattern (not generic updater use), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith: \gup.exe
      filter_main_legit_paths:
        TargetFilename|startswith:
        - C:\Program Files\Notepad++\
        - C:\Program Files (x86)\Notepad++\
      filter_main_temp_update_installer:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - npp.
        - .Installer.
        - .exe
      filter_main_temp_generic_zip:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - .zip
      filter_main_recycle_bin:
        TargetFilename|startswith: C:\$Recycle.Bin\S-1-5-21
      filter_main_plugins:
      - TargetFilename|contains:
        - \plugins\JsonTools\testfiles\
        - \Notepad++\plugins\ComparePlugin\
      - TargetFilename|contains|all:
        - npp.
        - .portable.
        - \plugins\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
