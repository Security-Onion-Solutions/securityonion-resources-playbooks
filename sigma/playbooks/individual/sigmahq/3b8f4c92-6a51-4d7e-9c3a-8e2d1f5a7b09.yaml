- question: Is Notepad++ on this host updated to a version that verifies the signature of downloaded installers?
  context: The updater weakness that let hijacked traffic deliver an unsigned binary was addressed by hardening the updater to verify the signature and certificate of downloaded installers before running them. An outdated Notepad++ installation confirms the host was exposed to the tampered-update path and indicates other similarly outdated systems are at risk. Verify the installed version against the release that introduced installer-signature verification.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, defense tampering, or other execution -- may reveal the stages that preceded this event and help reconstruct the timeline of how a tampered update took hold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the same detection fire on other hosts, indicating a broader tampered-update rollout?
  context: A hijacked update server can serve the malicious payload to many clients that check for updates in the same window. Correlating this rule across all hosts shows how many systems produced the same updater behavior and identifies additional endpoints that need investigation. Multiple hosts firing points to a fleet-wide exposure rather than an isolated event.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
