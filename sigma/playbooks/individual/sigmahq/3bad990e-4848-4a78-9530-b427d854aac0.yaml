name: Domain Trust Discovery Via Dsquery
id: dfade1f8-b202-4497-9f8f-cd77b44de07a
description: |
  Detects execution of the RSAT command-line tool dsquery.exe with a command line containing the string
  trustedDomain, which is the directory-object class enumerated when an operator lists cross-forest and
  cross-domain trust relationships (for example dsquery * -filter "(objectClass=trustedDomain)"). The rule fires
  only when both conditions hold: the process is dsquery.exe (by image name or original file name) AND its
  command line contains trustedDomain. Legitimate use is limited to administrators and IT automation
  troubleshooting Active Directory; outside that context, trust enumeration is an early-discovery step that maps
  the trust topology before lateral movement or cross-domain abuse. The investigation should decode the exact
  query, identify the parent process and user that ran it, and determine whether the enumeration was paired with
  other reconnaissance or directory reads.
type: detection
detection_id: 3bad990e-4848-4a78-9530-b427d854aac0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the triggering event show dsquery.exe with trustedDomain on its command line?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    both criteria match together — the process is dsquery.exe (by image path or original file name) AND the
    command line contains the string trustedDomain. Read the full command line and confirm both, noting whether
    the binary matched on its on-disk name or on its embedded original file name (a renamed copy matches only on
    the latter).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run Active Directory trust enumeration?
  context: Listing domain trust relationships is a routine task for domain administrators and IT automation, but
    standard users and most service accounts have no reason to enumerate cross-forest trusts. Knowing whether the
    account role (domain admin, help desk, automation identity) and host function (administrative workstation,
    domain controller, jump host) are consistent with trust discovery is often the fastest path to separating
    sanctioned administration from operator reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this dsquery command enumerate? Decode the full filter and attribute list.
  context: The full command line reveals the concrete query. dsquery uses dsquery <object-type> <filters> <options>;
    the trust-discovery form is dsquery * -filter "(objectClass=trustedDomain)" -attr * (often scoped to
    CN=System,DC=...), which returns every trust the queried domain controller knows about — trustPartner,
    trustDirection, trustType, and trustAttributes. Decode the -filter expression, the requested -attr list, and
    any compound filters or wildcards to learn exactly which objects and attributes were pulled. Host+binary
    scoping surfaces any back-to-back dsquery runs that together form a single enumeration sweep.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single trust query may be legitimate troubleshooting, but several reconnaissance commands in rapid
    succession is a signature of post-compromise enumeration. Operators commonly chain trust discovery with native
    recon binaries — nltest, net, dsquery against users and groups, nslookup, setspn — to map accounts, groups,
    and computers before moving laterally. Three or more distinct recon binaries within fifteen minutes typically
    indicates an automated enumeration sweep rather than ad-hoc administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned dsquery.exe, and is that parent chain expected?
  context: The parent process reveals how the trust query was launched. dsquery run interactively from cmd.exe or
    powershell.exe under explorer.exe looks like a hands-on administrator; dsquery spawned by an Office application,
    a script host (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or wsmprovhost.exe
    (WinRM remote execution) points to automated or remote post-exploitation enumeration. Tune expectations to
    the script hosts and automation that legitimately drive trust queries in this environment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What spawned the parent process, and what else did that parent launch?
  context: The immediate parent is visible in the alert; walking one level up shows the broader launch context. A
    parent that is itself a long-running interactive shell or a remote-execution host, and that also spawned other
    discovery tooling, reframes a single trust query as one step in a hands-on session. Long-running parents
    frequently start hours or days before the alert, so this lookup uses a wide window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously matched the rule's pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine administrative tools can be abused. The query mirrors the rule's selection structure scoped
    to this host — the resulting parent and user distribution reflects how this specific firing pattern (dsquery
    against trustedDomain), not generic dsquery usage, has run here before. A new parent process, an unexpected
    user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsquery.exe
      - OriginalFileName: dsquery.exe
      selection_cli:
        CommandLine|contains: trustedDomain
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host spread look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of the rule's firing pattern (dsquery against trustedDomain) rather than generic dsquery usage. Many hosts
    matching the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set
    points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsquery.exe
      - OriginalFileName: dsquery.exe
      selection_cli:
        CommandLine|contains: trustedDomain
      condition: all of selection_*
    fields:
    - host.name
- question: Did a process on this host load the directory-services or netlogon trust-enumeration libraries without running dsquery.exe?
  context: Trust enumeration is not limited to dsquery. A process can call DsEnumerateDomainTrusts or the .NET
    trust APIs directly, loading netapi32.dll, logoncli.dll, ntdsapi.dll, or System.DirectoryServices assemblies to
    list trusts in memory without launching dsquery.exe. Reviewing module loads for these libraries from a process
    that is not a normal directory tool — especially one running from a user-writable path — surfaces the API-based
    enumeration path that a command-line-only view would miss. If image-load events are not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\netapi32.dll'
          - '\logoncli.dll'
          - '\ntdsapi.dll'
          - '\System.DirectoryServices.dll'
          - '\System.DirectoryServices.Protocols.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Did the alerting process, or a process it spawned, write a file that would confirm a follow-on
    credential read against LSASS?
  context: Trust enumeration is frequently a reconnaissance step that precedes credential access, most often a
    handle opened into lsass.exe to harvest logon material. That handle-open cannot be observed here — this
    environment has no cross-process handle telemetry, so a process reading LSASS memory leaves no direct
    record. What can be checked is whether the dsquery process or a child it launched wrote a dump artifact to
    disk afterward, since a disk-based dump technique leaves a file-write record even though the handle open
    does not. A zero result here is not evidence no credential read happened — an in-memory-only dump would
    leave nothing to find, and the read may simply not have followed this particular enumeration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did directory service object access tied to trust enumeration appear in the security log around the alert?
  context: When an account reads trust objects through LDAP or directory service calls, directory service access
    auditing records the read against the accessed objects, giving a server-side view of the enumeration that is
    independent of the endpoint command line. This corroborates the dsquery activity and catches API-based trust
    reads (DsEnumerateDomainTrusts) that never spawn dsquery.exe. Correlate any directory service access from the
    alerting user or host with the trust query seen in the process command line; the accessed object name and
    properties identify what was read.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - AccessMask
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsquery.exe
      - OriginalFileName: dsquery.exe
      selection_cli:
        CommandLine|contains: trustedDomain
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsquery.exe
      - OriginalFileName: dsquery.exe
      selection_cli:
        CommandLine|contains: trustedDomain
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or
    activity spanning multiple endpoints. If the same user ran trust enumeration, other discovery commands, or
    hands-on-keyboard tooling on more than one host, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dsquery.exe
      - OriginalFileName: dsquery.exe
      selection_cli:
        CommandLine|contains: trustedDomain
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, credential
    access, or other discovery activity — may reveal the attack stages that preceded this trust query and help
    reconstruct the timeline leading up to the enumeration.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
