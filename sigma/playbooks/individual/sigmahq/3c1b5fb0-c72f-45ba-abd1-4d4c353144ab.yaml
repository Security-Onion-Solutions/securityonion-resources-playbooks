name: Process Creation Using Sysnative Folder
id: fdc9e99f-d160-4c92-afc4-06f7c4ec85cb
description: |
  Detects a process whose Image path or command line references the Sysnative
  folder (:\Windows\Sysnative\), excluding known-legitimate ngen install and a
  specific XAMPP startup pattern. Sysnative is the file-system redirector alias
  that lets a 32-bit process reach the native 64-bit System32 directory, and the
  64-bit dllhost.exe under this path is a default spawn target used by injection
  frameworks to host injected code. Legitimate uses exist (some installers and
  WOW64 tooling reach native binaries through Sysnative), so the investigation
  should confirm the exact path and command, identify the parent that launched
  it, and pivot to the surrounding process-access and image-load evidence that
  would confirm or rule out process injection into the spawned host.
type: detection
detection_id: 3c1b5fb0-c72f-45ba-abd1-4d4c353144ab
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the Image path or command line reference the Sysnative folder as this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact Image path and
    command line against the rule's criteria. The rule fires when either the Image
    path or the command line contains ':\Windows\Sysnative\', and it excludes ngen
    install activity from the Microsoft.NET framework directories and a specific XAMPP
    catalina startup. Note which field carried the Sysnative reference and the full
    path, because a 64-bit dllhost.exe under Sysnative is a common injection spawn
    target while a 32-bit tool reaching a native binary may be benign.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run processes that reach the Sysnative path?
  context: Legitimate administrative tooling and some installers reference native
    binaries through Sysnative, so knowing whether the user role and host function
    fit this behavior is often the fastest way to separate routine operations from
    abuse. A workstation user with no admin or build responsibilities reaching the
    native System32 path through a 32-bit parent is a stronger anomaly than the same
    activity on a build or management server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the Sysnative process do? Decode its full command line and working directory.
  context: The full command line reveals the specific action taken through the
    Sysnative path. Decode any flags, encoded content, file paths, or child-command
    references, and identify whether the spawned binary is dllhost.exe, cmd.exe,
    rundll32.exe, or another host process. The native dllhost.exe under Sysnative is
    a default spawn target for injection; an empty or trivial command line on such a
    host process is itself notable because injected code runs in memory rather than
    via arguments.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ':\Windows\Sysnative\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned this Sysnative process, and is that parent chain expected?
  context: The parent process reveals how the Sysnative reference was invoked.
    Legitimate usage often has predictable parents (installers, explorer.exe for
    interactive actions). Injection frameworks frequently spawn the native
    dllhost.exe from an already-compromised process such as rundll32.exe or a
    scripting host; an unexpected parent is a strong pivot point. The immediate
    parent is visible in the alert, so extend the investigation to what spawned the
    parent and what else the parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did any process on this host invoke the Windows APIs used to write a payload into another process
    and start execution around the alert time?
  context: This environment has no cross-process handle telemetry, so a process_access event confirming
    injection-class rights (PROCESS_VM_WRITE, PROCESS_VM_OPERATION, PROCESS_CREATE_THREAD) against the
    Sysnative-hosted process is not obtainable. What is recorded is behavioral API-call telemetry —
    WriteProcessMemory, QueueUserAPC, and SetWindowsHookEx are the primitives used to write a payload into a
    target process and start it running. This channel does not identify the target process, so a hit here is
    correlating evidence to weigh against the Sysnative spawn and its timing, not standalone confirmation the
    hosted process was the target. Zero rows is a visibility gap, not evidence injection did not occur.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: What modules loaded into the Sysnative-hosted process, and were any unusual or unsigned DLLs loaded into it?
  context: Injection frequently manifests as an unexpected DLL loaded into the target
    process's address space, or as the hosted process loading modules inconsistent
    with its normal behavior. The native dllhost.exe normally loads a stable set of
    COM and system modules; an unsigned module, a DLL from a user-writable directory,
    or a load that does not match the host process's baseline points toward injected
    or sideloaded code. If image-load telemetry is not collected in this environment,
    treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: ':\Windows\Sysnative\'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: What child processes did the Sysnative process spawn afterward?
  context: The processes spawned by the alerting process reveal its actual impact.
    A host process under Sysnative that goes on to launch cmd.exe, powershell.exe,
    rundll32.exe, or reconnaissance binaries suggests hands-on-keyboard activity or
    post-injection execution. A process that spawns nothing further may be a benign
    one-shot reference to a native binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|contains|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run processes that reference the Sysnative path?
  context: A path reference that has never been seen on a host is more suspicious than
    one that recurs. Zero or very low historical counts over the trailing period
    indicate first-time or rare use of the Sysnative redirector here, which raises the
    priority of confirming the injection evidence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: ':\Windows\Sysnative\'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's Sysnative pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even legitimate Sysnative use recurs with a stable signature. The query
    mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how the rule's specific firing pattern has
    historically run here. A new parent process, an unexpected user account, or an
    unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: :\Windows\Sysnative\
      - Image|contains: :\Windows\Sysnative\
      filter_main_ngen:
        Image|contains:
        - C:\Windows\Microsoft.NET\Framework64\v
        - C:\Windows\Microsoft.NET\Framework\v
        - C:\Windows\Microsoft.NET\FrameworkArm\v
        - C:\Windows\Microsoft.NET\FrameworkArm64\v
        Image|endswith: \ngen.exe
        CommandLine|contains: install
      filter_optional_xampp:
        CommandLine|contains|all:
        - '"C:\Windows\sysnative\cmd.exe"'
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: :\Windows\Sysnative\
      - Image|contains: :\Windows\Sysnative\
      filter_main_ngen:
        Image|contains:
        - C:\Windows\Microsoft.NET\Framework64\v
        - C:\Windows\Microsoft.NET\Framework\v
        - C:\Windows\Microsoft.NET\FrameworkArm\v
        - C:\Windows\Microsoft.NET\FrameworkArm64\v
        Image|endswith: \ngen.exe
        CommandLine|contains: install
      filter_optional_xampp:
        CommandLine|contains|all:
        - '"C:\Windows\sysnative\cmd.exe"'
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: :\Windows\Sysnative\
      - Image|contains: :\Windows\Sysnative\
      filter_main_ngen:
        Image|contains:
        - C:\Windows\Microsoft.NET\Framework64\v
        - C:\Windows\Microsoft.NET\Framework\v
        - C:\Windows\Microsoft.NET\FrameworkArm\v
        - C:\Windows\Microsoft.NET\FrameworkArm64\v
        Image|endswith: \ngen.exe
        CommandLine|contains: install
      filter_optional_xampp:
        CommandLine|contains|all:
        - '"C:\Windows\sysnative\cmd.exe"'
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity spanning multiple endpoints. If the same user triggered similar activity
    on more than one host, the scope of the event may be larger than a single
    detection.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: :\Windows\Sysnative\
      - Image|contains: :\Windows\Sysnative\
      filter_main_ngen:
        Image|contains:
        - C:\Windows\Microsoft.NET\Framework64\v
        - C:\Windows\Microsoft.NET\Framework\v
        - C:\Windows\Microsoft.NET\FrameworkArm\v
        - C:\Windows\Microsoft.NET\FrameworkArm64\v
        Image|endswith: \ngen.exe
        CommandLine|contains: install
      filter_optional_xampp:
        CommandLine|contains|all:
        - '"C:\Windows\sysnative\cmd.exe"'
        - \xampp\
        - \catalina_start.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other tools ran on this host around the same time, within the injection correlation window?
  context: Injection detection depends on correlating the spawn with nearby memory
    and thread activity, so activity in a tight window around the alert provides the
    context. Reconnaissance, credential access, or staging tools running alongside the
    Sysnative process broaden the picture and help confirm whether this is a single
    benign reference or one stage of a multi-step operation. A short correlation window
    of roughly fifteen minutes keeps unrelated background activity out of the result.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    defense tampering, reconnaissance, or credential access — may reveal the stages
    that preceded this event and help reconstruct the timeline. Injection is often a
    mid-chain action, so a preceding execution or download alert helps explain how the
    Sysnative spawn target came to be used.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's Sysnative pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the rule's firing pattern rather than generic use
    of any binary. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: :\Windows\Sysnative\
      - Image|contains: :\Windows\Sysnative\
      filter_main_ngen:
        Image|contains:
        - C:\Windows\Microsoft.NET\Framework64\v
        - C:\Windows\Microsoft.NET\Framework\v
        - C:\Windows\Microsoft.NET\FrameworkArm\v
        - C:\Windows\Microsoft.NET\FrameworkArm64\v
        Image|endswith: \ngen.exe
        CommandLine|contains: install
      filter_optional_xampp:
        CommandLine|contains|all:
        - '"C:\Windows\sysnative\cmd.exe"'
        - \xampp\
        - \catalina_start.bat
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
