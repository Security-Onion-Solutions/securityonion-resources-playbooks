name: Suspicious Process Created Via Wmic.EXE
id: 5e8c14ac-f9b2-405d-89ac-d8e5223a3e58
description: |
  Detects wmic.exe invoking "process call create" with a command line that also references a suspicious child program or
  user-writable path (rundll32, regsvr32, bitsadmin, certutil, mshta, cscript, wscript, powershell/pwsh, a cmd.exe one-shot,
  or a directory such as Users\Public, Windows\Temp, AppData\Local, %temp%, %ProgramData%). The rule fires when all of these
  conditions are present together in the command line, so the alerting event combines the WMI process-create verb with a
  proxy-execution or download payload. Legitimate administration occasionally uses "wmic process call create" for software
  deployment, but the specific combination with these LOLBins and temp paths is characteristic of WMI-based local or remote
  command execution. Determine what the child command actually does, whether the parent and user are expected to drive WMI
  execution, and whether the activity is isolated or part of a broader sequence on the host or across the fleet.
type: detection
detection_id: 3c89a1e8-0fba-449e-8f1b-8409d6267ec8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the wmic.exe command line contain "process call create" together with a suspicious child program or temp path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The
    rule requires the WMI process-create verb ("process", "call", "create" all present) AND at least one suspicious token
    such as rundll32, regsvr32, bitsadmin, certutil, mshta, cscript, wscript, powershell/pwsh, a cmd.exe one-shot, or a
    user-writable path. Read the full command and confirm both halves are present, not an incidental substring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run WMI process-creation commands?
  context: Legitimate administrative deployment occasionally uses "wmic process call create", but it is normally driven by
    a known management account or a software-distribution host. Knowing whether the user role and host function fit WMI-based
    execution is often the fastest path to separating a real positive from routine operations. WMI execution running as SYSTEM
    or a low-privileged interactive user changes the interpretation of the same command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the wmic command instruct the target to run? Decode the full command line.
  context: The portion after "process call create" is the program WMI was told to launch. Decode it fully — identify the child
    binary (rundll32, regsvr32, bitsadmin, certutil, mshta, a script host, powershell), any DLL export or URL it references,
    and whether it carries a /node argument indicating remote execution against another host. Suspicious command structures for
    this technique include "wmic process call create" wrapping a download cradle or a proxy-execution DLL. This query returns
    all wmic.exe executions on the host within the window, so a multi-step operation is visible as a single sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned wmic.exe and is that parent chain expected?
  context: The parent reveals how WMI execution was invoked. Legitimate usage has predictable parents (explorer.exe for an
    interactive admin, a deployment agent, services.exe). Parents such as cmd.exe spawned by a script host, mshta.exe, an
    Office application, or an unknown binary in a user-writable directory point to WMI being driven as part of an exploitation
    or post-exploitation chain rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did wmic.exe spawn afterward on this host?
  context: The child the WMI command launches is the actual payload of this technique. Locally invoked "process call create"
    spawns the named program as a child of WmiPrvSE.exe or wmic.exe; observed children such as rundll32.exe loading a DLL,
    a download cradle, or a script host reveal what the operation accomplished. Unexpected children for routine administration
    are the lead to follow.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired this WMI process-create pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: Even routine tooling can be abused. This query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how the rule's specific firing pattern (not generic wmic usage) has historically
    run here. A new parent process, an unexpected user account, or an unusual command structure relative to that history is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining process activity in the surrounding window reveals the immediate
    context: what led to the WMI execution, what happened after, and whether it is part of a larger sequence. Look for
    reconnaissance, credential access, persistence installation, or additional execution tooling near the alert.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired this WMI process-create pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern (not generic wmic usage). Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and the
    parent/command consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints.
    WMI execution is frequently used to run commands against remote nodes, so if the same user triggered similar activity
    on multiple hosts, the scope may extend beyond the alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did this host make outbound or remote-host network connections from WMI processes close in time to the alert?
  context: Remote WMI execution (a /node argument, or Invoke-WmiMethod against another host) produces a network connection
    correlated in time with the process creation, and download-style child commands reach external infrastructure. Look for
    connections from wmic.exe or WmiPrvSE.exe within a few minutes of the alert, and note how many distinct remote hosts were
    contacted — a single host suggests targeted lateral movement while several distinct destinations in a short window suggest
    fan-out. The time window between the process creation and any connection is the correlation signal for whether the command
    executed remotely.
  range: +/-10m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\wmic.exe'
          - '\WmiPrvSE.exe'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Do the WMI-Activity operational events on this host show process-create or subscription activity matching the alert
    window?
  context: >-
    WMI operational logging records the provider loads behind "process call create" (event
    5857, with the provider and WmiPrvSE instance in winlog.user_data.ProviderName and
    HostProcess) and any event-subscription setup registered in the window (5859-5861, whose
    winlog.user_data.Query and CONSUMER columns carry the filter and the bound payload).
    Correlating these events with the alerting command confirms whether WMI actually executed a
    command versus a benign query, and whether a persistent subscription was also registered;
    the message column narrates each record. If WMI operational logs are not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing ran, and
    rely on the process-creation evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
- question: Were any other proxy-execution or download LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several. WMI process-create is frequently paired with proxy-execution
    binaries (rundll32, regsvr32, mshta) or download tools (certutil, bitsadmin, curl) to stage and run a payload. Finding
    multiple LOLBins performing complementary steps on the same host strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: A LOLBin executed from a non-standard path (outside System32 or SysWOW64) may have been copied or renamed to evade
    path-based allowlists. wmic.exe running from a user's temp directory or another user-writable location is more suspicious
    than the same binary in System32. Compare Image against OriginalFileName to confirm the on-disk name and path are
    consistent with the genuine WMI client.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this WMI process-create pattern over the past 90 days, and what command-line structures
    are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. This
    query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern (not
    generic wmic usage). The command-line projection lets the analyst compare typical invocation patterns against the alerting
    one to judge whether this command fits an established routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - 'process '
        - 'call '
        - 'create '
        CommandLine|contains:
        - rundll32
        - bitsadmin
        - regsvr32
        - 'cmd.exe /c '
        - 'cmd.exe /k '
        - 'cmd.exe /r '
        - 'cmd /c '
        - 'cmd /k '
        - 'cmd /r '
        - powershell
        - pwsh
        - certutil
        - cscript
        - wscript
        - mshta
        - \Users\Public\
        - \Windows\Temp\
        - \AppData\Local\
        - '%temp%'
        - '%tmp%'
        - '%ProgramData%'
        - '%appdata%'
        - '%comspec%'
        - '%localappdata%'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
