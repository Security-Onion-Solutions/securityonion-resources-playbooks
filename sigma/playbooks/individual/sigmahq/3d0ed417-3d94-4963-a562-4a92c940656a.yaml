name: Creation of a Diagcab
id: ef76c892-3d31-4022-acb9-0f0be09cb972
description: |
  Detects creation of a .diagcab file, a Windows troubleshooting cabinet that packages a
  diagnostic troubleshooter. Legitimate .diagcab files ship from Microsoft and some
  installers, but the format can also carry a crafted troubleshooter that the Microsoft
  Support Diagnostic Tool (msdt.exe / sdiagnhost.exe) executes when the file is opened,
  giving a code-execution path that can bypass Mark-of-the-Web and open-file prompts after
  phishing-based delivery. The investigation should establish what wrote the file (a
  browser or mail client points to download or delivery), what the cabinet contains, and
  whether a troubleshooter execution followed the drop.
type: detection
detection_id: 3d0ed417-3d94-4963-a562-4a92c940656a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file's path and .diagcab extension match what this rule detects?
  context: Before investing investigation time, confirm the exact path and the operation
    that fired the alert. A .diagcab written into a Downloads, Temp, or other user-writable
    location by an internet-facing delivery path is more concerning than one written under
    a system directory by a Microsoft installer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to receive or create a .diagcab file?
  context: Troubleshooting cabinets are rarely handled by end users directly; they usually
    arrive from Microsoft or a vendor installer. Knowing whether this account and host
    routinely deal with diagnostic packages is often the fastest way to separate a routine
    operation from a delivered payload. When the writing account is a machine or service
    account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the .diagcab file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A cabinet
    still on disk can be retrieved, hashed, and unpacked for analysis; a file deleted
    seconds after creation suggests anti-forensic cleanup or a self-removing delivery and
    shifts attention to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one troubleshooting cabinet may drop several files, or stage
    a companion payload the troubleshooter will reference. The breadth, paths, and
    extensions of the writing process's other file activity distinguish a single delivered
    artifact from a wider staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other .diagcab files have landed on this host recently, and which processes wrote them?
  context: Repeated arrival of troubleshooting cabinets, or writes by an unexpected process,
    distinguishes a one-off drop from repeated delivery attempts. The writing process
    matters as much as the count; a single unfamiliar writer producing several cabinets is
    the pattern worth chasing.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '.diagcab'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote the .diagcab, and what parent chain spawned that writer?
  context: The parent chain reveals how the file arrived. A cabinet written by a browser or
    mail client points to a download or attachment delivery; one written by an archive tool
    or script host under an unexpected parent points to unpacking or automated staging.
    Walking up from the writing process toward its parent shows whether the delivery path
    is consistent with normal software distribution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What does the .diagcab cabinet contain?
  context: A .diagcab is a CAB archive that packages a diagnostic troubleshooter — typically
    a diagpkg manifest, an answer file, and one or more scripts. Retrieve the file and
    inspect the embedded manifest and scripts for PowerShell or shell commands, encoded
    strings, embedded URLs or IP addresses, and references to msdt or external download
    locations. A cabinet whose troubleshooter runs arbitrary commands rather than a
    standard Microsoft diagnostic is the malicious case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If a payload from this cabinet executed, what is its hash and does it have known AV or threat intel detections?
  context: File-creation events carry no hash, and a cabinet is opened by the diagnostic
    engine rather than run as its own process, so the .diagcab typically will not appear as
    an executing image. Retrieve the cabinet from its on-disk path and hash it manually,
    then submit the hash to reputation and threat intelligence services. This query also
    surfaces any extracted payload that ran under the cabinet's own filename, whose recorded
    hash can be checked directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Did a Windows troubleshooter execution follow the .diagcab drop on this host?
  context: Opening a .diagcab launches the Microsoft Support Diagnostic Tool — msdt.exe and
    its host process sdiagnhost.exe run the packaged troubleshooter, which is the point where
    a crafted cabinet gains code execution. Execution of these engines shortly after the file
    was written indicates the cabinet was opened; correlate the timing and check the command
    line for the cabinet's path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \msdt.exe
          - \sdiagnhost.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this .diagcab file been seen before on this host?
  context: A cabinet that has never appeared on a host is more notable than one that recurs
    as part of normal servicing. Zero or very low historical counts for this filename point
    to a first-time or unusual arrival even when the name looks like a routine update
    package.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is this .diagcab file present on any other hosts in the environment?
  context: The same cabinet on multiple hosts points to a distribution mechanism or a
    delivery campaign; a single host points to a targeted drop. If it appears widely,
    establish the distribution pattern and timeline to tell legitimate software servicing
    apart from a pushed payload.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the
    user's 90-day history of .diagcab creation, aggregated by host. A user who has never
    produced this pattern is more notable than one who does so regularly; weigh the count
    against the user's role and whether their work involves diagnostic packages.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .diagcab
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven .diagcab creation on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not
    attribute the behavior; the launch mechanism does. The query mirrors the rule's selection
    scoped to the alerting program, so the result is the 90-day history of this program
    producing .diagcab files. A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for thousands of prior events is vendor or OS
    servicing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .diagcab
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the .diagcab drop
    was an isolated event or part of broader movement. If the same user drove similar
    activity on multiple endpoints in the same window, the scope of the incident may be
    larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven .diagcab pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service or machine account, tracking the user across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism
    produced .diagcab files elsewhere in the alert window. Multiple hosts point to scheduled
    or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith: .diagcab
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the drop
    reveals what led to it and what happened after — a browser or mail client opening the
    delivery, a troubleshooter launching, or follow-on tooling. Novel parent-child pairs at
    low counts stand out against repetitive agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — phishing indicators, suspicious downloads,
    or reconnaissance — may reveal the delivery stage that preceded the cabinet drop and
    help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
