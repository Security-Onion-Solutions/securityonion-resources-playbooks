name: Office Application Startup - Office Test
id: c2f33c04-f4d5-4ac2-aa8a-6a6442f8c4bd
description: |
  Detects creation or modification of the registry value \Software\Microsoft\Office test\Special\Perf (in either the
  per-user HKCU or the machine-wide HKLM hive), which causes Microsoft Office applications to load an arbitrary DLL from
  the path stored in that value every time an Office application starts. This key is not created by a normal Office
  installation and has no routine administrative use, so its presence on a host is anomalous; because the per-user
  location requires no elevation, it is a low-friction persistence primitive that runs attacker-supplied code inside the
  Office process on each launch (T1137.002). Investigation should decode the DLL path written to the value, determine
  whether that DLL is present on disk and signed, confirm whether an Office application subsequently loaded it, and check
  whether the loaded code spawned a second stage.
type: detection
detection_id: 3d27f6dd-1c74-4687-b4fa-ca849d128d1c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match the Office Test persistence pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path
    (TargetObject) — it should end in \Software\Microsoft\Office test\Special\Perf — together with the value data
    (Details) and the process that wrote it. The value data is the path to the DLL that Office will load on startup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to write the Office Test registry key?
  context: >-
    The Office Test key has no legitimate installation or administrative use, so no user or host has a routine reason to
    write it. Confirm whether the account and machine function are consistent with any plausible explanation. User
    attribution is present on most endpoint registry events; when it resolves to a machine account or SYSTEM, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: >-
    The Office Test key is not part of any standard software deployment, so an approved change referencing it is unlikely.
    A corresponding ticket would suggest a sanctioned test; absence of one, given the key's persistence effect, points
    toward unauthorized activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this registry change align with normal work hours and maintenance windows?
  context: >-
    Persistence changes made outside business hours or maintenance windows are more suspicious than the same change during
    documented work. Note the interval between the registry write and the next Office launch — a payload staged for a
    later start is consistent with deliberate persistence rather than an interactive administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Does the user or an administrator recall making this registry change?
  context: >-
    Direct confirmation from the account holder is often the fastest legitimacy check. Because writing the Office Test key
    requires no elevation, a compromised standard user account is sufficient to set it; if no one recalls the change,
    treat the account as potentially compromised and get context on any confirmed activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What exact key path, value data, and writing process were recorded, and is this a known persistence location?
  context: >-
    The Office Test\Special\Perf key is a documented persistence location. Office reads its value and loads the referenced
    DLL via LoadLibrary on every application start, with no macro enablement or elevation required. The value data is the
    DLL path that will execute; the writing process shows how the key was set, and a document handler, a script host, or a
    freshly spawned shell each carry different weight than a management tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What DLL path is written to the Office Test key's value, and where does it point?
  context: >-
    The value data (Details) holds the full path to the DLL that Office will load. Examine where it points — user-writable
    directories such as %APPDATA%, %TEMP%, %ProgramData%, or a network share are strong signals, because legitimate Office
    components load only from installed program directories. Note the file name and extension so the path can be checked
    against on-disk and image-load evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who sets one persistence key often makes several changes together — additional autostart entries,
    security-setting edits, or firewall changes. Registry modifications from the same writing process within a short
    window reveal whether the Office Test key was an isolated change or part of a broader configuration pass.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Is the DLL referenced by the Office Test value present on disk, and did the writing process stage it?
  context: >-
    The persistence only executes if the DLL exists at the path written to the value. Correlating file activity by the
    registry-writing process and its children shows whether that DLL was dropped in the same session. The file-write event
    carries no hash; if the DLL is present, hash it from a later load or execution for a reputation lookup. Value deletion
    is not observable here, so judge cleanup from re-modification of the key and from whether the DLL ever loaded.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did an Office application load an unsigned DLL on this host after the key was written?
  context: >-
    The Office Test key takes effect on the next Office launch, when the application loads the DLL named in the value.
    Compare the loaded module path (ImageLoaded) against the path from the registry value; a match under an Office process
    confirms the persistence executed. Restricting to unsigned modules narrows the volume of routine signed Office
    libraries — an attacker-supplied DLL is typically unsigned or carries an unexpected signer.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Signed: 'false'
        Image|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\onenote.exe'
          - '\mspub.exe'
          - '\msaccess.exe'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - SignatureStatus
  answer_sources:
  - image_load
  - manual_review
- question: After the key was written, did an Office application spawn any child processes on this host?
  context: >-
    When the injected DLL runs inside the Office process it commonly drops or launches a second stage as a child of the
    Office application. Office applications spawning command interpreters, script hosts, or rundll32 is unusual and
    indicates the loaded code executed. Compare any child against the DLL path and drop location identified from the
    registry value.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\winword.exe'
          - '\excel.exe'
          - '\powerpnt.exe'
          - '\outlook.exe'
          - '\onenote.exe'
          - '\mspub.exe'
          - '\msaccess.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What process wrote the Office Test key, and what parent chain launched it?
  context: >-
    The process that wrote the key and the chain that launched it reveal how the persistence was set. A write from a
    document handler, a script host such as wscript, mshta, or powershell, or a freshly spawned shell is more concerning
    than a write from a management tool. The parent process shows whether a phishing document or a downloaded script
    initiated the change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has the Office Test key ever been modified before on this host?
  context: >-
    Because this key is not created by a normal Office installation, it should have no modification history on a clean
    host. Zero prior events means this is the first time the key was touched, which raises the significance of the change;
    any earlier values shown alongside the current one help distinguish a repeat write from a one-off.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the registry change?
  context: >-
    Persistence is rarely the only action in a session. Aggregating process activity around the registry write surfaces
    what ran before and after — a document opening, a download, a script host launch — so the write can be placed in the
    context of the wider session rather than viewed alone.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Did other detections fire on this host in the hours before this registry change?
  context: >-
    Earlier detections on the same host — a malicious document, a script host launch, reconnaissance, or defense
    tampering — may reveal the stages that led to this persistence being set and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Was the Office Test key modified on any other hosts in the environment?
  context: >-
    The same key set across multiple hosts points to a widespread implant or a pushed configuration rather than a single
    targeted machine; a single affected host suggests targeting. Comparing the DLL paths written across hosts shows
    whether the same payload was deployed or each host received a distinct one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Actors frequently stack persistence, backing one foothold with another via scheduled tasks, services, registry Run
    keys, or BITS jobs. Persistence-tool executions clustered around the Office Test key write indicate deliberate
    stacking rather than an isolated change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
