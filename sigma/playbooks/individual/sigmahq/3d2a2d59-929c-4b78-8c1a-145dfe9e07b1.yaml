name: Publisher Attachment File Dropped In Suspicious Location
id: 78d063a5-82be-4047-89d1-de65ef32a32e
description: |
  Detects a Microsoft Publisher document ('.pub') being written to a user-writable or temporary location such as
  '\AppData\Local\Temp\', '\Users\Public\', '\Windows\Temp\', or 'C:\Temp\'. Publisher documents are abused as a phishing
  delivery vehicle because Publisher applies weaker macro and Mark-of-the-Web protections than other Office formats, so a
  '.pub' can carry macros or embedded objects that fetch or launch a second-stage payload. Legitimate '.pub' files land in
  these paths occasionally (a user saving an attachment, an application scratch file), so the investigation should establish
  what wrote the file, whether Publisher opened it and spawned child processes, and whether a payload followed.
type: detection
detection_id: 3d2a2d59-929c-4b78-8c1a-145dfe9e07b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path and '.pub' extension match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and
    confirming the written file ends in '.pub' and lands in a user-writable or temporary location the rule watches. The
    unpinned file view also shows which process wrote the file and whether it was later modified, renamed, or deleted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to receive or produce Publisher documents in a temporary location?
  context: Legitimate Publisher usage is uncommon on most endpoints and rarer still in temp or public paths. Knowing whether
    the user role and host function involve Publisher documents distinguishes a routine save from an attachment dropped by a
    phishing lure. When the writing account is a machine or service account, judge by the responsible process and host role
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the '.pub' file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A document still on disk can be retrieved,
    hashed, and examined for macros and embedded objects; a '.pub' deleted or renamed seconds after creation suggests
    anti-forensic cleanup or a self-removing dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is inside this Publisher document — does it carry macros, embedded objects, or a staged payload?
  context: The investigative value is in the file's actual content. Retrieve the '.pub' and examine it for VBA macros,
    embedded OLE objects, auto-open handlers, base64 or otherwise obfuscated strings, and embedded URLs or IP addresses that
    would fetch a second stage. Publisher enforces weaker macro protection than other Office formats, so a macro here is more
    likely to run without a warning. Content analysis requires manual retrieval from the endpoint or a safe environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote this '.pub', and what launched that process?
  context: The parent chain of the writing process reveals how the file arrived. A mail client or browser as the writer or
    an ancestor points to attachment delivery or a download; an archive tool points to an extracted attachment. The '.pub'
    file event carries the writer's parent identifier, so this retrieves the process that spawned the writer and its own
    lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did Publisher open the dropped file, and did it spawn any child processes?
  context: A '.pub' is not executed directly; the delivery progresses when Publisher ('mspub.exe') opens it and a macro or
    embedded object launches a child process. Command interpreters, script hosts, or unfamiliar binaries spawned by
    'mspub.exe' shortly after the drop are the execution signal that distinguishes a benign document from a live lure.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\mspub.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: For any process Publisher spawned, what is its hash and does threat intel flag it?
  context: File-creation events carry no hash, so the '.pub' itself must be retrieved and hashed manually. A hash is recorded
    when a process runs, so any executable Publisher launches after opening the document can be identified by its
    process hash. Submit that hash to reputation and threat-intel sources to determine whether the payload is known
    malicious, benign, or previously unseen.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\mspub.exe'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one suspicious document often drops several — a lure staging components, a script writing
    scratch files, or a dropper unpacking a second stage. The breadth, paths, and extensions of the writer's other file
    activity distinguish a single artifact from staging in progress and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other '.pub' files have been written to this host recently, and by which processes?
  context: Multiple Publisher documents arriving on one host in a short window points to a mail campaign or a repeated lure
    rather than a one-off save. The writing processes and paths reveal whether the arrivals share a delivery mechanism and
    which additional documents belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: .pub
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this exact '.pub' file been seen before on this host?
  context: A document that has never appeared on the host is more suspicious than one that recurs as part of normal
    operations. Zero or very low historical counts for this filename indicate a first-time arrival worth closer review even
    when the name looks benign.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of dropping
    '.pub' files into these temporary locations, aggregated by host, rather than generic activity. A user who has never
    produced this pattern is more notable than one who does so routinely; weigh the count against the user's role and typical
    document workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - C:\Temp\
        TargetFilename|endswith: .pub
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the
    program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute behavior; the launch
    mechanism does. The query mirrors the rule's selection scoped to the alerting program, so the result is the
    90-day history of this program dropping '.pub' files into these locations. A new or rare program for this pattern is the
    deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - C:\Temp\
        TargetFilename|endswith: .pub
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple
    endpoints. If the same user triggered related activity elsewhere in the same window, the scope of the incident may be
    larger than this one drop.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: Under a service or machine account, network-wide user activity returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism dropped '.pub' files elsewhere. The query mirrors the rule's selection
    scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
        - \AppData\Local\Temp\
        - \Users\Public\
        - \Windows\Temp\
        - C:\Temp\
        TargetFilename|endswith: .pub
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is this same '.pub' file present on any other hosts in the environment?
  context: Finding the same document on multiple hosts points to a distributed lure or a mail blast rather than a single
    targeted delivery. If the file is only on one host, it may be targeted; if on many, establish the distribution pattern
    and timeline to size the affected population.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity around the drop reveals what led to it and what
    followed — reconnaissance, script execution, or persistence — and whether the '.pub' is one step in a larger sequence.
    Aggregating by process and parent collapses repetitive agent noise so that novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded this drop and help reconstruct the delivery-to-execution timeline. The alert history on the host
    tells the sequence of events leading up to this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
