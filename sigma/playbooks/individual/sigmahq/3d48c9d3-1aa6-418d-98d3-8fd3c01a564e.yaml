name: Potential Mftrace.EXE Abuse
id: ec19c8c3-4899-474d-b2d1-23b500fda555
description: |
  Detects any process whose parent is mftrace.exe, the trace-log generation tool
  for Media Foundation. Because mftrace.exe is a signed Microsoft developer
  utility, it can be used to launch an arbitrary executable as a child process,
  proxying execution through a trusted binary to evade application-control and
  parent-based heuristics. Legitimate use is limited to media tracing on
  developer or build systems, so the investigation should determine what child
  ran, whether the host and user are expected to run this utility, and whether
  the child wrote files, loaded unsigned modules, or reached out to the network.
type: detection
detection_id: 3d48c9d3-1aa6-418d-98d3-8fd3c01a564e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did the alerting process spawn from a parent whose image ends in mftrace.exe?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the triggering event and verifying the parent image is mftrace.exe.
    The rule fires solely on the parent-child relationship, so confirm the parent
    path ends in mftrace.exe for this event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - ParentImage
- question: Is this user and host expected to run media-tracing developer tooling?
  context: Legitimate mftrace.exe use is generally confined to developer and build
    systems performing Media Foundation tracing. Knowing whether the user role and
    host function are consistent with developer utility usage is often the fastest
    path to distinguishing routine tracing from proxy execution through a trusted
    binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - host.name
    - User
- question: What is the full command line of the child process and what did it do?
  context: The child of mftrace.exe is the payload being proxied through the trusted
    parent. Decode any flags, parameters, encoded content, file paths, or URLs on
    the child command line to understand what action was taken. Command interpreters,
    script hosts, or signing-bypass utilities as the child are higher concern than
    a media-related helper.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
    - CommandLine
    - CurrentDirectory
- question: What spawned mftrace.exe itself, and is that launching chain expected?
  context: The immediate parent is mftrace.exe, but what launched mftrace.exe reveals
    how the proxy execution was set up. A developer IDE, build orchestrator, or
    installer launching it is consistent with tracing; a shell, script host, or
    Office application launching it points to abuse of the trusted binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
    - ParentImage
    - Image
    - CommandLine
- question: What other child processes did mftrace.exe spawn on this host?
  context: A single trusted-utility instance can launch several tools in sequence —
    reconnaissance, credential access, lateral movement. Seeing every child of
    mftrace.exe reveals the full scope of activity proxied through this execution
    chain rather than just the one child that triggered the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
    - Image
    - CommandLine
- question: Did the child process write executable or script files to user-writable
    paths around the alert time?
  context: Trusted-utility proxy execution commonly writes and then runs a new
    payload from user-writable locations such as the temp directory, the user
    profile, the public profile, or the recycle bin. File writes by the child
    that land in those paths shortly after launch indicate staging of a follow-on
    payload rather than benign tracing output.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      filter_ext:
        TargetFilename|endswith:
        - '.exe'
        - '.dll'
        - '.ps1'
        - '.bat'
        - '.cmd'
        - '.vbs'
        - '.js'
        - '.scr'
      condition: selection and filter_ext
    fields:
    - TargetFilename
    - CommandLine
- question: Did the child process load any unsigned or user-writable modules?
  context: Proxy execution through a developer utility frequently pulls in
    unsigned or user-writable DLLs to carry the actual functionality. Modules
    loaded by the child from non-system directories, or modules whose signature
    is absent or invalid, point to a side-loaded payload rather than a clean
    media-tracing run.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
    - ImageLoaded
    - Signed
    - Signature
- question: Did the child process make outbound network connections shortly after
    launch?
  context: A payload proxied through a trusted utility often reaches out to the
    network immediately for command-and-control or to retrieve a second stage.
    Outbound connections from the child within minutes of launch, especially to
    rare or unknown destinations, shift the disposition toward operator activity.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
    - DestinationIp
    - DestinationPort
    - DestinationHostname
- question: Has this specific mftrace.exe parent-to-child pairing been seen on this
    host before?
  context: Some parent-child relationships are routine on a given host while others
    are novel. Historical frequency of mftrace.exe spawning this specific child
    binary distinguishes an established tracing workflow from a first-time
    spawning relationship worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mftrace.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mftrace.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement
    or coordinated activity across multiple endpoints. If the same user triggered
    similar activity elsewhere, the scope of the activity may be larger than this
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
    - host.name
    - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \mftrace.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is mftrace.exe spawning children on other hosts across the environment?
  context: The same trusted-utility proxy pattern appearing on multiple hosts may
    indicate a broader rollout, automated process, or multi-host activity, whereas
    a single occurrence is more likely targeted or a one-off. Environment-wide
    comparison helps calibrate severity and identify scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
    - host.name
    - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert
    reveals what led to this event, what happened after, and whether it is part of
    a larger sequence. Look for reconnaissance, privilege escalation, or
    persistence mechanisms near the alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
    - Image
    - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this event and help
    reconstruct the full timeline leading up to the proxy execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
    - event.severity_label
    - rule.name
    - rule.uuid
