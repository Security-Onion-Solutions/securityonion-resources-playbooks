name: Suspicious PROCEXP152.sys File Created In TMP
id: d32886a4-531e-4952-83d3-d5ea6ab3cfb3
description: |
  Detects the creation of a file named PROCEXP152.sys under a per-user AppData\Local\Temp
  path by a process that is NOT one of the legitimate Sysinternals utilities (procexp.exe,
  procexp64.exe, procmon.exe, procmon64.exe). PROCEXP152.sys is the signed kernel driver that
  Process Explorer and Process Monitor extract during normal use, but the same signed driver
  is abused by tools that load it to obtain kernel-mode execution — suppressing event tracing
  to blind Sysmon and event logging, or terminating protected AV/EDR processes. The
  investigation should determine which process dropped the driver, whether it was then loaded
  as a service, and what the resulting kernel access was used for. Because the filename is
  trivial to rename, treat this as a starting point rather than confirmation.
type: detection
detection_id: 3da70954-0f2c-4103-adff-b7440368f50e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Was PROCEXP152.sys created under a user's AppData\Local\Temp path by a process other than Process Explorer or Process Monitor?
  context: >-
    Before investing investigation time, confirm the alert is a true positive: the file name
    ends in PROCEXP152.sys, it was written under a per-user AppData\Local\Temp path, and the
    creating process is not one of the legitimate Sysinternals utilities (procexp.exe,
    procexp64.exe, procmon.exe, procmon64.exe) that extract this driver during normal use.
    Both legitimate diagnostics and tools that abuse the driver drop the same signed file, so
    the creating process is the first thing to check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to run a tool that installs a kernel driver?
  context: >-
    Legitimate use of Process Explorer or Process Monitor extracts this driver on workstations
    of power users and IT staff. On a server or a standard user's host with no diagnostic
    tooling, a process dropping a signed kernel driver into Temp is harder to explain and
    should be confirmed against the host's role and the user's normal toolset. When the writing
    identity is a machine or service account, judge by the writing process and host role rather
    than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the driver still on disk, or was it deleted or renamed after the alert?
  context: >-
    The driver's post-alert lifecycle drives next steps. A driver still on disk can be
    retrieved, hashed, and compared against the known-good Sysinternals binary; a file deleted
    seconds after creation suggests the loader extracted it, registered it as a service, and
    cleaned up — a common pattern for tooling that only needs the driver briefly to obtain
    kernel access.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is this the genuine Sysinternals driver, or a renamed or modified binary?
  context: >-
    The filename alone does not confirm the tool. Retrieve the file from its on-disk path and
    compare its size, hash, and code-signing certificate against the known-good PROCEXP152.sys
    shipped with Process Explorer. A file carrying the same name but a different hash, or a
    broken or absent signature, points to a driver repurposed for kernel access rather than
    legitimate diagnostics.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What process wrote the driver to Temp, and what was its full command line?
  context: >-
    The creating process and its command line reveal how the driver was staged — an interactive
    tool launch, a script, or a loader binary. The command line often names the driver, the
    service it will register, or the payload it intends to load, which distinguishes a
    diagnostic run from a loader preparing to disable security tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process spawned the one that wrote the driver, and is that parent chain expected?
  context: >-
    The parent of the writing process shows how the activity was initiated. A driver drop
    launched from explorer.exe by an administrator running diagnostics reads very differently
    from one launched by a script host, an Office application, a remote-access tool, or an
    unsigned binary in a user-writable directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the dropped driver loaded — did a service-control or loader process reference PROCEXP152.sys?
  context: >-
    A kernel driver is inert on disk until a process registers and starts it as a service. Look
    for a service-control utility or a custom loader that names the driver on its command line
    in the hours after the drop. Confirmed loading means the actor obtained kernel-mode
    execution, which is what makes this driver useful for tampering with event tracing and
    terminating protected processes.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'PROCEXP152.sys'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Were driver-service or security-tool registry keys created or modified on this host around the alert?
  context: >-
    Loading a kernel driver through the service control manager creates a service key under the
    system's CurrentControlSet Services path; a custom loader that calls NtLoadDriver writes the
    same key directly. In parallel, the same operation often edits Windows Defender, Sysmon, or
    other security-tool keys to blind monitoring. Registry writes to these paths near the drop
    corroborate that the driver was installed and show what protection was weakened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\PROCEXP152'
          - '\Windows Defender\'
          - '\Sysmon\'
          - '\WdFilter\'
          - '\Sense\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
  - edr_console
- question: Is endpoint monitoring still reporting normally on this host, or did telemetry go quiet after the drop?
  context: >-
    This driver's purpose is to suppress security telemetry — hooking the event-tracing path so
    that Sysmon and event logging stop receiving events system-wide, without an obvious unload.
    Verify whether expected process, file, and registry telemetry from this host continued after
    the alert; an abrupt gap in otherwise steady reporting is itself evidence the driver took
    effect and the host is currently blind.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: What ran on this host after the driver was dropped?
  context: >-
    Actors disable telemetry to do something that would otherwise be logged or blocked —
    terminating AV/EDR processes, dumping credentials, or deploying a payload. Examine process
    activity in the window after the drop, keeping in mind that if the driver silenced event
    tracing some of that activity may be missing from logs; a gap followed by unexplained
    processes points to exactly what the driver was meant to hide. The width of that correlation
    window depends on how quickly the operation moved.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense-tampering actions performed on this host?
  context: >-
    A driver drop is often one step in a broader effort to remove protection. Look for the same
    user or parent process also stopping security services, clearing event logs, disabling
    Defender, deleting shadow copies, or changing the firewall. Multiple tampering actions in one
    window indicate a deliberate operation to strip monitoring rather than an isolated diagnostic
    run. The specific administrative tools and service names treated as security-critical vary by
    environment, so weight results against this organization's expected maintenance activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other files did the process that dropped the driver write or delete around the alert?
  context: >-
    A loader that stages a kernel driver frequently drops more than one artifact — the payload it
    intends to run with kernel privileges, configuration files, or additional tooling. The breadth
    and locations of the writing process's other file activity distinguish a single diagnostic
    extraction from a loader staging a toolkit.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to this AppData\Local\Temp directory recently, and by which processes?
  context: >-
    Per-user Temp is a common staging directory: many processes write there legitimately, but a
    cluster of new arrivals from an unfamiliar process alongside the driver reveals whether this
    is an isolated drop or a location under active use by a loader. Group by writing process to
    separate routine temp churn from the process responsible for the driver.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Is PROCEXP152.sys being dropped on other hosts in the environment?
  context: >-
    The same signed driver appearing in Temp across multiple hosts in a short window points to
    deliberate distribution — an operator rolling the same kernel-access tooling across systems —
    rather than a single administrator's diagnostic session. A single host is more consistent with
    local, possibly legitimate, use. Where it appears on many hosts, map the distribution pattern
    and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user produced this driver-drop pattern before, and does that fit their role?
  context: >-
    The query mirrors the rule's detection scoped to this user — their 90-day history of dropping
    this specific driver into Temp under a non-Sysinternals process, aggregated by host. A user who
    has never produced this pattern is more notable than one who does so regularly as part of
    diagnostics; weigh the count against whether kernel-driver tooling fits their role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: PROCEXP152.sys
      filter:
        Image|contains:
        - \procexp64.exe
        - \procexp64a.exe
        - \procexp.exe
        - \procmon64.exe
        - \procmon64a.exe
        - \procmon.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven this driver-drop pattern here or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior — the launch mechanism does. The query mirrors the rule's detection scoped to the
    alerting program, giving its 90-day history of driving this specific drop, aggregated by
    host. A program that already accounts for many prior events is likely vendor or OS tooling; a new
    or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: PROCEXP152.sys
      filter:
        Image|contains:
        - \procexp64.exe
        - \procexp64a.exe
        - \procexp.exe
        - \procmon64.exe
        - \procmon64a.exe
        - \procmon.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across hosts in the alert window reveals whether the driver drop is
    isolated or part of activity spanning multiple systems. The same account triggering related
    activity on several hosts widens the likely scope of the investigation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window — a coordinated rollout, or isolated to this host?
  context: >-
    Under a service or machine account, tracking user activity network-wide returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism dropped
    this driver elsewhere in the alert window: the query mirrors the rule's detection scoped to the
    alerting program, fleet-wide. Several hosts in the same window points to pushed or
    scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith: PROCEXP152.sys
      filter:
        Image|contains:
        - \procexp64.exe
        - \procexp64a.exe
        - \procexp.exe
        - \procmon64.exe
        - \procmon64a.exe
        - \procmon.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
