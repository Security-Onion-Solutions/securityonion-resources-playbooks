name: IIS WebServer Access Logs Deleted
id: 03c1670c-13a9-4f43-867e-1429615c6f1e
description: |
  Detects deletion of IIS web server access log files under \inetpub\logs\LogFiles\ (files ending in .log). These logs
  record every HTTP request the server handled; deleting them destroys the record of web traffic and is a common
  anti-forensic step after web-server compromise (webshell drop, exploitation of an internet-facing application).
  Legitimate causes include log rotation, IIS uninstallation, and approved maintenance scripts. The investigation should
  establish which log files were removed, what process and command performed the deletion, whether the deleting process was
  spawned by the IIS worker (indicating webshell-driven activity), and whether the erased web activity can be reconstructed
  from surviving process and network telemetry.
type: detection
detection_id: 3eb8c339-a765-48cc-a150-4364c04652bf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the deleted log path and the responsible process match what this rule detects?
  context: 'Before investing investigation time, confirm the alert is a true positive: the deleted file lives under
    \inetpub\logs\LogFiles\ and ends in .log, the operation is a deletion, and a responsible process is attributed. Log
    rotation and IIS uninstallation delete the same files legitimately, so read the path and the deleting process before
    escalating.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to delete IIS access logs?
  context: On a web server, IIS access logs are normally rotated by the service or an approved maintenance routine, not
    removed interactively. Knowing whether the account and host role are consistent with deliberate log deletion is often
    the fastest way to separate routine cleanup from evidence destruction. When the responsible account is a machine or
    service account, judge by the deleting process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were the deleted logs recreated or restored afterward, or did further deletions follow?
  context: The log directory's post-alert lifecycle drives next steps. If IIS immediately recreated a fresh .log file, the
    deletion may have been rotation; if the files stayed gone or additional log files were deleted in the same window, that
    points to a deliberate wipe. A gap in logging after the deletion is itself the evidence loss the analyst must account for.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which access log files were deleted, and does the pattern look like rotation or deliberate evidence destruction?
  context: 'The alert is a file deletion, so the log contents are gone from disk and cannot be read back. The investigative
    value is in what was removed: a single current-day .log is consistent with rotation, while removal of an entire W3SVC
    site folder or a span of dated logs covering a specific timeframe is consistent with destroying the record of a
    particular session of web activity. The query returns the deletion event with the responsible process.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command deleted the IIS access logs?
  context: The file deletion event names the responsible process but not its command line. Pivoting to the deleting
    process's own creation event reveals how the deletion was performed -- an interactive del/Remove-Item, a script clearing
    a log directory, or a utility invoked with a path argument targeting \inetpub\logs\LogFiles\. The exact command
    distinguishes a targeted wipe from a broad maintenance routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the process that deleted the logs, and is that parent chain expected?
  context: The parent chain reveals how the deletion was invoked. A deleting process whose parent is the IIS worker
    (w3wp.exe) indicates the command ran through the web application itself -- the signature of webshell or exploitation
    activity -- whereas an interactive shell under explorer.exe points to hands-on-keyboard cleanup. Walk up the chain to
    see what launched the parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Can the erased web activity be reconstructed from processes the IIS worker spawned before the logs were deleted?
  context: IIS access logs are the primary record of HTTP requests, and their deletion removes that record. Web
    exploitation and webshell command execution still surface elsewhere -- as child processes of the IIS worker process
    (w3wp.exe) in process telemetry. Enumerating those children over the covered timeframe recovers the command activity the
    deleted logs would have corroborated, even though the request-level log content is unrecoverable.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\w3wp.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Is IIS access logging currently functioning, or are logs still being removed or logging disabled?
  context: Log deletion may be a one-time act or the start of ongoing suppression. Confirm that IIS is still writing access
    logs to \inetpub\logs\LogFiles\ and that no configuration change disabled logging for the affected site. If logging is
    still down or files continue to disappear, restore visibility before continuing the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the logs were deleted?
  context: Adversaries destroy logs to hide what they did. Process activity in the window immediately after the deletion
    often reveals the actions the wipe was meant to conceal -- credential access, staging, or execution of further tooling.
    Because access logs are gone for that period, process telemetry is the primary record of what happened; correlate it
    with network and file activity in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other anti-forensic actions performed on this host -- clearing event logs, deleting shadow copies, or
    disabling defenses?
  context: An actor who deletes web logs often clears additional evidence in the same operation -- wiping Windows event logs,
    deleting Volume Shadow Copies, or stopping security services -- to maximize coverage. Finding several such actions from
    the same user or parent process around the deletion indicates a coordinated cleanup rather than isolated maintenance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other files did the responsible process delete or write around the alert?
  context: A process that removes one log file often removes many -- an entire LogFiles tree, several W3SVC site folders, or
    other evidence staged for cleanup. The breadth and paths of the deleting process's other file operations distinguish a
    single rotation from a directory-wide wipe and enumerate what else was destroyed. Read EventType to separate deletions
    from writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to or removed from the IIS log directory recently, and by which processes?
  context: The IIS log directory is normally written only by the web server and its logging service. Other recent arrivals or
    deletions in \inetpub\logs\LogFiles\ -- and which processes touched them -- reveal whether this deletion is an isolated
    event or the directory is under active manipulation, and establish the baseline set of processes that legitimately
    operate there.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\inetpub\logs\LogFiles\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before the logs were deleted?
  context: Log deletion is usually a late step. Earlier detections on the same host -- web exploitation, webshell activity,
    reconnaissance, or privilege escalation -- may reveal the intrusion stages that preceded the cleanup and help reconstruct
    the timeline the deleted logs would otherwise have documented.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user deleted IIS access logs under this path before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user -- the result is the user's 90-day history of deleting
    files under \inetpub\logs\LogFiles\ ending in .log, aggregated by host. A user who has never produced this pattern is
    more suspicious than one who does so regularly as part of maintenance; weigh the count against the account's role and
    whether it administers web servers.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains: \inetpub\logs\LogFiles\
        TargetFilename|endswith: .log
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this log-deletion pattern on this host or across the environment, or
    is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute the behavior; the
    meaningful pivot is the launch mechanism. The query mirrors the rule''s selection scoped to the alerting program,
    so the result is the 90-day history of this program deleting IIS access logs. A program that already accounts for many
    prior deletions is rotation or maintenance automation; a new or rare program for this pattern is the deviation worth
    chasing.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains: \inetpub\logs\LogFiles\
        TargetFilename|endswith: .log
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the log deletion is part of
    broader hands-on activity. If the same account was active on multiple hosts or ran other tooling at the same time, the
    scope of the incident may extend beyond this web server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven deletion pattern fire on other hosts in the same window, or is the activity isolated
    to this host?
  context: 'Under a service or machine account, tracking the user across the network returns agent-telemetry noise. The
    meaningful question is whether the same launch mechanism deleted IIS logs elsewhere: the query mirrors the rule''s
    selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger such as a webshell on that server.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|contains: \inetpub\logs\LogFiles\
        TargetFilename|endswith: .log
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host around the log deletion?
  context: Web-server compromise that reaches the stage of log deletion is frequently accompanied by persistence for
    re-entry -- scheduled tasks, services, registry Run keys, or BITS jobs installed before or after the cleanup. Persistence
    tool executions in the surrounding window, from the same user or parent, indicate the deletion was part of an intrusion
    rather than isolated maintenance.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
