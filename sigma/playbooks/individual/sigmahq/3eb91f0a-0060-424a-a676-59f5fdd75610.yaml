name: Potential CVE-2021-44228 Exploitation Attempt - VMware Horizon
id: 5db30111-8d94-4b6a-9594-d2952a7747aa
description: |
  Detects a child process spawned by ws_TomcatService.exe, the Tomcat service that fronts a VMware Horizon
  connection server, where the child is not cmd.exe or powershell.exe. A Log4j lookup evaluated inside the
  Java web stack (CVE-2021-44228) makes the service process fetch and execute attacker-supplied content, and
  the resulting payload appears as a child process of the service. The service normally spawns very little,
  so any child is a deviation worth accounting for. Investigation should identify the child binary and its
  command line, look for the web request that reached the vulnerable endpoint, confirm the Log4j patch state
  of the deployment, and check whether the child loaded unusual modules or called out to an external host.
type: detection
detection_id: 3eb91f0a-0060-424a-a676-59f5fdd75610
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event match what this rule detects — a process whose parent is ws_TomcatService.exe and which is not cmd.exe or powershell.exe?
  context: >-
    The rule has one selection: ParentImage ending in \ws_TomcatService.exe, with cmd.exe and powershell.exe
    children excluded from the match. Confirm the parent path resolves to the Horizon connection server's
    Tomcat service rather than an unrelated binary of the same name, and note which child binary ran.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this host a Horizon connection server, and is the account it ran under the expected service identity?
  context: >-
    A connection server hosting the Tomcat service is a known, inventoried role; the same parent binary on an
    unexpected host is itself worth a note. The Tomcat service typically runs under a machine or service
    identity, so an interactive account here points at something other than the service spawning the child.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What web request reached the Horizon web stack immediately before this process started?
  context: >-
    Exploitation of CVE-2021-44228 is delivered as a crafted string in a request field the application logs —
    a header, URI parameter, or form value carrying a JNDI lookup. Review the connection server and gateway
    access and error logs for the minutes before the child started, looking for the originating source IP and
    for a burst of 4xx/5xx responses on one client or URI (a spike threshold of more than 5 in 5 minutes is a
    common starting point). Failed exploitation attempts often leave only error entries and no child process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Horizon deployment patched against CVE-2021-44228, and does it still bundle a vulnerable Log4j version?
  context: >-
    The vulnerability is reachable only where an unpatched Log4j version evaluates a lookup on attacker-controlled
    input. Confirm the build of the connection server, the gateway components, and any bundled Java libraries
    against the vendor's remediation for CVE-2021-44228. An unpatched build makes exploitation a live explanation
    for the child process; a patched build shifts the question toward another route to the service account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Were other servers hit by the same exploitation attempt?
  context: >-
    Internet-facing deployments are scanned and exploited in bulk rather than one host at a time. Counting this
    same detection across hosts and accounts over the last day separates a single reachable server from every
    server in the pool being reached.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What does the Tomcat service process's own event show — its command line, and what started it?
  context: >-
    Retrieving the parent's own start event shows how the service was launched and how long it had been running
    before it spawned this child, which separates a service started at boot from one restarted just before the
    activity. The parent process identifier is not populated on every alert of this kind; an empty result is a
    missing-field condition rather than evidence the parent does not exist.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What exactly did the child process do? Decode its full command line and working directory.
  context: >-
    The child's arguments are the payload the exploit chose to run. Decode any encoded blobs, resolve download
    URLs and remote paths, and note the working directory — content staged under the service's own installation
    or temp directories points back at the web stack as the writer. Post-exploitation payloads commonly fetch a
    second stage, add an account, or write a file into the application's directory tree.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Do any command lines on this host carry JNDI lookup markers or Java deserialization strings?
  context: >-
    Exploit-like input for this vulnerability has a recognisable set of markers — ${jndi:, the ldap:// and rmi://
    schemes it dereferences, obfuscated variants built from ${env:} and ${${::-j}ndi} nesting, and rO0AB as the
    base64 prefix of a serialized Java object. When the payload echoes or re-passes the triggering string, those
    markers land in a process command line. Request-only patterns such as ../, union select, cmd= and %00 do not
    reach process telemetry and belong to the web log review instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      markers:
        CommandLine|contains:
          - '${jndi:'
          - '${env:'
          - '${${'
          - 'ldap://'
          - 'rmi://'
          - 'rO0AB'
      condition: selection and markers
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What modules did the child process load, and what does their signing status show?
  context: >-
    A payload delivered through a Java lookup can pull code in as a module rather than as another process, so the
    modules the child loaded describe what it was actually built to do. Unsigned modules, modules whose signature
    does not validate, and modules loaded from temp or application-writable directories are the ones to account
    for; modules loaded from the system directory with a valid signature are the baseline.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
- question: Did the child process connect outbound after it started?
  context: >-
    The stage that follows a successful lookup is a fetch or a callback — retrieving the next payload, or
    registering with an external listener. Connections from this process to an external address, especially on
    ports the server has no business reaching, mark the point where the exploit obtained code from outside.
    Correlate any destination against the source address seen in the web request logs for the same window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What other processes did the Tomcat service spawn on this host in the hours after the alert?
  context: >-
    A single payload rarely ends the chain; the same service process is often used to run reconnaissance, add
    accounts, or launch a second stage over the following hours. This view includes cmd.exe and powershell.exe
    children, which the rule's own selection excludes and which therefore did not raise this alert — they are
    frequently the more informative rows.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has the Tomcat service spawned this child binary on this host before?
  context: >-
    The connection server's Tomcat service has a narrow set of children it launches during normal operation —
    installer or maintenance helpers, and whatever the local automation adds. A 90-day count of this exact
    parent-child pairing separates an established helper from a first-time spawn; known-good children observed
    repeatedly can be treated as the host's allowed child list for triage.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A 15-minute window either side of the spawn is the working correlation horizon between the request, the
    error it produced, the process it started, and any egress that followed. Aggregating the host's process
    activity by binary and parent collapses routine service and agent traffic into high-count rows, leaving
    novel parent-child pairs visible at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Has this account previously produced this rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is its 90-day history of
    non-shell children under the Tomcat service, aggregated by host. An account that has produced this pattern
    routinely across servers is running maintenance work; an account with no history here has just done
    something new. Weigh the count against what the identity is provisioned to do.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_TomcatService.exe
      filter_main_shells:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    The Tomcat service typically runs under a machine or service identity, and under a service principal the
    account name attributes nothing. The launch mechanism is the meaningful pivot — this query mirrors the
    rule's selection scoped to the alerting parent, giving the 90-day history of that service driving this
    specific pattern, by host. A parent already accounting for thousands of prior events is vendor or platform
    automation; a parent with no such history is the deviation to chase.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_TomcatService.exe
      filter_main_shells:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the same hour shows whether the identity was used
    beyond this server. If the alert fired under a machine or service identity, this view returns the constant
    background of service-owned processes on every host and answers nothing — in that case the parent-driven
    fleet question is the one that carries the signal.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same parent-driven pattern fire on other Horizon servers in the same window?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, across the alert
    window. Several connection servers producing the same pattern at once points at either a pushed maintenance
    action or a scan reaching every exposed member of the pool; a single host points at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_TomcatService.exe
      filter_main_shells:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same server help place this event in a sequence — scanning or probing of the web
    stack, other exploitation attempts, or account and service changes made through an earlier foothold. The
    order of the alerts reconstructs how far the activity has progressed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
