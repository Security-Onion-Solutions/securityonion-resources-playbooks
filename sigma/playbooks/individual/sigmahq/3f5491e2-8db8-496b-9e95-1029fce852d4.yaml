name: Driver/DLL Installation Via Odbcconf.EXE
id: e404dfe2-0b24-4671-a6ed-964b713b5927
description: |
  Detects odbcconf.exe invoked with an INSTALLDRIVER action and a .dll argument, which registers
  a new ODBC driver and can be used to load and execute an arbitrary DLL through a signed Microsoft
  binary. The rule fires only when the process is odbcconf.exe AND the command line contains both
  'INSTALLDRIVER ' and '.dll'. Legitimate driver registration by installers and IT tooling produces
  the same pattern, so the investigation should establish the DLL path and signer, the parent process,
  and any modules or follow-on activity loaded by odbcconf afterward to separate authorized driver
  setup from proxy execution of a malicious DLL.
type: detection
detection_id: 3f5491e2-8db8-496b-9e95-1029fce852d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show odbcconf.exe running an INSTALLDRIVER action with a .dll argument?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when the process is odbcconf.exe (by Image or OriginalFileName) AND the command line contains
    both 'INSTALLDRIVER ' and '.dll'. Read the full command line and confirm both the action keyword
    and the DLL reference are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register ODBC drivers via odbcconf.exe?
  context: Legitimate driver registration is normally performed by installers, deployment tooling, or
    administrators on specific systems. Knowing whether this user role and host function routinely set
    up ODBC drivers is often the fastest way to separate an authorized install from proxy execution of
    a malicious DLL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL path and driver parameters were passed to odbcconf? Decode the INSTALLDRIVER argument.
  context: The full command line reveals the specific driver entry being created and, most importantly,
    the DLL that will be loaded. INSTALLDRIVER takes a 'name|Driver=<path>.dll|APILevel=2' form — extract
    the Driver= path and note whether it points to System32/SysWOW64 (expected for real drivers) or to a
    user-writable, temp, or unusual location. Watch for a REGSVR variant or a response-file (-f) form in
    the same window, which load a DLL directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned odbcconf.exe, and is that parent chain expected for driver registration?
  context: The parent process reveals how odbcconf was invoked. Installer and deployment workflows have
    predictable parents (services.exe, msiexec.exe, explorer.exe for an interactive admin). Script hosts
    or Office applications such as mshta.exe, wscript.exe, cscript.exe, or winword.exe as the parent point
    toward scripted proxy execution rather than legitimate driver setup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What modules did odbcconf.exe load after this execution, and are any non-standard or unsigned?
  context: The driver registration is only the setup step; the abuse completes when odbcconf loads the
    referenced DLL. Review the modules loaded by this odbcconf process and flag any that are unsigned or
    that load from a user-writable, temp, or non-system path. ODBC driver DLLs normally live under System32
    or SysWOW64; a module loaded from a user profile, ProgramData, or temp directory is the artifact worth
    chasing. If image-load events are not collected in this environment, treat zero results as a visibility
    gap and confirm the DLL on disk by path and signature instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: What child processes did odbcconf.exe spawn afterward on this host?
  context: A loaded DLL frequently launches follow-on processes for post-exploitation. Legitimate driver
    registration spawns nothing or only related setup helpers; odbcconf spawning cmd.exe, powershell.exe,
    certutil.exe, rundll32.exe, or other interpreters points to code execution carried by the loaded DLL.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did odbcconf.exe make any network connections after loading the DLL?
  context: A DLL loaded through odbcconf can initiate outbound connections to retrieve a second stage or
    establish command and control. odbcconf.exe contacting a remote host is not part of normal ODBC driver
    registration. Review the destination addresses and ports for connections originating from this process.
    If network telemetry for this process is not collected, treat zero results as a visibility gap rather
    than confirmation that nothing connected.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did this host run odbcconf.exe with other DLL-loading actions such as REGSVR or a response file?
  context: INSTALLDRIVER is one of several odbcconf primitives that load a DLL. The REGSVR action
    (/a {REGSVR <path>.dll}) calls DllRegisterServer directly, and the response-file form (-f <path>.rsp)
    loads a DLL named inside the file. Surfacing other odbcconf invocations on this host shows whether the
    operator is exercising multiple proxy-execution primitives or this is an isolated driver install.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        - Image|endswith: \odbcconf.exe
        - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
          - 'REGSVR'
          - ' -f '
          - '.rsp'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: selection_img and selection_cli and _pb_scope
    fields:
      - CommandLine
      - User
- question: Does this host normally run odbcconf.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. ODBC
    driver registration is typically a one-time install event on a given host, so zero or very low historical
    counts indicate first-time or rare execution that deserves a closer look at the DLL involved.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that
    odbcconf INSTALLDRIVER activity, and does the current alert fit?
  context: Even legitimate driver registration can be impersonated. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution reflects how this specific
    INSTALLDRIVER pattern has historically run here rather than generic odbcconf usage. A new parent process,
    an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|all:
        - 'INSTALLDRIVER '
        - .dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other tools ran on this host around the same time as the odbcconf execution?
  context: Proxy execution of a DLL is usually one step in a larger sequence. Activity surrounding the
    odbcconf execution may reveal reconnaissance, privilege escalation, persistence installation, or data
    staging that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this INSTALLDRIVER firing pattern rather than generic odbcconf usage. Many hosts firing the same
    pattern points to scripted deployment or vendor automation registering a driver; one host or a small
    unrelated set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|all:
        - 'INSTALLDRIVER '
        - .dll
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|all:
        - 'INSTALLDRIVER '
        - .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|all:
        - 'INSTALLDRIVER '
        - .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the
    operation may be larger than a single driver registration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains|all:
        - 'INSTALLDRIVER '
        - .dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded this event and help
    reconstruct the full timeline around the odbcconf execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
