name: RDP Sensitive Settings Changed
id: e29ec13b-c053-48e4-b0f2-323a6ac964af
description: |
  This rule detects changes to sensitive Remote Desktop / Terminal Server registry settings. It fires when either the
  Shadow value is set to enable session shadowing (DWORD 1-4), or a remote-assistance or security control is weakened
  (fAllowUnsolicited, fAllowUnsolicitedFullControl, DisableSecuritySettings, or DisableRemoteDesktopAntiAlias set to
  1), or an InitialProgram, ServiceDll, or SecurityLayer value is written — and in each case the change is not the
  legitimate SecurityLayer=TLS setting. Administrators legitimately adjust these settings through Group Policy and RDS
  configuration, so the change can be routine; the same edits also enable or weaken remote access for lateral movement
  and persistence — enabling connections, allowing unsolicited assistance, downgrading authentication, running a
  program at logon (InitialProgram), or loading a custom Terminal Services DLL (ServiceDll) for session hijacking.
  Determine which setting changed, which process and user made the change, whether it was authorized, and whether a
  remote session or payload followed.
type: detection
detection_id: 3f6b7b62-61aa-45db-96bd-9c31b36b653c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match one of the RDP Terminal Server settings this rule detects?
  context: >-
    The rule fires when either the Shadow value is set to enable session shadowing (DWORD 1-4), or a remote-assistance
    or security control is weakened (fAllowUnsolicited, fAllowUnsolicitedFullControl, DisableSecuritySettings, or
    DisableRemoteDesktopAntiAlias set to 1), or an InitialProgram, ServiceDll, or SecurityLayer value is written — and
    in each case the change is not the legitimate SecurityLayer=TLS (DWORD 2) value. Confirm the exact TargetObject,
    Details value, and writing process, and note which branch fired. The InitialProgram / ServiceDll branch writes an
    executable or DLL path that the payload-on-disk question depends on, while the toggle branches are confirmed by
    whether a remote session or payload followed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change RDP Terminal Server settings?
  context: >-
    Legitimate administrative activity can trigger this detection — Group Policy application, RDS role configuration,
    or an admin enabling remote access on a server. Knowing whether the user role and host function line up with a
    Terminal Server configuration change is often the fastest way to separate routine work from tampering. Registry
    writes frequently run as a machine account or SYSTEM; when User is a machine account or missing, pivot on the
    writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which RDP setting was changed, and does it enable remote access, weaken authentication, or load custom code?
  context: >-
    The value name reveals intent. Shadow enables an administrator to view or control a user's session (values 1-4
    map to view/control with or without consent). fAllowUnsolicited and fAllowUnsolicitedFullControl allow unsolicited
    remote-assistance offers. DisableSecuritySettings, DisableRemoteDesktopAntiAlias, and a downgraded SecurityLayer
    weaken connection security. InitialProgram specifies a program to run automatically at remote logon, and ServiceDll
    points the Terminal Services service at a custom DLL — a known RDP-hijack technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact value was written to this RDP key, and what does the value data enable?
  context: >-
    Decode the Details field. A DWORD of 0 in a policy value typically disables a protection, while 1 enables a
    setting; the Shadow value 1-4 selects view versus full control, with or without user consent. If the value is a
    path (InitialProgram or ServiceDll), that path identifies the program or DLL that will run at logon or be loaded by
    the Terminal Services service, and becomes a follow-on artifact to verify on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was this RDP setting later reverted or re-applied, and how does its modification history read?
  context: >-
    Registry key and value deletions are not recorded on this telemetry, so judge persistence from the value's
    re-modification history rather than from removal. A control that is weakened and then flipped back within minutes
    reads like a test; a value set once and left in place, or re-applied after a reset, points to intentional tampering
    that the operator wants to keep in effect.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this RDP setting, and what started that process?
  context: >-
    Legitimate writes come from a small set of tools — reg.exe or regedit.exe under a Group Policy or deployment
    workflow, or services.exe applying policy. Unusual lineage such as a command interpreter or script host launched
    from an Office application, a loader, or wmic/PowerShell invoking CIM methods to grant shadow rights indicates the
    change was made outside normal tooling. Tracing the parent's own origin shows whether the chain is administrative
    or attacker-driven.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry changes were made on this host in the same window?
  context: >-
    Actors who weaken one setting often weaken several. Enabling remote access commonly lands alongside credential
    caching (WDigest UseLogonCredential), UAC weakening (EnableLUA=0), NTLM or RestrictedAdmin changes, or a Run-key
    persistence entry. The triggering key will appear in the results — the signal is what else was modified from the
    same host and writing process in the surrounding window.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: If the change references a program or DLL, was that file created on disk by the writing process?
  context: >-
    An InitialProgram value runs a program at remote logon, and a ServiceDll value loads a custom DLL into the Terminal
    Services service — both are only live if the referenced file exists at that path. Confirming the writing process or
    its children created the file determines whether the mechanism is active and what it would execute. The file-write
    event carries no hash; if the payload is present, hash it from a later execution for a reputation check. The
    toggle-only branches (Shadow, fAllowUnsolicited, DisableSecuritySettings) write no path, so this applies to the
    InitialProgram / ServiceDll branch.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the RDP change take effect — what did the writing process or Terminal Services host execute afterward?
  context: >-
    After remote access is enabled or authentication is weakened, confirm whether the change was operationalized. A
    Terminal Services service host restart that loads a new ServiceDll, execution of the InitialProgram payload, or an
    interactive process chain consistent with a remote session shortly after the change all indicate the setting was
    put to use rather than left dormant. The query anchors on the Terminal Services svchost instance and on command
    lines carrying the written value data (an InitialProgram or ServiceDll path); when the flagged change was a
    Shadow or security DWORD the value-data anchor is a number and a zero here is expected — the writing
    process's spawned-processes question covers follow-on activity in that case.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_termsvc:
        Image|endswith: '\svchost.exe'
        CommandLine|contains: 'TermService'
      selection_payload:
        CommandLine|contains|expand: '%Details%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Has this RDP setting been changed before on this host?
  context: >-
    Terminal Server security and service configuration values should rarely change on a stable host, so a first-time
    modification is more notable than a routinely-touched value. Compare the historical Details values and writing
    processes — zero prior history for this key indicates a setting that has never been touched before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same RDP setting changed on other hosts, and does the pattern look like a policy push or targeted tampering?
  context: >-
    The same modification across many hosts suggests a Group Policy or software rollout; a change confined to this one
    host suggests targeted access enablement or hands-on activity. Compare the Details values and writing processes
    across hosts to tell a uniform policy change from ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the change?
  context: >-
    Configuration changes rarely occur in isolation. Reconnaissance, privilege escalation, credential staging, or
    additional persistence near the RDP change reveals whether it is one step of a hands-on session. Aggregating by
    process and parent collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out
    at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded enabling or weakening remote access and help reconstruct the timeline leading to this change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or maintenance window authorizing this RDP configuration change?
  context: >-
    Enabling remote access, session shadowing, or adjusting SecurityLayer is often done deliberately by administrators
    through Group Policy or RDS configuration. A matching change ticket, deployment record, or Group Policy push
    suggests authorized activity; absence of one when policy requires it moves the change toward unauthorized. The
    rule's own guidance notes these keys can be set by an administrator applying Group Policy, and it should be
    investigated either way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
