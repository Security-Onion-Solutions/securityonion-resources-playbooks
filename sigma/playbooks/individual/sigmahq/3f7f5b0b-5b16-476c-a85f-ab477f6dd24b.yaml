name: Lazarus System Binary Masquerading
id: f81f5c6a-7bfd-404c-8220-c913c8ef397e
description: |
  Detects a process whose Image name ends in \msdtc.exe or \gpsvc.exe AND whose path does not
  start with C:\Windows\System32\ or C:\Windows\SysWOW64\. Both names belong to Windows service
  binaries that ship only in the system directories, so a copy running from anywhere else is a
  name/location mismatch (T1036.005) rather than the OS component the name implies. The technique
  buys an attacker two things - process listings and analyst eyes read a familiar system name, and
  allow-lists or parent-process baselines keyed on the name alone may not fire. Determine what the
  binary at the non-system path actually is (PE metadata, signer, hash), how it arrived on the host,
  whether it was registered as a service, and what it did after execution.
type: detection
detection_id: 3f7f5b0b-5b16-476c-a85f-ab477f6dd24b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting process match what this rule detects — an Image ending in \msdtc.exe or
    \gpsvc.exe running from outside C:\Windows\System32\ and C:\Windows\SysWOW64\?
  context: >-
    Confirm both halves of the criteria before investing further time. Read the full Image path and
    check that the name is one of the two service binaries and that the directory is neither of the
    two system directories. A path such as C:\Windows\System32\wbem\msdtc.exe or a redirected
    SysWOW64 path is still outside the filtered prefixes and will fire; a genuine relocation by an
    installer looks the same to the rule as a dropped copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a Windows service binary from a non-system directory?
  context: >-
    msdtc.exe backs the Distributed Transaction Coordinator service and gpsvc backs Group Policy;
    neither is normally launched by a user, and neither ships outside the system directories. A
    server role that hosts a packaged application bundling its own transaction coordinator, or a
    software-distribution job staging binaries, can produce this legitimately. Establish the host's
    role and whether the account is one that would be running service binaries at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Relocating and renaming binaries to system names is a standard evasion step in offensive testing
    as well as in intrusions. Check whether an assessment is active on this host or network segment,
    and whether its scope and timing match this event. An authorized engagement with matching tool
    usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What is the actual identity of this binary based on its PE metadata and hash?
  context: >-
    The name on disk is attacker-controlled; the embedded metadata usually is not. Compare the Image
    path against OriginalFileName - the genuine files report msdtc.exe and gpsvc.dll respectively,
    so an OriginalFileName naming an unrelated tool, or a blank one, identifies the file as
    something else wearing the name. Submit the hash for reputation lookup to separate a known
    legitimate file that was merely relocated from a novel or known-bad sample.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What arguments did this binary run with, and what working directory did it run from?
  context: >-
    The rule fires on name and path alone, so the command line is unconstrained and carries whatever
    the operator passed. Decode every argument - loader and installer components frequently take a
    passphrase, an RC4 key, a mode selector, or a payload path as a positional argument, and some
    exit immediately without one. CurrentDirectory shows where the process was launched from, which
    often points at the staging directory rather than the binary's own path.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: How did this binary arrive at its non-system location on the host?
  context: >-
    A system-named binary outside the system directories was copied, downloaded, extracted, or
    dropped by some process. The file creation event names the writing process, which separates an
    installer or software-distribution agent staging a bundled component from a download tool,
    archive extractor, or loader. Match on the basename over a long window - the file may have been
    placed days or weeks before it ran.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: >-
    Was a service registered on this host pointing at a binary outside the system directories, and
    does its ImagePath match the alerting file?
  context: >-
    Both names the rule watches for belong to service binaries, and registering a service is a
    common way to get a system-named executable running under a plausible parent with automatic
    restart. Event 7045 records the service name, the ImagePath the service will launch, and the
    account it runs as. An ImagePath pointing outside C:\Windows\System32\ that matches the alerting
    binary ties the execution to a persistence mechanism. If the System channel is not collected in
    this environment, treat zero results as a visibility gap rather than evidence no service exists.
  range: -30d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - StartType
      - AccountName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What process launched this binary, and is that parent chain expected?
  context: >-
    A genuine service binary is started by services.exe. A copy at a non-system path started by
    explorer.exe, a shell, a script host, an archive utility, or a remote-execution service instead
    describes how the operator invoked it and often exposes the stage before this one. Walk further
    up the tree from the parent if the immediate parent is itself unremarkable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this binary spawn after execution?
  context: >-
    Renaming and relocating a file changes what it is called, not what it does. Children of the
    alerting binary reveal its actual objective - a command shell, a script host, an archive or
    encoding utility, or a remote-execution tool each point at a different next stage. A batch file
    driving repeated cmd.exe launches with redirected output is a common command-execution pattern
    for modular implants.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did this binary create or modify on the host after it ran?
  context: >-
    File activity attributable to the alerting process shows what it produced - staged payloads,
    configuration or key material, batch files, command-output capture files, or additional copies
    of itself under other names. The absence of file activity is also informative and points toward
    an in-memory loader.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    When this host has previously run msdtc.exe or gpsvc.exe from outside the system directories,
    what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection and filter scoped to this host, so the parent/user
    distribution reflects how the rule's specific firing pattern has run here - not routine System32
    service starts, which the filter removes. A recurring parent with a stable user is an
    application that ships its own copy of the binary; a parent or account that appears only around
    the alert is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \msdtc.exe
        - \gpsvc.exe
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection and filter scoped to this user, so the result is their
    90-day history of running these service binaries from non-system paths, aggregated by host. A
    user who has never produced this pattern is a different proposition from one who does so
    routinely across many hosts. Weigh the count and host spread against the account's role - an
    application-packaging or server-build account may do this legitimately.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \msdtc.exe
        - \gpsvc.exe
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern here or across the environment,
    or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or a machine account, user identity attributes nothing and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's selection and filter
    scoped to the alerting parent, so the result is the 90-day history of this parent launching
    these binaries from non-system paths, aggregated by host. A parent already accounting for
    thousands of prior events is vendor or OS automation; a parent that is new for this pattern is
    not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \msdtc.exe
        - \gpsvc.exe
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    identity was active elsewhere at the same time, which distinguishes a host-local event from
    movement across endpoints. Remote task scheduling and remote service creation against other
    hosts are the usual follow-on steps to look for. If the alert fired under a service principal,
    this returns agent telemetry across the fleet and the parent-driven view is the meaningful
    answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, a user-scoped network sweep returns agent noise from every host. This
    query mirrors the rule's selection and filter scoped to the alerting parent, fleet-wide, in the
    alert window. Several hosts in the same hour points to scheduled or pushed automation; a single
    host points to a host-local trigger and to manual operator activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \msdtc.exe
        - \gpsvc.exe
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process creation by Image and ParentImage in the alert window collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
    Scan for the stages that typically bracket a masqueraded execution - archive extraction or
    download immediately before, and reconnaissance, credential access, or scheduling immediately
    after.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a timeline - defense tampering
    or log manipulation, reconnaissance, or credential access preceding it change what this event
    means and where the investigation goes next. Read the preceding alerts in order rather than
    individually.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection and filter with no host scope, giving a fleet-wide count
    of the rule's firing pattern rather than the binaries' generic footprint. Many hosts firing the
    same pattern with the same path usually means a packaged application or a distribution job that
    relocates the binary and should be tuned; one host or a small unrelated set points to operator
    activity. Use the host distribution to calibrate the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith:
        - \msdtc.exe
        - \gpsvc.exe
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      condition: selection and not filter
    fields:
    - host.name
  answer_sources:
  - process_creation
