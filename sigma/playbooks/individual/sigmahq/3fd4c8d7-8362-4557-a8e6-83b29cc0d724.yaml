name: IE ZoneMap Setting Downgraded To MyComputer Zone For HTTP Protocols
id: d98a9673-6e21-4039-9de5-0a583af4eb6f
description: |
  Fires when a registry value under Internet Settings\ZoneMap\ProtocolDefaults for the http or https protocol is set to
  DWORD 0, mapping that protocol into the My Computer zone (zone 0, the most trusted). This removes the security-zone
  restrictions that normally apply to HTTP-fetched content, letting downloaded files run with local-machine trust and
  suppressing Mark-of-the-Web tagging and the associated download prompts. Legitimate causes are rare; investigate which
  protocol was downgraded, the exact zone value written, the process that made the change, and whether internet-origin
  content subsequently executed under the elevated trust (T1112 / T1553.005 / T1562.001).
type: detection
detection_id: 3fd4c8d7-8362-4557-a8e6-83b29cc0d724
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the triggering event. The TargetObject should end in \http or
    \https under Internet Settings\ZoneMap\ProtocolDefaults, and the Details value should be DWORD (0x00000000), the My
    Computer zone. Note which protocol was downgraded, because it determines the scope of the trust change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Internet Explorer security-zone settings?
  context: ProtocolDefaults zone changes are almost never part of routine user activity. Knowing whether the user role and
    host function involve browser-policy or imaging tasks is often the fastest way to separate a benign configuration push
    from tampering. User attribution is present on most endpoint registry events; when it is a machine account or SYSTEM,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What zone value was written, and which protocol does it apply to?
  context: The Details field holds the DWORD zone number and TargetObject names the protocol. Zone 0 is My Computer (most
    trusted — runs downloaded content without prompts), 1 is Local Intranet, 2 is Trusted Sites, 3 is Internet (the default
    for http/https), 4 is Restricted Sites. A value of 0 on http or https is a downgrade from the default of 3.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this ZoneMap\ProtocolDefaults location a known evasion target?
  context: ProtocolDefaults sets the default zone for a protocol when no per-domain or per-range rule applies, so demoting
    http or https here affects every URL not otherwise mapped, including downloads routed through the Internet Explorer URL
    handlers. This registry tree is a recognized Mark-of-the-Web and SmartScreen bypass location; the value name and data
    determine which protocol lost its security-zone restrictions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command performed this registry write?
  context: The registry event records the writing process image but not its command line. Pivot by ProcessGuid to the process
    creation event to recover the full invocation — for example a reg.exe add with /v http /t REG_DWORD /d 0, or a PowerShell
    Set-ItemProperty on the ProtocolDefaults path with -Value 0. The command line often reveals whether both http and https
    were downgraded in sequence and what else the same process did.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned the tool that wrote this value, and is that parent chain expected?
  context: The parent process reveals how the change was invoked. A reg.exe or powershell.exe write launched from explorer.exe
    during interactive admin work differs from one spawned by a script host (mshta.exe, wscript.exe, cscript.exe), a batch
    file, or an Office application — the latter parents point to macro or downloaded-script execution rather than a deliberate
    policy change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same session?
  context: A zone downgrade rarely lands alone. Actors who demote one protocol often also add per-domain ZoneMap entries,
    widen a Ranges IP mapping, set Security_HKLM_only, or loosen individual Zones\3 settings — and may pair the trust change
    with persistence or defense-tampering keys. Clustered registry writes from the same writing process within a short window
    reveal the full scope of the configuration changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other Internet Explorer security-zone keys modified on this host around the same time?
  context: The same trust-weakening objective is pursued through several sibling keys under Internet Settings. Per-domain
    mappings (ZoneMap\Domains, EscDomains), IP-range mappings (ZoneMap\Ranges), and the per-zone permission matrix (Zones\0-4)
    all contribute to how downloaded content is trusted. Modifications across these paths in the same window indicate a
    deliberate reconfiguration of zone trust rather than a single stray value.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Internet Settings\ZoneMap'
          - '\Internet Settings\Zones'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Does this zone downgrade still stand, or was the value later changed back?
  context: Registry key and value deletions are not observable in endpoint registry telemetry, so cleanup cannot be confirmed
    by a delete event. Judge persistence from the key's re-modification history instead — whether the protocol was later set
    back to a safe zone (3 = Internet) or left at 0. A value that stays at 0 keeps the trust bypass active across reboots.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did content execute on this host after the zone downgrade took effect?
  context: The downgrade grants local-machine trust to HTTP-fetched content and suppresses Mark-of-the-Web prompts, so the
    payoff is downloaded content running without the usual warnings. Review process executions in the hours after the change
    for script hosts (mshta.exe, wscript.exe, cscript.exe, powershell.exe) or binaries launched from user download and temp
    directories that would previously have been blocked or prompted. The query is anchored on exactly those two
    patterns — script-host executions and images running from download, temp, or Public paths — so a zero means no
    such content ran in the window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_scripthosts:
        Image|endswith:
        - '\mshta.exe'
        - '\wscript.exe'
        - '\cscript.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
      selection_userpaths:
        Image|contains:
        - '\Downloads\'
        - '\AppData\Local\Temp\'
        - '\Users\Public\'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Has this ProtocolDefaults zone key been modified before on this host?
  context: ProtocolDefaults values should rarely change on a normal host. Zero or very low history for this key indicates a
    first-time modification, which is more suspicious than a key that changes routinely. Compare historical Details values to
    see whether the protocol has been held at zone 0 before or was previously at its default of 3.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the tool that made this change?
  context: A writing process that has never been seen on the host is more suspicious than one that runs regularly. Very low
    historical counts for the tool that performed the zone write suggest first-time or rare use of that mechanism on this
    host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the change reveals what led to it and what
    followed — reconnaissance, downloaded-script execution, privilege escalation, or persistence. Novel parent-child process
    pairs stand out at low counts against the routine high-count telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this ProtocolDefaults key downgraded on other hosts in the environment?
  context: The same modification across many hosts may indicate a policy or software push; a change isolated to this host is
    more likely targeted. Compare Details values across hosts to distinguish a fleet-wide configuration from a one-off
    downgrade, and note whether the writing process is the same everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or execution of downloaded content — may
    reveal the stages that preceded the zone downgrade and help reconstruct the timeline. Trust-control weakening frequently
    accompanies or follows an initial foothold.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
