name: Malicious ShellIntel PowerShell Commandlets
id: f57e39eb-f4cd-496b-b60c-912218194c46
description: |
  Fires when PowerShell script-block content (EID 4104) contains any of the commandlet names
  Invoke-SMBAutoBrute, Invoke-GPOLinks, or Invoke-Potato — components of a publicly available
  exploitation toolkit covering SMB password brute-forcing against domain accounts, Group Policy
  link enumeration, and Potato-family NTLM-relay privilege escalation. Legitimate occurrences are
  largely limited to authorized penetration testing, so the investigation should establish who ran
  the script and from where, read the complete script for its targets and configuration, and look
  for the credential-access, escalation, and lateral-movement follow-through these tools exist to
  deliver. Script-block capture is policy-gated per host — default installs log only content
  matching Microsoft's built-in suspicious-strings checks — so absence of surrounding 4104
  evidence is not absence of activity.
type: detection
detection_id: 402e1e1d-ad59-47b6-bf80-1ee44985b3a7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block contain Invoke-SMBAutoBrute, Invoke-GPOLinks, or Invoke-Potato?
  context: Confirm the alert is a true positive by reading the complete script. The rule fires when
    script-block content contains any of the three commandlet names, so note which one matched.
    Long scripts are split across multiple 4104 events — this retrieves every chunk of the alerting
    block (sequence/total order) so the match is judged on the whole script. Distinguish an actual
    function definition or invocation from an incidental mention of the name, such as a security
    scanner or documentation string.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
- question: Is this user or host associated with authorized security testing?
  context: These commandlets come from a public exploitation toolkit, and the main benign
    explanation is an authorized penetration test or red-team exercise. The query shows the
    alerting block's host, user, and on-disk script path (blank for interactive or in-memory
    execution). An account with no security-testing role, or a host outside any known assessment
    scope, removes that explanation; confirm with whoever coordinates testing windows before
    treating it as sanctioned.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
- question: What does the complete script do, and which targets, accounts, or payloads does it reference?
  context: Script-block content is logged after decoding, so any -EncodedCommand wrapper is already
    unwrapped; only string-level obfuscation inside the script (concatenation, format operators,
    backticks) still needs manual work. Read the full reassembled script for the matched
    commandlet's arguments — account and password lists or lockout thresholds for SMB
    brute-forcing, target names for Group Policy enumeration, listener and relay settings for
    Potato-family escalation — plus any download cradles, AMSI tampering, or additional tooling
    loaded alongside it. Paths or URLs named in the script are follow-on artifacts worth chasing
    with the file and network questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
- question: Does the script exist on disk, and what created it?
  context: When the script block ran from a file, its path is recorded on the 4104 event. A script
    on disk in a user-writable or staging location (Temp, AppData, ProgramData, Downloads) implies
    a delivery step that wrote it — find the file-creation event to identify the process and
    account that staged it. Offensive PowerShell modules are commonly pulled straight into memory
    with a download cradle, which logs no path at all; for content like this, fileless execution is
    itself a deliberate evasion choice worth noting.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - EventType
      - TargetFilename
      - Image
      - User
- question: Which parent process launched the PowerShell host that ran this script?
  context: Script-block events carry no process identity, so this pivots by host and user over the
    preceding day to list the user's PowerShell launches with their parents. An interactive session
    typically descends from explorer.exe, a terminal, or a remote-administration client; a
    PowerShell host descending from an Office application, a browser, mshta, or an unexpected
    service points to a delivery step that should be chased before accepting any
    authorized-testing explanation.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Did a process other than a standard PowerShell host load the PowerShell engine assembly?
  context: Offensive toolkits are frequently run through unmanaged runners that host the PowerShell
    engine inside another .NET process, sidestepping controls and logging aimed at powershell.exe.
    System.Management.Automation loading into a binary that is not a recognized PowerShell host
    establishes that indirect invocation happened on this host and names the hosting process. Rare
    or never-before-seen hosting binaries deserve signature and origin checks.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\System.Management.Automation.ni.dll'
      filter_hosts:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection and not filter_hosts
    fields:
      - Image
      - ImageLoaded
      - SignatureStatus
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Loading an offensive module commonly follows a preparation step — AMSI tampering
    (AmsiUtils, amsiInitFailed), an execution-policy bypass flag, Defender preference changes, or a
    downgrade to PowerShell v2 which lacks script-block logging. Any of these on the same host in
    the preceding hour makes the sanctioned-testing explanation harder to sustain and belongs in
    the timeline alongside the alerting script.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did the PowerShell session spawn follow-on processes after the script ran?
  context: A 4104 event records script content, not outcome, and carries no process link — this
    pivots by host, user, and time to the children of the user's PowerShell hosts in the half hour
    after the block was logged. Successful credential brute-forcing or a relay-based escalation is
    typically followed by new tooling, a shell under elevated context, or remote-execution
    utilities; those children appear here. If the alert fired under SYSTEM or another service
    principal, the user anchor is broad — read the results with that in mind rather than dropping
    it.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did PowerShell processes on this host generate SMB, LDAP, or Kerberos traffic around the alert?
  context: The matched commandlets are network-active by design — SMB brute-forcing drives
    authentication attempts to many hosts on port 445 and checks lockout state against domain
    controllers, and Group Policy enumeration queries the directory over LDAP. Aggregating
    connections from PowerShell hosts on directory and file-service ports shows the fan-out
    profile, which domain controllers were touched, and whether the activity stayed local or swept
    the network. Endpoint-recorded connections carry the owning process; network-sensor records of
    the same traffic may not.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
        DestinationPort:
          - 88
          - 139
          - 389
          - 445
          - 636
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: PowerShell logs every script block at verbose level only when the Script Block Logging
    policy is enabled; by default it logs only content matching Microsoft's built-in
    suspicious-strings checks, at warning level. On a warning-only host the alerting block is a
    fragment of the host's PowerShell activity, and surrounding benign-looking blocks may simply
    not have been logged. Use the level distribution here to calibrate how complete every other
    script-channel result in this investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
- question: What other PowerShell script activity occurred on this host around the alert?
  context: Attacker PowerShell rarely runs as a single block — module loading, reconnaissance, and
    follow-on tooling produce a cluster of script blocks in a short window, and surrounding blocks
    from the same session often contain the plaintext arguments or staging steps the alerting
    fragment lacks. The log.level column shows whether the host logs all blocks (verbose) or only
    automatically flagged content (warning) — on a warning-only host this view is partial by
    design, and absence of surrounding blocks is not evidence nothing else ran.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
- question: What other activity occurred on this host around the time of the alert?
  context: Examining process activity around the alert reveals the immediate context — what led to
    this script running and what happened after. The aggregation collapses repetitive agent
    telemetry into high-count rows while novel parent-child pairs stand out at low counts; look
    for reconnaissance commands, credential tooling, or persistence mechanisms bracketing the
    alert.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this exact script block run on this host before?
  context: A script that has run routinely for months reads very differently from one appearing for
    the first time. The script block hash matches byte-identical content only — zero history means
    this exact content is new to the host, but says nothing about trivially edited variants. On
    hosts without full Script Block Logging the history contains only blocks Microsoft
    auto-flagged as suspicious, so an empty result is weaker evidence there.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
- always_include: true
  question: Has this user produced this toolkit pattern before, and does that history fit their role?
  context: The query mirrors the rule's own selection scoped to this user — a 90-day history of
    this specific commandlet pattern aggregated by host, not generic PowerShell use. A penetration
    tester or security engineer with a history of producing it during assessment windows reads
    differently from an account emitting it for the first time; weigh the count against the user's
    role. History covers only hosts logging the PowerShell channel, and non-flagged content
    appears only where full script-block logging is enabled, so zero history is weaker evidence on
    a default-logging fleet.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Invoke-SMBAutoBrute
        - Invoke-GPOLinks
        - Invoke-Potato
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Which hosts have produced this script pattern in the last 90 days, and is the alerting host among them?
  context: When the alert fires under a service principal, user identity does not attribute the
    behavior, and script-block events carry no process identity to pivot on — the pattern itself
    is the pivot. This mirrors the rule's selection fleet-wide over 90 days, aggregated by host. A
    pattern appearing routinely across many hosts suggests recurring assessment tooling or a
    security product exercising detections; one that has never appeared before, or only on this
    host, is the deviation worth chasing. Only hosts shipping the PowerShell channel (and, for
    non-flagged content, with full logging enabled) can appear, so absence elsewhere is weak
    evidence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Invoke-SMBAutoBrute
        - Invoke-GPOLinks
        - Invoke-Potato
      condition: selection
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: The same account acting on several hosts in the alert window widens the scope —
    credential brute-forcing from one host paired with logons or tooling on others is how use of
    freshly obtained credentials looks. Hosts this account does not normally touch matter as much
    as the commands run there. If the alert fired under SYSTEM or another service principal, this
    view degrades to agent-telemetry noise; the fleet-wide pattern question is the meaningful
    substitute in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same script pattern fire on other hosts in the same window?
  context: The query mirrors the rule's selection fleet-wide in the alert window, aggregated by
    host — the service-principal-safe version of the cross-network view, since these events carry
    no process identity to pivot on. Several hosts producing the pattern in the same window points
    to pushed automation or a coordinated assessment; a single host points to a host-local
    trigger. Coverage is policy-gated per host, so absence elsewhere remains weak evidence on a
    default-logging fleet.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection:
        ScriptBlockText|contains:
        - Invoke-SMBAutoBrute
        - Invoke-GPOLinks
        - Invoke-Potato
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — initial-access activity, defense tampering,
    reconnaissance — may reveal how an actor reached a position to run exploitation tooling at
    all. The preceding alert timeline helps reconstruct the sequence that led to this script
    rather than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
