name: Created Files by Microsoft Sync Center
id: 0c9002fe-89f7-47e8-ab04-d1b633f9cd39
description: |
  This rule detects mobsync.exe (Microsoft Sync Center) creating a file whose name ends in .dll or .exe. mobsync is a signed Microsoft binary that performs offline-file synchronization and does not normally write executable content; when a payload is injected into it, the trusted process is used to drop DLLs or executables to disk, making the file activity appear as legitimate system behavior. Investigation should determine what mobsync wrote and where, whether mobsync's own execution shows signs of injection (empty command line, an unexpected parent, unusual module loads), and whether the dropped file subsequently executed or made outbound connections.
type: detection
detection_id: 409f8a98-4496-4aaa-818a-c931c0a8b832
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the created file and the responsible process match what this rule detects?
  context: Confirm the alert is a true positive before investing analysis time. Verify that the responsible process is mobsync.exe and that the created file ends in .dll or .exe, and note the exact path and operation type. Legitimate offline-file synchronization rarely writes executable content, so an executable created by mobsync is the pattern worth confirming first.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to see mobsync write executable files?
  context: Legitimate administrative or sync activity can trigger this detection. Knowing whether the host role and the acting user account are consistent with mobsync producing a .dll or .exe is often the fastest way to separate a routine sync artifact from an injected-process drop. When the user is a machine or service account, judge by the host role and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was mobsync's own command line and integrity level when it wrote the file?
  context: mobsync launched for genuine offline-file synchronization carries a populated command line and a predictable integrity level. An empty or missing command line on mobsync is the canonical signature of code injected into the process, and an elevated integrity level for a normally user-context sync process points to privilege abuse. Decode any arguments present for file paths, DLL entrypoints, or URLs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - IntegrityLevel
- question: What is the content of the file mobsync wrote? Check for obfuscation, encoded strings, and malware indicators.
  context: Read and analyze the dropped file's actual content. For a DLL or executable, check imports, embedded strings, packer signatures, and signing status; compare suspicious strings against threat intelligence. Content retrieval is a manual step from the endpoint or from an EDR console, using the path shown here as the anchor.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so this looks for the dropped .dll or .exe executing and reads its hash. Submit that hash to threat-intel services to determine whether it is known malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What modules did mobsync load around the alert, and are any unsigned or unusual?
  context: Code injected into a trusted process frequently pulls in DLLs that a normal offline-file sync never loads. Unsigned modules, modules with a failed or missing signature, or modules loaded from user-writable directories are the observable surface of injection when handle-access telemetry is unavailable. A freshly dropped DLL that mobsync itself then loads ties the file-creation event directly to in-process execution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned mobsync, and is that parent chain expected?
  context: mobsync legitimately starts from the service control manager or from a user session for offline-file sync. A parent such as an Office application, a script host (wscript.exe, mshta.exe), or a loader process is inconsistent with genuine sync and points to the trusted binary being launched or hollowed for proxy execution. Review the parent image and its command line for how mobsync was actually invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What child processes did mobsync spawn after writing the file?
  context: A trusted process used to drop a payload often launches it or hands off to another binary for the next stage. Children such as cmd.exe, powershell.exe, rundll32.exe, or regsvr32.exe under mobsync indicate execution of the dropped artifact or additional post-injection activity. mobsync performing genuine sync spawns few or no children.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did mobsync make outbound network connections around the time it wrote the file?
  context: mobsync's legitimate synchronization is largely local file activity. An injected mobsync is a known beaconing host, so outbound connections to non-Microsoft infrastructure alongside a fresh executable drop point to command-and-control or additional tool retrieval. Destination hostnames are resolved by a separate lookup event and are sparse here, so anchor on the destination IP and pivot to DNS if a domain is needed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other files did mobsync write or delete around the alert?
  context: A process that drops one executable often drops several — a loader unpacking components, a tool staging output, or a payload writing companion files. The breadth, paths, and extensions of mobsync's other file activity distinguish a single artifact from a staged deployment and enumerate what else needs review. The correlation covers mobsync and any direct child processes, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this file been created on this host before?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. First-time appearance of an executable dropped by mobsync should be checked even if the filename seems benign, since injected-process drops frequently use plausible or randomized names.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: Even a trusted binary can be abused. This mirrors the rule's selection — mobsync creating a .dll or .exe — scoped to this host, so the resulting program and user distribution reflects how this specific pattern has historically run here rather than generic mobsync usage. A new acting program process, an unexpected user account, or a first-time occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_mobsync:
        Image|endswith: \mobsync.exe
      filter_created_file:
        TargetFilename|endswith:
        - .dll
        - .exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_mobsync and filter_created_file) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user previously produced this rule's pattern, and does that history fit their role?
  context: This mirrors the rule's selection scoped to the acting user, giving that user's 90-day history of mobsync creating executables, grouped by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset. On file events the user is often a machine or service account, in which case the launch-mechanism history carries more weight.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_mobsync:
        Image|endswith: \mobsync.exe
      filter_created_file:
        TargetFilename|endswith:
        - .dll
        - .exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_mobsync and filter_created_file) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this rule's pattern here or across the environment, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. This mirrors the rule's selection scoped to the alerting program, giving the 90-day history of that program driving mobsync executable creation. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_mobsync:
        Image|endswith: \mobsync.exe
      filter_created_file:
        TargetFilename|endswith:
        - .dll
        - .exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_mobsync and filter_created_file) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on other hosts, the scope of the event may be larger than this one drop. When the alert fires under a machine or service account, this view returns broad agent-telemetry noise, so read it alongside the parent-driven cross-host view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: Under a service principal, checking what the user did across the network returns agent-telemetry noise, since every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism fired elsewhere; this mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_mobsync:
        Image|endswith: \mobsync.exe
      filter_created_file:
        TargetFilename|endswith:
        - .dll
        - .exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_mobsync and filter_created_file) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This mirrors the rule's selection with no host scope, giving a fleet-wide count of mobsync creating executables rather than generic mobsync usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that happens to drop executables through mobsync; one host or a small unrelated set points to targeted operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_mobsync:
        Image|endswith: \mobsync.exe
      filter_created_file:
        TargetFilename|endswith:
        - .dll
        - .exe
      condition: selection_mobsync and filter_created_file
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the injection and drop, and help reconstruct the full timeline. Injection into a trusted process is often a mid-chain step rather than the first action on a host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
