name: Suspicious File Download From IP Via Wget.EXE - Paths
id: 5ff41c5d-20b2-4cdd-a3e1-a4fde7cd8c08
description: |
  Detects wget.exe invoked to download a file directly from a bare IP address over HTTP(S) and write it
  to a staging-prone location, using the output flag (-O or --output-document) to control the destination
  path. The rule fires only when all of these conditions hold together: the binary is wget.exe (by Image
  or OriginalFileName), the command line contains an http URL whose host is a dotted-quad IP rather than a
  domain name, an explicit output flag is present, and the target path falls under a world-writable or
  user-profile staging directory (PerfLogs, Temp, Users\Public, Windows\Help, Windows\Temp, Temporary
  Internet, or a user's Favorites/Favourites/Contacts/Pictures folder). Legitimate use is possible where an
  administrator or automation deliberately fetches from an internal host by IP, but downloading from a raw
  IP into a staging directory is a common payload-retrieval pattern; the investigation should establish what
  was fetched, from where, who ran it, and what executed afterward.
type: detection
detection_id: 40aa399c-7b02-4715-8e5f-73572b493f33
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line show wget.exe downloading from a bare IP to a staging path with an output flag?
  context: Before investing investigation time, confirm the alert is a true positive. Read the full command
    line and verify that all firing conditions are present together; wget.exe (or a renamed copy reporting
    OriginalFileName wget.exe), an http(s) URL whose host is a dotted-quad IP rather than a domain, an output
    flag (-O or --output-document), and a destination path under a world-writable or user-profile staging
    directory. A download from a domain name, to a non-staging path, or without the output flag does not match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files from raw IP addresses via command-line tools?
  context: Legitimate administrative activity can trigger this detection. A developer host, a build agent, or
    an IT workstation may pull artifacts from an internal server by IP; a general-purpose user endpoint
    fetching an executable from a raw IP into a staging directory is harder to explain. Knowing whether this
    user role and host function routinely perform command-line downloads is often the fastest way to separate
    routine operations from payload retrieval.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this wget invocation fetch, from which IP, and to what file path?
  context: The full command line reveals the operation. Read off the source IP and URL path, the output flag
    target so you know the on-disk filename and directory, and any extra flags (recursion, headers, retries,
    referer spoofing, certificate-validation bypass) that change what was retrieved or how. The host+binary
    scope here captures any other wget executions in the same window, in case the download was split across
    sequential invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wget execution and is that parent chain expected?
  context: The parent process reveals how the download was launched. An interactive shell, a script host
    (wscript.exe, cscript.exe, mshta.exe), an Office application, or a scheduled-task host as the immediate
    parent points to operator or automated retrieval rather than a user double-clicking; a benign parent such
    as a known deployment tool or explorer.exe is easier to attribute. Walk up the tree from the immediate
    parent to see what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run wget.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. wget
    is not a default Windows component, so on many endpoints any execution is itself notable. Zero or very low
    historical counts indicate first-time or rare use and raise the priority of understanding how the binary
    arrived.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's wget-from-IP pattern, what parents and users drove
    it, and does the current alert fit that pattern?
  context: Even an established tool can be abused. This query mirrors the rule's full selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this specific firing pattern (not
    generic wget usage) has historically run here. A new parent process, an unexpected user account, or an
    unusual command-line structure against that baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_paths:
      - CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Help\
        - :\Windows\Temp\
        - \Temporary Internet
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this wget execution spawn afterward?
  context: The processes that run after a download reveal its actual impact. A downloader that simply writes a
    file leaves no children; one that immediately executes what it fetched, or chains into cmd.exe,
    powershell.exe, rundll32.exe, or another installer, indicates the retrieved payload was run. Unexpected
    children are the strongest sign the download was the first stage of execution rather than a benign file
    transfer.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Payload retrieval rarely occurs in isolation. Activity surrounding the download may reveal
    reconnaissance, credential access, staging, or persistence installation that provides broader context.
    Look for archive utilities, script hosts, scheduled-task creation, or additional download tools clustered
    in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired this rule's wget-from-IP pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the firing pattern rather than generic wget usage. Many hosts running the same pattern points to
    scripted deployment or a shared automation job; one host or a small unrelated set points to manual operator
    activity. Use the host spread and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_paths:
      - CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Help\
        - :\Windows\Temp\
        - \Temporary Internet
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_paths:
      - CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Help\
        - :\Windows\Temp\
        - \Temporary Internet
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_paths:
      - CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Help\
        - :\Windows\Temp\
        - \Temporary Internet
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar downloads or follow-on execution on other hosts in the same
    window, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wget.exe
      - OriginalFileName: wget.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
      - CommandLine|re: \s-O\s
      - CommandLine|contains: --output-document
      selection_paths:
      - CommandLine|contains:
        - :\PerfLogs\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Help\
        - :\Windows\Temp\
        - \Temporary Internet
      - CommandLine|contains|all:
        - :\Users\
        - \Favorites\
      - CommandLine|contains|all:
        - :\Users\
        - \Favourites\
      - CommandLine|contains|all:
        - :\Users\
        - \Contacts\
      - CommandLine|contains|all:
        - :\Users\
        - \Pictures\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this download, what happened after, and whether it is part of a larger sequence. Look
    for reconnaissance, privilege escalation, or persistence mechanisms among the surrounding process activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as reconnaissance,
    defense tampering, or credential access, may reveal the attack stages that preceded this download and help
    reconstruct the full timeline of how the activity reached the point of retrieving a remote payload.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
