name: ScreenSaver Registry Key Set
id: 076a9d4b-434a-47cc-8812-0ea84c5dbd6c
description: |
  Detects a registry write that sets the SCRNSAVE.EXE value under HKCU\Control Panel\Desktop to a file ending in .scr, where the writing process is rundll32.exe and the .scr path lies outside the System32/SysWOW64 screensaver directories. This is the InstallScreenSaver proxy-execution technique: rundll32 invokes desk.cpl's InstallScreenSaver export to register an arbitrary, renamed executable as the active screensaver, which Windows then runs after the idle timeout — a signed-binary proxy execution (T1218.011) that doubles as persistence. Investigation should determine what executable SCRNSAVE.EXE now points to, whether that file is a genuine screensaver or a masqueraded payload in a user-writable location, what invoked rundll32, and whether the payload has executed.
type: detection
detection_id: 40b6e656-4e11-4c0c-8772-c1cc6dae34ce
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: 'Do the registry key path, the .scr value data, and the writing process match what this rule detects?'
  context: 'Confirm this is a true positive before investing time. The modified value should be SCRNSAVE.EXE under Control Panel\Desktop, the Details data should be a path ending in .scr that is not inside System32 or SysWOW64, and the writing process (Image) should be rundll32.exe. All three conditions hold together for the rule to fire.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - TargetObject
      - Details
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'Is this user and host expected to reconfigure the screensaver through rundll32 and desk.cpl?'
  context: 'Changing the active screensaver is normally done through the Settings UI or Group Policy, not by rundll32 invoking desk.cpl against a .scr outside the system directories. Confirm whether the account and host have a legitimate reason for this operation. If User is a machine account or SYSTEM, pivot on the writing process rather than the user identity.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'What executable path was written to SCRNSAVE.EXE, and is this a persistence or evasion location?'
  context: 'The SCRNSAVE.EXE value under Control Panel\Desktop sets the program Windows runs as the screensaver after the idle timeout, so a non-system path here is a persistence mechanism. Read the Details field as a file path: a .scr inside System32 or SysWOW64 is a normal screensaver, while a .scr in a user profile, Temp, AppData, or ProgramData directory is almost certainly a renamed executable staged for proxy execution.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: 'What were rundll32''s command-line arguments and what process launched it?'
  context: 'The registry event names rundll32 as the writer but carries neither its arguments nor its parent. Pivot to the process event to read both: the technique calls rundll32.exe desk.cpl,InstallScreenSaver <path-to-.scr>, so confirm the desk.cpl,InstallScreenSaver invocation and the exact .scr path, and check whether the parent fits a legitimate screensaver change (explorer.exe and interactive shells are user-driven; office applications, script hosts such as wscript.exe or mshta.exe, and remote-access tools are not).'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - CurrentDirectory
- question: 'What process launched rundll32, and is that parent chain expected for a screensaver change?'
  context: 'The parent process reveals how rundll32 was invoked. A genuine user change may descend from explorer.exe or an interactive shell; invocation from office applications, script hosts, or a remote-access tool points to scripted or malicious use. Capture the parent image and its command line to judge legitimacy.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: 'Was the .scr payload recently created on disk, and what process wrote it?'
  context: 'Registering a .scr as the screensaver requires the file to exist first, typically created by copying a legitimate executable (for example cmd.exe or powershell.exe) to a .scr name. Look for creation of .scr files on this host outside System32 and SysWOW64 and identify the writing process, which reveals whether the payload was copied locally, extracted from an archive, or written by another tool.'
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_scr:
        TargetFilename|endswith: .scr
      filter_system:
        TargetFilename|contains:
          - C:\Windows\System32\
          - C:\Windows\SysWOW64\
      condition: selection and selection_scr and not filter_system
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: 'Has any .scr file executed as a process on this host, indicating the screensaver payload ran?'
  context: 'Once SCRNSAVE.EXE points to the planted file, Windows launches it after the idle timeout, so a .scr running as a process is the proxy-execution payload firing. Look for process creations whose image ends in .scr outside System32 and SysWOW64, capture the parent (the screensaver host launches it, not rundll32) and the hash, and use the hash for reputation lookup, since the executing image carries it while the file-write event does not.'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_scr:
        Image|endswith: .scr
      filter_system:
        Image|contains:
          - C:\Windows\System32\
          - C:\Windows\SysWOW64\
      condition: selection and selection_scr and not filter_system
    fields:
      - Image
      - ParentImage
      - CommandLine
      - Hashes
- question: 'What other registry values were modified on this host in the same session, including the companion screensaver settings?'
  context: 'The InstallScreenSaver flow also sets ScreenSaveActive to 1 and ScreenSaveTimeout under the same Control Panel\Desktop key to force the screensaver to run; seeing those alongside SCRNSAVE.EXE confirms the full configuration. Clusters of unrelated registry changes in the same window (Run keys, service configuration, security-policy values) indicate a hands-on session or an installer-style implant pursuing multiple objectives.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: 'Has this SCRNSAVE.EXE key on this host been modified before, and what values were previously set?'
  context: 'A screensaver that has been stable for months and suddenly points to a new executable is more suspicious than a value that changes routinely. Compare historical Details values for this key on this host: repeated identical settings suggest managed configuration, while a novel non-system path appearing for the first time aligns with the technique.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: 'What other process activity occurred on this host around the time of the screensaver change?'
  context: 'Alerts rarely occur alone. A registry-based proxy-execution setup is often preceded by the copy or download that staged the .scr and followed by the tools the operator ran next. Aggregating surrounding process activity surfaces novel parent-child pairs against the background of routine agent telemetry.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: 'Did other detections fire on this host in the hours before the screensaver change?'
  context: 'Earlier alerts on the same host — reconnaissance, credential access, or defense tampering — may reveal the stages that led to staging a proxy-execution payload and help reconstruct the timeline.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: 'Was rundll32.exe executed from its expected System32 or SysWOW64 path?'
  context: 'rundll32.exe running from outside the system directories would indicate the LOLBin itself was copied or renamed to evade path-based controls. Compare the writing process image and its OriginalFileName against the expected system location.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: 'Were other proxy-execution LOLBins used on this host recently?'
  context: 'Operators who proxy-execute through one signed binary often reach for others. Finding regsvr32, mshta, msiexec, installutil, or similar proxy-execution utilities running on the same host in the same window strengthens the case that this screensaver registration is deliberate defense-evasion activity rather than a one-off.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: 'How often has this host set the screensaver to a non-system .scr through rundll32 over the past 90 days?'
  context: 'A screensaver-registration pattern with no prior history on a host is more suspicious than one that recurs under stable conditions. This counts only the rule''s specific firing pattern (rundll32 writing a non-system .scr to SCRNSAVE.EXE), not all rundll32 use, so the count and command-line projection show whether this pattern is established here or new.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        Image|endswith: \rundll32.exe
      registry:
        TargetObject|contains: \Control Panel\Desktop\SCRNSAVE.EXE
        Details|endswith: .scr
      filter:
        Details|contains:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and registry and not filter) and _pb_scope
    fields:
    - CommandLine
- question: 'When this host has previously fired this screensaver-registration pattern, what programs and users drove it, and does the current alert fit?'
  context: 'The query mirrors the rule''s selection scoped to this host, so the program and user distribution reflects how this specific pattern has run here before. A new acting program process or an unexpected account driving the current alert is the deviation worth chasing.'
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        Image|endswith: \rundll32.exe
      registry:
        TargetObject|contains: \Control Panel\Desktop\SCRNSAVE.EXE
        Details|endswith: .scr
      filter:
        Details|contains:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and registry and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: 'Have other hosts fired this screensaver-registration pattern in the past week, and does the spread look like automation or isolated activity?'
  context: 'With no host scope, this returns a fleet-wide count of the rule''s firing pattern rather than generic rundll32 usage. Many hosts registering non-system .scr screensavers points to scripted deployment or a shared image; one or a few unrelated hosts points to hands-on operator activity.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: registry_set
    detection:
      selection:
        Image|endswith: \rundll32.exe
      registry:
        TargetObject|contains: \Control Panel\Desktop\SCRNSAVE.EXE
        Details|endswith: .scr
      filter:
        Details|contains:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      condition: selection and registry and not filter
    fields:
    - host.name
