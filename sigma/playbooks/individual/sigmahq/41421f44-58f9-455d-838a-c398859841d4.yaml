name: ETW Logging Tamper In .NET Processes Via CommandLine
id: 4d9ecd00-f04a-40ad-9f76-3f63e3ff3e4a
description: |
  Detects a process whose command line contains a COMPlus ETW environment
  variable - COMPlus_ETWEnabled or COMPlus_ETWFlags - which controls whether the
  .NET runtime emits Event Tracing for Windows events. The rule fires when the
  command line of a single process contains either token. Passing
  COMPlus_ETWEnabled=0 (or COMPlus_ETWFlags=0) when launching a .NET process
  suppresses the runtime provider that records loaded assemblies and JIT
  activity, blinding telemetry that relies on .NET ETW events. Some developer
  and diagnostics workflows legitimately set these variables, so the
  investigation should determine which executable carried the variable, whether
  the value disables logging, what the process did once ETW was suppressed, and
  whether the same pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 41421f44-58f9-455d-838a-c398859841d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a COMPlus ETW environment variable
    (COMPlus_ETWEnabled or COMPlus_ETWFlags), matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process command line contains either COMPlus_ETWEnabled or
    COMPlus_ETWFlags. Read the exact command line and note which token is present and
    what value it is assigned - a value of 0 disables the .NET runtime ETW provider,
    while a non-zero or unrelated value may be a benign diagnostic setting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to launch .NET processes with ETW logging
    variables set?
  context: Setting COMPlus ETW variables is normal for a narrow set of developers and
    diagnostics workflows that profile or debug .NET runtime behavior. Most users and
    most endpoints never set them. Knowing whether the acting account and the host
    function involve .NET development or runtime troubleshooting is often the fastest
    path to separating a benign diagnostic invocation from deliberate telemetry
    suppression.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which executable carried the COMPlus ETW variable, and is that binary and
    its path expected to set runtime logging controls?
  context: The rule constrains only the command line, not the image, so any .NET
    process can carry the variable. Identify the executable that ran with the COMPlus
    token and where it lives. A signed development tool or diagnostics utility running
    from a normal install path is a different finding than an unknown or unsigned
    binary running from a user-writable directory that sets ETW controls before doing
    its work. The image and command line together identify what was actually launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Which .NET ETW logging control was targeted, and does the assigned value
    disable provider output?
  context: COMPlus_ETWEnabled and COMPlus_ETWFlags govern whether the .NET runtime
    emits ETW events for loaded assemblies and JIT activity. COMPlus_ETWEnabled=0
    turns the runtime provider off entirely; COMPlus_ETWFlags selectively masks event
    categories. Read the full command line to confirm which variable was set and to
    what value, since a value of 0 removes the telemetry an EDR relies on to see
    in-process .NET execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was ETW suppression scoped to this single process launch, or has the
    variable been set persistently for the host?
  context: A COMPlus variable passed on the command line affects only that one process
    invocation. The same variable can also be set persistently as a system or user
    environment variable, in which case every subsequent .NET process inherits the
    suppressed logging. Check whether the variable exists in the host environment so
    that the loss of .NET ETW telemetry is understood as one-off or ongoing; if it is
    persistent it should be removed to restore runtime visibility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the ETW-suppressed process was
    launched?
  context: Suppressing .NET ETW logging is usually a preparatory step that lets
    in-process activity run without generating runtime telemetry. Examining what ran
    in the window immediately after the launch reveals what the suppression was meant
    to hide - follow-on execution, credential access, or further configuration
    changes. A burst of process creation right after the suppressed launch points to
    the activity the tampering enabled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An actor who suppresses .NET ETW logging often pairs it with other evasion
    steps - stopping security services, clearing event logs, deleting shadow copies,
    or weakening firewall rules. Finding multiple tampering events from the same user
    or parent process within a short window indicates a coordinated effort to blind
    the host rather than an isolated diagnostic action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned the ETW-suppressed process, and is that parent chain
    expected?
  context: The parent process reveals how the suppressed .NET process was invoked. A
    COMPlus variable is set by whatever launched the process, so the parent is where
    the suppression decision was made. Interactive development usually shows a console
    shell or an IDE; an unexpected parent such as a script host, mshta.exe, or an
    Office application points to automated or malicious invocation that set the
    variable to evade runtime logging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - COMPlus_ETWEnabled
        - COMPlus_ETWFlags
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - COMPlus_ETWEnabled
        - COMPlus_ETWFlags
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    ETW suppression was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - COMPlus_ETWEnabled
        - COMPlus_ETWFlags
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    ETW-suppressed launch reveals what led to it and what followed - the parent that
    staged the process, reconnaissance, or follow-on execution the suppressed logging
    was meant to cover. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    other defense tampering - may reveal the attack stages that preceded the ETW
    suppression and help reconstruct the full timeline. Telemetry suppression is often
    one step in a sequence, so prior alerts give the context for why logging was
    disabled.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's COMPlus ETW pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate diagnostics can set COMPlus ETW variables. This query
    mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic process activity. A new parent process, an
    unexpected account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - COMPlus_ETWEnabled
        - COMPlus_ETWFlags
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's COMPlus ETW pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the COMPlus ETW firing pattern rather than
    generic process activity. Many hosts firing the same pattern points to a build
    pipeline or scripted deployment that sets the variable by design; one host or a
    small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - COMPlus_ETWEnabled
        - COMPlus_ETWFlags
      condition: selection
    fields:
    - host.name
