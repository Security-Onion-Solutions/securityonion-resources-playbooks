name: Suspicious Loading of Dbgcore/Dbghelp DLLs from Uncommon Location
id: c64d1cce-7391-4ad8-859e-626865577844
description: >-
  Detects a process running from an uncommon or user-writable directory (Temp, Public,
  Perflogs, Recycle Bin, profile media folders such as Documents/Pictures/Music/Videos,
  web roots, or a Startup path) that loads dbgcore.dll or dbghelp.dll. Both libraries
  export MiniDumpWriteDump, the routine used to capture a full process memory snapshot --
  legitimately by debuggers and crash-reporting tools, and abusively to dump LSASS for
  credential theft or to suspend a protected security process. The anomaly the rule keys
  on is where the loading executable lives, not where the DLL came from: the debug library
  is frequently the normal signed system copy. Determine what the loading executable is
  and how it arrived, whether the debug DLL is signed, what the command line and child
  processes indicate about a memory-dump or process-suspension attempt, and whether a dump
  file, credential access, or lateral movement followed.
type: detection
detection_id: 416bc4a2-7217-4519-8dc7-c3271817f1d5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert match the rule -- a process running from an uncommon or user-writable directory that loaded dbgcore.dll or dbghelp.dll?
  context: >-
    Confirm the alert by reviewing the loading process path (Image) and the loaded module
    (ImageLoaded). The rule fires on the combination: an executable located under a flagged,
    user-writable directory (Temp, Public, Perflogs, Recycle Bin, profile media folders,
    web roots, or a Startup path) that loads one of the two memory-dump debug libraries.
    The debug DLL itself is often the normal system copy, so the pattern the rule keys on
    is where the loading process lives, not where the DLL came from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run software that loads memory-dumping debug libraries?
  context: >-
    Debuggers, crash-reporting agents, and some installers legitimately load dbghelp.dll or
    dbgcore.dll, but usually from their own install directory rather than a user-writable
    path. Knowing whether this host performs debugging or crash-analysis work, and whether
    the account is one that would run such tooling, is often the fastest way to separate a
    benign developer or support workflow from memory-dump abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the executable that loaded the debug DLL -- where did it come from and is it signed?
  context: >-
    The rule fires because the loading process runs from a user-writable location, which is
    unusual for legitimate debugging tools. Establish what this executable is: its full
    path, digital signature, and hash, and how it arrived there (downloaded, dropped by
    another process, or extracted from an archive). An unsigned or unfamiliar binary in
    Temp, Public, or a profile folder that reaches for MiniDumpWriteDump is the core
    concern, whereas a known signed tool relocated by an administrator is more benign. A
    hash lookup against threat intelligence can identify a known dumping utility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the loaded dbgcore.dll or dbghelp.dll the signed Microsoft system copy or a private copy, and what is its hash and signing status?
  context: >-
    The loaded module may be the normal Microsoft-signed system copy -- in which case the
    concern is the process that loaded it -- or a private, unsigned, or renamed copy staged
    alongside the executable, which points to a self-contained dumping tool. Check the
    module path, whether the signature is a valid Microsoft one, and the hash. SignatureStatus
    values worth noting are Unsigned, Expired, Distrusted, and Invalid; a valid signature
    lowers but does not eliminate concern, since a signed dbghelp.dll placed next to a
    custom loader still supplies MiniDumpWriteDump.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Was LSASS memory the target, and by what dump method?
  context: >-
    The loading process's command line often reveals what memory was targeted and how. Look
    for LSASS by name or PID, dump-file output paths, and methods such as procdump, the
    comsvcs.dll MiniDump export, direct memory reads, a PPL bypass, or a custom dumper --
    the method indicates operator sophistication. A handle opened to LSASS with full access
    rights (mask 0x1F0FFF) is the classic dumping signal; that access mask lives on
    process-handle records this alert does not carry, so infer intent from the command line
    and module set here and corroborate from any available handle-access telemetry. LSASS
    is the standard target regardless of tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the process that loaded the debug DLL, and is that parent chain expected?
  context: >-
    The parent reveals how the loading process was launched. A memory-dumping tool started
    from explorer.exe by an interactive administrator during troubleshooting reads very
    differently from one spawned by a script host, a web-server worker, an Office
    application, or an unfamiliar binary in a user-writable directory. Walk up the tree from
    the parent's own ParentProcessGuid where a longer lineage is needed; long-running
    parents such as shells or services can start days before the load, which the wider
    lookup window accommodates.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did the loading process spawn after the debug DLL was loaded?
  context: >-
    Children of the loading process show what happened once the debug library was in place.
    A memory-dump workflow may spawn a shell, an archiver to compress the dump, or a
    transfer tool to move it off-host, whereas a benign crash-reporting flow typically
    spawns little of note. Correlate the timing of any children with the load event to see
    whether execution followed the dump.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a memory dump file written to disk, and is it still available for analysis?
  context: >-
    MiniDumpWriteDump produces a dump file -- often a .dmp, though attackers frequently
    rename it. This surfaces files written by the loading process and its direct children,
    correlated by process lineage. A dump-sized file appearing right after the load confirms
    memory-capture intent; if the file still exists, it can be hashed, submitted for
    analysis, or reviewed to determine what was captured.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which accounts may be exposed if credentials were dumped, and do any hold elevated privileges?
  context: >-
    If LSASS memory was captured, every account with a session or cached secret on this host
    is potentially exposed. Severity depends on privilege: domain-admin, enterprise-admin,
    or broadly-scoped service accounts require escalation, while a single standard user is
    lower impact. Cross-reference the accounts active on the host against directory group
    memberships to scope the blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after the load event?
  context: >-
    Credential theft is typically followed by lateral movement. This returns outbound
    connections from this host to remote-access ports -- 3389 (RDP), 445 (SMB), 5985/5986
    (WinRM), 22 (SSH) -- in the hours after the event, with the originating Image and User.
    Two limits: credentials replayed from a different machine will not appear here, so check
    authentication logons for the affected accounts on suspected targets; and if network
    telemetry is not collected from this host, treat zero rows as a visibility gap rather
    than proof no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the load event?
  context: >-
    Loading a debug library to dump memory or suspend a protected process is itself an
    impair-defenses move, and it often travels with others -- clearing event logs, disabling
    real-time protection, stopping security services, or deleting shadow copies. Finding
    several such actions from the same user or parent within the same window points to a
    deliberate operation to reduce visibility rather than isolated administration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this debug DLL been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this debug library on this host is a stronger anomaly than a
    recurring one. If the same module path has been loaded repeatedly by the same debugging
    or crash-reporting binary over the past 90 days, the load is likely routine; if it is
    the first occurrence, or has historically been loaded only by unrelated processes, the
    current load stands out. Grouping by the loading Image shows which processes account for
    the history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's pattern, which programs and users drove it, and does the current alert fit?
  context: >-
    This mirrors the rule's own selection -- a process in a flagged location loading a debug DLL
    -- scoped to this host over the past two weeks. The resulting program and user distribution
    shows how this specific pattern has historically run here, if at all. A new acting program
    process, an unfamiliar account, or a first-ever match is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img:
        Image|contains:
        - :\Perflogs\
        - :\Temp\
        - :\Users\Public\
        - \$Recycle.Bin\
        - \Contacts\
        - \Documents\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
      selection_dll:
        ImageLoaded|endswith:
        - \dbgcore.dll
        - \dbghelp.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    This mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of the pattern -- a process in a flagged location loading a debug DLL -- rather than
    generic usage of these libraries. Many hosts matching the same pattern points to scripted
    deployment or vendor automation that stages tools in these directories; one host or a
    small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection_img:
        Image|contains:
        - :\Perflogs\
        - :\Temp\
        - :\Users\Public\
        - \$Recycle.Bin\
        - \Contacts\
        - \Documents\
        - \Favorites\
        - \Favourites\
        - \inetpub\wwwroot\
        - \Music\
        - \Pictures\
        - \Start Menu\Programs\Startup\
        - \Users\Default\
        - \Videos\
      selection_dll:
        ImageLoaded|endswith:
        - \dbgcore.dll
        - \dbghelp.dll
      condition: all of selection_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the load reveals what led to
    it and what followed -- reconnaissance, privilege escalation, staging, or persistence
    installation. Aggregating by Image and ParentImage collapses routine agent noise into
    high-count rows so that novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, or credential access -- may reveal the stages that preceded
    this load and help reconstruct the timeline. A memory-dump primitive following an
    earlier impair-defenses or execution alert is a stronger signal than one seen alone.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
