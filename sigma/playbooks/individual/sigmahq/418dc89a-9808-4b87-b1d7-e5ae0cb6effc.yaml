name: Potential Mpclient.DLL Sideloading
id: 35f50f1b-2369-4207-ac37-9db5c03e6848
description: |
  Detects a load of mpclient.dll by one of Windows Defender's own utilities (MpCmdRun.exe or NisSrv.exe) from a
  directory other than the known-good Defender install paths (Program Files\Windows Defender, ProgramData\Microsoft\
  Windows Defender\Platform, WinSxS, and similar). The rule fires when that module load matches AND the loading
  process does NOT sit under one of those canonical Defender locations. Defender's utilities resolve mpclient.dll
  through the normal DLL search order, loading it from the executable's own directory first, so an operator who
  stages a signed copy of MpCmdRun.exe alongside a weaponized mpclient.dll in a user-writable path gets attacker code
  running inside a Microsoft-signed process. Investigation should confirm the loaded module's path, signature, and
  hash on the load event, establish where the loading binary is running from and what launched it, decode what the
  Defender utility actually did, trace where the DLL and any adjacent payload files were written from, and check for
  follow-on execution or additional persistence on the host.
type: detection
detection_id: 418dc89a-9808-4b87-b1d7-e5ae0cb6effc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module and its loading process match the rule's detection criteria?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status,
    and the process that loaded it (Image) against the rule's criteria. The rule fires when a Defender utility
    (MpCmdRun.exe or NisSrv.exe) loads mpclient.dll from a directory OUTSIDE the known-good Defender install paths,
    so note whether the loading binary is running from a user-writable or otherwise non-default location. Library
    events carry the module's hash and signing status directly on the load, so record them here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this user and host expected to run a Windows Defender command-line utility from this location?
  context: >-
    Defender's MpCmdRun.exe and NisSrv.exe normally run from their platform install directories as part of scheduled
    scans and service activity. A copy running from a user-writable or non-default path, especially under an interactive
    or service account that would not normally invoke Defender maintenance tooling, is inconsistent with routine
    operation. Confirm whether the user role and host function are consistent with legitimate Defender activity here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What modules did this process load, and did any load from its own non-default directory rather than the expected system path?
  context: >-
    In a DLL search-order sideload the trusted binary loads an attacker-supplied library from its own directory instead
    of the system location where that DLL name normally resolves. Look at the full set of modules loaded by the process:
    mpclient.dll (and any other DLLs) resolving out of the executable's own folder, out of %TEMP%, AppData, ProgramData,
    or Public, or unsigned modules where signed ones are expected, all point to sideloading rather than a genuine
    Defender load out of the platform directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: What is the signing status, hash, and reputation of the loaded mpclient.dll?
  context: >-
    Module reputation separates a genuine Microsoft-signed Defender library from a weaponized replacement. A copy of
    mpclient.dll that is unsigned, carries an invalid or distrusted signature, or resolves to a hash that is unknown to
    the fleet and to threat intelligence is a strong masquerading signal; a validly Microsoft-signed module loaded from
    an unexpected path is less conclusive but still worth staging comparison. Pull the module hash from the load event
    for a threat-intel lookup and compare its signature against a known-good Defender install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What did the Defender utility actually do? Decode its command line and the directory it ran from.
  context: >-
    The image_load event shows the module was loaded but not what the loading binary was invoked to do. Pivot to the
    process record for MpCmdRun.exe or NisSrv.exe on this host to recover the full command line and working directory.
    A Defender utility launched by hand from a non-platform path, with arguments that do not match a normal scan or
    service invocation, indicates the binary was staged to trigger the sideload rather than run as part of Defender.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this Defender utility, and is that parent chain expected?
  context: >-
    Legitimate Defender activity is driven by services.exe or the Defender platform, not by an interactive shell or a
    downloader. A parent such as cmd.exe, powershell.exe, an Office application, or a script host launching MpCmdRun.exe
    or NisSrv.exe from a non-default path points to an operator staging and executing the binary. Identify the immediate
    parent and, where possible, walk one level further up to see what spawned that parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has mpclient.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If mpclient.dll has loaded
    repeatedly over the past 90 days only under Defender binaries running from their platform directory, this load is
    likely routine; if this is its first appearance, or it has previously loaded only under different processes or from
    different paths, the current load is anomalous. Compare the loading Image and its path against that history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting program and
    user distribution reflects how this specific sideload pattern (a Defender utility loading
    mpclient.dll from a non-default path) has fired here before, not generic Defender usage. A
    new acting program process, an unexpected account, or a first-ever appearance of the pattern
    on this host is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        ImageLoaded|endswith: \mpclient.dll
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the sideload
    pattern rather than generic Defender usage. Many hosts loading mpclient.dll from non-default paths in a consistent
    parent/path profile can point to a packaged deployment or imaging artifact worth validating; one host or a small
    unrelated set points to targeted operator activity. Use the host spread and parent consistency to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        ImageLoaded|endswith: \mpclient.dll
        Image|endswith:
        - \MpCmdRun.exe
        - \NisSrv.exe
      filter_main_known_locations:
        Image|startswith:
        - C:\Program Files (x86)\Windows Defender\
        - C:\Program Files\Microsoft Security Client\
        - C:\Program Files\Windows Defender\
        - C:\ProgramData\Microsoft\Windows Defender\Platform\
        - C:\Windows\WinSxS\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What child processes did this Defender utility spawn afterward?
  context: >-
    A weaponized mpclient.dll commonly decrypts and runs an in-process payload, but the loading binary or that payload
    may also spawn follow-on processes for reconnaissance, credential access, or additional tooling. Children such as
    cmd.exe, powershell.exe, or certutil.exe launched by MpCmdRun.exe or NisSrv.exe after the load reveal the operator's
    post-execution activity and help gauge how far the intrusion progressed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Are mpclient.dll and any adjacent payload files still on disk for analysis?
  context: >-
    Sideloading stages the weaponized DLL, and often an encrypted payload file (frequently a .log alongside the binary),
    in a user-writable directory next to the staged copy of the trusted executable. Confirming those files still exist
    enables hashing, sandbox submission, and content review. This query correlates file writes to the alerting process
    and its direct children by process lineage; check the loading binary's own directory for the DLL and any companion
    files written around the same time.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading is usually one step in a longer chain. Activity in the minutes around the load can reveal how the binary
    and DLL arrived (a downloader, an archive extraction, a script host) and what followed (reconnaissance, privilege
    escalation, persistence). Aggregating process activity by Image and ParentImage collapses routine agent telemetry
    into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this load in a timeline. Exploitation of a public-facing service,
    a web shell, reconnaissance, or a payload download preceding the sideload would explain how the operator reached
    the point of staging a trusted binary, and would raise the priority of this event. Review sigma alerts on this host
    in the hours leading up to the load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does an administrator or the responsible team recall running a Windows Defender utility from this location?
  context: >-
    Direct confirmation from the person or team behind the activity is often the fastest way to establish legitimacy.
    Genuine reasons for running MpCmdRun.exe outside its platform directory are rare, so an unexplained execution
    strengthens the case that the binary was staged by an operator. If someone confirms it, capture why and from where;
    if no one recalls it, treat the account as potentially compromised or the activity as automated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate Defender maintenance follows scheduled scan and service timing. A Defender utility loading a module from
    a non-default path outside business hours, or with no corresponding maintenance window, is more suspicious than the
    same activity during a documented change window. Check whether the load time aligns with the host's normal working
    hours and any scheduled Defender or administrative tasks.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Were other process-based persistence mechanisms installed on this host around this time?
  context: >-
    Operators who gain execution inside a trusted process rarely rely on a single foothold. Scheduled tasks, services,
    registry Run-key writes, BITS jobs, or WMI subscriptions installed in the same timeframe as the sideload indicate
    intentional persistence stacking rather than isolated activity. This query surfaces persistence-tool executions on
    the host in the surrounding window.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder, or into a path referenced by a registry Run key, achieves persistence without running schtasks, sc, or reg.
    Because the sideload chain already stages files in user-writable directories, checking these persistence locations
    for writes in the surrounding window catches a parallel foothold the process-tool view would miss.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
