name: UAC Bypass Using MSConfig Token Modification - File
id: ae2d9468-ebdb-4882-aead-562bdc67015b
description: |
  Detects a file named pkgmgr.exe being written under a user's AppData\Local\Temp directory
  (C:\Users\<user>\AppData\Local\Temp\pkgmgr.exe), the artifact left by a known User Account
  Control bypass that abuses msconfig token modification. A legitimately auto-elevated context is
  coerced into executing the dropped binary at high integrity, so the file write is the setup step
  and the payload runs afterward. Investigation should determine what process wrote the file,
  whether it subsequently executed at high integrity, and what elevated action followed.
type: detection
detection_id: 41bb431f-56d8-4691-bb56-ed34e390906f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the dropped file match what this rule detects — a pkgmgr.exe written under a user's AppData\Local\Temp?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path and the process responsible for the write. The rule fires when a file named pkgmgr.exe is created under C:\Users\<user>\AppData\Local\Temp\, the drop location used by the msconfig token-modification bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write an executable into a user Temp directory?
  context: Legitimate installers and updaters do stage binaries in per-user Temp folders, but a standalone pkgmgr.exe appearing there is uncommon. Knowing whether the user role and host function normally produce this kind of write is often the fastest way to separate a routine operation from a bypass attempt. When the writer is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is inside this pkgmgr.exe — is it the real binary or an attacker-supplied payload?
  context: The dropped file carries the operational payload of the bypass. Retrieve it from the on-disk path and examine imports, embedded strings, packer signatures, and signing status; a legitimate Windows pkgmgr.exe would be signed and located in a system directory, not staged in a user Temp folder. Content retrieval is a manual step from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If pkgmgr.exe executed, what is its hash and does it have known AV or threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written — the file-creation event carries no hash. This query looks for the dropped binary executing and reads its hash; submit that to threat intelligence to determine whether it is known malicious, benign, or previously unseen. If the file is present but never executed, retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What launched the process that wrote this file, and is that parent chain expected?
  context: The process that created pkgmgr.exe and the chain that launched it reveal how the bypass was staged. A write originating from an interactive shell, a script host (wscript.exe, mshta.exe, powershell.exe), or an Office application points to operator or macro-driven activity, whereas a known installer parent is more likely routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a pkgmgr.exe deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one bypass artifact often drops several — staging a loader, writing a secondary payload, or cleaning up afterward. The breadth, paths, and extensions of the writing process's other file activity distinguish a single drop from a broader staging sequence and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to this user's Temp directory recently, and by which processes?
  context: The per-user AppData\Local\Temp folder is a common staging location, so other recent arrivals there reveal whether this is an isolated drop or a location under active use. A single unfamiliar writer placing multiple files is the signal to follow; routine installer and browser writes are expected background.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What action was performed with elevated privileges after the file was dropped?
  context: The UAC bypass is a means to an end — the payload runs at high integrity to install persistence, dump credentials, tamper with security tooling, or reach protected resources. Examining processes that started at High or System integrity shortly after the drop reveals the objective. Suspicious elevated binaries in this context include sdclt.exe, eventvwr.exe, and computerdefaults.exe alongside the dropped pkgmgr.exe.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Did any process run registry commands that set up a UAC bypass shortly before the drop?
  context: Several UAC bypass techniques write a command into a per-user registry key that an auto-elevated process then reads and runs — targets include the ms-settings, mscfile, exefile, and Folder shell\open\command handlers and the Environment key. A reg.exe, powershell.exe, or cmd.exe invocation touching these keys near the drop reveals an additional or alternative bypass path and the exact payload staged for elevation.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were UAC-bypass registry handler keys modified on this host around the alert?
  context: Registry-hijack bypass methods can write the elevation command through a COM or API call that leaves no reg.exe process, so the modification is only visible in registry telemetry. Direct changes to the ms-settings, mscfile, exefile, or Folder shell\open\command handlers, or to the Environment key, near the file drop indicate a registry-based bypass running alongside or instead of the file-based one.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'ms-settings\Shell\Open\command'
          - 'mscfile\shell\open\command'
          - 'Classes\exefile\shell\open\command'
          - 'Classes\Folder\shell\open\command'
          - '\Environment'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other privilege escalation or UAC bypass techniques attempted on this host?
  context: Attackers who try one UAC bypass often try several until one succeeds, especially when the OS version or configuration blocks certain methods. Other bypass or privilege escalation detections on the same host in a short window confirm deliberate escalation activity rather than a false positive and help reconstruct the sequence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of pkgmgr.exe being dropped into a user Temp folder (not generic file activity), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pkgmgr.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this drop pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program producing this specific drop. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pkgmgr.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints. If the same user triggered similar drops or elevation attempts on other hosts, the scope of the incident may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service or machine account, "what else did this user do" returns background agent noise. The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\pkgmgr.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the drop reveals the immediate context: what led to the file write, what ran afterward, and whether it is part of a larger sequence. Aggregating by process and parent collapses repetitive agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
