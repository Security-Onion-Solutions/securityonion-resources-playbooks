name: WannaCry Ransomware Activity
id: 82e63e72-e687-440b-b485-44baeaff7284
description: |
  Detects process activity associated with the WannaCry ransomware family. The rule fires when EITHER a process image ends in
  one of the family's component filenames (tasksche.exe, mssecsvc.exe, taskdl.exe, taskhsvc.exe, taskse.exe, 111.exe,
  lhdfrgui.exe, linuxnew.exe, wannacry.exe) or contains WanaDecryptor, OR a command line references the ransom-note filename
  @Please_Read_Me@.txt — either branch alone is enough to alert. Both branches are filename-based indicators of the
  encryption-for-impact pattern (T1486) and of the recovery inhibition that accompanies it (T1490): shadow copy and
  backup-catalog deletion, boot-recovery disablement, permission widening on the directories about to be encrypted, and
  termination of processes holding open handles on those files. Filenames are trivially renamed and are also produced by
  sample handling, security tooling, and detection testing, so the investigation should establish which branch fired, what the
  full command line and launching process were, whether recovery-inhibiting or permission-changing commands ran on the host,
  whether file encryption or ransom-note writes followed, and whether the same pattern is present on other hosts.
type: detection
detection_id: 41d40bff-377a-43e2-8e1b-2e543069e079
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event match either the ransomware-associated process filename or the ransom-note filename on the
    command line, and which branch fired?
  context: >-
    This rule fires on either of two independent conditions, and the branch that matched changes what the rest of the
    investigation weighs. The image branch matches a process whose filename ends in tasksche.exe, mssecsvc.exe, taskdl.exe,
    taskhsvc.exe, taskse.exe, 111.exe, lhdfrgui.exe, linuxnew.exe or wannacry.exe, or whose path contains WanaDecryptor. The
    command-line branch matches any process whose arguments reference @Please_Read_Me@.txt, regardless of what that process
    is. A filename match says nothing about what the binary did, so its path, arguments and launching process carry the
    weight; a ransom-note match means some process — commonly a command interpreter or a script host — named a ransom note,
    which points at the note-display or encryption stage rather than at the named binary. Record which branch fired before
    continuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run binaries with these filenames, or to reference a ransom-note filename on the
    command line?
  context: >-
    Both branches have routine explanations on some hosts. Malware analysts and responders handle live samples and quarantined
    copies, backup and scanning tools pass file names on their command lines, and detection-content or test harnesses reference
    known ransom-note names on purpose. Knowing whether the user role and the host function include sample handling, security
    research, or endpoint tooling is usually the fastest separation from a live encryption attempt. When the account is a
    machine or service account, judge by the executing program and the host's role instead of by identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What were the full command lines of this binary on the host in the alert window, and what do the arguments and
    working directory show?
  context: >-
    The alert names the process, but the arguments and the working directory describe the operation. Read the path the binary
    runs from (a staging directory under a user-writable or root-of-drive location is a different story from an installed
    program directory), any argument naming a note file or an encryption target, and whether a component is being started by a
    helper rather than directly. The query returns every execution of this binary on the host within the window, so a component
    invoked several times in sequence appears as several rows. If the alert fired on the ransom-note command-line branch the
    alerting image may be a common interpreter, in which case the host-plus-binary scope also returns unrelated executions of
    it — read the rows against the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    Recovery inhibition (T1490) is normally a chained set rather than a single command — deleting shadow copies
    (vssadmin delete shadows /all /quiet, wmic shadowcopy delete), disabling boot recovery (bcdedit /set {default}
    bootstatuspolicy ignoreallfailures and bcdedit /set {default} recoveryenabled no), and deleting the backup catalog
    (wbadmin delete catalog -quiet) — frequently issued as one chained cmd.exe /c line so all of it lands in the same second.
    This query surfaces every recovery-inhibiting command on the host and the flags each carried. Then verify whether each
    action actually succeeded by checking system state on the host (vssadmin list shadows, bcdedit /enum, reagentc /info,
    wbadmin get versions) and confirm the status of offline, tape, or cloud backups through the backup system itself.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    The pre-encryption stage runs several utilities around the encryptor within minutes of each other, and the complete set is
    more informative than any one of them: shadow copy and backup destruction (vssadmin, wmic, bcdedit, wbadmin), permission
    widening on the target directory so every account can read and write it (icacls . /grant Everyone:F /T /C /Q, takeown),
    hiding the staging directory (attrib +h), and stopping services or terminating processes that hold open handles on the
    files to be encrypted (sc stop, net stop, taskkill against database and backup processes). Note whether these share one
    parent — a single scripted parent points to an automated sequence rather than to separate administrative actions, and the
    -300 second to +300 second neighbourhood of the alert is where the correlation is usually visible.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were System Restore or recovery-related registry values written on this host around the alert?
  context: >-
    Recovery inhibition is not only command-line driven. Writing DisableSR or DisableConfig under the SystemRestore keys turns
    off restore-point creation with no vssadmin call at all, so a modification to those values in the alert window corroborates
    that recovery destruction rather than routine maintenance is underway. Registry value deletion produces no event, so read
    this as values being written to the disabled state, and note which process wrote them — the writing process ties the
    registry change back to the same lineage as the alerting binary.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\Windows NT\SystemRestore'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Which non-system binaries executed on this host after the alert, and does any of them look like the encryption or
    ransom-note stage?
  context: >-
    Recovery-inhibiting actions typically precede file encryption by minutes, and the encryptor is usually an unsigned
    executable running from a staging directory, a temp path, or another user-writable location rather than from an installed
    program directory. This query drops well-known system paths so unfamiliar executables stand out. Look for a process with
    heavy file I/O, a command interpreter launching an unknown executable, and helper components whose job is to display or
    open a note. How far encryption progressed — and whether it is still running — determines the recovery path and what needs
    to be preserved before the host is touched.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What files did the alerting process and its direct children write around the alert?
  context: >-
    File writes attributed to this process lineage show whether the encryption stage ran and how far it got. The pattern to
    look for is a burst of writes across user document folders, network shares, and mapped drives carrying a uniform uncommon
    extension, paired with the same note filename dropped once into each directory the process touched, plus supporting files
    written into the staging directory. A handful of writes confined to one folder reads very differently from thousands
    across shares. Establish which paths were reached before deciding restore scope. File writes carry no hash, so verify any
    dropped executable through its later execution event rather than here.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
- question: Did the WMI-Activity channel record provider loads or event subscriptions on this host around the alert?
  context: >-
    Shadow-copy deletion and permission changes are often issued through WMI rather than through a dedicated utility, and a
    wmic command line only shows the request that was typed. The WMI-Activity operational channel records what the WMI service
    actually did — provider loads as event 5857, temporary event subscriptions as 5860, permanent subscriptions as 5861. A
    subscription registered around the alert means WMI was also used for triggered execution rather than a single call, and a
    provider load correlates a security-descriptor or shadowcopy method invocation with the process that requested it. Hosts
    that do not ship this channel return nothing, so treat zero results as a visibility gap rather than as evidence nothing
    ran.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - message
  answer_sources:
  - manual_review
- question: What host initiated inbound connections to remote-service ports on this host, and is it an expected administrative
    source?
  context: >-
    This family reaches new hosts by exploiting a remote service (T1210) rather than by user action, so the host that reached
    in over SMB or another remote-service port is the likely upstream source. Inbound sessions to 445 or 135 from a system with
    no administrative role, or a burst of inbound connections with a high reset or error rate shortly before the alerting
    process appeared, points at exploitation rather than at local execution; a known jump box or a management network is the
    benign explanation. Correlate within roughly ten minutes of the alerting process start — the exploitation-to-execution gap
    is short. The default port set here covers SMB/RPC, RDP, WinRM, and SSH; add database ports such as 1433 or 3306 if those
    services are exposed on this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
  answer_sources:
  - network_connection
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    File and directory discovery (T1083) drives which paths get encrypted, and account, share, and process enumeration usually
    accompanies it. Several different discovery binaries inside a fifteen-minute window — three or more is the usual
    threshold — points at automated enumeration rather than at one troubleshooting command, and a burst of dozens of queries in
    tens of seconds is programmatic by definition. Note the parent of these commands and the account they ran under. Directory
    walking done with the interpreter's own built-ins, such as dir /s /b or tree, creates no process of its own and is visible
    only inside the interpreter's command line, so absence of rows here is not absence of enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Has this host produced the rule's pattern before, and if so which parents and users drove that activity?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific pattern has fired here over the past two weeks rather than generic binary usage. For a
    filename-based malware rule any prior history is itself worth reading: a recurring parent such as a scanning tool, an
    analysis harness, or an archive utility explains the alert as sample handling, while a first-ever occurrence driven by a
    command interpreter or an unfamiliar program is the deviation worth chasing. A parent that appears here for the first
    time is the field to carry into the rest of the investigation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \tasksche.exe
        - \mssecsvc.exe
        - \taskdl.exe
        - \taskhsvc.exe
        - \taskse.exe
        - \111.exe
        - \lhdfrgui.exe
        - \linuxnew.exe
        - \wannacry.exe
      - Image|contains: WanaDecryptor
      selection_cmd:
        CommandLine|contains: '@Please_Read_Me@.txt'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history of this
    specific pattern, aggregated by host. An analyst or responder account with recurring history across a small set of lab or
    analysis hosts reads very differently from an ordinary account producing this for the first time on its own workstation.
    Weigh the count and the host spread against the user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \tasksche.exe
        - \mssecsvc.exe
        - \taskdl.exe
        - \taskhsvc.exe
        - \taskse.exe
        - \111.exe
        - \lhdfrgui.exe
        - \linuxnew.exe
        - \wannacry.exe
      - Image|contains: WanaDecryptor
      selection_cmd:
        CommandLine|contains: '@Please_Read_Me@.txt'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this parent process driven the rule's pattern before on this host or across the environment, or is the parent
    new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful pivot is the
    launch mechanism. The query mirrors the rule's selection structure scoped to the alerting parent process, so the result is
    the 90-day history of this parent driving this specific pattern rather than generic parent-and-binary co-occurrence. A new
    or rare parent for this pattern is the deviation worth chasing; a parent that already accounts for thousands of prior
    events is tooling or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \tasksche.exe
        - \mssecsvc.exe
        - \taskdl.exe
        - \taskhsvc.exe
        - \taskse.exe
        - \111.exe
        - \lhdfrgui.exe
        - \linuxnew.exe
        - \wannacry.exe
      - Image|contains: WanaDecryptor
      selection_cmd:
        CommandLine|contains: '@Please_Read_Me@.txt'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the account touched more than the alerting endpoint. If the
    same account produced similar activity on several hosts inside the alert window, the scope is larger than one host. Read
    the host and binary distribution rather than individual rows; under a machine or service account this pivot returns
    routine agent telemetry and the launch-mechanism pivot is the meaningful one instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry noise, because every
    host runs SYSTEM-owned agents constantly. The meaningful question is whether the same launch mechanism fired elsewhere.
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, inside the alert
    window. Multiple hosts in the same window points at pushed or scheduled execution, or at automated propagation; a single
    host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \tasksche.exe
        - \mssecsvc.exe
        - \taskdl.exe
        - \taskhsvc.exe
        - \taskse.exe
        - \111.exe
        - \lhdfrgui.exe
        - \linuxnew.exe
        - \wannacry.exe
      - Image|contains: WanaDecryptor
      selection_cmd:
        CommandLine|contains: '@Please_Read_Me@.txt'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    propagation or isolated activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's
    firing pattern over the past week rather than the generic footprint of the binaries. A family that spreads by exploiting a
    remote service produces hits on several hosts in a short window, often across one subnet, and that distribution is what
    sets containment scope; a spread confined to lab or analysis systems points at sample handling; one isolated host points
    at local execution. Compare the earliest and latest host times to read the direction of spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \tasksche.exe
        - \mssecsvc.exe
        - \taskdl.exe
        - \taskhsvc.exe
        - \taskse.exe
        - \111.exe
        - \lhdfrgui.exe
        - \linuxnew.exe
        - \wannacry.exe
      - Image|contains: WanaDecryptor
      selection_cmd:
        CommandLine|contains: '@Please_Read_Me@.txt'
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — exploitation of an exposed service, defense
    tampering, credential access, or discovery — may reveal the stages that preceded this event and help reconstruct the
    timeline, and defense tampering and discovery commonly precede impact. The order and spacing of the earlier alerts also
    indicates whether the host was reached from the network or the activity started locally.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
