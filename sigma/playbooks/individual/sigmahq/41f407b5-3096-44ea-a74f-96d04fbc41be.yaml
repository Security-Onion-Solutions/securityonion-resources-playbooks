name: Remote Access Tool - AnyDesk Execution With Known Revoked Signing Certificate
id: d1661294-e813-4374-ab60-6d21d5cb9ecf
description: |
  Detects execution of an AnyDesk binary at a version prior to 8.0.8 (FileVersion starting 7.0., 7.1., or 8.0.1 through 8.0.7),
  identified by Image, Description, Product, or Company matching AnyDesk AND the version prefix, while excluding uninstall/removal
  command lines. Builds prior to 8.0.8 were signed with a code-signing certificate that was later compromised and revoked, so a
  binary carrying that signature can no longer be assumed authentic even when it is a genuine older release. Legitimate context is an
  outdated-but-real AnyDesk install pending upgrade; malicious context is an attacker-re-signed payload masquerading as AnyDesk or
  unsanctioned remote-access deployment. The investigation should confirm the version and signature, establish whether the tool is
  authorized and tied to a support session, identify what the binary connected to and spawned, and scope the activity across the user,
  host, and fleet.
type: detection
detection_id: 41f407b5-3096-44ea-a74f-96d04fbc41be
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this AnyDesk binary match the pre-8.0.8 version and AnyDesk file-metadata the rule detects, and is it not an uninstall invocation?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the image, description, product,
    or company identifies the binary as AnyDesk AND the FileVersion starts with a pre-8.0.8 prefix (7.0., 7.1., or 8.0.1 through 8.0.7),
    AND the command line is not a removal/uninstall. Review the FileVersion, Product, Description, and Company against those criteria and
    confirm the command line does not contain --remove or --uninstall.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Company
      - Description
      - FileVersion
      - Product
- question: Is this user and host expected to run AnyDesk for remote access?
  context: Legitimate administrative or support activity can trigger this detection. Knowing whether the user role and host function are
    consistent with running a remote-access tool is often the fastest path to distinguishing a sanctioned install pending upgrade from an
    unauthorized or attacker-deployed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is AnyDesk on the organization's approved remote access software list?
  context: Organizations typically sanction a specific set of remote-access tools for IT support. A remote-access tool not on that list --
    even well-known commercial software like AnyDesk -- may represent shadow IT or attacker-deployed persistence. An outdated AnyDesk build
    on the revoked certificate is doubly worth checking, since even an authorized vendor binary at this version no longer carries a
    trustworthy signature.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this AnyDesk execution?
  context: Legitimate remote-access tool usage typically correlates with an active support ticket, a scheduled maintenance window, or a
    user request. If no support context exists for this session, the tool may have been installed by an attacker for persistent access or
    by a user circumventing security controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did this AnyDesk invocation do? Decode the full command line and working directory.
  context: The full command line reveals the specific action taken -- unattended-access setup, password assignment, service install,
    or a connection to a specific endpoint. Decode any flags, identifiers, or paths. This query returns all AnyDesk executions on the host
    within the window, so sequential invocations that together form one logical operation (install then configure then connect) are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process delivered or launched this AnyDesk binary?
  context: An outdated AnyDesk binary on the revoked certificate can arrive as a re-signed payload dropped by another process. Identifying
    the parent process and its command line shows whether AnyDesk was launched interactively, by an installer, by a script host, or by an
    unusual parent -- which distinguishes a routine install from a delivered payload and enables blocking the delivery path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this AnyDesk install being upgraded to 8.0.8 or later, and is the binary signed with the revoked or the current certificate?
  context: Builds before 8.0.8 were signed with a certificate that was later compromised and revoked; 8.0.8 and later use a new certificate.
    Confirm whether this host is pending or excluded from the upgrade, and verify the binary's Authenticode signature. A signature matching
    the revoked subject means the binary must be treated as untrustworthy even if it is a genuine older release, because the stolen key can
    re-sign arbitrary payloads.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What external endpoint did this AnyDesk binary connect to?
  context: Remote-access tools establish outbound connections to relay servers or to a controlling endpoint. The destination reveals whether
    the tool reached the vendor's legitimate relay infrastructure or a custom/unexpected endpoint. A connection to an unusual address,
    combined with the revoked-certificate version, points away from a sanctioned support session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did this AnyDesk binary spawn afterward?
  context: The processes spawned by the binary reveal its actual impact. A genuine AnyDesk install has predictable children; an
    attacker-re-signed binary masquerading as AnyDesk may spawn command interpreters, script hosts, or download utilities for
    post-execution activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \AnyDesk.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      selection_version:
        FileVersion|startswith:
        - 7.0.
        - 7.1.
        - 8.0.1
        - 8.0.2
        - 8.0.3
        - 8.0.4
        - 8.0.5
        - 8.0.6
        - 8.0.7
      filter_main_uninstall:
        CommandLine|contains:
        - ' --remove'
        - ' --uninstall'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \AnyDesk.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      selection_version:
        FileVersion|startswith:
        - 7.0.
        - 7.1.
        - 8.0.1
        - 8.0.2
        - 8.0.3
        - 8.0.4
        - 8.0.5
        - 8.0.6
        - 8.0.7
      filter_main_uninstall:
        CommandLine|contains:
        - ' --remove'
        - ' --uninstall'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user
    triggered similar activity on several hosts, the scope of an unauthorized deployment may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \AnyDesk.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      selection_version:
        FileVersion|startswith:
        - 7.0.
        - 7.1.
        - 8.0.1
        - 8.0.2
        - 8.0.3
        - 8.0.4
        - 8.0.5
        - 8.0.6
        - 8.0.7
      filter_main_uninstall:
        CommandLine|contains:
        - ' --remove'
        - ' --uninstall'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how the rule's specific firing pattern (a pre-8.0.8 AnyDesk binary) has historically run here.
    A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \AnyDesk.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      selection_version:
        FileVersion|startswith:
        - 7.0.
        - 7.1.
        - 8.0.1
        - 8.0.2
        - 8.0.3
        - 8.0.4
        - 8.0.5
        - 8.0.6
        - 8.0.7
      filter_main_uninstall:
        CommandLine|contains:
        - ' --remove'
        - ' --uninstall'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing
    pattern -- a pre-8.0.8 AnyDesk binary -- rather than generic usage of AnyDesk. Many hosts firing the same pattern points to an outdated
    build deployed widely by an upgrade gap or vendor automation; one host or a small unrelated set points to manual or targeted activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \AnyDesk.exe
      - Description: AnyDesk
      - Product: AnyDesk
      - Company: AnyDesk Software GmbH
      selection_version:
        FileVersion|startswith:
        - 7.0.
        - 7.1.
        - 8.0.1
        - 8.0.2
        - 8.0.3
        - 8.0.4
        - 8.0.5
        - 8.0.6
        - 8.0.7
      filter_main_uninstall:
        CommandLine|contains:
        - ' --remove'
        - ' --uninstall'
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: Did the same detection fire on other users or hosts in the last day?
  context: An outdated remote-access build deployed across an environment -- whether by an upgrade gap or by an attacker pushing a re-signed
    payload -- rarely lands on a single host. Correlating the same rule across all hosts reveals the breadth of the affected population and
    identifies additional systems that need to be upgraded or investigated.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access --
    may reveal the stages that preceded the appearance of an unauthorized or revoked-certificate remote-access tool and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
