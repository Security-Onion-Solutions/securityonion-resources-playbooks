name: Potential Persistence Via LSA Extensions
id: fa394c0a-25fc-4bdf-9b50-c0749b8a6611
description: |
  Detects modification of the "Extensions" REG_MULTI_SZ value under
  HKLM\SYSTEM\CurrentControlSet\Control\LsaExtensionConfig\LsaSrv. This value lists filenames of DLLs
  that lsass.exe automatically loads at boot, calling each one's InitializeLsaExtension() method. Adding
  a DLL here yields boot-persistent code execution inside lsass.exe -- a process that handles credential
  material -- while staying off common autoruns enumeration. Legitimate registration of an LSA extension
  is rare and generally comes from the operating system or a security product installer. The investigation
  should determine which DLL the value now references, whether that DLL exists on disk and is signed,
  whether lsass.exe loaded it, and what process wrote the value.
type: detection
detection_id: 41f6531d-af6e-4c6e-918f-b946f2b85a36
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the modified registry key and value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact registry path (TargetObject) against the LsaExtensionConfig\LsaSrv\Extensions location and the
    value data written. The rule fires on any modification whose key path contains this LSA extension
    configuration value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify LSA extension configuration?
  context: Legitimate changes to the LSA Extensions value are rare and normally originate from operating
    system servicing or a security product installer running under SYSTEM. A modification attributed to
    an interactive user account, or on a host that has no reason to register an LSA extension, is harder
    to explain as routine administration. When User is a machine account or missing, pivot on the writing
    process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified value the LSA Extensions load list, and what does registration there grant an attacker?
  context: The Extensions value under LsaExtensionConfig\LsaSrv is a known persistence and credential-access
    location. DLLs named here are loaded into lsass.exe at boot and have their InitializeLsaExtension()
    method invoked, giving boot-persistent code execution inside the process that manages credentials. This
    differs from Run/RunOnce or service persistence in that the payload runs inside a sensitive system
    process rather than as a standalone binary. Confirm the value name and the DLL path written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What DLL does the Extensions value now reference, and is that path a legitimate LSA extension?
  context: The Details field holds the REG_MULTI_SZ list of DLL filenames lsass.exe will load. Read each
    entry and identify any newly added name. A DLL under a user-writable or unusual directory (Temp,
    AppData, ProgramData, or a bare filename that resolves from the system path) is a strong sign of an
    attacker-supplied payload, whereas a signed component under System32 may be a genuine security-product
    extension. The referenced DLL becomes the pivot for the on-disk and signature checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What DLLs has lsass.exe loaded on this host, and are any unsigned or from unusual paths?
  context: An LSA extension DLL takes effect when lsass.exe loads it, which happens at boot or when the
    service restarts. Reviewing the modules lsass.exe has loaded reveals whether the registered DLL
    actually executed inside the credential-handling process, and the signature and path of each loaded
    module distinguishes an operating-system component from an attacker-supplied one. An unsigned DLL, or
    one loaded from a user-writable directory, loading into lsass.exe corroborates active persistence and
    potential credential access.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\lsass.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Is the DLL referenced by the Extensions value actually present on disk?
  context: LSA persistence is only effective if the DLL named in the Extensions value exists at a path
    lsass.exe can load. Confirming the file was created near the registry write determines whether the
    mechanism is armed and what would run inside lsass.exe on the next boot. The file-write event carries
    no hash; if the DLL is present, hash it from a later load or execution or retrieve it for a reputation
    lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does the Extensions value remain in place, or was it modified again after the alert?
  context: Endpoint registry telemetry does not emit key or value deletion events, so attacker cleanup of
    the Extensions value is not directly observable. Judge whether the persistence sticks by watching the
    key's re-modification history -- whether the value is set again, reverted, or left in place -- and by
    whether the referenced DLL loaded into lsass.exe. A value that is written once and never touched again
    behaves like durable persistence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has the LSA Extensions value been modified before on this host?
  context: The Extensions value should change extremely rarely -- typically only when the operating system
    is serviced or a security product that registers an LSA extension is installed or updated. Zero prior
    modifications indicate a key that has never been touched on this host, which is more suspicious than a
    value with a routine change history. Compare the historical Details values to see whether the same DLL
    list is being reasserted or a new entry has appeared.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the LSA Extensions value modified on other hosts in the environment?
  context: The same modification across many hosts may indicate a policy-driven change or the deployment
    of a security product that registers an LSA extension; the same modification on a single targeted host
    points toward hands-on intrusion. Compare the Details values across hosts to see whether an identical
    DLL is being registered fleet-wide or a distinct payload appears on one system.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote the LSA Extensions value, and is its parent chain expected?
  context: The writing process and its parent reveal how the modification was made. Registration by a
    trusted installer or servicing process running under SYSTEM is consistent with legitimate activity,
    while a parent chain rooted in an interactive shell, script host, or Office application (cmd.exe,
    powershell.exe, wscript.exe, mshta.exe) suggests hands-on or scripted attacker activity. Walk the
    parent's own parent if the immediate lineage is inconclusive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: An operator who registers an LSA extension often makes several changes at once -- for example
    adding the persistence value while also weakening a security control or altering another autostart
    location. All registry modifications on the host in the surrounding window, grouped by key path and
    writing process, reveal whether this was an isolated change or part of a broader configuration push. If
    the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive
    paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the minutes around the registry
    write reveals what led to the modification and what followed it -- reconnaissance, credential access,
    payload staging, or additional persistence. Novel parent-child process pairs stand out against the
    high-count background of routine host and agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside an LSA extension foothold
    they commonly install backups using different techniques -- scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Persistence tooling running in the same timeframe indicates
    intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or
    script into the Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File event monitoring captures these drops even when the attacker avoids
    standard persistence tooling, revealing whether the LSA extension was one of several parallel
    footholds.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, or credential access -- may reveal the stages that preceded the LSA extension write and
    help reconstruct the full timeline. Credential-access persistence in lsass.exe often follows earlier
    footholds rather than starting an intrusion.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Many organizations require change tickets for system modifications, especially persistence
    mechanisms and security-sensitive configuration changes. A corresponding ticket or a security-product
    deployment record suggests authorized activity; absence of one when policy requires it suggests the
    change was unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
