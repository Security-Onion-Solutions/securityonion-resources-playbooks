name: Suspicious Application Allowed Through Exploit Guard
id: 50095773-bc32-4b63-8f48-d2d2791d5113
description: |
  Detects a registry write that adds an application to the Controlled Folder Access "allowed applications"
  list under Windows Defender Exploit Guard, where the allowed application path sits in a user-writable or
  temporary directory (Users\Public, AppData\Local\Temp, Desktop, PerfLogs, or Windows\Temp). The rule fires
  only when the modified key is the AllowedApplications key AND the allowed path is one of those directories.
  Legitimately, administrators and installers add trusted line-of-business applications to this list from
  fixed program directories; an allow-listing that points at a temp or public path removes Controlled Folder
  Access protection for a binary staged where malware typically lands, letting it modify protected folders
  (a common precursor to ransomware and other file tampering). Determine which application was excluded,
  which process and account performed the write, whether the excluded binary subsequently ran, and whether
  other defensive controls were changed in the same window.
type: detection
detection_id: 42205c73-75c8-4a63-9db1-e3782e06fda0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry write add an application in a user-writable or temp path to the Exploit Guard allowed-applications list?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    modified key is the Controlled Folder Access AllowedApplications key AND the allowed application path
    contains one of Users\Public, AppData\Local\Temp, Desktop, PerfLogs, or Windows\Temp — both conditions
    must hold. The allowed application's path is embedded in the value name of TargetObject; confirm the exact
    key path against the detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Exploit Guard exclusion settings?
  context: >-
    Legitimate allow-listing of applications through Controlled Folder Access is usually performed by
    administrators, security-management tooling, or software installers on managed endpoints. Knowing whether
    the account and host function are consistent with defensive-configuration changes is often the fastest way
    to separate a sanctioned change from tampering. User attribution is present on most endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which application path was added to the allowed-applications list?
  context: >-
    The value name and data written to the AllowedApplications key identify the specific binary being exempted
    from Controlled Folder Access. An allow entry for a signed line-of-business application in a fixed program
    directory is routine; an entry pointing at a binary in Users\Public, AppData\Local\Temp, Desktop, PerfLogs,
    or Windows\Temp exempts a file staged where malware is commonly dropped, so it can then modify protected
    folders. Read the excluded path and identify what the binary is and where it lives.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this AllowedApplications key a known evasion location, and what does an exclusion here do?
  context: >-
    The AllowedApplications key under Windows Defender Exploit Guard\Controlled Folder Access is the exclusion
    list for that protection: any application listed here is permitted to modify files in protected folders.
    Adding an untrusted or temp-staged binary to this list disables a ransomware-oriented control for that
    binary specifically, which is a defense-evasion action rather than a routine configuration change. Confirm
    the exact key and value and judge whether the exclusion is consistent with sanctioned software management.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process and command line performed the exclusion write?
  context: >-
    The registry event carries the process that wrote the exclusion. Pivot to that process's creation event to
    read the full command line and understand how the change was made — an interactive administrative tool, a
    script host, an installer, or an unexpected parent all imply very different intent. The command line reveals
    whether the write was a scripted or bulk operation and what else the same invocation may have configured.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What parent process spawned the process that wrote the exclusion, and is that chain expected?
  context: >-
    The parent of the writing process shows how the exclusion change was invoked. Management tooling and
    installers have predictable parents; a write driven by a script host, a document-spawned process, or an
    unusual parent points to abuse. Walk up the process tree to establish whether the modification originated
    from sanctioned configuration management or from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does the exclusion persist, or was it re-modified after it was set?
  context: >-
    Registry key and value deletions are not observable on endpoint telemetry, so attacker cleanup of an
    allow-list entry cannot be seen directly. Judge persistence instead from the key's re-modification history
    over a longer window — repeated writes to the AllowedApplications key, or the same excluded path reappearing,
    indicate the exclusion is being maintained rather than a one-off change. A single write that is never revisited
    suggests the exemption is still in effect.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is Controlled Folder Access protection still lifted for the excluded application?
  context: >-
    The exclusion may be a temporary step for a specific action or a durable weakening of the control. Confirm
    the current state of the AllowedApplications list on the host — if the temp-staged or untrusted binary is
    still allowed to modify protected folders, the control remains bypassed and should be restored before further
    investigation. Verify current status through direct host inspection or endpoint management rather than logs
    alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the excluded application subsequently execute on this host?
  context: >-
    An allow-list entry only matters if the exempted binary runs. Look for process execution of the excluded
    application path after the exclusion was set — execution of a temp-staged binary that was just exempted from
    Controlled Folder Access confirms the exemption enabled real activity, and its child processes and file
    writes show what it did. Adapt the search to the specific excluded path read from the registry value. The
    query is anchored to the user-writable staging directories this rule flags for the allowed path, so a zero
    means the exempted binary did not run from such a location in the window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_staging:
        Image|contains:
        - '\Users\Public\'
        - '\AppData\Local\Temp\'
        - '\Desktop\'
        - '\PerfLogs\'
        - '\Windows\Temp\'
      condition: selection and selection_staging
    fields:
      - Image
      - CommandLine
- question: What activity occurred on this host after the exclusion was added?
  context: >-
    Defenses are weakened for a reason — to let a binary modify protected folders, drop payloads, or perform
    actions that would otherwise be blocked. Examine process activity in the window after the exclusion to reveal
    what the change enabled. A burst of new processes or file activity following the exemption points to the
    operation the exclusion was meant to permit.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What other registry modifications occurred on this host in the same session?
  context: >-
    Attackers who change one defensive setting often change several — adding an exclusion, disabling a policy,
    and adjusting firewall or service configuration together. All registry modifications on the host in the
    surrounding window, grouped by key path and writing process, reveal whether the exclusion landed alongside a
    cluster of other configuration changes that indicate a hands-on session or an installer-style implant.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: >-
    Adding an application to the Controlled Folder Access allow list is one of several ways to weaken defenses.
    Attackers who exempt one binary often also stop services, clear logs, delete shadow copies, or disable
    real-time protection to maximize coverage. Finding additional tampering tool executions from the same account
    or parent process shows multiple controls were targeted in a single operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has the AllowedApplications key been modified before on this host?
  context: >-
    A first-time modification to the Controlled Folder Access allow list is more suspicious than a routine change
    on a host where managed software regularly updates the list. Zero or very low history for this key indicates
    the exclusion is novel on this host, which raises the priority; a long history of similar writes points to a
    software-management pattern worth confirming against known deployments.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this AllowedApplications key modified on other hosts in the environment?
  context: >-
    The same exclusion appearing across many hosts may indicate a policy or management-tool rollout, while a
    change isolated to this host suggests targeted tampering. Compare the excluded application paths across hosts —
    a consistent trusted path deployed fleet-wide reads very differently from a temp-staged path present on a
    single machine.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the exclusion write reveals what led to it and
    what followed — reconnaissance, privilege escalation, staging of the binary being exempted, or persistence
    installation. Aggregating processes by image and parent collapses routine agent noise while novel parent-child
    pairs stand out for review.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, credential access, or other defense-tampering — may
    reveal the attack stages that preceded the exclusion write and help reconstruct the timeline. Defense tampering
    frequently follows an initial foothold and precedes the activity it is meant to enable, so the surrounding
    alert sequence often tells the fuller story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Weakening a defensive control commonly accompanies establishing a foothold. Attackers rarely rely on a single
    mechanism, so after exempting a binary they often install backup persistence via scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe
    indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without running scheduling or
    registry tools. File event monitoring captures these drops even when the attacker avoids standard persistence
    tools, and a drop in the same window as the exclusion points to a broader foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
