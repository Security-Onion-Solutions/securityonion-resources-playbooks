name: HackTool - Sliver C2 Implant Activity Pattern
id: 83fceb74-a5f5-4935-b734-61423b1306b3
description: |
  Detects a process command line containing the fixed Sliver C2 implant shell pattern `-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8`, emitted when a Sliver implant opens an interactive operator shell session. The rule fires when the command line contains that exact string. Sliver is a cross-platform command-and-control framework that operators adopt as a Cobalt Strike replacement; the implant spawns a PowerShell session and sets UTF-8 console encoding as part of its shell handler, which is the artifact this rule keys on. Because the pattern is specific to the implant's own code, a true match is high-confidence operator activity, so the investigation should decode the full command and any spawned children, confirm the parent chain and user and host context, check whether the same pattern fired elsewhere in the fleet, and reconstruct what ran before and after on the host.
type: detection
detection_id: 42333b2c-b425-441c-b70e-99404a17170f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain the Sliver implant shell pattern this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the command line contains the exact string `-NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8`. Read the full command line and confirm the marker is present verbatim rather than a coincidental fragment, and note what process carries it and any arguments that follow, since that surrounding content is the real subject of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run an interactive PowerShell session that sets UTF-8 console encoding this way?
  context: This command-line structure is specific to an implant's shell handler, not a normal administrative pattern. Knowing whether this account and host have any legitimate reason to launch PowerShell with this exact `-NoExit -Command` encoding setup — a developer tool, a known automation, or nothing of the sort — is often the fastest way to separate a true implant session from an unlikely benign coincidence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Sliver implant activity part of an authorized penetration test or red team engagement?
  context: Sliver is openly available and routinely used in authorized security assessments. Before investing investigation time, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling, timing, and scope resolves the alert without further analysis; absence of any sanctioned exercise makes the implant pattern far more concerning.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What was the implant doing in this shell session — read the full command line for the operator action carried alongside the marker.
  context: The encoding-setup marker is the implant's shell handshake; the operator action is whatever else rides on the command line or follows in the session. Recover any commands, file paths, downloads, or further encoding passed in the same invocation. A bare shell open reads differently from one that immediately runs reconnaissance, credential access, or staging, and the specific action determines the scope of potential compromise and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full command line and any sibling invocations of this implant pattern on the host in the window.
  context: A single operator session can span several sequential process creations that together form one logical operation. Scoping to the implant pattern on this host in the window captures the full sequence — the shell open, follow-up commands, and any encoded payloads — rather than only the one event that tripped the rule. Decode any flags, base64 or other encoding, file paths, and downloads to understand what the session actually did.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this implant session, and is that parent chain expected?
  context: The parent process reveals how the implant shell was launched. A session spawned by a loader, a script host such as wscript.exe or mshta.exe, an Office application, rundll32.exe, or an unsigned binary in a user-writable directory points to a delivery chain that handed off to PowerShell. The parent's own command line shows whether a loader or document drove the activity, and walking up from there reconstructs how the implant started.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this implant pattern, what parents and users drove it, and does the current alert fit that pattern?
  context: This command-line structure is specific enough that on most hosts it should have no history at all. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this exact pattern has run here. Zero prior history is itself a strong signal of first-time activity; a sudden new parent, an unexpected user account, or an unusual command structure against any prior baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this implant session spawn afterward?
  context: The processes spawned from the implant shell reveal its actual impact. Operator activity through this session often spawns cmd.exe, additional powershell.exe instances, certutil.exe, reconnaissance binaries, or credential-access tooling. A quiet session that spawns nothing reads very differently from one that immediately launches post-exploitation tooling.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user ran this implant pattern or other tooling on other hosts in the same window, the scope of compromise is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this implant pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of where this exact implant pattern fired. Several hosts firing the same pattern in a short span points to a multi-host operation spreading across the environment; one host or a small unrelated set points to isolated operator activity. Use the host distribution to calibrate how widespread the activity is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: -NoExit -Command [Console]::OutputEncoding=[Text.UTF8Encoding]::UTF8
      condition: selection
    fields:
    - host.name
- question: What files did this implant process write to the host after it ran?
  context: A Go-compiled implant and the operator session it drives leave host artifacts — staged payloads or tooling dropped into user-writable or temp directories, output files from reconnaissance or collection, and downloaded binaries. Checking files created by this process confirms what the session staged even after the original process has exited, and the locations and names of those files help separate operator staging from routine activity.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a macro-spawned shell, a download cradle, defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the implant session and help reconstruct the timeline. An interactive implant shell is usually a mid-chain milestone, so what came just before and just after is what tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
