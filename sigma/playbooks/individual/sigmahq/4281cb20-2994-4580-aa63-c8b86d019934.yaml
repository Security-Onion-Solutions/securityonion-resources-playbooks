name: Hiding Files with Attrib.exe
id: 15bdc561-cf29-453d-a102-f99aa858005c
description: |
  Detects use of attrib.exe to set the hidden attribute on a file. The rule fires
  when a process is attrib.exe (by Image or OriginalFileName) AND its command line
  contains the ' +h ' flag, excluding the benign desktop.ini and *.cui maintenance
  patterns. Setting the hidden attribute removes a file from default directory
  listings, and is routinely used by installers and scripts but is also a common
  defense-evasion step performed immediately after a payload is dropped into a
  user-writable directory. The investigation should determine which file was
  hidden and where it lives, what process dropped it, whether the hiding was part
  of a known install or a manual operator action, and whether the hidden file
  subsequently executed.
type: detection
detection_id: 4281cb20-2994-4580-aa63-c8b86d019934
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line run attrib.exe with the ' +h ' flag, matching what
    this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the process is attrib.exe (by Image or OriginalFileName) and
    its command line contains the ' +h ' flag, and the desktop.ini and *.cui maintenance
    patterns are excluded. Read the exact command line and note the target path the
    hidden attribute was applied to and whether other attributes (+s, +r) were set
    alongside it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to set hidden file attributes with attrib.exe?
  context: Installers, setup scripts, and some IT maintenance routines legitimately
    hide configuration or support files. Knowing whether the acting account and host
    function involve software installation or scripted file management is often the
    fastest path to separating a benign install step from a deliberate attempt to
    conceal a dropped file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which file or directory was hidden, where does it live, and what type of
    file is it?
  context: The target path on the attrib command line is the artifact being concealed.
    Decode the full path and note the file type and location. A hidden attribute set
    on an executable, DLL, or batch file in a user-writable directory such as
    C:\Users\Public, %APPDATA%, or C:\ProgramData is a different finding than a hidden
    configuration file in a normal install path. Note whether a wildcard or /s
    recursive flag was used, which widens the set of files affected, and whether the
    +s system attribute was combined with +h to further suppress display.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\attrib.exe'
        CommandLine|contains: ' +h '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: For the path that was hidden, when was that file created and what process
    wrote it?
  context: attrib.exe only changes an attribute on a file that already exists, so the
    investigative weight is on the file itself. Pivot to file-creation telemetry for
    the hidden path to learn when it appeared and which process wrote it. A file
    created moments earlier by a script host, browser, or mail client and then hidden
    is consistent with a freshly dropped payload; a long-standing file being hidden by
    an installer is more routine. Watch for alternate data stream notation (path
    containing ':') in the file events, which is a related artifact-hiding method. If
    file-creation events are not collected in this environment, treat zero results as
    a visibility gap and reconstruct the path from the alerting command line.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: What process spawned attrib.exe, and is that parent chain expected?
  context: The parent process reveals how the hide command was invoked. The hidden
    attribute is set by whatever launched attrib.exe, so the parent is where the
    decision to conceal the file was made. A cmd.exe or PowerShell parent that also
    dropped the file points to a scripted drop-then-hide sequence; an installer parent
    is more routine; an unexpected parent such as a script host, mshta.exe, or an
    Office application points to malicious invocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did the hidden file subsequently execute or get loaded on this host?
  context: Hiding a file is usually a preparatory step that precedes running it. After
    identifying the concealed path, check whether a process later launched from it or
    a module was loaded from it. Execution of a path that was deliberately hidden, in a
    user-writable directory, is a strong follow-on signal that the hidden file was a
    payload rather than a benign support file. If no execution is seen, the hidden file
    may be staged for later use or may be data rather than code.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%file_paths%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Does this host normally run attrib.exe with the hidden-attribute flag?
  context: A host that has never hidden files with attrib.exe is more notable than one
    that does so regularly as part of a known install or maintenance routine. Zero or
    very low historical counts of attrib.exe with the +h flag indicate a first-time or
    rare action worth scrutiny; high counts point to an established automation that
    routinely hides files here.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\attrib.exe'
        CommandLine|contains: ' +h '
      condition: selection
    fields:
      - User
- question: When this host has previously fired the attrib.exe +h hide pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate installers can hide files. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific hide pattern has historically run here, not
    generic attrib.exe usage. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +h '
      filter_main_msiexec:
        CommandLine|contains: '\desktop.ini '
      filter_optional_intel:
        ParentImage|endswith: \cmd.exe
        CommandLine: +R +H +S +A \\\*.cui
        ParentCommandLine: C:\\WINDOWS\\system32\\\*.bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the attrib.exe +h hide pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the attrib.exe hide pattern rather than generic
    attrib.exe activity. Many hosts firing the same pattern points to a software
    deployment or scripted install that hides files by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +h '
      filter_main_msiexec:
        CommandLine|contains: '\desktop.ini '
      filter_optional_intel:
        ParentImage|endswith: \cmd.exe
        CommandLine: +R +H +S +A \\\*.cui
        ParentCommandLine: C:\\WINDOWS\\system32\\\*.bat
      condition: all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +h '
      filter_main_msiexec:
        CommandLine|contains: '\desktop.ini '
      filter_optional_intel:
        ParentImage|endswith: \cmd.exe
        CommandLine: +R +H +S +A \\\*.cui
        ParentCommandLine: C:\\WINDOWS\\system32\\\*.bat
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +h '
      filter_main_msiexec:
        CommandLine|contains: '\desktop.ini '
      filter_optional_intel:
        ParentImage|endswith: \cmd.exe
        CommandLine: +R +H +S +A \\\*.cui
        ParentCommandLine: C:\\WINDOWS\\system32\\\*.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    file-hiding was a single event or part of activity spanning multiple endpoints. If
    the same user dropped and hid files on other hosts, the scope of the incident is
    larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \attrib.exe
      - OriginalFileName: ATTRIB.EXE
      selection_cli:
        CommandLine|contains: ' +h '
      filter_main_msiexec:
        CommandLine|contains: '\desktop.ini '
      filter_optional_intel:
        ParentImage|endswith: \cmd.exe
        CommandLine: +R +H +S +A \\\*.cui
        ParentCommandLine: C:\\WINDOWS\\system32\\\*.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    file-hiding reveals what led to it and what followed - the process that dropped the
    file, reconnaissance, or follow-on execution. Novel parent-child pairs at low counts
    are what to scan for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - a payload download, code execution, or
    other defense tampering - may reveal the attack stages that preceded the file-hiding
    and help reconstruct the full timeline. Hiding a dropped file is often one step in a
    sequence, so prior alerts give the context for why the file was concealed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
