name: Root Certificate Installed - PowerShell
id: cbe22617-2acf-4474-8a52-38123b2ce253
description: |
  Fires when PowerShell script-block content (EID 4104) references the machine root
  certificate store path Cert:\LocalMachine\Root together with EITHER Move-Item OR
  Import-Certificate — a certificate being relocated into, or installed directly into, the
  LocalMachine Root store. A root certificate added to that store makes the system trust
  every certificate chained to it, which removes TLS warnings for attacker-controlled
  servers, enables traffic interception, and can make improperly signed code appear
  trusted. Legitimate occurrences exist — help desk or IT staff occasionally add a
  corporate root CA by hand, and enterprise roots are also distributed by policy — so the
  investigation should establish which branch fired, who ran it and from where, which
  certificate file and thumbprint were involved, whether the root-store registry write
  landed, and whether the same content appeared on other hosts. Script-block capture is
  policy-gated per host: on default installs only content matching Microsoft's built-in
  suspicious-strings checks is logged, so absence of surrounding 4104 evidence is not
  absence of activity.
type: detection
detection_id: 42821614-9264-4761-acfc-5772c3286f76
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the script block reference Cert:\LocalMachine\Root together with either Move-Item or Import-Certificate?
  context: >-
    Confirm the alert is a true positive by reading the complete script. The rule has two
    branches and fires when either one matches — Move-Item combined with
    Cert:\LocalMachine\Root (a certificate object or file being relocated into the Root
    store), or Import-Certificate combined with Cert:\LocalMachine\Root (a certificate
    file being installed directly). Note which branch fired. Long scripts are split
    across multiple 4104 events, so this retrieves every chunk of the alerting block
    (sequence/total order) and the match is judged on the whole script, not the alerting
    fragment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - ScriptBlockText
- question: Is this user and host expected to install machine-level root certificates?
  context: >-
    Adding a root CA to the LocalMachine store is a machine-administration action —
    typically help desk or IT staff manually adding a corporate root, or platform
    automation distributing one. The query shows the alerting block's host, user, and
    on-disk script path (blank for interactive or in-memory execution). An account
    outside the administrative group, a host that is not managed by IT tooling, or a
    SYSTEM-owned block on a host with no deployment agent expected all move this away
    from the routine explanation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - host.name
      - user.name
      - Path
- question: Is the script that ran still on disk, and what process wrote it there?
  context: >-
    A file-based script block records its on-disk path; retrieving the file enables
    hashing and full content review beyond what the 4104 events captured, and the write
    event identifies the process and account that staged it. Interactive or in-memory
    execution records no path — the query then returns nothing, which for content like
    this is itself worth noting. The certificate file the script references is a separate
    artifact to preserve; the certificate-file survey question covers its on-disk
    presence.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the full script do — which certificate file does it install, and into which store?
  context: >-
    4104 content is the post-decoding ground truth — PowerShell logs what it actually
    compiles, so -EncodedCommand wrappers are already unwrapped. Read the complete
    reassembled script for the certificate file path it imports or moves, the store
    location (LocalMachine Root versus CurrentUser), any URLs the certificate was fetched
    from, and surrounding actions such as proxy changes or browser configuration.
    String-level obfuscation inside the script (concatenation, format operators,
    backticks) still needs manual decoding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_id|expand: '%script_block_id%'
      condition: selection
    fields:
      - powershell.sequence
      - powershell.total
      - ScriptBlockText
- question: Was a certificate file written to disk on this host around the alert, and what process wrote it?
  context: >-
    Installing a root certificate usually starts with a certificate file staged on disk.
    The rule names that file only inside the script text — no alert field resolves to it
    — so this survey anchors on common certificate extensions host-wide; read the decoded
    script for the exact path and match it against these results. A certificate written
    to Temp, Downloads, AppData, or a public profile shortly before the script ran
    implies a delivery step; enterprise certificate distribution normally writes to
    managed tooling paths. The Move-Item branch implies the file or store object already
    existed — look for the earlier write that staged it. A renamed certificate file
    without one of these extensions will not appear here.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.cer'
          - '.crt'
          - '.der'
          - '.p7b'
          - '.pfx'
          - '.sst'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
      - EventType
- question: Did a new entry appear in the machine root certificate store registry path, and what is its thumbprint?
  context: >-
    A successful LocalMachine Root install materializes as a new subkey under
    SystemCertificates\Root\Certificates whose name is the certificate's SHA-1
    thumbprint. This is the ground-truth artifact that the trust change actually landed.
    Compare the thumbprint against the organization's known corporate and public root
    CAs — an unrecognized thumbprint is the deviation to chase. A write landing within
    minutes of the script block is the coupling that matters; policy-distributed roots
    typically arrive through the same service process across many hosts rather than an
    interactive PowerShell session.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SystemCertificates\Root\Certificates\'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did certificate-installation command lines also run on this host through certutil or a PowerShell process?
  context: >-
    The same trust change can be made outside the script-block channel — certutil
    -addstore -f Root is the common utility variant, and Import-Certificate or the Root
    store path can appear directly on a process command line. Process telemetry catches
    those paths even where script-block logging does not. Repeated install attempts
    through different mechanisms, or an install by a process other than management
    tooling, indicate deliberate effort rather than a one-off administrative action.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cert:
        CommandLine|contains:
          - '-addstore'
          - 'Import-Certificate'
          - 'Cert:\LocalMachine\Root'
      condition: selection and selection_cert
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Operators often weaken controls just before making a trust change — AMSI bypass
    (patching amsi.dll in memory), an execution-policy change (-ExecutionPolicy Bypass or
    -ep bypass), constrained-language-mode escape, or a downgrade to PowerShell v2 which
    lacks script-block logging. A bypass in the preceding window makes the certificate
    install read as one step of a prepared sequence rather than an isolated
    administrative act.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Did the PowerShell session spawn follow-on activity after the certificate was installed?
  context: >-
    A 4104 event records script content, not execution outcome, and carries no process
    link — this pivots by host, user, and time instead. After a root install, watch for
    processes that exercise the new trust: certutil verifying or listing stores, proxy or
    network configuration utilities, and new tools launched from the same session. A
    SYSTEM-owned alert makes the user anchor broad (deployment tooling runs constantly as
    SYSTEM); weigh the children against what the decoded script actually called for.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|expand: '%User%'
        ParentImage|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Is full script block logging enabled on this host, or is only suspicious-content logging active?
  context: >-
    PowerShell logs script blocks at verbose level when the Script Block Logging policy
    is enabled, and only Microsoft's automatically-flagged suspicious blocks (at warning
    level) when it is not. On a warning-only host this alert is a fragment of the host's
    PowerShell activity, not all of it — surrounding benign-looking blocks may simply not
    have been logged. The level distribution calibrates how complete every other
    script-block result in this investigation is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - log.level
- question: Has this exact script block run on this host before?
  context: >-
    A script that has run routinely for months (deployment tooling, certificate-rotation
    automation) reads very differently from one appearing for the first time. The script
    block hash matches byte-identical content only — zero history means this exact
    content is new to the host, though a trivially edited variant would hash differently.
    On hosts without full Script Block Logging the history contains only blocks Microsoft
    auto-flagged as suspicious; factor that in when reading an empty result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        powershell.file.script_block_hash|expand: '%script_block_hash%'
      condition: selection
    fields:
      - user.name
      - Path
- question: What other PowerShell script activity occurred on this host around the alert?
  context: >-
    Attacker PowerShell rarely runs as a single block — staging the certificate,
    installing it, and reconfiguring the system produce a cluster of script blocks in a
    short window. Surrounding blocks from the same user session show the sequence of
    actions and often contain plaintext the alerting fragment lacks. The log.level column
    shows whether this host records full logging (verbose present) or only the flagged
    subset (warning only) — that changes how complete this picture is.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: ps_script
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - user.name
      - log.level
      - Path
      - ScriptBlockText
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Examining activity around the alert reveals the immediate context — what led to this
    event, what happened after, and whether it is part of a larger sequence. The
    aggregation collapses repetitive agent noise into high-count rows so that novel
    parent-child pairs stand out at low counts. Look for delivery mechanisms (browser or
    mail-client children, archive extraction), reconnaissance, and configuration tools
    around the install.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, download activity, credential access — may reveal the stages that preceded
    the trust change and help reconstruct the timeline. A root-certificate install is
    typically a preparation step whose payoff comes later, so what preceded it often
    explains why it was made.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user — the result is
    the user's 90-day history of this specific certificate-install pattern (not generic
    PowerShell use), aggregated by host. Help-desk and platform-engineering accounts may
    legitimately show occasional history; a user who has never produced this pattern, or
    whose role has no certificate-management duties, is the case to examine. Weigh the
    count against the user's role.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1:
        ScriptBlockText|contains|all:
        - Move-Item
        - Cert:\LocalMachine\Root
      selection2:
        ScriptBlockText|contains|all:
        - Import-Certificate
        - Cert:\LocalMachine\Root
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Which hosts have historically produced this script pattern, and is the alerting host among them?
  context: >-
    When the alert fires under a service principal, user identity does not attribute
    behavior — and PowerShell channel events carry no process identity to pivot on. The
    meaningful pivot is the pattern itself: the query mirrors the rule's selection
    fleet-wide over 90 days, aggregated by host. A pattern that routinely appears on many
    hosts is certificate-distribution automation; one that has never appeared before, or
    only on this host, is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1:
        ScriptBlockText|contains|all:
        - Move-Item
        - Cert:\LocalMachine\Root
      selection2:
        ScriptBlockText|contains|all:
        - Import-Certificate
        - Cert:\LocalMachine\Root
      condition: 1 of selection*
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated
    activity on multiple endpoints. If the same account installed certificates or ran
    similar tooling on several hosts in the same window, the trust change is broader than
    this one machine. When the alert fires as SYSTEM or another service principal this
    view fills with agent telemetry — the fleet-pattern question alongside it is the
    meaningful signal in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same script pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, cross-network user activity returns agent-telemetry noise,
    and PowerShell channel events carry no process identity to pivot on. The meaningful
    question is whether the same certificate-install pattern fired elsewhere — the query
    mirrors the rule's selection fleet-wide in the alert window, aggregated by host.
    Multiple hosts in the same window points to scheduled or pushed certificate
    distribution; a single host points to a host-local trigger. Only hosts shipping the
    PowerShell channel (and, for non-flagged content, with Script Block Logging enabled)
    can appear — absence elsewhere is weak evidence.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: ps_script
      definition: 'Requirements: Script Block Logging must be enabled'
    detection:
      selection1:
        ScriptBlockText|contains|all:
        - Move-Item
        - Cert:\LocalMachine\Root
      selection2:
        ScriptBlockText|contains|all:
        - Import-Certificate
        - Cert:\LocalMachine\Root
      condition: 1 of selection*
    fields:
    - host.name
