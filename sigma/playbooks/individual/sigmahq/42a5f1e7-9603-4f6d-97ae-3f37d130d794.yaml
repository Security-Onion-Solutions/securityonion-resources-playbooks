name: Suspicious File Downloaded From File-Sharing Website Via Certutil.EXE
id: ecaae12e-bccd-46db-a139-cf27f60d0ce0
description: |
  Detects certutil.exe (or a binary whose OriginalFileName is CertUtil.exe) invoked
  with a download verb (urlcache, verifyctl, or URL) AND a command line that references
  a known file-sharing or paste/CDN domain such as pastebin.com, cdn.discordapp.com,
  transfer.sh, gofile.io, or a *.githubusercontent.com / *.workers.dev / *.trycloudflare.com
  host. certutil is a signed Microsoft binary that ships on every Windows install, so its
  download primitive lets an operator pull a second-stage payload while looking like routine
  certificate handling. Some administrators and scripts use certutil legitimately, so the
  investigation should confirm the exact command line, identify the source URL and the
  destination file, determine whether the download succeeded and what the payload is, and
  establish whether the binary, parent, user, and host pattern are expected here or fleet-wide.
type: detection
detection_id: 42a5f1e7-9603-4f6d-97ae-3f37d130d794
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did certutil run with a download verb (urlcache, verifyctl, or URL) and a
    file-sharing domain in the command line, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when all three conditions hold together - the image is certutil.exe
    (or OriginalFileName CertUtil.exe), the command line carries a download verb (urlcache,
    verifyctl, or URL), and it references a known file-sharing, paste, or CDN domain. Read
    the exact command line and note the source URL, the download verb used, and the output
    file path certutil was told to write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files from the internet with
    certutil?
  context: certutil is a certificate-handling utility; using it to pull files from
    file-sharing sites is a living-off-the-land download primitive rather than normal
    administrative use. A packaging or build host run by an engineer who scripts certutil
    is a different finding than an end-user workstation or a server where certutil downloads
    never occur. Knowing the account role and host function is often the fastest way to
    separate a benign script from operator-driven delivery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was certutil executed from its expected System32 or SysWOW64 path, or from
    somewhere else?
  context: certutil ships at C:\Windows\System32\certutil.exe and C:\Windows\SysWOW64\certutil.exe.
    A certutil.exe running from a user temp directory, Downloads, ProgramData, or any
    user-writable path may have been copied or renamed to sidestep path-based allowlists.
    Compare Image against OriginalFileName - a mismatch, or an Image outside the system
    directories, points to a relocated or renamed copy rather than the built-in binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What is the full certutil command line - which source URL, which download
    verb, and what output file was specified?
  context: The full command line reveals the operation. Identify the file-sharing URL
    certutil was pointed at, which download verb was used (urlcache, verifyctl, or URL),
    and the destination path the payload was written to. The canonical download form is
    urlcache -split -f <URL> <outfile>; verifyctl and URL land the file in the
    CryptnetUrlCache directory when no output path is given. The source URL and output
    path together identify what was fetched and where it lives now.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \certutil.exe
        CommandLine|contains:
        - 'urlcache '
        - 'verifyctl '
        - 'URL '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the certutil command line or the downloaded file involve encoding, and
    if so what does the decoded content do?
  context: certutil is used both to download payloads and to decode them. The same chain
    that pulls a file from a paste or file-sharing site often base64- or hex-wraps the PE
    so it transits as text, then decodes it with -decode or -decodehex back to an
    executable. Inspect the command line for a decode verb and named source/output files,
    and check whether the downloaded artifact is a text-wrapped payload (for example a PE
    behind -----BEGIN CERTIFICATE----- headers or a byte-reversed file with a benign
    extension). Decoding reveals whether the transfer delivered an executable, a script
    cradle, or benign data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned certutil, and is that parent chain expected for a
    download?
  context: The parent process shows how the certutil download was launched. Interactive
    administration usually shows a console shell or a known automation parent; an
    unexpected parent such as an Office application, wscript.exe, mshta.exe, or a script
    interpreter points to a macro or staged loader invoking certutil to fetch a payload.
    Known-good updater parents account for some benign certutil use, so identify the
    parent and judge whether that launch path is routine here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did certutil open an outbound network connection to the file-sharing host
    around the time of the alert?
  context: The download verb implies an HTTP or HTTPS transfer; confirming the network
    connection ties the command line to an actual egress event and surfaces the resolved
    destination address. certutil downloads carry distinctive request signatures
    (Microsoft-CryptoAPI and CertUtil URL Agent user agents), and the connection record
    shows the destination IP and port the payload was pulled from. No connection in the
    window suggests the transfer was blocked, cached, or never reached the network.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \certutil.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: If the file certutil pulled was executed, what is its hash and does it have known
    threat-intel detections?
  context: The hash for a reputation lookup is recorded when the payload runs, not when certutil
    writes it to the destination (or to the CryptnetUrlCache content directory when no output
    path is given) — file-creation events carry no hash. certutil only downloads, so the payload
    is usually run by the same shell as a sibling process; this query returns certutil's sibling
    and child processes with their executable hashes. Payloads pulled from paste and file-sharing
    sites are frequently packed or text-wrapped second-stage loaders, so a hash miss does not
    clear the file — also examine its content. If it was run later by an unrelated process,
    retrieve it from disk (or CryptnetUrlCache) and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the directory certutil wrote the payload
    to?
  context: Operators often stage multiple files in one directory, or the downloaded file
    triggers further writes - decompression, decoding to a second file, or additional
    downloads. Examining directory-level file activity around the certutil write, with the
    known payload filtered out, reveals the broader scope of the delivery and any follow-on
    artifacts dropped alongside it.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did certutil spawn, or what new processes ran on this host shortly after
    the download?
  context: A successful download is usually followed by execution of the retrieved payload
    - the same parent or certutil itself launching the dropped file, or a fresh process
    starting from the staging directory. Examining process creation in the window after the
    download reveals whether the delivered file ran and what it did. A burst of new
    processes, especially from user-writable paths or under the same parent, points to the
    payload executing rather than a download that stalled.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_flags:
        CommandLine|contains:
        - 'urlcache '
        - 'verifyctl '
        - 'URL '
      selection_http:
        CommandLine|contains:
        - .githubusercontent.com
        - 0x0.st
        - anonfiles.com
        - bashupload.com
        - cdn.discordapp.com
        - chunk.io
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - github.com
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
        - paste.ee
        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
        - x0.at
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certutil.exe
      - OriginalFileName: CertUtil.exe
      selection_flags:
        CommandLine|contains:
        - 'urlcache '
        - 'verifyctl '
        - 'URL '
      selection_http:
        CommandLine|contains:
        - .githubusercontent.com
        - 0x0.st
        - anonfiles.com
        - bashupload.com
        - cdn.discordapp.com
        - chunk.io
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - github.com
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
        - paste.ee
        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
        - x0.at
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
