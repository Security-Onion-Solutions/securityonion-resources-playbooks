- question: Have other hosts fired the rule's certutil download pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the certutil file-sharing download pattern rather than
    generic certutil activity. Many hosts firing the same pattern points to a build pipeline
    or scripted deployment that pulls from a shared source by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
