- question: Were any other download LOLBins used on this host recently?
  context: Operators who reach for one download LOLBin often use several. If certutil
    pulled a file, check whether bitsadmin, curl, esentutl, expand, or other transfer-capable
    signed binaries were also run on this host. Finding multiple download primitives in a
    short span strengthens the case that this is deliberate staging rather than an isolated
    administrative use of certutil.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, initial access, or
    execution - may reveal the attack stages that preceded the certutil download and help
    reconstruct the timeline. Ingress tool transfer is usually one step in a sequence, so
    prior alerts give the context for why a payload was being pulled.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's certutil download pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate scripting can drive certutil downloads. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here, not
    generic certutil activity. A new parent process, an unexpected account, or a first-ever
    occurrence is the anomaly worth chasing.
