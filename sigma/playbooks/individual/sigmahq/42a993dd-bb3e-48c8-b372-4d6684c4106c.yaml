  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the CrackMapExec firing pattern rather than generic
    process activity. Many hosts firing the same pattern points to a sanctioned testing
    program or scripted deployment; one host or a small unrelated set points to manual
    operator activity. Use the host distribution to calibrate severity.
  range: -7d
