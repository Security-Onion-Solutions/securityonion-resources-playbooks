name: HackTool - CrackMapExec Execution
id: 99309d10-f81c-4c72-950e-6badf07ae731
description: |
  Detects command-line flag combinations characteristic of CrackMapExec (CME), a
  post-exploitation toolkit used for credential validation, password spraying, and
  remote module execution against SMB and MSSQL. The rule fires when a process
  matches any ONE of several independent patterns: the crackmapexec.exe binary name,
  a pe_inject module invocation, a local-auth command-execution combination
  (--local-auth with -u and -x), a pass-the-hash combination (--local-auth with -u,
  -p, and -H 'NTHASH'), an mssql or smb module invocation, or a local-auth sweep
  across an RFC1918 range (10. / 192.168. / /24). Because the binary can be renamed,
  several branches key on flag patterns rather than the image, so the same operator
  workflow can trigger the rule even when crackmapexec.exe is absent. Legitimate red
  team or penetration-test activity uses the same tool, so the investigation should
  confirm which branch fired, identify the credentials and targets supplied,
  determine which module or command was run, and establish whether the activity is
  an authorized engagement or unsanctioned operator action.
type: detection
detection_id: 42a993dd-bb3e-48c8-b372-4d6684c4106c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match one of the CrackMapExec patterns this rule
    detects, and which branch fired?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process matches EITHER the crackmapexec.exe image name, OR
    a ' -M pe_inject ' module call, OR a local-auth command-execution combination
    (' --local-auth' with ' -u ' and ' -x '), OR a pass-the-hash combination
    (' --local-auth' with ' -u ', ' -p ', and " -H 'NTHASH'"), OR an mssql/smb
    module call, OR a local-auth sweep across an RFC1918 range. Read the exact command
    line and note which branch matched, because the branch determines what the
    activity was attempting - a pe_inject branch points to in-memory payload delivery,
    a -H branch points to pass-the-hash, and a /24 sweep points to credential spraying
    across a subnet. The branch that fired drives which downstream questions carry
    the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this CrackMapExec activity part of an authorized penetration test or
    red team engagement?
  context: CrackMapExec is a standard offensive toolkit used in authorized security
    assessments. Before investing investigation time, check whether a penetration
    test or red team exercise is currently scheduled against this host or network
    segment. An authorized engagement whose scope, source host, and timing match this
    activity resolves the alert without further analysis; the absence of any
    sanctioned engagement shifts the disposition toward unauthorized operator use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run remote credential-validation or
    lateral-movement tooling?
  context: CrackMapExec authenticates to remote hosts and runs modules across them,
    so it is normally seen only from administrator workstations, jump hosts, or
    sanctioned testing systems. A standard user endpoint or a server with no
    administrative role running this pattern is more notable than the same activity
    from a known pentest box. Knowing whether the acting account and host function
    involve remote administration is often the fastest path to separating sanctioned
    use from an operator on a compromised host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which CrackMapExec protocol, module, or command was invoked?
  context: CrackMapExec is multi-purpose - it can validate credentials, spray
    passwords, run remote modules such as mimikatz or pe_inject, and execute arbitrary
    commands via -x. The protocol (smb or mssql), the module after -M, and any command
    after -x determine the scope of potential compromise. A bare authentication check
    is a different finding than a pe_inject reflective-loader call or an -x command
    that fetches and runs a payload. Read the full command line and identify the
    specific capability invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What credentials, targets, and authentication material were supplied on
    the command line?
  context: The CrackMapExec command line names the targets (a single IP, an IP range,
    a /24 CIDR, or a target-list file) and the authentication material - a username
    after -u, a password after -p, or an NT hash after -H for pass-the-hash. The
    --local-auth flag forces local-account authentication rather than domain
    authentication, which is the spraying pattern against a subnet. Identify which
    accounts and hashes were used and how broad the target set is, then cross-reference
    those usernames against directory group memberships - local administrator
    credentials reused across many hosts enable broad lateral movement, while domain
    administrator or service-account credentials require incident escalation. This
    determines which credentials may be compromised and how many hosts were in scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If the pe_inject or an -x command branch fired, what payload or command
    was delivered?
  context: The pe_inject module reflectively loads a DLL or EXE into a remote
    PowerShell process in memory, with the local payload path supplied after
    -o PATH=. The -x branch passes an arbitrary command to run on the target, often a
    PowerShell or certutil download cradle that fetches and executes a second-stage
    payload. Read the command line to recover the PATH value, any -o options, and the
    full -x command string, since these name the file or URL that was actually
    executed and the in-memory loader leaves little else on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the CrackMapExec activity, and is that parent chain
    expected?
  context: The parent process reveals how the tool was launched. Interactive operator
    use typically shows a console shell or a remote-administration session as the
    parent; an unexpected parent such as a script host, mshta.exe, an Office
    application, or a service points to automated or remotely driven invocation. The
    parent is where the credential-validation or module command originated, so it
    anchors who or what initiated the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What outbound connections to remote hosts occurred from this host right
    after the alert?
  context: CrackMapExec authenticates and runs modules over the network, so a true
    positive is usually accompanied by outbound SMB (445), MSSQL (1433), or WinRM
    connections to the targets named on the command line. Correlating outbound
    connections from this host immediately after the launch shows which remote systems
    were actually contacted and whether the target set matches the command-line scope
    or extends beyond it. A burst of connections to many hosts is consistent with a
    subnet sweep.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_local:
        DestinationIp|cidr:
          - '127.0.0.0/8'
          - '::1/128'
      condition: selection and not filter_local
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Did any successful or failed logons follow this activity that match the
    accounts CrackMapExec attempted?
  context: A --local-auth sweep across a /24 range generates authentication attempts
    against many hosts; the meaningful question for credential-access triage is
    whether any of those attempts succeeded. Reviewing authentication events that
    reference the accounts and source host from the command line shows whether the
    sprayed or pass-the-hash credentials were valid. A run of failures followed by a
    success on a remote host indicates the operator found a working credential and
    may already be moving laterally.
  range: +1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4625
          - 4776
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
- question: Were CrackMapExec or post-exploitation artifacts written on this host
    after the activity?
  context: CrackMapExec and the modules it runs leave characteristic artifacts -
    a cme.db database and logs in a .cme directory, dumped credential or ticket files
    from credential modules, and payload files staged for pe_inject. Checking for file
    writes from the launching process confirms execution and reveals the scope of
    activity even after the original process exits. Files dropped to user-writable or
    public paths around the alert time are worth pulling for analysis.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* or all of part_localauth*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* or all of part_localauth*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    CrackMapExec activity was a single event or part of activity spanning multiple
    endpoints. If the same user triggered related execution on other hosts in the same
    window, the operation reaches further than one machine and the response scope grows
    accordingly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_binary:
        Image|endswith: \crackmapexec.exe
      selection_special:
        CommandLine|contains: ' -M pe_inject '
      selection_execute:
