        - ' --local-auth'
        - ' -u '
        - ' -x '
      selection_hash:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
        - ' -H ''NTHASH'''
      selection_module_mssql:
        CommandLine|contains|all:
        - ' mssql '
        - ' -u '
        - ' -p '
        - ' -M '
        - ' -d '
      selection_module_smb1:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -H '
        - ' -M '
        - ' -o '
      selection_module_smb2:
        CommandLine|contains|all:
        - ' smb '
        - ' -u '
        - ' -p '
        - ' --local-auth'
      part_localauth_1:
        CommandLine|contains|all:
        - ' --local-auth'
        - ' -u '
        - ' -p '
      part_localauth_2:
        CommandLine|contains|all:
        - ' 10.'
        - ' 192.168.'
        - '/24 '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* or all of part_localauth*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    CrackMapExec launch reveals what led to it and what followed - the parent that
    staged the tool, reconnaissance, credential staging, or follow-on execution. Novel
    parent-child pairs at low counts are what to scan for against the high-count noise
    of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    initial-access activity - may reveal the attack stages that preceded the
    CrackMapExec activity and help reconstruct the full timeline. Remote credential
    validation is usually one step in a sequence, so prior alerts give context for how
    the operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's CrackMapExec pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned testing can match these CrackMapExec patterns. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically
    run here, not generic process activity. A new parent process, an unexpected
    account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
