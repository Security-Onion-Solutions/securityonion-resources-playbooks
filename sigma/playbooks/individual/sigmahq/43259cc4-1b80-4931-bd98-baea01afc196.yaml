name: Exploitation Activity of CVE-2025-59287 - WSUS Suspicious Child Process
id: 07811477-8297-4689-840d-8f2b0cdc8ffb
description: |
  Detects a command interpreter or PowerShell host (cmd.exe, powershell.exe, pwsh.exe, or
  powershell_ise.exe) starting as the child of a Windows Server Update Services process. The rule
  requires the child binary to match, together with either a parent whose image ends in
  wsusservice.exe, or a w3wp.exe worker whose parent command line contains WsusPool — two
  alternative parent branches, either of which satisfies the rule.
  Neither WSUS process has a routine reason to create a shell. The pattern is the post-exploitation
  step of an unauthenticated deserialization flaw in the WSUS web services such as CVE-2025-59287,
  where a crafted SOAP request to the reporting endpoint reaches code execution as SYSTEM and the
  resulting process chain runs the update service or the IIS worker into cmd.exe and on into
  powershell.exe for host reconnaissance and collection.
  Determine which parent branch fired, what the child command line did, whether the WSUS role on
  this host carries the out-of-band fix for the known remote code execution flaws, and whether the
  shell wrote files to user-writable paths or connected outbound.
type: detection
detection_id: 43259cc4-1b80-4931-bd98-baea01afc196
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Is the alerting process one of the rule's shell binaries, and did it start under either
    wsusservice.exe or a w3wp.exe worker running the WsusPool application pool?
  context: >-
    The rule fires on two alternative parent branches. Either ParentImage ends in wsusservice.exe,
    or ParentImage ends in w3wp.exe and the parent command line contains WsusPool; the second branch
    needs both of its conditions together. Both branches additionally require the child Image to end
    in cmd.exe, powershell.exe, pwsh.exe, or powershell_ise.exe. Read ParentImage and
    ParentCommandLine and note which branch fired, because the branch says where to look next. The
    w3wp.exe/WsusPool branch places execution inside the IIS worker that hosts the WSUS web services,
    which is where a crafted request lands, so the request-side and module-load questions carry the
    weight there. The wsusservice.exe branch points at the update service itself, where local
    maintenance tooling is the more common alternative explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Does this host hold the WSUS role, and is the alerting account expected to run a shell on it?
  context: >-
    A WSUS worker runs as NETWORK SERVICE or a dedicated application pool identity, and the rule's own
    tuning guidance points at exactly that account context. A shell owned by the update service
    identity on a patch distribution server is not ordinary administration, since administrators open
    shells under their own account from an interactive session. Confirm the host actually serves the
    WSUS role and establish whether any local maintenance script or management agent is documented as
    driving the service to launch cmd.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this WSUS parent expected to spawn a shell, and what started the parent itself?
  context: >-
    This retrieves the parent's own creation event, which resolves the branch and the parent's
    lineage in one view. A w3wp.exe worker started by the IIS service host with an application pool
    argument naming WsusPool is the worker that serves the WSUS web endpoints; wsusservice.exe started
    by services.exe is the update service. Neither is a launcher for a command interpreter. If the
    parent's own origin is a normal service start, the shell was driven by input the parent processed
    rather than by anything a local operator did, which moves the investigation to the request that
    reached the service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What web request reached the WSUS web services immediately before this shell started?
  context: >-
    The reachable entry points are the reporting, client, API remoting, and DSS authentication
    endpoints published by the WSUS site, typically on 8530/8531, and the exploitation path is an
    unauthenticated SOAP body deserialized without type validation. The parent command line names the
    application pool but not the request, so the request itself has to come from the web server access
    and error logs for the WSUS site around the alert time, scoped to the public addresses that front
    the server. Look for POST requests to those endpoints, for exploit-like input patterns such as
    ../, union select, cmd=, ${jndi:, rO0AB, %00, ${env:}, and ${${::-j}ndi}, and for error spikes
    above roughly 5 responses of status 4xx or 5xx per client or URI in 5 minutes. The source address
    of the matching request is the earliest blockable indicator and identifies whether the traffic
    came from inside the network or from the internet.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the WSUS role on this host patched against the known unauthenticated remote code execution flaws?
  context: >-
    CVE-2025-59287 is an unsafe deserialization flaw in the WSUS reporting web service, reachable
    without authentication and executing as SYSTEM. Its first fix was incomplete and was superseded by
    an out-of-band update, so a server patched only to the earlier release remains exploitable and the
    build level has to be checked rather than assumed. If the host is fully patched, the same
    parent-child pattern points either at a separate WSUS flaw or at local administrative tooling, and
    the command line becomes the discriminator. Also record whether the WSUS endpoints are reachable
    from outside the network, since that determines how urgently the same check needs to run on every
    other server holding the role.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same WSUS parent instance spawn?
  context: >-
    Exploitation of this service produces a chain rather than a single process. The observed
    progression runs the update service or the IIS worker into cmd.exe, then a nested cmd.exe, then
    powershell.exe, so reading every child of the same parent instance in the surrounding 15 minutes
    shows how far it ran. Children a WSUS application pool should never produce include
    powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe and
    curl.exe. Children that are routine for this parent and can be set aside include conhost.exe,
    csc.exe, cvtres.exe, vbc.exe, werfault.exe and wsuscertserver.exe. Reconnaissance commands issued
    in sequence, such as whoami, systeminfo, net, ipconfig or nltest, indicate the operator was
    profiling the host before doing anything else.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this same detection fire on other WSUS servers in the environment?
  context: >-
    WSUS instances are reachable across the internal network by design and, where published, from
    outside it. Exploitation that follows a public proof of concept reaches every instance it can
    resolve rather than one chosen server, so counting the hosts and accounts where this rule fired in
    the last day separates a targeted server from indiscriminate exploitation. A WSUS server is also a
    trusted software distribution point for every client it serves, so each additional affected server
    widens the set of downstream systems that need review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What did the shell actually run, and was any of it encoded or obfuscated?
  context: >-
    The alerting process may be the cmd.exe at the top of the chain carrying a short command, or the
    powershell.exe further down carrying the payload, so read the full command line before judging it.
    Decode any -EncodedCommand or -enc base64 argument and resolve string concatenation, backtick
    escaping, and variable substitution to their literal values. The collection pattern seen with this
    exploitation gathers host information and posts it to an external webhook endpoint using
    Invoke-WebRequest, falling back to curl.exe when the cmdlet fails. Record any destination URL, any
    download cradle such as Net.WebClient.DownloadString, Invoke-RestMethod, or a reflective assembly
    load, and any local path the command writes to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content on this host?
  context: >-
    Event ID 4104 records the deobfuscated script text PowerShell compiled, which is ground truth when
    the command line is encoded or when the chain hands work between nested cmd.exe instances. It
    exposes the literal destination addresses, the fields the script collected, and any fallback logic
    the command line does not show. If PowerShell operational logs are not ingested in this
    environment, treat an empty result as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened around this execution?
  context: >-
    Execution policy bypass arguments are the common form for a payload launched from a service
    process, since no user profile or signing policy stands in the way and the operator wants the
    script to run unattended. AMSI tampering, an engine downgrade to version 2, or real-time
    monitoring being disabled in the hour before the shell started separate a prepared operation from
    maintenance tooling that happens to use the same parent. Their absence does not clear the alert,
    but their presence removes the routine-administration explanation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What modules did the WSUS parent process load in the hour before the shell was spawned?
  context: >-
    The deserialization path reaches code execution by having the serialization formatter instantiate
    a gadget type, and the gadget chains published for this flaw reference .NET types drawn from
    assemblies the WSUS worker has no functional need for, including PowerShell editor and text
    formatting assemblies used to wrap an object provider that starts a process. Modules loaded by the
    parent shortly before the child appeared therefore show whether the process was pulled into
    loading managed assemblies outside its normal set. Unsigned modules, modules whose signature does
    not resolve to Microsoft, and modules loaded from temporary or user-writable directories point at
    a payload staged on disk rather than a purely in-memory gadget.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting shell write, and where did they land?
  context: >-
    Server-side exploitation stages tooling and collection output on disk before anything leaves the
    host. The writes that matter are those under directories a service process has no reason to touch
    with executable or script content, specifically Downloads, %TEMP%, %APPDATA%, C:\Users\Public,
    OneDrive-synced folders, and the web content directory the WSUS site serves from. This query lists
    every file the alerting process touched in the surrounding window. Read the extension and path of
    each write. Script or executable content under a temporary or user profile path is the payload,
    and a file landing under the web content directory is a web shell that survives the process. File
    writes carry no hash, so pivot a dropped path to the later execution of that path to get one.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - process_creation
- question: Did the shell or its related tooling connect outbound from this server around the alert?
  context: >-
    The chain seen with this exploitation ends with collected host data leaving over HTTPS to an
    external webhook endpoint, driven by a PowerShell web request and falling back to curl.exe when
    the cmdlet fails. A WSUS server's normal egress is to vendor update endpoints and to the
    downstream clients it serves; a connection from a command interpreter under the WSUS parent to
    anything else is the collection or command channel. Suppress the update and content delivery
    destinations and proxy egress ranges the environment already allows, then treat what remains as
    the lead, and correlate the connection time against the process spawn to confirm they belong to
    one operation. Connections recorded only by network sensors carry no process attribution, so the
    process-anchored view here is the subset that can be tied back to this chain.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\powershell_ise.exe'
          - '\curl.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: What other process activity occurred on this server around the time of the alert?
  context: >-
    A server's normal process profile is narrow: the service, its workers, and scheduled maintenance.
    Aggregating every parent and child image pair on the host in the 15 minutes either side of the
    alert collapses routine agent and service telemetry into a few high-count rows and leaves novel
    pairs visible at low counts, which is what the analyst is scanning for. Reconnaissance binaries,
    credential tooling, archive utilities, or remote execution services appearing in that window place
    the alert inside a longer operation. Fifteen minutes is the horizon these chains normally fit
    inside, from the triggering request through the process spawn to the outbound callback.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - network_connection
- always_include: true
  question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is a 90-day
    history of a WSUS parent spawning a shell for that identity, aggregated by host, rather than
    generic use of cmd.exe or powershell.exe. On a healthy server the count is zero. Note that this
    alert commonly fires under a service identity such as NETWORK SERVICE or an application pool
    account, and in that case the account attributes nothing on its own; read the count alongside the
    parent-mechanism history rather than in place of it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_wsusservice:
        ParentImage|endswith: \wsusservice.exe
      selection_parent_w3wp_wsuspool:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: WsusPool
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_parent_* and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this WSUS parent historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, account identity does not attribute the behavior
    and the launch mechanism does. The query mirrors the rule's selection structure scoped to the
    alerting parent process across 90 days, aggregated by host, so the result is how often this parent
    has driven a shell before rather than generic parent and binary co-occurrence. A WSUS service or
    application pool worker with no prior history of spawning a shell is the deviation worth chasing.
    A long history concentrated on this host points instead at a local maintenance script or
    management agent that drives the service, which is worth confirming before treating the alert as
    exploitation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_wsusservice:
        ParentImage|endswith: \wsusservice.exe
      selection_parent_w3wp_wsuspool:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: WsusPool
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_parent_* and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity across every host in the alert window shows whether it stayed on
    this server or moved. A compromised WSUS server hands an operator a trusted distribution path to
    every client it updates, so the same account appearing on downstream systems in the same window is
    the lateral step to chase. When the alert fires under SYSTEM or a service identity this query
    returns routine agent telemetry from every host in scope and should be read as noise; the
    parent-mechanism view answers the same question with scoping that survives a service identity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window, or is it isolated to this server?
  context: >-
    Under a service principal, asking what else the account did across the environment returns agent
    telemetry from every host and answers nothing. The query mirrors the rule's selection structure
    scoped to the alerting parent process, fleet-wide, in the alert window. Several servers producing
    shells under the same WSUS parent inside the same hour points at exploitation reaching every
    reachable instance, which changes the response from one host to the whole role. A single host
    points at a host-local trigger such as a maintenance script or an operator on that server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_wsusservice:
        ParentImage|endswith: \wsusservice.exe
      selection_parent_w3wp_wsuspool:
        ParentImage|endswith: \w3wp.exe
        ParentCommandLine|contains: WsusPool
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \powershell_ise.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_parent_* and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
