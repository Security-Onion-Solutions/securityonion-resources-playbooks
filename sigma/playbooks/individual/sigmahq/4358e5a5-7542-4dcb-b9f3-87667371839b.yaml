name: ISO or Image Mount Indicator in Recent Files
id: 6406a4c5-f4b9-4b89-990a-bc966d111549
description: |
  Detects a Recent-files shortcut (.lnk under \Microsoft\Windows\Recent\) that points at a mounted
  disk-image container ending in .iso, .img, .vhd, or .vhdx. Windows records such a shortcut when a
  user opens a mounted container, and files carried inside these containers do not inherit the
  Mark-of-the-Web tag, so contained payloads bypass SmartScreen and Protected View warnings — a
  common phishing-attachment delivery pattern. On servers this can be routine image handling, but on
  workstations users rarely mount .iso or .img files, so the investigation should determine which
  container was mounted, how it was delivered, what ran from the mounted volume, and whether the same
  activity reached other users.
type: detection
detection_id: 4358e5a5-7542-4dcb-b9f3-87667371839b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the Recent shortcut match a mounted disk-image container under the Recent folder?
  context: Before investing investigation time, confirm the alert is a true positive. The shortcut
    path must sit under \Microsoft\Windows\Recent\ and end in .iso.lnk, .img.lnk, .vhd.lnk, or
    .vhdx.lnk — a recent-files entry Windows writes when a user opens a mounted disk-image container.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to mount ISO, IMG, or VHD disk-image files?
  context: Legitimate image handling is common on servers and developer or IT workstations but rare
    for ordinary users. Knowing whether the user role and host function normally involve mounting
    disk-image containers is often the fastest way to separate routine activity from a phishing lure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which disk-image container does this Recent shortcut point to, and where did that container come from?
  context: The Recent shortcut records the full path of the item the user opened. Resolve the .lnk
    target to identify the specific .iso/.img/.vhd file and its origin — a container sitting in a
    Downloads folder, an Outlook attachment temp path, or a browser cache points to email or web
    delivery, while one on a network share points to internal movement.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What processes executed on this host in the hours after the mount indicator?
  context: A mounted ISO, IMG, or VHD is assigned a drive letter, and payloads launched from the
    container run from that non-system drive (for example D:\ or E:\) rather than C:\. Watch for
    executables, script hosts, or shortcuts running from a non-system drive letter and for suspicious
    lineage such as an Office application or explorer.exe spawning powershell.exe, cmd.exe, wscript.exe,
    or rundll32.exe. High-risk items carried in these containers include .exe, .js, .vbs, .lnk, and
    macro-enabled documents; capture the hash of anything that ran from the mounted volume for
    threat-intel lookup.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
      - ParentImage
- question: What email or download delivered the disk-image container that was mounted?
  context: Container-delivery phishing begins with a malicious attachment or link that places an
    .iso/.img/.vhd on disk; the container format is chosen because many gateways do not scan inside
    it and its contents bypass Mark-of-the-Web. Identify the sender, message, or download URL that
    delivered the container so it can be blocked and other recipients found. This requires manual
    review of email and web logs and browser download history for the container filename.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the same disk-image mount indicator fire for other users or hosts?
  context: Phishing campaigns rarely target a single recipient. If one user mounted a delivered
    container, others likely received the same lure. Correlating this detection across the fleet
    reveals campaign breadth and additional systems that need review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What outbound network connections did this host make after the mount indicator?
  context: Once a container's payload runs, it commonly beacons to attacker infrastructure or pulls
    a follow-on stage. Review connections leaving this host in the follow-on window, focusing on
    egress to external or unfamiliar addresses and on connections made by script hosts or binaries
    that ran from a mounted volume. Exclude known-good updater and telemetry destinations.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What other Recent shortcuts were written on this host recently, and which files do they reference?
  context: The Recent folder records every file the user opened, so neighboring shortcuts reveal what
    else was opened around the mount — the payload files launched from the mounted volume, other
    container mounts, and any documents that preceded the lure. A cluster of newly created shortcuts
    referencing a mounted drive letter is the user-execution footprint of the container's contents.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Windows\Recent\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the Recent shortcut still present, or was it removed after the alert?
  context: The post-alert lifecycle drives next steps. A shortcut and its container still on disk can
    be retrieved and the container's contents analyzed; a shortcut deleted shortly after creation, or
    a container unmounted and removed, suggests cleanup and shifts the focus to what executed in
    between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously produced this mount-in-Recent indicator, what programs and users drove it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection scoped to this host, so the program and user
    distribution reflects how this specific mount pattern has historically appeared here rather than
    generic file activity. A new writing program, an unexpected user account, or a first-ever
    appearance of this pattern is the deviation worth chasing; file events carry no parent
    lineage, so pivot on the acting program's process-start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - .iso.lnk
        - .img.lnk
        - .vhd.lnk
        - .vhdx.lnk
        TargetFilename|contains: \Microsoft\Windows\Recent\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this mount-in-Recent indicator in the past week, and does the distribution look like automation or isolated activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this mount pattern rather than generic image use. Many hosts producing the same pattern points to
    scripted deployment or an imaging workflow; one host or a small unrelated set points to individual
    user activity such as opening a delivered container.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - .iso.lnk
        - .img.lnk
        - .vhd.lnk
        - .vhdx.lnk
        TargetFilename|contains: \Microsoft\Windows\Recent\
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user produced this mount indicator before, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, giving their 90-day history of
    this specific mount pattern aggregated by host. A user who has never mounted disk-image containers
    is more suspicious than one who does so routinely; weigh the count against their role and typical
    workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - .iso.lnk
        - .img.lnk
        - .vhd.lnk
        - .vhdx.lnk
        TargetFilename|contains: \Microsoft\Windows\Recent\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this responsible process historically produced this mount indicator, or is it new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute
    behavior; the launch mechanism does. The query mirrors the rule's selection scoped to the alerting
    program, giving its 90-day history of driving this pattern. A new or rare program for this
    pattern is the deviation; a program already accounting for many prior events is an imaging or
    management workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - .iso.lnk
        - .img.lnk
        - .vhd.lnk
        - .vhdx.lnk
        TargetFilename|contains: \Microsoft\Windows\Recent\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the mount is an isolated
    event or part of broader movement. The same user driving similar activity on multiple endpoints
    widens the potential scope of compromise.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven mount indicator fire on other hosts in the same window?
  context: Under a service or machine account, network-wide user activity returns agent-telemetry
    noise. The meaningful question is whether the same launch mechanism fired elsewhere in the alert
    window. The query mirrors the rule's selection scoped to the alerting program, fleet-wide.
    Multiple hosts in the same window points to pushed or scheduled automation; a single host points
    to a host-local trigger such as a user opening a container.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - .iso.lnk
        - .img.lnk
        - .vhd.lnk
        - .vhdx.lnk
        TargetFilename|contains: \Microsoft\Windows\Recent\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Container mounts rarely happen in isolation. Earlier detections on the same host — a
    suspicious download, document behavior, or reconnaissance — may reveal the delivery and user-open
    stages that preceded the mount and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
