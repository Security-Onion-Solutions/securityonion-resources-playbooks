name: Computer Discovery And Export Via Get-ADComputer Cmdlet
id: f0475228-3529-4515-88e8-417c4dc264a0
description: |
  Detects PowerShell (powershell.exe or pwsh.exe) running the Get-ADComputer
  cmdlet with an unrestricted -Filter * to enumerate every computer object in
  Active Directory, where the result is captured to a file or pipeline via a
  redirect (>), Out-File, Set-Content, Add-Content, or Select. The rule fires
  only when both the image/OriginalFileName selection AND the command-line
  selection match, so the alert always represents a domain-wide computer
  enumeration whose output was staged rather than read interactively. Pulling
  the full computer inventory is routine for administrators building reports or
  scripts, but the same one-line export is a common early step in hands-on
  intrusions to map the domain before lateral movement. The investigation should
  decode the full command and its output destination, establish whether the
  acting user and host normally perform this enumeration, and look for other
  reconnaissance or follow-on activity around the same window.
type: detection
detection_id: 435e10e4-992a-4281-96f3-38b11106adde
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did PowerShell run Get-ADComputer with an unrestricted -Filter * and
    redirect the output to a file or pipeline, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when both conditions hold together - the image is
    powershell.exe or pwsh.exe AND the command line contains Get-ADComputer with
    -Filter * AND an output cmdlet or redirect (>, Out-File, Set-Content,
    Add-Content, or Select). Read the exact command line and note the -Filter
    value, any -Properties requested, and where the output was written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate the full Active Directory
    computer inventory?
  context: Domain and IT administrators legitimately run Get-ADComputer to build
    reports, inventory scripts, and scheduled exports. Standard users and
    non-administrative hosts rarely pull the entire computer list. The acting
    account's role and the host's function are often the fastest way to separate
    routine administration from post-compromise domain mapping - an unrestricted
    -Filter * export from an account or endpoint that has no reason to inventory
    the domain is the case worth pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What did the full Get-ADComputer command enumerate, and where was the
    output written?
  context: The full command line reveals the scope of the enumeration and its
    staging location. Note the -Filter expression (whether it is the broad * or a
    narrower query), any -Properties requested (a full -Properties * pull harvests
    operating system, last-logon, and addressing data useful for targeting), and
    the output destination from the redirect or Out-File/Set-Content/Add-Content
    target. The query scopes to Get-ADComputer activity on this host within a few
    minutes rather than the single triggering event, so a multi-step export or a
    sequence of related enumeration commands appears together. powershell.exe is
    too common to scope by image alone, so the command-line pattern bounds the
    result.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Get-ADComputer '
      condition: selection
    fields:
      - CommandLine
      - User
      - CurrentDirectory
- question: Did PowerShell script block logging capture the full enumeration script
    content?
  context: Script block logging records the deobfuscated script content PowerShell
    actually executed, including the complete Get-ADComputer pipeline, the
    properties requested, and any further processing of the result before it was
    written out. This is ground truth for what the enumeration collected, even if
    the process command line was truncated or wrapped. If PowerShell operational
    logs are not ingested in this environment, treat zero results as a visibility
    gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process spawned the PowerShell that ran the enumeration, and is
    that parent chain expected?
  context: The parent process shows how the enumeration was launched and helps
    distinguish interactive administration from automated or non-interactive
    execution. A console shell spawned from explorer.exe or a known management
    console fits routine work; a script host (wscript.exe, cscript.exe,
    mshta.exe), an Office application, wmiprvse.exe, or wsmprovhost.exe points to
    macro-driven or remote execution. Enumeration originating from a
    non-interactive shell or a service context is more consistent with automated
    post-compromise discovery than with an administrator at a keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single domain enumeration may be legitimate troubleshooting, but
    several reconnaissance commands clustered together - whoami, net user, nltest,
    dsquery, systeminfo, or additional AD cmdlets such as Get-ADUser, Get-ADGroup,
    or Get-DomainComputer - is a signature of post-compromise enumeration before
    the next stage. Tightly grouped discovery from one host or user in a short
    window is the temporal pattern that turns a lone Get-ADComputer export into
    likely hands-on activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were PowerShell security controls bypassed or weakened on this host
    before the enumeration ran?
  context: Enumeration during an intrusion is frequently preceded by steps that
    weaken PowerShell defenses so the operator's later payloads run unimpeded -
    execution policy bypass (-ExecutionPolicy Bypass, -ep bypass), AMSI patching,
    a downgrade to PowerShell v2 which lacks modern logging, or real-time
    monitoring being disabled. Finding these precursors in the hour before the
    Get-ADComputer export strengthens the case that the discovery is part of
    hands-on operator activity rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    enumeration reveals what led to it and what followed - the parent that staged
    PowerShell, other discovery, credential access, or lateral movement attempts.
    Aggregating by image and parent image collapses routine system noise into
    high-count rows while novel parent-child pairs stand out at low counts, which
    is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADComputer '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADComputer '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the enumeration was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar discovery or other actions on
    other hosts in the same window, the scope of the incident is larger than one
    machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADComputer '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's Get-ADComputer export
    pattern, what parents and users normally drive it, and does the current alert
    fit?
  context: Even legitimate administration can run this enumeration. This query
    mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic PowerShell activity. A new parent process,
    an unexpected account, or a first-ever occurrence of the pattern is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADComputer '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's Get-ADComputer export pattern in the
    past week, and does the cross-host distribution look like consistent automation
    or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the Get-ADComputer export pattern rather
    than generic PowerShell activity. Many hosts firing the same pattern points to
    a reporting script or inventory job that runs the export by design; one host or
    a small unrelated set points to manual operator activity. Use the host
    distribution and the consistency of the parents to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains|all:
        - 'Get-ADComputer '
        - ' -Filter \*'
        CommandLine|contains:
        - ' > '
        - ' | Select '
        - Out-File
        - Set-Content
        - Add-Content
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - credential access, defense
    tampering, or other reconnaissance - may reveal the attack stages that preceded
    the domain enumeration and help reconstruct the timeline. Computer discovery is
    often a mid-sequence step taken after initial access to map the domain before
    lateral movement, so prior alerts give the context for why the inventory was
    pulled.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
