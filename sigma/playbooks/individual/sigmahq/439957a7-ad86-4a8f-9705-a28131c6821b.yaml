name: Old TLS1.0/TLS1.1 Protocol Version Enabled
id: 1d26885b-53c3-400a-8c32-3a8a9fe1b34e
description: |
  Detects a registry modification that re-enables the deprecated TLS 1.0 or TLS 1.1 protocol by writing an "Enabled"
  DWORD value of 0x00000001 under a SCHANNEL Protocols subkey. TLS 1.0 and 1.1 have known cryptographic weaknesses and are
  disabled by default on current Windows; legitimately re-enabling them is a compatibility action for a specific application,
  but the same change also weakens the host's transport security and can set up downgrade or interception of otherwise-strong
  TLS. Determine which protocol version and Client/Server role was re-enabled, which process and user made the change, and
  whether it reflects sanctioned compatibility work or an intentional weakening of the host's TLS posture.
type: detection
detection_id: 439957a7-ad86-4a8f-9705-a28131c6821b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key and value data match a re-enable of TLS 1.0 or TLS 1.1?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when an "Enabled" value
    under a SCHANNEL TLS 1.0 or TLS 1.1 Protocols subkey is set to DWORD (0x00000001). Confirm the exact key path
    (TargetObject) ends in \Enabled beneath a TLS 1.0 or TLS 1.1 Protocols subkey and that the value data (Details) is
    0x00000001, which turns the deprecated protocol on.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify SCHANNEL TLS protocol settings?
  context: Legitimate compatibility work re-enabling a legacy protocol is usually performed by an administrator, an installer,
    or a configuration-management run on a host that needs to talk to an old application or appliance. A change made by an
    unexpected user, on a host with no such compatibility requirement, or by an unusual writing process is the pattern that
    separates sanctioned tuning from a deliberate weakening of the host's TLS posture.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which TLS protocol version and Client/Server role does this key re-enable, and what does the value data mean?
  context: The SCHANNEL Protocols path names the exact protocol and role being changed -- ...\Protocols\TLS 1.0\Client vs
    ...\TLS 1.0\Server (and the TLS 1.1 equivalents). The Client subkey governs outbound connections the host initiates; the
    Server subkey governs inbound connections the host accepts. An "Enabled" DWORD of 0x00000001 turns that protocol on for
    that role. Read the key path and value data to establish precisely which weakened protocol the host will now negotiate
    and in which direction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this value and how was the change invoked?
  context: The writing process on the registry event identifies how the protocol was re-enabled. Pivot to the process
    creation event for that process to recover its full command line and parent. A GPO client, an installer, or an
    administrator running reg.exe or a PowerShell Set-ItemProperty against the SCHANNEL key looks different from the same
    change written by an unexpected script or a process with no configuration-management lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - Image
- question: What other SCHANNEL protocol keys were changed on this host around the same time?
  context: A downgrade is strongest when strong protocols are also turned off. Reviewing all SCHANNEL Protocols
    modifications on this host reveals whether the same actor re-enabled the counterpart Client/Server key, re-enabled both
    TLS 1.0 and TLS 1.1, or disabled TLS 1.2/1.3 (an "Enabled" of 0x00000000 or a DisabledByDefault of 0x00000001) to force
    negotiation down to the weakened version. The full set of changes shows whether this is a single compatibility tweak or
    a deliberate reshaping of the host's TLS posture.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SecurityProviders\SCHANNEL\Protocols\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Does the re-enabled setting persist, or was the key modified again afterward?
  context: Registry key and value deletions are not emitted as events on endpoint telemetry, so attacker cleanup of the key
    is not directly observable. Judge persistence from the key's re-modification history over a longer window -- whether the
    "Enabled" value stayed at 0x00000001, was reset to 0x00000000, or was toggled repeatedly. A value that is set once and
    left in place weakens the host indefinitely; a value that was quickly reverted suggests a short-lived test or a rolled-back
    change.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: An actor weakening transport security often changes several settings at once -- for example re-enabling a legacy
    protocol AND disabling a security tool AND altering firewall or proxy configuration. Reviewing all registry
    modifications on this host in a short window, grouped by key path and writing process, reveals the full scope of the
    configuration changes and whether multiple defense-weakening objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this SCHANNEL TLS key been modified before on this host?
  context: A first-time change to a SCHANNEL protocol key is more notable than a routine one. These keys should rarely
    change on a stable host; a long history of prior modifications points to configuration management or recurring
    compatibility work, while zero history indicates the protocol posture was just altered for the first time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same key modified on other hosts in the environment?
  context: The same protocol re-enable across many hosts usually reflects a centralized policy or software push and is
    consistent with fleet-wide compatibility work. A change isolated to this one host is more likely targeted. Compare the
    value data and writing process across hosts to tell an organization-wide configuration change from a single-host
    weakening.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Has this same writing process re-enabled legacy TLS on other hosts?
  context: Pivoting on the writing process across the fleet shows whether one tool or script is weakening TLS on more than
    this host. A single admin utility or management agent touching SCHANNEL protocol keys on many machines looks like a
    sanctioned rollout, whereas an unusual process making the same change on a handful of hosts resembles a scripted
    defense-weakening step.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
        TargetObject|contains: '\SecurityProviders\SCHANNEL\Protocols\'
      condition: selection
    fields:
      - host.name
      - TargetObject
      - Details
- question: Does this host normally run the process that made this change?
  context: A process that has never been seen on the host is more notable than one that runs regularly. Zero or very low
    historical counts for the writing process indicate a first-time or rare tool touching the host's TLS configuration,
    which merits closer scrutiny than a recurring management binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the change?
  context: Configuration changes rarely occur in isolation. Reviewing registry activity around the alert reveals what led up
    to the change and what followed, and whether the protocol re-enable is part of a broader set of host modifications.
    Novel key paths and writing processes stand out at low counts against routine high-volume registry noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: Did other detections fire on this host in the hours before this change?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may reveal the
    attack stages that preceded a deliberate weakening of transport security and help reconstruct the timeline leading to
    this change.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the host make outbound connections after the change that could exploit the weakened protocol?
  context: Re-enabling a legacy protocol lets the host negotiate weaker TLS, which enables downgrade and interception of
    traffic that would otherwise be strongly encrypted. Weak-protocol negotiation itself is not carried in this telemetry,
    so review the host's outbound connections after the change for new or unexpected destinations, or for a proxy or
    intercepting endpoint that the downgrade would make effective. Correlate destinations against known-good services.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
