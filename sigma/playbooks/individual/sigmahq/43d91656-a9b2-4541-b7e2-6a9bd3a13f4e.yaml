- question: What child processes did this PowerShell session spawn afterward?
  context: The processes spawned after the cmdlet ran reveal its actual impact. Follow-on cmd.exe, powershell.exe,
    certutil.exe, or archive utilities can indicate staging of dumped credential material, transfer of an extracted
    ntds.dit, or escalation steps that build on the directory access just obtained.
