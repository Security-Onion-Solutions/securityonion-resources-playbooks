name: DSInternals Suspicious PowerShell Cmdlets
id: 59c22f56-c954-414e-bf0b-19c87702c475
description: |
  Detects execution of DSInternals PowerShell cmdlets, which expose internal Active Directory and Azure AD
  features such as DPAPI backup key extraction, offline ntds.dit manipulation, password hash calculation, and
  credential auditing. The rule fires when a command line contains any of the module's cmdlet names. Legitimate
  usage is limited to directory administration, recovery, or scheduled auditing by a small set of privileged
  operators, so the investigation centers on identifying which cmdlet ran, what it operated against, who and
  what launched it, and whether the activity fits an approved administrative pattern or looks like credential
  access and offline directory tampering.
type: detection
detection_id: 43d91656-a9b2-4541-b7e2-6a9bd3a13f4e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line contain a DSInternals cmdlet matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reading the exact command
    line and identifying which DSInternals cmdlet fired. Note whether it is a read/audit cmdlet (Get-/Test-) or
    a write/extract cmdlet (Set-/Add-/Get-ADReplBackupKey/Get-ADDBAccount/Save-DPAPIBlob), since that distinction
    drives how the rest of the investigation is weighted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run Active Directory internals and credential-auditing tooling?
  context: DSInternals is used for directory recovery, password auditing, and AD/Azure AD internals work that
    typically belongs to a small set of identity administrators on domain controllers or admin workstations. If
    the user role and host function are not consistent with directory administration, the activity is harder to
    explain as routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which DSInternals cmdlet ran and what did it operate against? Decode the full command line.
  context: The full command line reveals the specific action taken. Identify the cmdlet and its arguments — which
    domain, account, database file (ntds.dit), backup key, or output path it targeted. Read/audit cmdlets describe
    what was inspected; write/extract cmdlets (account dumps, hash sets, DPAPI blobs, SID history, password sets)
    describe what was changed or exfiltrated. This query scopes to the rule's cmdlet pattern on this host within
    a few minutes, so a multi-step operation spanning several invocations is captured together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - Add-ADDBSidHistory
        - Add-ADNgcKey
        - Add-ADReplNgcKey
        - ConvertFrom-ADManagedPasswordBlob
        - ConvertFrom-GPPrefPassword
        - ConvertFrom-ManagedPasswordBlob
        - ConvertFrom-UnattendXmlPassword
        - ConvertFrom-UnicodePassword
        - ConvertTo-AADHash
        - ConvertTo-GPPrefPassword
        - ConvertTo-KerberosKey
        - ConvertTo-LMHash
        - ConvertTo-MsoPasswordHash
        - ConvertTo-NTHash
        - ConvertTo-OrgIdHash
        - ConvertTo-UnicodePassword
        - Disable-ADDBAccount
        - Enable-ADDBAccount
        - Get-ADDBAccount
        - Get-ADDBBackupKey
        - Get-ADDBDomainController
        - Get-ADDBGroupManagedServiceAccount
        - Get-ADDBKdsRootKey
        - Get-ADDBSchemaAttribute
        - Get-ADDBServiceAccount
        - Get-ADDefaultPasswordPolicy
        - Get-ADKeyCredential
        - Get-ADPasswordPolicy
        - Get-ADReplAccount
        - Get-ADReplBackupKey
        - Get-ADReplicationAccount
        - Get-ADSIAccount
        - Get-AzureADUserEx
        - Get-BootKey
        - Get-KeyCredential
        - Get-LsaBackupKey
        - Get-LsaPolicy
        - Get-SamPasswordPolicy
        - Get-SysKey
        - Get-SystemKey
        - New-ADDBRestoreFromMediaScript
        - New-ADKeyCredential
        - New-ADNgcKey
        - New-NTHashSet
        - Remove-ADDBObject
        - Save-DPAPIBlob
        - Set-ADAccountPasswordHash
        - Set-ADDBAccountPassword
        - Set-ADDBBootKey
        - Set-ADDBDomainController
        - Set-ADDBPrimaryGroup
        - Set-ADDBSysKey
        - Set-AzureADUserEx
        - Set-LsaPolicy
        - Set-SamAccountPasswordHash
        - Set-WinUserPasswordHash
        - Test-ADDBPasswordQuality
        - Test-ADPasswordQuality
        - Test-ADReplPasswordQuality
        - Test-PasswordQuality
        - Unlock-ADDBAccount
        - Write-ADNgcKey
        - Write-ADReplNgcKey
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: DSInternals cmdlet names can be hidden behind base64 -EncodedCommand payloads, backtick escaping, string
    concatenation, or variable substitution to evade name-based detection. If the alerting command line carries an
    encoded blob, decode it to confirm which cmdlet ran and what target, key, or hash material it handled.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this PowerShell session and is that parent chain expected?
  context: The parent process reveals how the cmdlet was invoked. Interactive administration from explorer.exe or
    a console is consistent with routine directory work; parents such as Office applications, mshta.exe, wscript.exe,
    or a remote-execution service point toward macro-driven or hands-on-keyboard intrusion. Walk up the tree to see
    what spawned the parent if the immediate parent is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host run DSInternals cmdlets before?
  context: A host that has never executed DSInternals cmdlets is more suspicious than one where directory auditing
    or recovery runs on a schedule. Zero or very low historical counts indicate first-time or rare execution of the
    module on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - Get-ADReplAccount
        - Get-ADReplBackupKey
        - Get-ADDBAccount
        - Get-ADDBBackupKey
        - Save-DPAPIBlob
        - Set-SamAccountPasswordHash
        - Set-ADDBAccountPassword
        - Add-ADDBSidHistory
        - Test-PasswordQuality
        - ConvertTo-NTHash
      condition: selection
    fields:
      - User
