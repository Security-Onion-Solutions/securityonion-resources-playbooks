name: Dism Remove Online Package
id: cdb5c4a5-fabf-48d9-b017-3806dee75fec
description: |
  Detects use of the Deployment Image Servicing and Management tool (DISM) to
  disable a Windows feature on the live operating system. The rule fires when
  EITHER dism.exe runs with both /Online and /Disable-Feature on its own command
  line, OR DismHost.exe (the worker process DISM spawns) runs while its parent
  command line contains both /Online and /Disable-Feature. DISM legitimately
  enumerates, installs, and removes Windows features and packages during imaging
  and administrative maintenance, so the behavior is routine on imaging servers
  and deployment hosts. It is also a known defense-evasion primitive: disabling
  the Windows Defender feature or removing on-disk recovery components weakens
  protection or recovery before follow-on activity. The investigation should
  determine which feature was disabled, whether it is a security or recovery
  feature, what spawned the DISM invocation, and whether the host or fleet shows
  the pattern as routine imaging or as a one-off operator action.
type: detection
detection_id: 43e32da2-fdd0-4156-90de-50dfd62636f9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did dism.exe run with /Online and /Disable-Feature on its own command
    line, or did DismHost.exe run under a parent command line carrying those flags?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires on EITHER of two branches - dism.exe whose own command line
    contains both /Online and /Disable-Feature, or DismHost.exe (the worker DISM
    spawns) whose parent command line contains both flags. Read the exact command
    line and parent command line and note which branch fired, because the operative
    /Disable-Feature command lives on the command line in the dism.exe branch and on
    the parent command line in the DismHost.exe branch. The feature name that follows
    /Disable-Feature determines whether this is benign servicing or defense evasion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentCommandLine
      - Image
      - CommandLine
- question: What spawned this DISM invocation, and is that parent chain expected for
    feature servicing on this host?
  context: The parent-child relationship is the core signal for this detection.
    Legitimate DISM feature changes are typically driven interactively by an
    administrator from a console shell, or by a deployment or patch-management process
    during imaging. Tracing the parent's own origin reveals whether the chain is
    routine maintenance or whether a script host, a logon batch script, or an
    unexpected process drove the disable. In the DismHost.exe branch the immediate
    parent is dism.exe and carries the operative command line, so the meaningful
    pivot is what spawned dism.exe itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to disable Windows features with DISM?
  context: Disabling Windows features with DISM is normal on imaging servers,
    deployment hosts, and during administrative maintenance by IT staff. Most
    endpoints and most user accounts never run it. Knowing whether the acting account
    and the host function involve image servicing is often the fastest path to
    separating routine maintenance from a deliberate weakening of host defenses.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which binary carried the /Disable-Feature command, and is that binary and
    its path expected to service Windows features?
  context: The disable command can appear on dism.exe directly or on the parent
    command line of DismHost.exe. Identify which executable ran the operation and
    where it lives. A signed dism.exe running from System32 driven by a known
    deployment workflow is a different finding than dism.exe invoked by a logon batch
    script or an unexpected parent that disables a security feature before doing other
    work. The image and command line together identify what was actually launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which Windows feature was disabled, and is it a security or recovery
    feature?
  context: DISM /Disable-Feature can target any optional Windows feature, but only
    some choices weaken host defenses. Read the feature name that follows
    /Disable-Feature in the command line. Disabling the Windows Defender feature
    removes endpoint protection; disabling Windows Recovery components or the recovery
    environment inhibits restore after impact; disabling an unrelated feature such as
    a legacy protocol or a print component is more likely routine servicing.
    Identifying the specific feature determines investigation priority and
    remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the disabled feature still disabled on the host, or has it been
    restored?
  context: A DISM /Disable-Feature operation persists until the feature is re-enabled.
    If a security feature such as Windows Defender was disabled, the host stays
    unprotected until it is restored. Check the current state of the targeted feature
    so the loss of protection or recovery capability is understood as still active or
    already remediated; if a security or recovery feature remains disabled it should
    be re-enabled before further investigation proceeds.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the feature was disabled?
  context: Disabling a security or recovery feature is often a preparatory step that
    lets follow-on activity run without being blocked, scanned, or recoverable.
    Examining what ran in the window immediately after the DISM invocation reveals
    what the disable was meant to enable - payload execution, service tampering, log
    clearing, or recovery removal. A burst of process creation right after the disable
    points to the activity the tampering was clearing a path for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering or recovery-inhibition actions performed on
    this host around the same time?
  context: An actor who disables a Windows feature to weaken defenses often pairs it
    with other evasion or recovery-removal steps - stopping security services,
    clearing event logs, deleting shadow copies, disabling the recovery environment,
    or weakening firewall rules. Finding several such actions from the same user or
    parent process within a short window indicates a coordinated effort to blind and
    de-fortify the host rather than an isolated servicing change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other child processes did the same parent spawn around the time of
    the DISM invocation?
  context: If the DISM invocation was driven by a malicious or scripted parent, that
    parent likely spawned other processes too. Examining siblings of the alerting
    process from the same parent instance reveals the full scope of activity from that
    execution chain - reconnaissance, service tampering, or payload staging launched
    alongside the feature disable point to orchestration rather than a single
    administrative command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_dismhost:
        Image|endswith: \DismHost.exe
        ParentCommandLine|contains|all:
        - /Online
        - /Disable-Feature
      selection_dism:
        Image|endswith: \Dism.exe
        CommandLine|contains|all:
        - /Online
        - /Disable-Feature
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_dismhost:
        Image|endswith: \DismHost.exe
        ParentCommandLine|contains|all:
        - /Online
        - /Disable-Feature
      selection_dism:
        Image|endswith: \Dism.exe
        CommandLine|contains|all:
        - /Online
        - /Disable-Feature
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    feature disable was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine and may indicate a coordinated rollout.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_dismhost:
        Image|endswith: \DismHost.exe
        ParentCommandLine|contains|all:
        - /Online
        - /Disable-Feature
      selection_dism:
        Image|endswith: \Dism.exe
        CommandLine|contains|all:
        - /Online
        - /Disable-Feature
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    DISM invocation reveals what led to it and what followed - the parent that staged
    it, reconnaissance, or follow-on execution the disabled feature was meant to allow.
    Novel parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    other defense tampering - may reveal the attack stages that preceded the feature
    disable and help reconstruct the full timeline. Weakening a defense is often one
    step in a sequence, so prior alerts give the context for why a feature was
    disabled here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run the DISM /Online /Disable-Feature pattern in the past
    week, and does the cross-host distribution look like consistent imaging automation
    or one-off activity?
  context: This query counts the DISM /Online /Disable-Feature pattern fleet-wide with
    no host scope. Many hosts running the same pattern points to a deployment or
    patch-management workflow that disables features by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity and decide whether this fits an imaging baseline or stands out
    as an isolated defense change.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
          - /Online
          - /Disable-Feature
      condition: selection
    fields:
      - host.name
