name: Potential Obfuscated Ordinal Call Via Rundll32
id: 64009764-2ec7-4a15-bcf2-aa3be9552cd8
description: |
  Detects rundll32 invoked with command-line tokens that call an exported function by ordinal
  using an obfuscated syntax (#+, #-, #0, or padded ordinal forms such as #655 / #656) instead of
  naming the export directly. Calling a DLL export by ordinal hides which function is being run and
  defeats string-based detection and casual review of the command line. Legitimate software almost
  always references DLL exports by name, so an ordinal call combined with obfuscation tokens is
  unusual; the investigation should decode which DLL and ordinal are being invoked, identify what
  that export does, and determine whether the parent, user, and host make this a deliberate evasion
  attempt or a rare but benign invocation.
type: detection
detection_id: 43fa5350-db63-4b8f-9a01-789a427074e1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the rundll32 command line carry an obfuscated ordinal call token, and which DLL and ordinal does it target?
  context: |
    Confirm the alert is a true positive by reading the full command line. The rule fires when
    the process is rundll32 (by Image, OriginalFileName, or a rundll32 token) AND the command line
    contains an ordinal-call token such as #+, #-, #0, #655, or #656. Verify the token is present and
    note which DLL path and which ordinal are being called, since that pair drives the rest of the
    investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run rundll32 with an ordinal-based export call?
  context: Legitimate administrative or vendor software occasionally calls DLL exports by ordinal, but
    it is rare on most endpoints. Knowing whether this user role and host function routinely run
    rundll32 in this way is often the fastest way to separate a true positive from an unusual but
    sanctioned operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly is this rundll32 invocation doing? Resolve the DLL and ordinal to the underlying export.
  context: |
    The command line names a DLL and an export by ordinal rather than by name. Map the ordinal
    back to the actual exported function (via the DLL's export table) to learn what operation is being
    invoked, and decode any additional arguments, paths, or encoded values passed after the ordinal.
    The obfuscation tokens (#+, #-, #0, padded ordinal forms) are syntactic tricks that resolve to the
    same export call, so normalize them before interpreting.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '#+'
          - '#-'
          - '#0'
          - '#655'
          - '#656'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Beyond the ordinal token, does the command line show additional obfuscation such as escape characters, encoding, or concatenation?
  context: Ordinal calls are one obfuscation layer; operators frequently stack more on top. Look for
    excessive escape or caret characters, base64 or hex blobs, character concatenation, environment
    variable substitution, and abnormally long or high-entropy argument strings. Multiple layers of
    obfuscation in a single command line raise the likelihood the invocation is deliberately hiding its
    purpose rather than a quirk of legitimate tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was rundll32 executed from its expected System32 or SysWOW64 path?
  context: rundll32 run from outside System32 or SysWOW64 may have been copied or renamed to evade
    path-based allowlists. A rundll32 image in a user temp directory, a profile folder, or another
    user-writable location is more suspicious than one in its standard system path. Compare the Image
    path against the OriginalFileName to spot a renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What process spawned this rundll32 and is that parent chain expected?
  context: The parent process reveals how rundll32 was launched. Predictable parents (explorer.exe for
    user actions, services.exe for service-hosted activity) fit routine usage. Parents such as
    mshta.exe, wscript.exe, winword.exe, or an unfamiliar binary in a user-writable path point toward
    script-driven or macro-driven execution and warrant tracing one level further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this rundll32 spawn afterward?
  context: The export invoked by ordinal may load or execute follow-on code. Child processes spawned by
    rundll32 reveal its actual impact -- a spawned cmd.exe, powershell.exe, or a network utility points
    toward post-exploitation, while no children is consistent with an in-memory-only operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What file writes, network connections, or follow-on commands occurred on this host within minutes of the ordinal call?
  context: An obfuscated export call is often the pivot between an initial foothold and the next stage.
    Examining what happened in the short window around the invocation -- a dropped file, an outbound
    connection, or a follow-up command -- shows whether the call advanced an operation or stood alone.
    A tight time correlation between the ordinal call and downstream artifacts strengthens the case for
    deliberate evasion.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired this ordinal-call pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how this specific firing pattern
    has historically run here -- not generic rundll32 usage. A new parent process, an unexpected user
    account, or an unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains:
        - '#+'
        - '#-'
        - '#0'
        - '#655'
        - '#656'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the rundll32 ordinal-call pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more suspicious than one used regularly under
    stable parents. The query mirrors the rule's selection structure scoped to this host, so the count
    reflects this specific firing pattern rather than all rundll32 usage. The command-line projection
    lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains:
        - '#+'
        - '#-'
        - '#0'
        - '#655'
        - '#656'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains:
        - '#+'
        - '#-'
        - '#0'
        - '#655'
        - '#656'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains:
        - '#+'
        - '#-'
        - '#0'
        - '#655'
        - '#656'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on other hosts, the scope of the
    investigation may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli:
        CommandLine|contains:
        - '#+'
        - '#-'
        - '#0'
        - '#655'
        - '#656'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often use several. If rundll32 was used to run
    code by ordinal, check whether regsvr32, mshta, msbuild, installutil, or similar proxy-execution
    binaries were also used nearby. Finding multiple LOLBins driving the same objective strengthens the
    case for deliberate evasion.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access -- may reveal the stages that preceded this event and help
    reconstruct the timeline that led to an obfuscated execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
