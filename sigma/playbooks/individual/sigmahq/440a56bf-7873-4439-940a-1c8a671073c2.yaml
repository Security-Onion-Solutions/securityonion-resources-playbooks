- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account across all hosts in the surrounding hour surfaces movement and staging that the
    host-local view misses — the same account running utilities on several endpoints in sequence. If the alert fired
    under SYSTEM or another service principal, this view returns agent telemetry from every host and answers nothing;
    in that case rely on the parent-scoped fleet view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
