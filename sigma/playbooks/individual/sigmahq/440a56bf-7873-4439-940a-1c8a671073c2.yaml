name: GALLIUM IOCs
id: 3b7ba881-8f56-455c-8aa0-16dea17a20a7
description: |
  Detects a process execution whose recorded file hash matches one of 19 SHA-256 or 19 SHA-1 values on a fixed indicator list. There is no command-line, path, or parent condition — the rule is a literal comparison against those 38 hashes, so it fires only on those exact files and will not match a recompiled or repacked build of the same tooling. The listed files span remote-access implants, credential dumpers, connection-relay proxies, network scanners, remote-execution utilities, and archivers, which are the tool classes typically staged after initial access is obtained through an internet-facing service. The investigation should establish what launched the file and under which account, which capability was exercised, whether credential material or outbound remote-access sessions followed, and whether the same hashes appear on other hosts.
type: detection
detection_id: 440a56bf-7873-4439-940a-1c8a671073c2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the file hash recorded on this process event match one of the SHA-256 or SHA-1 values this rule
    lists?
  context: Confirm the alert before investing time. This rule is a literal comparison against a fixed list of 19
    SHA-256 and 19 SHA-1 values; there is no command-line, path, or parent condition, so the recorded hash is the
    entire detection. Read the hash field on the triggering event and note which listed value it matched. If the
    field is empty or truncated, re-derive the hash from the file on disk before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Hashes
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run this binary?
  context: 'Legitimate administrative activity triggers many detections, but this rule matches specific file hashes
    rather than a behavior, so there is no routine-usage class to fall back on. The judgment is narrower: does this
    account and host have any documented reason to hold or execute software of outside origin, such as a security-testing
    role, a lab or sample-handling host, or an analysis workflow?'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this tool execution part of an authorized penetration test or red team engagement?
  context: Offensive tooling of the kind this rule lists — credential dumpers, relay proxies, remote-execution utilities
    — is also used in authorized security assessments and in analysis work. Check whether an assessment is active
    on this host or network segment and whether its scope, timing, and toolset account for this execution. An engagement
    that matches resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which tool does this hash correspond to, and what capability does it provide?
  context: This rule identifies files by hash rather than by argument, so what matters here is what the file is,
    not which flag was passed. The indicator list spans several capability classes — remote-access implants, credential
    dumpers, connection-relay proxies, network and share scanners, remote-execution utilities, and archivers — and
    the class determines the scope of the response. The command line may still name an output file, a target host,
    or an archive password worth recording.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did this process write files to disk after execution?
  context: 'Tooling in these classes leaves characteristic output: credential dumpers write memory dumps and ticket
    files, scanners write host and share lists, archivers write staged archives. The files this process created
    name the capability that was actually exercised and usually outlive the process. An archive written to a temporary
    or public directory is a staging step; a dump file points at credential material.'
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Was credential material targeted, and which store?
  context: 'Several of the listed hashes correspond to credential dumpers, and they differ by target: LSASS memory,
    the SAM database, NTDS.dit, cached domain credentials, or LSA secrets. The command line usually names the target
    or the output path — a saved hive, a dump file, a log file. The store that was reached determines which accounts
    to treat as exposed and what has to be rotated. Read-side access to process memory has no telemetry in most
    endpoint configurations, so the command line and the files written are the available evidence.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of credential theft depends on the privilege of the accounts exposed. Start with the account
    this process ran as and any accounts holding sessions on this host, then check their group membership in the
    directory. Domain Admin or Enterprise Admin membership makes this a domain-wide exposure; service accounts with
    broad rights are frequent targets and are slower to rotate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Which accounts authenticated to this host around this event, and did any receive privileged rights?
  context: 'Exploitation of credential validation surfaces as anomalous authentication rather than as process activity:
    forged or replayed tickets, a logon for an account with no business on this host, or special privileges assigned
    to an account that does not normally hold them. Event 4624 records the logon and its type, 4648 records explicit-credential
    use, and 4672 records privileged rights assignment. Weigh high-value accounts first — Domain Admins, Enterprise
    Admins, krbtgt, and service accounts with broad rights — and treat duplicate authentications for the same account
    within a few minutes as a possible replay rather than normal re-authentication. If Security-channel audit logging
    is not collected from this host, treat zero results as a visibility gap rather than evidence nothing authenticated.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
          - 4672
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
      - LogonType
      - IpAddress
  answer_sources:
  - active_directory
  - manual_review
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: 'Credential theft is typically followed by movement, and the tooling reuses application-layer protocols
    the environment already permits. The query returns outbound connections from this host to 3389 (RDP), 445 (SMB),
    5985/5986 (WinRM), and 22 (SSH) in the hours after the event; the originating Image and User show what drove
    each one. Look beyond these ports for the command-and-control side of the same tooling — HTTP, HTTPS/TLS, and
    DNS carrying an asymmetric volume profile (well over 90% of bytes outbound) from a process with no routine reason
    to reach the network. Two limits: credentials replayed from another machine will not appear here, so check 4624
    logons on suspected targets for the exposed accounts; and if endpoint network telemetry is not collected from
    this host, treat zero rows as a visibility gap rather than evidence no movement occurred.'
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: What process launched this binary, and is that launcher expected?
  context: The parent shows how the file was invoked. A shell, a script host, a service control path, or a remote-execution
    service each imply a different delivery route; a web server or application-server process as the parent points
    at server-side exploitation and a web shell rather than a local user action. If the immediate parent is itself
    a generic host process, walk one level further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: A file matched by a static indicator rarely runs alone. Aggregating process activity in the surrounding
    window collapses repetitive service and agent telemetry into high-count rows while novel parent-child pairs
    stand out at low counts — reconnaissance, archiving, remote-execution utilities, or a second payload launched
    by the same parent. Read the low-count rows first.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host reconstruct how the file arrived — server-side exploitation and web
    shell activity, a script-host download, or defense tampering ahead of execution. The order of the alerts is
    the timeline; a preceding exploitation or web shell alert points the investigation at an internet-facing service
    rather than at the user.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this host previously executed a binary with one of these hashes, and under what parent and user?
  context: 'The query applies the rule''s hash list scoped to this host over the past two weeks. Because the indicators
    are static values rather than a behavior, a prior hit is a finding rather than a baseline: it moves the start
    of the incident earlier and shows the activity is not a one-off. The parent and user columns show what drove
    each earlier execution; an empty result means the alerting event is this host''s first observed execution.'
