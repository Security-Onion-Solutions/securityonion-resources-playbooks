name: File Download Using Notepad++ GUP Utility
id: 57daad89-6a57-4722-9070-aaac13d1b983
description: |
  Detects the Notepad++ updater binary (GUP.exe / OriginalFileName gup.exe) running with a command line that
  contains both ' -unzipTo ' and an http URL, when the parent process is something other than notepad++.exe.
  GUP is a generic updater that can fetch and unpack an archive from an arbitrary URL, so an unrelated parent
  driving it turns a trusted, signed binary into a file-download proxy that retrieves attacker-supplied tooling.
  Investigate what parent invoked it, what URL and destination path were used, whether the download actually
  landed on disk, and what ran next.
type: detection
detection_id: 44143844-0631-49ab-97a0-96387d6b2d7c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match the rule's pattern — GUP.exe (or OriginalFileName gup.exe) with both ' -unzipTo ' and an http URL, launched by a parent other than notepad++.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line, the resolved Image / OriginalFileName, and the parent process against the rule's criteria. All of the binary, the unzip-and-fetch flags, and the non-Notepad++ parent must hold for the rule to fire.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to fetch and unpack archives from external URLs using an updater binary?
  context: Legitimate administrative or developer activity can drive an updater this way. Knowing whether the user role and host function are consistent with downloading and unpacking remote archives is often the fastest path to distinguishing a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did GUP actually fetch and unpack? Decode the full command line — the http URL and the ' -unzipTo ' destination path.
  context: The full command line reveals the specific download. Identify the source URL, the destination directory passed to ' -unzipTo ', and whether the path is a user-writable or staging location. The destination path here is the same one that feeds the file-on-disk and directory-activity questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned GUP, and what is that parent's own origin and command line?
  context: The rule fires precisely because the parent is not notepad++.exe, so the spawning process is the central anomaly. A legitimate update is launched by notepad++.exe; an unrelated parent such as a script host, Office application, or a shell points to GUP being repurposed as a download proxy. Walk up to the parent's own parent and command line to see how the chain was set up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What outbound network connections did GUP make, and were the destinations external rather than internal infrastructure?
  context: Ingress tool transfer is a process reaching out to an external destination and pulling down a file. Pivoting from the updater process to its outbound connections confirms where the archive was retrieved from and whether the destination is an external address versus an internal update mirror. External, previously unseen, or non-reputable destinations raise the severity; an internal patch server lowers it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Is the unpacked file still on disk at the ' -unzipTo ' destination for analysis?
  context: GUP unpacks the fetched archive to the path given to ' -unzipTo '. Checking whether those files still exist on disk enables deeper analysis such as hash lookups, sandbox submission, or content review. Uncommon drop directories like user-profile or public staging paths are more notable than a standard application directory.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination.
  context: A download command does not guarantee the file was actually retrieved. Network errors, blocked URLs, or security controls may have prevented the transfer. Confirming file creation at the ' -unzipTo ' target path establishes whether the activity progressed past the delivery stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file GUP downloaded was executed, what is its hash and does it have known threat-intel detections?
  context: The hash for a reputation lookup is recorded when the payload runs, not when GUP writes it to disk — file-creation events carry no hash. GUP (the Notepad++ updater) fetches the file; the payload is usually run by the same shell as a sibling or child process, so this query returns those processes with their executable hashes — match the downloaded file name and submit its hash. If it was run later by an unrelated process, retrieve it from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What other file activity occurred in the target directory?
  context: An updater driven by an unrelated parent often pulls down more than one file, or the unpacked archive triggers further writes through extraction or follow-on downloads. Examining directory-level file activity reveals the broader scope of the delivery, and uncommon staging directories are themselves a signal worth noting.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Does this host normally run GUP.exe?
  context: GUP is normally launched only by Notepad++ to update itself, so the binary may have a low but non-zero footprint on a host. Zero or very low historical counts indicate first-time or rare execution and make the current invocation more notable.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern has historically run here, not generic GUP usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \GUP.exe
      - OriginalFileName: gup.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -unzipTo '
        - http
      filter:
        ParentImage|endswith: \notepad++.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection* and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did GUP spawn afterward?
  context: The processes spawned by an updater reveal its actual impact. A normal update is self-contained; a download proxy that immediately spawns cmd.exe, powershell.exe, or the freshly unpacked binary indicates the downloaded tooling was executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \GUP.exe
      - OriginalFileName: gup.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -unzipTo '
        - http
      filter:
        ParentImage|endswith: \notepad++.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \GUP.exe
      - OriginalFileName: gup.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -unzipTo '
        - http
      filter:
        ParentImage|endswith: \notepad++.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove similar download activity on other hosts, the scope of the operation may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \GUP.exe
      - OriginalFileName: gup.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -unzipTo '
        - http
      filter:
        ParentImage|endswith: \notepad++.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not filter) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the rule's firing pattern rather than generic GUP usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \GUP.exe
      - OriginalFileName: gup.exe
      selection_cli:
        CommandLine|contains|all:
        - ' -unzipTo '
        - http
      filter:
        ParentImage|endswith: \notepad++.exe
      condition: all of selection* and not filter
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, staging, or follow-on execution near the download.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
