name: New File Association Using Exefile
id: 76d5d522-7cbd-4f41-bca4-33b88b26c628
description: |
  Detects a Windows file-class association being created or modified so that its default handler is set to exefile: a registry value under HK.\...\Software\Classes\.<ext> is written with the data exefile. Remapping a file class to the exefile handler makes every file of that extension execute as a program when it is opened, which lets an operator run a payload under a non-.exe extension and evade extension-based blocking or allow-listing. Legitimate installers occasionally register class handlers, so the investigation should confirm which extension was remapped, what process wrote the value, whether a file of that class subsequently executed, and whether the association persists or was reverted.
type: detection
detection_id: 44a22d59-b175-4f13-8c16-cbaef5b581ff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key path contain a file-class association and is its value data set to exefile?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the modified key path
    contains Classes\. (a per-user or per-machine file-class registration for an extension) AND the value data written is
    exefile. Review the exact key path (TargetObject) to see which extension was remapped and the value data (Details) to
    confirm it reads exefile.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change a file type's default program association?
  context: Legitimate installers and administrators occasionally register class handlers, but a routine user changing a file
    extension to run as a program is uncommon. Knowing whether the user role and host function are consistent with editing
    file-association keys is often the fastest way to separate a software install from a hands-on evasion attempt. When the
    writing user is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which file extension was remapped and to what handler, and what does that make files of that type do?
  context: The key path names the extension being registered (the segment after Classes\.), and the value data names the handler
    it now points to. When that handler is exefile, opening any file with that extension launches the file itself as a program
    rather than passing it to an application. Read the exact extension from TargetObject and confirm the Details value so you
    know which file type on this host now executes as code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this file-association key a known persistence or evasion location, and what does the value change enable?
  context: File-class keys under Software\Classes control how the shell opens each file type. Pointing an arbitrary extension
    at exefile is an execution and evasion primitive -- it lets a payload ship under a benign-looking extension that is not
    subject to .exe-based blocking, and the association persists across reboots for anyone who opens such a file. Judge whether
    this key and value represent a legitimate application registration or a handler substitution that enables code execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Does the exefile association still stand, or was it re-modified or reverted after it was set?
  context: A durable handler substitution is more concerning than a value that is immediately corrected. Registry key and value
    deletions are not observable in endpoint telemetry, so cleanup cannot be confirmed by looking for a delete event; instead
    judge persistence from the key's re-modification history over a longer window and from whether the configured payload
    executed. Repeated writes to the same association, or a later write pointing it back to its normal handler, both change
    the picture.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this association change and what launched that process?
  context: The registry event carries the writing process. Legitimate class registrations come from installer or setup processes
    under predictable parents; a shell, script host, or an unsigned binary writing a file-class association points to hands-on
    activity or a malicious installer. Retrieve the writing process record to see its command line and its own parent, which
    shows how the change was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: An operator who remaps a file association often makes several registry changes together -- staging additional
    handler substitutions, adding a Run key for persistence, or weakening a security setting. All registry modifications on
    this host in the surrounding window, grouped by key path and writing process, reveal whether this association change was
    an isolated edit or part of a cluster of configuration changes from the same process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other file-class associations on this host also remapped to the exefile handler?
  context: Making one benign extension run as a program is often done for several extensions at once so that multiple payload
    file types execute directly. Counting how many Classes\. keys on this host were set to exefile, and which processes wrote
    them, shows whether this is a single edit or a batch handler substitution and identifies every extension that now executes
    as code.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: 'Classes\.'
        Details: exefile
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Did a file of the remapped type execute as a program after the association was changed?
  context: The purpose of pointing an extension at exefile is that opening a file of that type runs it directly, so the file's
    own path appears as the executing image in process telemetry rather than a normal application handling it. Look for process
    executions on this host after the change whose image is a data-looking file (an extension other than .exe) or that launched
    from a user-writable staging location, which confirms the payload ran. The query keeps only executions whose
    image path does not end in .exe — the signature of a data-extension file running through the exefile handler.
    Match hits against the exact extension read from the modified class key; a zero means no remapped file was
    opened as a program in the window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_exe:
        Image|endswith: '.exe'
      condition: selection and not filter_exe
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the association change reveals what led to it
    and what followed -- payload staging, download tools, or a shell that made the edit. Novel parent-child pairs stand out
    against the repetitive agent and service telemetry that dominates a busy host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this file-association key been modified before on this host?
  context: First-time changes to a file-class handler are more suspicious than a key that changes routinely. A class registration
    that has never been touched on this host, then is suddenly pointed at exefile, indicates a new and deliberate change rather
    than normal software behavior. Compare the historical value data to see whether this handler value is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally see the writing process editing file-association keys?
  context: A process that rarely or never touches Software\Classes on this host, then writes an exefile handler, is a stronger
    signal than a setup process that registers class handlers as part of routine installs. Low historical counts for this
    writing binary point to first-time or anomalous use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was this same file-association key remapped on other hosts in the environment?
  context: The same change on many hosts may reflect a software deployment or policy push, while a change on only this host
    suggests targeted activity. Comparing the value data set across hosts distinguishes a fleet-wide legitimate registration
    from an isolated handler substitution.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- payload delivery, reconnaissance, or defense tampering -- may reveal the
    stages that preceded the association change and help reconstruct the timeline. Handler substitution is typically a setup
    step, so activity just before it often shows how the payload arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
