name: CVE-2024-1708 - ScreenConnect Path Traversal Exploitation
id: ac76c6ff-f926-4d80-9de8-9fd2871870f4
description: |
  Detects the ScreenConnect service process (ScreenConnect.Service.exe) writing an .aspx or .ashx file
  directly into the root of the App_Extensions directory. ScreenConnect never places extension files at
  that root - legitimate extensions live in their own per-extension subdirectory - so a file written there
  by the service is anomalous and matches the exploitation pattern of CVE-2024-1708, a ZipSlip-style path
  traversal (commonly chained with the CVE-2024-1709 authentication bypass) that lets an attacker drop a
  web shell for remote code execution. The rule fires when the service writes an .aspx/.ashx to the
  App_Extensions root AND the file is not inside a legitimate extension subdirectory. Investigation should
  recover and analyze the dropped file, determine what the ScreenConnect service spawned afterward, and
  confirm the server's patch level and exposure.
type: detection
detection_id: 44d7af7e-88e6-4490-be11-55f7ff4d9fc1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the file path and writing process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when ScreenConnect.Service.exe writes an .ashx or .aspx file to the root of the ScreenConnect
    App_Extensions directory and that file is not inside a per-extension subdirectory. Review the exact
    TargetFilename and the writing Image against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this a sanctioned ScreenConnect server, and is writing extension files to App_Extensions
    expected here?
  context: Legitimate extension installation writes files under App_Extensions, but only into a
    per-extension subdirectory, never the root. Knowing whether this host is a managed ScreenConnect
    server and whether an administrator was installing or updating an extension is often the fastest way
    to separate a routine deployment from exploitation. The writing account is typically the service
    account - judge by the host role and any concurrent admin action.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this ScreenConnect instance a sanctioned, inventoried deployment running a patched version?
  context: CVE-2024-1708 and the chained CVE-2024-1709 authentication bypass affect ScreenConnect 23.9.7
    and earlier; version 23.9.8 and later remediate them. An internet-exposed or unpatched instance - or a
    forgotten/unauthorized install - is the exploitation target. Confirm the deployment is known to IT and
    check its version against the fixed baseline.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a maintenance window, deployment, or support activity that would explain a new
    extension being added?
  context: Legitimate extension changes correlate with a documented admin action, a maintenance window, or
    a vendor deployment. If no such context exists for a file appearing at the App_Extensions root, the
    write is more consistent with exploitation than with routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is in the dropped .ashx/.aspx file - is it a web shell?
  context: Read and analyze the file's actual content. Web shells written through this path traversal
    contain server-side script (C#/VB in an .aspx/.ashx handler) that executes attacker-supplied commands.
    Look for command-execution patterns, process-spawning calls, base64 or otherwise encoded payloads, and
    embedded URLs or IP addresses. Content retrieval is manual from the endpoint or a forensic copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If a payload executed from this drop, what is its hash and does it have known detections?
  context: An .aspx/.ashx web shell is interpreted by the web server rather than run as a standalone
    process, so it carries no process hash - retrieve the file from its on-disk path for manual hashing and
    scanning. This query catches any secondary executable dropped and later run under the same name;
    submit any recovered hash to threat intelligence to determine whether it is known malicious.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What child processes did the ScreenConnect service process spawn on this host after the file
    was written?
  context: This is the remote code execution step. When the dropped .ashx/.aspx is requested, the
    ScreenConnect web worker executes it and commonly spawns command interpreters and reconnaissance
    binaries - cmd.exe, powershell.exe, whoami.exe, net.exe. Children of the service process shortly after
    the drop are the actual code execution and reveal the attacker's hands-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: Exploitation often drops more than one artifact - multiple web shells, a staged payload, or
    tooling written alongside the initial handler. The breadth and paths of the ScreenConnect service
    process's other file activity distinguish a single drop from a broader foothold and enumerate what else
    needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the ScreenConnect App_Extensions directory recently, and by
    which processes?
  context: The App_Extensions root normally receives files only inside per-extension subdirectories.
    Other recent arrivals directly in this directory tree reveal whether this is an isolated drop or a
    location under active use, and surface additional handlers or payloads that belong to the same
    activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ScreenConnect\App_Extensions\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the dropped .ashx/.aspx still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A handler still on disk can
    be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic
    cleanup and shifts the investigation to what executed in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What external endpoints is the ScreenConnect service connecting to around the alert?
  context: A ScreenConnect server maintains many legitimate client and relay connections, so volume alone
    is not suspicious. Look for anomalous destinations that could be the attacker's source, a second-stage
    download, or a secondary remote-access/C2 endpoint beaconing after the web shell ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Has this host previously produced this drop pattern, and what programs and users normally drive
    it?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program/user
    distribution reflects how this specific drop pattern has fired here before, not generic ScreenConnect
    activity. A first-time occurrence, or a new writing program or user account for this pattern, is the
    anomaly worth chasing; file events carry no parent lineage, so pivot to the acting program's
    process-start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \ScreenConnect.Service.exe
        TargetFilename|endswith:
        - ScreenConnect\\App_Extensions\\*.ashx
        - ScreenConnect\\App_Extensions\\*.aspx
      filter_main_legit_extension:
        TargetFilename|contains: ScreenConnect\App_Extensions\\*\\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- always_include: true
  question: Has this user account previously produced this drop pattern, and does that history fit its
    role?
  context: The query mirrors the rule's selection scoped to this user, giving the 90-day history of this
    specific drop pattern for the account, aggregated by host. This write is normally driven by the
    ScreenConnect service account rather than an interactive user, so weigh a zero or low count against the
    account's expected function; a service account that has never produced this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \ScreenConnect.Service.exe
        TargetFilename|endswith:
        - ScreenConnect\\App_Extensions\\*.ashx
        - ScreenConnect\\App_Extensions\\*.aspx
      filter_main_legit_extension:
        TargetFilename|contains: ScreenConnect\App_Extensions\\*\\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this drop pattern on this host or across the
    environment, or is the program new for this activity?
  context: When the write is attributed to a service account, the meaningful pivot is the launch
    mechanism rather than the user. The query mirrors the rule's selection scoped to the alerting program, giving the 90-day history of that program driving this specific pattern. A new or rare program
    for this pattern is the deviation; a program already accounting for many prior events is established
    service behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \ScreenConnect.Service.exe
        TargetFilename|endswith:
        - ScreenConnect\\App_Extensions\\*.ashx
        - ScreenConnect\\App_Extensions\\*.aspx
      filter_main_legit_extension:
        TargetFilename|contains: ScreenConnect\App_Extensions\\*\\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether the same identity produced
    related activity elsewhere. When the alert fires under a service or machine account, this view returns
    broad agent telemetry rather than operator activity - in that case the parent-driven rollout view is
    the meaningful pivot and this one is used only to confirm the account context.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window - a
    coordinated rollout, or activity isolated to this host?
  context: The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in
    the alert window. Multiple hosts producing the same drop in the same window points to scripted or
    pushed activity across many ScreenConnect servers; a single host points to a host-local trigger such
    as targeted exploitation of one exposed instance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \ScreenConnect.Service.exe
        TargetFilename|endswith:
        - ScreenConnect\\App_Extensions\\*.ashx
        - ScreenConnect\\App_Extensions\\*.aspx
      filter_main_legit_extension:
        TargetFilename|contains: ScreenConnect\App_Extensions\\*\\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts produced this drop pattern in the past week, and does the distribution look
    like automation or targeted activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count
    of this specific drop pattern. Many ScreenConnect servers showing the same pattern suggests a broad
    exploitation wave against exposed instances; one host or a small set points to targeted activity. Use
    the host distribution to calibrate scope and urgency.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \ScreenConnect.Service.exe
        TargetFilename|endswith:
        - ScreenConnect\\App_Extensions\\*.ashx
        - ScreenConnect\\App_Extensions\\*.aspx
      filter_main_legit_extension:
        TargetFilename|contains: ScreenConnect\App_Extensions\\*\\
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: The path-traversal drop is usually preceded by the exploitation that enabled it - an
    authentication-bypass attempt, anomalous web requests, or setup-wizard access. Earlier detections on
    the same host help reconstruct how the attacker reached the point of writing an extension handler and
    confirm the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
