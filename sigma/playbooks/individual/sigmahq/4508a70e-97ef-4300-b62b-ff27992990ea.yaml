name: DotNet CLR DLL Loaded By Scripting Applications
id: 309b8f40-1ff4-4d11-a7ff-937e463baa04
description: |
  Detects a Windows scripting host (cscript.exe, wscript.exe, mshta.exe, msxsl.exe, regsvr32.exe, wmic.exe, or cmstp.exe) loading a .NET Common Language Runtime module (clr.dll, mscoree.dll, or mscorlib.dll). These interpreters do not normally execute managed code, so a CLR load inside one is the signature of a script bootstrapping a .NET assembly in memory — a common fileless-execution and process-injection cradle where the assembly is run from memory rather than written to disk. Legitimate managed COM components can occasionally initialize the runtime inside a script host, so the investigation should identify which script and command line drove the load, what additional modules and child processes followed, and whether the activity fits the host's baseline.
type: detection
detection_id: 4508a70e-97ef-4300-b62b-ff27992990ea
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the scripting host that loaded it against the rule's criteria — a CLR module (clr.dll, mscoree.dll, mscorlib.dll) loaded by cscript.exe, wscript.exe, mshta.exe, msxsl.exe, regsvr32.exe, wmic.exe, or cmstp.exe. The library event carries the module's hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run script hosts that load the .NET runtime?
  context: Legitimate administrative scripting and managed COM components can initialize the CLR inside a script host. Knowing whether this user's role and the host's function normally involve script-driven managed code is often the fastest way to separate a routine automation from an in-memory .NET cradle.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command line and script did the scripting host that loaded the CLR run?
  context: The CLR load event carries no command line, so pivot to the loading process by ProcessGuid to recover the exact invocation. Decode the script path, arguments, and any encoded or inline content — a .js, .vbs, .hta, .xsl, or scriptlet argument identifies what managed payload the host was directed to bootstrap. A script that repoints TMP to its own directory or reads binary data into an ADODB.Stream is a strong side-load signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
- question: What modules did this scripting host load, and are any beyond the CLR unsigned or from user-writable paths?
  context: The CLR modules themselves are Microsoft-signed and expected; the anomaly is the managed assembly or COM DLL the script pulled in alongside them. Look for modules loaded from %TEMP%, AppData, ProgramData, or Public, unsigned or invalid-signature DLLs sitting where signed ones belong, and any module whose name mimics a system DLL. The hash and signing status on each load event feed a reputation pivot; an in-memory-only assembly may leave no file-backed module here, which itself points to a memory-resident cradle.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Is the loaded module or any dropped script or DLL still on disk for analysis?
  context: Script-hosted .NET cradles frequently write a managed DLL or a script into the script's own directory before loading it. Checking whether those artifacts still exist on disk enables hash lookups, reputation checks, and content review. File writes are correlated to the loading process and its direct children by process lineage rather than by file-path placeholders.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this scripting host and is that parent chain expected?
  context: The parent reveals how the script host was invoked. A script host launched by explorer.exe from a user double-click differs from one spawned by an Office application, an email client, a browser, or another script host — those parents point to macro, phishing, or chained-execution delivery of the .NET cradle.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did this scripting host spawn afterward?
  context: A .NET assembly hosted inside a script host commonly acts by spawning a follow-on process — a new sacrificial process to inject into, or a cmd.exe, powershell.exe, or rundll32.exe stage for post-exploitation. Unexpected children of a script host, especially long-lived system processes launched with no clear purpose, mark where the in-memory payload took effect.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the minutes around the CLR load reveals what led to the script execution and what followed — reconnaissance, credential access, or lateral movement staged through the same script host. The time window between the load and surrounding events helps establish whether this is a single automated task or one step of a hands-on-keyboard operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this CLR module been loaded on this host before, and under what processes?
  context: A first-time load of the runtime by a script host is a stronger anomaly than a recurring one. If the same CLR module has historically been loaded only by managed PE applications and services on this host, a script host loading it now is novel. If script hosts on this host routinely initialize the runtime through an approved automation, the current load is likely routine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — phishing-delivered execution, reconnaissance, or defense tampering — may reveal the stages that preceded the script-hosted .NET load and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of script hosts loading the CLR (not generic use of these interpreters). Many hosts firing the same pattern points to a scripted deployment or vendor automation that legitimately hosts managed code; one host or a small unrelated set points to targeted operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmstp.exe
        - \cscript.exe
        - \mshta.exe
        - \msxsl.exe
        - \regsvr32.exe
        - \wmic.exe
        - \wscript.exe
        ImageLoaded|endswith:
        - \clr.dll
        - \mscoree.dll
        - \mscorlib.dll
      condition: selection
    fields:
    - host.name
- question: How often has this host fired the rule's pattern over the past 90 days, and what command-line structures are typical?
  context: A script host loading the CLR with no prior history on this host is more suspicious than one seen daily under stable command-line patterns. The query mirrors the rule's selection scoped to this host, so the count reflects this specific firing pattern rather than generic script-host usage. The command-line projection lets the analyst compare typical script invocations against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith:
        - \cmstp.exe
        - \cscript.exe
        - \mshta.exe
        - \msxsl.exe
        - \regsvr32.exe
        - \wmic.exe
        - \wscript.exe
        ImageLoaded|endswith:
        - \clr.dll
        - \mscoree.dll
        - \mscorlib.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Was this scripting host executed from an expected path?
  context: The script hosts in this rule normally live in System32 or SysWOW64. One running from a user temp directory, AppData, or another user-writable path may have been copied or renamed to evade path-based allowlists, and is more suspicious than one in its canonical location. OriginalFileName reveals the true identity of a renamed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who proxy execution through one signed interpreter often use several. If a script host bootstrapped a .NET assembly, check whether rundll32, msbuild, installutil, msiexec, or other execution-proxy binaries were also run in the same window — multiple proxy-execution LOLBins performing the same objective strengthen the case for deliberate abuse.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host after the code executed?
  context: In-memory code execution often precedes persistence. After running a .NET payload, an operator commonly installs a backup foothold using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence-tool executions in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures these drops even when the operator avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
