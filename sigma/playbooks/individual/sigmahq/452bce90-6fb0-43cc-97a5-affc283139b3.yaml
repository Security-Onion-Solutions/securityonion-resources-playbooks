name: Suspicious Windows Defender Registry Key Tampering Via Reg.EXE
id: 9e3b3fa3-7697-4db6-b6cd-8983aee6aa59
description: |
  Detects reg.exe being used to write Windows Defender policy registry values that
  weaken protection or detection. The rule fires when a reg.exe (or a binary whose
  OriginalFileName is reg.exe) command line references a Windows Defender registry
  path AND performs a write that either sets a protection feature to 0 (turning a
  feature off, for example PUAProtection or TamperProtection) OR sets a disable flag
  to 1 (for example DisableRealtimeMonitoring or DisableBehaviorMonitoring). Either
  branch achieves the same effect: disabling antivirus, real-time scanning, cloud
  submission, behavior monitoring, or related controls through policy keys. A narrow
  set of administrators legitimately touch these keys when testing software, so the
  investigation should confirm which value was written and to what, identify the
  parent that drove reg.exe, determine whether the control is still disabled, and
  establish whether the write was an isolated change or one step in a broader
  tampering and execution sequence.
type: detection
detection_id: 452bce90-6fb0-43cc-97a5-affc283139b3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did reg.exe write a Windows Defender registry value that either set a
    protection feature to 0 or set a disable flag to 1, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when reg.exe (or a binary with OriginalFileName reg.exe) targets a
    Windows Defender registry path and performs an add that EITHER assigns 0 to a
    protection feature such as PUAProtection, TamperProtection, or SpynetReporting, OR
    assigns 1 to a disable flag such as DisableRealtimeMonitoring, DisableAntiSpyware,
    or DisableBehaviorMonitoring. Read the exact command line and note which branch
    fired and which specific value name and data were written, because the value name
    determines which control was weakened and drives the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify Windows Defender protection
    settings through the registry?
  context: A small set of administrators legitimately adjusts Defender policy values
    when testing software or troubleshooting, but most users and most endpoints never
    write these keys. Knowing whether the acting account and the host function involve
    security configuration or software testing is often the fastest path to separating
    an authorized change from deliberate protection tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Windows Defender control was targeted, and does the written value
    disable it?
  context: Different Defender values have different impacts. DisableRealtimeMonitoring=1
    or DisableAntiSpyware=1 turns off live scanning; DisableBehaviorMonitoring=1 and
    DisableScriptScanning=1 remove behavioral and script inspection; PUAProtection=0,
    SpynetReporting=0, or SubmitSamplesConsent=0 weaken cloud-backed detection;
    TamperProtection=0 removes the guard that blocks further changes. Read the full
    command line to confirm the exact value name and data written, since this
    determines which protection the host is now missing and how urgent restoration is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key path and value data were actually written, as recorded
    in the registry modification event?
  context: reg.exe carries the target in its command line, but the corresponding
    registry modification event records the key path and written data as structured
    fields, which is more reliable than parsing quoting and spacing from the command
    line. A path under HKLM\SOFTWARE\Policies\Microsoft\Windows Defender or the Windows
    Defender Security Center key confirms a policy-level disable that persists until
    the value is removed. If registry modification events are not collected in this
    environment, fall back to reading the value name and data from the reg.exe command
    line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was reg.exe executed from its expected system path, or from an unexpected
    location?
  context: reg.exe normally runs from System32 or SysWOW64. A reg.exe running from a
    user-writable or temporary directory, or a differently named binary whose
    OriginalFileName is reg.exe, suggests the tool was copied or renamed to evade
    path-based allowlisting. Compare the Image path against OriginalFileName to confirm
    whether the executed binary is the genuine system reg.exe and where it lives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What process spawned reg.exe, and is that parent chain expected for a
    Defender registry change?
  context: The parent process reveals how the Defender registry write was invoked. An
    interactive administrator change usually shows a console shell or a management
    console as the parent. An unexpected parent such as a script host, mshta.exe, an
    Office application, or an unknown executable points to automated or scripted
    tampering rather than a deliberate administrative action, since batch and script
    based disable tools chain cmd.exe or powershell.exe into repeated reg.exe writes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the targeted Windows Defender control currently restored, or is the
    host still running with it disabled?
  context: A policy registry write persists until the value is removed or overwritten,
    so the control may still be off well after the alert. Check the current Defender
    status through host inspection or the endpoint console to determine whether
    real-time protection, cloud protection, or tamper protection remains disabled. If
    the control is still off the host should be treated as unprotected and the value
    restored before further investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the Defender control was disabled?
  context: Defender controls are usually weakened so that follow-on activity runs
    without being blocked or scanned. Examining what ran in the window immediately
    after the registry write reveals what the disable was meant to enable, such as
    payload execution, credential access, or further configuration changes. A burst of
    process creation shortly after the write points to the activity the tampering was
    preparing the host for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the
    same time?
  context: An operator who disables one Defender control through the registry often
    pairs it with other evasion steps, such as stopping security services, clearing
    event logs, deleting shadow copies, disabling recovery, or weakening the firewall.
    Finding multiple tampering events from the same user or parent process within a
    short window indicates a coordinated effort to blind the host rather than an
    isolated registry edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made through reg.exe on this host in the
    same window?
  context: A disable tool that writes one Defender value usually writes many, and often
    extends to other security-relevant keys such as UAC settings, SmartScreen, AMSI, or
    service start values. Surfacing other reg.exe add and delete operations on the host
    in the same window reveals the full scope of the configuration changes and whether
    more than one objective was pursued, beyond the single value that triggered the alert.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_root_path:
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\
        - SOFTWARE\Policies\Microsoft\Windows Defender Security Center
        - SOFTWARE\Policies\Microsoft\Windows Defender\
      selection_dword_0:
        CommandLine|contains|all:
        - ' add '
        - d 0
        CommandLine|contains:
        - DisallowExploitProtectionOverride
        - EnableControlledFolderAccess
        - MpEnablePus
        - PUAProtection
        - SpynetReporting
        - SubmitSamplesConsent
        - TamperProtection
      selection_dword_1:
        CommandLine|contains|all:
        - ' add '
        - d 1
        CommandLine|contains:
        - DisableAccess
        - DisableAntiSpyware
        - DisableAntiSpywareRealtimeProtection
        - DisableAntiVirus
        - DisableAntiVirusSignatures
        - DisableArchiveScanning
        - DisableBehaviorMonitoring
        - DisableBlockAtFirstSeen
        - DisableCloudProtection
        - DisableConfig
        - DisableEnhancedNotifications
        - DisableIntrusionPreventionSystem
        - DisableIOAVProtection
        - DisableNetworkProtection
        - DisableOnAccessProtection
        - DisablePrivacyMode
        - DisableRealtimeMonitoring
        - DisableRoutinelyTakingAction
        - DisableScanOnRealtimeEnable
        - DisableScriptScanning
        - DisableSecurityCenter
        - Notification_Suppress
        - SignatureDisableUpdateOnStartupWithoutEngine
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_root_* and 1 of selection_dword_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_root_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_root_path:
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\
        - SOFTWARE\Policies\Microsoft\Windows Defender Security Center
        - SOFTWARE\Policies\Microsoft\Windows Defender\
      selection_dword_0:
        CommandLine|contains|all:
        - ' add '
        - d 0
        CommandLine|contains:
        - DisallowExploitProtectionOverride
        - EnableControlledFolderAccess
        - MpEnablePus
        - PUAProtection
        - SpynetReporting
        - SubmitSamplesConsent
        - TamperProtection
      selection_dword_1:
        CommandLine|contains|all:
        - ' add '
        - d 1
        CommandLine|contains:
        - DisableAccess
        - DisableAntiSpyware
        - DisableAntiSpywareRealtimeProtection
        - DisableAntiVirus
        - DisableAntiVirusSignatures
        - DisableArchiveScanning
        - DisableBehaviorMonitoring
        - DisableBlockAtFirstSeen
        - DisableCloudProtection
        - DisableConfig
        - DisableEnhancedNotifications
        - DisableIntrusionPreventionSystem
        - DisableIOAVProtection
        - DisableNetworkProtection
        - DisableOnAccessProtection
        - DisablePrivacyMode
        - DisableRealtimeMonitoring
        - DisableRoutinelyTakingAction
        - DisableScanOnRealtimeEnable
        - DisableScriptScanning
        - DisableSecurityCenter
        - Notification_Suppress
        - SignatureDisableUpdateOnStartupWithoutEngine
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_root_* and 1 of selection_dword_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    Defender registry change was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope of
    the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
