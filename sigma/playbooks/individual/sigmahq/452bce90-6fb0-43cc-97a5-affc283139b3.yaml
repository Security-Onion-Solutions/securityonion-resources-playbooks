    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the Defender registry tampering pattern rather than
    generic reg.exe activity. Many hosts firing the same pattern points to a scripted
    deployment or management tooling that writes the value by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
