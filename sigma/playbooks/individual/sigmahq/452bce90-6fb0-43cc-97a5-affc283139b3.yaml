    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    Defender registry write reveals what led to it and what followed, such as the parent
    that staged the process, reconnaissance, or follow-on execution the disabled control
    was meant to cover. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as reconnaissance, credential
    access, or other defense tampering, may reveal the attack stages that preceded the
    Defender registry change and help reconstruct the full timeline. Disabling
    protection is often one step in a sequence, so prior alerts give the context for why
    Defender was weakened.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's Defender registry tampering
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned security testing can write Defender policy values. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically run
    here, not generic reg.exe activity. A new parent process, an unexpected account, or
    a first-ever occurrence is the anomaly worth chasing.
