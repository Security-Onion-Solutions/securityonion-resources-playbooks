name: Suspicious CrushFTP Child Process
id: bbadfbe8-6ee0-473c-886d-b96207899d49
description: |
  Detects a process whose parent path ends in \crushftpservice.exe spawning a child whose image name is one
  of bash.exe, cmd.exe, cscript.exe, mshta.exe, powershell.exe, powershell_ise.exe, pwsh.exe, sh.exe or
  wscript.exe. Both conditions must hold together: the managed-file-transfer service must be the parent AND
  the child must be one of those interpreters or script hosts. A file-transfer server has no routine reason
  to launch a command interpreter, so the usual cause is that a crafted request reached the application over
  its HTTP(S) listener and drove server-side command execution — the post-exploitation stage of the CrushFTP
  authentication-bypass flaw tracked as CVE-2025-31161 and of file-transfer server exploitation generally.
  Administrative actions configured to run an external command and vendor update routines produce the same
  parent-child pairing. The investigation should decode what the child executed, establish whether the
  service reached out to an external host afterwards, check the deployed version against the patched
  releases, and determine whether the same pattern reached other servers.
type: detection
detection_id: 459628e3-1b00-4e9b-9e5b-7da8961aea35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did crushftpservice.exe spawn the alerting process, and is the child one of the nine interpreter
    or script-host binaries the rule lists?
  context: >-
    The rule needs both halves present in one event, so confirm the parent path ends in \crushftpservice.exe
    and the child image name is one of bash.exe, cmd.exe, cscript.exe, mshta.exe, powershell.exe,
    powershell_ise.exe, pwsh.exe, sh.exe or wscript.exe. The match is on binary name alone and carries no
    command-line criterion, so a name-only match is not by itself evidence of anything beyond an unusual
    child for this parent — what the child was told to do is the discriminator.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host expected to run a managed-file-transfer server, and is the account behind this
    execution expected to launch interpreters from it?
  context: >-
    A file-transfer service normally runs under a service account with a narrow, repetitive process tree.
    An interpreter under that account is either an administrator working through the application, a vendor
    or integration routine the server invokes by design, or command execution driven from a request. The
    account identity and the host's role narrow which of those is plausible before deeper analysis, and
    tell the analyst whether the timing falls inside a maintenance window this host actually has.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What request to the file-transfer application preceded this execution?
  context: >-
    Exploitation of a file-transfer server begins with a crafted HTTP(S) request that the application turns
    into server-side command execution. That request is not visible in process telemetry — the parent's own
    command line only identifies the service instance. Reconstruct it from the application's own request log
    for the minutes before the spawn, looking for unauthenticated calls to administrative or user-management
    endpoints, malformed or unexpected Authorization headers, error bursts, and the source address that
    issued them.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the CrushFTP installation on this host patched against CVE-2025-31161?
  context: >-
    CVE-2025-31161 is an authentication bypass in the S3-style Authorization header handling reachable over
    the application's HTTP(S) port, which yields unauthenticated access and from there server-side command
    execution; it affects version 10 before 10.8.4 and version 11 before 11.3.1. An unpatched build confirms
    the execution path was available and identifies every other server running the same version. A patched
    build moves the investigation toward an authenticated administrator action, a vendor routine, or an
    execution path that is not this one.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: When and how was this crushftpservice.exe instance started, and is it expected to spawn
    interpreters at all?
  context: >-
    This resolves the parent's own creation event. For a long-running service the launch chain normally
    terminates at the service control manager, so the useful readings are the start time and the command
    line the service was given — a restart in the hours before the alert points at an update, a configuration
    reload, or a replaced application archive, any of which changes what the process tree should look like.
    A service that has been running for weeks and suddenly spawns a shell points instead at the running
    instance being driven from a request.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same crushftpservice.exe instance spawn around the alert?
  context: >-
    Server-side command execution rarely stops at one process. The same service instance commonly spawns a
    short sequence — an interpreter, then discovery commands such as whoami or net, then a utility to pull
    the next stage. Listing every child of this exact parent instance in the surrounding window shows whether
    the alert is one step of such a sequence or an isolated event, and the ordering of those children
    reconstructs the operation's timeline.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this same detection fire on other file-transfer servers in the estate?
  context: >-
    Internet-exposed file-transfer servers are located by scanning and probed in bulk, so the same execution
    pattern reaching several servers points at opportunistic exploitation of a shared version rather than a
    single administrator action or a one-off vendor routine. Each additional host returned here is a server
    that needs the same version check and request-log review.
  range: -24h
  answer_sources:
  - alert
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the spawned interpreter actually execute, and did that binary run more than once on
    this host in the alert window?
  context: >-
    Read every argument on the returned command lines and resolve them to an operation — the URL a download
    cradle fetches, the file a transfer utility moves, the script mshta, cscript or wscript executes, the
    account or share a net command touches. The window covers all executions of this binary on this host,
    not just the alerting one, because command execution driven through a server often arrives as several
    sequential invocations that together form one operation. CurrentDirectory identifies the working
    directory the service handed the child, which is commonly the application's own installation path and
    is where dropped files tend to land.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated, and what does it decode to?
  context: >-
    The rule matches on binary name alone, so the command line is where intent lives. Base64 passed to
    -EncodedCommand or -enc is the most common concealment; caret and backtick escaping, string
    concatenation, and variable substitution serve the same purpose in cmd.exe and script-host invocations.
    Decode base64 arguments as UTF-16LE, then read the result for the source URL, the local path anything is
    written to, and any in-memory assembly load, which leaves no file behind. A plainly readable command
    needs no decoding — read it directly for the cradle or discovery pattern it carries.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did script block logging capture the deobfuscated script content on this host?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, after any encoding or concatenation
    the command line used, so it is the ground truth for what an encoded or hidden invocation ran. If
    PowerShell operational logs are not ingested in this environment, treat an empty result as a visibility
    gap rather than as evidence nothing ran, and decode the alerting command line directly instead.
  range: +/-5m
  answer_sources:
  - powershell_script_block
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls weakened or bypassed on this host in the hour before the spawn?
  context: >-
    Execution-policy bypass, AMSI patching, antimalware exclusions and version-2 downgrade are the controls
    an operator removes before running a payload, and they frequently arrive through the same execution path
    moments earlier. Hits here place the alerting command inside a sequence and identify which control was
    touched; an empty result means no such preparation was visible in process telemetry, not that none
    occurred.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Which scripting and .NET runtime modules were loaded on this host around the alert, and by which
    processes?
  context: >-
    Interpreters also run without their own binary — any process that loads System.Management.Automation.dll
    together with the CLR hosts the PowerShell engine while presenting a command line this rule never sees,
    which matters here because the parent is a Java-based service that can host or invoke a runtime directly.
    Loads of the VBScript, JScript or MSHTML engines identify the script-host path, and an amsi.dll load next
    to a rare or unsigned module points at the interpreter being prepared rather than merely used. Check the
    loading process, the module signer, and whether the assembly is one this host loads routinely.
  range: +/-15m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\clr.dll'
          - '\coreclr.dll'
          - '\mscoree.dll'
          - '\amsi.dll'
          - '\vbscript.dll'
          - '\jscript.dll'
          - '\mshtml.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the spawned interpreters or script hosts open outbound connections after the server launched
    them?
  context: >-
    Exploitation of an internet-facing application typically ends with the executed command reaching back
    out — to fetch the next stage, or to open a channel the operator drives. Fifteen minutes around the spawn
    is the useful correlation horizon between the request, the child process and the callback. Destinations
    outside the addresses this server normally talks to, and ports outside its published service ports, are
    the rows to pursue; an interpreter connecting anywhere at all is worth resolving to the file it moved.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tools:
        Image|endswith:
          - '\bash.exe'
          - '\cmd.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\sh.exe'
          - '\wscript.exe'
      condition: selection and selection_tools
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- always_include: true
  question: Has this account previously produced this parent-and-child combination, and does that history fit
    the account's role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this specific firing pattern rather than generic use of the interpreters, aggregated by
    host. An account that has produced it regularly points at an administrator who works through the
    application or at an integration configured to run external commands; a first occurrence for an account
    that otherwise only runs the service points the other way. Weigh the count against what the account is
    provisioned to do.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftpservice.exe
      selection_child:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has crushftpservice.exe historically driven this pattern on this host or across the environment,
    or is this new for the service?
  context: >-
    A file-transfer service usually runs under a service principal, and under a service principal the user
    identity attributes nothing — the launch mechanism does. The query mirrors the rule's selection structure
    scoped to the alerting parent process, so the result is the 90-day history of this server driving this
    specific pattern rather than generic co-occurrence of the binaries. A parent that already accounts for
    thousands of prior events is an integration or a vendor update job; a parent that has never driven it
    before is the deviation to chase.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftpservice.exe
      selection_child:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    If the execution ran under a named account rather than the service principal, that account's activity on
    other hosts in the same window shows whether the alert is one step of a wider session — administrative
    work spanning several servers, or credentials being reused after the file-transfer host was reached. When
    the alert fires under SYSTEM, a service identity, or a machine account, this view returns routine agent
    telemetry and the parent-scoped fleet view is the meaningful answer instead.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in
    the alert window. Several file-transfer servers producing it at once points at either a scheduled or
    pushed routine touching them all, or at the same request being replayed against every exposed server; a
    single host points at a host-local trigger. This view stays meaningful when the alert fires under a
    service principal, where identity-based pivots return only agent telemetry.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \crushftpservice.exe
      selection_child:
        Image|endswith:
        - \bash.exe
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \sh.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Exploitation of an exposed service is usually preceded or followed by other detectable steps —
    reconnaissance against the application, defense tampering, credential access, or persistence installed to
    survive a service restart. The ordering of earlier detections on this host reconstructs how far the
    execution path progressed before this alert, and shows whether the activity falls outside the hours this
    host normally sees administrative work.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
