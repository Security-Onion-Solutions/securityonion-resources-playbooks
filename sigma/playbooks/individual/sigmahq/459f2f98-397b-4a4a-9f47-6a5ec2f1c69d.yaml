name: Arbitrary File Download Via MSOHTMED.EXE
id: 9a6d5344-ff5b-4b7a-b48d-432597ef04e3
description: |
  Detects MSOHTMED.exe, a Microsoft-signed Office component, running with a URL
  argument on its command line. The rule fires when the process image ends in
  MSOHTMED.exe (or its OriginalFileName is MsoHtmEd.exe) AND the command line
  contains ftp://, http://, or https://. MSOHTMED parses the first URL argument
  and downloads the referenced file into the user's Internet cache directory
  with no further operator action, which lets a trusted Office binary fetch a
  remote payload while staying inside application-allow-listing and signed-binary
  controls. Some Office-feature workflows fetch remote content legitimately, so
  the investigation should determine what URL was fetched, what spawned MSOHTMED,
  whether the download landed and what ran afterward, and whether the destination
  and the parent chain look like an automated business workflow or operator-driven
  proxy execution.
type: detection
detection_id: 459f2f98-397b-4a4a-9f47-6a5ec2f1c69d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process MSOHTMED.exe (by image or OriginalFileName) and
    does its command line contain an ftp, http, or https URL, matching what this rule
    detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when both conditions hold together - the process is MSOHTMED.exe
    (image path ending in MSOHTMED.exe or OriginalFileName MsoHtmEd.exe) AND the command
    line carries an ftp://, http://, or https:// URL. Read the exact command line and
    note the full URL, since that URL is the file MSOHTMED was asked to fetch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to fetch remote files through an Office
    binary?
  context: MSOHTMED downloading a URL-referenced file is rarely part of normal user
    activity outside specific Office content workflows. Knowing whether the acting
    account and the host function involve Office automation, template publishing, or
    document workflows is often the fastest way to separate a benign feature use from
    a signed-binary proxy download. An account or endpoint with no Office-automation
    role fetching a remote file this way is the more notable case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line MSOHTMED ran with, and what URL was it asked
    to download?
  context: The command line carries the operational detail - the exact URL passed to
    MSOHTMED and any additional arguments. Decode the full URL, including scheme, host,
    path, and any embedded IP address or port. The download lands in the user's Internet
    cache directory by default, so the URL itself is the clearest description of what
    was retrieved and from where. Scoping to this binary on this host surfaces every
    MSOHTMED invocation in the window in case the download was one of several.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned MSOHTMED, and is that parent chain expected for a
    file-fetching Office binary?
  context: The parent process is where the download decision was made, and it is the
    strongest discriminator for this rule. A user double-clicking content normally
    produces an Office-application or explorer.exe parent; a parent such as cmd.exe,
    powershell.exe, wscript.exe, mshta.exe, or a different Office application driving
    MSOHTMED with a URL points to scripted or proxied invocation rather than a UI
    action. Identify the parent and what spawned it to judge whether this was
    operator-driven proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did MSOHTMED make an outbound network connection to the URL destination,
    and where did it connect?
  context: The download is the act that matters, and the outbound connection from
    MSOHTMED is the cleanest signal that the file was actually fetched rather than
    just requested. Pivot from the process to its network activity on this host to
    confirm the connection occurred and to capture the destination address and port.
    An Office binary opening a direct connection to a non-Office destination is the
    behavior this technique relies on to move a payload past signed-binary controls.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What is the download destination, and what do DNS, WHOIS, and threat intel
    reveal about it?
  context: The URL host is the remote source of the payload. Resolve and reputation-check
    the destination - registration age, passive DNS history, certificate details, and
    known threat-intel hits. A recently registered domain, a raw IP address, a code or
    paste hosting site, or a known malicious endpoint points to attacker-controlled
    infrastructure, while an established enterprise or vendor domain is consistent with
    a sanctioned content workflow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: Does this host normally connect to this download destination?
  context: A first-time connection to the destination is more notable than routine
    communication. Establishing how often this host has reached this address over time
    helps distinguish newly introduced attacker infrastructure from a destination the
    host already talks to as part of normal Office content or update workflows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Did MSOHTMED write a downloaded file to disk, and where did it land?
  context: A download command does not guarantee the file arrived - the URL may be
    unreachable, blocked, or return an error. MSOHTMED writes fetched content into the
    user's Internet cache directory by default, so check for file-creation events by
    this binary, focusing on the INetCache path, to confirm the transfer completed and
    to recover the on-disk name of the dropped file.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file MSOHTMED downloaded was executed, what is its hash and does it have known threat-intel detections?
  context: MSOHTMED lands the download in the shared Internet cache directory that browsers and Office
    also write to, so the file does not stand out by path — and file-creation events carry no hash anyway.
    The hash is recorded when the payload runs, so this query returns MSOHTMED's child and sibling
    processes with their executable hashes; if the downloaded file was executed as part of the same
    activity, it appears here. If it was run later by an unrelated process, retrieve it from the Internet
    cache and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
- question: What child processes did MSOHTMED spawn after the download?
  context: MSOHTMED fetching a file does not normally spawn child processes, so any
    children are worth scrutiny - they may be the downloaded payload being executed or
    a follow-on tool launched to act on it. Unexpected children such as cmd.exe,
    powershell.exe, rundll32.exe, or an executable running from a cache or temp path
    indicate the delivery progressed into execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the MSOHTMED URL-download pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even a signed Office binary can be used legitimately for content fetches.
    This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has historically run here, not generic Office activity. A new parent process, an
    unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSOHTMED.exe
      - OriginalFileName: MsoHtmEd.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the MSOHTMED URL-download pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the MSOHTMED URL-download pattern rather than
    generic Office activity. Many hosts firing the same pattern points to a content
    workflow, build pipeline, or scripted deployment that fetches remote files by
    design; one host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSOHTMED.exe
      - OriginalFileName: MsoHtmEd.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSOHTMED.exe
      - OriginalFileName: MsoHtmEd.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSOHTMED.exe
      - OriginalFileName: MsoHtmEd.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    MSOHTMED download was a single event or part of activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the
    incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \MSOHTMED.exe
      - OriginalFileName: MsoHtmEd.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    MSOHTMED download reveals what led to it and what followed - the parent that staged
    the process, reconnaissance, or follow-on execution of the fetched file. Novel
    parent-child pairs at low counts are what to scan for against the high-count noise
    of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or
    credential access - may reveal the attack stages that preceded the MSOHTMED download
    and help reconstruct the timeline. A signed-binary proxy download is often a
    delivery step in a longer sequence, so prior alerts give the context for why the
    fetch happened.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
