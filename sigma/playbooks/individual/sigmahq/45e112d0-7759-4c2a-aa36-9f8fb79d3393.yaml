name: IE Change Domain Zone
id: ced9f5ee-9b68-4f84-bcd7-cffaa0132555
description: |
  Detects a domain being mapped into a Windows/Internet Explorer security zone through the ZoneMap\Domains registry subtree with a zone value other than My Computer (0), Local Intranet (1), or empty -- most notably Trusted Sites (2). Legitimately, administrators and group policy add internal sites to trusted zones; malicious use adds an attacker-controlled domain to Trusted Sites to strip Mark-of-the-Web tagging, suppress SmartScreen and download warnings, and relax macro and script restrictions, which can let phishing payloads execute and browser trust be reused for covert command-and-control. Investigation should identify which domain and zone were written, which process and parent made the change, whether it was authorized, and whether the relaxed trust was subsequently exercised.
type: detection
detection_id: 45e112d0-7759-4c2a-aa36-9f8fb79d3393
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and zone value data match what this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The TargetObject should fall under
    ...\Internet Settings\ZoneMap\Domains\<domain>\<protocol>, and the Details DWORD is the numeric security zone the
    domain was mapped to: 2 = Trusted Sites, 3 = Internet, 4 = Restricted. The rule fires only when that value is not
    My Computer (0), Local Intranet (1), or empty, so a value of 2 (Trusted Sites) is the case that lowers browser
    protections.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Internet Explorer security-zone mappings?
  context: >-
    Legitimate zone changes are usually pushed by administrators or group policy on managed endpoints. A zone mapping
    written interactively by a standard user, a service account, or on a host with no such administration is harder to
    explain. User attribution is present on most endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which domain and which security zone were written, and is this ZoneMap location a known trust-manipulation target?
  context: >-
    The ZoneMap\Domains subtree maps individual domains and protocols to a numeric security zone. Placing a domain in
    Trusted Sites (2) strips Mark-of-the-Web tagging from content fetched from it, suppresses certain SmartScreen
    prompts, and can relax macro and download restrictions. The domain name is the subkey under Domains, the protocol
    (http/https) is the value name, and the DWORD data is the target zone.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the exact zone value written, and what does mapping this domain to that zone allow?
  context: >-
    Decode the Details DWORD into its zone meaning: 2 = Trusted Sites (fewest restrictions after My Computer),
    3 = Internet, 4 = Restricted. A move to Trusted Sites is the security-relevant case -- it lets content from that
    domain bypass download warnings and can enable macro execution and credential prompts that the Internet zone would
    block. Note the exact domain in the key path; a lookalike or attacker-controlled domain being trusted is the signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this zone mapping, and was it spawned by a browser, script host, or Office application?
  context: >-
    The writing process and its parent reveal how the change was made. A zone change written by reg.exe or
    powershell.exe launched from an Office application (WINWORD, EXCEL, OUTLOOK) or a script host (wscript, mshta) is
    consistent with a malicious macro or downloaded script establishing browser trust, whereas a change written by a
    management agent or group-policy process is routine.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same session?
  context: >-
    A single zone change is rarely the whole picture. The same session may also downgrade ProtocolDefaults, add IP
    ranges to ZoneMap\Ranges, set Security_HKLM_only to force the change machine-wide, or disable other protections.
    Clusters of registry changes from the same writing process in a short window reveal the full scope of the tampering.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this ZoneMap key been modified before on this host?
  context: >-
    First-time changes to zone mappings are more suspicious than recurring ones. Managed endpoints may receive the same
    trusted-site list repeatedly from policy, which shows as a stable history; a domain that appears here for the first
    time, especially an external one, has no such baseline. Compare the Details values to see whether the same mapping
    is re-applied or this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same ZoneMap key modified on other hosts in the environment?
  context: >-
    The same zone mapping across many hosts points to a group-policy push or a deployment tool; a change confined to
    one host is more likely targeted. Widespread appearance of an external domain in Trusted Sites can also indicate
    malware or a policy that was tampered with centrally -- compare the Details values and writing processes across
    hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the change?
  context: >-
    Zone changes rarely occur in isolation. Examining the surrounding process activity shows what led to the change and
    what followed -- a phishing document opening, a script host launching, a download, or follow-on execution. Novel
    parent-child process pairs stand out against routine host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: After the zone change, did new or downloaded executables run on this host?
  context: >-
    A zone downgrade is only consequential if content from the now-trusted domain is fetched and run. In the hours after
    the change, look for execution of binaries from browser download folders, Temp, or AppData, or Office applications
    spawning script hosts -- the payloads that the relaxed trust would let through without a Mark-of-the-Web warning.
    The query is anchored on exactly those two patterns -- images running from download, temp, or Public paths, and
    Office applications spawning script interpreters -- so a zero means no such content ran in the window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_download_paths:
        Image|contains:
        - '\Downloads\'
        - '\AppData\Local\Temp\'
        - '\Users\Public\'
      selection_office_script:
        ParentImage|endswith:
        - '\winword.exe'
        - '\excel.exe'
        - '\powerpnt.exe'
        - '\outlook.exe'
        Image|endswith:
        - '\wscript.exe'
        - '\cscript.exe'
        - '\mshta.exe'
        - '\powershell.exe'
        - '\pwsh.exe'
        - '\cmd.exe'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this change?
  context: >-
    Earlier detections on the same host -- a phishing document, a script host launch, defense tampering, or credential
    access -- may reveal the stages that preceded the zone change and help reconstruct the timeline. Zone trust
    manipulation is often an enabling step within a larger operation rather than the initial access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Zone trust manipulation is one way to weaken defenses, and it often accompanies more durable footholds. Scheduled
    tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created in the same window suggest a hands-on
    session stacking multiple mechanisms rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket or documented approval for this zone-mapping change?
  context: >-
    Many organizations require approvals for changes to security configuration, including browser zone policy. A
    corresponding ticket or maintenance window suggests authorized activity; its absence when policy requires one
    suggests the change was unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall adding this domain to a security zone?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If nobody
    recalls adding the domain, the account may be compromised or the change may be automated malware. If someone does
    recall it, capture why the domain needed to be trusted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with business hours or a maintenance window?
  context: >-
    Legitimate configuration changes usually occur during working hours or scheduled maintenance. A zone mapping written
    outside those windows, or on a host and account with no history of administration, is more likely to reflect
    activity the account owner was not driving directly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this the way your organization normally manages browser security zones?
  context: >-
    Trusted-site lists are typically managed centrally through group policy on managed endpoints. A zone mapping written
    by a direct reg.exe or PowerShell invocation on the host may indicate an administrator taking a shortcut, or an
    attacker bypassing normal tooling. Understanding the standard procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
