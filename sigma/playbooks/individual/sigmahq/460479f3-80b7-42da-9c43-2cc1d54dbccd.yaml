name: Creation of a Local Hidden User Account by Registry
id: 5ce69849-c6c2-44fa-a55b-beb3142e8576
description: |
  Detects lsass.exe writing a value under HKLM\SAM\SAM\Domains\Account\Users\Names\ whose account-name key ends in "$". That path is where the local SAM registers every local account, and lsass is the only process that commits SAM changes; a trailing "$" in the name hides the account from `net user` enumeration while it remains fully usable for logon. Because lsass writes the key on behalf of whatever tool requested the account (net.exe, PowerShell, WMI, or a direct SAMR call), the writing process in the alert is expected — the investigation centers on the account name that was created, the process activity that drove the creation, and whether the account was enabled, added to a privileged group, or used to log on afterward.
type: detection
detection_id: 460479f3-80b7-42da-9c43-2cc1d54dbccd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The TargetObject should be a path under \SAM\SAM\Domains\Account\Users\Names\ ending in a value name that carries a trailing "$", the writing process (Image) should be lsass.exe, and the value data should reflect a newly registered account. The "$" suffix is the load-bearing detail — it is what conceals the account from standard enumeration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Image
      - TargetObject
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to have local accounts created directly in the SAM?
  context: Local account creation is normal on standalone or workgroup systems managed by hand, and on imaging or provisioning hosts. On a domain-managed workstation or server, direct local-account creation — especially a hidden "$"-suffixed one — is uncommon and worth scrutiny. The User field is present on most endpoint registry events but SAM commits are frequently driven by SYSTEM, so if User is a machine account or missing, judge context from the host's role and the process that requested the account.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the account name being created, and does the trailing "$" mark it as a hidden local account?
  context: The value name that appears after \Names\ in the TargetObject is the local account name; the (Default) value data holds the account's relative identifier. A name ending in "$" mimics the naming style of machine accounts and is omitted from `net user` output, so a human-style login name given a "$" suffix (for example "backup$" or "svc$") is the pattern of a deliberately concealed account rather than a machine trust. Record the exact name and RID for correlation with account-management and logon events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: When this host has previously registered a hidden "$" account in the SAM, what programs and users normally drove it, and does the current alert fit that profile?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution reflects how this specific hidden-account pattern has fired here before, not generic SAM activity. A first-ever occurrence, a new writing context, or an unfamiliar user is the deviation worth chasing; a recurring provisioning routine that has produced the same profile for months is more likely benign.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: registry_event
    detection:
      selection:
        TargetObject|contains: \SAM\SAM\Domains\Account\Users\Names\
        TargetObject|endswith: $\(Default)
        Image|endswith: \lsass.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts registered a hidden "$" account in the SAM in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the hidden-account pattern rather than generic SAM writes. Many hosts producing the same pattern points to a provisioning script or imaging routine that appends "$" by design; a single host or a small unrelated set points to hands-on operator activity that merits closer review.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: registry_event
    detection:
      selection:
        TargetObject|contains: \SAM\SAM\Domains\Account\Users\Names\
        TargetObject|endswith: $\(Default)
        Image|endswith: \lsass.exe
      condition: selection
    fields:
    - host.name
- question: What process activity ran on this host in the minutes around the account creation?
  context: Because lsass commits the SAM write on behalf of the requesting tool, the account-creation command itself appears as a separate process event with no lineage link to lsass — the connection is temporal. Look within a tight window (seconds to a couple of minutes) for the tool that drove the creation, such as net.exe, net1.exe, powershell.exe, reg.exe, wmic.exe, or a renamed copy of one of these; its parent chain then tells you how the operation was launched.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other registry modifications made on this host in the same session?
  context: Operators who plant a hidden account often make additional changes in the same window — enabling the account's profile, adjusting security policy, or configuring another persistence key. Grouping all registry writes on the host by key path and writing process reveals whether the SAM change stood alone or landed alongside tampering and configuration changes that indicate a hands-on session or an installer-style implant.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What account-management and group-membership events reference the new account on this host?
  context: Creating the SAM entry is only the first step; a usable persistence account is typically enabled, given a password, and added to a privileged group. The Windows Security log records these as account-created, account-enabled, password-set, account-changed, and added-to-group events. Correlate them by the account name recovered from the SAM key to see whether the hidden account was placed into Administrators or another privileged group, and check for a subsequent interactive or network logon by that name to confirm it is being used. If Security-log account-management auditing is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing happened.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4720
          - 4722
          - 4724
          - 4728
          - 4732
          - 4738
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
- question: Did other detections fire on this host in the hours before this alert?
  context: A hidden account is usually established after an operator already has code execution and elevated rights. Earlier detections on the same host — credential access, defense tampering, or privilege escalation — help place the account creation in a sequence and reconstruct how the operator reached the point of writing to the SAM.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: A hidden account is one foothold; operators commonly stack backups using different techniques. Executions of scheduling, service-control, or registry tools in the same timeframe indicate deliberate persistence stacking rather than an isolated account change, and each mechanism found is a separate remediation item.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup folder or a path referenced by a registry Run key achieves persistence without a scheduling or registry tool. Finding such drops in the same timeframe as the hidden account points to an operator laying down multiple footholds.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for creating this account?
  context: Many organizations require an approved request before a local account is provisioned, especially a privileged or service account. A corresponding ticket suggests authorized provisioning; the absence of one where policy requires it moves the hidden account toward unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does an administrator recall creating this account?
  context: Direct confirmation from the person behind the activity is often the fastest path to a verdict. If no administrator recalls creating the account, the credentials driving the creation may be compromised or the activity may be automated. If someone does recall it, capture why a local account was needed and why the name carries a "$" suffix, since legitimate provisioning rarely hides accounts from enumeration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is creating a local account this way consistent with how your organization normally provisions accounts?
  context: Organizations typically provision accounts through directory tooling, imaging pipelines, or configuration management rather than direct SAM writes driven by ad hoc command-line tools. Understanding the normal method helps separate an administrator taking a shortcut from an operator deliberately avoiding sanctioned tooling to plant a concealed account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this SAM account-name key been written before on this host?
  context: A per-account SAM Names key is created once, when the account is first registered, so historical writes to this exact key are normally absent. Zero prior history is consistent with a brand-new account; repeated writes over time would instead suggest a recurring provisioning routine that reuses the same name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
