name: HackTool - Impacket Tools Execution
id: af6aa214-9990-4ab4-bb66-2b8d59ab3667
description: |
  Detects execution of compiled Windows binaries from the Impacket toolset, matched by characteristic file names or
  name fragments in the Image path. Impacket bundles credential-access, lateral-movement, and adversary-in-the-middle
  tooling (secretsdump, wmiexec, smbexec, ntlmrelayx, getTGT, ticketer, and similar), so a fire typically means an
  operator is running offensive tradecraft on the host. Determine whether the execution belongs to an authorized
  assessment, which specific Impacket capability was invoked, what credential stores or remote systems it touched, and
  whether follow-on lateral movement occurred. Because the match is name-based, also confirm the binary is genuinely the
  Impacket tool rather than an unrelated file that happens to share a name fragment.
type: detection
detection_id: 4627c6ae-6899-46e2-aa0c-6ebcb1becd19
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the executed image name match one of the Impacket tool names this rule looks for?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the full image path and
    process details against the rule's name list. The rule matches on name fragments (secretsdump, wmiexec, ntlmrelayx,
    and similar) and on the compiled "_windows.exe" releases, so verify the matched binary is genuinely the Impacket tool
    and not an unrelated file that happens to share a name fragment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to run offensive credential-access or lateral-movement tooling?
  context: Legitimate administrative activity rarely involves Impacket. Knowing whether the user role and host function are
    consistent with running offensive tradecraft is often the fastest path to distinguishing an authorized assessment or a
    security engineer's testing from an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Impacket execution part of an authorized penetration test or red team engagement?
  context: Impacket is standard tooling in authorized security assessments. Before investing investigation time, check
    whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement
    with matching tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Impacket script was invoked and what capability does it provide?
  context: Impacket is multi-purpose. The matched name reveals the capability -- secretsdump targets credential stores,
    wmiexec/smbexec/atexec/dcomexec/psexec drive remote execution and lateral movement, getTGT/getST/ticketer manipulate
    Kerberos tickets, and ntlmrelayx/smbrelayx perform SMB relay. Identify which one ran to scope the potential compromise
    and the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What credential stores or authentication material did this tool target?
  context: Different Impacket scripts reach different stores -- secretsdump pulls SAM, LSA secrets, cached domain
    credentials, and NTDS.dit; the Kerberos scripts request or forge tickets. Identifying the specific target determines
    which accounts may be compromised and what remediation is needed. Decode the full command line for hostnames, account
    names, and dump methods.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this Impacket binary, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Interactive operator use often descends from a shell
    (cmd.exe, powershell.exe) or remote-access tooling, while a service or scripting-host parent (services.exe, wscript.exe,
    mshta.exe) may indicate scripted deployment or a different stage of an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What files did this tool write to the host after it ran?
  context: Impacket scripts leave characteristic artifacts -- secretsdump writes dump output, the relay and remote-exec
    scripts drop temporary service binaries and output files, and ticket scripts write .ccache or .kirbi files. Files
    created by this process confirm what the tool did even after the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed, and do any have elevated privileges?
  context: The severity of credential access or relay depends on the privilege level of the affected accounts. Domain admin
    or service-account credentials require incident escalation; a standard user account may only need monitoring. Cross-
    reference the account names visible in the command line against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were new services created or multicast name-resolution settings changed on this host around the alert?
  context: SMB relay and LLMNR/NBT-NS poisoning leave host-side configuration evidence -- service creation events and
    registry changes to the EnableMulticast value under the DNSClient policy key that re-enable multicast name resolution.
    Correlating service-creation and configuration changes in the same window as the tool execution helps confirm an
    adversary-in-the-middle setup rather than an isolated invocation. If security-channel events are not ingested in this
    environment, treat zero results as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
- question: What files or directories did this tool read or write during collection?
  context: Several Impacket scripts move data -- secretsdump exports credential material and the remote-exec scripts can
    pull files from or push files to targets. The files the tool's process touched reveal what data was within reach and
    help scope potential data loss.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity,
    and does the current alert fit?
  context: Even tools that appear occasionally have a normal launch profile. The query mirrors the rule's name-match
    selection scoped to this host, so the resulting parent and user distribution reflects how this specific pattern has run
    here historically. A new parent process or an unexpected user account is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - \goldenPac
        - \karmaSMB
        - \kintercept
        - \ntlmrelayx
        - \rpcdump
        - \samrdump
        - \secretsdump
        - \smbexec
        - \smbrelayx
        - \wmiexec
        - \wmipersist
      - Image|endswith:
        - \atexec_windows.exe
        - \dcomexec_windows.exe
        - \dpapi_windows.exe
        - \findDelegation_windows.exe
        - \GetADUsers_windows.exe
        - \GetNPUsers_windows.exe
        - \getPac_windows.exe
        - \getST_windows.exe
        - \getTGT_windows.exe
        - \GetUserSPNs_windows.exe
        - \ifmap_windows.exe
        - \mimikatz_windows.exe
        - \netview_windows.exe
        - \nmapAnswerMachine_windows.exe
        - \opdump_windows.exe
        - \psexec_windows.exe
        - \rdp_check_windows.exe
        - \sambaPipe_windows.exe
        - \smbclient_windows.exe
        - \smbserver_windows.exe
        - \sniff_windows.exe
        - \sniffer_windows.exe
        - \split_windows.exe
        - \ticketer_windows.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - \goldenPac
        - \karmaSMB
        - \kintercept
        - \ntlmrelayx
        - \rpcdump
        - \samrdump
        - \secretsdump
        - \smbexec
        - \smbrelayx
        - \wmiexec
        - \wmipersist
      - Image|endswith:
        - \atexec_windows.exe
        - \dcomexec_windows.exe
        - \dpapi_windows.exe
        - \findDelegation_windows.exe
        - \GetADUsers_windows.exe
        - \GetNPUsers_windows.exe
        - \getPac_windows.exe
        - \getST_windows.exe
        - \getTGT_windows.exe
        - \GetUserSPNs_windows.exe
        - \ifmap_windows.exe
        - \mimikatz_windows.exe
        - \netview_windows.exe
        - \nmapAnswerMachine_windows.exe
        - \opdump_windows.exe
        - \psexec_windows.exe
        - \rdp_check_windows.exe
        - \sambaPipe_windows.exe
        - \smbclient_windows.exe
        - \smbserver_windows.exe
        - \sniff_windows.exe
        - \sniffer_windows.exe
        - \split_windows.exe
        - \ticketer_windows.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - \goldenPac
        - \karmaSMB
        - \kintercept
        - \ntlmrelayx
        - \rpcdump
        - \samrdump
        - \secretsdump
        - \smbexec
        - \smbrelayx
        - \wmiexec
        - \wmipersist
      - Image|endswith:
        - \atexec_windows.exe
        - \dcomexec_windows.exe
        - \dpapi_windows.exe
        - \findDelegation_windows.exe
        - \GetADUsers_windows.exe
        - \GetNPUsers_windows.exe
        - \getPac_windows.exe
        - \getST_windows.exe
        - \getTGT_windows.exe
        - \GetUserSPNs_windows.exe
        - \ifmap_windows.exe
        - \mimikatz_windows.exe
        - \netview_windows.exe
        - \nmapAnswerMachine_windows.exe
        - \opdump_windows.exe
        - \psexec_windows.exe
        - \rdp_check_windows.exe
        - \sambaPipe_windows.exe
        - \smbclient_windows.exe
        - \smbserver_windows.exe
        - \sniff_windows.exe
        - \sniffer_windows.exe
        - \split_windows.exe
        - \ticketer_windows.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  always_include: true
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on several hosts, the scope of compromise may be larger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|contains:
        - \goldenPac
        - \karmaSMB
        - \kintercept
        - \ntlmrelayx
        - \rpcdump
        - \samrdump
        - \secretsdump
        - \smbexec
        - \smbrelayx
        - \wmiexec
        - \wmipersist
      - Image|endswith:
        - \atexec_windows.exe
        - \dcomexec_windows.exe
        - \dpapi_windows.exe
        - \findDelegation_windows.exe
        - \GetADUsers_windows.exe
        - \GetNPUsers_windows.exe
        - \getPac_windows.exe
        - \getST_windows.exe
        - \getTGT_windows.exe
        - \GetUserSPNs_windows.exe
        - \ifmap_windows.exe
        - \mimikatz_windows.exe
        - \netview_windows.exe
        - \nmapAnswerMachine_windows.exe
        - \opdump_windows.exe
        - \psexec_windows.exe
        - \rdp_check_windows.exe
        - \sambaPipe_windows.exe
        - \smbclient_windows.exe
        - \smbserver_windows.exe
        - \sniff_windows.exe
        - \sniffer_windows.exe
        - \split_windows.exe
        - \ticketer_windows.exe
      _pb_scope:
