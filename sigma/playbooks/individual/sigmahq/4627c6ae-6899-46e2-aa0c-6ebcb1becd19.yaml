      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    automation or one-off activity?
  context: The query mirrors the rule's name-match selection with no host scope, so the result is a fleet-wide count of
    this firing pattern rather than generic binary usage. Many hosts firing the same pattern points to scripted deployment
    or sanctioned testing; one host or a small unrelated set points to manual operator activity. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
