name: VBScript Payload Stored in Registry
id: cb6cf24d-65e7-45b0-8ddb-d2fec7348839
description: |
  Detects VBScript or JScript content written into a registry value under a Windows CurrentVersion
  sub-key (the Run/RunOnce keys and the msiexec .NET Interop installer paths are excluded), where the
  value data carries script markers such as 'vbscript:', 'jscript:', 'mshtml,', 'RunHTMLApplication',
  'Execute(', 'CreateObject', or 'window.close'. This is fileless script staging: an actor stores the
  payload as registry value data so a launcher (wscript, cscript, mshta, or rundll32) can read the
  value and execute it later, leaving nothing on disk. Legitimate value data rarely carries these
  scripting-host markers, so the investigation should decode the stored value, identify the process
  that wrote it and the launcher that reads it, and determine whether the payload has executed.
type: detection
detection_id: 46490193-1b22-4c29-bdd6-5bf63907216f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key path and value data match what this rule detects?
  context: Confirm the alert before investing time. The rule fires when a value under a CurrentVersion
    sub-key holds script markers ('vbscript:', 'jscript:', 'mshtml,', 'RunHTMLApplication', 'Execute(',
    'CreateObject', 'window.close') AND the key is not Run/RunOnce and not the msiexec .NET Interop
    installer path. Review the exact key path (TargetObject), the value data (Details), and the writing
    process against those criteria. Value data is present on roughly four in five registry modifications
    and can be absent when the data is a large binary blob, which a big script payload may be; treat a
    blank Details as a reason to retrieve the value directly rather than as a clean result.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which CurrentVersion sub-key was written, and is it a known autostart or launcher-read location?
  context: The key path reveals intent. This rule deliberately excludes Run/RunOnce and targets other
    CurrentVersion sub-keys where a script payload can be parked and read back by a launcher. Determine
    whether the written key is one an autostart launcher or COM handler reads at logon or on demand,
    versus an application settings key that has no script-execution path. The specific value name and
    data written determine what executes when the launcher reads it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What script payload is stored in the value data, and what does it do when executed?
  context: Read the Details field as the script it is. VBScript and JScript stored in registry value
    data commonly builds a COM object with CreateObject, calls Execute() on decoded content, or uses
    the mshtml/RunHTMLApplication path that rundll32 and mshta interpret as inline script. Decode any
    embedded encoding, note downloaded URLs or dropped file paths, and record which scripting host the
    markers imply. Value data is absent on roughly one in five registry modifications when the payload
    is a large binary blob; if Details is empty, retrieve the value directly, since a big script may
    exceed what the telemetry captures.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this user and host expected to write script content into a CurrentVersion registry key?
  context: Legitimate administrative or installer activity can write to CurrentVersion keys, but storing
    interpretable script in value data is unusual. Knowing whether the user role and host function fit
    this operation is often the fastest way to separate a routine write from staging. User attribution
    is present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot
    on the writing process instead and apply service-account expectations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What started the process that wrote this registry value, and is that lineage expected?
  context: The process that wrote the value is visible on the alert; tracing its own origin reveals
    whether the write came from a legitimate chain (an installer launched by the user) or a suspicious
    one (a script host or Office application spawning the writer). A writing process launched by
    wscript, mshta, or a document handler is a stronger indicator of staging than one launched by a
    packaged installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other registry modifications did this host make in the same session?
  context: An actor who parks a script payload in one key often makes related changes -- adding a
    launcher reference, disabling a protection, or staging a second value. Grouping all registry
    modifications on the host in the surrounding window by key path and writing process shows what else
    was touched together; the triggering key appears in the results, and the signal is what accompanied
    it. Machine-account or SYSTEM writers here indicate a service-driven change rather than an
    interactive one.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did a launcher read and execute the stored payload after it was written?
  context: The stored value only matters if something runs it. Registry-resident VBScript and JScript
    is read back by wscript, cscript, mshta, or rundll32 -- the last two via the mshtml RunHTMLApplication
    path implied by the value markers. Look for these launchers executing on the host after the write;
    their presence with matching timing confirms the persistence is active and the payload ran, while
    their absence points to staging that has not yet fired.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_launcher:
        Image|endswith:
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
      condition: selection and selection_launcher
    fields:
      - Image
      - CommandLine
- question: Does the change survive reboot, and is any referenced script or executable present on disk?
  context: Registry staging is effective only while the value persists and any payload it references
    exists. If the value data points at a dropped script or binary path, confirming that file was
    created determines what would run when a launcher reads the value. The file-write event carries no
    hash; if a payload file is present, hash it from a later execution or retrieve it for a reputation
    lookup. Because registry value deletion is not observable, judge durability from the value's
    re-modification history and from whether a launcher executed, not from a delete event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this registry key been modified before on this host?
  context: A first-time modification to a key is more notable than a routine change. Value data that has
    never appeared before, or a key that has never been touched, raises the likelihood that this write
    is staging rather than normal software behavior. Compare historical Details values to see whether
    the same script content is being reset or whether this is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same write on many hosts may indicate a policy push or widely deployed software, while a
    write confined to this host suggests targeted staging. Compare the value data across hosts -- an
    identical script payload appearing on several machines points to a distributed implant rather than
    a benign configuration change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating registry modifications on the host in the
    surrounding window by key path and writing process collapses repetitive noise into high-count rows
    while novel key-and-writer pairs stand out at low counts. Those low-count outliers are what reveal
    the immediate context -- what led to the write and what followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, credential access,
    or a script host launching from an unusual parent -- may reveal the stages that preceded the
    registry write and help reconstruct the timeline. The alert sequence on the host often tells the
    order of operations that led to script staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Actors rarely rely on a single foothold. Alongside a registry-resident script payload, they
    commonly stack scheduled tasks, services, additional Run entries, or WMI subscriptions using
    command-line tools. Persistence-tool executions clustered in the same timeframe as the registry
    write indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: File-based persistence bypasses command-line detection. Dropping a script or executable into
    a Startup folder or a path referenced by a Run key achieves persistence without running schtasks,
    sc, or reg, and pairs naturally with a registry-resident launcher reference. File-event monitoring
    captures these drops even when the actor avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, deployment, or documented approval for this registry change?
  context: Many organizations require documented approval for persistence-relevant registry changes. A
    corresponding ticket or deployment record suggests authorized activity; the absence of one when
    policy requires it suggests the write was unauthorized. This check can quickly close a false
    positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this registry write align with work hours or a maintenance window?
  context: Legitimate configuration changes typically occur during business hours or scheduled
    maintenance. A script payload written to a CurrentVersion key outside those windows, or on a host
    where no maintenance was scheduled, is more consistent with staging than with routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
