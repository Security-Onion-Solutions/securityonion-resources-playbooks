name: Bypass UAC Using DelegateExecute
id: def41e72-6efb-4689-839b-6c15500eca6d
description: |
  Detects a User Account Control (UAC) bypass that abuses the shell DelegateExecute
  verb mechanism. The rule fires when a process writes an empty DelegateExecute value
  under a per-user shell\open\command key (for example
  HKCU\Software\Classes\<ProgID>\shell\open\command\DelegateExecute with no data).
  Emptying DelegateExecute forces the shell to fall back to the command stored in the
  key's default value, so when an auto-elevating trusted binary (fodhelper.exe,
  computerdefaults.exe, sdclt.exe, eventvwr.exe) invokes that verb it silently launches
  the attacker's command at High integrity with no consent prompt. Legitimate software
  rarely empties a DelegateExecute value under HKCU\Software\Classes. The investigation
  should confirm the hijacked key and its command, identify the process that wrote it,
  and determine whether an auto-elevating binary launched and ran an elevated payload.
type: detection
detection_id: 46dd5308-4572-4d12-aa43-8938f0184d4f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alert show an empty DelegateExecute value written under a shell\open\command key?
  context: Before investing investigation time, confirm the alert is a true positive by
    reviewing the exact registry path (TargetObject) and value data (Details) against the
    rule's criteria. The rule matches a TargetObject ending in \open\command\DelegateExecute
    with empty (no) value data. An empty DelegateExecute value is the hijack switch that
    redirects the verb to the key's default-value command; note the writing process for the
    remaining questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify per-user shell command-verb registry keys?
  context: Legitimate administrative or installer activity can write shell verb keys, but an
    empty DelegateExecute value under HKCU\Software\Classes is uncommon for normal software.
    Knowing whether the account and host function are consistent with hands-on registry
    editing is often the fastest way to separate a true positive from routine operations.
    User attribution is present on most endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified key a known UAC-bypass handler location, and what process wrote it?
  context: The registry path reveals intent. Per-user shell\open\command keys under
    HKCU\Software\Classes for classes such as ms-settings, mscfile, exefile, or Folder are
    the handler locations auto-elevating binaries read; writing a DelegateExecute value
    there is a recognized elevation-control abuse rather than routine configuration. Confirm
    the class and ProgID in TargetObject and identify the writing process (Image) to judge
    whether this is a bypass setup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command was written to the hijacked shell\open\command key's default value?
  context: The alerting DelegateExecute value is empty by design; the payload lives in the
    default value of the same \open\command key. Retrieve the sibling default-value write to
    read the command the auto-elevating binary will run at high integrity. Decode any file
    paths, encoded content, or interpreter invocations in Details — a path into Temp,
    AppData, or ProgramData, or a cmd.exe/powershell.exe command, is the elevated payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\open\command'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the hijacked key re-modified after the alert, and did its configured command run?
  context: Registry key and value deletions are not observable on endpoint telemetry, so
    cleanup of the hijack cannot be confirmed directly; judge persistence from the key's
    re-modification history over a longer forward window and from whether the configured
    command executed. Repeated writes to the same key, or a later restore of a benign value,
    suggest deliberate setup-and-teardown around a single elevation.
  range: +6h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What command performed the registry writes that set up this bypass?
  context: Many UAC bypasses write a command to a per-user handler key that an auto-elevated
    process reads and runs. Common targets include HKCU\Software\Classes\ms-settings\Shell,
    HKCU\Software\Classes\mscfile\shell, HKCU\Software\Classes\Folder\shell\open\command, and
    HKCU\Environment. Finding the reg.exe, powershell.exe, or cmd.exe invocation that wrote
    the key confirms the mechanism and reveals the exact payload staged for elevation.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process spawned the process that wrote the hijacked key?
  context: The lineage of the writing process shows how the registry edit was invoked.
    Interactive editing from explorer.exe or a shell is different from a write driven by
    mshta.exe, wscript.exe, an Office application, or a remote-execution parent, which point
    to exploitation or a malicious script. Walk up from the writing process to its parent to
    see whether the elevation setup fits an expected administrative workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did an auto-elevating binary launch on this host after the key was hijacked?
  context: The bypass only triggers when a trusted auto-elevating binary invokes the hijacked
    verb. sdclt.exe, eventvwr.exe, and computerdefaults.exe are known to support this pattern,
    and fodhelper.exe is the canonical DelegateExecute abuser; a launch of one of these shortly
    after the write is what reads the key and runs the staged command elevated. A High or
    System IntegrityLevel on the launch confirms it ran auto-elevated.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\fodhelper.exe'
          - '\computerdefaults.exe'
          - '\sdclt.exe'
          - '\eventvwr.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What action was performed with elevated privileges after the bypass?
  context: UAC bypass is a means to an end -- attackers elevate to install persistence, dump
    credentials, tamper with security tools, or reach protected resources. A non-elevated
    process spawning a High- or System-integrity child that lacks a standard elevation lineage
    is the parent-child anomaly this bypass produces. Examine processes running at high
    integrity shortly after the hijack to identify the objective; watch for credential-dumping,
    persistence-installing, or defense-tampering tools among them.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were other registry modifications made on this host in the same session?
  context: Attackers who modify one registry key often modify several -- staging a handler
    key for elevation while also setting a Run key, disabling a protection, or changing a
    firewall rule. Registry tampering that clusters within a short window (a tunable window
    on the order of tens of seconds to minutes distinguishes a hands-on session from benign
    admin activity) reveals the full scope of the configuration changes and whether multiple
    objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the hijack
    reveals what led to it and what followed -- reconnaissance, the interpreter that wrote
    the key, or the elevated payload. Aggregating by process and parent collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts, which is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this shell\open\command key been modified before on this host?
  context: A first-time modification to a handler key is more suspicious than a routine
    change. Per-user shell command-verb keys under HKCU\Software\Classes should rarely
    change; zero or very low history for this key indicates it has not been touched before,
    which weighs toward a deliberate hijack rather than software behavior. Compare historical
    Details values to see whether the same command is set repeatedly or this write is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same DelegateExecute write across multiple hosts may indicate a widespread
    implant or a pushed change rather than a single targeted elevation; a modification seen
    only on this host is more likely targeted. Compare the Details value and writing process
    across hosts to judge whether the activity is consistent automation or one-off hands-on
    edits.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other privilege escalation or UAC-bypass detections raised on this host?
  context: Attackers who attempt one UAC bypass often try several methods until one succeeds,
    especially if the OS version or configuration blocks a technique. Multiple bypass or
    escalation detections from the same user or host in a short span point to deliberate
    privilege-escalation activity rather than an isolated false positive. Look for escalation
    followed by credential access or defense tampering.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or
    credential access -- may reveal the stages that preceded the elevation and help
    reconstruct the timeline. A privilege-escalation attempt following earlier suspicious
    activity carries more weight than one that appears with no lead-up.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
