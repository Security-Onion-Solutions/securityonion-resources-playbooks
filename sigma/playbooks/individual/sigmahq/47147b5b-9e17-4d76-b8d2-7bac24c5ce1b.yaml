- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    browser-store copy reveals what led to it and what followed - reconnaissance of
    other credential sources, archiving of the copied data, or outbound transfer.
    Novel parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, defense tampering, or
    other credential access - may reveal the attack stages that preceded the browser
    credential theft and help reconstruct the full timeline. Credential collection is
    often a mid-stage action, so prior alerts give context for how the actor reached
    the point of reading saved browser logins.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was the copy tool executed from an expected system path?
  context: esentutl.exe, xcopy.exe, and robocopy.exe normally live in System32 or
    SysWOW64. The same binary running from a user-writable directory such as a temp
    folder, Downloads, or a profile path may have been copied or renamed to evade
    path-based allowlists, which is more consistent with operator tooling than with a
    routine administrative copy. Compare the image path and OriginalFileName from the
    alert against the expected location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other copy or download utilities used to stage data on this host
    recently?
  context: An operator who copies one browser store often collects from several
    credential sources using whatever copy and download utilities are already present.
    Finding other copy or transfer LOLBins running on the host in the same period -
    particularly against credential stores, archives, or staging directories -
    strengthens the case that this is deliberate collection rather than a one-off
    profile copy.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\xcopy.exe'
          - '\robocopy.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\diskshadow.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the rule's browser-store copy pattern over
