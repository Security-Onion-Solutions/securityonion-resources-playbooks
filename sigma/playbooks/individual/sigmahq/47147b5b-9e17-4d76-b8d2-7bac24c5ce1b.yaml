- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    browser-store copy was a single event or part of activity spanning multiple
    endpoints. If the same user copied credential stores or ran related tooling on
    other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
      - CommandLine|contains:
        - copy-item
        - 'copy '
        - 'cpi '
        - ' cp '
        - 'move '
        - move-item
        - ' mi '
        - ' mv '
      - Image|endswith:
        - \esentutl.exe
        - \xcopy.exe
        - \robocopy.exe
      - OriginalFileName:
        - esentutl.exe
        - XCOPY.EXE
        - robocopy.exe
      selection_path:
        CommandLine|contains:
        - \Amigo\User Data
        - \BraveSoftware\Brave-Browser\User Data
        - \CentBrowser\User Data
        - \Chromium\User Data
        - \CocCoc\Browser\User Data
        - \Comodo\Dragon\User Data
        - \Elements Browser\User Data
        - \Epic Privacy Browser\User Data
        - \Google\Chrome Beta\User Data
        - \Google\Chrome SxS\User Data
        - \Google\Chrome\User Data\
        - \Kometa\User Data
        - \Maxthon5\Users
        - \Microsoft\Edge\User Data
        - \Mozilla\Firefox\Profiles
        - \Nichrome\User Data
        - \Opera Software\Opera GX Stable\
        - \Opera Software\Opera Neon\User Data
        - \Opera Software\Opera Stable\
        - \Orbitum\User Data
        - \QIP Surf\User Data
        - \Sputnik\User Data
        - \Torch\User Data
        - \uCozMedia\Uran\User Data
        - \Vivaldi\User Data
      _pb_scope:
        ParentName|expand: '%ParentName%'
