  context: A browser-profile-copy pattern with no prior history on a host is more
    suspicious than one used regularly under stable parents - for example a recurring
    backup job. This query mirrors the rule's selection structure scoped to this host,
    so the resulting count reflects the rule's specific firing pattern rather than
    generic copy activity. The CommandLine projection lets the analyst compare typical
    invocation patterns against the alerting one.
  range: -90d
