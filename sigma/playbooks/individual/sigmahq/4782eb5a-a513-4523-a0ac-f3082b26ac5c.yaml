name: Mshtml.DLL RunHTMLApplication Suspicious Usage
id: d9ebaff8-e1a5-4e06-b053-991a9555bfb8
description: |
  Detects a process whose command line abuses the mshtml.dll RunHTMLApplication
  export to run arbitrary code through a protocol handler (javascript, vbscript,
  file, http). The rule fires when a single command line contains a path-traversal
  sequence (\..\) together with mshtml AND either the RunHTMLApplication export name
  or its ordinal #135. This pattern is the rundll32 LOLBIN primitive that loads
  inline or remote script - including JavaScript fetched over http:// or file:// -
  and is used to bypass detection that pattern-matches the exact two-levels-up
  traversal, since extra \..\ segments do not change the runtime behavior. Almost
  no legitimate workflow calls RunHTMLApplication this way, so the investigation
  should determine which binary carried the command line, what protocol handler and
  payload it invoked, what the process did next, and whether the same pattern
  appears elsewhere on the host or fleet.
type: detection
detection_id: 4782eb5a-a513-4523-a0ac-f3082b26ac5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: 'Does the command line contain a \..\ traversal with mshtml and either
    RunHTMLApplication or the ordinal #135, matching what this rule detects?'
  context: 'Before investing investigation time, confirm the alert is a true positive.
    The rule fires when one command line contains a path-traversal sequence (\..\) and
    mshtml AND either the RunHTMLApplication export name or its ordinal #135. Read the
    exact command line and note the protocol handler that precedes it (javascript,
    vbscript, file, or http) and any inline script or URL that follows, since those
    determine what code the export was asked to run.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run rundll32 with the mshtml
    RunHTMLApplication export?
  context: Calling mshtml,RunHTMLApplication through rundll32 has effectively no routine
    administrative use. Most users and most endpoints never invoke it. Knowing whether
    the acting account and the host function involve any workflow that could plausibly
    produce this call is often the fastest path to separating a rare benign case from
    deliberate LOLBIN abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which protocol handler and payload did the RunHTMLApplication call invoke,
    and is the script inline or fetched from a remote location?
  context: The full command line reveals what the export was asked to run. Identify the
    protocol handler before the traversal (javascript, vbscript, file, or http) and
    decode whatever follows it. Inline script that pops a shell, a GetObject("script:...")
    call that pulls a remote SCT, or a file:// or http:// reference each point to a
    different stage; a URL or remote host in the command line is a download-and-run
    cradle, while a self-contained inline payload runs entirely in memory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the rundll32 RunHTMLApplication invocation, and is
    that parent chain expected?
  context: The parent process reveals how the command line was launched. A console shell
    started by a user looks different from a script host, mshta.exe, an Office
    application, or a browser child spawning rundll32 with this export. An unexpected
    parent points to automated or malicious invocation - a macro, a phishing payload,
    or a downloaded script - rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the RunHTMLApplication invocation spawn, and do
    any of them indicate payload execution?
  context: RunHTMLApplication exists to execute script, and that script commonly spawns
    follow-on processes - a shell, a script host, a download utility, or the final
    payload. Children scoped to this exact invocation show what the loaded code actually
    did. Unexpected descendants such as cmd.exe, powershell.exe, wscript.exe, or
    certutil.exe are the post-exploitation step the export enabled, while no children
    may mean the script ran in-process or failed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Did this process make any outbound network connections, and to what
    destinations?
  context: A protocol handler such as http:// in a RunHTMLApplication call fetches and
    runs remote script, so the same process or its children may reach out to download a
    second-stage payload. Reviewing outbound connections tied to this activity shows
    whether the loaded code pulled remote content and to which host. An external
    destination not associated with normal browsing or update traffic is the egress the
    cradle used and a candidate indicator to pivot on across the environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Initiated
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    RunHTMLApplication invocation was a single event or part of activity spanning
    multiple endpoints. If the same user triggered similar execution on other hosts,
    the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    RunHTMLApplication invocation reveals what led to it and what followed - the parent
    that staged the process, reconnaissance, or follow-on execution the loaded script
    carried out. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - phishing-stage execution,
    reconnaissance, or other defense evasion - may reveal the stages that preceded the
    RunHTMLApplication invocation and help reconstruct the full timeline. LOLBIN script
    execution is often one step in a sequence, so prior alerts give the context for why
    this export was called.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: 'When this host has previously fired the rule''s mshtml RunHTMLApplication
    pattern, what parents and users normally drive it, and does the current alert fit?'
  context: This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic rundll32 activity. Given how rarely this export
    pattern appears legitimately, a first-ever occurrence on the host is itself
    notable; a new parent process or an unexpected account against a small prior history
    is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's mshtml RunHTMLApplication pattern in the
    past week, and does the cross-host distribution look like automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the mshtml RunHTMLApplication firing pattern rather
    than generic rundll32 activity. Many hosts firing the same pattern would be unusual
    for an export with no common benign use and points to a scripted deployment or a
    spreading operation; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \..\
        - mshtml
        CommandLine|contains:
        - '#135'
        - RunHTMLApplication
      condition: selection
    fields:
    - host.name
