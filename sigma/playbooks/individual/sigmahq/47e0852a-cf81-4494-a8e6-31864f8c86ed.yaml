name: Pandemic Registry Key
id: 39978a44-7570-405b-b9b4-9ee6f202fd82
description: |
  Detects the registry indicator left by the Pandemic Windows implant, which registers a filesystem-filter driver by writing an Instance subkey under the Null service key (HKLM\SYSTEM\CurrentControlSet\services\null\Instance...). Pandemic is a persistent implant that trojans executables on-the-fly as they are served from an SMB file share to remote users, so the driver registration and its registry configuration are the on-host footprint of the implant. Legitimate software does not create an Instance subkey under the Null service; investigation should confirm the exact key and value data, identify the process and account that wrote it, determine whether the referenced driver was loaded, and establish whether the same key was written on other hosts.
type: detection
detection_id: 47e0852a-cf81-4494-a8e6-31864f8c86ed
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match the Pandemic Null-service Instance indicator this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact key path under \SYSTEM\CurrentControlSet\services\null\Instance and the writing process against the rule's detection criteria. A genuine hit registers a driver Instance under the Null service, which normal Windows configuration does not create.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host and the account that wrote the key expected to register a service driver?
  context: Driver registration under a service key is a privileged operation normally performed by installers running as SYSTEM. Knowing whether the writing process and account are consistent with legitimate driver installation on this host is often the fastest way to separate a true positive from expected activity. User attribution is present on most endpoint registry events; when it is SYSTEM or a machine account, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact key and value were written under the Null service, and does the data register a driver Instance?
  context: The implant writes an Instance subkey under HKLM\SYSTEM\CurrentControlSet\services\null to register its filesystem-filter driver. The value name and data determine which driver file is registered and how it loads. Compare the written path and data against a known-clean baseline for the Null service, which on an uninfected host carries no Instance subkey.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the key, and does it reference a driver file or image path?
  context: Registry value data for a driver registration typically points at a .sys file path or configures load behavior. Decode the Details field for a file path (often outside the usual driver directories), an image path, or load-order settings. A referenced path becomes a follow-on artifact to retrieve and analyze. Details is populated for most registry modifications but is absent when the value data is binary or empty.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the Null-service Instance registration persist, or was it re-modified after the alert?
  context: Registry key and value deletion is not observable in this telemetry, so the absence of a delete event does not mean the key was removed. Judge persistence from the key's re-modification history in the window after the alert and from whether the registered driver was subsequently loaded. Repeated writes to the same key indicate an active install or repair loop rather than a one-off change.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the registry key, and what parent chain launched it?
  context: Driver registration is normally performed by a signed installer or the Service Control Manager. An unexpected writer — a script host, a freshly dropped binary, or an interactive shell — points to attacker-driven registration rather than a legitimate install. This retrieves the parent of the writing process; walk further up the tree when the immediate parent is itself unusual, and tune out known-good installer and updater parents when baselining.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the process that wrote the registry key also drop a driver or payload file to disk?
  context: 'The registered driver must exist on disk as a .sys file for the implant to load. Correlating the writing process''s file activity reveals whether the driver or other payload was written in the same session and where it lives, enabling retrieval and analysis. Uncommon drop locations — ProgramData, Public, or temp directories outside the normal driver store — are worth noting.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the writing process or its children write to disk around the alert?
  context: A driver install rarely lands alone — the same process or a child may write configuration, a loader, or staged payloads. Surfacing the full file-write footprint of the writing process and its direct children reveals the broader scope of the install. This catches the process and its direct children, not grandchildren or unrelated writers.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the install spawned helper processes, what are their executable hashes and are they known to threat intelligence?
  context: File-write events carry no hash in this telemetry; the hash needed for a reputation lookup is recorded when a process executes. This returns the children and siblings of the writing process with their executable hashes. A kernel driver loaded by the implant will not appear as a child process here — retrieve the .sys file from the on-disk path surfaced by the file-write question and hash it manually for reputation and sandbox analysis.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: After the key was written, did the registered driver's referenced binary or a helper process execute on this host?
  context: For persistence to be active, the configured payload must run. Check whether the driver's referenced
    image path or an associated helper executed on the host after the registration. A driver itself loads in
    kernel space and may not appear as a process; corroborate load from the driver's presence on disk and from
    subsequent file-serving behavior consistent with the implant. The query anchors on command lines carrying the
    written value data and on the service and filter-manager utilities that load a minifilter; Pandemic's
    Instance values are often an altitude number or flags DWORD rather than a path, so a zero here is expected in
    that case — the value-data and file-drop questions cover the driver image itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_payload:
        CommandLine|contains|expand: '%Details%'
      selection_driver_tools:
        Image|endswith:
        - '\sc.exe'
        - '\fltMC.exe'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: What other registry modifications were made on this host in the same session?
  context: An implant install often touches several keys — service registration, load-order, and configuration together. Registry changes from the same window and writing process reveal the full scope of the configuration and whether service, driver, and policy keys were modified as a set. If the host is registry-noisy, narrow to the writing process from the alert or to service and policy hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the Null service Instance key ever been modified before on this host?
  context: A first-time write to this key is far more suspicious than a recurring one. The Null service on a clean Windows host has no Instance subkey and is not modified in normal operation, so any historical write to this path is itself notable. Zero history indicates a key that has never been touched before this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same Null-service Instance key written on any other hosts in the environment?
  context: The same registration on multiple hosts points to lateral spread of the implant or a shared distribution source; the implant is documented to propagate to hosts that serve files over network shares. If only this host carries the write, it may be an initial or targeted infection. Compare value data across hosts to see whether the same driver is being registered.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the registration?
  context: The registry write rarely occurs in isolation. Examining process activity in the surrounding window reveals what led to the install and what followed — dropper execution, service control operations, or reconnaissance. Aggregating by process and parent collapses routine agent telemetry so novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the registration?
  context: Earlier detections on the same host — dropper execution, defense tampering, or privileged operations — may reveal the stages that preceded the driver install and help reconstruct the timeline. The sequence of alerts on the host often tells the fuller story of how the implant arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the process that wrote the registry key make network connections around the install time?
  context: Ingress tool transfer often precedes an install — the process fetches the driver or loader from an external source before writing it to disk and registering it. Reviewing outbound connections from the writing process, especially to external destinations rather than internal hosts, helps establish how the payload arrived. Filter known-good updater destinations when baselining.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
