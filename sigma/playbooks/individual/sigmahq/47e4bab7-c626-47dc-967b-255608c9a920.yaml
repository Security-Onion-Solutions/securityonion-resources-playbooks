name: Permission Misconfiguration Reconnaissance Via Findstr.EXE
id: 78d30fd5-4173-46ce-81c5-0d4b5509f7a3
description: |
  Detects find.exe or findstr.exe being used to grep for Windows permission
  principals such as "Everyone" or "BUILTIN\", a pattern used to spot files,
  folders, or service binaries writable by low-privilege groups. The rule fires
  when EITHER the binary is find/findstr AND its command line carries an
  Everyone/BUILTIN permission keyword, OR a single command line chains icacls,
  findstr, and Everyone together. This is the canonical findstr step of a
  privilege-escalation enumeration sequence, where the output of icacls, reg
  query, sc, or wmic is piped into findstr to surface permission, credential,
  or autostart keywords. Some administrators and audit scripts run the same
  check legitimately, so the investigation should determine which branch fired,
  what the full command was grepping for, what process drove it, and whether
  the activity is isolated or part of a broader enumeration sweep.
type: detection
detection_id: 47e4bab7-c626-47dc-967b-255608c9a920
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did findstr run against an Everyone or BUILTIN permission keyword, or did
    a single command line chain icacls, findstr, and Everyone together?
  context: Before investing investigation time, confirm the alert is a true positive
    and note which branch fired, because the branch changes what the downstream
    questions weigh. The rule fires when EITHER find.exe or findstr.exe runs with a
    command line containing an Everyone or BUILTIN permission token, OR a single
    command line contains icacls, findstr, and Everyone together. Read the full
    command line, confirm which condition matched, and record the exact keyword and
    any piped-in command (icacls, reg, sc, wmic, dir) it was grepping.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to audit file, folder, or service
    permissions with command-line tools?
  context: Legitimate administrators, audit scripts, and software inventory tools run
    icacls-into-findstr permission checks routinely. Most standard user accounts and
    most endpoints never grep for Everyone or BUILTIN principals from the command
    line. Knowing whether the acting account and host function involve permission
    auditing or privilege management separates a sanctioned check from low-privilege
    reconnaissance for a writable path to abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What permission target was findstr grepping for, and what command produced
    the data it filtered?
  context: The recon value is in what the command line searched. icacls output filtered
    for Everyone or BUILTIN\Users hunts for files or service binaries a low-privilege
    group can overwrite; findstr against reg query or sc output hunts for stored
    credentials, AlwaysInstallElevated, or unquoted service paths. Read the full
    command line to identify the principal token, the source command feeding the
    pipe, and the file or registry scope being enumerated, since that determines what
    escalation path the operator was probing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the same host run other permission or credential enumeration commands
    chained into findstr around this time?
  context: A single findstr permission check is rarely the whole activity. The same
    enumeration sequence typically grep-chains multiple sources - icacls for writable
    paths, reg query for stored passwords or AlwaysInstallElevated, sc and wmic for
    unquoted or writable service binaries, dir for credential-bearing files. This
    query surfaces other findstr or icacls invocations on the host so the analyst can
    judge whether this was an isolated check or one step in a systematic privilege
    enumeration sweep.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_recon:
        CommandLine|contains:
          - 'findstr '
          - 'icacls '
          - 'reg query '
          - 'sc qc '
          - 'sc queryex '
          - 'wmic service '
          - 'whoami /priv'
          - 'whoami /all'
      condition: selection_host and selection_recon
    fields:
      - Image
      - CommandLine
      - User
- question: What process spawned findstr, and is that parent chain expected for a
    permission audit?
  context: The parent reveals how findstr was driven. Interactive auditing usually
    shows cmd.exe or an administrative console as the parent. A parent such as a
    script host, mshta.exe, an Office application, or a remote-execution service
    points to automated or operator-driven enumeration rather than a sanctioned
    check, and walking up the parent chain shows what staged the activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this host access XML files on a SYSVOL or domain share around the time
    of the findstr activity?
  context: Permission and credential enumeration on a domain-joined host frequently
    extends to Group Policy Preference files on the SYSVOL share, where cpassword
    values can be decrypted offline. File-share access events for XML files under a
    domain SYSVOL path, correlated with the findstr recon, indicate the operator
    moved from local permission checks to stored-credential hunting. Scope this to
    the alerting host and the SYSVOL share; if Security file-share auditing is not
    collected, treat zero results as a visibility gap rather than evidence nothing
    occurred.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 5145
        ShareName|contains: 'SYSVOL'
      filter_other:
        RelativeTargetName|endswith: '.xml'
      condition: selection and filter_other
    fields:
      - SubjectUserName
      - RelativeTargetName
      - ShareName
- question: Which accounts or service binaries could be exposed by the permissions the
    recon surfaced, and do any carry elevated privileges?
  context: The severity depends on what the enumeration found. A world-writable service
    binary running as SYSTEM, or a stored credential for a privileged or service
    account, is a direct escalation path; a writable path with no privileged context
    may only need monitoring. Cross-reference any account, service, or path named in
    the command line against Active Directory and service configuration to judge what
    a successful follow-on would grant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains:
        - '"Everyone"'
        - '''Everyone'''
        - '"BUILTIN\\"'
        - '''BUILTIN\'''
      selection_special:
        CommandLine|contains|all:
        - 'icacls '
        - 'findstr '
        - Everyone
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains:
        - '"Everyone"'
        - '''Everyone'''
        - '"BUILTIN\\"'
        - '''BUILTIN\'''
      selection_special:
        CommandLine|contains|all:
        - 'icacls '
        - 'findstr '
        - Everyone
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    permission reconnaissance was a single event or part of activity spanning multiple
    endpoints. If the same user ran similar enumeration on other hosts, the scope of
    the activity is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains:
        - '"Everyone"'
        - '''Everyone'''
        - '"BUILTIN\\"'
        - '''BUILTIN\'''
      selection_special:
        CommandLine|contains|all:
        - 'icacls '
        - 'findstr '
        - Everyone
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    findstr recon reveals what led to it and what followed - the parent that staged
    the enumeration, other discovery commands, or follow-on execution. Novel
    parent-child pairs at low counts are what to scan for against the high-count noise
    of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - initial execution, reconnaissance, or
    credential access - may reveal the attack stages that preceded the permission
    enumeration and help reconstruct the timeline. Permission recon is typically a
    mid-sequence step, so prior alerts give the context for why the operator was
    hunting for a writable path or stored credential.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's find/findstr permission
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate audit scripts run icacls-into-findstr permission checks.
    This query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing pattern
    has historically run here, not generic findstr usage. A new parent process, an
    unexpected account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains:
        - '"Everyone"'
        - '''Everyone'''
        - '"BUILTIN\\"'
        - '''BUILTIN\'''
      selection_special:
        CommandLine|contains|all:
        - 'icacls '
        - 'findstr '
        - Everyone
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_findstr_* or selection_special) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's find/findstr permission pattern in the
    past week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the find/findstr permission firing pattern rather
    than generic findstr activity. Many hosts firing the same pattern points to an
    audit job or software inventory routine that runs the check by design; one host or
    a small unrelated set points to manual operator reconnaissance. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_findstr_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_findstr_cli:
        CommandLine|contains:
        - '"Everyone"'
        - '''Everyone'''
        - '"BUILTIN\\"'
        - '''BUILTIN\'''
      selection_special:
        CommandLine|contains|all:
        - 'icacls '
        - 'findstr '
        - Everyone
      condition: all of selection_findstr_* or selection_special
    fields:
    - host.name
