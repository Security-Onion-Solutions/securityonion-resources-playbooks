name: Wow6432Node Windows NT CurrentVersion Autorun Keys Modification
id: c683e841-87de-4293-943a-dcabf8180013
description: |
  Detects modification of a 32-bit-on-64-bit (Wow6432Node) autostart extensibility point under
  HKLM\SOFTWARE\Wow6432Node\Microsoft\Windows NT\CurrentVersion. The rule fires when a value is
  written under this tree AND specifically under one of the AppInit_Dlls, Image File Execution
  Options, or Drivers32 subkeys, while excluding empty or null value writes and creation of the
  Image File Execution Options base key itself. These locations run code at process start or
  logon: an AppInit_Dlls entry forces a DLL into every process that loads user32.dll, an Image
  File Execution Options Debugger entry hijacks a named target executable, and Drivers32 maps
  audio/codec drivers. Legitimate installers occasionally touch these keys, so the investigation
  should establish which subkey and value changed, the executable or DLL path now registered, the
  process that wrote it, and whether that payload subsequently executed.
type: detection
detection_id: 480421f9-417f-4d3b-9552-fd2728443ec8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Which Wow6432Node autorun subkey and value data triggered this alert?
  context: >-
    Confirm the alert is a true positive by reviewing the exact registry path (TargetObject) and
    the writing process. The rule requires a write under \SOFTWARE\Wow6432Node\Microsoft\Windows
    NT\CurrentVersion AND under one of \Windows\Appinit_Dlls, \Image File Execution Options, or
    \Drivers32, with a non-empty value; empty or null writes and creation of the Image File
    Execution Options base key are filtered out. Note which of the three subkey families fired,
    because it determines the execution mechanism and which downstream questions carry weight:
    an AppInit_Dlls value points to a DLL loaded into every user32.dll process, an Image File
    Execution Options Debugger value hijacks a named executable, and a Drivers32 value maps a
    codec/driver.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify autostart extensibility registry keys?
  context: >-
    Legitimate installers and administrators occasionally write AppInit_Dlls, Image File Execution
    Options, or Drivers32 values, but routine end-user or server workloads should not. Knowing
    whether the writing account and host function are consistent with software deployment is often
    the fastest way to separate an installation from tampering. User attribution is present on
    most endpoint registry events; when the value is a machine account or SYSTEM, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which autorun subkey was modified, and is it a known persistence or proxy-execution location?
  context: >-
    The specific subkey determines intent. AppInit_Dlls injects a DLL into every process that
    loads user32.dll and is a classic global-injection persistence point. An Image File Execution
    Options Debugger value redirects execution of a named binary to an attacker-chosen program.
    Drivers32 maps audio codecs and drivers loaded by media subsystems. Read the value name and
    data alongside the writing process to judge whether the location and the payload it points to
    are consistent with installed software.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable or DLL path was written into the autorun value, and what does it resolve to?
  context: >-
    The value data (Details) holds the payload the subkey will execute. For AppInit_Dlls it is a
    DLL path, for an Image File Execution Options Debugger entry it is the program that will launch
    in place of the target, and for Drivers32 it is a driver/codec module name. Decode the path:
    unusual locations (Temp, AppData, ProgramData, user-writable directories), unsigned or
    unfamiliar binaries, or a name masquerading as a system file are the indicators of malicious
    intent. Value data is populated on roughly four in five endpoint registry modifications; if it
    is absent for a binary value, retrieve it directly from the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the autorun value persist, or was it re-modified after the initial write?
  context: >-
    Endpoint telemetry does not emit registry key or value deletion events, so attacker cleanup of
    the key cannot be observed directly. Judge whether the persistence is stable from the key's
    re-modification history over a longer window and from whether the configured payload ran. A
    single write that is never revisited, an installer overwriting it back to a benign value, or a
    value that flips repeatedly each tell a different story about how the entry is being managed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Actors who set one autostart value often make several changes together — stacking a second
    persistence key, disabling a security policy, or adjusting a service configuration. Registry
    changes clustered within a short window from the same writing process reveal the full scope of
    the configuration changes and whether multiple objectives were pursued. The triggering key
    appears in the results; the signal is what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Was the executable or DLL referenced by the autorun value written to disk on this host?
  context: >-
    An autostart entry only executes if the payload it points to exists at the referenced path.
    Correlating file activity by the registry-writing process and its children shows whether the
    DLL or executable named in the value was dropped, usually in the same session as the registry
    write. The file-write event carries no hash; if the payload is present, hash it from a later
    execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the executable or command configured in the autorun value run on this host afterward?
  context: >-
    AppInit_Dlls and Drivers32 entries load at the next process start or media-subsystem
    initialization; an Image File Execution Options Debugger entry runs when its target executable
    is launched. Reviewing process executions on the host after the registry write and matching
    them against the payload path from the value data confirms whether the persistence is active
    and the code actually executed. The query anchors on command lines carrying the written value
    data, which surfaces an IFEO Debugger command firing with its target. AppInit_Dlls and
    Drivers32 payloads load inside host processes without a new command line, so a zero is
    expected for DLL entries — the value-data question identifies the payload path to hunt in
    module-load telemetry instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_payload:
        CommandLine|contains|expand: '%Details%'
      condition: selection and selection_payload
    fields:
      - Image
      - CommandLine
- question: Has this autorun key been modified before on this host?
  context: >-
    AppInit_Dlls, Image File Execution Options, and Drivers32 values change rarely outside of
    software installation, so a first-time modification is more notable than a recurring one. A
    history that shows the same value being set by a known installer reads very differently from a
    key that has never been touched before. Compare the historical value data and writing process
    against the current write.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this autorun key modified on other hosts in the environment?
  context: >-
    The same modification across many hosts may indicate a group-policy push or a widely deployed
    installer; the same modification on only this host is more likely targeted. Compare the value
    data set on each host — a uniform benign value across the fleet points to legitimate software,
    while divergent or host-specific payloads point to hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process spawned the process that wrote the autorun key, and is that chain expected?
  context: >-
    The writing process is visible on the alert; tracing its own origin (the grandparent) shows
    whether the modification came from a legitimate execution chain — an installer launched by a
    package manager, a management agent — or a suspicious one such as a script host or Office
    application spawning the writer. Legitimate autorun changes typically originate from
    installer or deployment tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Actors rarely rely on a single foothold. Alongside an autorun-key modification, they commonly
    stack backup mechanisms using different techniques — scheduled tasks, services, additional
    registry keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same
    timeframe point to intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or
    script into a Startup folder or a path referenced by a Run key establishes persistence without
    running schtasks, sc, or reg. File monitoring captures these drops even when the actor avoids
    standard persistence tooling, and a drop clustered with the autorun-key write indicates a
    layered foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Process activity in the minutes surrounding the registry
    write reveals the immediate context — what launched the writing process, what ran before and
    after, and whether the change is part of a larger sequence such as reconnaissance, privilege
    escalation, or additional persistence. Novel parent-child pairs stand out at low counts while
    routine agent telemetry collapses into high-count rows.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the attack stages that preceded the autorun modification and help reconstruct the
    timeline. Persistence is commonly established after an initial foothold, so a preceding
    execution or tampering alert reframes this write as a later stage of an ongoing operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, deployment, or documented approval for this registry change?
  context: >-
    Many organizations require change records for software deployment and persistence-relevant
    configuration changes. A corresponding ticket or a known installer rollout suggests authorized
    activity; the absence of one where policy requires it suggests the modification was
    unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
