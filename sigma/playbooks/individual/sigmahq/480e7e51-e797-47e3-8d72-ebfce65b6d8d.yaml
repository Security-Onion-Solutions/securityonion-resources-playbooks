name: Python Spawning Pretty TTY on Windows
id: 6fd0f8c5-e998-4ccd-ae0b-19126287170e
description: |
  Detects a python.exe, python3.exe, or python2.exe process whose command line
  carries the canonical "spawn a pretty TTY" pattern. The rule fires when the
  image is one of the python binaries AND the command line matches either branch:
  it contains both 'import pty' and '.spawn(', OR it contains 'from pty import
  spawn'. This one-liner is the standard way to upgrade a dumb shell - the kind
  obtained from an exploited service or reverse-shell payload - into a fully
  interactive terminal, so it commonly appears right after a web application or
  command interpreter is compromised. Python interactive sessions are also normal
  on developer and data-engineering workstations, so the investigation should
  determine which command line branch fired, what shell or target the pty was
  spawned for, what process launched python, and whether the activity fits how
  this user and host normally run python.
type: detection
detection_id: 480e7e51-e797-47e3-8d72-ebfce65b6d8d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line spawn a pty - either 'import pty' together with
    '.spawn(', or 'from pty import spawn' - on a python binary, matching this rule?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the image is python.exe, python3.exe, or python2.exe AND the
    command line matches either branch - it contains both 'import pty' and '.spawn(',
    or it contains 'from pty import spawn'. Read the exact command line and note which
    branch fired and what the pty was spawned for. The branch and the spawn target
    (commonly a shell path or a socket-backed file descriptor) determine which
    downstream questions carry weight, so record both.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run python interactive pty sessions?
  context: Interactive python pty upgrades are routine for a narrow set of developers,
    data engineers, and automation workflows, and unusual everywhere else. Knowing
    whether the acting account and the host function involve python development or
    scripted automation is often the fastest path to separating a benign interactive
    session from a shell upgrade following a service compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the python pty command line do - which pty branch ran, and what
    shell or descriptor was spawned?
  context: The full command line reveals the operational purpose. Read which branch
    fired ('import pty' plus '.spawn(', or 'from pty import spawn') and decode the
    argument passed to spawn - a shell path such as /bin/bash or cmd.exe, a connected
    socket file descriptor for a reverse shell, or an inline -c payload. The spawn
    target tells you whether this is a local interactive session or a remote shell
    being upgraded to a full terminal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'import pty'
          - 'from pty import spawn'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the pty spawn paired with a reverse-shell or socket setup on the same
    command line?
  context: A pty upgrade by itself is interactive convenience; paired with socket or
    network plumbing it is shell delivery. Inspect the command line for tokens that
    connect the pty to a network endpoint - socket.socket, connect(, os.dup2, or an
    inline IP and port - which indicate the interactive terminal is being bound to a
    remote operator rather than a local console. The presence of these tokens raises
    the spawn from local convenience to remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pty:
        CommandLine|contains:
          - 'import pty'
          - 'from pty import spawn'
      selection_socket:
        CommandLine|contains:
          - 'socket.socket'
          - 'connect('
          - 'os.dup2'
          - '.spawn('
      _pb_scope:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: (selection_pty and selection_socket) and _pb_scope
    fields:
      - CommandLine
      - Image
- question: What process spawned this python binary, and is that parent chain expected?
  context: The parent process reveals how python was invoked. A pty upgrade following
    a service compromise typically shows an unexpected parent - a web application
    process, a command interpreter spawned by a server daemon, or a shell launched by
    an internet-facing service - rather than an interactive console or IDE. Interactive
    development usually shows explorer.exe, a terminal, or an IDE as the parent; a
    server or interpreter parent points to a shell obtained through exploitation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the process tree above python a server or service interpreter rather
    than an interactive session?
  context: Walking the chain above python distinguishes an interactive developer
    session from a shell obtained through a compromised service. A grandparent that is
    a web or application server, a database engine, or a network-facing daemon - with
    an intermediate command interpreter between it and python - is the fingerprint of
    a pty being spawned to upgrade a shell delivered by exploitation. An interactive
    console or IDE grandparent is the benign pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentProcessGuid
      - CommandLine
- question: What did python and its children do on this host in the hour after the pty
    was spawned?
  context: Upgrading to an interactive terminal is a setup step; the operator's actual
    activity follows. Examining process creation in the window immediately after the
    spawn reveals what the interactive shell was used for - reconnaissance commands,
    credential file access, additional payload retrieval, or lateral movement attempts.
    A burst of shell and tooling activity right after the pty spawn points to hands-on
    operator use rather than an idle development session.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - python.exe
        - python3.exe
        - python2.exe
      selection_cli_1:
        CommandLine|contains|all:
        - import pty
        - .spawn(
      selection_cli_2:
        CommandLine|contains: from pty import spawn
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - python.exe
        - python3.exe
        - python2.exe
      selection_cli_1:
        CommandLine|contains|all:
        - import pty
        - .spawn(
      selection_cli_2:
        CommandLine|contains: from pty import spawn
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    pty spawn was a single event or part of activity spanning multiple endpoints. If
    the same user triggered similar interactive shell activity on other hosts, the
    scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - python.exe
        - python3.exe
        - python2.exe
      selection_cli_1:
        CommandLine|contains|all:
        - import pty
        - .spawn(
      selection_cli_2:
        CommandLine|contains: from pty import spawn
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the pty
    spawn reveals what led to it and what followed - the service or shell that staged
    python, reconnaissance, or follow-on execution the interactive terminal enabled.
    Novel parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - exploitation of an internet-facing
    service, web shell activity, or reconnaissance - may reveal the attack stages that
    preceded the pty spawn and help reconstruct the full timeline. Upgrading to an
    interactive terminal is usually one step in a sequence, so prior alerts give the
    context for why the shell was being made interactive.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's python pty pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate interactive use can spawn a pty. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic python activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - python.exe
        - python3.exe
        - python2.exe
      selection_cli_1:
        CommandLine|contains|all:
        - import pty
        - .spawn(
      selection_cli_2:
        CommandLine|contains: from pty import spawn
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's python pty pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the python pty firing pattern rather than generic
    python activity. Many hosts firing the same pattern points to a build pipeline or
    scripted deployment that spawns a pty by design; one host or a small unrelated set
    points to manual operator activity following a host-local compromise. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - python.exe
        - python3.exe
        - python2.exe
      selection_cli_1:
        CommandLine|contains|all:
        - import pty
        - .spawn(
      selection_cli_2:
        CommandLine|contains: from pty import spawn
      condition: selection_img and 1 of selection_cli_*
    fields:
    - host.name
