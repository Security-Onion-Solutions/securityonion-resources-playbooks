name: UAC Disabled
id: 814aa910-81f3-4926-8a2f-5e10284f4476
description: |
  Detects a registry modification that turns off User Account Control by setting the EnableLUA policy value under HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System to 0 (DWORD 0x00000000). Disabling UAC removes the elevation-consent boundary for administrative actions and usually takes full effect after a reboot, easing privilege abuse and defense evasion for follow-on activity. The rule fires when the alerting event both targets the EnableLUA policy value and writes a value of 0; investigate which process wrote the value, whether companion UAC policy values were toggled alongside it, and what elevated activity followed.
type: detection
detection_id: 48437c39-9e5f-47fb-af95-3d663c3f2919
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the alerting registry write set EnableLUA to 0 under the System policies key?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires both conditions together — the target value is EnableLUA under CurrentVersion\Policies\System AND the data written is DWORD (0x00000000), which is the "off" state. Review the exact key path, value data, and writing process against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify UAC security policy values?
  context: Legitimate administrative activity, imaging, or a Group Policy push can set UAC policy values. Knowing whether the user role and host function are consistent with security-policy changes is often the fastest way to separate routine administration from tampering. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or absent, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified key a known security-policy location, and does the value disable a protection?
  context: The EnableLUA value under CurrentVersion\Policies\System governs whether User Account Control is enforced. A DWORD of 0 disables the consent prompt entirely, unlike keys that merely tune behavior. This location changing at all is notable because production policy is normally managed centrally, not written ad hoc by a local process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to EnableLUA, and does it disable UAC?
  context: Decode the Details field. DWORD (0x00000000) is 0, which switches UAC off; DWORD (0x00000001) is 1, the enabled state. A 0 in a security policy value is the disabling action the rule targets. Details is populated on about 79% of registry modifications; when it is absent, confirm the intended value from the writing process command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the disabled setting persist, or was EnableLUA re-enabled afterward?
  context: A value that is set to 0 and then quickly returned to 1 may reflect testing or a management tool reconciling policy, whereas a 0 that stays in place leaves UAC off until a reboot applies it. Registry key or value deletions are not observable in this telemetry, so judge persistence from the key's later modification history — a subsequent write returning EnableLUA to 1 indicates re-enablement.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote EnableLUA, and is its parent chain expected?
  context: The writing process and its command line reveal how the change was made — for example reg.exe with an ADD /v EnableLUA /d 0 argument, or powershell.exe running Set-ItemProperty. Legitimate policy changes usually descend from management tooling or an interactive admin shell; parents such as script hosts, Office applications, or remote-execution utilities point to a non-administrative origin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: Actors who tamper with one policy value often change several — disabling UAC alongside Defender settings, firewall rules, or a Run key for persistence. Clustering the registry writes on this host within a short window reveals the full scope of the configuration changes and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other UAC policy values under the System policies key also modified in the same window?
  context: A full UAC teardown frequently sets several sibling values together — ConsentPromptBehaviorAdmin to 0, PromptOnSecureDesktop to 0, FilterAdministratorToken, or LocalAccountTokenFilterPolicy. Companion changes under the same policy key confirm deliberate weakening of the elevation controls rather than a single stray value, and each value name shows exactly which control was relaxed.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows\CurrentVersion\Policies\System\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has EnableLUA been modified before on this host?
  context: Security policy values should change rarely and only through managed configuration. A history with no prior writes to this value makes a first-time change more notable, while regular modifications may reflect an existing management process. Compare the historical Details values to see whether the same setting is routinely applied.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was EnableLUA disabled on other hosts in the environment?
  context: The same change on many hosts may indicate a Group Policy update or widely deployed software, whereas a modification confined to this host suggests targeted activity. Comparing the writing process and value data across hosts distinguishes a centrally managed change from an ad hoc one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the change?
  context: Alerts rarely occur in isolation. Examining the process activity around the registry write reveals what led up to it and what followed — reconnaissance, credential access, or persistence steps. Aggregating by parent and child process collapses routine agent noise into high-count rows so that novel process pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host normally run the process that wrote this value?
  context: A writing process that has never or rarely been seen on this host is more notable than a routine management tool. Zero or very low historical counts for the binary indicate a first-time or uncommon execution, which raises the weight of the change it made.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What actions ran with elevated privileges after UAC was disabled?
  context: Disabling UAC removes the elevation-consent boundary so that administrative actions run without a prompt. Full effect usually requires a reboot, but reviewing high or system integrity process activity shortly after the change surfaces the objective — credential dumping, persistence installation, security-tool tampering, or lateral movement preparation.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were auto-elevated-binary UAC bypass registry hijacks also attempted on this host?
  context: Beyond turning UAC off outright, actors also hijack the registry keys that auto-elevated binaries read before running — ms-settings and mscfile shell open command entries, Classes\Folder handlers, Environment values, and DelegateExecute. Finding these command-line writes confirms broader elevation activity setting up a payload to run with elevated privileges.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Did other privilege-escalation or defense-evasion detections fire on this host?
  context: Actors who weaken UAC often make several attempts or pair the change with related tampering. Other detections on this host — additional UAC bypass alerts, defense-evasion, or credential-access findings in close succession — confirm deliberate escalation activity rather than an isolated configuration change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
