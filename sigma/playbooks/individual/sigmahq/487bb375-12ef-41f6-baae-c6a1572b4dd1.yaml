name: Potential Persistence Via Outlook Today Page
id: 23aa8c98-2b11-4980-bc4d-0d70126961f9
description: |
  Detects a value being written under the Outlook Today registry location (HKCU\Software\Microsoft\Office\<version>\Outlook\Today). The rule fires when a value under an Outlook Today key is set to EITHER a \Stamp DWORD of 0x00000001 (which enables the custom Today page) OR a \URL or \UserDefinedUrl value (which supplies the page location), and the writing process is not the legitimate Office ClickToRun updater. Outlook renders the configured page inside its own trusted process on launch, so pointing it at a local HTA/script or an attacker-controlled page turns Outlook into a persistence and code-execution mechanism that runs on every start. Investigation should decode the written value, determine whether it references a local script/HTA versus a normal http(s) page, identify the writing process and its parent, and confirm whether Outlook subsequently executed the payload.
type: detection
detection_id: 487bb375-12ef-41f6-baae-c6a1572b4dd1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match what this rule detects — either an Outlook Today Stamp DWORD of 0x00000001 or a URL/UserDefinedUrl value?
  context: 'Confirm the alert is a true positive by reviewing the exact key path (TargetObject) and value data (Details). The rule fires when a value under a ...\Outlook\Today\ key is set to EITHER \Stamp = DWORD (0x00000001), which enables the custom Today page, OR a \URL or \UserDefinedUrl value, which supplies the page location — and the writer is not OfficeClickToRun.exe. Note which branch fired: the URL/UserDefinedUrl branch carries the page location to decode, while the Stamp branch only toggles the feature on.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is the exact Outlook Today value that was written, and does it point to a local HTA/script or a normal http(s) page?
  context: The registry path pins this to the Outlook Today feature. Decode the Details value fully — a normal deployment references an http(s) intranet page, whereas a local file path (file://, C:\, %TEMP%, %APPDATA%) or a UNC/WebDAV path (\\host\share, \\Device\Mup) pointing at an HTA, .html, .vbs, or .hta is characteristic of abuse. Content at that location runs VBScript/JScript inside outlook.exe's trusted process on launch, so the value itself determines what executes. The writing process (Image) shows what set it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Outlook Today configuration?
  context: The Outlook Today URL cannot be set remotely and is normally never touched by end users, so a write is unusual outside of a deliberate configuration change. Knowing whether the account and host function are consistent with modifying Outlook settings is often the fastest way to separate a true positive from a rare legitimate change. User attribution is present on most endpoint registry events; when it is a machine account or missing, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this registry value, and what started that process?
  context: The writing process and its parent reveal how the Outlook Today value was set. A value set by regedit.exe or a documented management tool under an interactive admin session reads differently from one set by a script host (wscript, cscript, powershell), an Office child process, or an unsigned binary spawned from an unusual parent. Tracing the parent's own origin shows whether the write came from routine configuration or an execution chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has the Outlook Today value been re-modified or rotated since the initial write?
  context: Registry key/value deletions are not observable on this telemetry, so cleanup cannot be confirmed by watching for a delete. Judge persistence instead from re-modification history — a value that is written once and left in place, or repeatedly updated with a new URL, is consistent with an active mechanism. Some frameworks rotate the Outlook Today URL after a host checks in, generating a distinct per-host value, so multiple writes to the same key with changing Details are notable.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: Operators who set an Outlook Today page for persistence often make additional registry changes in the same session — enabling roaming folder home pages, setting NonDefaultStoreScript, lowering Outlook macro security, or toggling other security settings. Grouping all registry writes on the host by key path and writing process shows what else was changed alongside the Outlook Today value and whether one process drove several changes.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: After the value was written, did outlook.exe spawn child processes consistent with the page executing code?
  context: Outlook renders the configured Today page inside its own process on launch, and a local HTA/script or a page carrying VBScript/JScript runs in that trusted context. Execution frequently surfaces as outlook.exe spawning script hosts (wscript, cscript, mshta, powershell, cmd) or dropping files. The payload runs on the next Outlook start, which may be well after the write, so extend the window and check subsequent Outlook launches; zero children does not rule out a purely in-memory or network-only page.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: If the value points to a local script or HTA, is that file present on disk?
  context: The persistence is only effective if the referenced page exists at the path written to the value. If the Details value points to a local file (for example C:\Users\Public\today.hta or a UNC path), confirming that the file was created determines whether the mechanism is armed and what it would execute on the next Outlook launch. This query correlates file activity by the registry-writing process and its children; the file write carries no hash, so if the payload is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this Outlook Today key been modified before on this host?
  context: First-time modification of the Outlook Today value is more suspicious than a recurring change. This key should rarely if ever change on a normally configured host, so a lack of prior history points to a newly introduced setting rather than routine activity. Compare the Details values across any prior writes to see whether the same page was set before or this value is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this Outlook Today key modified on other hosts in the environment?
  context: The same modification across many hosts may indicate a managed configuration or a widely deployed implant, while a change confined to one host suggests targeting. Compare the Details values across hosts — an identical intranet URL pushed fleet-wide reads differently from distinct per-host values, which is consistent with a framework that generates a unique page or key per compromised host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Aggregating process activity around the write reveals the immediate context: what led to the registry change, what ran afterward, and whether it is part of a larger sequence. Novel parent-child pairs stand out at low counts against the high-count agent and system noise, which is what to scan for.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or initial execution — may reveal the attack stages that preceded the persistence write and help reconstruct the timeline. Registry-based persistence is commonly established after an operator already has hands-on access, so preceding alerts can place this event in a larger operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented approval for this Outlook configuration change?
  context: Direct configuration of the Outlook Today page is not part of typical software deployment, so a corresponding change record is unlikely even for legitimate changes. A documented approval suggests authorized activity; its absence when policy would require one strengthens the case that the write was unauthorized. This check can quickly close a false positive or escalate a true positive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall configuring the Outlook Today page?
  context: Confirmation from the person behind the account is often the fastest path to determining legitimacy. If the user does not recall setting an Outlook Today page, their session may be compromised or the change may be automated. If they do recall it, capture why and what page they intended to point Outlook at so the configured value can be validated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
