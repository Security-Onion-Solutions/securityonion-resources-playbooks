name: Suspicious Windows Defender Folder Exclusion Added Via Reg.EXE
id: 3e52c934-4c9d-4719-99ac-7c7b94f657d8
description: |
  Detects reg.exe adding a folder exclusion under the Windows Defender or
  legacy Microsoft Antimalware Exclusions\Paths registry key. The rule fires
  when a single reg.exe command line contains one of those Exclusions\Paths
  subkeys AND the full set of ADD-a-REG_DWORD switches (ADD, /t, REG_DWORD,
  /v, /d, 0) - the pattern that registers a path Defender will no longer scan.
  Excluding a path from scanning is occasionally done by administrators and
  software installers, but the same command is a common precursor to running
  a payload from the now-excluded directory, so the investigation should
  determine which path was excluded, which process and user issued the
  command, what ran in that path afterward, and whether the host shows other
  tampering or a history of this pattern.
type: detection
detection_id: 48917adc-a28e-4f5d-b729-11e75da8941f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the reg.exe command line add a Defender exclusion path with a
    REG_DWORD value of 0, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a reg.exe command line both references an Exclusions\Paths
    subkey (Windows Defender or the legacy Microsoft Antimalware path) and carries
    the full ADD a REG_DWORD switch set (ADD, /t REG_DWORD, /v, /d, 0). Read the
    exact command line and note the path passed to /v - that directory is the one
    being removed from Defender scanning.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to add Windows Defender folder exclusions?
  context: Adding Defender exclusions is a privileged administrative action that a
    narrow set of accounts and endpoints perform legitimately - server admins,
    endpoint-management tooling, or software installers that register their own
    install directory. Most users and most hosts never touch Exclusions\Paths.
    Knowing whether the acting account and host function involve security
    configuration is often the fastest path to separating a sanctioned change
    from an attacker clearing the way for a payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which exact path was excluded, and under which Defender exclusions key
    was it registered?
  context: The value name passed to /v is the directory being excluded from
    scanning, and the parent key tells you whether modern Defender
    (SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths) or the legacy
    Microsoft Antimalware path was targeted. A path under a normal software
    install directory is a different finding than a user-writable location such
    as a profile AppData or ProgramData subfolder, which is where dropped
    payloads commonly live. Read the structured registry write to confirm the
    target object and the value written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What Defender scanning coverage was removed, and does the REG_DWORD
    value of 0 confirm the path was excluded rather than re-enabled?
  context: An Exclusions\Paths entry tells Defender to skip real-time and scheduled
    scanning for everything under the named directory. The rule keys on a /d 0
    REG_DWORD write, which is the value Defender records for an active path
    exclusion. Read the full command line to confirm which directory lost
    coverage and that the value disables scanning, since that gap is what
    subsequent execution from the path exploits.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the folder exclusion still in place, or has it been removed?
  context: A path exclusion persists in the registry until something deletes it, so
    unlike a one-shot command its effect is ongoing - every file written under
    the excluded directory stays unscanned. Check whether the exclusion still
    exists in the host's Defender configuration; if it is still present it should
    be removed to restore scanning coverage for that path before the
    investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this reg.exe, and is that parent chain expected for
    adding a Defender exclusion?
  context: The parent process reveals how the exclusion command was invoked. The
    REG_DWORD write is set by whatever launched reg.exe, so the parent is where
    the decision was made. An interactive administrative session usually shows a
    console shell or a management agent; an unexpected parent such as a script
    host, mshta.exe, regsvr32.exe, or an Office application points to automated
    or malicious invocation that excludes a path to evade scanning.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was this reg.exe executed from its expected System32 or SysWOW64 path?
  context: reg.exe normally runs from C:\Windows\System32 or C:\Windows\SysWOW64. A
    copy executed from a user-writable or temporary directory, or a differently
    named binary whose OriginalFileName resolves to reg.exe, suggests the binary
    was relocated or renamed to evade path-based allowlisting. Compare the Image
    path and OriginalFileName against the expected system location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What ran on this host after the exclusion was added, especially from the
    excluded path?
  context: A path exclusion is usually a preparatory step that lets a payload run
    from the now-unscanned directory without Defender interference. Examining
    process creation in the window after the exclusion reveals what the gap was
    meant to enable - execution from the excluded folder, follow-on download, or
    further configuration changes. A burst of process creation right after the
    exclusion, particularly from the excluded directory, points to the activity
    the tampering allowed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the
    same time?
  context: An actor who excludes a path from Defender often pairs it with other
    evasion steps - stopping security services, clearing event logs, deleting
    shadow copies, disabling real-time monitoring, or weakening firewall rules.
    Finding multiple tampering events from the same user or parent process within
    a short window indicates a coordinated effort to blind the host rather than an
    isolated administrative exclusion. This also surfaces other LOLBins used for
    the same defense-evasion objective.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: An actor who edits one registry key often edits several - adding a
    Defender exclusion AND setting a Run key for persistence AND modifying
    firewall or policy values. Finding clusters of reg.exe write operations from
    the same host within a short window reveals the full scope of the
    configuration changes and whether multiple objectives were pursued alongside
    the exclusion.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: When this host has previously fired the rule's Defender-exclusion pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate software installers can add Defender exclusions. This
    query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific firing
    pattern has historically run here, not generic reg.exe activity. A new parent
    process, an unexpected account, or a first-ever occurrence is the anomaly
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the rule's Defender-exclusion pattern over
    the past 90 days, and what command-line structures are typical?
  context: A Defender-exclusion pattern with no prior history on a host is more
    suspicious than one added regularly under a stable parent. This query mirrors
    the rule's selection structure scoped to this host, so the count reflects the
    rule's specific firing pattern rather than generic reg.exe usage. The
    command-line projection lets the analyst compare the directories excluded
    historically against the path in the current alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the rule's Defender-exclusion pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the Defender-exclusion pattern rather than
    generic reg.exe activity. Many hosts adding the same exclusion points to a
    software deployment or management policy that excludes a path by design; one
    host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the Defender exclusion was a single event or part of activity spanning
    multiple endpoints. If the same user triggered similar activity on other
    hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \reg.exe
        CommandLine|contains:
        - SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths
        - SOFTWARE\Microsoft\Microsoft Antimalware\Exclusions\Paths
        CommandLine|contains|all:
        - 'ADD '
        - '/t '
        - 'REG_DWORD '
        - '/v '
        - '/d '
        - '0'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
