name: Suspicious Plink Port Forwarding
id: 112c1ab6-1a5b-4101-9c79-97d308f1ac97
description: |
  Detects a command-line SSH client (Plink, the non-interactive PuTTY variant)
  invoked with a remote-forward switch (' -R '), which establishes a reverse
  tunnel that exposes a host-local service to a remote SSH endpoint. The rule
  fires when a process whose file description is "Command-line SSH, Telnet, and
  Rlogin client" runs with ' -R ' on its command line. Reverse port forwarding is
  used to relay otherwise firewalled internal services - including RDP and SMB -
  outbound through an attacker-controlled SSH server, but administrators also use
  it for legitimate remote maintenance. The investigation should decode the full
  tunnel specification (forwarded ports, the SSH destination, and credential
  flags), determine which internal service is being exposed, confirm whether the
  outbound SSH connection and destination are expected, and establish whether the
  same pattern appears on other hosts.
type: detection
detection_id: 48a61b29-389f-4032-b317-b30de6b95314
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a remote-forward switch (' -R ') on a
    command-line SSH client, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process described as a command-line SSH/Telnet/Rlogin
    client runs with ' -R ' on its command line. Read the exact command line and
    confirm the remote-forward switch is present rather than an unrelated argument
    that happens to contain the characters. Note the full forward specification
    that follows -R, since it names the local service being exposed and the remote
    endpoint it is relayed to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Description
- question: Is this user and host expected to run an SSH client with reverse port
    forwarding?
  context: Outbound SSH tunneling with reverse forwarding is normal for a narrow set
    of administrators and developers who reach internal services through a jump
    host. Most users and most endpoints never run a command-line SSH client this
    way. Knowing whether the acting account and the host function involve remote
    administration or tunnel-based maintenance is often the fastest path to
    separating sanctioned remote access from an attacker relaying a host-local
    service outbound.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SSH tunneling client authorized for use on this host, and what
    business purpose does the tunnel serve?
  context: Organizations typically maintain a list of approved remote access and
    tunneling tools. A command-line SSH client establishing a reverse forward - even
    a well-known utility like Plink - may represent shadow IT or attacker-deployed
    relay infrastructure if it is not sanctioned on this host. Unauthorized
    tunneling tools should be checked regardless of the tool's reputation, since the
    same binary serves both administrative and adversarial port forwarding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this SSH session part of a documented administrative procedure or an
    open support ticket?
  context: Legitimate tunneling usually correlates with an active support ticket, a
    scheduled maintenance window, or a documented administrative procedure. If no
    such context exists for this session, the reverse tunnel may have been
    established by an attacker to relay an internal service outbound or by a user
    circumventing network restrictions. Match the acting account and host against
    change and support records for the alert window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What does the full Plink command line specify - which local service is
    forwarded, to which SSH destination, and were credential flags supplied inline?
  context: The remote-forward argument follows the pattern
    -R <bind>:<rport>:127.0.0.1:<lport>, which exposes the host-local service on
    <lport> at the remote SSH endpoint. Decode the full specification to identify
    the internal service being relayed (for example 3389 for RDP, 445 for SMB, or
    an application port) and the SSH destination it is relayed to. Note whether -pw
    supplies a password inline, whether -ssh forces the protocol, and whether -N
    suppresses the remote shell so the process exists only to maintain the tunnel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the command line carry credential or protocol-forcing flags (-pw,
    -ssh, -N, -batch) that mark this as a non-interactive tunnel rather than an
    interactive session?
  context: Reverse-forwarding tunnels used to relay traffic outbound are typically
    launched non-interactively with the credential supplied inline. -pw embeds the
    SSH password directly on the command line, -ssh forces the SSH protocol, -N
    requests no remote command (tunnel only), and -batch disables interactive
    prompts. The presence of these flags alongside -R indicates an automated tunnel
    set up to encapsulate another protocol, whereas an interactive admin session
    would normally prompt for credentials rather than embed them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        CommandLine|contains:
          - ' -R '
      selection_noninteractive:
        CommandLine|contains:
          - ' -pw '
          - ' -ssh '
          - ' -N '
          - ' -batch '
      condition: selection and selection_noninteractive
    fields:
      - CommandLine
- question: What process spawned this SSH client, and is that parent chain expected?
  context: The parent process reveals how the tunnel was launched. A reverse forward
    is configured by whatever invoked the client, so the parent is where the tunnel
    decision was made. Interactive administration usually shows a console shell or a
    terminal application; an unexpected parent such as a script host, mshta.exe, an
    Office application, or a remote-execution service points to automated or
    attacker-driven invocation that set up the tunnel programmatically.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external SSH endpoint did this client connect to, and is that
    destination expected infrastructure?
  context: A reverse-forwarding SSH client establishes an outbound session to the
    SSH server that the tunnel relays through. The destination reveals whether the
    client is reaching a sanctioned jump host or bastion versus an unknown or
    external address that would relay an internal service to an attacker. Correlate
    the network connection from this host and binary with the SSH destination named
    in the command line, and note the destination port, which is commonly 22 but may
    be moved to evade egress filtering.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What processes ran on this host shortly after the tunnel was
    established, and do any align with a relayed RDP or SMB session?
  context: A reverse tunnel that exposes RDP (3389) or SMB (445) is a means to an end
    - the relayed session is used to log in and act on the host. Examining process
    creation in the window right after the tunnel launch reveals interactive logon
    artifacts, file access, or follow-on tooling that the tunnel enabled. Suspicious
    post-tunnel processes include cmd.exe, powershell.exe, and certutil.exe, which
    indicate hands-on activity arriving through the relayed connection.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Were any remote interactive or network logons recorded on this host
    around the time the tunnel was established?
  context: When a reverse tunnel forwards RDP or SMB, the relayed session produces a
    logon on the target host. Correlating successful and attempted logons within a
    few minutes of the tunnel launch shows whether the forwarded port was actually
    used to authenticate. Network logons (type 3) and RDP logons (type 10) close to
    the alert time, particularly from a loopback or unexpected source, indicate the
    tunnel carried an interactive session rather than sitting idle.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
      - EventID
- question: Has this user account run other tunneling or remote-execution tools
    across the environment?
  context: Attackers rarely stop at one tunnel. If the acting account is launching
    SSH forwarders or other remote-execution utilities on multiple hosts, the scope
    of activity is larger than this one endpoint. Finding the same user driving
    tunneling tools across several hosts in a short window indicates active pivoting
    rather than a one-off administrative session.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\plink.exe'
          - '\plink32.exe'
          - '\ssh.exe'
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description: Command-line SSH, Telnet, and Rlogin client
        CommandLine|contains: ' -R '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description: Command-line SSH, Telnet, and Rlogin client
        CommandLine|contains: ' -R '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the tunnel was a single event or part of activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the
    incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description: Command-line SSH, Telnet, and Rlogin client
        CommandLine|contains: ' -R '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    tunnel launch reveals what led to it and what followed - the parent that staged
    the process, reconnaissance, or follow-on execution the tunnel was meant to
    carry. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the tunnel and
    help reconstruct the full timeline. Outbound tunneling is often a late step in a
    sequence, set up to relay access the operator already established, so prior
    alerts give the context for why the tunnel was created.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the rule's reverse-forward pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the reverse-forward firing pattern rather
    than generic process activity. Many hosts firing the same pattern points to a
    maintenance pipeline or scripted deployment that sets up tunnels by design; one
    host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Description: Command-line SSH, Telnet, and Rlogin client
        CommandLine|contains: ' -R '
      condition: selection
    fields:
    - host.name
