name: Potentially Suspicious Volume Shadow Copy Vsstrace.dll Load
id: 22113981-3072-4c51-bcea-ba9a048bddc6
description: |
  Detects vsstrace.dll, the Volume Shadow Copy tracing library, being loaded by a process outside the expected set of
  system, Program Files, WinRE recovery, and other known-good locations. Legitimate Volume Shadow Copy and backup
  operations load this DLL from signed system and installer binaries; an uncommon or user-path executable loading it can
  indicate shadow-copy enumeration or preparation to delete shadow copies, a common precursor to inhibiting system
  recovery ahead of ransomware encryption. Investigate which process loaded the DLL, whether it legitimately performs
  backup or VSS work, its signature and hash, and whether recovery-inhibiting commands or registry changes followed.
type: detection
detection_id: 48bfd177-7cf2-412b-ad77-baf923489e82
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded ends in vsstrace.dll),
    its code-signature status, and the process that loaded it against the rule's detection criteria. The rule fires only
    when a process outside the allow-listed system, Program Files, and recovery locations loads this DLL, so the loading
    process path is the pivot. The library event carries the DLL's signing status and hash directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Volume Shadow Copy or backup tooling?
  context: Legitimate backup agents, installers, and administrative scripts load vsstrace.dll as part of routine VSS work.
    Knowing whether the loading process, the account it runs under, and the host's function are consistent with backup or
    shadow-copy activity is often the fastest way to separate a scheduled backup from an unexpected process preparing to
    enumerate or delete shadow copies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line and working directory of the process that loaded vsstrace.dll?
  context: The loading process is the subject of this alert. Its command line and working directory reveal what it is
    actually doing — a known backup utility invoked with expected arguments, or an unfamiliar binary running from a
    user-writable path. For an uncommon executable, decode any flags, target paths, or referenced volumes to determine
    whether it is enumerating or manipulating shadow copies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other modules did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: 'The full set of modules a process loads tells its story when the command line alone is opaque. Look for: (1)
    DLLs from %TEMP%, AppData, ProgramData, or Public — a side-loading signal; (2) unsigned modules in directories where
    signed ones are expected; (3) system DLL names loaded from non-system paths — search-order hijacking; (4) modules the
    loading process does not normally pull in. A process that loads vsstrace.dll alongside unusual side-loaded modules is a
    stronger anomaly than one loading only expected system libraries.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For vsstrace.dll and any other suspicious module loaded, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation distinguishes a routine system DLL from a side-loaded or masqueraded one. A genuinely signed
    Microsoft vsstrace.dll loaded from the canonical system path is expected; an unsigned module with a system-style
    filename, or a valid DLL loaded from a user-writable directory, is a masquerading or side-loading indicator. Hash
    lookups against threat intelligence surface known loaders and tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the executable that loaded vsstrace.dll, and is that parent chain expected?
  context: The parent process reveals how the loading executable was invoked. Backup agents and installers typically run
    under services.exe or a scheduler; a shadow-copy tool launched by powershell.exe, cmd.exe, wscript.exe, mshta.exe, or
    an Office application suggests scripted or hands-on-keyboard activity. Common recovery-inhibition chains run native
    utilities from an interactive shell or a dropped script host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What recovery-inhibiting commands were executed on this host?
  context: 'Operators chain multiple recovery-inhibiting commands: deleting shadow copies (vssadmin, wmic), disabling boot
    recovery (bcdedit /set recoveryenabled no, bootstatuspolicy), deleting backups (wbadmin, diskshadow), and disabling the
    Windows Recovery Environment (reagentc /disable). A vsstrace.dll load by an uncommon process is often the staging step
    before these commands run. This query surfaces recovery-inhibiting commands on the host; the analyst should then verify
    whether each action succeeded via host state (vssadmin list shadows, bcdedit /enum, reagentc /info).'
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: 'Impact operators typically chain multiple destructive actions: deleting shadow copies AND disabling recovery AND
    stopping security services AND clearing event logs. Finding the complete set of destructive commands around the
    vsstrace.dll load reveals whether this is an isolated administrative task or a coordinated recovery-destruction
    sequence, and whether a common parent script drove it.'
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Were recovery-related registry settings modified on this host around the time of the load?
  context: Recovery inhibition is not always driven from the command line. System Restore can be disabled by setting
    DisableSR or DisableConfig, and the shadow-copy and backup services (VSS, swprv, wbengine) can be neutralized by
    setting their service Start value to disabled. Modifications to these keys near a vsstrace.dll load by an uncommon
    process corroborate deliberate recovery destruction. Registry deletions are not observable here, so focus on value
    modifications and which process wrote them.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        TargetObject|contains:
          - '\SystemRestore\DisableSR'
          - '\SystemRestore\DisableConfig'
          - '\Windows NT\CurrentVersion\SystemRestore'
          - '\Control\BackupRestore'
          - '\Services\VSS\Start'
          - '\Services\swprv\Start'
          - '\Services\wbengine\Start'
      condition: selection and selection_recovery
    fields:
      - TargetObject
      - Details
      - Image
- question: Are there signs of file encryption, ransom notes, or unknown binary execution on this host after the load?
  context: Recovery-inhibiting actions typically precede file encryption by minutes. Checking for unknown or suspicious
    binaries executing after the vsstrace.dll load — especially processes from temp or user-writable paths, or shells
    launching unfamiliar executables — determines whether encryption has already started. The analyst should also check
    for ransom notes and mass file renames via file activity or the endpoint console.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Did the process that loaded vsstrace.dll, or its children, write files that are still on disk?
  context: The loading process may drop tooling or stage output — a shadow-copy deletion utility, a script, or an
    encryption binary. Correlating file writes to the alerting process and its direct children shows whether those
    artifacts remain on disk for hash lookup, sandbox submission, or content review, or whether they were already cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has vsstrace.dll been loaded on this host before, and under which processes?
  context: A first-time load of vsstrace.dll by a given process is a stronger anomaly than a recurring one. If the same
    process binary has loaded this DLL repeatedly over the past 90 days, the load is probably routine backup or VSS
    activity. If this is the first occurrence, or the DLL has historically been loaded only by different, expected
    processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded vsstrace.dll?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts for the loading binary indicate first-time or rare execution, which raises the priority of the
    signature, parent-chain, and follow-on recovery-command questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in a tight window around the load reveals the immediate
    context: what led to it, what happened after, and whether it is part of a larger sequence. Recovery-feature changes
    tend to cluster over short intervals, so watch for reconnaissance, service manipulation, or destructive commands near
    this event.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or lateral movement
    — may reveal the attack stages that preceded a shadow-copy staging load and help reconstruct the timeline. Recovery
    inhibition is usually a late-stage action, so preceding alerts often mark how the operator arrived at this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this same detection firing on other hosts in the environment?
  context: Recovery-inhibition staging often executes across many hosts in a short window as operators prepare a fleet-wide
    encryption event. Finding the same alert on multiple hosts indicates multi-host activity and determines the scope for
    containment and incident response.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Is vsstrace.dll being loaded by uncommon processes on other hosts?
  context: Cross-host correlation surfaces how widely this pattern is present. The same DLL loaded by unexpected processes
    across multiple hosts indicates multi-host activity or shared tooling rather than a localized event. Pay attention to
    the variety of loading processes — a single expected backup agent is benign, while the DLL appearing under unfamiliar
    executables on several hosts suggests coordinated recovery-inhibition staging.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
