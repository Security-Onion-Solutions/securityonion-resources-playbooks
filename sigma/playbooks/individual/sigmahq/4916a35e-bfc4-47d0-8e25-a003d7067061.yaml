name: Sysmon Driver Altitude Change
id: 5951b4e3-d231-4ca9-84ef-a8968979dd76
description: |
  Detects a registry write to the Sysmon minifilter driver's Altitude value under a Services key ending in
  \Instances\Sysmon Instance\Altitude. The altitude value fixes the driver's load-order position in the file-system
  minifilter stack and is normally set once at install and never changed. Reassigning it to an altitude already
  claimed by another registered minifilter forces the Sysmon driver to fail to load at boot, silently disabling
  endpoint monitoring without unloading or stopping any service. Determine the new altitude value that was written,
  the process and parent that wrote it, and whether host telemetry degraded afterward.
type: detection
detection_id: 4916a35e-bfc4-47d0-8e25-a003d7067061
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key path and altitude value match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the modified
    key path contains \Services\ AND ends in \Instances\Sysmon Instance\Altitude. Confirm the exact key path and the
    altitude value that was written against the rule's detection criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Sysmon driver's altitude registry value?
  context: The driver altitude is set once during Sysmon installation and rarely touched afterward, so almost no
    routine administrative workflow rewrites it. If the writing account is a machine account or SYSTEM, user identity
    does not attribute the action -- pivot to the writing process instead. Knowing whether this account and host
    function normally reconfigure endpoint monitoring is often the fastest way to separate an install or upgrade from
    deliberate tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What altitude value was written to the Sysmon Instance Altitude key, and does it collide with another minifilter?
  context: The Details field holds the new altitude number that positions the driver in the minifilter stack. Sysmon's
    stock altitude is a known fixed value; a different number -- especially one already registered by another active
    minifilter -- causes the driver to fail to load at boot, which blinds monitoring. Decode the Details value and
    compare it against the expected altitude for this deployment; if Details is absent, fall back to the writing process
    and the key's modification history.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is this Services altitude key a known evasion location, and what process and value data landed on it?
  context: The Services\...\Instances\Sysmon Instance\Altitude key controls where the monitoring driver sits in the
    minifilter load order. Rewriting it is a recognized defense-evasion technique that displaces or unloads endpoint
    monitoring without stopping a service or clearing a log. The writing process (Image) and the altitude data together
    determine intent -- an installer or upgrade path is very different from a script host or a renamed utility writing
    the value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which process altered the Sysmon driver altitude, and what does its command line reveal about how the change was made?
  context: The registry write can be made by reg.exe, a PowerShell Set-ItemProperty call, an installer, or direct API
    use from custom tooling. Reading the full command line of the writing process shows how the altitude was set and
    whether it was a scripted one-liner, a bundled installer step, or a hand-typed operator command. This identifies the
    specific mechanism behind the monitoring driver being displaced.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the process that wrote the altitude value, and is that parent chain expected?
  context: The parent reveals how the registry write was launched. Sysmon setup and legitimate upgrades run under
    predictable installer or service parents. An interactive shell, a script host such as wscript.exe or mshta.exe, or
    an Office application as the parent points toward an operator or a malicious launcher rather than a platform
    maintenance path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is Sysmon monitoring currently intact on this host, or is the driver failing to load?
  context: Reassigning the altitude does not take effect until the driver next loads, typically at reboot, at which
    point a colliding altitude causes the load to fail and telemetry to stop. Confirm the current state of endpoint
    monitoring on the host -- whether the driver is loaded and events are flowing, or whether the host has gone silent.
    If monitoring is degraded, restoring the correct altitude and reloading the driver is the immediate remediation
    before deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this altitude key been modified before on this host?
  context: The driver altitude is written at install and should stay constant for the life of the deployment, so a
    healthy host shows one historical write (the original install) or none in recent history. Repeated rewrites, or a
    write on a host that has never touched this key outside its install date, is the deviation worth chasing. Because
    registry value deletion is not recorded on the endpoint, the key's re-modification history is the way to judge
    whether the value was later reverted or churned.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: An operator who rewrites the monitoring driver altitude often makes other configuration changes in the same
    window -- disabling security services, setting a Run key for persistence, or adjusting policy values. Registry
    modifications clustered around the altitude change, from the same writing process or user, reveal the full scope of
    the reconfiguration. The triggering key will appear in the results; the signal is what else was modified alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What activity occurred on this host after the altitude change?
  context: Endpoint monitoring is blinded for a reason -- to execute a payload, dump credentials, or take actions that
    would otherwise be recorded. Examining process activity after the altitude change reveals what the tampering was
    meant to enable. If the driver failed to load, there may be a gap in telemetry during this window; note the gap and
    correlate with network connections and file writes from other sources.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: Operators who displace one control often disable several -- stopping services, clearing event logs, deleting
    shadow copies, or turning off real-time protection -- to widen the window of reduced visibility. Multiple tampering
    events from the same user or parent process around the altitude change indicate a coordinated effort rather than an
    isolated configuration edit.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Was this altitude key modified on other hosts in the environment?
  context: The same altitude rewrite across multiple hosts may indicate a pushed configuration change, a widespread
    implant, or lateral movement. If only this host shows the modification, the activity is more likely targeted.
    Compare the altitude values written across hosts -- an identical non-standard value on many hosts points to a common
    tool or script.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in the window around the altitude change
    surfaces novel parent-child pairs and low-frequency executions that stand out against routine agent telemetry,
    revealing what led up to the change and what followed it. Look for reconnaissance, privilege escalation, or the
    launch of the tool that performed the registry write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- reconnaissance, credential access,
    or other defense tampering -- may reveal the attack stages that preceded the altitude change and help reconstruct
    the full timeline. Displacing endpoint monitoring is often a mid-operation step taken to cover subsequent actions.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Displacing endpoint monitoring is frequently a precursor to establishing persistence that would otherwise be
    recorded. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI subscriptions installed in the
    surrounding window indicate the operator moved from reducing visibility to securing a foothold. Multiple persistence
    installations in the same timeframe point to intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or Run-key paths on this host?
  context: File-based persistence bypasses command-line detection entirely -- dropping an executable or script into the
    Startup folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or
    reg. File-write monitoring captures these drops even when the operator avoids the standard persistence tools, which
    matters when the process-monitoring driver has been displaced.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
