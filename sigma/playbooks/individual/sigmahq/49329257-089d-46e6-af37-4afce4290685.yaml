name: HackTool - SharpEvtMute DLL Load
id: 358bba63-ed18-4cc2-beb3-2cb0d2cce327
description: |
  Detects the load of EvtMuteHook.dll, matched by its compiled import hash (Imphash) rather than a specific file
  name or path. The DLL hooks into the process hosting the Windows Event Service and applies a filter that drops
  selected events before they reach disk or downstream consumers — filters range from a blanket disable-all to
  rules that target only specific event content, such as a particular sensor's process-access telemetry.
  Investigation should confirm the module's identity (hash, signature, loading process), determine how broad the
  suppression is and whether it is still active, and look for the follow-on activity the suppression was likely
  applied to conceal.
type: detection
detection_id: 49329257-089d-46e6-af37-4afce4290685
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects?
  context: >-
    Confirm the alert is a true positive by comparing the returned hash, signature status, and loading process
    against the rule's detection criteria — the returned hash against the rule's Imphash match, and the signing
    status and loading process against expectations for a legitimate module. The rule matches on the DLL's
    compiled import hash rather than a specific file name or path, so the module could appear renamed or relocated
    — the hash is the authoritative comparison point. The load event carries signing status and hash directly, so
    no execution pivot is needed to confirm identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
  answer_sources:
  - alert
  - image_load
- question: Is this host expected to run tools that hook or modify Windows event-logging behavior?
  context: >-
    Legitimate administrative and testing activity can involve event-logging configuration changes. Knowing
    whether this host's role and the logged-in user's duties are consistent with running defense-evasion tooling
    or authorized security testing is often the fastest path to distinguishing a true positive from routine work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this SharpEvtMute hook injection part of an authorized penetration test or red team engagement?
  context: >-
    Event-logging suppression tools are used in authorized security assessments to validate detection coverage.
    Before investing investigation time, check whether a pentest or red team exercise is currently active on this
    host or network segment. An authorized engagement with matching tool usage and timing resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which capability of the toolkit was invoked?
  context: >-
    The toolkit's control assembly exposes distinct capabilities — injecting the hook, applying or updating a
    suppression filter, or resolving the Event Service PID for manual injection. The image-load alert alone does
    not reveal which capability ran; if the control assembly's own execution was captured on this or another host,
    its command line identifies the specific action rather than just the presence of the hook.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Are file artifacts of the toolkit present on the host, such as its control binary or shellcode build source?
  context: >-
    The toolkit's control assembly and the raw shellcode source used for stealth deployment are the two artifacts
    most likely to remain on disk after the hook is placed. Its filter-management channel is a named pipe, which is
    not visible in endpoint file-creation telemetry — confirming pipe activity or checking the Event Service process
    for injected memory requires an endpoint console or direct host inspection.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What other modules did the process that loaded this hook DLL pull in, and are any from non-canonical paths or unsigned?
  context: >-
    A hook DLL reaching a system process it does not normally load into is itself an injection signal. Look for
    companion modules staged from AppData, ProgramData, Public, or a temp directory; unsigned modules in a location
    where signed ones are expected; and any modules whose presence in this particular process is otherwise
    unexplained. A cluster of unusual loads in the same process points to a staged injection rather than an
    isolated event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: For this hook DLL and any other suspicious modules loaded, what is the signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes routine third-party code from a purpose-built evasion hook. An unsigned module,
    or one with an expired, distrusted, or invalid signature, sitting in a system process points to injected code
    rather than a legitimate load. The hash on the load event supports a direct threat-intel lookup without needing to recover the file
    from disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: Is the applied event-suppression filter a blanket disable, or does it target specific event signatures?
  context: >-
    This tampering mechanism is a content filter rather than a service stop or registry edit — it can be configured
    to drop every event indiscriminately or to selectively drop only events matching a narrow pattern (for example,
    a specific sensor's process-access telemetry). Determining which mode is in effect determines whether the host
    is fully blind to logging or only blind to a targeted subset, which changes what other detections can still be
    trusted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Is Windows event logging still being suppressed, or has normal event flow resumed?
  context: >-
    This suppression works by dropping events before they are written, so there is no explicit "re-enabled" log
    entry to search for. The reliable check is comparing this host's expected baseline event rate against its
    current rate — a host that resumes producing a normal volume and variety of events indicates the filter was
    removed or the hook was unloaded, while continued silence indicates it is still active.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: What activity occurred on this host in the hour after the module load?
  context: >-
    Suppressing event logging is rarely an end in itself — it typically clears the way for an action that would
    otherwise be logged and flagged, such as credential access or additional tooling execution. Because the
    suppression may be actively dropping events during this window, treat a sparser-than-expected result as a
    visibility gap to fill in from other telemetry rather than as confirmation nothing happened.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense-tampering commands executed on this host?
  context: >-
    Operators who suppress event logging often pair it with other tampering — stopping protection services,
    clearing already-written logs, or disabling firewall rules — to maximize the window in which their activity
    goes unnoticed and unrecoverable. Finding multiple tampering actions from the same user or process lineage
    indicates a deliberate, multi-control operation rather than isolated administration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What process spawned the process that loaded this hook DLL, and is that parent chain expected?
  context: >-
    The process hosting the Windows Event Service is normally spawned by the standard service-control lineage. A
    parent outside that expected chain would mean the hook landed in an unexpected host process rather than the
    genuine Event Service, which changes the scope of what the hook can actually intercept.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    An injection event rarely stands alone. Examining process activity in a tight window around the load reveals
    what may have delivered or triggered the injection and what ran immediately alongside it, before any
    suppression could take effect.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Has this specific hook DLL been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module on the host is a stronger anomaly than a recurring one. If the same module has
    a history of loading on this host, review whether that pattern reflects earlier undetected activity or repeat
    authorized testing; a true first occurrence has no such explanation and should be treated as a new event to
    scope from scratch.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Is this hook DLL being loaded on other hosts, especially under unexpected processes?
  context: >-
    Cross-host correlation shows how far the tampering capability has spread. A single-host load may be a
    localized or isolated action; the same module appearing across multiple hosts, particularly under processes
    other than the Event Service, indicates broader deployment that needs its own containment scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host can reveal what preceded the event-logging tampering. Reconnaissance,
    credential access, or additional tooling staged before this event helps establish whether the suppression was
    an opening move or a mid-operation step to cover a later action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Operators rarely rely on a single foothold. After tampering with event logging to reduce visibility, they
    commonly install persistence through scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate deliberate stacking rather
    than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a
    Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc,
    or reg. This is consistent with an operation that is already suppressing logging and would prefer to avoid
    additional command-line footprint.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
