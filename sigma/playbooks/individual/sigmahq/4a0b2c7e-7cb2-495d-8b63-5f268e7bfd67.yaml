name: Renamed ProcDump Execution
id: 271cc8d1-97da-45a0-b230-6ddcf1b3a4f7
description: |
  Detects execution of a renamed copy of the Sysinternals ProcDump utility, identified when the
  on-disk Image name is not procdump.exe/procdump64.exe but the embedded PE OriginalFileName is
  "procdump" OR the command line carries the full-dump flags (-ma/-mp) together with /accepteula OR
  carries /accepteula on its own. Renaming a known process-dump tool is a defense-evasion step that
  decouples the file name from its true capability; the most common abuse is dumping LSASS for offline
  credential extraction (procdump -ma -accepteula lsass.exe). Legitimate causes exist — software that
  illegally bundles ProcDump under another name, or an administrator who deliberately renamed the
  binary — so the investigation should establish the binary's true identity, how it arrived, what it
  dumped or did next, and whether the same renamed copy is present elsewhere.
type: detection
detection_id: 4a0b2c7e-7cb2-495d-8b63-5f268e7bfd67
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match the renamed-ProcDump pattern — an OriginalFileName of "procdump" on a binary not named procdump.exe, or the -ma/-mp dump flags with /accepteula, or /accepteula alone?
  context: Confirm the alert is a true positive before investing time. The rule fires when at least one of these branches is true and the Image is not the original procdump.exe/procdump64.exe, so note which branch matched — an OriginalFileName match is the strongest signal of a renamed copy, while a flag-only match can also occur on legitimately bundled or admin-renamed tools. Review the OriginalFileName and the full command line against the on-disk name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a process-dump utility such as ProcDump?
  context: Legitimate ProcDump use is concentrated on developer workstations, troubleshooting sessions, and a small set of operations or support staff. A finance laptop, kiosk, domain controller, or service account running a renamed dump tool is far harder to explain than the same activity from a developer or a known IT admin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The on-disk Image name has been changed, but the PE metadata still reflects the original tool — OriginalFileName "procdump" is invariant under renaming, which is exactly what the rule keys on. Compare the Image path against OriginalFileName, then use the signing details and file hash for a reputation lookup. A Microsoft-signed Sysinternals binary that was simply renamed is a different finding from an unsigned or unknown binary spoofing the metadata.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly did this renamed ProcDump invocation do? Decode the dump type, target process, and output path from the command line.
  context: The command line reveals the operation. Identify the dump-type flag (-ma full, -mp miniplus, -mm mini), the target (a PID, process name, or service — dumping lsass is the canonical credential-theft case), the output file or folder, and whether /accepteula was passed. Scripted and adversary use almost always includes /accepteula because no interactive prompt is possible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this renamed binary arrive on the host?
  context: A renamed dump tool does not appear on its own — it was copied, downloaded, extracted from an archive, or dropped by a parent process. Matching the file-creation event by basename over a long window reveals the delivery mechanism and the creating process. A landing spot in a user-writable directory (Desktop, Downloads, Temp, AppData) points to download or extraction; placement in a system directory may indicate compromise of a privileged process or a bundling installer.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process shows how the tool was launched. A parent of explorer.exe or a known admin shell fits manual or interactive use; parents like mshta.exe, wscript.exe, an Office application, or a remote-execution service point to scripted or remote invocation. Walk up to the parent's own parent if the immediate parent looks unremarkable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: Renaming is meant to hide the tool while it performs its function, so the child processes, file writes, and any follow-on activity reveal the real objective — credential dumping, reconnaissance, or staging. A dump tool writing a .dmp file and being read by another process is the credential-theft pattern. The same renamed copy appearing on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run a binary at this path?
  context: A binary path that has never been seen on this host is more suspicious than one that runs regularly. Zero or very low historical counts over 90 days indicate first-time or rare execution; a steady history points to a tool that lives here for a legitimate reason.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the renamed-ProcDump pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even renamed tools can have a benign history on a given host (a bundling application, a recurring admin task). The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected user, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_ofn:
        OriginalFileName: procdump
      selection_cli_dump_flag:
        CommandLine|contains|windash:
        - ' -ma '
        - ' -mp '
      selection_cli_eula_flag:
        CommandLine|contains|windash: ' /accepteula'
      filter_main_known_names:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
        - \procdump64a.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((selection_ofn or all of selection_cli_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_ofn:
        OriginalFileName: procdump
      selection_cli_dump_flag:
        CommandLine|contains|windash:
        - ' -ma '
        - ' -mp '
      selection_cli_eula_flag:
        CommandLine|contains|windash: ' /accepteula'
      filter_main_known_names:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
        - \procdump64a.exe
      _pb_scope:
        User|expand: '%User%'
      condition: ((selection_ofn or all of selection_cli_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_ofn:
        OriginalFileName: procdump
      selection_cli_dump_flag:
        CommandLine|contains|windash:
        - ' -ma '
        - ' -mp '
      selection_cli_eula_flag:
        CommandLine|contains|windash: ' /accepteula'
      filter_main_known_names:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
        - \procdump64a.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_ofn or all of selection_cli_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting user's activity across all hosts in the surrounding window reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity elsewhere, the scope of the event is larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_ofn:
        OriginalFileName: procdump
      selection_cli_dump_flag:
        CommandLine|contains|windash:
        - ' -ma '
        - ' -mp '
      selection_cli_eula_flag:
        CommandLine|contains|windash: ' /accepteula'
      filter_main_known_names:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
        - \procdump64a.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_ofn or all of selection_cli_*) and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the renamed-ProcDump pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing pattern rather than generic use of any dump tool. Many hosts firing the same pattern points to scripted deployment or a bundling application; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_ofn:
        OriginalFileName: procdump
      selection_cli_dump_flag:
        CommandLine|contains|windash:
        - ' -ma '
        - ' -mp '
      selection_cli_eula_flag:
        CommandLine|contains|windash: ' /accepteula'
      filter_main_known_names:
        Image|endswith:
        - \procdump.exe
        - \procdump64.exe
      condition: (selection_ofn or all of selection_cli_*) and not 1 of filter_main_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around this event reveals the immediate context — what led up to it, what followed, and whether it is part of a larger sequence such as reconnaissance, credential access, or staging. Novel parent-child pairs stand out at low counts against the repetitive system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or other credential-access activity — may reveal the attack stages that preceded this event and help reconstruct the timeline. Sequences such as protection-tampering followed by a dump tool are especially relevant here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
