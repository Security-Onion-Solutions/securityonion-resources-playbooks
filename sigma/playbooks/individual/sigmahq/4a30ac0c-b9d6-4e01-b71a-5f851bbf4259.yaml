name: Potential Defense Evasion Activity Via Emoji Usage In CommandLine - 1
id: 88328790-0d50-483d-8f80-53c8bdaa0472
description: |
  Detects a process whose command line contains at least one character drawn from a large list of
  emoji and pictographic Unicode code points — facial expressions, hand gestures, people and
  profession figures, family groupings, clothing and accessories, together with their skin-tone
  modifier forms and the multi-codepoint sequences assembled from zero-width joiners and variation
  selectors. The rule pins no binary and no parent; command line content is the sole criterion, so
  the alerting program can be any process on the host. These characters carry no execution semantics
  for a command interpreter, which is what makes them usable as filler inside variable names, string
  concatenation, and delimiter tricks that defeat literal string matching in detection content and
  slow down a person reading the argument list — and the same characters also arrive legitimately
  from chat clients, localization test suites, build scripts, and file names a user chose. The
  investigation should reconstruct the command that actually ran once the pictographic characters are
  accounted for, establish whether the program and its parent explain their presence, and determine
  whether the same command line appears elsewhere on the host or across the fleet.
type: detection
detection_id: 4a30ac0c-b9d6-4e01-b71a-5f851bbf4259
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Which emoji or pictographic character in this command line matched the rule's list?
  context: >-
    The rule has one criterion — the command line contains any single character from a list of
    roughly 977 emoji and pictographic code points. Read the exact command line, identify the
    character that matched, and note where it sits. A character inside a quoted file name or a
    message argument means something very different from one wedged between tokens of a command
    string. Many list members are multi-codepoint sequences joined by zero-width joiners or followed
    by variation selectors, so a rendering client may collapse several code points into one glyph;
    inspect the raw bytes when the match is not visually obvious.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run commands carrying emoji or pictographic characters?
  context: >-
    Several roles produce these characters as a matter of routine. Developers and localization staff
    exercise Unicode handling deliberately, chat and collaboration clients pass message text through
    argument lists, and packaging or build scripts decorate console output with pictographic markers.
    Establishing whether the account's role and the host's function fit one of those profiles is
    usually the quickest way to separate ordinary work from an obfuscated command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: With the pictographic characters accounted for, what command actually executed?
  context: >-
    Reconstruct the operation. Strip or substitute the pictographic characters, resolve the variable
    expansion, concatenation, or caret and backtick escaping built around them, and decode any
    base64 or URL-encoded payload that remains underneath. The characters contribute nothing to
    execution, so the whole question is what command is left once they are removed — a retrieval, an
    interpreter invocation, a credential-access step, or plain text a person typed. The query is
    anchored on the alerting process so the working directory is available beside the full argument
    list.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which program received this command line, and do its identity and integrity level fit the content?
  context: >-
    The rule constrains no binary, so the alerting program is simply whatever was invoked. A command
    interpreter or script host receiving pictographic filler sits in a different category from a chat
    client or text editor receiving message text. Compare the on-disk name against the compiled
    original file name to catch a renamed binary, and note the integrity level — an elevated
    interpreter carrying padded arguments narrows the investigation considerably.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - IntegrityLevel
- question: What process spawned this command, and does that parent explain the pictographic characters?
  context: >-
    The parent shows how the argument list was assembled. A shell under explorer.exe points to a
    person typing or pasting the text; a browser, mail client, office application, script host, or
    scheduled-task host points to the string being built programmatically, which is the case where
    the padding is doing work. The parent's own command line frequently carries the script or
    document that produced the alerting string. The long lookback is intentional — interactive shells
    and service parents routinely start hours or days before the child event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this command spawn afterward?
  context: >-
    The children show what the command line achieved once the interpreter parsed it. Character-level
    obfuscation is a wrapper rather than an end state, so the payload usually surfaces as a follow-on
    process — a script host, an archiver, a download utility, or a credential-access tool. Anchoring
    on the alerting process identifier keeps the result to actual descendants rather than every
    execution of the same program on the host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the alerting process make outbound network connections?
  context: >-
    A padded command line often wraps a retrieval step, so egress attributable to the process itself
    indicates the command reached a remote host. Correlating on the process identifier ties any
    connection to this execution rather than to the program in general. Connections to external
    addresses, on ports the program does not normally use, or to raw addresses rather than resolved
    names, are the rows worth pursuing.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did the alerting process write any files to disk?
  context: >-
    A reconstructed command that resolves to a download, an extraction, or a staging step leaves file
    writes attributable to the same process identifier. Writes into user-writable locations such as
    the profile tree, the public folder, or temporary directories are the ones to follow, since those
    are the paths a retrieved payload typically lands in before it runs.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
- question: Has this exact command line run on this host before?
  context: >-
    Because the rule pins no binary, counting executions of the program name answers little — what
    matters is whether this specific argument string belongs to the host's routine. A string that
    recurs on a steady cadence over months under the same account generally belongs to installed
    software or a scheduled job. A first-ever occurrence points to something introduced recently.
    Note which accounts have produced it: a string that normally runs under a service account and now
    appears under a person is a change that needs an explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - User
- question: Has this exact command line ever appeared on any other host in the fleet?
  context: >-
    Pivoting the identical argument string fleet-wide over a long window separates deployed software
    and standard automation, which emit the same string across many hosts over months, from activity
    confined to this endpoint. A string that surfaces on a few hosts only in recent days, rather than
    steadily across the estate, points to something introduced by an operator or a tool rather than
    by the environment's normal software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other tools ran on this host around the same time?
  context: >-
    Obfuscated execution rarely stands alone. The surrounding process activity commonly shows what
    preceded and followed it — reconnaissance utilities, archivers, credential tooling, or
    persistence installers — and places the alerting command in a sequence. The aggregation collapses
    repetitive agent and service telemetry into high-count rows so that infrequently seen programs
    stand out at the bottom.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Grouping by program and parent exposes the parent-child relationships active on the host during
    the alert window. Repetitive background telemetry collapses into a few high-count rows while
    novel pairings appear at low counts. An office application or browser launching an interpreter,
    or a service host launching a shell, is the kind of pairing that gives the alerting command its
    context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host place this event in a sequence. Defense tampering,
    reconnaissance, or credential access preceding a padded command line suggests the command is a
    later stage of activity already under way rather than an isolated event, and the earlier alerts
    usually identify the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account across every host in the alert window shows whether the activity is confined
    to this endpoint or the same account is simultaneously active on several. Concurrent execution
    across multiple hosts under one account points to remote administration or lateral movement. If
    the alert fired under a service or machine account, expect this view to return background
    telemetry from the whole estate and rely on the fleet-wide command-line pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same command line run on other hosts within the alert window?
  context: >-
    Under a service or machine account a user-scoped sweep returns agent telemetry from every
    endpoint, so the answerable question becomes whether the identical argument string executed
    elsewhere at the same time. Several hosts producing it inside the same window points to a pushed
    or scheduled rollout; a single host points to a local trigger such as one person or one document
    on this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|expand: '%CommandLine%'
      condition: selection
    fields:
      - host.name
- question: Is there software or a business process on this host that legitimately emits these characters on a command line?
  context: >-
    Chat and collaboration clients, localization and internationalization test suites, build and
    packaging scripts that decorate console output, and user-chosen file and folder names all place
    emoji and pictographic characters onto argument lists as normal behavior. Check the software
    inventory, recent change records, and the owner of the host or account for one of those
    explanations. A named owner and a matching change record close the alert; an unexplained string
    on a server or under a service account does not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
