name: PowerShell as a Service in Registry
id: aea95819-824c-49b2-ab71-ed1072adc696
description: |
  Detects a Windows service ImagePath value under HKLM\SYSTEM\...\Services\<name> being set to a
  command that invokes powershell.exe or pwsh.exe. Registering PowerShell as a service combines
  persistence with execution: the service control manager runs the configured command under
  services.exe every time the service starts, so the payload survives reboots and executes with
  service privileges (T1569.002 / T1059.001). Legitimate installers occasionally register
  interpreter-hosted services, so the investigation must decode the ImagePath command, identify the
  writing process and its lineage, and confirm whether services.exe actually launched PowerShell.
type: detection
detection_id: 4a5f5a5e-ac01-474b-9b4e-d61298c9df1d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the service registry key and its ImagePath value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject ends in
    \ImagePath under a \Services\ subkey), the value data (Details), and the writing process against
    the rule's detection criteria. The rule fires when a service ImagePath is set to a value
    containing powershell or pwsh.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register or reconfigure Windows services?
  context: >-
    Legitimate service installation is usually performed by installers, configuration-management
    tooling, or administrators. Knowing whether the writing user and host function match that
    profile is often the fastest way to separate a true positive from routine provisioning. User
    attribution is present on roughly 94 percent of endpoint registry events; when it is a machine
    account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which service does this ImagePath belong to, and is a PowerShell-hosted service binary expected here?
  context: >-
    The key path names the service (HKLM\SYSTEM\CurrentControlSet\Services\<name>\ImagePath), and an
    ImagePath that launches an interpreter rather than a compiled binary is the persistence-plus-execution
    pattern this rule targets. Compare the service name and its configured command against known-good
    services on this host; unfamiliar service names hosting powershell.exe are the ones that need
    scrutiny.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command is stored in the ImagePath value, and what does it do when the service starts?
  context: >-
    The Details field holds the exact command the service control manager will run. Decode any
    -enc / -e / -EncodedCommand base64 payload and any string concatenation or char-code obfuscation
    to recover the real script. Look for download cradles (Net.WebClient, IWR/IEX), in-memory
    assembly loading ([Reflection.Assembly]::Load), or registry-stored payload retrieval. Details is
    present on roughly 79 percent of registry modifications; when it is absent the value data was
    binary or empty and the payload must be read from the service execution instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the ImagePath command encoded or obfuscated, and what does it decode to?
  context: >-
    Attackers frequently hide the service payload behind PowerShell's -EncodedCommand (-enc)
    parameter or string concatenation, backtick escaping, and variable substitution. Base64-encoded
    commands are the most common form. Decoding reveals the actual payload -- download cradles,
    reverse shells, or in-memory execution of .NET assemblies retrieved from another registry value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script the service ran?
  context: >-
    Windows Event ID 4104 records the deobfuscated script content PowerShell actually executes, even
    when the ImagePath command is encoded or obfuscated. This is ground truth about what ran, bypassing
    attacker obfuscation. If PowerShell operational logs are not ingested in this environment, treat
    zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened around this service registration?
  context: >-
    Attackers often disable or bypass PowerShell protections before running a payload. Common
    techniques include AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, and downgrade attacks
    (powershell.exe -Version 2, which lacks logging). Finding these precursor events strengthens the
    case that the service payload is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Does the PowerShell service ImagePath remain configured after the alert, or was it re-modified?
  context: >-
    Registry key and value deletions are not observable in endpoint telemetry, so attacker cleanup of
    the service cannot be confirmed directly. Judge whether the persistence remains active from the
    key's re-modification history over the window after the alert -- a value that is set once and left
    in place is configured persistence, while a value that is set and quickly overwritten may be a
    transient PsExec-style service that removed itself after running.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did the service actually run -- did services.exe spawn powershell.exe on this host?
  context: >-
    A configured ImagePath only matters if the service control manager launched it. Look for
    services.exe spawning powershell.exe or pwsh.exe after the registry change; that process is the
    execution half of the persistence and carries the resolved command line. Absence of the execution
    means the service was registered but not yet started, which changes the urgency but not the intent.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \services.exe
        Image|endswith:
          - \powershell.exe
          - \pwsh.exe
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: After the service ran, did powershell.exe make outbound network connections, and to where?
  context: >-
    Service-hosted PowerShell payloads commonly beacon to command-and-control or pull a second stage.
    Outbound connections from powershell.exe following the service execution point to a download cradle
    or C2 channel; correlate the destination address and port against known-good egress. A transient
    service that connects once to an unfamiliar host is a stronger signal than steady traffic to an
    internal update endpoint.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \pwsh.exe
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Has this service's ImagePath key been set before on this host?
  context: >-
    A service key that has never been written before is more suspicious than one reconfigured as part
    of routine software maintenance. Zero history for this ImagePath indicates a newly created or
    newly hijacked service; a history of the same value being set points to an established, likely
    legitimate service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same service ImagePath key set on other hosts in the environment?
  context: >-
    The same service registration appearing on multiple hosts may indicate a software deployment, a
    group policy push, or widespread malware or lateral movement. If only this host carries the
    modification it may be targeted. Compare the Details values across hosts to see whether the same
    command is being planted everywhere or the payloads differ per host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other registry modifications made on this host in the same window?
  context: >-
    Actors who register a malicious service often make several registry changes together -- adding a
    Run key, disabling defenses, or altering firewall rules. Registry changes clustered from the same
    writing process within a short window reveal the full scope of the configuration changes and
    whether multiple objectives were pursued in one session.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What spawned the process that wrote this service key?
  context: >-
    The registry alert names the immediate writing process, but its parent reveals how the service
    registration was driven. A writing process descended from an installer or configuration tool
    reads differently than one descended from an Office application, a script host, or a remote
    execution service. Walking up the lineage shows whether the registration came from expected
    administration or from a delivery chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity around the registry change reveals
    what led to it and what followed -- reconnaissance, privilege escalation, credential access, or
    additional persistence. Aggregating by process and parent collapses repetitive agent telemetry
    while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may
    reveal the attack stages that preceded the service registration and help reconstruct the timeline.
    Defense tampering or credential access shortly before persistence points to a hands-on session
    rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
