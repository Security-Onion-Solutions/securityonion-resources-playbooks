name: Taskkill Symantec Endpoint Protection
id: 883f2870-197b-4234-96bb-5745e8cc2e7c
description: |
  Detects a taskkill command line that force-terminates the Symantec Endpoint Protection
  service host process ccSvcHst.exe — the command line contains taskkill together with the
  /F and /IM flags and the process name ccSvcHst.exe. Forcibly killing the AV service host
  disables endpoint protection without uninstalling it, which is a common precursor to
  payload execution, credential access, or ransomware deployment; it can also appear during
  legitimate SEP uninstall or troubleshooting performed by IT. The investigation should
  determine whether protection was actually torn down, who or what issued the command, and
  what activity followed once the service was stopped.
type: detection
detection_id: 4a6713f6-3331-11ed-a261-0242ac120002
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — taskkill with /F and /IM targeting ccSvcHst.exe?
  context: Confirm the alert is a true positive before investing further time. Review the exact command line of the triggering event and verify it contains taskkill, the /F (force) and /IM (image name) flags, and the target process ccSvcHst.exe, which is the Symantec Endpoint Protection service host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to stop the Symantec Endpoint Protection service from the command line?
  context: Legitimate SEP uninstall, repair, or troubleshooting can issue this exact command, typically from IT staff or a deployment account on managed endpoints. Knowing whether the user role and host function are consistent with manual AV service management is often the fastest way to separate routine maintenance from tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Symantec process was targeted, and was this part of a sequence of taskkill commands against AV components?
  context: Force-killing ccSvcHst.exe stops the core SEP service host and leaves the endpoint without active protection. Read the full command line to confirm the exact target process and the flags used, and note whether the same operation also targeted related Symantec components such as Smc.exe, SmcGui.exe, or PAUI.exe, since teardown sequences often kill several processes in turn.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is Symantec Endpoint Protection currently running again on this host, or is it still stopped?
  context: Killing the service host with /F is a runtime action — the service may auto-restart, or it may stay down until manually restarted or the host reboots. Confirm the current protection state; if ccSvcHst.exe is not running, the host remains unprotected and the service should be restored before further investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the taskkill command, and is that parent chain expected?
  context: The parent process reveals how the kill command was invoked. A parent of explorer.exe or an interactive cmd.exe points to hands-on activity; parents such as a deployment agent or scripting host (wscript.exe, powershell.exe) point to automation; unusual parents like mshta.exe or an Office application suggest the command was launched as part of an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this taskkill-against-ccSvcHst pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine SEP maintenance leaves a historical signature. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how this specific firing pattern has run here before. A new parent process, an unexpected user account, or a one-off where prior activity was scripted is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - taskkill
        - ' /F '
        - ' /IM '
        - ccSvcHst.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What activity occurred on this host after the Symantec service was killed?
  context: Defenses are disabled to enable something — payload execution, credential dumping, or other actions that protection would normally block or log. Examine process activity in the window immediately after the service host was stopped; new execution clustered right after the kill points to what the tampering was meant to enable.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the same time?
  context: An operator who kills one AV component often disables several controls — stopping additional services, clearing event logs, deleting shadow copies, or disabling Defender — to maximize coverage. Finding multiple tampering events from the same user or parent process indicates a deliberate teardown rather than an isolated administrative action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were security-product service registry keys disabled or deleted on this host around the alert?
  context: Killing the service host stops protection at runtime, but durable teardown often also edits the service registry — setting the Start value to disabled or removing the service key so it does not come back after reboot. This surfaces modifications to AV/EDR service registry paths, which are not visible from command-line monitoring alone. Populated rows alongside the kill command point to a deliberate, persistent disable rather than a one-time stop.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_service_keys:
        TargetObject|contains:
          - '\Services\SepMasterService\'
          - '\Services\SmcService\'
          - '\Services\ccSvcHst\'
          - '\Services\SAVService\'
          - '\Services\SAVAdminService\'
          - '\Services\WinDefend\'
          - '\Services\Sense\'
          - '\Services\SecurityHealthService\'
      condition: selection_host and selection_service_keys
    fields:
      - TargetObject
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - taskkill
        - ' /F '
        - ' /IM '
        - ccSvcHst.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - taskkill
        - ' /F '
        - ' /IM '
        - ccSvcHst.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated action on multiple endpoints. If the same user disabled protection or ran other commands on several hosts in this window, the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - taskkill
        - ' /F '
        - ' /IM '
        - ccSvcHst.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the broader set of processes around the kill command reveals what led up to it and what followed — reconnaissance, privilege escalation, or persistence installation that frames the disabling of protection within a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or other defense tampering — may reveal the attack stages that preceded the service kill and help reconstruct the timeline. Disabling protection is frequently a mid-chain step rather than the first action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this kill-ccSvcHst pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this firing pattern rather than generic taskkill usage. Many hosts running the same pattern points to scripted deployment or SEP-removal automation; one host or a small unrelated set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - taskkill
        - ' /F '
        - ' /IM '
        - ccSvcHst.exe
      condition: selection
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host around the alert?
  context: Disabling protection is often paired with establishing or refreshing persistence so access survives a reboot. After tearing down AV, operators commonly install scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Persistence tooling running in the same timeframe as the service kill indicates deliberate footholding rather than isolated maintenance.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
