name: Writing Local Admin Share
id: 4039c898-ee9b-4a2f-b6eb-9c2db020d125
description: |
  Detects a file written to the local administrative share over the loopback address, where the
  target path contains both the loopback prefix (127.0.0) and the ADMIN$ share segment. Post-exploitation
  frameworks execute a command locally and redirect its output to the loopback admin share for collection
  (for example, cmd /c <command> 1> \\127.0.0.1\ADMIN$\output.txt), and admin shares are also used to stage
  tools and service binaries for remote execution and lateral tool transfer. Legitimate use is rare and
  limited to a small set of remote-administration and deployment tooling. Investigation should determine what
  command or process produced the write, what was staged on the share, how the activity was invoked (local
  interactive use versus a remote-execution service), and whether the staged artifact then executed.
type: detection
detection_id: 4aafb0fa-bff5-4b9d-b99e-8093e659c65f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the file path match a write to the loopback administrative share this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when the written path
    contains both the loopback address (127.0.0) and the ADMIN$ share segment, indicating a file written to
    the local administrative share over SMB. Review the exact file name, the operation performed, and the
    responsible process against that criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files to an administrative share?
  context: >-
    Writing to ADMIN$ is a routine operation for a small set of remote-administration and deployment tools but
    unusual for most users and endpoints. Knowing whether the user role and host function involve remote
    management over SMB is often the fastest way to separate sanctioned administration from staging by an
    intruder. When the responsible account is a machine or service account, judge by the writing process and
    host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command redirected its output to the admin share?
  context: >-
    Post-exploitation frameworks run a command locally and redirect its output to the loopback admin share for
    collection, typically as cmd /c <command> 1> \\127.0.0.1\ADMIN$\<file>. Recovering the full command line
    identifies exactly what was executed and what data was being collected. The write itself often surfaces
    under the SMB server process, so the driving command is found by matching the redirect target in the
    command line rather than the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - '127.0.0'
          - 'ADMIN$'
      condition: selection
    fields:
      - CommandLine
      - Image
      - ParentImage
- question: What is the content of the file written to the admin share?
  context: >-
    The written file is the artifact staged on the share -- command output, a script, or a tool binary.
    Retrieve it and examine its content: for text or script output, check for reconnaissance results,
    credentials, or embedded commands; for binaries, check strings, imports, packer signatures, and signing
    status. Content analysis answers what is in the file, distinct from a hash or reputation lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process launched the one responsible for this write, and is that chain expected?
  context: >-
    The write to the loopback admin share commonly surfaces under the SMB server (System) or a command
    interpreter redirecting output. Tracing the responsible process's parent reveals whether the operation was
    driven by a remote-execution mechanism -- a service control host, WMI provider, or PsExec-style service --
    or by ordinary interactive administration. If the parent identifier resolves to no data, fall back to the
    redirecting command line surfaced by the admin-share command question.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the write driven by a remote-execution service such as WMI, service control, or a PsExec service?
  context: >-
    Redirecting command output to the loopback admin share is the collection step of remote command execution.
    Commands invoked remotely commonly appear as children of the WMI provider (wmiprvse.exe), the service
    control host (services.exe), or a dropped execution service (PSEXESVC.exe). Their presence around the write
    ties the activity to a remote operator rather than local interactive use.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\wmiprvse.exe'
          - '\services.exe'
          - '\PSEXESVC.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did an inbound remote-administration connection reach this host around the alert?
  context: >-
    Writes to an admin share are frequently the collection step of a remotely invoked command. An inbound
    connection over SMB (445/135), WinRM (5985/5986), or RDP (3389) shortly before the write points to a remote
    source driving the activity, and the originating address shows whether it came from a known administrative
    jump host or an unexpected system. For the loopback case the driving session may originate on the same host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account and logon session drove the write, and how did it authenticate?
  context: >-
    Access to an admin share requires an authenticated SMB session. Network logons (type 3) with no matching
    interactive logon can indicate credential replay such as pass-the-hash; use of valid credentials suggests
    the account was obtained through dumping, phishing, or prior compromise. The account context on the
    responsible process is the starting point; corroborate with Security logon events (4624/4648) where they
    are collected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: If the staged file was executed, what is its hash and does it have known detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written. If the artifact staged on the share is a
    tool or service binary -- as with PsExec-style remote execution -- it may run shortly after. This looks for
    it executing and reads its hash; submit that to threat intelligence to determine whether it is known
    malicious, benign, or previously unseen. If it is present but has not executed, retrieve it from its
    on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
      - CommandLine
- question: What other files have been written to the admin share on this host recently, and by which processes?
  context: >-
    A single staged file is less telling than the pattern of admin-share writes over time. Other recent
    arrivals under ADMIN$ reveal whether this is an isolated redirect or a share under active use for tool
    transfer and output collection, and which processes are doing the writing. A single unfamiliar writer
    across several files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ADMIN$\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was the same file staged on any other hosts in the environment?
  context: >-
    Finding the same artifact on multiple hosts points to distribution across the environment rather than a
    single target. If the file name is generic, such as a command-output file, weight the result cautiously and
    corroborate with the writing process and timing; a distinctive tool or payload name appearing on several
    hosts is stronger evidence of lateral tool transfer.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced admin-share writes like this before, and does that history fit their role?
  context: >-
    The query mirrors the rule's own match scoped to this user, returning their 90-day history of writing to the
    loopback admin share -- not generic file activity -- grouped by host. A user who has never produced this
    pattern is more notable than one who does so routinely as part of sanctioned administration; weigh the count
    against the user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains|all:
        - \\\\127.0.0
        - \ADMIN$\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven admin-share writes like this before on this host or across the environment?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the behavior; the
    launch mechanism does. This mirrors the rule's match scoped to the responsible program, returning its
    90-day history of driving this write pattern, grouped by host. A new or rare program for this pattern is the
    deviation worth chasing; a program already responsible for many prior events is more likely vendor or
    operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains|all:
        - \\\\127.0.0
        - \ADMIN$\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity beyond the alerting host reveals whether this is isolated or part of
    movement across several endpoints. The same account driving similar activity on multiple hosts in a short
    window widens the likely scope. When the alert fires under a service or machine account this view is
    dominated by routine agent activity, and the parent-mechanism view is the meaningful read in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven write pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, network-wide user activity is mostly routine agent noise. The meaningful
    question is whether the same launch mechanism produced this write elsewhere at the same time. This mirrors
    the rule's match scoped to the responsible program across all hosts in the alert window; several hosts
    point to scheduled or pushed automation, while a single host points to a locally driven trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains|all:
        - \\\\127.0.0
        - \ADMIN$\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this write?
  context: >-
    Admin-share writes rarely occur in isolation. Earlier detections on the same host -- credential access,
    reconnaissance, or a remote-execution mechanism -- may reveal the stages that preceded this event and help
    reconstruct the timeline into a single operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
