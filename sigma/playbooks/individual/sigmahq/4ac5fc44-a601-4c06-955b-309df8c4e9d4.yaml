name: OceanLotus Registry Activity
id: a72427c9-ddf0-4f5c-82f8-9588ef1a513a
description: |
  Detects a registry write matching OceanLotus (APT32) persistence and sideload-config anchors: either a CLSID "Model" value under a hardcoded class GUID used to store an encoded DLL offset, one of several hardcoded AppX package class registrations under HKCU\SOFTWARE\Classes, or a generic HKLM/HKCU SOFTWARE\App key together with an AppX Application or DefaultIcon key for one of three package GUIDs. None of these identifiers correspond to Microsoft or common third-party components, so a match on any branch is not routine software registering itself. Investigation should confirm which branch fired, decode the value written, attribute the writing process and its parent, and determine whether the registered component was subsequently loaded or executed.
type: detection
detection_id: 4ac5fc44-a601-4c06-955b-309df8c4e9d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the registry key path match either the CLSID Model key, one of the known AppX class registrations, or the combined App/AppX key pair this rule detects?
  context: Confirm this is a true positive before investigating further. The rule fires on any of three independent branches — a CLSID Model value, a known-GUID AppX class registration, or a generic App key written together with an AppX Application/DefaultIcon key for one of three package GUIDs. Note which branch fired; it determines which of the specific GUIDs and downstream questions carry the most weight.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user or host expected to write to this registry location?
  context: These CLSID and AppX class paths are not created by Microsoft components or common third-party installers, so legitimate writes are rare. Confirming the user's role and the host's function against this activity is often the fastest way to separate a true positive from an unusual but authorized software installation that happens to register its own COM class.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the process that wrote this value expected to modify CLSID or AppX keys, and what started it?
  context: Writes to CLSID Model values and AppX class registrations are normally made by installers or DLL-registration utilities, not general-purpose shells or scripting hosts. Tracing the parent lineage of the writing process shows whether this came from a controlled installation step or from a process chain rooted in a decoy document or self-extracting archive.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was there a change ticket or documented deployment for software that registers this CLSID or AppX package?
  context: Software installations that legitimately register COM classes or AppX packages are typically tied to a deployment record. A matching ticket supports a benign explanation; the absence of one for an unfamiliar, hardcoded GUID supports treating the write as unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Does the timing of this registry write align with a documented software installation or maintenance window?
  context: A registry write to an unrecognized CLSID or AppX identifier during a scheduled deployment window is more consistent with legitimate software than the same write occurring outside business hours or any known change activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Is this method of registering COM or AppX components consistent with how software is normally deployed in this environment?
  context: Managed deployment tooling typically installs software through package managers or endpoint management platforms rather than a directly executed process writing individual registry values. A write performed outside the normal deployment path is worth scrutinizing even if the writing process itself looks unremarkable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is this specific CLSID or AppX location a known persistence/config anchor, and what value was written?
  context: The CLSID Model value stores an encoded DLL offset used by a sideloaded component; the AppX class and App key registrations serve as class-activation anchors for a decoy-delivered payload. None of these hardcoded GUIDs correspond to standard Windows or common third-party components, so the specific path and value written determine what gets activated and how.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to this key, and does it decode to a DLL offset, path, or configuration data?
  context: The value data behind these anchors typically holds either an encoded offset pointing into a sideloaded library, an obfuscated configuration blob, or a counter/value pair used to track state across executions. Analyze the value for encoded content or embedded paths rather than treating it as opaque.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry keys modified on this host around the same time?
  context: This detection covers several independent identifiers — a CLSID Model key, multiple AppX class registrations, and an App key — and an install sequence may write more than one of them in the same session. Look for the same writing process touching several of these paths, or other unrelated persistence and tamper keys landing together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does a component referenced by this key's value exist on disk, and is it present across sessions?
  context: A CLSID or AppX registration is inert without the sideloaded library or executable it activates. If a path or offset in the value data points to a file, confirm that file's presence and creation time; the write itself carries no hash, so hash the file from a later execution or retrieve it separately if a reputation check is needed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Has this exact CLSID or AppX key been modified before on this host?
  context: These identifiers are not standard Windows components, so a first-time write is the expected case for a compromised host and a routine one only if specific software legitimately owns that GUID. Compare the value data across any prior writes to see whether the same or different content is being set each time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Did a DLL-registration process subsequently load a component tied to this registration?
  context: One documented activation path for this class of registration is an explicit registration call — a process invoking a DLL's export to complete the registration — followed later by ordinary class activation. Confirm whether such a call occurred after the write; deletion of the key itself is not observable, so judge cleanup from re-modification history and from whether the registered component executed, not from the key disappearing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_loader:
        Image|endswith:
          - '\regsvr32.exe'
          - '\rundll32.exe'
      condition: selection and selection_loader
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - registry_event
- question: Was this same CLSID or AppX key modified on other hosts?
  context: These identifiers are hardcoded and specific enough that the same value appearing across multiple hosts points to a shared deployment — either a fleet-wide compromise using the same build, or, far less likely given how specific the GUIDs are, a coincidental legitimate use. Compare the value data written on each host rather than assuming the mere presence of the key means the same thing everywhere.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the registry modification?
  context: Registry writes like this rarely happen in isolation. Reviewing surrounding process activity, grouped to surface novel parent-child pairs rather than routine agent noise, shows what led up to the write and what followed it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this modification?
  context: Earlier detections on the same host — a decoy document opening, discovery commands, or an initial dropper execution — may reveal the stages that preceded this registry write and help reconstruct the full sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the same time?
  context: A CLSID/AppX registration is one persistence path among several an operator may stack for redundancy — scheduled tasks, services, or Run-key entries installed through separate tooling. Persistence tool executions clustered in the same window as this write point to intentional stacking rather than isolated administrative activity.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
