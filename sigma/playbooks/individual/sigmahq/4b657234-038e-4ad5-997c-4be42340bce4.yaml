name: Network Connection Initiated To Visual Studio Code Tunnels Domain
id: 84d3d71e-6d9d-4755-ae34-dc725319b9c0
description: |
  Detects an outbound network connection initiated by a process on the host to a
  Visual Studio Code tunnel domain (a destination host ending in
  .tunnels.api.visualstudio.com). VS Code Remote Tunnels let an operator reach an
  endpoint through Microsoft-operated infrastructure using the Microsoft-signed code
  CLI, which is legitimate for developers working remotely but can be repurposed as a
  reverse-shell or persistence channel that blends into normal developer traffic
  (protocol tunneling and exfiltration over a trusted web service). Because the
  destination is Microsoft infrastructure and not inherently malicious, weight the
  investigation on which process and user initiated the connection and whether that
  host and user legitimately use VS Code tunnels.
type: detection
detection_id: 4b657234-038e-4ad5-997c-4be42340bce4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the destination and port match the Visual Studio Code tunnel domain this rule detects, and which process initiated the connection?
  context: Confirm the alert by reviewing the destination host or IP, the port, the connection direction, and the initiating process against the rule's criteria. The rule fires on an outbound connection whose destination host ends in .tunnels.api.visualstudio.com. Destination host names are rarely recorded on connection events on this grid, so anchor on the IP and recover the name from the DNS lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
  answer_sources:
  - alert
  - network_connection
- question: Is this user and host expected to use Visual Studio Code Remote Tunnels?
  context: Legitimate developer activity can trigger this detection when someone runs the VS Code tunnel feature for remote work. Knowing whether this user writes or debugs code and whether this host is a developer workstation is often the fastest way to separate routine tunnel use from an operator using the signed CLI as a remote-access channel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is Visual Studio Code Remote Tunnels approved for remote access on this host?
  context: Organizations usually sanction a specific set of remote-access and tunneling tools. The VS Code tunnel CLI reaches an endpoint through Microsoft infrastructure and is frequently outside the approved list even though the binary is Microsoft-signed. Treat the whitelist of allowed tunneling tools and monitored web services as the baseline, and review anything outside it regardless of the signer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is there a helpdesk ticket, maintenance window, or approved development use case for this tunnel?
  context: Legitimate tunnel use usually maps to a support ticket, a scheduled task, or a developer request. If no such context exists, the tunnel may have been established by an operator for persistent hands-on access or by a user circumventing controls. The command line may carry a --name value that names the tunnel and a --cli-data-dir path that relocates its state files.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What did the Visual Studio Code CLI do on this host around the alert? Decode its full command line and working directory.
  context: The tunnel subcommand on code.exe or code-tunnel.exe is what turns the editor CLI into a remote-access channel. Read the full command line for the tunnel keyword, a --name value that persists the tunnel identity, --accept-server-license-terms, and a --cli-data-dir override that moves the state files off the default path. The working directory can reveal whether the CLI was run from a portable download folder rather than an installed location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \code.exe
          - \code-tunnel.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the Visual Studio Code CLI, and is that parent chain expected?
  context: The parent reveals how the CLI was launched. A user opening VS Code normally traces back to explorer.exe. A parent such as powershell.exe, cmd.exe, or a script host points to an automated or scripted launch, which matches the pattern where a downloaded portable CLI is unpacked and started from a shell or a shortcut. If process-parent fields are not recorded on the connection event, recover the launch chain from the process-creation record for this process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the Visual Studio Code CLI spawn on this host around the alert?
  context: Once a tunnel is live, the operator drives an interactive session that spawns child processes under the CLI. A chain of code.exe or code-tunnel.exe into cmd.exe, node.exe, winpty-agent.exe, or powershell.exe is the interactive-shell footprint of the tunnel being used hands-on rather than a dormant registration. Read the child command lines to see what was run through the session.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - \code.exe
          - \code-tunnel.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did this host resolve a Visual Studio Code tunnel domain, and which process issued the lookup?
  context: The connection event records an IP, and the tunnel domain is only sparsely present on it. DNS lookups on this host for names ending in .tunnels.api.visualstudio.com or .devtunnels.ms recover the domain the process reached and attribute the lookup to a process image. Registration of a tunnel pulls region cluster names after the global domain, so expect several related lookups rather than a single one.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
          - .tunnels.api.visualstudio.com
          - .devtunnels.ms
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
  - network_connection
- question: What is this destination, and does it fall within Microsoft's Visual Studio Code tunnel infrastructure?
  context: The tunnel endpoints resolve to Microsoft-operated infrastructure, so registration age and reputation are not decisive here the way they are for arbitrary domains. Confirm the destination host and port sit within the tunnels.api.visualstudio.com or devtunnels.ms space, then shift weight to which process and user drove the connection. Traffic to trusted Microsoft infrastructure is exactly what lets this channel blend into normal developer activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Does this host normally connect to Visual Studio Code tunnel infrastructure?
  context: A host that has never reached tunnel infrastructure before, or reached it only inside the alert window, is more likely a new tunnel registration than established developer traffic. The historical count grouped by port and process shows whether this endpoint is routine for the host and which process usually drives it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
  - dns_query
- question: What other connections were made to this destination or from the initiating process?
  context: A single connection may be part of a longer session. Check other connections to the same endpoint on different ports and other destinations the same process reached in the surrounding window. A steady, periodic connection profile or a sustained session with a high outbound-to-inbound data ratio points to an active tunnel carrying interactive traffic or data leaving the host.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
  answer_sources:
  - network_connection
  - dns_query
- question: What external endpoints did the initiating process connect to beyond the tunnel domain?
  context: Enumerating every destination the process reached shows whether it spoke only to Microsoft tunnel infrastructure or also to other endpoints. A separate connection to an unrelated host can be a staging download of the portable CLI or an out-of-band relay used to hand the operator the device code needed to pair the tunnel. Destinations outside the vendor space are the ones to examine.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - network_connection
- question: Which other hosts in the environment resolved Visual Studio Code tunnel domains?
  context: If only one host reaches tunnel infrastructure, the activity may be targeted or isolated to one user. If many hosts resolve tunnel domains, it may reflect a development team using the feature or a wider foothold. Grouping the fleet-wide lookups by host and process shows the spread and which process drives it on each host. Resolving by domain rather than a single cluster IP catches hosts steered to different region endpoints.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith:
          - .tunnels.api.visualstudio.com
          - .devtunnels.ms
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - dns_query
  - network_connection
- question: How regularly does the Visual Studio Code CLI run on this host, and under which users?
  context: The editor CLI is common on developer workstations but unusual elsewhere, and the portable tunnel build is rarer still. A near-zero history on this host, or execution under a user who does not develop software, is the deviation worth chasing. The 90-day count grouped by user shows whether this is established usage or a first appearance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \code.exe
          - \code-tunnel.exe
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur alone. The processes running on the host in the minutes around the connection show what led up to it and what followed. Look for a download of the portable CLI, a shell that unpacked and launched it, or reconnaissance and credential access nearby.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as a suspicious download, a signed-binary proxy execution, or defense tampering, may reveal the stages that set up this tunnel and help reconstruct the timeline. Establishing a remote-access tunnel is often a post-foothold step that follows earlier execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were Visual Studio Code tunnel state files created on this host?
  context: Registering a tunnel writes state files, most notably code_tunnel.json holding the tunnel name and cluster, and license_consent.json recording the consent bypass, under the user profile CLI data directory by default. Their creation corroborates that a tunnel was set up rather than a transient connection, and the writing process image ties the files to the CLI. The default path can be relocated with --cli-data-dir, so absence at the default location is not proof that nothing happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - \code_tunnel.json
          - \license_consent.json
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
