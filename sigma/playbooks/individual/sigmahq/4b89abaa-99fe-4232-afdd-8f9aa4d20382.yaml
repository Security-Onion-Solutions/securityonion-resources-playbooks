- question: "Does the user or the team responsible for this host recall running the process or software that generated this outbound connection?"
  context: "Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If no one recalls installing or running the connecting software, the process may be automated malware or a compromised account; if they do, capture what the application is and why it connects externally."
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: "Were other process-based persistence mechanisms installed on this host around the time of the callback?"
  context: "A callback channel is often paired with persistence so the implant survives reboot. Scheduled tasks, services, registry Run-key writes, BITS jobs, or WMI subscriptions installed in the same window indicate intentional foothold-building rather than isolated activity."
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: "Were files dropped to persistence locations such as the Startup folder or Run-key paths on this host?"
  context: "File-based persistence bypasses command-line detection entirely - dropping an executable or script into a Startup folder or a Run-key-referenced path achieves persistence without invoking schtasks, sc, or reg. File-write monitoring captures these drops even when the standard persistence tools are avoided."
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
