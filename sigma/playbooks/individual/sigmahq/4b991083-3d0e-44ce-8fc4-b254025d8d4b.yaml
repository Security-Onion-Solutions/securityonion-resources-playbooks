name: Unusual Parent Process For Cmd.EXE
id: 312bdd15-a20e-4d82-b31d-2eef58754e2a
description: |
  Detects the creation of cmd.exe when its parent process is one of a fixed list of Windows
  system binaries, service hosts, and third-party updaters that have no routine reason to launch
  a command interpreter — csrss.exe, lsass.exe, LogonUI.exe, regsvr32.exe, spoolsv.exe, sppsvc.exe,
  taskhostw.exe, WerFault.exe, SearchIndexer.exe, GoogleUpdate.exe, jusched.exe and similar. Both
  halves must hold for the rule to fire: the child ends in cmd.exe and the parent ends in one of
  the listed binaries. A command interpreter under these parents is the observable effect of code
  running inside a process that was not written to spawn shells — process injection into a service
  or system process, a COM or handler hijack, an update or crash-handler path executing an attacker
  controlled command, or an installer stub calling out to a batch file. The same parents also have
  legitimate analogues: vendor updaters and maintenance components do invoke cmd.exe for install and
  cleanup steps, and IT automation frequently rides on those launchers. The investigation should
  establish which parent instance fired, what the cmd.exe command line actually did, whether that
  parent has driven the same execution on this host or fleet before, and what the interpreter
  spawned afterwards.
type: detection
detection_id: 4b991083-3d0e-44ce-8fc4-b254025d8d4b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event show cmd.exe spawned by one of the parent processes this rule lists?
  context: >-
    The rule requires both halves of the pairing at once: the child image ends in cmd.exe and the
    parent image ends in one of csrss.exe, ctfmon.exe, dllhost.exe, epad.exe, FlashPlayerUpdateService.exe,
    GoogleUpdate.exe, jucheck.exe, jusched.exe, LogonUI.exe, lsass.exe, regsvr32.exe, SearchIndexer.exe,
    SearchProtocolHost.exe, SIHClient.exe, sihost.exe, slui.exe, spoolsv.exe, sppsvc.exe, taskhostw.exe,
    unsecapp.exe, WerFault.exe, wermgr.exe, wlanext.exe, or WUDFHost.exe. Note which parent fired, because
    the rest of the investigation turns on what that specific launcher is expected to do.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this host and account expected to run cmd.exe under this parent as part of installed software or IT automation?
  context: >-
    Several of the listed parents launch a command interpreter during ordinary work — updaters run
    install and cleanup batch steps, servicing components call scripted maintenance tasks, and
    management tooling often rides on those same launchers. A build server, a software-distribution
    point, or an admin workstation makes the pairing routine in a way it would not be on a standard
    user endpoint, so the host function and the account under which it ran narrow the question quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this parent expected to spawn cmd.exe, and what started the parent itself?
  context: >-
    The parent-to-child pairing is the whole substance of this detection, so the parent's own origin
    decides the reading. A parent started by services.exe or the task scheduler on a timer points at
    vendor or OS automation; a parent started from a user-writable directory, from a browser or mail
    client, or with a command line that names a file the user just received points somewhere else.
    The parent's own command line frequently names the script, package, or crashed process that
    explains the interpreter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same parent instance spawn?
  context: >-
    A parent that legitimately calls a command interpreter usually does so as one step of a coherent
    task, and its other children read as part of that same task — an installer, a copy, a service
    control call. A parent whose children run reconnaissance, credential access, or a second
    interpreter is describing something else. Scoping to the exact parent instance rather than the
    parent binary name keeps common service hosts from flooding the result.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What exactly did this cmd.exe invocation do? Decode the full command line.
  context: >-
    Read every argument. Look for /c and /k, chained operators (&&, &, ||) that pack several actions
    into one invocation, redirection that writes output to a file, calls into another interpreter or
    a downloader, and quoted or caret-escaped strings used to break up keywords. An invocation with
    no arguments at all is also meaningful — it points at an interactive console rather than a scripted
    step. The query is pinned to the alerting process rather than to cmd.exe on this host, because
    cmd.exe is the most frequently created binary on Windows and a host-and-binary scope returns
    constant background volume instead of an answer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What did this cmd.exe instance go on to spawn?
  context: >-
    A command interpreter is a launcher, so its children describe the actual objective. A single
    child that matches the parent's apparent task (an installer, a copy, a service query) is
    consistent with automation. Script hosts, another interpreter, archive tools, or host and domain
    enumeration under the same interpreter describe a staged operation and change what needs to be
    collected next. An interpreter with no children at all points back to an interactive session.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the parent binary make network connections on this host around the time of the alert?
  context: >-
    Some of the listed parents talk to the network as part of their normal function — updaters poll
    for packages, crash handlers submit reports, servicing components fetch content — and connections
    to their vendor endpoints corroborate an ordinary maintenance path. Connections to an address or
    port that does not fit the parent's function, especially just before the interpreter started,
    describe content or instructions arriving from somewhere else.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has this parent process spawned cmd.exe on this host before, and what did those command lines look like?
  context: >-
    This counts the specific parent-to-cmd.exe pairing on this host over 90 days. A parent that has
    driven hundreds of prior interpreter launches with a repeating command line is an installed
    component or an IT automation path, and the alert is that path's routine behaviour. Zero or a
    handful of prior occurrences make the pairing novel on this host, which is the condition the
    rule was written to surface.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Do prior occurrences of this parent-spawned cmd.exe activity on this host fall into a regular schedule, or is this one isolated and outside any maintenance window?
  context: >-
    Update and servicing parents such as GoogleUpdate.exe, jusched.exe, jucheck.exe, SIHClient.exe,
    and sppsvc.exe run on timers, so the interpreter launches they drive recur at predictable intervals
    and often outside business hours by design. Listing the prior 30 days of the rule's exact pairing
    on this host, with timestamps and the account each ran under, separates a periodic maintenance
    cadence from a single execution with no precedent. Compare the result against the environment's
    known administrative maintenance windows.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        ParentImage|endswith:
        - \csrss.exe
        - \ctfmon.exe
        - \dllhost.exe
        - \epad.exe
        - \FlashPlayerUpdateService.exe
        - \GoogleUpdate.exe
        - \jucheck.exe
        - \jusched.exe
        - \LogonUI.exe
        - \lsass.exe
        - \regsvr32.exe
        - \SearchIndexer.exe
        - \SearchProtocolHost.exe
        - \SIHClient.exe
        - \sihost.exe
        - \slui.exe
        - \spoolsv.exe
        - \sppsvc.exe
        - \taskhostw.exe
        - \unsecapp.exe
        - \WerFault.exe
        - \wermgr.exe
        - \wlanext.exe
        - \WUDFHost.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - User
      - ParentImage
      - CommandLine
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Is the same parent-to-cmd.exe spawning pattern occurring on other hosts?
  context: >-
    The same launcher driving the same interpreter across many hosts is what deployed software and
    fleet-wide automation look like, and a wide, even distribution argues for a tuning entry rather
    than an incident. Activity confined to this host, or to a small set of hosts that share a user or
    a role, keeps the investigation local and makes the parent's origin the next thing to establish.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user account previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is the account's
    90-day history of this specific parent-spawned interpreter activity rather than generic cmd.exe
    use, aggregated by host. An administrator or an automation account with a long history across
    several hosts reads differently from a standard user account seeing this for the first time.
    Weigh the count against what the account's role actually requires.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        ParentImage|endswith:
        - \csrss.exe
        - \ctfmon.exe
        - \dllhost.exe
        - \epad.exe
        - \FlashPlayerUpdateService.exe
        - \GoogleUpdate.exe
        - \jucheck.exe
        - \jusched.exe
        - \LogonUI.exe
        - \lsass.exe
        - \regsvr32.exe
        - \SearchIndexer.exe
        - \SearchProtocolHost.exe
        - \SIHClient.exe
        - \sihost.exe
        - \slui.exe
        - \spoolsv.exe
        - \sppsvc.exe
        - \taskhostw.exe
        - \unsecapp.exe
        - \WerFault.exe
        - \wermgr.exe
        - \wlanext.exe
        - \WUDFHost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    These alerts frequently fire under SYSTEM or a service account, and in that case the account
    attributes nothing — the launch mechanism does. The query mirrors the rule's selection scoped to
    the alerting parent binary, so the result is the 90-day history of that parent driving this exact
    activity, aggregated by host. A parent already responsible for thousands of prior events is vendor
    or OS automation; a parent that is new to this activity is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        ParentImage|endswith:
        - \csrss.exe
        - \ctfmon.exe
        - \dllhost.exe
        - \epad.exe
        - \FlashPlayerUpdateService.exe
        - \GoogleUpdate.exe
        - \jucheck.exe
        - \jusched.exe
        - \LogonUI.exe
        - \lsass.exe
        - \regsvr32.exe
        - \SearchIndexer.exe
        - \SearchProtocolHost.exe
        - \SIHClient.exe
        - \sihost.exe
        - \slui.exe
        - \spoolsv.exe
        - \sppsvc.exe
        - \taskhostw.exe
        - \unsecapp.exe
        - \WerFault.exe
        - \wermgr.exe
        - \wlanext.exe
        - \WUDFHost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user account do across the environment around this time?
  context: >-
    Where a real user account is behind the alert, their activity on other hosts in the same window
    shows whether this was one step of a session that spans endpoints. If the alert fired under SYSTEM
    or another service principal this view returns background agent and servicing volume from every
    host, and the parent-scoped fleet view is the one that carries the answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven activity fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent binary, fleet-wide, in the
    alert window. Several hosts firing together points at scheduled or pushed automation — a package
    rollout, an update wave, a management task. A single host points at a host-local trigger, which
    keeps the parent's own origin and the interpreter's children as the next steps.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        ParentImage|endswith:
        - \csrss.exe
        - \ctfmon.exe
        - \dllhost.exe
        - \epad.exe
        - \FlashPlayerUpdateService.exe
        - \GoogleUpdate.exe
        - \jucheck.exe
        - \jusched.exe
        - \LogonUI.exe
        - \lsass.exe
        - \regsvr32.exe
        - \SearchIndexer.exe
        - \SearchProtocolHost.exe
        - \SIHClient.exe
        - \sihost.exe
        - \slui.exe
        - \spoolsv.exe
        - \sppsvc.exe
        - \taskhostw.exe
        - \unsecapp.exe
        - \WerFault.exe
        - \wermgr.exe
        - \wlanext.exe
        - \WUDFHost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by binary and parent collapses repetitive agent and
    service telemetry into single high-count rows, leaving novel parent-child pairings visible at low
    counts. Scan for other system or service processes launching interpreters or script hosts in the
    same window, which would indicate the interpreter under this parent is one instance of a broader
    condition on the host rather than an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Code running inside a service or system process usually leaves earlier traces — a loader, a
    handler or COM registration, an exploitation attempt against the parent, or a credential access
    step. Earlier detections on the same host help place this interpreter launch in a sequence and
    identify what to collect next; their absence keeps the parent's own origin as the primary lead.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
