name: Potential Iviewers.DLL Sideloading
id: 393f4e89-0642-43a1-a7e0-299d7ca20af2
description: |
  Detects the OLE/COM Object Interface Viewer library (iviewers.dll), a component that normally ships under the Windows Kits install directories, being loaded from any other location. Loading this DLL from a non-standard path through a legitimately signed host binary is characteristic of DLL search-order sideloading, where a planted or trojanized iviewers.dll is dropped next to a trusted executable so the attacker's code runs inside a trusted process for execution, persistence, or defense evasion (T1574.001). Investigation should establish where the DLL loaded from, its signature and hash, which process and parent loaded it, whether the same load appears on other hosts, and whether the load was preceded by a file drop or a DLL-redirection registry change.
type: detection
detection_id: 4c21b805-4dd7-469f-b47d-7383a8fcb437
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: 'Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the process that loaded it. The rule fires when a module named iviewers.dll loads from any path that is NOT under the Windows Kits install directories, so the load path is the decisive field: a path under the legitimate install tree would have been filtered out, and anything else (an application directory, a user-writable folder, a temp or staging path) is what triggered here. DLL loads carry a hash and signing status on the load event itself.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: What modules did this process load, and from which directories — is iviewers.dll loaded from a non-canonical path?
  context: 'The full set of modules a process loaded tells the operator''s story. Focus on where iviewers.dll came from: the legitimate copy lives under the Windows Kits directories, so a load from the loading application''s own directory, a user-writable folder (AppData, ProgramData, Public, %TEMP%), or any unrelated path is the search-order sideload the rule flags. Also note any other unsigned or non-canonical modules loaded by the same process in the same window, which can distinguish a single planted DLL from a wider set of staged components.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the loaded iviewers.dll?
  context: 'Module reputation separates a routine third-party DLL from a sideloaded malicious one. A genuinely signed copy loaded from an unexpected location may still be benign (some installers stage signed DLLs), but an unsigned module, or one whose signature is Expired, Distrusted, or Invalid, is a strong substitution indicator. SignatureStatus values to watch: Valid, Unsigned, Expired, Distrusted, Invalid. The Hashes field gives the DLL''s hash for a threat-intelligence lookup — compare it against the known-good iviewers.dll baseline to detect substitution.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the loading process and its full command line, and how was it invoked?
  context: The process that loaded iviewers.dll is the host binary the sideload runs inside. Its command line and working directory reveal how it was launched and whether it was run from the same non-standard directory the DLL was planted in — a common sideloading pattern is a signed executable copied alongside a malicious DLL into a user-writable folder. This query returns all executions of the loading binary on the host within the window, which for multi-step operations may span several invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this user and host expected to run the loading process and load this module?
  context: Legitimate developer and diagnostics activity can load iviewers.dll — the component ships with Windows Kits tooling. Knowing whether the user role and host function are consistent with running the loading binary and its debugging or COM-inspection workflow is often the fastest path to distinguishing an authorized use from a sideload. A load on a host with no development or diagnostics role is more suspicious than one on a developer workstation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned the loading binary, and is that parent chain expected?
  context: The parent that launched the loading process reveals how the sideload was set in motion. A signed host binary launched by explorer.exe during interactive use differs from the same binary spawned by a script host, an Office application, a mshta or wscript instance, or an unfamiliar dropper. An unexpected parent, or a parent that itself runs from a user-writable directory, points to attacker-controlled invocation rather than routine use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the sideloaded iviewers.dll and any related dropped file still on disk for analysis?
  context: If the DLL is still present at the load path, it can be hashed, submitted to a sandbox, and reviewed for tampering against the known-good copy. This query correlates file writes to the loading process and its direct children; the DLL may have been planted earlier by a separate dropper, so also check the directory of the load path directly if this returns nothing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were DLL-load-redirection registry keys modified on this host around the time of the load?
  context: Beyond planting a DLL in a search path, DLL hijacking can be reinforced through registry keys that influence module loading — AppInit_DLLs, KnownDLLs, and Image File Execution Options entries can force libraries into processes or redirect resolution. Modifications to these keys near the sideload time suggest the load was set up deliberately and may indicate a second, registry-based persistence path installed alongside the file-based one.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\KnownDLLs'
          - '\AppInit_DLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Has iviewers.dll been loaded on this host before, and under which processes?
  context: A first-time load of this module on a host is a stronger anomaly than a recurring one. If iviewers.dll has been loaded repeatedly by the same diagnostics or development binary over the past 90 days from a consistent location, this load is probably routine. If this is the first occurrence, or the historical loads were under entirely different processes or paths, the current load stands out and warrants the signature and hash checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the loading binary?
  context: A loading process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts for the binary indicate first-time or rare execution, which for a signed host executable that a sideload rides on can mean the binary was copied onto the host specifically to load the planted DLL. Expected applications that legitimately load iviewers.dll from non-standard locations belong on the environment's allow list.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is iviewers.dll being loaded on other hosts, and under which processes?
  context: 'Cross-host correlation surfaces how far the activity reaches. The same module loading from a non-standard path across multiple hosts points to multi-host activity or shared tooling rather than an isolated event. Pay attention to the variety of loading processes: the same DLL loaded by different or unexpected binaries on other hosts suggests deliberate distribution, while loads confined to one host and one expected binary look localized.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity in the minutes around the load reveals the immediate context: what launched the loading process, what ran before and after, and whether the load is part of a longer sequence. Look for a preceding file drop, reconnaissance, privilege escalation, or additional persistence being established.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or an initial-access event — may reveal the stages that preceded the sideload and help reconstruct the timeline. A cluster of related alerts before the load reframes it as one step in an ongoing sequence rather than a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or administrator recall running the loading process or the associated diagnostics activity?
  context: Direct confirmation from the person behind the account is often the fastest path to determining legitimacy. If the user does not recall running the binary that loaded iviewers.dll, their credentials may be in use by someone else or the activity may be automated. If they do recall it, capture why the tool was run and from where it was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: Legitimate development and diagnostics work typically occurs during business hours or scheduled maintenance. A module load driven by a signed host binary at an odd hour, on a host whose owner was not working, is more suspicious than the same load during a documented maintenance window. Check whether the load time fits the user's normal working pattern and the host's timezone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the sideload?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a DLL sideload, they commonly install backup footholds using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks, sc, or reg. File-event monitoring captures these drops even when the persistence tools are avoided, and a drop in the same window as the sideload points to a coordinated foothold.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
