name: Assembly DLL Creation Via AspNetCompiler
id: df1960bf-faa6-4c13-a7c6-c5eaa223aa61
description: |
  Detects aspnet_compiler.exe writing a .dll assembly into a path containing both '\Temporary ASP.NET Files\' and
  '\assembly\tmp\' — all three conditions must hold on the same file-write event. aspnet_compiler.exe is a signed
  Microsoft .NET utility that precompiles an ASP.NET site from a physical source directory; pointing it at a directory
  containing attacker-supplied source or a hostile build provider makes the signed compiler emit and load the resulting
  assembly, which proxies execution past controls that watch csc.exe or unsigned binaries (T1127). Build servers, IIS
  warm-up, and deployment tooling produce the same artifact legitimately, so the investigation turns on which host ran
  the compiler, which physical source directory its command line pointed at, and whether this host builds web
  applications at all. The compiler's own command line lives on the process-creation event, not on the file write, so
  that pivot carries most of the evidence.
type: detection
detection_id: 4c7f49ee-2638-43bb-b85b-ce676c30b260
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the written file path and the creating process match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact file path, the operation performed, and the responsible
    process against the rule's criteria. The rule fires only when the writer's image ends in aspnet_compiler.exe AND the
    written path contains all three of '\Temporary ASP.NET Files\', '\assembly\tmp\', and '.dll' — an App_Web_* style
    generated assembly under the ASP.NET temporary compilation tree. The signer columns are context rather than a
    verdict: aspnet_compiler.exe is Microsoft-signed in both benign and abusive use, so read them for coherence with the
    file being written, not as a trust decision.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to precompile ASP.NET applications?
  context: >-
    Legitimate ASP.NET precompilation is concentrated on build servers, IIS web servers, and developer workstations, and
    usually runs under a build service account, an app-pool identity, or a developer. A workstation with no web-hosting
    or development role producing compiled assemblies, or a user account with no build responsibility driving the
    compiler, is the deviation worth chasing. Where the user is a machine or service account, judge by the host's role
    and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the compiled assembly still on disk, or was it deleted or renamed after the alert?
  context: >-
    The assembly's post-alert lifecycle drives next steps. A DLL still present under the temporary compilation tree can
    be retrieved, hashed, and decompiled; one deleted seconds after creation points to cleanup or a build that only
    needed the assembly long enough to load it, and shifts the investigation to what loaded or executed in between.
    Routine ASP.NET compilation leaves these assemblies in place until the application recycles, so an immediate
    deletion is not the normal pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What was the full aspnet_compiler.exe command line, and which physical source directory was it pointed at?
  context: >-
    The file-write event names the compiler but carries no command line, so retrieve the compiler's own process events
    on this host. The arguments are the operative evidence: '-v' names the virtual path and the physical path argument
    names the source directory that was compiled. A source directory under a real web root or a checked-out repository
    is consistent with a build or deployment; one under a user profile, Temp, ProgramData, or a public share means the
    signed compiler was handed source the operator controls. Note the working directory as well, and read every
    invocation in the window — a build may issue several in sequence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process launched aspnet_compiler.exe?
  context: >-
    The acting process is named in the alert but its origin is not; retrieving the compiler's own start event reveals
    the parent that launched it. Build and deployment tooling launches the compiler from msbuild.exe, a CI agent, a
    deployment service, or w3wp.exe during warm-up. A parent such as cmd.exe or powershell.exe under an interactive
    session, wscript.exe, mshta.exe, or an Office application means something other than a build pipeline drove the
    compilation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What is in the compiled assembly, and does its content match a normal web-application build?
  context: >-
    Retrieve the DLL from its on-disk path and examine it. A generated ASP.NET assembly should decompile to page,
    control, and handler classes derived from the site's source. Imports of process-creation, memory-allocation, or
    network APIs, embedded base64 or encoded blobs, shellcode-length byte arrays, hardcoded addresses, or a packed
    section point at a build provider or source file that was there to produce a payload rather than a web page.
    Content analysis answers what is in the file; it is separate from asking whether the file is already known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Was this assembly loaded into a process, and what hash and signer did the load record?
  context: >-
    A file-write event carries no hash, but a DLL load does — module loads record the module's hash and signing status
    directly. Compiling an assembly only matters if something loads it, so this both establishes the hash for
    reputation lookup and identifies the loading process. A load into w3wp.exe or the compiler itself is the expected
    path for precompilation; a load into an unrelated host process is not. Submit the recorded hash to threat intel. If
    no load appears, the assembly was written but not yet used — retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Hashes
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A precompilation pass writes a predictable set of artifacts — several generated assemblies, .compiled manifest
    files, and PDBs, all inside the temporary compilation tree and the target output directory. Writes that land
    outside that tree, or that carry executable or script extensions in user-writable locations, mean the compiler run
    did more than build a site. The breadth and destinations of the writer's other file activity enumerate what else
    needs review; volume alone is not the signal for a compiler, but location is.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the Temporary ASP.NET Files tree recently, and by which processes?
  context: >-
    The ASP.NET temporary compilation tree has a small set of processes that legitimately write there — the compiler
    itself, the runtime host, and the worker process. Other recent arrivals in the same tree reveal whether this is an
    isolated compilation or a location under sustained use, and a writing process outside that small set means
    something is staging content into a directory the runtime will load from. The 90-day history also shows whether
    this host compiles ASP.NET applications routinely or whether this alert is the first activity in the tree.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Temporary ASP.NET Files\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What child processes did aspnet_compiler.exe spawn afterward?
  context: >-
    The processes a tool spawns reveal its actual effect. A precompilation pass invokes the C# or VB compiler, so
    csc.exe or vbc.exe children are the expected pattern. Command interpreters, script hosts, or download utilities as
    children of the compiler mean a build provider or source file executed code during compilation rather than merely
    producing an assembly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding the compilation reveals what led to it
    and what followed — a deployment or CI sequence looks different from an interactive session that fetched source and
    pointed the compiler at it. Novel parent-child pairs stand out at low counts against the repetitive high-count rows
    of routine service and agent activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: When this host has previously produced this compilation pattern, what processes and users drove it, and does the
    current alert fit that history?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting process and user distribution reflects
    how this specific pattern — aspnet_compiler.exe writing an assembly into the ASP.NET temporary tree — has
    historically run here, not generic use of the binary. A host that compiles on a schedule under one service account
    has a tight distribution; a new user, or a first-ever occurrence on this host, is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \aspnet_compiler.exe
        TargetFilename|contains|all:
        - \Temporary ASP.NET Files\
        - \assembly\tmp\
        - .dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced this compilation pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of this
    specific pattern, aggregated by host, rather than generic use of the binary. A build service account or a developer
    with a long history across build hosts is routine. A user who has never produced this pattern, or who produces it
    on a host outside their normal set, is worth weighing against their role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \aspnet_compiler.exe
        TargetFilename|contains|all:
        - \Temporary ASP.NET Files\
        - \assembly\tmp\
        - .dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically produced this compilation pattern on this host or across the environment, or is it
    new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute behavior, and a file
    write carries no parent to pivot on. The meaningful pivot is the acting program itself: the query mirrors the
    rule's selection scoped to the alerting binary, giving the 90-day history of this program producing this pattern
    across the environment. A program that already accounts for thousands of prior events on a known set of build and
    web hosts is deployment automation; one that is new or rare for this pattern, or that appears on a host outside
    that set, is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \aspnet_compiler.exe
        TargetFilename|contains|all:
        - \Temporary ASP.NET Files\
        - \assembly\tmp\
        - .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the compilation was one step of a wider sequence or
    an isolated build action. The same account driving compilation, remote access, or tooling on several hosts in the
    same window widens the scope beyond this endpoint. When the alert fires under SYSTEM or a machine account this
    query returns routine service and agent activity across the fleet — in that case read the acting-program pivot
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated to this
    host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent and service noise, and
    the file write carries no parent to pivot on. The meaningful question is whether the same program produced the same
    pattern elsewhere: the query mirrors the rule's selection scoped to the alerting binary, fleet-wide, in the alert
    window. Several hosts compiling in the same window points to a pushed deployment or a scheduled build; a single
    host points to a host-local trigger that needs its own explanation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \aspnet_compiler.exe
        TargetFilename|contains|all:
        - \Temporary ASP.NET Files\
        - \assembly\tmp\
        - .dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Have other hosts produced this compilation pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific
    pattern rather than the binary's generic footprint. A stable set of build and web servers firing it repeatedly is
    the signature of a deployment pipeline and calibrates the alert down. One host, or a small set with no web-hosting
    role in common, points at operator-driven use of the compiler and calibrates it up.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \aspnet_compiler.exe
        TargetFilename|contains|all:
        - \Temporary ASP.NET Files\
        - \assembly\tmp\
        - .dll
      condition: selection
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Proxy execution through a signed developer utility is a delivery step, not a starting point. Earlier detections on
    the same host — remote access, script execution, archive extraction, or file drops into a web root — may reveal
    where the source directory the compiler consumed came from, and help reconstruct the sequence that led to the
    build.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
