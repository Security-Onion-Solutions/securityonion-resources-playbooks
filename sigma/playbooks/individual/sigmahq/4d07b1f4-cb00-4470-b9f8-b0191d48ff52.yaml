name: DNS Query To Remote Access Software Domain From Non-Browser App
id: 19aa34bf-8650-41e7-8cc1-fa996bae1081
description: |
  Detects a DNS lookup for a remote-access or remote-monitoring-and-management (RMM) software domain made by a process that is not a known web browser. The rule fires when the queried domain is EITHER one of the listed vendor domains (AnyDesk, TeamViewer, ScreenConnect, Atera, Splashtop, LogMeIn, Zoho Assist, and similar) OR a RustDesk relay name that ends in .rustdesk.com and also begins with rs-, AND the resolving process is not one of the excluded browsers. Legitimately, sanctioned IT support tools generate these lookups; maliciously, malware that bundles an RMM client or an operator living off approved remote-access software resolves these domains from a non-browser process to establish an interactive command-and-control channel. Investigation should establish which domain was queried, which non-browser process resolved it, whether the tool is approved and tied to an active support session, and whether an actual remote-access connection followed.
type: detection
detection_id: 4d07b1f4-cb00-4470-b9f8-b0191d48ff52
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: 'Does the queried domain match a remote-access-software domain this rule flags, and which non-browser process resolved it?'
  context: 'Confirm the alert by comparing the exact QueryName against the rule''s domain set and noting which process resolved it. The rule fires when the domain is EITHER one of the listed vendor domains (AnyDesk, TeamViewer, ScreenConnect, Atera, Splashtop, LogMeIn, and similar) OR a RustDesk relay name that ends in .rustdesk.com and also begins with rs-, and the resolving process is not an excluded browser. Note which branch matched and whether the lookup returned an address.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: 'What domain was queried, is it tied to attacker-controlled remote-access infrastructure, and did it resolve?'
  context: 'The alert is a DNS lookup, not a connection, so investigate the domain itself: registration age, passive DNS, and reputation of the vendor endpoint versus a look-alike or relay name. Check whether the query returned an address (dns.resolved_ip) and, if so, whether the host then connected to it. A lookup for a legitimate vendor relay from a non-browser process still matters, because malware frequently reuses real RMM infrastructure as a command-and-control channel.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: 'What is the full command line of the non-browser process that resolved this domain?'
  context: 'The command line reveals whether the querying process is a genuine remote-access client, a script, or malware carrying a bundled agent. Decode any flags and check the working directory: legitimate agents run from their install directory, while a client executing from a user-writable or temporary location (for example under a Temp or ProgramData path) points to an attacker-staged drop. One pattern that is essentially never legitimate is setting an unattended-access password through the client itself, which precedes hands-off operator access.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: 'Is this user and host expected to run remote-access or RMM software?'
  context: 'Legitimate remote-access activity is usually confined to IT support staff, jump hosts, and help-desk workstations. A resolution from a standard user endpoint with no support role is more likely to be shadow IT or attacker-deployed access. Confirm whether the user role and host function are consistent with running remote-access tooling.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: 'Is this remote access tool on the organization''s approved software list?'
  context: 'Organizations typically sanction a small set of remote-access tools for support and treat the rest as unauthorized. Any tool not on that list, even well-known commercial software, may represent shadow IT or attacker-deployed persistence, and the tool set keeps growing (ConnectWise, Zoho Assist, and others), so reputation alone is not a pass. Check the approved inventory regardless of how well-known the tool is.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: 'Is there a current helpdesk ticket or support session that explains this remote access?'
  context: 'Legitimate remote-access usage normally lines up with an open support ticket, a scheduled maintenance window, or a user request. If no support context exists, the tool may have been installed by an attacker for persistent access or by a user bypassing controls. Match the timing against support records.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: 'After the lookup, what external endpoint and port did this tool actually connect to?'
  context: 'A DNS lookup alone does not prove a session was established; the connection that follows does. Compare the destination against the vendor''s published relay and CDN infrastructure, since connections to those endpoints are expected while connections to an unrelated address are not. Watch for configurable or high ports outside the vendor default (for example 7070 or 5650) and for long-lived sessions with sustained outbound volume, which indicate an interactive channel rather than a brief check-in.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: 'What process spawned the non-browser process that made this query, and is that parent chain expected?'
  context: 'The parent process shows how the querying process was launched. A remote-access client started by explorer.exe during an interactive install differs from one launched by a script host, an Office application, or a command interpreter, which points to bundled or scripted deployment. Expected parents vary by environment, so compare against how the tool is normally installed here.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: 'What files did this process write to disk on this host?'
  context: 'A process that bundles or installs a remote-access agent frequently drops executables or configuration files. Files written to a temporary or user-writable location, or a renamed binary placed outside the normal install directory, point to attacker staging rather than a vendor installer. Multiple distinct payloads suggest staged delivery or a multi-stage operation.'
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: 'What other process activity occurred on this host around the time of the lookup?'
  context: 'The surrounding activity places the lookup in context: what launched the querying process, what child processes it spawned, and whether persistence or hands-on-keyboard actions followed within the correlation window. A remote-access parent spawning a command interpreter or file-manager child is a signal of interactive control rather than a passive agent check-in. Adjust the window to the install-to-activity timing normal for this environment.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: 'Does this host normally run this process?'
  context: 'A remote-access binary that has never run on this host, or runs from an unusual path, is more suspicious than one that appears regularly as part of sanctioned support. Zero or very low historical counts indicate first-time or rare execution and raise the priority of the install-path and authorization checks.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: 'Has this host queried this domain before, and how often?'
  context: 'A first-time or rare lookup for this domain is more suspicious than routine resolution tied to an established support relationship. A steady history suggests a sanctioned tool already in use; a single recent lookup suggests newly introduced access.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: 'What other domains did this process query, and do any point to the same or related infrastructure?'
  context: 'The querying process may have resolved more than one relevant domain. A burst of lookups for multiple remote-access vendors, or for varied algorithmically generated names, points to a tool probing for a reachable relay or to beaconing. Reviewing every domain this process looked up in the window reveals whether the RMM lookup stands alone or is part of a broader pattern.'
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: 'Did other hosts in the environment query this same domain?'
  context: 'A single host resolving this domain suggests targeted deployment; many hosts resolving it may indicate a sanctioned tool in wide use or a broader intrusion. The distribution across hosts informs whether this is an isolated event or part of multi-host activity.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: 'Did other detections fire on this host in the hours before this lookup?'
  context: 'Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded the remote-access lookup and help reconstruct the timeline. Remote-access deployment often follows initial access and precedes hands-on-keyboard operations.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
