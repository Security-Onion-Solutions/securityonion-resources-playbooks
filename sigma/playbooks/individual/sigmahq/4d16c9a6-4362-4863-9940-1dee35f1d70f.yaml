name: DPRK Threat Actor - C2 Communication DNS Indicators
id: 2159cf0b-458a-4dc6-b632-68ad615d28c3
description: |
  This rule detects DNS lookups for two domains associated with DPRK threat-actor
  command-and-control infrastructure (subdomains under kro.kr and dothome.co.kr). A
  resolved lookup by an endpoint process means the host attempted to reach known-malicious
  infrastructure, whether through an installed backdoor, a scheduled beacon, or activity
  triggered by another process on the host. Investigation should confirm the exact domain
  and the process that queried it, determine whether the lookup resolved and the host then
  connected to that address, and establish how isolated or widespread the activity is across
  this host and the environment.
type: detection
detection_id: 4d16c9a6-4362-4863-9940-1dee35f1d70f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the queried domain match this rule's known C2 domain list, and which process performed the lookup?
  context: Confirm the alert by reviewing the exact queried domain against the rule's two
    known C2 domains and identifying the process that issued the lookup, then check whether
    the query resolved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
  answer_sources:
  - alert
  - dns_query
- question: Is this host or user expected to resolve unfamiliar external domains as part of normal application or update behavior?
  context: Legitimate update checks or connectivity probes occasionally produce unexpected
    external lookups. Confirming whether the host's role or the user's normal activity
    explains an external domain lookup is often the fastest way to separate expected
    behavior from unauthorized command-and-control contact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this lookup part of an authorized penetration test or red team engagement simulating this C2 infrastructure?
  context: Security assessments sometimes simulate known threat-actor infrastructure, including
    reusing published indicator domains, to validate detection coverage. Before investing
    further investigation time, check whether an active exercise or engagement explains this
    lookup on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What stage of command-and-control activity does this lookup represent?
  context: A DNS-based channel can serve different purposes at different times -- an initial
    beacon check-in, retrieval of tasking or configuration data, or an outbound channel for
    staged data. The querying process's command line and any embedded parameters can indicate
    which of these this lookup corresponds to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Are files or persistence artifacts tied to the querying process present on the host?
  context: DNS-based command-and-control channels are often paired with a dropped implant,
    a configuration file, or a scheduled mechanism that re-establishes the channel across
    reboots. Checking for files created by the querying process can reveal that supporting
    infrastructure even after the process itself has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What domain was queried, and did the lookup resolve?
  context: The alert is a DNS lookup, not a confirmed connection -- investigate the queried
    domain directly, registration age, hosting history, and any threat intelligence matches.
    A recently-registered or algorithmically-generated domain, or a known-C2 domain, points to
    attacker infrastructure. Check whether the query resolved and note the resolved address,
    since that address is the pivot for confirming whether the host actually reached the
    infrastructure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Did the host establish a network connection to the address this domain resolved to?
  context: A DNS lookup alone does not confirm outbound contact -- a domain can resolve without
    a follow-on connection succeeding. Pivoting on the resolved address into connection activity
    shows whether the host actually reached the infrastructure and over which port.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dns_resolved_ip%'
      condition: selection
    fields:
      - Image
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - dns_query
- question: What did the querying process do around the time of the lookup? Decode its command line.
  context: The full command line of the process that issued the lookup can reveal how the
    domain was generated or supplied -- a hardcoded value, a decoded configuration string, or
    output built from other input. Decode any encoding or embedded parameters to understand the
    operation behind the lookup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the querying process, and is that parent chain expected?
  context: The parent process reveals how the querying process was launched. A predictable
    parent such as a scheduled task host or a service process differs meaningfully from a
    script host, an Office application, or another process not normally responsible for
    network activity on this host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other domains did this process query, and did any resolve to the same infrastructure?
  context: A single lookup can be part of a larger pattern. Reviewing every domain the same
    process queried in the surrounding window can surface additional C2 domains, a rotation
    pattern, or algorithmically generated names sharing infrastructure with this one.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Reviewing process activity on this host around
    the same window can reveal what led to the lookup and what followed it, including
    reconnaissance, credential access, or persistence behavior.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Does this host normally query this domain?
  context: A domain that has never been queried from this host before is a stronger signal
    than one queried routinely. Establishing the historical frequency of this specific lookup
    on this host distinguishes a first-time contact from an already-established pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - dns_query
- question: Does this host normally run the querying process?
  context: A process that has never been seen on this host, or one that runs only rarely,
    raises more concern than a process that executes routinely as part of expected operation.
    Historical execution counts help establish which is the case.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Did other hosts in the environment query this same domain?
  context: A single host querying this domain points toward targeted contact; multiple hosts
    querying the same domain in the same window points toward broader exposure, such as a
    shared delivery mechanism or a wider compromise. The distribution across the fleet should
    inform the scope of the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - dns_query
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or
    credential access -- can reveal the stages that preceded this lookup and help reconstruct
    the sequence of activity leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
