name: Enable Remote Connection Between Anonymous Computer - AllowAnonymousCallback
id: 952e2e3d-bdfb-47ce-9b78-a39dfb044f05
description: |
  Detects a registry modification that sets the WMI/CIMOM AllowAnonymousCallback value to enabled (DWORD 0x00000001) under \Microsoft\WBEM\CIMOM. The setting permits anonymous WMI callbacks for remote connections between computers that lack a trust relationship, loosening the authentication required for remote WMI access. Administrators legitimately set it when configuring remote WMI between non-domain hosts; when written by an unexpected process or account it weakens a remote-access authentication control and can enable anonymous remote execution or lateral movement. The investigation should establish which process wrote the value, whether the setting still stands, and whether remote WMI activity followed.
type: detection
detection_id: 4d431012-2ab5-4db7-a84e-b29809da2172
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject
    ending in \Microsoft\WBEM\CIMOM\AllowAnonymousCallback), the value data (Details
    should read DWORD 0x00000001, meaning anonymous callbacks are enabled), and the
    writing process before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change WMI/CIMOM remote-connection settings?
  context: >-
    Enabling anonymous WMI callbacks is a configuration action normally performed by
    administrators setting up remote WMI between non-domain hosts. Knowing whether the
    account and host function are consistent with that task is often the fastest way to
    separate intentional configuration from adversary tampering. User attribution is
    present on most endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which process wrote the AllowAnonymousCallback value, and is CIMOM a location this host normally has changed?
  context: >-
    The \Microsoft\WBEM\CIMOM key governs how the host accepts remote WMI connections;
    the AllowAnonymousCallback value specifically relaxes the trust requirement for
    incoming anonymous callbacks. Identify the writing process from the event so the
    change can be attributed to management tooling, an installer, or an interactive
    session.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the written value data mean for remote WMI authentication?
  context: >-
    Decode the Details field. DWORD 0x00000001 enables anonymous callbacks, allowing a
    remote WMI connection from a computer that has no trust relationship with this host;
    0x00000000 would leave the default (trusted-only) behavior in place. Confirm the
    written value actually loosens the control rather than resetting it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What was the full command line of the process that relaxed the WMI authentication control?
  context: >-
    The writing process command line reveals how the setting was changed and whether it
    was part of a broader configuration action. Anonymous-callback enablement weakens the
    authentication required for remote WMI, so identifying the exact command and its
    intent determines investigation priority and whether the change was scripted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What launched the process that modified this registry value?
  context: >-
    The parent chain shows how the writing process was invoked. Management tooling and
    installers have predictable parents; a value written by a process descended from a
    script host, Office application, or an unexpected interactive shell points away from
    routine administration. This pivots on the writing process to reveal its parent and
    command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the AllowAnonymousCallback value still enabled, or has the trusted-only default been restored?
  context: >-
    The relaxation may have been temporary for one action or left in place as a standing
    remote-access weakening. Verify the current value on the host directly or through the
    endpoint console; if it still reads enabled, the host continues to accept anonymous
    remote WMI callbacks and the setting should be restored during remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this value persist, or was the key re-modified after the alert?
  context: >-
    Registry value and key deletions are not observable in this telemetry, so persistence
    is judged from the re-modification history rather than from a cleanup event. A value
    that stays enabled keeps the host exposed; a later write that resets it to the default,
    or repeated toggling, points to scripted or transient use. Compare the Details values
    over the forward window.
  range: +30d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did remote WMI execution activity appear on this host after the setting was enabled?
  context: >-
    Enabling anonymous callbacks takes effect as remote WMI invocations, which surface on
    the endpoint as processes spawned by the WMI provider host (WmiPrvSE.exe). Processes
    launched under that parent after the change indicate the loosened control was used for
    remote execution rather than left dormant.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_wmi:
        ParentImage|endswith: '\WmiPrvSE.exe'
      condition: selection and selection_wmi
    fields:
      - Image
      - CommandLine
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Adversaries who loosen one remote-access control often adjust several settings together,
    for example firewall rules, DCOM permissions, or service configurations that complete
    the remote-WMI enablement. The triggering key appears in the results; the signal is what
    else was changed by the same process or account in the surrounding window.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: >-
    Loosening remote authentication is one form of impairing defenses; the same operator
    often clears logs, disables real-time protection, deletes shadow copies, or changes
    firewall rules in the same session. Finding several such actions from the same account
    or parent process indicates a deliberate weakening of multiple controls rather than an
    isolated configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What activity occurred on this host after the remote-access control was loosened?
  context: >-
    Weakening authentication is usually a precursor to the activity it enables, such as
    remote execution, credential access, or movement to other hosts. Examining process
    activity in the window after the change reveals what the loosened control was meant to
    support and whether it lines up with expected administration.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Has AllowAnonymousCallback been modified before on this host?
  context: >-
    CIMOM remote-connection settings should rarely change on a given host. A prior
    modification history that matches routine configuration cycles reads differently from
    a value being touched for the first time. Zero history points to a first-time change,
    which carries more weight for a control that governs anonymous remote access.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry value modified on other hosts in the environment?
  context: >-
    The same change on many hosts suggests a policy push or an imaging default; a change
    confined to this host is more consistent with a targeted action. Compare the Details
    values across hosts to see whether the same enablement was applied uniformly or only
    here.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Configuration changes rarely occur in isolation. Aggregating process activity in the
    surrounding window collapses routine agent noise into high-count rows while novel
    parent-child pairs stand out at low counts, which is what points to reconnaissance,
    tooling, or follow-on execution tied to the change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, credential access, or
    other defense tampering, may reveal the stages that preceded this change and help
    reconstruct the timeline leading to a remote-access weakening.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence or remote-execution mechanisms installed on this host?
  context: >-
    Operators who enable one remote-access path commonly add backup footholds through
    different techniques, such as scheduled tasks, services, registry Run keys, or WMI
    tooling. Persistence tool executions clustered around the same timeframe indicate
    intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
