name: Sysmon Driver Unloaded Via Fltmc.EXE
id: e414f622-8c14-4458-bf00-8b47350e5e15
description: |
  Detects use of fltMC.exe to unload the Sysmon filter driver, which blinds Sysmon
  by removing its kernel-level event source. The rule fires when the process image
  ends in fltMC.exe (or its OriginalFileName is fltMC.exe) AND the command line
  contains both "unload" and "sysmon". fltMC.exe is the built-in Filter Manager
  control program and unloading minifilters is a legitimate administrative action,
  so the question is whether this specific unload of a monitoring driver is
  sanctioned maintenance or an operator deliberately disabling endpoint telemetry.
  Because unloading the driver stops Sysmon from recording subsequent activity, the
  investigation should confirm exactly which driver was unloaded, determine whether
  monitoring has been restored, and reconstruct what happened during the resulting
  visibility gap - tampering of this kind is typically performed to enable
  follow-on actions that would otherwise be logged.
type: detection
detection_id: 4d7cda18-1b12-4e52-b45c-d28653210df8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show fltMC.exe being used to unload the Sysmon
    driver?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the process image ends in fltMC.exe (or its OriginalFileName
    is fltMC.exe) AND the command line contains both "unload" and "sysmon". Read the
    exact command line and confirm both conditions hold - the verb "unload" followed
    by a driver name, and a reference to Sysmon - rather than an unrelated fltMC.exe
    invocation that happens to mention the word.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to unload filter drivers or perform
    Sysmon maintenance?
  context: Unloading a minifilter driver is an administrative action normally seen
    only from endpoint-management accounts on systems where monitoring software is
    being serviced or removed. A standard user account, or a host with no
    administrative maintenance role, running fltMC.exe to unload the Sysmon driver is
    more notable than the same action from a known systems-management workstation.
    Knowing whether the acting account and host function involve driver-level
    administration is often the fastest path to separating sanctioned maintenance
    from deliberate telemetry tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the binary that ran genuinely fltMC.exe, or a renamed or relocated
    copy?
  context: fltMC.exe is the legitimate Filter Manager control program that normally
    runs from System32. The rule keys on both the image name and the OriginalFileName
    metadata so it still matches when the binary is renamed, so the analyst should
    confirm which path the binary ran from and whether its OriginalFileName and
    signing chain match the genuine Microsoft tool. A copy of fltMC.exe carrying its
    original metadata but running from a user-writable or temporary directory, or an
    unsigned binary, points to an operator staging the tool rather than routine use
    of the system copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Which driver was named in the unload command, and is it the Sysmon
    minifilter?
  context: The argument after "unload" names the driver being removed. Sysmon can be
    installed under a renamed driver, so the name supplied may not be the default
    SysmonDrv - operators resolve the target by its filter altitude (385201, constant
    across renames) before issuing the unload. Read the full command line to recover
    the exact driver name unloaded, then confirm it is the Sysmon minifilter rather
    than an unrelated filter driver; unloading the Sysmon driver stops all subsequent
    Sysmon event recording on the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the Sysmon driver currently loaded again, or is the host still
    running without Sysmon telemetry?
  context: The unload may have been momentary (for a specific action) or left in
    place. Confirm the current state of the Sysmon minifilter - whether it has been
    reloaded and is recording again, or the host remains without Sysmon visibility.
    If the driver is still unloaded, monitoring should be restored before further
    investigation, since any activity occurring while it is absent will not appear in
    Sysmon data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were Sysmon or event-logging registry keys modified on this host around
    the unload?
  context: Unloading the driver is one of several ways to blind Sysmon; the others
    work through the registry. Deleting the SysmonDrv rules configuration value or
    altering the Sysmon event-channel registration disables or hollows out monitoring
    without removing the driver, and the same operator may use both. Registry change
    events on the SysmonDrv parameters key, the Sysmon operational channel
    registration, or the EventLog/Autologger keys around the unload indicate a
    broader effort to suppress logging rather than an isolated maintenance unload.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\SysmonDrv'
          - '\WINEVT\Channels\Microsoft-Windows-Sysmon'
          - '\Sysinternals\System Monitor'
          - '\Services\EventLog'
          - '\WMI\Autologger'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the Windows event log cleared or audit policy changed on this host
    around the unload?
  context: Disabling the Sysmon driver removes one telemetry source; clearing the
    Security event log or disabling audit categories removes another, and the two are
    often performed together to maximize the visibility gap. A Security log cleared
    event (1102) or audit-policy change in the same window as the driver unload
    indicates the operator is suppressing multiple evidence sources, not just Sysmon.
    If Security event collection is not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 1102
          - 4719
      condition: selection
    fields:
      - EventID
      - SubjectUserName
- question: Were Sysmon-related driver, log, or configuration files deleted on this
    host around the unload?
  context: With the driver unloaded, an operator may also remove on-disk artifacts -
    the SysmonDrv driver file in the drivers directory, exported configuration, or
    log files - to complete the indicator removal. File-deletion events for the
    Sysmon driver image, its configuration, or related logs in the same window as the
    unload point to deliberate cleanup that outlasts the temporary unload. Reviewing
    deletions in this window shows whether the tampering was a momentary unload or a
    durable removal of the monitoring component.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - 'SysmonDrv'
          - '\Sysmon'
          - '\drivers\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
      - User
- question: What activity occurred on this host after the Sysmon driver was unloaded?
  context: Operators unload the Sysmon driver to act without being recorded - to run
    payloads, dump credentials, or move laterally during the blind window. Examining
    process activity immediately after the unload reveals what the tampering was meant
    to hide or enable. Note that Sysmon-sourced events will be absent during the gap;
    process creation that does surface here, or a conspicuous silence followed by a
    burst once monitoring resumes, points to the activity the unload was protecting.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host?
  context: An operator who unloads the Sysmon driver often disables several controls
    in the same operation - stopping security services, clearing logs, deleting shadow
    copies, or changing firewall settings - to maximize coverage. Finding additional
    tampering commands from the same user or parent process in the surrounding window
    indicates multiple controls were targeted together rather than an isolated
    maintenance unload.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned fltMC.exe, and is that parent chain expected?
  context: The parent process reveals how the unload was launched. Interactive
    administrative use typically shows a console shell or a management agent as the
    parent; an unexpected parent such as a script host, mshta.exe, an Office
    application, or an unfamiliar binary points to scripted or malicious invocation.
    The parent is where the unload command originated, so it anchors who or what
    initiated the tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this unload pattern, what parents and
    users normally drive it, and does the current alert fit?
  context: Even legitimate maintenance can match this pattern. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific fltMC.exe unload-Sysmon pattern has
    historically run here, not generic fltMC.exe usage. A new parent process, an
    unexpected account, or a first-ever occurrence is the deviation worth chasing; a
    pattern that already accounts for prior maintenance events is more likely routine.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains|all:
        - unload
        - sysmon
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this unload pattern in the past week, and does the
    cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the fltMC.exe unload-Sysmon pattern rather
    than generic fltMC.exe usage. Many hosts firing the same pattern points to a
    scripted rollout - for example a sanctioned uninstall or reconfiguration pushed
    across the estate; one host or a small unrelated set points to manual operator
    activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains|all:
        - unload
        - sysmon
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains|all:
        - unload
        - sysmon
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains|all:
        - unload
        - sysmon
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    Sysmon unload was a single event or part of activity spanning multiple endpoints.
    If the same user triggered related execution on other hosts in the same window,
    the operation reaches further than one machine and the response scope grows
    accordingly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \fltMC.exe
      - OriginalFileName: fltMC.exe
      selection_cli:
        CommandLine|contains|all:
        - unload
        - sysmon
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    privilege escalation - may reveal the attack stages that preceded the Sysmon
    unload and help reconstruct the timeline. Disabling monitoring is usually a step
    taken to protect follow-on actions, so prior alerts give context for what the
    operator was preparing to do once telemetry was removed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
