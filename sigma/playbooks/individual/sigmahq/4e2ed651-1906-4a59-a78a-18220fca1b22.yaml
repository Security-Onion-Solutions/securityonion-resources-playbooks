name: PUA - NirCmd Execution
id: 6e1db7d7-61c9-4a40-8aa4-252221d5e7cc
description: |
  Detects execution of NirCmd, a free single-executable Windows utility whose
  hundreds of subcommands let a caller run other programs, control services,
  edit the registry, kill processes, capture screenshots, tamper with file
  timestamps, and broadcast commands to other hosts — all without showing UI.
  The rule fires when nircmd.exe (by Image name or OriginalFileName) is seen, OR
  when a command line carries one of its execution verbs (execmd, script,
  shexec, runinteractive), OR when both an exec/exec2 verb and a show/hide
  window flag appear together. NirCmd is also used by administrators, so the
  investigation should confirm which branch fired, decode the exact subcommand
  and its arguments, and determine whether the activity is sanctioned tooling or
  an operator using NirCmd as a living-off-the-land multi-tool.
type: detection
detection_id: 4e2ed651-1906-4a59-a78a-18220fca1b22
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the alert match the rule — either nircmd.exe by name, or a command line carrying an execution verb (execmd / script / shexec / runinteractive), or an exec/exec2 verb paired with a show/hide flag?
  context: The rule fires on one of several independent branches, and which one fired
    determines the rest of the investigation. Confirm the Image or OriginalFileName is
    nircmd.exe, then note which branch matched. A name-only match means NirCmd ran but the
    specific subcommand was not in the verb list; an execmd / script / shexec /
    runinteractive match means a code-execution verb was used; an exec/exec2 paired with a
    show/hide flag points to a windowed launch of another program. The exact command line
    establishes the true/false positive call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run a multi-purpose command-line utility like NirCmd?
  context: NirCmd is legitimately used by some administrators for scripted maintenance, so
    the account and host function matter. An IT account on an admin workstation running it
    as part of a documented routine is very different from a standard user, or a service
    principal, invoking it. Knowing the user role and host purpose is often the fastest path
    to separating sanctioned tooling from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is NirCmd on the organization's approved software list for this host?
  context: Organizations typically maintain a list of sanctioned administrative utilities.
    NirCmd is a portable single executable that needs no installer and is frequently
    repurposed as a living-off-the-land multi-tool, so its presence on a host should be
    explainable. A copy not tied to an approved deployment — even if the tool itself is
    well known — may represent shadow IT or operator-staged tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current change ticket, maintenance window, or support session explaining this NirCmd run?
  context: Sanctioned NirCmd usage normally maps to a scheduled task, a documented admin
    procedure, or an active support request. If no such context exists for this execution,
    the tool may have been staged by an operator for hands-on-keyboard actions such as
    service control, process termination, or registry edits.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did NirCmd do? Decode the subcommand and its arguments.
  context: NirCmd's first argument is the subcommand and the rest are its operands, so the
    command line is the whole story. Identify the verb — for example elevatecmd runassystem
    (spawn a process as SYSTEM), killprocess (terminate a named process or PID), service
    stop/restart (control a service without sc.exe), regsetval / regdelval / regdelkey
    (edit the registry without reg.exe), setfiletime / clonefiletime (timestomp),
    savescreenshot (screen capture), emptybin / filldelete (anti-forensics), or multiremote
    (broadcast a command to other hosts). Decode any path, hive, service name, or chained
    command to understand the actual operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned NirCmd, and is that parent chain expected?
  context: The parent process reveals how NirCmd was invoked. A user-driven run typically
    descends from explorer.exe or an interactive shell; a scheduled run descends from the
    task scheduler or services.exe. Unusual parents such as a script host (wscript.exe,
    cscript.exe, powershell.exe), an Office application, or a remote-execution tool point to
    automated or operator-driven invocation worth tracing further up the tree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did a registry-set event tied to NirCmd's registry subcommands or its run-as-SYSTEM context menu appear on this host?
  context: NirCmd edits the registry directly through regsetval / regdelval / regdelkey
    rather than reg.exe, so those writes do not show as a reg.exe process. A registry-set
    event records the write itself. Installing NirCmd's "Run as SYSTEM" right-click handler
    also writes under exefile\shell\runassystem\command. Writes to Run keys, service keys,
    or that handler path shortly around the alert indicate persistence or privilege-staging
    performed through the tool.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\shell\runassystem\command'
          - '\CurrentVersion\Run'
          - '\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What child processes did NirCmd spawn afterward?
  context: NirCmd's execution verbs (execmd, exec, script, runassystem, elevatecmd) launch
    other programs, so its children reveal the actual objective. A child such as cmd.exe,
    powershell.exe, or regedit.exe — especially one running at SYSTEM or High integrity —
    shows NirCmd was used as a launcher for follow-on activity rather than for a benign
    single action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What external endpoints did NirCmd connect to around the time of the alert?
  context: NirCmd's remote and multiremote subcommands push commands to other hosts, and a
    staged copy may reach out to retrieve content or report. Connections to internal hosts
    can indicate command broadcast or lateral movement; connections to unfamiliar external
    addresses warrant scrutiny. For process_creation-only telemetry where network data is
    absent, fall back to inspecting the command line for host lists or addresses.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: When this host previously fired this NirCmd pattern, which parents and users drove it, and does the current alert fit that pattern?
  context: Even sanctioned tools get abused. This query mirrors the rule's selection
    structure scoped to this host, so the resulting parent/user distribution reflects how
    the rule's specific firing pattern — not generic NirCmd usage — has historically run
    here. A new parent process, an unexpected account, or an unusual command-line structure is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_org:
      - Image|endswith: \NirCmd.exe
      - OriginalFileName: NirCmd.exe
      selection_cmd:
        CommandLine|contains:
        - ' execmd '
        - '.exe script '
        - '.exe shexec '
        - ' runinteractive '
      combo_exec:
        CommandLine|contains:
        - ' exec '
        - ' exec2 '
      combo_exec_params:
        CommandLine|contains:
        - ' show '
        - ' hide '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* or all of combo_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_org:
      - Image|endswith: \NirCmd.exe
      - OriginalFileName: NirCmd.exe
      selection_cmd:
        CommandLine|contains:
        - ' execmd '
        - '.exe script '
        - '.exe shexec '
        - ' runinteractive '
      combo_exec:
        CommandLine|contains:
        - ' exec '
        - ' exec2 '
      combo_exec_params:
        CommandLine|contains:
        - ' show '
        - ' hide '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* or all of combo_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_org:
      - Image|endswith: \NirCmd.exe
      - OriginalFileName: NirCmd.exe
      selection_cmd:
        CommandLine|contains:
        - ' execmd '
        - '.exe script '
        - '.exe shexec '
        - ' runinteractive '
      combo_exec:
        CommandLine|contains:
        - ' exec '
        - ' exec2 '
      combo_exec_params:
        CommandLine|contains:
        - ' show '
        - ' hide '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* or all of combo_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window
    reveals lateral movement or coordinated activity on multiple endpoints. If the same user
    triggered similar activity elsewhere, the scope is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_org:
      - Image|endswith: \NirCmd.exe
      - OriginalFileName: NirCmd.exe
      selection_cmd:
        CommandLine|contains:
        - ' execmd '
        - '.exe script '
        - '.exe shexec '
        - ' runinteractive '
      combo_exec:
        CommandLine|contains:
        - ' exec '
        - ' exec2 '
      combo_exec_params:
        CommandLine|contains:
        - ' show '
        - ' hide '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* or all of combo_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this NirCmd pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the rule's firing pattern rather than generic NirCmd
    usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation; one host or a small unrelated set points to manual operator activity. Use
    the host distribution and parent/binary consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_org:
      - Image|endswith: \NirCmd.exe
      - OriginalFileName: NirCmd.exe
      selection_cmd:
        CommandLine|contains:
        - ' execmd '
        - '.exe script '
        - '.exe shexec '
        - ' runinteractive '
      combo_exec:
        CommandLine|contains:
        - ' exec '
        - ' exec2 '
      combo_exec_params:
        CommandLine|contains:
        - ' show '
        - ' hide '
      condition: 1 of selection_* or all of combo_*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the NirCmd run and what followed — reconnaissance, service or registry changes, or
    persistence. Aggregating by process and parent collapses repetitive agent telemetry into
    high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded this run and help
    reconstruct the timeline. A NirCmd execution that follows other alerts is more likely
    part of a multi-stage operation than an isolated administrative action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
