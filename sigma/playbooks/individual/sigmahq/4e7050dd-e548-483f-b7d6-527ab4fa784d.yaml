name: NTDS.DIT Creation By Uncommon Parent Process
id: 0e7f532c-7366-438c-8105-2fdf53df02ae
description: |
  Detects creation of a file named ntds.dit — the Active Directory database, which holds
  password hashes for every domain account — where EITHER the parent of the writing process
  is a script or web-server binary (cscript, wscript, powershell, pwsh, httpd, nginx,
  php-cgi, w3wp) OR the parent runs from an uncommon path (\apache, \tomcat, \AppData\,
  \Temp\, \Public\, \PerfLogs\). The live database is written only by the directory service
  itself; a copy appearing under either parent branch matches extraction chains (ntdsutil
  install-from-media exports, volume-snapshot copies) driven through a web shell or dropped
  script. Investigation should confirm which branch fired, recover the command that produced
  the copy, check for companion SYSTEM/SECURITY hive exports needed to decrypt the database,
  and determine whether the copy was archived, removed, or moved off the host.
type: detection
detection_id: 4e7050dd-e548-483f-b7d6-527ab4fa784d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file path end in \ntds.dit, and does the creating parent match either an uncommon parent binary or an uncommon parent path?
  context: The rule fires when a file named ntds.dit is created AND at least one of two parent conditions
    holds — the parent image ends in a script or web-server binary (cscript, wscript, powershell, pwsh,
    httpd, nginx, php-cgi, w3wp), or the parent image path contains \apache, \tomcat, \AppData\, \Temp\,
    \Public\, or \PerfLogs\. Note which branch matched, because it steers the investigation — a web-server
    worker parent points toward a web shell on the server, while a parent running from a user-writable
    path points toward dropped tooling. The database normally lives at C:\Windows\NTDS\ntds.dit; deployments
    with custom directory storage or backup paths may legitimately write it elsewhere, so review the full
    path against known storage locations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - ParentImage
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host a domain controller, and is this user or service expected to export the directory database?
  context: Legitimate exports do occur — scheduled AD-aware backups, install-from-media staging for new
    domain controller deployments, and migration tooling — but they run under directory administrators
    or known backup service accounts from management contexts, not under web-server workers or scripts
    in user-writable paths. If the host is not a domain controller at all, an ntds.dit file appearing on
    it means a copy was staged or relocated there, which shifts the question to where it came from. When
    the user is a machine or service account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What web request, script, or command led the parent to produce this file?
  context: For web-server and CGI parents (w3wp, httpd, nginx, php-cgi), review web access logs around
    the event for the originating request and source address — web-shell traffic typically shows repeated
    POSTs to a single unusual resource. For script-host and PowerShell parents, identify the script that
    was running and how it arrived on the host. The parent image and parent command line returned here
    carry the application pool, site, or script path that anchors that search.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Has this rule fired on other hosts — were directory database copies created elsewhere in the environment?
  context: The same extraction pattern appearing on multiple hosts suggests the operation is being run
    against several domain controllers, or that the same vulnerable web application is deployed on more
    than one server. The aggregation groups firings by host and user so additional affected systems can
    be pulled into the investigation before their copies are cleaned up.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Is the parent application running a version with known remote-code-execution fixes applied?
  context: A web-server worker parent on this rule frequently means an exploited or backdoored web application.
    Verify the server platform and its deployed applications against current vendor advisories — an unpatched
    instance confirms exploitation was feasible and flags sibling servers running the same stack. For script-host
    parents, patch level matters less than delivery, so weight the delivery-vector review instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Is the ntds.dit copy still on disk, or was it deleted or renamed after creation?
  context: A copy still present can be retrieved and verified — a genuine directory database export is
    typically hundreds of megabytes or larger and starts with an ESE database header, while a small file
    suggests a failed export or a decoy. Deletion minutes after creation is consistent with archive-then-cleanup
    staging, and a rename to an innocuous name or archive extension suggests preparation to move it off
    the host; in both cases the file's lifecycle here tells you whether recovery or exfiltration review
    is the next step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What command did the writing process run to produce the directory database copy?
  context: The command line distinguishes the extraction method — ntdsutil with "ifm" and "create full"
    arguments writes an install-from-media export, vssadmin or diskshadow usage precedes a copy from a
    shadow-device path (\\?\GLOBALROOT\Device\HarddiskVolumeShadowCopy...), and esentutl /y copies the
    locked database directly. Also check whether SYSTEM and SECURITY registry hives were saved in the same
    operation — the SYSTEM hive holds the boot key required to decrypt the database offline, so hive exports
    alongside the copy confirm credential-extraction intent and define what was actually taken.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What is the acting process instance itself — what command started it, and what spawned it?
  context: The acting process's own start record shows its full command line — for w3wp the application pool
    identity, for httpd, nginx, or php-cgi the site instance, for powershell or a script host the script it
    was executing — plus the parent that launched it. A web-server worker whose own ancestry is normal service
    startup points to in-process exploitation such as a web shell, while a script host launched from an
    interactive logon or scheduled task points to operator activity or automation. Known backup agents
    appearing as the parent are the main benign explanation and are worth confirming by product. The file
    event itself carries no parent linkage, so this start-event lookup is how the parent is recovered - it
    resolves for the large majority of file activity, but not for long-lived service processes whose start
    predates retention.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Did snapshot or database-export tooling run on this host around the file creation?
  context: The live database is locked by the directory service, so extraction requires a volume snapshot
    or an ESE-aware copy first — detection strategies for this technique correlate snapshot creation with
    database file access inside a short window, on the order of 5 minutes. Executions of ntdsutil, vssadmin,
    diskshadow, esentutl, or wbadmin here tie the alerted file write to its extraction step and reveal
    the exact mechanics. The tool list is tunable — backup agents invoke the same utilities on schedule,
    so weigh each hit by its timing, parent, and user rather than by presence alone.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\ntdsutil.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\esentutl.exe'
          - '\wbadmin.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: What other processes did the acting program spawn around the alert?
  context: A web shell or malicious script rarely runs a single command — reconnaissance (whoami, net, nltest),
    registry hive saves (reg save), archiving utilities, and cleanup commands typically surround the database
    copy. The sequence and content of these children reconstruct the operation end to end. Note this shows
    what the acting program itself started, not what ran alongside it under a shared parent - that grouping
    needs the acting process's parent, which a file event does not record.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the writing process or its children create or delete around the alert?
  context: An install-from-media export writes the database together with SYSTEM and SECURITY hive copies
    in an "Active Directory" and "registry" folder structure, and snapshot-based copies often sit beside
    exported hives, snapshot metadata .cab files, and archives created for exfiltration. The writer's other
    file activity confirms intent, enumerates every artifact needing review, and shows whether the copy
    was packaged and then removed.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Credential theft is typically followed by movement. The query returns outbound connections from
    this host to remote-access ports — 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) — in the hours
    after the event, with the originating image and user for each. Two limits to keep in mind — hashes
    extracted from the database are usually cracked or replayed from another machine, which will not appear
    here (check authentication logs on suspected targets for this account), and this view requires endpoint
    network telemetry; if that is not collected from this host, treat zero rows as a visibility gap rather
    than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Which accounts are exposed if this database copy left the host?
  context: The directory database contains password hashes for every domain account, including krbtgt,
    privileged administrators, and service accounts, so a completed export scopes exposure to the whole
    domain rather than a single credential. Cross-reference with directory administrators which privileged
    accounts and trust relationships exist in this domain — if exfiltration is confirmed, remediation
    breadth follows from that inventory (privileged resets and staged krbtgt rotation are the recovery
    levers).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window reveals whether the
    account is being used for movement across endpoints — remote execution utilities, credential tooling,
    or archiving binaries appearing on other hosts under the same account widen the compromise scope. If
    the account is a service principal, this view fills with routine agent noise and the parent-driven
    variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service principal, user-scoped clustering returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism produced the rule''s pattern elsewhere: the query mirrors
    the rule''s selection structure scoped to the alerting program, fleet-wide, in the alert window.
    Multiple hosts producing ntds.dit copies in the same window points to the operation being run against
    several systems at once; a single host points to a host-local operation.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
      definition: 'Requirements: The "ParentImage" field is not available by default on EID 11 of Sysmon logs. To be able to use this rule to the full extent you need to enrich the log with additional ParentImage data'
    detection:
      selection_file:
        TargetFilename|endswith: \ntds.dit
      selection_process_parent:
        ParentImage|endswith:
        - \cscript.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        - \wscript.exe
      selection_process_parent_path:
        ParentImage|contains:
        - \apache
        - \tomcat
        - \AppData\
        - \Temp\
        - \Public\
        - \PerfLogs\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_file and 1 of selection_process_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic file activity), aggregated by host.
    For a directory database copy under an uncommon parent, prior history is plausible only for directory
    administrators or backup operators with a documented reason; weigh any count against the user's role
    and known maintenance or deployment windows.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
      definition: 'Requirements: The "ParentImage" field is not available by default on EID 11 of Sysmon logs. To be able to use this rule to the full extent you need to enrich the log with additional ParentImage data'
    detection:
      selection_file:
        TargetFilename|endswith: \ntds.dit
      selection_process_parent:
        ParentImage|endswith:
        - \cscript.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        - \wscript.exe
      selection_process_parent_path:
        ParentImage|contains:
        - \apache
        - \tomcat
        - \AppData\
        - \Temp\
        - \Public\
        - \PerfLogs\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_file and 1 of selection_process_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting program, so the result is the 90-day history of this program driving this specific
    pattern (not generic use of the binary). A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for many prior events points to recurring backup automation
    that should be identified and verified by product.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
      definition: 'Requirements: The "ParentImage" field is not available by default on EID 11 of Sysmon logs. To be able to use this rule to the full extent you need to enrich the log with additional ParentImage data'
    detection:
      selection_file:
        TargetFilename|endswith: \ntds.dit
      selection_process_parent:
        ParentImage|endswith:
        - \cscript.exe
        - \httpd.exe
        - \nginx.exe
        - \php-cgi.exe
        - \powershell.exe
        - \pwsh.exe
        - \w3wp.exe
        - \wscript.exe
      selection_process_parent_path:
        ParentImage|contains:
        - \apache
        - \tomcat
        - \AppData\
        - \Temp\
        - \Public\
        - \PerfLogs\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_file and 1 of selection_process_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: A directory database copy is usually a late stage — earlier alerts on the same host may show
    the chain that led to it, such as web-application attack detections, dropped tooling, defense tampering,
    or reconnaissance. Reviewing the preceding alert timeline reconstructs how the actor reached the point
    of exporting credentials and what else they touched on the way.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
