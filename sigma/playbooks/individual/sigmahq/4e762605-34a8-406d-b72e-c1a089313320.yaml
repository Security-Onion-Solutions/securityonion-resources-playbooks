name: Potential Fake Instance Of Hxtsr.EXE Executed
id: 0692d2ef-e681-4606-9c2d-bce9f2761f53
description: |
  Detects a process whose image name ends in hxtsr.exe running from any path other than the
  hidden WindowsApps package directory the Microsoft Outlook communications component installs
  to. The genuine HxTsr.exe ships only inside a version-stamped
  C:\Program Files\WindowsApps\Microsoft.WindowsCommunicationsApps_* folder and is launched by
  the Windows app model, so the file name alone carries no trust — the location is what the rule
  measures. A copy of the name placed in a user-writable or otherwise non-package directory is
  consistent with masquerading (T1036), where a binary borrows a familiar Microsoft name so that
  process listings and analyst review pass over it. Determine what the file on disk actually is
  from its PE metadata, signature, and hash, how it got to that path, and what it did once it ran.
type: detection
detection_id: 4e762605-34a8-406d-b72e-c1a089313320
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the image path of the alerting process match what this rule detects — hxtsr.exe running from outside the WindowsApps package directory?
  context: >-
    The rule fires on any process whose Image ends in \hxtsr.exe unless the full path contains
    ":\program files\windowsapps\microsoft.windowscommunicationsapps_". Read the Image value and
    confirm the path really is outside that package folder rather than a spelling the filter did
    not cover, such as a redirected or remapped drive letter pointing back at the same package.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run an Outlook communications component from a non-package location?
  context: >-
    The genuine component is installed and started by the Windows app model, not by users or
    administrators, so there is no routine reason for a person or a deployment tool to place it
    elsewhere. A packaging, imaging, or application-repackaging role on this host is one of the
    few explanations that does not involve name reuse by an unrelated binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of this binary based on its metadata and hash?
  context: >-
    The file name on disk is attacker-controlled; the PE metadata and code signature are not. For
    the genuine component, OriginalFileName reads HxTsr.exe and the signature resolves to Microsoft
    with a valid status. An OriginalFileName that names a different tool, an absent or mismatched
    signature, or an unsigned image means the name is borrowed. Submit the hash for reputation
    review to separate a relocated legitimate copy from a known-bad or novel sample.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this renamed or misplaced binary arrive on the host?
  context: >-
    A file named hxtsr.exe outside the package directory was written there by something — a
    download, an archive extraction, a manual copy, a remote admin tool, or a dropper. The
    creating process on the file write identifies the delivery mechanism. Match on the base name
    over a long window, because the write may predate the execution by weeks. A write into Temp,
    AppData, Downloads, or a profile directory points to user-initiated or delivered content; a
    write into a system directory points to a privileged process having performed it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: >-
    Borrowing a Microsoft name buys concealment, not capability — the child processes reveal what
    the file is for. The genuine component spawns nothing in normal operation, so any child at all
    is a deviation. Command interpreters, script hosts, or transfer utilities under this parent
    describe the operator's next stage. Read this together with the fleet-wide count of the rule's
    pattern to judge whether the file was distributed beyond this endpoint.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What arguments did this hxtsr.exe run with, and what working directory was it launched from?
  context: >-
    The genuine component is started by the app model with no operator-supplied arguments, so any
    flags, paths, URLs, or encoded content on the command line are the file's own operational
    parameters rather than Outlook's. The working directory often names the staging folder the
    file was run from. Decode every argument and resolve any path or URL it references.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this hxtsr.exe and is that parent chain expected?
  context: >-
    The genuine component is launched by the Windows app model host under svchost.exe, so a parent
    such as explorer.exe, a command interpreter, a script host, an archive utility, an Office
    application, or a remote-execution service describes how the file was started by hand or by a
    delivery chain. Walk up from the parent to see what started it and what else it launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which directories has a binary named hxtsr.exe ever run from on this host, and is the genuine package copy among them?
  context: >-
    The discriminator for this rule is installation location, so the set of paths the name has run
    from on this host is the direct answer. A version-stamped
    C:\Program Files\WindowsApps\Microsoft.WindowsCommunicationsApps_* path alongside the alerting
    path means the real component is installed and a second file is reusing its name. Only
    non-package paths means the name was introduced by something other than the Outlook package.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \hxtsr.exe
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
  - asset_inventory
- question: Were any services installed on this host in the days around the alert, and does one of them point at a non-package binary?
  context: >-
    Masquerading is frequently paired with service registration so the misnamed file starts
    without a user present. Service install records carry the image path the service will run,
    which exposes a registration pointing at a user-writable directory or at the alerting path.
    Hosts that do not forward the System event log return nothing here, which is a visibility gap
    rather than evidence no service was created.
  range: -7d
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
      - AccountName
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Has this exact image path run on this host before, and under which accounts?
  context: >-
    A path that has never produced an execution in 90 days is a newly introduced file rather than
    a long-standing local install. A steady count under a single account points at something
    already resident on the host, which changes the question from delivery to why it was installed
    and never noticed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how out-of-package hxtsr.exe executions have historically
    run here rather than generic use of the name. A new parent process or an unexpected account
    against an otherwise steady history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \hxtsr.exe
      filter_main_hxtsr:
        Image|contains: :\program files\windowsapps\microsoft.windowscommunicationsapps_
        Image|endswith: \hxtsr.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of out-of-package hxtsr.exe executions, aggregated by host. A user with
    no such history is a different finding from one who produces the pattern routinely; weigh the
    count against what the account is normally used for.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \hxtsr.exe
      filter_main_hxtsr:
        Image|contains: :\program files\windowsapps\microsoft.windowscommunicationsapps_
        Image|endswith: \hxtsr.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior
    and the launch mechanism is the meaningful pivot. The query mirrors the rule's selection
    structure scoped to the alerting parent, giving the 90-day history of that parent driving
    out-of-package hxtsr.exe executions. A parent that already accounts for a large prior volume
    is packaging or management automation; a parent new to this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \hxtsr.exe
      filter_main_hxtsr:
        Image|contains: :\program files\windowsapps\microsoft.windowscommunicationsapps_
        Image|endswith: \hxtsr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    identity was active elsewhere at the same time. The same user producing related execution on
    multiple endpoints widens the scope beyond this host. When the alert fires under SYSTEM or a
    machine account, this view fills with routine service telemetry and the parent-scoped view of
    the same window is the answer to read instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, a user-scoped fleet view returns routine service telemetry. The
    meaningful question is whether the same launch mechanism produced out-of-package hxtsr.exe
    executions elsewhere in the alert window. Multiple hosts points to scheduled or pushed
    deployment; a single host points to a trigger local to this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \hxtsr.exe
      filter_main_hxtsr:
        Image|contains: :\program files\windowsapps\microsoft.windowscommunicationsapps_
        Image|endswith: \hxtsr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent/child pair on the host in the alert window collapses repetitive
    service telemetry into high-count rows while novel pairs stand out at low counts. Look for the
    write or extraction that produced the file, the interactive session that launched it, and any
    reconnaissance or persistence step that followed.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count
    of out-of-package hxtsr.exe executions rather than the name's generic footprint. Many hosts
    firing the same pattern points to a packaging or imaging practice that relocates the component;
    one host or a small unrelated set points to a file placed by hand. Use the host distribution to
    calibrate how far the file spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|endswith: \hxtsr.exe
      filter_main_hxtsr:
        Image|contains: :\program files\windowsapps\microsoft.windowscommunicationsapps_
        Image|endswith: \hxtsr.exe
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host reconstruct the stages that led here. A delivery or
    extraction alert, a defense-tampering alert, or a remote-execution alert before this one
    explains how the file reached the path it ran from and who put it there.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
