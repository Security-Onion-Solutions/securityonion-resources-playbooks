name: Potential SAM Database Dump
id: 9deb5f57-d25d-4eb6-924e-35d05eacdbbb
description: |
  Detects the creation of a file whose name matches a copy or export of the local SAM registry
  hive (for example \sam.save, \sam.hive, \hive_sam_, \Users\Public\sam, or _ShadowSteal.zip).
  A copy of the SAM hive, paired with the SYSTEM hive, yields offline-crackable local account
  password hashes (T1003.002); it is produced by reg save of HKLM\SAM, by esentutl, by a Volume
  Shadow Copy read of the config directory (including the permissive-ACL read path CVE-2021-36934),
  or by a purpose-built dumping tool. Rare backup or administrative activity can create similar
  files, so the investigation should establish which process wrote the file, the command line that
  drove it, whether the SYSTEM and SECURITY hives were saved alongside it, and whether the copy was
  exfiltrated or the host moved on to credential reuse.
type: detection
detection_id: 4e87b8e2-2ee9-4b2a-a715-4727d297ece0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the created file path match one of this rule's SAM-hive export patterns, and which process wrote it?
  context: >-
    Confirm the alert is a true positive by reviewing the exact TargetFilename against the rule's
    patterns (\sam.save, \sam.hive, \sam.export, \hive_sam_, \sam_backup, _ShadowSteal.zip, and the
    writable-directory \sam variants) and identifying the responsible process. The set of paths the
    rule pins is the tuning surface for this technique; a match on a system-writable location such as
    \Users\Public or \ProgramData is what separates a dump artifact from an unrelated file that
    happens to contain "sam".
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to produce a copy of the SAM registry hive?
  context: >-
    Legitimate backup software and a small number of administrative workflows can copy registry
    hives, so knowing whether the writing user and host role fit that activity is often the fastest
    triage. When the user is a machine or service account, judge by the writing process and the host's
    function (backup server, domain member workstation) rather than by the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this file a genuine SAM hive copy, and what wrote it to this path?
  context: >-
    A registry hive copy is a data file, not an executable; confirm its nature from the write event
    and, where the file can be retrieved, its size and leading bytes (a raw hive begins with the "regf"
    signature, while a tool such as _ShadowSteal.zip is an archive of collected hives). The writing
    Image on the event tells you whether a standard utility (reg.exe, esentutl.exe), a script host, or
    an unfamiliar binary produced it, which sets the direction for the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was the SAM database accessed or exported, and were the SYSTEM and SECURITY hives saved too?
  context: >-
    The SAM hive alone cannot be cracked; offline extraction of local password hashes requires the
    SYSTEM hive (and SECURITY for cached domain credentials). Confirming that all of SAM, SYSTEM, and
    SECURITY were copied in the same window establishes credential-theft intent rather than an isolated
    file operation. The triggering command line is shown here for context; check it for reg save,
    esentutl, or a shadow-copy read of the config directory, and note the paths each hive was written to.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did any hive-dumping command (reg save, esentutl, or a Volume Shadow Copy read) run on this host around the alert?
  context: >-
    The file event records the artifact but not the command that produced it. This searches process
    activity on the host for the command patterns that dump SAM/SYSTEM/SECURITY - reg save and reg.exe
    save of HKLM\SAM, esentutl copies of locked hives, and vssadmin-driven shadow-copy access. A
    temporal gap of only a few minutes between the SAM and SYSTEM dumps is the expected signature.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'reg save'
          - 'reg.exe save'
          - 'esentutl'
          - 'vssadmin'
          - 'HKLM\SAM'
          - '\config\SAM'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What process spawned the writer of this file, and is that parent chain expected for a backup or admin task?
  context: >-
    The parent process reveals how the hive copy was initiated. Legitimate backup agents and admin
    consoles have predictable parents (services.exe, a scheduling service, an interactive admin shell);
    an unexpected parent such as a script host, an Office application, or a remote-execution service
    points to hands-on-keyboard credential theft. Known-good backup tooling is the main benign parent to
    rule in or out here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If a dumping tool rather than a standard utility produced this file, did that tool execute, and what is its hash?
  context: >-
    A hive copy is written by some process but carries no hash on the file-creation event, and the hive
    itself does not run. If the artifact is a tool dropped on disk (for example _ShadowSteal.zip and its
    extracted binary), this looks for that binary executing so its hash can be read and submitted to
    threat intelligence. If the artifact is a plain hive copy, expect no execution row and instead
    retrieve the file from its on-disk path to hash and preserve it for offline analysis.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is the hive copy still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A hive copy still on disk can be retrieved,
    hashed, and preserved as evidence of the accounts exposed; a copy deleted seconds after creation
    points to anti-forensic cleanup after the hashes were already staged for exfiltration, and shifts
    focus to what left the host in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A SAM dump rarely stands alone - the same process commonly writes the SYSTEM and SECURITY hive
    copies, a staging archive, and sometimes a tool binary. The breadth and paths of the process's other
    file activity confirm whether all three hives were collected together (the credential-theft
    signature) and enumerate what else needs to be treated as compromised or recovered.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by movement using the recovered accounts. The query returns
    outbound connections from this host to remote-access ports - 3389 (RDP), 445 (SMB/PsExec), 5985/5986
    (WinRM), 22 (SSH) - in the hours after the event, with the originating Image and User. Two limits:
    hashes cracked or replayed from another machine will not appear here (check logon activity on
    suspected targets for these accounts), and if endpoint network telemetry is not collected from this
    host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which local accounts are exposed by this hive, and do any have elevated privileges?
  context: >-
    The severity of a SAM dump depends on the accounts stored in that hive - a shared local
    administrator password reused across the fleet turns one dumped host into fleet-wide exposure,
    while a standalone workstation with only a low-privilege local user is far more contained. Cross
    reference the host's local accounts (and any domain accounts cached on it) against their privilege
    level and password-reuse posture to size the required response.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user produced this SAM-dump pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user - the result is the user's 90-day history
    of creating files matching the SAM-hive export patterns, aggregated by host, not their generic file
    activity. A user who has never produced this pattern is more suspicious than a backup operator or
    forensics analyst who does so routinely; weigh the count against the account's role and expected
    toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|endswith:
        - \Temp\sam
        - \sam.sav
        - \Intel\sam
        - \sam.hive
        - \Perflogs\sam
        - \ProgramData\sam
        - \Users\Public\sam
        - \AppData\Local\sam
        - \AppData\Roaming\sam
        - _ShadowSteal.zip
        - \Documents\SAM.export
        - :\sam
      - TargetFilename|contains:
        - \hive_sam_
        - \sam.save
        - \sam.export
        - \~reg_sam.save
        - \sam_backup
        - \sam.bck
        - \sam.backup
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the SAM-dump pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the launch mechanism does. This mirrors the rule's selection scoped to the alerting program, giving the 90-day history of that program driving this specific pattern. A new or rare program
    is the deviation worth chasing; a program that already accounts for thousands of prior events is
    backup or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|endswith:
        - \Temp\sam
        - \sam.sav
        - \Intel\sam
        - \sam.hive
        - \Perflogs\sam
        - \ProgramData\sam
        - \Users\Public\sam
        - \AppData\Local\sam
        - \AppData\Roaming\sam
        - _ShadowSteal.zip
        - \Documents\SAM.export
        - :\sam
      - TargetFilename|contains:
        - \hive_sam_
        - \sam.save
        - \sam.export
        - \~reg_sam.save
        - \sam_backup
        - \sam.bck
        - \sam.backup
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential access was one step in
    broader hands-on activity. If the same user triggered process activity on multiple hosts in this
    window, the scope of compromise may extend beyond the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven SAM-dump pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, network-wide user activity returns agent-telemetry noise; the
    meaningful question is whether the same launch mechanism produced the pattern elsewhere. This mirrors
    the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in
    the same window points to scheduled or pushed automation - or a coordinated credential-harvesting
    sweep; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|endswith:
        - \Temp\sam
        - \sam.sav
        - \Intel\sam
        - \sam.hive
        - \Perflogs\sam
        - \ProgramData\sam
        - \Users\Public\sam
        - \AppData\Local\sam
        - \AppData\Roaming\sam
        - _ShadowSteal.zip
        - \Documents\SAM.export
        - :\sam
      - TargetFilename|contains:
        - \hive_sam_
        - \sam.save
        - \sam.export
        - \~reg_sam.save
        - \sam_backup
        - \sam.bck
        - \sam.backup
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Credential access rarely happens in isolation. Earlier detections on the same host - privilege
    escalation, defense tampering, or the reconnaissance that located the config directory - may reveal
    the stages that preceded the dump and help reconstruct the timeline that led to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
