name: Use of Remote.exe
id: ae35e53d-51e5-4235-a9bd-2b54c6c21aba
description: |
  Detects execution of remote.exe, a signed debugging utility shipped with the Windows SDK Debugging Tools, identified by its Image path ending in remote.exe or its OriginalFileName. Remote.exe can spawn an arbitrary executable as its child under a trusted Microsoft-signed parent, and can run a binary from an SMB path without writing it to local disk, making it usable for application-allowlist bypass and proxied execution. Investigation should determine what child the tool launched, whether the binary or payload came from a user-writable or remote path, and whether the host is a legitimate development or debugging system.
type: detection
detection_id: 4eddc365-79b4-43ff-a9d7-99422dc34b93
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this process match the remote.exe debugging utility this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the Image path and OriginalFileName against the rule's criteria. The rule fires when the Image ends in remote.exe or the OriginalFileName is remote.exe, so a renamed copy of the binary still matches on the original-filename branch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run Windows SDK debugging tools?
  context: Remote.exe is part of the Debugging Tools for Windows and is normally seen only on developer or build systems where the SDK is installed. Knowing whether the user role and host function involve debugging or driver development is often the fastest path to separating an approved SDK install from proxied execution on an end-user workstation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did remote.exe run? Decode the command line to identify the proxied executable and its arguments.
  context: The full command line reveals what was launched under the signed binary. Remote.exe takes a /s switch followed by the target program and its arguments, so decode the value after /s to identify whether it points to a local executable, a command interpreter, or an SMB/UNC path. A target on a \\host\share path means the payload runs without ever touching local disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned remote.exe and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A debugging session launched from explorer.exe or an IDE on a developer host is routine; remote.exe spawned by a command interpreter, a script host such as wscript.exe or mshta.exe, or an Office application points to scripted or proxied invocation rather than interactive debugging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did remote.exe spawn afterward?
  context: The core abuse of this tool is launching another executable as a child under the trusted signed parent. Children such as powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe, or mshta.exe spawned by remote.exe are high-risk and indicate proxied execution; a debugging session driving a target binary under test is the benign counterpart.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did remote.exe or its child load DLLs from user-writable or unsigned paths?
  context: Proxy execution under a trusted utility frequently involves loading an unsigned or user-writable DLL so attacker code runs inside a signed process context. Modules loaded from %TEMP%, %APPDATA%, the public profile, or other user-writable directories, or modules without a valid signature, are the deviation worth chasing; modules loaded from the SDK install path and System32 are expected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did remote.exe or its child write a new executable to a user-writable path around the alert?
  context: One T1127 pattern writes a payload to a user-writable location and then runs it through the signed utility. Files written to %TEMP%, %APPDATA%, the public profile, or the recycle bin with executable extensions shortly before or after the alert are evidence of a staged payload; a debugging workflow normally reads an existing binary rather than dropping a new one.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - TargetFilename
      - EventType
- question: Did remote.exe make outbound network connections after it ran?
  context: Remote.exe can run a binary directly from an SMB or UNC path, and proxied payloads often reach out to retrieve a stage or call back. Outbound connections from remote.exe itself, especially to a rare or external destination, point to remote retrieval or command-and-control; a local debugging session typically stays on the host or talks only to known build infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimate SDK tool can be abused. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how remote.exe has historically run here. A new parent process, an unexpected user account, or a first-time appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \remote.exe
      - OriginalFileName: remote.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of remote.exe firing the rule's pattern. Many hosts running it points to scripted deployment or a development image where the SDK is widely installed; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \remote.exe
      - OriginalFileName: remote.exe
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \remote.exe
      - OriginalFileName: remote.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \remote.exe
      - OriginalFileName: remote.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \remote.exe
      - OriginalFileName: remote.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the attack stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
