name: WinRAR Execution in Non-Standard Folder
id: 981e1de4-71f0-4e62-90f5-b9b8e3a91888
description: |
  Detects rar.exe or winrar.exe running from a location that is not the default WinRAR
  installation folder, identified either by the binary name or by the file Description
  metadata, while excluding UnRAR.exe and the Windows Temp directory. WinRAR relocated
  outside its install path is commonly staged by operators to compress collected files
  prior to exfiltration, often dropped alongside the data into a working or staging
  directory. Legitimate cases include software bundles that ship their own copy of WinRAR.
  Investigation should confirm what files were archived, whether encryption or password
  protection was applied, and how the binary arrived in the non-standard location.
type: detection
detection_id: 4ede543c-e098-43d9-a28f-dd784a13132f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did rar.exe or winrar.exe run from a folder other than the default WinRAR install path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule
    matches the WinRAR binary by name or by file Description metadata when it runs from a path
    other than the standard Program Files WinRAR folders, and excludes UnRAR.exe and the Windows
    Temp directory. Confirm the Image path and Description against those criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Description
- question: Is this user and host expected to run WinRAR from a non-standard folder?
  context: Legitimate administrative activity and bundled software can trigger this detection.
    Knowing whether the user role and host function normally involve archiving tools relocated
    outside the default install path is often the fastest path to distinguishing routine operations
    from staging activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this WinRAR invocation do? Decode the full command line.
  context: The full command line reveals what was archived and how. Decode the archive operation
    flags, the source file paths and wildcards being collected, the recursion flag, the output
    archive path, and any compression or encryption switches. The working directory often reveals
    the source location of the targeted data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What files or directories were selected for collection or archiving?
  context: 'The command-line arguments reveal what data was targeted: specific file types, sensitive
    directories such as finance shares, HR folders, or source code repositories, or broad wildcards
    indicating bulk collection. The scope of targeted data determines the severity of potential
    data loss and which business units need to be notified.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was encryption or password protection applied to the archive?
  context: Operators often apply passwords to archives to prevent inspection of the contents during
    exfiltration. Flags like -p set a password, -hp encrypts the headers so even the filenames
    inside the archive are hidden, and -m5 selects maximum compression. A password-protected archive
    being staged is a stronger indicator of deliberate data theft than an unprotected one. Some
    tools accept the password via stdin or a config file, where it will not appear in the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Where was the archive or exported data moved after creation?
  context: Data staging typically involves creating an archive locally, then moving it to a staging
    location or exfiltrating it over the network. Checking the files the tool wrote and any network
    connections from the same host reveals the exfiltration path, whether the archive was uploaded
    to cloud storage, copied to removable media, or sent to an external server. Pivot to network
    connections from this host in the same window to see actual outbound transfer.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the file that ran genuinely WinRAR, or a renamed or impersonating binary?
  context: The rule matches both on the binary name and on the file Description metadata, so a
    binary named rar.exe or winrar.exe in a non-standard folder may be a renamed copy of a different
    tool, while a binary with a generic name can still carry WinRAR Description metadata. Compare
    the on-disk file name, the internal file Description and original filename, the signature and
    publisher, and the file hash against a known-good WinRAR distribution to confirm identity and
    catch masquerading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Description
      - OriginalFileName
      - Hashes
- question: Did this binary load crypt32.dll or other encryption libraries during the archiving operation?
  context: Archiving tools that encrypt their output load cryptographic libraries such as crypt32.dll.
    An image-load view of the alerting process tells the analyst whether encryption ran in this
    instance, which complements the command-line view since some tools take the password through
    stdin or a config file rather than on the command line. If image-load events are not collected
    in this environment, treat zero results as a visibility gap rather than evidence no encryption ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      selection_lib:
        ImageLoaded|endswith:
          - \crypt32.dll
          - \bcrypt.dll
          - \ncrypt.dll
      condition: selection and selection_lib
    fields:
      - ImageLoaded
      - Image
- question: What process spawned this WinRAR instance and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Operator-driven archiving is often
    launched from a shell, a script host, or a remote-access tool rather than from interactive
    explorer.exe activity. An unusual parent such as a script interpreter or an Office application
    points toward automated or scripted collection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this WinRAR instance spawn afterward?
  context: The processes spawned after archiving reveal the next stage. Legitimate archiving has
    predictable or no children, while staging activity is often followed by file transfer or
    upload tooling, cleanup commands that delete the source files, or a shell handing off to the
    next step of the operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run WinRAR from a non-standard folder?
  context: A binary that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for WinRAR on this host indicate first-time or
    rare execution and raise the priority of confirming how the binary arrived in this location.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally
    drive that activity, and does the current alert fit that pattern?
  context: Even common tools can be abused. The query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this rule's specific
    firing pattern has historically run here, not generic WinRAR usage. A new parent process, an
    unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description:
        - Command line RAR
        - WinRAR
      filter_main_unrar:
        Image|endswith: \UnRAR.exe
      filter_main_path:
        Image|contains:
        - :\Program Files (x86)\WinRAR\
        - :\Program Files\WinRAR\
      filter_optional_temp:
        Image|contains: :\Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description:
        - Command line RAR
        - WinRAR
      filter_main_unrar:
        Image|endswith: \UnRAR.exe
      filter_main_path:
        Image|contains:
        - :\Program Files (x86)\WinRAR\
        - :\Program Files\WinRAR\
      filter_optional_temp:
        Image|contains: :\Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description:
        - Command line RAR
        - WinRAR
      filter_main_unrar:
        Image|endswith: \UnRAR.exe
      filter_main_path:
        Image|contains:
        - :\Program Files (x86)\WinRAR\
        - :\Program Files\WinRAR\
      filter_optional_temp:
        Image|contains: :\Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or collection
    spanning multiple endpoints. If the same user triggered similar activity on multiple hosts,
    the scope of potential data collection may be larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description:
        - Command line RAR
        - WinRAR
      filter_main_unrar:
        Image|endswith: \UnRAR.exe
      filter_main_path:
        Image|contains:
        - :\Program Files (x86)\WinRAR\
        - :\Program Files\WinRAR\
      filter_optional_temp:
        Image|contains: :\Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is
    a fleet-wide count of this rule's firing pattern, not generic WinRAR usage. Many hosts firing
    the same pattern points to scripted deployment or vendor automation; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith:
        - \rar.exe
        - \winrar.exe
      - Description:
        - Command line RAR
        - WinRAR
      filter_main_unrar:
        Image|endswith: \UnRAR.exe
      filter_main_path:
        Image|contains:
        - :\Program Files (x86)\WinRAR\
        - :\Program Files\WinRAR\
      filter_optional_temp:
        Image|contains: :\Windows\Temp\
      condition: selection and not 1 of filter_main_* and not 1 of filter_optional_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as
    reconnaissance, credential access, or defense tampering, may reveal the attack stages that
    preceded the collection activity and help reconstruct the full timeline leading to archiving.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
