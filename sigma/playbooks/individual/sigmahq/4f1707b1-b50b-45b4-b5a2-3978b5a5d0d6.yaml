name: Potential Homoglyph Attack Using Lookalike Characters in Filename
id: 81148f65-ab7b-41e8-a05a-12cea28618f2
description: |
  Detects creation of files whose names contain Unicode characters from the Cyrillic or Greek alphabets that are visually indistinguishable from ASCII letters. The rule fires when the filename contains at least one character from either the uppercase lookalike set or the lowercase lookalike set. Attackers substitute these characters into otherwise-Latin filenames so a payload renders as a familiar, trusted name (a common tactic in fake update and installer lures) while evading string-based matching; the same characters also occur legitimately in filenames written in languages that use those alphabets, which is this rule's documented false-positive class. Investigation should confirm which lookalike characters matched and what name the file imitates, identify the process that wrote it, and determine whether the file executed and whether it appears on other hosts.
type: detection
detection_id: 4f1707b1-b50b-45b4-b5a2-3978b5a5d0d6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the filename actually contain lookalike characters from either the uppercase or the lowercase homoglyph set?
  context: The rule fires when the filename contains at least one character from either the uppercase lookalike set (Cyrillic and Greek capitals such as А, Е, О, Р, С) or the lowercase set (а, е, о, р, с and similar) — note which set matched. Review the exact path, the operation performed, and the writing process, and check whether the name mixes Latin letters with lookalike characters to imitate a familiar name rather than being ordinary text written entirely in another alphabet.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host expected to produce filenames containing Cyrillic or Greek characters?
  context: Filenames with legitimate Cyrillic or Greek text are this rule's documented false-positive class — hosts used in locales that write in those alphabets produce them routinely. Judge whether this user and host plausibly handle non-Latin documents, and whether the flagged name reads as real words in another language or as a Latin name with a few substituted characters. When the user is a machine or service account, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which lookalike characters does the filename contain, and what legitimate name is it imitating?
  context: Convert the filename to code points to identify exactly which characters are non-ASCII — a name that renders as a common update or installer name but contains Cyrillic or Greek substitutions (for example Cyrillic а U+0430 in place of Latin a) is a deliberate lookalike. Then examine the content by type — script files for embedded URLs, download logic, or obfuscated code; archives for what they contain; executables for signing status and packer indicators. Where the file landed also matters — user-writable download paths fit a lure delivery, while application data written by localized software fits benign non-Latin naming. Content retrieval is manual work from the endpoint or an EDR console.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What process wrote the homoglyph-named file, and is that writer what it claims to be?
  context: On a file alert the recorded process identifiers belong to the writer. A browser or archive utility indicates the file arrived by user download or extraction — consistent with a lure delivered from a compromised or fake update page — while a script host or an unfamiliar binary as the writer indicates an already-running payload staged the file. Compare the writer's on-disk name against its OriginalFileName metadata and submit its hash for a reputation check to confirm the writer itself is not masquerading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Is the homoglyph-named file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives next steps. A payload still on disk can be retrieved, hashed, and analyzed; deletion seconds after creation suggests anti-forensic cleanup or a self-deleting dropper; a rename may show the lookalike name being changed after delivery or the payload being moved into place. Interpret by EventType and the process performing each operation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What launched the process that wrote this file, and is that launch chain expected?
  context: The launch chain of the writer shows how the file got here. An explorer.exe parent indicates interactive user action such as saving or extracting a download; a browser parent over a script-host writer matches the drive-by pattern where a downloaded script executes directly; a service or scheduled-task lineage indicates automation. The writer's own command line is included — for interpreters it names the script that performed the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one lookalike-named file often writes several — an archive being unpacked, a dropper staging components, or cleanup deletions following execution. The correlation covers the writer and its direct children, since droppers often delegate. Watch where the writes land — user-writable staging paths (Downloads, Temp, AppData) are the usual destinations for lure payloads, and sibling files with the same character substitutions widen the artifact list.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: Was the homoglyph-named file executed, and under what user and parent context did it run?
  context: Execution is the transition that matters. A directly-run executable appears with its Image ending in the dropped name; scripts and archive contents run indirectly — an interpreter such as wscript.exe or powershell.exe with the filename in its command line. Check which user and parent drove execution, compare OriginalFileName against the on-disk name to spot a renamed binary, and treat execution within minutes of creation as the delivery-to-execution handoff.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_direct:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: 1 of selection_*
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - User
      - ParentImage
  answer_sources:
  - process_creation
- question: If the file has executed, what is its hash, and does it have known threat intel detections?
  context: File-creation events carry no hash — the hash is recorded on the execution event. If the file ran, read its hash there and check it against threat intelligence to classify it as known-malicious, known-good, or previously unseen. If it has not executed, or runs only under an interpreter as scripts and archive contents do, retrieve it from the on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What child processes followed execution of the homoglyph-named file?
  context: A lookalike name exists to get the file run; what happens next reveals its purpose. Delivery lures of this kind commonly launch host and domain reconnaissance (whoami, systeminfo, nltest domain-trust queries) and script hosts that make outbound connections shortly after execution. Enumeration utilities or an outbound-connecting interpreter among the children move the investigation from delivery to active compromise.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_direct:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        host.name|expand: '%hostname%'
        ParentCommandLine|contains|expand: '%TargetFilename%'
      condition: 1 of selection_*
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this filename appeared on this host before, and what wrote it each time?
  context: First-time appearance supports a fresh delivery; recurring writes of the same name by the same localized application support routine non-Latin naming. The aggregation groups by path and writing process — a name that has existed for months and is touched by ordinary software reads differently from one that appeared today from a browser.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Is a file with this name present on any other hosts?
  context: The same lookalike-named file on multiple hosts indicates shared delivery — a distribution wave from the same lure page, a shared drive, or deliberate lateral placement. A single host points to an isolated download. Note which hosts and which writing processes are involved and whether the appearances cluster in time.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did this rule fire on other hosts around the same time?
  context: The exact-filename view can miss related activity — different lure names built with the same character substitutions fire this same rule, so the rule's own firings are the practical fleet-wide anchor for the pattern. Several hosts alerting in a short window indicates a common delivery source reaching multiple users; a steady background of firings across the environment in locales that use these alphabets instead indicates the documented false-positive class and supports tuning.
  range: +/-24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid: 4f1707b1-b50b-45b4-b5a2-3978b5a5d0d6
      condition: selection
    fields:
      - host.name
      - rule.name
  answer_sources:
  - alert
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's process activity across all hosts in the alert window reveals whether the same account is active on other endpoints in ways that match the delivery — browsers, script hosts, or archive tools appearing under the same account elsewhere. If the alert fired under a service principal or machine account this view fills with agent noise — rely on the writer-anchored questions and the fleet rule-correlation view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: What other file activity occurred on this host around the time of the alert?
  context: The aggregation collapses each writing process and path into counted rows so repetitive platform noise stands out as high-count entries while novel writer-path combinations surface at low counts. Around a lure delivery, look for the browser download, archive extraction, and any payload staging appearing as low-count rows in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may show the stages that preceded this file — a drive-by or phishing-related alert, script-host execution, or defense tampering. Review the sequence for a progression from initial delivery toward execution and follow-on activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
