name: Uncommon AddinUtil.EXE CommandLine Execution
id: 3d19a80b-ba71-4ba9-b427-9a72620a6d8f
description: |
  Detects execution of the .NET Add-In deployment cache utility AddinUtil.exe with an -AddInRoot: or -PipelineRoot:
  parameter that points somewhere other than the standard VSTA shared-component path. AddinUtil.exe is a legitimate,
  Microsoft-signed binary, but it can be abused for proxy execution: pointing -AddInRoot: at a user-controlled folder
  that contains a crafted Addins.store file causes the add-in cache read to deserialize that file with BinaryFormatter,
  which executes attacker-supplied code under a trusted binary. The rule fires when the binary (by Image name or
  OriginalFileName) runs with one of those parameters AND the parameter does not resolve to the legitimate VSTA path.
  Investigation should confirm where the -AddInRoot:/-PipelineRoot: path resolves, whether a deserialization payload or
  child process followed, and whether the parent, user, and host are consistent with expected add-in maintenance.
type: detection
detection_id: 4f2cd9b6-4a17-440f-bb2a-687abb65993a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: 'Did AddinUtil.exe run with an -AddInRoot: or -PipelineRoot: parameter that does not resolve to the standard VSTA path?'
  context: 'Confirm the alert is a true positive. The rule fires when the binary identifies as AddinUtil.exe (by Image name
    or OriginalFileName) AND the command line carries -AddInRoot: or -PipelineRoot: AND that parameter does not point at
    the legitimate path C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA. Read the exact command line and verify all
    three conditions hold before investing further time.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run AddinUtil.exe with a custom add-in root path?
  context: 'Legitimate AddinUtil.exe activity is normally driven by Office add-in maintenance and resolves to the standard
    VSTA shared path. A custom -AddInRoot:/-PipelineRoot: path is unusual for routine use. Knowing whether this user role
    and host function involve add-in development or deployment is often the fastest way to separate a benign developer
    workflow from proxy execution.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: 'Where does the -AddInRoot:/-PipelineRoot: path resolve, and is it a user-writable location?'
  context: 'The parameter value is the heart of this technique. Decode the full -AddInRoot:/-PipelineRoot: argument and
    resolve it against the current working directory if it is relative (for example -AddInRoot:. or the quoted dot form). A path
    under Temp, Desktop, Downloads, Users\Public, or Windows\Temp is user-writable and consistent with a planted Addins.store
    payload; the standard, benign location is C:\Windows\Microsoft.NET\Framework or Framework64 or WinSxS. Note whether an
    Addins.store file exists at that path.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - '-AddInRoot:'
          - '-PipelineRoot:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned AddinUtil.exe and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. Routine add-in maintenance is typically launched from
    Office or installer/servicing processes. An unexpected parent such as a shell, script host, Office application running a
    macro, or an Electron/IDE process suggests the invocation was driven by an operator or a delivered document rather than
    normal servicing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did AddinUtil.exe spawn afterward?
  context: A successful deserialization payload runs code under AddinUtil.exe, which most visibly manifests as an unexpected
    child process. Legitimate children are limited to conhost.exe and werfault.exe; anything else — a shell, script host,
    certutil, rundll32, or an arbitrary executable — points to code execution through the crafted add-in cache and is the
    strongest confirmation of impact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What modules did AddinUtil.exe load, and were any loaded from a non-system or unsigned location?
  context: AddinUtil.exe is a .NET host that normally loads framework and add-in assemblies from system directories. Modules
    loaded from a user-writable path, or unsigned modules tied to this execution, indicate the process was steered to load
    attacker-supplied code rather than serviced add-ins. If image-load telemetry is not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did AddinUtil.exe initiate any network connections, and to where?
  context: AddinUtil.exe performing add-in cache maintenance has no routine reason to make network connections. An outbound
    connection from this process suggests the deserialized payload reached out to retrieve a stage or establish command and
    control. Review the destination against expected enterprise endpoints; a connection to an external or unfamiliar host is
    high-value confirmation of malicious use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run AddinUtil.exe at all?
  context: AddinUtil.exe runs infrequently outside of add-in development and Office servicing. A host that has never or rarely
    executed this binary over the past 90 days makes the current execution stand out; a host with regular history suggests an
    established workflow worth confirming against the parameter path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a binary that appears occasionally can be abused. This query mirrors the rule's exact selection (AddinUtil.exe
    with -AddInRoot:/-PipelineRoot:, excluding the legitimate VSTA path) scoped to this host, so the resulting parent/user
    distribution reflects how this specific firing pattern has run here before. A new parent, an unexpected user account, or
    a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_cli:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      filter_main_addinroot:
        CommandLine|contains:
        - -AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific firing
    pattern rather than generic AddinUtil.exe usage. Many hosts firing the same pattern points to a scripted deployment or
    vendor automation worth allowlisting; one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_cli:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      filter_main_addinroot:
        CommandLine|contains:
        - -AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
      condition: all of selection_* and not 1 of filter_main_*
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Proxy execution rarely stands alone. Activity surrounding the alert may reveal the document or script that
    delivered the payload, follow-on reconnaissance, credential access, or staging that frames the broader operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_cli:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      filter_main_addinroot:
        CommandLine|contains:
        - -AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_cli:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      filter_main_addinroot:
        CommandLine|contains:
        - -AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user drove similar activity on several hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_cli:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      filter_main_addinroot:
        CommandLine|contains:
        - -AddInRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -AddInRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:"C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
        - -PipelineRoot:C:\Program Files (x86)\Common Files\Microsoft Shared\VSTA
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, delivery of a document,
    reconnaissance, or credential access — may reveal the stages that preceded this proxy execution and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
