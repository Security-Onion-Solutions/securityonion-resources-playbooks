name: DumpStack.log Defender Evasion
id: 3a0b045a-b98e-4ce0-8d24-ff5fa617bf69
description: |
  Detects a process either whose Image filename ends in DumpStack.log or whose command line contains a download switch writing to DumpStack.log. DumpStack.log is a benign filename the operating system reserves for crash-dump scratch data, and some static scanning treats it as low-interest; naming a payload after it can let the file slip past content scanning. Legitimately, the only process that should carry this name is the OS crash-dump path itself; an executable, script host, or download tool using the name is the anomaly. Determine whether the file is the genuine OS artifact or an attacker reusing a trusted name to stage or run a payload.
type: detection
detection_id: 4f647cfa-b598-4e12-ad69-c68dd16caef8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did the alert fire because the process Image ends in DumpStack.log, or because the command line writes a download to DumpStack.log?
  context: This rule fires when either branch matches, so confirm which one tripped. Review the full Image path and command line of the triggering event. An Image literally ending in \DumpStack.log means something is executing under that name; a command line containing the download-to-DumpStack.log switch means a tool is writing or fetching content into that filename. Note which branch fired, since it determines whether the follow-on investigation centers on the executing file or on the file being written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run or write a file named DumpStack.log?
  context: The only routine source of this filename is the operating system's own crash-dump path, which runs under system context. A regular user or an interactive session executing or downloading a file under this name is not normal administrative activity. Knowing whether the user role and host function explain the behavior is often the fastest way to separate a true positive from a routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of the process using the DumpStack.log name, and where on disk does that file live?
  context: The full command line and working directory reveal the actual operation. Decode any download switch, source URL, or destination path to determine what content is being written into the DumpStack.log name. Check the directory the file resides in - the genuine OS artifact lives in protected system locations, while a payload masquerade typically lands in a user-writable or temporary directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this activity and is that parent chain expected?
  context: The parent process reveals how the file came to execute or be written. The OS crash-dump path is driven by system processes; a download tool or script host writing to this name under explorer.exe, a browser, an Office application, or a script interpreter points to operator-driven staging rather than a system function.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this host ever produced this DumpStack.log activity before?
  context: A pattern that has never been seen on a host is more suspicious than one that recurs. Zero or very low historical counts indicate first-time execution or first-time use of this filename, which is the expected profile for a masquerade attempt rather than a recurring system artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific DumpStack.log pattern has historically run here, not generic file activity. A new parent process, an unexpected user account, or a first-ever appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \DumpStack.log
      selection_download:
        CommandLine|contains: ' -o DumpStack.log'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this activity spawn afterward?
  context: The processes spawned afterward reveal the actual impact. If a file staged under the DumpStack.log name was subsequently executed, or if the staging tool launched additional command interpreters or download utilities, those children show whether this was a setup step in a larger sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Staging a payload under a benign name is rarely an isolated action. Activity surrounding this event may reveal reconnaissance, additional download or staging steps, defense tampering, or persistence installation that provides broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this DumpStack.log pattern rather than generic file usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \DumpStack.log
      selection_download:
        CommandLine|contains: ' -o DumpStack.log'
      condition: 1 of selection*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \DumpStack.log
      selection_download:
        CommandLine|contains: ' -o DumpStack.log'
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \DumpStack.log
      selection_download:
        CommandLine|contains: ' -o DumpStack.log'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints. If the same user staged or executed similar files on other hosts in the same window, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \DumpStack.log
      selection_download:
        CommandLine|contains: ' -o DumpStack.log'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - defense tampering, reconnaissance, or download activity - may reveal the stages that preceded the staging of a file under a reserved system name and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
