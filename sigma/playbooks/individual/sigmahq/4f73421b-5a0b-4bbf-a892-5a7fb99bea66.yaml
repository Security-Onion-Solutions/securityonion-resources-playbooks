name: Mavinject Inject DLL Into Running Process
id: bf2534f9-4117-4832-973e-5b511acb6139
description: |
  Detects use of the Microsoft-signed App-V injector mavinject.exe with the /INJECTRUNNING flag, which performs classic
  LoadLibraryW-via-CreateRemoteThread DLL injection into another running process. The rule fires when a command line contains
  ' /INJECTRUNNING ' AND the parent process is NOT AppVClient.exe (the legitimate App-V service that invokes mavinject during
  normal application virtualization). Because mavinject is a trusted signed binary, it is abused as a proxy-execution and
  injection primitive that loads attacker DLLs under cover of a Microsoft Authenticode signature. Investigate which target
  process was injected, what DLL was loaded, whether that DLL is unsigned or from a non-standard path, and what the parent
  of mavinject was.
type: detection
detection_id: 4f73421b-5a0b-4bbf-a892-5a7fb99bea66
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain the mavinject /INJECTRUNNING injection flag?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when a command line contains
    ' /INJECTRUNNING ' AND the parent process is not C:\Windows\System32\AppVClient.exe (the legitimate App-V service is
    already excluded). The canonical abuse form is mavinject.exe <PID> /INJECTRUNNING <path-to-dll>, so read the full command
    line for the target process ID and the DLL path that follows the flag.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run the App-V injector mavinject.exe outside of App-V application virtualization?
  context: mavinject.exe normally runs only on devices where App-V is in use, and legitimately it is launched by AppVClient.exe.
    A user or host with no App-V footprint invoking mavinject directly is a deviation worth chasing. Knowing whether the
    user role and host function involve App-V is often the fastest path to distinguishing a true positive from routine
    virtualization activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which target process ID and DLL path were passed to mavinject, and is that DLL signed and from a standard location?
  context: The canonical syntax is mavinject.exe <PID> /INJECTRUNNING <path-to-dll>. Decode the full command line to identify
    the numeric target PID and the DLL path that follows /INJECTRUNNING. DLLs loaded from %TEMP%, Downloads, user profile
    directories, or UNC shares, or DLLs that are unsigned or untrusted, are the strongest indicators of abuse; a DLL inside
    an App-V package path is more consistent with legitimate virtualization.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned mavinject.exe, and is that parent expected for an injector binary?
  context: The legitimate parent for mavinject is AppVClient.exe (already excluded by the rule). Any other parent is the
    investigative pivot. Parents such as Office applications, script hosts (wscript.exe, cscript.exe, mshta.exe), powershell.exe,
    cmd.exe, or browsers point to operator-driven or macro-driven injection rather than application virtualization.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did mavinject.exe call an injection-capable API consistent with writing a DLL path and creating a remote thread in a target process?
  context: mavinject completes its injection by writing the DLL path into the target process and creating a remote thread to
    load it - the classic WriteProcessMemory-then-CreateRemoteThread pattern. This data source has no cross-process handle
    telemetry, so the pivot is to the behavioral API events Defend does record for injection primitives - WriteProcessMemory,
    QueueUserAPC, and SetWindowsHookEx calls made by mavinject.exe. A hit here corroborates that mavinject was actively
    reaching into another process rather than exiting before the injection completed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        process.executable|endswith: '\mavinject.exe'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: Did the target process load a new module shortly after the injection, and is that module unsigned or from a non-standard path?
  context: The injection completes when the target process loads the attacker DLL via LoadLibraryW. Review image-load events
    on this host around the alert time for modules loaded into the injected target. A Microsoft-signed mavinject leading to
    an unsigned or untrusted module load in another process is the signed-to-unsigned transition that distinguishes abuse
    from legitimate App-V activity. Correlate the loaded module path against the DLL path seen in the mavinject command line.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Was the injected DLL written to disk on this host before the injection, and by which process?
  context: Operators frequently drop the payload DLL to disk shortly before injecting it. Review file-creation events for
    DLLs written to user-writable locations such as %TEMP%, Downloads, the user profile, or ProgramData, then correlate the
    written path against the DLL path passed to mavinject. The writing process and its parent help establish how the payload
    arrived (download, archive extraction, script-host drop) before mavinject loaded it.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dll'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - User
- question: What child processes did mavinject.exe or the injected target process spawn afterward?
  context: After a successful injection the target process runs attacker code, which often spawns post-exploitation children
    such as cmd.exe, powershell.exe, certutil.exe, or rundll32.exe. Children of mavinject itself, or new children of the
    injected target shortly after the load, reveal the actual operational impact of the injection.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\mavinject.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the injected target process make outbound network connections after the injection?
  context: A common follow-on to injection is command-and-control or staging egress from the now-compromised target process.
    Review outbound connections on this host around the alert window, excluding routine system processes, and focus on
    connections originating from the process that was injected. Correlate destination addresses against known enterprise
    update and CDN ranges before treating egress as malicious.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter:
        Image|endswith:
          - '\svchost.exe'
          - '\services.exe'
      condition: selection and not filter
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Has this host run mavinject.exe before, and how often?
  context: mavinject.exe should not run unless App-V is in use on the host. Zero or very low historical counts indicate
    first-time or rare execution and raise suspicion; a host with regular mavinject activity driven by AppVClient.exe is
    more consistent with sanctioned application virtualization.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\mavinject.exe'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the mavinject /INJECTRUNNING pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection and filter scoped to this host, so the parent/user distribution reflects how
    this specific firing pattern — mavinject with /INJECTRUNNING and a parent other than AppVClient.exe — has historically run
    here, not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' /INJECTRUNNING '
      filter:
        ParentImage: C:\Windows\System32\AppVClient.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the mavinject /INJECTRUNNING pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection and filter with no host scope, so the result is a fleet-wide count of this
    firing pattern rather than generic mavinject usage. Many hosts firing the same pattern points to scripted deployment or
    sanctioned tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' /INJECTRUNNING '
      filter:
        ParentImage: C:\Windows\System32\AppVClient.exe
      condition: selection and not filter
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' /INJECTRUNNING '
      filter:
        ParentImage: C:\Windows\System32\AppVClient.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' /INJECTRUNNING '
      filter:
        ParentImage: C:\Windows\System32\AppVClient.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of the alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar injection or staging activity on other hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: ' /INJECTRUNNING '
      filter:
        ParentImage: C:\Windows\System32\AppVClient.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or payload staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access, or initial-access
    activity — may reveal the attack stages that preceded the injection and help reconstruct the full timeline. Injection
    via a signed binary is often a mid-chain step rather than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
