name: Active Directory Structure Export Via Ldifde.EXE
id: 2f68f50d-f298-48f6-bddf-74029eebc710
description: |
  Detects ldifde.exe running with an output file flag (-f) and without the import flag (-i), the
  command-line structure used to bulk-export Active Directory objects (users, groups, computers, OUs, GPOs,
  ACLs) into an LDIF text file. Ldifde is a Microsoft-signed utility that ships on domain controllers
  and AD-management hosts, so legitimate admin or directory-migration work can produce this pattern;
  the same export is also a common reconnaissance step that stages a full directory dump for offline
  analysis ahead of credential access and lateral movement. The rule fires when the ldifde Image or
  OriginalFileName matches AND the command line contains -f AND it is not an import (-i); investigate
  whether the host, user, and exported scope are consistent with sanctioned directory administration.
type: detection
detection_id: 4f7a6757-ff79-46db-9687-66501a02d9ec
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did ldifde.exe run in export mode with the -f output flag and without an import (-i) switch?
  context: Confirm the alert is a true positive by reading the exact command line. The rule fires when
    ldifde (by Image or OriginalFileName) runs with -f present and -i absent. Verify the -f output path
    and that no -i appears, since -i would make this an import rather than an export.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to export Active Directory structure with ldifde.exe?
  context: Directory exports are routine for domain admins, identity-migration staff, and provisioning
    automation, and are expected on domain controllers and AD-management workstations. The same export
    from a workstation, server, or account with no directory-administration role is the deviation worth
    chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this ldifde command export? Decode the search base, filter, attributes, and output path.
  context: The full command line reveals the scope of the export. Decode -d (BaseDN search root), -r
    (LDAP filter such as "(objectClass=User)" or a broad "(objectClass=*)"), -p (Base / OneLevel /
    SubTree), -l (attribute whitelist), -s (target DC), and the -f output file path. A SubTree dump
    from the domain root or an objectClass=* filter indicates a bulk directory dump rather than a
    scoped administrative query.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned ldifde.exe, and is that parent chain expected for directory administration?
  context: The parent process reveals how the export was invoked. Interactive admin use typically traces
    to explorer.exe, a console host, or a management console. Parents such as web-server worker
    processes, wscript.exe, mshta.exe, or a remote-execution service point to operator-driven recon
    rather than sanctioned administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What LDIF output files did ldifde write on this host?
  context: This surfaces the actual files the export tool created rather than only the command-line
    arguments. An LDIF file written to a user-writable path such as %TEMP%, %PUBLIC%, or a user profile
    is more consistent with staging-for-collection than an export to an administrative working directory.
    The size and location of the output file indicate how much directory data was dumped and where it
    landed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was the export run with explicit credentials or pointed at a remote directory server?
  context: ldifde uses the running user's credentials by default, but -a (DN + password, simple bind)
    or -b (user + domain + password) supply arbitrary credentials, and -s targets a specific server
    rather than the local host. Explicit credentials or a remote -s target indicate the operator is
    reaching into the directory under a chosen identity, which is a stronger sign of deliberate
    reconnaissance than a local default-credential export.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Where was the LDIF output file written, and was it later compressed or moved?
  context: The -f flag names the output file; an export written to a user-writable path such as %TEMP%,
    %PUBLIC%, or a user profile is more consistent with staging-for-exfiltration than an export to an
    administrative working directory. Check whether the LDIF file was subsequently archived, copied, or
    moved toward a network or removable destination.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What processes ran after ldifde on this host that could archive or move the exported file?
  context: An export on its own stages data; the follow-on actions reveal intent. Archiving utilities
    (rar.exe, 7z.exe, makecab), copy operations, or upload tooling running shortly after the export
    suggest the directory dump is being prepared for or moved during exfiltration. The query anchors
    on those tool names and on command lines referencing an .ldf file; a renamed archiver will not
    match by image name, so also check any process whose command line touches the export path taken
    from the ldifde -f argument.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_archivers:
        Image|endswith:
        - '\rar.exe'
        - '\winrar.exe'
        - '\7z.exe'
        - '\7za.exe'
        - '\makecab.exe'
        - '\tar.exe'
      selection_movers:
        Image|endswith:
        - '\xcopy.exe'
        - '\robocopy.exe'
        - '\curl.exe'
        - '\bitsadmin.exe'
        - '\scp.exe'
        - '\pscp.exe'
      selection_ldf:
        CommandLine|contains: '.ldf'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldif:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cmd:
        CommandLine|contains: -f
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldif:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cmd:
        CommandLine|contains: -f
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts reveals whether the export is an isolated action
    or part of broader hands-on activity. The same user driving directory recon, credential access, or
    further enumeration on multiple hosts widens the likely scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldif:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cmd:
        CommandLine|contains: -f
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the export?
  context: Alerts rarely occur in isolation. Examining process activity around the export reveals what
    led to it and what followed, and whether it sits within a larger sequence. Look for reconnaissance,
    credential access, or staging that provides broader context for the export.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before the export?
  context: Directory enumeration usually sits mid-chain. Earlier detections on the same host — initial
    access, defense tampering, or other reconnaissance — may reveal the stages that preceded this export
    and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does this host normally run ldifde.exe?
  context: A binary that has never run on a host is more notable than one that runs regularly. ldifde is
    expected on domain controllers and AD-management hosts; zero or very low historical counts on a
    workstation or general-purpose server indicate first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this ldifde export pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even built-in tools can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent/user distribution reflects how the rule's specific firing pattern
    (not generic ldifde usage) has historically run here. A new parent process, an unexpected user
    account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldif:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cmd:
        CommandLine|contains: -f
      filter_import:
        CommandLine|contains: ' -i'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this ldifde export pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of the export pattern (not generic ldifde usage). Many hosts firing the same
    pattern points to scripted migration or vendor automation; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent/binary consistency to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_ldif:
      - Image|endswith: \ldifde.exe
      - OriginalFileName: ldifde.exe
      selection_cmd:
        CommandLine|contains: -f
      filter_import:
        CommandLine|contains: ' -i'
      condition: all of selection_* and not 1 of filter_*
    fields:
    - host.name
