name: New DLL Added to AppInit_DLLs Registry Key
id: 96302d2f-cdf0-4e98-acea-4cafcf48d471
description: |
  Detects a registry modification that lands on the AppInit_Dlls value under the Windows NT\CurrentVersion\Windows key —
  firing when either the modified value's own path (TargetObject) ends in \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls
  or a key rename produces a new name (NewName) ending there, in the native hive or in the 32-bit \SOFTWARE\Wow6432Node\
  view — while excluding writes whose value data is the literal (Empty), which is how the list is cleared rather than
  populated. Any DLL named in AppInit_DLLs is loaded by user32.dll into every process that links user32.dll, so one value
  write places the named module inside essentially every interactive process on the machine; the affected scope is the whole
  host, and the DLL path in the value data is the artifact to run down. Accessibility shims, input-method editors, and some
  endpoint-security products have historically registered here, so the identity and signer of the DLL carry the weight: the
  investigation should establish which DLL was registered and who published it, which process wrote the value and what
  launched that process, whether the DLL subsequently appeared as a library load across unrelated processes, and whether the
  mechanism is even active on this host — the loader ignores AppInit_DLLs entirely when Secure Boot is enabled or when
  LoadAppInit_DLLs is 0.
type: detection
detection_id: 4f84b697-c9ed-4420-8ab5-e09af5b2345d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting registry event land on the AppInit_Dlls value, and which of the rule's two branches fired?
  context: >-
    The rule fires when either the modified value's path (TargetObject) or the new name produced by a key rename (NewName)
    ends in \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Windows\AppInit_Dlls or its 32-bit \SOFTWARE\Wow6432Node\
    equivalent, and the value data is anything other than the literal (Empty). Note which branch fired, because the branch
    decides which downstream questions can be answered from telemetry: a TargetObject value write carries the registered DLL
    list in Details, so the value-decode, payload-on-disk, and library-load questions are all load-bearing, whereas the
    NewName rename branch carries no value data and the DLL list must be read off the host before those questions mean
    anything. Note also whether the path is the native hive or the Wow6432Node copy — the latter governs 32-bit processes
    only, so the affected process set is narrower. Details is populated on roughly 79% of endpoint registry modifications
    and is absent for binary or empty value data; if it is missing, read the value directly on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - NewName
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user or host expected to register a DLL for system-wide injection through AppInit_DLLs?
  context: >-
    This value is written by installers for a small set of products and essentially never by hand, so there is rarely a
    routine per-user explanation. Establish whether the account holds an administrative role (the key is under HKLM and
    requires it), whether the host was undergoing software installation or servicing, and whether the writing process
    belongs to a product the organization actually deploys. User attribution is present on roughly 94% of endpoint registry
    events; when it resolves to SYSTEM, a machine account, or is missing, pivot on the writing process instead. Read the
    signer columns for coherence with the key: a security or accessibility vendor registering its own DLL is
    self-consistent, while a general-purpose interpreter or utility writing an AppInit entry is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Was this registry change part of a documented deployment, change ticket, or maintenance window?
  context: >-
    A DLL registered for load into every user32-linked process is the kind of change that normally rides in with a software
    package rather than an ad-hoc action, so a matching deployment record or ticket is the fastest way to close the alert.
    Check whether any package was pushed to this host in the window, and whether the product named by the writing process's
    signer is one the organization licenses. The absence of a record for a change to a rarely-touched, machine-wide
    injection point supports treating it as unauthorized.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What launched the process that wrote the AppInit_DLLs value?
  context: >-
    The registry event names the writing process but not its origin. Looking that process up by its own identifier returns
    its command line and the parent that started it, which is what separates an installer or servicing chain from an
    interactive shell, script host, or document-spawned process. An msiexec.exe or vendor setup binary under a deployment
    framework points one way; reg.exe or a script interpreter under a browser, archive tool, or Office application points
    the other. Long-running parents can start days before the write, which is why the lookup window is wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the AppInit_DLLs writer spawn?
  context: >-
    A process that registers a system-wide injection DLL rarely stops there. Listing the children it launched shows whether
    the write was an isolated configuration change or one step in a longer chain — dropping the DLL, staging additional
    persistence, or running follow-on tooling. Note this shows what the writing process started, not what started alongside
    it, because registry telemetry does not record the writing process's own parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What was written to the AppInit_DLLs value, and why is this key a machine-wide injection point?
  context: >-
    AppInit_DLLs is read by user32.dll during its own initialization, so every DLL listed in the value is mapped into every
    process that links user32.dll — the interactive desktop, browsers, Office, shells, and most GUI services. That makes a
    single value write equivalent to injecting the named module across the host, with no Run key, service, or scheduled-task
    artifact to find. The value data and the writing process shown here define what would be injected and who planted it;
    judge the signer for coherence with the DLL being registered rather than treating a trusted signature as exculpatory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: Which DLL paths does the value data name, and do those locations look attacker-controlled?
  context: >-
    Read the Details field as a DLL path list — the value accepts several entries separated by spaces or commas, and each
    one is a separate module to run down. User-writable directories (AppData, Temp, ProgramData, Users\Public), UNC paths,
    short or random file names, and names that imitate system libraries while sitting outside System32 all point to a
    planted module, while a path inside a licensed product's own install directory is more consistent with a vendor shim.
    Historically legitimate registrants are limited to a small set of accessibility tools, input-method editors, and
    endpoint-security products, so a path outside that pattern deserves the DLL's signer and hash to be checked directly.
    Details is absent on roughly 21% of endpoint registry modifications; if it is empty here, read the value from the host
    to recover the configured paths.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - registry_event
  - manual_review
- question: Is the AppInit_DLLs mechanism actually enabled on this host, and were its control values also modified?
  context: >-
    Registering a DLL does nothing unless the mechanism is switched on. The loader honors AppInit_DLLs only when
    LoadAppInit_DLLs is 1, and it ignores the value entirely on any machine booted with Secure Boot enabled — check the
    host's Secure Boot state, since a fired-but-inert registration changes what the technique could achieve and what
    remediation is needed. RequireSignedAppInit_DLLs, when set to 1, restricts loading to code-signed modules, so a write
    turning it to 0 alongside the DLL registration indicates the actor clearing the way for an unsigned payload. This query
    covers both the native and Wow6432Node copies of those control values; a cluster of changes to them around the alert
    is a different picture from a lone value write onto a host where the mechanism was already on.
  range: -90d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|endswith:
          - '\Microsoft\Windows NT\CurrentVersion\Windows\LoadAppInit_DLLs'
          - '\Microsoft\Windows NT\CurrentVersion\Windows\RequireSignedAppInit_DLLs'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - asset_inventory
  - manual_review
- question: Was the registered DLL actually loaded, and what are its signer status and hash?
  context: >-
    An AppInit registration activates as a library load inside other processes — the module never appears as a process of
    its own, so library-load telemetry is the direct evidence that the injection took effect. A load event for the
    configured path carries the module's signer, signature status, and hash, which is where the verdict usually lands:
    unsigned, expired, distrusted, or a signer unrelated to the product that supposedly owns the DLL. If the value listed
    more than one DLL, run this lookup for each path in turn. If the value data was absent on the alert, review library
    loads on the host in the same window for modules outside System32 instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - external_threat_intel
- question: How many distinct processes loaded the registered DLL in the hours after the registry write, and which ones?
  context: >-
    The registration takes effect for each process the next time it links user32.dll, which on an interactive desktop is
    within seconds to minutes — so correlating the write with library loads over the following hours is what distinguishes
    a planted value from an active injection. The same module appearing under many unrelated processes (explorer.exe,
    browsers, Office applications, shells) is the technique working as intended and means every one of those processes is
    now carrying the module's code and must be treated accordingly. Loads confined to a single vendor's own processes point
    instead to that product's shim. Zero loads means the registration has not activated yet, or the mechanism is inert
    because Secure Boot is enabled or LoadAppInit_DLLs is 0.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Was the DLL named in the value written to disk in the same session, and is it still present?
  context: >-
    The registration only injects anything if a loadable DLL exists at the configured path, and the module commonly lands
    moments before or after the value is written. This query correlates file activity from the registry-writing process and
    its children — look for a file creation matching the path decoded from the value data. File-write events carry no hash;
    if the module is present, take its hash from a library-load event or retrieve the file for a reputation lookup. Note
    that value deletion is not observable in this telemetry, so judge whether the mechanism is still configured from the
    key's later modification history and from whether the module kept loading, not from the absence of a cleanup event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An actor who registers an AppInit DLL often makes several registry changes in one sitting — turning on the loader,
    relaxing the signing requirement, adding a Run key or service as a backup foothold, or disabling security tooling.
    Clusters of modifications from the same writing process within a short window show the full scope of the configuration
    change. The triggering key will appear in these results; the signal is what else was touched. If the host is
    registry-noisy, narrow to the alerting write's process or to the Run, Services, Policies, Winlogon, and IFEO paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The registry write rarely happens alone — a dropper staging the DLL, a script host driving the change, or hands-on
    follow-up typically executes in the same window. Aggregating by image and parent image collapses repetitive agent
    telemetry into high-count rows while novel low-count pairs stand out; scan those for loaders, archive extractors,
    script interpreters, and unfamiliar binaries. Because the technique injects into user32-linked processes, also watch
    for ordinary desktop applications spawning children they normally never launch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Has the AppInit_Dlls value been modified before on this host?
  context: >-
    This value changes only when a product that uses the mechanism is installed or updated, so on most hosts it should have
    no modification history at all, and zero prior events make the alerting write a first-touch event. If prior
    modifications exist, compare their value data and writing processes with the alerting one — a recurring identical write
    from a known installer suggests a product's normal servicing, while a new DLL path appended by a different writer
    indicates fresh tampering. Because value deletion is not observable in this telemetry, this history is also the best
    available read on whether the registration was later changed or removed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Was the AppInit_Dlls value modified on other hosts in the environment?
  context: >-
    The same modification across many hosts points to a group policy push, a software deployment, or a widely distributed
    implant, while a single-host write is more consistent with targeted activity. Compare the value data between hosts —
    identical DLL paths on many machines suggest one distribution mechanism and shift the question to what pushed it, while
    differing paths suggest independent tampering. A key that is routinely modified fleet-wide by a recognized installer is
    a very different baseline from one that has only ever changed on this machine.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Actors rarely rely on a single foothold. After registering an AppInit DLL they commonly add backup mechanisms through
    different techniques — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions — using tools such as
    schtasks, at, sc, reg, bitsadmin, or wmic. Several persistence installations inside the same window indicate deliberate
    stacking rather than an isolated administrative action, and each one needs its own remediation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence complements a registry registration without touching persistence tooling — dropping an
    executable or script into a Startup folder, or writing a task definition file directly, achieves execution at logon
    with no schtasks, sc, or reg invocation to detect. File-event monitoring captures these drops even when the actor
    avoids the standard utilities, so this check widens coverage beyond the detected registry change. Run-key persistence
    is a registry write rather than a file path and does not appear here; it surfaces in the registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial access, defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded this registration and help reconstruct the timeline. Persistence of this kind normally
    follows code execution and administrative access, since the key sits under HKLM, so a preceding privilege-escalation or
    execution alert indicates how the actor reached the point of writing it, and its absence raises the question of how
    they got there unobserved.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
