name: Potential System DLL Sideloading From Non System Locations
id: d67f7e92-4f0d-4f3d-88ae-bcc72b32e266
description: |
  Detects a DLL that normally resides only in Windows system directories (System32, SysWOW64, WinSxS, and similar) being loaded from a non-system location. The rule fires when the loaded module name matches one of a large allowlist of native system DLLs AND the load path is not one of the known-legitimate system, servicing, .NET, Defender, or vendor directories. Legitimately, some applications ship and load their own copies of these library names from their install folders; maliciously, an attacker plants a same-named DLL next to a trusted binary so the binary loads the attacker module instead of the real system one, hijacking the search order (T1574.001). Investigation should confirm the load path is genuinely non-system, review the module's signature and hash, identify the loading process and its parent, and determine whether the DLL was recently written to disk.
type: detection
detection_id: 4fc0deee-0057-4998-ab31-d24e46e0aba4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the loaded module match what this rule detects — a system DLL name loaded from a non-system path?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature
    status, and the process that loaded it. The rule matches when a native system DLL name (for example one that
    normally lives only under System32, SysWOW64, or WinSxS) loads from a path outside those directories and outside
    the known-legitimate servicing, .NET, Defender, and vendor exclusions. Note which specific DLL name fired and the
    exact directory it loaded from — the non-system directory is the load-bearing detail, and it carries the rest of
    the investigation. DLL loads carry a hash and signing status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: What modules did the loading process load, and which came from non-canonical or user-writable directories?
  context: >-
    The full set of modules a process loads shows whether this is an isolated hijack or a directory staged with
    several planted libraries. For a search-order hijack the key comparison is where the flagged DLL loaded from
    versus the system path that name normally resolves to: a system DLL name resolving out of the application's own
    directory, %TEMP%, AppData, ProgramData, or Public is the sideloading pattern. Look also for other unsigned
    modules in the same directory and for library names that this loading process does not normally pull in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the sideloaded module, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates an application loading its own bundled library from a planted malicious one. A
    genuinely Microsoft-signed DLL loaded from an unexpected location may still be benign, since some installers stage
    signed copies; an unsigned module carrying a system DLL name with no valid signature is a masquerading pattern.
    Watch SignatureStatus for Unsigned, Expired, Distrusted, or Invalid values, and pivot the Hashes value to
    threat intelligence to surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the loading process and what did it do — decode its command line and working directory?
  context: >-
    The library event names the loading process but not what it was doing. Its command line and current directory
    reveal whether this is a trusted binary running from its normal install path or a relocated copy running from a
    user-writable directory alongside the planted DLL. Relocating a signed binary to a folder the operator controls
    and launching it there is the common way to force a system DLL name to resolve to an attacker module.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading process, and is that parent chain expected?
  context: >-
    The parent process shows how the loader was launched. A relocated trusted binary started by explorer.exe after a
    user opened a folder, by an Office application, or by a script host such as wscript.exe or mshta.exe points to
    user-initiated or macro-driven execution rather than a normal service or installer path. An unexpected parent for
    an otherwise trusted binary is often where the sideloading was set in motion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the sideloaded DLL still on disk for analysis?
  context: >-
    If the planted DLL is still present in the non-system directory it can be hashed, submitted to a sandbox, or
    reviewed directly. This query correlates file writes to the loading process and its direct children; a DLL written
    into the same directory shortly before the load is the file-side half of the hijack. If the module has already
    been removed, capture its path and hash from the load event before it is cleaned up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is this user and host expected to load a system DLL from a non-system directory?
  context: >-
    Some applications legitimately ship their own copies of these library names and load them from their install
    folders, so the answer depends on what runs on this host. Knowing whether the loading process is an approved
    application on this host — and whether the user routinely runs software from the directory in question — is often
    the fastest way to separate a bundled-library false positive from a planted module.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Has this DLL been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this DLL from this location is a stronger anomaly than a recurring one. If the same module
    name has been loaded by the same process binary repeatedly over the past 90 days, the current load is probably
    routine bundled-library behavior. If this is the first occurrence, or the name has historically loaded only under
    different processes, the current load is anomalous and consistent with a newly planted module.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the loading process?
  context: >-
    A loading binary that has never been seen on this host is more suspicious than one that runs regularly. Zero or
    very low historical counts indicate first-time or rare execution, which is consistent with a trusted binary that
    was copied to a new directory to stage the hijack. A high, steady count points to an application that is a normal
    part of this host's software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Sideloading rarely stands alone. Examining process activity in a tight window around the load reveals what dropped
    or launched the loader and what ran afterward — a document or archive tool opening just before, a script host
    executing, or follow-on tooling. Correlating the file write, the module load, and surrounding execution within a
    short interval is how the planting and the hijack are tied together.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were DLL load-order registry locations modified on this host around the alert?
  context: >-
    Beyond planting a file next to a binary, DLL hijacking can be reinforced through registry-based load redirection —
    KnownDLLs, AppInit_DLLs, and AppCertDlls entries influence which libraries processes load and where from. A
    modification to one of these keys in the same time window as the flagged load indicates the redirection was set up
    or persisted through the registry rather than by file placement alone. Correlate any change here with the loading
    process and the planted module.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\KnownDLLs'
          - '\AppInit_DLLs'
          - '\AppCertDlls'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Is this DLL being loaded on other hosts, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces distribution. The same system DLL name loading from a non-system path on one host
    can be a localized incident; the same pattern across multiple hosts points to shared tooling or a staged
    deployment. Pay attention to the variety of loading processes — a single expected loader is closer to benign,
    while the same DLL loaded by different or unexpected processes elsewhere suggests the technique is spreading.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — user execution of a document or archive, deobfuscation activity,
    reconnaissance, or defense tampering — may reveal the stages that led to the DLL being planted. The alert timeline
    helps reconstruct how the sideloaded module arrived and what it was intended to launch.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a software install, update, or deployment on this host that would explain the loading application?
  context: >-
    A legitimate application update or deployment can place a signed binary and its bundled libraries in a new
    location and trigger this pattern. A corresponding change record or maintenance window for software on this host
    suggests authorized activity; the absence of one, for a binary running from a user-writable directory, moves the
    load toward a planted module.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this load align with normal work hours and maintenance windows?
  context: >-
    Legitimate software installs and updates that would relocate a binary and its libraries usually occur during
    business hours or scheduled maintenance. A trusted binary loading a system DLL from a non-system directory late at
    night or outside any deployment window is more consistent with attacker staging than with routine software
    activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Sideloading is often one foothold among several. After establishing execution through a hijacked DLL, operators
    commonly add backup persistence with different techniques — scheduled tasks, services, registry Run keys, or BITS
    jobs. Several persistence installations in the same timeframe indicate intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script into the Startup
    folder or a path referenced by a registry Run key achieves persistence without running scheduling or service
    tools. File-event monitoring captures these drops around the same window as the DLL plant even when standard
    persistence tools are avoided.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
