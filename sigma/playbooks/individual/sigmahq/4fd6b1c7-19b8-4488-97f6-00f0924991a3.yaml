name: PUA - NimScan Execution
id: 2257e323-fd5a-4699-b98e-44eaee630145
description: |
  Detects execution of NimScan, a fast Windows port scanner, by process image name or by known IMPHASH values tied to specific builds of the tool. Port scanners enumerate open ports and reachable services across hosts and subnets, which is normal during sanctioned vulnerability assessment or IT troubleshooting but is also a common early step in post-compromise network service discovery before lateral movement. The investigation should determine who ran the scanner, what address ranges and ports it targeted, whether the activity was authorized, and whether it sits alongside other reconnaissance on the same host.
type: detection
detection_id: 4fd6b1c7-19b8-4488-97f6-00f0924991a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the process image or hash match the NimScan port scanner this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the process image name ends in NimScan.exe or the process IMPHASH matches one of the known NimScan builds. Review the image path and hash on the alerting event against the detection criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is this user expected to run network port scanning tools?
  context: Network administrators, vulnerability-assessment staff, and IT troubleshooters legitimately run port scanners. Standard users and service accounts rarely have a reason to enumerate ports across the network. The user's role and typical toolset determine whether scanner execution is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Is NimScan on the organization's approved software list?
  context: Organizations typically sanction a specific set of scanning and assessment tools. NimScan is a third-party utility not bundled with Windows, so its presence may represent shadow IT, an authorized assessment, or attacker-deployed tooling. Unauthorized scanners should be checked regardless of who introduced them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an authorization, change ticket, or assessment window explaining this scan?
  context: Legitimate scanning usually correlates with a documented vulnerability assessment, a scheduled maintenance window, or an IT troubleshooting request. If no authorization context exists for this execution, the scan may be an attacker enumerating reachable services before lateral movement.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What hosts and ports did NimScan target? Decode the scan arguments from the command line.
  context: The full command line reveals the scan scope. NimScan takes a host, IP, or CIDR target followed by a port specification such as -p:1-65535 or -p:80,443,445, plus options for threads, timeout, and raw-socket scanning. Decode the target range and port list to understand whether this was a narrow service check or a broad subnet sweep.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned NimScan, and is this a normal launch pattern?
  context: A scanner launched from cmd.exe under explorer.exe (an interactive operator) reads differently from one spawned by a script interpreter, a WMI or WinRM provider host, or an Office application. An unusual parent points to automated post-exploitation enumeration rather than a hands-on administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What hosts and ports did the scanner actually reach during this activity?
  context: A port scanner generates a burst of outbound connection attempts to many destinations. The connection records show which addresses and ports were probed and whether any reachable service responded. A wide spread of destination IPs in a short window confirms network enumeration; concentration on a few internal services may indicate targeted reconnaissance toward specific assets.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What child processes did NimScan spawn afterward?
  context: A standalone port scanner has no legitimate reason to spawn child processes. Children such as cmd.exe, powershell.exe, or certutil.exe following the scan suggest the operator pivoted from discovery into execution or staging, and indicate the scan was one step in a larger sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession is a signature pattern of post-compromise enumeration. A port scan paired with net, nltest, nslookup, or arp activity in the same window points to an operator mapping the environment before moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Does this host normally run NimScan?
  context: A scanner that has never appeared on a host is more suspicious than one that runs on a regular cadence. Zero or very low historical counts over the trailing window indicate first-time or rare execution, which raises the priority of confirming authorization.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \NimScan.exe
      - Hashes|contains:
        - IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C
        - IMPHASH=B1B6ADACB172795480179EFD18A29549
        - IMPHASH=0D1F896DC7642AD8384F9042F30279C2
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \NimScan.exe
      - Hashes|contains:
        - IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C
        - IMPHASH=B1B6ADACB172795480179EFD18A29549
        - IMPHASH=0D1F896DC7642AD8384F9042F30279C2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the scan is isolated or part of broader hands-on activity. If the same user triggered related actions on multiple endpoints, the scope of the operation may extend beyond this host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \NimScan.exe
      - Hashes|contains:
        - IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C
        - IMPHASH=B1B6ADACB172795480179EFD18A29549
        - IMPHASH=0D1F896DC7642AD8384F9042F30279C2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even sanctioned scanning has a routine pattern. The query mirrors the rule's selection scoped to this host, so the resulting parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \NimScan.exe
      - Hashes|contains:
        - IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C
        - IMPHASH=B1B6ADACB172795480179EFD18A29549
        - IMPHASH=0D1F896DC7642AD8384F9042F30279C2
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Alerts rarely occur in isolation. Examining activity around the scan reveals the immediate context. What led to it, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs at low counts stand out against the high-count repetitive baseline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the scanner's firing pattern. Many hosts firing the same pattern points to a deployed assessment tool or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \NimScan.exe
      - Hashes|contains:
        - IMPHASH=41BB1C7571B3A724EB83A1D2B96DBB8C
        - IMPHASH=B1B6ADACB172795480179EFD18A29549
        - IMPHASH=0D1F896DC7642AD8384F9042F30279C2
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, credential access, or initial-access activity, may reveal the stages that preceded the scan and help reconstruct the timeline. Network service discovery typically follows an initial foothold, so prior alerts often explain how the operator arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
