name: Security Tools Keyword Lookup Via Findstr.EXE
id: 4cb9e36c-ac64-4e6c-b8a3-797a2923497e
description: |
  Detects find.exe or findstr.exe (by Image, OriginalFileName, or matching command line) run with a trailing
  keyword that names a common antivirus or EDR product (defender, kaspersky, sentinel, symantec, cylance, and
  similar). The rule fires only when both conditions hold: the binary is find/findstr AND the command line ends
  in one of the security-product keywords. This is a security-software-discovery pattern: an actor pipes the
  output of a process or service listing (tasklist, sc query, net start) into findstr to learn which protection
  agents are present before deciding whether to disable them or proceed quietly. Legitimate troubleshooting and
  scripted inventory can produce the same command line, so the investigation should establish who ran it, what
  spawned it, whether other discovery commands ran alongside it, and whether tampering or payload activity
  followed.
type: detection
detection_id: 4fe074b4-b833-4081-8f24-7dcfeca72b42
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this command line match the rule's pattern — find/findstr filtering on a security-product keyword?
  context: Confirm the alert is a true positive before investing further. The rule fires only when the binary is
    find.exe or findstr.exe (by Image or OriginalFileName) AND the command line ends in a security-product
    keyword such as defender, kaspersky, sentinel, symantec, or cylance. Read the full command line and the
    Image/OriginalFileName fields to verify both halves of the pattern are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: What was the full findstr command, and which security-product keyword and source listing did it filter?
  context: The trailing keyword (defender, kaspersky, sentinel, symantec, cylance, and similar) tells you which
    protection product the actor was probing for. The command piped into findstr — typically tasklist, sc query,
    or net start — reveals whether they were enumerating running processes or installed services. Read the
    surrounding command line to recover the source of the listing, since findstr only sees what was piped to it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the discovery command, and is this a normal pattern?
  context: Legitimate discovery is typically run from cmd.exe spawned by explorer.exe (a user opened a command
    prompt) or from an inventory script. find/findstr spawned by an unusual parent — a script interpreter
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, wsmprovhost.exe, or an Office application — points to
    automated post-exploitation enumeration rather than an interactive admin.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative discovery commands?
  context: IT staff and administrators legitimately run discovery commands for troubleshooting; standard users
    rarely enumerate installed security products. A security-tool keyword sweep from a standard user, a service
    account, or an account with no administrative role is the deviation worth chasing. Check the user's role and
    typical toolset against this activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command can be legitimate troubleshooting, but several reconnaissance commands in
    rapid succession — whoami, systeminfo, ipconfig, net user, netstat, tasklist — is a signature of
    post-compromise enumeration. Security-software discovery commonly sits inside a wider host-survey burst, so
    finding three or more distinct recon binaries within fifteen minutes shifts the disposition toward automated
    reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did find/findstr or its parent spawn afterward?
  context: Discovery commands themselves rarely spawn meaningful children, but the parent shell that ran this
    sweep often goes on to launch the next stage. Watch for download or execution tooling (powershell.exe,
    certutil.exe, curl.exe, bitsadmin.exe) or service/account-manipulation commands started on the host shortly
    after the keyword lookup, which would indicate the enumeration fed directly into action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run find or findstr?
  context: find.exe and findstr.exe are common utilities, so raw frequency is only a coarse signal — but a host
    that has essentially never run them over the prior ninety days makes this execution stand out. Use the
    historical count grouped by user to see whether the binary is part of routine activity here or a first-time
    appearance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and
    does the current alert fit?
  context: The query mirrors the rule's full selection — find/findstr filtering on a security-product keyword —
    scoped to this host, so the resulting parent and user distribution reflects how this specific pattern (not
    generic findstr usage) has run here before. A new parent process, an unexpected user account, or an unusual
    command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - ' avira'
        - ' avira"'
        - ' cb'
        - ' cb"'
        - ' cylance'
        - ' cylance"'
        - ' defender'
        - ' defender"'
        - ' kaspersky'
        - ' kaspersky"'
        - ' kes'
        - ' kes"'
        - ' mc'
        - ' mc"'
        - ' sec'
        - ' sec"'
        - ' sentinel'
        - ' sentinel"'
        - ' symantec'
        - ' symantec"'
        - ' virus'
        - ' virus"'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, returning a fleet-wide count of this
    specific keyword-lookup pattern rather than generic findstr usage. Many hosts firing the same pattern points
    to a script or inventory tool deployed across the environment; one host or a small unrelated set points to
    manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - ' avira'
        - ' avira"'
        - ' cb'
        - ' cb"'
        - ' cylance'
        - ' cylance"'
        - ' defender'
        - ' defender"'
        - ' kaspersky'
        - ' kaspersky"'
        - ' kes'
        - ' kes"'
        - ' mc'
        - ' mc"'
        - ' sec'
        - ' sec"'
        - ' sentinel'
        - ' sentinel"'
        - ' symantec'
        - ' symantec"'
        - ' virus'
        - ' virus"'
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - ' avira'
        - ' avira"'
        - ' cb'
        - ' cb"'
        - ' cylance'
        - ' cylance"'
        - ' defender'
        - ' defender"'
        - ' kaspersky'
        - ' kaspersky"'
        - ' kes'
        - ' kes"'
        - ' mc'
        - ' mc"'
        - ' sec'
        - ' sec"'
        - ' sentinel'
        - ' sentinel"'
        - ' symantec'
        - ' symantec"'
        - ' virus'
        - ' virus"'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - ' avira'
        - ' avira"'
        - ' cb'
        - ' cb"'
        - ' cylance'
        - ' cylance"'
        - ' defender'
        - ' defender"'
        - ' kaspersky'
        - ' kaspersky"'
        - ' kes'
        - ' kes"'
        - ' mc'
        - ' mc"'
        - ' sec'
        - ' sec"'
        - ' sentinel'
        - ' sentinel"'
        - ' symantec'
        - ' symantec"'
        - ' virus'
        - ' virus"'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals whether the security-tool
    sweep was isolated or part of broader hands-on activity. If the same user triggered similar discovery or
    execution on multiple endpoints, the scope of the activity is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \find.exe
        - \findstr.exe
      - OriginalFileName:
        - FIND.EXE
        - FINDSTR.EXE
      selection_cli:
        CommandLine|endswith:
        - ' avira'
        - ' avira"'
        - ' cb'
        - ' cb"'
        - ' cylance'
        - ' cylance"'
        - ' defender'
        - ' defender"'
        - ' kaspersky'
        - ' kaspersky"'
        - ' kes'
        - ' kes"'
        - ' mc'
        - ' mc"'
        - ' sec'
        - ' sec"'
        - ' sentinel'
        - ' sentinel"'
        - ' symantec'
        - ' symantec"'
        - ' virus'
        - ' virus"'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to the
    keyword lookup and what happened after — reconnaissance, privilege escalation, persistence installation, or
    payload staging. Aggregating by Image and ParentImage collapses repetitive agent noise while novel
    parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, additional reconnaissance, credential access
    — may reveal the attack stages that preceded this security-tool lookup and help reconstruct the timeline.
    Security-software discovery is often one step in a longer sequence, so prior alerts give it context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were security-product modules or agent binaries loaded or active on this host around the alert?
  context: Security-software discovery aims to learn which protection agents are present. Module-load telemetry
    independently confirms which AV/EDR products are actually running here, letting you judge whether the
    keyword the actor filtered on (defender, kaspersky, sentinel, symantec, cylance, and similar) corresponds to
    a real agent on the host and whether any protection module stopped loading shortly afterward. If image-load
    telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence
    nothing loaded.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_sec:
        ImageLoaded|contains:
          - 'MsMpEng'
          - 'MpClient'
          - 'Sense'
          - 'CSFalcon'
          - 'SentinelAgent'
          - 'cylance'
          - 'CyOptics'
          - 'symantec'
          - 'kaspersky'
          - 'avp'
          - 'mcafee'
          - 'CbDefense'
          - 'elastic-endpoint'
      condition: selection and selection_sec
    fields:
      - ImageLoaded
      - Image
