name: FileFix - Command Evidence in TypedPaths
id: be1691fc-fb95-4485-b44b-7574fdb471d8
description: |
  Detects a command string recorded in the most recent value (url1) of the Explorer TypedPaths registry key, the per-user history of paths typed into the File Explorer address bar. The rule fires only when that value contains both a URL marker ('#' and 'http') AND either a social-engineering keyword (captcha, verify, human, validation) or a command-interpreter token (powershell, cmd, curl, mshta, finger, regsvr32). A command rather than a filesystem path in TypedPaths is evidence that a user was lured into pasting an attacker-supplied one-liner into the address bar, the FileFix variant of the ClickFix pattern, which Explorer then executes. Investigation should decode the pasted command, confirm which interpreter Explorer spawned, and trace any dropped payload and outbound connection from that lineage.
type: detection
detection_id: 4fee3d51-8069-4a4c-a0f7-924fcaff2c70
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Does the TypedPaths url1 value hold a command string with a URL marker and an interpreter or lure keyword?
  context: Confirm the alert is a true positive by reviewing the exact key path (TargetObject) and the value data (Details) against the rule's criteria. A genuine match contains both '#' and 'http' AND either a social-engineering keyword (captcha, verify, human) or a command-interpreter token (powershell, cmd, curl, mshta, finger). A real filesystem path here is a false positive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user expected to type or paste commands into the File Explorer address bar?
  context: TypedPaths lives under the interactive user's HKCU hive, so the value is written by explorer.exe running as the person at the keyboard rather than a service account. Knowing whether that user routinely pastes commands (versus navigating to real folders) is often the fastest way to separate a benign address-bar entry from a pasted one-liner. If User resolves to a machine account, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command was pasted into the address bar and recorded in this value? Decode it.
  context: The Details field holds the raw string the user pasted. Decode it fully, the FileFix lure hides the real payload after a '#' comment padded with whitespace so the address bar visibly shows only a decoy file path. Look for interpreter invocations (powershell -enc, FromBase64String, IEX, DownloadString, Invoke-WebRequest), download utilities (curl, wget, bitsadmin, certutil), and the finger-to-cmd pipeline that turns finger.exe into a remote script-delivery channel.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Why is a command string in TypedPaths url1 significant rather than an ordinary navigation entry?
  context: TypedPaths\url1 is the most recent value in Explorer's address-bar history and normally records filesystem paths or URLs the user navigated to. It is not a persistence location. Its investigative weight comes from the fact that Explorer executes what is typed into the address bar, so a command interpreter recorded here means the interactive user ran an attacker one-liner directly from Explorer, not that a key was set for later autorun.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was the command value later overwritten, and did the pasted payload run?
  context: Because url1 always holds the single most recent entry, normal navigation overwrites it, so its absence later does not mean an attacker cleaned up. Registry value deletion is not independently observable here, so judge the outcome from the key's re-modification history over a longer window and, more importantly, from whether the configured payload actually executed rather than from whether the value still holds the command.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this TypedPaths value on this host previously held commands rather than paths?
  context: TypedPaths churns as the user navigates, so prior entries are expected, but they are normally real filesystem paths or URLs. A history that has only ever recorded folder paths and now shows a command interpreter with a URL marker is the anomaly. Compare the historical Details values to calibrate whether address-bar command entry is routine for this user or a first-time event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did explorer.exe spawn a command interpreter on this host right after the value was written?
  context: The decisive execution evidence for FileFix is a command interpreter launched by the address-bar action. Explorer executes the pasted string, spawning cmd.exe, powershell.exe, mshta.exe, or a download utility as a child. Confirming an interpreter started in the same window, and reading its full command line, tells you whether the paste actually ran and what it did.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\finger.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did the executing process write a payload to disk in a user-writable path?
  context: 'Pasted one-liners typically retrieve a second stage: the interpreter downloads a file into a user-writable directory (%USERPROFILE%\Downloads, %TEMP%, %APPDATA%, %PUBLIC%) and runs it, sometimes renaming a copied curl.exe to fetch an archive disguised as a document. Correlating file writes by the registry-writing process and its children reveals whether a payload was dropped in the same session and where it lives, enabling retrieval and deeper analysis.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did an interpreter on this host make an outbound connection to an external host to retrieve the next stage?
  context: The FileFix chain ends in first-run egress, the pasted interpreter reaches an external host to pull a payload (an archive disguised as a document, a script served over finger, or a direct download). Focus on connections to public, non-corporate destinations from the interpreter processes, and suppress known corporate update or CDN egress. A first-time outbound connection from cmd, powershell, curl, finger, or bitsadmin shortly after the address-bar write ties the paste to network retrieval.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\mshta.exe'
          - '\curl.exe'
          - '\finger.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What web page or message instructed the user to paste this command?
  context: FileFix begins with a lure, a phishing page pretexting that a file was shared and telling the user to open File Explorer, select the address bar, and paste a copied "file path" that is actually a command, or a benign-looking "verify you are human, press ENTER" prompt. Identifying the originating page or message from browser history and web-proxy records enables blocking the source and finding other recipients.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the same detection fire for other users or hosts?
  context: Copy-paste lures rarely target a single user. If one employee was steered into pasting a command, others in the same wave likely were too. Correlating this rule across the environment reveals campaign breadth and surfaces additional users who ran the same one-liner and need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other registry modifications occurred on this host in the same session?
  context: After the initial paste executes, follow-on stages often touch the registry, for example writing a Run key for persistence, disabling protections, or setting configuration. Reviewing the registry modifications on this host in the surrounding window, grouped by key path and writing process, shows whether the address-bar execution was a one-off or the opening move of a hands-on session.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: An address-bar execution rarely stands alone. Aggregating process activity in the surrounding window collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts, revealing reconnaissance, credential access, or additional payload stages that ran alongside the pasted command.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Was this TypedPaths value modified with a command on other hosts?
  context: The same command appearing in url1 across multiple hosts points to a broader lure wave rather than an isolated target. Comparing the Details values written to this key across hosts shows whether the same one-liner was pasted elsewhere and helps distinguish a coordinated campaign from a single affected user.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded the paste and help reconstruct the full timeline. The sequence of alerts on a host often tells the fuller story of how the activity unfolded.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
