name: UAC Bypass Using ChangePK and SLUI
id: 6acc556e-f0fc-4c1c-888e-b2585dd3bb2a
description: |
  Detects a UAC bypass in which the auto-elevated Windows Activation launcher (slui.exe)
  spawns changepk.exe at High or System integrity. slui.exe is Microsoft-signed and marked
  auto-elevating, so when it follows a user-controlled HKCU shell-handler key it launches the
  attacker's command with an elevated token and no consent prompt. Legitimate Windows Activation
  ("Change product key") can produce slui.exe spawning changepk.exe, but rarely at High integrity
  from a user-initiated, elevated context. The investigation should confirm the parent-child chain
  and integrity level, look for the HKCU registry hijack that set up the bypass, and identify what
  ran with elevated privileges afterward.
type: detection
detection_id: 503d581c-7df0-4bbe-b9be-5840c0ecc1fc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did slui.exe spawn changepk.exe at High or System integrity as the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires
    only when the parent Image ends in slui.exe, the child Image ends in changepk.exe, and the child
    runs at High, System, or the equivalent integrity SIDs. Review the full event to verify all three
    conditions held together.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - IntegrityLevel
- question: What started slui.exe, and is that origin consistent with legitimate Windows Activation?
  context: slui.exe is normally launched by the Windows Activation flow (the Settings "Change product
    key" path) under the user's interactive session. An auto-elevated slui.exe started from a script
    host, a command interpreter, or "start-process -verb runas" rather than the Activation UI is the
    deviation that distinguishes a deliberate bypass from a user changing their product key. Trace the
    grandparent to see what invoked slui.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to change the Windows product key or run elevation flows?
  context: Legitimate activation activity is rare and usually performed by IT during provisioning, not
    by ordinary users on production hosts. Knowing whether the user role and host function make a product
    key change plausible is often the fastest way to separate a routine activation from a privilege
    escalation attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other child processes did this slui.exe instance spawn?
  context: An auto-elevated slui.exe used to bypass UAC may spawn more than changepk.exe — the registry
    hijack can route slui to any attacker-chosen command, and changepk itself may launch a further child.
    Examining all children of the same parent instance reveals whether the elevated launch produced a
    command interpreter, script host, or other tool beyond the one that triggered the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does slui.exe normally spawn changepk.exe at elevated integrity on this host?
  context: A genuine activation flow does pair slui.exe with changepk.exe, but the High-integrity,
    user-triggered variant this rule detects should be rare or absent on a normal host. Zero or very low
    historical counts for this specific parent-child pairing indicate a novel elevation path rather than
    routine activation maintenance.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Was an HKCU shell-handler key created or modified on this host that would redirect slui.exe?
  context: This bypass works by planting a command under a user-writable HKCU shell-handler key that the
    auto-elevated launcher follows. The documented hijack paths are under
    HKCU\Software\Classes\launcher.Systemsettings\Shell and HKCU\Software\Classes\exefile\shell; these
    keys should never be populated on a normal user system. Finding the registry write confirms the bypass
    mechanism and reveals the payload that was set to run with elevated privileges.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - 'Software\Classes\launcher.Systemsettings\Shell'
          - 'Software\Classes\exefile\shell'
          - 'Software\Classes\Folder\shell\open\command'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection_host and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Were registry modifications made via reg.exe, cmd.exe, or PowerShell to set up this UAC bypass?
  context: Beyond direct registry events, the command interpreter that wrote the hijack key is often
    visible in process_creation. The detected variant uses an HKCU shell-handler key, but related UAC
    bypass families also target ms-settings, mscfile, exefile, and Folder shell keys. Finding the writing
    command line confirms the bypass mechanism and shows the exact payload set to execute at elevation.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What action was performed with elevated privileges after the UAC bypass?
  context: UAC bypass is a means to an end -- attackers elevate to install persistence, dump credentials,
    tamper with security tools, or access protected resources. Examining processes spawned at High or
    System integrity shortly after the bypass reveals the objective. Correlate by timing -- elevated
    children appearing within a short window of the slui-changepk chain are the load-bearing follow-on.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were other privilege escalation techniques attempted on this host?
  context: Attackers who attempt one UAC bypass often try multiple methods until one succeeds, especially
    if the OS version or configuration blocks certain techniques. Finding multiple bypass or escalation
    detections from the same user or process confirms deliberate privilege escalation activity rather than
    a false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \changepk.exe
        ParentImage|endswith: \slui.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \changepk.exe
        ParentImage|endswith: \slui.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar elevation activity on multiple hosts, the scope
    of compromise may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \changepk.exe
        ParentImage|endswith: \slui.exe
        IntegrityLevel:
        - High
        - System
        - S-1-16-16384
        - S-1-16-12288
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this
    event and what happened after. Look for reconnaissance, registry tampering, or persistence mechanisms
    that accompany the elevation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering,
    reconnaissance, credential access -- may reveal the attack stages that preceded the elevation and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
