name: Regsvr32 DLL Execution With Uncommon Extension
id: 05388eed-5bb1-44d3-acd2-f17d6db3ef3b
description: |
  Detects regsvr32.exe registering a module whose command line does not reference one of the
  conventional registration extensions (.dll, .ax, .cpl, .ocx, .ppl, .bav) and is not blank. The
  rule fires when the regsvr32 selection matches AND none of the legitimate-extension or
  blank-command-line filters match. Attackers rename payloads to unusual extensions to slip
  proxy-execution of arbitrary code past extension-based allowlists; the investigation should
  determine what module was registered, where it lives, what loaded or wrote it, and whether the
  invocation matches routine software registration on this host.
type: detection
detection_id: 50919691-7302-437f-8e10-1fe088afa145
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the regsvr32 command line register a module with an extension outside the common set?
  context: Confirm the alert is a true positive by reviewing the exact command line and process
    identity. The rule fires on regsvr32.exe (by image name or original file name) whose command
    line references a module extension that is not .dll, .ax, .cpl, .ocx, .ppl, or .bav, and is not
    blank. Verify the referenced module path and extension before investing further.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to register modules with regsvr32 from the command line?
  context: Legitimate installers and software updaters call regsvr32, but usually with conventional
    library extensions. Knowing whether this user role and host function normally involve direct
    command-line module registration is often the fastest way to separate a routine install from
    operator-driven proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What module did regsvr32 register, and what does the full command line reveal about the path and extension?
  context: The full command line names the module being registered. Read the file path, the
    extension that tripped the rule, and any switches such as /s (silent), /i (call DllInstall), or
    /u (unregister). A module under a user-writable or temporary directory, or one whose extension
    disguises a DLL, points away from routine software registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned regsvr32, and is that parent chain expected for module registration?
  context: The parent reveals how regsvr32 was invoked. Installers and update services
    (services.exe, msiexec.exe) are routine parents; document handlers, script hosts, or office
    applications such as mshta.exe, wscript.exe, or winword.exe spawning regsvr32 with an uncommon
    extension points toward exploitation or macro-driven execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run regsvr32 this way?
  context: A regsvr32 invocation pattern that has never been seen on a host is more suspicious than
    one that runs regularly. Zero or very low historical counts over the window indicate first-time
    or rare execution of this binary on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host previously fired this rule's pattern, what parents and users normally drove it, and does the current alert fit?
  context: Even routine tools get abused. The query mirrors the rule's selection and filter
    structure scoped to this host, so the resulting parent and user distribution reflects how the
    rule's specific firing pattern has historically run here, not generic regsvr32 usage. A new
    parent, an unexpected user account, or an unusual command-line structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      filter_main_legit_ext:
        CommandLine|contains:
        - .ax
        - .cpl
        - .dll
        - .ocx
      filter_optional_pascal:
        CommandLine|contains: .ppl
      filter_optional_avg:
        CommandLine|contains: .bav
      filter_main_null_4688:
        CommandLine: null
      filter_main_empty_4688:
        CommandLine: ''
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did regsvr32 spawn afterward?
  context: The processes spawned after registration reveal the module's actual impact. A registered
    DLL that proxies execution often leads to cmd.exe, powershell.exe, rundll32.exe, or network
    utilities. Unexpected children shortly after the registration point toward post-exploitation
    rather than a benign install.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      filter_main_legit_ext:
        CommandLine|contains:
        - .ax
        - .cpl
        - .dll
        - .ocx
      filter_optional_pascal:
        CommandLine|contains: .ppl
      filter_optional_avg:
        CommandLine|contains: .bav
      filter_main_null_4688:
        CommandLine: null
      filter_main_empty_4688:
        CommandLine: ''
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      filter_main_legit_ext:
        CommandLine|contains:
        - .ax
        - .cpl
        - .dll
        - .ocx
      filter_optional_pascal:
        CommandLine|contains: .ppl
      filter_optional_avg:
        CommandLine|contains: .bav
      filter_main_null_4688:
        CommandLine: null
      filter_main_empty_4688:
        CommandLine: ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user triggered similar registration or proxy-execution
    activity on multiple hosts, the scope of the activity may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      filter_main_legit_ext:
        CommandLine|contains:
        - .ax
        - .cpl
        - .dll
        - .ocx
      filter_optional_pascal:
        CommandLine|contains: .ppl
      filter_optional_avg:
        CommandLine|contains: .bav
      filter_main_null_4688:
        CommandLine: null
      filter_main_empty_4688:
        CommandLine: ''
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense
    tampering, reconnaissance, or initial-access artifacts, may reveal the stages that preceded the
    module registration and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What module did this host load from regsvr32 around the alert, and was it loaded from an unusual path?
  context: Hijacked execution flow shows up as a process loading a library from an abnormal path.
    Pivoting from the registration into image-load events for regsvr32 on this host surfaces the
    actual module that was loaded, its full path, and its signature status. A module loaded from a
    user-writable, temporary, or otherwise non-system directory is the file-path signal that
    separates proxy execution from a routine library registration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Were COM or service registry keys modified on this host around the alert that could redirect execution flow?
  context: Registering a module with regsvr32 writes COM class registration keys, and hijacked
    execution flow frequently rides on modified COM InprocServer32 entries, service binary paths, or
    persistence keys. Correlating registry modifications on this host within the alert window
    against the registration shows whether the module wired itself into an execution path that
    survives reboots or hijacks a legitimate component.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\InprocServer32'
          - '\LocalServer32'
          - '\CLSID\'
          - '\Services\'
          - '\CurrentVersion\Run'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one proxy-execution LOLBin often reach for several. If regsvr32 was
    used to run arbitrary code, check whether rundll32, mshta, msiexec, installutil, or similar
    binaries were also used to proxy execution. Multiple proxy-execution LOLBins performing the same
    objective strengthens the case for hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was regsvr32 executed from its expected system path?
  context: regsvr32 executed from outside System32 or SysWOW64 may indicate the binary was copied
    or renamed to evade path-based allowlists. A regsvr32.exe running from a user temp directory or
    an application folder is more suspicious than one in its standard system location. Compare the
    Image path against OriginalFileName to confirm identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired this regsvr32 pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used
    regularly under stable parents. The query mirrors the rule's selection and filter structure
    scoped to this host, so the count reflects the rule's specific firing pattern rather than
    generic regsvr32 usage. The command-line projection lets the analyst compare typical invocation
    patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \regsvr32.exe
      - OriginalFileName: REGSVR32.EXE
      filter_main_legit_ext:
        CommandLine|contains:
        - .ax
        - .cpl
        - .dll
        - .ocx
      filter_optional_pascal:
        CommandLine|contains: .ppl
      filter_optional_avg:
        CommandLine|contains: .bav
      filter_main_null_4688:
        CommandLine: null
      filter_main_empty_4688:
        CommandLine: ''
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing one foothold
    through module registration, they commonly install backups using scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations in the
    same timeframe indicate intentional stacking rather than an isolated install.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
