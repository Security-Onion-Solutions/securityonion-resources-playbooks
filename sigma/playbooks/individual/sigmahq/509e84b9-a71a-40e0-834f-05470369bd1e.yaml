name: Default RDP Port Changed to Non Standard Port
id: 6bd03521-2ea4-4646-803d-c151804799fa
description: |
  Detects a modification of the PortNumber value under the Terminal Server RDP-Tcp WinStation registry key to a value other than the default 3389 (DWORD 0x00000d3d). Changing this value relocates the RDP listener to a non-standard TCP port, which administrators occasionally do for hardening or policy reasons — usually through group policy or a documented change. The same change is used to move a remote-access channel off the well-known port so it evades port-based detection, and it is often paired with valid-account access. Investigation should decode the new port from the Details field, confirm the writing process and user, determine whether inbound RDP subsequently reached the host on that port, and establish whether the change was authorized.
type: detection
detection_id: 509e84b9-a71a-40e0-834f-05470369bd1e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-03
questions:
- question: Do the registry key and value data match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the PortNumber value under the Terminal Server RDP-Tcp WinStation key (TargetObject ending in \Control\Terminal Server\WinStations\RDP-Tcp\PortNumber) is set to a value other than the default 3389 (DWORD 0x00000d3d). Review the exact key path, the Details value, and the writing process against that criterion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change the RDP listening port?
  context: RDP port changes are typically an administrative or hardening action on servers and jump hosts, not workstations. Confirm the user role and host function are consistent with relocating the RDP listener. User attribution is present on roughly 94% of endpoint registry events; when the User is a machine account or SYSTEM, pivot on the writing process (Image) to attribute the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry key and value were modified, and does this location control the RDP listener?
  context: The PortNumber value under \Control\Terminal Server\WinStations\RDP-Tcp is the setting that determines which TCP port Remote Desktop Services listens on. A parallel value under \Control\Terminal Server\Wds\rdpwd\Tds\tcp\PortNumber governs the same behavior. Confirm the modified key is one of these RDP listener values, note the value data, and identify the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What TCP port was the RDP listener moved to? Decode the Details DWORD.
  context: The Details field carries the new port as a hex DWORD. Convert it to decimal to read the actual TCP port — 0x00000d3d is 3389 (the default), and any other value moves the listener. A non-standard port that is not part of a documented standard build is the load-bearing detail here, since it is the port on which remote access would now arrive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the non-standard port persist, or was the value later reverted?
  context: The listener stays on the non-standard port until the value is changed again, so persistence is judged from the key's re-modification history rather than a deletion event — endpoint telemetry emits no registry value-deletion records. A value that is set once and left in place keeps the alternate RDP channel open; a set-then-revert pattern (back to 0x00000d3d) is consistent with a short test or an operator restoring the default. Review who wrote each subsequent value.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: Relocating the RDP port is often one step among several — an operator establishing remote access may also enable Remote Desktop, adjust firewall rules, or set persistence keys in the same window. All registry modifications on the host, grouped by key path and writing process, reveal whether the port change landed alone or alongside other configuration changes from the same process or user.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the RDP PortNumber value been changed before on this host?
  context: A first-time change to the RDP listener port is more notable than a recurring one. Some hosts carry a non-default port as part of a standard build and will show a prior history at deployment time; a value that has never been touched and changes now points to a discrete action worth attributing. Compare the historical Details values and writing processes.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: After the change, did inbound connections reach this host on the new port?
  context: The port change only matters operationally if remote access actually used it. Decode the new port from the Details value, then look for ingress connections to the host and check whether any target that port. Inbound sessions on the relocated RDP port shortly after the registry change indicate the alternate channel was exercised; no inbound activity suggests the change was preparatory or benign configuration.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationPort
      - SourceIp
      - Initiated
- question: Was the RDP PortNumber value changed on other hosts in the environment?
  context: The same change across many hosts is consistent with a group policy rollout or a fleet-wide hardening standard; a change confined to this one host is more consistent with a targeted action. Compare the Details values across hosts — a common non-standard port set by the same process points to managed configuration, while divergent values point to ad hoc changes.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this registry value, and what started that process?
  context: The writing process and its own parent reveal how the change was made. A change pushed through reg.exe or powershell.exe launched from an interactive administrative session reads differently from the same edit made by a process spawned by a remote-execution tool, a script host, or an unexpected parent. Trace the writing process back to its origin to judge whether the execution chain is routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the change?
  context: Registry modifications rarely occur in isolation. Aggregating process activity around the alert shows what ran before and after the port change — reconnaissance, account manipulation, remote-access tooling, or firewall edits — and helps place the change in a larger sequence. Repetitive agent telemetry collapses into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this change?
  context: Earlier alerts on the same host — credential access, defense tampering, or reconnaissance — may reveal the stages that preceded the port change and help reconstruct the timeline. Relocating RDP off the default port frequently follows initial access and precedes the use of a valid-account remote session.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single foothold. An RDP port relocation intended as a durable access channel is often accompanied by scheduled tasks, services, or additional registry changes established as backups. Persistence-tool executions in the surrounding window indicate intentional stacking rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was there a change ticket or documented approval for relocating the RDP port?
  context: RDP port changes on managed hosts are usually planned network or hardening changes with a corresponding ticket or maintenance window. A matching approval suggests authorized activity; the absence of one where policy requires it suggests the change should be escalated. This check often closes or confirms the alert quickly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this method of changing the RDP port consistent with how your organization normally makes this change?
  context: Many organizations push RDP and firewall settings through group policy or a configuration-management tool rather than direct command-line edits. A hands-on reg.exe or PowerShell edit on a single host may indicate an operator bypassing normal tooling, or an administrator taking a shortcut. Understanding the standard procedure helps distinguish the two.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
