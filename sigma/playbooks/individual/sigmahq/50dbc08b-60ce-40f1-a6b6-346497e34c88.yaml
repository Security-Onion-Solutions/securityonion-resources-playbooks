name: Potential CVE-2023-36874 Exploitation - Fake Wermgr Execution
id: 14743ea2-2864-472a-96e7-39e1da4489d6
description: |
  Detects a process running from a path ending in \wermgr.exe whose OriginalFileName is Cmd.Exe,
  powershell.exe, or powershell_ise.EXE — a command interpreter copied or renamed to impersonate the
  Windows Error Reporting manager. Both conditions must hold, so the alert marks a binary whose
  compiled identity contradicts its filename. This masquerade is the payload step of CVE-2023-36874,
  a local privilege escalation against the Windows Error Reporting service, where the exploit plants
  a renamed interpreter along a redirected path so the privileged WER service launches it; the
  genuine wermgr.exe ships only from System32 and never reports an interpreter OriginalFileName.
  Investigation should establish where the impersonating binary lives and who wrote it, whether the
  resulting process gained privileges its parent did not hold, and what the interpreter did once it
  ran.
type: detection
detection_id: 50dbc08b-60ce-40f1-a6b6-346497e34c88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process run from a wermgr.exe path while reporting an OriginalFileName of Cmd.Exe, powershell.exe, or powershell_ise.EXE?
  context: >-
    The rule requires both halves at once, so confirm both on the event before investing further time.
    OriginalFileName comes from the compiled binary's version resource and survives a file rename, so a
    value of Cmd.Exe, powershell.exe, or powershell_ise.EXE on a file named wermgr.exe means an
    interpreter was copied to that name. Note the full Image path as well — the genuine wermgr.exe runs
    from System32, and a path outside it is the second half of the masquerade.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a copy of a command interpreter under the wermgr.exe filename?
  context: >-
    No supported administrative, packaging, or software-distribution workflow renames cmd.exe or
    powershell.exe to wermgr.exe, so there is rarely a benign owner to find. The realistic legitimate
    contexts are narrow and self-identifying — an exploitation or detection-engineering test on a lab
    host, or a red-team exercise. Establish whether this host is one of those before treating the
    account as the responsible actor.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What did the renamed interpreter actually execute — what were its full command line and working directory?
  context: >-
    The interpreter is the payload the exploit hands its privileges to, so its arguments describe the
    operator's objective. Decode any encoded or obfuscated content, resolve referenced file paths and
    URLs, and note whether the invocation is interactive (no arguments, an operator shell) or scripted.
    The working directory frequently points back at the staging folder the binary was launched from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Did the alerting process gain privileges or a logon identity beyond what the launching user already held?
  context: >-
    The point of CVE-2023-36874 is that a privileged service performs the launch, so the interpreter
    lands in a token the invoking user could not obtain directly. Event 4672 records sensitive
    privileges assigned to a new logon and 4624 records the logon itself with its type and account.
    Compare the account and privilege set around the alert against the user shown on the alerting
    process — an unprivileged user paired with a fresh SYSTEM or administrative logon in the same window
    is the escalation this rule exists to surface. If the Security channel is not collected in this
    environment, treat an empty result as a visibility gap rather than absence of escalation.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - LogonType
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: When was the file at this wermgr.exe path written to disk, and which process wrote it?
  context: >-
    The genuine wermgr.exe is serviced only by Windows update mechanisms into System32. A write to any
    other wermgr.exe path, or a recent rewrite of the System32 one, identifies the drop and names the
    writing process, which is usually the exploit binary itself. A write shortly before the alert points
    at staging for this execution; correlate the writing process by its ProcessGuid to recover its own
    command line and parentage.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \wermgr.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
  answer_sources:
  - file_event
  - process_creation
- question: What process launched the renamed interpreter, and is that parent a Windows Error Reporting component or something else?
  context: >-
    The parent separates the two explanations for this alert. A parent belonging to the error-reporting
    stack, or a service host running under SYSTEM, is consistent with a privileged service being tricked
    into launching the planted binary. An ordinary user-session parent — an unknown executable, a browser
    or mail client descendant, a script host — instead points at the exploit binary launching its own
    payload, and that parent's own image path and command line are the next thing to recover.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Are there recent file writes under C:\Users\Public or the Windows Error Reporting queue directory on this host?
  context: >-
    Exploitation of CVE-2023-36874 works by redirecting a filesystem path into a world-writable location
    and letting the error-reporting service follow the redirection, with activity in the report queue
    under C:\ProgramData\Microsoft\Windows\WER\ReportQueue acting as the trigger. Writes into
    C:\Users\Public paired with report-queue activity in the same window corroborate the exploit path
    rather than a stray renamed binary, and the writing process names the exploit component.
  range: -1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Users\Public\
          - \Microsoft\Windows\WER\ReportQueue\
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What child processes did the renamed interpreter spawn afterward?
  context: >-
    Privilege escalation is a means, not an end, so the children reveal what the elevated shell was for.
    Look for account manipulation, service or scheduled-task creation, credential access tooling,
    security-service tampering, and archive or transfer utilities. An interpreter that escalated and then
    spawned nothing may indicate a failed or interactive-only attempt, which is still worth confirming
    against the parent chain.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has any process run from this wermgr.exe path on this host before, and under which accounts?
  context: >-
    The genuine error-reporting manager runs routinely on most hosts, so a nonzero count is expected when
    the alerting path is the System32 one and tells you little on its own. Read the account column
    instead — the legitimate binary is driven by the service infrastructure and system accounts, so
    execution under an interactive user, or any history at all for a path outside System32, is the
    deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this host previously produced a wermgr.exe process with an interpreter OriginalFileName, and what parents and users drove it?
  context: >-
    This query mirrors the rule's own selection structure scoped to this host, so it counts prior
    occurrences of the masquerade itself rather than ordinary error-reporting activity. On a healthy host
    the expected answer is zero, which makes the alert a first occurrence and dates the intrusion.
    Repeated history instead points at a lab or test host, or at an exploitation attempt that has been
    running unnoticed — in which case the parent and user distribution shows how long and under whom.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - powershell_ise.EXE
        - powershell.exe
        Image|endswith: \wermgr.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This query mirrors the rule's selection structure scoped to this user, so it returns the user's
    90-day history of the masquerade specifically, aggregated by host. Weigh the count against the role.
    A user with no prior history is the ordinary case for exploitation, while a detection engineer or
    penetration tester with a trail of occurrences across lab hosts is a different explanation. Note that
    the account named on the event may be the escalation target rather than the operator.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - powershell_ise.EXE
        - powershell.exe
        Image|endswith: \wermgr.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the launch comes from a privileged service the user field names the token, not the operator, so
    the launch mechanism is the meaningful pivot. This query mirrors the rule's selection structure scoped
    to the alerting parent, giving the 90-day history of that parent producing this pattern, grouped by
    host. A parent that has never driven it before is the deviation worth chasing; a parent with a long
    trail across many hosts points at a recurring test harness rather than a single intrusion.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - powershell_ise.EXE
        - powershell.exe
        Image|endswith: \wermgr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts shows whether the escalation was a single-host event
    or one step in movement through the environment. Look for the same staging pattern reproduced
    elsewhere, remote execution utilities, and access to file shares. If the alert fired under SYSTEM or
    another service principal this view returns routine background telemetry and the parent-driven view
    of the same window is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    This query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide,
    within the alert window, which stays meaningful even when the alert fires under a service principal.
    Several hosts producing the masquerade at once points at a pushed or scheduled trigger and widens the
    incident; a single host points at a host-local exploitation attempt.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - powershell_ise.EXE
        - powershell.exe
        Image|endswith: \wermgr.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other tools ran on this host around the same time?
  context: >-
    Escalation sits between an initial foothold and whatever the access was obtained for, so the
    surrounding minutes usually carry both. Scan the aggregated list for reconnaissance utilities,
    unfamiliar binaries running from user-writable directories, and administrative tooling appearing on a
    host that does not normally see it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating by process and parent collapses routine background telemetry into a few high-count rows
    while novel parent-child pairs stand out at low counts. Those low-count pairs are what to scan — they
    show what led up to the escalation and what followed it, including persistence installation and
    further binaries launched from the same staging directory.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Have other hosts produced this same wermgr.exe masquerade in the past week, and how are those hosts distributed?
  context: >-
    This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the masquerade rather than of ordinary error-reporting activity. Because no supported
    software produces this pattern, any additional host is another affected system rather than a tuning
    candidate. A cluster of hosts appearing together suggests a repeatable exploit being run against a
    list of targets, or a sanctioned test; a single host confines the incident.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName:
        - Cmd.Exe
        - powershell_ise.EXE
        - powershell.exe
        Image|endswith: \wermgr.exe
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Local privilege escalation follows some form of initial access, so earlier detections on the same host
    often name it — a phishing payload, a remote-access session, or reconnaissance. Read the preceding
    alerts as a timeline to establish how the operator arrived on the host and what account they held
    before the escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
