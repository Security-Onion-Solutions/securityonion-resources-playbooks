name: Silenttrinity Stager Msbuild Activity
id: bd055d6c-1354-43b0-a981-6f36c5759533
description: |
  Detects msbuild.exe initiating an outbound network connection to port 80 or 443. MSBuild is a
  Microsoft-signed build tool that compiles and executes inline tasks embedded in project XML
  files, and SILENTTRINITY's msbuild stager uses exactly that path (T1127.001) — msbuild.exe is
  run against a small XML project whose inline code stages the implant inside the trusted
  msbuild process and calls back to command-and-control over standard web ports. Build hosts can
  produce legitimate msbuild egress during package restore, so the investigation should recover
  the project file passed to msbuild, characterize the destination, and look for in-process
  payload evidence such as unsigned module loads, dropped files, and follow-on child processes.
type: detection
detection_id: 50e54b8d-ad73-43f8-96a1-5191685b17a4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the destination, port, and initiating process match what this rule detects — msbuild.exe initiating an outbound connection on port 80 or 443?
  context: |
    Confirm the alert from the connection event. The rule fires only when all of its criteria
    match — the initiating image ends in msbuild.exe, the connection was initiated outbound by
    this host, and the destination port is 80 or 443. Standard web ports are chosen by C2
    frameworks precisely because they blend into normal traffic, so the port itself carries
    little signal either way; the process-to-destination pairing is what needs explaining.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
- question: Is this host a developer or build system where MSBuild execution is expected?
  context: |
    MSBuild runs routinely on developer workstations, build agents, and CI/CD infrastructure;
    on an ordinary user workstation or server it may never run. Even on a legitimate build
    host, direct internet egress from msbuild.exe has a narrow explanation — package restore
    against well-known registries — so a plausible build role explains the execution but the
    destination still has to fit that workflow.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command line launched this msbuild instance, and what project file did it build?
  context: |
    The project file argument decides the verdict. Stager invocations are typically a bare
    msbuild.exe followed by a single .xml or .csproj path — no build targets, configuration
    switches, or solution context — and the project file carries an inline task whose code is
    compiled and executed inside the msbuild process. A project path under a user-writable
    directory or a remote share, or Base64-like blobs in property values, fits the stager
    pattern; a repository working directory with normal build switches fits developer use.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned msbuild.exe, and is that parent chain expected?
  context: |
    Legitimate msbuild parents are developer shells, IDE processes, and CI/CD build agents —
    known orchestrators that run build tools on a schedule. A parent that is a script host,
    an Office application, an HTML application host, or explorer.exe following a user
    double-click points at a delivery chain rather than a build: stagers of this kind are
    commonly launched from a link or HTA payload running as a standard domain user. The
    parent's own command line shows what it was doing when it invoked msbuild.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was an MSBuild project file written to a user-writable path before the alert, and by what process?
  context: |
    The stager project file has to arrive before msbuild can run it. Project-file writes into
    user-writable staging paths — user profile directories, ProgramData, or the Windows temp
    directory — in the day before the alert surface the delivery process: a browser download, an
    archive extraction, or a script host writing the payload. Match the written path against the
    project file named in msbuild's command line to identify the dropper and pivot to it.
  range: -24h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - '.xml'
          - '.csproj'
          - '.proj'
        TargetFilename|contains:
          - '\Users\'
          - '\ProgramData\'
          - '\Windows\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What files did this msbuild process write, rename, or delete around the connection?
  context: |
    Inline-task execution normally produces compilation intermediates under the temp directory,
    and a genuine build writes outputs under the project's bin and obj directories. Executables,
    DLLs, or scripts written outside those locations are payload staging by code running inside
    msbuild, and deletions can be the stager cleaning up its own project file. The technique's
    chain — payload write, execution, and network egress — typically completes within 0–30
    minutes, which this window covers on both sides.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
- question: Did this msbuild process load modules that are unsigned or signed by a non-Microsoft publisher?
  context: |
    A normal msbuild run loads Microsoft-signed framework and build assemblies. An inline task
    is compiled on the fly and the resulting assembly is loaded from the temp directory —
    unsigned by construction — so an unsigned module loaded from a temp or user-writable path
    by msbuild is direct evidence the project executed embedded code. Module hashes are carried
    on the load event itself, so any non-Microsoft module found here can go straight to a
    reputation lookup.
  range: +/-15m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      filter_ms:
        Signature|contains: 'Microsoft'
      condition: selection and not filter_ms
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Were injection-related API calls recorded on this host around the alert?
  context: |
    A payload hosted inside msbuild.exe can migrate to or tamper with other processes using
    write-and-execute primitives, and the behavioral API telemetry records the injection side of
    that activity — WriteProcessMemory, QueueUserAPC, and SetWindowsHookEx calls. Read-side
    memory access produces no telemetry in this channel — in-memory credential extraction that
    reads another process's memory will not appear here — so an empty result narrows the
    possibilities but does not clear that activity.
  range: +/-30m
  answer_sources:
  - edr_console
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - 'WriteProcessMemory'
          - 'QueueUserAPC'
          - 'SetWindowsHookEx'
      condition: selection
    fields:
      - Image
      - process.Ext.api.name
- question: What child processes did msbuild.exe spawn afterward?
  context: |
    Code running inside msbuild can spawn interpreters and proxy-execution binaries for
    post-exploitation — powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, wscript.exe, and
    mshta.exe are the high-risk children to weigh first. No children is also common for this
    technique: the implant and its modules frequently run entirely inside the msbuild process,
    in which case the module-load, file, and API views carry the post-execution evidence
    instead.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What is the destination, and what do WHOIS, passive DNS, and threat intelligence reveal about it?
  context: |
    Because the connection rides standard web ports, the endpoint itself carries the verdict.
    Check the address's ownership and hosting profile, passive-DNS history, TLS certificate
    details, and threat-intelligence hits. Recently registered infrastructure, consumer VPS
    hosting, or self-signed certificates fit an attacker-operated listener; a well-known package
    registry or content-delivery range fits build tooling fetching dependencies. Weigh rarity of
    the destination across the environment alongside raw reputation.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Initiated
- question: Does this host normally communicate with this destination?
  context: |
    A first-time connection to this address is a stronger signal than one the host has made
    routinely for months. Recurring history at regular intervals traced to msbuild or another
    unexpected process suggests an established beacon; the same history traced to an updater or
    package manager suggests routine software traffic. The Image grouping shows which process
    owns the relationship.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding sequence —
    the delivery step before the fire, staged execution after it. Novel low-count pairs stand
    out against repetitive agent noise and help decide whether this was an isolated execution
    or one step in a longer chain; no single event here is decisive, so read this view together
    with the child-process, module-load, and file findings.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    A stager connection is rarely the first observable step. Earlier detections on the same
    host — link or HTA execution, script-host activity, suspicious downloads, or defense
    tampering — may capture the delivery of the project file that msbuild then executed, and
    help reconstruct the timeline from arrival to the outbound connection.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does this host normally run msbuild.exe?
  context: |
    Regular msbuild history under known developer or service accounts marks a build host, where
    this alert needs the destination explained but the execution itself is routine. Zero or
    near-zero history over 90 days makes this a first-time or rare execution on a host with no
    build role, which raises the weight of every other finding.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: How often has this host fired the msbuild web-egress pattern over the past 90 days, and what command lines drove it?
  context: |
    Build hosts whose restore traffic triggers this rule fire it regularly with stable
    command-line structure, and the aggregation makes that regularity visible. The query
    mirrors the rule's selection scoped to this host, so the count reflects msbuild-initiated
    connections to web ports specifically — not generic msbuild use. A first-ever fire, or a
    command line that breaks from the host's established structure, matters more than the raw
    count.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \msbuild.exe
      filter:
        DestinationPort:
        - 80
        - 443
        Initiated: 'true'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and filter) and _pb_scope
    fields:
    - CommandLine
- question: Was this msbuild binary executed from an expected path under its original name?
  context: |
    The genuine binary lives under the .NET Framework directories (C:\Windows\Microsoft.NET\
    Framework or Framework64) or a Visual Studio and Build Tools installation under Program
    Files. An msbuild.exe running from a user-writable path, or a differently-named image whose
    OriginalFileName is MSBuild.exe, means the tool was copied or renamed to evade path- and
    name-based controls, which has no legitimate build explanation.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: |
    Operators who proxy code execution through one trusted binary often use several — if
    msbuild ran a stager, the same host may show rundll32, regsvr32, mshta, installutil, or
    cmstp launching payloads in the same timeframe. Multiple proxy-execution binaries performing
    the same objective strengthens the case for hands-on activity over a one-off developer
    action.
  range: -24h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the msbuild web-egress pattern in the past week?
  context: |
    The query mirrors the rule's selection with no host scope, giving the fleet-wide count of
    the firing pattern. A build farm restoring packages fires consistently across the hosts
    that share that role; a single host, or a small set with no build role in common, points at
    targeted delivery. Compare destinations across firing hosts before dismissing a multi-host
    result as build automation.
  range: -7d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \msbuild.exe
      filter:
        DestinationPort:
        - 80
        - 443
        Initiated: 'true'
      condition: selection and filter
    fields:
    - host.name
