name: FlowCloud Registry Markers
id: 216a9700-7053-457c-bfa7-afc1648887e6
description: |
  Detects registry modifications whose key path contains one of the FlowCloud malware family's marker locations — any of
  three GUID-named keys under \HARDWARE\ or the \SYSTEM\Setup\PrintResponsor\ path, where the implant stores its
  configuration and the driver used by its keylogging component. These locations have no legitimate writer, so a match
  points to a FlowCloud component installing itself or updating its stored data on the host. Determine which marker path
  was written and by which process, whether related markers, component files, and persistence registrations landed in the
  same session, and whether follow-on component execution or a driver load occurred.
type: detection
detection_id: 5118765f-6657-4ddb-a487-d7bd673abbf1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the modified registry path match one of the FlowCloud marker locations this rule detects?
  context: The rule fires when the written key path contains any of three GUID-named markers under \HARDWARE\
    ({2DB80286-1784-48b5-A751-B6ED1F490303}, {804423C2-F490-4ac3-BFA5-13DEDE63A71A}, or
    {A5124AF5-DF23-49bf-B0ED-A18ED3DEA027}) or the \SYSTEM\Setup\PrintResponsor\ path. Confirm the triggering event's
    TargetObject contains one of these markers, and note which one matched — the PrintResponsor path holds the keylogger
    driver and configuration data, while the HARDWARE GUID keys serve as component state markers.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to run any software that writes to these registry locations?
  context: Neither Windows nor common third-party software writes GUID-named keys directly under \HARDWARE\ or values
    under \SYSTEM\Setup\PrintResponsor\, so there is no routine administrative activity that explains a match. Review the
    writing user and process — the user is present on most endpoint registry events but may be a machine account or SYSTEM
    for service-driven writes, in which case pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which FlowCloud marker location was written, and what does that location store?
  context: The marker that matched tells you what the implant was doing. Values under \SYSTEM\Setup\PrintResponsor\
    (typically numbered value names in the 2-4 range) store the keylogger driver and the malware's configuration data,
    so a write there means component or configuration staging. The three GUID-named HARDWARE keys act as installation
    and state markers for the implant's components. The writing process for either kind of write identifies which
    component on the host is active.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to the marker, and what does it contain?
  context: FlowCloud stores driver payloads and configuration blobs in these values. The Details field renders string
    data only and is typically absent for binary value data, so an empty Details on a marker path is still consistent
    with a component write rather than evidence of an empty value. Where Details is present, look for embedded file
    paths, encoded configuration, or command strings — any executable path found becomes a disk artifact to verify in
    the file-activity question.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were the marker keys re-written or updated after the initial modification?
  context: An active implant re-touches its configuration and state keys over time, while a one-shot write with no
    follow-up can mean a partial or failed installation. Key and value deletions are not directly observable in endpoint
    registry telemetry, so judge whether the markers persist from the re-modification history over the following day and
    from whether component execution or a driver load followed the write.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this marker, and what parent chain launched it?
  context: The writing process and its lineage show how the marker came to be written. Documented FlowCloud installations
    unpack components with a renamed copy of certutil.exe executing a dropped payload, and use a component extractor to
    install files and write the PrintResponsor values — so a writer launched by an oddly named copy of a system utility,
    an Office application, or a script host points to a fresh installation, while a long-running service writer points to
    an already-resident implant updating its data. Parent lineage may not always resolve on registry events; fall back to
    the writing process's own creation event on the host if the parent lookup returns nothing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because this event type does not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does the timing of this registry write align with expected activity on this host?
  context: Marker writes usually land minutes after the delivery chain runs, so the write time anchors the infection
    timeline. A write during an active user session points to user-triggered delivery (for example a document or
    download opened shortly before), while a write with no interactive session — overnight or at boot — points to an
    already-installed component re-registering itself or a service-driven stage. Correlate with logon activity and
    anything the user reports opening around that time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other registry modifications occurred on this host in the same window?
  context: The rule matched one marker path, but an installation writes several — the other HARDWARE GUID markers, the
    numbered PrintResponsor values, and commonly a service registration that starts the driver or client component.
    The aggregated view groups every registry write on the host in the window by key path and writing process; sibling
    markers and new service keys landing together corroborate a component installation rather than an isolated write.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the writing process or its children drop component files on disk, and are they still present?
  context: Documented installations place FlowCloud components under a subtree of C:\Windows\Media\ and stage renamed
    intermediate files, such as a text-named file that is actually an encoded payload later executed under a different
    name. This query correlates file activity by the registry-writing process and its children to surface those drops.
    The file-write events carry no hash — if a payload is present, hash it from a later execution event or retrieve the
    file for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did any process execute from the Windows Media directory this malware uses for staging?
  context: FlowCloud installs its components under C:\Windows\Media\, a directory that normally holds only sound files
    and should never be a process's executable path. Any execution from that directory in the hours around the marker
    write identifies the installed client component, and its command line and parent show whether the implant reached
    its execution stage. The window extends before the write because component files are staged ahead of the registry
    markers.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains: '\Windows\Media\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Were any kernel drivers loaded on this host in the hours around the registry write?
  context: The PrintResponsor values store a driver used by the malware's keylogging component, so a completed
    installation should produce a corresponding driver load near the marker write. Driver loads are low-volume events —
    review the list for drivers that are unsigned, oddly named, or new to this host, and hash-check anything unfamiliar
    against known-good driver inventories.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - Hashes
- question: Has the process that wrote the marker run on this host before?
  context: A writer binary first seen at the time of the alert supports a fresh infection, while a writer with long
    history on the host may be an already-resident implant component that has been active longer than this alert
    suggests. If the writer carries a well-known system binary name, verify its path, signature, and hash against the
    legitimate binary — documented installations execute renamed copies of system utilities from unusual paths.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this registry key path been modified before on this host?
  context: These marker paths have no legitimate writer, so zero prior history is the expected result for a new
    infection, and any earlier modification means the implant has been resident longer than this alert suggests.
    If history exists, compare the earlier writing processes and value data with the current event to establish when
    the host was first affected.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key path modified on other hosts in the environment?
  context: The same marker path written on multiple hosts means the same implant is installed elsewhere — a shared
    delivery wave or movement between systems. Compare the writing processes, value data, and timestamps across hosts
    to establish the order of installation, and treat every matching host as in scope for the same investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around the marker write hold the rest of the installation sequence. The aggregated parent-child
    view collapses repetitive agent noise into high-count rows so that novel low-count pairs stand out — extraction
    utilities, script hosts, renamed binaries, or service-control commands appearing once or twice in the window are
    the entries worth expanding.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Delivery-stage detections often precede a marker write — macro or script execution, renamed system utilities,
    encoded-payload decoding, or suspicious downloads. Earlier alerts on the same host reconstruct the stages that led
    to the installation and may identify the initial delivery vector.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other persistence mechanisms installed on this host around this activity?
  context: The registry markers indicate one persistence surface, but implants commonly register a service to start
    their driver or client component and may add backup mechanisms — scheduled tasks, additional services, or Run keys.
    Service-control activity (sc.exe) near the marker write is particularly relevant here because the stored driver
    needs a service registration to load. Grouped tool-plus-command rows show which mechanisms were touched in the
    window.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
