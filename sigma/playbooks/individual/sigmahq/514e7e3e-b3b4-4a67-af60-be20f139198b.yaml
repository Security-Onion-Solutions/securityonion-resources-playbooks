name: PUA - AdFind.EXE Execution
id: a80d5c7f-ef96-41d7-bc36-dd9edc398ce8
description: |
  Detects execution of AdFind.exe, a command-line Active Directory query tool that is frequently used for domain reconnaissance during intrusions. The rule fires when a process matches by image name ending in AdFind.exe, by an OriginalFileName of AdFind.exe, or by one of several known IMPHASH values - so a renamed copy of the binary still trips the hash and original-filename paths. AdFind itself is signed and has legitimate administrative uses, so the disposition turns on who ran it, from where, and what it queried: broad object sweeps (objectcategory filters), trust dumps, and security-descriptor dumps from non-IT user contexts indicate enumeration ahead of lateral movement, while a one-off run by a directory administrator is routine.
type: detection
detection_id: 514e7e3e-b3b4-4a67-af60-be20f139198b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did AdFind.exe execute here by image name, original filename, or known import hash?
  context: Confirm the alert is a true positive by reviewing the triggering event. The rule matches three ways - an image path ending in AdFind.exe, an OriginalFileName of AdFind.exe, or one of several known IMPHASH values - so note which path fired. A match on OriginalFileName or IMPHASH while the image name is something else means the binary was renamed, which is itself a signal worth carrying into the rest of the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Is AdFind.exe approved for use in this environment, and is the running user authorized to run it?
  context: AdFind is widely classified as a potentially unwanted application because of its heavy use in reconnaissance, but it is also a legitimate directory administration tool. Many environments restrict it to directory or IT administrators. A copy run by a standard user, or one not on the approved software list, should be treated as unsanctioned regardless of the binary's signature.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: What did this AdFind run actually query? Decode the command-line arguments.
  context: AdFind's arguments are the highest-signal part of the activity. Look for broad object sweeps such as -f "(objectcategory=person/computer/group/organizationalUnit)", trust dumps (-sc trustdmp, -gcb -sc trustdmp), security-descriptor dumps (-sc sddldmp, -sc getacl), DC enumeration (-sc dcdmp, -sc dclist), and output redirection to CSV or JSON. The query scopes to all AdFind runs on this host within the window because a single logical enumeration is often split across several invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the running image name match AdFind, or was the binary renamed to hide its identity?
  context: The rule matches on OriginalFileName and import hashes as well as image name, so a copy renamed to something innocuous still fires. Compare the image path against the original filename and hashes from the triggering event - a mismatch means the operator renamed the tool, which raises the likelihood of deliberate evasion rather than sanctioned administrative use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery tool may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession - net, nltest, dsquery, csvde, ldifde alongside AdFind - is a signature pattern of post-compromise domain enumeration. Three or more distinct recon binaries within fifteen minutes typically indicates automated reconnaissance rather than ad hoc administration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned AdFind, and is that parent chain normal?
  context: Legitimate discovery is typically run from cmd.exe or powershell.exe spawned by explorer.exe (an interactive admin session) or from a known automation script. AdFind spawned by an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or wsmprovhost.exe points to automated or remote post-exploitation enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run Active Directory enumeration tools?
  context: Directory administrators and IT staff legitimately query AD for inventory and troubleshooting. Standard users rarely need AdFind or equivalent LDAP enumeration. The user's role and normal toolset determine whether this run is routine administration or anomalous reconnaissance from an account that should not be enumerating the directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What directory or network endpoints did AdFind connect to from this host?
  context: AdFind binds and searches against LDAP directory servers, so its connections normally target domain controllers. Connections to a controller the host does not usually talk to, or to multiple controllers in sequence, suggest directory-wide enumeration. If network telemetry is not available for this host, fall back to the -h <DC> and base-DN flags in the decoded command line to identify what was targeted.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Does this host normally run AdFind.exe?
  context: A directory query tool that has never run on this host is more suspicious than one that runs regularly as part of a known administrative routine. Zero or very low historical counts over the baseline window indicate first-time or rare execution worth scrutinizing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched the rule's AdFind pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a tool with legitimate uses can be abused. The query mirrors the rule's selection scoped to this host, so the parent and user distribution reflects how the rule's specific firing pattern has historically run here. A new parent process, an unexpected user account, or an unusual launch pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \AdFind.exe
      - OriginalFileName: AdFind.exe
      - Hashes|contains:
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=bca5675746d13a1f246e2da3c2217492
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=53e117a96057eaf19c41380d0e87f1c2
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did AdFind spawn afterward?
  context: AdFind is a query tool and normally spawns nothing. Child processes such as cmd.exe, powershell.exe, or output handlers indicate the enumeration was wired into a larger script that staged or acted on the results. Unexpected children point to post-exploitation rather than a standalone administrative query.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts matched the rule's AdFind pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the rule's firing pattern. Many hosts firing the same pattern points to scripted deployment or a vendor inventory job; one host or a small unrelated set points to manual operator activity. Use the host spread to calibrate how concerning this run is.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \AdFind.exe
      - OriginalFileName: AdFind.exe
      - Hashes|contains:
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=bca5675746d13a1f246e2da3c2217492
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=53e117a96057eaf19c41380d0e87f1c2
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \AdFind.exe
      - OriginalFileName: AdFind.exe
      - Hashes|contains:
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=bca5675746d13a1f246e2da3c2217492
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=53e117a96057eaf19c41380d0e87f1c2
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \AdFind.exe
      - OriginalFileName: AdFind.exe
      - Hashes|contains:
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=bca5675746d13a1f246e2da3c2217492
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=53e117a96057eaf19c41380d0e87f1c2
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or enumeration spanning multiple endpoints. If the same user triggered directory queries or other activity on several hosts in this window, the scope of the operation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
      - Image|endswith: \AdFind.exe
      - OriginalFileName: AdFind.exe
      - Hashes|contains:
        - IMPHASH=d144de8117df2beceaba2201ad304764
        - IMPHASH=12ce1c0f3f5837ecc18a3782408fa975
        - IMPHASH=bca5675746d13a1f246e2da3c2217492
        - IMPHASH=4fbf3f084fbbb2470b80b2013134df35
        - IMPHASH=49b639b4acbecc49d72a01f357aa4930
        - IMPHASH=53e117a96057eaf19c41380d0e87f1c2
        - IMPHASH=680dad9e300346e05a85023965867201
        - IMPHASH=21aa085d54992511b9f115355e468782
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Reconnaissance rarely happens in isolation. Earlier detections on the same host - defense tampering, initial access, credential access - may reveal the attack stages that preceded the directory enumeration and help reconstruct the timeline. Domain enumeration commonly sits just before lateral movement, so prior alerts help place this run in sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
