name: Potential Windows Defender Tampering Via Wmic.EXE
id: bf323173-3a08-40b9-b56d-8812bdc05a2a
description: |
  Detects wmic.exe (matched by image name or PE OriginalFileName, so a renamed copy still triggers) invoked with
  a command line that targets the Defender WMI namespace - /Namespace:\\root\Microsoft\Windows\Defender. Both
  conditions must be present together: the wmic binary AND the Defender-namespace reference. The MSFT_MpPreference
  class under that namespace lets a caller add scan exclusions (ExclusionPath, ExclusionProcess, ExclusionExtension),
  disable real-time monitoring, or change reporting settings without the Defender UI. Legitimate administration and
  some endpoint-management tooling occasionally touch this namespace, but it is also a common way to blind Defender
  before dropping or running a payload, and on hosts without Tamper Protection the change succeeds silently. The
  investigation should determine which setting was changed, whether the control is still weakened, what ran after,
  and whether the change is attributable to a known administrative action.
type: detection
detection_id: 51cbac1e-eee3-4a90-b1b7-358efb81fa0a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show wmic targeting the Defender WMI namespace (/Namespace:\\root\Microsoft\Windows\Defender)?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both
    conditions hold together - the binary is wmic (by image name or PE OriginalFileName) AND the command line references
    the Defender WMI namespace /Namespace:\\root\Microsoft\Windows\Defender. Read the full command line and confirm both
    are present, then note what the WMIC verb is doing (a Get is a read/query; a call Add or set is a modification).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change Defender settings from the command line via WMIC?
  context: Legitimate administration, security tooling, and some endpoint-management agents can touch the Defender WMI
    namespace. Knowing whether the user role and host function are consistent with command-line Defender configuration is
    often the fastest path to separating a true positive from routine operations. A security administrator on a managed
    workstation is a different disposition than an ordinary user account, or a service principal, suddenly modifying
    Defender preferences.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Defender setting did this WMIC command change - an exclusion, real-time monitoring, or reporting?
  context: The full command line reveals the specific Defender preference targeted under MSFT_MpPreference. Parse the WMIC
    verb and arguments - call Add ExclusionPath, ExclusionProcess, or ExclusionExtension carves a hole in scanning;
    DisableRealtimeMonitoring turns off active protection; MAPSReporting or SubmitSamplesConsent changes cloud telemetry.
    The exact value being excluded (a directory, a process name, or a file extension) tells you what the operator wants
    Defender to ignore, which points at where a payload will land or run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: For any path or process named in the exclusion, what is at that location and is it legitimate?
  context: When the WMIC command adds an ExclusionPath or ExclusionProcess, the value is the location the operator wants
    Defender to stop scanning. Resolve the excluded path or process name on the host and inspect what is there - a script,
    an executable, a staging directory under a user profile, Temp, ProgramData, or Public. Check for obfuscation, encoded
    strings, embedded URLs, or known-bad indicators. An exclusion that points at an empty or not-yet-populated path is a
    pre-staging signal that a payload is about to be dropped there.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is a file present at the excluded path or process location for analysis?
  context: If the WMIC command excluded a path or process, checking whether a file already exists at that location enables
    deeper analysis - hash lookups, sandbox submission, or content review. Exclusions are frequently added before the
    payload is dropped, so absence does not clear the alert; it suggests the staging location to watch. Presence of an
    executable or script at an excluded path is a high-value artifact for confirming intent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the Defender exclusion or setting still in effect, or has it been reverted?
  context: The change may be temporary (added for a single action and removed) or persistent. Checking the current Defender
    configuration reveals whether the host remains weakened. If an exclusion is still present or real-time monitoring is
    still off, the control should be restored before further investigation. A get against MSFT_MpPreference, or the
    Defender UI/management console, shows the live exclusion and protection state to compare against the alerting command.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the Defender setting was changed?
  context: Operators weaken Defender for a reason - to drop or run a payload, dump credentials, or perform actions that
    would otherwise be blocked or flagged. Examining process creation in the window immediately after the exclusion was
    added reveals what the change was meant to enable. Activity originating from a newly excluded path, or execution that
    coincides with the exclusion, is the behavior the tampering was setting up.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: What process spawned wmic and is that parent chain expected?
  context: The parent process reveals how WMIC was invoked. Direct interactive use comes from an admin shell; scripted use
    comes from cmd.exe or a script host. An auto-elevating system binary or an unexpected parent - for example a process
    that consumes a registry shell hijack to run an elevated command without a consent prompt - points at a UAC-bypass
    primitive being used to apply the Defender change with an elevated token. Walk up the tree to see what launched the
    parent and what else it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who weaken one control often weaken several - adding a Defender exclusion AND clearing logs AND
    deleting shadow copies AND stopping security services creates maximum coverage. Multiple tampering events from the same
    user or parent process indicate several controls were targeted in one operation rather than an isolated administrative
    tweak. Look for clustered tampering tooling beyond the single WMIC command that fired this alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did wmic make any outbound network connections around the time of the alert?
  context: WMIC can execute against a remote host (for example via a /Node argument), in which case the local process opens
    a network connection to the target over the WMI/DCOM port range. Outbound connections from wmic to another host
    indicate the Defender change may have been pushed remotely or that the same operator is reaching other endpoints. No
    connection is consistent with a purely local Defender modification on this host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \WMIC.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did WMI operational events record provider activity correlated with this command?
  context: >-
    WMIC running a class method makes the WMI service start the backing provider, which the
    WMI-Activity operational channel records as event 5857 with the provider name and the
    wmiprvse.exe host process - independent of the process_creation event. A provider start in
    this window corroborates that the MSFT_MpPreference operation actually executed and can
    surface WMI activity that did not come through a visible wmic.exe process; read
    winlog.user_data.ProviderName, winlog.user_data.HostProcess, and the message narrative. If
    WMI operational logging is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID: 5857
      condition: selection
    fields:
      - winlog.user_data.ProviderName
      - winlog.user_data.HostProcess
      - message
- question: Were any other proxy-execution or persistence LOLBins used on this host recently?
  context: Operators who use one LOLBin often use several - if WMIC was used to weaken Defender, check whether other
    living-off-the-land binaries were used to execute code or establish a foothold in the same timeframe. Finding multiple
    LOLBins in sequence strengthens the case for hands-on-keyboard activity rather than a one-off administrative command.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\mavinject.exe'
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was wmic executed from its expected System32 or SysWOW64 path?
  context: WMIC executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or
    renamed to evade path-based allowlists. The genuine utility lives at C:\Windows\System32\wbem\WMIC.exe or the
    SysWOW64 equivalent; a copy running from a user's temp directory, Downloads, or AppData is more suspicious than one in
    the standard location. Compare the Image path against the embedded OriginalFileName, since the rule matches a renamed
    copy on either field.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: When this host has previously fired the rule's WMIC-Defender pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine administration can touch the Defender namespace. The query mirrors the rule's selection structure
    scoped to this host - the resulting parent and user distribution reflects how the rule's specific firing pattern (not
    generic WMIC usage) has historically run here. Deviations - a new parent process, an unexpected user account, an
    unusual command-line structure - are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: How often has this host fired the rule's WMIC-Defender pattern over the past 90 days, and what command-line structures are typical?
  context: A WMIC-Defender pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the
    rule's specific firing pattern (not generic WMIC usage). The CommandLine projection lets the analyst compare typical
    invocation patterns against the alerting one - a recurring management Get reads very differently from a first-ever call
    Add ExclusionPath.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains: /Namespace:\\\\root\\Microsoft\\Windows\\Defender
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, privilege escalation,
    an initial-access exploit, or other defense tampering - may reveal the attack stages that preceded this Defender
    change and help reconstruct the timeline. A Defender exclusion following an exploitation or elevation alert reads very
    differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
