- question: Is the installed softphone version one of the trojanized builds?
  context: >-
    The compromised Windows installers correspond to desktop-app versions 18.12.407 and
    18.12.416. Confirm the installed version from software inventory or the application's
    install metadata; a host on an unaffected version showing this network pattern needs
    re-examination of which process actually made the connection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  - edr_console
