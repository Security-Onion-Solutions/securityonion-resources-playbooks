name: Potential Compromised 3CXDesktopApp Beaconing Activity - Netcon
id: 86a6d32d-1875-4889-bca2-74c55c85ac63
description: |
  Detects network connections from 3CXDesktopApp.exe to domains associated with the trojanized
  3CX desktop softphone supply-chain compromise, in which signed vendor installers delivered a
  tampered media library (ffmpeg.dll) that beacons to actor-controlled infrastructure and can
  retrieve second-stage payloads. The listed domains imitate legitimate CDN, cloud-storage, and
  PBX-service names but served as dedicated command-and-control endpoints, so legitimate traffic
  to them is unlikely. The investigation should confirm the initiating process and destination,
  establish when the compromised build was installed, review DNS resolutions and DLL loads on
  the host, and determine how many other hosts run the softphone or reached the same
  infrastructure.
type: detection
detection_id: 51eecf75-d069-43c7-9ea2-63f75499edd4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting connection show 3CXDesktopApp.exe reaching one of the domains listed in the rule?
  context: >-
    Confirm the alert by reviewing the destination host name and IP, the port and direction, and
    the initiating process image against the rule's domain list. If the event came from
    network-level telemetry rather than endpoint telemetry, process fields may be absent — anchor
    on the destination IP and pivot to endpoint events on this host for process attribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - DestinationHostname
  answer_sources:
  - alert
  - network_connection
- question: Is the 3CX desktop softphone expected on this host?
  context: >-
    The softphone is legitimate business software, so its presence is unremarkable in
    environments that use 3CX for telephony. Establish whether this host belongs to a user or
    team that uses the phone system — an unexpected install widens the investigation from a
    compromised vendor update to a deliberately placed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Where is the alerting 3CXDesktopApp.exe installed and how was it launched?
  context: >-
    The process-creation event for the alerting process reveals the full image path, launch
    arguments, and working directory. A standard install lives under the vendor's program
    directory or the user's local application data; an unusual path or launch argument points to
    a manually placed copy rather than a vendor-installed build. The softphone typically starts
    at logon, so the creation event may predate the network alert by hours or days.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What do DNS history, registration data, and threat intelligence show for this destination?
  context: >-
    The rule's domains imitate CDN, cloud-storage, and PBX-service names while functioning as
    command-and-control endpoints for the compromised softphone. Retrieve the connection details,
    then check passive DNS, registration age, and TLS certificate details for the resolved
    infrastructure to confirm the destination belongs to the known malicious set rather than a
    coincidental name overlap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Did this host issue DNS lookups for the domains listed in the rule, and how often?
  context: >-
    The beacon re-resolves its command-and-control domains, so lookup counts approximate
    check-in behavior over time. Repeated queries across days indicate an established beacon
    rather than a one-off connection, and the earliest lookup bounds when the compromise became
    active on this host. Domain questions are anchored on the DNS lookup because the connection
    event itself rarely carries a host name.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - akamaicontainer.com
        - akamaitechcloudservices.com
        - azuredeploystore.com
        - azureonlinecloud.com
        - azureonlinestorage.com
        - dunamistrd.com
        - glcloudservice.com
        - journalide.org
        - msedgepackageinfo.com
        - msstorageazure.com
        - msstorageboxes.com
        - officeaddons.com
        - officestoragebox.com
        - pbxcloudeservices.com
        - pbxphonenetwork.com
        - pbxsources.com
        - qwepoi123098.com
        - sbmsa.wiki
        - sourceslabs.com
        - visualstudiofactory.com
        - zacharryblogs.com
      condition: selection
    fields:
      - QueryName
      - Image
  answer_sources:
  - network_connection
- question: What process spawned the softphone and is that parent chain expected?
  context: >-
    A user-launched softphone normally descends from explorer.exe or the vendor's updater. A
    scripting host, an installer running from a temporary directory, or a remote-administration
    parent suggests the binary arrived outside the normal update channel. If the parent
    identifier is absent on the network event, read the parent image from the process-creation
    event of the alerting process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the softphone spawn afterward?
  context: >-
    The compromised application can retrieve second-stage payloads and has been observed
    preceding interactive operator activity. Command interpreters, script hosts, or download
    utilities spawned by the softphone are the follow-on to chase — a legitimate softphone rarely
    launches anything beyond its own helper processes. The window extends a full day because
    staged payload delivery can lag the first beacon.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which DLLs did the softphone process load, and do any show unexpected signature status?
  context: >-
    The compromise is carried by a tampered ffmpeg.dll sideloaded by the signed application, so
    the loaded-module list is where the malicious component is visible. Review the media and
    helper libraries loaded from the application directory, compare signature status across
    modules, and check the hash of any anomalous DLL against reputation sources — module-load
    events carry the file hash directly.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
  answer_sources:
  - external_threat_intel
  - manual_review
- question: What does the softphone's full outbound connection history from this host look like?
  context: >-
    Aggregating every outbound connection from the process surfaces the rest of the beacon
    infrastructure and any payload-staging endpoints beyond the domain that fired this alert.
    Compare the destination set against the vendor's legitimate service endpoints; repeated,
    evenly sized counts to a small set of unfamiliar external addresses are consistent with
    timed check-ins.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: Does this host normally communicate with this destination?
  context: >-
    First-time connections to a destination read differently from routine traffic. The rule's
    domains were registered for this operation, so any established history on this host most
    likely marks how long the compromised build has been beaconing rather than legitimate use —
    note the earliest occurrence.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
  - dns_query
- question: Does this host normally run 3CXDesktopApp.exe?
  context: >-
    A long execution history is expected where the softphone is legitimately installed, and it
    does not clear the alert — the compromise shipped inside the vendor's own signed updates.
    What the history establishes is the install timeline; a first appearance shortly before the
    beaconing began marks the update or install that introduced the tampered build.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the program and user
    distribution reflects prior fires of the exact softphone-to-listed-domain pattern. For a
    supply-chain beacon, prior fires chiefly extend the compromise window backward — note the
    earliest occurrence and whether the driving user account changed over time; network events
    carry no parent lineage, so pivot to the 3CXDesktopApp.exe start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp.exe
        DestinationHostname|contains:
        - akamaicontainer.com
        - akamaitechcloudservices.com
        - azuredeploystore.com
        - azureonlinecloud.com
        - azureonlinestorage.com
        - dunamistrd.com
        - glcloudservice.com
        - journalide.org
        - msedgepackageinfo.com
        - msstorageazure.com
        - msstorageboxes.com
        - officeaddons.com
        - officestoragebox.com
        - pbxcloudeservices.com
        - pbxphonenetwork.com
        - pbxsources.com
        - qwepoi123098.com
        - sbmsa.wiki
        - sourceslabs.com
        - visualstudiofactory.com
        - zacharryblogs.com
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
  answer_sources:
  - network_connection
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Beaconing that transitions to interactive operation shows up as new process activity near
    the check-ins. The aggregation collapses repetitive agent noise into high-count rows; novel
    parent-child pairs at low counts are what to scan for — reconnaissance commands,
    credential-access utilities, or archiving tools around the alert window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct the sequence — installer or updater
    activity, module-load detections on the softphone, or unrelated alerts that suggest a second
    access path. The alert timeline places this beacon within the host's recent history.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Which other hosts resolved the domains listed in the rule?
  context: >-
    Every host running the compromised build beacons to the same infrastructure, so DNS
    resolution across the fleet approximates the set of affected installs — including hosts
    whose connection events lack process attribution. Cross-check the resulting host list
    against the softphone install base to scope remediation.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith:
        - akamaicontainer.com
        - akamaitechcloudservices.com
        - azuredeploystore.com
        - azureonlinecloud.com
        - azureonlinestorage.com
        - dunamistrd.com
        - glcloudservice.com
        - journalide.org
        - msedgepackageinfo.com
        - msstorageazure.com
        - msstorageboxes.com
        - officeaddons.com
        - officestoragebox.com
        - pbxcloudeservices.com
        - pbxphonenetwork.com
        - pbxsources.com
        - qwepoi123098.com
        - sbmsa.wiki
        - sourceslabs.com
        - visualstudiofactory.com
        - zacharryblogs.com
      condition: selection
    fields:
      - host.name
  answer_sources:
  - network_connection
  - asset_inventory
- question: Have other hosts fired this rule's pattern in the past week?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the
    exact firing pattern. Because the compromise arrived through the vendor's update channel,
    every host on an affected build is expected to beacon — a multi-host result scopes the
    remediation effort, while a single host may simply be the first to check in. The connection
    event's host-name field is sparsely populated, so treat the fleet-wide DNS-resolution
    question as the more complete census.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith: \3CXDesktopApp.exe
        DestinationHostname|contains:
        - akamaicontainer.com
        - akamaitechcloudservices.com
        - azuredeploystore.com
        - azureonlinecloud.com
        - azureonlinestorage.com
        - dunamistrd.com
        - glcloudservice.com
        - journalide.org
        - msedgepackageinfo.com
        - msstorageazure.com
        - msstorageboxes.com
        - officeaddons.com
        - officestoragebox.com
        - pbxcloudeservices.com
        - pbxphonenetwork.com
        - pbxsources.com
        - qwepoi123098.com
        - sbmsa.wiki
        - sourceslabs.com
        - visualstudiofactory.com
        - zacharryblogs.com
      condition: selection
    fields:
