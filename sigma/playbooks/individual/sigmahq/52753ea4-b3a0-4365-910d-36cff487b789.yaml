name: Hijack Legit RDP Session to Move Laterally
id: aa8cf86e-140a-4560-beae-4c32f9ec9616
description: |
  Fires when a file event shows the Windows Remote Desktop client (mstsc.exe) writing a file into the
  current user's Start Menu Startup folder on the machine where the client itself runs. mstsc.exe touches
  local disk on behalf of the redirected-drive channel, so a write here means content arriving from the far
  side of an RDP session through the tsclient share and landing in a path that runs automatically at the next
  logon — the session's remote end reaching back onto the client. Determine what file was written, which
  remote endpoint the session was connected to, whether the session and its drive redirection were expected,
  and whether the written file has since executed.
type: detection
detection_id: 52753ea4-b3a0-4365-910d-36cff487b789
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did the remote desktop client write this file into the user's Start Menu Startup folder?
  context: >-
    Confirm the alert before investing time. The rule requires both halves together: the writing process must
    be mstsc.exe and the destination path must fall under the per-user Startup folder. Check the exact path,
    the operation performed (created, modified, renamed), and that the responsible process is the RDP client
    rather than a shell or installer that happens to touch the same folder.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Which local account's remote desktop client wrote this file, and does that account identify who drove the write?
  context: >-
    The User on this event is the identity mstsc.exe runs as on this machine — the person who opened the RDP
    session, not necessarily the party that produced the file. Content delivered over the redirected drive is
    written by the local client process on behalf of whatever is acting on the far end of the session, so this
    account attributes the channel and not the action. Read it to establish whose session was used, then judge
    the host and account: is this a machine and user for whom outbound RDP is routine at all?
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file still in the Startup folder, or was it deleted or renamed after the alert?
  context: >-
    A file left in Startup runs at the next interactive logon, so its presence sets both the urgency and the
    containment step. A file still on disk can be retrieved, hashed, and analyzed; one removed shortly after
    it appeared points to a staging or cleanup step and moves the investigation to what ran in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is outbound RDP with drive redirection enabled an approved configuration for this host and user?
  context: >-
    mstsc.exe ships with Windows, so the authorization question is not about the binary but about the session
    settings. Drive redirection maps this machine's local drives into the remote session and is what makes a
    write back onto this filesystem possible at all; many environments disable it by policy on standard
    endpoints and permit it only for specific administrative or support workflows. Check whether redirection
    is expected here and whether this account is meant to open RDP sessions outbound.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is there a support ticket, maintenance window, or user request explaining this RDP session?
  context: >-
    A remote desktop session from a workstation usually has a reason attached to it — a support engagement, a
    jump to a managed server, or scheduled work. If no record explains a session running at this time from
    this account, the session itself, and not just the file it delivered, becomes the thing to account for.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Which remote endpoint was this RDP client connected to around the time of the write?
  context: >-
    The far end of the session is the origin of anything arriving over the redirected drive, so the
    destination address and port identify the system that needs to be examined next. Weigh whether it is an
    internal system this account routinely administers, an unfamiliar internal host, or an address outside the
    environment; RDP to a non-standard port or to an external address is worth separating out. Resolved
    destination names are recorded on a separate lookup event and are frequently absent here, so read the
    address as primary.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - network_connection
- question: What is in the file that landed in the Startup folder?
  context: >-
    Anything in this folder executes at the next interactive logon, so the file's content states the intent.
    For scripts and shortcuts, read the target path, arguments, embedded URLs or addresses, and any encoded or
    obfuscated content. For executables, check the signer, imports, embedded strings, and packing. The listing
    here gives the path and the writing process; content analysis requires retrieving the file from the
    endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this file has executed, what is its hash, and does it have known threat intel or AV detections?
  context: >-
    A hash is recorded when a file runs, not when it is written, so file-creation events carry none. This
    query looks for the artifact executing on this host — either directly as its own process, or referenced on
    the command line of an interpreter such as powershell.exe, cmd.exe, or wscript.exe. On an interpreter
    match the recorded hash belongs to the interpreter, not the artifact; take the artifact's hash from its
    on-disk path instead. A file sitting in Startup that has not been executed yet will not appear at all,
    which is itself the answer that the logon has not happened.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Which remote administration connections involved this host around the alert, and was this host itself being reached remotely?
  context: >-
    Remote administration traffic has two directions, and which one this host is on changes the reading. A
    session this machine opened outbound puts a local user at the keyboard driving the RDP client; an inbound
    session on the same ports means someone was already operating this machine remotely and may have opened
    the RDP client from within that session. Read the source address against the port to tell the two apart,
    and note any chain of one remote session launching another.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
  answer_sources:
  - network_connection
  - process_creation
- question: What account and target did the RDP client session use, and how were the credentials supplied?
  context: >-
    The file event names the writing process but carries no command line, so the client's own start event is
    where the session parameters live. The arguments reveal the target passed with /v, any saved .rdp profile
    invoked, and whether redirection or admin-session switches were set; the account shows whose credentials
    opened the session. A saved profile or a passed-in target that the user cannot account for indicates the
    session was set up for them rather than by them. Logon-side detail such as event codes 4624 and 4648 on
    the target completes this if those channels are collected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    Everything the remote side pushes across the redirected drive is written by the same client process, so
    this process's other file activity enumerates the whole delivery rather than the one path that alerted.
    Look for supporting components dropped alongside the Startup entry, staging under Temp or AppData, and
    deletions that indicate cleanup. Paths matter more than volume here — where the writes land is the signal.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to this Startup folder recently, and by which processes?
  context: >-
    The per-user Startup folder has a small set of legitimate writers — installers, deployment tooling, and
    the user's own shell placing a shortcut. Other recent arrivals in the same folder show whether this is an
    isolated drop or a location under repeated use, and the grouping by writing process makes an unfamiliar
    writer stand out against that routine set. Prior writes by the RDP client to this folder are the pattern
    to look for specifically.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Windows\Start Menu\Programs\Startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What processes ran on this host after the file was written?
  context: >-
    The Startup entry pays off at the next interactive logon, but the session that placed it may also have
    driven activity immediately. Look for the written file executing, for shells and script hosts started
    shortly after the write, and for tooling that does not fit this machine's routine set. The aggregation
    collapses repetitive agent and OS activity into high-count rows so that infrequent, unfamiliar
    process/account pairs surface at the bottom.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
  answer_sources:
  - process_creation
- question: Has this account used remote access or remote execution tooling on other hosts in the past day?
  context: >-
    An account that reaches several systems with remote administration tooling in a short window
    describes a wider footprint than one RDP session. The query counts this account's use of the
    common remote access and remote execution binaries across every host, so the host spread and
    the mix of binaries are what to read. A steady pattern across managed servers fits an
    administrative role; a sudden fan-out, or tooling this account does not normally use, does
    not. If this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account
    (name ending in $), this query intentionally returns nothing — a user pivot on a service
    principal matches every host's background automation, not an actor; assess movement through
    the host- and program-scoped questions instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
  answer_sources:
  - network_connection
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is this account's 90-day history
    of RDP-client writes into a Startup folder, grouped by host — not its general use of remote desktop. An
    account with no prior occurrence is the deviation worth chasing; one with a steady count across the same
    hosts suggests a workflow that routinely moves files this way. Weigh the count against what the account is
    for.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \mstsc.exe
        TargetFilename|contains: \Microsoft\Windows\Start Menu\Programs\Startup\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically produced this pattern on this host or across the environment, or is it new for this activity?
  context: >-
    User identity attributes the session but not the action here, and a file event carries no parent to pivot
    on, so the acting program is the other meaningful anchor. The query mirrors the rule's selection scoped to
    the alerting binary, giving the 90-day history of this program producing this specific pattern rather than
    its general footprint. A program that is new or rare for this pattern is the deviation; one already
    accounting for a large prior count reflects an established workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \mstsc.exe
        TargetFilename|contains: \Microsoft\Windows\Start Menu\Programs\Startup\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across every host in the alert window shows whether the RDP session was an
    isolated action or one step among several. Look for the account appearing on hosts it does not normally
    touch and for tooling started in the same window elsewhere. When the alert fires under a machine or
    service account this view fills with routine agent activity and answers nothing — read the acting-program
    view instead in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program produce this pattern on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a machine or service account an account-wide view returns routine agent activity, and this event
    type carries no parent to pivot on, so the acting program fleet-wide is the meaningful cut. The query
    mirrors the rule's selection scoped to the alerting binary across every host in the alert window. Several
    hosts at once points to a pushed or scheduled workflow that writes through redirected drives; a single
    host points to something triggered locally in this session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \mstsc.exe
        TargetFilename|contains: \Microsoft\Windows\Start Menu\Programs\Startup\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
