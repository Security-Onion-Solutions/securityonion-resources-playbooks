name: HTML Help HH.EXE Suspicious Child Process
id: 3c991bd5-645a-4c50-b97e-c53b00ac01ab
description: |
  Detects the Microsoft HTML Help viewer (hh.exe) spawning a command interpreter, script host, or system proxy
  binary — the rule fires when a process whose parent image ends in hh.exe AND whose own image is one of certreq.exe,
  certutil.exe, cmd.exe, cscript.exe, installutil.exe, msbuild.exe, mshta.exe, msiexec.exe, powershell.exe, pwsh.exe,
  regsvr32.exe, rundll32.exe, schtasks.exe, wmic.exe, or wscript.exe. A compiled HTML Help (.chm) file can embed
  script and COM objects that run when the file is opened, so a CHM delivered by email or download can chain hh.exe
  into a downloader, script engine, or persistence tool. hh.exe almost never spawns these binaries during legitimate
  help-viewing, so the investigation should establish what CHM was opened, how it reached the host, what the child
  binary actually did, and whether the chain continued to network retrieval or persistence.
type: detection
detection_id: 52cad028-0ff0-4854-8f67-d25dfcbc78b4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did hh.exe spawn one of the flagged child binaries, and which one fired?
  context: >-
    Confirm the alert is a true positive by reviewing the triggering event. The rule requires the parent image to end
    in hh.exe AND the child image to be one of the listed interpreters or proxy binaries (certreq.exe, certutil.exe,
    cmd.exe, cscript.exe, installutil.exe, msbuild.exe, mshta.exe, msiexec.exe, powershell.exe, pwsh.exe, regsvr32.exe,
    rundll32.exe, schtasks.exe, wmic.exe, wscript.exe). Note which child fired — it determines which downstream questions
    (script decoding, DLL loads, scheduled-task configuration) carry the most weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to open compiled HTML Help (.chm) files that launch interpreters?
  context: >-
    Legitimate help content rarely spawns command interpreters or system proxy binaries. Knowing whether this user
    routinely opens .chm files for a line-of-business application, and whether this host runs software that ships
    CHM-based help, is often the fastest way to separate a benign vendor help file from a delivered lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What .chm file did hh.exe open, and how did it reach this host?
  context: >-
    A CHM that chains into execution is typically delivered as an email attachment or download. The parent command line
    of hh.exe usually carries the path to the .chm file it opened; that path indicates whether the file came from a mail
    download folder, a browser download directory, or a removable drive. Identifying the file enables blocking it and
    searching for other recipients.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: What process started hh.exe, and is that origin expected?
  context: >-
    Tracing hh.exe back to its own parent shows how the help viewer was launched. A user double-clicking a .chm file
    from explorer.exe or an email client looks different from hh.exe started by a script host, an Office application, or
    an unexpected automation. The grandparent chain frames whether this is user-initiated help-viewing or an automated
    delivery chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same hh.exe instance spawn?
  context: >-
    A CHM lure commonly runs more than one command — a script host to decode a payload, then a downloader, then a
    persistence tool. Listing every child of this exact hh.exe instance reveals the full set of actions launched from
    the opened help file, not just the one that tripped the rule.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the child binary actually do? Decode its full command line.
  context: >-
    The child's command line carries the operational intent — the script or file it runs, the URL it fetches, the DLL
    entry point it invokes, or the scheduled task it registers. Decode every flag and argument: for certutil look for
    -decode/-urlcache, for regsvr32/rundll32 look for scriptlet or DLL entry points and remote paths, for schtasks look
    for the task name (/TN), command (/TR), and schedule (/SC), and for mshta/wscript/cscript look for the script or URL
    being executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: If the child is powershell.exe or pwsh.exe, was the command encoded, and what does it decode to?
  context: >-
    When the child binary is PowerShell, the CHM chain commonly passes an -EncodedCommand (-enc) base64 payload or an
    obfuscated one-liner so the actual action is hidden from casual inspection. Decoding reveals the real payload — a
    download cradle, an in-memory .NET loader, or a reverse shell. If the child is not PowerShell, this question does
    not apply and zero rows is expected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What modules did the child binary load shortly after it started?
  context: >-
    Proxy-execution children such as regsvr32.exe, rundll32.exe, installutil.exe, and msbuild.exe exist to load and run
    code from a DLL, scriptlet, or assembly. The modules loaded immediately after the child starts reveal whether it
    pulled a payload from a user-writable or temporary directory rather than only signed system DLLs from System32. A
    DLL loaded from a download or AppData path shortly after the child launches is the load-bearing artifact for a CHM
    side-loading chain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: Did the child binary make any outbound network connections after it started?
  context: >-
    The CHM chain frequently ends in network retrieval — a downloader fetching a second stage, or a proxy binary pulling
    a remote scriptlet or HTA. Outbound connections initiated by the child binary identify the destination to block and
    indicate whether the chain reached command-and-control. Connections to web-hosting or file-sharing services are a
    common pattern for staging second-stage payloads.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Was any WMI execution activity recorded on this host around the time of the alert?
  context: >-
    If the child is wmic.exe (or a script host calling WMI), the chain may use Windows
    Management Instrumentation to run local or remote commands. Provider-start events (5857)
    name the provider the WMI service loaded around the alert, and subscription registrations
    (5859-5861) carry the event query and consumer definition - read
    winlog.user_data.ProviderName, winlog.user_data.Query, winlog.user_data.CONSUMER, and the
    message narrative to see what WMI ran, including use of namespaces such as root\subscription
    that point to event-based persistence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - message
- question: Has hh.exe spawned this child binary on this host before?
  context: >-
    hh.exe spawning a command interpreter or proxy binary is rare in normal operation. A historical count of how often
    this specific parent-child pairing has occurred on this host separates a recurring vendor help-file behavior from a
    first-time, novel spawning relationship. Zero or very low counts point to a delivered lure rather than routine
    software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \hh.exe
        Image|endswith:
        - \CertReq.exe
        - \CertUtil.exe
        - \cmd.exe
        - \cscript.exe
        - \installutil.exe
        - \MSbuild.exe
        - \MSHTA.EXE
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \hh.exe
        Image|endswith:
        - \CertReq.exe
        - \CertUtil.exe
        - \cmd.exe
        - \cscript.exe
        - \installutil.exe
        - \MSbuild.exe
        - \MSHTA.EXE
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around the time of the alert?
  context: >-
    After identifying the actor, check their activity across all hosts in the alert window. If the same user triggered
    similar execution on multiple endpoints, the scope of the incident may be larger than this single host. This pivot
    degenerates into agent-telemetry noise when the alert fired under a service account, in which case the
    launch-mechanism cross-host question is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \hh.exe
        Image|endswith:
        - \CertReq.exe
        - \CertUtil.exe
        - \cmd.exe
        - \cscript.exe
        - \installutil.exe
        - \MSbuild.exe
        - \MSHTA.EXE
        - \msiexec.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did this same detection fire for other users or systems recently?
  context: >-
    A CHM lure is rarely sent to a single recipient. Correlating this same rule across all hosts reveals how many
    systems opened a help file that chained into execution, exposing the breadth of a delivery campaign and identifying
    additional hosts that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding process activity reveals what led to this event and
    what followed it — reconnaissance, additional execution, or persistence installation. Aggregating by image and
    parent collapses repetitive agent telemetry so novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, defense tampering, or credential access — may reveal the
    attack stages that preceded this event and help reconstruct the timeline. The order in which alerts fired often
    tells the story of how the host was reached and what followed the CHM execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
