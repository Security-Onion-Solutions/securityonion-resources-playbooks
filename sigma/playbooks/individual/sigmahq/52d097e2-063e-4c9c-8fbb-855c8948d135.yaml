name: Suspicious Windows Update Agent Empty Cmdline
id: ee279163-000a-499f-bab4-6a6112ee2ac2
description: |
  Detects a wuauclt.exe process (the Windows Update Agent) whose command line
  carries no arguments - it ends in just Wuauclt or Wuauclt.exe with no update
  flags. The rule fires when the image ends in Wuauclt.exe (or its PE
  OriginalFilename is Wuauclt.exe) AND the command line ends in the bare binary
  name. Legitimately, the Windows Update service invokes wuauclt.exe with
  switches such as /RunHandlerComServer or /UpdateDeploymentProvider; an empty
  command line is unusual for this binary and is associated with code injection
  into the Update Agent process to give injected code a trusted, signed host.
  The investigation should confirm the empty command line, verify the on-disk
  binary is the genuine signed wuauclt.exe running from its expected system
  path, identify the parent that launched it, and determine what the process did
  afterward and whether the pattern repeats across the host or fleet.
type: detection
detection_id: 52d097e2-063e-4c9c-8fbb-855c8948d135
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did wuauclt.exe run with an empty command line - image ending in
    Wuauclt.exe (or OriginalFilename Wuauclt.exe) AND a command line that ends in
    just Wuauclt or Wuauclt.exe?
  context: Before investing investigation time, confirm the alert is a true
    positive. The rule fires only when both conditions hold together - the binary
    resolves to wuauclt.exe by image name or PE OriginalFilename, and the command
    line ends in the bare binary name with no trailing arguments. Read the exact
    command line and OriginalFilename from the event and confirm there are no
    update switches present, since the genuine Update Agent is normally launched
    with flags.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run the Windows Update Agent in this
    way?
  context: The genuine Update Agent runs as a system process driven by the Windows
    Update service, not by an interactive user, and it normally carries update
    switches. Knowing whether the acting account and host function are consistent
    with system-driven update activity helps separate a routine OS process from an
    injected or masqueraded one. An interactive or unexpected account associated
    with a flagless wuauclt.exe is more notable than the SYSTEM-driven default.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata, signature,
    and hash?
  context: A flagless wuauclt.exe may be the genuine signed Update Agent hosting
    injected code, or a renamed binary masquerading as it. Compare the Image path
    (the name on disk) against OriginalFileName (embedded PE metadata) - a mismatch
    means the file was renamed. Check the signing party and signature status to
    confirm whether this is the Microsoft-signed system binary or unsigned/tampered.
    The file hash enables a reputation lookup to determine whether this is the known
    legitimate Update Agent or a novel binary requiring deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Did the flagless wuauclt.exe run from its expected system directory, or
    from a non-standard path?
  context: The genuine Windows Update Agent ships in C:\Windows\System32 and
    C:\Windows\SysWOW64. A binary named wuauclt.exe executing from a user-writable
    or otherwise non-standard directory is a masquerade indicator independent of
    the empty command line. Confirm the full Image path against the expected system
    locations - a copy of wuauclt.exe running from Temp, AppData, a profile
    directory, or any path outside System32/SysWOW64 indicates a relocated or
    planted binary rather than the OS component.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CurrentDirectory
- question: Read the full command line of the flagless wuauclt.exe - does it confirm
    no update arguments were passed, or is a hidden or trailing argument present?
  context: The rule keys on a command line that ends in the bare binary name. Parse
    the complete command line on this host to confirm there are genuinely no update
    switches and no trailing payload, named pipe, or path argument concealed after
    the executable name. A truly empty argument list is consistent with an injected
    host process; any normal update flag (for example /RunHandlerComServer) would
    point back toward legitimate service-driven activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this flagless wuauclt.exe, and is that parent chain
    expected?
  context: The genuine Update Agent is launched by the Windows Update service chain
    (svchost.exe hosting wuauserv). The parent reveals how this instance was
    invoked - a service host is consistent with OS update activity, while an
    unexpected parent such as a shell, script host, Office application, or an
    unrelated process points to injection or a deliberately launched masquerade.
    The parent is where the decision to run wuauclt.exe with no arguments was made.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: How and when did this wuauclt.exe binary arrive on the host?
  context: 'The genuine Update Agent is placed by the OS at install or servicing
    time. Tracing the file-creation event for a binary of this name reveals the
    delivery mechanism: routine OS servicing writes it into System32/SysWOW64,
    while a download, archive extraction, manual copy, or dropper writing it into a
    user-writable directory indicates a planted masquerade. Compare the creation
    time against the execution time - a binary created shortly before it ran, by a
    non-OS process, is a strong delivery signal.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this wuauclt.exe spawn after execution, and does the same flagless
    pattern appear on other hosts?
  context: If injected or masqueraded, the trusted-looking Update Agent process is a
    launch point for follow-on activity. Examining the child processes it spawned
    reveals its actual objective - reconnaissance, credential access, or further
    execution under a signed parent. The same flagless wuauclt.exe pattern appearing
    on multiple hosts points to deliberate distribution or a repeatable injection
    technique rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Wuauclt.exe
      - OriginalFileName: Wuauclt.exe
      selection_cli:
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Wuauclt.exe
      - OriginalFileName: Wuauclt.exe
      selection_cli:
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the flagless wuauclt.exe launch was a single event or part of activity spanning
    multiple endpoints. If the same user triggered similar activity on other hosts,
    the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Wuauclt.exe
      - OriginalFileName: Wuauclt.exe
      selection_cli:
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    flagless wuauclt.exe launch reveals what led to it and what followed - the
    parent that staged the process, reconnaissance, or follow-on execution the
    trusted host process was meant to cover. Novel parent-child pairs at low counts
    are what to scan for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the flagless
    Update Agent launch and help reconstruct the full timeline. Injection into a
    trusted system process is often one step in a sequence, so prior alerts give the
    context for why a signed host process was used.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the flagless wuauclt.exe pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even routine OS servicing can occasionally produce a wuauclt.exe launch
    that matches this rule. This query mirrors the rule's selection structure scoped
    to this host, so the resulting parent and user distribution reflects how this
    specific firing pattern has historically run here, not generic process activity.
    A new parent process, an unexpected account, or a first-ever occurrence is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Wuauclt.exe
      - OriginalFileName: Wuauclt.exe
      selection_cli:
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the flagless wuauclt.exe pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the flagless wuauclt.exe firing pattern
    rather than generic process activity. Many hosts firing the same pattern points
    to an OS servicing quirk or scripted deployment that produces it by design; one
    host or a small unrelated set points to manual operator or injection activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Wuauclt.exe
      - OriginalFileName: Wuauclt.exe
      selection_cli:
        CommandLine|endswith:
        - Wuauclt
        - Wuauclt.exe
      condition: all of selection*
    fields:
    - host.name
