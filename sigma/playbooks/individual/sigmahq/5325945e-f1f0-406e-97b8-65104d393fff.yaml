name: Potential Snatch Ransomware Activity
id: 6073a208-f17f-4b60-8484-d6a7046526e9
description: |
  Detects a process command line matching EITHER of two alternative patterns associated with Snatch
  ransomware droppers: an immediate forced reboot (shutdown /r /f /t 00), OR a stop of the
  SuperBackupMan service (net stop SuperBackupMan). The rule fires when any one branch matches; the
  two are alternatives, not a required pair. This family registers itself as a Windows service, adds
  that service to the SafeBoot\Minimal key, sets the boot configuration to safeboot minimal with
  bcdedit, and forces a reboot; once the machine returns in Safe Mode most endpoint protection is not
  running, the service stops itself, shadow copies are deleted, and files are encrypted. Determine
  which branch fired, whether boot-configuration or service start-type changes accompanied it, whether
  recovery state on the host is still intact, and whether the same pattern appears on other machines.
type: detection
detection_id: 5325945e-f1f0-406e-97b8-65104d393fff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line match either of the two patterns this rule detects, and which one fired?
  context: >-
    This rule fires when a command line matches EITHER a forced immediate reboot (shutdown /r /f /t 00)
    OR a stop of the SuperBackupMan service (net stop SuperBackupMan). Note which branch fired, because
    the branches sit at different points in the sequence. The reboot branch corresponds to the
    transition into Safe Mode, while the service-stop branch corresponds to the post-reboot step where
    the ransomware service stops itself before encryption begins.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run an immediate forced reboot or stop a backup-named service?
  context: >-
    A scheduled maintenance reboot or a service stop performed by a backup administrator produces the
    same command line as this rule detects. Check whether a change ticket, maintenance window, or
    backup-software deployment accounts for the activity on this host and under this account.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the alerting command do, and did safe-boot or service-control commands run alongside it on this host?
  context: >-
    The behavior this rule keys on is one step of a longer sequence, so the surrounding command lines
    are what make it readable. The family installs a service, registers it under the SafeBoot\Minimal
    key, runs bcdedit to set safeboot minimal, and then forces a reboot. This query surfaces
    boot-configuration and service-control command lines on the host around the alert; decode the
    arguments of each and reconstruct the order they ran in.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_mechanism:
        CommandLine|contains:
          - 'safeboot'
          - 'SuperBackupMan'
          - '/r /f /t'
          - 'bcdedit'
          - 'net stop'
          - 'sc stop'
          - 'sc config'
          - 'SafeBoot\Minimal'
      condition: selection and selection_mechanism
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process launched this command, and does the parent chain point at a document, archive, or browser download?
  context: >-
    The rule targets characteristics of document droppers, so the parent process and its command line
    show whether the command came from an interactive shell, a service control manager, a scripted
    batch file, or a user-facing application. Parents that should rarely launch OS utilities include
    winword.exe, excel.exe, powerpnt.exe, acrord32.exe, chrome.exe, msedge.exe, firefox.exe, 7zFM.exe,
    winrar.exe, and explorer.exe. If the parent is one of those, the document or archive filename is
    usually visible in its command line and identifies the delivery vector to hunt for elsewhere.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Are the files this process lineage wrote still on disk for analysis?
  context: >-
    Droppers for this family unpack a second-stage executable into the Windows folder before the
    reboot, so a file written by the alerting process or one of its direct children may still be
    present. Files that remain on disk can be hashed, reviewed, or submitted for offline analysis;
    files already removed narrow what can be examined and shift the evidence to process telemetry.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What recovery-inhibiting commands were executed on this host?
  context: >-
    This family deletes Volume Shadow Copies after the Safe Mode reboot and before encryption, and the
    reboot command itself is what moves the machine into that state. This query surfaces every
    recovery-inhibiting command on the host: shadow copy deletion (vssadmin, wmic), boot recovery
    changes (bcdedit), backup deletion (wbadmin), and recovery-environment changes (reagentc). Process
    telemetry records the commands that ran, not whether they succeeded, so verify current state
    directly on the host with vssadmin list shadows, bcdedit /enum, reagentc /info, and wbadmin get
    versions.
  range: +24h
  answer_sources:
  - process_creation
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Recovery destruction normally arrives as a chain rather than a single command: service stops,
    security-tool termination, permission changes on user data, and event log clearing within the same
    window. Aggregating destructive-utility executions on the host by binary and account shows whether
    the alerting command sits inside such a sequence and whether one account drove all of it. A single
    shared parent across the set points at a script rather than hands-on administration.
  range: +/-30m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    This family unpacks a second-stage executable into the Windows folder under a short randomised
    name and, after the Safe Mode boot, encrypts files and writes ransom notes. Non-system binaries
    executing on the host in the half hour after the alert, particularly from temporary or
    user-writable paths, show whether the encryption step has started. Ransom-note text files and a
    single new file extension appearing uniformly across user data are the corroborating artifacts to
    confirm on the host itself.
  range: +30m
  answer_sources:
  - file_event
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Did a user-facing application crash or log an abnormal event on this host shortly before the alert?
  context: >-
    Document- and archive-borne execution often leaves an Application-channel error record when the
    host application exits abnormally after the payload runs. An Application Error (event 1000) from
    winword.exe, excel.exe, acrord32.exe, or an archiver in the hour before the reboot command supports
    a document-delivery path; the absence of one does not rule it out. If the Application channel is
    not collected in this environment, treat zero results as a visibility gap rather than evidence
    that nothing ran.
  range: -1h
  answer_sources:
  - manual_review
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1000
      condition: selection
    fields:
      - Provider_Name
      - EventID
- question: What files were written into user-writable delivery paths on this host around the alert?
  context: >-
    Document and archive delivery stages the next step into a writable location before it executes.
    The paths that matter are the user profile Downloads folder, the per-user and machine Temp
    directories, AppData\Local and AppData\Roaming, synchronised cloud caches, and the Office startup
    folders. Grouping writes into those paths by filename and writing process around the alert shows
    what was staged and which process staged it; a short randomly named executable or an archive
    expanded into one of these directories is the artifact to pull for analysis.
  range: +/-30m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\Downloads\'
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
          - '\Windows\Temp\'
          - '\OneDrive\'
          - '\Microsoft\Windows\Start Menu\Programs\Startup\'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
- question: Did a command interpreter or script host on this machine make outbound connections around the alert?
  context: >-
    Document-borne execution normally runs a living-off-the-land binary that then talks outbound,
    typically inside a 15-minute window from the document being opened. This query lists egress from
    powershell.exe, cmd.exe, wscript.exe, cscript.exe, mshta.exe, rundll32.exe, regsvr32.exe,
    msiexec.exe, curl.exe, bitsadmin.exe, pcalua.exe, expand.exe, and tar.exe on the host in the alert
    window. Corporate update and content-delivery destinations and the proxy egress ranges used in this
    environment can be set aside first; what remains is the traffic worth resolving.
  range: +/-1h
  answer_sources:
  - network_connection
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      selection_tools:
        Image|endswith:
          - '\powershell.exe'
          - '\cmd.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\msiexec.exe'
          - '\curl.exe'
          - '\bitsadmin.exe'
          - '\pcalua.exe'
          - '\expand.exe'
          - '\tar.exe'
      condition: selection and selection_tools
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: When this host has produced the rule's command-line patterns before, what parents and users drove that activity?
  context: >-
    Scripted maintenance can issue an immediate forced reboot on a schedule, and backup tooling can
    stop its own service by name. The query mirrors the rule's selection structure scoped to this host,
    so the parent and user distribution reflects how these specific command lines have run here over
    the past two weeks. A parent process with no prior record, or an account that has never driven
    them, is the deviation worth chasing; a steady history under one maintenance script points at
    routine operations.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: shutdown\s+/r /f /t 00
      - CommandLine|re: net\s+stop SuperBackupMan
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user produced the rule's command-line patterns before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    account's 90-day history of these specific command lines aggregated by host. An account that has
    never issued a forced reboot or stopped a backup-named service is a different proposition from a
    server administrator who does so weekly. Weigh the count and the host spread against the user's
    role and normal toolset.
  range: -90d
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: shutdown\s+/r /f /t 00
      - CommandLine|re: net\s+stop SuperBackupMan
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's patterns here or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity does not
    attribute the behavior and the launch mechanism is the meaningful pivot. The query mirrors the
    rule's selection structure scoped to the alerting parent process, so the result is the 90-day
    history of that parent driving these command lines, aggregated by host. A new or rare parent for
    this pattern is the deviation; a parent already accounting for thousands of prior events is
    platform or vendor automation.
  range: -90d
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: shutdown\s+/r /f /t 00
      - CommandLine|re: net\s+stop SuperBackupMan
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same
    identity was operating on more than one machine. Deployment of this family is typically preceded by
    remote-access sessions and remote execution from an account the operator controls, so an account
    active on several endpoints at once narrows where else to look.
  range: +/-1h
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal the user pivot returns agent-telemetry noise, because every host runs
    SYSTEM-owned agents constantly. The launch mechanism answers the question instead: this query
    mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in the
    alert window. Several hosts in the same window points at scheduled or pushed execution; a single
    host points at a host-local trigger.
  range: +/-1h
  always_include: true
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: shutdown\s+/r /f /t 00
      - CommandLine|re: net\s+stop SuperBackupMan
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts produced the rule's command-line patterns in the past week, and does the distribution look like automation?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of these specific command lines rather than generic use of shutdown.exe or net.exe. Many
    hosts producing the same pattern on a regular cadence points at scripted maintenance or vendor
    automation; one host, or a small unrelated set clustered in time, points at operator activity. Use
    the host distribution to calibrate how far the investigation needs to reach.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|re: shutdown\s+/r /f /t 00
      - CommandLine|re: net\s+stop SuperBackupMan
      condition: selection
    fields:
    - host.name
- question: Is this same destructive activity occurring on other hosts in the environment?
  context: >-
    This family is pushed to many machines in a single operation, so the same rule firing on several
    hosts within a short window describes environment-wide execution rather than one machine's
    maintenance script. The count of affected hosts sets the scope of the response, and the interval
    between the first and last detection shows the direction and rate at which the activity spread.
  range: +/-1h
  answer_sources:
  - process_creation
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
