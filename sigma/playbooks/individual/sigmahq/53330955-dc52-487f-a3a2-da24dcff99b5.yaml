name: New BgInfo.EXE Custom DB Path Registry Configuration
id: 4184abb9-bb46-4482-bf9d-4371171a3bf1
description: |
  Detects a registry write to a value ending in \Software\Winternals\BGInfo\Database, which sets the custom
  database path BgInfo reads when it runs. BgInfo is a signed Sysinternals utility that IT teams routinely deploy
  through login scripts or group policy with the database kept on a file share, so a custom path by itself is
  ordinary; the same setting also accepts a UNC or remote path and can point at content that drives VBScript
  execution inside the signed binary, which is how the setting is abused. Determine what path was configured,
  which process and account wrote it, whether that path belongs to a share the organization deploys from, and
  whether BgInfo subsequently ran against it.
type: detection
detection_id: 53330955-dc52-487f-a3a2-da24dcff99b5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting registry write target the BgInfo Database value, and what path was written into it?
  context: >-
    The rule fires on a single condition, a registry value whose path ends in \Software\Winternals\BGInfo\Database.
    Confirm the key path matches and read the value data, which holds the database path BgInfo will load. The signer
    columns describe the writing process, not a verdict; BgInfo itself is a genuine signed utility, so read them for
    coherence with the key instead, a Sysinternals-signed or IT-deployment binary writing this value is self-consistent,
    a script host or an unrelated binary writing it is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user and host expected to configure a custom BgInfo database path?
  context: >-
    BgInfo is commonly deployed by IT with a custom database on a file share, so the account and host matter more than
    the setting itself. A desktop-support account or a deployment host writing this value fits routine practice; an
    ordinary user account, or a host outside the deployment scope, does not. User attribution is present on most
    endpoint registry events; when it is a machine account or missing, judge from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What launched the process that wrote the BgInfo database path?
  context: >-
    The registry event names the writing process but not its lineage. Looking that process up by its own identifier
    returns the parent that started it, which separates a deployment chain such as a login script running under
    userinit.exe or a management agent from an interactive shell, a script host, or an Office application. A registry
    event does not carry the writing process's parent, so this pivot into process telemetry is the only way to see it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other processes did the process that wrote this value spawn?
  context: >-
    A process that configures a BgInfo database path rarely stops there. Listing the children it launched shows whether
    the write was an isolated configuration change or one step in a longer chain, such as staging the database file,
    copying BgInfo itself, or installing additional persistence. Note this shows what the writing process started, not
    what started alongside it, because registry events do not record the writing process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was this BgInfo configuration part of a documented deployment or change?
  context: >-
    BgInfo with a custom database path is a normal IT deployment, and deployments usually leave a paper trail, a change
    record, a package in the software distribution system, or a group policy object naming the database share. A matching
    record that also names the same path closes this quickly; a record that names a different share than the one written
    does not close it. Answer this from change and deployment systems rather than from the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Are BgInfo settings normally pushed through group policy or a login script in this environment?
  context: >-
    Organizations that use BgInfo typically configure it centrally, through a group policy preference, a login script,
    or a packaged deployment, so the database path is identical everywhere and written by the same mechanism on every
    host. A one-off write on a single host, by a mechanism that does not match how the setting is normally distributed,
    is the deviation worth explaining. Answer this from deployment tooling and policy documentation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: Is the BgInfo Database value a configuration setting the writing process plausibly owns?
  context: >-
    This value tells BgInfo which database file to load on each run, and BgInfo reads it every time it executes, which
    gives the setting persistence-like effect without a Run key. The judgment is whether the vendor behind the writing
    process plausibly owns this key, a Sysinternals or deployment-tool binary writing it is coherent, a script host or
    an unrelated signed utility writing it is not. Trusted signing is true of nearly every alerting process and is not
    exculpatory on its own.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What database path was configured, and is it local, a UNC or network share, or a user-writable directory?
  context: >-
    The value data is the payload here. A path under a controlled deployment share is the common benign case; a UNC path
    to an unfamiliar server, a path under Temp, AppData, ProgramData, or a user profile, or a path on removable media
    puts the file that drives BgInfo's rendering outside administrative control, and BgInfo executes VBScript embedded
    in that content inside the signed binary. Value data is recorded on most registry modifications but not all, so if
    it is absent, recover the configured path from the file BgInfo later reads or from the deployment package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Were other registry modifications made on this host around the same time?
  context: >-
    A configuration write that belongs to a deployment arrives alongside the rest of that deployment's registry activity
    and under the same account. A write that arrives alone, or alongside autostart, service, or security-policy changes
    from the same process within the same window, points at a hands-on session rather than a packaged install. The
    triggering key appears in these results; the signal is what else was written next to it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Did the process that wrote this value, or its children, also write files to disk?
  context: >-
    The BgInfo database path only matters if content exists at that path, so establishing whether the same session also
    staged that file locally determines whether the configuration is live and what BgInfo would render on its next run.
    Correlating file activity by the writing process and its children catches the drop that usually lands in the same
    session as the registry write. File-write events carry no hash; if a payload is present, hash it from a later
    execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Did BgInfo run after the database path was configured, and did it start any child processes?
  context: >-
    The configuration takes effect only when BgInfo next executes, which on a deployed setup is at logon and on a
    hands-on setup may be immediately after the write. BgInfo evaluates VBScript from its database inside its own
    process, so the execution itself may leave no child process; a child such as a shell or script host under BgInfo is
    therefore notable rather than expected. Zero BgInfo executions in this window means the configured path has not been
    read yet, not that it is inert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_run:
        Image|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      selection_child:
        ParentImage|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      condition: selection and (selection_run or selection_child)
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - registry_event
- question: Did BgInfo make network connections from this host after the database path was configured?
  context: >-
    A database path on a UNC or remote share makes BgInfo fetch its content over the network on every run, so the
    connections it opens name the server actually being read. Connections to a known file server in the deployment scope
    support the routine explanation; connections to an unfamiliar internal host, a workstation-range address, or an
    external address do not. No connections at all is consistent with a local database path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_proc:
        Image|endswith:
          - '\bginfo.exe'
          - '\bginfo64.exe'
      condition: selection and selection_proc
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has the process that wrote this value run on this host before?
  context: >-
    A binary that appears on a host for the first time to write a configuration value reads differently from one that
    has run there for months as part of a standard build. Low or zero historical counts point at newly introduced
    tooling; a long, steady history under the same accounts points at established deployment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has the BgInfo database path been set on this host before, and was it set to the same value?
  context: >-
    A path that has been written repeatedly with the same value is a login script or policy reapplying a stable
    configuration. A first-ever write, or a write that changes a long-stable path to a new one, is the case worth
    explaining. Registry value deletion is not recorded by endpoint telemetry, so judge the setting's stability from
    this modification history rather than from any removal event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Which other hosts have this BgInfo database value set, and do they all point at the same path?
  context: >-
    Fleet distribution is the strongest discriminator for this setting. Many hosts carrying the same value, written by
    the same process, is a group policy or login-script deployment. This host carrying a value no other host has, or
    carrying a different path than the fleet-standard one, narrows the question to who configured this host differently
    and from where.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process starts around the write collapses routine agent and service noise into high-count rows while
    novel parent-child pairs stand out at low counts. Look for what preceded the write, an interactive shell, a script
    host, a remote-management binary, and what followed it, since the configuration change is more meaningful when read
    against the session it sits in.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this configuration write in a sequence. Reconnaissance, credential
    access, or defense tampering ahead of it changes what the write likely represents; a quiet timeline before it
    supports the routine-deployment reading.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other persistence mechanisms installed on this host around the same time?
  context: >-
    Because BgInfo reloads its database on every run, this setting behaves like a foothold that survives reboot without
    a Run key. Operators who take one foothold commonly add backups through different techniques, scheduled tasks,
    services, registry autostarts, BITS jobs, or WMI subscriptions. Several persistence tools running in the same window
    indicate stacking rather than an isolated configuration change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
