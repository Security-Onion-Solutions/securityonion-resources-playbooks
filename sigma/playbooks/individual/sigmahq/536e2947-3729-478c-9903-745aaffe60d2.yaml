  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    triggered similar PowerShell activity on several hosts, the scope is larger than this
    one machine. When the alert fired under SYSTEM or another service principal, this
    user pivot degenerates into agent-telemetry noise — the parent-driven clustering
    question is the meaningful counterpart in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
