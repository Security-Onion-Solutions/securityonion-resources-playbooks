- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, initial-access indicators, credential access — may reveal
    the stages that preceded this PowerShell invocation and help reconstruct the timeline.
    A hidden-window cradle is frequently the execution step that follows a delivery or
    tampering alert.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
