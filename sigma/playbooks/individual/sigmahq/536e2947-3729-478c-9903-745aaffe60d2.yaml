name: Suspicious PowerShell Invocations - Specific - ProcessCreation
id: c560befa-8599-4b7b-85ba-1ca77b5206f4
description: |
  Detects PowerShell command lines matching any of six specifically suspicious invocation
  patterns — EITHER a hidden-window Base64 conversion one-liner ([Convert]::FromBase64String
  with -nop, -w, -c), OR a hidden-window IEX + New-Object one-liner, OR a hidden-window
  encoded command with execution-policy bypass (-ep bypass -Enc), OR PowerShell driving a
  registry add under \software\, OR a hidden-window WebClient download cradle
  (system.net.webclient with .download), OR an IEX + Net.WebClient .Download combination.
  Each branch fires only when all of its tokens appear together, and the Chocolatey
  installer one-liner is filtered out. These flag combinations are characteristic of
  download cradles, in-memory payload execution, and script-driven persistence, though
  deployment and management automation can occasionally produce them. The investigation
  should confirm which branch fired, decode or analyze the payload and any URL it
  retrieves, identify the launching parent, and determine whether the pattern is
  established automation or a first occurrence for this host, user, and parent.
type: detection
detection_id: 536e2947-3729-478c-9903-745aaffe60d2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Which of the rule's six suspicious PowerShell invocation patterns does this command line match?
  context: >-
    The rule fires when the command line matches at least ONE of six branches — EITHER a
    hidden-window Base64 conversion (-nop, -w, hidden, -c together with
    [Convert]::FromBase64String), OR a hidden-window IEX one-liner (-w hidden, -noni, -nop,
    -c with iex and New-Object), OR a hidden-window encoded command with execution-policy
    bypass (-w hidden, -ep bypass, -Enc), OR PowerShell running a registry add under
    \software\, OR a hidden-window WebClient download cradle (bypass, -noprofile,
    -windowstyle hidden, new-object system.net.webclient, .download), OR an IEX +
    Net.WebClient .Download combination. Within a branch, every listed token must be
    present together. Note which branch fired — the decode task carries the weight for the
    Base64/-Enc branches, URL analysis for the WebClient/IEX branches, and persistence
    review for the registry branch. The Chocolatey installer one-liner is excluded by the
    rule's filter, so a match here is something else.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run PowerShell with hidden windows, encoded payloads, or download cradles?
  context: >-
    Administrative automation and deployment frameworks do launch PowerShell with hidden
    windows and occasionally encoded commands, but combinations like hidden-window
    WebClient downloads or Base64-conversion one-liners are rare in routine interactive
    use. Knowing whether the account's role and the host's function involve scripted
    administration is often the fastest path to separating sanctioned automation from a
    malicious cradle.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the PowerShell payload decode to, and what does it fetch or execute?
  context: >-
    The branch that fired determines the analysis task. For the -Enc and
    [Convert]::FromBase64String branches, Base64-decode the payload to reveal what actually
    runs — download cradles, reverse shells, or in-memory .NET assembly loads. For the
    iex/New-Object and WebClient branches the command is already readable — identify the
    source URL passed to .DownloadString/.DownloadFile, check its reputation, and determine
    what executes after retrieval. For the registry branch, identify which key and value
    under \software\ the command writes, since that frequently establishes persistence or
    stages a payload for later execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Windows Event ID 4104 records the deobfuscated script content that PowerShell actually
    executes, even when the command line is encoded or obfuscated — for the -Enc and
    FromBase64String branches this is ground truth about what ran, and for the download
    cradles it can capture the retrieved second stage as it executes. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were other PowerShell security controls tampered with before this execution?
  context: >-
    Two of the rule's branches already include an execution-policy bypass, so the alerting
    command itself may carry one — the more telling precursors are the controls weakened
    beforehand. Look for Defender preference tampering (Set-MpPreference,
    DisableRealtimeMonitoring), AMSI bypass artifacts (AmsiUtils, amsiInitFailed),
    obfuscation tooling, and PowerShell downgrade to version 2, which lacks script block
    logging. Finding these in the prior hour strengthens the case that the alert is one
    step in a deliberate execution chain rather than an isolated invocation.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process launched this PowerShell invocation, and is that parent expected?
  context: >-
    The parent process reveals how the command was invoked. Interactive use typically
    descends from explorer.exe or a terminal; scheduled automation from svchost.exe or a
    management agent. Parents like winword.exe, excel.exe, mshta.exe, wscript.exe, or a
    browser point to a malicious document macro, script host, or web-delivered payload —
    exactly the delivery paths hidden-window download cradles are built for. If the parent
    is itself a shell such as cmd.exe, walk one level further up to find what started it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this PowerShell instance spawn afterward?
  context: >-
    Children reveal the payload's actual impact. A download cradle that succeeded often
    hands off to a dropped executable, another PowerShell instance, cmd.exe, rundll32.exe,
    or msiexec.exe; the registry branch may spawn reg.exe to perform the write. Benign
    scripted administration usually produces predictable, repetitive children or none at
    all.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the surrounding window shows what led to
    this invocation and what followed — reconnaissance commands, persistence installation,
    or additional payload stages. Aggregating by process and parent collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does this host have prior PowerShell activity carrying the rule's distinctive markers?
  context: >-
    The rule matches command-line content rather than a particular binary, and every
    Windows host runs PowerShell constantly — so the meaningful 90-day baseline is of the
    distinctive tokens, not the interpreter. This aggregation counts command lines carrying
    Base64-conversion, WebClient-download, encoded-command, interactive-suppression, or
    hidden-window markers, grouped by user. Zero or very low history means the alert is a
    first occurrence on this host; a steady history under one account may reflect installed
    automation worth identifying once and documenting.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_markers:
        CommandLine|contains:
          - '[Convert]::FromBase64String'
          - 'Net.WebClient'
          - 'system.net.webclient'
          - '-EncodedCommand'
          - '-noni'
          - '-windowstyle hidden'
      condition: selection and selection_markers
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    Even common tools can be abused. The query mirrors the rule's selection structure
    scoped to this host — the resulting parent/user distribution reflects how the rule's
    specific firing pattern (not generic PowerShell usage) has historically run here.
    Deviations — a new parent process, an unexpected user account, an unusual command-line
    structure — are the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_convert_b64:
        CommandLine|contains|all:
        - -nop
        - ' -w '
        - hidden
        - ' -c '
        - '[Convert]::FromBase64String'
      selection_iex:
        CommandLine|contains|all:
        - ' -w '
        - hidden
        - -noni
        - -nop
        - ' -c '
        - iex
        - New-Object
      selection_enc:
        CommandLine|contains|all:
        - ' -w '
        - hidden
        - -ep
        - bypass
        - -Enc
      selection_reg:
        CommandLine|contains|all:
        - powershell
        - reg
        - add
        - \software\
      selection_webclient:
        CommandLine|contains|all:
        - bypass
        - -noprofile
        - -windowstyle
        - hidden
        - new-object
        - system.net.webclient
        - .download
      selection_iex_webclient:
        CommandLine|contains|all:
        - iex
        - New-Object
        - Net.WebClient
        - .Download
      filter_chocolatey:
        CommandLine|contains:
        - (New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1
        - Write-ChocolateyWarning
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
