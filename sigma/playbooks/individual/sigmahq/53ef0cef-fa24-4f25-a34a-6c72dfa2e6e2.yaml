name: Query Usage To Exfil Data
id: 19754e41-c235-48bf-ae9b-04fe3c0eef06
description: |
  Detects the system binary query.exe (located in System32) invoked with a command line that redirects its output to a
  file, specifically the "session >" or "process >" patterns that capture logged-on session or running-process listings.
  Both the binary path and a redirect-bearing command line must match for the rule to fire. query.exe is a legitimate
  Remote Desktop Services utility, but writing its session or process enumeration to a file is a staging step that collects
  host context for later review or exfiltration. The investigation should decode the full command line and the redirect
  target, confirm the parent and user are expected to run session/process enumeration, and determine whether the captured
  output was moved, archived, or transferred off the host.
type: detection
detection_id: 53ef0cef-fa24-4f25-a34a-6c72dfa2e6e2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with query.exe redirecting session or process output to a file?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when the binary is query.exe under System32 AND the command line contains a redirect of either session or process output (session > or process >). Confirm both halves are present in the actual event and note the redirect target path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What exactly did this query.exe invocation capture, and where was the output written?
  context: The full command line reveals the specific enumeration staged and its redirect destination. Read the session or process subcommand to confirm what host context was collected, and resolve the redirect target path (after the > operator) so the staged file can be located and reviewed. Host+binary scope here surfaces any additional query.exe runs in the same window that together form a single collection step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'session >'
          - 'process >'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single session or process listing may be routine troubleshooting, but multiple reconnaissance commands in rapid succession (whoami, ipconfig, net user, tasklist, quser) is a signature pattern of post-compromise enumeration. Three or more distinct recon binaries within the window typically indicates automated host profiling preceding a next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned the query.exe command, and is this a normal pattern?
  context: Legitimate session and process enumeration is typically run from cmd.exe spawned by explorer.exe (a user opened a command prompt) or from administrative automation scripts. query.exe spawned by an unusual parent such as a script interpreter, an Office application, wmiprvse.exe, or wsmprovhost.exe indicates remote or macro-driven post-exploitation enumeration rather than interactive administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to run administrative session and process enumeration?
  context: Network administrators and IT staff legitimately enumerate sessions and processes for troubleshooting and capacity work. Standard users rarely run query session or query process and almost never redirect the output to a file. The user's role and typical behavior baseline determine whether this collection is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: What process spawned this query.exe instance and is that parent chain expected?
  context: The parent process reveals how the enumeration was invoked. User-driven administration typically descends from explorer.exe or an interactive shell; service automation from services.exe. Walk up the tree to see what spawned the parent, since a remote-execution or download-cradle ancestor changes the staged session/process listing from routine administration into operator collection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other processes did this parent spawn after the query.exe enumeration on this host?
  context: The activity that follows host enumeration reveals its purpose. Collection commonly precedes archiving, compression, or transfer tooling (rar, 7z, certutil, curl, powershell) that packages and moves the staged output. Review what the same parent launched next to see whether the session or process listing fed a staging-and-exfil step.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run query.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts for query.exe indicate first-time or rare execution, which on a workstation or non-RDS-administered host raises the priority of the staged enumeration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimate utility can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific session/process redirect pattern has historically run here, not generic query.exe usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: :\Windows\System32\query.exe
        CommandLine|contains:
        - session >
        - process >
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this session/process redirect pattern, not generic query.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: :\Windows\System32\query.exe
        CommandLine|contains:
        - session >
        - process >
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: :\Windows\System32\query.exe
        CommandLine|contains:
        - session >
        - process >
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: :\Windows\System32\query.exe
        CommandLine|contains:
        - session >
        - process >
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user staged session or process enumeration on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: :\Windows\System32\query.exe
        CommandLine|contains:
        - session >
        - process >
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: reconnaissance followed by collection, or tampering followed by execution.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
