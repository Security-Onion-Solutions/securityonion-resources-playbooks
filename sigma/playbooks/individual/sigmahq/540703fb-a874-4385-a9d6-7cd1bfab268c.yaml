name: Shai-Hulud Malware Indicators - Windows
id: bc253158-9dd4-49c7-81ae-58e073293fd5
description: |
  Detects process command lines containing the literal strings "Shai-Hulud" or "SHA1HULUD", which are
  associated with a self-replicating JavaScript package-registry worm. The family arrives through a
  trojanized package's install-time lifecycle hook, stages a second JavaScript runtime to execute its
  payload, harvests registry tokens, cloud credentials and environment secrets from the machine, and
  installs a self-hosted CI runner for persistence — the runner registration is one of the places the
  literal indicator string appears on a command line. Because this is a literal substring match,
  legitimate producers exist: dependency scanners, remediation scripts, and documentation or ticket
  text pasted into a shell all contain the same words. Determine which process emitted the string and
  in what role, whether a JavaScript toolchain was staged or credential-harvesting activity followed,
  and whether the host is a developer workstation or build agent where package installs are routine.
type: detection
detection_id: 540703fb-a874-4385-a9d6-7cd1bfab268c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line actually contain the "Shai-Hulud" or "SHA1HULUD" indicator string this rule matches on?
  context: >-
    The rule is a literal substring match on the command line — nothing else about the process is
    constrained. Read the full command line and identify which of the two strings is present and what
    role it plays: a runner or repository name being registered, an argument to a scanning or
    remediation tool, or free text quoted into a shell. That distinction drives everything downstream.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to install JavaScript packages or run package-manager lifecycle scripts?
  context: >-
    This family reaches a machine through an install-time hook of a trojanized package, so developer
    workstations, build agents, and CI runners are where it lands. A host that never installs packages
    producing this string is a different finding from a build agent that installs hundreds of
    dependencies a day. Confirm the host role and whether the user routinely runs package installs or
    security tooling that scans for these indicators.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did the command containing the indicator string do — decode every argument and identify the operation.
  context: >-
    The rule constrains no binary, so the emitting process could be a shell, a package manager, a
    JavaScript runtime, or a scanner. Decode the arguments in full and identify the operation: a
    self-hosted runner being registered under an indicator name, a repository being created or pushed,
    a secret-scanning invocation, or a benign string being echoed. Note the working directory — the
    hidden runner directory and package-install trees are distinguishable from an operator shell.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the alerting process, and is that parent chain expected?
  context: >-
    The rule carries no parent constraint, so the parent is the strongest available discriminator. An
    install-time lifecycle hook produces a package manager or JavaScript runtime as the ancestor of a
    shell; an operator or a scheduled scan produces a terminal, automation agent, or task host. A
    package-manager or runtime parent for an indicator string that names a runner or repository points
    at payload execution rather than at someone searching for the indicator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was a second JavaScript runtime staged or executed on this host around the time of the alert?
  context: >-
    The family's staging step downloads and installs an alternate JavaScript runtime, then runs its
    payload under it so execution does not appear under the package manager the user invoked. The
    staging and payload scripts have consistent names, and the runtime lands under the user profile.
    Runtime installation on a machine whose developers never adopted it is the staging step; on a
    machine where it is a sanctioned tool, weigh the parent and timing instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - setup_bun.js
        - bun_environment.js
        - bun.sh/install
        - bun.exe
        - bun-dist
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
- question: Did secret-scanning or credential-harvesting activity run on this host after the alert?
  context: >-
    Credential theft from developer machines and build agents is this family's objective: it runs a
    secret-scanning tool across the filesystem, reads cloud provider credential and configuration
    files, collects environment variables, and stages the results into local JSON files before
    exfiltrating them. Any hit here escalates the alert from a string sighting to credential exposure
    and makes token rotation the immediate next step.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - trufflehog
        - NPM_CONFIG_TOKEN
        - npm publish
        - contents.json
        - environment.json
        - cloud.json
        - .aws
        - .azure
        - GOOGLE_APPLICATION_CREDENTIALS
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
  answer_sources:
  - process_creation
  - manual_review
- question: Was a self-hosted CI runner downloaded, registered, or started on this host?
  context: >-
    The family's persistence step fetches a CI runner package, registers it unattended against a
    repository the operator controls, and starts it hidden so a committed workflow file can execute
    arbitrary commands on the host later. Registration is where the indicator string commonly appears
    as the runner name. A runner installed outside the build platform's normal provisioning path, or
    living in a hidden directory under the user profile, is persistence rather than infrastructure.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - actions-runner
        - config.cmd
        - run.cmd
        - .dev-env
        - --unattended
        - discussion.yaml
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Which processes produce these indicator strings across the environment, and do any of them look like a recurring benign producer?
  context: >-
    The rule's own documented false positive is legitimate software containing similar strings, and a
    literal substring match cannot separate a scanner searching for the indicator from a payload
    naming itself with it. Grouping the fleet's hits by emitting and parent binary over 90 days
    exposes the benign producers worth tuning out — vulnerability and dependency scanners, remediation
    scripts, EDR content — and leaves the one-off emissions from a package manager or runtime parent
    standing out as the executions to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: What child processes did the alerting process spawn afterward?
  context: >-
    Children reveal whether the string was emitted in passing or as one step of an operation. A shell
    that emitted the indicator and then spawned a runtime, a package manager, a download utility, or a
    scanning binary is executing a chain; a process that emitted the string and exited spawned nothing
    and is more consistent with a search or a log line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, what parents and users normally drive it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how these indicator strings have historically been produced here rather
    than generic binary usage. A host where the pattern has only ever come from a scanner service
    account, now producing it under a developer's account with a package-manager parent, is the
    deviation worth chasing. No prior history at all makes this a first occurrence.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of
    the indicator pattern rather than generic tool usage. Many hosts producing it uniformly points to
    a scanner or remediation sweep rolled out across the estate. A handful of developer workstations
    or build agents, especially ones that share a dependency set, points instead to package-install
    delivery and defines the population whose credentials need rotating.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, giving their 90-day history
    of these indicator strings broken out by host. A security engineer or a scanner service account
    with a steady history across many hosts is doing its job; a developer account producing the
    pattern for the first time, on their own workstation, is consistent with a package install that
    pulled in a trojanized dependency. Weigh the count against what the account is for.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal — a build agent's SYSTEM context or a machine
    account — user identity does not attribute the behavior, and the launch mechanism does. The query
    mirrors the rule's selection structure scoped to the alerting parent, giving 90 days of that
    parent driving this specific pattern. A parent already accounting for thousands of prior events is
    scanning or build automation; a package manager or runtime appearing here for the first time is
    the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    developer or service identity was active on several machines at once. Because credentials
    harvested from one workstation are replayed elsewhere, a user suddenly running package installs or
    remote tooling on hosts they do not normally touch expands the scope. Under a service principal
    this returns routine agent telemetry and the parent-scoped view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host.
    The meaningful question is whether the same launch mechanism produced the pattern elsewhere in the
    alert window. The query mirrors the rule's selection structure scoped to the alerting parent,
    fleet-wide. Several build agents in the same window points to a shared dependency pulled by a
    pipeline; a single host points to a host-local install.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - Shai-Hulud
        - SHA1HULUD
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the alert window collapses routine telemetry
    into high-count rows and leaves novel pairs standing out at low counts. Look for a package manager
    or JavaScript runtime spawning shells, download utilities, or archive tooling, and for whether the
    activity sits inside a normal working window or ran unattended overnight — the timing separates a
    developer's install from an automated pipeline.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this one in a sequence. Script-interpreter
    execution, remote download activity, or credential-file access preceding the indicator string
    suggests the payload was already running before the string surfaced on a command line. No prior
    alerts, with the indicator arriving under a package-manager parent, points to the install hook as
    the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
