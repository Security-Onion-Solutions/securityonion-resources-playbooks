name: Potential Persistence Via Notepad++ Plugins
id: 9fcde574-e53b-4807-b4d4-12160d05a500
description: |
  Detects creation of a .dll file inside a Notepad++ plugins directory by a process other than the Notepad++ updater (gup.exe) or a recognized installer. The editor loads every plugin DLL in that tree at startup and forwards editor events to it, so a planted DLL gives an attacker code execution inside notepad++.exe each time the editor runs — persistence that survives reboots without any registry or scheduled-task footprint. Legitimate plugin installs and first-time Notepad++ setups can also fire this rule; the investigation should establish what wrote the DLL, whether it is a known plugin or an unknown or unsigned binary, and whether it has been loaded or has driven follow-on process activity.
type: detection
detection_id: 54127bd4-f541-4ac3-afdb-ea073f63f692
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the file path and writing process match what this rule detects — a .dll created under a Notepad++ plugins directory by a process other than the updater or installer?
  context: The rule fires when a file whose path contains \Notepad++\plugins\ and ends in .dll is created, and none of the exclusion filters match — the plugin updater (gup.exe), installer stubs such as target.exe or Installer.x64.exe running from a user's Temp path, or an npp.*.exe installer writing the four standard bundled plugin DLLs. Review the exact path, the operation performed, and the responsible process against these criteria before investing further time.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host expected to install or develop Notepad++ plugins?
  context: A first-time Notepad++ installation and users who legitimately extend the editor with custom plugins are the documented false-positive sources for this rule, and developer or IT workstations see both regularly. The query shows the triggering event's host, user, and writing process; when the user is a machine or service account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Does the user recall installing or updating a Notepad++ plugin around this time?
  context: Direct confirmation from the person behind the account is often the fastest path to a verdict. Installs performed through the editor's built-in Plugins Admin arrive via the excluded updater process, so a recalled legitimate action that still fired this rule usually means a manual DLL copy — ask which plugin it was, where the DLL came from, and why it was placed by hand.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: Is the plugin DLL still on disk, or was it deleted or renamed after the alert?
  context: A DLL still present in the plugins tree will load into the editor on every future launch and can be retrieved for hashing and analysis. Deletion shortly after creation points to cleanup or an aborted drop, while a rename may move the file into the per-plugin subfolder layout the editor actually loads from — interpret the EventType sequence accordingly.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process wrote the DLL into the plugins directory, and how was it launched?
  context: The file event names the writer but not its arguments. This query retrieves the writer's own process-creation event with its full command line and parent, which reveals the delivery mechanism — an archive utility or browser writing into the plugins tree points to a manual drop, a script interpreter or unfamiliar binary points to automated implantation, and a parent chain from a deployment agent points to managed software distribution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
  answer_sources:
  - process_creation
  - manual_review
- question: What does the dropped DLL contain, and is it a genuine Notepad++ plugin?
  context: Retrieve the file from the endpoint and inspect it. Real plugins export the editor's plugin interface functions (setInfo, getFuncsArray, beNotified, messageProc); a malicious plugin implements the same interface and triggers its payload from editor notifications, such as the add-text event fired on every keystroke. Check exports, imports, embedded strings, URLs or IP addresses, packer signatures, and signing status, and compare the DLL name against the official plugin list.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: Has the dropped DLL been loaded, and what are its hash and signature?
  context: DLL load events carry the file's hash and code-signature details directly, and the loading process shows what consumed it — for a plugin this should be notepad++.exe, which pulls plugins in at startup, so the load may lag the write until the editor next launches. Submit the hash to threat intelligence to classify it; an unsigned or unknown-signer DLL with no matching entry in the official plugin list strengthens the implant interpretation. If no load has occurred yet, retrieve the file from disk and hash it manually.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - external_threat_intel
  - manual_review
- question: Did notepad++.exe spawn child processes after the DLL was written?
  context: Plugin code runs inside the editor, and its payload commonly surfaces as child processes of notepad++.exe — script interpreters, cmd.exe, or regsvr32.exe fetching a remote COM scriptlet are the patterns to look for, and a text editor otherwise rarely spawns anything beyond its own updater. Because the plugin only runs while the editor is open, the activity may lag the drop by days; absence of children does not clear the DLL, since payload code can also stay in-process.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\notepad++.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A process that implants one plugin DLL often writes more — additional DLLs, configuration files, or staged payloads — and cleanup deletions from the same process or its children sharpen the picture. Watch where the writes land; other autoload or startup locations receiving files from the same writer turn a single artifact into an implantation pattern.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the Notepad++ plugins directory recently, and by which processes?
  context: Outside of upgrades, the plugins tree is written by the updater and installers, so the set of legitimate writers is small. A week of history shows whether this write is isolated or part of repeated modification, surfaces other DLLs that arrived without alerting, and identifies any single unfamiliar writer touching multiple plugin paths.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Notepad++\plugins\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What other file activity occurred on this host around the time of the alert?
  context: The minutes around a plugin drop often contain the delivery chain — an archive extraction, a download landing in a user folder, or additional persistence drops elsewhere. The aggregation collapses repetitive platform noise into high-count rows so novel writer-path combinations stand out at low counts; unfamiliar writers touching user-writable or autoload paths are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - TargetFilename
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's process activity across all hosts in the alert window reveals whether it is being used beyond this machine — the same account dropping files or running unfamiliar binaries on other endpoints widens the scope. If the account is a machine or service principal, this view fills with routine agent noise and the parent-driven variant of this question is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, user-scoped clustering returns agent-telemetry noise. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window — several hosts receiving plugin-directory DLLs from the same program in the same window points to pushed software distribution or scripted deployment, while a single host points to a host-local action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Notepad++\plugins\
        TargetFilename|endswith: .dll
      filter_gup:
        Image|endswith: \Notepad++\updater\gup.exe
      filter_install:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Temp\
        Image|endswith:
        - \target.exe
        - Installer.x64.exe
      filter_main_installer:
        Image|contains: \npp.
        Image|endswith: .exe
        TargetFilename:
        - C:\Program Files\Notepad++\plugins\NppExport\NppExport.dll
        - C:\Program Files\Notepad++\plugins\mimeTools\mimeTools.dll
        - C:\Program Files\Notepad++\plugins\NppConverter\NppConverter.dll
        - C:\Program Files\Notepad++\plugins\Config\nppPluginList.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: Were other persistence mechanisms also installed on this host around this time?
  context: A plugin drop is file-based persistence that only pays off when the editor runs, so an attacker who planted it frequently stacks more reliable mechanisms alongside — scheduled tasks, services, Run keys, BITS jobs, or WMI subscriptions. Executions of the standard persistence tooling in the same four-hour window point to intentional stacking rather than isolated administrative work.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the same DLL written on other hosts in the environment?
  context: The same plugin DLL appearing on several machines within a day suggests software distribution or deliberate spread — compare the writing processes on those hosts against the writer seen here, and check whether they also fall outside the updater and installer exclusions. A single affected host is more consistent with targeted or manual placement. The parent-scoped fleet question covers the same alert window; this one looks a full day back for any writer.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of writing non-excluded DLLs into Notepad++ plugin directories, aggregated by host. A plugin developer or power user may show a legitimate recurring history; a first-ever occurrence for the account puts more weight on the content, signature, and follow-on questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
