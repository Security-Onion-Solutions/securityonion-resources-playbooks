      filter_gup:
        Image|endswith: \Notepad++\updater\gup.exe
      filter_install:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Temp\
        Image|endswith:
        - \target.exe
        - Installer.x64.exe
      filter_main_installer:
        Image|contains: \npp.
        Image|endswith: .exe
        TargetFilename:
        - C:\Program Files\Notepad++\plugins\NppExport\NppExport.dll
        - C:\Program Files\Notepad++\plugins\mimeTools\mimeTools.dll
        - C:\Program Files\Notepad++\plugins\NppConverter\NppConverter.dll
        - C:\Program Files\Notepad++\plugins\Config\nppPluginList.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute behavior. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern rather than generic program activity. A program that already accounts for many prior events across hosts points to recurring deployment automation worth identifying and verifying; a new or rare program for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Notepad++\plugins\
        TargetFilename|endswith: .dll
      filter_gup:
        Image|endswith: \Notepad++\updater\gup.exe
      filter_install:
        Image|startswith: C:\Users\
        Image|contains: \AppData\Local\Temp\
        Image|endswith:
        - \target.exe
