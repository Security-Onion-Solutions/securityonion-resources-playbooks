- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may reveal the stages that preceded the plugin drop — an initial-execution or download alert, defense tampering, or credential access — and help reconstruct the timeline. Persistence is typically a mid-chain action, so review what fired in the preceding hours for a progression that ends at this drop.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
