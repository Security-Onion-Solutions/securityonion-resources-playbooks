name: PUA - Advanced Port Scanner Execution
id: f7b00db2-f253-4c82-940a-ed70e90ab36e
description: |
  Detects execution of Advanced Port Scanner, a free network scanning tool that enumerates live hosts, open
  ports, and exposed services across a subnet. The rule fires when EITHER the process identity matches the tool
  (Image, OriginalFileName, or Description containing the scanner name) OR the command line carries the tool's
  portable-mode flags (/portable together with /lng). Because the two selection groups are OR'd, an alert may
  trip on the binary identity alone or on the command-line structure alone, so note which branch fired. The scanner
  is used legitimately by IT staff for inventory and troubleshooting, but in an intrusion it provides
  attacker-driven discovery of reachable hosts and services that precedes lateral movement. The investigation
  should confirm the trigger, decode the invocation, determine what was scanned, and establish whether the user,
  host, and parent chain make this routine administration or unsanctioned reconnaissance.
type: detection
detection_id: 54773c5f-f1cc-4703-9126-2f797d96a69d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this alert match the rule, firing either on the Advanced Port Scanner binary identity or on the /portable and /lng portable-mode flags?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. This rule fires when at least one of two independent conditions holds, EITHER the process identity matches the scanner (Image, OriginalFileName, or Description containing the tool name) OR the command line contains both /portable and /lng. Note which branch fired. A binary-identity match means the named tool ran; a command-line-only match can occur even if the binary was renamed, so the file identity becomes the key follow-up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- question: Is this user and host expected to run network port-scanning tools?
  context: Legitimate inventory and troubleshooting work does involve port scanners, but typically only from IT or security staff and from designated administration hosts. Knowing whether the user role and host function include network scanning is often the fastest path to distinguishing sanctioned administration from operator-driven reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is Advanced Port Scanner on the organization's approved software list for this host?
  context: Organizations typically sanction a specific set of network scanning and inventory tools and restrict them to administration hosts. A potentially unwanted scanner such as this one, even though it is a well-known free utility, may represent shadow IT or attacker-supplied tooling when it appears on an endpoint that is not designated for scanning. Unauthorized tools should be checked regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved inventory, audit, or troubleshooting task that explains this scan?
  context: Legitimate use of a port scanner usually correlates with a scheduled vulnerability scan, an asset-inventory run, a maintenance window, or a specific helpdesk request. If no operational context explains why this host enumerated the network at this time, the scan may be attacker-driven discovery staged before lateral movement.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did this scanner invocation actually request? Decode the command line, including the /portable and /lng flags and any target range arguments.
  context: The full command line reveals the specific scan that was run. The /portable flag indicates a no-install run from a dropped copy and /lng selects the interface language; together they are the portable-mode signature the rule keys on. Read any IP range, host list, or port arguments to learn the intended scan scope. This query scopes to all executions of this binary on this host within a few minutes, so a multi-step run shows as the full sequence rather than a single event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - /portable
          - /lng
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What hosts and services did this scanner connect to, and does the spread look like a subnet sweep?
  context: A port scanner produces a burst of outbound connections to many destination addresses and ports in a short window. The set of destinations reveals what was probed, a single host versus a whole subnet, and which services (common ports, SMB on 445/139) were targeted. A wide fan-out to many internal hosts is the scanning signature; a small, expected set may be routine inventory.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did this host generate a burst of SMB or RPC connections to many destination hosts in the scan window?
  context: Beyond TCP port discovery, scanning often extends to enumerating network shares over SMB and RPC. A short-window fan-out of connections to ports 445 and 139 across multiple destination hosts points to share discovery layered on top of the port sweep. A handful of unique hosts is unremarkable; a burst across many distinct destinations indicates active enumeration of reachable file services.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 139
      condition: selection
    fields:
      - DestinationIp
- question: What process spawned the scanner, and is that parent chain a normal way for it to launch?
  context: A scanner started from explorer.exe or an interactive shell suggests a person ran it; one started from automation or a management agent suggests a scheduled inventory task. A scanner spawned by an unusual parent such as a script interpreter, an Office application, or a remote-execution service points to automated post-exploitation enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Does this host normally run Advanced Port Scanner?
  context: A scanner that has never been seen on a host is more suspicious than one that runs regularly as part of scheduled inventory. Zero or very low historical counts indicate first-time or rare execution, which on a non-administration endpoint raises the priority of the scan result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimately used scanner has a normal launch profile on a given host. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific scanner firing pattern has historically run here, not generic process activity. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_port_scanner
      - OriginalFileName|contains: advanced_port_scanner
      - Description|contains: Advanced Port Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_port_scanner
      - OriginalFileName|contains: advanced_port_scanner
      - Description|contains: Advanced Port Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_port_scanner
      - OriginalFileName|contains: advanced_port_scanner
      - Description|contains: Advanced Port Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_port_scanner
      - OriginalFileName|contains: advanced_port_scanner
      - Description|contains: Advanced Port Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but multiple reconnaissance commands in rapid succession is a signature pattern of post-compromise enumeration. Network scanning paired with native discovery binaries such as net, nltest, nbtstat, arp, or netstat indicates an operator mapping the environment before moving to the next attack stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for follow-on lateral movement, privilege escalation, persistence installation, or data staging that the discovery scan may have informed.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this scanner firing pattern, not generic process usage. Many hosts firing the same pattern points to scripted deployment or sanctioned inventory automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|contains: \advanced_port_scanner
      - OriginalFileName|contains: advanced_port_scanner
      - Description|contains: Advanced Port Scanner
      selection_cli:
        CommandLine|contains|all:
        - /portable
        - /lng
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, credential access, or initial access, may reveal the stages that preceded this discovery scan and help reconstruct the timeline. Look for patterns: initial access followed by reconnaissance, or reconnaissance followed by lateral movement.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
