name: File Encryption Using Gpg4win
id: 8b2af535-4974-4911-bcb3-3af07b751f95
description: |
  Detects a process whose image ends in gpg.exe or gpg2.exe (or carries the
  GnuPG OpenPGP tool description) and whose command line contains both ' -c '
  and the word passphrase, the symmetric-encryption invocation pattern of the
  Gpg4win command-line tool. The rule fires only when both the binary/metadata
  match and the command line carries the symmetric-cipher flag together with a
  passphrase, so all conditions must hold. gpg is a legitimate file-encryption
  utility used by privacy-conscious users and some backup workflows, but the
  same symmetric-encryption pattern is also used to decrypt staged payloads
  during malware delivery and to encrypt collected data before exfiltration. The
  investigation should determine what files were targeted, what the full command
  did, where the output went, who and what launched it, and whether the same
  pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 550bbb84-ce5d-4e61-84ad-e590f0024dcd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line invoke gpg with the symmetric-cipher flag and a
    passphrase, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when the image is gpg.exe or gpg2.exe (or carries the GnuPG
    OpenPGP tool description) AND the command line contains both ' -c ' and
    passphrase together. Read the exact command line and confirm both elements are
    present - the symmetric-cipher flag and an explicit passphrase argument identify
    a symmetric encrypt or decrypt operation rather than a key listing or
    configuration call.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to run gpg symmetric file encryption?
  context: Command-line gpg symmetric encryption is normal for a narrow set of users
    and workflows - privacy-conscious individuals encrypting documents, or backup and
    transfer jobs that protect data at rest. Most users and most endpoints never run
    it. Knowing whether the acting account and the host function involve file
    encryption is often the fastest path to separating a routine encryption task from
    payload decryption or pre-exfiltration packaging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this gpg invocation do? Decode the full command line and
    identify the input file, output destination, and operation.
  context: The full command line reveals the specific action taken. Read the arguments
    to determine whether this was an encrypt or a decrypt operation, which file was
    the input, where the output was written, and whether the passphrase appears inline
    or was supplied via stdin or a config file. The same symmetric-cipher pattern
    encrypts collected data before exfiltration and decrypts staged payloads during
    malware delivery, so the input and output paths distinguish the two. The host plus
    binary scope captures any companion gpg calls in the same short window that
    together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - ' -c '
          - passphrase
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How was the passphrase supplied, and does the command line reveal it
    inline or pull it from elsewhere?
  context: gpg symmetric encryption requires a passphrase, which can be passed inline
    via --passphrase, read from stdin, or pulled from a passphrase file. An inline
    passphrase visible in the command line is recoverable and may itself be an
    indicator if it matches a known malware string; a passphrase supplied via stdin or
    a file will not appear here and must be retrieved from the launching script. The
    --batch and --yes flags alongside the cipher flag indicate an unattended,
    non-interactive invocation typical of scripted decryption or bulk encryption.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files did this gpg process read or write on the host?
  context: The file events around the gpg invocation reveal what data was actually
    targeted. An encrypt operation produces a new .gpg output from a plaintext input;
    a decrypt operation reads a .gpg input and writes plaintext, often an executable or
    archive. The file types and directories touched - office documents and shares
    point toward data collection, while executables and DLLs in user-writable
    directories point toward payload staging - determine the severity and which path
    the investigation should follow.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where was the gpg output written, and was it subsequently moved, executed,
    or sent over the network?
  context: Symmetric encryption is rarely the final step. After gpg writes its output,
    the next action reveals intent - an encrypted archive moved to a staging location
    or uploaded points toward exfiltration, while a decrypted executable or DLL that is
    then launched points toward payload delivery. Examine files the binary created and
    correlate with outbound connections from the same host in the same window to
    reconstruct where the data or payload went.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned gpg, and is that parent chain expected for file
    encryption?
  context: The parent process reveals how gpg was invoked. Interactive encryption
    usually shows a console shell, a file manager, or the Kleopatra front end as the
    parent. An unexpected parent such as a script host, mshta.exe, a batch chain, or an
    Office application points to automated or scripted invocation - the pattern seen
    when gpg is dropped alongside a loader to decrypt staged payloads.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    gpg encryption was a single event or part of activity spanning multiple endpoints.
    If the same user triggered similar activity on other hosts, the scope of the
    incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG\u2019s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the gpg
    invocation reveals what led to it and what followed - the parent that staged the
    process, a loader that dropped the encrypted payload, or follow-on execution of a
    decrypted binary. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    defense tampering, or download activity - may reveal the attack stages that
    preceded the gpg encryption and help reconstruct the full timeline. Payload
    decryption and pre-exfiltration encryption are usually mid-chain steps, so prior
    alerts give the context for why files were being encrypted.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's gpg symmetric-encryption
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate workflows can run gpg symmetric encryption. This query
    mirrors the rule's selection structure scoped to this host, so the resulting parent
    and user distribution reflects how this specific firing pattern has historically
    run here, not generic gpg activity. A new parent process, an unexpected account, or
    a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's gpg symmetric-encryption pattern in the
    past week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the gpg symmetric-encryption firing pattern rather
    than generic gpg activity. Many hosts firing the same pattern points to a backup or
    deployment workflow that uses gpg by design; one host or a small unrelated set
    points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_metadata:
      - Image|endswith:
        - \gpg.exe
        - \gpg2.exe
      - Description: "GnuPG’s OpenPGP tool"
      selection_cli:
        CommandLine|contains|all:
        - ' -c '
        - passphrase
      condition: all of selection_*
    fields:
    - host.name
