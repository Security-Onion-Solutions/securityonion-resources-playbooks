name: Potential Excel.EXE DCOM Lateral Movement Via ActivateMicrosoftApp
id: 6a0bb1e5-d57e-43cb-a014-4454c40254bd
description: |
  Detects excel.exe spawning one of the end-of-life Microsoft binaries foxprow.exe,
  schdplus.exe, or winproj.exe. The rule fires when the parent image ends in
  \excel.exe AND the child is one of those three binaries, matched either by its
  OriginalFileName or by an Image path ending in the binary name. Excel's
  ActivateMicrosoftApp DCOM method takes an integer that maps to a legacy app
  (5 = FoxPro/foxprow.exe, 6 = Project/winproj.exe, 7 = SchedulePlus/schdplus.exe)
  and launches it by searching the system PATH, which can be driven remotely over
  RPC. An attacker with local admin and write access to a PATH directory (for
  example a user WindowsApps folder) plants a malicious binary under one of those
  legacy names and invokes the Excel COM object from another host to execute it,
  producing a child of excel.exe on the target. These legacy binaries are rarely
  run interactively, so the investigation should confirm what excel.exe launched,
  whether a remote DCOM/RPC source drove it, what the spawned binary did, and
  whether the same pattern reached other hosts.
type: detection
detection_id: 551d9c1f-816c-445b-a7a6-7a3864720d60
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did excel.exe spawn foxprow.exe, schdplus.exe, or winproj.exe, matching
    what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the parent image ends in \excel.exe AND the child is one of
    foxprow.exe, schdplus.exe, or winproj.exe, identified either by its
    OriginalFileName or by an Image path ending in that name. Read the ParentImage,
    Image, and OriginalFileName from the event and confirm both conditions hold.
    Note which of the three legacy binaries was launched and whether its Image path
    is a normal Office install location or a user-writable directory, since a binary
    under a path such as a user WindowsApps folder is the planted-payload case rather
    than a genuine legacy app.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to run these legacy Microsoft binaries
    under excel.exe?
  context: The binaries foxprow.exe, schdplus.exe, and winproj.exe correspond to
    end-of-life Microsoft applications that are almost never launched on modern
    endpoints, and never as children of Excel in normal use. Knowing whether the
    acting account and host function involve any legacy-app workflow helps separate
    a rare-but-benign invocation from a remotely driven execution. On a standard
    workstation there is no legitimate reason for Excel to spawn these binaries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which legacy binary ran, where does its Image live, and is it the genuine
    Microsoft binary or a planted file under that name?
  context: The detection matches the child by OriginalFileName or by an Image path
    ending in foxprow.exe, schdplus.exe, or winproj.exe, so a file planted under one
    of those names will fire the rule regardless of what it actually is. Identify the
    full Image path and compare the OriginalFileName and signing details against the
    path. A signed Microsoft binary in an Office install directory is a different
    finding than an unsigned or mismatched file running from a user-writable PATH
    location such as a user WindowsApps folder, which is the location an operator
    plants the payload so Excel's PATH search executes it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: How was excel.exe itself started, and was it launched interactively or
    instantiated as a COM object?
  context: The ActivateMicrosoftApp method is reached through Excel's COM
    automation interface, which a remote caller drives by creating an Excel
    Application object over DCOM rather than a user opening a workbook. Look at how
    this excel.exe instance began. An interactive launch from explorer.exe with a
    document on the command line points to ordinary use, while an excel.exe with no
    document and a service or DCOM-related ancestry points to remote COM activation
    that exists only to call ActivateMicrosoftApp.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did an inbound RPC or DCOM connection reach this host around the time
    excel.exe spawned the legacy binary, and from which source?
  context: Remote ActivateMicrosoftApp abuse drives Excel over DCOM, which begins
    with an inbound RPC connection to the endpoint mapper on port 135 followed by
    activity on a dynamically negotiated high port. Correlating an inbound RPC
    connection in the minutes around the spawn identifies the source host that drove
    the execution and distinguishes remote lateral movement from a purely local
    invocation. A known administrative jump host is a different finding than an
    unexpected workstation reaching this machine over RPC.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 135
        Initiated: 'false'
      condition: selection
    fields:
      - SourceIp
      - SourcePort
      - Image
- question: What account authenticated to this host over the network just before
    excel.exe spawned the legacy binary?
  context: Remote DCOM activation requires the caller to authenticate to the target,
    producing a network logon (Event 4624 type 3, or 4648 for explicit credentials)
    shortly before the child process appears. Identifying the logon account and its
    source address attributes the remote invocation and shows whether it used a
    privileged or service account, which is the user-context signal the analytic
    relies on to flag rare or first-time DCOM callers. If Security logon events are
    not collected in this environment, treat the absence as a visibility gap and pivot
    to the inbound RPC source instead.
  range: -10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        LogonType: 3
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
- question: Is excel.exe expected to spawn this child, and what started excel.exe?
  context: An Office application spawning these legacy binaries is the core signal
    for this detection. Tracing how excel.exe was itself created reveals whether the
    chain is interactive (a user opening a workbook) or driven by remote COM
    activation. An excel.exe with no parent document, launched under dcom or service
    infrastructure, that immediately spawns foxprow.exe, schdplus.exe, or winproj.exe
    points to ActivateMicrosoftApp abuse rather than legitimate legacy-app use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same excel.exe instance spawn?
  context: If a remotely activated Excel instance spawned the legacy binary, it may
    have spawned other processes in the same window. Examining the siblings of the
    detected child reveals the full scope of what the COM activation drove. Multiple
    unusual children from one excel.exe, or a follow-on script host or shell, points
    to hands-on execution rather than an isolated legacy-app launch.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the spawned legacy binary do after launch, and what modules did
    it load?
  context: Because the rule matches on filename rather than file identity, the binary
    Excel launched may be an attacker payload using a legacy name. What it does next
    reveals its true purpose. Reviewing the loaded modules and any child processes of
    the spawned binary shows whether it behaves like the inert legacy application or
    loads networking, scripting, or injection libraries consistent with a planted
    payload. If image-load telemetry is not collected in this environment, fall back
    to the spawned binary's own child processes and network connections to characterize
    its behavior.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \foxprow.exe
          - \schdplus.exe
          - \winproj.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
- question: What processes were spawned on this host in the half hour after the
    legacy binary launched?
  context: DCOM lateral movement is a means to an end. After the remote caller drives
    Excel to spawn a binary, the follow-on activity on the host reveals the operator's
    objective, such as deploying tools, accessing data, or further execution. A burst
    of process creation under the spawned binary or the same account shortly after the
    launch points to active hands-on activity rather than a single stray invocation.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \excel.exe
      selection_child:
      - OriginalFileName:
        - foxprow.exe
        - schdplus.exe
        - winproj.exe
      - Image|endswith:
        - \foxprow.exe
        - \schdplus.exe
        - \winproj.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \excel.exe
      selection_child:
      - OriginalFileName:
        - foxprow.exe
        - schdplus.exe
        - winproj.exe
      - Image|endswith:
        - \foxprow.exe
        - \schdplus.exe
        - \winproj.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    Excel DCOM execution was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the lateral movement is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \excel.exe
      selection_child:
      - OriginalFileName:
        - foxprow.exe
        - schdplus.exe
        - winproj.exe
      - Image|endswith:
        - \foxprow.exe
        - \schdplus.exe
        - \winproj.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    Excel-spawned launch reveals what led to it and what followed, including the COM
    activation, reconnaissance, or follow-on execution. Novel parent-child pairs at
    low counts are what to scan for against the high-count noise of routine system
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as credential access,
    reconnaissance, or remote-service activity, may reveal the stages that preceded
    the Excel DCOM execution and help reconstruct the timeline. Lateral movement is
    usually one step in a sequence, so prior alerts give the context for how the
    operator reached this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
