name: Potential Antivirus Software DLL Sideloading
id: e96ff04d-32f5-4213-ac96-b259a2e267d3
description: |
  Detects a DLL whose filename matches a known antivirus or endpoint-security component
  (log.dll, qrt.dll, ashldres.dll, lockdown.dll, vsodscpl.dll, vftrace.dll, wsc.dll,
  DLPPREM32.dll, tmdbglog.dll) being loaded from a location other than the corresponding
  vendor's expected install directory — the rule fires when ANY ONE of those name/path
  branches matches, not when all do. Attackers plant these DLLs beside a legitimate,
  signed vendor executable so the application resolves and runs the attacker's code
  instead (T1574.001), gaining execution, persistence, and potential privilege escalation
  inside a trusted process. A few applications legitimately ship same-named DLLs (Dell
  SARemediation and Canon MyPrinter both carry a log.dll), so the investigation
  establishes which DLL-and-path branch fired, whether the DLL and its loading executable
  are signed and expected on this host, how and when the DLL was written to that path,
  and what the process did after the load.
type: detection
detection_id: 552b6b65-df37-4d3e-a258-f2fc4771ae54
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded DLL match the rule's pattern — an antivirus-component filename loading from outside its vendor's install directory?
  context: |
    The rule is a set of OR'd vendor branches; confirm which one fired. It matches when
    log.dll loads from outside the Bitdefender, Dell SARemediation, Canon MyPrinter,
    Avast, or AVG folders; qrt.dll outside F-Secure Anti-Virus; ashldres.dll,
    lockdown.dll, or vsodscpl.dll outside McAfee; vftrace.dll outside CyberArk Endpoint
    Privilege Manager; wsc.dll outside Avast or AVG; DLPPREM32.dll outside ESET; or
    tmdbglog.dll outside Trend Micro Titanium. Note the exact ImageLoaded path and which
    branch it represents — the branch determines which vendor product (if any) should
    exist on this host and which filter paths would have suppressed a legitimate load.
  range: +/-5m
  answer_sources:
  - alert
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is the security product associated with the alerting DLL name actually deployed on this host?
  context: |
    Each DLL name in this rule belongs to a specific vendor suite. If that product is
    deployed here, the load may be an installer, an upgrade in progress, or a relocated
    component; if the product has never been installed on this host, an AV-named DLL has
    no legitimate reason to exist and was almost certainly staged. Known benign carriers
    of the log.dll name include the Dell SARemediation plugin and the Canon MyPrinter
    folder — check whether the loading application is one of those before treating the
    load as hostile.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a software installation, update, or documented deployment that explains this DLL at this path?
  context: |
    Installers, product migrations, backup restores, and packaging tools sometimes stage
    vendor DLLs in temporary or non-standard directories before moving them into place.
    A deployment record or change ticket covering this host in the alert window is the
    fastest way to close a staging false positive; the absence of one for a DLL sitting
    in a user-writable path shifts weight toward a planted file.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned the executable that loaded this DLL, and is that parent chain expected?
  context: |
    Sideloading rides a legitimate, usually signed, executable — so the loader itself
    often looks clean, and the parent shows how it was set in motion. An explorer.exe
    parent points at a user double-click; a script host, Office application, or archive
    extractor parent points at a delivery chain; services.exe or a scheduled-task host
    points at an already-installed persistence mechanism re-launching the pair. Walk up
    to the parent's own parent if the immediate chain is ambiguous.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What is the full path, command line, and working directory of the executable that loaded the DLL?
  context: |
    Sideloading requires the planted DLL to sit in the loader's search path — almost
    always the executable's own directory. A vendor-signed executable running from
    Downloads, Temp, AppData, ProgramData, or Public with an AV-named DLL beside it is
    the classic planted pairing; the same executable running from its vendor's install
    directory shifts the question to why the DLL resolved from elsewhere. The working
    directory also participates in DLL search order, so note it alongside the image path.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What other modules did the loading process pull in, and did any others resolve from non-canonical paths or arrive unsigned?
  context: |
    The full module list tells you whether this was a single planted DLL or a staged
    toolkit. Look for additional DLLs loading from the same non-vendor directory as the
    alerting module, unsigned modules in directories where signed ones are expected, and
    system-named DLLs resolving from the application directory instead of System32 —
    each is an independent instance of the same search-order abuse.
  range: +/-5m
  answer_sources:
  - image_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and threat-intel reputation of the alerting DLL?
  context: |
    Genuine antivirus components are signed by their vendor. An AV-named DLL that is
    unsigned, carries an invalid or expired signature, or is signed by a subject
    unrelated to the product it impersonates is a planted substitute. The load event
    carries the module hash directly — pivot it through threat intelligence for known
    loader families, and compare it against the hash of the same-named DLL inside a
    legitimate install of that product; a mismatch confirms substitution.
  range: +/-5m
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: When was this DLL written to the alerting path, and by what process and user?
  context: |
    The write event establishes plant time and actor. Correlate the file-creation time
    against the module load — a copy performed by a script host, archive extractor, or
    remote-transfer utility minutes before the load is the plant action, while a write
    months earlier by an installer suggests long-standing software. If no write event
    exists in the retention window, the file predates visibility; recover it from disk
    for manual review. Endpoint telemetry does not record alternate data streams or
    origin markers, so mark-of-the-web inspection on the recovered file is a manual step.
  range: -30d
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Is the sideloaded DLL still on disk, and what other files did the loading process write?
  context: |
    If the DLL and its co-located executable are still present, preserve copies before
    any remediation — hashes, sandbox detonation, and content review all depend on them.
    File writes by the alerting process and its direct children also surface payload
    output, staged second stages, and decoy artifacts created after the malicious code
    gained execution.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were execution-flow registry values modified on this host around the alert?
  context: |
    Hijack-execution-flow activity frequently pairs a planted DLL with registry changes
    that make the redirect durable — Run or RunOnce values launching the relocated
    loader, service ImagePath edits, COM InprocServer32 server paths, App Paths
    overrides, or Image File Execution Options debugger values. Review the value data
    for paths in user-writable directories and compare service and COM registrations
    against their expected baselines for this host.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_flow:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\CurrentVersion\App Paths\'
          - '\Image File Execution Options\'
          - '\InprocServer32'
          - '\Services\'
      condition: selection and selection_flow
    fields:
      - TargetObject
      - Details
      - Image
- question: What child processes did the loading executable spawn after the DLL load?
  context: |
    Once the planted DLL runs inside the trusted loader, follow-on execution commonly
    appears as children — command shells, script hosts, rundll32, or binaries launched
    from user-writable paths. Children created shortly after the load are the payload's
    first actions; a loader with no children may instead operate entirely in-process,
    which makes the network and file-write views the primary follow-on evidence.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the loading process initiate outbound network connections after the module load?
  context: |
    Sideloaded payloads execute inside a legitimate-looking process, so command-and-
    control traffic originates from an executable an analyst might otherwise trust.
    Outbound connections to external addresses from a loader that has no update or
    cloud-lookup function are the follow-on signal; genuine AV components do talk to
    their vendor's infrastructure, so weigh destinations against the product actually
    installed on this host.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Does this host normally run the executable that loaded the DLL?
  context: |
    A loader binary appearing on this host for the first time alongside a first-seen DLL
    is the staged-pair pattern; a binary with months of execution history is more likely
    an installed product whose library resolution changed. Pair the historical count
    with the deployment check — long history for a product that asset inventory says is
    installed points at a benign explanation.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this DLL been loaded on this host before, and by which processes?
  context: |
    A first-time module load is a stronger anomaly than a recurring one. If the same DLL
    path has been loaded by the same executable repeatedly over the past 90 days, this
    load is part of an established pattern — possibly a long-standing false positive
    worth a tuning filter. A first occurrence, or a history in which entirely different
    processes loaded it, marks the current load as new behavior on this host.
  range: -90d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this DLL being loaded on other hosts in the environment, and by which processes?
  context: |
    Cross-host correlation separates a localized plant from distribution. The same
    AV-named DLL loading from non-vendor paths on multiple hosts within the window
    suggests a deployment mechanism — software distribution, a shared image, or an
    operator moving laterally with the same loader pair. Compare the loading processes
    across hosts; a single consistent legitimate application argues for a fleet-wide
    false positive and a tuning filter instead.
  range: -7d
  answer_sources:
  - image_load
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were other persistence mechanisms installed on this host around the DLL load?
  context: |
    A sideloaded pair persists only if something re-launches the loader, and operators
    rarely rely on a single mechanism. Scheduled tasks, service registrations, Run-key
    writes via reg.exe, BITS jobs, or WMI subscriptions created in the surrounding hours
    show whether the load is one component of a stacked foothold rather than an isolated
    event.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the surrounding
    sequence — the delivery or extraction step before the load, and shell or script
    activity after it. Novel low-count pairs stand out against repetitive agent noise
    and help place the DLL load inside the host's larger timeline.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections on the same host — download activity, archive extraction, script
    execution, defense tampering — may capture the stages that delivered the DLL and its
    loader, and help reconstruct the timeline from arrival to load.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
