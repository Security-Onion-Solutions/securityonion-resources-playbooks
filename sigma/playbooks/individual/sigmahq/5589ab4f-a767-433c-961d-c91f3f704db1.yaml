name: Potential SMB Relay Attack Tool Execution
id: dd6aaec2-811a-4293-9e15-567b65c23dfb
description: |
  Detects execution of hacktools associated with NTLM relay and coercion
  attacks used for local or domain privilege escalation. The rule fires when a
  process matches at least one of three independent branches: an image name
  containing a known relay/coercion tool (PetitPotam, RottenPotato, HotPotato,
  JuicyPotato, LocalPotato, SpoolSample, Responder, smbrelayx, ntlmrelayx, the
  rot.exe / just_dce_ Rotten Potato artifacts), or a command line containing a
  relay/coercion script pattern (Invoke-Tater, Invoke-PetitPotam, smbrelay,
  ntlmrelay, cme smb, an /ntlm: hash argument, the -t * -p launch pattern), or
  the JuicyPotato CLSID-enumeration command structure (a -c "{...}" -z token owner
  test); it does not fire when the image matches the HotPotatoes educational
  software (the rule's false-positive filter). These tools coerce or poison
  authentication and relay the captured NTLM credential to gain a privileged
  token, commonly ending in SYSTEM on the local host or admin access on a relayed
  target. The same tool names are occasionally legitimate file names, and these
  tools also appear in authorized penetration tests, so the investigation should
  confirm which branch fired, identify the specific tool and capability, and
  determine whether relayed authentication led to service creation, new logons,
  or lateral movement.
type: detection
detection_id: 5589ab4f-a767-433c-961d-c91f3f704db1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did the process match one of this rule's branches - a relay/coercion
    tool image name, a relay/coercion command-line pattern, or the JuicyPotato
    CLSID-test command structure?
  context: Before investing investigation time, confirm the alert is a true
    positive. The rule fires when at least one of three independent branches
    matches and the HotPotatoes educational-software filter does not - either the
    Image contains a known relay/coercion tool name (PetitPotam, RottenPotato,
    JuicyPotato, LocalPotato, SpoolSample, Responder, smbrelayx, ntlmrelayx, the
    rot.exe / just_dce_ artifacts), or the CommandLine contains a script pattern
    (Invoke-Tater, Invoke-PetitPotam, smbrelay, ntlmrelay, cme smb, an /ntlm hash
    argument, or the -t * -p launch pattern), or the CommandLine carries the
    JuicyPotato -c "{...}" -z token-owner test. Read the exact Image and command
    line and note which branch fired - the image branch points at a renamed-but-
    recognizable binary, while the command-line branches point at script or
    enumeration usage. The branch that fired determines which downstream questions
    carry weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this relay or coercion tool execution part of an authorized
    penetration test or red team engagement?
  context: Relay and coercion tools such as Responder, ntlmrelayx, PetitPotam, and
    the Potato family are standard in authorized security assessments. Before
    investing investigation time, check whether a pentest or red team exercise is
    currently active on this host or network segment. An authorized engagement with
    matching tool usage and timing resolves the alert without further analysis; if
    no engagement is scoped to this host, treat the execution as unsanctioned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run NTLM relay or coercion tooling?
  context: Relay and coercion tooling has no routine administrative use on most
    endpoints. Knowing whether the acting account and the host function involve
    sanctioned security testing or red team infrastructure is often the fastest path
    to separating an authorized assessment from unsanctioned privilege-escalation
    activity. A standard user workstation or server account running these tools is a
    different finding than a dedicated testing host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which relay or coercion capability was invoked, and what target did the
    command line specify?
  context: These tools serve distinct roles in a relay chain. Coercion tools
    (PetitPotam, SpoolSample, Invoke-PetitPotam) force a target to authenticate;
    poisoning tools (Responder, Invoke-Tater) answer name-resolution queries to
    capture authentication; relay tools (ntlmrelayx, smbrelayx, cme smb) forward the
    captured NTLM credential to another host; local-escalation tools (the Potato
    family, with the -c "{CLSID}" -z token test or -t * -p launch) reflect
    authentication locally to obtain a SYSTEM token. Read the command line to
    identify which capability ran and any target host, CLSID, or hash argument it
    carried - this determines the scope of potential compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What authentication or credential was targeted by the relay - a coerced
    target host, a relayed NTLM hash, or a locally reflected SYSTEM token?
  context: Relay and coercion tools target authentication rather than a credential
    store on disk. A coercion tool names the victim host it forces to authenticate;
    a relay tool names the downstream target it forwards the credential to and may
    carry an /ntlm hash argument; a local Potato reflects authentication through a
    COM CLSID to mint a SYSTEM token on this host. Read the full command line to
    identify which authentication was captured or reflected and which accounts or
    hosts it implicates, since that determines which credentials must be treated as
    exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this relay tool, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. A coercion or relay
    tool launched from an interactive console or a known testing harness reads
    differently than one spawned by a script host, mshta.exe, an Office application,
    or a service process. The parent is where the execution decision was made, so an
    unexpected parent points to automated or unsanctioned invocation rather than
    hands-on testing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was a new service created on this host around the alert, or was the
    multicast name-resolution policy re-enabled in a way consistent with relay
    follow-on?
  context: A successful local relay typically ends by creating a service that runs an
    arbitrary command as SYSTEM, and poisoning setups sometimes re-enable LLMNR by
    flipping the DNSClient EnableMulticast policy. This query surfaces service-control
    invocations on the host in the window around the alert so the analyst can correlate
    a relay tool launch with a follow-on SYSTEM-context service install. If service
    creation and security-log audit events are not collected in this environment,
    treat an empty result as a visibility gap rather than evidence nothing happened,
    and confirm the EnableMulticast registry policy state directly on the host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_service_create:
        - Image|endswith:
          - '\sc.exe'
          - '\powershell.exe'
          CommandLine|contains:
          - 'create'
          - 'New-Service'
          - 'config'
        - CommandLine|contains:
          - 'EnableMulticast'
      condition: selection_host and selection_service_create
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts or hosts may be compromised by this relay, and do any have
    elevated privileges?
  context: The severity of a relay attack depends on what authentication was captured
    and where it was relayed. A relayed domain admin or service account, or a SYSTEM
    token obtained on a domain-joined host, requires incident escalation; a coerced
    machine account or standard user has narrower impact. Cross-reference the acting
    account, any target host named in the command line, and the host's own machine
    account against directory group memberships to determine the blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the relay tool process write characteristic artifacts to disk on
    this host?
  context: Relay and coercion tooling leaves recognizable file artifacts - Responder
    writes captured-hash logs and a session database, ntlmrelayx and smbrelayx write
    dumped SAM or secrets output, and the Potato family may drop a renamed payload
    such as the rot.exe artifact. Checking for files written by the tool's process
    confirms execution and reveals the scope of activity even if the original process
    has exited. Pivot from the file paths to read captured credentials or relay output
    where present.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
        Image|contains:
        - PetitPotam
        - RottenPotato
        - HotPotato
        - JuicyPotato
        - \just_dce_
        - Juicy Potato
        - \temp\rot.exe
        - \Potato.exe
        - \SpoolSample.exe
        - \Responder.exe
        - \smbrelayx
        - \ntlmrelayx
        - \LocalPotato
      selection_script:
        CommandLine|contains:
        - Invoke-Tater
        - ' smbrelay'
        - ' ntlmrelay'
        - 'cme smb '
        - ' /ntlm:NTLMhash '
        - Invoke-PetitPotam
        - '.exe -t * -p '
      selection_juicypotato_enum:
        CommandLine|contains: .exe -c "{
        CommandLine|endswith: '}" -z'
      filter_hotpotatoes:
        Image|contains:
        - HotPotatoes6
        - HotPotatoes7
        - 'HotPotatoes '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
        Image|contains:
        - PetitPotam
        - RottenPotato
        - HotPotato
        - JuicyPotato
        - \just_dce_
        - Juicy Potato
        - \temp\rot.exe
        - \Potato.exe
        - \SpoolSample.exe
        - \Responder.exe
        - \smbrelayx
        - \ntlmrelayx
        - \LocalPotato
      selection_script:
        CommandLine|contains:
        - Invoke-Tater
        - ' smbrelay'
        - ' ntlmrelay'
        - 'cme smb '
        - ' /ntlm:NTLMhash '
        - Invoke-PetitPotam
        - '.exe -t * -p '
      selection_juicypotato_enum:
        CommandLine|contains: .exe -c "{
        CommandLine|endswith: '}" -z'
      filter_hotpotatoes:
        Image|contains:
        - HotPotatoes6
        - HotPotatoes7
        - 'HotPotatoes '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    relay tool execution was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
        Image|contains:
        - PetitPotam
        - RottenPotato
        - HotPotato
        - JuicyPotato
        - \just_dce_
        - Juicy Potato
        - \temp\rot.exe
        - \Potato.exe
        - \SpoolSample.exe
        - \Responder.exe
        - \smbrelayx
        - \ntlmrelayx
        - \LocalPotato
      selection_script:
        CommandLine|contains:
        - Invoke-Tater
        - ' smbrelay'
        - ' ntlmrelay'
        - 'cme smb '
        - ' /ntlm:NTLMhash '
        - Invoke-PetitPotam
        - '.exe -t * -p '
      selection_juicypotato_enum:
        CommandLine|contains: .exe -c "{
        CommandLine|endswith: '}" -z'
      filter_hotpotatoes:
        Image|contains:
        - HotPotatoes6
        - HotPotatoes7
        - 'HotPotatoes '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    relay tool launch reveals what led to it and what followed - the parent that staged
    the tool, reconnaissance, or follow-on execution that used the relayed credential.
    Novel parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously fired the rule's relay-tool pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned testing can trip this rule. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic process activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
        Image|contains:
        - PetitPotam
        - RottenPotato
        - HotPotato
        - JuicyPotato
        - \just_dce_
        - Juicy Potato
        - \temp\rot.exe
        - \Potato.exe
        - \SpoolSample.exe
        - \Responder.exe
        - \smbrelayx
        - \ntlmrelayx
        - \LocalPotato
      selection_script:
        CommandLine|contains:
        - Invoke-Tater
        - ' smbrelay'
        - ' ntlmrelay'
        - 'cme smb '
        - ' /ntlm:NTLMhash '
        - Invoke-PetitPotam
        - '.exe -t * -p '
      selection_juicypotato_enum:
        CommandLine|contains: .exe -c "{
        CommandLine|endswith: '}" -z'
      filter_hotpotatoes:
        Image|contains:
        - HotPotatoes6
        - HotPotatoes7
        - 'HotPotatoes '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_* and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's relay-tool pattern in the past week, and
    does the cross-host distribution look like sanctioned testing or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the relay/coercion firing pattern rather than generic
    process activity. Many hosts firing the same pattern points to a scheduled assessment
    or scripted deployment; one host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
