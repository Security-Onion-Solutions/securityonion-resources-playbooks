name: Potential Credential Dumping Via LSASS SilentProcessExit Technique
id: 4016559b-0a0f-4034-ae8c-a2c998e3c921
description: |
  Detects a registry write under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SilentProcessExit\lsass.exe, which
  registers lsass.exe for the Windows Silent Process Exit mechanism. When lsass.exe is monitored this way, WerFault.exe
  (Windows Error Reporting) writes a full memory dump of lsass to an attacker-chosen directory when the monitored exit
  condition fires, without crashing lsass and while blending in with routine error-reporting behavior. The technique
  requires local administrator rights and is typically paired with a GlobalFlag value under the Image File Execution
  Options key for lsass.exe. Determine what values were written, which process wrote them, whether the paired IFEO value
  was also set, whether an lsass memory dump landed on disk, and whether credential-access or lateral-movement activity
  followed.
type: detection
detection_id: 55e29995-75e7-451a-bef0-6225e2f13597
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the modified registry key match the SilentProcessExit\lsass.exe path this rule detects?
  context: >-
    Confirm the alert is a true positive by verifying the triggering event modified a value under
    Microsoft\Windows NT\CurrentVersion\SilentProcessExit\lsass.exe, and note the writing process. The rule fires on
    this key path, which registers lsass.exe for Silent Process Exit monitoring; the value data itself is examined in
    the value-decode question to establish what dumping behavior was configured.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a process for Silent Process Exit monitoring?
  context: >-
    Registering a system process such as lsass.exe for Silent Process Exit is not a routine administrative action and
    requires local administrator rights. If the writing user is a standard workstation user, or the host has no reason
    to have error-reporting monitoring reconfigured for lsass, the modification is hard to explain as normal operation.
    User attribution is present on most endpoint registry events; when it resolves to a machine account or is missing,
    judge legitimacy from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written under SilentProcessExit\lsass.exe, and what dumping behavior does it configure?
  context: >-
    The Silent Process Exit configuration is built from several values under the lsass.exe subkey. ReportingMode enables
    the monitoring, DumpType/DumpFolder (or LocalDumpFolder) select a full memory dump and its output directory, and a
    MonitorProcess value can point at an attacker binary launched when lsass exits. Read the Details field for a dump
    output path or a MonitorProcess executable path. If the value data is not captured in this environment, because
    binary or empty data is not always recorded, treat the registration as suspicious on the key path alone and confirm
    the values directly on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the SilentProcessExit key a known credential-access or persistence location, and what does registering lsass.exe change?
  context: >-
    The Silent Process Exit and Image File Execution Options keys under Microsoft\Windows NT\CurrentVersion govern how
    Windows Error Reporting handles a monitored process. Registering lsass.exe here causes WerFault.exe to dump lsass
    memory on exit, and the same mechanism can launch a MonitorProcess binary on exit, so the location supports both
    credential access and event-triggered execution. Modifications here are not routine configuration; the exact value
    written and the writing process determine whether lsass dumping or payload execution was set up.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was LSASS memory targeted, and by what dumping method?
  context: >-
    This registration configures lsass memory dumping indirectly, through WerFault.exe rather than a direct handle open
    or an in-line dumping tool, so identify the configured method from the values written -- a dump folder implies a
    WerFault memory dump, and a MonitorProcess path implies an attacker binary launched on exit. Handle-access telemetry
    for the read of lsass memory is not collected on this platform, so the read side of the dump is a visibility blind
    spot; reason about the access from the configuration and the resulting dump file rather than from a handle-open event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this key, and is its parent chain expected?
  context: >-
    A legitimate change to error-reporting configuration would come from a management or installer workflow. Tracing the
    writing process back to its parent shows whether the registration originated from an administrative tool or from an
    interactive shell or scripting host. Known security tooling accessing lsass is expected; reg.exe, powershell.exe, or
    an unsigned binary spawned from an unusual parent writing this key is a reason to escalate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was a process-memory dump file written to a temporary directory on this host after the registration?
  context: >-
    When the Silent Process Exit condition fires, WerFault.exe writes a full lsass memory dump, commonly named
    lsass.dmp or similar, into the configured folder -- frequently under a Temp, Windows\Temp, or ProgramData path. A
    .dmp file in one of these directories following the registration is the credential-bearing artifact this technique
    produces. The dump folder is attacker-chosen, so if nothing matches here, broaden the search to the LocalDumpFolder
    or DumpFolder path read from the registry value data.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.dmp'
        TargetFilename|contains:
          - '\Temp\'
          - '\Windows\Temp\'
          - '\ProgramData\'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
- question: Did the configured dumping take effect, and did WerFault or a MonitorProcess binary run afterward?
  context: >-
    The payoff for this registration is an lsass dump generated by WerFault.exe, or execution of a MonitorProcess binary
    when lsass exits. Review process execution on the host afterward for WerFault.exe activity around an lsass exit and
    for the MonitorProcess path read from the registry value. The classic in-line dumpers such as procdump, rundll32
    with comsvcs.dll MiniDump, or a mimikatz-style tool are worth checking too, though this technique achieves the dump
    through Windows Error Reporting rather than those tools. The query anchors on WerFault.exe activity and on
    command lines carrying the written value data; if the flagged write was a ReportingMode or DumpType DWORD
    rather than the MonitorProcess or dump-folder path, that anchor is a number and may match nothing — a zero
    then means WerFault never fired, and the dump-file question covers the on-disk artifact.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_wer:
        Image|endswith: '\WerFault.exe'
      selection_wer_child:
        ParentImage|endswith: '\WerFault.exe'
      selection_monitor:
        CommandLine|contains|expand: '%Details%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: Were other registry values modified on this host in the same session, including a GlobalFlag under Image File Execution Options for lsass.exe?
  context: >-
    The Silent Process Exit dump normally requires a paired GlobalFlag value under Image File Execution
    Options\lsass.exe to enable silent-exit reporting, so the classic pairing is the SilentProcessExit\lsass.exe values
    together with that IFEO GlobalFlag write. Grouping registry modifications on this host in the surrounding window
    shows whether the paired IFEO value was also set and whether other defense or credential settings were changed in
    the same session, which distinguishes a hands-on operation from an isolated change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the SilentProcessExit\lsass.exe key been modified before on this host?
  context: >-
    Error-reporting monitoring for a system process such as lsass.exe should rarely, if ever, be configured on a normal
    endpoint. A history of prior modifications with the same value and writing process could reflect a recurring managed
    baseline; zero prior history, or a change written by a process that has never touched this key before, indicates a
    first-time registration that deserves scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same SilentProcessExit key modified on other hosts in the environment?
  context: >-
    The same registration across many hosts with a consistent value and writing process would be unusual for this key
    and, if present, points to a scripted rollout rather than a benign baseline. A change confined to this host, or one
    written by an ad-hoc process, looks targeted. Compare the value data and writing process across hosts to separate
    coordinated activity from a single-host action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by lateral movement. The query returns outbound connections from this host to
    remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event;
    the originating Image and User show what drove each connection. Two limits to keep in mind -- credentials harvested
    from the lsass dump and replayed from another machine will not appear here (check interactive and network logons on
    suspected targets for these accounts), and the query requires host network telemetry; if that is not collected from
    this host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed, and do any have elevated privileges?
  context: >-
    An lsass memory dump exposes the credentials of every account with an active session or cached secret on the host,
    so the severity depends on who was logged on. Domain admin, enterprise admin, or broadly privileged service accounts
    with sessions on this host require incident escalation; a single standard-user session narrows the exposure. Cross-
    reference the accounts that had sessions on this host with directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry write rarely happens in isolation. Aggregating process executions around the alert surfaces what led to
    the registration and what followed it, and lets novel parent-child pairs stand out against routine agent and system
    noise. This complements the registry-only view by showing the execution context that drove the setting change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- reconnaissance, privilege escalation, or defense tampering -- may reveal the
    stages that preceded this registration and help reconstruct the timeline. Configuring lsass dumping requires
    administrator rights, so it is usually reached only after an actor has already gained privileged access; preceding
    alerts help place this event in the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
