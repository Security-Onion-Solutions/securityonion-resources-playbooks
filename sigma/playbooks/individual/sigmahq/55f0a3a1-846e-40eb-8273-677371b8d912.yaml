name: Outlook EnableUnsafeClientMailRules Setting Enabled
id: 108c2662-e708-428e-93cd-1afc1024d779
description: |
  Detects a process whose command line references the Outlook security setting
  \Outlook\Security\EnableUnsafeClientMailRules. This registry value re-enables
  the "Start an application" and "Run a script" mail-rule actions that modern
  Outlook builds disable by default, allowing a client-side inbox rule to launch
  a program when a matching message arrives. The rule fires when a single
  process command line contains that registry path. Some administrative or
  diagnostic workflows may touch this value, but enabling unsafe client mail
  rules is a known mailbox-persistence step: an actor sets the value, creates a
  rule whose action points to a self-contained payload hosted over SMB/UNC or
  WebDAV, and the payload runs from outlook.exe when the trigger message is
  delivered. The investigation should determine which process and command set
  the value, whether the value enables the unsafe actions, what parent launched
  it, what executed afterward, and whether the same pattern appears elsewhere on
  the host or fleet.
type: detection
detection_id: 55f0a3a1-846e-40eb-8273-677371b8d912
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line reference \Outlook\Security\EnableUnsafeClientMailRules,
    matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process command line contains the registry path
    \Outlook\Security\EnableUnsafeClientMailRules. Read the exact command line and
    note which tool set the value, what value is being written, and whether the
    operation enables (DWORD 1) or queries the setting. A write of 1 re-enables the
    unsafe "Start an application" and "Run a script" mail-rule actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to modify Outlook mail-rule security settings?
  context: Re-enabling unsafe client mail rules is not part of normal end-user Outlook
    use; the actions were disabled by default specifically because they are abused
    for mailbox persistence. A small set of administrators or support staff may touch
    Outlook policy values, but most users and most endpoints never write this
    setting. Knowing whether the acting account and host function involve Outlook or
    Office administration is often the fastest way to separate a sanctioned change
    from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the command do to the EnableUnsafeClientMailRules value,
    and was it set to 1?
  context: The full command line reveals the specific action taken against the
    setting. Decode the tool and its arguments - a reg.exe or PowerShell write that
    sets the value to DWORD 1 re-enables the unsafe rule actions, while a read or a
    value of 0 does not. Identify which Outlook version key was targeted and whether
    the same invocation also touched related values such as Level,
    LoadMacroProviderOnBoot, EnableRoamingFolderHomepages, or NonDefaultStoreScript,
    which indicate a broader Outlook persistence setup.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: Which executable carried the EnableUnsafeClientMailRules command line, and
    is that binary expected to write Outlook policy values?
  context: The rule constrains only the command line, not the image, so any process
    can carry the registry path. Identify the executable that ran with the token and
    where it lives. A signed administrative tool such as reg.exe or powershell.exe
    launched interactively by an Office administrator is a different finding than the
    same write coming from an unknown binary, a script host, or a process running
    from a user-writable directory. The image and command line together identify what
    actually set the value.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What process spawned the process that set this value, and is that parent
    chain expected?
  context: The parent process reveals how the setting was changed. Interactive
    administration usually shows a console shell, an IDE, or a management tool launched
    from explorer.exe. An unexpected parent such as outlook.exe, mshta.exe,
    wscript.exe, cscript.exe, or an Office application points to automated or malicious
    invocation - mail-rule and macro abuse is frequently driven from the Outlook
    process itself or from a script host rather than by an administrator at a console.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did outlook.exe spawn a command interpreter, script host, or signed-binary
    proxy on this host around the alert?
  context: A client mail rule with the unsafe actions enabled executes its payload
    through outlook.exe when a trigger message arrives. Outlook normally spawns Office
    child processes, not interpreters. Children such as cmd.exe, powershell.exe,
    pwsh.exe, wscript.exe, cscript.exe, rundll32.exe, regsvr32.exe, mshta.exe,
    msiexec.exe, or curl.exe under an outlook.exe parent indicate the rule action
    firing or a related Office-launched stage. Treat any such child as the execution
    the setting was enabled to allow.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_parent:
        ParentImage|endswith: \outlook.exe
      selection_children:
        Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \mshta.exe
          - \msiexec.exe
          - \curl.exe
          - \bitsadmin.exe
      condition: selection_host and selection_parent and selection_children
    fields:
      - Image
      - CommandLine
      - User
- question: Did outlook.exe launch a child process whose image path points to a UNC,
    WebDAV, or MUP location on this host?
  context: Outlook mail-rule actions execute through ShellExec and pass no arguments
    to the payload, so the payload is usually a self-contained binary hosted on an
    SMB/UNC share or a WebDAV server rather than a local file. An outlook.exe parent
    with a child whose image path begins with a double backslash UNC prefix or
    resolves through \Device\Mup\ is the execution artifact of an enabled unsafe rule.
    Identify the remote path and host it resolves to.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_parent:
        ParentImage|endswith: \outlook.exe
      selection_remote:
        Image|contains:
          - \\
          - \Device\Mup\
      condition: selection_host and selection_parent and selection_remote
    fields:
      - Image
      - CommandLine
      - User
- question: Did outlook.exe or a child it launched make outbound network connections
    on this host around the alert?
  context: Fetching a self-contained rule payload over WebDAV or SMB means outlook.exe
    or its child reaches out to a remote host, often over ports 80 or 443 to a
    non-corporate address. Outlook normally connects to mail infrastructure, not
    arbitrary external IPs, so unexpected egress from the Outlook process or its child
    is the network-side artifact of mail-rule payload retrieval. Review the
    destination address and port against known mail and proxy endpoints.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        Image|endswith:
          - \outlook.exe
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \wscript.exe
          - \cscript.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \mshta.exe
          - \curl.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - User
- question: Were Outlook persistence artifacts such as VbaProject.OTM or staged
    payloads written under the user's Outlook or Forms profile on this host?
  context: Mail-rule and macro abuse leaves files on disk alongside the registry
    change. A VbaProject.OTM under the roaming Outlook profile, cached forms under the
    local Forms directory, or a staged executable written before the rule is created
    all corroborate a persistence setup rather than a one-off setting change. Look for
    recent writes under the acting user's Outlook profile and Forms cache and at the
    paths referenced in any created rule.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Microsoft\Outlook\VbaProject.OTM
          - \Microsoft\Outlook\
          - \Microsoft\Forms\
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    enabling unsafe mail rules was a single event or part of activity spanning
    multiple endpoints. If the same user touched Outlook settings or ran follow-on
    tools on other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    mail-rule setting change reveals what led to it and what followed - the parent
    that staged the process, reconnaissance, credential access, or the follow-on
    execution the unsafe rule was meant to enable. Novel parent-child pairs at low
    counts are what to scan for against the high-count noise of routine system
    processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - valid-account abuse, reconnaissance,
    credential access, or other Office or persistence activity - may reveal the attack
    stages that preceded enabling unsafe mail rules and help reconstruct the full
    timeline. Mailbox persistence is usually one step in a sequence, so prior alerts
    give the context for why the setting was changed.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's EnableUnsafeClientMailRules
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned administration can touch this value. This query mirrors the
    rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic process activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's EnableUnsafeClientMailRules pattern in
    the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the EnableUnsafeClientMailRules firing pattern
    rather than generic process activity. Many hosts firing the same pattern points to
    a managed configuration push or scripted deployment that sets the value by design;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains: \Outlook\Security\EnableUnsafeClientMailRules
      condition: selection
    fields:
    - host.name
