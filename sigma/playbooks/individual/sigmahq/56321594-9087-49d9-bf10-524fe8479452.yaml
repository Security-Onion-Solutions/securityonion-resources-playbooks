name: Potential Persistence Via Netsh Helper DLL
id: 6102b9c4-d3ea-4e79-8b37-035cf8541a6e
description: |
  Detects netsh.exe run with both the "add" and "helper" tokens on its command
  line, which registers a NetShell helper DLL. The rule fires when the process is
  netsh.exe (by image name or original filename) AND the command line contains
  both "add" and "helper". Registering a helper DLL writes a value under
  HKLM\SOFTWARE\Microsoft\Netsh, after which every subsequent run of netsh.exe
  loads that DLL and executes its InitHelperDll entry point - a persistence and
  code-execution proxy. The helper DLL can live anywhere readable by the running
  context, including user-writable directories, and netsh is not started at boot,
  so an actor typically pairs this registration with a separate trigger. Some
  software and VPN clients register helpers legitimately, so the investigation
  should determine which DLL was registered, where it came from, what parent
  launched netsh, whether the registry value and DLL load are visible, and whether
  the same pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 56321594-9087-49d9-bf10-524fe8479452
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Was netsh.exe run with both the add and helper tokens on its command line,
    matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the process is netsh.exe (by image name or original filename)
    and the command line contains both "add" and "helper". Read the full command line
    and identify the DLL path passed to "add helper" - that path is the helper DLL
    being registered for persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to register netsh helper DLLs?
  context: Registering a NetShell helper is rare administrative activity, performed
    by a small set of networking software, VPN clients, and IT tooling. Most users and
    most endpoints never run "netsh add helper". Knowing whether the acting account and
    the host function involve network-stack configuration is often the fastest path to
    separating a legitimate deployment from an actor establishing a persistence proxy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which DLL path did this netsh add helper command register, and where does
    that DLL live?
  context: The command line carries the full registration. Decode the path passed to
    "add helper" and note where the DLL resides. A helper DLL under C:\Windows\System32
    alongside the OS-provided helpers is a different finding than one under a
    user-writable directory such as %APPDATA% or a temp path, which a non-privileged
    context can write to and which legitimate helpers do not use. The path identifies
    the file to pull for signing and reputation analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\netsh.exe'
        CommandLine|contains|all:
          - add
          - helper
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned netsh.exe, and what started that parent?
  context: Whatever launched netsh.exe is where the helper-registration decision was
    made. Interactive administration usually shows a console shell or a management
    tool; an unexpected parent such as a script host, mshta.exe, an Office application,
    or an unknown binary from a user-writable path points to automated or malicious
    invocation. Tracing the parent's own origin reveals whether the chain is a routine
    deployment or an actor staging persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If the parent that launched netsh.exe is suspicious, it likely spawned other
    processes too. Examining siblings reveals the full scope of activity from that
    parent - a helper-DLL registration alongside reconnaissance, a download, or a
    scheduled-task creation from the same parent indicates orchestrated activity rather
    than an isolated administrative action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a value written under HKLM\SOFTWARE\Microsoft\Netsh on this host around
    the time of the alert?
  context: The persistent artifact of a helper-DLL registration is a value under
    HKLM\SOFTWARE\Microsoft\Netsh; the command line is the action, but this registry
    value is what survives and causes netsh to load the DLL on every later run. If
    registry-set telemetry is collected, a new value here corroborates the
    registration and names the helper. If it is not collected, treat the absence of
    rows as a visibility gap rather than evidence nothing was written, and confirm the
    registration from the command line directly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SOFTWARE\Microsoft\Netsh'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Did netsh.exe load a helper DLL from a non-System32 path on this host?
  context: A registered helper DLL is loaded by netsh.exe on every subsequent run.
    Legitimate helpers live under C:\Windows\System32; a DLL loaded by netsh.exe from a
    user-writable or otherwise unusual directory is the execution half of this
    persistence primitive and indicates a planted helper. If module-load telemetry is
    collected, this surfaces the actual loaded file for signing and reputation review;
    if it is not collected, the command-line path identifies the DLL to inspect on disk.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\netsh.exe'
      filter_system32:
        ImageLoaded|contains:
          - '\Windows\System32\'
          - '\Windows\SysWOW64\'
      condition: selection and not filter_system32
    fields:
      - ImageLoaded
      - Image
      - User
- question: Was there a change ticket, maintenance window, or documented approval for
    registering this netsh helper DLL?
  context: Persistence-relevant changes such as registering a NetShell helper are
    typically gated by change control in managed environments. A corresponding ticket
    or a known software deployment that registers a helper suggests authorized activity;
    the absence of one when policy requires it shifts the disposition toward
    unauthorized persistence and warrants confirming what the registered DLL is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was netsh.exe executed from its expected System32 path?
  context: netsh.exe run from a non-standard path (outside System32 or SysWOW64) may
    indicate the binary was copied or renamed to evade path-based allowlists. Compare
    the image path and original filename in the alert - a netsh.exe running from a
    user's temp or profile directory is more suspicious than one in System32, and a
    mismatch between the image name and the original filename indicates a renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other persistence or defense-tampering LOLBins used on this host recently?
  context: An actor who registers a netsh helper for persistence often pairs it with
    other persistence or tampering primitives. Finding schtasks, sc, reg, at, wevtutil,
    bcdedit, vssadmin, or similar built-in tools used on the same host within the same
    window strengthens the case for deliberate persistence and reveals backup
    mechanisms or trigger installation that the helper registration relies on.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\wmic.exe'
          - '\bitsadmin.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the rule's netsh add helper pattern over the
    past 90 days, and what command-line structures are typical?
  context: A netsh helper-registration pattern with no prior history on a host is more
    suspicious than one that recurs under stable automation. This query mirrors the
    rule's selection structure scoped to this host, so the resulting count reflects the
    rule's specific firing pattern rather than generic netsh usage. The command-line
    projection lets the analyst compare the helper paths seen historically against the
    alerting one - a first-ever occurrence or a new DLL path is the anomaly worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: netsh.exe
      - Image|endswith: \netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - add
        - helper
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired the rule's netsh add helper pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the netsh helper-registration pattern rather than
    generic netsh usage. Many hosts firing the same pattern points to a software
    deployment or vendor automation that registers a helper by design; one host or a
    small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: netsh.exe
      - Image|endswith: \netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - add
        - helper
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: netsh.exe
      - Image|endswith: \netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - add
        - helper
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: netsh.exe
      - Image|endswith: \netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - add
        - helper
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    helper registration was a single event or part of activity spanning multiple
    endpoints. If the same user registered helpers or ran related tooling on other
    hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: netsh.exe
      - Image|endswith: \netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - add
        - helper
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    helper registration reveals what led to it and what followed - the parent that
    staged netsh, reconnaissance, a dropped DLL, or trigger installation that arranges
    for netsh to run after reboot. Novel parent-child pairs at low counts are what to
    scan for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    defense tampering - may reveal the attack stages that preceded the helper
    registration and help reconstruct the timeline. Persistence is usually installed
    after an actor already has a foothold, so prior alerts give the context for why a
    netsh helper was registered.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
