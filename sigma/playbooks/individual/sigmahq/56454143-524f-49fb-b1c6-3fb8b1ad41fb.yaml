- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    curl download reveals what led to it and what followed - the parent that staged
    the download, reconnaissance, or follow-on execution of the retrieved file. Novel
    parent-child pairs at low counts are what to scan for against the high-count
    noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the download
    and help reconstruct the full timeline. Pulling a payload with a built-in tool
    is often one step in a sequence, so prior alerts give the context for what the
    downloaded file was meant to do.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary to fetch a payload often
    use several. If curl was used to download a file, check whether certutil,
    bitsadmin, or the cabinet/archive utilities were also used to pull or stage
    content. Finding multiple download LOLBins performing the same objective
    strengthens the case for deliberate payload retrieval over a one-off transfer.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was curl.exe executed from an expected path?
  context: curl ships in System32, so a curl.exe running from a user-writable
    directory such as a temp folder, a download directory, or an application data
    path may indicate the binary was copied or renamed to evade path-based
    allowlists. Compare the image path and original filename - an OriginalFileName
    of curl.exe under an unexpected image path is more notable than one running from
    System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
