name: Suspicious File Download From File Sharing Domain Via Curl.EXE
id: affc8ba4-5038-4514-92f4-666a3a9f619c
description: |
  Detects curl.exe (by Image name or OriginalFileName) downloading a file from a
  known file-sharing or paste/CDN domain. The rule fires only when all of the
  following hold together: the process is curl.exe, the command line references one
  of a list of file-sharing domains, the command line contains http, it carries a
  download/output flag (-O, --remote-name, or --output), and the requested file
  ends in an executable or script extension (.ps1, .exe, .dll, .bat, .vbs, .vbe,
  .hta, .msi, .dat, .psm1). curl is a signed system binary and these domains carry
  legitimate traffic, so the combination - not any single element - is what makes
  this notable: a built-in transfer tool pulling an executable payload from
  attacker-friendly hosting. Determine the exact URL and saved filename, what the
  downloaded file did once on disk, how curl was invoked, and whether this pattern
  is routine for the user, host, or fleet.
type: detection
detection_id: 56454143-524f-49fb-b1c6-3fb8b1ad41fb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did curl.exe download an executable or script from a file-sharing domain
    using a download flag, matching all of this rule's criteria?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when every condition is met together - curl.exe (by image
    name or original filename), a file-sharing or paste/CDN domain in the command
    line, http present, a download flag (-O, --remote-name, or --output), and a
    requested file ending in an executable or script extension. Read the exact
    command line and confirm each element is present, then note the domain, the
    saved filename, and the extension.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files from file-sharing
    domains with command-line transfer tools?
  context: Legitimate administrative and developer activity can pull files with
    curl, but downloading executables and scripts from paste sites, CDNs, and
    file-sharing services is uncommon for most accounts and endpoints. Knowing
    whether the acting account and host function involve software fetching or
    scripted automation is often the fastest way to separate a routine pull from a
    payload retrieval.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this curl invocation download? Decode the full URL, the
    output flag, and the saved filename.
  context: The full command line reveals the specific transfer. Read the complete
    URL to identify the exact file-sharing or CDN host and path, the output flag
    (-O, --remote-name, or --output) that names where the file is written, and the
    file extension that determines what kind of payload was retrieved. A second curl
    or interpreter invocation in the same window may pull additional stages or run
    what was downloaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \curl.exe
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned curl.exe, and is that parent chain expected?
  context: The parent process reveals how the download was invoked. A user
    double-clicking or an admin script may show explorer.exe or a console shell; an
    unexpected parent such as wscript.exe, mshta.exe, an Office application, or a
    server process points to automated or malicious invocation that used curl to
    stage a payload. The parent is where the decision to fetch the file was made.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What did curl.exe and its downloaded file do next on this host - did the
    saved executable or script run?
  context: The point of fetching an executable or script is to run it. After the
    download completes, look for the saved filename being executed, or for
    interpreters and loaders (powershell.exe, wscript.exe, cscript.exe, mshta.exe,
    rundll32.exe, regsvr32.exe, cmd.exe) launching from the same parent or directory
    in the window after the transfer. Execution of the downloaded artifact turns a
    suspicious download into a confirmed payload run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's curl file-sharing
    download pattern, what parents and users normally drive it, and does the current
    alert fit?
  context: Even a signed transfer tool can be abused. This query mirrors the rule's
    full selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic curl usage. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_websites:
        CommandLine|contains:
        - .githubusercontent.com
        - 0x0.st
        - anonfiles.com
        - bashupload.com
        - cdn.discordapp.com
        - chunk.io
        - ddns.net
        - dl.dropboxusercontent.com
        - ghostbin.co
        - github.com
        - glitch.me
        - gofile.io
        - hastebin.com
        - mediafire.com
        - mega.nz
        - onrender.com
        - pages.dev
