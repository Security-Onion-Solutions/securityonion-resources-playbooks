        - pastebin.com
        - pastebin.pl
        - pastetext.net
        - pixeldrain.com
        - privatlab.com
        - privatlab.net
        - send.exploit.in
        - sendspace.com
        - storage.googleapis.com
        - storjshare.io
        - supabase.co
        - temp.sh
        - transfer.sh
        - trycloudflare.com
        - ufile.io
        - w3spaces.com
        - workers.dev
        - x0.at
      selection_http:
        CommandLine|contains: http
      selection_flag:
        CommandLine|contains:
        - ' -O'
        - --remote-name
        - --output
      selection_ext:
        CommandLine|endswith:
        - .ps1
        - .ps1'
        - .ps1"
        - .dat
        - .dat'
        - .dat"
        - .msi
