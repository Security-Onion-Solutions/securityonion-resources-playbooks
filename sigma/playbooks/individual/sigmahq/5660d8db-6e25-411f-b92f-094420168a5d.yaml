name: Potential CVE-2022-22954 Exploitation Attempt - VMware Workspace ONE Access Remote Code Execution
id: a1c8c959-e058-41db-88d1-4366cc94e353
description: |
  Detects the Apache Tomcat service wrapper prunsrv.exe spawning a Windows command interpreter on an identity
  appliance. The rule fires when the parent process path ends in \prunsrv.exe AND the child is either
  powershell.exe, or cmd.exe whose command line contains "/c powershell" — note which branch fired, because on
  the cmd.exe branch the actual PowerShell command runs one level deeper in the process tree than the alerting
  event shows. CVE-2022-22954 is a server-side template injection in the appliance's template handler that
  evaluates an expression supplied in a request and executes the resulting operating-system command as the
  hosting service, so the interpreter child is the post-exploitation signal rather than the exploit itself; a
  service process that only hosts web application threads has no routine reason to launch one. The investigation
  should determine what request reached the appliance, what the interpreter executed, whether the appliance is
  patched, and whether the interpreter connected out afterward.
type: detection
detection_id: 5660d8db-6e25-411f-b92f-094420168a5d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show prunsrv.exe as the parent, with a child that is either powershell.exe or cmd.exe
    carrying "/c powershell"?
  context: >-
    Confirm the parent path ends in \prunsrv.exe and identify which branch of the rule fired — a direct
    powershell.exe child, or a cmd.exe child whose command line contains "/c powershell". Record the branch: on
    the cmd.exe branch the PowerShell command executes in a grandchild process that this event does not show, so
    the command-line decode and any egress belong to a process the alert never names.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host an identity appliance, and is its service account expected to run command interpreters?
  context: >-
    An appliance that hosts a Java web application runs a narrow, predictable process set. Establishing what the
    host is for, and whether the account in the alert is the service identity the Tomcat wrapper runs as or a
    named administrator, is the fastest split between an operator action through a management console and command
    execution driven by a request.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is prunsrv.exe expected to spawn a command interpreter, and what started prunsrv.exe itself?
  context: >-
    prunsrv.exe is the service wrapper that hosts the appliance's Java web application; its routine children are
    Java runtime processes, not interpreters. This lookup returns the wrapper's own creation event so the analyst
    can confirm it is the long-running instance started at boot by the service control manager rather than a
    process running under that name from an unexpected path. A wrapper spawning powershell.exe or cmd.exe means
    the web application executed an operating-system command on behalf of something it received.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What web request triggered this execution?
  context: >-
    Server-side template injection reaches code execution by placing an expression in a request parameter that the
    application's template handler evaluates. The originating request and its source address live in the
    appliance's own HTTP access logs, not in process telemetry — pull them from the appliance keyed to the alert
    timestamp. Exploit-like inputs worth searching for include path traversal (../), template and expression
    syntax (${jndi and ${env), inline command parameters (cmd=), the Java serialization prefix rO0AB, and
    null-byte (%00) injection; a spike of 4xx/5xx responses from one client, on the order of more than five in
    five minutes, marks the probing that preceded the successful attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is the identity appliance patched against CVE-2022-22954 and the related template-handler flaws?
  context: >-
    CVE-2022-22954 is an unauthenticated server-side template injection in the appliance's template handler; the
    related CVE-2022-22957 and CVE-2022-22958 reach code execution through deserialization of a crafted JDBC URI
    and require an administrative context. A vulnerable build confirms the exploitation path was open and means
    every appliance at the same build needs the same check. A fully patched build requires another explanation for
    the interpreter spawn, such as an authenticated administrative action or a vendor management script.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What other child processes did this same prunsrv.exe instance spawn around the alert?
  context: >-
    One interpreter spawn can be a probe returning a single command's output; a series of them from the same
    service instance is an operator working through the web application. Look for reconnaissance commands,
    additional interpreters, and binaries launched from temporary or user-writable directories. Anything already
    known as a legitimate child of this appliance's application pool can be set aside; the rest is the
    post-exploitation sequence. Fifteen minutes either side of the alert is the practical correlation horizon
    between a request and the process activity it produced.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were other appliances targeted by the same exploit in the last 24 hours?
  context: >-
    Internet-facing appliances are scanned and exploited in waves, so this vulnerability is rarely attempted
    against one host in isolation. Correlating this detection across the environment shows how many appliances
    produced the same parent-child pattern and which need the same investigation. A single host points instead to
    a targeted attempt or a local administrative action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: What did the interpreter actually execute? Decode every argument on the command line.
  context: >-
    The command line carries the operator's intent — an inline script, a download cradle, or a base64 blob.
    Scoping to interpreter command lines on this host across the alert window, rather than to the alerting event
    alone, matters here because on the cmd.exe branch the real PowerShell command runs in a grandchild the alert
    does not name. Read the working directory alongside the arguments: a service-spawned interpreter normally
    inherits the appliance's install path, and a different one indicates the operator set it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: powershell
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the PowerShell command encoded or obfuscated, and what does it decode to?
  context: >-
    A payload delivered inside a request parameter is size-constrained, so what lands on the appliance is usually
    a small stager rather than the full tool — a base64 -EncodedCommand blob, or a cradle that pulls a much larger
    second stage. Decode -enc / -EncodedCommand content and resolve concatenated or backtick-escaped strings. What
    matters is the source the stager fetches from and what it does with the result; loaders that hand the fetched
    bytes to [Reflection.Assembly] leave no file on disk to hash.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually compiled, which is ground truth when
    the command line is only a base64 stager and the real payload was fetched at runtime. It is often the only
    place a large second-stage script becomes readable, because such scripts are executed from memory and never
    written to disk. If PowerShell operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - manual_review
- question: Were PowerShell security controls bypassed or weakened in the hour before this execution?
  context: >-
    Payloads delivered through a web application commonly weaken protections before running the real stage — an
    execution policy bypass flag, an AMSI patch, or a downgrade to PowerShell v2, which writes no script block
    events. Finding any of these on this host in the hour before the alert indicates the interpreter run was
    deliberately prepared rather than incidental to a management script, and explains a script block log that came
    back empty.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the Tomcat service process load any non-standard or unsigned module around the alert?
  context: >-
    Exploitation of a template handler can proceed by loading attacker-supplied code into the hosting service
    itself rather than only spawning a child, and that path leaves no process_creation evidence. This service's
    module set is established at startup and then stays static, so anything loaded within minutes of the alert is
    a deviation worth resolving. Check the signer and signature status of each load in the window and prioritise
    unsigned modules and modules living under temporary or application-data paths.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
- question: Did the interpreter connect out to an external host around the alert?
  context: >-
    The sequence after a successful injection runs request, then interpreter, then egress — the stager retrieves
    its next stage, or an implant calls back. An appliance normally serves inbound web traffic, so an outbound
    connection originating from powershell.exe or cmd.exe on it is the exception to run down. Capture any external
    destination address and port for blocking and reputation review, and note that a destination reached by
    address with no preceding name lookup is consistent with a hard-coded callback.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \powershell.exe
          - \cmd.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting account, so the result is that
    account's 90-day history of the appliance service spawning an interpreter — not its generic use of
    powershell.exe — aggregated by host. On an appliance this account is normally the service identity the Tomcat
    wrapper runs as, and a count of zero means the pattern is new for it. If the alert fired under SYSTEM or a
    computer account, identity attributes nothing here and the parent-driven history is the meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \prunsrv.exe
      selection_payload_pwsh:
        Image|endswith: \powershell.exe
      selection_payload_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: /c powershell
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and 1 of selection_payload_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or is
    the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behaviour and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting
    parent, so the result is the 90-day history of the Tomcat wrapper driving this specific pattern rather than
    generic parent-and-binary co-occurrence. Zero or near-zero prior events make this a first-time behaviour for
    the service; a parent that already accounts for a steady prior count points to an appliance management or
    vendor automation path that should be identifiable by name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \prunsrv.exe
      selection_payload_pwsh:
        Image|endswith: \powershell.exe
      selection_payload_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: /c powershell
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_payload_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's process activity across all hosts in the alert window shows whether the same identity
    was active elsewhere, which would extend the scope beyond this appliance. An appliance service account that
    suddenly appears on hosts it has no reason to touch indicates credential reuse following the code execution.
    If the alert fired under SYSTEM, LOCAL SERVICE, or a computer account, this returns routine agent telemetry
    from every host and the parent-driven fleet view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this appliance?
  context: >-
    Under a service principal the identity pivot returns agent telemetry from every host, so the useful question
    is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection structure scoped
    to the alerting parent, fleet-wide, within the alert window. Several appliances producing the pattern in the
    same hour points to either an exploitation wave against the whole estate or a pushed administrative task; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \prunsrv.exe
      selection_payload_pwsh:
        Image|endswith: \powershell.exe
      selection_payload_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains: /c powershell
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and 1 of selection_payload_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Did other detections fire on this appliance in the hours before this alert?
  context: >-
    Exploitation of an internet-facing service is usually preceded by observable probing and followed by staged
    activity, so the alert timeline on this host reconstructs what the process evidence alone cannot. Earlier
    detections for reconnaissance or other exploitation attempts against the same appliance date the start of the
    attempt; detections for credential access or persistence after it indicate the code execution was built on.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
