name: VMToolsd Suspicious Child Process
id: 8b6d8b37-3167-46cd-8be6-0f9107f1acdb
description: |
  Detects vmtoolsd.exe (the VMware Tools guest service) spawning a command or
  script interpreter - cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe,
  regsvr32.exe, rundll32.exe, or wscript.exe - identified by either the child
  Image name or its embedded OriginalFileName. The rule fires when the parent is
  vmtoolsd.exe AND the child matches one of those interpreters, excluding the
  signed VMware Tools default power-state scripts and empty cmd.exe launches.
  vmtoolsd runs as NT AUTHORITY\SYSTEM, so a child interpreter it spawns inherits
  SYSTEM context; the per-power-event script hooks VMware Tools supports can be
  repointed to an arbitrary batch or script path, giving a signed, registry-free
  persistence that re-executes on VM power-on, resume, suspend, or shutdown. Some
  environments legitimately configure operational power scripts, so the
  investigation should determine which interpreter ran, what it executed, whether
  a power-state script hook was configured, and whether the same pattern appears
  elsewhere on the host or fleet.
type: detection
detection_id: 5687f942-867b-4578-ade7-1e341c46e99a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did vmtoolsd.exe spawn a command or script interpreter, matching what this
    rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the parent is vmtoolsd.exe AND the child is one of cmd.exe,
    cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, or
    wscript.exe - matched either by the Image name on disk or by the embedded
    OriginalFileName. Read the exact ParentImage, Image, and OriginalFileName and
    note which interpreter ran. The signed VMware Tools default power scripts and
    empty cmd.exe launches are excluded by the rule, so a firing event is a child
    outside that allowlist.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this host expected to run command or script interpreters as children of
    VMware Tools?
  context: vmtoolsd.exe legitimately spawns its own default power-state scripts, but a
    general-purpose interpreter as its child is uncommon outside a deliberately
    configured operational script hook. Because vmtoolsd runs as SYSTEM, the child
    inherits SYSTEM context regardless of which user is logged in. Knowing whether
    this host has documented VM power-state automation, and whether its
    administrators configure such hooks, is often the fastest path to separating a
    sanctioned operational script from an attacker-planted persistence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of the spawned binary based on its metadata and
    hash, and does the Image name match its OriginalFileName?
  context: The rule matches on either the Image name on disk or the embedded
    OriginalFileName, so a binary renamed to evade the Image list can still fire on
    its metadata, and a binary masquerading under an interpreter name can be caught
    by comparing the two. Compare the Image path against OriginalFileName and check
    the signing party and status - a Microsoft-signed interpreter from System32 is a
    different finding than an unsigned or mismatched binary running from a
    user-writable path. The hash enables a reputation lookup to determine whether the
    child is a known-good interpreter or a novel sample.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What exactly did the spawned interpreter run? Decode its full command line
    and any referenced script.
  context: The full command line of the interpreter reveals the action taken. Decode
    any flags, referenced script or batch paths, encoded content, or URLs. For the
    persistence pattern this rule targets, the interpreter (commonly cmd.exe) is
    invoked to run a configured power-state script - identify the script path it
    points at and whether that path lives outside the VMware Tools directory. The
    query is scoped to this exact process instance because cmd.exe and similar
    interpreters are too common for host-wide binary scoping to be meaningful here.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the interpreter was PowerShell, was the command encoded or obfuscated,
    and what does it decode to?
  context: When the child is powershell.exe or pwsh.exe, the command may use
    -EncodedCommand (-enc), string concatenation, backtick escaping, or variable
    substitution to hide its intent. Base64-encoded commands are the most common
    form. Decoding reveals the actual payload - download cradles, reverse shells, or
    in-memory execution of .NET assemblies. If the child interpreter is not
    PowerShell, read the command line directly for the script or batch path it
    invokes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the interpreter reference a power-state script hook or a batch or script
    path outside the VMware Tools directory?
  context: The persistence variant of this pattern works by pointing a VM power-state
    hook (power-on, resume, suspend, shutdown) at an arbitrary script path, which
    vmtoolsd then runs through cmd.exe on the next transition. The configuration is
    held in the tools.conf file rather than in the per-VM default .bat files. The
    query surfaces VMware Tools configuration utility invocations on the host so the
    analyst can see whether a script hook was set or enabled; a child interpreter
    that runs a script from a path outside the standard VMware Tools directory is the
    signal that distinguishes attacker configuration from the shipped defaults.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - 'script'
        - 'tools.conf'
      selection_tool:
        Image|endswith:
        - '\VMwareToolBoxCmd.exe'
        - '\cmd.exe'
      condition: selection and selection_tool
    fields:
      - Image
      - CommandLine
      - User
- question: Was a tools.conf file or a VMware Tools power-state script written or
    modified on this host?
  context: The power-state persistence anchors on the tools.conf configuration file
    under the VMware Tools ProgramData directory, and on the per-state default batch
    scripts under the VMware Tools program directory. A write or modification of
    tools.conf, or tampering with the default power scripts, is the durable artifact
    the command-line activity leaves behind and persists across reboots. Surfacing
    file writes to these specific paths confirms whether a configuration change was
    actually committed, independent of which interpreter carried it out.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
        - '\VMware\VMware Tools\tools.conf'
        - '\VMware\VMware Tools\poweron-vm-default.bat'
        - '\VMware\VMware Tools\poweroff-vm-default.bat'
        - '\VMware\VMware Tools\resume-vm-default.bat'
        - '\VMware\VMware Tools\suspend-vm-default.bat'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What started vmtoolsd.exe, and is its own origin the expected VMware Tools
    service chain?
  context: vmtoolsd.exe normally runs as a long-lived service started by the service
    control manager at boot. Tracing the parent's own origin confirms whether this is
    the genuine VMware Tools guest service or a process masquerading under that name.
    A vmtoolsd.exe started by an interactive shell, a script host, or from a
    non-standard path is itself the anomaly, separate from whatever child it spawned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same vmtoolsd.exe instance spawn?
  context: If this vmtoolsd.exe instance was used to launch a malicious interpreter, it
    may have spawned other processes in the same window. Examining siblings of the
    exact parent instance reveals the full scope of activity initiated through this
    SYSTEM-context service - multiple interpreter children, or an interpreter
    followed by reconnaissance or download tooling, points to orchestrated activity
    rather than a single benign script run.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other interpreter children has vmtoolsd.exe spawned on this host in the
    hours after the alert?
  context: An actor using the VMware Tools service for execution may drive multiple
    stages through it. Listing children of vmtoolsd.exe on this host after the alert
    reveals follow-on execution the first child may have set up - additional
    interpreters, reconnaissance, credential access, or download tooling all running
    under inherited SYSTEM context. A burst of interpreter children from vmtoolsd
    after the alert points to active hands-on use of the service.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \vmtoolsd.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - MSHTA.EXE
        - PowerShell.EXE
        - pwsh.dll
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_vmwaretools_script:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - \VMware\VMware Tools\poweron-vm-default.bat
        - \VMware\VMware Tools\poweroff-vm-default.bat
        - \VMware\VMware Tools\resume-vm-default.bat
        - \VMware\VMware Tools\suspend-vm-default.bat
      filter_main_empty:
        Image|endswith: \cmd.exe
        CommandLine: ''
      filter_main_null:
        Image|endswith: \cmd.exe
        CommandLine: null
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \vmtoolsd.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - MSHTA.EXE
        - PowerShell.EXE
        - pwsh.dll
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_vmwaretools_script:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - \VMware\VMware Tools\poweron-vm-default.bat
        - \VMware\VMware Tools\poweroff-vm-default.bat
        - \VMware\VMware Tools\resume-vm-default.bat
        - \VMware\VMware Tools\suspend-vm-default.bat
      filter_main_empty:
        Image|endswith: \cmd.exe
        CommandLine: ''
      filter_main_null:
        Image|endswith: \cmd.exe
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether this
    was a single event or part of activity spanning multiple endpoints. If the same
    user triggered similar interpreter activity on other hosts, the scope of the
    incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith: \vmtoolsd.exe
      selection_img:
      - Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      - OriginalFileName:
        - Cmd.Exe
        - cscript.exe
        - MSHTA.EXE
        - PowerShell.EXE
        - pwsh.dll
        - REGSVR32.EXE
        - RUNDLL32.EXE
        - wscript.exe
      filter_main_vmwaretools_script:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - \VMware\VMware Tools\poweron-vm-default.bat
        - \VMware\VMware Tools\poweroff-vm-default.bat
        - \VMware\VMware Tools\resume-vm-default.bat
        - \VMware\VMware Tools\suspend-vm-default.bat
      filter_main_empty:
        Image|endswith: \cmd.exe
        CommandLine: ''
      filter_main_null:
        Image|endswith: \cmd.exe
        CommandLine: null
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the
    vmtoolsd-spawned interpreter reveals what led to it and what followed - the
    configuration step that planted the script hook, reconnaissance, or follow-on
    execution under SYSTEM. Novel parent-child pairs at low counts are what to scan
    for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Does the timing of this activity align with normal work hours or a
    documented maintenance window?
  context: Legitimate VM power-state automation and administrative scripting typically
    run during business hours or scheduled maintenance, or fire deterministically on
    a VM power transition that maps to a known event. An interpreter spawned by
    VMware Tools at an odd hour with no corresponding maintenance window or power-state
    change is more suspicious than the same activity during a documented change. Note
    whether the timing lines up with an actual VM power-on, resume, suspend, or
    shutdown.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    defense tampering - may reveal the attack stages that preceded the VMware Tools
    persistence setup and help reconstruct the full timeline. Configuring a
    SYSTEM-context persistence hook is often a later step in a sequence, so prior
    alerts give the context for how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
