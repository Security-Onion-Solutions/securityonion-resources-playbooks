name: HackTool - Default PowerSploit/Empire Scheduled Task Creation
id: 26df4f09-3e2b-4210-b22e-3620a03faaa9
description: |
  Detects powershell.exe or pwsh.exe spawning schtasks.exe to create a scheduled task using the default
  configuration emitted by the PowerSploit and Empire persistence modules. The rule fires only when all of the
  signature arguments are present together: /Create, a task runner of powershell.exe -NonI, the task name and
  runner flags /TN Updater /TR, and one of the recurring or trigger schedules (/SC ONLOGON, /SC DAILY /ST,
  /SC ONIDLE, or /SC HOURLY). This is a userland persistence mechanism that re-launches a non-interactive
  PowerShell payload on the chosen trigger. Legitimate administrators rarely create a task literally named
  Updater that runs powershell -NonI through these exact flags, so the investigation should decode the task
  runner payload and the parent PowerShell command line, confirm whether an authorized engagement explains the
  tool, and determine whether the task is still registered and has already executed.
type: detection
detection_id: 56c217c3-2de2-479b-990f-5c109ba8458f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with powershell.exe or pwsh.exe spawning schtasks.exe to create a task named Updater that runs powershell -NonI on a recurring or trigger schedule?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process lineage. The rule fires only when all of these hold together, a PowerShell parent (powershell.exe or pwsh.exe) AND an schtasks.exe child AND a command line containing /Create, powershell.exe -NonI, and /TN Updater /TR, AND one of the schedules /SC ONLOGON, /SC DAILY /ST, /SC ONIDLE, or /SC HOURLY. Confirm every clause is present in the actual event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to create scheduled-task persistence through command-line schtasks driven by PowerShell?
  context: Legitimate administrative activity can create scheduled tasks, but doing so by having PowerShell shell out to schtasks.exe with a task that re-launches non-interactive PowerShell is uncommon outside of attacker tooling. Knowing whether the user role and host function involve PowerShell-driven task management is often the fastest path to distinguishing routine administration from a planted persistence mechanism.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this scheduled-task creation part of an authorized penetration test or red team engagement?
  context: PowerSploit and Empire persistence modules are used in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further analysis; absence of one when this exact default signature fires raises the priority.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this PowerShell parent expected to spawn schtasks.exe, and what started the PowerShell process itself?
  context: The PowerShell-to-schtasks relationship is the core signal for this detection. Tracing the parent PowerShell process back to its own origin reveals whether the chain is a legitimate administrative script or an attacker-controlled session. A PowerShell parent launched by an Office application, a script host, an archive tool, or an unexpected service points to staged execution rather than interactive administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What scheduled task was created, and what command does it execute? Identify the task name, runner, and schedule from the schtasks arguments.
  context: The schtasks command line carries the task name (/TN), the command the task runs (/TR), and the trigger schedule (/SC). This signature names the task Updater and sets the runner to a non-interactive PowerShell invocation. Read the full /TR value to see the exact PowerShell payload the task will execute on its trigger, and note which schedule fired (ONLOGON, DAILY, ONIDLE, or HOURLY) because that determines when the persistence activates.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did the parent PowerShell process run, and was its command line encoded or obfuscated?
  context: The PowerShell process that launched schtasks is the actor that staged the persistence, and its own command line shows what module or script created the task. Look for -EncodedCommand or -enc base64 blobs, string concatenation, backtick escaping, and variable substitution. Decoding the parent command line reveals the operator framework that drove the task creation and any download cradle or in-memory loader staged alongside it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script that created this task?
  context: Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually executed, even when the command line is encoded. For this detection it can surface the persistence module that shelled out to schtasks, providing ground truth about what ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What specific persistence configuration did this tool invoke?
  context: The persistence modules in these frameworks expose options for the trigger schedule, the task name, and the staged payload. The /SC schedule, the /TN task name, and the /TR runner together reveal exactly how the operator configured the foothold, which determines how often the payload re-executes and what it does when it runs. Compare the observed configuration against the default signature to see whether the operator customized it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When is the task scheduled to run, and has it already executed?
  context: The trigger schedule determines when the persistence activates. A task set to run at logon fires on the next sign-in, while DAILY, HOURLY, or ONIDLE schedules may have already executed multiple times since creation. Checking for processes spawned by the Task Scheduler service after the task was registered reveals whether the staged PowerShell payload has already run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the scheduled task still registered on the system?
  context: Persistence is only effective while the task exists. Some operators delete the task after execution to reduce forensic artifacts, while others leave it for repeated re-execution. Confirming whether the Updater task is still present (via schtasks /query or the endpoint management console) determines whether the persistence mechanism is active and requires remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does a task-creation event on this host confirm the scheduled task, and what task name and author does it record?
  context: Task creation is recorded as Event ID 4698 in the Security log independently of the schtasks process. This event captures the registered task name, the author account, and the action XML, which confirms the task exists and attributes who created it even if the schtasks process detail is incomplete. Compare the recorded task name and author against the alerting command line to confirm the persistence and identify the responsible account.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4698
      condition: selection
    fields:
      - TaskName
      - SubjectUserName
      - TaskContent
- question: What other child processes did the same PowerShell parent spawn?
  context: If the PowerShell session that created this task is operator-controlled, it likely spawned other processes too. Examining the siblings of the schtasks child reveals the full scope of activity from that parent. Multiple tools launched from the same PowerShell instance, such as reconnaissance, credential access, or additional persistence, point to hands-on-keyboard orchestration rather than a single isolated action.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - /Create
        - powershell.exe -NonI
        - /TN Updater /TR
        CommandLine|contains:
        - /SC ONLOGON
        - /SC DAILY /ST
        - /SC ONIDLE
        - /SC HOURLY
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - /Create
        - powershell.exe -NonI
        - /TN Updater /TR
        CommandLine|contains:
        - /SC ONLOGON
        - /SC DAILY /ST
        - /SC ONIDLE
        - /SC HOURLY
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user staged similar persistence on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        ParentImage|endswith:
        - \powershell.exe
        - \pwsh.exe
        Image|endswith: \schtasks.exe
        CommandLine|contains|all:
        - /Create
        - powershell.exe -NonI
        - /TN Updater /TR
        CommandLine|contains:
        - /SC ONLOGON
        - /SC DAILY /ST
        - /SC ONIDLE
        - /SC HOURLY
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, defense tampering, or additional persistence installation in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this persistence and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by persistence installation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
