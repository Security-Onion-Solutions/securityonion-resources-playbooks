      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_ip_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging that brackets the obfuscated lookup.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this obfuscated-IP firing pattern, not generic ping or arp usage. Many hosts firing the same pattern points to scripted deployment or vendor automation that happens to encode addresses; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
