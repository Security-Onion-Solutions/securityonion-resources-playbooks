name: Obfuscated IP Via CLI
id: 4248057f-c18d-4c53-9f2a-da49b6e5c5b7
description: |
  Detects ping.exe or arp.exe invoked with a command line that carries an IP address in an encoded or
  obfuscated form. The rule fires when the alerting process is one of those binaries AND the command line
  matches at least one obfuscation branch -- either a hex/octal octet marker (' 0x', '//0x', '.0x', '.00x'),
  or a URL-encoded host built from 'http://%' together with '%2e', or one of several regex patterns for
  dotted-octal, dword-octal, or raw octal hosts -- AND the command line does not contain a normal dotted-decimal
  IP. Encoding an IP this way is a known evasion to slip a destination past string-matching controls and casual
  review; legitimate troubleshooting almost always uses plain dotted-decimal addresses. The investigation should
  decode the obfuscated value to its real IP, establish what that destination is, and confirm whether the user,
  host, and parent chain explain a benign reason for hiding an address on the command line.
type: detection
detection_id: 56d19cb4-6414-4769-9644-1ed35ffbb148
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects -- ping.exe or arp.exe carrying an obfuscated IP, and which obfuscation branch fired?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process. The rule fires when the binary is ping.exe or arp.exe AND the command line matches at least one obfuscation branch -- either a hex or octal octet marker, or a URL-encoded host ('http://' with percent-encoded dots), or one of the octal-host regex patterns -- AND no plain dotted-decimal IP is present. Note which branch matched, because it determines what to decode. A hex or octal-octet hit points at a numeric host, while the URL-encoded branch points at a percent-encoded hostname.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run ping or arp with an encoded address on the command line?
  context: Network administrators and IT staff legitimately run ping and arp for troubleshooting, but they almost always type a normal dotted-decimal address. An encoded or octal-form IP is rarely something a human types by hand, so the combination of an ordinary diagnostic binary and an obfuscated target is the part to scrutinize against the user's role and the host's function.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Decode the obfuscated address on this ping or arp command line. What real IP or hostname does it resolve to?
  context: The obfuscated value is the operator's destination hidden from string-matching review. Convert the encoding back to a dotted-decimal IP -- hex octets ('0x25.0x1b.0x29.0xc3'), dword or octal forms ('0x251b29c3', '04506624703', '622537155'), or percent-encoded URL hosts ('%33%37%2e...') all collapse to a single address. The decoded IP is the pivot for every downstream question. This query returns ping and arp executions on this host in a tight window so multi-step invocations that together form one operation are visible alongside the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' 0x'
          - //0x
          - .0x
          - .00x
          - 'http://%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Beyond the address itself, does the command line carry additional encoding or layered obfuscation, and what does the fully decoded content perform?
  context: Encoded content hides the operator's intent from casual inspection. Beyond the numeric IP encoding the rule matched, the command line may chain further obfuscation -- percent-encoding stacked on hex octets, mixed dotted and octal segments, or full-width unicode digits. Decode every layer until the destination and any flags are human-readable, then identify what the invocation is actually doing -- reaching a numeric host, staging a follow-on connection, or probing a target whose address was deliberately disguised.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Once the address is decoded, what is this destination? What do DNS, WHOIS, and threat intel reveal about it?
  context: 'Investigate the decoded destination as you would any external endpoint: passive DNS and resolution history, WHOIS and registration age, hosting provider, and known threat-intelligence hits. A recently registered domain, bulletproof or residential hosting, or a known command-and-control address points to attacker infrastructure and explains why the address was disguised on the command line. The triggering event carries the encoded value; reputation lookup of the decoded IP is manual.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process spawned this ping or arp, and is that parent chain normal?
  context: Legitimate diagnostics are typically run from cmd.exe or a shell descended from explorer.exe, or from a known automation script. Ping or arp with an obfuscated address spawned by an unusual parent -- an Office application, a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe, or a download cradle -- indicates automated post-exploitation rather than an administrator typing at a prompt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single ping or arp may be routine troubleshooting, but multiple reconnaissance commands in rapid succession -- ipconfig, net, nltest, nslookup, netstat, whoami -- is a signature of post-compromise enumeration. An operator who disguised a destination address often pairs it with host and network discovery to map the environment before the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Does this host normally run ping or arp?
  context: A diagnostic binary that runs regularly on a host is less notable than one that fires rarely. Low historical counts of ping or arp on this host raise the priority of the decoded destination, since routine troubleshooting hosts will show a steady background of these binaries while a quiet endpoint suddenly running an obfuscated lookup is the anomaly.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even common diagnostic tools can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific obfuscated-IP firing pattern has run here historically, not generic ping or arp usage. A new parent process, an unexpected user account, or an unusual command structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \ping.exe
        - \arp.exe
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
        CommandLine|contains|all:
        - http://%
        - '%2e'
      selection_ip_3:
      - CommandLine|re: https?://[0-9]{1,3}\.[0-9]{1,3}\.0[0-9]{3,4}
      - CommandLine|re: https?://[0-9]{1,3}\.0[0-9]{3,7}
      - CommandLine|re: https?://0[0-9]{3,11}
      - CommandLine|re: https?://(?:0[0-9]{1,11}\.){3}0[0-9]{1,11}
      - CommandLine|re: https?://0[0-9]{1,11}
      - CommandLine|re: ' [0-7]{7,13}'
      filter_main_valid_ip:
        CommandLine|re: https?://(?:(?:25[0-5]|(?:2[0-4]|1\d|[1-9])?\d)(?:\.|\b)){4}
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_ip_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Does this host normally communicate with the decoded destination?
  context: First-time connections to a destination are more notable than routine communication. After decoding the obfuscated address to a real IP, check whether this host has any history of talking to it. Zero or very low historical counts mark new infrastructure rather than a familiar internal or business endpoint; established traffic suggests the obfuscation may be cosmetic over an already-known destination.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \ping.exe
        - \arp.exe
      selection_ip_1:
        CommandLine|contains:
        - ' 0x'
        - //0x
        - .0x
        - .00x
      selection_ip_2:
