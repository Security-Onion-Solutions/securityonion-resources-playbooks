name: Visual Studio Code Tunnel Remote File Creation
id: fd4006c0-c0d5-4ee2-9b44-db5623e9e00f
description: |
  Detects a file written under the VS Code tunnel server's local history directory
  ('\.vscode-server\data\User\History\') by the tunnel server's own node.exe, whose path contains
  '\servers\Stable-' and ends in '\server\node.exe'. All three conditions must match together. The
  tunnel feature lets a remote user connect to this host through a browser-based editor over an
  outbound HTTPS session to Microsoft-owned infrastructure, so the egress resembles ordinary
  developer traffic; files under the history directory are editor-side copies of what the connected
  user opened or edited on this host. Developers use tunnels deliberately and constantly, so the
  investigation is not whether VS Code exists here but whether this host and account are expected to
  run a tunnel, whether it was authorized, and what the tunnel session wrote and executed.
type: detection
detection_id: 56e05d41-ce99-4ecd-912d-93f019ee0b71
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did a VS Code tunnel server node.exe write this file under the tunnel's local history directory?
  context: >-
    Confirm the alert matches all three criteria the rule requires together: the writing process path
    contains '\servers\Stable-', it ends in '\server\node.exe', and the file landed under
    '\.vscode-server\data\User\History\'. The signer columns are context rather than a verdict; a
    genuine tunnel server is Microsoft-signed, so read them for coherence with the path rather than
    as evidence of legitimacy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host and this account expected to run a VS Code tunnel?
  context: >-
    This is the discriminator for a dual-use tool with a large legitimate population. On a developer
    workstation belonging to the account in the alert, a tunnel is routine; on a server, a shared
    system, or a machine owned by someone who does not develop, the same write means the host has
    been made remotely reachable through an editor session. Check asset role, whether the account
    owns this machine, and whether anyone requested or approved tunnel use here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    A file still on disk can be retrieved, hashed, and read to establish what the connected user was
    working on. A file created and removed within seconds points at cleanup rather than editing, and
    moves the investigation toward what ran in between. Interpret the results by operation type.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What is the full command line of the node.exe that wrote the file, and what launched it?
  context: >-
    The file event names the writing process but not its origin or arguments. Retrieving the process
    start event shows the tunnel server's own command line and its parent. A tunnel server is
    normally started by the VS Code CLI or by a tunnel service host that the logged-on user
    installed; a parent such as a shell, a scheduled task host, or a remote-execution service
    indicates the tunnel was stood up by something other than the interactive user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: How was the tunnel established on this host, and under which account and arguments?
  context: >-
    The tunnel is set up by a separate CLI invocation before any file is written, so the establishing
    command carries the operational detail the file event does not. Read the arguments for how it was
    registered, whether license terms were auto-accepted, and above all whether it was installed as a
    service so it survives reboot and logoff without an interactive user present.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'tunnel'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What file was written to the history directory, and what does its content show?
  context: >-
    History entries are editor-side copies of files that the connected user opened or changed on this
    host, so the name, extension, and content say what the session was working on. Source under a
    project the developer owns reads differently from credentials, configuration, or a script staged
    for execution. Retrieve the file from the endpoint to read it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this file has since executed, what is its hash, and does it have known threat-intel detections?
  context: >-
    A hash is recorded when a file runs, not when it is written, so this looks for the artifact
    executing directly or being passed to an interpreter within the hour around the alert. Submit any
    hash returned by the direct-execution path to reputation sources. On the interpreter path the
    hash belongs to the interpreter rather than the artifact, so hash the file from its on-disk path
    instead. A file that was only written and never ran will not appear here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    The history directory is where the tunnel server records the connected user's edits, but the same
    process writes wherever that user directs it. Writes confined to project directories and the
    server's own installation are consistent with editing; writes into Startup, Temp, ProgramData, or
    scheduled-task paths are the ones that change the investigation. Volume alone is not the signal
    for an editor process, so read where the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the tunnel's local history directory recently, and by which processes?
  context: >-
    The history directory accumulates one entry per file the connected user touches, so its recent
    contents are a record of what tunnel sessions have been working on over the past week. A steady
    stream of project files matches ordinary development; a first-ever appearance in the last day, or
    entries for credentials, configuration, or system paths, narrows what needs review.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\.vscode-server\data\User\History\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What processes did the tunnel server spawn after the alert?
  context: >-
    The tunnel exposes a terminal, and commands the connected user runs through it appear as children
    of the tunnel server process. Build and package-manager children fit development; shells,
    script hosts, archive utilities, credential tooling, or reconnaissance binaries describe a
    session doing something other than editing code.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When this host has previously produced the rule's pattern, which accounts drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting user
    distribution reflects how this specific pattern has run here over the past two weeks rather than
    generic editor usage. A host where one developer account produces the pattern daily is a
    different situation from a host where it appears for the first time, or under an account that has
    never done it before.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|contains: \servers\Stable-
        Image|endswith: \server\node.exe
        TargetFilename|contains: \.vscode-server\data\User\History\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - User
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is their
    90-day history of this specific pattern, aggregated by host. An account that has never produced
    it before, or that suddenly produces it on a host it does not normally use, is worth weighing
    against what that person's role actually involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|contains: \servers\Stable-
        Image|endswith: \server\node.exe
        TargetFilename|contains: \.vscode-server\data\User\History\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
  - organizational_knowledge
- always_include: true
  question: Has this tunnel server binary historically produced the rule's pattern, or is it new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the
    behavior, and a file event carries no parent to pivot on. The acting program is the meaningful
    pivot: the query mirrors the rule's selection structure scoped to the alerting binary, giving its
    90-day history of producing this pattern. Note that each server version installs under its own
    commit-stamped directory, so a path that is new only because the tunnel updated is not by itself
    a deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|contains: \servers\Stable-
        Image|endswith: \server\node.exe
        TargetFilename|contains: \.vscode-server\data\User\History\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    A tunnel gives its operator a working session on the host, so the account's activity on other
    machines in the same window shows whether this is one person editing on their own workstation or
    an identity being used across several systems. When the alert fires under a machine or service
    account, expect this to return routine background activity and rely on the acting-program view
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same tunnel server binary produce the pattern on other hosts in the same window?
  context: >-
    Under a machine or service account, asking what else the user did returns routine background
    activity, and a file event carries no parent to pivot on. The query mirrors the rule's selection
    structure scoped to the alerting binary, fleet-wide, in the alert window. Several hosts at once
    points to pushed or scheduled deployment of tunnels; a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|contains: \servers\Stable-
        Image|endswith: \server\node.exe
        TargetFilename|contains: \.vscode-server\data\User\History\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - file_event
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process start on the host by binary and parent collapses repetitive background
    telemetry into high-count rows while novel parent-child pairs stand out at low counts. Read it for
    what surrounds the tunnel session: development toolchains fit the editing explanation, while
    remote-execution services, credential tooling, or archive staging describe something else running
    alongside.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Because the tunnel's own traffic reaches trusted infrastructure over 443 and is rarely blocked,
    destination reputation contributes little here and earlier host-local detections carry more
    weight. Defense tampering, remote-access tooling, or credential access in the preceding hours
    reframes the tunnel as an access channel rather than a developer convenience.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look like consistent developer use or isolated activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of
    this pattern over the week. Many hosts producing it steadily is the normal picture in an
    environment where developers use tunnels; one host, or a small set of machines that are not
    developer workstations, is where the pattern means something different and calibrates how far the
    investigation should go.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|contains: \servers\Stable-
        Image|endswith: \server\node.exe
        TargetFilename|contains: \.vscode-server\data\User\History\
      condition: selection
    fields:
    - host.name
  answer_sources:
  - file_event
