name: PUA - System Informer Execution
id: 4fa29e7c-acbb-418c-b595-0c0090d3a799
description: |
  Detects the execution of System Informer (the maintained successor of Process
  Hacker), a portable process, service, handle, and network introspection utility.
  The rule fires when a process matches any of the tool's identifying attributes -
  an Image ending in SystemInformer.exe, an OriginalFileName, Description, or
  Product of System Informer, or one of the tool's known file hashes - so a renamed
  or relocated copy still matches on metadata. System administrators and developers
  run System Informer legitimately for troubleshooting, but the same primitives -
  closing file handles held by security products, stopping kernel driver services,
  reusing tokens to inherit SYSTEM, and dropping a signed kernel driver - are reused
  to disable defenses, escalate, and inspect a host. The investigation should
  determine which copy of the tool ran, how it was launched, whether its kernel
  driver service was installed, what it acted on, and whether the same pattern
  appears elsewhere.
type: detection
detection_id: 5722dff1-4bdd-4949-86ab-fbaf707e767a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match System Informer by image name, file metadata, or
    hash, as this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule matches when any one identifying attribute is present - an image ending
    in SystemInformer.exe, an OriginalFileName, Description, or Product of System
    Informer, or one of the tool's known MD5/SHA1/SHA256/IMPHASH values. Note which
    attribute matched. A hash or OriginalFileName match on an image that is not named
    SystemInformer.exe means the tool was renamed or rebuilt, which is more notable
    than a default install running under its own name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
      - Product
- question: Is this user and host expected to run a low-level process and service
    introspection tool?
  context: System Informer is a legitimate utility for a narrow set of administrators
    and developers who troubleshoot processes, handles, drivers, and services. Most
    users and most endpoints never run it. Knowing whether the acting account and the
    host function involve that kind of system maintenance is often the fastest path to
    separating a sanctioned diagnostic run from operator tooling carried onto the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which copy of System Informer ran, where does it live, and is it signed
    by the expected publisher?
  context: The rule matches on tool metadata, so a renamed or locally rebuilt copy
    still fires. Identify the image path and signing status. A signed build from a
    standard install or program-files path used by IT is a different finding than an
    unsigned or renamed copy run from a user-writable, temporary, or removable-media
    directory, which is the staging pattern seen when the tool is carried onto a host
    to disable defenses. The image path and hash together identify exactly which build
    executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
      - User
- question: What did this System Informer invocation do? Review its command line and
    working directory for the action it was driven to perform.
  context: The command line and current directory reveal how the tool was started and
    against what. System Informer can be invoked to inspect or close handles held by
    security products, stop driver services, reuse tokens, or close network sockets.
    A portable launch reads a SystemInformer.exe.settings.xml beside the binary, so
    the working directory also indicates whether this was a portable copy. Decode any
    arguments or settings path to understand the intended operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned System Informer, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Interactive use
    usually shows explorer.exe or a console shell launching it from a user session.
    An unexpected parent such as a script host, mshta.exe, an Office application, or a
    remote-execution service points to automated or hands-on-keyboard delivery rather
    than an administrator opening the tool deliberately.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the System Informer kernel driver service registered on this host
    around the time of the alert?
  context: The kernel-side actions that make this tool useful for stopping security
    drivers require its own kernel driver and matching service to be installed,
    leaving a service registration under the system services registry path and a
    driver image on disk as forensic artifacts. The presence of a KSystemInformer
    service key or driver registration around the alert indicates the tool's
    privileged mode was exercised, not just its read-only process viewer. Its absence
    suggests user-mode-only inspection.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_driver:
        TargetObject|contains:
          - '\Services\KSystemInformer'
          - '\Services\KProcessHacker'
          - 'SystemInformer'
      condition: selection and selection_driver
    fields:
      - TargetObject
      - Details
      - Image
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single introspection tool launch may be legitimate troubleshooting, but
    a System Informer run alongside several native discovery commands - whoami,
    systeminfo, ipconfig, net, tasklist, nltest - in rapid succession is the
    enumeration pattern of post-compromise activity. An operator typically maps the
    host before moving to the next stage. The triggering tool is excluded so this
    surfaces other discovery activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did System Informer spawn afterward?
  context: The processes spawned by the tool reveal its actual impact. The legitimate
    viewer rarely spawns children; a command shell, script host, or other binary
    launched from it points to the tool being used as a springboard - for example its
    "run as this user" feature inheriting a SYSTEM token to start a new process. Review
    any children and the context in which they ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    System Informer run was a single event or part of activity spanning multiple
    endpoints. If the same user ran similar tooling on other hosts in the same window,
    the scope of the activity is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    System Informer launch reveals what led to it and what followed - the parent that
    staged it, reconnaissance, privilege escalation, or persistence the tool's actions
    were meant to support. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    defense tampering - may reveal the attack stages that preceded the tool's
    execution and help reconstruct the full timeline. A low-level system tool is often
    introduced after an initial foothold, so prior alerts give context for why it was
    run.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the System Informer pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate maintenance can run this tool. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific firing pattern has historically run here,
    not generic process activity. A new parent process, an unexpected account, or a
    first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the System Informer pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the System Informer firing pattern rather than
    generic process activity. Many hosts firing the same pattern points to a packaged
    deployment or a tool an IT team distributes by design; one host or a small
    unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \SystemInformer.exe
      - OriginalFileName: SystemInformer.exe
      - Description: System Informer
      - Product: System Informer
      - Hashes|contains:
        - MD5=19426363A37C03C3ED6FEDF57B6696EC
        - SHA1=8B12C6DA8FAC0D5E8AB999C31E5EA04AF32D53DC
        - SHA256=8EE9D84DE50803545937A63C686822388A3338497CDDB660D5D69CF68B68F287
        - IMPHASH=B68908ADAEB5D662F87F2528AF318F12
      condition: selection
    fields:
    - host.name
