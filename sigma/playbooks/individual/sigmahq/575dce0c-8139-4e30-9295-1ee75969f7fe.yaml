name: Potential Reconnaissance Activity Via GatherNetworkInfo.VBS
id: 0b9ec793-a55f-48a7-84e7-e9a177e97a77
description: |
  Detects execution of the built-in script gatherNetworkInfo.vbs through a
  Visual Basic script host. The rule fires when a process is cscript.exe or
  wscript.exe (by Image path or OriginalFileName) AND its command line contains
  gatherNetworkInfo.vbs - both conditions must hold. gatherNetworkInfo.vbs is a
  Microsoft-signed script that enumerates the host: event logs, full net command
  output, hardware inventory, running services, network configuration, and ARP
  tables, writing the results into the System32\config directory. Because the
  script is signed it passes application allowlisting, runs without a GUI, and
  produces pre-formatted reconnaissance output, so it is attractive both as a
  standalone discovery primitive and as a beachhead when its scheduled task is
  modified. Administrative troubleshooting can invoke it legitimately, so the
  investigation should confirm the command line matches, identify the launching
  parent, determine whether the surrounding activity is an isolated diagnostic
  run or part of a discovery burst with follow-on staging, and check whether the
  same pattern appears on other hosts.
type: detection
detection_id: 575dce0c-8139-4e30-9295-1ee75969f7fe
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Was a Visual Basic script host (cscript.exe or wscript.exe) used to run
    gatherNetworkInfo.vbs, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when both conditions hold - the process is cscript.exe or
    wscript.exe (by image path or original file name) AND the command line contains
    gatherNetworkInfo.vbs. Read the exact command line and confirm the script
    argument is present and that the binary is a genuine script host, since the
    original file name distinguishes a real cscript.exe from a renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run the built-in network-inventory
    script through a script host?
  context: gatherNetworkInfo.vbs has near-zero routine interactive use; it is most
    often invoked by its own scheduled task. An administrator troubleshooting a
    workstation may run it by hand, but a standard user account or a server with no
    diagnostics function launching it is more notable. Knowing whether the acting
    account and the host role involve host diagnostics is often the fastest path to
    separating a benign run from operator-driven reconnaissance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this cscript invocation actually run? Decode the full command
    line and identify the script path and any additional arguments.
  context: The full command line shows exactly how the script host was driven. Confirm
    the path the VBS was loaded from - the signed copy lives in System32, while a
    script of the same name staged in a user-writable directory is a different
    finding. Note any extra arguments or chained commands. gatherNetworkInfo.vbs run
    via cscript writes its enumeration output into the System32\config directory, so
    a completed run leaves host inventory artifacts there to corroborate the activity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: gatherNetworkInfo.vbs
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the script host load the VBScript engine modules during this activity,
    confirming script interpretation rather than a renamed binary?
  context: A genuine VBS execution by cscript.exe or wscript.exe loads the scripting
    engine modules - vbscript.dll and scrrun.dll. Their presence in the load events
    for the alerting process confirms the script host actually interpreted a script
    rather than the name being reused by an unrelated binary. If image-load telemetry
    is not collected in this environment, treat an empty result as a visibility gap
    rather than evidence the modules were not loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith:
          - '\vbscript.dll'
          - '\scrrun.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: What process spawned the script host, and is that parent chain expected
    for running this script?
  context: The parent process reveals how the script run was initiated. The built-in
    network-inventory script is normally driven by its own scheduled task, so a
    parent of svchost.exe under the task scheduler is routine. An interactive shell,
    a remote-execution host such as wmiprvse.exe or wsmprovhost.exe, an Office
    application, or mshta.exe spawning the script host points to hands-on or automated
    operator activity rather than the scheduled maintenance run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Does the command line carry any encoded or obfuscated content beyond the
    script path, and what does it decode to?
  context: VBScript invocations can carry obfuscation - Chr() character chains, string
    concatenation, or environment-variable substitution that hides an additional
    command from casual inspection. Reconstruct any such content from the command line
    to see whether the run is the plain signed script or whether extra arguments
    smuggle a download cradle, a secondary script, or chained execution. A clean
    invocation with only the script path argues for a benign or task-driven run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single inventory script may be legitimate troubleshooting, but several
    discovery commands in rapid succession - net, ipconfig, nltest, nbtstat, arp,
    netstat, systeminfo - is a signature of post-compromise enumeration. The
    network-inventory script gathers much of this already, so additional native
    recon binaries firing in the same window suggest an operator confirming or
    extending what the script collected before moving to the next stage.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\dsquery.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did the script host spawn afterward on this host?
  context: A standalone signed inventory run typically spawns no children. Children
    spawned by the script host in the window after the alert reveal what the
    reconnaissance enabled - archiving utilities staging the collected output,
    command-line transfer tools moving it off the host, or a shell launching the
    next stage. cmd.exe, powershell.exe, makecab.exe, certreq.exe, bitsadmin.exe, or
    curl.exe descending from the script host point to collection and exfiltration
    rather than diagnostics.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\cscript.exe'
          - '\wscript.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was the script host executed from its expected System32 path, and does
    its original file name match?
  context: cscript.exe and wscript.exe normally live in System32 or SysWOW64. A script
    host running from a user-writable or temporary directory, or one whose original
    file name does not match the running image, suggests the binary was copied or
    renamed to evade path-based allowlists. Confirm the image path and original file
    name to rule out a relocated or masqueraded script host driving the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other staging or transfer LOLBins used on this host recently?
  context: Reconnaissance that precedes exfiltration is often followed by living-off-
    the-land utilities that archive and move the collected data. The built-in
    inventory script writes host data locally; check whether archive and transfer
    binaries ran on the same host afterward, since several of these performing the
    same collect-and-exfil objective strengthens the case for operator activity over
    routine diagnostics.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\makecab.exe'
          - '\certutil.exe'
          - '\certreq.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\esentutl.exe'
          - '\replace.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: How often has this host fired the rule's gatherNetworkInfo.vbs pattern
    over the past 90 days, and what command-line structures are typical?
  context: A script-host invocation of gatherNetworkInfo.vbs with no prior history on
    a host is more notable than one that recurs on a stable schedule. The query
    mirrors the rule's selection structure scoped to this host, so the count reflects
    the rule's specific firing pattern rather than generic script-host usage. The
    command-line projection lets the analyst compare the historical invocation patterns
    against the alerting one to spot a deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: When this host has previously fired the rule's gatherNetworkInfo.vbs
    pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even the legitimate scheduled-task run sets a baseline. This query mirrors
    the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run
    here, not generic script activity. A new parent process, an unexpected account,
    or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's gatherNetworkInfo.vbs pattern in the
    past week, and does the cross-host distribution look like consistent automation
    or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the gatherNetworkInfo.vbs firing pattern
    rather than generic script-host activity. Many hosts firing the same pattern in
    a tight window points to a pushed or scheduled trigger - which on patched systems
    can mean the script's scheduled task was modified across the fleet. One host or a
    small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    inventory run was a single event or part of activity spanning multiple endpoints.
    If the same user triggered recon or staging on other hosts in the same window, the
    scope of the activity is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \cscript.exe
        - \wscript.exe
      - OriginalFileName:
        - cscript.exe
        - wscript.exe
      selection_cli:
        CommandLine|contains: gatherNetworkInfo.vbs
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - script-host abuse, credential access,
    or scheduled-task modification - may reveal the stages that preceded this
    reconnaissance and help reconstruct the timeline. Host inventory collection is
    often an early step in a sequence, so prior alerts give context for why the
    enumeration was run and what it was preparing for.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
