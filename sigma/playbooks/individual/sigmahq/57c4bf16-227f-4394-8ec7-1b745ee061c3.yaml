name: Firewall Disabled via Netsh.EXE
id: e5c27dd3-d6b0-444a-8646-5cb183897195
description: |
  Detects netsh.exe being used to turn off the Windows host firewall. The rule
  fires when the process is netsh.exe (by Image name or OriginalFileName) AND the
  command line carries either of two disable syntaxes: the legacy form containing
  firewall, set, opmode, and disable, OR the advfirewall form containing
  advfirewall, set, state, and off. Disabling the firewall is routine
  administrative tradecraft, but the exact same syntax is the canonical step an
  operator takes to open a host to unsolicited inbound traffic before follow-on
  activity such as remote tooling, lateral movement, or command-and-control.
  The investigation should determine which disable form fired and which firewall
  profile it targeted, who and what launched netsh, what ran on the host after the
  firewall went down, whether the firewall is still off, and whether the same
  pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 57c4bf16-227f-4394-8ec7-1b745ee061c3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did netsh.exe run with a firewall-disable command line, either the
    legacy 'firewall set opmode disable' form or the 'advfirewall set state off'
    form?
  context: Before investing investigation time, confirm the alert is a true
    positive. The rule fires when the process is netsh.exe and the command line
    contains EITHER the legacy tokens firewall + set + opmode + disable, OR the
    advfirewall tokens advfirewall + set + state + off. Read the exact command line
    and note which of the two branches fired - the advfirewall form is current
    Windows syntax, the opmode form is legacy - and which firewall profile is
    named, since that profile is what downstream questions about scope and impact
    hinge on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to change Windows firewall state from the
    command line?
  context: Disabling the host firewall via netsh requires an elevated context and is
    normal for a narrow set of administrators, imaging and provisioning workflows,
    and some software installers. Most users and most endpoints never do it.
    Knowing whether the acting account and the host function involve firewall or
    endpoint configuration is often the fastest path to separating sanctioned
    administration from an operator weakening the host before further activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which firewall-disable command fired, and does the command line turn the
    firewall fully off?
  context: The two branches have different reach. 'netsh advfirewall set <profile>
    state off' disables the named profile (domainprofile, privateprofile,
    publicprofile, currentprofile, or allprofiles); 'netsh firewall set opmode
    disable' is the legacy equivalent. Read the full command line to confirm which
    syntax was used and whether it disables a single profile or all profiles, since
    turning off allprofiles or the currently-active profile removes inbound
    filtering everywhere rather than for one network type.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which firewall profile did the netsh disable command target, and how
    often has that exact disable pattern run here before?
  context: Profile scope determines blast radius - disabling the public profile on a
    laptop is narrower than disabling allprofiles or the domain profile on a server.
    This query mirrors the rule's selection (netsh plus either disable branch)
    scoped to this host so the CommandLine projection shows which profiles have been
    targeted historically and whether the current invocation matches a routine pattern
    or is new. A first-ever allprofiles or domainprofile disable on this host is the
    deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - CommandLine
- question: Is the Windows firewall currently restored, or is it still disabled on
    this host?
  context: A firewall disable may be temporary, scoped to a single maintenance
    action, or left in place to keep the host reachable. Check the current firewall
    state - via the host's 'netsh advfirewall show allprofiles' State field or the
    endpoint configuration console - to determine whether inbound filtering has been
    re-enabled. If any profile is still off, the firewall should be restored before
    further investigation, since the host remains exposed to unsolicited inbound
    traffic.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the firewall was disabled?
  context: Disabling the firewall is usually a preparatory step that opens the host
    to inbound connections or removes a control before further action. Examining
    what ran in the window immediately after the disable reveals what it was meant
    to enable - inbound remote tooling, lateral movement, or follow-on execution. A
    burst of process creation right after the firewall went down points to the
    activity the tampering cleared the way for; correlate it with new inbound
    network connections during the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions, beyond the firewall disable,
    performed on this host?
  context: An operator who disables the firewall often pairs it with other evasion
    steps - stopping security services, clearing event logs, deleting shadow copies,
    or disabling Defender. The query surfaces other tamper-class tools and commands
    on this host within the window while the firewall disable itself is already
    known from the alert. Multiple tampering events from the same user or parent
    process within a short window indicate a coordinated effort to weaken the host
    rather than an isolated administrative change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned netsh.exe, and is that parent chain expected for a
    firewall change?
  context: The parent process reveals how the firewall disable was invoked. An
    interactive administrative change usually shows a console shell, an IDE, or a
    management console as the parent; an installer shows its setup process. An
    unexpected parent such as a script host, mshta.exe, an Office application, or an
    unknown binary points to automated or scripted invocation rather than a
    deliberate administrative action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was the firewall policy also altered directly in the registry under the
    SharedAccess FirewallPolicy key on this host?
  context: Firewall state can be changed without netsh by writing the registry
    values under HKLM\SYSTEM\CurrentControlSet\Services\SharedAccess\Parameters\FirewallPolicy,
    where the EnableFirewall value governs each profile. An operator who disabled
    the firewall via netsh may also have flipped these values directly, and a
    registry edit there is a parallel disable path that the command-line rule does
    not see. Registry changes to this key around the alert time indicate the
    firewall was being reconfigured at a lower level than the visible netsh command.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\SharedAccess\Parameters\FirewallPolicy'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the firewall disable was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    firewall disable reveals what led to it and what followed - the parent that
    staged the change, reconnaissance, or follow-on execution the open firewall was
    meant to allow. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or other defense tampering - may reveal the attack stages that preceded the
    firewall disable and help reconstruct the full timeline. Weakening the firewall
    is often one step in a sequence, so prior alerts give the context for why inbound
    filtering was turned off.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was netsh.exe executed from its expected System32 path?
  context: netsh.exe normally runs from C:\Windows\System32 (or SysWOW64). A copy of
    netsh.exe running from a user-writable directory such as a temp, downloads, or
    AppData path may indicate the binary was relocated or renamed to evade
    path-based allowlists, which would make a firewall-disable invocation more
    suspicious than the same command from the system path. Compare the Image path
    against the OriginalFileName to confirm the binary is the genuine system netsh.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: When this host has previously fired the rule's netsh firewall-disable
    pattern, what parents and users normally drive it, and does the current alert
    fit?
  context: Even legitimate administration disables the firewall. This query mirrors
    the rule's selection structure scoped to this host, so the resulting parent and
    user distribution reflects how this specific firing pattern has historically run
    here, not generic netsh activity. A new parent process, an unexpected account,
    or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and 1 of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's netsh firewall-disable pattern in the
    past week, and does the cross-host distribution look like consistent automation
    or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the firewall-disable firing pattern rather
    than generic netsh activity. Many hosts firing the same pattern points to an
    imaging build, installer, or scripted deployment that disables the firewall by
    design; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli_1:
        CommandLine|contains|all:
        - firewall
        - set
        - opmode
        - disable
      selection_cli_2:
        CommandLine|contains|all:
        - advfirewall
        - set
        - state
        - 'off'
      condition: selection_img and 1 of selection_cli_*
    fields:
    - host.name
