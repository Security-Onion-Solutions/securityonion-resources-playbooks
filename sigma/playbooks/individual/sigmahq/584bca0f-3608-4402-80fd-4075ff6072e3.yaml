name: Potential CommandLine Obfuscation Using Unicode Characters From Suspicious Image
id: 3e60b384-2c79-4afd-b2f5-587005a162ea
description: |
  Detects a command interpreter or script host - cmd.exe, cscript.exe,
  powershell.exe, powershell_ise.exe, pwsh.exe, or wscript.exe - launched with a
  command line that contains non-ASCII Unicode characters used to obfuscate
  arguments. The rule fires only when both conditions hold: the image (or
  OriginalFileName) is one of those interpreters AND the command line contains at
  least one of a set of Unicode spacing-modifier letters, slash variants, dashes,
  or other look-alike characters that an argument parser silently normalizes back
  to standard ASCII. This lets an operator write a command that executes
  identically to a plain-text equivalent while evading string-matching detection
  rules. The same characters can appear in benign localized input or copy-paste
  artifacts, so the investigation should decode the obfuscated command to its
  effective ASCII form, identify what it actually does, establish what launched
  it, and determine whether the same pattern is isolated or recurring on the host
  or fleet.
type: detection
detection_id: 584bca0f-3608-4402-80fd-4075ff6072e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process one of the named interpreters AND does its command
    line contain a non-ASCII Unicode obfuscation character?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when both halves match - the image or OriginalFileName is
    one of cmd.exe, cscript.exe, powershell.exe, powershell_ise.exe, pwsh.exe, or
    wscript.exe, and the command line contains at least one of a set of Unicode
    characters such as spacing-modifier letters, division/fraction slashes, em/horizontal
    dashes, or non-breaking spaces. Read the exact command line and note which
    interpreter ran and which non-ASCII character is present, since the character
    is what a parser normalizes back to an ASCII argument.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run command interpreters with non-ASCII
    characters in the command line?
  context: Interpreters carrying Unicode characters in their arguments are unusual
    for most accounts and most endpoints. Localized software, certain copy-paste
    workflows, or input-method tooling can legitimately introduce non-ASCII bytes,
    but those tend to cluster on specific users and hosts. Knowing whether the acting
    account and the host function plausibly produce such input is often the fastest
    way to separate a benign artifact from deliberate argument obfuscation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did the obfuscated command reference or create a file that is still on
    disk for analysis?
  context: Obfuscated interpreter commands frequently reference a dropped script,
    a decoded payload, or an output file. If the command line names a path, checking
    whether that file still exists enables deeper analysis - hashing, content review,
    or detonation in a safe environment. File paths here are derived from the command
    line, so scope the search to the directories and names the command referenced
    rather than every file event on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the obfuscated command line do once the Unicode characters are
    normalized to their ASCII equivalents?
  context: The character substitution is cosmetic - the parser executes the command
    as if standard ASCII were used. Map each non-ASCII character back to the letter,
    slash, or space it stands in for, then read the reconstructed command to see the
    real operation - a download, a script invocation, a registry or service change.
    This query scopes to interpreter activity on this host that carries the same
    Unicode obfuscation characters within a tight window, so a multi-step operation
    spread across several invocations is visible rather than just the single
    triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - "ˣ"
        - "˪"
        - "ˢ"
        - "∕"
        - "⁄"
        - "―"
        - "—"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "⠀"
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Which specific Unicode characters were used, and does the decoded command
    reveal a benign artifact or a deliberately hidden operation?
  context: The defining trait of this technique is non-ASCII characters that a parser
    treats as ordinary arguments - division slash for forward slash, spacing-modifier
    letters for plain letters, em or horizontal dash for hyphen, non-breaking or
    braille-blank space for a separator. Identify exactly which characters appear and
    where in the argument string. A single stray non-ASCII byte in an otherwise plain
    file path can be a localization artifact; multiple substitutions placed to break
    up flag names or paths indicate intentional evasion of string-matching detection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: If a PowerShell interpreter fired, was the command additionally encoded
    or obfuscated beyond the Unicode substitution, and what does it decode to?
  context: Unicode argument obfuscation is often layered with other concealment.
    After normalizing the non-ASCII characters, check whether the reconstructed
    PowerShell command uses -EncodedCommand (-enc), string concatenation, backtick
    escaping, or variable substitution to further hide intent. Base64-encoded
    commands are the most common second layer. Decoding through every layer reveals
    the actual payload - download cradles, reverse shells, or in-memory execution of
    .NET assemblies. For cmd.exe or the script-host interpreters this layer may not
    apply; focus on the ASCII reconstruction itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script
    content for this host?
  context: Script block logging records the deobfuscated script content that PowerShell
    actually executes, even when the command line uses Unicode substitution or
    base64 encoding. This is ground truth about what ran, bypassing the
    character-level obfuscation entirely. If these operational logs are not ingested
    in this environment, treat zero results as a visibility gap rather than evidence
    that nothing ran, and fall back to manually normalizing the Unicode characters
    from the alerting command line. This layer applies only when a PowerShell
    interpreter fired.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell or interpreter security controls bypassed or weakened on
    this host before this execution?
  context: Argument obfuscation is frequently preceded by steps that lower defenses -
    AMSI bypass (patching amsi.dll in memory), execution policy changes
    (Set-ExecutionPolicy or -ep bypass), constrained language mode escape, or a
    PowerShell v2 downgrade that lacks logging. The query surfaces these precursor
    actions on the host in the hour before the alert. Populated rows strengthen the
    case that the obfuscated command was part of a hands-on operation rather than a
    stray localized input.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned the obfuscated interpreter, and is that parent chain
    expected?
  context: The parent process reveals how the obfuscated command was invoked and is
    the most useful tuning signal for this technique - whether the launching process
    is a known interactive shell or build tool, or an unexpected parent such as
    wscript.exe, mshta.exe, a browser, or an Office application. The Unicode
    substitution is chosen by whatever assembled the command line, so the parent is
    where the obfuscation decision was made. Walk up the tree from the immediate
    parent to see what staged it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the obfuscated interpreter spawn afterward?
  context: The processes spawned by the interpreter reveal the actual impact of the
    deobfuscated command and tie the obfuscation event to the activity it set up.
    Correlating the launches in the window after the alert exposes what the operation
    did - a downloaded payload executing, reconnaissance binaries, or follow-on
    interpreters. The window after the launch is where the consequence of the
    obfuscated command becomes visible.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        OriginalFileName:
        - Cmd.EXE
        - cscript.exe
        - PowerShell.EXE
        - PowerShell_ISE.EXE
        - pwsh.dll
        - wscript.exe
      selection_special_chars:
        CommandLine|contains:
        - "\u02E3"
        - "\u02EA"
        - "\u02E2"
        - "\u2215"
        - "\u2044"
        - "\u2015"
        - "\u2014"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "\u2800"
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        OriginalFileName:
        - Cmd.EXE
        - cscript.exe
        - PowerShell.EXE
        - PowerShell_ISE.EXE
        - pwsh.dll
        - wscript.exe
      selection_special_chars:
        CommandLine|contains:
        - "\u02E3"
        - "\u02EA"
        - "\u02E2"
        - "\u2215"
        - "\u2044"
        - "\u2015"
        - "\u2014"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "\u2800"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    obfuscated execution was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        OriginalFileName:
        - Cmd.EXE
        - cscript.exe
        - PowerShell.EXE
        - PowerShell_ISE.EXE
        - pwsh.dll
        - wscript.exe
      selection_special_chars:
        CommandLine|contains:
        - "\u02E3"
        - "\u02EA"
        - "\u02E2"
        - "\u2215"
        - "\u2044"
        - "\u2015"
        - "\u2014"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "\u2800"
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    obfuscated launch reveals what led to it and what followed - the parent that
    staged the interpreter, reconnaissance, or follow-on execution the obfuscation
    was meant to slip past detection. Novel parent-child pairs at low counts are what
    to scan for against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access,
    or defense tampering - may reveal the attack stages that preceded the obfuscated
    execution and help reconstruct the full timeline. Argument obfuscation is usually
    one step in a sequence, so prior alerts give the context for why the command was
    hidden.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's Unicode-obfuscation pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even benign localized input can occasionally produce non-ASCII characters
    in an interpreter command line. This query mirrors the rule's selection structure
    scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern has historically run here, not generic interpreter
    activity. A new parent process, an unexpected account, or a first-ever occurrence
    is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        OriginalFileName:
        - Cmd.EXE
        - cscript.exe
        - PowerShell.EXE
        - PowerShell_ISE.EXE
        - pwsh.dll
        - wscript.exe
      selection_special_chars:
        CommandLine|contains:
        - "ˣ"
        - "˪"
        - "ˢ"
        - "∕"
        - "⁄"
        - "―"
        - "—"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "⠀"
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's Unicode-obfuscation pattern in the past
    week, and does the cross-host distribution look like consistent automation or
    one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the Unicode obfuscation firing pattern rather
    than generic interpreter activity. Many hosts firing the same pattern points to a
    localized tool or scripted deployment that emits non-ASCII arguments by design;
    one host or a small unrelated set points to manual operator activity. Use the host
    distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        OriginalFileName:
        - Cmd.EXE
        - cscript.exe
        - PowerShell.EXE
        - PowerShell_ISE.EXE
        - pwsh.dll
        - wscript.exe
      selection_special_chars:
        CommandLine|contains:
        - "ˣ"
        - "˪"
        - "ˢ"
        - "∕"
        - "⁄"
        - "―"
        - "—"
        - "\_"
        - "\xAF"
        - "\xAE"
        - "\xB6"
        - "⠀"
      condition: all of selection_*
    fields:
    - host.name
