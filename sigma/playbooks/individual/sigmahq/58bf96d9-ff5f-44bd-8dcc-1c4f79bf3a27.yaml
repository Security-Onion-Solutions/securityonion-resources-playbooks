name: Trickbot Malware Activity
id: b84157ec-21b8-4db0-a94e-ed138571f852
description: |
  Detects a process tree in which rundll32.exe, invoked with a DllRegisterServer export argument, spawns wermgr.exe. All
  three conditions must hold together — the child Image ends in wermgr.exe, the parent Image ends in rundll32.exe, and the
  parent command line contains DllRegisterServer. Modular banking-trojan loaders use rundll32.exe to run an exported entry
  point from a dropped DLL, then move execution into a signed Windows binary such as the Windows Error Reporting manager so
  that later stages run under a name that appears routine on the host. wermgr.exe does run legitimately, but it is normally
  started by the error-reporting service chain rather than by a rundll32.exe DLL-export invocation, so the investigation
  should establish what DLL rundll32.exe loaded, what the resulting wermgr.exe process did, and whether host or domain
  enumeration followed.
type: detection
detection_id: 58bf96d9-ff5f-44bd-8dcc-1c4f79bf3a27
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event match the rule's criteria — a rundll32.exe parent carrying DllRegisterServer that spawned
    wermgr.exe?
  context: Confirm the alert before investing further time. All three criteria must be present together in the event, so read
    the parent command line and check that the DllRegisterServer export argument is there alongside the rundll32.exe parent
    and the wermgr.exe child. Note the DLL path passed to rundll32.exe — it is the artifact the rest of the investigation
    pivots on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a DLL export through rundll32.exe that ends in wermgr.exe execution?
  context: Legitimate software installers and some management tooling do call rundll32.exe with DllRegisterServer to register
    COM components, so the invocation alone is not unusual. What is unusual is that invocation producing wermgr.exe. Establish
    whether the host was undergoing software installation or a packaged deployment at the alert time, and whether the account
    is one that performs that work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is rundll32.exe expected to spawn wermgr.exe on this host, and what started the rundll32.exe instance?
  context: The parent-child pairing is the core signal here. Tracing the parent's own origin shows whether the DLL export was
    called by an installer or deployment chain, or by something that itself arrived recently — an Office application, a script
    interpreter, an archive utility, or a browser download directory. The grandparent and the parent's own command line together
    identify the DLL that was loaded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same rundll32.exe instance spawn?
  context: A loader stage that spawns one process usually spawns more. Listing every child of the exact parent instance shows
    whether wermgr.exe was the only thing launched or whether command interpreters, enumeration utilities, or additional rundll32.exe
    invocations came from the same DLL export.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the wermgr.exe process actually run, and from what working directory?
  context: Read the full command line and working directory of every wermgr.exe execution on this host in the alert window.
    Genuine error-reporting invocations carry report-handling arguments and run from the system directory. An empty or unexpected
    command line, or a working directory under a user profile or a temporary path, points to the binary being used as a host
    for injected code rather than for its own function. Any named pipe or local resource visible in the arguments is worth
    recording, since pipe activity itself is not collected as separate telemetry here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What else did rundll32.exe launch on this host from a DllRegisterServer invocation in the hours after the alert?
  context: The alerting parent instance is one execution, but a loader commonly re-runs its DLL export or drops further stages
    that repeat the same launch mechanism. Widening from the single parent instance to every rundll32.exe DllRegisterServer
    invocation on the host over the following hours shows whether the activity continued after the alerting event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        ParentCommandLine|contains: DllRegisterServer
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did built-in host and domain enumeration utilities run on this host around the time of the alert?
  context: Loader stages of this kind are routinely followed by discovery using utilities already present on the host — network
    configuration, local and domain group listings, and domain trust checks. Their appearance shortly after the alert, particularly
    under a parent other than an interactive shell, indicates the execution chain progressed past the loader stage into reconnaissance.
    Compare the parent of each result against the alerting process tree.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \ipconfig.exe
          - \net.exe
          - \net1.exe
          - \nltest.exe
          - \whoami.exe
          - \systeminfo.exe
          - \nslookup.exe
      condition: selection
    fields:
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What files did the rundll32.exe parent process write around the time of the alert?
  context: Beyond the processes it spawned, the parent instance may have written files. Correlating file activity to the parent's
    own process identity surfaces the DLL it loaded if that DLL was written by the same instance, along with any configuration,
    staging, or output files placed under user-writable directories. Those paths are the artifacts to collect for analysis.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
  answer_sources:
  - file_event
- question: What other activity occurred on this host around the time of the alert?
  context: Aggregating process activity by binary and parent collapses routine repetition into single high-count rows while
    novel parent-child pairs stand out at low counts. Scan for pairs that do not belong to the host's normal software — script
    interpreters under unexpected parents, enumeration utilities, or credential-access tooling appearing near the alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: How often has rundll32.exe spawned wermgr.exe on this host over the past 90 days?
  context: This pairing is the discriminator for the detection, because neither binary is unusual on its own. A count of zero
    or near zero establishes the lineage as novel for this host. A meaningful history means some installed product produces
    it routinely, and the command lines returned identify which one, which converts the finding into a tuning candidate rather
    than an incident.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: How often does wermgr.exe run on this host, and under which accounts?
  context: wermgr.exe is the Windows Error Reporting manager and runs on healthy hosts, so raw volume does not separate routine
    from anomalous. The value of the 90-day view is the account distribution — error reporting typically runs under the accounts
    whose applications crashed and under service principals. An account that has no history of producing it narrows where to
    look next.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Is rundll32.exe spawning wermgr.exe on other hosts in the environment?
  context: The same lineage appearing on several hosts within a day points to either a pushed software deployment that produces
    it legitimately or a delivery method that reached multiple endpoints. A single host points to a host-local trigger. The
    command lines returned distinguish the two — consistent arguments across hosts read as packaged automation, varied or
    user-profile DLL paths do not.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this exact
    lineage rather than generic use of either binary, aggregated by host. A user with no prior occurrences is the more interesting
    case; a user who produces it regularly across several hosts is more likely running packaged software that registers COM
    components. Weigh the count against what the account is for.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wermgr.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains: DllRegisterServer
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven this pattern on this host or across the environment, or is the parent
    new for this activity?
  context: When the alert fires under a service principal, user identity does not attribute the behavior and the launch mechanism
    is the meaningful pivot. The query mirrors the rule's selection scoped to the alerting parent process, giving the 90-day
    history of this parent driving this specific lineage rather than generic parent and binary co-occurrence. A new or rare
    parent for the pattern is the deviation to chase; a parent already accounting for thousands of prior events is vendor or
    operating-system automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wermgr.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains: DllRegisterServer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: Tracking the account's process activity across all hosts in the alert window reveals whether the activity is confined
    to one endpoint or spans several. If the alert fired under a service principal such as SYSTEM or a computer account, expect
    this view to return large volumes of routine service activity and rely on the parent-scoped fleet question instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this
    host?
  context: Under a service principal, asking what else the user did returns routine agent and service activity on every host.
    The meaningful question is whether the same launch mechanism produced the rule's lineage elsewhere in the alert window.
    Several hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger
    and keeps the investigation on this endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \wermgr.exe
        ParentImage|endswith: \rundll32.exe
        ParentCommandLine|contains: DllRegisterServer
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host help place this event in a sequence. Look for the delivery stages that precede
    a loader — document or archive execution, script interpreters reaching out to external hosts, or a signed utility running
    from a user-writable path — and for anything that followed, such as enumeration or credential access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
