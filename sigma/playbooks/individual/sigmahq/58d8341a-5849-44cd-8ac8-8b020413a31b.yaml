name: Mint Sandstorm - ManageEngine Suspicious Process Execution
id: 81671b7f-1d44-418b-8875-3c28bf5be3bd
description: |
  Detects a ManageEngine or ServiceDesk java process spawning a child that matches one of
  several independent suspicious execution patterns. Both parent clauses must hold — the
  parent image path contains a ManageEngine or ServiceDesk component AND contains \java —
  and the child then matches EITHER a powershell.exe/powershell_ise.exe image together with
  a suspicious command-line token (download cradles, encoded commands, account and
  credential reconnaissance, Defender preference changes), OR a command line naming lsass
  together with procdump/tasklist/findstr, OR any one of the remaining single-clause child
  patterns: wget/curl fetching over http, jscript/vbscript engine invocation, local
  administrators or net user additions with /add, reg add against the Windows Defender or
  LSA restricted-admin keys, wmic process call create, wmic or vssadmin shadow-copy
  deletion, or wbadmin catalog deletion. Command lines that combine download.microsoft.com,
  manageengine.com and msiexec are excluded as product-update traffic. An application
  server is a long-running service parent that does not normally spawn interpreters or
  system utilities on its own, so a child of this kind points to server-side exploitation
  of the web application; scripted administration and vendor upgrade tooling can produce
  similar chains. Determine which branch fired, decode the child's full command line,
  establish what started the java parent, and enumerate the parent's other children to see
  whether a single command or a sequence of stages ran.
type: detection
detection_id: 58d8341a-5849-44cd-8ac8-8b020413a31b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does this child process match what the rule detects, and which of the rule's branches fired?
  context: >-
    The rule requires the parent image path to contain both a ManageEngine or ServiceDesk
    component and \java, and then requires the child to match at least one of several
    independent patterns. Confirm the parent path first, then identify which branch fired:
    either a powershell.exe or powershell_ise.exe image carrying one of the rule's
    suspicious command-line tokens, or a command line naming lsass alongside
    procdump/tasklist/findstr, or one of the single-clause child patterns (wget/curl over
    http, jscript/vbscript invocation, account or local-administrator additions, reg add
    against Defender or LSA keys, wmic process call create, shadow-copy or backup-catalog
    deletion). Which branch fired determines which follow-on questions carry weight —
    the download branches point at payload retrieval, the lsass branch at credential
    access, the vssadmin/wbadmin branches at destruction.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run this application server, and is this child execution part of a known administrative or upgrade routine?
  context: >-
    An application server host running the product legitimately still gives no reason for
    the java service to launch an interpreter or a system utility. Establish the host's
    role and whether a maintenance window, upgrade, or scripted administration task was
    running at the alert time. The account shown is normally the service account the
    application runs under, not an interactive operator, so a named human user here is
    itself worth explaining.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Application-server exploitation followed by discovery and credential-access commands is
    a standard exercise path, and web-application assessments routinely target this product
    class. Before investing further analysis, check whether an assessment is active against
    this host or network segment and whether its scope and timing match this execution. An
    authorized engagement with matching activity resolves the alert without further work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What started the java parent process, and is it expected to spawn this child?
  context: >-
    This retrieves the parent's own creation event, including its command line and its
    grandparent. A service-launched application server started by services.exe or a
    wrapper, with the product's class path on its command line, is the expected form; the
    parent itself is rarely the anomaly. The relevant finding is that a long-running server
    process spawned this child at all, which is the pattern left behind when a request
    handler executes attacker-supplied input. The parent's command line also names the
    product component and version, which narrows which application flaw to check.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same java parent instance spawn?
  context: >-
    Server-side exploitation rarely stops at one command. Listing everything the same
    parent instance launched around the alert shows whether a single utility ran or a
    sequence of stages — discovery, then download, then credential access — was executed
    through the same handler. Multiple children from a parent that normally spawns none is
    the strongest available evidence that the execution path is attacker-driven rather than
    a one-off administrative call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which specific capability did the child command invoke?
  context: >-
    The rule's branches span very different objectives, and the scope of the incident
    follows from which one ran. Read the full command line and classify it: a download
    cradle (bitsadmin, certutil, wget, curl, DownloadFile, DownloadString,
    Invoke-WebRequest) means payload retrieval; lsass with procdump means credential
    access; net user /add or localgroup Administrators /add means account creation or
    privilege escalation; add-MpPreference, set-MpPreference or reg add against
    DisableAntiSpyware means defense tampering; vssadmin delete shadows, wmic delete
    shadowcopy or wbadmin delete catalog means recovery destruction and should be treated
    as pre-ransomware sequencing. Identify the subcommand and its arguments, not just the
    binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the alerting child binary write to disk on this host?
  context: >-
    Each branch leaves a characteristic write. The lsass branch produces a .dmp file, often
    under a temp or public path; the download branches produce the retrieved payload at the
    path given on the command line; script branches produce staged .ps1, .vbs or .js files.
    This surfaces the file-write footprint of the alerting binary across the host, which
    also catches writes the command line did not name explicitly.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Is the file referenced by the command still on disk for analysis?
  context: >-
    The command line names a concrete path for the download, dump, or script branches.
    Confirming the file was actually created, and still exists, decides whether hashing,
    content review, or sandbox submission is available. This correlates writes to the
    alerting process and its direct children only, so a file written by a grandchild or by
    a later unrelated process will not appear here.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Was the command encoded or obfuscated — and what does it decode to?
  context: >-
    One of the rule's PowerShell clauses is a regex for an -e/-enc/-encodedcommand switch,
    caret-obfuscated variants included, followed by at least fifteen base64 characters.
    Others match FromBase64String, System.IO.Compression and System.IO.MemoryStream, which
    together indicate a gzip-compressed base64 blob expanded and executed in memory. Decode
    the base64, decompress if a memory stream is present, and read the resulting script.
    Where the clause that fired is already plain text — iex, Invoke-Expression,
    Invoke-WebRequest, DownloadString — there is nothing to decode: identify the URL being
    fetched and executed and where the payload is written or run from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script text PowerShell actually compiled, which
    is ground truth when the command line is encoded or compressed. It also captures script
    bodies that never appeared on a command line at all, such as content piped in or
    fetched by a cradle. If PowerShell operational logs are not ingested in this
    environment, treat an empty result as a visibility gap rather than evidence that
    nothing ran, and fall back to decoding the base64 from the alerting command line
    directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Execution-policy bypass, AMSI patching, a downgrade to PowerShell v2, and
    Set-MpPreference exclusions commonly precede a payload so it can run and stay
    unscanned. The rule already matches add-MpPreference and set-MpPreference on the
    alerting command itself, so a hit here on a separate, earlier process shows the
    weakening was staged ahead of this execution rather than being part of it. This is
    host-scoped over the prior hour and does not require the java parent, which is
    intentional — the preparation step may have run through a different chain.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: If a payload was fetched and executed, what is its hash — and is it known to threat intelligence?
  context: >-
    The hash needed for a reputation lookup or detonation is recorded when a binary runs,
    not when it is written. This returns the processes the alerting child spawned and the
    processes its parent spawned alongside it, with their executable hashes; for a
    download-and-execute or a dropper staged through the same handler, that is the payload.
    A payload run later by an unrelated process will not appear here — take the on-disk
    path from the file-write questions and hash it manually instead.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did an account or group change succeed, and can you confirm it in the Windows Security event log?
  context: >-
    Several of the rule's branches fire on the command that attempts an account change —
    net user /add, localgroup Administrators /add, adscredentials, samaccountname lookups.
    The command firing does not mean it completed; the Security channel is the
    authoritative record. Event 4720 confirms account creation, 4728/4732/4756 confirm a
    member was added to a global, local, or universal group, and 4722/4724 confirm an
    account was enabled or its password reset. If the branch that fired was not
    account-related this returns nothing, which is expected. If these events are not
    collected on this host, an empty result is a visibility gap rather than proof the
    change failed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4720
          - 4722
          - 4724
          - 4728
          - 4732
          - 4756
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
  answer_sources:
  - alert
  - manual_review
- question: Has the java parent on this host spawned this child binary before?
  context: >-
    An application server's process tree is narrow and repetitive, so its 90-day history is
    a usable baseline in a way a workstation's is not. Zero or near-zero prior counts for
    this parent-child pairing establish the spawn as novel. A non-zero history is not
    automatically benign — read the returned command lines and check whether they look like
    the product's own upgrade or scripted maintenance calls, or whether the same execution
    path has been in use unnoticed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pairing on the host in the surrounding window collapses
    routine agent and service telemetry into a few high-count rows while novel pairings
    stand out at low counts. Look for other children of the java parent, for interpreters
    launched from web or application-server processes, and for follow-on stages such as
    archive utilities, remote-access tooling, or scheduled-task creation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this execution in a sequence. Web-shell
    writes, application-server file drops, or exploitation attempts against the product's
    listening port beforehand point to the initial access path; discovery or defense
    tampering beforehand suggests this execution is a later stage rather than the first.
    The absence of earlier alerts is also informative — it makes the application itself the
    most likely entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: What else did this account do across the environment around this time?
  context: >-
    If the child ran under a named account, its activity on other hosts in the same window
    reveals whether the operator moved beyond this server. Note that an application server
    normally executes under a service account, and where that account is SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account, this query returns routine agent and
    service telemetry from across the estate rather than an actor's trail — in that case
    the parent-driven view of the same window is the meaningful one.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did a ManageEngine java parent spawn this same child binary on other hosts in the same window?
  context: >-
    Under a service principal, user identity does not attribute the behavior, so the
    meaningful pivot is the launch mechanism. This mirrors the rule's parent clauses — an
    image path containing a ManageEngine or ServiceDesk component and \java — scoped to the
    alerting child binary and run fleet-wide across the alert window. Several servers in
    the same window points to an internet-facing application being exploited at scale, or
    to a pushed automation task; a single host points to a host-local trigger and narrows
    the investigation to this server's request logs.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_path:
        ParentImage|contains:
          - manageengine
          - ServiceDesk
      selection_parent_image:
        ParentImage|contains: \java
      selection_child:
        Image|endswith|expand: '%Image%'
      condition: selection_parent_path and selection_parent_image and selection_child
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
