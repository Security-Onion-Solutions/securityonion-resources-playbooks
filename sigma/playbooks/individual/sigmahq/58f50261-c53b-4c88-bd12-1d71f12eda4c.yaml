name: Windows Credential Manager Access via VaultCmd
id: 098c50a2-d560-4bde-9ffb-97b81306b67d
description: |
  Detects the native Windows utility vaultcmd.exe (identified by Image or OriginalFileName) invoked with the
  /listcreds: argument, which enumerates and lists credentials currently stored in Windows Credential Manager.
  The rule fires only when both the binary selection AND the command-line selection match. Listing stored
  credentials is a credential-access step that exposes saved web, application, and domain credentials from the
  user's Credential Locker; legitimate administrators and some support tooling occasionally enumerate stored
  credentials, so the investigation should confirm the user and host are expected to perform this, identify
  which credential vault was read, and determine whether the access was followed by use of the exposed
  credentials.
type: detection
detection_id: 58f50261-c53b-4c88-bd12-1d71f12eda4c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: 'Does the command line match what this rule detects, with vaultcmd.exe running and a /listcreds: argument present?'
  context: 'Before investing investigation time, confirm the alert is a true positive. The rule fires only when both halves hold together, a VaultCmd binary (Image ending in \VaultCmd.exe or OriginalFileName VAULTCMD.EXE) AND a command line containing /listcreds:. Confirm both are present in the actual event and note the vault name that follows /listcreds: if one was supplied.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate stored credentials from Windows Credential Manager?
  context: Legitimate administrative or support activity can list stored credentials, but enumerating the Credential Locker is uncommon for ordinary users and most server roles. Knowing whether the user role and host function are consistent with reading saved credentials is often the fastest path to separating routine administration from credential theft. Low-privileged or service accounts running this are a stronger signal than an administrator on a management host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which credential vault was targeted, and was a specific vault GUID named after /listcreds:?
  context: 'The /listcreds: argument selects which Credential Locker vault to enumerate. The default Web Credentials and Windows Credentials vaults hold saved browser and domain passwords; a GUID following /listcreds: targets a specific vault. Identifying the vault determines which saved credentials were exposed and which accounts need rotation. Command lines containing keywords such as dpapi or credman alongside this access point to broader credential tooling.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were Credential Locker vault files accessed or written on this host around the alert?
  context: Listing stored credentials reads the on-disk Credential Locker. Files with .vcrd and .vpol extensions under the user profile Credentials and Vault directories hold the encrypted credential blobs and policy. File-creation activity touching these paths in the same window confirms the enumeration reached the vault store rather than failing on an empty or locked vault, and reveals whether the locker was also copied or staged for offline use. This is a plain file-write check, not a stream lookup — Credential Locker paths are ordinary files, not Alternate Data Streams.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        TargetFilename|contains:
          - '\AppData\Local\Microsoft\Credentials'
          - '\AppData\Local\Microsoft\Vault'
          - '\AppData\Roaming\Microsoft\Credentials'
          - '\AppData\Roaming\Microsoft\Vault'
          - '.vcrd'
          - '.vpol'
      condition: selection_host and selection_path
    fields:
      - TargetFilename
      - Image
      - User
- question: Did vaultcmd.exe or a process it spawned write any file to disk around the time of the alert, such as an exported or staged copy of credential material?
  context: Reaching live secrets in a process such as lsass.exe, the Vault service host, or vaultsvc requires opening a handle to that process, and that handle open is not observable here — Elastic Defend has no cross-process handle-access channel equivalent to Sysmon EID 10, so a read against those processes cannot be confirmed or ruled out directly. What can be observed is the artifact such an access would leave behind — a file written by vaultcmd.exe itself or by a child process it spawns. A zero-row result does not prove no further access occurred; it may only mean the operator worked in memory without writing anything to disk.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned vaultcmd.exe, and is that parent chain expected?
  context: The parent process reveals how the credential enumeration was invoked. Interactive administration usually descends from explorer.exe or a shell; automation from services.exe or a scheduled-task host. Parents such as mshta.exe, wscript.exe, an Office application, or a remote-execution service point to scripted or remote-operator activity rather than hands-on administration. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did vaultcmd.exe spawn afterward?
  context: The processes spawned after credential enumeration reveal how the exposed credentials were used. A benign administrative check usually spawns nothing; credential theft is often followed by cmd.exe, powershell.exe, certutil.exe, or remote-access tooling that stages or uses the harvested secrets. Review any children and their command lines for follow-on activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run vaultcmd.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. VaultCmd is rarely invoked interactively on most endpoints and servers, so zero or very low historical counts indicate first-time or rare execution and raise the priority of the credential-access finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: 'Even legitimate VaultCmd usage can be abused. The query mirrors the rule''s selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific /listcreds: firing pattern has historically run here, not generic vaultcmd usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.'
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar credential or execution activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this credential access, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or staging of the exposed credentials.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed by the listed credentials, and do any have elevated privileges?
  context: The severity of this access depends on what the Credential Locker held and the privilege of the affected accounts. Saved domain-admin or service-account credentials require incident escalation and rotation; a standard user's saved web logins may only need monitoring. Cross-reference the alerting user and any vault contents against directory group memberships, and treat the running account itself as a baseline of expected versus unexpected privileged access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: 'The query mirrors the rule''s selection structure with no host scope, so the result is a fleet-wide count of this /listcreds: firing pattern, not generic vaultcmd usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.'
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \VaultCmd.exe
      - OriginalFileName: VAULTCMD.EXE
      selection_cli:
        CommandLine|contains: '/listcreds:'
      condition: all of selection*
    fields:
    - host.name
