name: Persistence Via New SIP Provider
id: bc0b4192-d1f7-45d7-8ffc-3610b0fee0e1
description: |
  Detects registry writes that register or modify a Subject Interface Package (SIP) or trust-provider
  DLL mapping — a write under \SOFTWARE\Microsoft\Cryptography\Providers\ or
  \SOFTWARE\Microsoft\Cryptography\OID\EncodingType (including the WOW6432Node views) where the path
  carries a \Dll or \$DLL component. Windows resolves file signature validation through these mappings,
  so pointing one at an attacker-controlled DLL makes unsigned or tampered files appear validly signed
  and gets that DLL loaded into any process that performs signature checks — persistence and defense
  evasion in a single write. Known-benign value data (WINTRUST.DLL, mso.dll) and Windows servicing
  writes (poqexec.exe setting PsfSip.dll on \CryptSIPDll keys) are filtered out. The investigation
  should identify the writing process, the DLL the mapping now points at, whether that DLL exists on
  disk and was subsequently loaded, and whether the registration is a sanctioned software deployment
  or an isolated hijack of the trust-validation chain.
type: detection
detection_id: 5a2b21ee-6aaa-4234-ac9d-59a59edf90a1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the registry write match the SIP or trust-provider registration pattern this rule detects?
  context: |
    The rule fires when the key path (TargetObject) contains one of the cryptography provider
    locations — \SOFTWARE\Microsoft\Cryptography\Providers\, \SOFTWARE\Microsoft\Cryptography\OID\EncodingType,
    or their WOW6432Node equivalents — AND the path also carries a \Dll or \$DLL component. Writes
    whose value data is WINTRUST.DLL or mso.dll are filtered as benign, as is Windows servicing
    (poqexec.exe writing PsfSip.dll to \CryptSIPDll keys). Confirm the exact key path, the value data
    (Details), and the writing process against these criteria before investing investigation time.
  range: +/-5m
  answer_sources:
  - alert
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register cryptographic SIP or trust providers?
  context: |
    Legitimate SIP registrations almost always come from software installation — security products,
    document or archive tooling that adds its own subject types, or OS servicing — so the expected
    writers are installers, deployment tooling, and servicing processes rather than interactive users.
    User attribution is present on most endpoint registry events; when User is SYSTEM or a machine
    account, the write is service-driven and the writing process (Image) is the better attribution pivot.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was there a change ticket or documented software deployment that would register a cryptographic provider?
  context: |
    SIP and trust-provider registrations normally ride along with a software rollout — a new security
    agent, signing tooling, or a vendor product that validates its own file formats. A deployment record
    or change ticket covering this host at this time supports the benign explanation; a provider
    registration with no corresponding deployment is unexplained configuration change to the host's
    signature-validation chain and should be escalated.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall installing software that would register this provider?
  context: |
    Direct confirmation from the human behind the account is often the fastest path to a verdict. If an
    administrator recalls installing or updating software at this time, ask what product it was and
    whether the DLL named in the registry value belongs to it. If nobody recalls the activity, treat the
    write as unattended — either automated deployment (verify through the deployment team) or attacker
    activity under compromised credentials.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this registration align with work hours or a maintenance window?
  context: |
    Provider registrations tied to legitimate software land during business hours or scheduled
    maintenance and patching windows. A write to the signature-validation configuration at an odd hour,
    outside any maintenance window, on a host with no scheduled deployment activity is harder to explain
    benignly. For server hosts, check whether the time matches the patching or deployment schedule for
    that system.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which cryptography provider key and DLL value were written, and is this a known trust-subversion location?
  context: |
    The path identifies what got hijacked. Keys under Cryptography\Providers\Trust map trust-provider
    functions (the WinVerifyTrust policy steps), while Cryptography\OID\EncodingType keys map the
    CryptSIPDll* functions (GetSignedDataMsg, VerifyIndirectData, CreateIndirectData) for a specific
    subject type identified by GUID — PowerShell scripts, PE images, and catalog files each have their
    own. Writing a Dll or $DLL value in either place re-routes signature validation for that subject
    type through the named DLL; the verification functions are the ones abused to make unsigned or
    tampered files appear validly signed.
  range: +/-5m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What full set of provider values was written in this session, and what DLL do they point at?
  context: |
    A SIP registration is rarely a single write — registering a provider sets the DLL and function-name
    values across several function keys (data retrieval, verification, creation) for the same GUID.
    This query surfaces every write under the cryptography provider paths on this host around the alert
    so the complete registration can be decoded. Judge the DLL path in Details mechanically — Microsoft
    defaults such as WINTRUST.DLL and mssip32.dll live under System32, while a path in user-writable
    locations (AppData, Temp, ProgramData, a user profile) or an unrecognized DLL name is the hijack
    artifact. The DLL path found here becomes the pivot for the on-disk and load-verification checks.
  range: +/-30m
  answer_sources:
  - registry_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SOFTWARE\Microsoft\Cryptography\Providers\'
          - '\SOFTWARE\Microsoft\Cryptography\OID\EncodingType'
          - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\Providers\'
          - '\SOFTWARE\WOW6432Node\Microsoft\Cryptography\OID\EncodingType'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process wrote the provider registration, and what spawned it?
  context: |
    The documented registration flow is regsvr32.exe loading a SIP DLL whose DllRegisterServer writes
    these keys, but installers and scripts can write them directly. The writing process's creation event
    shows its command line and parent — an installer or deployment agent ancestry fits a software
    rollout, while a script host, Office application, or interactive shell driving regsvr32 against a
    DLL in a user-writable path fits attacker registration. The writer may have started long before the
    alert, so this looks up its creation event over a wide window.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: |
    Attackers who subvert trust validation often make other configuration changes in the same pass —
    Run keys or services for backup persistence, security-tool policy tampering so the hijack DLL is not
    scanned, or additional provider registrations for other subject types. The triggering key will
    appear in these results; the signal is what ELSE changed and whether one writing process touched
    multiple security-relevant locations. If the host is registry-noisy, narrow to the alerting writer's
    executable name or to Run, Services, Policies, Winlogon, and IFEO paths.
  range: +/-30m
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the DLL referenced by the registration present on disk, and was it written in the same session?
  context: |
    The hijack only works if the DLL named in the registry value exists at that path when a signature
    validation runs. This query correlates file activity by the registry-writing process and its
    children — a DLL dropped moments before the registration, especially outside System32, is the
    payload staging for this persistence. The file-write event carries no hash; if the DLL is present,
    hash it from a later load event or retrieve it for a reputation lookup. Note that endpoint telemetry
    records no registry deletions, so judge cleanup from the key's re-modification history rather than
    expecting a removal event.
  range: +15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the registered provider DLL subsequently loaded, and is it signed?
  context: |
    The registration takes effect the next time a process validates a signature for the hijacked
    subject type — Windows then loads the mapped DLL into that process. A load of the DLL named in the
    registry value data confirms the hijack is live and shows exactly which processes are running the
    attacker's code; loads into signature-heavy processes (script hosts, installers, security tooling)
    mean their trust decisions are no longer reliable. The load event carries signer and hash data
    directly, so an unsigned or oddly-signed module here needs no separate execution pivot to be
    assessed — submit the hash for a reputation check.
  range: +4h
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - Hashes
- question: Has this provider key been modified before on this host?
  context: |
    SIP and trust-provider keys change rarely — at OS servicing events and security-software installs
    or upgrades — so a key with zero modification history that suddenly receives a new DLL mapping is
    the first-ever configuration of that validation path on this host. Compare historical Details
    values and writing processes with the alerting event; the same servicing or installer process
    rewriting the same Microsoft DLL periodically reads very differently from a first-time write of an
    unfamiliar DLL path.
  range: -90d
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed the registration?
  context: |
    A writer that appears regularly on this host over the past 90 days — a management agent, updater,
    or deployment tool — supports the managed-software explanation. Zero or very low historical counts
    mean the writing binary itself is new to this host, which shifts the investigation toward how it
    arrived and what else it did. For a common utility like regsvr32.exe the count will be nonzero;
    weigh it together with the parent chain and the DLL it registered rather than in isolation.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert reveal the immediate context. An installer
    session produces a recognizable cluster (setup executables, msiexec, elevation prompts), while
    novel low-count pairs — script hosts, archive tools, unfamiliar binaries — stand out and may
    represent the operation this registration belongs to. High-count rows are repetitive agent
    telemetry and can be read past quickly.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other persistence mechanisms installed on this host around the registration?
  context: |
    A SIP hijack is itself a persistence mechanism, and attackers rarely rely on just one. Scheduled
    tasks, services, Run keys, BITS jobs, or WMI subscriptions installed in the same timeframe indicate
    intentional stacking of footholds rather than isolated administrative work. Persistence tool
    executions clustered around the provider write also help distinguish a hands-on session from a
    single automated install.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or Run-key paths on this host in the same window?
  context: |
    File-based persistence bypasses command-line detection entirely — an executable or shortcut dropped
    into a Startup folder runs at the next logon without any schtasks, sc, or reg invocation. Because a
    SIP hijack can make such a dropped payload appear validly signed to inspection tools, a Startup drop
    in the same window as the provider registration is a natural pairing; check what any dropped file
    points at and whether its apparent signature can be trusted given the hijack.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was this provider key modified on other hosts in the environment?
  context: |
    A legitimate software rollout writes the same provider key on many hosts in a short window, with
    identical Details data and the same writing process — that pattern matches the rule's stated false
    positive of an OS or software-driven registration. A single host receiving the mapping, or one host
    whose Details value differs from the fleet's, is the targeted case. Compare DLL paths and writers
    across hosts to separate a managed deployment from an isolated hijack.
  range: -24h
  answer_sources:
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Trust-provider tampering typically comes after access is already established — the attacker needs
    admin rights to write these HKLM keys. Earlier detections on the same host, such as initial-access
    activity, privilege escalation, defense tampering, or credential access, reveal the stages that
    preceded this registration and help reconstruct the timeline.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
