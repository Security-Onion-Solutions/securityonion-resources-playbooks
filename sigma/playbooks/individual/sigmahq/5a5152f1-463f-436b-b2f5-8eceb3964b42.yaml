name: Displaying Hidden Files Feature Disabled
id: d4cedb7b-528e-4f6d-bc09-feb8e4b70a5c
description: |
  Detects registry modifications that set the Explorer Advanced values Hidden or
  ShowSuperHidden to DWORD 0, disabling the display of hidden files and protected
  operating-system files in Windows Explorer. Malware families apply this change so
  that files they drop with hidden or system attributes stay out of view during
  casual review; the Folder Options dialog writes 1 or 2 to these values, so a 0 for
  the Hidden value in particular points to a scripted or programmatic write. The
  investigation should identify the writing process and user, determine whether both
  values were changed and whether the change persisted or was reverted, and look for
  companion activity such as attribute-setting commands, executable file drops, and
  other registry tampering in the same session.
type: detection
detection_id: 5a5152f1-463f-436b-b2f5-8eceb3964b42
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the modified registry key and value data match the visibility-disabling pattern this rule detects?
  context: >-
    The rule fires when the written key path (TargetObject) ends with
    \Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden or
    \Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden AND the value data
    (Details) is DWORD (0x00000000). Confirm both conditions against the alerting
    event before investing further time — a non-zero value or a different Advanced
    value name means the rule should not have matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change Explorer folder-visibility settings programmatically?
  context: >-
    A user manually changing Folder Options writes these values through
    explorer.exe with data 1 or 2, not 0. A DWORD 0 written by a script host,
    reg.exe, an installer, or an unrecognized binary does not fit routine
    interactive use, so knowing the account role and host function is the
    fastest triage signal. User attribution is present on roughly 94% of
    endpoint registry events; when it is a machine account (HOST$) or SYSTEM,
    pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which hive holds the modified visibility key, and what process wrote it?
  context: >-
    This key is not a persistence location — it is a defense-evasion setting that
    changes what the interactive user can see in Explorer. Its significance comes
    almost entirely from the writing process and the hive. A path under a user hive
    holds that user's per-user view settings and is normally written by explorer.exe
    during Folder Options changes; the HKLM SOFTWARE branch variant is what public
    test scripts and several malware families write with reg.exe under elevation.
    Read the exact path and writing process here, and let the value-decoding
    question carry the analysis of what data was set.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were both Explorer visibility values set to zero, or only one?
  context: >-
    The two values control different switches. Hidden governs whether files carrying
    the hidden attribute appear (1 shows them, 2 hides them); ShowSuperHidden governs
    protected operating-system files (1 shows, 0 hides). Zero is not a value the
    Folder Options dialog writes for Hidden, so DWORD 0 there points to a scripted
    or programmatic write. Malware that conceals its files typically sets both
    values in one pass — for example via consecutive reg.exe add commands with
    /t REG_DWORD /d 0 — so both value names appearing here within seconds, from the
    same writing process, corroborates deliberate tampering rather than a stray
    configuration change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|endswith:
          - '\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden'
          - '\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: How was the process that wrote this registry value launched, and is its parent chain expected?
  context: >-
    The registry event carries the writing process but not its command line or
    parent, so pivot to the process-creation event for the writer. The full command
    line shows exactly what was invoked (for reg.exe, the key, value name, and data
    are all in the arguments), and the parent reveals how it started — an
    interactive shell, an installer, a script host launched from a document, or a
    dropped binary each tell a different story. For long-running writers the start
    event may be hours or days old, which is why this looks back a full week.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
- question: Was attrib.exe used to apply hidden or system attributes to files on this host?
  context: >-
    Disabling the display switches only pays off for files that actually carry the
    hidden or system attribute, and attrib.exe with +h or +s is the common way to
    set them. Attribute-setting on payload paths near this alert closes the loop on
    the concealment chain — note which paths were targeted and feed them into the
    execution and file-drop checks. PowerShell can set the same attributes through
    file-object properties without attrib.exe, so an empty result here does not rule
    the behavior out; review the host activity question for script-host executions
    in the same window.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\attrib.exe'
        CommandLine|contains:
          - '+h'
          - '+s'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - User
- question: Did the process that wrote this value also drop executable files on this host?
  context: >-
    Malware that turns off hidden-file display usually does so to conceal files it
    has written. This checks whether the same binary that modified the registry also
    wrote executable content (.exe, .dll, .bat — the file types most worth watching
    for this technique) in the surrounding window. File-write events carry no hash;
    to assess a dropped file, follow it to a later process execution of that path
    and read the hash there. Alternate data streams are a related concealment
    channel for payload content and are worth considering when reviewing the paths
    returned.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        TargetFilename|endswith:
          - '.exe'
          - '.dll'
          - '.bat'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Actors who tamper with visibility settings often change several things at once —
    a Run key for persistence, security-tool policy values, or other Explorer view
    settings such as HideFileExt. Grouping all registry writes on the host in the
    surrounding window by key path and writing process reveals whether this change
    landed alone or as part of a batch of configuration changes from one session or
    installer-style implant. If the host is registry-noisy, narrow to the writing
    process from the alert or to security-relevant paths (Run, Services, Policies,
    Winlogon).
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the visibility change persist, get reverted, or extend to other user hives on this host?
  context: >-
    A user noticing the change and restoring Folder Options writes 1 or 2 back to
    the Hidden value (or 1 to ShowSuperHidden); a value that stays at 0 for hours
    means the concealment remained in effect. Watch also for the same value names
    being written under additional user hives, which extends the effect to other
    accounts. Registry deletions are not observable in this telemetry, so judge
    cleanup from the re-modification history returned here rather than from any
    delete event.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|endswith:
          - '\Microsoft\Windows\CurrentVersion\Explorer\Advanced\ShowSuperHidden'
          - '\Microsoft\Windows\CurrentVersion\Explorer\Advanced\Hidden'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the change?
  context: >-
    Visibility tampering rarely happens in isolation — it is typically one step in a
    sequence that includes payload staging, attribute setting, and persistence.
    Aggregating processes by image and parent collapses repetitive agent noise into
    high-count rows while novel parent-child pairs stand out at low counts; scan the
    low-count rows for script hosts, reg.exe, attrib.exe, or unfamiliar binaries
    launched near the alert.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this visibility key been modified before on this host?
  context: >-
    View-preference values do get rewritten during normal use, but by explorer.exe
    with data 1 or 2. Compare the historical Details values and writing processes
    against the alerting write — a key that has only ever been touched by
    explorer.exe and now shows a 0 from reg.exe or a script host is a meaningful
    departure, while zero history means the value had never been set on this host
    at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote this value?
  context: >-
    The writing binary may be reg.exe, a script host, an installer, or a dropped
    executable. Frequent historical execution by the same users suggests an
    administrative or software-management routine; a binary first seen on this host
    at alert time deserves scrutiny of its path, signer, and origin. For ubiquitous
    writers like explorer.exe the count itself carries little signal — weigh the
    value data and hive from the decoding question more heavily in that case.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was this registry key modified on other hosts in the environment?
  context: >-
    The same value written across many hosts with identical data by a management
    agent points to central configuration or group policy rather than compromise.
    A single host receiving DWORD 0 — or a small cluster of hosts written by the
    same unusual binary — favors targeted tampering or spreading malware. Compare
    the Details values and writing processes across the hosts returned.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial execution, defense tampering,
    persistence — may reveal the stages that preceded this concealment step and
    help reconstruct the timeline. Defense-evasion changes like this one usually
    sit in the middle of a sequence, so an execution or download alert in the
    preceding hours is worth chaining into this investigation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
