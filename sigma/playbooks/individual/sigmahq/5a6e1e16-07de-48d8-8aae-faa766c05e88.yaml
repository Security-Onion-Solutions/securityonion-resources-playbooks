name: Potential Cookies Session Hijacking
id: 46df7261-d4c9-41e5-b258-6bba4d0a4be1
description: |
  Detects curl.exe invoked with a cookie-jar write flag - a -c argument or the
  long form --cookie-jar - which tells curl to save its in-memory cookies to a
  file in Netscape format at the end of the operation. The rule fires when the
  process is curl.exe (by Image or OriginalFileName) AND the command line carries
  one of those cookie-jar flags. curl.exe ships with Windows 10 and later, so the
  binary alone is unremarkable; the cookie-jar flag is what narrows the alert to
  session-cookie handling. Saving a cookie jar is a routine scripting and API-test
  action, but it is also a building block of session-cookie theft and replay,
  where an operator captures or refreshes authenticated session tokens for reuse
  against a remote endpoint. The investigation should confirm the exact command,
  identify the destination cookie file and any target URL, establish whether the
  user, host, and parent chain are expected to run curl this way, and check
  whether the same pattern appears elsewhere on the host or fleet.
type: detection
detection_id: 5a6e1e16-07de-48d8-8aae-faa766c05e88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did curl.exe run with a cookie-jar write flag (-c or --cookie-jar),
    matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when the process is curl.exe and the command line carries a
    cookie-jar write flag. Read the exact command line and note which form is present
    (a bare -c argument or --cookie-jar), the destination file the cookies are written
    to, and whether any -b/--cookie read flag, target URL, or redirect-following option
    (-L/--location) also appears, since those distinguish a plain save from a
    read-and-replay session operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run curl with cookie-handling flags?
  context: curl.exe is shipped with Windows and is used routinely by developers,
    automation, and IT for HTTP requests, but the cookie-jar flags are a narrower
    pattern tied to session-token handling. Knowing whether the acting account and
    the host function involve API testing, web automation, or scripted HTTP work is
    often the fastest path to separating a benign script from deliberate
    session-cookie capture.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did this curl invocation actually do? Decode the full command line,
    cookie file path, and any target URL.
  context: The full command line reveals the specific HTTP operation. Identify the
    file the cookie jar is written to (the argument after -c or --cookie-jar), the
    remote URL or host being contacted, and whether a -b/--cookie flag also reads an
    existing cookie file - the read-and-write pair refreshes a session, while a paired
    --location-trusted forwards Authorization headers through redirects. A cookie file
    path under a browser profile directory points at harvesting browser session
    tokens. Scoped to all curl runs on this host within the window so a multi-step
    cookie operation is visible as a unit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this curl invocation, and is that parent chain expected?
  context: The parent process reveals how curl was invoked. Interactive or scripted
    use often shows a console shell (cmd.exe, powershell.exe) or a scheduled-task or
    automation host. An unexpected parent such as an Office application, mshta.exe,
    wscript.exe, or a browser child process points to automated or malicious
    invocation, and is especially notable when the curl command reads a cookie file
    from a browser profile.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run curl.exe?
  context: A binary that has never been seen on a host is more notable than one that
    runs regularly. Zero or very low historical counts for curl.exe indicate first-time
    or rare execution on this endpoint, which raises the weight of the cookie-jar
    activity; a host that runs curl daily under stable accounts is a weaker signal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's curl cookie-jar pattern,
    what parents and users normally drive it, and does the current alert fit?
  context: Even common tools can be abused. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent and user distribution
    reflects how this specific cookie-jar firing pattern has historically run here,
    not generic curl usage. A new parent process, an unexpected account, or a
    first-ever occurrence of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this curl invocation spawn afterward?
  context: The processes spawned by curl reveal its actual impact. A plain HTTP request
    spawns nothing; follow-on processes such as cmd.exe, powershell.exe, or a freshly
    written executable point to a payload being downloaded and run, or to a session
    being used to drive further action after cookies were saved.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired the rule's curl cookie-jar pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: The query mirrors the rule's selection structure with no host scope, so the
    result is a fleet-wide count of the cookie-jar firing pattern, not generic curl
    usage. Many hosts firing the same pattern points to scripted deployment or vendor
    automation that saves cookies by design; one host or a small unrelated set points
    to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    cookie-jar activity was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope
    of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    curl cookie-jar launch reveals what led to it and what followed - the parent that
    staged the process, reconnaissance, credential access, or follow-on use of the
    captured session. Novel parent-child pairs at low counts are what to scan for
    against the high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - credential access, browser-data
    access, reconnaissance, or defense tampering - may reveal the attack stages that
    preceded the cookie-jar activity and help reconstruct the full timeline. Session
    theft is often one step in a sequence, so prior alerts give the context for how a
    session token came to be captured here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download or transfer LOLBins used on this host recently?
  context: Operators who use one transfer LOLBin often use several - if curl was used
    to handle cookies and contact a remote endpoint, check whether certutil, bitsadmin,
    or other built-in transfer utilities were also used to pull a payload or move data.
    Finding multiple transfer LOLBins performing related actions strengthens the case
    for hands-on operator activity rather than a one-off script.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was curl.exe executed from an expected path?
  context: A built-in binary executed from a non-standard path (outside System32 or
    SysWOW64) may indicate it was copied or renamed to evade path-based allowlists. A
    curl.exe running from a user's temp directory or a download folder is more notable
    than one in System32. The rule also matches on OriginalFileName, so a renamed copy
    of curl still fires - confirm the on-disk path and the original file name agree.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's curl cookie-jar pattern over the
    past 90 days, and what command-line structures are typical?
  context: A cookie-jar pattern with no prior history on a host is more notable than
    one used daily under stable parents. The query mirrors the rule's selection
    structure scoped to this host, so the resulting count reflects the rule's specific
    firing pattern, not generic curl usage. The CommandLine projection lets the analyst
    compare typical invocation patterns - destination files, target URLs, paired read
    flags - against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_cli:
      - CommandLine|re: \s-c\s
      - CommandLine|contains: --cookie-jar
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
