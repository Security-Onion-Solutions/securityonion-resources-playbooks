name: Registry Hide Function from User
id: ec3a1993-2802-4f5d-a51b-9e7eae7f828d
description: |
  Detects registry writes that hide interface functions from the user. The rule fires when either a taskbar policy value
  under CurrentVersion\Policies\Explorer (HideClock, HideSCAHealth, HideSCANetwork, HideSCAPower, or HideSCAVolume) is
  set to DWORD 1 — suppressing the clock and the health, network, power, and volume status icons — or an Explorer display
  setting under CurrentVersion\Explorer\Advanced (ShowInfoTip or ShowCompColor) is set to DWORD 0, disabling hover info
  tips and the coloring that marks compressed or encrypted files. Malware sets these values to keep the user from
  noticing changes to the machine, while desktop-lockdown policies and admin scripts set them legitimately; the
  investigation should determine which branch matched, what process wrote the value, and whether the change clusters
  with file-hiding, persistence, or other tampering on the host.
type: detection
detection_id: 5a93eb65-dffa-4543-b761-94aa60098fb6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the registry write match either concealment branch this rule detects?
  context: The rule fires when EITHER a taskbar policy value under SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer
    (HideClock, HideSCAHealth, HideSCANetwork, HideSCAPower, or HideSCAVolume) is set to DWORD 0x00000001, OR an Explorer
    display setting under SOFTWARE\Microsoft\Windows\CurrentVersion\Explorer\Advanced (ShowInfoTip or ShowCompColor) is
    set to DWORD 0x00000000. Confirm the TargetObject and Details match one branch, and note which branch matched — the
    Policies branch suppresses system-tray status icons and the clock, while the Advanced branch turns off hover info
    tips and the coloring that distinguishes compressed and encrypted files.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change Explorer visibility settings?
  context: The Advanced branch values are per-user view preferences that explorer.exe writes when a user changes display
    settings, while the Policies branch values are administrative lockdown entries normally written by Group Policy
    processing rather than by end users. Review the writing user and process against the host's role — the user field is
    present on most endpoint registry events but may be a machine account or SYSTEM for service-driven writes, in which
    case pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this value, and what parent chain launched it?
  context: The writing process and its lineage distinguish routine configuration from tampering. Expected writers include
    explorer.exe for user preference changes, Group Policy processing for the Policies branch, and admin tools such as
    regedit.exe or msiexec.exe during scripted setup. A writer launched from a user-writable path, a script host, or an
    Office application points to malicious modification. Parent lineage may not always resolve on registry events; fall
    back to the writing process's own creation event on the host if the parent lookup returns nothing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was this setting change part of a documented deployment, policy update, or maintenance window?
  context: The Policies\Explorer values in this rule are legitimately deployed through desktop-management baselines,
    kiosk configurations, and lockdown policies, and admin scripts are a documented false-positive source for this
    detection. A matching change ticket or policy rollout record quickly closes the alert; an undocumented change on a
    host outside any rollout leaves tampering on the table.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing these interface settings?
  context: Direct confirmation is often the fastest path to a verdict. A user may have changed view or taskbar
    preferences, or an administrator may have applied a lockdown script. If nobody recalls the change, treat the writing
    process and its lineage as the deciding evidence — automated malware performs these writes without user awareness.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are Explorer policy and interface settings normally managed centrally in your environment?
  context: In managed environments these values are pushed through group policy or endpoint-management tooling, so a
    direct write on a single endpoint by reg.exe, a script host, or an unfamiliar binary bypasses the normal channel. In
    smaller environments without central management, local admin scripts may be routine — knowing the normal procedure
    determines how much weight the delivery method carries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which visibility value was modified, and what does that location control?
  context: The rule's two branches touch different territory. Values under CurrentVersion\Policies\Explorer are
    administrative policy entries — HideClock and the HideSCA* family suppress the clock and the health, network, power,
    and volume status icons in the system tray, removing indicators a user might notice during tampering. Values under
    CurrentVersion\Explorer\Advanced are per-user view preferences — ShowInfoTip set to 0 disables hover details, and
    ShowCompColor set to 0 removes the coloring that distinguishes compressed and encrypted files. The writing process
    (Image) identifies which component made the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data did the writing process set, and were multiple concealment values written together?
  context: A DWORD of 0x00000001 in a Policies\Explorer Hide* value enables the concealment; a DWORD of 0x00000000 in
    ShowInfoTip or ShowCompColor turns the display feature off. This query lists every registry value the same writing
    process touched in the window — malware that hides interface functions typically sets several of these toggles in
    one pass, while a user preference change touches only one or two related values.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the concealment setting persist, or was it changed back afterward?
  context: Key and value deletions are not directly observable in endpoint registry telemetry, so judge persistence from
    the re-modification history. A later write returning the value to its default (0 for the Hide* policies, 1 for the
    Show* settings) suggests a user or remediation step reverted it; no further writes means the concealment stayed in
    effect through the following day.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications occurred on this host in the same window?
  context: Interface concealment rarely travels alone. The same session commonly sets adjacent visibility switches
    (Hidden and ShowSuperHidden under Explorer\Advanced, which stop hidden and system files from displaying), Run-key
    persistence, or security-tool tampering. The aggregated view groups every registry write on the host by key path and
    writing process — clusters of policy and visibility changes landing together indicate a script or implant
    reconfiguring the host rather than an isolated preference change.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did file-hiding or related concealment commands run on this host after the change?
  context: Suppressing interface indicators usually supports something the user is not meant to notice. attrib.exe with
    +h or +s marks files hidden or system so they vanish from default views, and reg.exe writes to related Explorer
    visibility values (ShowSuperHidden, Hidden, HideFileExt, or other Policies\Explorer entries) extend the concealment.
    Any hit here identifies what the modification was covering for; review the full command lines for the paths and
    values touched.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_attrib:
        Image|endswith: '\attrib.exe'
        CommandLine|contains:
          - '+h'
          - '+s'
      selection_reg:
        Image|endswith: '\reg.exe'
        CommandLine|contains:
          - 'ShowSuperHidden'
          - 'HideFileExt'
          - ' Hidden '
          - 'Policies\Explorer'
      condition: selection and (selection_attrib or selection_reg)
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: The minutes around the write hold the rest of the session. The aggregated parent-child view collapses
    repetitive agent noise into high-count rows so that novel low-count pairs stand out — script hosts, binaries running
    from user-writable paths, or command-line tools appearing once or twice in the window are the entries worth
    expanding.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has the process that wrote this value run on this host before?
  context: A writer first seen at alert time supports fresh tampering, while a long-established writer points to routine
    software or management tooling. If the writer is unfamiliar, verify its path and signature against the legitimate
    binary through your endpoint console — unsigned writers, or system-utility names running from unusual paths, are the
    pattern this technique's detection guidance flags for registry modification.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this registry value been modified before on this host?
  context: Explorer visibility values change rarely after initial host setup. Zero prior history makes the current write
    a first-time change worth the full workup. Prior modifications show whether the same value data and the same writing
    process appeared before — recurring management-tool writes calibrate toward routine, while a new writer setting
    different data does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same visibility value modified on other hosts in the environment?
  context: The same write appearing across many hosts with a Group Policy or management-agent writer indicates a policy
    rollout — a quick path to closing the alert. The write appearing only on this host, or on a small set of hosts with
    an unusual writer, is consistent with targeted tampering or malware spread. Compare writing processes and value data
    across the matching hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — payload drops, script execution, defense tampering, persistence
    installation — reveal the stages that preceded the concealment and help establish what the visibility change was
    protecting.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were persistence mechanisms installed on this host around the concealment change?
  context: Malware that suppresses status icons or file-visibility cues commonly installs persistence in the same
    session — the pairing is why this detection carries a persistence tactic alongside defense evasion. Grouped
    tool-and-command rows for schtasks.exe, sc.exe, reg.exe, and similar utilities within the window show whether
    scheduled tasks, services, or Run keys landed alongside the visibility change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
