name: Windows Defender Threat Severity Default Action Modified
id: 7d74b85f-6dda-4b39-9232-9949ad9c48ab
description: |
  Detects registry modifications that set Windows Defender's per-severity default threat
  action to DWORD 6 (Allow) or 9 (NoAction) under the ThreatSeverityDefaultAction key,
  covering the Low (1), Moderate (2), High (4), and Severe (5) tiers. This change leaves
  real-time detection running but suppresses automatic mitigation, so detected threats
  execute without being quarantined or removed — attackers make it with Set-MpPreference
  or direct registry writes before running payloads, while endpoint-management tooling can
  write the same keys legitimately during policy enforcement. The investigation should
  identify the writing process and its command, whether other severity tiers or defenses
  were tampered with in the same session, and what executed after the downgrade.
type: detection
detection_id: 5a9e1b2c-8f7d-4a1e-9b3c-0f6d7e5a4b1f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the modified value match what this rule detects — a Defender ThreatSeverityDefaultAction severity tier set to DWORD 6 (Allow) or 9 (NoAction)?
  context: Confirm the alert before investing investigation time. TargetObject should fall under \Microsoft\Windows Defender\Threats\ThreatSeverityDefaultAction\ and end in severity subkey 1 (Low), 2 (Moderate), 4 (High), or 5 (Severe), with Details of DWORD (0x00000006) meaning Allow or DWORD (0x00000009) meaning NoAction. Either value tells Defender to let threats of that severity run instead of cleaning, quarantining, or removing them.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to modify Windows Defender threat-response policy?
  context: Endpoint-management tooling (GPO enforcement, configuration-management agents, hardening scripts) can legitimately write these keys during policy rollout. Check whether the user is an administrator or service account associated with change management. User attribution is present on most endpoint registry events, but policy-driven writes often show SYSTEM or a machine account — in that case judge legitimacy from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which severity tier's default action was rewritten, and is the key in the enforced policy hive?
  context: The final subkey number identifies the tier — 1 Low, 2 Moderate, 4 High, 5 Severe. Downgrades to the High or Severe tiers are the most consequential because those cover the threats Defender would otherwise quarantine or remove automatically. Writes under the Policies branch of the Windows Defender tree take precedence as managed policy, while the product hive path reflects local preference changes such as Set-MpPreference. The Image field shows the process that performed the write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Were the other severity tiers' default actions rewritten in the same window, and to what values?
  context: A single Set-MpPreference invocation or tampering script typically sets several tiers at once — for example -LowThreatDefaultAction through -SevereThreatDefaultAction all set to 6. Decode each Details value against Defender's action table, where 1 means Clean, 2 Quarantine, 3 Remove, 6 Allow, 8 UserDefined, 9 NoAction, 10 Block, and 0 applies the signature-update default. Allow and NoAction suppress automatic mitigation while real-time protection keeps running, so no louder "Defender disabled" telemetry is generated.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Windows Defender\Threats\ThreatSeverityDefaultAction\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What command or tool wrote the downgraded threat action?
  context: The registry event itself carries no command line — this query pivots to the writing process's creation event. Look for powershell.exe running Set-MpPreference with severity-tier switches, reg.exe adding values under the Threats key, or a management-agent binary. The mechanism distinguishes hands-on tampering from policy machinery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What parent process launched the tool that wrote this value, and is that chain expected?
  context: Policy machinery writes these keys from service hosts, while tampering scripts typically run under interactive shells, script interpreters, Office processes, or remote-execution services. The parent fields on the writing process's creation event show how it was invoked; walk further up the chain if the parent is itself a shell or loader. Judge the chain against the administrative tools authorized for this host — unattended writes from unexpected parents are the signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the threat action currently restored, or does the downgraded setting remain in effect?
  context: Key and value deletions are not observable in this telemetry, so judge current state from the host itself — run Get-MpPreference or inspect the key via the EDR console and confirm each severity tier's configured action. If Allow or NoAction is still in effect, Defender will not mitigate detections on this host, and the setting should be restored before deeper analysis continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host after the threat action was downgraded?
  context: With the default action set to Allow or NoAction, Defender detects threats but takes no mitigation, so payloads execute unimpeded. Aggregated process activity in the hour after the change surfaces what the downgrade may have been meant to enable — look for new binaries, credential-access tooling, or activity from staging directories, and correlate with network and file events in the same window.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering commands run on this host around the same time?
  context: Threat-action downgrades commonly land alongside other tampering — disabling real-time monitoring, adding path or process exclusions, clearing logs, deleting shadow copies, or stopping security services. Multiple tampering events from the same user or parent process in one window indicate a single operation targeting several controls. Adjust the service and command patterns to match the security stack deployed in this environment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry keys modified on this host in the same session?
  context: Defender kill scripts write many values in sequence — policy-hive disables, Real-Time Protection settings, SpyNet reporting, service Start values, and WMI Autologger entries — so clusters of registry changes from one writing process reveal script-driven tampering. The triggering key will appear in the results; the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did new executables run from user-writable or staging paths after the downgrade?
  context: The point of downgrading threat actions is to let payloads that Defender would otherwise quarantine execute. Execution from Temp, AppData, ProgramData, Public, or Downloads directories in the hours after the change is the follow-on to check — a first-seen binary in these paths, launched shortly after the downgrade, points to the payload the change enabled.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        Image|contains:
          - '\Temp\'
          - '\AppData\'
          - '\ProgramData\'
          - '\Users\Public\'
          - '\Downloads\'
      condition: selection and selection_paths
    fields:
      - Image
      - User
- question: Has this Defender threat-action key been modified before on this host?
  context: Severity default actions rarely change outside initial imaging or policy rollout. Zero prior history makes this a first-time change and raises the weight of the alert; repeated modifications with identical value data from a management binary suggest routine policy enforcement churn.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote this value?
  context: A management agent that writes policy continuously will show steady history, while a first-seen reg.exe or powershell.exe touching Defender configuration stands out. Compare against the administrative tools expected on this host — a documented software-deployment or hardening process explains the write; an interpreter that has never run here does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: Activity around the alert reveals the immediate context — what led to the change and what followed. The aggregation collapses repetitive agent telemetry into high-count rows so novel parent-child pairs stand out at low counts; scan those for reconnaissance, staging, or lateral-movement tooling.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were Defender threat-action keys modified on other hosts in the last day?
  context: The same downgrade appearing on many hosts with identical value data and a management-stack writing process suggests a policy rollout — verify it against change records. The modification on only this host, or spreading host to host over time, points to targeted tampering or lateral movement. Compare the Details values across hosts.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|contains: '\Windows Defender\Threats\ThreatSeverityDefaultAction\'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this change?
  context: Defense tampering is rarely the first stage. Earlier alerts on the same host — initial execution, loader activity, reconnaissance, credential access — reconstruct the sequence that led to the downgrade and identify where the intrusion started.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were persistence mechanisms installed on this host around the tampering?
  context: After weakening Defender's response, durable access is commonly established through scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Several persistence installations in the same window indicate intentional stacking rather than isolated administration; check each surfaced command for what it configures to run.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into startup or persistence locations on this host?
  context: Dropping an executable or script into a Startup folder or a Run-key path achieves persistence without running schtasks, sc, or reg — and with threat actions set to Allow or NoAction, a dropped payload will not be quarantined on write. File events capture these drops even when the actor avoids standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
