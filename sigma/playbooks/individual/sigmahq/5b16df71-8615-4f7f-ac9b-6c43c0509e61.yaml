name: Hide Schedule Task Via Index Value Tamper
id: 5179b616-9af2-48cd-9297-ecd444cf1d08
description: |
  Detects a registry modification that sets a scheduled task's Index value under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\ to DWORD 0.
  Zeroing Index removes the task from the Task Scheduler application and schtasks /query
  enumeration while the task keeps executing on schedule and surviving reboots, and a
  subsequent change to the hidden task can silently delete it without the usual
  task-deletion audit event. Legitimate software does not zero an existing task's Index
  value, so the investigation should identify the hidden task, attribute the writing
  process, determine whether the task ran, and establish what other tampering or
  persistence accompanied the concealment.
type: detection
detection_id: 5b16df71-8615-4f7f-ac9b-6c43c0509e61
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Is the modified value an Index entry under the TaskCache Tree key, set to DWORD zero?
  context: >-
    Confirm the alert is a true positive on all three criteria the rule requires — the
    registry path (TargetObject) falls under \SOFTWARE\Microsoft\Windows NT\CurrentVersion\Schedule\TaskCache\Tree\,
    the value written is Index, and the value data (Details) is DWORD (0x00000000). Task
    registration writes nonzero Index values as part of normal operation; the zero write is
    what hides a task from enumeration. The path segment between Tree\ and \Index is the
    name of the task being hidden — note it, it anchors the rest of the investigation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - registry_event
- question: Is this user or host expected to modify Task Scheduler registry entries directly?
  context: >-
    Legitimate task management goes through the Task Scheduler interfaces (the UI,
    schtasks.exe, management frameworks), which maintain Index values themselves — direct
    edits of an existing task's Index value have no routine administrative purpose. Check
    whether the account has an administrative role and a plausible reason to touch TaskCache
    keys; when User is a machine account or SYSTEM, judge by the writing process (Image)
    instead, calibrated against the administrative tooling expected on this host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which scheduled task was hidden, and what does the Index change do?
  context: >-
    Every registered task has a subkey under TaskCache\Tree holding Id, Index, and SD
    values. Setting Index to 0 removes the task from the Task Scheduler application and
    from schtasks /query output while the task keeps executing on schedule and across
    reboots; querying the task by its explicit name with schtasks /query /tn still answers.
    Deleting the Tree subkey's SD value is a sibling variant with the same hiding effect.
    Read the task name from the TargetObject path and check whether the name imitates a
    legitimate Windows or vendor task.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - registry_event
- question: What process wrote the zeroed Index value, and does its command line show the tamper action?
  context: >-
    A command-line write typically appears as reg.exe add against the TaskCache Tree path
    with /v Index /d 0 /t REG_DWORD; the tamper is also seen staged as a scheduled task
    action itself, in which case the writing process runs under the task host rather than
    an interactive shell. A direct API write from a custom binary, script host, or injected
    code leaves no reg.exe command line — then the writing binary's identity and origin
    carry the attribution. The control impaired here is task visibility to enumeration and
    management tooling, not the task engine, which continues to run the hidden task.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What parent process launched the process that performed the registry write?
  context: >-
    The parent chain shows how the tamper was invoked. An interactive chain such as
    explorer.exe to cmd.exe to reg.exe points to hands-on activity; taskhostw.exe or
    svchost.exe as the parent suggests the write itself ran as a scheduled task action; a
    script host, Office application, or unfamiliar binary as the parent points to a loader
    or implant. This retrieves the writing process's own creation event with its parent
    lineage — the long lookback is intentional, since long-running parents often start days
    before the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: When was the hidden task registered, and what other TaskCache changes occurred on this host?
  context: >-
    Registering a task writes a Tree subkey (Id, Index, SD values) and a Tasks GUID entry
    under the TaskCache hive; tasks scheduled for boot or logon also write Boot, Logon, or
    Plain entries. A task registered shortly before its Index was zeroed was likely created
    for this operation, while an old task suddenly hidden suggests concealment of an
    existing foothold. Look for writes naming the hidden task, and for Index or SD writes
    against other task paths that would indicate additional tasks being hidden. Windows
    Security event 4698 records task creation with the full task definition where that
    audit source is collected.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Schedule\TaskCache\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - registry_event
  - manual_review
- question: Is the task still hidden now, or has its Index value been restored?
  context: >-
    Check the key's later modification history and query the task by explicit name on the
    host (schtasks /query /tn with the task name from the alert path answers even while the
    task is hidden from enumeration). Running schtasks /change against any task regenerates
    Index values and restores visibility, and a change made to the task while its Index is
    zero silently deletes it without the Security 4699 deletion event. Endpoint telemetry
    records no registry deletion events, so judge cleanup from the key's re-modification
    history and direct host inspection rather than expecting a delete record.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: Did the hidden task execute after the Index value was zeroed?
  context: >-
    A task hidden by this technique keeps running on its schedule — that is the point of
    hiding it. Task actions start under the task host processes, so review processes whose
    parent is taskhostw.exe, taskeng.exe, or svchost.exe in the hours after the tamper and
    look for the hidden task's action binary or script among them. The executed payload
    defines what this persistence is actually doing; correlate anything unfamiliar with the
    task name recovered from the alert path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith:
          - '\taskhostw.exe'
          - '\taskeng.exe'
          - '\svchost.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who tamper with one key commonly change several in the same window —
    additional TaskCache writes hiding more tasks, Run keys, service configuration, or
    security policy values landing together indicate a hands-on session or an
    installer-style implant. The triggering write will appear in the results; the signal is
    what else changed, grouped by key path and writing process. If the host is
    registry-noisy, narrow to the writing process from the alert or to security-relevant
    hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
  answer_sources:
  - registry_event
- question: Were other defense tampering actions performed on this host?
  context: >-
    Hiding a task is rarely the only impairment step. Log clearing, shadow-copy deletion,
    recovery disabling, security service stops, or firewall changes in the same window
    indicate several controls were targeted in one operation. The query's tool and
    command-pattern list covers common tampering primitives and is a tunable element —
    extend it with the security product service names deployed in this environment. The
    time windows here and in the surrounding activity questions are the correlation windows
    that tie registry edits, process activity, and service changes into a single operation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What ran on this host in the hour after the task was hidden?
  context: >-
    Concealment usually precedes or accompanies the activity it protects. Review process
    activity after the tamper for execution consistent with the hidden task's action,
    staging of additional tooling, or credential access. Results are grouped by binary and
    user so repetitive service noise collapses into high-count rows; pair this with the
    task-execution question to separate the hidden task's own payload from other
    post-tamper activity.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Activity immediately around the tamper shows what led to it and what followed —
    reconnaissance, privilege escalation, or payload staging. Aggregating by image and
    parent collapses repetitive agent noise into single high-count rows while novel
    parent-child pairs stand out at low counts. Registry-side clustering in the same window
    is covered by the related-modifications question; this one covers the process side.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial access, scheduled task creation,
    credential access, or other tampering — reveal the stages that preceded the concealment
    and help reconstruct the timeline. A task-creation or task-modification detection
    shortly before this alert is a direct antecedent worth pivoting to.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Has this task's Index value been modified before on this host?
  context: >-
    Index values are written once at task registration and then rarely touched, so repeated
    writes to the same task's Index value indicate visibility being toggled deliberately.
    Zero prior history means this write is the first change since registration. Compare the
    Details data across any earlier events — nonzero values are ordinary registration
    writes, and a previous zero write means the task has been hidden before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
  answer_sources:
  - registry_event
- question: Does this host normally run the binary that performed the write?
  context: >-
    A writing binary that has never appeared on the host before points to introduced
    tooling, while a ubiquitous utility such as reg.exe needs judgment from its command
    line and parent rather than its mere presence. Grouping by user shows which accounts
    normally drive this binary and whether the alerting account is among them — the
    administrative tools expected in this environment are the calibration point for normal.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Was the same task's Index value modified on other hosts?
  context: >-
    The identical task path zeroed across several hosts points to a distributed operation
    or a shared deployment mechanism, while a single-host modification suggests targeted
    concealment. Compare Details values across hosts — nonzero writes are ordinary task
    registration or maintenance; the concern is the zero value that hides the task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
  answer_sources:
  - registry_event
- question: Were other persistence mechanisms installed on this host around the tamper?
  context: >-
    The hidden task is itself a persistence foothold, and attackers commonly stack backup
    mechanisms — additional tasks, services, Run keys, BITS jobs, or WMI subscriptions — in
    the same timeframe. schtasks.exe activity in this window also matters for the hidden
    task itself, because a schtasks change applied to a task whose Index is zero silently
    deletes it without the usual deletion audit record.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection — an executable dropped into a
    Startup folder, or a task definition XML written under the System32 Tasks directory,
    achieves persistence without running schtasks or reg. A task XML written near the alert
    corroborates registration of the task that was then hidden and preserves its full
    definition (action, triggers, principal) for review.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
          - '\System32\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
