name: RedMimicry Winnti Playbook Registry Manipulation
id: 441997d6-df3d-41c1-8dea-3ae78ef35414
description: |
  Detects registry modifications to key paths containing HKLM\SOFTWARE\Microsoft\HTMLHelp\data, a location the Winnti
  malware family uses to stage encrypted implant configuration and payload data, and which the RedMimicry
  breach-and-attack emulation platform reproduces in its Winnti playbook (T1112). The HTML Help component does not
  maintain a data value at this location, so a write here reflects either an authorized emulation exercise or genuine
  implant staging that blends into vendor-looking registry space. The investigation should identify the writing process
  and its lineage, examine the stored value data, determine whether a scheduled security exercise explains the activity,
  and establish whether dropped files, persistence mechanisms, or follow-on execution accompanied the write.
type: detection
detection_id: 5b175490-b652-4b02-b1de-5b5b4083c5f8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the modified registry path fall under HKLM\SOFTWARE\Microsoft\HTMLHelp\data as this rule requires?
  context: Confirm the alert is a true positive by verifying the triggering event's key path (TargetObject) contains
    HKLM\SOFTWARE\Microsoft\HTMLHelp\data, and note the writing process. The rule fires on the key path alone — the
    value data written there is examined in the value-decode question to establish what was staged.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host a plausible source of writes to the HTML Help data key?
  context: The HTML Help component does not maintain a data value at this location, so legitimate write sources are
    essentially limited to authorized security-testing activity. Note the user, the host's role, and the writing
    process. User attribution is present on most endpoint registry events; when it resolves to SYSTEM, a machine
    account, or is missing, judge the event from the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Was an authorized adversary-emulation or penetration-testing exercise scheduled for this host at this time?
  context: This detection targets artifacts produced by the RedMimicry Winnti emulation playbook, so a common benign
    explanation is an approved security test. Check the red-team calendar, security-testing change records, or the team
    running purple-team exercises for a window covering this host and time. If no exercise is documented, treat the
    activity as a genuine Winnti-style intrusion pattern — the registry artifact is the same either way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process performed this registry write, and what parent chain started it?
  context: The writing process and its lineage determine what delivered the modification. Legitimate registry tools such
    as regedit.exe or msiexec.exe are routine writers elsewhere in the registry but have no reason to touch this key.
    Check whether the writing executable is signed and whether its parent chain matches normal software installation on
    this host — an unsigned writer, a script host, or a web-server worker in the chain points to compromise or an
    emulation of one. If parent linkage does not resolve from the registry event, look up the writing process's own
    creation event via its ProcessGuid to read its parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which exact key and value under the HTML Help path were modified, and is this a recognized implant storage location?
  context: HKLM\SOFTWARE\Microsoft\HTMLHelp is a legitimate Microsoft component path, which is precisely why implants
    place a data value beneath it — the write blends into vendor-looking registry space. Winnti-family tooling stores
    encrypted configuration or payload blobs at this location rather than an autorun entry, so treat the write as
    payload staging and use the value-decode question for what the data contains. Note the exact subkey and value name;
    the writing process shown here anchors the lineage and file-activity questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written under the HTML Help data key, and what does it contain?
  context: Winnti-style staging writes an encrypted or encoded blob rather than a readable path or command. Examine the
    Details field for base64 or hex content, embedded file paths, or recognizable command fragments. Binary value data
    is often not captured in Details at all, so an empty field alongside a confirmed write is consistent with a binary
    payload blob and does not indicate a no-op — confirm the value directly on the host if needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same window?
  context: Implant installation rarely touches a single key. Look for companion writes in security-relevant paths — Run,
    RunOnce, Services, Policies, Winlogon, IFEO — landing together with the staging write; the emulation playbook and
    real intrusions alike chain persistence, defense tampering, and configuration changes in one session. Group by the
    writing process to separate the operation's writes from background registry noise.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did the process that wrote this key also create or modify files on disk in the same session?
  context: Registry staging usually accompanies a dropped loader or payload file. Correlating file activity by the
    writing process and its children surfaces binaries or scripts that landed in the same session. The file-write event
    carries no hash; if a payload file is present, hash it from a later execution event or retrieve it for a reputation
    lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the writing process launch follow-on execution after storing data in the key?
  context: Data staged under the HTML Help key is only useful once a loader retrieves and executes it. Child processes
    of the writer show whether the operation progressed past staging — look for service control commands, script hosts,
    or newly dropped binaries executing shortly after the write.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the registry write?
  context: Correlating the registry change with nearby process execution frames the wider sequence — what led to the
    write and what followed it. The aggregation collapses repetitive agent and system noise into high-count rows; scan
    the low-count novel parent-child pairs for discovery commands, service manipulation, or tooling consistent with an
    implant install or a scripted emulation run.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this registry key been modified before on this host?
  context: The HTML Help data value is not maintained by routine software activity, so any prior history matters. Zero
    history means a first-time write; repeated modifications may reflect an earlier implant install, a recurring
    emulation exercise, or a re-tasked configuration blob. Compare the Details values and writing processes across
    occurrences.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed the write?
  context: A writer that has never executed on this host before points to a newly introduced binary. A long-running,
    commonly seen process performing the write would instead suggest code running inside an existing host process,
    which matches how Winnti-style loaders operate. Zero or very low 90-day counts mean first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same HTML Help data key modified on other hosts in the environment?
  context: The same staging key appearing across multiple hosts indicates either a fleet-wide emulation run or lateral
    spread of the same implant pattern. Compare writing processes and Details values across hosts — identical writers
    and blobs suggest one coordinated operation, while a single affected host suggests targeted or early-stage
    activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were persistence mechanisms installed on this host around the registry write?
  context: Registry data staging is one stage of an implant install; the surviving foothold is usually a service,
    scheduled task, or Run key created in the same session. Executions of schtasks, sc, reg, at, bitsadmin, or wmic
    within hours of the write show whether a launch mechanism accompanied the staged payload.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped into Startup or run-key locations on this host?
  context: File drops into Startup folders achieve persistence without running any persistence utility, so they
    complement the tool-based check. A loader written to a startup path in the same window as the registry staging
    write indicates an active install rather than an isolated registry artifact. Both user-level and system-level
    Startup folders are covered.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier alerts on the same host — initial-access tooling, defense tampering, credential access — reconstruct
    the stages that preceded the staging write. A scripted emulation sequence typically fires several detections in
    quick succession, while slower hands-on activity spreads out; either way the alert timeline places this event in
    the larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
