name: Suspicious Child Process of SAP NetWeaver
id: f2054ff2-12d3-4a6c-9fe4-acc3e094ae16
description: |
  Detects a command interpreter or LOLBin (cmd.exe, powershell.exe, powershell_ise.exe, pwsh.exe,
  wscript.exe, cscript.exe, regsvr32.exe, rundll32.exe, mshta.exe, certutil.exe, bitsadmin.exe,
  python.exe) running in the context of an SAP NetWeaver Java application server. The rule fires when
  the child image matches that list AND either the parent process image sits under the NetWeaver
  servlet_jsp irj work or root directory, or the child's own working directory does. Unauthenticated
  upload and deserialization flaws in the Visual Composer component (CVE-2025-31324, CVE-2025-42999)
  allow a JSP webshell to be planted in exactly those directories, or code to run in memory, after
  which OS commands execute under the SAP service account with access to the application, its
  database, and the rest of the host. SAP instances do legitimately run OS commands through their own
  external-command and batch-job scheduling, so the investigation should establish which branch fired,
  decode what the child command actually did, identify the request that triggered it, account for any
  files written into the servlet_jsp directories, and confirm the instance's patch level.
type: detection
detection_id: 5b304bcb-ac33-49d0-87af-fa1b3ca94333
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Did a child from the interpreter and LOLBin list start either under a parent image in the SAP
    NetWeaver servlet_jsp path or with its working directory set there?
  context: >-
    The rule requires the child image to end in one of cmd.exe, powershell.exe, powershell_ise.exe,
    pwsh.exe, wscript.exe, cscript.exe, regsvr32.exe, rundll32.exe, mshta.exe, certutil.exe,
    bitsadmin.exe or python.exe, and additionally requires at least one of two location branches to
    match: the ParentImage contains the NetWeaver servlet_jsp irj work or root directory, or the
    CurrentDirectory does. Note which branch fired. A ParentImage match means the launching
    executable itself lives inside the deployed web application tree, which is where uploaded
    webshell code is compiled and staged. A CurrentDirectory match means the child inherited that
    directory as its working directory, which points at the same tree even when the parent path
    looks ordinary, and makes establishing the parent lineage the load-bearing next step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CurrentDirectory
  answer_sources:
  - alert
  - process_creation
- question: >-
    Is this application server, and the account it runs under, expected to launch command
    interpreters or LOLBins out of the servlet_jsp directory?
  context: >-
    Child processes of a NetWeaver Java instance normally run under the SAP service account
    (conventionally the <SID>adm account), which is also the account a webshell's OS commands inherit
    — so the account name alone does not separate operator activity from application activity. What
    separates them is whether this server's role includes running shell commands from the deployed
    web application tree at all. Confirm with the team that owns the instance whether any external
    command, batch job, or transport process is defined to run from that directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this parent expected to spawn this interpreter, and what started the parent itself?
  context: >-
    The parent-child relationship is the core signal for this detection. Retrieving the parent's own
    creation event shows its full image path, its command line, and its grandparent, which is what
    distinguishes an application-server worker executing an operator's command from a scheduled SAP
    job or a transport step that legitimately shells out. The parent's command line is also where a
    working-directory-only match is resolved: it shows whether the launcher is the Java server
    process or something that merely ran from the same directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    Hands-on-keyboard use of a webshell produces a burst of children from one parent instance rather
    than a single command — reconnaissance such as whoami or ipconfig, then a download utility, then
    execution of what was fetched. A single child that is part of a defined SAP external command or
    batch job typically appears alone or in a repeating, identical sequence. The pattern across
    siblings separates the two better than any single command line does.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What web request to the application server triggered this execution?
  context: >-
    Server-side exploitation of this component begins with an HTTP request to the Visual Composer
    developmentserver metadatauploader endpoint, which accepts an unauthenticated upload and yields
    remote code execution; requests are seen as POST, HEAD, and GET. This query returns the parent
    process and its command line only — the originating request lives in the application's own HTTP
    access logs, which must be reviewed directly. Look there for requests to the developmentserver
    alias, exploit-like input patterns (directory traversal with ../, ${jndi: strings, the rO0AB
    prefix that marks a serialized Java object, cmd= parameters, %00 truncation), a spike of 4xx or
    5xx responses from a single client (more than five in five minutes is a workable starting
    threshold), and the client IP behind whatever public address fronts this listener.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this SAP NetWeaver instance patched against the known Visual Composer upload and deserialization flaws?
  context: >-
    CVE-2025-31324 is an improper authentication and authorization flaw in the Visual Composer
    developmentserver metadata uploader affecting NetWeaver Java 7.1x and above, and CVE-2025-42999
    is a deserialization flaw in the same stack that addresses the residual risk and enables
    in-memory execution at administrator privilege. Confirm the affected component (VCFRAMEWORK /
    Visual Composer Framework) and whether SAP Security Note 3604119 has been applied. An unpatched
    instance makes exploitation a live explanation for this alert and puts every other instance at
    the same patch level in scope; a patched one shifts weight toward a webshell left behind from
    earlier exploitation, or toward legitimate SAP-driven command execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: What exactly did the spawned interpreter do? Decode its full command line and arguments.
  context: >-
    This is where the alert is decided. Read every argument and resolve what the command actually
    performs. Webshell-driven commands on this platform commonly use a download utility to fetch a
    second stage over HTTP on a non-standard port and write it to a world-readable path such as
    C:\Users\Public or %TEMP% (for example, certutil with -urlcache -split -f followed by a URL and a
    local output path), and chain steps together with && or the ^ escape character. Reconnaissance
    forms such as /c ping or /k whoami indicate interactive use rather than a defined job. The query
    is scoped to the alerting process instance rather than to all runs of this binary on the host,
    because cmd.exe and powershell.exe are far too common on a server for a host-plus-binary scope to
    be readable, and this rule carries no command-line values to filter on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Was the command encoded or obfuscated? What does it decode to?
  context: >-
    When the child is powershell.exe, powershell_ise.exe, or pwsh.exe, the operator's payload is
    frequently passed through -EncodedCommand (-enc) as base64, or hidden with string concatenation,
    backtick escaping, and variable substitution. Decode it and identify what the payload does:
    a download cradle such as IEX(IWR(...)) or Net.WebClient.DownloadString names a source URL and an
    output path worth pivoting on, while [Reflection.Assembly]::Load points at in-memory execution
    that leaves little on disk. If the command is already readable plain text, treat the cradle
    pattern itself as the answer and check the URL's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the full script content on this server?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, even when the
    command line was encoded — it is ground truth for what ran. If PowerShell operational logs are
    not ingested in this environment, this query returns nothing by construction; treat that as a
    visibility gap on the server rather than evidence nothing ran, and decode the alerting command
    line directly instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: >-
    Operators commonly clear the way before running a payload — an execution policy bypass flag,
    Set-MpPreference with real-time monitoring disabled, an AMSI patch via AmsiUtils or
    amsiInitFailed, or a downgrade to PowerShell version 2 which lacks script block logging.
    On an application server these commands have no routine explanation, and finding them in the hour
    before the alert establishes preparation rather than a one-off command.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What files were written into the NetWeaver servlet_jsp work and root directories on this host?
  context: >-
    Exploitation of the upload flaw plants code in exactly the directories this rule keys on, and the
    deployed web application tree has no routine reason to receive new files outside a transport or
    deployment window. Treat any .jsp, .java, or .class file appearing there as needing an account,
    and note the process that wrote it and the write time relative to the alert. The write event
    carries no hash — to reputation-check a file, find the later event where it executes and take the
    hash from there. A deserialization-based path executes in memory and leaves nothing on disk, so
    an empty result does not rule out exploitation.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - '\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work'
          - '\j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root'
      condition: selection and selection_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What modules did the spawned process load, and are any unsigned or loaded from a writable application directory?
  context: >-
    Post-exploitation on a public-facing server frequently continues by loading a non-standard module
    into the spawned process rather than dropping a new executable. regsvr32.exe, rundll32.exe, and
    mshta.exe take a module or script path directly on the command line, so their load events name
    the payload. The load event carries the module path, whether it is signed, the signer, and the
    signature status — an unsigned module, or one loaded from under the SAP application tree or a
    world-writable path, identifies the payload directly. In-memory-only execution produces no module
    load, so an empty result is not exoneration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - process_creation
- question: Did any interpreter or LOLBin on this server make outbound connections around the time of the alert?
  context: >-
    The exploitation chain typically closes with egress from the server — a second-stage download or
    a callback — within roughly fifteen minutes of the process spawn; this query uses a wider window
    to catch slower staging. The connection is scoped to the same interpreter and LOLBin list the
    rule keys on, so the result is egress by those binaries specifically rather than all server
    traffic, which on an application server is dominated by legitimate client and database sessions.
    Destinations on non-standard ports, and any destination that is not an SAP peer, a proxy, or an
    update service, are what to resolve here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_child:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\regsvr32.exe'
          - '\rundll32.exe'
          - '\mshta.exe'
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\python.exe'
      condition: selection and selection_child
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account — the result is the
    account's 90-day history of this specific firing pattern, not generic use of cmd.exe or
    powershell.exe, aggregated by host. An SAP service account that has produced this pattern
    routinely across the estate points at a defined external command or batch job that should be
    identifiable by name; one with no prior history makes this a new behavior for that identity.
    Weigh the count against what the team that owns the instance says the account is meant to do.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentImage|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_current_dict:
        CurrentDirectory|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \mshta.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \python.exe
      _pb_scope:
        User|expand: '%User%'
      condition: ((selection_parent_img or selection_current_dict) and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    Child processes of an SAP instance run under a long-lived service identity, so the account name
    attributes nothing — the launch mechanism does. The query mirrors the rule's selection structure
    scoped to the alerting parent process, giving the 90-day history of this parent driving this
    specific pattern rather than generic parent-and-binary co-occurrence, aggregated by host. A
    parent already accounting for a steady volume of prior events across hosts is SAP's own command
    or job scheduling; a parent that is new or rare for this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentImage|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_current_dict:
        CurrentDirectory|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \mshta.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \python.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_parent_img or selection_current_dict) and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    identity was active on other systems at the same time, which is how a foothold on one application
    server becomes movement to its neighbors. If the alert fired under a service or machine identity,
    this view fills with routine agent and platform telemetry from every host that identity touches —
    read it for hosts that should not be there, and rely on the parent-scoped fleet view for the
    scope answer.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service identity, asking what else the account did returns agent telemetry from
    everywhere. The meaningful question is whether the same launch mechanism fired elsewhere: the
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide,
    in the alert window. Several hosts in the same window points at scheduled or pushed automation,
    or at an operator working through a set of instances exposed by the same flaw; a single host
    points at a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent_img:
        ParentImage|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_current_dict:
        CurrentDirectory|contains:
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\work
        - \j2ee\cluster\apps\sap.com\irj\servlet_jsp\irj\root
      selection_child:
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        - \wscript.exe
        - \cscript.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \mshta.exe
        - \certutil.exe
        - \bitsadmin.exe
        - \python.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_parent_img or selection_current_dict) and selection_child) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Were other servers targeted by the same exploitation pattern?
  context: >-
    Internet-facing application flaws are exploited against every reachable instance, not one. This
    correlates the same detection across all hosts over the past day, grouped by host and account, so
    a second or third instance firing the same rule turns a single-server investigation into an estate
    one and identifies which other systems need the same file and patch checks. A second wave
    reusing webshells left by an earlier one is common, so hosts that fired days apart still belong to
    the same picture.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
