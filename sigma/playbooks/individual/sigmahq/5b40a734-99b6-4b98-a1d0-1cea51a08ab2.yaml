name: Suspicious Interactive PowerShell as SYSTEM
id: 9b2f7e28-6a68-491c-84ec-94b2badadd50
description: |
  Detects writes to the SYSTEM account's PowerShell profile artifacts — the PSReadLine
  console history (ConsoleHost_history.txt) and the interactive startup profile marker
  (StartupProfileData-Interactive) under C:\Windows\System32\config\systemprofile. These
  files are produced when PowerShell runs interactively in the SYSTEM user context,
  meaning someone had a live SYSTEM console — commonly an administrator using a
  remote-execution tool that spawns SYSTEM sessions or sanctioned endpoint-management
  tooling, but also an operator who escalated to SYSTEM and is typing commands by hand.
  The investigation should establish how the session was launched, recover the
  typed-command history and any logged script content, and trace what the session
  spawned, loaded, wrote, and contacted.
type: detection
detection_id: 5b40a734-99b6-4b98-a1d0-1cea51a08ab2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file match the SYSTEM-profile interactive PowerShell artifacts this rule detects?
  context: |
    The rule fires when a file is written at
    C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt
    or C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive.
    Both paths sit inside the SYSTEM account's own user profile and are produced by an
    interactive PowerShell console running as SYSTEM — PSReadLine appends each accepted
    line to the history file, and the startup profile marker is written when an
    interactive console initializes. Confirm the exact path, the operation, and the
    writing process before investing further time.
  range: +/-5m
  answer_sources:
  - alert
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is interactive PowerShell in the SYSTEM context expected on this host?
  context: |
    SYSTEM-interactive PowerShell typically comes from an administrator using a
    remote-execution utility that opens a SYSTEM console (psexec-style -s sessions),
    from endpoint-management or deployment agents, or from vendor tooling that runs
    consoles under the service context — all listed false-positive sources for this
    rule. The query displays the triggering event's host, user, and writing process;
    the User will usually be SYSTEM itself, so judge by the host's role and by which
    administrative tooling is sanctioned on it.
  range: +/-5m
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the history file still on disk, or was it deleted or renamed after the alert?
  context: |
    ConsoleHost_history.txt is a plaintext transcript of every line typed into the
    console and persists across sessions, which makes it both key evidence and a
    natural cleanup target. A deletion shortly after the session suggests
    anti-forensic cleanup and shifts attention to what executed in between; if the
    file survives, retrieve and preserve it before any remediation overwrites it.
  range: +4h
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What commands does the recorded console history contain?
  context: |
    The alerted file is written by the PowerShell host itself — PSReadLine appends
    each accepted line, so the history is a literal transcript of what the operator
    typed. Retrieve it from the endpoint and review for credential-access functions,
    download cradles, encoded or obfuscated strings, reconnaissance commands, and
    account or service manipulation. The file accumulates across sessions, so separate
    long-standing lines from the newest entries. The query locates the write events
    and the responsible process to support retrieval.
  range: +/-5m
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What command line launched this PowerShell host, and was anything encoded or hidden in it?
  context: |
    A genuinely hands-on console usually shows a bare powershell.exe command line.
    Launch flags such as -enc or -EncodedCommand, -nop, -w hidden, or -ep bypass on a
    session that then behaves interactively point to a scripted wrapper or a
    remote-execution harness rather than a simple console. Decode any base64 payload
    to reveal what ran before the operator reached a prompt — download cradles,
    in-memory .NET loads, and reverse shells are the common findings.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process launched this SYSTEM PowerShell session, and is that launch path expected?
  context: |
    The alert's file event carries the PowerShell process's identifier; this retrieves
    its creation event with the parent chain. The parent identifies the mechanism — a
    service binary descending from services.exe points to remote service execution,
    wmiprvse.exe to WMI-based launch, a scheduled-task host to automation, and an
    unfamiliar or recently dropped parent to a service exploited for escalation into a
    SYSTEM shell. Walk up the parent's own lineage if the immediate parent does not
    explain the session.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - User
- question: Did PowerShell script block logging capture what this SYSTEM session executed?
  context: |
    Event ID 4104 records the deobfuscated script content PowerShell actually ran,
    complementing the typed-command transcript with the bodies of any scripts,
    functions, or modules the operator invoked. Long or high-entropy script blocks
    attached to an interactive SYSTEM session deserve line-by-line review. If
    PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +/-5m
  answer_sources:
  - powershell_script_block
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this session?
  context: |
    Operators frequently disable protections before interactive work — AMSI bypass by
    patching amsi.dll in memory (AmsiUtils, amsiInitFailed), execution-policy bypass
    launches, real-time-monitoring changes through Set-MpPreference, or a downgrade to
    PowerShell version 2, which lacks script logging. Any of these in the hour before
    the session strengthens the malicious reading and marks where the preparation
    began.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What libraries did this PowerShell session load?
  context: |
    Module loads profile what the session actually did beyond its command lines.
    Loads of credential-related libraries (samlib.dll, vaultcli.dll, comsvcs.dll),
    DLLs from user-writable paths, or rare and never-before-seen .NET assemblies are
    the deviations worth chasing. Library-load events carry signature status and hash
    directly, so unsigned or unrecognized entries can go straight to a reputation
    lookup without any further pivot.
  range: +/-4h
  answer_sources:
  - external_threat_intel
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - SignatureStatus
      - Hashes
- question: What child processes did this SYSTEM PowerShell session spawn?
  context: |
    A hands-on operator typically launches follow-on utilities — account and domain
    reconnaissance, archivers, credential tooling, or a nested cmd.exe — and every
    child inherits the SYSTEM context. The absence of children does not clear the
    session, because native cmdlets execute in-process; in that case the console
    history and script-block content remain the authoritative record of what happened.
  range: +4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this PowerShell session initiate network connections?
  context: |
    Interactive sessions commonly reach out — download cradles pulling second-stage
    tooling, transfers of collected data, or connections made by payloads executed
    in-process, which surface as outbound traffic from the PowerShell process itself.
    Review external destinations for reputation and treat internal destinations as
    possible lateral-movement targets, since the session already holds SYSTEM on this
    host.
  range: +/-4h
  answer_sources:
  - network_connection
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What other files did this session or its children write or delete around the alert?
  context: |
    Tool staging, dropped payloads, output files such as archives or memory dumps,
    and cleanup deletions all appear as file activity by the session and its direct
    children. Where the writes land matters more than how many there are — pay
    attention to user-writable staging paths, the SYSTEM profile itself, and anything
    executable, and treat paired create-then-delete sequences as staged tooling that
    was cleaned up.
  range: +/-30m
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written under the SYSTEM profile recently, and by which processes?
  context: |
    C:\Windows\System32\config\systemprofile is the SYSTEM account's own user
    profile. Operators working from a SYSTEM shell stage tools and output beneath it
    because it is writable to them and rarely reviewed, while legitimate writers
    there are a small set of services and management agents. The aggregation groups a
    week of writes under the profile by path and writing process — an unfamiliar
    writer, or executable content appearing beneath this profile, reveals staging
    beyond the alerted artifacts.
  range: -7d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\config\systemprofile\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this account produced this interactive-PowerShell pattern before, and does that history fit how the host is administered?
  context: |
    The query mirrors the rule's selection scoped to this user — the 90-day history
    of the exact SYSTEM-profile interactive artifacts, aggregated by host. On these
    alerts the user is typically SYSTEM itself, so prior counts measure how routinely
    hosts see SYSTEM-interactive consoles at all. A first-ever event on a host with
    no sanctioned remote-administration tooling is the deviation worth chasing; a
    steady history that traces to known admin practice supports the benign reading.
  range: -90d
  answer_sources:
  - file_event
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt
        - C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this interactive-PowerShell pattern on this host or across the environment?
  context: |
    Because these alerts usually fire under SYSTEM, user identity does not attribute
    the behavior — the launch mechanism does. The query mirrors the rule's selection
    scoped to the alerting program, returning the 90-day history of this
    program driving the exact SYSTEM-interactive pattern, aggregated by host. A program
    already accounting for many prior events across many hosts points to sanctioned
    tooling whose owner can confirm the practice; a program that is new for this
    pattern is the deviation worth chasing.
  range: -90d
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt
        - C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around this time?
  context: |
    Cross-host activity by the same account in the surrounding window shows whether
    this session is isolated or one stop in a wider operation. When the account is
    SYSTEM this view fills with agent-telemetry noise fleet-wide, and the
    parent-anchored clustering question is the meaningful variant; for a named
    account, concurrent process activity on other hosts widens the scope that needs
    review.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program-driven pattern fire on other hosts in the same window, or is this activity isolated to this host?
  context: |
    The query mirrors the rule's selection scoped to the alerting program,
    fleet-wide, in the alert window. Several hosts producing SYSTEM-interactive
    PowerShell artifacts under the same program at the same time points to pushed or
    scheduled automation — or to a scripted lateral-movement wave using one
    remote-execution mechanism — while a single host points to a host-local trigger.
    The host list defines the scope for any follow-up review.
  range: +/-1h
  answer_sources:
  - file_event
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename:
        - C:\Windows\System32\config\systemprofile\AppData\Roaming\Microsoft\Windows\PowerShell\PSReadLine\ConsoleHost_history.txt
        - C:\Windows\System32\config\systemprofile\AppData\Local\Microsoft\Windows\PowerShell\StartupProfileData-Interactive
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    An interactive SYSTEM console is rarely the first event in a chain — something
    delivered the access and something escalated it. Earlier alerts on the same host
    covering initial execution, privilege escalation, defense tampering, or
    credential access reconstruct how the operator reached SYSTEM and what the
    session was for.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
