name: Suspicious Manipulation Of Default Accounts Via Net.EXE
id: 8d910230-cbb3-47f7-9d59-504186d75d78
description: |
  Detects net.exe or net1.exe run with a ' user ' argument that names a built-in
  default or administrator account - 'Administrator' (and its localized forms),
  'guest', or 'DefaultAccount'. The rule fires only when the image is net.exe or
  net1.exe AND the command line contains the ' user ' option AND it references one
  of those default-account names, and it suppresses the benign 'net user guest
  /active no' disable command. Manipulating a default account this way - enabling a
  dormant account, resetting its password, or adding it to a privileged group - is
  a common way to establish a foothold using an account that blends in with normal
  administration. Legitimate administrators and provisioning scripts also touch
  these accounts, so the investigation should establish what action was taken
  against which account, who ran it from what parent, and whether the same pattern
  appears elsewhere on the host or fleet.
type: detection
detection_id: 5b768e71-86f2-4879-b448-81061cbae951
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did net.exe or net1.exe run with a ' user ' argument naming a default or
    administrator account, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the image is net.exe or net1.exe AND the command line carries
    the ' user ' option AND it references a built-in account name such as
    Administrator (including localized spellings), guest, or DefaultAccount. The
    benign 'net user guest /active no' disable command is filtered out. Read the
    exact command line and note which account was named and what action followed it -
    /add, a password value, /active yes, or addition to a group.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to create or modify local default accounts?
  context: Administrators, help desk staff, and provisioning scripts legitimately
    enable, rename, or reset built-in accounts during setup and maintenance. Standard
    users and most servers never touch the Administrator, guest, or DefaultAccount
    objects. Knowing whether the acting account and host function involve account
    administration is often the fastest path to separating routine provisioning from
    a foothold being established under a default account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the net command do to the default account - enable it,
    set a password, or add it to a group?
  context: The full command line reveals the specific manipulation. net.exe user
    <name> /active yes re-enables a dormant account; net.exe user <name> <password>
    resets its password; net.exe localgroup adds it to a privileged group. Read every
    argument to determine which default account was targeted and which of these
    actions was taken, since enabling and re-credentialing a built-in account is how
    an actor turns a dormant identity into a usable foothold. Multiple sequential net
    invocations on this host within the window may together form one logical
    operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \net.exe
          - \net1.exe
        CommandLine|contains: ' user '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which binary carried the command and was it net.exe or net1.exe run from
    its expected System32 path?
  context: net.exe forwards account commands to net1.exe, so either image can carry
    the manipulation, and the rule matches on OriginalFileName as well to catch a
    renamed copy. Identify which executable ran and where it lives. net.exe or
    net1.exe executing from System32 or SysWOW64 is the normal case; the same
    OriginalFileName running from a user-writable directory points to a copied or
    renamed binary placed to evade path-based allowlists.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Which account was named in the command, and is it a dormant default
    account that should not be active?
  context: The Administrator and DefaultAccount objects, and in many environments the
    guest account, are disabled or unused by default. An action that enables one of
    them, resets its password, or grants it group membership converts a dormant
    identity into a usable one. Determine whether the named account was supposed to be
    active and whether a human owner or process legitimately needed it changed; a
    default account being brought online unprompted is the finding worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - User
- question: What process spawned this net command, and is that parent chain expected?
  context: The parent process reveals how the account manipulation was invoked.
    Interactive administration usually shows cmd.exe or powershell.exe under
    explorer.exe; provisioning shows a known automation or installer parent. An
    unexpected parent such as a script host, wmiprvse.exe (remote WMI execution),
    wsmprovhost.exe (WinRM), or an Office application points to automated or remote
    invocation rather than a local admin at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single net command may be routine administration, but multiple
    reconnaissance commands in rapid succession - whoami, net user, net group,
    nltest, ipconfig - is a signature of post-compromise enumeration. An actor
    establishing a foothold under a default account typically enumerates the host and
    domain context first. The triggering net invocation is included in the recon
    binary list, so look for additional distinct binaries clustering in the window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What process spawned the discovery and account commands, and is that
    pattern normal?
  context: Account and discovery commands run by a local administrator are typically
    spawned by cmd.exe or powershell.exe under explorer.exe. The same commands
    spawned by winword.exe, wscript.exe, mshta.exe, wmiprvse.exe, or wsmprovhost.exe
    indicate macro-, script-, or remote-execution-driven enumeration rather than an
    interactive operator. The parent command line shows how the session was opened.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Were other privileged-account or remote-access changes made on this host
    around the same time?
  context: An actor who manipulates a default account often pairs it with enabling
    remote access or adjusting other privileged accounts - adding the account to
    Administrators or Remote Desktop Users, opening the RDP firewall rule, or
    flipping Terminal Server registry values. Finding net localgroup, netsh
    advfirewall, or reg writes against Terminal Server in the same window indicates a
    coordinated effort to make the foothold remotely usable rather than an isolated
    account edit.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_action:
        - Image|endswith:
            - '\net.exe'
            - '\net1.exe'
          CommandLine|contains: 'localgroup'
        - Image|endswith: '\netsh.exe'
          CommandLine|contains: 'advfirewall'
        - Image|endswith: '\reg.exe'
          CommandLine|contains: 'Terminal Server'
      condition: selection and selection_action
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \net.exe
        - \net1.exe
      - OriginalFileName:
        - net.exe
        - net1.exe
      selection_user_option:
        CommandLine|contains: ' user '
      selection_username:
        CommandLine|contains:
        - " J\xE4rjestelm\xE4nvalvoja "
        - ' Rendszergazda '
        - " \u0410\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440 "
        - ' Administrateur '
        - ' Administrador '
        - " Administrat\xF6r "
        - ' Administrator '
        - ' guest '
        - ' DefaultAccount '
        - " \"J\xE4rjestelm\xE4nvalvoja\" "
        - ' "Rendszergazda" '
        - " \"\u0410\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440\" "
        - ' "Administrateur" '
        - ' "Administrador" '
        - " \"Administrat\xF6r\" "
        - ' "Administrator" '
        - ' "guest" '
        - ' "DefaultAccount" '
        - " 'J\xE4rjestelm\xE4nvalvoja' "
        - ' ''Rendszergazda'' '
        - " '\u0410\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u043E\u0440' "
        - ' ''Administrateur'' '
        - ' ''Administrador'' '
        - " 'Administrat\xF6r' "
        - ' ''Administrator'' '
        - ' ''guest'' '
        - ' ''DefaultAccount'' '
      filter:
        CommandLine|contains|all:
        - guest
        - /active no
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
