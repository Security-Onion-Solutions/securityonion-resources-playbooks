- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    default-account manipulation was a single event or part of activity spanning
    multiple endpoints. If the same user touched accounts or ran administrative
    commands on other hosts in the same window, the scope of the incident is larger
    than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
