- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    account manipulation reveals what led to it and what followed - the parent that
    opened the session, reconnaissance, lateral-movement tooling, or follow-on
    execution. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - exploitation of an exposed service,
    credential access, or defense tampering - may reveal the attack stages that
    preceded the default-account manipulation and help reconstruct the full timeline.
    Account manipulation is often a mid-chain step, so prior alerts give the context
    for why a default account was being brought online.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
