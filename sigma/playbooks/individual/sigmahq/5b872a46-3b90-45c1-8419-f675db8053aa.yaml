name: UAC Bypass via Sdclt
id: 3081b928-cb43-4739-b504-f850e8abe881
description: |
  Detects registry writes associated with a fileless User Account Control (UAC) bypass that abuses the auto-elevating
  sdclt.exe binary. The rule fires when EITHER a value is written under the exefile ProgID runas verb at
  Software\Classes\exefile\shell\runas\command\isolatedCommand, OR a SymbolicLinkValue is written under
  Software\Classes\Folder\shell\open\command whose data points back into an HKCU Software\Classes path. Either write
  hijacks the command that the auto-elevated sdclt.exe process reads, so that launching sdclt.exe (via its /kickoffelev
  switch) executes an attacker-chosen command at high integrity without dropping a file to disk and without a consent
  prompt. Determine what command the hijack installed, which process performed the write, whether an elevated child
  process ran afterward, and whether other escalation or configuration changes accompanied it.
type: detection
detection_id: 5b872a46-3b90-45c1-8419-f675db8053aa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the modified registry key and value data match one of the two sdclt UAC-bypass branches this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path and value data. The rule fires on EITHER a
    write under Software\Classes\exefile\shell\runas\command\isolatedCommand, OR a SymbolicLinkValue under
    Software\Classes\Folder\shell\open\command whose data points back into an HKCU Software\Classes path. Note which
    branch fired -- both hijack the command sdclt.exe executes when it auto-elevates, and the value data reveals the
    command that was planted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify shell command handlers under HKCU Software\Classes?
  context: >-
    Writing a command handler under the current user's Software\Classes hive is not a routine administrative action and
    is the setup step for this bypass. If the writing user is a standard workstation user, or the host has no reason to
    reconfigure the exefile runas verb or the Folder open command, the modification is hard to explain as normal
    operation. User attribution is present on most endpoint registry events; when it resolves to a machine account or is
    missing, judge legitimacy from the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the modified key a known UAC-bypass command-hijack location, and what does writing it change?
  context: >-
    The exefile\shell\runas\command\isolatedCommand value and the Folder\shell\open\command SymbolicLinkValue are both
    command handlers that an auto-elevated process reads before spawning a child. Planting a value here redirects what
    sdclt.exe runs when it elevates, so the location supports privilege escalation without a consent prompt. These keys
    are not part of routine per-user configuration; the specific value written and the writing process determine what
    would execute at high integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or path was written into the hijacked handler value, and what would it execute?
  context: >-
    The value data is the payload of the bypass. For the isolatedCommand branch, the Details field holds the command
    line that sdclt.exe will run at high integrity -- often a shell, script host, or a path to an attacker binary in a
    user-writable directory such as Temp or AppData. For the SymbolicLinkValue branch, the data redirects into an HKCU
    Software\Classes path that in turn supplies the command. Read the Details field for the executable, arguments, or
    encoded content the hijack installs; if the value data is not captured because binary or empty data is not always
    recorded, confirm the value directly on the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process planted the hijacked handler, and did it also invoke sdclt.exe to trigger the elevation?
  context: >-
    The bypass is set up by a write to the isolatedCommand or Folder\shell\open\command handler and then triggered by
    launching sdclt.exe, whose undocumented /kickoffelev switch runs the hijacked command at high integrity. This query
    looks backward for the command interpreter or scripting host that wrote the bypass keys, and for the sdclt.exe
    invocation that fires it. Seeing reg.exe, powershell.exe, or cmd.exe touch these Software\Classes handlers, or an
    sdclt.exe /kickoffelev launch from a non-elevated context, corroborates a deliberate bypass over a false positive.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
          - '\sdclt.exe'
        CommandLine|contains:
          - 'isolatedCommand'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'SymbolicLinkValue'
          - 'Shell\Open\command'
          - 'kickoffelev'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process wrote this key, and is its parent chain expected?
  context: >-
    A legitimate change to shell command handlers would come from an installer or management workflow. Tracing the
    writing process back to its parent shows whether the modification originated from an administrative tool or from an
    interactive shell, scripting host, or Office application. A non-elevated parent spawning the process that plants the
    handler, or an unusual parent such as mshta.exe or wscript.exe, points to an escalation attempt rather than routine
    configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did sdclt.exe run after the key was planted, spawning the hijacked command?
  context: >-
    The payoff for the registry write is execution of the planted command when sdclt.exe auto-elevates. Review process
    execution on the host after the write for an sdclt.exe launch and, more importantly, for the child process it spawns
    -- the command taken from the hijacked handler running at high integrity. A shell, script host, or unexpected binary
    started shortly after the write, parented to sdclt.exe or running under its elevation, confirms the bypass took
    effect. The query anchors on sdclt.exe launches, on children parented to sdclt.exe, and on command lines
    carrying the written value data; for the SymbolicLinkValue branch the value data is a registry path rather
    than a command, so that anchor may match nothing and the sdclt parent-child anchors carry the check.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_sdclt:
        Image|endswith: '\sdclt.exe'
      selection_sdclt_child:
        ParentImage|endswith: '\sdclt.exe'
      selection_hijack_cmd:
        CommandLine|contains|expand: '%Details%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - ParentImage
      - CommandLine
- question: What action was performed with elevated privileges after the bypass?
  context: >-
    UAC bypass is a means to an end -- the hijacked command runs at high integrity to perform actions that require
    elevation: installing persistence, dumping credentials, tampering with security tools, or writing to protected
    locations. Examining High- or System-integrity processes on the host shortly after the write reveals the objective.
    Common auto-elevating front-ends abused this way include sdclt.exe, eventvwr.exe, fodhelper.exe, and
    computerdefaults.exe; the elevated child spawned here is the action worth tracing.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Operators who plant one bypass handler often make several changes together -- setting a Run key for persistence,
    disabling a security setting, or trying a second UAC-bypass front-end. Grouping registry modifications on this host
    in the surrounding window shows whether the sdclt handler write landed alongside other configuration changes, which
    distinguishes a hands-on session or an installer-style implant from an isolated modification. The triggering key will
    appear in the results; the signal is what else was changed.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this handler key been modified before on this host?
  context: >-
    The exefile runas isolatedCommand value and the Folder open-command SymbolicLinkValue should rarely, if ever, change
    on a normal endpoint. A history of prior modifications with the same value and writing process could reflect a
    recurring managed baseline; zero prior history, or a change written by a process that has never touched this key
    before, indicates a first-time modification that deserves scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same handler key modified on other hosts in the environment?
  context: >-
    The same command-handler write across many hosts with a consistent value and writing process would be unusual for
    these keys and, if present, points to a scripted rollout rather than a benign baseline. A change confined to this
    host, or one written by an ad-hoc process, looks targeted. Compare the value data and writing process across hosts
    to separate coordinated activity from a single-host action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Were other privilege escalation techniques attempted on this host?
  context: >-
    Operators who attempt one UAC bypass often try several front-ends until one succeeds, especially when the OS version
    or configuration blocks a given method. Other sigma alerts on this host for auto-elevated binary abuse, registry
    command-handler hijacks, or privilege escalation within the surrounding window confirm deliberate escalation over an
    isolated false positive, and defense-tampering or credential-access alerts nearby help place the bypass in a larger
    sequence.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry write rarely happens in isolation. Aggregating process executions around the alert surfaces what led to
    the handler write and what followed it, and lets novel parent-child pairs stand out against routine agent and system
    noise. This complements the registry-only view by showing the execution context that drove the change and any
    elevated children that ran after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host -- reconnaissance, defense tampering, or credential access -- may reveal the
    stages that preceded this write and help reconstruct the timeline. A UAC bypass is typically reached after an actor
    already has code execution on the host, so preceding alerts help place this event within the larger sequence of
    activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
