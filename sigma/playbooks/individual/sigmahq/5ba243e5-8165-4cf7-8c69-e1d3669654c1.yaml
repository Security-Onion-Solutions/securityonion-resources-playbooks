name: Potential DLL Sideloading Of MpSvc.DLL
id: e1401d5a-917b-479b-9c9a-01a3c0426447
description: |
  Detects MpSvc.dll being loaded from any path outside the legitimate Windows Defender directories
  (C:\Program Files\Windows Defender\, C:\ProgramData\Microsoft\Windows Defender\Platform\, and
  C:\Windows\WinSxS\). MpSvc.dll is normally loaded by Windows Defender components such as MpCmdRun.exe
  from the Platform directory; attackers stage a malicious copy of the DLL beside a relocated signed
  binary that resolves it by name, so their code executes inside a trusted process and can bypass
  application allow-listing that screens executables but not the libraries they load. Legitimate
  applications occasionally bundle their own copy of the DLL, so the investigation should confirm the
  actual load path and loading process, verify the DLL's signature and hash against the legitimate
  Defender copy, identify which process staged the file, and determine what the sideloaded code did
  after loading.
type: detection
detection_id: 5ba243e5-8165-4cf7-8c69-e1d3669654c1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Is MpSvc.dll being loaded from a path outside the legitimate Windows Defender directories?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded) and the process
    that loaded it against the rule's criteria. The rule fires when a module ending in \MpSvc.dll loads
    from anywhere other than C:\Program Files\Windows Defender\, C:\ProgramData\Microsoft\Windows
    Defender\Platform\, or C:\Windows\WinSxS\ — the load path is the deciding field. The library event
    also carries the DLL's hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
  answer_sources:
  - alert
  - image_load
- question: Is this host expected to run an application that bundles its own copy of MpSvc.dll?
  context: >-
    The rule author notes that some legitimate applications load their own versions of this DLL. If the
    loading process belongs to sanctioned software whose install directory matches the load path, this
    may be a benign bundled dependency; if the host has no business running the loading application, or
    the path is a user-writable staging directory such as Temp, Downloads, ProgramData, or Public, treat
    the load as suspect.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the MpSvc.dll copy still on disk for analysis?
  context: >-
    If the DLL remains at the non-standard path it can be hashed, submitted to a sandbox, and
    content-reviewed. The query correlates file activity from the alerting process and its direct
    children; the DLL itself may have been written earlier by a different process, so also check the
    staging question and verify the path directly on the endpoint.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Was there a software deployment or change record that explains this MpSvc.dll copy?
  context: >-
    A recent install, upgrade, or packaging job for the application that owns the load path would
    explain a bundled copy of the DLL appearing outside the Defender directories. A matching deployment
    record suggests authorized activity; the absence of one when the organization change-manages
    software installs shifts weight toward attacker staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What other modules did the process that loaded MpSvc.dll load, and did any come from the same non-standard directory?
  context: >-
    The full module list tells the story of a sideload. Look for additional DLLs resolving from the
    loading process's own directory instead of the system paths expected for those names
    (search-order hijacking rarely stops at one module), unsigned modules where signed ones are
    expected, and other system DLL names loading from non-system paths. Modules loaded from the
    expected Windows directories with valid signatures are routine runtime dependencies.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - image_load
  - manual_review
- question: What are the signing status, hash, and threat-intel reputation of the loaded MpSvc.dll?
  context: >-
    The genuine MpSvc.dll is Microsoft-signed and lives under the Windows Defender Platform directory;
    compare the loaded module's hash against that baseline copy to detect substitution. An unsigned DLL
    carrying a Microsoft component's filename, or one whose SignatureStatus is Invalid, Expired, or
    Distrusted, points to masquerading, while a validly signed Microsoft copy in a third-party
    application directory may be a legitimately bundled dependency. Pivot the hash through threat
    intelligence to surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
  answer_sources:
  - image_load
  - external_threat_intel
  - manual_review
- question: What command line and working directory did the process that loaded MpSvc.dll run with?
  context: >-
    The process-creation record for the loading process reveals its full executable path, arguments,
    and working directory. The executable path pins down where the loader binary itself lives — a
    signed binary relocated to a user-writable directory beside the DLL fits the sideloading pattern —
    and a working directory matching the DLL's location corroborates a manual or scripted launch from
    the staging directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the binary that loaded MpSvc.dll, and is that parent chain expected?
  context: >-
    The parent process reveals how the loading binary was invoked. Windows Defender components are
    started by the service infrastructure, and sanctioned applications typically launch from
    explorer.exe, services.exe, or a known updater; a parent such as a script host, archive utility,
    Office application, or an interactive shell in a user directory indicates someone or something
    launched the loader directly. Walk further up the tree via the parent's own creation event if the
    immediate parent is itself unusual.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote the MpSvc.dll copy to this host, and when relative to the load?
  context: >-
    Sideloading requires staging the DLL first, so the file-creation event identifies the delivery
    mechanism — an installer, archive extractor, browser download, remote copy, or script. A write of
    MpSvc.dll outside the Defender directories shortly before the module load indicates deliberate
    staging rather than a leftover file; the writing process and its user are the next pivot for
    tracing how the file reached the host.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\MpSvc.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
- question: Did the process that loaded MpSvc.dll make any registry modifications?
  context: >-
    Code running in a sideloaded DLL executes with the host process's identity, and hijack-flow
    tradecraft commonly pairs module staging with registry changes — run keys, service ImagePath
    values, or app-path entries that re-launch the relocated binary. Compare any modified keys against
    expected service and autorun baselines; writes here turn a one-time load into durable persistence.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
  answer_sources:
  - manual_review
- question: What child processes did the binary that loaded MpSvc.dll spawn after the load?
  context: >-
    Whatever the sideloaded DLL does happens inside or beneath the loading process. Children such as
    cmd.exe, powershell.exe, rundll32.exe, or networking utilities reveal the payload's next stage;
    neither Defender components nor most applications that legitimately bundle this DLL spawn
    interactive shells or download tools.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregated parent-child process pairs around the load surface
    what led to this event and what followed — reconnaissance commands, privilege escalation,
    persistence installation, or data staging. High-count rows are typically routine agent noise;
    novel low-count pairs are what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Has MpSvc.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load is a stronger anomaly than a recurring one. If MpSvc.dll has only ever
    been loaded by Defender binaries from the Platform directory, the current load from a non-standard
    path stands out; if the same application has loaded its bundled copy repeatedly over the past 90
    days, this load is probably routine. Repeated recent loads by a relocated binary suggest an
    established foothold rather than a fresh one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - image_load
- question: Does this host normally run the binary that loaded MpSvc.dll?
  context: >-
    A loading process that has never executed on this host before is more suspicious than one that runs
    regularly. Zero or very low historical counts indicate first-time or rare execution — consistent
    with a freshly staged loader — while a long history under the same user fits an installed
    application with a bundled DLL.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Is MpSvc.dll being loaded from this same non-standard path on other hosts?
  context: >-
    Cross-host correlation surfaces deployment scope. A single host loading the DLL from an unexpected
    path could be a localized incident or a one-off install; the same path recurring across many hosts
    points to shared software deployment or multi-host attacker activity. Pay attention to the variety
    of loading processes — one consistent application across hosts fits packaged software, while varied
    or unexpected loaders on other hosts suggest lateral progression.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - image_load
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the attack stages that preceded the sideload and help reconstruct the timeline.
    Delivery-related alerts such as archive extraction, download utilities, or script execution shortly
    before the load are especially relevant to how the DLL was staged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were process-based persistence mechanisms installed on this host around the DLL load?
  context: >-
    A sideloaded DLL only persists if something re-launches the loading binary, and attackers rarely
    rely on a single mechanism. Executions of schtasks, sc, reg, bitsadmin, or wmic in the surrounding
    hours may reveal the scheduled task, service, or run key that anchors the foothold, or backup
    persistence installed alongside it. Multiple installations in the same timeframe indicate
    intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were files dropped to persistence locations on this host around the DLL load?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder, or into a path referenced by a Run key, re-launches the payload at logon
    without running schtasks, sc, or reg. The DLL staging already shows file-drop tradecraft on this
    host, so drops into these locations in the surrounding hours deserve the same provenance scrutiny.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
