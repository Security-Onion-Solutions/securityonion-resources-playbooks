name: Rundll32 Execution Without Parameters
id: 7a04d2e2-44de-42cb-b8bb-6ea60ce35f72
description: |
  Detects a rundll32 process whose command line is just the binary name with no
  arguments, which is abnormal because rundll32 is designed to load and run an
  exported function from a DLL named on its command line. A bare rundll32 launch
  is the host-process signature of a remote service-execution lateral movement
  pattern: a service spawns a parameterless rundll32 that loads an injected DLL
  over a named pipe and runs under SYSTEM. Legitimate parameterless rundll32 is
  rare and usually a stray manual invocation, so the investigation should confirm
  the command line carried no DLL or export, identify the parent service and the
  binary that created it, determine how the host was reached over SMB, and trace
  what the host process did once it was running.
type: detection
detection_id: 5bb68627-3198-40ca-b458-49f973db8752
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did rundll32 run with no command-line arguments, just the bare binary
    name, matching what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when a process command line is exactly rundll32 or rundll32.exe
    with nothing after it. Read the exact command line and verify no DLL path and no
    exported function name follow the binary. Normal rundll32 always names a DLL and
    an export; a bare invocation does no useful work on its own and is the host-process
    signature this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this host and user expected to launch a parameterless rundll32, and
    is this host a normal target for remote administration?
  context: Legitimate parameterless rundll32 is uncommon and usually a one-off manual
    typo. Knowing whether this endpoint is routinely administered remotely and whether
    the acting account performs remote service operations is often the fastest path
    to separating a stray invocation from a service-spawned host process. A server
    that is a frequent administrative target is a different finding than a workstation
    that has never been reached this way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What process spawned the parameterless rundll32, and does that parent
    look like a legitimately installed service or a transient dropped binary?
  context: A bare rundll32 used as an injection host is typically spawned by a service,
    and that service binary is frequently a randomly named executable dropped into
    C:\Windows just before launch rather than a known signed program. Read the parent
    image and where it lives. A parent under C:\Windows with a random eight-character
    name, or services.exe spawning rundll32 directly, points to a temporary service
    created for execution rather than normal operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Under which user context did the parameterless rundll32 run, and what is
    the integrity level and full image path?
  context: The host-process pattern this rule targets runs rundll32 under SYSTEM from
    the SysWOW64 path to host an injected DLL connected over a named pipe. Confirm the
    account and the exact image path of the launched process. A SYSTEM-context
    parameterless rundll32 from SysWOW64 with no DLL on its command line is consistent
    with a service-hosted injection target rather than any normal use of the binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - User
      - CommandLine
      - IntegrityLevel
- question: Was a service registry key created or modified on this host shortly before
    the rundll32 launch, pointing at a non-standard service binary?
  context: Remote service execution registers a temporary service whose ImagePath
    points at the binary that will spawn the host process, leaving a write under the
    Services key. Look for service-key creation or ImagePath changes referencing a
    binary in C:\Windows with a random name in the minutes before the launch. A new
    service key tied to an unfamiliar executable correlates the registry side of the
    service install with the process the rule fired on.
  range: -10m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Was there a network logon to this host over the admin shares immediately
    before the launch, and what account and source did it use?
  context: This host-process pattern is reached by remote service execution over SMB
    admin shares such as ADMIN$, C$, and IPC$, which produces a network logon
    (type 3) just before the service runs. Look for logon events on this host in the
    minutes before the rundll32 launch and identify the account and originating
    address. A network logon from an unexpected source account within the correlation
    window ties the lateral access to the local execution.
  range: -10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
        LogonType: 3
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - AuthenticationPackageName
- question: What host initiated the inbound SMB connection to this endpoint, and is
    it an expected administrative source?
  context: Remote service execution requires a source and a destination. Inbound
    connections to SMB and RPC ports just before the launch reveal whether the access
    came from a known admin jump box or an unexpected internal host. Attackers who
    have compromised one host use it as a pivot to spawn service-hosted execution on
    others, so the source address is a key scoping field.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What child processes did the parameterless rundll32 spawn after it
    started?
  context: A bare rundll32 used as an injection host frequently goes on to spawn
    interactive or post-exploitation processes such as cmd.exe, powershell.exe, or
    runonce.exe once the injected code runs and impersonates SYSTEM. Children of this
    process reveal what the hosted code actually did. Spawned command interpreters or
    transfer utilities under a parameterless rundll32 point to hands-on execution
    rather than a harmless stray launch.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Was an executable written into C:\Windows or another system directory on
    this host shortly before the launch?
  context: The service binary that spawns the host process is typically transferred
    onto the target over the admin share and written into C:\Windows with a random
    name just before the service runs. Look for executable file writes into system
    directories in the minutes preceding the launch. A freshly written, randomly
    named binary in C:\Windows correlates the lateral file transfer with the local
    service execution and identifies the staged artifact.
  range: -30m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.exe'
      filter_path:
        TargetFilename|contains: '\Windows\'
      condition: selection and filter_path
    fields:
      - TargetFilename
      - Image
      - User
- question: Does the staged service binary or host-process artifact have a random or
    non-descriptive name, and is it signed by a recognized publisher?
  context: Transferred tooling for this pattern uses randomized, non-descriptive
    binary names in C:\Windows to evade name-based allowlists, and the binaries are
    usually unsigned or self-signed rather than carrying a recognized publisher.
    Review the name and signature of the parent service binary. A short random
    filename with no valid signature, dropped into a system directory, is the
    obfuscation marker that distinguishes staged tooling from a legitimate installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Signed
      - Signature
      - SignatureStatus
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - rundll32.exe
        - rundll32
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - rundll32.exe
        - rundll32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    parameterless rundll32 launch was a single event or part of activity spanning
    multiple endpoints. If the same account drove similar service-hosted execution on
    other hosts in the window, the scope is broader than one machine and points to
    active lateral movement.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - rundll32.exe
        - rundll32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    parameterless rundll32 launch reveals what staged it and what followed, including
    the service install, reconnaissance, or follow-on execution under the impersonated
    context. Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as remote-access reconnaissance,
    credential access, or service tampering, may reveal the attack stages that
    preceded the service-hosted execution and help reconstruct the full timeline.
    Lateral service execution is often one step in a sequence, so prior alerts give
    the context for how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired the rule's rundll32 pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even legitimate stray invocations can match a bare rundll32. This query
    mirrors the rule's selection structure scoped to this host, so the resulting
    parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic rundll32 usage. A new parent process, an
    unexpected account, or a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - rundll32.exe
        - rundll32
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's rundll32 pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the bare-rundll32 firing pattern rather than
    generic process activity. A small unrelated set of hosts firing the same pattern
    in a short window points to operator-driven lateral movement; a steady spread
    across many hosts may indicate a benign management tool that invokes rundll32 this
    way. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine:
        - rundll32.exe
        - rundll32
      condition: selection
    fields:
    - host.name
