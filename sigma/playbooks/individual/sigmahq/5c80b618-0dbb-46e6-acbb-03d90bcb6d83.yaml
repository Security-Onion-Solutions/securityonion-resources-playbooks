name: Network Connection Initiated To AzureWebsites.NET By Non-Browser Process
id: 7cdeda6d-8eba-498c-b0bb-122e9f55e4bd
description: |
  Detects a process other than a known web browser (or an excluded security and monitoring
  agent) initiating an outbound connection to a host under azurewebsites.net, the domain
  Azure App Service assigns to tenant web applications. Anyone can register an application
  under a chosen subdomain, and the platform's trusted reputation has made these endpoints
  a recurring home for malware hosting, dead drop C2 resolution (T1102.001), and data
  exfiltration — while legitimate line-of-business applications, SDK clients, and
  deployment tools also call them routinely. The investigation identifies the connecting
  program and whether its identity holds up, the specific tenant subdomain, the connection
  cadence and volume, and any follow-on connections or file movement that separate
  command-and-control use from routine application traffic.
type: detection
detection_id: 5c80b618-0dbb-46e6-acbb-03d90bcb6d83
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the destination and direction match what this rule detects, an outbound connection to an azurewebsites.net host from a non-browser process?
  context: |
    Confirm the alert from the destination hostname (a subdomain of azurewebsites.net), the
    outbound direction, and an initiating program that is not one of the rule's excluded
    browsers or security agents. The hostname field is sparsely populated on endpoint
    connection telemetry, so if it is empty here, recover the exact subdomain from the
    DNS-lookup question; if the event came from network-level telemetry it may carry the
    hostname but no process attribution, in which case the DNS and process questions supply
    the missing side.
  range: +/-5m
  answer_sources:
  - alert
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user or host expected to run non-browser applications that communicate with azurewebsites.net?
  context: |
    Many legitimate programs call App Service endpoints without a browser — line-of-business
    applications with an Azure-hosted backend, deployment and publishing tools, SDK-based
    clients, and internal automation. A developer workstation or a server hosting a known
    Azure-integrated application reads differently from a standard user's machine with no
    cloud-development role. Whether the connection ran under an interactive user or a
    service account also matters, since unattended tasking retrieval tends to run under
    service or SYSTEM context.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which azurewebsites.net hostnames did this host resolve, and which process performed the lookups?
  context: |
    The DNS lookup carries the full tenant subdomain and reliable process attribution even
    when the connection event lacks them. The subdomain is the tenant's chosen name, so it
    identifies the application behind the traffic — a recognizable corporate or vendor app
    name supports routine use, while names imitating Microsoft services or update
    infrastructure are a masquerading pattern seen in dead drop and exfiltration endpoints.
    Repeated lookups across the day also show how long and how regularly the host has been
    reaching the service.
  range: -24h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith: '.azurewebsites.net'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What program initiated the connection, and what do its command line and working directory show?
  context: |
    The connecting program is the center of this investigation, since the rule already
    excluded browsers. A recognizable application binary in its installed path with a
    plausible command line supports legitimate use; a script interpreter with encoded or
    URL-bearing arguments, a binary running from a user-writable directory, or an
    update-sounding executable with no matching product installed points at implant tooling.
    If the alert came from network-level telemetry with no process fields, identify the
    program from the DNS-lookup question and pull its executions here.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the connecting program, and is that parent chain expected?
  context: |
    The parent lineage shows how the connecting program came to run. An application started
    by explorer.exe or a service manager fits normal use; a connector launched by an Office
    application, a script interpreter, or a scheduled task is the delivery-and-persistence
    lineage that typically precedes web-service C2. The parent's own command line shows what
    it was doing when it started the child.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is the connecting binary what its name claims to be?
  context: |
    Backdoors reaching cloud-hosted C2 frequently masquerade as update utilities or
    document tools — plausible executable names, borrowed icons, and invalid or missing
    signatures. Compare the on-disk filename against the compiled original file name and
    company metadata; a mismatch means the binary was renamed. Check the hash against
    threat intelligence and against the software actually installed on this host. A
    legitimate vendor binary in its expected install path with matching metadata shifts
    the investigation toward the destination side.
  range: +/-30d
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Company
      - Hashes
- question: What do the tenant subdomain and threat intelligence reveal about this destination?
  context: |
    The platform domain itself is trustworthy, so the verdict comes from the specific
    subdomain. Tenant names are freely chosen at registration; look up the exact subdomain
    in threat intelligence and passive DNS, and judge the name itself — subdomains
    embedding vendor or update-service wording with no corresponding product are a known
    hosting and exfiltration pattern. IP reputation is weak evidence here because App
    Service front-end addresses are shared across many unrelated tenant applications; the
    subdomain, not the IP, identifies the counterparty.
  range: +/-5m
  answer_sources:
  - external_threat_intel
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What does the connection pattern to this destination look like?
  context: |
    Cadence and volume separate the use cases. Periodic reconnects at regular intervals are
    the polling pattern of tasking retrieval from a web-service C2 or dead drop; sustained
    outbound transfer beyond roughly 1 MB in under 5 minutes exceeds what command exchange
    needs and points at data movement; a handful of request-response bursts during working
    hours fits an application backend. Connections persisting outside normal business hours
    for this host weigh toward unattended tooling rather than user-driven activity.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: Did the process contact new external infrastructure after reaching the azurewebsites.net endpoint?
  context: |
    In the dead drop pattern, the page retrieved from the web service contains an encoded or
    obfuscated address of the real C2 endpoint, which the process decodes and then connects
    to. The observable trace is a connection to a previously unseen destination shortly
    after the web-service contact — review the process's full destination set for endpoints
    that appear only after the alert. Encoded strings in the connecting program's command
    line or configuration files are the other half of the obfuscation check, from the
    mechanism-decode question.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What files did the connecting process write or read around the connection?
  context: |
    This destination class is abused in both directions — as a hosting site, where retrieved
    payloads land on disk shortly after the connection, and as an exfiltration endpoint,
    where archives or exported data are staged and then uploaded. File activity by the
    connecting process shows both, plus any configuration files the program maintains.
    Executables or scripts written to user-writable paths, or an archive appearing just
    before sustained outbound transfer, each set the follow-up direction.
  range: +/-5m
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Does this host normally communicate with this destination?
  context: |
    A destination this host has contacted daily for months under the same program is an
    established workflow — still worth the identity and authorization checks, but not an
    emerging intrusion. A first-time connection, or history that begins abruptly in recent
    days, marks when the channel appeared and anchors the timeline for the rest of the
    investigation.
  range: -90d
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run the connecting program?
  context: |
    A program that has executed regularly on this host for months supports the
    established-application reading; a binary appearing for the first time at the alert
    points at fresh tooling. The user grouping also shows whether it runs under the
    interactive user or a service context, which feeds the expected-usage judgment.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Which other hosts resolve azurewebsites.net hostnames, and do any share this alert's subdomain?
  context: |
    Fleet-wide resolution of the platform domain is expected wherever legitimate
    Azure-hosted applications are in use, so the discriminator is the specific subdomain
    from this alert. Many hosts each resolving distinct, recognizable application names
    fits routine use; several hosts resolving the same uncommon subdomain points at shared
    tooling, and each of those hosts needs the same program-identity check as this one.
    Anchoring fleet scope on the resolved IP would mislead here, because front-end
    addresses are shared across unrelated tenant applications.
  range: -7d
  answer_sources:
  - network_connection
  - dns_query
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|endswith: '.azurewebsites.net'
      condition: selection
    fields:
      - host.name
      - QueryName
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: |
    Aggregated parent-child process pairs around the alert place the connection in its
    surrounding sequence — a dropper or script host before it, discovery commands or
    payload execution after it. Novel low-count pairs stand out against repetitive agent
    noise.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: |
    Earlier detections — delivery artifacts, script-interpreter execution, persistence
    creation, defense tampering — may capture how the connecting program arrived and what
    it did before opening the channel. The alert timeline reconstructs the sequence from
    foothold to command-and-control.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
