- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the download reveals the immediate context —
    what led to it, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    additional tool transfers, privilege escalation, or persistence setup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, exploitation of a public-facing
    service, or credential access — may reveal the attack stages that preceded this download and help reconstruct
    the full timeline. The alert sequence often tells the story of how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download LOLBins used on this host recently?
  context: Operators who use one download LOLBin often use several. If curl fetched a payload, check whether
    certutil, bitsadmin, expand, esentutl, or similar binaries were also used to transfer files on this host.
    Multiple download tools performing the same objective strengthens the case for malicious staging.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was curl.exe executed from its expected System32 or SysWOW64 path?
  context: Curl shipped with Windows lives in System32 or SysWOW64. A curl.exe running from a user's temp directory,
    a download folder, or another non-standard path may have been copied or renamed to evade path-based allowlists,
    or may be an attacker-supplied build. Compare the Image path against the OriginalFileName to spot relocation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
