name: Suspicious File Download From IP Via Curl.EXE
id: 04ac27ae-1e8b-4ba7-a14e-937727fef73d
description: |
  Detects curl.exe downloading a file directly from a bare IPv4 address over HTTP(S) to a local
  file. The rule fires only when ALL of the following match together: the process is curl.exe
  (by Image or OriginalFileName), the command line contains an http URL pointing at a numeric
  IP rather than a hostname, a download/output flag is present (-O, --remote-name, or --output),
  and the saved filename ends in a deliverable extension (.exe, .dll, .ps1, .bat, .msi, .hta,
  .vbs, and similar). Legitimate software occasionally fetches resources from IPs, but a
  command-line download of an executable or script payload from a raw IP is a common ingress
  step that precedes loader execution, sideload staging, and persistence. Determine what was
  fetched, where it was written, what spawned curl, and what ran afterward.
type: detection
detection_id: 5cb299fc-5fb1-4d07-b989-0644c68b6043
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show curl.exe downloading a file from a raw IP address to a local file?
  context: Confirm the alert is a true positive before investing time. The rule fires only when all parts match
    together — curl.exe (by Image or OriginalFileName), an http URL pointing at a numeric IP rather than a
    hostname, a download flag (-O, --remote-name, or --output), and an output filename ending in a deliverable
    extension such as .exe, .dll, .ps1, .bat, .msi, or .hta. Read the full command line and verify each part is present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files from raw IP addresses using command-line tools?
  context: Legitimate administrative or developer activity can trigger this detection. Knowing whether the user role
    and host function involve command-line downloads — installers, build scripts, vendor automation — is often the
    fastest way to separate a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did curl download — decode the full command line to identify the source IP, URL, and output file?
  context: The full command line reveals the source IP and port, the requested path, any custom headers or
    user-agent, and the local filename and directory the payload was written to. Note the output path so the
    dropped file can be located and the extension can be matched against what executed afterward. Curl is a
    single-command tool, so this host+binary view typically returns the one alerting invocation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned curl.exe and is that parent chain expected?
  context: The parent process reveals how the download was invoked. A user-driven download typically descends from
    explorer.exe or a shell the user opened; curl spawned by a script host (wscript.exe, cscript.exe), an Office
    application, an unexpected service, or a database engine points to scripted or exploited execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run curl.exe?
  context: A binary that has never been seen on a host is more notable than one that runs regularly. Zero or very
    low historical counts for curl.exe on this host indicate first-time or rare execution and raise the weight of
    the download.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this curl-from-IP download pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even common tools get abused. This query mirrors the rule's full selection structure scoped to this host,
    so the resulting parent and user distribution reflects how this specific download pattern has historically run
    here — not generic curl usage. A new parent process, an unexpected user account, or an unusual command-line
    pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \curl.exe
      - OriginalFileName: curl.exe
      selection_ip:
        CommandLine|re: ://[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}
      selection_http:
        CommandLine|contains: http
      selection_flag:
        CommandLine|contains:
        - ' -O'
        - --remote-name
        - --output
      selection_ext:
        CommandLine|endswith:
        - .bat
        - .bat"
        - .dat
        - .dat"
        - .dll
        - .dll"
        - .exe
        - .exe"
        - .gif
        - .gif"
        - .hta
        - .hta"
        - .jpeg
        - .jpeg"
        - .log
        - .log"
        - .msi
        - .msi"
        - .png
        - .png"
        - .ps1
        - .ps1"
        - .psm1
        - .psm1"
        - .vbe
        - .vbe"
        - .vbs
        - .vbs"
        - .bat'
        - .dat'
        - .dll'
        - .exe'
        - .gif'
        - .hta'
        - .jpeg'
        - .log'
        - .msi'
        - .png'
        - .ps1'
        - .psm1'
        - .vbe'
        - .vbs'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did curl.exe spawn afterward on this host?
  context: A successful download is usually followed by execution of the fetched payload. Children of curl, or
    new processes that launch the downloaded file shortly after (cmd.exe, powershell.exe, wscript.exe, rundll32.exe,
    regsvr32.exe, or the dropped binary itself), reveal whether the ingress led to code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this curl-from-IP download pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
