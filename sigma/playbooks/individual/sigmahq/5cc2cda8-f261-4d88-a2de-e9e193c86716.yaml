name: Suspicious Processes Spawned by WinRM
id: 6e31be30-5690-45f7-95ab-70f965f95b5e
description: |
  Detects the WinRM host process wsmprovhost.exe spawning a command interpreter or administrative tool.
  The rule fires only when both conditions hold: the parent is wsmprovhost.exe and the child binary is one of
  cmd.exe, sh.exe, bash.exe, powershell.exe, pwsh.exe, wsl.exe, schtasks.exe, certutil.exe, whoami.exe, or bitsadmin.exe.
  WinRM is the transport behind PowerShell Remoting and a large share of sanctioned remote administration, so the same
  pattern is produced by an administrator running a remote command and by an operator executing commands through a
  session obtained with valid or stolen credentials or through an exposed remote-management listener. The investigation
  should establish which host and account opened the remoting session, whether the work was authorized, and whether the
  session stopped at a single command or continued into enumeration, download, and persistence.
type: detection
detection_id: 5cc2cda8-f261-4d88-a2de-e9e193c86716
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did wsmprovhost.exe spawn this process, and is the child one of the interpreters or administrative tools the rule lists?
  context: >-
    Confirm both halves of the detection before investing investigation time. The parent must be the WinRM session host
    wsmprovhost.exe and the child must be cmd.exe, sh.exe, bash.exe, powershell.exe, pwsh.exe, wsl.exe, schtasks.exe,
    certutil.exe, whoami.exe, or bitsadmin.exe. Which of those binaries ran sets the direction of the rest of the
    investigation, since a single whoami and a scheduled-task creation carry different weight.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this account expected to run command interpreters or administrative tools against this host over a remote session?
  context: >-
    Remote management is what WinRM exists for, so the account and the host's role are the fastest triage split.
    An administrator or automation account acting on a server it routinely manages fits sanctioned work; a standard
    user account, or a host that is not normally a remote-management target, does not. Environment-specific sanctioned
    children of the remoting host (management agents, build helpers) belong in this judgment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What started the wsmprovhost.exe instance that spawned this process, and when did that session begin?
  context: >-
    The WinRM service creates one wsmprovhost.exe instance per incoming remote session, so the parent lookup anchors the
    session that carried this command and shows how long it had been open before the alerting child ran. A session that
    opened seconds before the command differs from one that had been idle for hours.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Which remote host and account opened the WinRM session that carried this command?
  context: >-
    A remoting session authenticates as a network logon (event 4624, logon type 3) before the WinRM host process is
    created, and that record carries the originating source address, workstation name, and account. A session originating
    from a managed jump host under an administrative account fits sanctioned remote administration; one originating from
    a user workstation, an unexpected subnet, or an account with no administrative role is the deviation to trace.
    Repeated type-3 logons from one source in this window point at scripted or swept access rather than a single task.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4624
        LogonType: 3
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - WorkstationName
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: Was there a change ticket, maintenance window, or documented approval for this remote administration activity?
  context: >-
    Because the mechanism itself is legitimate, authorization is the discriminator. A ticket or maintenance window
    covering work on this host at this time closes the alert quickly. The absence of one where policy requires it makes
    the origin of the session and the commands it ran worth tracing in full.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
  - manual_review
- question: What other processes did this same WinRM session spawn?
  context: >-
    Each wsmprovhost.exe instance corresponds to one remote session, so its children are the full set of commands that
    session executed. A single administrative command is routine; a sequence that moves from account and host
    enumeration to file download and task creation within the same session describes hands-on-keyboard operation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What is the full command line of the spawned process, and what operation does it perform?
  context: >-
    The child's arguments carry the operation the remote session actually performed. For schtasks.exe, read the task name
    (/TN), the command it runs (/TR), the schedule (/SC), and the run-as account (/RU), since SYSTEM run-as and boot or
    logon triggers establish persistence that outlives the session. For certutil.exe and bitsadmin.exe, read the source
    URL and the output path. For cmd.exe, wsl.exe, and the PowerShell hosts, read the script or inline command supplied.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Was the command encoded or obfuscated? What does it decode to?
  context: >-
    When the child is powershell.exe or pwsh.exe, -EncodedCommand (-enc) payloads, string concatenation, and backtick
    escaping hide the operation from the command line. Decoding reveals whether the session ran a download cradle, a
    reverse shell, or in-memory loading of a .NET assembly. PowerShell Remoting normally executes script inside the WinRM
    host process itself, so a separately spawned PowerShell host means the session started a new interpreter rather than
    using the remoting runspace.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Did PowerShell script block logging capture the script content this remote session executed?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually executed, including script run inside the
    WinRM host process, which never appears on any command line. For remoting sessions this is often the only record of
    what ran. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Execution policy bypass flags, AMSI patching, and version-2 downgrade invocations are common precursors to running a
    payload through a remoting session. Finding them in the hour before the alert changes the reading of an otherwise
    ordinary administrative command; finding none keeps the routine-administration explanation open.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    whoami.exe on its own is routine troubleshooting, but several enumeration binaries within a few minutes is the
    profile of post-access orientation. An operator who obtains a remote session typically establishes the account
    context, the host's role, and the surrounding network before choosing a next stage, so three or more distinct recon
    binaries in this window is the pattern to look for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Did the process the WinRM session spawned make outbound network connections?
  context: >-
    The stage that commonly follows a remote-access foothold is an outbound callback or a payload pull. certutil.exe and
    bitsadmin.exe fetch files directly, and the PowerShell hosts open connections from script. Destinations outside the
    environment's normal update, management, and internal ranges are the ones to check against reputation data; an
    administrative command that only reads local state should produce no egress at all.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: Which modules did the WinRM host process load around this time, and were any unsigned or loaded from outside the system directories?
  context: >-
    A remote-management service process that loads unsigned modules, or modules from user-writable directories, indicates
    code was introduced into the session rather than executed from installed tooling. Signed modules from the system
    directories are the normal profile for this process, so the exceptions are the rows worth reading.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wsmprovhost.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
  answer_sources:
  - process_creation
  - manual_review
- question: Has this account previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this account, so the result is the account's 90-day history of WinRM
    sessions spawning these binaries, aggregated by host, rather than generic use of cmd.exe or powershell.exe. An
    administrator whose account produces this regularly across the servers they manage is doing their job; an account
    with no such history, or one that suddenly reaches new hosts, is the deviation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wsmprovhost.exe
        Image|endswith:
        - \cmd.exe
        - \sh.exe
        - \bash.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \schtasks.exe
        - \certutil.exe
        - \whoami.exe
        - \bitsadmin.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has the WinRM host process historically driven this pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When a remote session runs under a service principal or a machine account, user identity does not attribute the
    behavior and the launch mechanism does. This returns the 90-day history of the WinRM host process driving this
    specific pattern. A parent already accounting for thousands of prior events is management tooling or orchestration;
    a parent that is new for this pattern is the deviation worth chasing.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wsmprovhost.exe
        Image|endswith:
        - \cmd.exe
        - \sh.exe
        - \bash.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \schtasks.exe
        - \certutil.exe
        - \whoami.exe
        - \bitsadmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether this remote session is one hop in a
    sequence. WinRM is a lateral-movement transport as well as an administration transport, so the same account touching
    several hosts in a short window is the pattern to look for. Under a service or machine account this view returns
    background agent activity and the parent-driven view is the meaningful one.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did the same WinRM-driven pattern fire on other hosts in this window, or is the activity isolated to this host?
  context: >-
    This mirrors the rule's selection scoped to the WinRM host process, fleet-wide, in the alert window. Several hosts
    within the same window points to an orchestrated push or a management job reaching a set of systems; a single host
    points to a host-local trigger. The host list also defines the systems that need review if the session turns out to
    be unauthorized.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \wsmprovhost.exe
        Image|endswith:
        - \cmd.exe
        - \sh.exe
        - \bash.exe
        - \powershell.exe
        - \pwsh.exe
        - \wsl.exe
        - \schtasks.exe
        - \certutil.exe
        - \whoami.exe
        - \bitsadmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did this same detection fire on other hosts in the last 24 hours?
  context: >-
    Remote-management activity that reaches many hosts is either an administrative rollout or an operator working through
    the environment from a foothold. The set of hosts and accounts involved separates a scoped maintenance task from
    movement, and defines the systems to review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
