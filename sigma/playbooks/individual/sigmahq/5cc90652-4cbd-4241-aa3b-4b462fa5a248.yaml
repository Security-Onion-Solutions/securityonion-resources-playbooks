name: Potential Recon Activity Via Nltest.EXE
id: af654b03-e1ec-4de4-a12f-7a530bf9abc8
description: |
  Detects nltest.exe (or a renamed binary whose PE OriginalFilename is
  nltestrk.exe) running with command-line arguments used for Active Directory
  reconnaissance. The rule fires only when both conditions hold together - the
  process resolves to nltest by image name or OriginalFilename, AND the command
  line carries a recon parameter: either /server with /query, or one of /user,
  all_trusts, dclist:, dnsgetdc:, domain_trusts, dsgetdc:, parentdomain, or
  trusted_domains. nltest is a built-in network administration tool, so a single
  invocation can be legitimate troubleshooting by IT staff; the same parameters
  are routinely used by operators to enumerate domain controllers, domain trust
  relationships, and account attributes during post-compromise discovery. The
  investigation should confirm which recon parameter fired, decode the full
  command, identify the parent and user that launched it, determine whether other
  reconnaissance ran in the same window, and establish whether this user and host
  normally perform domain enumeration.
type: detection
detection_id: 5cc90652-4cbd-4241-aa3b-4b462fa5a248
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did nltest run with a domain-reconnaissance parameter - image ending in
    nltest.exe (or OriginalFilename nltestrk.exe) AND a recon flag such as
    /domain_trusts, /all_trusts, /dclist:, /dsgetdc:, /user, or /server with /query?
  context: Before investing investigation time, confirm the alert is a true
    positive. The rule fires only when both parts match together - the binary
    resolves to nltest by image name or PE OriginalFilename, and the command line
    contains one of the recon parameters (either /server combined with /query, or
    any of /user, all_trusts, dclist:, dnsgetdc:, domain_trusts, dsgetdc:,
    parentdomain, trusted_domains). Read the exact command line and note which
    parameter fired - trust enumeration (domain_trusts, all_trusts,
    trusted_domains) versus DC enumeration (dclist:, dsgetdc:, dnsgetdc:) versus
    account enumeration (/user) point the rest of the investigation in different
    directions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user expected to run domain enumeration commands like nltest?
  context: Network administrators and IT staff legitimately run nltest for
    troubleshooting domain controller connectivity and trust relationships.
    Standard users and service accounts rarely need to enumerate domain trusts or
    list domain controllers. The acting account's role and typical behavior
    determine whether this enumeration is routine administration or anomalous
    discovery - enumeration under a non-admin, an unexpected service account, or an
    account that does not normally touch AD tooling is more notable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Decode the full nltest command line - which directory objects did it
    enumerate, and against which target domain or server?
  context: The full command line reveals exactly what was enumerated. Decode each
    parameter - /domain_trusts and /all_trusts list trust relationships (add /v for
    SIDs and GUIDs), /dclist and /dsgetdc enumerate domain controllers,
    /trusted_domains lists trusted domains, /user dumps SAM account attributes, and
    /server targets a specific remote machine. Scoping to nltest on this host in a
    short window captures sequential invocations that together form one enumeration
    pass, since operators often chain several nltest queries back to back.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this nltest command, and is that parent chain
    expected?
  context: Legitimate nltest usage is typically run from cmd.exe spawned by
    explorer.exe (an admin opened a command prompt) or from an automation or
    management script. nltest spawned by Office applications, script interpreters
    (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), or
    wsmprovhost.exe (WinRM remote execution) indicates automated post-exploitation
    enumeration rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single nltest query may be legitimate troubleshooting, but multiple
    reconnaissance commands in rapid succession - whoami, net.exe, dsquery,
    nslookup, adfind, alongside nltest - is a signature pattern of post-compromise
    enumeration. Three or more different recon binaries within fifteen minutes
    typically indicates automated discovery. Domain enumeration via PowerShell AD
    cmdlets (Get-ADUser, Get-ADComputer, Get-DomainTrust) or [ADSISearcher] may
    appear in the same window and is an equivalent indicator.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Was domain trust enumeration also performed in-process via the trust
    APIs, indicated by loads of the netlogon/directory client DLLs?
  context: nltest is the command-line path to trust discovery, but the same
    enumeration can run in-process through Win32/.NET trust APIs
    (DSEnumerateDomainTrusts, GetAllTrustRelationships) without ever launching
    nltest.exe. Those calls pull in the netlogon and directory client libraries -
    netapi32.dll, logoncli.dll, netutils.dll, ntdsapi.dll. Loads of these into a
    script host, an Office process, or another unexpected image around the alert
    point to a broader enumeration effort using multiple methods. If image-load
    telemetry is not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - '\netapi32.dll'
          - '\logoncli.dll'
          - '\netutils.dll'
          - '\ntdsapi.dll'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Did directory-object access events fire on a domain controller for this
    user around the alert time, indicating trust or account attributes were read?
  context: When trust or account enumeration reaches the directory, the domain
    controller records directory-service object access. Correlating those access
    events for the acting account within a bounded window around the nltest
    execution shows whether the enumeration actually queried the directory and what
    objects were touched, distinguishing a local command from one that reached AD.
    If directory-service access auditing is not collected in this environment, treat
    zero results as a visibility gap rather than evidence nothing was read.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        SubjectUserName|expand: '%User%'
      condition: selection
    fields:
      - ObjectName
      - ObjectType
      - AccessMask
- question: Does this host normally run nltest at all?
  context: A binary that has never been seen on a host is more notable than one that
    runs regularly. Zero or very low historical counts of nltest on this host
    indicate first-time or rare execution, which raises the weight of the alert;
    consistent prior usage suggests an administrator or a management process that
    routinely queries domain state from this machine.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the nltest recon pattern, what
    parents and users normally drive it, and does the current alert fit?
  context: Even a common admin tool can be abused. This query mirrors the rule's
    selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific recon pattern (not generic nltest usage)
    has historically run here. A new parent process, an unexpected account, or a
    first-ever occurrence of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_nltest:
      - Image|endswith: \nltest.exe
      - OriginalFileName: nltestrk.exe
      selection_recon:
      - CommandLine|contains|all:
        - server
        - query
      - CommandLine|contains:
        - /user
        - all_trusts
        - 'dclist:'
        - 'dnsgetdc:'
        - domain_trusts
        - 'dsgetdc:'
        - parentdomain
        - trusted_domains
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did nltest spawn afterward?
  context: nltest is a query tool and normally spawns no children. Processes spawned
    in the wake of the nltest run on this host - cmd.exe, powershell.exe, net.exe,
    or other tools - reveal whether the enumeration was a step in a larger sequence
    moving toward credential access or lateral movement. Unexpected children
    following discovery point to hands-on operator activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_nltest:
      - Image|endswith: \nltest.exe
      - OriginalFileName: nltestrk.exe
      selection_recon:
      - CommandLine|contains|all:
        - server
        - query
      - CommandLine|contains:
        - /user
        - all_trusts
        - 'dclist:'
        - 'dnsgetdc:'
        - domain_trusts
        - 'dsgetdc:'
        - parentdomain
        - trusted_domains
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_nltest:
      - Image|endswith: \nltest.exe
      - OriginalFileName: nltestrk.exe
      selection_recon:
      - CommandLine|contains|all:
        - server
        - query
      - CommandLine|contains:
        - /user
        - all_trusts
        - 'dclist:'
        - 'dnsgetdc:'
        - domain_trusts
        - 'dsgetdc:'
        - parentdomain
        - trusted_domains
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether
    the nltest enumeration was a single event or part of activity spanning multiple
    endpoints. If the same user triggered similar discovery or other activity on
    other hosts, the scope of the incident is larger than one machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_nltest:
      - Image|endswith: \nltest.exe
      - OriginalFileName: nltestrk.exe
      selection_recon:
      - CommandLine|contains|all:
        - server
        - query
      - CommandLine|contains:
        - /user
        - all_trusts
        - 'dclist:'
        - 'dnsgetdc:'
        - domain_trusts
        - 'dsgetdc:'
        - parentdomain
        - trusted_domains
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    nltest run reveals what led to it and what followed - the parent that staged it,
    other reconnaissance, privilege escalation, or persistence in the same window.
    Novel parent-child pairs at low counts are what to scan for against the
    high-count noise of routine system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - credential access, defense
    tampering, or execution from an unusual parent - may reveal the attack stages
    that preceded this enumeration and help reconstruct the full timeline. Domain
    discovery is often one step in a sequence, so prior alerts give the context for
    why an account began enumerating domain trusts.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired the nltest recon pattern in the past week, and
    does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query mirrors the rule's selection structure with no host scope, so
    the result is a fleet-wide count of the nltest recon firing pattern rather than
    generic nltest usage. Many hosts firing the same pattern points to a management
    or monitoring tool that queries domain state by design; one host or a small
    unrelated set points to manual operator enumeration. Use the host distribution
    and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_nltest:
      - Image|endswith: \nltest.exe
      - OriginalFileName: nltestrk.exe
      selection_recon:
      - CommandLine|contains|all:
        - server
        - query
      - CommandLine|contains:
        - /user
        - all_trusts
        - 'dclist:'
        - 'dnsgetdc:'
        - domain_trusts
        - 'dsgetdc:'
        - parentdomain
        - trusted_domains
      condition: all of selection_*
    fields:
    - host.name
