name: Rhadamanthys Stealer Module Launch Via Rundll32.EXE
id: e60fe97e-60f0-4a6c-9950-fbd341d8e2f3
description: |
  Detects rundll32.exe launching an NSIS-packaged module: the process is identified as rundll32 by
  either its OriginalFileName (RUNDLL32.EXE) or an image path ending in \rundll32.exe, and its command
  line contains both `nsis_uns` (the dropped module's filename prefix) and `PrintUIEntry` (an export
  name borrowed from the legitimate printui.dll). This stealer family drops a DLL named nsis_uns*.dll
  into a user-writable directory such as %TEMP% or AppData\Roaming and executes it through rundll32 so
  the stealer code runs inside a signed Microsoft binary; the same process then retrieves and decrypts
  the final payload from a remote host and collects browser credentials, session cookies, and
  cryptocurrency wallet data. Legitimate PrintUIEntry use targets printui.dll for printer
  administration and does not reference an NSIS module path, so the investigation should confirm the
  command line, identify what dropped and launched the DLL, and scope what credential material on the
  host is now exposed.
type: detection
detection_id: 5cdbc2e8-86dd-43df-9a1a-200d4745fba5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does this event match the rule's criteria — a rundll32 process identified by either OriginalFileName
    or image path, with a command line containing both `nsis_uns` and `PrintUIEntry`?
  context: >-
    The rule requires three things together: rundll32 identity, the `nsis_uns` module reference, and the
    `PrintUIEntry` export. Rundll32 identity is satisfied by either branch — OriginalFileName is
    RUNDLL32.EXE, or the image path ends in \rundll32.exe. Note which branch fired. If OriginalFileName
    matched but the image path is not the system rundll32.exe, the binary has been copied or renamed and
    the origin and location of that copy become the load-bearing questions. If only the path branch
    matched, OriginalFileName is missing or altered, which points at a modified or repacked binary.
    Confirm the full DLL path and the export name before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run rundll32.exe against a module in a user-writable directory?
  context: >-
    Printer administration through rundll32 printui.dll,PrintUIEntry is a normal administrative action on
    print servers and admin workstations, but it references printui.dll in System32, not an NSIS module
    under %TEMP% or AppData. Knowing the user's role and the host's function separates routine printer
    management from a module launched out of a user-writable path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What exactly did this rundll32 command do — which module path was loaded and which export was called?
  context: >-
    The command line carries the full module path and the export invoked after the comma. This family's
    launch command is long and varies per iteration, so read the whole string: the directory the module
    was written to (%TEMP%, AppData\Roaming, or a subfolder), the random hexadecimal suffix on the
    nsis_uns filename, and any trailing arguments passed to the export. `PrintUIEntry` is an export name
    taken from printui.dll and carries no printing meaning when the target module is an NSIS package.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: nsis_uns
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this rundll32 instance, and is that parent chain expected?
  context: >-
    The parent identifies the loader that dropped the module. Installer-style parents from a user download
    path, a renamed system-looking executable such as one named after a legitimate broker or runtime
    process, a script host, or an Office application all point at user-execution delivery. Trusted software
    installers and printer management tools are the benign parents to rule out. Once the parent is known,
    walk one level further up and check what else that parent launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which process wrote the nsis_uns module to disk on this host, and where was it written?
  context: >-
    The module is written to disk before rundll32 loads it, and the write event names the process that
    dropped it. This identifies the loader stage even when the rundll32 parent is a short-lived
    intermediary. The write path also matters on its own — a module under %TEMP% or AppData\Roaming is
    consistent with this family's staging, while a path under a managed application directory would
    suggest a different explanation.
  range: -4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: nsis_uns
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - process_creation
- question: Which modules did this rundll32 process load, and were they signed?
  context: >-
    Correlating the rundll32 invocation with the DLLs it maps within seconds of launch separates a proxy
    execution from a normal one. Expect the nsis_uns module itself as an unsigned load from a user-writable
    path. Also look for a second copy of ntdll.dll being mapped, which this family uses to overwrite
    user-mode hooks, and for loads of endpoint-security modules that the stealer manipulates before
    collection begins.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: Did rundll32.exe make outbound connections from this host around the alert, and to what destinations?
  context: >-
    After the module loads, the stealer code runs inside the rundll32 process and reaches a remote host to
    retrieve the payload — often as an image file that is decrypted in memory — and later to exfiltrate what
    it collects. Rundll32 talking to an address outside the environment's normal ranges is the pivot to
    scope: treat any external destination here as a candidate C2 and check whether other hosts contacted it.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What child processes did the alerting rundll32 process spawn afterward?
  context: >-
    Children of the alerting process reveal what the module did after loading. Command interpreters, script
    hosts, or copies of the loader indicate the operation continued past the initial launch. An absence of
    children is not exoneration for this family — the collection work runs inside the rundll32 process
    itself rather than through spawned tools.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What credential stores, browser profiles, and cryptocurrency wallets existed on this host, and which need rotation?
  context: >-
    Modules in this stealer family read browser credential databases and session cookies, password-manager
    databases, VPN and FTP client configurations, messaging-client session data, and cryptocurrency wallet
    files, then send them to a remote host. If the module ran, treat everything stored under the alerting
    user's profile as exposed and build the rotation list from what was actually installed — browser-saved
    passwords, saved sessions that survive a password change, and any wallet seed material.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  - manual_review
  - edr_console
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the surrounding window collapses routine agent
    telemetry into high-count rows and leaves novel pairs standing out at low counts. Look for the delivery
    stage before the launch — an installer run from a download directory, an archive extraction, an
    unfamiliar executable in a user-writable folder — and for discovery or staging activity after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Has this host ever run rundll32.exe against a module whose name contains `nsis_uns` before?
  context: >-
    Rundll32 runs constantly on every Windows host, so a count of the binary alone answers nothing. This
    query counts only rundll32 executions referencing an NSIS-named module, with or without the
    `PrintUIEntry` export, over 90 days. Zero prior events means the module launch is new to this host. A
    non-zero count means some local software legitimately ships NSIS uninstaller components through
    rundll32, and that allowed-module baseline should be captured so future alerts can be tuned against it.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: nsis_uns
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent/user distribution
    reflects how this specific firing pattern has run here rather than generic rundll32 usage. A parent that
    has never driven this pattern before, or a user account that has never produced it, is the deviation
    worth chasing. For this rule, an empty result over 14 days is the common and more concerning outcome.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll32:
      - OriginalFileName: RUNDLL32.EXE
      - Image|endswith: \rundll32.exe
      selection_dll:
        CommandLine|contains: nsis_uns
      selection_export_function:
        CommandLine|contains: PrintUIEntry
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this specific pattern across all hosts rather than generic rundll32 use. A user who has never
    produced it is a different situation from one who does so regularly. Weigh the count against the user's
    role — a print administrator has a plausible reason to invoke PrintUIEntry, though not against an NSIS
    module.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll32:
      - OriginalFileName: RUNDLL32.EXE
      - Image|endswith: \rundll32.exe
      selection_dll:
        CommandLine|contains: nsis_uns
      selection_export_function:
        CommandLine|contains: PrintUIEntry
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting parent process, giving the 90-day history of that parent driving this specific pattern. A new or
    rare parent is the deviation worth chasing; a parent already accounting for a large prior volume is
    vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll32:
      - OriginalFileName: RUNDLL32.EXE
      - Image|endswith: \rundll32.exe
      selection_dll:
        CommandLine|contains: nsis_uns
      selection_export_function:
        CommandLine|contains: PrintUIEntry
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's process activity across every host in the surrounding hour shows whether the same
    account was active elsewhere. Credentials collected from one host are commonly reused, so a second host
    running the same delivery or launch pattern under this account expands the scope. If the alert fired
    under SYSTEM or another service principal, this result is dominated by routine agent telemetry and the
    parent-driven view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, a user-scoped network-wide view returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism fired elsewhere, so the query mirrors the rule's selection
    structure scoped to the alerting parent process, fleet-wide, in the alert window. Multiple hosts in the
    same window points to a pushed or scheduled trigger; a single host points to a host-local one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll32:
      - OriginalFileName: RUNDLL32.EXE
      - Image|endswith: \rundll32.exe
      selection_dll:
        CommandLine|contains: nsis_uns
      selection_export_function:
        CommandLine|contains: PrintUIEntry
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count
    of this firing pattern rather than rundll32's generic footprint. Many hosts firing it points to software
    that legitimately ships NSIS uninstaller components through rundll32 and gives a tuning baseline. One
    host, or a small unrelated set, points to delivery through downloads or search advertising landing on
    individual users. Any additional host found here needs the same module-drop and outbound-connection
    checks applied to it.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_rundll32:
      - OriginalFileName: RUNDLL32.EXE
      - Image|endswith: \rundll32.exe
      selection_dll:
        CommandLine|contains: nsis_uns
      selection_export_function:
        CommandLine|contains: PrintUIEntry
      condition: all of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections reconstruct the stages that preceded the module launch. Look for user-execution or
    download activity, sandbox-evasion or defense-tampering detections from the loader stage, and any
    credential-access alerts. The alert sequence on the host gives the timeline that the process telemetry
    alone does not.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
