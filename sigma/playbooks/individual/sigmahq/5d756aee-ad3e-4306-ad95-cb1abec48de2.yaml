name: GoToAssist Temporary Installation Artefact
id: 15d65eb7-456f-4a71-9f58-e6da6b781d84
description: >-
  Detects file activity in the temporary staging directory used by the GoToAssist
  Remote Support Expert client (\AppData\Local\Temp\LogMeInInc\GoToAssist Remote
  Support Expert\). GoToAssist is legitimate commercial remote support software,
  but adversaries deploy the same tools to obtain an interactive
  command-and-control channel that blends in with sanctioned IT support activity
  and is often permitted by application control. The investigation should
  establish whether the installation maps to an authorized support session,
  whether the client executed and registered persistence, what external endpoints
  it reached, and whether the session was used to run commands on the host.
type: detection
detection_id: 5d756aee-ad3e-4306-ad95-cb1abec48de2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the file path fall under the GoToAssist Remote Support Expert Temp directory, and which process wrote it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive.
    The rule fires on any file written under
    \AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\ — the
    staging location the GoToAssist Remote Support Expert client uses during
    installation. Review the exact path, the operation performed
    (created/deleted/renamed), and the responsible process against that
    criterion.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user or host expected to give or receive remote support through GoToAssist?
  context: >-
    Remote support software has narrow legitimate populations — help-desk staff,
    IT administrators, and endpoints under an active support engagement.
    A standard workstation whose user has no support relationship, or a server
    that should never host interactive support sessions, changes the read of the
    same file activity. When the user is a machine or service account, judge by
    the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Are the staged files still on disk, or were they deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. GoToAssist
    stages components in Temp during a support session and commonly cleans them up
    afterward, so deletion within hours can be normal teardown — but a client
    still on disk can be retrieved and verified, while rapid deletion with no
    matching support session suggests an operator covering the installation.
    Interpret each returned event by its EventType.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Is GoToAssist on the organization's approved remote access tool list?
  context: >-
    Organizations typically sanction a small set of remote support tools; anything
    outside that list — even well-known commercial software like GoToAssist,
    AnyDesk, or TeamViewer — may represent shadow IT or attacker-deployed access.
    Adversaries rotate among commercial RMM products (ConnectWise, Zoho Assist,
    and others) precisely because each individual brand looks legitimate, so
    check authorization by policy, not by the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is there a current helpdesk ticket or scheduled support session that explains this GoToAssist installation?
  context: >-
    Legitimate GoToAssist Remote Support use correlates with an active support
    ticket, a scheduled maintenance window, or a user-initiated support request —
    the Expert client staging in Temp normally means a support session was just
    started. If no support context exists for this host at this time, the tool
    may have been delivered by an attacker for interactive access or by a user
    circumventing IT controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What external endpoint did the process behind this installation connect to?
  context: >-
    Remote support tools establish outbound sessions through vendor relay
    infrastructure — for GoToAssist, domains under the LogMeIn/GoTo brands (for
    example gotoassist.com, getgo.com, logmein.com). Connections to unrelated
    endpoints, raw IP addresses with no vendor association, or nonstandard high
    ports (RMM software may use configurable ports such as 7070 or 5650) point
    away from a normal vendor session. Long-lived sessions with sustained
    outbound volume outside a known support window also deserve attention; note
    that destination hostnames are frequently absent on endpoint network events,
    so expect to assess IPs and ports directly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - network_connection
- question: What process wrote the GoToAssist files, and how was it launched?
  context: >-
    The alert's file event identifies the writing process; this query retrieves
    that process's own creation event — its full command line and parent. A
    browser download followed by a user-launched installer fits a user-initiated
    support session. Delivery by a script interpreter, an Office application, an
    unexpected service, or an already-suspicious parent chain points to
    attacker-driven deployment of the tool.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the GoToAssist client execute from the Temp staging directory after the files were written?
  context: >-
    Staged files only become a control channel once a component runs. This query
    looks for any binary executing from the GoToAssist staging path, which marks
    the transition from delivery to an active support session. Executions from
    user-writable Temp paths are exactly the pattern tool-agnostic remote-access
    detection keys on; correlate the execution time with the file writes to
    establish the install-to-use window.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_path:
        Image|contains: '\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\'
      condition: all of selection_*
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - image_load
- question: If the alerted file executed, what is its hash — and is it the genuine GoToAssist component?
  context: >-
    A file's hash is recorded when it runs, not when it is written. If the
    alerted artifact executed, read its hash and check it against threat
    intelligence and the vendor's known-good releases — attackers sometimes plant
    renamed or tampered binaries inside legitimate-looking tool directories
    because the path earns implicit trust. If the file is present but has not
    executed, retrieve it from disk and hash it manually; if it was already
    deleted, work from the execution events captured while it existed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Was an autorun or service registry entry created to keep the remote support client running?
  context: >-
    Remote access tool tradecraft chains initial execution to persistence via a
    service or autorun so the channel survives reboot. An attended GoToAssist
    Remote Support session that stages in Temp normally needs no persistence —
    a Run-key or service registration referencing GoToAssist, LogMeIn, or g2a
    components converts a one-time support session into standing access and is
    the strongest differentiator from routine help-desk use. Value data is
    occasionally absent on registry events; when it is, judge by the key path
    and the writing process.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
          - '\CurrentControlSet\Services\'
      selection_payload:
        Details|contains:
          - 'GoTo'
          - 'LogMeIn'
          - 'g2a'
      condition: all of selection_*
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
- question: Did a GoToAssist or LogMeIn process spawn command shells or script interpreters on this host?
  context: >-
    Interactive control through a remote access tool surfaces as shell and
    script-host children under the tool's GUI or service parent. GoToAssist's
    remote-execution features legitimately spawn helper processes during a
    support session, so weigh what the child command lines actually did —
    reconnaissance commands, credential access, or download-and-execute activity
    under a remote-support parent indicates the channel was used for hands-on
    control rather than routine troubleshooting.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_parent:
        ParentImage|contains:
          - 'GoToAssist'
          - 'LogMeIn'
          - '\g2a'
      selection_child:
        Image|endswith:
          - '\cmd.exe'
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\wscript.exe'
          - '\cscript.exe'
          - '\mshta.exe'
      condition: all of selection_*
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process staging a remote support client writes a predictable set of
    components into its own directory. The same writer (or its children) also
    dropping executables into other locations, staging archives, or touching
    paths unrelated to the tool suggests the support software is one component of
    a larger toolkit delivery rather than an isolated installation.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the GoToAssist staging directory recently, and by which processes?
  context: >-
    The staging directory should be populated by the GoToAssist installer and
    client components exclusively. Other writers landing files there — or writes
    spread across the past week rather than clustered around a single support
    session — reveal whether this location is a one-time session artifact or
    under ongoing use, and a single unfamiliar writer across many files is the
    signal worth chasing.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- always_include: true
  question: Has this user previously produced GoToAssist staging activity, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is
    the user's 90-day history of GoToAssist Remote Support Expert staging,
    aggregated by host. A help-desk technician who stages the Expert client
    weekly is routine; a user with no support role producing this activity for
    the first time is the deviation worth investigating. Weigh the count against
    the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven GoToAssist staging on this host or across the environment?
  context: >-
    When the alert fires under a service principal, user identity does not
    attribute the behavior — the meaningful pivot is the launch mechanism. The
    query mirrors the rule's selection scoped to the alerting program,
    giving the 90-day, environment-wide history of this program driving this
    specific staging pattern, aggregated by host. A new or rare program for this
    pattern is the deviation worth chasing; a program already accounting for many
    prior events across hosts reads as established support tooling or
    automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the remote
    support installation is part of wider movement — the same user staging tools
    or running processes on multiple endpoints in the same window widens the
    scope of the investigation. When the alert fired under SYSTEM or another
    service principal, this pivot returns agent noise; the parent-scoped
    clustering question is the meaningful counterpart in that case.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did the same program-driven GoToAssist staging fire on other hosts in this window, or is it isolated to this host?
  context: >-
    Under a service principal, per-user clustering degenerates into agent
    telemetry noise. The meaningful question is whether the same launch mechanism
    produced GoToAssist staging elsewhere — the query mirrors the rule's
    selection scoped to the alerting program, fleet-wide, in the alert
    window. Multiple hosts in the same window points to a pushed or scheduled
    rollout of the tool; a single host points to a host-local trigger such as an
    individual support session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\LogMeInInc\GoToAssist Remote Support Expert\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Attacker-deployed remote access tools rarely arrive first — earlier
    detections on the same host, such as phishing-stage execution, defense
    tampering, or credential access, reveal the delivery path that preceded the
    tool's installation and help reconstruct the timeline. A clean prior
    timeline alongside a valid support ticket supports the legitimate-use
    reading.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
