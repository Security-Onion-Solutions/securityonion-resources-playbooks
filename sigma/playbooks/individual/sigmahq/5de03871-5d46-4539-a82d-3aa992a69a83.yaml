name: Registry Disable System Restore
id: ba19c09a-e13b-4238-83e3-8b63135ef53b
description: |
  Detects a registry modification that disables Windows System Restore — the DisableSR or
  DisableConfig value set to DWORD (0x00000001) under the SystemRestore policy key
  (\Policies\Microsoft\Windows NT\SystemRestore) or the direct configuration key
  (\Microsoft\Windows NT\CurrentVersion\SystemRestore). Administrators and group policy can set
  these values legitimately on servers or managed images, but ransomware operators routinely
  disable restore-point creation alongside shadow-copy deletion and backup destruction just
  before encryption. The investigation should identify what process wrote the value, whether
  other recovery-inhibiting or destructive actions occurred on this host or others, and whether
  the change is an isolated policy action or part of an impact sequence.
type: detection
detection_id: 5de03871-5d46-4539-a82d-3aa992a69a83
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the modified registry key and value data match the System Restore disable pattern this rule detects?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires
    when a value named DisableSR or DisableConfig under a SystemRestore key (the
    \Policies\Microsoft\Windows NT\SystemRestore policy path or the
    \Microsoft\Windows NT\CurrentVersion\SystemRestore configuration path) is set to
    DWORD (0x00000001). Review the exact key path, the value data, and the writing process
    against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to change System Restore configuration?
  context: >-
    System Restore is sometimes disabled deliberately — by group policy on servers (where the
    feature is off by default), by imaging or provisioning scripts, or by disk-space management
    on VDI fleets. Knowing whether the user role and host function are consistent with a
    restore-policy change is often the fastest path to a verdict. User attribution is present on
    most endpoint registry events; when it shows a machine account or SYSTEM, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What other recovery-inhibiting commands were executed on this host?
  context: >-
    Disabling System Restore through the registry rarely happens alone during an attack.
    Operators chain it with shadow-copy deletion (vssadmin or wmic with flags like /all and
    /quiet), boot-recovery disabling (bcdedit), backup-catalog deletion (wbadmin), Windows
    Recovery Environment disabling (reagentc), and disabling the SystemRestore\SR scheduled task
    (schtasks with /disable). This query surfaces recovery-inhibiting commands on the host in
    the 24 hours after the alert, revealing the full scope of recovery destruction. Verify
    whether restore points and shadow copies still exist on the host (vssadmin list shadows,
    reagentc /info) and confirm offline or cloud backup status through organizational backup
    systems.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recovery:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\reagentc.exe'
          - '\diskshadow.exe'
      selection_cmdline:
        CommandLine|contains:
          - 'delete shadows'
          - 'shadowcopy delete'
          - 'recoveryenabled'
          - 'bootstatuspolicy'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'boot.ini'
          - 'winre.wim'
          - '/disable'
      condition: selection and (selection_recovery or selection_cmdline)
    fields:
      - Image
      - CommandLine
- question: What other destructive or recovery-inhibiting actions occurred on this host?
  context: >-
    Ransomware operators typically chain multiple destructive actions — deleting shadow copies,
    disabling recovery, stopping security services, changing file permissions, and clearing
    event logs. Finding the complete set of destructive commands in the window around the
    restore-policy change reveals the operation's structure and distinguishes an impact sequence
    from an isolated administrative action. If the surfaced commands share one parent (often
    cmd.exe or powershell.exe running a script), that points to scripted execution.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_destructive:
        Image|endswith:
          - '\vssadmin.exe'
          - '\wmic.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\cipher.exe'
          - '\fsutil.exe'
          - '\icacls.exe'
          - '\takeown.exe'
          - '\attrib.exe'
          - '\sc.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\powershell.exe'
          - '\taskkill.exe'
      condition: selection and selection_destructive
    fields:
      - Image
      - User
- question: Is this same System Restore disable firing on other hosts in the environment?
  context: >-
    Ransomware attacks often execute the same recovery-destruction sequence across many hosts
    simultaneously or in rapid succession. This detection firing on multiple hosts within the
    hour indicates network-wide execution and determines the scope for containment. A single
    affected host is more consistent with a targeted action or a local administrative change.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - rule.name
      - event.severity_label
- question: Are there signs of file encryption, ransom notes, or ransomware binary execution on this host?
  context: >-
    Recovery-inhibiting changes typically precede file encryption by minutes. Look in the
    forward window for unknown binaries executing from temp or user-writable paths, command
    interpreters launching unfamiliar executables, and processes consistent with mass file
    modification. Also check for ransom-note file names (README, HOW_TO_DECRYPT variants)
    through file telemetry or the endpoint console to determine whether encryption has already
    started.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_known:
        Image|startswith:
          - 'C:\Program Files'
          - 'C:\Windows\System32\svchost'
          - 'C:\Windows\System32\wbem'
      condition: selection and not filter_known
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Which SystemRestore value was set, and what does it control?
  context: >-
    The two value names the rule watches have distinct effects — DisableSR set to 1 stops
    restore-point creation entirely, while DisableConfig set to 1 locks the System Restore
    configuration interface. The path also matters. A write under
    \Policies\Microsoft\Windows NT\SystemRestore is the policy-enforced form (what group policy
    and reg-add commands targeting HKLM\SOFTWARE\Policies produce), while
    \Microsoft\Windows NT\CurrentVersion\SystemRestore is the direct configuration location.
    The value name, path, and writing process together determine whether this reads as managed
    policy or tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process and command line wrote this value, and is the parent chain expected?
  context: >-
    The registry event carries the writing process image but not its command line or parent —
    this pivot retrieves the writer's process-creation event. A reg.exe add command naming
    DisableSR or DisableConfig, or a PowerShell Set-ItemProperty call, indicates a hands-on or
    scripted change; svchost.exe hosting the group policy service indicates policy processing.
    Unusual parents such as Office applications, wscript.exe, or a binary in a user-writable
    path point toward malware-driven tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
      - User
- question: Is the System Restore disable value still in place, and has this key been re-modified?
  context: >-
    A value that stays set keeps restore-point creation suppressed for every later recovery
    attempt. Endpoint telemetry does not record registry deletions, so judge persistence from
    the key's re-modification history — a later write returning the value to 0 indicates
    remediation or a legitimate toggle, while no further writes means the disable is still in
    effect and restore points have stopped accumulating. Confirm current state on the host
    directly if the timeline is ambiguous.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who disable System Restore through the registry often modify several keys in a
    short interval — other recovery-inhibition values, security-tool policy keys under
    Windows Defender paths, service configurations, or Run-key persistence. Rapid clusters of
    recovery-feature changes over short intervals are the pattern to look for. The triggering
    key will appear in these results; the signal is what else was modified and whether the same
    writing process touched multiple security-relevant paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Examining process activity around the registry change reveals the immediate context — what
    led to the write, what followed it, and whether it sits inside a larger sequence such as
    reconnaissance, privilege escalation, or staging before impact. Novel parent-child pairs at
    low counts stand out against the repetitive high-count rows of routine host telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this SystemRestore key been modified before on this host?
  context: >-
    Restore-policy keys should rarely change outside provisioning or policy rollout. Zero
    history makes a first-time write more suspicious; a recurring modification with the same
    value data and the same writing process looks like scheduled policy refresh. Compare the
    historical value data and writers against the alerting event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that performed this write?
  context: >-
    A writer binary that has never executed on this host before is more suspicious than one that
    runs regularly. Frequent historical executions of the same image (for example a management
    agent or policy engine) support a routine-configuration verdict; zero or very low counts
    point to first-time tooling on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was this SystemRestore key modified on other hosts in the environment?
  context: >-
    The same restore-policy write appearing on many hosts in the window suggests a group policy
    rollout or widespread automated execution — compare the value data and writing process
    across hosts to tell them apart. Policy-driven changes share a policy-engine writer and
    identical data; malware-driven changes tend to arrive with varied writers or alongside
    destructive commands. A single-host modification reads as targeted or local.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Recovery inhibition usually arrives late in an intrusion. Earlier detections on the same
    host — defense tampering, credential access, lateral movement, reconnaissance — reveal the
    stages that preceded the restore-policy change and help reconstruct the timeline back to
    initial access.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity has this user performed across the network?
  context: >-
    Tracking the user's activity beyond the alerting host shows whether the restore-policy
    change is isolated or part of multi-host activity — similar commands or destructive tooling
    under the same account elsewhere indicate broader compromise. If the registry write was
    attributed to SYSTEM or a machine account, this pivot degenerates into service noise; rely
    on the writing-process and cross-host key pivots instead. If the alert fired under SYSTEM,
    LOCAL SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query
    intentionally returns nothing — every host runs those principals constantly, so a fleet-wide
    pivot on them is noise, not an actor trail; use the program- and host-scoped questions
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: Where has this user authenticated recently?
  context: >-
    Authentication events show which systems the account accessed before and after the change.
    An account authenticating to many systems in a short period — especially network (type 3) or
    remote-desktop (type 10) logons shortly before recovery inhibition — is consistent with
    lateral movement ahead of a multi-host impact stage. If the alert fired under SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query intentionally
    returns nothing — service-principal logons are background noise, not an actor trail. For a
    human account, zero results can also mean the Security channel is not ingested for the
    relevant hosts; confirm 4624 visibility before reading zero as "no authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
