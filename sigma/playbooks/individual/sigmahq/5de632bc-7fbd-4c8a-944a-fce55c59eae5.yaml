- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host reconstruct what led here. Defense tampering, staged
    decoding, credential access and remote-access tooling commonly precede impact, and their
    presence turns a single string match into a sequence with a timeline. Their absence, together
    with an accountable parent process, supports reading this as resident software or a test
    rather than an operation in progress.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: >-
    Have other hosts matched the rule's pattern in the past week, and does the cross-host
    distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific pattern rather than generic use of the binaries. Many hosts
    matching with the same parent and the same command structure points at scripted deployment or
    vendor automation that occupies one of these paths. One host, or a small unrelated set,
    points at operator activity and calls for the staged-file and child-process work on each of
    them.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - C:\Windows\cert.exe
        - del /q /f c:\kworking\agent.crt
        - Kaseya VSA Agent Hot-fix
        - \AppData\Local\Temp\MsMpEng.exe
