name: REvil Kaseya Incident Malware Patterns
id: eec75e2d-6e40-4e08-a6c3-4c6877ef53a7
description: >-
  This rule fires on a process_creation event that matches any one of three independent
  branches: either the command line contains one of a set of literal strings associated with
  REvil ransomware deployment (a renamed certutil copy at C:\Windows\cert.exe, deletion of a
  staged agent.crt payload, an MsMpEng.exe copy under AppData\Local\Temp, removal of IIS logs),
  or the process Image is one of C:\Windows\MsMpEng.exe, C:\Windows\cert.exe,
  C:\kworking\agent.exe or C:\kworking1\agent.exe, or the command line contains both
  "del /s /q /f" and "WebPages\Errors\webErrorLog.txt" together. The behaviours behind these
  strings are generic rather than family-specific — impairing endpoint defenses (T1562.001) and
  decoding a staged payload with a renamed system utility (T1140) commonly precede encryption
  (T1486), and many families reuse the same staging directories, renamed binaries and log-wiping
  commands. The matched strings are literal and date from 2021, so establish first which branch
  fired, then whether the matching process is that tooling, a different family reusing the same
  names and paths, or software that legitimately uses one of these locations.
type: detection
detection_id: 5de632bc-7fbd-4c8a-944a-fce55c59eae5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does this event match either a listed command-line string, one of the four listed image
    paths, or the paired log-wiping strings?
  context: >-
    Read the exact Image and CommandLine against the rule's three branches and note which one
    matched, because the branch decides what the rest of the investigation is about. An Image
    match means a process is running from C:\Windows\MsMpEng.exe, C:\Windows\cert.exe or a
    C:\kworking\ staging directory — system-binary names running from paths the real binaries do
    not use — so binary identity, signing and hash questions carry the weight. A command-line
    match usually means an interpreter such as cmd.exe or powershell.exe carried the string, so
    the decode, child-process and file-artifact questions carry the weight and the Image-anchored
    questions describe the interpreter rather than the payload. The paired branch fires only when
    "del /s /q /f" and "WebPages\Errors\webErrorLog.txt" appear together, which is log removal
    rather than payload staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run this binary or command from this path?
  context: >-
    The legitimate context for these paths is narrow. C:\kworking is the working directory used
    by a remote monitoring and management agent, so a managed endpoint can produce activity under
    that path from routine automation, and an on-host web application can produce log deletion
    under WebPages\Errors. C:\Windows\cert.exe and C:\Windows\MsMpEng.exe are not paths Microsoft
    ships anything to. Check whether the host is managed by such an agent, whether a maintenance
    or patching window covers this time, and whether the account is one that performs that work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the file referenced by the alerting command line still on disk for analysis?
  context: >-
    Several of the command lines this rule matches delete their own staged files immediately
    after use, and one branch exists only to delete logs. This query lists file activity by the
    alerting process and its direct children, which shows whether the referenced files were
    created and whether they were removed before analysis could reach them. Files already deleted
    may still be recoverable from backups or volume shadow copies, and the creation event alone
    establishes that the file existed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: >-
    Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Detection-validation frameworks and red team playbooks replay published ransomware command
    lines verbatim, including renamed-certutil decoding and endpoint-protection one-liners, so
    these exact strings appear during authorized testing. An active engagement whose scope covers
    this host, with timing that matches the alert, resolves it without further analysis. Confirm
    against the engagement's target list rather than assuming, since the strings are public and
    also appear in unrelated tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: >-
    What did the matched command actually do? Decode every argument and identify the source and
    destination paths of any decode, copy or delete.
  context: >-
    The strings this rule matches cover several distinct operations, and identifying which one
    ran determines the response. Look for a -decode argument and its input and output paths, a
    copy that places a signed system utility under a new name, appended bytes that alter a file
    hash, deletion of staged payloads, deletion of web or application logs, and execution of a
    binary out of a staging directory. Decoding and execution point at payload delivery; the
    delete variants point at removal of forensic evidence. Chained one-liners separate their
    stages with & or &&, so parse the whole string rather than the first token.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Are file artifacts of the alerting binary present on this host?
  context: >-
    Pre-encryption tooling leaves artifacts after the process exits — a decoded payload in a
    staging directory, a DLL placed beside a renamed system binary so it is side-loaded from a
    trusted image name, ransom-note text files written across user directories, and emptied log
    directories. This query lists file activity by the alerting binary in the hour after the
    alert. When the alert fired on a command-line string, the alerting binary is the interpreter
    that carried it, so its file activity is what the one-liner touched.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    Were the files named in the rule's paths written to this host, and what is in them?
  context: >-
    The rule's paths describe a staging pattern rather than one incident: an encoded payload
    written next to its decoded output in a working directory, and a renamed copy of a signed
    system utility used to perform the decode. This query looks for writes to those literal paths
    on this host by any process, which catches the staging even when a different process from the
    alerting one performed it. If the files exist, retrieve them and check the decoded output for
    a PE header, packer signatures and embedded strings, and compare a cert.exe against the real
    certutil.exe for size, version resources and appended trailing bytes.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - \kworking\agent.
          - \kworking1\agent.
          - \Windows\cert.exe
          - \Windows\MsMpEng.exe
          - \AppData\Local\Temp\MsMpEng.exe
      condition: selection_host and selection_paths
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: >-
    If one of these staged binaries has executed, what is its hash, and does threat intel know it?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this query looks for
    execution of the rule's staged binaries on this host and reads the hash. Submit it to an
    external or internal reputation service. Padding is routinely appended to a renamed system
    utility specifically to break exact-hash matching, so an unrecognised hash on a file named
    cert.exe is not evidence that the file is benign — compare it against the real certutil.exe
    instead. If a staged file is on disk but has not executed, hash it from its path directly.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith:
          - \agent.exe
          - \cert.exe
          - \MsMpEng.exe
      selection_interpreter:
        CommandLine|contains:
          - \kworking\agent.exe
          - \kworking1\agent.exe
          - \Windows\cert.exe
          - \Windows\MsMpEng.exe
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What process spawned this one, and is that parent chain expected?
  context: >-
    The parent establishes how this ran. A remote monitoring or management agent as parent points
    at a pushed script or procedure rather than host-local activity, which widens scope to every
    endpoint that platform reaches. An interactive shell under explorer.exe points at
    hands-on-keyboard activity on this host. A service or scheduled-task parent points at
    something already resident. If the parent is itself unexpected, walk one level further up
    using the parent's own ParentProcessGuid.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    A chained command line runs its stages as child processes, so the children show what the
    sequence accomplished rather than what it declared. Look for an interpreter invoked to change
    endpoint-protection settings, a system utility running under a copied name, and execution of
    a binary out of a staging or temp directory — the progression from defense tampering and
    decoding to running a payload. If the children stop after a delete, the sequence may have
    been interrupted or the rest may have run under a different lineage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process on the host in the surrounding half hour collapses routine agent
    telemetry into high-count rows and leaves novel parent-child pairs standing at low counts,
    which is what to scan for. Interpreters launched by unusual parents, service-control and
    shadow-copy commands, backup or archive utilities, and repeated short-lived processes from a
    single parent are the operations that commonly sit around this pattern.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    When this host has previously matched the rule's pattern, what parents and users drove it,
    and does this alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the result is how
    this specific pattern has run here over two weeks rather than generic use of the binaries. A
    host with prior matches usually means resident software occupies one of these paths or names,
    and the parent and user distribution identifies it. Zero prior matches means the pattern is
    new for this host, and the parent from this alert is the thing to account for.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - C:\Windows\cert.exe
        - del /q /f c:\kworking\agent.crt
        - Kaseya VSA Agent Hot-fix
        - \AppData\Local\Temp\MsMpEng.exe
        - rmdir /s /q %SystemDrive%\inetpub\logs
        - del /s /q /f %SystemDrive%\\*.log
        - c:\kworking1\agent.exe
        - c:\kworking1\agent.crt
      selection2:
        Image:
        - C:\Windows\MsMpEng.exe
        - C:\Windows\cert.exe
        - C:\kworking\agent.exe
        - C:\kworking1\agent.exe
      selection3:
        CommandLine|contains|all:
        - del /s /q /f
        - WebPages\Errors\webErrorLog.txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this specific pattern, aggregated by host, rather than generic use
    of the binaries. An account with no history of producing it is worth more attention than one
    that produces it routinely as part of maintenance work. If the alert fired under SYSTEM, a
    service account or a machine account, this pivot attributes nothing and the parent-process
    history is the meaningful one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - C:\Windows\cert.exe
        - del /q /f c:\kworking\agent.crt
        - Kaseya VSA Agent Hot-fix
        - \AppData\Local\Temp\MsMpEng.exe
        - rmdir /s /q %SystemDrive%\inetpub\logs
        - del /s /q /f %SystemDrive%\\*.log
        - c:\kworking1\agent.exe
        - c:\kworking1\agent.crt
      selection2:
        Image:
        - C:\Windows\MsMpEng.exe
        - C:\Windows\cert.exe
        - C:\kworking\agent.exe
        - C:\kworking1\agent.exe
      selection3:
        CommandLine|contains|all:
        - del /s /q /f
        - WebPages\Errors\webErrorLog.txt
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: >-
    Has this parent process driven the rule's pattern before on this host or elsewhere, or is the
    parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity attributes nothing and the
    launch mechanism is the pivot that carries information. The query mirrors the rule's
    selection structure scoped to the alerting parent process, so the result is that parent's
    90-day history of driving this specific pattern, aggregated by host. A parent that already
    accounts for a long history of matches is resident automation that occupies one of the rule's
    paths; a parent that is new for this pattern is the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection1:
        CommandLine|contains:
        - C:\Windows\cert.exe
        - del /q /f c:\kworking\agent.crt
        - Kaseya VSA Agent Hot-fix
        - \AppData\Local\Temp\MsMpEng.exe
        - rmdir /s /q %SystemDrive%\inetpub\logs
        - del /s /q /f %SystemDrive%\\*.log
        - c:\kworking1\agent.exe
        - c:\kworking1\agent.crt
      selection2:
        Image:
        - C:\Windows\MsMpEng.exe
        - C:\Windows\cert.exe
        - C:\kworking\agent.exe
        - C:\kworking1\agent.exe
      selection3:
        CommandLine|contains|all:
        - del /s /q /f
        - WebPages\Errors\webErrorLog.txt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user run across the environment around this time?
  context: >-
    Activity by the same account on other hosts in the same window establishes whether this is
    confined to one endpoint. Results on hosts the account has no business touching, or the same
    binary appearing on several hosts at once, widen the scope. If the alert fired under SYSTEM,
    LOCAL SERVICE, NETWORK SERVICE or a machine account, this returns routine agent telemetry
    from every host and the parent-scoped fleet question is the one that answers scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: >-
    Did the same parent-driven pattern fire on other hosts in the same window, or is this
    isolated to one host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent
    telemetry from every host. The query instead mirrors the rule's selection structure scoped to
    the alerting parent process, fleet-wide, within the alert window. Several hosts matching at
