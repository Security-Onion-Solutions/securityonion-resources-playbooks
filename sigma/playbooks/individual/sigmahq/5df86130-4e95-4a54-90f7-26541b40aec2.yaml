name: Registry Modification to Hidden File Extension
id: d2880b2d-d6a8-4135-9c6e-7f88990d72c0
description: |
  Detects a write to one of two Explorer shell-display registry values that conceal what a file really is: EITHER HideFileExt set to DWORD (0x00000001), which strips the extension from known file types in the shell, OR Hidden set to DWORD (0x00000002), which stops hidden files from being displayed. Either setting on its own is a legitimate user preference and is also pushed by administrative scripts and imaging profiles, so the change is only meaningful in context; the technique's effect is that a dropped payload named invoice.pdf.exe renders as invoice.pdf, and files marked hidden by a payload stay out of the user's view. The investigation should determine which value was written and by which process, whether that process was launched by a user action or by a script or interpreter, whether the same host saw file drops or executions from user-writable directories in the same window, and whether the setting appeared on other hosts as a managed configuration push rather than a single-host change. Registry value deletion is not observable in this telemetry, so judge cleanup from the key's re-modification history rather than from a delete event.
type: detection
detection_id: 5df86130-4e95-4a54-90f7-26541b40aec2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Which of the two shell-display values was written, and does the value data match what this rule detects?
  context: >-
    The rule fires on EITHER of two independent conditions: a write to ...\Explorer\Advanced\HideFileExt with data DWORD (0x00000001), or a write to ...\Explorer\Advanced\Hidden with data DWORD (0x00000002). Only one branch needs to match. Note which one fired, because it changes what the rest of the investigation is looking for: a HideFileExt write points at masking a payload's real extension, while a Hidden write points at concealing files already written to disk. Confirm the exact TargetObject path and the Details value before proceeding; Details is absent on registry modifications carrying binary or empty value data, so a missing value does not by itself clear the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Explorer file-display settings?
  context: >-
    Changing whether extensions or hidden files are shown is an ordinary desktop preference for a developer or administrator, and imaging and configuration-management scripts set the same values across managed fleets. The same change on a server, on a kiosk-style endpoint, or under an account that does not interactively use the shell fits neither pattern. User attribution is present on roughly 94% of endpoint registry events; when the account is a machine account or a service principal, pivot on the writing process instead and judge the change by what that process is.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which hive does the modified key live under, and does that scope the change to one user or to the whole machine?
  context: >-
    Both values sit under ...\Windows\CurrentVersion\Explorer\Advanced, but the hive determines reach. A write under a per-user hive changes that profile's shell only and is consistent with a user preference or a payload running in that user's context. A write under the machine hive or a default-user profile applies to accounts that log on later, which is a configuration-management action or an attempt to make the concealment survive across accounts. Read the exact key path and the writing process here, and let the value-decoding question carry the meaning of the data itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote the value, and is it a shell or configuration tool or something that has no reason to touch this setting?
  context: >-
    The writing process is the most informative field on this alert. explorer.exe writing the value is the shell recording a checkbox the user ticked in Folder Options. reg.exe, powershell.exe, cmd.exe, a script host, or an unsigned binary from a user-writable directory writing the same value is a programmatic change, and programmatic changes to these two values specifically are the concealment step of a drop-and-run sequence. Read the Details data alongside it to confirm the direction of the change: HideFileExt moving to 1 turns extension display off, and Hidden moving to 2 turns hidden-file display off.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What started the process that wrote this registry value?
  context: >-
    Tracing the writing process to its own parent separates a user opening Folder Options from a payload calling out to reg.exe. An interactive shell launched from explorer.exe reads very differently from reg.exe or powershell.exe spawned by a script host, an Office application, or a binary in a temporary directory. If the parent process identifier resolves to NODATA on this alert, fall back to the writing process name and host with a short time window around the event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has this value been written on this host before, and with what data?
  context: >-
    These two values change when a user adjusts Folder Options and when a provisioning script runs, so a host with a history of writes has an established pattern to compare against. A value that has never been touched on this host and is suddenly set programmatically is the case worth pursuing. Compare the historical Details data and the writing processes: repeated writes by the same configuration tool describe managed behavior, while a single write by an unfamiliar process does not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Concealing file extensions is rarely the only change an operator makes. A cluster of registry writes from the same process within a short window shows whether the display setting landed alongside an autostart entry, a security-policy change, or a firewall or antimalware setting. The triggering key appears in the results; the signal is what else was modified and by which process. If the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths such as Run, Services, Policies, Winlogon, and Image File Execution Options.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Did anything execute from a user-writable directory on this host after the display setting changed?
  context: >-
    Turning extension display off has no effect of its own; it pays off when a file whose real extension is executable is presented to the user as a document and then run. Look at what executed on this host in the hours after the write from directories a standard user can write to. A process launched from a user profile, ProgramData, or a temporary directory shortly after the setting changed connects the concealment to the payload it was meant to conceal. An empty result means the setting is in place but nothing has yet run from those locations.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\Users\'
          - '\ProgramData\'
          - '\Windows\Temp\'
          - '\AppData\'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Were files dropped to Startup folders or autostart paths on this host around the same time?
  context: >-
    A file dropped into a Startup folder runs at logon without any scheduling or service tool being invoked, and an operator who has just turned off extension display and hidden-file display has made exactly that drop harder for the user to notice. Correlating file writes to autostart locations against the registry change shows whether the concealment accompanied a persistence drop. File-write events carry no hash in this telemetry; if a payload is present, hash it from a later execution or retrieve it for a reputation lookup.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other persistence mechanisms installed on this host in the surrounding hours?
  context: >-
    Operators seldom rely on a single foothold. Scheduled tasks, services, registry autostarts, and background transfer jobs are installed with a small set of built-in tools, and seeing several of them run within hours of the display-setting change distinguishes an intentional sequence from an isolated preference edit. Aggregating by tool and command shows which mechanisms were used rather than every individual invocation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Was the same value written on other hosts in the environment?
  context: >-
    The same write across many hosts in a short window describes a configuration or policy push, or a script run against a set of machines, and moves the finding away from targeted activity. A write confined to this one host, especially by a process that appears nowhere else, points the other way. Compare the Details data and the writing process across hosts: identical data written by the same signed configuration tool everywhere is managed behavior, while the same value written by different or unfamiliar processes per host is not.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A shell-display change rarely arrives alone. Aggregating process activity around the write surfaces what preceded it and what followed — a download, a script host, an archive extraction, a dropper, or additional configuration changes. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates a host's process volume.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, a script host launching from an Office application, defense tampering, or reconnaissance — may reveal the stages that preceded the display-setting change and place it in a timeline. A concealment step following an earlier execution alert reads very differently from one with no prior activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was this registry change part of a documented deployment, imaging profile, or approved configuration push?
  context: >-
    Desktop configuration baselines routinely set Explorer display preferences, and a matching deployment record or maintenance window closes the alert quickly. The absence of a record when the change was made programmatically, outside a maintenance window, or on a host outside the deployment's target set moves the finding the other way. This check is often the fastest route to a disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing folder options or running a script that would set this value?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. A user who recalls unticking "Show file extensions" in Folder Options explains an explorer.exe write completely. If no one recalls the action and the writing process was a shell or script interpreter, the account may be compromised or the change may be part of an automated payload. When someone does confirm, capture what they were trying to accomplish and which tool they used.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this change align with the user's working hours or a scheduled maintenance window?
  context: >-
    A user adjusting Folder Options does so while working at the machine. A programmatic write to the same value outside working hours, on a host with no interactive session, or during no scheduled maintenance has no such explanation. Check the host's local time at the event and whether any provisioning or configuration job was scheduled to run in that window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Are Explorer display settings normally managed through group policy or a configuration baseline in this environment?
  context: >-
    Organizations that manage desktop preferences centrally push these values through policy, and a direct write by reg.exe or an interpreter falls outside that path — which may mean an administrator took a shortcut, or that something other than the management stack made the change. Environments with no standard for these settings get less from this question; where a standard exists, a change made outside it is the discriminator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
