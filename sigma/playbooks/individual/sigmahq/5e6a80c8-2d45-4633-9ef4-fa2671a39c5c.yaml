name: Suspicious Parent Double Extension File Execution
id: ba99f87a-e084-4be2-bfbb-aa9d26559316
description: |
  Detects a process whose parent was launched from a file using a double extension — a benign-looking
  first extension (.doc, .docx, .xls, .xlsx, .ppt, .pptx, .rtf, .pdf, .txt) immediately followed by an
  executable second extension (.lnk or .js). The rule fires when the parent process's image path ends in
  one of these double extensions OR the parent command line contains one. Double-extension naming masquerades
  an executable launcher as a harmless document so a user double-clicks it expecting to open a file; the
  spawned child is then the first process of the delivery chain. Investigation should confirm the parent file
  name, identify how it arrived and what it spawned, and determine whether the user and host context fit a
  benign explanation or an initial-access execution.
type: detection
detection_id: 5e6a80c8-2d45-4633-9ef4-fa2671a39c5c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the parent image or parent command line end in a benign-then-executable double extension?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    parent's image path ends in a document-then-executable double extension (such as .doc.lnk or .pdf.js) or
    when the parent command line contains one. Read the full ParentImage and ParentCommandLine and confirm the
    visible "document" extension is actually followed by .lnk or .js.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to open document files that launch executables?
  context: Legitimate document workflows open in their associated application, not by spawning a child process
    from a .lnk or .js launcher. Knowing whether the user routinely receives and opens attachments, and whether
    the host function fits that behavior, is often the fastest path to distinguishing a phishing-delivered
    launcher from a benign file. Standard-user sessions opening such files point toward user-initiated execution;
    activity under an elevated or service context shifts the interpretation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the double-extension parent file, and what spawned the parent itself?
  context: The parent double-extension file is the launcher. Retrieving the parent's own process_creation event
    shows the parent's full command line and the grandparent that started it — for example an archive utility,
    a browser download handler, or explorer.exe acting on a user double-click. The grandparent reveals the
    delivery vector that placed and triggered the launcher.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What is the actual identity of the spawned child process based on its metadata and hash?
  context: The child launched by the double-extension parent is the first executing payload of the chain.
    Comparing the Image path against OriginalFileName reveals whether the child is a renamed tool, and the
    signing details indicate whether it is a Microsoft-signed system binary, a third-party signed tool, or
    unsigned. A mismatch between OriginalFileName and the Image name, or execution from a non-standard
    directory, is a second masquerading layer. The file hash enables a reputation lookup to determine whether
    this is a known-good tool, known malware, or a novel binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: When and how was the double-extension parent file created on this host, and where does it live?
  context: Double-extension launchers do not appear spontaneously — they are downloaded, extracted from an
    archive, or dropped by another process. Tracing the file_event that created a file ending in a
    document-then-executable extension reveals the delivery mechanism and the directory it landed in.
    Files appearing in user-writable locations (Downloads, %TEMP%, Desktop, AppData) are consistent with
    a downloaded or extracted attachment; the creating process shown in Image is the dropper, archive tool,
    or download handler.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - .doc.lnk
          - .docx.lnk
          - .xls.lnk
          - .xlsx.lnk
          - .ppt.lnk
          - .pptx.lnk
          - .rtf.lnk
          - .pdf.lnk
          - .txt.lnk
          - .doc.js
          - .docx.js
          - .xls.js
          - .xlsx.js
          - .ppt.js
          - .pptx.js
          - .rtf.js
          - .pdf.js
          - .txt.js
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: How much time elapsed between creation of the double-extension file and its execution?
  context: Correlating the file_event that wrote the double-extension launcher with the process_creation that
    ran it bounds the activity. A short interval between file creation and execution — seconds to minutes —
    is consistent with a user opening a freshly delivered attachment, while a launcher that sat dormant for
    days before firing points to delayed or staged execution. Compare the creation timestamp from the file
    event against the alert time to establish the window.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - .doc.lnk
          - .docx.lnk
          - .xls.lnk
          - .xlsx.lnk
          - .ppt.lnk
          - .pptx.lnk
          - .rtf.lnk
          - .pdf.lnk
          - .txt.lnk
          - .doc.js
          - .docx.js
          - .xls.js
          - .xlsx.js
          - .ppt.js
          - .pptx.js
          - .rtf.js
          - .pdf.js
          - .txt.js
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What exactly did the spawned child process do? Decode its command-line arguments.
  context: The child's full command line reveals the action the launcher initiated. Decode any flags, encoded
    content, file paths, or URLs. Double-extension launchers commonly chain into a shell or script host that
    iterates directories, re-extracts an archive, or fetches a follow-on payload, so the arguments often name
    the next stage and its location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What other child processes did the double-extension parent spawn?
  context: A delivery launcher often spawns several processes in sequence — a decoy document viewer to satisfy
    the victim, plus a background chain that extracts, decodes, or downloads the actual payload. Seeing every
    child of the same parent reveals the full scope of activity initiated through this launcher rather than only
    the one process that tripped the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What file and process activity occurred around the double-extension parent at the same time?
  context: Beyond direct children, the launcher chain may write files (extracted archives, dropped payloads,
    decoy documents) or stage binaries in temp directories. Examining process activity tied to the same parent
    in a tight window around the alert helps reconstruct what the launcher set in motion and where it placed
    follow-on files.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this parent process name spawned this child binary on this host before?
  context: A parent-child pairing that has never been seen on the host is more suspicious than a recurring one.
    Because the parent here is a double-extension file, almost any historical match is itself notable; a zero or
    very low count confirms this is a novel spawning relationship rather than an established workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - ParentImage|endswith:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      - ParentCommandLine|contains:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - ParentImage|endswith:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      - ParentCommandLine|contains:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the launcher execution was an isolated
    event or part of broader hands-on activity. If the same user triggered similar activity on multiple
    endpoints in the same window, the scope of the incident may be larger than one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - ParentImage|endswith:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      - ParentCommandLine|contains:
        - .doc.lnk
        - .docx.lnk
        - .xls.lnk
        - .xlsx.lnk
        - .ppt.lnk
        - .pptx.lnk
        - .rtf.lnk
        - .pdf.lnk
        - .txt.lnk
        - .doc.js
        - .docx.js
        - .xls.js
        - .xlsx.js
        - .ppt.js
        - .pptx.js
        - .rtf.js
        - .pdf.js
        - .txt.js
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is the same double-extension parent spawning this binary on other hosts?
  context: The same launcher-and-child pairing appearing across multiple hosts may indicate a phishing wave or
    distribution campaign, while a single occurrence is more likely targeted. An environment-wide comparison
    helps calibrate severity and identify the scope of delivery.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context —
    what led to this execution and what happened after. Aggregating by Image and ParentImage collapses repetitive
    agent telemetry while novel parent-child pairs stand out at low counts, which is what distinguishes the
    delivery chain from background noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, defense tampering, or other execution events —
    may reveal the stages that preceded this launcher and help reconstruct the timeline. For an initial-access
    execution like a double-extension file, the absence of prior alerts is consistent with this being the entry
    point of the chain.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
