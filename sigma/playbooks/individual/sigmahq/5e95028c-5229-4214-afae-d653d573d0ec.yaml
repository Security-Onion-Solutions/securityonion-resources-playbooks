name: Security Service Disabled Via Reg.EXE
id: 72a9e32d-2efd-4564-8115-4fb91f9ab8b9
description: |
  Detects use of reg.exe to set the Start value of a security-related service to 4 (Disabled) in the registry. The rule fires when a single command line both performs a registry add operation (contains 'reg' and 'add') AND writes 'd 4' with 'v Start' against one of a list of security service keys (\WinDefend, \WdFilter, \WdBoot, \WdNisSvc, \WdNisDrv, \Sense, \SecurityHealthService, \wscsvc, \MsMpSvc, \NisSrv, \AppIDSvc, \UsoSvc, \wuauserv) — both conditions must be present together.
  Setting a service Start value to 4 prevents the service or driver from loading after reboot, and is a documented way to disable Microsoft Defender, the security health/center service, SmartScreen-related and update services in a way that survives reboot when in-memory toggles are blocked by tamper protection. Legitimate triggers are rare; investigation should determine which service was targeted, who and what initiated the change, whether protection is currently restored, and what activity followed the change.
type: detection
detection_id: 5e95028c-5229-4214-afae-d653d573d0ec
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — a reg add that sets a security service's Start value to 4 (Disabled)?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the command both performs a registry add ('reg' and 'add') and writes 'd 4' with 'v Start' against a security service key (for example \WinDefend, \WdFilter, \Sense, \SecurityHealthService, \wscsvc, \UsoSvc, \wuauserv). Read the full command line and confirm both halves are present and which service key was named.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to disable security services via the registry?
  context: Legitimate administrative activity can trigger this detection, but disabling Defender or other security services by writing Start=4 is rare outside imaging, decommissioning, or specific vendor maintenance. Confirm whether the user role and host function are consistent with deliberately disabling endpoint protection; an account or host with no such role makes the change far more suspicious.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which specific security service was targeted, and what does disabling it remove from the host?
  context: Different targets have different impact. \WinDefend, \WdFilter, \WdBoot, \WdNisSvc and \WdNisDrv are Defender's engine, filter driver, boot driver and network inspection components; \Sense is the endpoint sensor; \SecurityHealthService and \wscsvc run the security center; \UsoSvc and \wuauserv handle update delivery. Read the named key in the command line to determine which protection or telemetry source the host lost.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key path and value did this process actually write, as recorded in registry events?
  context: The registry event shows the actual key path (TargetObject) and data written (Details) as structured fields instead of requiring the analyst to parse them out of reg.exe's command line. Confirm the write landed under HKLM\SYSTEM\CurrentControlSet\Services\<service>\Start with data 4, which is the disabled-on-boot state, and note any related values written in the same process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned this reg.exe instance, and is that parent chain expected?
  context: The parent process reveals how reg.exe was invoked. Interactive administration usually shows explorer.exe, a console, or a management tool as the parent. A script host (wscript.exe, cscript.exe, powershell.exe), Office application, or an unknown binary as the parent points toward automated or scripted tampering rather than an operator at a keyboard. Walking up from the parent's own parent shows how the activity started.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the targeted service currently restored, or is the host still running with that protection disabled?
  context: Setting Start=4 takes full effect after a reboot but the intent is persistent disablement. Check the current state of the named service or driver through endpoint inspection. If Defender or another security service is still set to disabled or is not loading, the host remains unprotected and the value should be restored before further investigation continues.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host in the hour after the security service was disabled?
  context: Defenses are usually disabled to enable something that would otherwise be blocked or logged — payload execution, credential access, or further configuration changes. Examine process activity in the window immediately after the change. If a security service or its telemetry was turned off, expect a visibility gap; process creation appearing in that window points at the activity the tampering was meant to cover.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: Operators who disable one control often disable several in the same operation — turning off additional services, clearing event logs, deleting shadow copies, or changing the firewall. Finding multiple tampering events from the same user or parent process within the surrounding window shows how broad the defense-evasion effort was and whether a single security service or the whole protection stack was targeted.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host via reg.exe in the same session?
  context: Disabling one security service is often part of a wider registry-tampering sequence — additional service Start values flipped, Defender policy keys set, SmartScreen or update settings changed, or a Run key added for persistence. Finding a cluster of reg.exe write operations from the same host and user within a short window reveals the full scope of configuration changes and whether multiple objectives were pursued.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_add:
        CommandLine|contains|all:
        - reg
        - add
      selection_cli_reg_start:
        CommandLine|contains|all:
        - d 4
        - v Start
        CommandLine|contains:
        - \AppIDSvc
        - \MsMpSvc
        - \NisSrv
        - \SecurityHealthService
        - \Sense
        - \UsoSvc
        - \WdBoot
        - \WdFilter
        - \WdNisDrv
        - \WdNisSvc
        - \WinDefend
        - \wscsvc
        - \wuauserv
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_add:
        CommandLine|contains|all:
        - reg
        - add
      selection_cli_reg_start:
        CommandLine|contains|all:
        - d 4
        - v Start
        CommandLine|contains:
        - \AppIDSvc
        - \MsMpSvc
        - \NisSrv
        - \SecurityHealthService
        - \Sense
        - \UsoSvc
        - \WdBoot
        - \WdFilter
        - \WdNisDrv
        - \WdNisSvc
        - \WinDefend
        - \wscsvc
        - \wuauserv
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around the time of this alert?
  context: Tracking the user's activity across all hosts in the surrounding window reveals whether the defense tampering is isolated or part of activity touching multiple endpoints. If the same user triggered similar registry or service changes on other hosts, the scope of the operation is larger than a single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_add:
        CommandLine|contains|all:
        - reg
        - add
      selection_cli_reg_start:
        CommandLine|contains|all:
        - d 4
        - v Start
        CommandLine|contains:
        - \AppIDSvc
        - \MsMpSvc
        - \NisSrv
        - \SecurityHealthService
        - \Sense
        - \UsoSvc
        - \WdBoot
        - \WdFilter
        - \WdNisDrv
        - \WdNisSvc
        - \WinDefend
        - \wscsvc
        - \wuauserv
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Defense tampering is rarely the first step. Earlier detections on the same host — reconnaissance, privilege escalation, or credential access — may show the stages that preceded disabling protection and help reconstruct the timeline of how the operator reached the point of turning off security services.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: How often has this host fired this reg.exe service-disable pattern over the past 90 days, and what command-line structures are typical?
  context: A service-disable pattern with no prior history on a host is more suspicious than one seen repeatedly under stable automation. The query mirrors the rule's selection structure scoped to this host, so the count reflects this specific firing pattern rather than generic reg.exe usage. The command-line projection lets the analyst compare the typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_add:
        CommandLine|contains|all:
        - reg
        - add
      selection_cli_reg_start:
        CommandLine|contains|all:
        - d 4
        - v Start
        CommandLine|contains:
        - \AppIDSvc
        - \MsMpSvc
        - \NisSrv
        - \SecurityHealthService
        - \Sense
        - \UsoSvc
        - \WdBoot
        - \WdFilter
        - \WdNisDrv
        - \WdNisSvc
        - \WinDefend
        - \wscsvc
        - \wuauserv
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Have other hosts fired this service-disable pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific firing pattern rather than generic reg.exe usage. Many hosts firing the same pattern points to scripted deployment or a vendor maintenance action; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_reg_add:
        CommandLine|contains|all:
        - reg
        - add
      selection_cli_reg_start:
        CommandLine|contains|all:
        - d 4
        - v Start
        CommandLine|contains:
        - \AppIDSvc
        - \MsMpSvc
        - \NisSrv
        - \SecurityHealthService
        - \Sense
        - \UsoSvc
        - \WdBoot
        - \WdFilter
        - \WdNisDrv
        - \WdNisSvc
        - \WinDefend
        - \wscsvc
        - \wuauserv
      condition: all of selection_*
    fields:
    - host.name
- question: Was reg.exe executed from its expected system path?
  context: reg.exe normally runs from System32 or SysWOW64. A reg.exe running from a user-writable or temporary directory may indicate a copied or renamed binary used to evade path-based allowlists. Confirm the Image path and OriginalFileName for the alerting process to verify it is the genuine, in-place system binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other LOLBins used on this host recently that could support the same defense-evasion or persistence objective?
  context: Operators who disable defenses with reg.exe often pair it with other living-off-the-land binaries — for example sc.exe or schtasks.exe to stop or disable services and tasks, netsh to change the firewall, or download and proxy-execution binaries to stage further payloads once protection is off. Finding several such binaries used in the same timeframe strengthens the case for a deliberate operation rather than an isolated administrative change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\wmic.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\hh.exe'
          - '\ie4uinit.exe'
          - '\infdefaultinstall.exe'
          - '\installutil.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\diskshadow.exe'
          - '\dnscmd.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
