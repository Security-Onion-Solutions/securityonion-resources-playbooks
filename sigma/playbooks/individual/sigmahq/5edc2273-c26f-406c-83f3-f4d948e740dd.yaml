name: Indirect Inline Command Execution Via Bash.EXE
id: 90329d69-35d7-416f-9e66-09b88fa82b0a
description: |
  Detects the Windows Subsystem for Linux launcher bash.exe (from System32 or SysWOW64, or identified by OriginalFileName
  Bash.exe) invoked with the -c flag, which runs an arbitrary command string in a Linux shell. The rule fires only when both
  the interpreter selection AND the command-line selection match: an image or original filename matching bash.exe AND a
  command line containing ' -c '. Running commands indirectly through bash.exe breaks the expected Windows parent-child
  lineage and can proxy execution of Linux or Windows binaries past controls that key on the launching process. Legitimate
  developers and WSL users do run bash -c, so the investigation should decode the command string, confirm the parent and user
  are expected to use WSL, identify any child processes or network connections the command spawned, and determine whether the
  shell ran benign tooling or staged further execution.
type: detection
detection_id: 5edc2273-c26f-406c-83f3-f4d948e740dd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alert show bash.exe running with the -c flag, and what command string follows it?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both halves
    match together, a process whose Image ends in \Windows\System32\bash.exe or \Windows\SysWOW64\bash.exe (or whose
    OriginalFileName is Bash.exe) AND a command line containing ' -c '. Confirm both the interpreter and the -c flag are
    present in the actual event, and read the full command string passed to the shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run the Windows Subsystem for Linux shell?
  context: Legitimate developers and WSL users do run bash -c, but WSL is uncommon on general-purpose endpoints and servers.
    Knowing whether the user role and host function involve WSL or Linux tooling is often the fastest path to distinguishing
    routine development from an operator using bash.exe to proxy execution. Raise priority when the actor is a standard
    interactive user on a workstation rather than a known developer, server, or CI agent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the bash -c command string actually do? Decode the full command line and identify the shell command.
  context: The string passed after -c is the operator's payload run inside the Linux shell. Read the full command line and
    identify every action, file path, URL, IP address, or piped command. A bash -c invocation can proxy execution of Linux
    or Windows binaries, open a reverse shell (for example via socat or /dev/tcp), or exfiltrate data over a raw socket, none
    of which appear as a normal Windows child process of the launching application. Decode any base64 or chained encoding
    until the command is human-readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' -c '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned bash.exe, and is that parent chain expected?
  context: The parent process reveals how the shell was invoked. Interactive WSL use typically descends from explorer.exe or
    a terminal; service automation from services.exe. Parents like winword.exe, mshta.exe, wscript.exe, an Office application,
    or an archive tool indicate macro-driven or staged execution rather than a developer opening a shell. Walk up the tree to
    see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did bash.exe spawn, and do any launch shells or living-off-the-land binaries?
  context: The processes spawned by the shell reveal the command's actual impact. A benign shell session usually spawns
    nothing notable; indirect-execution abuse commonly spawns powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe,
    msiexec.exe, curl.exe, or bitsadmin.exe to proxy follow-on execution past controls that key on the original parent.
    Review the children and their command lines for staging or download activity.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did bash.exe open any outbound network connections around the time of the alert?
  context: A bash -c command can connect outbound directly from the shell or a child it spawns, for example a reverse shell
    or a raw-socket exfiltration channel, without producing a normal Windows download process. Outbound connections from
    bash.exe to external addresses, unusual ports, or destinations outside known-good egress networks point to remote access
    or data movement rather than local development. Correlate the destination and port against expected WSL automation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was the SSH client configuration on this host created or modified before the alert?
  context: A common precursor to indirect execution through SSH or WSL is modifying the SSH client config to persist a
    LocalCommand or ProxyCommand that runs automatically on connect. Writes to a config file under a user's .ssh directory in
    the hours before the shell ran indicate the indirection was staged rather than ad hoc. Review the writing process and the
    config contents for an embedded command.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: \.ssh\config
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Does this host normally run bash.exe?
  context: A WSL shell that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low
    historical counts indicate first-time or rare execution, which on a non-developer endpoint raises the priority of the
    command-decode result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimate WSL usage can be abused. The query mirrors the rule's selection structure scoped to this host, so
    the resulting parent and user distribution reflects how this specific bash.exe -c firing pattern has historically run
    here, not generic shell usage. A new parent process, an unexpected user account, or an unusual command structure is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      selection_cli:
        CommandLine|contains: ' -c '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      selection_cli:
        CommandLine|contains: ' -c '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      selection_cli:
        CommandLine|contains: ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      selection_cli:
        CommandLine|contains: ' -c '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this
    bash.exe -c firing pattern, not generic shell usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent
    consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - :\Windows\System32\bash.exe
        - :\Windows\SysWOW64\bash.exe
      - OriginalFileName: Bash.exe
      selection_cli:
        CommandLine|contains: ' -c '
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or
    credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns:
    tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
