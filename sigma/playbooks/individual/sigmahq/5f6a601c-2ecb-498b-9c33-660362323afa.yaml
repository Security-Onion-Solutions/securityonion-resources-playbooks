name: Root Certificate Installed From Susp Locations
id: 2ee706c4-89f8-4f6c-9635-f588466d8304
description: |
  Detects a PowerShell Import-Certificate command that installs a certificate into the
  machine-wide root store (Cert:\LocalMachine\Root) using a -FilePath that points to a
  user-writable or transient directory — AppData\Local\Temp, Windows\TEMP, Desktop,
  Downloads, Perflogs, or Users\Public. The rule fires when the command line contains
  all three of Import-Certificate, ' -FilePath ', and Cert:\LocalMachine\Root AND
  references one of those suspicious source directories. Adding a certificate to the
  machine Root store grants it system-wide trust and requires administrative rights;
  legitimate enterprise CAs are deployed from managed locations via Group Policy, not
  staged in a temp or Downloads folder. The investigation should confirm the exact
  command and source file, identify the certificate being installed, and determine
  whether the install was an administrative action or an operator subverting trust to
  enable TLS interception or signed-payload acceptance.
type: detection
detection_id: 5f6a601c-2ecb-498b-9c33-660362323afa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the rule — an Import-Certificate -FilePath into Cert:\LocalMachine\Root sourced from a temp, Downloads, Desktop, Public, or Perflogs directory?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule requires all three of Import-Certificate, the -FilePath switch, and the
    Cert:\LocalMachine\Root store target on the same command line, plus a source path under
    a user-writable or transient directory. Read the full command line and verify each part
    is present and that the source file genuinely lives in one of those locations rather
    than a managed deployment path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to install root certificates?
  context: Installing a certificate into the machine root store is an administrative action
    normally performed by IT through managed deployment, not by individual users staging a
    file in a temp or Downloads folder. Knowing whether the account is a local admin and
    whether the host's function involves certificate management is often the fastest way to
    separate a sanctioned install from a trust-subversion attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What certificate is being installed, and what is the full source path and store target on the command line?
  context: The full command line names the certificate file and the store it is written to.
    Decode the -FilePath argument to recover the source file (.cer, .p7b, or .sst) and its
    directory, and confirm the store is Cert:\LocalMachine\Root rather than a per-user or
    My store. Note that Import-Certificate adds the certificate without the warning prompt
    the certificate snap-in shows, so a successful install may have left no interactive
    trace. Multiple Import-Certificate invocations on this host in the window may install a
    chain rather than a single cert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'Import-Certificate'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is in the certificate file being imported — issuer, subject, validity, and whether it spoofs a known CA?
  context: Read the actual certificate referenced by -FilePath. Inspect the issuer and
    subject names, key usage, validity dates, and thumbprint. A root certificate whose
    issuer impersonates a well-known CA or vendor, has an unusually long validity, or
    chains to an unknown self-signed authority is the artifact of trust subversion. A
    certificate installed into the machine root store can be used to forge trusted TLS
    certificates, accept man-in-the-middle traffic, or make signed payloads appear valid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the hash or thumbprint of the imported certificate, and is it a known-bad root CA?
  context: A certificate file is data that PowerShell reads, not something it runs, so no hash is recorded
    for it, and the -FilePath value is not a queryable field. Retrieve the certificate from the source
    path shown on the command line (see the command-decode and evidence-preservation steps) and hash it --
    or read its SHA1 thumbprint, issuer, and subject -- then check it against known-malicious root-CA and
    threat-intel lists; a root certificate added to LocalMachine\Root is high impact because it makes
    adversary TLS trusted on the host. This query surfaces any certificate file this process tree wrote,
    in case the same session staged it just before importing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the referenced certificate file still on disk for analysis?
  context: The rule keys on a -FilePath pointing to a source certificate in a user-writable
    or transient directory. Checking whether that file still exists enables deeper analysis
    — hash lookup, inspection of the certificate's issuer and subject, and confirmation of
    what was added to the trust store. Files staged in Temp or Downloads are often deleted
    after use, so capture them quickly.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a new certificate written into the machine root certificate store in the registry around the time of the alert?
  context: Installing a certificate into Cert:\LocalMachine\Root persists it under the
    SystemCertificates\Root\Certificates registry path, keyed by the certificate
    thumbprint. A registry-set event records the store write directly, independent of which
    process performed it, and catches installs done through the .NET X509Store API or
    certutil rather than the PowerShell cmdlet. A new entry under the machine Root or
    TrustedPublisher store — the two stores that grant trust system-wide — confirms the
    certificate took effect and gives the thumbprint to cross-reference.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SystemCertificates\Root\Certificates\'
          - '\SystemCertificates\TrustedPublisher\Certificates\'
          - '\Microsoft\SystemCertificates\Root\'
      condition: selection
    fields:
      - TargetObject
      - Image
- question: What process spawned the PowerShell that ran Import-Certificate, and is that parent chain expected?
  context: The parent process reveals how the certificate install was invoked. An
    interactive administrator running PowerShell from explorer.exe or a console is different
    from PowerShell spawned by a script host, an Office application, a remote-execution
    service, or a downloaded loader. An unexpected parent points to the install being part
    of an automated or hands-on-keyboard operation rather than routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even legitimate certificate management leaves a footprint. The query mirrors the
    rule's exact selection — Import-Certificate into Cert:\LocalMachine\Root from a
    suspicious source directory — scoped to this host, so the parent/user distribution
    reflects how this specific firing pattern has run here before. A new parent process, an
    unexpected user account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Import-Certificate
        - ' -FilePath '
        - Cert:\LocalMachine\Root
        CommandLine|contains:
        - \AppData\Local\Temp\
        - :\Windows\TEMP\
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - :\Users\Public\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this exact firing pattern rather than generic PowerShell usage. Many
    hosts installing root certificates from suspicious source directories points to a
    scripted deployment or a configuration-management push that should be confirmed with the
    owning team; one host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Import-Certificate
        - ' -FilePath '
        - Cert:\LocalMachine\Root
        CommandLine|contains:
        - \AppData\Local\Temp\
        - :\Windows\TEMP\
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - :\Users\Public\
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Import-Certificate
        - ' -FilePath '
        - Cert:\LocalMachine\Root
        CommandLine|contains:
        - \AppData\Local\Temp\
        - :\Windows\TEMP\
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - :\Users\Public\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Import-Certificate
        - ' -FilePath '
        - Cert:\LocalMachine\Root
        CommandLine|contains:
        - \AppData\Local\Temp\
        - :\Windows\TEMP\
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - :\Users\Public\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the environment around this time?
  context: Tracking the account's activity across all hosts in the surrounding window reveals
    lateral movement or coordinated activity on multiple endpoints. If the same user
    installed certificates or ran related commands elsewhere, the scope is larger than this
    one host. Trust subversion on multiple endpoints points to a deliberate effort to
    establish broad interception or signed-payload acceptance.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - Import-Certificate
        - ' -FilePath '
        - Cert:\LocalMachine\Root
        CommandLine|contains:
        - \AppData\Local\Temp\
        - :\Windows\TEMP\
        - \Desktop\
        - \Downloads\
        - \Perflogs\
        - :\Users\Public\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Surveying activity around the alert reveals what
    led to the certificate install and what followed — reconnaissance, credential access, or
    further configuration changes. Aggregating by process and parent collapses repetitive
    agent telemetry into high-count rows while novel parent-child pairs stand out at low
    counts, which is what the analyst is scanning for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the attack stages that
    preceded the certificate install and help reconstruct the timeline. Trust subversion is
    typically a setup step for later command-and-control or payload acceptance, so prior
    alerts give the broader picture.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
