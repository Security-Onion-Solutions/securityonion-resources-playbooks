name: UAC Bypass Using Windows Media Player - Registry
id: 0fdf8480-ad00-432b-8a0c-d142588ddc27
description: |
  Detects a write to the Application Compatibility Assistant Store under AppCompatFlags for osk.exe located in the Windows Media Player directory, and a binary value being set there — a registry manipulation used to trigger a User Account Control bypass. The technique configures a compatibility entry so that an auto-elevated system binary runs an attacker-chosen action at high integrity without a consent prompt; legitimate software rarely writes compatibility-store entries for a system accessibility binary. Investigation should confirm the exact key and value, identify the process that wrote it and its parent chain, and determine what executed at elevated integrity afterward.
type: detection
detection_id: 5f9db380-ea57-4d1e-beab-8a2d33397e93
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a binary value written to the Application Compatibility Assistant Store key for osk.exe under the Windows Media Player path?
  context: >-
    The rule fires when a value is written to the Application Compatibility Assistant Store key for osk.exe under the Windows Media Player path (TargetObject) and the value data is binary (Details). Confirm the exact key path and that a binary value was written before investing further; this compatibility-store location is not a routine write target for interactive users or normal software updates.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify application-compatibility settings for a system accessibility binary?
  context: >-
    Legitimate administrative or software-maintenance activity can touch application-compatibility settings, but routine workstation use rarely writes a compatibility entry for a system accessibility binary such as osk.exe. Knowing whether the account role and host function fit that activity is often the fastest way to separate a true positive from sanctioned maintenance. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exactly was written under the Application Compatibility Assistant Store, and is this a legitimate compatibility entry or an auto-elevation manipulation?
  context: >-
    The AppCompatFlags Compatibility Assistant Store records per-application compatibility data; writing an entry that ties a system accessibility binary (osk.exe) to a Windows Media Player path is a manipulation used to make an auto-elevated process run under a chosen compatibility context. Read the exact key path and the writing process here, and confirm whether this compatibility entry corresponds to any installed application. The specific value data and target binary determine what executes when the auto-elevated path is invoked.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Has this compatibility-store key been modified on this host before, and with what value?
  context: >-
    A first-time write to this compatibility-store key is more suspicious than a value that changes as part of routine software behavior. Compare the historical value data on this host: a key that has never been touched, or one whose entry suddenly ties a system binary to a non-default path, stands out. Zero history indicates the key has not been modified before this event. Because value deletion is not observable in this telemetry, judge whether the entry was reverted from its later re-modification history rather than from a delete event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who set one registry key for a bypass often make several changes together — a second auto-elevation key, a security-policy change, or a persistence entry. Clusters of registry writes from the same process within a short window reveal the full scope of the configuration change. The triggering key appears in the results; the signal is what else was modified. If the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Were other known UAC-bypass registry keys manipulated on this host around this time?
  context: >-
    Many auto-elevation bypasses work by writing a command into a registry key that an auto-elevated process reads and runs — common targets include ms-settings Shell open command, mscfile shell open command, the exefile and Folder shell handlers, and HKCU Environment. A script host (reg, powershell, cmd) touching these keys near the compatibility-store write indicates the actor cycled through multiple elevation methods. This complements the compatibility-store manipulation, which may itself be written by a compiled tool rather than a command-line utility.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process spawned the process that wrote this key, and is that parent chain expected?
  context: >-
    The writing process is the immediate actor; tracing its own parent shows whether the chain is legitimate — an administrative tool launched by the user or a management agent — or suspicious, such as a script host or a document handler spawning the process that set the compatibility entry. A non-elevated process arranging an auto-elevation path is the parent-child anomaly this technique produces. If the parent process identifier resolves to NODATA on the registry event, fall back to the writing process name and host within a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has the process that wrote this registry value run on this host before?
  context: >-
    A writing process that has never been seen on this host is more suspicious than one that runs regularly as part of installed software. Zero or very low historical counts indicate a first-time or rare execution of the tool that set the compatibility entry, which raises the weight of the alert. The aggregation groups by user because command lines are too variable for meaningful comparison over this window.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What ran at high integrity on this host shortly after the compatibility-store write?
  context: >-
    A UAC bypass is a means to an end: the payoff is a process running at high or system integrity that performs an action requiring elevation — installing persistence, dumping credentials, disabling security tooling, or reaching protected resources. Examine high-integrity processes launched shortly after the write. Auto-elevating front-ends frequently abused for this include sdclt.exe, eventvwr.exe, and computerdefaults.exe; a high-integrity child of one of these near the write time is the elevation payoff. Correlate within a short window (tens of seconds to a few minutes) to keep benign administrative elevation out of the result.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Did osk.exe execute on this host after the compatibility-store write?
  context: >-
    The compatibility entry takes effect when the targeted accessibility binary is launched through an auto-elevated path. Look for osk.exe executing on this host in the hours after the write; a launch confirms the configured compatibility context was exercised and the elevated action likely ran. Absence means the manipulation is staged but has not yet been triggered.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\osk.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did an auto-elevated process load osksupport.dll, and is that DLL signed?
  context: >-
    The osk.exe accessibility binary loads osksupport.dll at startup; a UAC bypass of this form causes an auto-elevated process to load a hijacked or unexpected copy of that DLL, running attacker code at high integrity. Examine load events for osksupport.dll on this host and check the signing status and signer of the loaded module. An unsigned or unexpectedly-signed osksupport.dll loaded from a non-default path is the code-execution payoff. DLL load events carry a signature and hash directly, so no execution pivot is needed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains: '\osksupport.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Was this same compatibility-store key modified on other hosts in the environment?
  context: >-
    The same registry modification across multiple hosts may indicate a management push or widespread tooling; a single-host write is more consistent with a targeted bypass. Compare the value data across hosts — the same entry everywhere points to managed software, while a lone host with this compatibility manipulation points to hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A bypass rarely lands in isolation. Aggregating process activity around the write surfaces what led to it and what followed — a download or dropper, reconnaissance, or additional elevation attempts. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other privilege-escalation or bypass detections fire on this host?
  context: >-
    Actors who attempt one UAC bypass often try several methods until one succeeds, especially when the operating-system version blocks certain techniques. Other privilege-escalation or defense-tampering detections on this host in a window around the alert confirm deliberate escalation activity rather than an isolated false positive, and help order the stages into a timeline.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Was there authorized administrative activity or a change record that explains this compatibility-store write?
  context: >-
    Software deployment and sanctioned maintenance can occasionally touch application-compatibility settings. A matching change ticket, deployment record, or administrator confirmation suggests authorized activity; the absence of one for a write that targets a system accessibility binary points toward an unauthorized bypass attempt. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
