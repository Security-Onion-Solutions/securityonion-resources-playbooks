name: Execute Pcwrun.EXE To Leverage Follina
id: c0696f68-2941-438c-8a5b-a59059303f0b
description: |
  Detects the Program Compatibility Assistant binary pcwrun.exe invoked with a path-traversal argument (a command
  line containing ../), an indirect-execution trick that makes pcwrun.exe hand off to msdt.exe and trigger the Follina
  vulnerability (CVE-2022-30190). The rule fires when Image ends in pcwrun.exe AND the command line contains ../ — both
  conditions must hold together. pcwrun.exe is a Microsoft-signed system binary, so this is a proxy-execution pattern:
  a trusted binary is used to launch an attacker-controlled payload that descends through msdt.exe. The investigation
  should decode where the traversal points, confirm what msdt.exe and any downstream processes did, and determine
  whether the parent chain and user are consistent with legitimate compatibility-troubleshooting activity.
type: detection
detection_id: 6004abd0-afa4-4557-ba90-49d172e0a299
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with pcwrun.exe invoked and a ../ path-traversal sequence in the arguments?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both conditions hold together, an Image ending in pcwrun.exe AND a command line that contains ../. Confirm both halves are present and read the full argument string, since the traversal sequence is what redirects pcwrun.exe into the Follina handoff.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run the Program Compatibility Assistant with traversal-style arguments?
  context: pcwrun.exe is the Program Compatibility Assistant launcher and is normally driven interactively by a user troubleshooting an application, not with ../ traversal arguments. Knowing whether the user role and host function involve hands-on compatibility troubleshooting is often the fastest path to distinguishing a genuine support action from an indirect-execution attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the pcwrun.exe command line. Where does the ../ traversal point, and what payload or answer file does it resolve to?
  context: The full command line reveals the specific action taken. Reconstruct the path that the ../ traversal sequence resolves to relative to the working directory, since this is the file pcwrun.exe hands to msdt.exe as a diagnostic answer file. Identify whether it points to a local payload, a UNC share, or a fetched file, and note any executable name embedded in the traversal expression.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '../'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned pcwrun.exe, and is that parent chain expected?
  context: The parent process reveals how pcwrun.exe was invoked. Legitimate compatibility troubleshooting typically descends from explorer.exe or a user shell. Parents like winword.exe, outlook.exe, mshta.exe, wscript.exe, or an archive or browser process point to document-driven or staged execution rather than an interactive support session. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did pcwrun.exe spawn afterward, and did msdt.exe or any shell or living-off-the-land binary appear?
  context: The processes spawned after pcwrun.exe reveal the actual impact of the proxy execution. The Follina chain runs msdt.exe with a diagnostics answer file, which in turn can launch cmd.exe, powershell.exe, certutil.exe, or another signed binary to proxy the real payload. A benign compatibility action spawns the troubleshooting UI and stops there; downstream shells or trusted binaries executing attacker content are the impact worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did msdt.exe or any process on this host retrieve content over the network around the time of the alert?
  context: System binary proxy execution often pulls an externally hosted payload before running it, and the Follina chain can fetch a remote answer file or follow-on stage through msdt.exe or a spawned downloader. An outbound connection to a file server, an internal host, or an external address corroborates remote payload retrieval and gives a destination to scope. Compare any contacted destination against known-good enterprise domains to separate legitimate diagnostics telemetry from payload retrieval.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What modules were loaded by msdt.exe or the binaries in the spawned chain on this host around the alert?
  context: Proxy execution frequently delivers its payload as a DLL or a module entrypoint loaded into a trusted process rather than as a standalone executable. Reviewing the modules loaded by msdt.exe and any downstream binaries can surface an unsigned or unusually located DLL pulled in during the Follina chain, which points to the actual payload even when the command line only references an answer file.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Does this host normally run pcwrun.exe?
  context: pcwrun.exe is launched only when someone runs the Program Compatibility Assistant, so it is uncommon on most endpoints and rare on servers. Zero or very low historical counts indicate first-time or rare execution, which raises the priority of the decode result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a signed system binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific pcwrun.exe traversal pattern has historically run here, not generic pcwrun.exe usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcwrun.exe
        CommandLine|contains: ../
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this pcwrun.exe traversal firing pattern, not generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcwrun.exe
        CommandLine|contains: ../
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcwrun.exe
        CommandLine|contains: ../
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcwrun.exe
        CommandLine|contains: ../
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \pcwrun.exe
        CommandLine|contains: ../
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
