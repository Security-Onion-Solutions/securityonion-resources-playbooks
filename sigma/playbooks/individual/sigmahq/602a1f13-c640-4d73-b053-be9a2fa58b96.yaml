name: HackTool - Powerup Write Hijack DLL
id: f81c04a6-3216-4464-a2aa-0373f88dffbd
description: |
  Detects a PowerShell process (powershell.exe or pwsh.exe) writing a .bat file, the on-disk signature of the PowerUp Write-HijackDll privilege-escalation function. That function builds a small self-deleting batch file (debug.bat by default) that either runs an attacker-supplied command or creates and adds a local account to the Administrators group, then patches the path to that batch file into a pre-compiled DLL designed to be loaded through a service's DLL search-order weakness. The alert fires on the batch-file write; the elevated payload runs later, when the vulnerable service loads the planted DLL. Because any PowerShell script that legitimately generates a .bat file also matches, the investigation should read what the batch file does, confirm whether a DLL was planted and loaded, determine whether a local account was created or a service configuration changed, and establish whether the writing process and user fit expected activity on this host. The batch file is designed to delete itself, so treat an early deletion as expected behavior of the technique rather than as evidence the alert is benign.
type: detection
detection_id: 602a1f13-c640-4d73-b053-be9a2fa58b96
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did a PowerShell process write a .bat file on this host, and what is that file's path?
  context: >-
    The rule fires when a process ending in powershell.exe or pwsh.exe writes a file whose name ends in .bat — both conditions must hold together. Confirm the writing process is PowerShell and read the exact path and name of the batch file it created; the default PowerUp artifact is debug.bat, but the name is attacker-controlled. Note the operation type: a creation immediately followed by a deletion of the same file is the self-deleting behavior this technique uses, not a sign the alert is spurious.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run PowerShell scripts that generate batch files?
  context: >-
    Some administrative and build automation legitimately has PowerShell emit .bat files, so the account and host role matter. A developer workstation or a build server generating batch files fits; a general user endpoint or a server with no scripting role producing a batch file from an interactive PowerShell session does not. User attribution is present on roughly 94% of endpoint file events; when the account is a machine account or SYSTEM, judge the activity by the writing process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this activity part of an authorized penetration test or red team engagement?
  context: >-
    Privilege-escalation tooling such as PowerUp is used in authorized security assessments. Before deeper analysis, check whether a penetration test or red team exercise is active on this host or network segment. An authorized engagement whose scope and timing match this activity resolves the alert without further work; the absence of one keeps it live.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did the PowerShell command that wrote the batch file actually do, and was it encoded or obfuscated?
  context: >-
    The writing process is PowerShell, so its command line records how the batch file was produced. Read the full command from the alerting process: PowerUp's Write-HijackDll is a PowerShell function, and the invocation may name the output DLL path, an account and group to create, or a custom command to embed in the batch file. Decode any -EncodedCommand or -enc base64, and unwind concatenation, backtick escaping, and variable substitution to recover the real intent behind the batch-file write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is inside the batch file, and what command or account change does it carry out?
  context: >-
    The batch file is the staged payload. PowerUp's default Write-HijackDll builds a self-deleting batch file that runs a supplied command or creates a local user and adds it to a local group — the built-in default adds an account to the Administrators group. Retrieve and read the file's content: look for a net user / net localgroup account-creation sequence, an embedded command, or download and execution logic. The content determines what will run with elevated privilege once the planted DLL is loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the batch file still on disk, or was it deleted after it was written?
  context: >-
    This technique's batch file is built to delete itself after use, so its post-alert lifecycle is diagnostic rather than exculpatory. A file still present can be retrieved, read, and hashed; a creation followed within seconds by a deletion of the same path is the self-deleting dropper behavior and shifts the focus to what executed in between and to the DLL that was planted alongside it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was an unsigned or untrusted DLL loaded on this host around the time of the batch-file write?
  context: >-
    The batch file is only half of this technique; the other half is a patched DLL placed where a vulnerable service loads it through DLL search-order weakness. That planted DLL is typically unsigned or carries a signature that does not validate. Loaded DLLs record their hash and signing state on the load event, so surfacing unsigned or invalid-signature loads on this host in the surrounding window can expose the hijack module. Take its hash to a reputation source, and note the loading process — a load into a service host points at the search-order abuse this function sets up.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_unsigned:
        Signed: 'false'
      condition: selection and selection_unsigned
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Were any service DLL or image-path registry values modified on this host in the same window?
  context: >-
    Hijack execution flow also has a registry-based form: pointing a service's ServiceDll or ImagePath value at attacker-controlled code so the service loads it at start. Even though this alert fired on a file write, a service-configuration change on the same host in the surrounding window would indicate the escalation was set up through the registry as well. Read which service was altered and what path its value now points to.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\'
      selection_val:
        TargetObject|endswith:
          - '\ServiceDll'
          - '\ImagePath'
      condition: selection and selection_val
    fields:
      - TargetObject
      - Details
      - Image
- question: What process started the PowerShell that wrote the batch file?
  context: >-
    The parent of the PowerShell process shows how this ran. An interactive shell launched from explorer.exe is one story; PowerShell spawned by an Office application, a script host such as wscript or mshta, a remote-execution service, or a process in a temporary directory is another. If the parent process identifier resolves to NODATA on this alert, fall back to the PowerShell process name and host with a short time window around the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What processes did this PowerShell process spawn afterward?
  context: >-
    The payload PowerUp stages frequently creates a local account and adds it to a privileged group. Children of the PowerShell process in the hours after the write reveal that follow-on activity — net.exe or net1.exe adding a user, cmd.exe running the batch file, or other post-escalation execution. A quiet result means the staged payload has not yet run through the service load; account-creation or command execution here means it has.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did this process write or delete around the time of the alert?
  context: >-
    Write-HijackDll writes more than the batch file: it also writes the patched, architecture-specific DLL to the output path it was given. Enumerating every file this process and its direct children touched in the surrounding window exposes that DLL and any other staged components, and shows where they landed. The paths and extensions distinguish a single scripted batch-file write from a full escalation kit being staged.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were PowerShell security controls bypassed or weakened before this write?
  context: >-
    Operators often disable or weaken PowerShell protections before staging a payload. Look in the hour before this event for an execution-policy bypass, an in-memory AMSI bypass, real-time protection being turned off, or a downgrade to an older PowerShell version that lacks logging. These precursors on the same host strengthen the case that the batch-file write is part of an escalation attempt rather than routine scripting.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- always_include: true
  question: Has this user previously produced this batch-file-write pattern, and does that history fit their role?
  context: >-
    This measures how often the alerting account has produced the rule's exact pattern — PowerShell writing a .bat file — over the past three months, grouped by host. A user who routinely generates batch files through scripting is a different picture from one who has never done so before. Weigh the count against the account's role and expected toolset rather than against generic PowerShell use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .bat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the batch-file-write pattern, or is the launch mechanism new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior, so the meaningful pivot is the launch mechanism. This counts how often the alerting program has driven the same PowerShell-writes-a-.bat pattern over the past three months, grouped by host. A program that already accounts for many prior events is automation; a new or rare program for this pattern is the deviation worth chasing. Emit this alongside the user-history view — they answer different questions and neither replaces the other.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .bat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding window reveals whether this batch-file write is isolated or part of movement across multiple endpoints. The same account staging similar activity on several hosts widens the potential scope. When the alert fires under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this user-pivot returns unbounded service-telemetry volume and the parent-driven view is the one to trust.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what the user did across the environment returns service-telemetry noise, so the meaningful question is whether the same launch mechanism fired elsewhere. This counts the same PowerShell-writes-a-.bat pattern scoped to the alerting program across all hosts in the alert window. Several hosts in the same window points to a pushed or scheduled automation rollout; a single host points to a host-local trigger. Emit this alongside the user-pivot view — the pair is not deduplicable.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .bat
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host has previously produced this batch-file-write pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even routine scripting can match this rule, so the useful comparison is against the host's
    own history of the same pattern. This mirrors the rule's selection scoped to this host and
    returns the program and user distribution of prior PowerShell-writes-a-.bat events here. A
    new acting program process, an unfamiliar account, or a first-ever occurrence is the anomaly
    to pursue; a pattern that matches an established build or automation profile lowers the
    concern.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \pwsh.exe
        TargetFilename|endswith: .bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, reconnaissance, a PowerShell security-control bypass, or credential access — may reveal the stages that preceded this escalation attempt and place it in a timeline. A batch-file write following an earlier execution or tampering alert reads very differently from one with no prior activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
