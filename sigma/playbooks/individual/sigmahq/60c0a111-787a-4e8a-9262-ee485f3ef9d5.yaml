name: Suspicious Word Cab File Write CVE-2021-40444
id: 7981f7ae-a011-4f14-894c-990747176a10
description: |
  Detects winword.exe writing files that match the pattern left by exploitation of CVE-2021-40444: EITHER a .cab file under \Windows\INetCache OR a file whose path contains \AppData\Local\Temp\ and ends in .inf, excluding the benign Content.inf that Office writes to Temp during normal operation. In this vulnerability a crafted document causes Word to fetch remote markup that pulls down a .cab archive; a path-traversal entry drops a .inf and payload into a predictable location that is then executed to run attacker code. Routine Word use does not write .cab archives into the browser cache or arbitrary .inf files into Temp, so a match should be investigated by identifying the document Word opened, inspecting the written files, and determining whether a payload was extracted and executed. Note which branch fired: the .cab-in-cache write and the .inf-in-Temp write are two observable stages of the same chain and steer the downstream content and execution checks.
type: detection
detection_id: 60c0a111-787a-4e8a-9262-ee485f3ef9d5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did winword.exe write EITHER a .cab file under the browser cache OR a .inf file under a Temp directory, and which branch fired?
  context: >-
    The rule fires when winword.exe writes EITHER a .cab file under \Windows\INetCache OR a file whose path contains \AppData\Local\Temp\ and ends in .inf, and it excludes the benign Content.inf that Office writes to Temp during normal operation. Confirm the exact path and extension against these criteria and note which branch matched: the .cab-in-cache write and the .inf-in-Temp write are two observable stages of the same exploitation chain and steer the downstream content and payload-execution checks.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to open documents that make Word write into the browser cache or Temp?
  context: >-
    Routine Word use edits and saves documents in user folders; it does not write .cab archives into the browser cache or drop .inf files into Temp. Knowing whether this account and host routinely open external or emailed documents helps separate a delivered exploit from unusual but benign activity. User attribution is present on most endpoint file events; when it resolves to a machine account (HOST$) or SYSTEM, judge by the host role and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the written .cab or .inf still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A .cab or .inf still on disk can be retrieved and unpacked for analysis; a file removed seconds after creation points to a self-cleaning dropper and shifts the focus to what executed in between. Interpret the operation type on each subsequent event for this path.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which document did winword.exe open when it wrote these files?
  context: >-
    The command line of the Word process names the document it opened, and for a web- or email-delivered file it may show a full path in a download or cache folder. Identifying that document is the pivot to the delivery vector and lets the analyst retrieve the original for inspection. In CVE-2021-40444, opening a crafted document is what triggers the remote-markup fetch that writes the .cab and .inf.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What are the contents of the .cab and .inf files that winword.exe wrote?
  context: >-
    The .cab is an archive and the .inf is a setup script; together they carry and direct the payload in this exploitation pattern. Retrieve both from disk and inspect them for an embedded DLL or executable, a path-traversal entry that places a file outside the extraction directory, and any command the .inf runs. Content retrieval is a manual step from the endpoint or a controlled environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did any process execute from the browser cache or Temp drop locations, and what is its hash and reputation?
  context: >-
    The payload delivered through this chain runs from the same cache and Temp locations the files were written to, and its hash is recorded when it executes rather than when it is written. Review executions from those directories around the alert, take the hash of any unfamiliar one, and submit it to threat intelligence to judge whether it is known malicious. Legitimate installers also run from Temp, so weigh timing against the Word file write.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - '\Windows\INetCache\'
          - '\AppData\Local\Temp\'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process launched winword.exe, and is that parent chain expected?
  context: >-
    The parent of the Word process shows how the document reached the user — an email client, a browser, or a manual open from the shell. A parent that is a mail or messaging client, or an unexpected automation, is consistent with a delivered attachment or download, while an interactive shell open is more routine. Trace the parent's own parent to see the full launch chain.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did winword.exe spawn after writing these files?
  context: >-
    In this exploitation pattern the document causes Word to launch follow-on execution — commonly a control-panel or library-loading utility that runs the extracted payload. Processes spawned by the alerting Word instance in the hours after the write reveal whether code execution followed the file drop. An absence of children suggests the write occurred without the chain completing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did winword.exe write or delete around the time of the alert?
  context: >-
    A process staging an exploit often touches several files in quick succession — the archive, the extracted script, and the payload it unpacks. The breadth and locations of the Word process's other file activity distinguish a single write from an active extraction and enumerate what else needs to be retrieved and reviewed.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the browser cache and Temp directories on this host recently, and by which processes?
  context: >-
    These locations have a limited set of processes that legitimately write to them; Word writing a .cab into the browser cache is outside that set. Other recent arrivals in the same directories, grouped by writing process, show whether this is an isolated drop or part of ongoing activity and surface related artifacts. The Temp path is high-volume by nature, so focus on writes by Word and by unfamiliar processes.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\Windows\INetCache\'
          - '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Exploitation rarely lands in isolation. Aggregating process activity around the alert surfaces what preceded the document open and what followed the payload drop — reconnaissance, additional execution, or persistence. Repetitive agent and operating-system telemetry collapses into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, script execution, or defense tampering — may mark the stages that preceded this write and help reconstruct the timeline. A Word file-write following an earlier alert reads differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user produced this file-write pattern before, and does that history fit their role?
  context: >-
    The query counts this user's prior occurrences of the rule's exact firing pattern over 90 days, grouped by host, rather than generic Word usage. A user who has never produced this pattern is more notable than one who does so regularly; weigh the count against the role and typical document sources for that account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_cab:
        Image|endswith: \winword.exe
        TargetFilename|contains: \Windows\INetCache
        TargetFilename|endswith: .cab
      selection_inf:
        Image|endswith: \winword.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - '.inf'
      filter_main_legit:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: AppData\Local\Temp
        TargetFilename|endswith: \Content.inf
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the program that launched Word historically driven this file-write pattern, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior; the launching process is the meaningful pivot. This counts the 90-day history of the alerting program driving this specific pattern, grouped by host. A new or rare program for this pattern is the deviation worth chasing; a program already responsible for many prior events is routine automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_cab:
        Image|endswith: \winword.exe
        TargetFilename|contains: \Windows\INetCache
        TargetFilename|endswith: .cab
      selection_inf:
        Image|endswith: \winword.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - '.inf'
      filter_main_legit:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: AppData\Local\Temp
        TargetFilename|endswith: \Content.inf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the same user shows related activity elsewhere, which would widen the scope beyond this endpoint. This is the immediate cross-host view, distinct from the longer-term history of the rule's pattern.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven file-write pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, cross-user activity returns agent-telemetry noise; the meaningful question is whether the same launch mechanism produced this pattern elsewhere in the alert window. Several hosts in the same window points to pushed or scheduled automation, while a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_cab:
        Image|endswith: \winword.exe
        TargetFilename|contains: \Windows\INetCache
        TargetFilename|endswith: .cab
      selection_inf:
        Image|endswith: \winword.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - '.inf'
      filter_main_legit:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: AppData\Local\Temp
        TargetFilename|endswith: \Content.inf
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts produced this file-write pattern in the past week, and does the distribution look like multi-host delivery or isolated activity?
  context: >-
    The query counts the rule's exact firing pattern fleet-wide with no host scope, giving the number of hosts where Word wrote these files rather than generic Word usage. Multiple unrelated hosts producing the pattern in a short span points to delivery reaching several users; a single host or a small related set points to a targeted or isolated open.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_cab:
        Image|endswith: \winword.exe
        TargetFilename|contains: \Windows\INetCache
        TargetFilename|endswith: .cab
      selection_inf:
        Image|endswith: \winword.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - '.inf'
      filter_main_legit:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: AppData\Local\Temp
        TargetFilename|endswith: \Content.inf
      condition: 1 of selection_* and not 1 of filter_main_*
    fields:
    - host.name
