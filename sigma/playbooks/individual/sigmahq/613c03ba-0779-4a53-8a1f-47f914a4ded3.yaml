name: DNS Query To MEGA Hosting Website
id: fd44c5df-6f42-43da-a8ee-fbb039d6fe31
description: |
  Detects a DNS query for userstorage.mega.co.nz, the subdomain the MEGA cloud storage service uses for file uploads and account storage. Software and browsers legitimately reach MEGA, so a lookup on its own is not conclusive; the same lookup also appears when a process stages local files and uploads them to attacker-controlled cloud storage as an exfiltration channel. The investigation should determine which process performed the lookup, whether the host then connected and transferred data, what local files that process read or wrote, and whether the account and host are expected to use consumer cloud storage at all.
type: detection
detection_id: 613c03ba-0779-4a53-8a1f-47f914a4ded3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the queried domain match what this rule detects, and which process performed the lookup?
  context: >-
    Confirm the alert by reviewing the exact QueryName against the MEGA upload subdomain the rule matches, and identify the querying process (Image). Check whether the lookup resolved to an address; a DNS query is only a name resolution and does not by itself prove the host connected or transferred any data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user and host expected to use consumer cloud storage such as MEGA?
  context: >-
    Sanctioned business file sharing usually runs through approved corporate services, not consumer cloud storage. Knowing whether this account and host have a legitimate reason to reach MEGA is often the fastest way to separate routine use from an exfiltration attempt. If the user resolves to a machine account or SYSTEM, pivot on the querying process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact MEGA subdomain was queried, did it resolve, and is the querying process one you expect to reach cloud storage?
  context: >-
    The alert is a DNS lookup, not a transfer. Review the full QueryName and confirm it is the MEGA upload endpoint, check whether it resolved to an address (dns.resolved_ip), and note the querying process. A browser or a sanctioned sync client is very different from a scripting host, an archiver, or a command-line transfer tool making the same lookup. Resolution followed by an outbound connection is what turns a name lookup into a possible upload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What process performed the MEGA lookup, and what does its full command line reveal about its purpose?
  context: >-
    The querying process's command line shows whether the lookup came from ordinary browsing or from a transfer or sync utility invoked with a cloud destination, such as a command-line uploader pointed at a MEGA remote or a script that reads files and posts them. Decode any configured remote, credentials reference, or source path in the arguments. This scopes to executions of that binary on the host around the alert, which for multi-step tooling can span several invocations.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: After the MEGA endpoint resolved, did the querying process establish outbound connections, and to which addresses and ports?
  context: >-
    A DNS lookup alone does not prove a connection was made. This surfaces egress connections from the querying process around the lookup. Sustained outbound sessions on 443 to the resolved addresses, especially a single large outbound transfer exceeding tens of megabytes rather than the small balanced flows of normal browsing, are consistent with an upload to cloud storage. The alert carries no destination address, so this is anchored on the process, not on a resolved IP.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What local files did the querying process write or stage that may have been prepared for upload?
  context: >-
    Exfiltration to cloud storage is often preceded by the same process assembling data locally, copying files from sensitive locations into a staging folder, or writing an archive. The files this process created or modified around the lookup indicate what data was at risk and which business units to notify. Read-only access to source files may not appear in file telemetry, so pair this with the source paths visible in the process command line. A written file carries no hash on the file event; obtain it from a later execution if needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where did the querying process write output on the host after the lookup, and does any of it look like a staged archive?
  context: >-
    Staging typically produces a local archive or export that is then uploaded. File writes by the querying process in the window after the lookup reveal an output path, such as an archive dropped in a temp or profile folder or an export file, and whether it was subsequently moved or copied toward an upload path. A single large output file created just before outbound traffic is the staging-then-exfil pattern.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
- question: Does the querying process's command line show an upload or archiving tool configured with a cloud destination, credentials, or content encryption?
  context: >-
    Attackers frequently password-protect or header-encrypt archives before upload so the contents cannot be inspected in transit, and configure a transfer tool with a remote and credentials. Command-line flags for password or header encryption (for example -p, -hp, --passphrase, -mhe=on), or a transfer tool pointed at a MEGA remote, indicate deliberate staging for exfiltration. Passwords supplied through a config file or standard input will not appear in the command line, so absence does not clear the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally query MEGA storage domains?
  context: >-
    First-time or rare lookups of a consumer cloud-storage domain are more notable than routine resolution on a host where a sanctioned sync client runs daily. A near-zero historical count for this QueryName on this host points to new or unusual activity; a steady history points to an installed application. Compare MEGA against the cloud services this host is actually authorized to use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What other domains did the querying process look up around the same time?
  context: >-
    The useful pivot for a DNS alert is the querying process, every domain it resolved in the window. A burst of algorithmically varied domains, or lookups of several cloud-storage and paste services from one process, points to beaconing or multi-destination exfil rather than a single deliberate upload. Repeated lookups of the same MEGA domain at regular intervals suggest automated, periodic transfer.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Did other hosts in the environment query this same MEGA domain?
  context: >-
    If only one host resolves this domain, it is more consistent with targeted activity on that host. If many hosts do, it more likely reflects a sanctioned service or a shared client deployment. The distribution across hosts informs how wide the response needs to be.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What process spawned the process that performed the lookup, and is that parent chain expected?
  context: >-
    The parent reveals how the querying process was launched. A sync client started by the user session or a service manager is routine; a transfer or scripting process spawned by an Office application, a script host, or an unexpected parent points to automated or malicious invocation. Long-running parents such as shells or services may have started hours before the alert, so the lookback is wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the process that performed the lookup?
  context: >-
    A transfer or scripting binary that has never run on this host before is more notable than one that runs regularly as part of an installed workflow. Zero or very low historical counts indicate first-time or rare execution, which raises the weight of the cloud-storage lookup.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Exfiltration rarely stands alone. Aggregating process activity around the lookup surfaces what preceded it, such as data collection, archiving, or credential access, and what followed. Novel parent-child pairs stand out at low counts against the high-volume agent and operating-system telemetry that dominates a host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as defense tampering, reconnaissance, credential access, or collection activity, may reveal the stages that led to an attempted upload and help reconstruct the timeline. An exfil-related lookup following prior alerts reads very differently from one with no earlier activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
