name: Wmiprvse Wbemcomn DLL Hijack - File
id: 7528c1f9-0acb-4ff4-b64a-4ab1149a0f71
description: |
  Detects the System process creating a file named wbemcomn.dll inside C:\Windows\System32\wbem\, the directory the WMI provider host (wmiprvse.exe) loads its components from. A write to this path by the System process typically means the DLL arrived over the network through an administrative share (such as C$ or ADMIN$) rather than from local servicing, and it sets up a search-order hijack: when wmiprvse.exe next loads wbemcomn.dll it executes the supplied code, commonly under the NETWORK SERVICE account, giving remote code execution on the target. Legitimate rewrites of this DLL come from Windows servicing and are rare, so the investigation should confirm the write, identify the remote host and account behind the SMB session, determine whether the planted DLL was subsequently loaded and whether it is signed, and look for the follow-on execution the hijack enables.
type: detection
detection_id: 614a7e17-5643-4d89-b6fe-f9df1a79641c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a file named wbemcomn.dll written into the System32\wbem directory by the System process?
  context: >-
    The rule fires when the System process (Image is System) creates a file whose path ends in \wbem\wbemcomn.dll. Confirm both parts before proceeding: the responsible process is System, which indicates a kernel-mediated write driven by an inbound network share operation rather than a normal installer or servicing action, and the target is the WMI provider host's component path. A local servicing rewrite of this DLL is rare, so a write attributed to System over a network session is the pattern worth pursuing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to receive a wbemcomn.dll write into its WMI component directory?
  context: >-
    Legitimate replacement of a system WMI component is a rare, servicing-driven event on most hosts. Knowing whether this host has any routine reason to receive a new wbem\wbemcomn.dll over the network helps separate a true positive from an unusual but sanctioned maintenance action. User attribution is present on roughly 94% of endpoint file events; when the account is a machine account (HOST$) or SYSTEM, judge by the host role and the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the planted wbemcomn.dll still on disk, or was it deleted or renamed after the alert?
  context: >-
    The DLL's post-alert lifecycle drives next steps. A file still on disk can be retrieved, hashed, and analyzed, and the original signed component may need restoration; a file deleted or renamed shortly after creation points to cleanup after the hijack fired. Interpret the operation type on each event to distinguish a payload that remains staged from one that has already been swapped or removed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the wbemcomn.dll at this path the legitimate signed WMI component or a replacement?
  context: >-
    The genuine wbemcomn.dll is a signed WMI component that ships in System32\wbem. A hijack replaces it with a DLL that exports the same functions but runs supplied code when the provider host loads it. Retrieve the file from its on-disk path and inspect its strings, imports, and signing status; unfamiliar exports, packer signatures, or an unsigned image confirm a substitution. The file-write event carries no hash, so read the hash from a later load or execution of the path rather than from this write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was wbemcomn.dll loaded after the write, and what are its signature status and hash?
  context: >-
    A DLL records its hash and signing details on the load event, unlike the file-write event. If wbemcomn.dll was loaded from this path after the alert, read whether it is signed, by whom, and its signature status, then submit the hash for a reputation check. An unsigned load, a non-Microsoft signer, or an invalid signature on this path confirms the hijack executed; a load performed by wmiprvse.exe shows the WMI provider host ran the planted module. If the file is present but no load appears, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Did WMI provider-load or event-subscription activity occur on this host around the alert?
  context: >-
    The hijack targets code loaded and run inside the WMI provider host, so provider-load and subscription events on this host near the write time corroborate that the WMI execution path the DLL abuses was active. Provider-load records (5857) and temporary or permanent subscription records (5860, 5861) show WMI activity that a hijacked component would participate in. This channel is not shipped by every host; no results here may reflect a telemetry gap rather than the absence of WMI activity.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - message
- question: What host initiated the inbound SMB session, and is it an expected administrative source?
  context: >-
    A System-attributed write to an administrative share path arrives over an inbound SMB session. Identifying the connecting host reveals whether the DLL came from a known admin jump box, a management server, or an unexpected internal endpoint being used as a pivot. Inbound connections to SMB and DCOM ports (445, 135) around the write time point to the remote source that copied the file into C$ or ADMIN$.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What else has been written to the System32\wbem directory recently, and by which processes?
  context: >-
    The wbem directory holds WMI system components and is normally written only by Windows servicing under trusted system processes. Other recent arrivals in the same directory reveal whether this is an isolated DLL drop or a location under active modification, and which writing processes are responsible. A non-servicing writer placing DLLs or executables here alongside the alerting file is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\wbem\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has wbemcomn.dll been written to this host before, and by what process?
  context: >-
    The legitimate component exists on disk continuously, but write events to it are rare and tied to servicing. A host with zero or very few prior writes to this path, then a sudden write attributed to the System process over the network, stands out against normal update behavior. Compare the writing process on any historical writes to judge whether this event fits a servicing pattern.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously produced this write pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the resulting program and
    user distribution reflects how this specific write pattern has historically occurred here
    rather than generic file activity. A new writing context, an unexpected account, or a first-
    ever occurrence is the deviation worth chasing. On a host that has never produced this
    pattern, an empty history means the write is entirely new here.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \wbem\wbemcomn.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this write pattern in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this specific write pattern rather than generic file activity. Many hosts producing the same pattern in a short window points to a coordinated push against multiple systems; a single host or a small unrelated set points to a targeted operation. Use the host distribution to calibrate scope and containment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \wbem\wbemcomn.dll
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user account previously produced this write pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the account's history of this specific pattern, aggregated by host. An account that has never produced this write is more notable than one that does so as part of routine administration. Weigh the count against the account's role; a service or machine account that legitimately performs remote servicing reads differently from an interactive user account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \wbem\wbemcomn.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the behavior, so the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, giving the history of that program driving this specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is servicing or platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \wbem\wbemcomn.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user account do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the same identity produced related actions elsewhere, which would widen the scope of the incident. If the account triggered similar file writes or tool usage on multiple endpoints in the same window, the operation is not isolated to this host. Results are dominated by routine telemetry when the alert fires under SYSTEM or a service account, so read this alongside the parent-driven fleet view.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven write pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, network-wide user activity returns routine telemetry rather than a meaningful answer, so the useful question is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window point to pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image: System
        TargetFilename|endswith: \wbem\wbemcomn.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A DLL hijack of the WMI provider host executes supplied code once wmiprvse.exe loads the planted module, so process activity around the write is where the follow-on execution shows up. Aggregating by process and parent collapses routine agent and OS telemetry into high-count rows while novel parent-child pairs stand out at low counts. Look for interpreters, reconnaissance tools, or unfamiliar children appearing shortly after the write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A remote DLL plant is usually one stage of a longer sequence. Earlier detections on the same host — reconnaissance, credential access, or an inbound remote-access event — may reveal how the operator reached this host and staged the write. The alert timeline before this event helps reconstruct the path to the WMI hijack.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
