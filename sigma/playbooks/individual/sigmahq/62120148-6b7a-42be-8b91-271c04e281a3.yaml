name: Suspicious Camera and Microphone Access
id: 7d96b8de-aae7-489c-b052-28d890d1c00c
description: |
  Detects a process running from a suspicious folder accessing the camera or microphone, recorded in the Windows CapabilityAccessManager ConsentStore registry keys. The rule fires when a ConsentStore NonPackaged value name references the webcam or microphone capability AND the application path encoded in that value name resolves to a broadly user-writable or temporary location (Windows\Temp, $Recycle.bin, Temp, Users\Public, Users\Default, or Users\Desktop) — all three conditions must hold together. Windows writes a per-application last-used timestamp whenever an app accesses a capture device; a consumer launched from one of these folders is unusual, since legitimate conferencing and recording software normally runs from Program Files. The investigation should identify which application the value name names, whether it is expected on this host, whether it loaded camera or audio libraries and wrote media files, and whether any captured data was moved off the host.
type: detection
detection_id: 62120148-6b7a-42be-8b91-271c04e281a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key and value name match the ConsentStore camera or microphone access pattern this rule detects?
  context: >-
    The rule fires when a ConsentStore NonPackaged value name references the webcam or microphone capability AND the application path encoded in that value name resolves to a suspicious folder (Windows\Temp, $Recycle.bin, Temp, Users\Public, Users\Default, or Users\Desktop). All three conditions must hold together. Confirm the exact TargetObject before investing time: read the capability from the parent subkey and the encoded application path from the value name, which uses a non-standard separator. A capture consumer launched from one of these folders is the anomaly, since legitimate camera and conferencing software runs from Program Files.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run camera or microphone capture from a user-writable folder?
  context: >-
    Legitimate conferencing and recording applications access capture devices routinely, but they run from Program Files, not from Temp, Public, or Recycle Bin paths. Knowing whether this account and host normally run capture software, and whether any approved application happens to be installed in an unusual location, is often the fastest way to separate a true positive from a misconfigured install. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What ConsentStore value name was written, and which application and capability does it identify?
  context: >-
    The ConsentStore NonPackaged subkey records a per-application last-used timestamp for a capability. The value name encodes the accessing application's full path with a non-standard separator, and the parent subkey names the capability (webcam or microphone). Read the exact value name to identify the application and confirm the path resolves to one of the suspicious folders the rule matched; let the value-decode question carry the timestamp and data analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Decode the application path in the value name and read the last-used data — what process accessed the device and when?
  context: >-
    The value name is the accessing application's path with directory separators replaced by a substitution character; translate it back to a normal path to identify the executable and confirm it sits in a user-writable or temporary folder. The value data records the last-used timestamp for that access. Registry value data is absent for binary or empty entries on roughly a fifth of modifications, so missing data here does not clear the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did a process on this host load camera or audio capture libraries around the time of the access?
  context: >-
    Camera and microphone capture requires loading media libraries such as avicap32.dll, mf.dll, mfreadwrite.dll, or ksproxy.ax (video) and winmm.dll or avrt.dll (audio). A process loading these libraries in the same window as the ConsentStore write, especially one running from a user-writable folder, corroborates active capture. The load event carries the loaded module's signature, so an unsigned or unexpected loader stands out.
  range: +/-20m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith:
          - \avicap32.dll
          - \mf.dll
          - \mfreadwrite.dll
          - \ksproxy.ax
          - \winmm.dll
          - \avrt.dll
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
- question: Were video or audio media files written to disk on this host around the time of the access?
  context: >-
    Capture typically lands a media artifact on disk — video (.mp4, .avi, .mov, .yuv, .mkv, .h264) or audio (.wav, .m4a, .wma) — often in a temporary or user-profile directory. A media file appearing shortly after the device access is direct evidence that capture occurred and data was retained; a large file written to an unusual path is a stronger signal than a thumbnail-sized artifact.
  range: +/-20m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .mp4
          - .avi
          - .mov
          - .yuv
          - .mkv
          - .h264
          - .wav
          - .m4a
          - .wma
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What outbound connections did this host make shortly after the device access?
  context: >-
    Captured audio or video is often exfiltrated soon after collection. Outbound connections from this host in the minutes around the access — particularly to unfamiliar external destinations — may represent upload of the captured media. Correlate the connection timing with the device-access and media-write events to reconstruct a collection-to-exfiltration sequence.
  range: +/-20m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Has this application recorded camera or microphone access on this host before?
  context: >-
    A ConsentStore entry for an application that has never accessed a capture device on this host is more suspicious than a routine update from an installed conferencing client. Compare the historical value data for this key: a first-time access from an application in a user-writable folder stands out against a history of known consumers. Zero history indicates the access record is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did the same ConsentStore access record appear on other hosts in the environment?
  context: >-
    The same application accessing a capture device from the same suspicious path across multiple hosts may indicate a deployed tool or widespread implant; a single-host record is more consistent with targeted activity. Compare the value data across hosts to see whether the access pattern is shared or isolated to this one host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who reaches the point of capturing audio or video has usually taken earlier steps that also touch the registry — persistence, defense changes, or capability toggles. Clusters of registry writes from the same process within a short window reveal the wider scope of the activity. The triggering access record appears in the results; the signal is what else changed. If the host is registry-noisy, narrow to the writing process or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process wrote this access record, and what started that process?
  context: >-
    The process recorded writing the ConsentStore key is the immediate actor, though on some systems a broker component records the access on the application's behalf. Tracing that process's own parent shows whether the chain is legitimate — a user-launched application or a management agent — or suspicious, such as a script host or unusual parent spawning the capturing process. Service and agent parents that legitimately broker device access are expected; if the parent process identifier resolves to NODATA, fall back to the writing process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Capture rarely occurs in isolation. Aggregating process activity around the access surfaces what led to it and what followed — a download or dropper, reconnaissance, or additional collection. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — execution from an unusual folder, defense tampering, or reconnaissance — may reveal the stages that preceded the capture and help reconstruct the timeline. A capture access following an earlier suspicious-execution alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What files did the capturing process write locally around the time of the access?
  context: >-
    The process recorded accessing the device may write captured media or supporting files to disk. Listing the files it touched shows what was collected and where it was staged. The anchor is the process recorded on the alert, which on some systems is a broker rather than the application itself; the application's own path is in the value name. Media artifacts written to temporary or hidden profile directories are the collection signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Was any captured or collected data moved off this host after the access?
  context: >-
    Collected media is frequently staged and then moved — copied to another location, archived, or uploaded. Checking where the capturing process wrote files after the access reveals whether the output was relocated toward an exfiltration path. Pair this with the outbound-connection review to see whether local staging was followed by an upload.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
      - Image
