name: Service StartupType Change Via PowerShell Set-Service
id: 4a91014e-0f7a-4029-92e3-0aa205a54352
description: |
  Detects use of the PowerShell Set-Service cmdlet to change a service's startup
  type to Disabled or Manual. The rule fires when both conditions hold: the
  process is powershell.exe (by Image or OriginalFileName) AND the command line
  contains Set-Service and -StartupType together with either Disabled or Manual.
  Changing a service to Disabled or Manual is routine administration -
  troubleshooting scripts, configuration baselines, and software installers all
  reconfigure services this way. It is also a defense-evasion primitive: setting a
  security service (antivirus, EDR, the event log service, or backup agents) to
  Disabled or Manual prevents it from starting after the next reboot, weakening
  protection or recovery ahead of follow-on activity. The investigation should
  determine which service was reconfigured and to what startup type, whether it is
  a security or recovery service, what spawned the PowerShell invocation, and
  whether the host or fleet shows this pattern as routine automation or as a
  one-off operator action.
type: detection
detection_id: 62b20d44-1546-4e61-afce-8e175eb9473c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did powershell.exe run Set-Service with -StartupType set to Disabled or
    Manual?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires only when all conditions hold together - the process is
    powershell.exe (by Image or OriginalFileName) AND its command line contains both
    Set-Service and -StartupType AND either Disabled or Manual. Read the exact command
    line and identify which service is being reconfigured and to which startup type.
    A service name that maps to antivirus, EDR, the event log service, or a backup
    agent points toward defense evasion; an application or troubleshooting service
    points toward routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to reconfigure service startup types with
    PowerShell?
  context: Reconfiguring services to Disabled or Manual is normal work for IT
    administrators, configuration-management tooling, and software installers, but
    most user accounts and most endpoints never do it interactively. Knowing whether
    the acting account and host function involve service administration is often the
    fastest path to separating a routine configuration change from a deliberate
    weakening of a security or recovery service.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which service was reconfigured, and was its startup type set to Disabled
    or Manual?
  context: The impact depends entirely on which service was targeted. Read the service
    name and startup type from the command line. Setting an antivirus, EDR, event log,
    or backup service to Disabled stops it from starting after reboot and leaves the
    host unprotected or unrecoverable; Manual is subtler but still prevents automatic
    start. An unrelated application service set to Manual is more likely routine
    servicing. Identifying the specific service and the new startup type determines
    investigation priority and remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the service Start value change in the registry on this host around the
    time of the alert?
  context: Set-Service -StartupType writes the targeted service's Start value under
    HKLM\SYSTEM\CurrentControlSet\Services. Registry-set evidence confirms the change
    actually took effect and surfaces other service-configuration edits in the same
    window that may not have come through the same PowerShell command line - for
    example a service reconfigured directly through the registry or through sc config.
    Correlating the registry write with the alerting command line confirms the
    reconfiguration and reveals whether multiple services were retuned together.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Services\'
        TargetObject|endswith:
          - '\Start'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the surrounding command encoded or obfuscated, and what does the full
    statement decode to?
  context: The Set-Service call may be one statement inside a larger PowerShell command
    that is base64-encoded (-EncodedCommand / -enc), concatenated, or backtick-escaped
    to hide other actions performed in the same invocation. Decode and deobfuscate the
    full command line to confirm whether the service change is the only action or
    whether it is bundled with downloads, additional service edits, or in-memory
    execution. If the command line is already plain text, confirm there is no hidden
    second stage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: Script block logging (Event ID 4104) records the deobfuscated script content
    that PowerShell actually executed, including statements that ran in the same
    session before or after the Set-Service call. This is ground truth about what the
    script did even when the command line is short or encoded. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence that nothing else ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this
    execution?
  context: Operators often weaken PowerShell controls before running a payload or a
    tampering command. Common precursors include AMSI bypass (patching amsi.dll in
    memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), and
    downgrade to PowerShell v2 which lacks logging. Finding these in the hour before
    the service change strengthens the case that the reconfiguration was part of
    deliberate evasion rather than routine administration.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Is the reconfigured service currently running and set to start, or is it
    still disabled?
  context: A startup-type change persists until it is reverted. If a security or
    recovery service was set to Disabled or Manual it will not start automatically on
    the next reboot, leaving the host exposed until the configuration is restored.
    Check the current startup type and running state of the targeted service so the
    loss of protection is understood as still active or already remediated; a security
    or recovery service left disabled should be restored before the investigation
    proceeds.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the service startup type was
    changed?
  context: Disabling or downgrading a service is often a preparatory step that lets
    follow-on activity run without being blocked, scanned, or recovered. Examining
    what ran in the window immediately after the Set-Service call reveals what the
    change was meant to enable - payload execution, credential access, further service
    tampering, or recovery removal. A burst of process creation right after the
    reconfiguration points to the activity the change was clearing a path for.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering or service-stop actions performed on this host
    around the same time?
  context: An actor who disables one service often pairs it with other evasion or
    recovery-removal steps - stopping or deleting additional services, clearing event
    logs, deleting shadow copies, disabling the recovery environment, or weakening
    firewall rules. Mass reconfiguration or deletion of antivirus, backup, and
    database services in a short window is a known precursor to impact. Finding several
    such actions from the same user or parent indicates a coordinated effort to blind
    and de-fortify the host rather than an isolated configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What process spawned this PowerShell instance, and is that parent chain
    expected for service administration?
  context: The parent process reveals how the service change was invoked. Legitimate
    reconfiguration is typically driven interactively by an administrator from a
    console shell, or by configuration-management or installer tooling. An unexpected
    parent such as a script host, an Office application, a batch orchestrator running
    cmd.exe, or a remote-execution service points away from routine administration.
    Tracing the parent's own origin shows whether the chain is maintenance or an
    automated tampering sequence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously run Set-Service -StartupType to Disabled or
    Manual, what parents and users drove it, and does the current alert fit that
    pattern?
  context: Even routine administration leaves a baseline. This query mirrors the rule's
    selection scoped to this host, so the resulting parent and user distribution
    reflects how this specific Set-Service pattern has historically run here rather
    than generic PowerShell usage. A new parent process, an unexpected account, or an
    unusual command-line structure compared with prior firings is the deviation worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \powershell.exe
      - OriginalFileName: PowerShell.EXE
      selection_cli:
        CommandLine|contains|all:
        - Set-Service
        - -StartupType
        CommandLine|contains:
        - Disabled
        - Manual
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \powershell.exe
      - OriginalFileName: PowerShell.EXE
      selection_cli:
        CommandLine|contains|all:
        - Set-Service
        - -StartupType
        CommandLine|contains:
        - Disabled
        - Manual
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \powershell.exe
      - OriginalFileName: PowerShell.EXE
      selection_cli:
        CommandLine|contains|all:
        - Set-Service
        - -StartupType
        CommandLine|contains:
        - Disabled
        - Manual
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    service change was a single event or part of activity spanning multiple endpoints.
    If the same user reconfigured services or ran other tampering on other hosts in the
    same window, the scope of the incident is larger than one machine and may indicate
    a coordinated rollout.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \powershell.exe
      - OriginalFileName: PowerShell.EXE
      selection_cli:
        CommandLine|contains|all:
        - Set-Service
        - -StartupType
        CommandLine|contains:
        - Disabled
        - Manual
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or
    other defense tampering - may reveal the attack stages that preceded the service
    change and help reconstruct the full timeline. Disabling a service is often one
    step in a sequence, so prior alerts give the context for why a service was
    reconfigured here.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run the Set-Service -StartupType pattern in the past week,
    and does the cross-host distribution look like consistent automation or one-off
    activity?
  context: This query counts the rule's Set-Service -StartupType pattern fleet-wide with
    no host scope. Many hosts running the same pattern points to a configuration
    baseline or software-deployment workflow that reconfigures services by design; one
    host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity and decide whether this
    fits an automation baseline or stands out as isolated activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \powershell.exe
      - OriginalFileName: PowerShell.EXE
      selection_cli:
        CommandLine|contains|all:
        - Set-Service
        - -StartupType
        CommandLine|contains:
        - Disabled
        - Manual
      condition: all of selection_*
    fields:
    - host.name
