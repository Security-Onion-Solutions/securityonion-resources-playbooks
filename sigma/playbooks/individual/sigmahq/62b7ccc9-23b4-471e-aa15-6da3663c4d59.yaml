name: PowerShell Base64 Encoded Reflective Assembly Load
id: 5db17cd7-7e12-4d60-97c6-231093e6ea81
description: |
  Detects a PowerShell command line containing a base64-encoded form of
  [Reflection.Assembly]::Load( (or the ::("Load")( variant) — the in-memory loading
  of a .NET assembly straight from a byte array, with no file written to disk. The rule
  fires when the command line matches any one of the known base64 fragment encodings of
  that call. Reflective .NET loading is the fileless execution stage that PowerShell
  loaders use to run .NET tooling (post-exploitation frameworks, credential-access
  utilities) entirely in memory, frequently after an -EncodedCommand layer hides the
  loader. Determine what assembly is being loaded, decode the surrounding command, and
  establish whether the user, host, and parent chain make this expected.
type: detection
detection_id: 62b7ccc9-23b4-471e-aa15-6da3663c4d59
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a base64-encoded [Reflection.Assembly]::Load call?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires on a single selection — a command line carrying any one of the known base64
    fragment encodings of [Reflection.Assembly]::Load( or [Reflection.Assembly]::("Load")(.
    Read the full command line and confirm the encoded fragment is present and embedded in
    a PowerShell invocation rather than a coincidental string.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run encoded PowerShell that reflectively loads .NET assemblies into memory?
  context: Reflective .NET loading from PowerShell is rare in routine administration; it
    appears mostly in developer tooling, a few packaged automation frameworks, and
    offensive tooling. Knowing whether the user role and host function involve .NET
    development or known automation is often the fastest way to separate a true positive
    from sanctioned activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the encoded command decode to, and which .NET assembly is being reflectively loaded?
  context: The alerting command line carries a base64 fragment of an Assembly.Load call,
    and is often wrapped in an outer -EncodedCommand (-enc) layer. Decode every layer until
    the script is readable, then identify the byte source feeding Assembly.Load — a literal
    byte array, a registry value, a downloaded buffer, or a hex/XOR-decoded blob. A loader
    that assembles bytes from an unusual source and runs them with no file on disk is the
    fileless-execution payload the rule is built to surface.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated reflective-load script?
  context: Event ID 4104 records the deobfuscated script content PowerShell actually
    executed, even when the command line was encoded. This is ground truth for what the
    loader did — the assembled byte array, the Assembly.Load target, and any method invoked
    on the loaded type. If PowerShell operational logs are not ingested in this environment,
    treat zero results as a visibility gap rather than evidence nothing ran, and decode the
    encoded command line directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: In-memory .NET loading is commonly preceded by steps that blind the
    interpreter — patching AMSI so the assembled bytes are never scanned, setting an
    execution-policy bypass, or downgrading to PowerShell v2 to avoid logging. Finding these
    precursor events in the hour before the load strengthens the case that the reflective
    load is operator activity rather than benign tooling.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What process spawned the PowerShell that performed the reflective load, and is that parent chain expected?
  context: The parent process reveals how the loader was launched. A predictable chain
    (explorer.exe for an interactive user, a known automation host) reads differently from
    an Office application, mshta.exe, wscript.exe, or a freshly written binary spawning
    PowerShell — the latter parents point at delivery via macro, script, or dropper. Walk up
    to the parent of the parent if the immediate parent is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired this base64 reflective-load pattern, what parents and users drove it, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting
    parent and user distribution reflects how this specific reflective-load pattern — not
    generic PowerShell usage — has historically run here. A new parent process, an
    unexpected account, or a first-ever appearance of the pattern on this host is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - WwBSAGUAZgBsAGUAYwB0AGkAbwBuAC4AQQBzAHMAZQBtAGIAbAB5AF0AOgA6AEwAbwBhAGQAKA
        - sAUgBlAGYAbABlAGMAdABpAG8AbgAuAEEAcwBzAGUAbQBiAGwAeQBdADoAOgBMAG8AYQBkACgA
        - bAFIAZQBmAGwAZQBjAHQAaQBvAG4ALgBBAHMAcwBlAG0AYgBsAHkAXQA6ADoATABvAGEAZAAoA
        - AFsAcgBlAGYAbABlAGMAdABpAG8AbgAuAGEAcwBzAGUAbQBiAGwAeQBdADoAOgAoACIATABvAGEAZAAiAC
        - BbAHIAZQBmAGwAZQBjAHQAaQBvAG4ALgBhAHMAcwBlAG0AYgBsAHkAXQA6ADoAKAAiAEwAbwBhAGQAIgAp
        - AWwByAGUAZgBsAGUAYwB0AGkAbwBuAC4AYQBzAHMAZQBtAGIAbAB5AF0AOgA6ACgAIgBMAG8AYQBkACIAK
        - WwBSAGUAZgBsAGUAYwB0AGkAbwBuAC4AQQBzAHMAZQBtAGIAbAB5AF0AOgA6ACgAIgBMAG8AYQBkACIAKQ
        - sAUgBlAGYAbABlAGMAdABpAG8AbgAuAEEAcwBzAGUAbQBiAGwAeQBdADoAOgAoACIATABvAGEAZAAiACkA
        - bAFIAZQBmAGwAZQBjAHQAaQBvAG4ALgBBAHMAcwBlAG0AYgBsAHkAXQA6ADoAKAAiAEwAbwBhAGQAIgApA
        - WwByAGUAZgBsAGUAYwB0AGkAbwBuAC4AYQBzAHMAZQBtAGIAbAB5AF0AOgA6AEwAbwBhAGQAKA
        - sAcgBlAGYAbABlAGMAdABpAG8AbgAuAGEAcwBzAGUAbQBiAGwAeQBdADoAOgBMAG8AYQBkACgA
        - bAHIAZQBmAGwAZQBjAHQAaQBvAG4ALgBhAHMAcwBlAG0AYgBsAHkAXQA6ADoATABvAGEAZAAoA
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did this PowerShell instance spawn after the reflective load?
  context: The processes spawned by the loader reveal its actual impact. A reflectively
    loaded .NET tool may shell out to cmd.exe, certutil.exe, rundll32.exe, reconnaissance
    utilities, or additional PowerShell. Scoping to children of this exact PowerShell
    instance keeps the result tied to the alerting process rather than all activity on the
    host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this base64 reflective-load pattern in the past week, and does the spread look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of this reflective-load pattern rather than generic PowerShell usage.
    Many hosts firing the identical encoded pattern points to scripted deployment or a
    packaged tool; a single host or a small unrelated set points to manual operator
    activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - WwBSAGUAZgBsAGUAYwB0AGkAbwBuAC4AQQBzAHMAZQBtAGIAbAB5AF0AOgA6AEwAbwBhAGQAKA
        - sAUgBlAGYAbABlAGMAdABpAG8AbgAuAEEAcwBzAGUAbQBiAGwAeQBdADoAOgBMAG8AYQBkACgA
