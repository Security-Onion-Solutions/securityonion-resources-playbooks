name: Potential Suspicious Registry File Imported Via Reg.EXE
id: 65881d8c-cf56-4bc7-a45d-2c6c7187cba2
description: |
  Detects reg.exe (matched by Image or OriginalFileName) invoked with the ' import ' operation where the
  command line references a user-writable or temporary path (under C:\Users\, %temp%, %tmp%, %appdata%,
  \AppData\Local\Temp\, C:\Windows\Temp\, or C:\ProgramData\). The rule fires only when all three conditions
  hold together: the binary is reg.exe, the operation is import, and the source file path is one of the
  suspicious locations. Importing a .reg file bulk-writes exported subkeys, values, and data into the registry
  in one operation, which an operator can use to install persistence (Run/RunOnce, Services, IFEO) or weaken
  security settings without typing each key individually. Legitimate software deployment and backup restores
  also import .reg files, so the investigation should read the imported file's actual content, identify which
  registry keys it writes, confirm the parent process and user are expected to perform bulk registry imports,
  and determine whether any referenced payload exists on disk.
type: detection
detection_id: 62e0298b-e994-4189-bc87-bc699aa62d97
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with reg.exe running an import from a user-writable or temporary path?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when all three conditions hold together, the binary is reg.exe (by Image or OriginalFileName) AND the command line contains the import operation AND the source file path lives under a user-writable or temporary location such as C:\Users\, %temp%, %appdata%, \AppData\Local\Temp\, C:\Windows\Temp\, or C:\ProgramData\. Confirm all three are present in the actual event and note the full path of the imported .reg file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to import registry files in bulk from temporary or user-writable locations?
  context: Legitimate software installs, configuration deployments, and backup restores do import .reg files, but doing so from a temp or profile directory rather than a packaged installer is less common on general-purpose endpoints. Knowing whether the user role and host function involve bulk registry imports is often the fastest path to distinguishing routine deployment from operator-driven configuration change.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the parent expected to launch reg.exe for a bulk import, and what started that parent?
  context: The parent process reveals how the import was invoked. Installer and deployment tooling (msiexec.exe, packaged setup utilities) or an interactive admin shell are expected drivers; parents like winword.exe, mshta.exe, wscript.exe, or an archive extractor point to macro-driven or staged execution rather than legitimate configuration management. Walk up the tree to see what spawned the parent and whether the lineage matches an allowlist of legitimate registry tools.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn?
  context: If a suspicious parent spawned this reg.exe import, it likely spawned other processes too. Examining sibling processes reveals the full scope of activity from that parent, multiple registry tools, downloaders, or shells from the same parent within a short window suggests orchestrated configuration change rather than an isolated import.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Which registry keys and values did this import write, and are any of them known persistence or evasion locations?
  context: An import bulk-writes every subkey, value name, and data entry contained in the .reg file, so the registry events linked to this process show what actually changed. Run/RunOnce keys (HKCU or HKLM\Software\Microsoft\Windows\CurrentVersion\Run) indicate persistence; keys under HKLM\SOFTWARE\Policies\Microsoft\Windows Defender or firewall policy paths indicate security tampering; Image File Execution Options (IFEO) keys indicate debugger-based hijacking; Services keys can register or alter a service. The set of monitored or critical keys (Run, Services, security settings, LSASS) is environment-specific, so compare the written paths against the keys your environment treats as sensitive.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What is in the imported .reg file? Read its key paths, value names, and data, and check for obfuscation or encoded payloads.
  context: 'The .reg file is the payload of this operation, the command line only names its path. Retrieve the file and read its contents: enumerate every key path and value it writes, and inspect value data for encoded blobs, base64 strings, embedded executable paths, scripts, or URLs. A value that registers an executable under a Run key, points an IFEO Debugger at a security tool, or stores an encoded command is what determines intent. Compare suspicious strings against threat intelligence.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' import '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the hash of the imported .reg file, and how do you obtain it?
  context: reg.exe reads the .reg file rather than running it, so no hash is recorded for the file, and the import path is not a queryable field. Retrieve the .reg file from the path on the command line (see the content-decode and evidence-preservation steps) and hash it for a reputation check -- though a .reg script is often unique, so the investigative weight sits on its contents (the keys and values it writes) rather than its hash. This query surfaces any .reg file this process tree wrote, in case the same session staged it just before importing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the imported .reg file still on disk for analysis?
  context: The .reg file path is derived from the import command line. Checking whether it still exists on disk enables deeper analysis, hash lookups, sandbox submission, or direct content review. Operators frequently delete the .reg file immediately after import, so its absence is itself informative and the registry events become the primary record of what was written.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were other registry modifications made on this host in the same session and window?
  context: An operator who imports one registry file often makes several related changes, setting a Run key for persistence while also disabling a security setting or altering a service, and the registry change correlates in time with nearby process or service execution. Finding clusters of reg.exe or regedit.exe write operations (add, delete, import, /s) from the same host within a short window reveals the full scope of the configuration change and whether multiple objectives were pursued together.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does any value written by the import reference an executable or script on disk, and does that payload survive reboot?
  context: A registry persistence entry is only effective if the executable or script it points to exists at the referenced path. If the imported file wrote a Run key or Service ImagePath pointing to, for example, C:\Users\Public\backdoor.exe, checking whether that file exists and analyzing its hash determines whether the persistence mechanism is armed and what would execute on next logon or service start. Extract the referenced path from the registry value data, then verify whether it is present on disk.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has previously fired the rule's import pattern, what parents and users normally drive it, and does the current alert fit that pattern?
  context: Even routine deployment can use reg.exe import. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific import-from-suspicious-path pattern has historically run here, not generic reg.exe usage. A new parent process, an unexpected user account, or an unfamiliar imported-file path is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains: ' import '
      selection_paths:
        CommandLine|contains:
        - C:\Users\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
        - \AppData\Local\Temp\
        - C:\Windows\Temp\
        - C:\ProgramData\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What processes ran or services restarted on this host shortly after the import?
  context: Registry changes often take effect only after a process or service is restarted, and bulk imports that install persistence or weaken protection are commonly followed by execution of the newly registered payload. Examining what reg.exe and its parent led to, and what services or processes started in the hours after, reveals whether the configuration change was activated. Unexpected children such as cmd.exe, powershell.exe, or certutil.exe point to post-import staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains: ' import '
      selection_paths:
        CommandLine|contains:
        - C:\Users\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
        - \AppData\Local\Temp\
        - C:\Windows\Temp\
        - C:\ProgramData\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains: ' import '
      selection_paths:
        CommandLine|contains:
        - C:\Users\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
        - \AppData\Local\Temp\
        - C:\Windows\Temp\
        - C:\ProgramData\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar registry imports or other administrative actions on multiple hosts, the scope of the activity may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_cli:
        CommandLine|contains: ' import '
      selection_paths:
        CommandLine|contains:
        - C:\Users\
        - '%temp%'
        - '%tmp%'
        - '%appdata%'
        - \AppData\Local\Temp\
        - C:\Windows\Temp\
        - C:\ProgramData\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Was reg.exe executed from its expected system path?
  context: reg.exe executed from outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists, or that a different binary is impersonating it. Confirm the Image path and compare OriginalFileName against the on-disk name, a reg.exe running from a user's temp or profile directory is more suspicious than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were any other persistence or registry-tampering LOLBins used on this host recently?
  context: Operators who use reg.exe to alter the registry often reach for other native tools toward the same objective. Check whether schtasks.exe, sc.exe, at.exe, bitsadmin.exe, or wmic.exe were also used on this host to install persistence or change configuration. Finding multiple persistence-capable binaries performing related actions strengthens the case for deliberate, multi-mechanism activity over an isolated import.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
          - '\netsh.exe'
          - '\wevtutil.exe'
          - '\bcdedit.exe'
          - '\vssadmin.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
