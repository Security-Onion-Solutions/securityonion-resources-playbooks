name: UAC Bypass Using Consent and Comctl32 - File
id: 30ecc1f8-fe06-496f-9cd0-4afdee64e5c6
description: |
  Detects a file named comctl32.dll written under the transacted path of the auto-elevated system binary consent.exe (a path beginning C:\Windows\System32\consent.exe.@), the on-disk artifact of a DLL search-order hijack used to bypass User Account Control. consent.exe auto-elevates without a prompt and loads comctl32.dll; when an attacker plants their own comctl32.dll where consent.exe resolves it, the auto-elevated process loads and runs that code at high integrity, defeating the elevation prompt. The legitimate comctl32.dll loads from WinSxS or System32, not from a consent.exe.@ transacted path, so this write is rarely benign. The investigation should confirm the dropped DLL's content and signing, determine whether consent.exe actually loaded it, identify what elevated action followed, and attribute the process that wrote it.
type: detection
detection_id: 62ed5b55-f991-406a-85d9-e8e8fdf18789
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does this alert match the rule — a comctl32.dll written under a C:\Windows\System32\consent.exe.@ transacted path?
  context: >-
    Before investing investigation time, confirm the write matches the rule's criteria: the file name ends in \comctl32.dll AND the path begins C:\Windows\System32\consent.exe.@ (both conditions must hold). Review the exact path, the operation performed, and the responsible process. The legitimate comctl32.dll is serviced into WinSxS or System32, never a consent.exe.@ path, so a match here is the hijack artifact rather than a servicing write.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write a DLL under the consent.exe system path?
  context: >-
    Legitimate administrative activity and servicing rarely write a DLL into a C:\Windows\System32\consent.exe.@ path. Knowing whether the account and host function are consistent with that operation is often the fastest way to separate a true positive from routine activity. User attribution is present on roughly 94% of endpoint file events; when it is a machine account (HOST$) or SYSTEM, judge by the writing process (Image) and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What process wrote this comctl32.dll, and what is its command line and parent chain?
  context: >-
    The file event carries the writing process's identifiers but not its command line. Retrieving that process's own creation event reveals how the DLL was dropped and what launched the writer. A medium-integrity process — a script host, a downloaded dropper, or an unexpected parent — planting a DLL on the consent.exe path is the bypass being staged; a signed installer or management agent points the other way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this comctl32.dll a hijack payload rather than the legitimate system DLL — what are its content, exports, and signing?
  context: >-
    comctl32.dll is a real Windows control library; a copy planted on the consent.exe transacted path is a hijack payload, not the system file. Retrieve the DLL from disk and examine its exports, embedded strings, size, and signing. The real comctl32.dll is Microsoft-signed and lives in WinSxS or System32; an unsigned or stub DLL exporting only what consent.exe imports is the malicious version. Content retrieval is manual from the endpoint; the file-write event itself carries no hash.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When consent.exe loaded a comctl32.dll, what was its path, signing status, and hash?
  context: >-
    A DLL records its hash and signature on the load event, not on the file-write event. If the auto-elevated consent.exe loaded a comctl32.dll from a non-standard path, or one that is unsigned or not Microsoft-signed, the hijack fired — submit the hash to threat intelligence to establish whether it is known malicious. A Microsoft-signed comctl32.dll loaded from WinSxS or System32 is the benign case. This is the load-side confirmation of the bypass.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\consent.exe'
        ImageLoaded|endswith: '\comctl32.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What action was performed at high integrity after the UAC bypass?
  context: >-
    UAC bypass is a means to an end — the payoff is code running elevated. After consent.exe loads the hijacked comctl32.dll, look for high or system integrity processes on this host in the window that follows: credential dumping, persistence installation, security-tool tampering, or lateral-movement staging reveal the objective. The auto-elevated front-end abused by this method is consent.exe itself.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Is the dropped comctl32.dll still on disk, or was it deleted or renamed after the alert?
  context: >-
    The DLL's post-alert lifecycle drives next steps. A copy still present can be retrieved, hashed, and analyzed; a copy deleted seconds after the load (read the EventType) suggests anti-forensic cleanup once the elevation ran, and shifts the focus to what executed in between. Track the file's full lifecycle on this host for several hours after the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the process that wrote this DLL create or delete around the alert?
  context: >-
    A bypass rarely drops just one file. The same process may stage a payload, a loader, or a script alongside the hijack DLL, and a dropper often delegates writes to a child process. The writer and its direct children's file activity enumerates what else was touched and needs review. Look at where the writes land, not just how many there are.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the consent.exe transacted path on this host?
  context: >-
    The C:\Windows\System32\consent.exe.@ transacted path is not a location legitimate software writes to; anything landing there is part of the hijack. Aggregating writes to that path segment, grouped by file and writing process, shows whether only comctl32.dll was staged or additional hijack DLLs were placed, and which process placed them.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\consent.exe.@'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has a comctl32.dll been written on this host before, and to which paths?
  context: >-
    A first-time write of comctl32.dll into the consent.exe transacted path is the anomaly; servicing writes land in WinSxS or System32. Compare the historical write paths on this host, grouped by path and writing process — the transacted path appearing for the first time, or a writer that is not a servicing component, stands out. Zero prior history at the transacted path indicates a fresh hijack drop.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were UAC-bypass registry keys modified on this host around the time of the DLL drop?
  context: >-
    This alert is a DLL-hijack bypass, but actors commonly attempt several bypass methods until one succeeds. Registry-trigger bypasses write a command into keys that an auto-elevated front-end reads and executes — ms-settings, mscfile, exefile, Folder\shell\open\command, or an Environment redirect. A write to one of these on the same host near the drop points to deliberate, multi-method escalation. Registry key deletion is not observable in this telemetry, so judge cleanup from re-modification history, not delete events.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - 'ms-settings\Shell\Open\command'
          - 'mscfile\shell\open\command'
          - 'Classes\exefile\shell\open\command'
          - 'Classes\Folder\shell\open\command'
          - '\Environment\windir'
          - 'DelegateExecute'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Did other privilege-escalation or UAC-bypass detections fire on this host?
  context: >-
    Attackers who attempt one bypass often try several. Other detections on this host in the window — additional UAC-bypass methods, defense tampering, or credential access — corroborate deliberate privilege escalation rather than a false positive and help reconstruct the sequence of stages.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the drop surfaces what led to it and what followed — reconnaissance, a download or dropper, or additional escalation. Novel parent-child pairs stand out at low counts against the high-count agent and OS telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- always_include: true
  question: Has this user written a comctl32.dll to the consent.exe path before, and does that history fit their role?
  context: >-
    The query counts this user's 90-day history of the rule's exact write (not generic file activity), aggregated by host. A user who has never dropped a comctl32.dll on the consent.exe transacted path is more suspicious than one who has; weigh the count against the user's role. When the alert fires under a machine or service account, user identity does not attribute the behavior — the parent-process baseline is the meaningful pivot.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\consent.exe.@
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has the program behind this write produced this consent.exe DLL drop before, or is it new for this activity?
  context: >-
    Under a service or machine account, user identity does not attribute behavior; the launch mechanism does. This counts the 90-day history of this program producing the rule's exact write, aggregated by host. A new or rare program for this activity is the deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation. Paired with the user baseline — they answer different questions, who versus how.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\consent.exe.@
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account drove activity elsewhere — lateral movement or multi-host staging. When the alert fires as SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this query returns unbounded agent-telemetry noise; in that case the parent-driven fleet question is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did the same program produce this consent.exe DLL drop on other hosts in the same window?
  context: >-
    Whether the same launch mechanism produced this write elsewhere in the alert window distinguishes pushed or scheduled automation from a host-local trigger. Multiple hosts in the same window points to automation; a single host points to a host-local action. Aggregated by host so concentration on the alerting host stands out.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\consent.exe.@
        TargetFilename|endswith: \comctl32.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
