name: Suspicious AddinUtil.EXE CommandLine Execution
id: fe501c28-3aab-47c9-b057-8fbc4b050a0d
description: |
  Detects the Microsoft-signed Add-In deployment cache utility addinutil.exe running with
  -AddInRoot: or -PipelineRoot: parameters that point at user-writable directories, or with a
  working directory under those same locations. The rule fires when the binary matches AND EITHER
  the suspicious flags appear together with a user-writable path in the command line, OR
  self-referential -AddInRoot:/-PipelineRoot: flags appear alongside a user-writable current
  directory. Legitimately, addinutil.exe runs from .NET framework directories to refresh Office
  add-in caches; abused, it is a proxy-execution LOLBAS that deserializes a crafted AddIns.store
  file via BinaryFormatter, executing an embedded payload under a trusted signed process.
  Investigation should confirm where the addin root was pointed, what payload that directory held,
  and what the binary did next.
type: detection
detection_id: 631b22a4-70f4-4e2f-9ea8-42f84d9df6d8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did addinutil.exe run with a suspicious AddInRoot/PipelineRoot flag plus a user-writable path, or with a self-referential root flag and a user-writable working directory?
  context: >-
    The rule fires when the process is addinutil.exe AND EITHER the command line contains a
    -AddInRoot:/-PipelineRoot: flag together with a user-writable path (Temp, Desktop, Downloads,
    Public, Windows\Temp), OR a self-referential -AddInRoot:./-PipelineRoot:. flag runs while the
    current directory is one of those user-writable locations. Confirm the alert is a true positive
    by reading the exact Image, OriginalFileName, CommandLine, and CurrentDirectory, and note which
    branch fired: a path-in-command-line fire and a working-directory fire point the analyst at
    different evidence locations for the addin root.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - CurrentDirectory
- question: Is this user and host expected to run the .NET add-in deployment utility?
  context: >-
    addinutil.exe is a .NET framework utility for refreshing Office add-in caches and is rarely
    invoked interactively. Knowing whether this user role and host function legitimately involve
    add-in development or deployment is often the fastest way to separate a benign run from
    proxy-execution abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What add-in root or pipeline root did addinutil.exe load, and what file lived at that path?
  context: >-
    The full command line and working directory reveal where the utility was pointed. Read the
    -AddInRoot:/-PipelineRoot: value (or the self-referential "." form resolved against the current
    directory) to identify the folder the cache was read from, then check that folder for an
    AddIns.store file. The vulnerable read path deserializes that file with BinaryFormatter, so the
    contents of the addin root directory are the payload.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned addinutil.exe and is that parent chain expected?
  context: >-
    The parent process reveals how the utility was invoked. A legitimate cache refresh is typically
    driven by Office or installer tooling; an interactive shell, script host, or Office macro host
    spawning addinutil.exe with a user-writable add-in root points toward operator-driven proxy
    execution. Walk up the parent chain to see what set up the run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Does this host normally run addinutil.exe at all?
  context: >-
    addinutil.exe is uncommon on most endpoints. A host with zero or very low historical execution
    of the binary makes a first-time run more notable; a host that runs it regularly may have a
    legitimate add-in deployment workflow. The aggregation shows historical frequency grouped by
    user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even an occasionally legitimate utility can be abused. The query mirrors the rule's selection
    structure scoped to this host, so the resulting parent/user distribution reflects how this
    specific firing pattern has historically run here rather than generic addinutil.exe usage. A new
    parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_susp_1_flags:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      selection_susp_1_paths:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      selection_susp_2:
        CommandLine|contains:
        - -AddInRoot:.
        - -AddInRoot:"."
        - -PipelineRoot:.
        - -PipelineRoot:"."
        CurrentDirectory|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img and (all of selection_susp_1_* or selection_susp_2)) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did addinutil.exe spawn afterward?
  context: >-
    The processes spawned by addinutil.exe reveal the payload's actual effect. Benign children are
    limited to conhost.exe and werfault.exe; any other child — a command interpreter, script host,
    or a freshly dropped binary — indicates the deserialized add-in cache executed code and is the
    strongest line of the investigation to follow.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did addinutil.exe make any outbound network connections after it ran?
  context: >-
    A proxy-execution payload often retrieves a second stage or beacons out under the trusted
    process. addinutil.exe has no legitimate reason to initiate network traffic, so any outbound
    connection from this binary is a meaningful escalation signal. Correlate destination addresses
    with the add-in root contents to see whether the deserialized payload reached out.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What modules did addinutil.exe load, and did anything beyond the expected .NET framework assemblies appear?
  context: >-
    The abuse path runs through System.AddIn.Hosting reading a crafted cache and invoking
    BinaryFormatter deserialization, which can pull in serialization gadget assemblies that a routine
    cache refresh would never load. Unsigned modules, assemblies loaded from a user-writable add-in
    root, or unusual serialization libraries loaded by this binary point to gadget-driven code
    execution rather than a benign cache update. If image_load events are not collected in this
    environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this specific firing pattern rather than generic addinutil.exe usage. Many
    hosts firing the same pattern points to scripted deployment or vendor automation; one host or a
    small unrelated set points to manual operator activity. Use the host distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_susp_1_flags:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      selection_susp_1_paths:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      selection_susp_2:
        CommandLine|contains:
        - -AddInRoot:.
        - -AddInRoot:"."
        - -PipelineRoot:.
        - -PipelineRoot:"."
        CurrentDirectory|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      condition: selection_img and (all of selection_susp_1_* or selection_susp_2)
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_susp_1_flags:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      selection_susp_1_paths:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      selection_susp_2:
        CommandLine|contains:
        - -AddInRoot:.
        - -AddInRoot:"."
        - -PipelineRoot:.
        - -PipelineRoot:"."
        CurrentDirectory|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img and (all of selection_susp_1_* or selection_susp_2)) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_susp_1_flags:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      selection_susp_1_paths:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      selection_susp_2:
        CommandLine|contains:
        - -AddInRoot:.
        - -AddInRoot:"."
        - -PipelineRoot:.
        - -PipelineRoot:"."
        CurrentDirectory|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and (all of selection_susp_1_* or selection_susp_2)) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity
    across multiple endpoints. If the same user triggered similar runs on other hosts, the scope of
    the activity may be larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \addinutil.exe
      - OriginalFileName: AddInUtil.exe
      selection_susp_1_flags:
        CommandLine|contains:
        - '-AddInRoot:'
        - '-PipelineRoot:'
      selection_susp_1_paths:
        CommandLine|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      selection_susp_2:
        CommandLine|contains:
        - -AddInRoot:.
        - -AddInRoot:"."
        - -PipelineRoot:.
        - -PipelineRoot:"."
        CurrentDirectory|contains:
        - \AppData\Local\Temp\
        - \Desktop\
        - \Downloads\
        - \Users\Public\
        - \Windows\Temp\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img and (all of selection_susp_1_* or selection_susp_2)) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining the process activity surrounding this event reveals
    what led to it and what happened after — reconnaissance, privilege escalation, persistence
    installation, or staging that provides broader context. Aggregating by Image and ParentImage
    collapses repetitive agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the attack stages that preceded this proxy-execution event and help reconstruct the full
    timeline. The sequence of alerts on a host often tells the operational story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
