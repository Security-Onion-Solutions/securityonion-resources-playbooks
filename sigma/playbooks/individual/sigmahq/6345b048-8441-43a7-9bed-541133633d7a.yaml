name: ManageEngine Endpoint Central Dctask64.EXE Potential Abuse
id: a6b75ef0-5070-4bbe-978f-a1f945950868
description: |
  Detects execution of dctask64.exe, a signed ManageEngine Endpoint Central binary, with one of the
  subcommands that expose its abusable functionality: executecmd64 (runs an arbitrary cmd.exe command),
  invokeexe (creates an arbitrary process), or injectDll (loads an arbitrary DLL into a target process by
  PID). The rule fires only when both halves match together: the image is dctask64.exe (by name or by one
  of four known import hashes) AND the command line carries one of those subcommands. Because the binary is
  validly signed by the vendor, this is a living-off-the-land path that proxies execution and DLL injection
  through a trusted process; the investigation should decode which subcommand ran and its argument, identify
  what was executed or injected and into which process, and confirm whether the parent, user, and host are
  consistent with legitimate Endpoint Central management activity rather than abuse.
type: detection
detection_id: 6345b048-8441-43a7-9bed-541133633d7a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the event match what this rule detects, with dctask64.exe (by name or known import hash) running an executecmd64, invokeexe, or injectDll subcommand?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact image, hashes, and command line. The rule fires only when both halves hold together, the image is dctask64.exe (matched by name or by one of four known IMPHASH values) AND the command line contains one of executecmd64, invokeexe, or injectDll. Confirm both are present and note which subcommand fired, since it determines whether the abuse was command execution, process creation, or DLL injection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is this user and host expected to run ManageEngine Endpoint Central management tasks?
  context: dctask64.exe is a legitimate Endpoint Central agent component, so on a host managed by that product some invocations are routine. Knowing whether this host is under Endpoint Central management and whether the user or service account driving the call is the expected management identity is often the fastest path to separating routine agent activity from abuse of the signed binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did dctask64.exe do? Decode the subcommand and its argument from the command line.
  context: 'The full command line reveals the specific abuse. Identify which subcommand ran and read its argument: executecmd64 is followed by a cmd.exe command to run, invokeexe by the path of an executable to launch, and injectDll by a DLL path and a target PID. Decode any quoting, environment variables, or encoding in the argument to recover the exact command, executable, or DLL and the process it targets.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - ' executecmd64 '
          - ' invokeexe '
          - ' injectDll '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned dctask64.exe, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked and is central to telling legitimate management activity from abuse. Genuine Endpoint Central usage descends from the agent's own service or scheduled-task host; an unexpected parent such as a shell, script host, Office application, or a freshly dropped binary points to an operator driving the signed binary by hand or via a foothold. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When the injectDll subcommand ran, which DLL did dctask64.exe load, and is it signed and from a standard path?
  context: 'The injectDll subcommand loads an attacker-supplied DLL into a target process through the trusted binary, so the loaded module is the payload. Review image-load events from dctask64.exe for the DLL it pulled in: an unsigned module, one loaded from a temp, user-profile, or other non-standard directory, or a name that does not belong to Endpoint Central is the artifact of injection rather than normal operation. If image-load telemetry is not collected in this environment, recover the DLL path from the injectDll argument on the command line instead.'
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - CommandLine
- question: Did dctask64.exe make the cross-process API calls consistent with writing the injectDll payload into a target process and forcing it to run?
  context: 'The injectDll subcommand works by writing the loaded DLL into a target process and forcing execution there, which requires the same underlying calls any DLL-injection technique uses — writing into the target''s memory, queueing an APC, or installing a hook to force execution. Reviewing these behavioral API calls corroborates that the injection completed rather than only being attempted from the command line, and identifies which process actually carried out the write. If this channel returns nothing, treat that as a visibility gap rather than evidence the injection failed.'
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: What child processes did dctask64.exe spawn afterward?
  context: The executecmd64 and invokeexe subcommands create new processes through the signed binary, so its children are the actual executed payload. Legitimate management tasks have a predictable, narrow set of children; cmd.exe, powershell.exe, certutil.exe, rundll32.exe, or an unfamiliar executable launched from a user-writable path points to proxied execution and follow-on staging. Review each child and its command line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run dctask64.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. On a host genuinely managed by Endpoint Central, dctask64.exe runs on a routine cadence; zero or very low historical counts on a host with no management footprint indicate first-time or rare execution and raise the priority of the decode result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a legitimately deployed agent binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific subcommand-abuse firing pattern has historically run here, not generic dctask64.exe usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dctask64.exe
      - Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      selection_cli:
        CommandLine|contains:
        - ' executecmd64 '
        - ' invokeexe '
        - ' injectDll '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dctask64.exe
      - Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      selection_cli:
        CommandLine|contains:
        - ' executecmd64 '
        - ' invokeexe '
        - ' injectDll '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dctask64.exe
      - Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      selection_cli:
        CommandLine|contains:
        - ' executecmd64 '
        - ' invokeexe '
        - ' injectDll '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user drove similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dctask64.exe
      - Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      selection_cli:
        CommandLine|contains:
        - ' executecmd64 '
        - ' invokeexe '
        - ' injectDll '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this subcommand-abuse firing pattern, not generic dctask64.exe usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \dctask64.exe
      - Hashes|contains:
        - IMPHASH=6834B1B94E49701D77CCB3C0895E1AFD
        - IMPHASH=1BB6F93B129F398C7C4A76BB97450BBA
        - IMPHASH=FAA2AC19875FADE461C8D89DCF2710A3
        - IMPHASH=F1039CED4B91572AB7847D26032E6BBF
      selection_cli:
        CommandLine|contains:
        - ' executecmd64 '
        - ' invokeexe '
        - ' injectDll '
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation through the signed binary.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
