name: Potential DLL Sideloading Via comctl32.dll
id: b6c497cf-9144-4f64-9667-e648ba4d608c
description: |
  Detects a trusted Windows System32 binary loading comctl32.dll from a `.exe.local` DotLocal redirection directory instead of from its canonical System32 or WinSxS location. The alert fires when a loaded module path both begins with one of the privileged `*.exe.local\` redirection folders under System32 (for logonUI.exe, werFault.exe, consent.exe, narrator.exe, or wermgr.exe) AND ends with `\comctl32.dll`. These redirection folders do not exist on a default install and require privileged directory creation; planting a malicious comctl32.dll inside one causes the trusted binary to load and execute it in a SYSTEM-level context, a search-order hijack used for local privilege escalation. Investigation should confirm which process loaded the module and from where, whether the DLL is signed and known, how and when the redirection folder and DLL were written, and whether SYSTEM-level code execution followed.
type: detection
detection_id: 6360757a-d460-456c-8b13-74cf0e60cceb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match the rule's criteria — comctl32.dll loaded from a System32 .exe.local redirection folder?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and the loading process against the rule's criteria: the path both begins with a `*.exe.local\` folder under System32 (logonUI, werFault, consent, narrator, wermgr) and ends with `\comctl32.dll`. comctl32.dll normally resolves from System32 or the side-by-side WinSxS store; a load from a `.exe.local` folder means DotLocal redirection is steering a trusted binary to an attacker-controlled copy. DLL loads carry a hash and signing status on the load event, so verify those here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host expected to have a redirection folder under System32 and load comctl32.dll from it?
  context: >-
    A DotLocal redirection folder under System32 is not present on a default Windows install and is created only with elevated rights. Knowing whether this host runs software that legitimately stages redirected system DLLs — extremely rare — versus a machine where no such configuration is expected quickly separates a benign edge case from a privilege-escalation attempt. On image-load events the process context resolves to the loading binary; when it is a SYSTEM or machine account, weigh the parent chain and file-creation origin rather than the account name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which modules did the loading process pull in, and are any from non-canonical paths, unsigned, or mismatched to their expected System32 origin?
  context: >-
    The set of modules a trusted binary loads tells the operator's story. comctl32.dll has a canonical home in System32 and the WinSxS store; a copy loaded from a `.exe.local` folder is a search-order hijack. Compare the loaded path, signer, and signature status of comctl32.dll against a known-good System32 copy, and look for any other modules the same process loaded from the redirection folder. A load path outside System32/WinSxS for a core system DLL is the anomaly, regardless of signer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the comctl32.dll that was loaded?
  context: >-
    Module reputation separates the genuine Microsoft comctl32.dll from a substituted one. The legitimate library is Microsoft-signed with a valid signature; an unsigned copy, one signed by an unexpected signer, or one whose SignatureStatus is Invalid, Expired, or Distrusted from a `.exe.local` folder is a strong substitution indicator. Hash the loaded module and check it against threat intelligence — a mismatch against the known-good system comctl32.dll confirms the file was replaced. DLLs carry a hash directly on the load event, so no execution pivot is needed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process loaded comctl32.dll, and what started that process?
  context: >-
    The loading binary is one of a small set of System32 executables the redirection targets (logonUI, werFault, consent, narrator, wermgr), each normally launched by the operating system — winlogon, the Windows Error Reporting service, the UAC consent flow, or a scheduled task. Tracing its parent shows whether the invocation is the expected OS-driven one or was forced by an actor, for example running the queueReporting scheduled task or triggering a fault so wermgr loads the planted DLL. If the parent process identifier resolves to NODATA, fall back to the loading process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was a comctl32.dll written into a .exe.local redirection folder, and by which process?
  context: >-
    The hijack requires the attacker to first create the `*.exe.local` folder under System32 and drop a comctl32.dll inside it — the file-write that precedes the load. Look for creation of a file ending in `\comctl32.dll` whose path contains `.exe.local\`, and identify the writing process; a non-system process such as an installer, a script host, or an exploit binary creating a DLL under System32 is the planting step. The write may precede the load by minutes or by a reboot cycle, so widen the window if the immediate one is empty. File-write events carry no hash; retrieve the file for a reputation lookup or hash it from a later execution.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\comctl32.dll'
      selection_path:
        TargetFilename|contains: '.exe.local\'
      condition: selection and selection_path
    fields:
      - TargetFilename
      - Image
- question: Has comctl32.dll been loaded from this path on this host before, and by which processes?
  context: >-
    A first-time load of comctl32.dll from a `.exe.local` folder is a stronger anomaly than a recurring one. Over a 90-day window comctl32.dll should load only from System32/WinSxS; any historical load from a redirection folder, or the complete absence of prior loads from that path, marks the current event as new. Zero history from the `.exe.local` path indicates this redirection has not been exercised before.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is comctl32.dll being loaded from a redirection folder on other hosts in the environment?
  context: >-
    Cross-host correlation surfaces the scope. The same DotLocal comctl32.dll hijack on several hosts points to a distributed privilege-escalation toolkit or a shared deployment method, while a single-host load is more consistent with targeted, hands-on activity. Compare the loading processes across hosts: the same System32 binary loading a redirected comctl32.dll on multiple machines indicates a repeatable exploitation method.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What did the process that loaded comctl32.dll spawn afterward?
  context: >-
    comctl32.dll runs inside a System32 binary that executes with high or SYSTEM privileges, so a malicious replacement gains that privilege level the moment it loads. Child processes of the loading binary — a command interpreter, a script host, or any unexpected executable — are the payload of the hijack and confirm that code execution, not just a module load, occurred. An interactive shell or a living-off-the-land binary spawned here is a privilege-escalation success signal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Were DLL search-order or error-reporting registry controls modified on this host around the alert?
  context: >-
    Beyond the DotLocal folder, DLL search resolution is governed by registry controls — the KnownDLLs list, SafeDllSearchMode, DevOverrideEnable, and Image File Execution Options — and the Windows Error Reporting keys tie to the wermgr load path. Modifications to these around the alert can indicate the attacker weakened search-order protections or staged the error-reporting trigger to force the load. Read the modified key, its new data, and the writing process; changes to these hives outside a patch or managed configuration are noteworthy.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\Kernel\DevOverrideEnable'
          - '\Session Manager\SafeDllSearchMode'
          - '\Image File Execution Options\'
          - '\Windows Error Reporting\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The hijack rarely lands alone. Aggregating process activity around the load surfaces what led to it — the directory-creation exploit, the DLL drop, the trigger that forced the load — and what followed, such as reconnaissance or additional persistence executed under the newly gained privileges. Novel parent-child pairs stand out at low counts against the high-volume OS and agent telemetry.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a directory-creation or ACL-modification exploit, a suspicious download, or defense tampering — may reveal the stages that set up the redirection folder and help reconstruct the timeline. A comctl32.dll hijack following an earlier privilege-abuse alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Privilege escalation is usually a means to an end; after gaining SYSTEM through the DLL hijack, an actor commonly installs durable footholds using scheduled tasks, services, registry Run keys, or other tooling. Persistence-tool executions clustered in the same timeframe as the hijack indicate intentional follow-through rather than an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses process-based detection: dropping an executable into a Startup folder or a path named by a Run value achieves autostart without invoking a scheduling or registry tool. A drop to one of these locations alongside the DLL-hijack privilege escalation points to the attacker converting a one-time SYSTEM execution into a durable foothold.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for creating a redirection folder under System32?
  context: >-
    Creating a `.exe.local` folder under System32 and staging a system DLL inside it is not routine administration and would rarely appear in a legitimate change. A corresponding ticket or deployment record — for a specialized software installer or a compatibility workaround — could explain a benign case; its absence, given that these folders enable SYSTEM-level DLL loading, points toward unauthorized activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does an administrator recall creating this folder or staging this DLL?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If an administrator recalls a compatibility or testing workaround that stages a redirected DLL, the folder and file should match that work; if no one recalls it, the redirection folder and its comctl32.dll are likely attacker-planted. When the action confirms, capture why it was done and what the DLL is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
