name: Enable Microsoft Dynamic Data Exchange
id: ccb188cd-4882-4496-8836-a2a8c8ddbb92
description: |
  Detects a registry modification that enables the Dynamic Data Exchange (DDE) protocol in Microsoft Office — EITHER Word's AllowDDE value set to 0x00000001 or 0x00000002, OR one of Excel's DisableDDEServerLaunch / DisableDDEServerLookup values set to 0x00000000. DDE lets an Office document launch external commands without macros, so enabling it is a prerequisite an attacker sets so a follow-on document can spawn a command interpreter (cmd, powershell, mshta) from Word or Excel. Modern Office disables DDE by default, so the investigation should determine which process wrote the setting, whether it was a sanctioned configuration change, whether an Office application subsequently spawned an interpreter, and whether the setting was later reverted. Because registry value deletion is not observable in this telemetry, judge cleanup from the key's re-modification history rather than a delete event.
type: detection
detection_id: 63647769-326d-4dde-a419-b925cc0caf42
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alert show DDE being enabled in Word or Excel, and which branch fired?
  context: >-
    The rule fires when a value is written that enables Office DDE — EITHER the Word ...\Word\Security\AllowDDE value set to DWORD 0x00000001 or 0x00000002, OR an Excel ...\Excel\Security\DisableDDEServerLaunch or DisableDDEServerLookup value set to DWORD 0x00000000. Confirm the exact TargetObject and Details against these criteria and note which application's setting changed, because the Word and Excel branches point the downstream execution checks at different host applications.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Office DDE security settings?
  context: >-
    Modern Office ships with DDE disabled, and routine workstation use rarely re-enables it. A legacy line-of-business application or a managed policy deployment can legitimately set these values, so confirm whether the account and host function fit that activity. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account or SYSTEM, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Office DDE setting was changed, and what does that key control?
  context: >-
    The AllowDDE value under a Word Security key and the DisableDDEServerLaunch / DisableDDEServerLookup values under an Excel Security key all govern whether Office honors Dynamic Data Exchange requests. Enabling them re-opens a macro-free execution path in which a crafted document can drive an external command. Read the exact key path and the writing process here, and let the value-decoding question carry the interpretation of the data written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written, and does it enable or disable DDE?
  context: >-
    For the Word key, DWORD 0x00000001 or 0x00000002 turns DDE on; for the Excel keys, DWORD 0x00000000 clears the server-launch or server-lookup restriction, which also enables DDE. Any of these move the host from the secure default to a state where a document can trigger external execution. Details is present on roughly 79% of registry modifications; if it is absent, treat the key path alone as the signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did Word or Excel spawn a command interpreter on this host after DDE was enabled?
  context: >-
    The payoff of enabling DDE is a document that makes an Office application launch an external command. Look for WINWORD.EXE or EXCEL.EXE spawning cmd, powershell, mshta, wscript, cscript, rundll32, or regsvr32 in the hours after the setting changed; such a parent-child pair is the DDE execution firing. Absence means the setting is enabled but no document has exercised it yet.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_office_parent:
        ParentImage|endswith:
          - \WINWORD.EXE
          - \EXCEL.EXE
      selection_child:
        Image|endswith:
          - \cmd.exe
          - \powershell.exe
          - \pwsh.exe
          - \mshta.exe
          - \wscript.exe
          - \cscript.exe
          - \rundll32.exe
          - \regsvr32.exe
      condition: all of selection_*
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did Word or Excel load unusual or unsigned modules around the time DDE was enabled?
  context: >-
    DDE-driven execution and malicious add-ins can pull modules into Office that normal document editing never loads. Review the DLLs loaded by WINWORD.EXE or EXCEL.EXE and their signature state; an unsigned module, a module signed by an unexpected publisher, or one loaded from a user-writable folder is worth pursuing. Compare the loaded modules against the set Office is expected to load in this environment.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \WINWORD.EXE
          - \EXCEL.EXE
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Were executables or scripts written to user-writable folders on this host around the DDE change?
  context: >-
    A DDE payload commonly downloads or drops a second-stage binary or script before running it. File writes of executable or script content into Temp, AppData, ProgramData, or Public around the registry change can be the staged payload the DDE execution pulls in. The file-write event carries no hash; if a candidate file is present, hash it from a later execution for a reputation check.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_host:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetFilename|contains:
          - \Temp\
          - \AppData\
          - \ProgramData\
          - \Users\Public\
      selection_ext:
        TargetFilename|endswith:
          - .exe
          - .dll
          - .ps1
          - .js
          - .vbs
          - .hta
          - .bat
          - .cmd
          - .scr
      condition: all of selection_*
    fields:
      - TargetFilename
      - Image
      - User
- question: Was the DDE setting changed again or reverted to its disabled state after this alert?
  context: >-
    A short-lived enable-then-disable of DDE can indicate an actor who toggled the setting only long enough to run a document, then restored it to avoid leaving the host in an obviously weakened state. Review later modifications to the same key: a return to the secure value (Word AllowDDE set back to 0, Excel restrictions set back to 0x1) shortly after the enable is a re-modification worth correlating with any execution in between. Value deletion is not recorded in this telemetry, so judge reversion from re-modification events, not from an absence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this Office DDE key been modified before on this host?
  context: >-
    A first-time change to a DDE security value is more suspicious than a setting that shifts routinely with software configuration. Review the historical Details values on this host: a key never touched before, or one whose value moves from the secure default only now, stands out. Zero history indicates the setting has not been changed on this host in the retained window.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor preparing Office for DDE abuse often relaxes several protections together — lowering macro warnings, disabling Protected View, or clearing other Office security policies alongside the DDE toggle. Clusters of registry writes from the same process in a short window reveal the full scope of the configuration change. The triggering key appears in the results; the signal is what else was modified. If the host is registry-noisy, narrow to the writing process or to Office and security-policy hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process wrote this DDE setting, and what started that process?
  context: >-
    The writing process on the alert is the immediate actor; tracing its parent shows whether the chain is benign — a management agent or an administrator running a configuration tool — or suspicious, such as a script host or an Office application spawning the process that changed the setting. If the parent process identifier resolves to NODATA, fall back to the writing process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was this DDE setting enabled on other hosts in the environment?
  context: >-
    The same DDE-enabling change across multiple hosts can indicate a policy or software push, or a broader operation touching many machines; a single-host change is more consistent with targeted activity. Compare the Details and writing process across hosts — a uniform value from a management process points to managed configuration, while varied writers or values per host point to hands-on activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Enabling DDE rarely lands in isolation. Aggregating process activity around the change surfaces what led to it and what followed — a document opening, a download or dropper, reconnaissance, or additional configuration changes. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious document, a phishing-delivered file, defense tampering, or reconnaissance — may reveal the stages that preceded the DDE change and help reconstruct the timeline. A configuration change following an earlier delivery or execution alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is there a change record or business justification for enabling Office DDE on this host?
  context: >-
    A small number of legacy applications rely on DDE and may require it enabled by policy. A corresponding change ticket, deployment record, or documented application requirement suggests authorized activity; the absence of one, given that DDE is disabled by default for security, points toward unauthorized modification. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
