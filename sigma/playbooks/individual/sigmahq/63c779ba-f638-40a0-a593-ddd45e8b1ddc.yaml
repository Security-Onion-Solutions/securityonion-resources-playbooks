name: EventLog EVTX File Deleted
id: 6c8a7843-4203-4d47-96ec-c25e26b29dcf
description: |
  Fires when a file whose path starts with C:\Windows\System32\winevt\Logs\ AND whose name ends
  in .evtx is deleted — the on-disk backing file for a Windows event log channel. Removing the
  .evtx file is the blunt form of indicator removal (T1070): the record an analyst would use to
  reconstruct logons, process starts, and service changes on this host is gone from disk.
  Deletion is not automatically an attack — log rotation and archiving, disk-cleanup tooling,
  imaging and reprovisioning, and backup or migration software all touch .evtx files — so the
  triage questions are which process performed the delete, what its command line was, which
  account it ran under, and whether a maintenance window explains it. Because the destroyed
  evidence is the evidence you would normally investigate with, work the surviving sources:
  forwarded or centrally collected copies of the same channel, the log-cleared records the
  system writes about itself (1102 on the Security channel, 104 on the System channel), the
  Archive-*.evtx rotation copies still in the directory, endpoint process telemetry, and the
  same channel on other hosts.
type: detection
detection_id: 63c779ba-f638-40a0-a593-ddd45e8b1ddc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the deleted path sit under the Windows event log directory with an .evtx extension, and which process performed the delete?
  context: >-
    The rule fires only on files under C:\Windows\System32\winevt\Logs\ that end in .evtx. Confirm the
    operation really was a deletion rather than a create or rename of the same path, and read the responsible
    process off the event. The signer columns attribute that process to a vendor; judge whether the signer is
    coherent with something that should be removing an event log backing file, not whether it is trusted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event

- question: Is this account and this host expected to delete event log files?
  context: >-
    Log rotation, archiving, disk-cleanup tooling, imaging and reprovisioning, and backup or migration
    software all remove .evtx files, and most of that runs as SYSTEM or a machine account rather than an
    interactive user. When the account is a service principal, judge by the acting program and the host's
    role instead of the identity, and check whether a maintenance or build window covers the timestamp.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge

- question: Was the log file recreated after the deletion, or is the channel still missing its backing file?
  context: >-
    The Event Log service recreates a channel's .evtx file when the service or the host restarts, which
    resets the record to empty and produces a create event on the same path. A recreate shortly after the
    delete leaves the channel collecting again but with no history before that point; no recreate at all
    means the channel is not writing and the visibility gap is still open. Either way, events written before
    the deletion survive only in forwarded or centrally collected copies.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review

- question: What process deleted the log file, what was its full command line, and what launched it?
  context: >-
    The file event names the acting process but carries neither its command line nor its parent. Pulling that
    process's own start event answers the question the alert cannot - wevtutil, PowerShell Clear-EventLog or
    Remove-Item, a cleanup utility, or a direct unlink from a script host each read very differently. Rotation
    and cleanup tooling has predictable parents such as services.exe or taskeng.exe; a parent like cmd.exe under
    a script host, or a parent chain rooted in a remote-execution service, points at hands-on activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation

- question: Which event log channel lost its backing file, and does the command line target one channel or the whole directory?
  context: >-
    The channel named in the deleted path determines what evidence is gone and what the investigation loses -
    Security removes logon and privilege-use records, System removes service and driver history, and endpoint
    or PowerShell operational channels remove process and script records. Read the command line for whether it
    names a single file or walks C:\Windows\System32\winevt\Logs\ as a directory, and for whether the same
    invocation also cleared channels through the log API rather than deleting them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation

- question: Was one channel removed, or were multiple .evtx files deleted on this host in the same window?
  context: >-
    A single .evtx deletion is consistent with per-channel maintenance or an archive step. Several channels
    removed together, or a sweep of the directory, is the profile of a wipe rather than housekeeping. The
    acting process and account on each deletion tell you whether one program did all of them and whether that
    program is the same one named in the alert.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
        TargetFilename|endswith: .evtx
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review

- question: Did the Security channel record a log-cleared event around the deletion, and which account did it name?
  context: >-
    Clearing the audit log is itself audited - the Security channel writes event 1102 with the account that
    performed it, and that record survives in any forwarded or centrally collected copy even when the on-disk
    file is gone. A 1102 next to the file deletion means the log was emptied through the log API before or
    instead of the file being removed, and it hands back the actor identity the file event may not carry.
    Channels other than Security record their own clearing as event 104 on the System channel, which is a
    separate check. If this channel is not collected in this environment, treat zero results as a visibility
    gap rather than evidence that nothing was cleared.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1102
      condition: selection
    fields:
      - EventID
      - User
      - host.name
  answer_sources:
  - manual_review
  - organizational_knowledge

- question: Was the event log configuration in the registry modified on this host around the deletion?
  context: >-
    Indicator removal reaches the registry as well as the file system. The per-channel settings under
    \Services\EventLog\ control the backing file path, maximum size, retention, and autobackup, and the
    \WINEVT\Channels\ keys control whether a channel is enabled at all. A file deletion paired with a
    retention change, a redirected file path, or a channel disabled outright is a durable suppression of
    logging rather than a one-off cleanup, and it means the channel will not repopulate on its own.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        TargetObject|contains:
          - '\Services\EventLog\'
          - '\WINEVT\Channels\'
      condition: selection and selection_paths
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review

- question: Is this channel logging again now, or is the host still running without it?
  context: >-
    A deleted .evtx leaves the channel without a backing file until the Event Log service recreates it, and a
    channel that is disabled or misconfigured stays dark indefinitely. Confirm on the host whether the Event
    Log service is running, whether the channel is enabled and writing, and whether forwarding for it is
    intact, before treating any later "no results" answer on this host as evidence of absence.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review

- question: What other files did the responsible process write or delete around the alert?
  context: >-
    The breadth of the acting process's file activity separates a targeted log removal from a program doing
    bulk work. A process that only touched the event log directory is doing one thing; one that also removed
    backups, prefetch entries, temp artifacts, or its own dropped files is cleaning up after something else.
    Cleanup utilities and imaging tools legitimately touch thousands of paths - for those, read where the
    writes and deletes land rather than counting them.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event

- question: What else has been written to the event log directory in the past week, and by which processes?
  context: >-
    A small set of programs legitimately touches C:\Windows\System32\winevt\Logs\ - the Event Log service
    itself, backup and archiving agents, and cleanup tooling. The directory's recent history shows the normal
    cadence for this host and whether the alerting process appears in it at all. It also surfaces the
    Archive-*.evtx rotation copies, which may still hold the records the deleted channel lost and are a
    recovery path alongside forwarded copies, shadow copies, and backups.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\System32\winevt\Logs\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event

- question: What ran on this host in the hour after the log file was deleted?
  context: >-
    Evidence destruction is usually placed around the activity it is meant to conceal, so the window after the
    deletion is where the concealed work would appear. Note that the deletion itself removes the channel's own
    record of that window, so process telemetry from the endpoint is the surviving view and any gap in the
    event log for this period is expected rather than informative.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User

  answer_sources:
  - process_creation

- question: Were other defense tampering actions performed on this host around the deletion?
  context: >-
    Removing a log file is one of several ways to reduce what a host records or recovers. Clearing logs
    through wevtutil or Clear-EventLog, deleting shadow copies, disabling recovery, stopping the Event Log or
    Defender services, and changing firewall rules commonly appear together in one operation. Several of these
    from the same account or parent process in one window points to deliberate preparation rather than
    housekeeping; a single maintenance tool running a scripted cleanup can also produce them.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation

- always_include: true
  question: Has this account deleted event log files before, and does that history fit its role?
  context: >-
    The query mirrors the rule's own selection scoped to this account, so the result is that account's 90-day
    history of deleting .evtx files under the Windows event log directory, aggregated by host. An account that
    routinely produces this pattern across many hosts is almost always a backup, imaging, or cleanup identity;
    an account that has never produced it before is the deviation worth chasing. Weigh the count against what
    the identity is provisioned to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
        TargetFilename|endswith: .evtx
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge

- always_include: true
  question: Has this program deleted event log files before, or is it new for this activity?
  context: >-
    File deletions in the event log directory frequently run under SYSTEM or a machine account, where the
    identity attributes nothing, and the file event carries no parent to pivot on. The acting program is the
    meaningful pivot - this query mirrors the rule's selection scoped to the alerting binary, so the result is
    that program's 90-day history of deleting .evtx files, by host. A program already accounting for thousands
    of these is vendor or operating-system maintenance; one that has never done it before is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
        TargetFilename|endswith: .evtx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation

- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the deletion was one step
    in a session that spans machines. If the alert fired under a service principal or machine account, this
    view returns routine agent and operating-system telemetry from across the fleet and is not attributive -
    read the acting-program questions instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation

- always_include: true
  question: Did this same program delete event log files on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection scoped to the alerting binary, fleet-wide, in the alert window.
    Several hosts deleting .evtx files at once through the same program points to scheduled or pushed
    automation - a maintenance job, an imaging run, or a management-tool task. A single host points to a
    host-local trigger and keeps the investigation on this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
        TargetFilename|endswith: .evtx
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation

- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Evidence destruction usually follows the activity it is meant to hide, and this host's own event log can
    no longer be relied on to reconstruct that period. Earlier detections - credential access, privilege
    escalation, remote execution, or reconnaissance - are a surviving timeline of what preceded the deletion
    and give the deletion its meaning.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
