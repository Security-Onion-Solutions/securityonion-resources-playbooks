name: UAC Bypass Using EventVwr
id: 7f7009f0-5f96-4b86-a7b9-73f19d3dddd7
description: |
  Detects a write to the Event Viewer RecentViews file (\Microsoft\Event Viewer\RecentViews, or the 8.3 short-name alias \Microsoft\EventV~1\RecentViews) by a process located outside C:\Windows\System32 and C:\Windows\SysWOW64. eventvwr.exe reads and .NET-deserializes this file at startup; when a non-system, typically medium-integrity process plants a crafted serialized object at that path, launching Event Viewer triggers unsafe deserialization and runs an attacker-chosen command at high integrity without a consent prompt. The alert fires when the RecentViews path is written AND the writing process is not a legitimate system binary — eventvwr.exe writes RecentViews itself from System32 and is excluded, so a non-system writer is unusual. The investigation should determine which process wrote the file, what the file contains, whether eventvwr.exe subsequently ran and spawned an elevated child, and what that elevated process did.
type: detection
detection_id: 63e4f530-65dc-49cc-8f80-ccfa95c69d43
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was the RecentViews file under the Event Viewer folder written by a process outside System32 and SysWOW64?
  context: >-
    Before investing investigation time, confirm the alert is a true positive: the rule fires when a file named RecentViews is written under \Microsoft\Event Viewer\ (or the 8.3 short-name \Microsoft\EventV~1\) AND the responsible process is not located in C:\Windows\System32 or C:\Windows\SysWOW64. Read the exact path and the writing process here — legitimate Event Viewer state is written by eventvwr.exe from System32 and is excluded, so a medium-integrity or user-directory writer is the signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write to the Event Viewer RecentViews path outside normal Event Viewer use?
  context: >-
    Legitimate use of Event Viewer updates RecentViews through eventvwr.exe itself, not through a separate process. Knowing whether the account and host function are consistent with a non-system process writing that file is often the fastest path to separating a true positive from an unusual but benign operation. When the user is a machine account (HOST$) or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the planted RecentViews file still on disk, or was it deleted or overwritten after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A serialized payload still on disk can be retrieved, hashed, and analyzed; a file deleted or overwritten shortly after creation suggests anti-forensic cleanup and shifts the investigation to what eventvwr.exe deserialized in between. Interpret the operation type on the path over the following hours.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What was the command line of the process that wrote the RecentViews file?
  context: >-
    The writing process is the planter; its command line reveals how the payload was produced or delivered — for example a redirect that writes a serialized object to the path, or a copy that stages a prepared file into %LOCALAPPDATA%\Microsoft\EventV~1\. Decode any flags, redirection, encoded content, or file paths in the command to understand the delivery step. The command line is not carried on the file event itself, so this reads it from the writing process's own creation event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What does the planted RecentViews file contain, and is it a serialized .NET object rather than legitimate Event Viewer state?
  context: >-
    Legitimate RecentViews is small binary state maintained by eventvwr.exe; a malicious one is a serialized object (a deserialization gadget) crafted to run a command when Event Viewer loads it. Retrieve the file and inspect its content: look for embedded command strings, interpreter references, or serialized-object markers. Content retrieval is manual from the endpoint; if the file is present, hash it offline and compare against threat intelligence to establish whether the payload is known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned the one that wrote RecentViews, and is that parent chain expected?
  context: >-
    The writer is typically a medium-integrity process; tracing its parent reveals how the plant was invoked. A shell, script host, or Office application launching the process that wrote RecentViews points to exploitation, while a routine interactive session is more consistent with benign activity. If the parent process identifier resolves to NODATA, fall back to the writing process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was eventvwr.exe launched on this host after the RecentViews file was planted?
  context: >-
    The file itself is not executed as a process — it is deserialized by eventvwr.exe when Event Viewer starts, which is what triggers the payload. An execution of eventvwr.exe on this host after the plant is the load-and-fire step; note whether it ran at high integrity. Absence means the payload is staged but has not yet been triggered.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\eventvwr.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What other files did the process that wrote RecentViews create or delete around the alert?
  context: >-
    A process that plants one payload often stages several — a serialized-object generator, its output file, or additional droppers. The breadth, paths, and extensions of the writing process's other file activity distinguish a single artifact from a staging sequence and enumerate what else needs review. The alert's file event carries the responsible process identifiers, so this covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written under the Event Viewer application-data folder recently, and by which processes?
  context: >-
    Only eventvwr.exe normally writes under \Microsoft\Event Viewer\ (the 8.3 short-name \Microsoft\EventV~1\ resolves to the same folder). Other recent arrivals in that directory, or an unfamiliar writing process, reveal whether this is an isolated plant or a location under active use. A single non-system writer across the folder is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Microsoft\Event Viewer\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did the high-integrity child process do after eventvwr.exe deserialized the payload?
  context: >-
    The bypass is a means to an end -- the deserialization runs an attacker-chosen command at high integrity. Examining processes running at High or System integrity on this host shortly after the trigger reveals the objective: installing persistence, dumping credentials, tampering with security tooling, or accessing protected resources. This is the payoff the plant was built to reach.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were registry modifications made to set up a UAC bypass on this host?
  context: >-
    The Event Viewer bypass has a companion variant that hijacks a per-user shell-handler registry key (mscfile\shell\open\command) that eventvwr.exe consults to locate mmc.exe; other auto-elevated binaries are abused the same way through ms-settings and Folder handler keys. A reg, powershell, or cmd invocation writing one of those keys around this event corroborates deliberate escalation and reveals the exact payload set to run elevated.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege-escalation techniques attempted on this host?
  context: >-
    Operators who attempt one UAC bypass often try several methods until one succeeds, especially if the OS build blocks a particular path. Other privilege-escalation or bypass alerts on this host in a short window confirm deliberate escalation activity rather than a false positive and help place this plant in the attack timeline.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other process activity occurred on this host around the time of the plant?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the write surfaces what led to it and what followed — reconnaissance, a download or dropper, or additional persistence. Novel parent-child pairs stand out at low counts against the high-count agent and OS telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- always_include: true
  question: Has this user previously produced this RecentViews plant pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's own selection scoped to this user, so the result is the user's 90-day history of a non-system process writing the Event Viewer RecentViews path, aggregated by host — not generic file activity. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft\Event Viewer\RecentViews
        - \Microsoft\EventV~1\RecentViews
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the RecentViews plant pattern here or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of this program producing this specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft\Event Viewer\RecentViews
        - \Microsoft\EventV~1\RecentViews
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple endpoints. If the same account triggered related activity on other hosts in the same window, the scope of compromise may be larger than this one plant. This asks what the user did right now across the network, distinct from their long-term baseline.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven plant pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, network-wide user activity returns agent-telemetry noise. The meaningful question is whether the same launch mechanism produced the RecentViews plant elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
        - \Microsoft\Event Viewer\RecentViews
        - \Microsoft\EventV~1\RecentViews
      filter:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
