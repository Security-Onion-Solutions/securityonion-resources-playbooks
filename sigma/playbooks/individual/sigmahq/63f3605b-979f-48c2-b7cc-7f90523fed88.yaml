name: Potential Suspicious Child Process Of 3CXDesktopApp
id: d78defd7-aa7d-4d9d-8d6f-ad14f75b5d09
description: |
  Detects 3CXDesktopApp.exe spawning a command interpreter, script host, or system binary
  commonly used to proxy execution — cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe,
  regsvr32.exe, rundll32.exe, or wscript.exe. A softphone is an Electron desktop application with
  no routine need to launch a shell or a signed system binary that loads external code, so the
  parent-child pairing itself is the signal regardless of what produced it: a trojanized or
  side-loaded module inside the application, an installer or updater helper running under the app,
  or hands-on activity through a process the application already owns. The investigation should
  determine whether the application binary and the modules it loaded are the vendor's own, what the
  child process actually did, and whether the same parent-child pairing appears on other hosts —
  application-level compromise reaches the whole install base at once, while a single host points
  to a host-local cause.
type: detection
detection_id: 63f3605b-979f-48c2-b7cc-7f90523fed88
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting event show 3CXDesktopApp.exe as the parent and one of the rule's eight
    interpreter or proxy-execution binaries as the child?
  context: >-
    The rule fires only when both halves match together — the parent path ends in
    3CXDesktopApp.exe AND the child image ends in cmd.exe, cscript.exe, mshta.exe, powershell.exe,
    pwsh.exe, regsvr32.exe, rundll32.exe, or wscript.exe. Confirm both before investing further
    time; a mis-parsed parent path or a same-named unrelated binary is the cheapest thing to rule
    out first.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this host and user expected to run a softphone that launches shells or script hosts?
  context: >-
    Establish the baseline expectation before analysing the command. A workstation with the desktop
    softphone installed is normal; the application launching an interpreter is not part of ordinary
    call handling. If a support workflow, an IT-deployed helper, or a vendor update routine is known
    to invoke a shell under this application, that is the fastest benign explanation to confirm or
    eliminate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: >-
    Where does the alerting 3CXDesktopApp.exe live, what started it, and does its own lineage look
    like a normal application launch?
  context: >-
    This retrieves the parent's own creation event, including its full path, command line, and
    grandparent. A softphone started from its installed program directory by explorer.exe or the
    user's shell is an ordinary launch; one started from a user-writable or temporary directory, or
    from an unexpected grandparent, points at a relocated or replaced copy of the application rather
    than the installed one. The parent's command line also shows whether it was launched with
    unusual arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same 3CXDesktopApp.exe instance spawn?
  context: >-
    One interpreter under the application is an anomaly; a sequence of them is an operation. Siblings
    show whether the application launched a single helper or drove a chain of interpreters,
    reconnaissance binaries, and proxy-execution utilities. If the parent process identifier is not
    populated on the alert, the host scope in this query still returns the surrounding process
    activity for manual correlation.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: >-
    What did the child process actually execute — read its full command line and working directory
    and identify the operation.
  context: >-
    Parse every argument. For cmd.exe or the PowerShell hosts, identify the command being run and any
    download, encoding, or execution-policy arguments. For rundll32.exe or regsvr32.exe, identify the
    module path and exported entry point, and note whether the module is remote or lives in a
    user-writable directory. For mshta.exe, cscript.exe, or wscript.exe, identify the script or URL
    being fetched. The working directory often reveals where the operation was staged.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: >-
    If the child is powershell.exe or pwsh.exe, check for -EncodedCommand / -enc base64 payloads and
    for string concatenation, backtick escaping, or variable substitution used to hide the operation.
    Decoding reveals what actually runs — a download cradle, a reverse shell, or an in-memory .NET
    assembly load. If the child is one of the non-PowerShell binaries, apply the same reading to its
    arguments, which are frequently URL-encoded or split across parameters.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell executed, even when the command
    line was encoded — it is the ground truth for what ran under the application parent. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence nothing ran, and decode the alerting command line directly instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: >-
    Execution-policy bypass flags, AMSI tampering, real-time monitoring changes, and version-2
    downgrade invocations frequently precede a payload launched through an interpreter. Finding one
    of these in the hour before the alert places the child process at a later stage of an operation
    rather than at its start.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: >-
    What modules did 3CXDesktopApp.exe load on this host, and are they all signed by the expected
    vendor?
  context: >-
    An Electron desktop application that spawns an interpreter is often doing so from code loaded
    into it rather than from its own logic, so the module list is where the cause usually shows.
    Library-load events carry the signer, signature status, and hash of each module, so an unsigned
    module, a module whose signature does not validate, a module signed by an unrelated party, or a
    bundled library loaded from a path outside the installation directory can be identified and
    reputation-checked directly. Compare the loaded module set against a known-good install of the
    same application version.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\3CXDesktopApp.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Where did 3CXDesktopApp.exe connect on this host around the time of the alert?
  context: >-
    A softphone makes call-signalling and media connections to the organisation's own PBX and to the
    vendor's provisioning endpoints, so its expected destination set is narrow and knowable. Egress to
    destinations outside that set — particularly steady, low-volume connections to hosts unrelated to
    telephony — is the network-side counterpart of the process anomaly. Destination hostnames are
    resolved by a separate lookup event and are frequently absent here, so work from the destination
    addresses and pivot to name resolution for attribution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\3CXDesktopApp.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Has 3CXDesktopApp.exe spawned this child binary on this host before?
  context: >-
    Historical frequency of this exact parent-child pairing separates a routine helper invocation from
    a novel one. Zero or near-zero counts over 90 days mean the application has not launched this
    binary on this host in its recorded history, which is the more common outcome for a softphone. A
    steady prior count points to a local automation or support workflow that should be identifiable by
    name.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This mirrors the rule's own selection scoped to the alerting user, so the result is the user's
    90-day history of the softphone spawning one of these binaries — not generic use of cmd.exe or
    PowerShell, which every user produces constantly. A user who has never produced this pairing is a
    different finding from one who produces it weekly; weigh the count against their role and whether
    they are known to script against the application.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \3CXDesktopApp.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: >-
    Has this parent application historically driven this pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behaviour and
    the launch mechanism is the meaningful pivot. This mirrors the rule's selection scoped to the
    alerting parent, so the result is the 90-day history of the softphone driving this specific
    pattern rather than generic parent-and-binary co-occurrence. A parent that already accounts for a
    large prior volume is vendor or deployment automation; a parent that is new for this pattern is
    the deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \3CXDesktopApp.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the alerting user's process activity on every host in the surrounding hour shows whether
    the activity stayed on this endpoint or extended to others. If the alert fires under a service or
    machine principal, this view fills with routine service-owned process telemetry and the
    parent-anchored fleet view is the one that carries meaning.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    This mirrors the rule's selection scoped to the alerting parent across the environment inside the
    alert window. Several hosts producing the pattern within the same hour points at something pushed
    or triggered across the install base at once — an update, a deployment, or a change in the
    application itself. A single host points at a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \3CXDesktopApp.exe
        Image|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \wscript.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pairing on the host in the surrounding half hour collapses repetitive
    service and agent telemetry into high-count rows while novel pairings stand out at low counts. Scan
    for reconnaissance binaries, credential-access tooling, or persistence utilities appearing near the
    alert, and for other applications spawning interpreters in the same window.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host place this event in a sequence — defense tampering or
    reconnaissance beforehand argues the interpreter launch is a later stage, while an empty preceding
    window argues the application parent is the entry point rather than a consequence of something
    already underway.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is 3CXDesktopApp.exe spawning this child binary on other hosts across the environment?
  context: >-
    This is the question that separates a host-local problem from an application-level one. A desktop
    application is deployed identically to everyone who has it, so if its build or one of its modules
    is the cause, the same parent-child pairing surfaces across many hosts within a short window,
    often on machines with nothing else in common. A single host with the pairing points instead at
    something local — a relocated copy of the application, a locally staged module, or hands-on
    activity. Count the distinct hosts before deciding scope.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
