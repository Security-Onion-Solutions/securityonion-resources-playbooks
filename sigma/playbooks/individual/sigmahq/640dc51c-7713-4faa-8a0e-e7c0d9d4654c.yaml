name: FoggyWeb Backdoor DLL Loading
id: 65a5aabc-6ca8-42d2-8c60-2f7b5e00bfe0
description: |
  Detects a load of version.dll resolved from the AD FS directory (C:\Windows\ADFS\version.dll) instead of the legitimate copy under System32. The FoggyWeb backdoor stages a malicious version.dll in the AD FS folder so that DLL search-order hijacking loads it into the AD FS service process, where it decrypts a memory-resident payload and starts an in-process HTTP listener used for command-and-control and to exfiltrate AD FS configuration and token-signing material. A load from this path is not expected on a genuine AD FS server; the investigation should confirm the loading process, verify the module's signature and hash, determine how and when the file reached the ADFS folder, and look for the decrypted payload's network and file activity.
type: detection
detection_id: 640dc51c-7713-4faa-8a0e-e7c0d9d4654c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects for its path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive: the load is version.dll resolved from C:\Windows\ADFS rather than the legitimate copy under System32. Review the exact module path (ImageLoaded), its code-signature status, and the process that loaded it against the rule's detection criteria. A DLL-load event carries the module's signing status and hash directly, so the true-versus-false-positive split can begin here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host a designated AD FS server, and is the account running the loading process the expected service identity?
  context: >-
    A version.dll under the ADFS folder is only meaningful on an AD FS server; a load on a host that does not run AD FS is anomalous on its own. The loading process normally runs under a dedicated AD FS service account. Confirm the host role and the running identity — a machine account or SYSTEM is expected for the service, an interactive user is not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the version.dll loaded from the ADFS folder signed and valid, and what is its hash reputation?
  context: >-
    The legitimate version.dll is a Microsoft-signed system module under System32. A copy in the ADFS folder that is unsigned, carries an invalid or untrusted signature, or a signature subject that is not Microsoft is a masquerading indicator. SignatureStatus values of Unsigned, Expired, Distrusted, or Invalid on this module point to a tampered or planted file. Pivot the Hashes value to threat intelligence — a known loader hash confirms the finding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What other modules did the AD FS service process load, and are any from non-canonical paths, unsigned, or unexpected?
  context: >-
    Beyond the flagged version.dll, the modules this process loaded can reveal additional side-loaded or in-memory components. For a search-order hijack, focus on modules resolved from the application's own directory instead of System32, unsigned modules where signed ones are expected, and names that mimic a system DLL but load from a non-system path. The decrypted payload is memory-resident, so a missing extra on-disk DLL does not clear the host.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the process that loaded this DLL, and what are its image path, command line, and working directory?
  context: >-
    The load resolves under the AD FS service host, a managed .NET service that imports version.dll through a delay-load chain. Confirm the loading image is the genuine service binary from its expected location and that its command line and working directory match a normal service start. A version.dll load under an unexpected process, or a service host launched from a non-standard path, changes the interpretation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process started the AD FS service host, and is that parent chain the expected service launch?
  context: >-
    The AD FS service is normally started by the service control manager as part of the host's service set. A parent other than the service control manager — a script host, an interactive shell, or an unexpected launcher — indicates the version.dll load did not occur through the genuine service startup. If the parent identifier resolves to no data, fall back to the service host binary name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has version.dll been loaded from the ADFS folder on this host before, and by which processes?
  context: >-
    A first-time load of this module from the ADFS path is a stronger anomaly than a recurring one. If the same path has loaded repeatedly under the AD FS service over the past 90 days, the current load may be routine to this environment; if this is the first occurrence, or the path has loaded under processes other than the service host, treat it as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is version.dll being loaded from the ADFS folder on other hosts in the environment?
  context: >-
    AD FS commonly runs as a farm of several servers. The same module path loading across multiple AD FS hosts points to distribution of the loader across the farm rather than a single-host event; a load on a host that is not part of the AD FS farm is unexpected regardless. Compare the loading process on each host — a consistent service host everywhere is one profile, varied loaders another.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: When and by what process was the malicious version.dll or the encrypted payload file written into these paths?
  context: >-
    The loader reaches the host as a file written into the ADFS folder, and the encrypted backdoor payload is staged under the TimeZones resources directory. Identifying the write event and the writing process shows how the files arrived — a legitimate update path versus a hands-on-keyboard drop — and the time gap between the drop and the load. The file-write event carries no hash; retrieve the file for hashing or hash it from a later execution.
  range: -90d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains:
          - '\ADFS\version.dll'
          - 'Windows.Data.TimeZones.zh-PH.pri'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
      - ProcessGuid
- question: What files did the AD FS service process and its children write around the alert?
  context: >-
    The backdoor decrypts a memory-resident payload and can download and execute further components, which land on disk as files written by the AD FS service process or its children. Correlating file writes to that process and its direct children surfaces staged tooling, dropped components, or exfiltration output. If the referenced files are still present, retrieve them for hashing and content review.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What outbound network connections did the AD FS service process make to external or rare destinations?
  context: >-
    The in-process backdoor operates over the AD FS service's own network context — it serves an HTTP listener for command-and-control and can reach out to download further components or exfiltrate AD FS configuration and token-signing material. Review the destinations the process contacted, focusing on external addresses and rarely-seen endpoints rather than the normal federation partners and update endpoints an AD FS server routinely talks to.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Did the AD FS service process spawn any child processes, such as command shells or script hosts?
  context: >-
    The AD FS service host is a managed service that does not normally spawn interactive child processes. A cmd.exe, powershell.exe, or other shell or script host launched under it indicates hands-on activity or a payload executing commands through the compromised service. Any child process here is worth checking against the service's normal behavior.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A backdoor load rarely stands alone. Aggregating process activity around the alert surfaces what preceded and followed it — reconnaissance, credential access against the AD FS databases, or additional persistence. Novel parent-child pairs stand out at low counts against the high-volume service and agent telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Reaching an AD FS server and staging a loader normally follows earlier stages — administrative access, reconnaissance, or defense tampering. Earlier detections on this host help reconstruct how the actor arrived at the point of dropping the loader and what other activity accompanied it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
