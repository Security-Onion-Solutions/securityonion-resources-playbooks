name: Renamed MegaSync Execution
id: ef9868f0-0c72-4d7f-8c0e-00260db8f9b3
description: |
  Detects a process whose embedded PE metadata identifies it as MegaSync (OriginalFileName megasync.exe) while the
  on-disk filename is anything other than megasync.exe. MegaSync is a legitimate cloud-storage client, but renaming its
  binary is a known evasion used to stage and exfiltrate data ahead of encryption. The rule fires on the metadata/name
  mismatch only; the investigation should establish the true identity of the binary, where it came from, what it did
  after launch, and whether it reached MegaSync cloud endpoints, then confirm whether any sanctioned MegaSync deployment
  could explain a renamed copy.
type: detection
detection_id: 643bdcac-8b82-49f4-9fd9-25a90b929f3b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the binary's metadata identify it as MegaSync while its on-disk name differs?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when OriginalFileName
    is megasync.exe AND the on-disk Image does not end in \megasync.exe. Compare the OriginalFileName value against the
    Image path on the alerting event to verify the rename-evasion pattern actually holds for this process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run a MegaSync cloud-transfer client?
  context: Legitimate administrative or end-user activity can trigger this detection if a sanctioned MegaSync install was
    relocated or renamed. Knowing whether this user role and host function normally involve approved cloud-storage transfer
    tooling is often the fastest path to separating routine use from staging for exfiltration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What is the actual identity of this binary based on its metadata and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the original
    tool. Here OriginalFileName resolves to megasync.exe even though the on-disk name differs. Compare the Image path against
    OriginalFileName to confirm the masquerade, and submit the file hash for reputation lookup to determine whether this is
    a stock MegaSync build, a known-bad sample, or a novel binary requiring deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: How did this renamed MegaSync binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously -- they were copied, downloaded, or dropped by a parent process.
    Tracing the file creation event for the binary reveals the delivery mechanism: a download tool, a dropper, manual copy,
    or lateral movement from another host. A stock MegaSync install path is C:\Users\{user}\AppData\Local\MEGAsync\; a renamed
    copy landing in Desktop, Downloads, Temp, or another staging directory points to deliberate placement for evasion.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What exactly did this renamed MegaSync process do? Decode its full command line.
  context: The full command line reveals the operation. MegaSync and the related MegaCmd client accept transfer arguments,
    account credentials, and remote sync targets; decode any flags, paths, or remote folders to determine whether this
    invocation is configuring or running a data transfer rather than a benign sync.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this renamed binary and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A user double-click via explorer.exe looks different from
    launch by a script host, a remote-admin tool, or an archive utility. An unexpected parent for a cloud-transfer client
    is the parent_process dimension worth chasing and can distinguish hands-on-keyboard staging from a sanctioned launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did this binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a transfer tool is to evade detection while performing its function. Examining the child
    processes, file operations, and network activity from this binary reveals its actual objective. The same renamed binary
    appearing on multiple hosts suggests deliberate distribution rather than an isolated event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this binary or any non-browser process on the host connect to MegaSync cloud endpoints?
  context: Renamed MegaSync is used to move staged data to Mega cloud storage. Outbound connections to MegaSync hosting
    infrastructure from a process that is not a known browser are the network-side confirmation that a transfer ran. Resolve
    the destinations this process reached and correlate them with MegaSync upload activity; absence of network evidence does
    not clear the alert if outbound telemetry is incomplete for this host.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_browsers:
        Image|endswith:
          - \chrome.exe
          - \firefox.exe
          - \msedge.exe
          - \iexplore.exe
          - \opera.exe
          - \brave.exe
      condition: selection and not filter_browsers
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
  answer_sources:
  - network_connection
  - process_creation
- question: Does the command line carry remote-transfer or credential arguments rather than a plain local sync?
  context: MegaSync and MegaCmd accept arguments that specify accounts, remote sync targets, and transfer operations. Arguments
    that reference an account login, an upload or sync command, or a remote MEGA path indicate the tool is being driven to
    move data outward rather than maintaining a normal local folder sync. Treat the absence of such arguments as inconclusive
    rather than exculpatory, since transfer configuration can be persisted outside the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Has a binary with MegaSync metadata run on this host before?
  context: A renamed MegaSync binary that has never been seen on this host is more suspicious than recurring sanctioned use.
    Zero or very low historical counts for this on-disk binary indicate first-time or rare execution, which fits one-off
    staging; high recurring counts suggest an installed application that happens to carry the metadata.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the renamed-MegaSync pattern, what parents and users normally drive it, and
    does this alert fit?
  context: The query mirrors the rule's selection structure scoped to this host -- the resulting parent/user distribution
    reflects how the rule's specific firing pattern, not generic binary usage, has historically run here. A new parent
    process, an unexpected user account, or an unusual command-line structure relative to that history is the anomaly worth
    chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        OriginalFileName: megasync.exe
      filter:
        Image|endswith: \megasync.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        OriginalFileName: megasync.exe
      filter:
        Image|endswith: \megasync.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        OriginalFileName: megasync.exe
      filter:
        Image|endswith: \megasync.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or data staging across multiple endpoints.
    If the same user drove similar activity on other hosts, the scope of staging-for-exfiltration may be larger than this
    single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        OriginalFileName: megasync.exe
      filter:
        Image|endswith: \megasync.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance,
    credential access, or data collection -- may reveal the stages that preceded a renamed transfer tool launching and help
    reconstruct the full timeline ahead of any encryption.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
