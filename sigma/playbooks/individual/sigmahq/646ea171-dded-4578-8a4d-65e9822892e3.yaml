name: Process Memory Dump Via Comsvcs.DLL
id: 125b8140-690c-41fc-b7e9-00d9fb32b490
description: |
  Detects a process memory dump driven through comsvcs.dll, the COM+ Services library that exports a MiniDumpWriteDump wrapper callable from rundll32. The rule fires when either a rundll32 invocation carries comsvcs MiniDump markers (the ordinal #24, #-, #+, #65560, or the literal MiniDump string together with "full"), or a more generic obfuscated form combines "24", "comsvcs", and "full" with spacing or comma variants used to evade naive string matching. This primitive is the canonical hands-off way to dump LSASS memory for offline credential extraction, but the same call can target any readable process. Investigation should confirm which process was dumped, where the dump landed, whether the caller held the privilege needed to read LSASS, and whether credential theft was followed by lateral movement.
type: detection
detection_id: 646ea171-dded-4578-8a4d-65e9822892e3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match either comsvcs MiniDump branch this rule detects?
  context: >-
    This rule fires on either of two branches, so confirm which one matched before investing time. The first branch is a
    rundll32 process whose command line pairs "comsvcs" and "full" with a dump marker (the ordinal #24, the padded forms #-,
    #+, #65560, or the literal MiniDump). The second branch is a more obfuscated form combining "24", "comsvcs", and "full"
    with spacing or comma tricks (" #", ",#", ", #", or a quoted #) that hide the ordinal from simple matching. Read the exact
    command line and note which branch fired and whether a target PID and an output file path (typically lsass and a .dmp or
    .bin filename) are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to dump process memory with rundll32 and comsvcs.dll?
  context: >-
    Legitimate use of the comsvcs MiniDump primitive is rare. Few administrative or support workflows call rundll32 against
    comsvcs.dll to dump a process, and almost none target LSASS. Knowing whether this host is a developer or support box where
    crash-dump tooling runs, and whether the acting account routinely performs memory captures, is often the fastest way to
    separate a sanctioned diagnostic from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the executing binary genuinely rundll32, and does the command line use ordinal or comma obfuscation to hide the
    comsvcs call?
  context: >-
    Two masquerading angles apply. First, confirm the binary is the real Windows rundll32: compare the Image path against the
    OriginalFileName metadata and check that it runs from System32 or SysWOW64 rather than a copied or relocated path. Second,
    the rule's generic branch exists because operators disguise the comsvcs ordinal with padded forms and comma or spacing
    tricks (#24, #-, #+, #65560, ",#", " #") so the call reads as benign at a glance. A hash lookup of the binary and a careful
    read of the obfuscated argument together establish what actually ran.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Which process was targeted for the memory dump, and what dump method and output were specified?
  context: >-
    Decode the full command line to identify the target. The comsvcs MiniDump primitive takes a target PID, an output file
    path, and the literal "full"; lsass.exe is the canonical victim, but any readable process can be dumped. Determine the
    target PID or process name, the output file path and extension (commonly .dmp or .bin), and confirm whether the marker
    is the MiniDump string or one of the ordinal forms. Other dumping syntaxes (procdump, direct NtReadVirtualMemory, Invoke-Mimikatz)
    point to a broader credential-access toolkit if present nearby. A successful dump of LSASS means every credential cached
    in memory may be exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this rundll32 process, or any child process it spawned, write a file to disk around the time of the alert, under any name?
  context: >-
    Dumping LSASS memory requires opening a handle with read access to the process, and that handle open is not observable here
    — Elastic Defend has no cross-process handle-access channel equivalent to Sysmon EID 10, so the access half of the dump
    sequence cannot be confirmed or ruled out directly. What can be observed is the file the MiniDump call produces. This query
    scopes file writes specifically to the alerting rundll32 process and its children rather than a host-wide search, so it
    also catches an output path the operator renamed away from the common .dmp/.bin/.pmd pattern. A zero-row result does not
    prove the dump failed - it may only mean the file landed outside this process tree or moved before file-event telemetry
    captured it.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was a memory dump file written to disk on this host, and where did it land?
  context: >-
    A successful MiniDump call writes the captured memory to the output path named in the command line. Common landing spots
    are user-writable or staging directories such as the user TEMP folder, C:\Windows\Temp, C:\Users\Public, or the path the
    operator chose. Locating the dump file confirms the capture completed and gives the exact artifact to preserve; the writing
    process and timestamp tie the file back to the alerting command. The standard victim pattern is lsass.exe written to a
    .dmp or .bin file, sometimes with a reversed or innocuous filename to blend in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_ext:
        TargetFilename|endswith:
          - '.dmp'
          - '.bin'
          - '.pmd'
      condition: selection and selection_ext
    fields:
      - TargetFilename
      - Image
      - User
- question: What process spawned this rundll32, and is that parent chain expected for a memory-dump command?
  context: >-
    The parent process reveals how the dump was launched. A comsvcs MiniDump invoked from an interactive cmd.exe or powershell.exe,
    from a remote-execution service, or from an unexpected scripting host (wscript, mshta, an Office application) points to
    hands-on-keyboard or scripted credential theft. Allowlisting known legitimate parents that read LSASS (AV or EDR tooling)
    helps separate sanctioned activity. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which accounts may be exposed by this dump, and do any have elevated privileges?
  context: >-
    The severity of an LSASS dump depends on which credentials were resident in memory on this host. Interactive logons, cached
    domain credentials, and service-account tokens present at dump time may all be exposed. Cross-reference the accounts that
    have logged on to this host with directory group memberships: domain admin or other privileged credentials require incident
    escalation and credential resets, while a standalone workstation with only a local user may need narrower remediation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: When this host has previously fired this comsvcs MiniDump pattern, what parents and users drove it, and does the
    current alert fit?
  context: >-
    Even on hosts where crash-dump tooling runs, the comsvcs MiniDump pattern should have a stable parent and user profile.
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects
    how this specific firing pattern has historically run here rather than generic rundll32 usage. A new parent process, an
    unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((selection_img and 1 of selection_cli_*) or selection_generic) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A credential dump rarely stands alone. Reconnaissance, privilege escalation, additional credential-access tooling, or staging
    activity in the same window provides the immediate context for the dump and shows whether it sits inside a larger sequence.
    Aggregating by Image and ParentImage collapses repetitive agent telemetry into high-count rows while novel parent-child
    pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      _pb_scope:
        User|expand: '%User%'
      condition: ((selection_img and 1 of selection_cli_*) or selection_generic) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_img and 1 of selection_cli_*) or selection_generic) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the acting account's activity across all hosts reveals lateral movement or parallel activity on multiple endpoints.
    If the same user drove similar dump or credential-access activity on more than one host in this window, the scope of compromise
    may be larger than the single alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((selection_img and 1 of selection_cli_*) or selection_generic) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this comsvcs MiniDump pattern in the past week, and does the cross-host distribution look
    like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this specific
    firing pattern rather than generic rundll32 usage. Many hosts firing the same pattern points to scripted deployment or
    sanctioned diagnostic automation; one host or a small unrelated set points to manual operator activity. Use the host distribution
    to calibrate severity, since credential-dump tooling spreading across many endpoints is materially different from a single
    isolated dump.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      condition: (selection_img and 1 of selection_cli_*) or selection_generic
    fields:
    - host.name
- question: How often has this host fired the comsvcs MiniDump pattern over the past 90 days, and what command-line structures are
    typical?
  context: >-
    A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents. The query
    mirrors the rule's selection structure scoped to this host, so the resulting count reflects this specific firing pattern
    rather than generic rundll32 usage. The CommandLine projection lets the analyst compare typical invocation patterns against
    the alerting one and spot whether the ordinal or obfuscation form has changed.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \rundll32.exe
      - OriginalFileName: RUNDLL32.EXE
      - CommandLine|contains: rundll32
      selection_cli_1:
        CommandLine|contains|all:
        - comsvcs
        - full
        CommandLine|contains:
        - '#-'
        - '#+'
        - '#24'
        - '24 '
        - MiniDump
        - '#65560'
      selection_generic:
        CommandLine|contains|all:
        - '24'
        - comsvcs
        - full
        CommandLine|contains:
        - ' #'
        - ',#'
        - ', #'
        - '"#'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((selection_img and 1 of selection_cli_*) or selection_generic) and _pb_scope
    fields:
    - CommandLine
