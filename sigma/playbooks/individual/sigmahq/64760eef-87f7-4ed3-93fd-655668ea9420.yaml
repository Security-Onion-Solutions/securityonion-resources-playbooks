name: Use of Scriptrunner.exe
id: 4b48d202-56ec-4ba6-82d8-09699fca0d51
description: |
  Detects ScriptRunner.exe (identified by Image or OriginalFileName) invoked with the ' -appvscript ' command-line switch.
  ScriptRunner.exe is a Microsoft-signed App-V helper that can be abused to proxy execution of an arbitrary binary or a
  remote .cmd payload through a trusted signer, bypassing application allowlisting and obscuring the real process lineage.
  The rule fires only when both conditions hold together: the binary is ScriptRunner.exe AND the command line contains
  ' -appvscript '. Legitimate firing is expected where App-V is actually deployed, so the investigation should decode the
  proxied target, confirm the parent and user are consistent with App-V use, and determine whether the target binary is a
  signed managed application or an unsigned/remote payload staged for execution.
type: detection
detection_id: 64760eef-87f7-4ed3-93fd-655668ea9420
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the event match what this rule detects, with ScriptRunner.exe running and the command line containing the -appvscript switch?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both halves match together, the binary is ScriptRunner.exe (by Image or OriginalFileName) AND the command line contains ' -appvscript '. Confirm both are present, and read the value passed to -appvscript, which names the binary or remote .cmd being proxied.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run App-V virtualized applications via ScriptRunner.exe?
  context: ScriptRunner.exe is part of the App-V client; legitimate firing is expected on hosts where App-V is deployed and the user runs virtualized applications. Knowing whether App-V is actually in use on this host and whether this user's role involves virtualized apps is often the fastest path to distinguishing routine App-V activity from proxy-execution abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What target binary or remote payload did ScriptRunner.exe proxy via -appvscript, and what does that target do?
  context: 'The value passed to -appvscript names what ScriptRunner.exe is proxying: a local executable, or a remote .cmd retrieved over SMB or HTTP. Read the full argument and resolve the target. A signed managed application installed by App-V is routine; an unsigned binary, a path in a user-writable or temp directory, or a remote share path is the operator pattern this technique exploits. Note any embedded paths, share names, URLs, or IP addresses for follow-on pivots.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' -appvscript '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the -appvscript argument reference a remote location, a user-writable path, or an unsigned binary rather than an installed App-V application?
  context: The proxy-execution abuse hinges on what is being executed, not just that ScriptRunner.exe ran. The technique substitutes an arbitrary target for the expected managed application, so the argument may point to a remote SMB/UNC path, an HTTP-fetched .cmd, a temp or profile directory, or an unsigned executable. Resolve the target path, check its signing status and on-disk location, and compare against the App-V package layout to decide whether the proxied content is legitimate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: What process spawned ScriptRunner.exe, and is that parent chain expected for App-V?
  context: The parent process reveals how ScriptRunner.exe was invoked. App-V usage typically descends from the App-V client service chain or an explorer-launched virtualized shortcut. Parents like cmd.exe, powershell.exe, mshta.exe, wscript.exe, an Office application, or an archive tool indicate scripted or staged invocation rather than the App-V runtime, which points toward proxy-execution abuse. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is the parent that launched ScriptRunner.exe historically routine for this binary on this host, or a new and unusual launcher?
  context: App-V activity has a predictable parent process; proxy-execution abuse usually arrives through a different launcher (a shell, a script host, or an Office application). Comparing the current parent against the historical parents that have driven ScriptRunner.exe on this host separates established App-V automation from a one-off invocation by an unexpected process. A parent that already accounts for prior ScriptRunner.exe events is most likely the App-V runtime; a first-seen parent is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
- question: What child processes did ScriptRunner.exe spawn afterward?
  context: The processes spawned through the proxy reveal its actual impact. Legitimate App-V virtualized apps have predictable children; proxy-execution abuse commonly spawns cmd.exe, powershell.exe, certutil.exe, a script host, or the proxied target binary itself for follow-on staging. Review the children and their command lines.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did ScriptRunner.exe or its child processes make outbound network connections around the time of the alert?
  context: This technique can proxy a remote payload, and the LOLBAS pattern retrieves a .cmd from an external server or SMB share. Outbound connections from ScriptRunner.exe or its immediate children, especially to external IPs or non-domain SMB endpoints, indicate retrieval of remote content rather than execution of a locally installed App-V package. Correlate any destination here with paths or share names seen in the proxied argument.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ScriptRunner.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run ScriptRunner.exe at all?
  context: ScriptRunner.exe should only run where App-V is deployed; on a host without App-V it should never appear. Zero or very low historical counts indicate first-time or rare execution, which on a non-App-V endpoint raises the priority of the proxied-target analysis. A steady historical baseline is consistent with genuine App-V use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even on App-V hosts the -appvscript pattern has a normal pattern. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific ScriptRunner.exe firing pattern has historically run here, not generic binary usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ScriptRunner.exe
      - OriginalFileName: ScriptRunner.exe
      selection_cli:
        CommandLine|contains: ' -appvscript '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ScriptRunner.exe
      - OriginalFileName: ScriptRunner.exe
      selection_cli:
        CommandLine|contains: ' -appvscript '
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ScriptRunner.exe
      - OriginalFileName: ScriptRunner.exe
      selection_cli:
        CommandLine|contains: ' -appvscript '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ScriptRunner.exe
      - OriginalFileName: ScriptRunner.exe
      selection_cli:
        CommandLine|contains: ' -appvscript '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this ScriptRunner.exe -appvscript firing pattern, not generic binary usage. Many hosts firing the same pattern points to a scripted App-V deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \ScriptRunner.exe
      - OriginalFileName: ScriptRunner.exe
      selection_cli:
        CommandLine|contains: ' -appvscript '
      condition: all of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
