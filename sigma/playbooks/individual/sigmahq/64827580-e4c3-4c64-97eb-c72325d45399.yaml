name: SNAKE Malware WerFault Persistence File Creation
id: 257fc9d0-3dde-4ea5-8732-ad4733225fbb
description: |
  Detects a file named WerFault.exe written anywhere under C:\Windows\WinSxS\ by a process that is
  not itself running from C:\Windows\System32\, C:\Windows\SysWOW64\, or C:\Windows\WinSxS\. Both
  conditions must hold: the component store normally receives WerFault.exe only from servicing
  components that run from those system directories, so a writer outside them is the whole signal.
  WerFault.exe is the genuine Windows Error Reporting binary and normally lives in System32, where
  it runs constantly and legitimately; a copy planted in a component-store subdirectory borrows a
  name that survives casual inspection of a process list and gives a launch point in a directory
  that is rarely reviewed. This family's installer plants a renamed copy of a legitimate Windows
  binary in a system-adjacent directory and pairs it with a service or scheduled start so the
  loader runs at boot. Determine which process wrote the file and what launched it, whether the
  planted binary is the genuine Microsoft-signed WerFault or a different binary reusing the name,
  whether it subsequently executed, and whether a start mechanism was registered alongside it.
type: detection
detection_id: 64827580-e4c3-4c64-97eb-c72325d45399
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Was a file named WerFault.exe written under the WinSxS component store, and which process wrote it?
  context: >-
    Confirm the alert before investing investigation time. Check that the path really lands under
    C:\Windows\WinSxS\ with a filename of WerFault.exe, note the operation performed
    (created/modified/renamed), and identify the responsible process. The rule fires only when the
    writer runs from outside System32, SysWOW64, and WinSxS, so a writer in one of those
    directories means the alert should not have fired and the path is worth re-reading. The signer
    columns are context, not a verdict — judge whether the signer is coherent with a process
    writing into the component store, not whether it is merely trusted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to have a non-servicing process write an executable into the component store?
  context: >-
    Windows servicing writes into WinSxS constantly, but it does so from System32 and WinSxS
    themselves. A user-launched installer, a packaging or imaging job, or a vendor updater that
    stages binaries there is the plausible legitimate case; confirm whether such work was scheduled
    on this host. When the user resolves to a machine or service account, judge by the writing
    process and the host's role instead of by identity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the planted WerFault.exe still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A binary still on disk can
    be retrieved, hashed, and compared against the genuine System32 copy; one deleted seconds after
    creation points to a staging step or cleanup and shifts the investigation to what executed in
    between. Read the operation type on each returned event rather than the count.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What process wrote the file, and what spawned that process?
  context: >-
    The file event names the writing process but not its origin. Retrieving that process's own
    start event reveals its command line and the parent that launched it. A servicing or installer
    lineage (services.exe, msiexec.exe, a vendor updater) reads differently from a process launched
    by a script host, an Office application, or an unrecognised binary in a user-writable
    directory. The parent also tells you whether the write was interactive or automated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What was the writing process actually doing at the time — decode its full command line and working directory?
  context: >-
    File events carry no command line, so the operation the writer was performing has to be read
    from its process events on this host in the same window. Decode the arguments for an install or
    extraction target, a source archive or share path, and a working directory that reveals where
    the binary came from. Several sequential invocations of the same program often make up one
    logical operation, so read the set rather than a single row.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the file at this path the genuine Windows Error Reporting binary, or a different binary reusing the name?
  context: >-
    The filename is not the question here — the real WerFault.exe runs constantly and legitimately,
    so the name alone carries no signal and the location does. Retrieve the file from the WinSxS
    path and compare it against the System32 copy: file size, signing status and signer, version
    resource, imports, embedded strings, and packer indicators. A binary that is not
    Microsoft-signed, is unsigned, or whose size and version resource diverge from the shipped
    WerFault is a masquerading payload. Content retrieval is a manual step from the endpoint; the
    query confirms the path and the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the planted binary has executed, what is its hash, and does it have known AV or threat intel detections?
  context: >-
    A hash is recorded when a file runs, not when it is written, so the identity of the planted
    binary is resolved at execution. This query looks for a process starting from that filename and
    reads its hash; submit it to reputation services or internal threat intel, and compare it
    against the hash of the genuine System32 WerFault on a known-good host — a mismatch settles
    whether this is the real binary or an impostor. If the file is present but has not executed,
    retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Did the planted binary execute after it was written, and from which path?
  context: >-
    A dropped executable only matters once it runs. Read the returned Image paths carefully — the
    genuine WerFault under System32 starts routinely on any Windows host, so the finding is an
    execution whose path is the WinSxS one, or a command line that references it. An execution
    within minutes of the write points to immediate use; an execution at boot or under a service
    host points to a registered start mechanism.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - image_load
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that plants one binary often plants several — a loader alongside its configuration,
    an encrypted payload store, or a driver. The breadth, paths, and extensions of the writer's
    other file activity separate a single artifact from a full installation and enumerate what else
    needs review. The correlation covers the writing process and its direct children, since
    installers commonly delegate the write. If the writer is an installer or packaging tool,
    volume alone is not suspicion — look at where the writes land.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written into the WinSxS component store on this host recently, and by which processes?
  context: >-
    Location drives suspicion for this artifact. The component store has a small set of processes
    that legitimately write to it, and they run from the system directories the rule excludes.
    Grouping the last week of writes by path and writing process shows whether servicing accounts
    for essentially all of it and this one writer stands alone, or whether the same unfamiliar
    program has been staging files there over time. Expect large counts around patch windows; the
    single unfamiliar writer is the signal, not the total.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\WinSxS\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file with this name been written on this host before?
  context: >-
    Servicing legitimately refreshes WerFault.exe in the component store during cumulative updates,
    so prior writes are expected on a patched host — the useful reading is the writer column and
    the timing. A history of writes only from system-directory processes clustered around patch
    windows, with this one write standing apart, isolates the deviation. No prior history at all
    makes this write the first of its kind on the host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the
    user's 90-day history of this exact write pattern — a non-system process planting WerFault.exe
    in the component store — rather than generic file activity, aggregated by host. A user who has
    never produced it is a stronger deviation than one who does so regularly; weigh the count
    against the user's role and whether they run packaging or imaging work. When the alert fires
    under a machine or service account, this pivot does not attribute behaviour and the acting-program
    baseline is the meaningful one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: \WerFault.exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this program historically produced this write pattern on this host or across the environment, or is it new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behaviour, and
    a file event carries no parent to pivot on. The meaningful pivot is the acting program itself.
    The query mirrors the rule's selection structure scoped to the alerting binary, so the result is
    the 90-day history of this program planting WerFault.exe into the component store from outside
    the system directories. A program that is new or rare for this pattern is the deviation worth
    chasing; one that already accounts for hundreds of prior events is a packaging or vendor
    workflow that belongs on an exclusion review.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: \WerFault.exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the write is one step of a wider
    operation or an isolated event. The same account driving process activity on several hosts in
    the alert window points to lateral movement or an operator working through a set of machines.
    When the alert fires under SYSTEM, a service principal, or a machine account, this returns
    routine agent telemetry and the acting-program clustering carries the answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same program produce this write pattern on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns
    agent-telemetry noise, since every host runs SYSTEM-owned agents constantly, and a file event
    carries no parent to pivot on. The query mirrors the rule's selection structure scoped to the
    alerting binary, fleet-wide, in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation, whether legitimate packaging or a deliberate rollout; a single
    host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\WinSxS\
        TargetFilename|endswith: \WerFault.exe
      filter_main_system_location:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Windows\WinSxS\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Planting a binary is rarely the whole operation. Aggregating process starts by binary and parent
    around the alert collapses routine agent telemetry into high-count rows and leaves novel
    parent-child pairs standing out at low counts. Look for the service-installation and
    scheduled-task tooling that would register a start mechanism for the planted file, and for
    archive extraction or transfer utilities that would have staged it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Was a file with this name written on any other hosts in the environment recently?
  context: >-
    The same filename appearing on multiple hosts distinguishes a single targeted host from a
    distribution. Servicing writes WerFault.exe into the component store fleet-wide during patch
    rollouts, so read the writing-process column rather than the host count — hosts where the writer
    is a system-directory servicing process are routine, and hosts where it is the same non-system
    program as here are the ones to add to the investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct how the writer arrived. Defense tampering,
    archive extraction from a user-writable directory, credential access, or remote-service creation
    preceding a binary landing in a system directory sketches the stages before this event and tells
    you where to look next.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
