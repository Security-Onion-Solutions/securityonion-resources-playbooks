name: Kapeka Backdoor Persistence Activity
id: 1bdaf0ce-cc03-48c3-be3f-d326adac692b
description: |
  Detects the persistence step of the Kapeka backdoor. The rule requires a command line that references rundll32, a .wll DLL and ordinal #1 together with either the string "Sens Api" or "OneDrive", AND requires that this command line arrive through either a schtasks.exe branch (schtasks.exe or OriginalFileName schtasks.exe, with both "create" and "ONSTART" present) or a reg.exe branch (reg.exe or OriginalFileName reg.exe, with both "add" and the CurrentVersion\Run key path present). Each branch is an AND pair: the binary and its flags must appear together, and the branch that fired tells the analyst which persistence mechanism was registered — a SYSTEM-level startup scheduled task (T1053.005) or a per-user autorun value (T1547.001) — both of which re-launch a DLL export through rundll32 (T1218.011).
  Legitimate installers and management tooling do register startup tasks and Run values, but they rarely pass a .wll extension and a bare ordinal to rundll32; the .wll extension is a Word add-in extension being reused as a generic DLL name. The investigation should establish which branch fired, recover the DLL path and ordinal from the command line, confirm whether the task or Run value is still registered, determine whether the referenced DLL exists on disk, and check whether the same pattern reached other hosts or accounts.
type: detection
detection_id: 64a871dd-83f6-4e5f-80fc-5a7ca3a8a819
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line show a rundll32 call against a .wll DLL with ordinal #1, registered through either a schtasks
    "create ... ONSTART" invocation or a "reg add" to a CurrentVersion\Run key?
  context: >-
    The rule fires only when the rundll32 / .wll / #1 trio and the "Sens Api" or "OneDrive" string are all present, and only
    when either the schtasks branch (create AND ONSTART) or the reg branch (add AND the Run key path) matches alongside it.
    Note which branch fired and record it, because it drives the rest of the investigation. A schtasks branch means a startup
    task was registered, usually implying the caller already held administrative or SYSTEM privileges, and the task-registration
    and task-trigger questions carry the weight. A reg branch means a per-user autorun value was written under HKCU with no
    elevation, and the registry-key and Run-value questions carry the weight. Confirm the Image or OriginalFileName really is
    schtasks.exe or reg.exe rather than a renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register startup scheduled tasks or autorun registry values from the command line?
  context: >-
    Startup tasks and Run values are registered routinely by installers, deployment tooling and administrators, so the account
    and host function narrow the question quickly. A build server or an admin workstation registering a task differs from an
    ordinary user endpoint doing so. If the account is SYSTEM or a machine account, identity attributes nothing on its own and
    the launch mechanism is the useful pivot instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What task name, schedule type and run-as account were passed on the command line, and what exact command does the
    task execute?
  context: >-
    Read the task name from /TN, the executed command from /TR, the schedule type from /SC and the run-as account from /RU.
    This rule's schtasks branch requires both "create" and "ONSTART", so the task fires at every boot, and the /TR value is
    expected to be a rundll32 call naming a .wll DLL path and ordinal #1. Record the full DLL path — it is the payload location
    the remaining questions pivot on. A /RU of SYSTEM means the payload runs with full local privilege at each startup, and
    means the caller was already elevated when the task was registered. If the alerting process is reg.exe rather than schtasks.exe,
    read the value name and value data out of the "reg add" arguments instead — the same rundll32 command lives in the value data.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What registry key and value data were actually written, and does the key match a known autorun location?
  context: >-
    The reg branch of this rule requires the CurrentVersion\Run path, which registers a per-user autorun value that executes at
    each interactive logon without needing elevation. Reading the registry event rather than parsing reg.exe arguments gives the
    key path and the value data as structured fields, which matters when the value data contains a quoted rundll32 command with
    an embedded ordinal. Read the signer columns for coherence with the key being written, not as a verdict — the writing process
    here is a signed Microsoft binary either way.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - process_creation
- question: Is the rundll32 payload reference obfuscated, and what DLL path and export does it actually resolve to?
  context: >-
    The payload here is hidden by reference rather than by encoding — an ordinal (#1) instead of a named export, and a .wll
    extension instead of .dll, so a reader scanning the command line sees a Word add-in path rather than a DLL entry point.
    Expand any environment-variable substitution (%ProgramData%, %windir%, %HOME%) to the literal path, strip the nested quoting
    that the /TR or value-data argument introduces, and note trailing switches such as -d that are passed through to the export.
    The resolved path and ordinal are what identify the payload; if the command line also chains a batch file or cmd /c stage,
    reconstruct that stage too.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Does the Security channel show a task registration, update or deletion on this host, and what account registered it?
  context: >-
    A schtasks.exe command line is the request; the Security channel records the outcome. Event 4698 records a task registration
    with the full task XML, 4702 an update to an existing task, and 4699 a deletion. Reading these confirms the task really was
    created rather than failing, gives the registering account independently of the process event, and surfaces tasks registered
    through the Task Scheduler API or COM without any schtasks.exe process at all. Deletion shortly after registration points at
    artifact cleanup. If the Security channel is not collected on this host, treat zero results as a visibility gap rather than
    evidence no task exists.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4698
          - 4699
          - 4702
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - TaskName
      - SubjectUserName
  answer_sources:
  - manual_review
  - organizational_knowledge
- question: Has the Task Scheduler already launched the registered payload on this host?
  context: >-
    An ONSTART trigger fires at every boot, so the payload runs on the next restart and on every restart after that; an autorun
    Run value fires at the next interactive logon instead. Tasks execute as children of the Task Scheduler service, so scheduler-parented
    process creations after the registration show whether the payload has run yet. Compare the child command lines against the DLL
    path recovered from the registration — a rundll32 child naming the same .wll path and ordinal means the persistence already
    executed and the investigation is no longer about a pending mechanism.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\svchost.exe'
        ParentCommandLine|contains: 'Schedule'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is the registered task or autorun value still present on the host right now?
  context: >-
    Persistence only matters if the mechanism survives. Take the task name and the DLL path from the registration command line
    and confirm on the host whether the task is still registered (schtasks /query /tn "<name>" /v) or, for the reg branch, whether
    the value still exists under the user's Run key. The query redisplays the registration command line so the name and path are
    at hand. Registry value deletion is not visible in telemetry here, so confirm current state on the host or through endpoint
    tooling rather than inferring it from the absence of a removal event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Was the referenced .wll DLL actually written to disk by this process or its children?
  context: >-
    Both branches register a command that loads a DLL by path; the persistence does nothing unless that file exists at the path
    named in the task action or the Run value data. Correlating file activity by the registering process and its children shows
    whether the DLL landed in the same session, and where — %ProgramData% subdirectories and user AppData are common drop locations
    for a name that carries a .wll extension. The file-write event carries no hash, so if the file is present, hash it from a later
    execution or retrieve it for a reputation lookup. Batch files written alongside it indicate a chained execution stage.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were other registry write operations made on this host in the same window?
  context: >-
    Operators who write one autorun value often write several, or pair the autorun with configuration changes elsewhere in the
    hive. Listing reg.exe and regedit.exe write operations on the host over a wider window than the alert shows whether the
    alerting write stood alone or sat inside a run of registry changes, and whether keys unrelated to autorun — service entries,
    security-tool configuration — were touched in the same session.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: What process launched schtasks.exe or reg.exe here, and is that launcher expected to register persistence?
  context: >-
    Persistence tools invoked by an installer, a deployment agent or an interactive shell under an administrator have an explainable
    launcher. A launcher such as cmd.exe running a batch file out of a user AppData directory, or a dropper executable in a
    temporary path, is the more interesting answer, and identifies the stage that preceded the registration. Walk further up the
    tree from the parent shown here if the immediate parent is a generic interpreter.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day history of this
    specific registration pattern rather than generic use of schtasks.exe or reg.exe, aggregated by host. For a pattern this
    narrow, any prior history at all is notable and points at either repeated activity or an environment-specific match worth
    understanding. Weigh the count against the account's role, and treat a zero result under a service principal as uninformative
    rather than reassuring.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_schtasks_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_schtasks_flags:
        CommandLine|contains|all:
        - create
        - ONSTART
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flags:
        CommandLine|contains|all:
        - add
        - \Software\Microsoft\Windows\CurrentVersion\Run
      selection_backdoor_command:
        CommandLine|contains|all:
        - rundll32
        - .wll
        - '#1'
        CommandLine|contains:
        - Sens Api
        - OneDrive
      _pb_scope:
        User|expand: '%User%'
      condition: ((all of selection_schtasks_* or all of selection_reg_*) and selection_backdoor_command) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the
    parent new for this activity?
  context: >-
    When the registration runs under SYSTEM or a machine account, user identity attributes nothing and the launch mechanism is
    the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting parent process, so the result
    is the 90-day history of this parent driving this exact registration pattern, aggregated by host. A parent that already
    accounts for many prior events across many hosts is deployment automation; a parent that is new for this pattern is the
    deviation to chase.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_schtasks_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_schtasks_flags:
        CommandLine|contains|all:
        - create
        - ONSTART
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flags:
        CommandLine|contains|all:
        - add
        - \Software\Microsoft\Windows\CurrentVersion\Run
      selection_backdoor_command:
        CommandLine|contains|all:
        - rundll32
        - .wll
        - '#1'
        CommandLine|contains:
        - Sens Api
        - OneDrive
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((all of selection_schtasks_* or all of selection_reg_*) and selection_backdoor_command) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts in the surrounding hour shows whether the registration was an isolated act
    or one step in a sequence that also touched other endpoints. Repetition of the same tooling under the same account on several
    hosts widens the scope. If the alert fired under SYSTEM or a machine account this returns routine service and agent activity
    and answers little — read the parent-scoped view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    The query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, within the alert window.
    Several hosts registering the same persistence through the same launcher in the same hour points at a pushed or scheduled
    rollout; a single host points at a host-local trigger. This is the useful cross-host view when the alert fires under a service
    principal, where a user-scoped view returns only agent telemetry.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_schtasks_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_schtasks_flags:
        CommandLine|contains|all:
        - create
        - ONSTART
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flags:
        CommandLine|contains|all:
        - add
        - \Software\Microsoft\Windows\CurrentVersion\Run
      selection_backdoor_command:
        CommandLine|contains|all:
        - rundll32
        - .wll
        - '#1'
        CommandLine|contains:
        - Sens Api
        - OneDrive
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: ((all of selection_schtasks_* or all of selection_reg_*) and selection_backdoor_command) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: When this host has previously fired the rule's pattern, what parents and users drove it, and does the current alert
    fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the parent and user distribution reflects how this
    specific registration pattern has run here, not generic schtasks.exe or reg.exe usage. For a pattern requiring rundll32, a
    .wll path and ordinal #1 together, an empty result is the expected outcome and makes the current event first-of-its-kind on
    this host. Prior events under a different parent or account are the deviation worth reading.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_schtasks_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_schtasks_flags:
        CommandLine|contains|all:
        - create
        - ONSTART
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flags:
        CommandLine|contains|all:
        - add
        - \Software\Microsoft\Windows\CurrentVersion\Run
      selection_backdoor_command:
        CommandLine|contains|all:
        - rundll32
        - .wll
        - '#1'
        CommandLine|contains:
        - Sens Api
        - OneDrive
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: ((all of selection_schtasks_* or all of selection_reg_*) and selection_backdoor_command) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and how is that activity distributed?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this registration
    pattern rather than the fleet footprint of schtasks.exe or reg.exe. Multiple hosts registering the same rundll32 / .wll /
    ordinal persistence within a week identifies the set of endpoints to contain and suggests a deployment path the operator used;
    a single host keeps the investigation local. Use the host list to seed containment scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_schtasks_img:
      - Image|endswith: \schtasks.exe
      - OriginalFileName: schtasks.exe
      selection_schtasks_flags:
        CommandLine|contains|all:
        - create
        - ONSTART
      selection_reg_img:
      - Image|endswith: \reg.exe
      - OriginalFileName: reg.exe
      selection_reg_flags:
        CommandLine|contains|all:
        - add
        - \Software\Microsoft\Windows\CurrentVersion\Run
      selection_backdoor_command:
        CommandLine|contains|all:
        - rundll32
        - .wll
        - '#1'
        CommandLine|contains:
        - Sens Api
        - OneDrive
      condition: (all of selection_schtasks_* or all of selection_reg_*) and selection_backdoor_command
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Persistence is normally installed after access is obtained, so earlier detections on the same host often carry the stages
    that preceded it — script or batch execution, dropper activity, privilege escalation, or defense tampering. Reading the
    alert timeline before the registration helps establish how the operator reached the point of registering startup persistence,
    and which earlier artifact to pull next.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
