name: EVTX Created In Uncommon Location
id: 8239a118-4e40-4b5d-9d15-3cfdb032d315
description: |
  This detection fires when a file ending in .evtx is written to a location outside the standard Windows event log directory (C:\Windows\System32\winevt\Logs\) AND that path is not the excluded container base-image directory that legitimately holds relocated logs. Windows event logs are normally written only to that system directory, so an .evtx appearing elsewhere points to event-log data being exported, copied, or staged — for offline tampering, for harvesting sensitive information out of the logs, or as a step before exfiltration. Backup software, troubleshooting, and administrative log exports produce the same artifact, so the investigation should determine which process wrote the file and from where, which event-log channel it contains, whether the channel's on-disk path was redirected in the registry, and whether log-clearing or archiving activity occurred in the same window.
type: detection
detection_id: 65236ec7-ace0-4f0c-82fd-737b04fd4dcb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a .evtx file written to a path outside the standard Windows event log directory, and which process wrote it?
  context: >-
    The rule fires when a file ending in .evtx is created anywhere other than C:\Windows\System32\winevt\Logs\, excluding the
    container base-image path that legitimately holds relocated logs. Confirm the recorded path is genuinely outside the standard
    log directory and read the responsible process before investing further; event-log files are normally written only to
    that system location, so a copy landing elsewhere is the core signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write event-log files outside the standard log directory?
  context: >-
    Legitimate backup, monitoring, and administrative log exports can drop .evtx files into non-standard folders, but routine
    workstation and server use does not. Knowing whether the account and host function fit that activity is often the fastest
    path to separating a true positive from sanctioned maintenance. User attribution is present on roughly 94% of endpoint file
    events; when it is a machine account (HOST$) or SYSTEM, judge by the writing process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What did the process that wrote this .evtx file do, and was the command an event-log export, a copy, or a log-clear operation?
  context: >-
    The full command line of the writing process reveals intent. An event-log export utility invoked with an export or query
    argument, a copy of a channel file out of the standard directory, or a clear operation each carry different weight. Decode
    the arguments and identify the source channel and the destination path; a command that reads a live event-log channel and
    writes it to a user-writable folder is consistent with harvesting or offline tampering rather than routine backup.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which event-log channel does this .evtx file contain, and does it hold security-relevant records?
  context: >-
    The value here is understanding what the exported log actually is. Retrieve the file and read its channel name and record
    contents; a copy of the Security, System, or PowerShell operational channel points at authentication, service, or execution
    evidence being harvested or removed, while an obscure application channel is lower priority. This is content analysis of
    the log file itself and is distinct from checking whether the writing process is known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process wrote this file, and what parent chain launched it?
  context: >-
    The parent process reveals how the write was initiated. A backup agent, a management tool, or an interactive administrator
    session is a benign chain; a script host, an Office application, or a remote-execution service spawning the writer points
    to automated or hands-on-keyboard activity. Trace the parent and, where possible, walk up another level to see what started it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Was the registry configuration of an event log channel modified on this host?
  context: >-
    The on-disk location of an event-log channel is registry-configurable through the channel's File value under the Eventlog
    service key (HKLM\SYSTEM\CurrentControlSet\Services\Eventlog\<channel>). Redirecting that value makes the live channel write
    to a non-standard path, which is one way an .evtx legitimately or maliciously ends up outside the standard directory. Recent
    modifications to any Eventlog channel key on this host establish whether this is a configuration change rather than a one-off
    file copy; correlate the writing process with the process seen elsewhere in this investigation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Services\EventLog\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the .evtx file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A staged log still on disk can be retrieved and examined; a file deleted
    seconds after creation suggests anti-forensic cleanup after the data was read or moved. A rename or a move to an archive
    location points toward staging for transfer. Read the operation type to tell these apart.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that exports one event log often touches several — dumping multiple channels, staging them together, or writing
    an archive alongside them. The breadth, paths, and extensions of the process's other file activity distinguish a single
    log copy from a bulk harvest and enumerate what else needs review. The correlation covers the writer and its direct children,
    since a launcher often delegates the actual write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other .evtx files were written on this host recently, and by which processes?
  context: >-
    A single misplaced event-log file may be an isolated export, but several .evtx files written to non-standard locations over
    a short period point to a deliberate sweep of multiple channels. Group the recent .evtx writes on this host by path and
    writing process; a single unfamiliar writer producing many log files is the signal, while a familiar backup agent producing
    a predictable set is routine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '.evtx'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were log-clearing or other defense-tampering commands run on this host?
  context: >-
    Exporting a log for offline reading is frequently paired with clearing the live channel afterward, or with disabling other
    controls in the same operation. Look for event-log clear commands, shadow-copy deletion, recovery or firewall changes, and
    service stops from the same account or parent process. Multiple tampering actions in one window indicate several controls
    were targeted together rather than an isolated administrative action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Is event logging on this host still healthy, or was the source channel cleared or redirected?
  context: >-
    Exporting a channel does not by itself impair logging, but it is often a precursor to clearing or redirecting it. Confirm
    the source channel is still recording and still writing to its standard path; if the live channel was cleared or its file
    path was redirected after the export, the original evidence has been destroyed or hidden and the channel should be restored
    and re-collected before further investigation. The command line of the responsible process is shown here for reference.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What ran on this host in the window after the .evtx file was written?
  context: >-
    Harvesting or clearing logs is done to enable or conceal other activity. Examining what executed immediately after the write
    reveals what the operation was meant to support — further reconnaissance, credential access, or lateral movement. If the
    live channel was cleared in the same window, treat gaps in subsequent telemetry as expected and lean on process execution
    to reconstruct the sequence.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were archiving or outbound-transfer tools run on this host around the .evtx write?
  context: >-
    A staged event log is frequently compressed and moved off the host. Look for archiving utilities and outbound-transfer tools
    invoked near the write, especially with arguments that reference the log file, its folder, or a compressed container. A copy
    of a channel file followed by archive creation and a transfer command is the staging-and-exfiltration pattern; absence of
    such tooling supports a local export that has not yet left the host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_stage:
        Image|endswith:
          - '\7z.exe'
          - '\rar.exe'
          - '\winrar.exe'
          - '\tar.exe'
          - '\makecab.exe'
          - '\certutil.exe'
          - '\curl.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'Compress-Archive'
          - 'Invoke-WebRequest'
          - 'Invoke-RestMethod'
          - '-InFile'
          - '.zip'
          - '.rar'
          - '.cab'
          - 'winevt'
          - '.evtx'
      condition: selection and selection_stage
    fields:
      - Image
      - CommandLine
- always_include: true
  question: Has this user previously produced the rule's .evtx-write pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of writing .evtx files
    to non-standard locations — not generic file activity. A user who has never produced this pattern is more suspicious than
    one who does so regularly as part of a backup or support role; weigh the count against what the account is expected to do.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
    detection:
      selection:
        TargetFilename|endswith: .evtx
      filter_main_path:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
      filter_main_baseimage:
        TargetFilename|startswith: C:\ProgramData\Microsoft\Windows\Containers\BaseImages\
        TargetFilename|endswith: \Windows\System32\winevt\Logs\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven .evtx writes to non-standard locations, or is the program new for this activity?
  context: >-
    When the alert fires under a machine or service account, user identity does not attribute the behavior; the launch mechanism
    does. The query mirrors the rule's selection scoped to the alerting program, so the result is the 90-day history of
    this program producing this specific pattern. A new or rare program for this write is the deviation worth chasing; a program
    that already accounts for many prior events is backup or platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
    detection:
      selection:
        TargetFilename|endswith: .evtx
      filter_main_path:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
      filter_main_baseimage:
        TargetFilename|startswith: C:\ProgramData\Microsoft\Windows\Containers\BaseImages\
        TargetFilename|endswith: \Windows\System32\winevt\Logs\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether this log export is an isolated action
    or part of broader hands-on activity. The same user driving similar writes or tooling on multiple endpoints widens the scope
    of the investigation. When the alert fires under SYSTEM or a machine account this view returns routine agent telemetry, in
    which case the parent-driven fleet view is the meaningful answer.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven .evtx-write pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine account, network-wide user activity is dominated by agent noise, so the meaningful question is
    whether the same launch mechanism produced this pattern elsewhere. The query mirrors the rule's selection scoped to the alerting
    program, fleet-wide, in the alert window. Multiple hosts in the same window point to scheduled or pushed automation;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
      definition: 'Requirements: The ".evtx" extension should be monitored via a Sysmon configuration. Example: <TargetFilename condition="end with">.evtx<TargetFilename>'
    detection:
      selection:
        TargetFilename|endswith: .evtx
      filter_main_path:
        TargetFilename|startswith: C:\Windows\System32\winevt\Logs\
      filter_main_baseimage:
        TargetFilename|startswith: C:\ProgramData\Microsoft\Windows\Containers\BaseImages\
        TargetFilename|endswith: \Windows\System32\winevt\Logs\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Log staging and tampering rarely happen in isolation. Earlier detections on the same host — reconnaissance, credential access,
    defense tampering, or a suspicious execution — may reveal the stages that preceded this write and help reconstruct the timeline.
    An .evtx export following an earlier tampering or execution alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
