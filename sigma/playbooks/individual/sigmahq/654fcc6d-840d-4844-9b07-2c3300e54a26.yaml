name: Legitimate Application Dropped Archive
id: c1ea2df4-10c2-415e-b45f-ce6d5129c09d
description: |
  This detection fires when a file whose name ends in a common archive extension (.zip, .rar, .7z, .diagcab, .appx) is written to disk AND the writing process is one of a set of applications that should not normally produce archives — Office programs (winword.exe, excel.exe, powerpnt.exe, msaccess.exe, mspub.exe, eqnedt32.exe, visio.exe, wordpad.exe, wordview.exe), download- or decode-capable utilities (certutil.exe, certoc.exe, CertReq.exe, Desktopimgdownldr.exe, esentutl.exe, finger.exe), and viewers or script hosts (notepad.exe, AcroRd32.exe, RdrCEF.exe, mshta.exe, hh.exe). A trusted application dropping an archive commonly indicates malware delivery or staging through a document macro or injected code, retrieval of packaged tooling by a living-off-the-land binary, or bundling of collected data ahead of exfiltration. Investigation should establish which application wrote the archive and what launched it, what the archive contains, whether its contents were extracted or executed, and whether the archive was subsequently moved off the host.
type: detection
detection_id: 654fcc6d-840d-4844-9b07-2c3300e54a26
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did a listed trusted application write a file whose name ends in an archive extension?
  context: >-
    The rule fires when the writing process (Image) is one of a set of applications that should not normally produce archives — Office programs, download- or decode-capable utilities such as certutil and esentutl, and viewers or script hosts such as notepad, mshta, and AcroRd32 — AND the target file name ends in .zip, .rar, .7z, .diagcab, or .appx. Both conditions must hold, so confirm the responsible process is one of the listed applications and the file is genuinely an archive before investing further.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have this application write archives to disk?
  context: >-
    Legitimate installers, backup jobs, or user-driven exports can occasionally produce archives, but the listed applications writing .zip/.rar/.7z files is unusual on routine workstations and servers. Knowing whether the account and host function fit that activity is often the fastest way to separate a true positive from expected behavior. User attribution is present on roughly 94% of endpoint file events; when it resolves to a machine account (HOST$) or SYSTEM, judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was the application that wrote the archive actually doing — what was its full command line and working directory?
  context: >-
    The archive is a file-write side effect; the writing process's command line reveals the operation behind it. For an Office program, the command line names the document that was open — a candidate malicious document. For a download or decode utility such as certutil, esentutl, expand, or finger, look for -decode/-encode/-urlcache flags and the named source and output files that produced the archive. The working directory can reveal where the source data lived. This query returns every execution of the writing binary on this host within a few minutes of the alert, so a decode step and a separate drop appear together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What does the dropped archive contain?
  context: >-
    Retrieve the archive from its on-disk path and examine the contents in a safe environment. Archives dropped by trusted applications frequently package an executable, script, LNK, or nested archive intended for later extraction and execution, or they bundle collected files staged for exfiltration. Check for double-extension members (invoice.pdf.exe), encoded or password-protected content, and members whose names or types do not match a benign document workflow. File-write events carry no hash, so content inspection requires manual retrieval.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process launched the application that wrote the archive?
  context: >-
    The parent of the writing process shows how it was invoked. An Office program or viewer launched by explorer.exe from a user opening a document reads differently from one spawned by a script host, another Office application, or an unexpected automation — patterns consistent with a malicious document or injected code. A download utility such as certutil launched by a shell or scheduled task points to scripted retrieval. Trace the parent lineage and judge whether the chain is expected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: If the archive's contents were extracted and executed, what did the responsible process spawn and what are those executables' hashes?
  context: >-
    The hash needed for a reputation lookup is recorded when a payload runs, not when the archive is written — file-write events carry no hash. This query returns the processes the writing application and the shell that launched it spawned — its children and siblings — with their executable hashes; for a document-macro-drops-and-runs or a download-and-execute, the extracted payload appears here. Submit any unfamiliar hash to threat intelligence. If the archive was extracted later by an unrelated process, the payload will not appear here — retrieve it from the on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: What other files did the writing process create or delete around the alert?
  context: >-
    A process that drops one archive often drops or stages several files — components unpacked from the archive, additional payloads, or a set of collected files gathered before compression. The breadth, paths, and extensions of the writing process's other file activity distinguish a single artifact from a staging operation in progress and enumerate what else needs review. The correlation covers the writer and its direct children.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the archive still on disk, or was it moved, renamed, or deleted after the alert?
  context: >-
    The archive's post-write lifecycle drives both urgency and next steps. An archive still on disk can be retrieved, hashed, and its contents examined; one deleted seconds after creation suggests a self-cleaning dropper or that the contents were extracted and the container discarded, and shifts the focus to what ran in between. A move or copy to another location can indicate staging toward exfiltration.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What modules did the writing process load, and were any unsigned or abnormally signed?
  context: >-
    Applications such as notepad, mshta, and document viewers should not produce archives on their own; when they do, a common cause is code injected into the trusted process or a malicious add-in loaded at runtime. Reviewing the modules the writing process loaded around the drop — particularly unsigned modules, modules signed by an unexpected party, or modules loaded from user-writable directories — helps distinguish injection or add-in abuse from a benign export. Loaded modules carry a signature status on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the writing process make outbound network connections around the time it created the archive?
  context: >-
    Download-capable utilities in the list (certutil, esentutl, finger, Desktopimgdownldr) can retrieve remote content, so an outbound connection from the writing process near the drop suggests the archive or its contents were pulled from a remote source. Conversely, an outbound transfer shortly after the archive is written can indicate the archive was staged and sent off the host. Anchor on the destination address; resolved hostnames are recorded separately and are often absent. Connections to known enterprise services can be set aside, while connections to unfamiliar external addresses warrant follow-up.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: When this host has previously produced this archive-drop pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection — a listed application writing an archive extension —
    scoped to this host, so the program and user distribution reflects how this specific pattern
    has run here rather than generic use of these applications. A new acting program process, an
    unexpected user account, or a first-ever occurrence is the deviation worth chasing. A
    history dominated by one automation or updater points toward expected behavior.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \msaccess.exe
        - \mspub.exe
        - \eqnedt32.exe
        - \visio.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \finger.exe
        - \notepad.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \mshta.exe
        - \hh.exe
        TargetFilename|endswith:
        - .zip
        - .rar
        - .7z
        - .diagcab
        - .appx
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this archive-drop pattern in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the same pattern — a listed application writing an archive — rather than generic use of these applications. Many hosts producing the pattern points to a software deployment, backup job, or vendor automation; one host or a small unrelated set points to targeted or manual activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \winword.exe
        - \excel.exe
        - \powerpnt.exe
        - \msaccess.exe
        - \mspub.exe
        - \eqnedt32.exe
        - \visio.exe
        - \wordpad.exe
        - \wordview.exe
        - \certutil.exe
        - \certoc.exe
        - \CertReq.exe
        - \Desktopimgdownldr.exe
        - \esentutl.exe
        - \finger.exe
        - \notepad.exe
        - \AcroRd32.exe
        - \RdrCEF.exe
        - \mshta.exe
        - \hh.exe
        TargetFilename|endswith:
        - .zip
        - .rar
        - .7z
        - .diagcab
        - .appx
      condition: selection
    fields:
    - host.name
- always_include: true
