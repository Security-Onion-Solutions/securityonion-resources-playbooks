- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The archive drop rarely occurs in isolation. Aggregating process activity around the alert surfaces what led to it and what followed — a document opening, a download or dropper, extraction tooling, or additional staging. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, script execution, defense tampering, or reconnaissance — may reveal the stages that preceded the archive drop and help reconstruct the timeline. An archive written by a trusted application following an earlier execution or macro alert reads very differently from one with no prior activity.
