name: UAC Bypass Abusing Winsat Path Parsing - Registry
id: 65285339-6669-42ca-8f6c-62ecdb62aabd
description: |
  Detects a path-parsing abuse of the auto-elevated winsat.exe: an entry under the compatibility Amcache key (...\Root\InventoryApplicationFile\winsat.exe\LowerCaseLongPath) is set to a copy of winsat.exe staged under the user's AppData\Local\Temp\system32 directory. The rule fires only when the key path matches the winsat InventoryApplicationFile\LowerCaseLongPath entry AND the value data both starts with c:\users\ and ends in \appdata\local\temp\system32\winsat.exe. Windows auto-elevates winsat.exe without a consent prompt, and the manipulated path parsing causes the elevated process to run from the attacker-controlled location, typically loading a sideloaded DLL and executing a payload at high integrity. Legitimate compatibility-appraiser activity writes this key with genuine system paths, so the investigation should confirm the value points at a user-writable temp path, identify and verify the staged binary and any accompanying DLL, and determine what ran with elevated privileges afterward. Because registry value deletion is not separately recorded in this telemetry, judge cleanup from the key's later re-modification history rather than a delete event.
type: detection
detection_id: 6597be7b-ac61-4ac8-bef4-d3ec88174853
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path and value data match the winsat path-parsing UAC bypass this rule detects?
  context: >-
    Confirm the alert is a true positive by reviewing the exact key path (TargetObject) and value data (Details). The rule fires only when an Amcache InventoryApplicationFile entry for winsat.exe has its LowerCaseLongPath value set to a path that begins with c:\users\ and ends in \appdata\local\temp\system32\winsat.exe — all conditions together. A genuine appraiser entry records the real System32 winsat.exe location; a value under a user-writable Temp path is the redirect that drives the bypass.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to generate an Amcache winsat entry pointing at a user-profile temp path?
  context: >-
    The compatibility appraiser normally writes this key with genuine system paths as part of routine inventory. A value redirecting winsat.exe into a per-user AppData\Local\Temp path is not something ordinary user or administrative activity produces. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account (HOST$) or SYSTEM, pivot on the writing process (Image) instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact Amcache value was written, and is this a known auto-elevation redirect location?
  context: >-
    The InventoryApplicationFile\winsat.exe\LowerCaseLongPath key is a compatibility-inventory entry that normally records the true install path of winsat.exe. Setting it to an attacker-staged path is the mechanism that makes the auto-elevated binary resolve to a user-writable location. Read the exact key path and the writing process here, and let the value-decoding question carry the payload-path analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What path does the LowerCaseLongPath value point to, and does it resolve to a user-writable staging directory?
  context: >-
    The Details field holds the redirected path the auto-elevated winsat.exe will resolve to. A value of the form c:\users\<user>\appdata\local\temp\system32\winsat.exe is a staged copy in a directory the user can write to, which is what defeats the elevation trust. Confirm the path is under a Temp/AppData location rather than the real System32 directory, and note any characters used to abuse path parsing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What files were staged in the AppData\Local\Temp\system32 directory, and what wrote them?
  context: >-
    The redirect points winsat.exe at a staged copy under a temp\system32 folder; examine what was placed there. Is the winsat.exe a legitimate signed copy relocated for the abuse, or a modified binary? A DLL placed alongside it is the likely sideload target that carries the actual payload. The Image field identifies the process that dropped the staged files. Content inspection beyond the file-write record requires retrieving the files from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\appdata\local\temp\system32\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did the process that wrote the Amcache value also drop the staged winsat.exe or a DLL to disk?
  context: >-
    A path redirect is only effective if the payload exists at the staged location. Correlating the writing process's file activity and that of its children shows whether the staged winsat.exe or an accompanying DLL was created in the same session and where it lives, enabling retrieval and deeper analysis. If nothing was written by this process, the staging happened earlier or under a different process.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this Amcache winsat entry been modified before on this host, and with what path?
  context: >-
    The appraiser updates this inventory key routinely, but with genuine system paths. Compare the historical Details values on this host: a first-time value pointing at a temp path, or a sudden change from a System32 path to a user-writable one, stands out. Zero history for this specific value indicates the redirect is new to this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Did the redirected value persist, or was the Amcache entry re-modified back to a legitimate path after the bypass?
  context: >-
    Value deletion is not separately recorded in this telemetry, so a revert appears as a subsequent write restoring the true System32 path rather than a delete event. Reviewing later modifications to the same key shows whether the redirect was cleaned up after use or left in place; a value left pointing at the temp path keeps the redirect armed for the next auto-elevated winsat run.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Where did winsat.exe execute from after the redirect, and did it run at high integrity?
  context: >-
    The bypass pays off when the auto-elevated winsat.exe actually runs. Review winsat.exe executions on this host and read the full Image path: a run from the AppData temp path rather than the real System32 location, at High or System integrity, confirms the redirect fired and elevation was obtained. A run only from System32 at medium integrity is normal appraiser behavior.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\winsat.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What modules did winsat.exe load, and were any loaded from a user-writable directory or unsigned?
  context: >-
    A winsat.exe relocated into a staging directory typically sideloads a DLL from its own folder, which is where the elevated payload usually lives. List the modules the process loaded and flag any whose path is under a user temp or AppData directory, or whose signature is absent or invalid. The module hash recorded on the load event supports a reputation lookup for the sideloaded component.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\winsat.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: What actions were performed at high integrity after the bypass?
  context: >-
    UAC bypass is a means to an end; the payoff is whatever runs elevated afterward. Examine High and System integrity processes spawned shortly after the redirect fired — persistence installs, credential access, security-tool tampering, or lateral-movement preparation — to determine the operator's objective on this host.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What process set the Amcache value, and what launched that process?
  context: >-
    Trace the parent of the process that wrote the redirect. A compatibility appraiser component writing this inventory key is routine, whereas a script host, an interactive shell, or a dropped binary manipulating the Amcache entry is the abuse path. If the parent process identifier resolves to NODATA, fall back to the writing process name and host within a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Were other registry-based UAC bypass setups attempted on this host?
  context: >-
    Operators often try several bypass methods until one succeeds. This looks for command-line registry writes to the classic auto-elevation hijack keys — ms-settings, mscfile, exefile, Folder shell\open\command, and Environment. The winsat method itself works through Amcache path parsing rather than these keys, so hits here indicate additional, separate bypass attempts alongside the winsat redirect.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Did other privilege-escalation or UAC-bypass detections fire on this host?
  context: >-
    Multiple bypass or escalation alerts in close succession point to deliberate privilege escalation rather than a false positive. A bypass alert followed by credential-access or defense-tampering alerts maps the stages of the operation and helps establish whether elevation was successfully leveraged.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A bypass rarely lands in isolation. Aggregating process activity around the redirect surfaces what led to it and what followed — a dropper, reconnaissance, or additional persistence. Novel parent-child pairs stand out at low counts against the high-volume agent and OS telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, reconnaissance, or defense tampering — may reveal the stages that preceded the bypass and help reconstruct the timeline. A winsat redirect following an earlier execution or tampering alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did winsat.exe start with a full elevation token from a non-elevated parent?
  context: >-
    An auto-elevation bypass yields a high-integrity winsat.exe whose parent was not itself elevated and with no interactive consent prompt. Security-channel process creation records the token elevation type and the parent for each winsat.exe launch, which separates a normal medium-integrity appraiser run from an auto-elevated launch driven by the redirected path. If Security-log process creation is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and rely on the endpoint process-creation evidence instead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4688
        host.name|expand: '%hostname%'
        NewProcessName|endswith: '\winsat.exe'
      condition: selection
    fields:
      - NewProcessName
      - TokenElevationType
      - ParentProcessName
      - SubjectUserName
- question: >-
    Were other registry modifications made on this host in the same session?
  context: >-
    Attackers who modify one registry key often modify several -- for example, setting a Run key for
    persistence AND disabling Windows Defender AND modifying firewall rules. Finding clusters of
    registry changes from the same user within a short window reveals the full scope of the
    configuration changes and whether multiple attack objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
