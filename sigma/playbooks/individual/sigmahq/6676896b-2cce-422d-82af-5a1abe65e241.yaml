name: Potential APT FIN7 Exploitation Activity
id: 21dfe76f-69cf-410a-affc-a18164603a2f
description: |
  Detects a Windows process chain in which either notepad++.exe spawns cmd.exe, or rdpinit.exe spawns
  notepad++.exe. Each pair is ordinary in isolation — Notepad++ offers an "Open Containing Folder in CMD"
  action, and rdpinit.exe launches published RemoteApp programs into a remote-desktop session — so the rule
  fires on the pairing, not on any command-line content, and it carries no evidence of intent by itself.
  The pattern matters because a graphical application inside a remote session is a common way to reach a
  command shell and from there a script interpreter, which is what remote-access credential reuse looks like
  in process telemetry. The investigation should establish which branch fired, read the child process's full
  command line, and determine whether the chain continued into powershell.exe, rundll32.exe, remote share
  access, or discovery commands.
type: detection
detection_id: 6676896b-2cce-422d-82af-5a1abe65e241
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the parent-child pair match either notepad++.exe spawning cmd.exe or rdpinit.exe spawning
    notepad++.exe, and which of the two fired?
  context: The rule fires when at least one of the two parent-child pairs matches, and the branch that fired
    determines which downstream questions carry weight. A notepad++.exe parent with a cmd.exe child puts the
    shell's command line and its own children at the centre of the investigation. An rdpinit.exe parent with
    a notepad++.exe child says an editor was launched inside a published-application session, and the weight
    moves to what that editor went on to spawn and what the session's user was doing. Confirm the exact
    ParentImage and Image before spending time on either path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run an editor and a command shell in a remote-desktop or
    published-application session?
  context: Developers, administrators, and support staff routinely edit files and open shells from a GUI
    editor, and on a terminal server or jump host that is the normal working pattern for many accounts. A
    user with no editing or scripting role on this host, or a host that publishes applications to accounts
    that never use them interactively, is the case where the pairing is worth pursuing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this process chain part of an authorized penetration test or red team engagement?
  context: Offensive testing commonly reuses remote-desktop credentials and drives shells out of whatever
    graphical applications are already published on the target, which reproduces this pairing exactly. An
    active engagement whose scope covers this host and whose timing brackets the event resolves the alert
    without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What command did the alerting child process actually run?
  context: The command line separates the benign use of this pairing from the rest. An editor's shell action
    produces a bare cmd.exe with a working directory and nothing else, and a published editor started by
    rdpinit.exe carries the document path it was asked to open. A cmd.exe carrying `/c` or `/k` with a chained
    payload — a `start` of powershell.exe, a rundll32.exe export call, a UNC path to an administrative share,
    or discovery such as `net group` and `quser` — describes an operator using the shell as a launcher rather
    than a user opening a folder.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What started the parent process, and is that origin consistent with an ordinary interactive
    session?
  context: The parent's own lineage says how the session was established. An rdpinit.exe parent is started by
    the remote-desktop session stack and implies a remote logon, so the account and source of that logon are
    part of the finding. A notepad++.exe parent started by explorer.exe reflects a user opening the editor;
    one started by a script host, an archive utility, a browser, or another shell reflects a chain that
    reached the editor programmatically. The parent's own command line also names the file it was told to
    open.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent instance spawn?
  context: A single editor-launched shell is a one-off action; the same parent instance launching several
    interpreters, discovery binaries, or network utilities in sequence describes a session being worked
    through a graphical application. The immediate children of the alerting parent are also where the chain's
    next stage appears if there is one. ParentProcessGuid may resolve to NODATA in some alerts, in which case
    the host scope alone still narrows the window.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the alerting process write in the hour after the alert?
  context: Both branches of this rule put a process on the host that can stage the next stage on disk. Script
    files under %TEMP%, C:\Users\Public, or a user profile directory, and files copied out of or into an
    administrative share, are the artifacts to hash and follow to their later execution. File write events
    carry no hash of their own, so the path is what pivots forward to the execution event that does.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: Does the alerting command line invoke a script interpreter, and is any part of it encoded or
    obfuscated?
  context: A shell launched from an editor is most often a plain interactive prompt, so any interpreter
    invocation inside its command line is the part to read closely. Look for `-EncodedCommand` or `-enc` and
    decode the base64; for the readable equivalents, note the combination of policy and profile switches
    (`-nop`, `-noni`, `-ep bypass`, `-exe bypass`) followed by `-f` or `-file` pointing at a .ps1 on a local
    temp path or a UNC administrative share, since that combination is a scripted launch rather than a person
    at a prompt. A rundll32.exe call names an exported function and an ordinal-like argument, which identifies
    the module and entry point to recover.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Which modules did the alerting process load, and are any unsigned or loaded from a user-writable
    path?
  context: The loaded-module set describes what the process reached for beyond its own command line. An editor
    loads its plugin DLLs from its installation directory, and a module of that kind appearing from a user
    profile, %TEMP%, or a public directory is a sideload rather than a plugin. .NET runtime and automation
    modules loaded into a shell indicate in-memory script hosting even when the command line shows nothing
    unusual. DLL load events carry the module's signature state and hash directly, so anything unsigned or
    signed by a publisher unrelated to the software installed here is the artifact to submit for further
    analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
  - external_threat_intel
- question: Did PowerShell script block logging capture any script content on this host around the alert?
  context: Windows Event ID 4104 records the deobfuscated script text PowerShell actually compiled, which is
    ground truth when the launching command line only points at a file or carries an encoded blob. If the
    chain continued from the alerting process into powershell.exe, the script body appears here even when the
    .ps1 it ran was on a remote share and is no longer reachable. If PowerShell operational logs are not
    ingested in this environment, treat zero results as a visibility gap rather than evidence that nothing ran,
    and decode the alerting command line by hand instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
  answer_sources:
  - powershell_script_block
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Script launches driven through a shell frequently pair with a control that is turned off first —
    an execution-policy bypass on the launching line, an AMSI bypass that patches amsi.dll in memory so scan
    calls return success, a downgrade to the version 2 engine that predates script block logging, or a change
    to real-time monitoring. Finding one of these in the hour before the alert places the alerting chain inside
    a prepared sequence rather than an isolated action.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: How often has this parent binary spawned this child binary on this host over the last 90 days?
  context: The editor's "Open Containing Folder in CMD" action produces a recurring notepad++.exe to cmd.exe
    pairing on hosts where someone works that way, and a published-application host produces a recurring
    rdpinit.exe to notepad++.exe pairing every time the program is launched. A high, steady count over 90 days
    describes established usage and moves the weight onto the child's command line; a count of zero or a
    handful says the pairing itself is new on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced either of the rule's parent-child pairs, and does that history
    fit their role?
  context: The query mirrors the rule's own selection structure scoped to this user, so the result is the
    user's 90-day history of these specific pairings rather than generic use of a shell or an editor,
    aggregated by host. A user who produces this pattern regularly across their normal workstations is working
    the way they always do; a user with no prior history of it, or one whose history sits entirely on
    different hosts than the alerting one, is the deviation to weigh against what their role actually requires.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_notepad_plus:
        ParentImage|endswith: \notepad++.exe
        Image|endswith: \cmd.exe
      selection_rdpinit:
        ParentImage|endswith: \rdpinit.exe
        Image|endswith: \notepad++.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent binary historically driven either of the rule's parent-child pairs across the
    environment, or is it new for this activity?
  context: When the alert fires under a service principal or a shared account, user identity does not
    attribute the behavior and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection structure scoped to the alerting parent, so the result is the 90-day history of that parent
    driving these pairings, aggregated by host. A parent already accounting for thousands of prior events
    concentrated on application-publishing hosts is normal operation of that software; a parent with little or
    no history for this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_notepad_plus:
        ParentImage|endswith: \notepad++.exe
        Image|endswith: \cmd.exe
      selection_rdpinit:
        ParentImage|endswith: \rdpinit.exe
        Image|endswith: \notepad++.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user run across the environment around this time?
  context: Where the baseline question asks whether the user's history is routine, this one asks what they
    were doing in the same hour and on which hosts. Activity from one account landing on several hosts in a
    short window fits credential reuse over remote access; activity confined to the alerting host fits a
    person working at one machine. If the alert fired under SYSTEM, a service account, or a computer account,
    this returns unbounded agent and service telemetry and the parent-anchored fleet question is the one that
    answers.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: The query mirrors the rule's selection structure scoped to the alerting parent, fleet-wide, inside
    the alert window. Several hosts producing the pattern at once points at pushed or scheduled automation, or
    at one account moving between machines over remote access. A single host points at a host-local trigger,
    which narrows the investigation back to this session.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_notepad_plus:
        ParentImage|endswith: \notepad++.exe
        Image|endswith: \cmd.exe
      selection_rdpinit:
        ParentImage|endswith: \rdpinit.exe
        Image|endswith: \notepad++.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: The aggregate of parent-child pairs on the host in the surrounding window collapses agent and
    service telemetry into a few high-count rows and leaves novel pairings standing out at low counts. Look
    for the stages that bracket this one — a remote logon and session setup before it, and interpreters,
    discovery binaries, or share access after it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host place this event in a sequence. Remote-access and logon
    anomalies before it support a session that was established with reused credentials; defense tampering or
    discovery detections around it describe an operator working through the host. An otherwise quiet host
    across the preceding six hours leaves this pairing as an isolated event, which the editor's own shell
    action explains for most fires.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
