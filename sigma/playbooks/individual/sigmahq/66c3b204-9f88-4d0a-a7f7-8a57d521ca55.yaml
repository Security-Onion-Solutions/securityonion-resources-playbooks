- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, such as an initial-access exploit, a dropper, defense tampering, or persistence creation, may reveal how the miner was installed and help reconstruct the timeline. Look for patterns: exploitation or download followed by the mining execution.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this same mining command-line pattern running on other hosts?
  context: Automated or worm-driven mining deployments execute the same configuration across many systems in a short timeframe. Because the rule matches a command-line pattern rather than a fixed binary, this looks for the same mining markers on other hosts. Finding identical patterns on multiple endpoints shows the activity is not isolated and helps determine the scope for containment.
