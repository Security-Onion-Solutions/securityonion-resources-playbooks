name: Potential Crypto Mining Activity
id: 5b4f7aed-401b-463c-ae87-1de29ed2c997
description: |
  Detects command lines carrying strings characteristic of cryptocurrency miners: pool and proxy
  switches (--cpu-priority=, -o pool., --nicehash, --algo=rx/0), stratum URLs (stratum+tcp:// and
  stratum+udp://), and base64 fragments of those same tokens used to obfuscate the configuration.
  The rule fires when any of these mining markers appears in a command line and the line does not
  also match a build-toolchain filter (pool.c, pool.o, gcc -), which suppresses legitimate compiler
  invocations. Mining tools consume host CPU/GPU for an operator's profit and beacon to mining pools
  or proxy endpoints over stratum; benign hits come from developers compiling pool-related source or
  from sanctioned mining on lab hardware. The investigation should decode the full configuration,
  confirm whether the user and host are expected to run this, identify the pool or proxy endpoint the
  process connected to, and determine how long the activity has been sustained.
type: detection
detection_id: 66c3b204-9f88-4d0a-a7f7-8a57d521ca55
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line carry a mining marker (pool switch, stratum URL, or its base64 form) and not also a build-toolchain string?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires when the line contains a mining token (such as --cpu-priority=, -o pool., --nicehash, --algo=rx/0, stratum+tcp://, stratum+udp://, or a base64 fragment of those) AND does not also contain a compiler string (pool.c, pool.o, gcc -). Confirm the mining marker is present and that this is not a build-toolchain command that happened to match.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run cryptocurrency mining tools?
  context: Sanctioned mining on dedicated lab or test hardware, or a developer compiling mining-pool source, can trigger this rule. Knowing whether the user role and host function legitimately involve mining software or build toolchains is often the fastest path to distinguishing approved use from resource hijacking on a production endpoint.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full mining configuration on the command line. What pool or proxy, algorithm, and wallet or worker is configured?
  context: 'The command line is the miner''s configuration. Read the pool or proxy endpoint (-o pool. / stratum+tcp:// / stratum+udp://), the algorithm (--algo=rx/0 indicates Monero RandomX), CPU-priority and nicehash flags, and any wallet or worker identifier. Several markers are base64 fragments (for example LS1kb25hdGUtbGV2ZWw9 decodes toward --donate-level=); decode them to recover the real switches the operator hid. The decoded endpoint and wallet are the pivot for the rest of the investigation.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ' --cpu-priority='
        - --donate-level=0
        - ' -o pool.'
        - ' --nicehash'
        - ' --algo=rx/0 '
        - stratum+tcp://
        - stratum+udp://
        - LS1kb25hdGUtbGV2ZWw9
        - 0tZG9uYXRlLWxldmVsP
        - tLWRvbmF0ZS1sZXZlbD
        - c3RyYXR1bSt0Y3A6Ly
        - N0cmF0dW0rdGNwOi8v
        - zdHJhdHVtK3RjcDovL
        - c3RyYXR1bSt1ZHA6Ly
        - N0cmF0dW0rdWRwOi8v
        - zdHJhdHVtK3VkcDovL
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this miner, and is that parent chain expected?
  context: The parent process reveals how the miner was launched. Sanctioned mining usually descends from explorer.exe or a service manager; resource hijacking often descends from a script host, a scheduled-task handler, an exploited service, or a dropper. An unusual parent for a CPU-intensive process points to an unsanctioned install. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What outbound connections did this process make, and do any destinations resolve to mining pools or proxy endpoints?
  context: Miners beacon to a pool or to a stratum proxy, frequently on non-standard high ports or common alternates (3333, 4444, 5555, 7777, 8080, 14444 are typical stratum ports). Correlate the alerting process to its network connections and compare the destination IP, port, and any resolved hostname against the pool or proxy endpoint recovered from the command line. A connection to the configured endpoint confirms active mining; connections to an unexpected endpoint may indicate a proxy or a different operator. If a destination matches a known mining-pool or proxy IP, treat it as a strong confirmation.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Image
- question: How long has this mining pattern been running on this host, and is it sustained or recurring rather than a one-off?
  context: Resource hijacking is defined by sustained consumption. A genuine miner runs continuously or restarts on a schedule to keep the CPU busy, so the firing pattern recurs over hours or days rather than appearing once; a single short-lived hit is more consistent with an accidental match or a test. Sustained high CPU by one process over a long window (commonly a threshold such as more than 15 minutes) is the resource-hijacking signature. Use the count and time spread to gauge whether mining has been ongoing and to bound when it started.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ' --cpu-priority='
        - --donate-level=0
        - ' -o pool.'
        - ' --nicehash'
        - ' --algo=rx/0 '
        - stratum+tcp://
        - stratum+udp://
        - LS1kb25hdGUtbGV2ZWw9
        - 0tZG9uYXRlLWxldmVsP
        - tLWRvbmF0ZS1sZXZlbD
        - c3RyYXR1bSt0Y3A6Ly
        - N0cmF0dW0rdGNwOi8v
        - zdHJhdHVtK3RjcDovL
        - c3RyYXR1bSt1ZHA6Ly
        - N0cmF0dW0rdWRwOi8v
        - zdHJhdHVtK3VkcDovL
      condition: selection
    fields:
      - Image
- question: Has this mining command-line pattern ever run on this host before?
  context: A mining pattern that has never been seen on a host is more suspicious than one that recurs as part of a sanctioned workload. Because the rule matches a command-line pattern rather than a fixed binary, the baseline is scoped to the mining markers themselves. Zero or very low historical counts indicate first-time activity and raise the priority of the decode and network results.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - ' --cpu-priority='
        - --donate-level=0
        - ' -o pool.'
        - ' --nicehash'
