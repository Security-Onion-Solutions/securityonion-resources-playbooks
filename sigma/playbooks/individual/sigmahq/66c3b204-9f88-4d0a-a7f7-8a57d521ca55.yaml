        - c3RyYXR1bSt0Y3A6Ly
        - N0cmF0dW0rdGNwOi8v
        - zdHJhdHVtK3RjcDovL
        - c3RyYXR1bSt1ZHA6Ly
        - N0cmF0dW0rdWRwOi8v
        - zdHJhdHVtK3VkcDovL
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even sanctioned mining or build activity can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific mining firing pattern (not generic process usage) has historically run here. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - ' --cpu-priority='
        - --donate-level=0
        - ' -o pool.'
        - ' --nicehash'
        - ' --algo=rx/0 '
        - stratum+tcp://
