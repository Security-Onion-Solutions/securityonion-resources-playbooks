    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for the dropper or installer that placed the miner, scheduled-task creation that persists it, or reconnaissance and privilege escalation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's mining pattern in the past week, and does the cross-host distribution look like a coordinated deployment or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this mining firing pattern, not generic process usage. Many hosts firing the same pattern points to a scripted or worm-driven mining deployment; one host or a small unrelated set points to a manual or host-local install. Use the host distribution and parent consistency to calibrate severity and containment scope.
