name: HackTool - XORDump Execution
id: ef44953b-cb92-486e-980e-6679dcb1dae5
description: |
  Detects execution of the XORDump process-memory dumping utility, identified either by an Image ending in xordump.exe
  or by command-line switches characteristic of the tool (-process lsass.exe, or -m comsvcs / -m dbghelp / -m dbgcore
  selecting the minidump module). The tool reads LSASS memory, writes a minidump, then XORs and rewrites the output to
  disk so the dump can be exfiltrated while evading signature-based deletion, making this a credential-theft pattern
  against the operating system's authentication subsystem. Because the rule matches either the binary name or the
  command switches, the binary may be renamed to evade name-based detection while still firing on its arguments, so the
  investigation should confirm which branch fired, decode the exact module and target process, establish the true
  identity of the binary, and determine whether LSASS memory was successfully accessed and dumped.
type: detection
detection_id: 66e563f9-1cbd-4a22-a957-d8b7c0f44372
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this event match what the rule detects, either an image named xordump.exe or a command line carrying the LSASS-dump switches?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact image path and command line. The rule fires on either of two branches, an Image ending in xordump.exe, or a CommandLine containing one of the dumping switches (-process lsass.exe, -m comsvcs, -m dbghelp, -m dbgcore). Note which branch matched. A command-switch match with an unexpected image name means the tool was likely renamed to evade name-based detection, which raises the priority of confirming the binary's true identity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to dump process memory or run credential-access tooling?
  context: Memory-dumping utilities targeting LSASS are rarely part of routine operation outside incident response or sanctioned testing. Knowing whether the user role and host function involve forensic memory capture or security testing is often the fastest path to separating an authorized action from credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this XORDump execution part of an authorized penetration test or red team engagement?
  context: Offensive credential-dumping tools are used in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which dumping module and target process were specified on the command line?
  context: XORDump selects its minidump backend through the -m switch (comsvcs, dbghelp, or dbgcore) and its victim through -process (default lsass.exe) or -pid. The comsvcs path proxies the dump through a signed Windows DLL, while dbghelp and dbgcore load the debug-help libraries directly. Reading the exact module and target reveals which credential store was scraped and how the dump was generated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What is the actual identity of this binary based on its metadata and hash?
  context: The rule fires on either the name xordump.exe or the tool's command switches, so a renamed copy still triggers on its arguments. Comparing the Image path on disk against the embedded OriginalFileName, and checking the signing status, reveals whether this is the genuine tool, a renamed copy, or an unrelated binary reusing the same switches. The file hash enables reputation lookups to confirm whether this is a known dumping utility or a novel sample.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: How did this binary arrive on the host?
  context: 'A dumping utility does not appear spontaneously; it was copied, downloaded, or dropped by a parent process. Tracing the file-creation event for the binary by basename reveals the delivery mechanism: a download tool, a malware dropper, manual copy via remote access, or lateral movement from another host. A user-writable landing spot (Desktop, Downloads, Temp, AppData) points to download or extraction; a system directory points to compromise of a privileged process.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was LSASS memory successfully accessed and dumped, and through which method?
  context: This tool targets LSASS, the process holding interactive logon secrets in memory. Confirm from the command line whether the target was lsass.exe and which minidump path was used (comsvcs MiniDump, or a direct dbghelp/dbgcore load). The method reveals operator sophistication and determines that interactive and cached credentials present on this host should be treated as exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did this XORDump process, or any child process it spawned, write additional files to disk beyond the raw dump already checked?
  context: 'Memory dumping requires opening a handle to lsass.exe with broad rights, and that handle open is not observable here — Elastic Defend has no cross-process handle-access channel equivalent to Sysmon EID 10, so the access itself cannot be confirmed or ruled out directly. What is observable is the file artifact the tool produces. This query scopes file writes to the alerting process and any child it spawns, complementing the raw-dump check by also catching the XOR-encoded output the tool writes after re-reading and obfuscating the dump. A zero-row result does not prove no access occurred; treat it as a visibility gap rather than evidence.'
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned this tool and is that parent chain expected?
  context: The parent process reveals how the dumper was invoked. Interactive operator use typically descends from explorer.exe or a shell; automation from services.exe or a scheduled-task host. Parents like mshta.exe, wscript.exe, a remote-access service, or an Office application indicate staged or macro-driven execution rather than hands-on administration. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this binary write a minidump file to disk on the host?
  context: 'The tool writes a minidump (default minidump.dmp) to disk, then re-reads it into memory, XORs the bytes, and rewrites the obfuscated output for exfiltration; both the raw dump and the XOR-encoded artifact may remain on disk. Common write locations are temp and user-profile directories such as %TEMP% and C:\Windows\Temp. Recovering the dump or its XOR-encoded copy confirms a successful capture and preserves it for analysis even after the process exits.'
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did this binary do after execution, and is the same binary present on other hosts?
  context: Examining the child processes, file operations, and network connections from the binary reveals what it did after the dump, such as compressing or moving the output for exfiltration. The same binary, identified by its embedded metadata or hash, appearing on multiple hosts suggests deliberate distribution rather than an isolated action.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: The severity of an LSASS dump depends on which credentials were resident in memory at the time. Any account that logged on interactively or ran a service on this host should be treated as exposed. Domain admin or service-account credentials require incident escalation; a standalone workstation with only a single standard user has a narrower blast radius.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \xordump.exe
      - CommandLine|contains:
        - ' -process lsass.exe '
        - ' -m comsvcs '
        - ' -m dbghelp '
        - ' -m dbgcore '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \xordump.exe
      - CommandLine|contains:
        - ' -process lsass.exe '
        - ' -m comsvcs '
        - ' -m dbghelp '
        - ' -m dbgcore '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of compromise may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \xordump.exe
      - CommandLine|contains:
        - ' -process lsass.exe '
        - ' -m comsvcs '
        - ' -m dbghelp '
        - ' -m dbgcore '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
