name: Bypass UAC Using Event Viewer
id: f1024693-20f3-48b3-aac5-0c82c67eb88d
description: |
  Detects a registry write that sets the default value of the mscfile shell open command
  (a TargetObject ending in _Classes\mscfile\shell\open\command\(Default)) to something other than
  the legitimate mmc.exe handler. On a clean system this class default invokes
  %SystemRoot%\system32\mmc.exe to open Event Viewer; the rule fires when the value is anything else.
  The classic fileless User Account Control bypass plants a command in the per-user
  HKCU\Software\Classes\mscfile\shell\open\command key, then launches auto-elevating eventvwr.exe,
  which queries the per-user class view before the machine-wide default and runs the planted command
  at high integrity with no consent prompt. Legitimate changes to this association are rare;
  investigate what command was written, which process wrote it and what launched that process, whether
  eventvwr.exe subsequently spawned a high-integrity child other than mmc.exe, whether a payload landed
  on disk, and whether the value was reverted afterward.
type: detection
detection_id: 674202d0-b22a-4af4-ae5f-2eda1f3da1af
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set the mscfile Open command to something other than the mmc.exe handler?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value whose path ends in _Classes\mscfile\shell\open\command\(Default) is written AND the value data
    does NOT start with the legitimate %SystemRoot%\system32\mmc.exe handler. Review the exact
    TargetObject and Details on the triggering event to confirm the written value is a non-mmc command.
    On a clean host this class default always invokes mmc.exe to open Event Viewer, so any other value
    is the setup step of the association hijack.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the mscfile shell-open command association?
  context: >-
    The mscfile class default should point at mmc.exe and effectively never changes through normal use.
    A medium-integrity user account writing this per-user Classes key is the preparatory move of the
    User Account Control bypass, so knowing whether the writing account and host function match any
    sanctioned change is the fastest way to separate testing or red-team activity from a live bypass.
    User attribution is present on roughly 94% of endpoint registry events; when it is a machine account
    or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which mscfile association value was written, and why is this key a UAC-bypass location?
  context: >-
    The key HKCU\Software\Classes\mscfile\shell\open\command holds the command that runs when an mscfile
    such as eventvwr.msc is opened. Auto-elevating eventvwr.exe queries this per-user class view before
    the machine-wide default, so a value placed here by a medium-integrity user is inherited and executed
    by the high-integrity process. Confirming the exact path and writing process establishes that this is
    the mscfile hijack location rather than an unrelated Classes edit, and sets up decoding the planted
    command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or payload was written to the mscfile Open command value?
  context: >-
    The Details field holds the command eventvwr.exe will run at high integrity. Decode it: the planted
    value is commonly powershell.exe or cmd.exe with an inline or encoded payload, or a path to a dropped
    binary. If it references a file path, that path becomes a lead for confirming a payload on disk; if it
    is an inline interpreter command, the operation is fileless. Details is present on roughly 79% of
    registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote the mscfile value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read
    its Image, full command, and parent. A reg.exe, powershell.exe, or cmd.exe write launched from an
    Office application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary
    points to the bypass being staged programmatically rather than a deliberate administrator edit. The
    parent chain distinguishes a scripted hijack from an interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the process that wrote this value go on to launch eventvwr.exe or other child processes?
  context: >-
    The bypass completes when the auto-elevating Event Viewer binary is run after the key is planted, and
    the same process or its controlling script frequently launches it moments later. Listing the child
    processes of the writing process reveals whether eventvwr.exe was started as part of the same operation
    and what else that process spawned. eventvwr.exe appearing here shortly after the write ties the
    registry edit to the elevation attempt.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this write, did eventvwr.exe spawn a child process other than mmc.exe?
  context: >-
    A legitimate Event Viewer launch produces eventvwr.exe spawning mmc.exe to load eventvwr.msc. When the
    mscfile association is hijacked, eventvwr.exe instead spawns the planted command at high integrity, so
    a non-mmc child of eventvwr.exe is the bypass firing. The query lists children of eventvwr.exe on this
    host after the write and excludes the legitimate mmc.exe child; powershell.exe, cmd.exe, or an
    arbitrary binary here confirms high-integrity code execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\eventvwr.exe'
      filter_mmc:
        Image|endswith: '\mmc.exe'
      condition: selection and not filter_mmc
    fields:
      - Image
      - CommandLine
      - User
- question: After this write, was the mscfile value restored to the mmc.exe handler or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than from a delete event. Cleanup is common immediately after the
    elevated child launches: a later write that restores the value to the mmc.exe handler indicates the
    hijack was reverted to hide it, while the value remaining a non-mmc command leaves the association
    primed to run again the next time Event Viewer is opened. Compare the Details values written over the
    following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has the mscfile Open command value been modified before on this host?
  context: >-
    The mscfile class default should change rarely and only through deliberate action, so a history with
    no prior writes makes this a first-time change and raises its weight. A history of periodic writes to
    the same value points instead to a management process or a repeatedly run tool. Compare the historical
    Details values to see whether a non-mmc command was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same mscfile value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same write
    confined to one host suggests a targeted bypass. Compare the Details values across hosts to see whether
    they all plant the same command and whether the writing process is consistent, which separates a single
    hands-on operation from repeated use of the same technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who stages a UAC bypass often makes other configuration changes in the same session -
    additional Classes hijacks for other auto-elevating binaries, Defender or firewall policy edits, or
    persistence keys. Clustering the registry writes on this host in a short window around the alert reveals
    the full scope of changes and which process made them. The triggering key appears in the results; the
    signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A UAC bypass rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the association write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the hijack and any high-integrity actions taken once elevation succeeded.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline. A UAC
    bypass is typically a means to run privileged follow-on actions, so prior alerts help place this
    association write within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Gaining high integrity through a UAC bypass is frequently followed by establishing a foothold.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the association write indicate the elevation was used
    to install persistence rather than being an isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the UAC bypass indicate the elevated payload
    established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall making this Event Viewer association change?
  context: >-
    The mscfile association has no routine reason to change, so direct confirmation from the account owner
    is a fast way to resolve the alert. If a red-team operator or an administrator testing an auto-elevation
    tool set the value, that closes it; if no one recalls the action, the account may be compromised or the
    change was made by automated tooling, and the investigation should continue into the writing process
    and any elevated follow-on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: >-
    Does the registry change survive reboot, and is the referenced executable or script still
    present on disk?
  context: >-
    Registry persistence is only effective if the referenced payload exists at the path written to
    the registry value. If an attacker wrote a Run key pointing to C:\Users\Public\backdoor.exe,
    confirming that the file was created at that path determines whether the persistence mechanism
    is active and what it would execute on next logon. The file-write event carries no hash; if the
    payload is present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
