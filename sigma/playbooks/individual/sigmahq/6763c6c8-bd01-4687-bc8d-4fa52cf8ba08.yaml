name: Outlook EnableUnsafeClientMailRules Setting Enabled - Registry
id: 9a215bbb-87c1-488d-a08b-98080f75d4a0
description: |
  Detects a registry write that sets the Outlook value ending in \Outlook\Security\EnableUnsafeClientMailRules
  to DWORD (0x00000001). That value re-enables the Outlook client-side mail-rule actions that run an
  application or execute a script when a matching message arrives — actions disabled by default because they
  turn an inbox rule into a mail-triggered code-execution and persistence mechanism. Legitimate causes are
  rare and tied to a specific business workflow; setting the value back to 1 restores the dangerous rule
  actions so a later-created mail rule can launch a payload whenever a crafted message is delivered.
  Investigate the value that was written, the process and command that wrote it, whether outlook.exe
  subsequently launched child processes, whether other Outlook security values were weakened in the same
  window, and whether the change was pushed fleet-wide or confined to this host.
type: detection
detection_id: 6763c6c8-bd01-4687-bc8d-4fa52cf8ba08
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set EnableUnsafeClientMailRules to DWORD 1?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value
    whose path ends in \Outlook\Security\EnableUnsafeClientMailRules is written with Details of
    DWORD (0x00000001). Review the exact TargetObject and Details on the triggering event to confirm the
    value data is 1 (enabling the unsafe rule actions) rather than 0 (returning the setting to its default
    disabled state), and note the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Outlook client-mail-rule security settings?
  context: >-
    Re-enabling the unsafe client mail-rule actions is not part of routine Outlook use; when it happens
    legitimately it is usually a deliberate action tied to a documented workflow and to a small set of
    accounts. Knowing whether the writing account and host function match that expectation is often the
    fastest way to separate a sanctioned change from tampering. User attribution is present on roughly 94%
    of endpoint registry events; when it is a machine account or missing, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which Outlook security value was modified, and what does enabling it permit?
  context: >-
    The path identifies the setting. A value ending in \Outlook\Security\EnableUnsafeClientMailRules
    controls whether the client-side mail-rule actions that start an application or run a script are
    available; these are disabled by default because they let an inbound message trigger code execution.
    The value data and writing process together confirm the setting was switched on and identify what made
    the change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this key, and does it enable the unsafe rule actions?
  context: >-
    Read the Details field on the triggering write. DWORD (0x00000001) turns the run-application and
    run-script mail-rule actions back on, while 0 is the default disabled state. Details is present on
    roughly 79% of registry modifications and is absent only for binary or empty value data, so for this
    DWORD policy value it should be populated. Confirm the value is 1.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process and command line wrote this value?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid to read
    the full command that made the change. This distinguishes outlook.exe writing its own configuration
    from a reg.exe or PowerShell one-liner (for example Set-ItemProperty or reg add setting
    EnableUnsafeClientMailRules to 1) and reveals whether the same invocation touched other Outlook values.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What spawned the process that wrote this value, and is that parent chain expected?
  context: >-
    The parent of the writing process reveals how the change was invoked. An interactive console launched
    from explorer.exe or a management agent suggests a deliberate administrator or policy action; a writer
    whose parent is an Office application, a script host such as wscript.exe or mshta.exe, or an unsigned
    binary points to scripted tampering. Trace the parent's own origin to judge whether the lineage is
    legitimate.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After this value was enabled, did outlook.exe spawn child processes on this host?
  context: >-
    Once the unsafe rule actions are enabled, a matching inbound message can cause a client-side mail rule
    to launch an application or script, which appears as a process spawned by outlook.exe. Command
    interpreters, script hosts, or unfamiliar binaries parented by outlook.exe in the hours after the write
    are the execution that the setting enables. A binary launched from a network share or a user-writable
    path is especially worth scrutiny.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\outlook.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was a client-side Outlook mail rule created that runs an application or script, and what does it launch?
  context: >-
    Enabling the setting only arms the capability; the persistence itself is a mail rule whose action starts
    an application or runs a script. That rule content lives in the user's mailbox and local profile store,
    not in this registry telemetry, so enumerate the account's client-side rules directly and identify any
    rule whose action launches an executable or script and the path or share it points to. A payload hosted
    on a network share or dropped locally is the mechanism that fires on a matching message.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other Outlook security or persistence-related registry values modified on this host?
  context: >-
    Outlook offers several registry-backed persistence and code-execution footholds beyond this one — macro
    autoload and security-level values, roaming home-page and non-default-store-script flags, and custom
    home-page or Today URLs. An actor who re-enables unsafe mail rules frequently weakens more than one of
    these together. Reviewing all writes to Outlook keys on the host in the surrounding window shows whether
    this was an isolated change or part of a broader reconfiguration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Outlook\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who change one setting often change several — pairing a mail-rule enablement with Defender
    policy, firewall, or Run-key changes. Clustering the registry writes on this host within a short window
    around the alert reveals the full scope of configuration changes and whether multiple objectives were
    pursued together. The triggering key appears in the results; the signal is what else was modified and by
    which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Outlook value been modified before on this host?
  context: >-
    EnableUnsafeClientMailRules should change rarely and only through deliberate action. A history that
    shows no prior writes makes this a first-time change and raises its weight; a history of periodic writes
    to the same value points to a management process that routinely sets it. Compare the historical Details
    values to see whether the same value was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally managed policy or a rollout by administration; the
    same write confined to one host suggests a targeted change. Compare the Details values across hosts to
    see whether they all set the same data and whether the writing process is consistent with a management
    deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: After this write, was the value reverted or re-set again on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    key's re-modification history rather than from a delete event. Look at later writes to the same value: a
    single enablement that is never reverted leaves the unsafe rule actions available, while a later write
    of 0 would indicate the setting was returned to default by remediation or policy. Repeated flipping of
    the value can indicate a policy fighting a manual change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A configuration change rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel parent-child
    pairs stand out at low counts against high-count routine telemetry, which is what points to
    reconnaissance, staging, or execution around the change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or other tampering
    — may reveal the stages that preceded this change and help reconstruct the timeline. Mail-rule
    persistence is often established after initial access to a mailbox, so prior alerts help place this
    registry edit within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or documented approval for enabling this Outlook setting?
  context: >-
    Re-enabling the unsafe client mail-rule actions is a security-relevant configuration change that most
    organizations would gate behind a change ticket or a documented business justification. A corresponding
    ticket suggests authorized activity; the absence of one when policy requires it suggests the change was
    unauthorized and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Mail-rule persistence is often one of several footholds established in the same operation. Scheduled
    tasks, services, registry Run keys, BITS jobs, and WMI subscriptions created by schtasks.exe, sc.exe,
    reg.exe, bitsadmin.exe, or wmic.exe near the change indicate the enablement was part of a broader
    persistence effort rather than an isolated setting edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
