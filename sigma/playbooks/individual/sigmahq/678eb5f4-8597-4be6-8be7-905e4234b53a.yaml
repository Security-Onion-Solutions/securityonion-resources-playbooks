name: Droppers Exploiting CVE-2017-11882
id: e143098f-ff37-4363-b8de-1a627e7d8a5d
description: |
  Fires when the Microsoft Office equation editor process EQNEDT32.EXE spawns any child
  process. EQNEDT32.EXE is an out-of-process COM rendering component for equation objects
  embedded in Office documents; it parses document content and has no functional reason to
  create child processes. CVE-2017-11882 is a memory-corruption remote code execution flaw
  in that component, reached by opening a document with a crafted OLE equation object, and
  the resulting execution appears as EQNEDT32.EXE launching an interpreter or script host
  such as mshta.exe, cmd.exe, powershell.exe, or rundll32.exe. Determine which binary was
  spawned and what it did, identify the document and its delivery path, and establish
  whether a second stage was fetched or written to disk.
type: detection
detection_id: 678eb5f4-8597-4be6-8be7-905e4234b53a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event show EQNEDT32.EXE as the parent of the spawned process?
  context: >-
    The rule fires when a process is created whose parent image ends in EQNEDT32.EXE, with no
    constraint on the child binary or its arguments. Confirm the parent on the alerting event
    and note which binary was spawned, because the equation editor renders embedded equation
    objects and does not launch other programs as part of that work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open Office documents that contain embedded equation objects?
  context: >-
    Equation objects appear in academic, engineering, and finance documents, so the equation
    editor running at all is not itself unusual on some hosts. What the user's role cannot
    explain is the editor creating a child process. Establish whether the user routinely
    handles documents from outside the organisation and whether this host is a normal
    document-handling endpoint or a server or service host where document rendering is
    unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What document or email attachment led to the equation editor running on this host?
  context: >-
    The equation editor is started out of process through COM, so its own command line is
    normally just an embedding switch and does not name the document. Identify the Office
    application that was active at the time and work back to the file it had open, then check
    mail and web gateway records for how that file arrived. Delivery for this technique is
    typically an attachment or download opened by the user, and the filename plus sender or
    source URL is what allows blocking and a search for other recipients.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: Is this Office installation patched against CVE-2017-11882?
  context: >-
    CVE-2017-11882 was addressed in November 2017, and a subsequent Office update removed the
    equation editor component from the product entirely. An installation on which EQNEDT32.EXE
    still exists and executes is therefore missing years of updates or has had the component
    restored. Record the Office build on this host and check whether other hosts share it,
    since patch level determines whether the same document would execute elsewhere.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Are files written by this execution still on disk for analysis?
  context: >-
    Exploitation of the equation editor commonly stages a second stage before or while it runs.
    The paths that matter are the user profile Downloads folder, the per-user and machine Temp
    directories, AppData\Local and AppData\Roaming, synchronised cloud caches, and the Office
    startup folders. This correlates file writes to the alerting process and its direct
    children, so a file still present can be hashed, submitted, or reviewed; a file already
    removed is itself a finding worth recording.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Were other users or hosts affected by the same document delivery?
  context: >-
    Documents carrying this exploit are usually sent to more than one recipient, and every
    unpatched host that opens one produces this same detection. Correlating this rule across
    hosts and users shows how many endpoints reached the execution stage and which accounts
    were addressed, which sets the list of systems to examine and the population to search mail
    records for.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: How was EQNEDT32.EXE itself started, and what command line did it carry?
  context: >-
    The equation editor is instantiated through COM when a document containing an equation
    object is opened, so its own creation event is typically a service host launching it with
    an embedding switch rather than the Office application launching it directly. Retrieving
    the editor's own process event confirms that launch path and gives the start time from
    which to measure how quickly the child appeared. A launch that does not follow this pattern
    points at the editor being invoked deliberately rather than by document rendering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: Did the equation editor or the hosting Office application record an application-error event around this time?
  context: >-
    CVE-2017-11882 works by corrupting memory inside the equation editor, so exploitation
    attempts frequently leave an application-error record (Event ID 1000) naming EQNEDT32.EXE
    or the Office process that hosts it, within minutes of the child process being created. A
    crash entry alongside the spawn supports memory-corruption exploitation over a
    configuration or automation explanation. Absence of one does not rule exploitation out,
    since a reliable exploit returns control cleanly, and hosts that do not forward the
    application channel return nothing here by construction.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: application
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 1000
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Data
  answer_sources:
  - manual_review
- question: What exactly did the process spawned by the equation editor do? Decode its command-line arguments.
  context: >-
    The binaries this technique reaches for are the ones an Office component should never
    launch, typically powershell.exe, cmd.exe, wscript.exe, mshta.exe, rundll32.exe,
    regsvr32.exe, msiexec.exe, or curl.exe. Decode every argument, since the payload is carried
    there. A URL handed to mshta.exe, a UNC path in a start command that triggers the WebClient
    service, or an encoded interpreter payload each name the second stage and the infrastructure
    it comes from. Command length is constrained by the exploit itself, so the argument is often
    short and directly readable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Did the spawned process or its children connect outbound after the exploit ran?
  context: >-
    The execution stage of this technique is usually a downloader, so the step after the spawn
    is an outbound fetch of the real payload over HTTP, HTTPS, or SMB to a UNC path. Connections
    from the alerting process lineage within about fifteen minutes of the spawn, to destinations
    outside known update and content-delivery infrastructure, identify the retrieval and the
    address to block and hunt for elsewhere. No outbound connection suggests the payload was
    embedded in the document rather than fetched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - DestinationIp
      - DestinationPort
      - Image
  answer_sources:
  - network_connection
- question: What other processes did the equation editor spawn on this host?
  context: >-
    A document can carry several equation objects that execute in sequence, so exploitation
    often produces more than one child - one command to trigger a network service or stage a
    file, another to run what was retrieved. Listing every child of the editor on this host
    reveals the full sequence rather than the single event that alerted, and the order and
    timing of those children reconstruct what the document was built to do.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has the equation editor ever spawned this binary on this host before?
  context: >-
    This counts how often this parent and child pairing has occurred on this host over 90 days.
    Because the editor is a rendering component, there is no benign workflow that produces a
    non-zero count for any child, so a history here would point at a recurring exploitation
    attempt against this host rather than at normal software behaviour. A zero count establishes
    the pairing as new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's
    90-day history of equation-editor child spawning, aggregated by host, rather than generic
    document activity. A prior history means the user has opened documents that reached this
    component before, which points at a repeated delivery attempt against this recipient and at
    hosts that stayed unpatched. Weigh the result against the documents the role normally
    receives and from whom.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \EQNEDT32.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern on this host or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the
    behaviour and the launch mechanism is the meaningful pivot. The query mirrors the rule's
    selection scoped to the alerting parent, so the result is the 90-day history of this parent
    driving this specific pattern, aggregated by host. A count concentrated on a few hosts
    indicates documents repeatedly reaching this component on unpatched endpoints; a zero
    history makes this the first occurrence in the environment.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \EQNEDT32.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's process activity across all hosts in the hour around the alert shows
    whether the document was opened on more than one endpoint and whether other activity
    followed the execution. If the alert fired under a machine or service account, this view
    returns routine agent activity and the parent-anchored fleet view is the meaningful answer
    instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide,
    in the window around the alert. Several hosts producing equation-editor child processes at
    once indicates the same document reached multiple recipients within minutes, which changes
    the response from one host to a recipient list. A single host points at a local document
    open.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \EQNEDT32.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity on the host in the fifteen minutes either side of the alert
    places the exploit in sequence - what the user was doing when the document opened, and what
    ran after the child process. Repetitive management and agent activity collapses into
    high-count rows, while new parent and child pairings stand out at low counts; those are the
    rows to read for follow-on execution, persistence, or reconnaissance.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Document-borne exploitation is an entry point, so earlier detections on the same host
    usually mean either a previous delivery attempt against this user or that the entry point
    is not the one being investigated. Reading the alert timeline for the preceding six hours
    establishes whether this is the first stage observed or a later step in a sequence already
    under way.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
