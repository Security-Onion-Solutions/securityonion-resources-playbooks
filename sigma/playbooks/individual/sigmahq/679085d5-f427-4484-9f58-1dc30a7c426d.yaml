name: WinDivert Driver Load
id: 286763d5-f4ab-4b62-9e05-be2b45a44ed9
description: |
  Detects the load of the WinDivert kernel driver, either by a driver path containing one of five known
  file names (\WinDivert.sys, \WinDivert64.sys, \NordDivert.sys, \lingtiwfp.sys, \eswfp.sys) or by an
  import hash matching one of eighteen published driver builds. WinDivert is a maintained open-source
  packet capture and diversion framework: a vendor-signed kernel driver plus a user-mode library that
  lets any application with administrative rights intercept, modify, block, and re-inject network
  packets, and attribute diverted traffic to a process. Personal firewalls, VPN and proxy clients,
  ad-blockers, game network tools, and network testing utilities all bundle it, and several products
  ship it under a rebranded file name, so a load on its own is not a finding. The same driver is also
  used to redirect a victim's outbound traffic, to intercept credentials in transit, and to redirect
  SMB connections into a relay, and because the driver is already signed it loads where driver
  signature enforcement is active without the operator needing signing infrastructure. A valid
  signature is therefore expected and does not settle the question. The investigation should determine
  which product loaded the driver, whether that product belongs on this host, where the driver file came
  from, and whether traffic redirection or authentication activity followed the load.
type: detection
detection_id: 679085d5-f427-4484-9f58-1dc30a7c426d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the loaded driver match what this rule detects — either a path containing one of the five
    divert-driver file names, or an import hash on the rule's list?
  context: >-
    The rule fires on either branch on its own, so note which one matched. A file-name match tells you
    which build of the family is on the host, including the rebranded names some products ship
    (NordDivert.sys, lingtiwfp.sys, eswfp.sys). An import-hash match under a file name that is not on
    the list means known WinDivert driver content loaded under a renamed file, which is the more
    deliberate of the two and moves the origin questions to the front.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
- question: Is this host and user expected to run software that intercepts and redirects network traffic?
  context: >-
    A VPN client, a personal firewall, an ad-blocking proxy, or a network testing tool on an engineer's
    workstation accounts for this driver routinely. The same driver on a server, a kiosk, or a managed
    endpoint whose build contains no such product is the case to resolve. Knowing the host's function
    and the account's role is usually the fastest route to a verdict.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: From what path did the driver load, who signed it, and which process triggered the load?
  context: >-
    The install directory is the strongest early discriminator. A driver under Program Files next to a
    named product fits software someone installed; the framework needs no formal install step, so a
    driver in a temporary, user-writable, or download directory fits a file brought to the host for a
    single purpose. Read the signer alongside the path — the driver's own valid signature is exactly
    what makes it usable without meeting driver signature enforcement, so a valid status here narrows
    nothing on its own, while a signer belonging to a product you can name does.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: >-
    Which drivers of this family have loaded on this host over the past ninety days, and what are their
    hashes and signers?
  context: >-
    The query matches all five file names the rule enumerates rather than only the alerting one, so it
    surfaces rebranded builds a different product may have installed on the same host. Compare the
    signers and hashes across the results — one signer and one hash over a long history fits an
    installed product keeping its driver updated; several distinct hashes under the same name, or a
    signer unrelated to any product on the build, are worth resolving through hash reputation lookups
    before treating the load as routine.
  range: -90d
  answer_sources:
  - driver_load
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\WinDivert.sys'
          - '\WinDivert64.sys'
          - '\NordDivert.sys'
          - '\lingtiwfp.sys'
          - '\eswfp.sys'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Which process wrote the driver file to this host, and when?
  context: >-
    A driver written by a product installer or a software deployment agent fits managed or self-service
    installation, and the writing process usually names the product outright. A driver written by a
    browser, an archive utility, a script host, a remote-management agent, or an unsigned binary points
    to the file arriving for this load rather than to installed software. A write into a drivers
    directory or a temporary path shortly before the load is the pattern to look for. File writes carry
    no hash, so take the writing process, the path, and the timing here and read signature and hash data
    from the load event itself.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: Which process triggered the driver load, and what launched that process?
  context: >-
    The acting process is named in the alert but its origin is not. Retrieving that process's own start
    event names the parent that launched it. A named product's own executable or service, started by
    services.exe or by a person through explorer.exe, fits installed software. A script host, a
    remote-management agent, a console started under an administrative session, or an unfamiliar binary
    as parent is the case to pursue, since the framework is designed to be loaded by any user-mode
    program that holds the file. The long window is intentional — service and shell parents often start
    well before the load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did a companion divert library load into a user-mode process on this host around the driver load?
  context: >-
    The kernel driver does nothing on its own — a user-mode process opens a handle through the matching
    library and supplies the packet filter, and the library sits next to the application that uses it.
    Identifying the process that loaded that library names the product behind the driver load, which is
    the discriminator this whole investigation turns on. A recognizable VPN, firewall, or proxy
    executable loading it from its own install directory accounts for the driver. A script host, a
    generic loader, or no library load at all leaves the driver's purpose unexplained.
  range: +/-15m
  answer_sources:
  - image_load
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|contains:
          - '\WinDivert.dll'
          - '\WinDivert32.dll'
          - '\WinDivert64.dll'
          - '\NordDivert.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
- question: Was a driver service installed on this host around the load, and what image path did it register?
  context: >-
    A kernel driver reaches memory through a service entry, so a service installation recorded near the
    load usually names the driver file and the account that registered it. Compare the registered name
    and image path against the product you expect — a service pointing at a driver in a temporary or
    user-writable directory, or one whose name matches no installed software, is the result to pursue.
    Some tooling loads this driver reflectively and never registers a service at all, so an absent
    service entry alongside a confirmed load is itself worth noting rather than reassuring. Service
    installation auditing is not collected in every environment, so no results here is a visibility gap
    rather than evidence no service was created.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: >-
    Did inbound network logons arrive at this host after the driver load, and were any authenticated
    with NTLM from unexpected internal sources?
  context: >-
    Redirecting inbound SMB into a relay is one documented use of this driver, and the relay pattern
    shows up as network logons the host would not otherwise receive. Read the authentication package,
    the source address, and the workstation name together — NTLM logons from hosts that have no reason
    to reach this one, or a burst of accounts authenticating in a short window, are the results to
    pursue; Kerberos logons from the usual peers are not. Correlate against the driver load time and the
    accounts involved. If Security-channel logon auditing is not collected from this host, treat zero
    rows as a visibility gap rather than evidence nothing arrived.
  range: +4h
  answer_sources:
  - manual_review
  - active_directory
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4624
        LogonType: 3
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - AuthenticationPackageName
      - IpAddress
      - WorkstationName
      - LogonType
- question: What did the process that loaded the driver run, and does its command line name ports, filters, or traffic it targeted?
  context: >-
    The user-mode side supplies a packet filter expression when it opens the driver, and command-line
    tooling built on the framework frequently carries the target in its arguments — a port number, a
    protocol, a redirect destination, or a configuration file path. A port used for authenticated
    protocols points the investigation at credentials in transit; a redirect toward a local listener
    points at interception of the host's own outbound sessions. A product executable with no
    interception arguments at all means the filter lives in the application's configuration rather than
    the command line, and the loaded library and install path are what identify it.
  range: +/-30d
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Traffic interception that yields credentials is typically followed by their use elsewhere. The query
    returns outbound connections from this host to remote-access ports — 3389 (RDP), 445 (SMB/PsExec),
    5985/5986 (WinRM), 22 (SSH) — in the hours after the load; the originating Image and User show what
    drove each connection. Two limits to keep in mind — credentials captured here and replayed from
    another machine will not appear in this result, so check Security-channel 4624 logons on suspected
    targets for the accounts that hold sessions on this host, and the query depends on endpoint network
    telemetry being collected from this host; if it is not, treat zero rows as a visibility gap rather
    than as evidence no movement occurred.
  range: +4h
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed, and do any have elevated privileges?
  context: >-
    Loading this driver requires administrative rights, and whatever traffic passed through the host
    while it was loaded was available to the loading process. Establish which accounts held sessions on
    this host during the load window and cross-reference them against directory group memberships.
    Domain administrative or service accounts with broad access change the response; a single standard
    user on their own workstation running a VPN client does not.
  range: +/-30d
  answer_sources:
  - active_directory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What outbound connections did this host make around the driver load, and which processes made them?
  context: >-
    The driver's purpose is to act on traffic, so the traffic around the load is the evidence of what it
    was used for. Look for a process holding many short-lived connections it does not normally make, a
    redirect toward a local listener, connections to an address that no installed product accounts for,
    or the loading process itself carrying sessions on behalf of others. A VPN or proxy client
    concentrating the host's egress through one endpoint of its own is the benign form of the same
    pattern.
  range: +/-1h
  answer_sources:
  - network_connection
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Has this driver loaded on this host before, and under what processes?
  context: >-
    The driver requires no install step and auto-removes after the owning processes exit, so a host
    running a product built on it produces repeated loads across the history — frequent loads can mean
    an application that starts and stops often rather than persistence. A steady history under the same
    loading process fits installed software. A first or near-first load, or a familiar history with a
    new loading process for this event, moves the origin questions to the front.
  range: -90d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this driver loading on other hosts in the environment?
  context: >-
    Cross-host distribution separates one person's tool from a deployment. The driver on a set of hosts
    that share a VPN or firewall product fits managed software, and the consistent install path across
    those hosts confirms it. The same driver on unrelated hosts — servers, or endpoints with no such
    product — points to distribution by something other than software installation and widens the
    investigation to those hosts. Hosts not reporting driver load telemetry are absent from this result
    regardless of what loaded on them.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: >-
    Has a driver whose import hash matches a known build of this family loaded anywhere in the
    environment, including under a file name the rule's name list does not cover?
  context: >-
    This query matches on driver content rather than on the file name, so it surfaces copies that were
    renamed to sit outside name-based detection while keeping the signed driver's capability. Loads
    under the family's own names are expected here and add nothing beyond what the name-anchored
    questions already showed; the results worth pursuing are loads under a name unrelated to any
    networking product, or the same import hash appearing on hosts whose build contains no such
    software. The hash list covers a fixed set of published builds, so a newer or recompiled driver will
    not match — no results is not evidence that no renamed copy exists.
  range: -90d
  answer_sources:
  - driver_load
  - external_threat_intel
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        Hashes|contains:
          - 'IMPHASH=0604bb7cb4bb851e2168d5c7d9399087'
          - 'IMPHASH=2e5f0e649d97f32b03c09e4686d0574f'
          - 'IMPHASH=52f8aa269f69f0edad9e8fcdaedce276'
          - 'IMPHASH=c0e5d314da39dbf65a2dbff409cc2c76'
          - 'IMPHASH=58623490691babe8330adc81cd04a663'
          - 'IMPHASH=8ee39b48656e4d6b8459d7ba7da7438b'
          - 'IMPHASH=45ee545ae77e8d43fc70ede9efcd4c96'
          - 'IMPHASH=a1b2e245acd47e4a348e1a552a02859a'
          - 'IMPHASH=2a5f85fe4609461c6339637594fa9b0a'
          - 'IMPHASH=6b2c6f95233c2914d1d488ee27531acc'
          - 'IMPHASH=9f2fdd3f9ab922bbb0560a7df46f4342'
          - 'IMPHASH=d8a719865c448b1bd2ec241e46ac1c88'
          - 'IMPHASH=0ea54f8c9af4a2fe8367fa457f48ed38'
          - 'IMPHASH=9d519ae0a0864d6d6ae3f8b6c9c70af6'
          - 'IMPHASH=a74929edfc3289895e3f2885278947ae'
          - 'IMPHASH=a66b476c2d06c370f0a53b5537f2f11e'
          - 'IMPHASH=bdcd836a46bc2415773f6b5ea77a46e4'
          - 'IMPHASH=c28cd6ccd83179e79dac132a553693d9'
      condition: selection
    fields:
      - host.name
      - ImageLoaded
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Activity surrounding the load supplies the immediate context — what preceded it and what followed.
    Scan for an installer or archive utility unpacking shortly before, for credential-access tooling,
    for security agents or services stopping, and for service or task creation. Repetitive agent
    telemetry collapses into single high-count rows, so novel parent-child pairs stand out at low
    counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections help reconstruct what preceded the load. Remote-management activity, defense
    tampering, or credential access ahead of a driver that can read and rewrite the host's traffic
    places the load in a sequence rather than on its own. Nothing before it, on a host whose owner runs
    networking software, points the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
