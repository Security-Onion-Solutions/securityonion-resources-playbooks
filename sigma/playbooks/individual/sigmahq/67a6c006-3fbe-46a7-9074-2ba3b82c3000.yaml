name: Path To Screensaver Binary Modified
id: a7a1f6f6-3bc4-4c4d-882e-07048f0be4ea
description: |
  Detects modification of the HKCU\Control Panel\Desktop\SCRNSAVE.EXE registry value — the path to the executable Windows launches after the interactive session goes idle — written by a process other than the Control Panel screensaver handlers (rundll32.exe, explorer.exe), which the rule filters out. Repointing this value to an attacker-controlled binary establishes persistence that fires on idle; legitimate screensaver changes are normally made by a user through the Settings applet and go through the excluded handlers. The investigation should determine what binary the value now points to, whether that payload exists on disk and executed, whether the screensaver was actually enabled with a short idle timeout, and which process performed the write. Registry value deletion is not observable in this telemetry, so judge cleanup from the value's re-modification history and whether the payload ran, not from a delete event.
type: detection
detection_id: 67a6c006-3fbe-46a7-9074-2ba3b82c3000
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alert show a write to the SCRNSAVE.EXE screensaver-path value by a process other than rundll32.exe or explorer.exe?
  context: >-
    The rule fires when a value is written to a key ending in \Control Panel\Desktop\SCRNSAVE.EXE (TargetObject) AND the writing process is neither rundll32.exe nor explorer.exe — the two handlers the Control Panel screensaver applet uses. Because those are filtered out, an alert means a different process set the screensaver path. Confirm the exact key path and the writing process before investing investigation time; screensaver changes made through the Settings UI go through the excluded handlers and do not fire this rule.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change the screensaver binary path?
  context: >-
    Legitimate screensaver changes are usually made by an interactive user and are rare on servers and unattended systems. Knowing whether the account and host function fit a manual screensaver change is often the fastest way to separate a true positive from routine activity. User attribution is present on roughly 94% of endpoint registry events; when it is a machine account (HOST$) or SYSTEM, pivot on the writing process (Image) instead — a screensaver path set under a service or machine context is unusual.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What exact key and value data were written, and which process performed the write?
  context: >-
    The SCRNSAVE.EXE value under HKCU\Control Panel\Desktop names the executable Windows runs when the session goes idle. Read the exact key path, the value data, and the writing process here; a screensaver path set by a script host, a command interpreter, or an unfamiliar tool is the persistence signal. Keep this question focused on the location-and-writer judgment and let the value-decoding question carry the payload analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What binary does the screensaver value point to, and is that path in an expected location and signed?
  context: >-
    The value data (Details) is the payload path the screensaver launches on idle. Extract that path and check where it lives — a legitimate screensaver is a signed .scr under System32 or a vendor directory, while a path in Temp, AppData, ProgramData, a user-profile folder, or a renamed executable is the abuse pattern. Confirm whether the binary at that path is signed and by whom. Details is absent for binary or empty value data (roughly 79% of registry modifications carry it); missing value data does not clear the alert.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Was the screensaver activated and its idle timeout shortened around the same time?
  context: >-
    Repointing the SCRNSAVE.EXE value only fires the payload if the screensaver is actually active. This technique typically also sets ScreenSaveActive to 1, lowers ScreenSaveTimeOut so the payload runs after a brief idle, and clears ScreenSaverIsSecure so no unlock is required. Companion writes to these values on this host near the alert indicate the persistence was deliberately armed rather than a stray configuration change.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Control Panel\Desktop\ScreenSaveActive'
          - '\Control Panel\Desktop\ScreenSaveTimeOut'
          - '\Control Panel\Desktop\ScreenSaverIsSecure'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has the screensaver-path value been changed on this host before, and to what?
  context: >-
    A first-time change to the SCRNSAVE.EXE value is more suspicious than one that changes as part of a known configuration. Compare the historical value data on this host: a value that has never been touched, or one that moves from a signed System32 screensaver to a user-writable path, stands out. Zero history indicates the value has not been modified before this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors setting screensaver persistence commonly write the companion values that arm it and often make other changes in the same session — disabling a security policy or adding a second autostart. Clusters of registry writes from the same process within a short window reveal the full scope of the configuration change. The triggering key appears in the results; the signal is what else was modified. If the host is registry-noisy, narrow to the writing process from the alert or to security-relevant hive paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Does the screensaver binary exist on disk at the path written to the value?
  context: >-
    Screensaver persistence is only effective if the payload exists at the path the value names. Correlating file activity by the registry-writing process and its children shows whether that binary was created in the same session as the value change — for example a drop into AppData or ProgramData just before the screensaver path was set. The file-write event carries no hash; if the payload is present, hash it from a later execution or retrieve it for a reputation lookup. If the file is absent, the persistence is staged but not yet armed.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the binary the screensaver value points to execute on this host after the change?
  context: >-
    The screensaver payload runs when the session goes idle past the configured timeout, but an actor may also run it directly. Look for process executions on this host after the change whose image is the path recorded in the value; a hit confirms the persistence is live and the payload has run at least once. Absence means the mechanism is in place but has not yet fired on idle — still active for the next idle period. If the value data was not captured (registry Details is absent for roughly a fifth of writes), read the payload path from the registry event and match executions manually.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Was the screensaver-path value changed on other hosts in the environment?
  context: >-
    The same screensaver modification across multiple hosts may indicate a policy or software push, or widespread malware; a single-host change is more consistent with targeted persistence. Compare the value data across hosts — the same signed screensaver everywhere points to managed configuration, while different payload paths per host point to attacker activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote the screensaver value, and what started that process?
  context: >-
    The writing process shown on the alert is the immediate actor; tracing its own parent reveals whether the chain is legitimate — a user-driven configuration tool, a management agent — or suspicious, such as a script host, an Office application, or a command interpreter spawning the process that set the screensaver path. If the parent process identifier resolves to NODATA, fall back to the writing process name and host with a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence rarely lands in isolation. Aggregating process activity around the change surfaces what led to it and what followed — reconnaissance, a download or dropper, privilege escalation, or additional persistence. Novel parent-child pairs stand out at low counts against the high-count agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access, or a suspicious download — may reveal the stages that preceded the screensaver change and help reconstruct the timeline. A persistence write following an earlier execution or tampering alert reads very differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were files dropped to Startup folders or autostart paths on this host?
  context: >-
    File-based persistence bypasses process-based detection: dropping an executable into a Startup folder or an autostart path achieves execution without a registry write to a Run key. File-event monitoring captures these drops even when standard persistence utilities are avoided, and a Startup-folder drop alongside the screensaver change points to stacked persistence.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, deployment, or documented approval for this screensaver change?
  context: >-
    Managed screensaver policy is normally pushed through group policy or a deployment tool, not written directly by an ad-hoc process. A corresponding change record suggests authorized activity; the absence of one, especially for a value pointing at a user-writable path, points toward unauthorized persistence. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing the screensaver or installing software that would set it?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish legitimacy. If the user recalls setting a custom screensaver or installing software that configured one, the value and its path should match that product; if no one recalls the action, the credentials may be compromised or the write may be automated. When the action confirms, capture why it was done and what was expected to run.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
