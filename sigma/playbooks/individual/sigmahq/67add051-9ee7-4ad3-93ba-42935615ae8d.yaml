name: PUA - Process Hacker Driver Load
id: 4f80c117-485a-43a4-a5be-94eba8f2c328
description: |
  Detects the load of the Process Hacker kernel driver, either by a driver path ending in
  \kprocesshacker.sys or by an import hash matching one of four published driver builds. Process Hacker
  is an open-source process, handle, and service monitor whose kernel driver supplies what user-mode
  APIs withhold: opening handles to processes that are protected against normal access, terminating
  processes that resist termination, and duplicating or closing object handles directly. Administrators
  and developers run it legitimately, so a driver load on its own is not a finding, and the driver is
  signed, so it loads where driver-signature enforcement is active. The same capability is used to
  terminate or blind security software and to reach protected processes without the tool's interface
  ever running. The investigation should determine whether the Process Hacker application is actually
  present and in use on this host, who placed the driver file there, what registered it as a service,
  and whether security-tooling or credential-access activity followed the load.
type: detection
detection_id: 67add051-9ee7-4ad3-93ba-42935615ae8d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the loaded driver match what this rule detects — either a path ending in \kprocesshacker.sys,
    or an import hash on the rule's list?
  context: The rule fires on either branch independently, so note which one matched. A path match with
    an import hash outside the rule's list points to a build the rule does not enumerate, or to an unrelated
    driver carrying the name. An import hash match under a file name other than kprocesshacker.sys points
    to a renamed copy of a known Process Hacker driver, which is the more deliberate of the two and moves
    the origin questions to the front.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
- question: Is this host and user expected to run a process and handle monitoring tool that installs a
    kernel driver?
  context: Process Hacker is common equipment for administrators and developers diagnosing a locked file,
    a stuck handle, or a runaway process on their own workstation. The same tool on a server, a kiosk,
    or an endpoint with no troubleshooting role is worth resolving. Knowing the host's function and the
    account's role is usually the fastest route to a verdict.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is Process Hacker on the organization's approved software list, and is it approved for this
    host?
  context: Many organizations sanction a specific set of diagnostic tools and treat everything else as
    unmanaged software, regardless of the tool's reputation. Process Hacker is frequently approved for
    engineering and support staff and just as frequently absent from a standard endpoint build. The project
    is also superseded by System Informer, so a fresh Process Hacker install rather than its successor
    is itself worth asking about. An unapproved installation is not by itself a compromise, but it moves
    the question from "is this expected" to "how did it get here".
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: From what path did the driver load, who signed it, and which process triggered the load?
  context: An install-directory path under Program Files with a valid signature fits routine use. A driver
    staged in a temporary, user-writable, or otherwise non-standard directory fits a copy brought to the
    host for a single purpose. Read the signer and signature status alongside the path — a valid signature
    is expected here and does not settle the question, because the driver's legitimate signature is exactly
    what lets it load where driver-signature enforcement is active.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Has a driver whose import hash matches one of the known Process Hacker driver builds loaded
    on this host under any file name?
  context: The query drops the file-name constraint and matches only on the rule's import-hash list, so
    it surfaces loads of the same driver content under a renamed file. Renaming a known driver is a common
    way to evade name-based rules while keeping the signed binary's capability. Several results under
    different names, or a single load under a name unrelated to the tool, are worth resolving; a history
    of loads under the tool's own name alongside normal use is routine. Import hashes are not recorded
    on every driver load event, so no results here is weaker evidence than results.
  range: -90d
  answer_sources:
  - driver_load
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Hashes|contains:
          - 'IMPHASH=821D74031D3F625BCBD0DF08B70F1E77'
          - 'IMPHASH=F86759BB4DE4320918615DC06E998A39'
          - 'IMPHASH=0A64EEB85419257D0CE32BD5D55C3A18'
          - 'IMPHASH=6E7B34DFC017700B1517B230DF6FF0D0'
      condition: selection
    fields:
      - ImageLoaded
      - Signature
      - SignatureStatus
      - Hashes
- question: Was the Process Hacker or System Informer application running on this host around the driver
    load?
  context: The driver exists to serve the tool's interface, so the tool's absence is the discriminator
    that carries the most weight here. An interactive session with ProcessHacker.exe or SystemInformer.exe
    running under a logged-on administrator matches ordinary troubleshooting. The driver loading with
    no corresponding application process means something loaded the kernel component for its capability
    alone, which is the pattern behind using it to reach or terminate protected processes.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_gui:
        Image|endswith:
          - '\ProcessHacker.exe'
          - '\ProcessHacker2.exe'
          - '\SystemInformer.exe'
      condition: selection and selection_gui
    fields:
      - Image
      - CommandLine
      - ParentImage
      - User
- question: Which process wrote the driver file to this host, and when?
  context: A driver written by an installer, a software deployment agent, or the tool's own setup routine
    fits managed or self-service installation. A driver written by a browser, an archive utility, a script
    host, a remote-management agent, or an unsigned binary points to the file arriving for this load rather
    than to installed software. File writes carry no hash, so use the writing process, the path, and the
    timing here, and take signature and hash data from the load event itself.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: Which process triggered the driver load, and what launched that process?
  context: The acting process is named in the alert but its origin is not. Retrieving that process's own
    start event names the parent that launched it. A parent such as explorer.exe or a console fits a person
    starting a tool; services.exe fits a registered service loading its driver at start; a script host,
    a remote-management agent, or an unfamiliar binary as parent is the case to resolve, since service
    management driven from a non-administrative process is a recognized pattern for installing a driver
    as a capability rather than as software. The long window is intentional — service and shell parents
    often start well before the load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was a service installed on this host around the driver load, and what image path did it register?
  context: A kernel driver reaches memory through a service entry, so a service installation recorded
    within hours of the load usually names the driver file and the account that registered it. Compare
    the registered service name and image path against the tool's own naming — a service pointing at a
    driver in a temporary or user-writable directory, or one whose name is unrelated to the tool, is the
    result to pursue. Service installation auditing is not collected in every environment, so no results
    here is a visibility gap rather than evidence no service was created.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4697
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ServiceFileName
      - SubjectUserName
- question: What service registry entries were created or modified on this host around the driver load,
    and do any reference the driver's file path?
  context: Driver services are configured under HKLM\System\CurrentControlSet\Services, where the subkey
    name is the service name and the ImagePath value names the driver file. Reading these writes shows
    what name the driver was registered under, what start type it was given, and which process wrote the
    entries. A start type that survives reboot, or a service key written by a process unrelated to the
    tool's installer, is worth resolving; a key written by the tool's own setup routine and removed afterward
    fits ordinary use.
  range: +/-4h
  answer_sources:
  - registry_event
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\System\CurrentControlSet\Services\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has this driver loaded on this host before, and under what processes?
  context: A driver that has loaded steadily over the past ninety days on this host fits installed tooling
    that someone uses regularly. A first or near-first load moves the origin questions to the front — where
    the file came from and what registered it. Note the loading processes as well — a consistent loader
    across the history and a new one for this event are different situations.
  range: -90d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this driver loading on other hosts in the environment?
  context: Cross-host distribution separates a local installation from a deployment. The driver on a handful
    of engineering and support workstations fits a tool a team uses. The same driver appearing across
    unrelated hosts — particularly servers, or hosts with no troubleshooting role — points to distribution
    by something other than a person installing software, and widens the investigation to those hosts.
    Hosts not reporting driver load telemetry are absent from this result regardless of what loaded on
    them.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Activity surrounding the load supplies the immediate context — what preceded it and what followed.
    Scan for security service or agent processes stopping or restarting, credential-access tooling, archive
    and transfer utilities, and service or task creation. Repetitive agent telemetry collapses into single
    high-count rows, so novel parent-child pairs stand out at low counts.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections help reconstruct what preceded the load. Defense tampering, credential access,
    or remote-management activity ahead of a driver that grants handle access to protected processes places
    the load in a sequence rather than on its own. Nothing before it, on a host whose owner uses diagnostic
    tooling, points the other way.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is there a current helpdesk ticket, maintenance window, or support session explaining diagnostic
    tooling on this host?
  context: Legitimate use of a process and handle monitor usually has a reason attached — a performance
    complaint, a hung application, a file nobody can delete. A support record covering this host and this
    window largely settles the question. No record, on a host nobody was working on, leaves the origin
    of the driver as the open item.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall running Process Hacker on this host?
  context: Direct confirmation from the person behind the account is often the fastest path to a verdict.
    If they recall it, ask what they were troubleshooting and whether they installed the tool themselves
    or found it already present. If nobody recalls using it, the account or the host warrants the origin
    questions instead — where the driver file came from and what registered it.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this driver load align with normal work hours or a maintenance window?
  context: Interactive diagnostic work tracks the working hours of the person doing it. A driver load
    on an unattended host, outside any maintenance window, or at a time nobody was logged on, fits a load
    driven by automation or by something running without an operator. Check the host's local time rather
    than the console's, and account for administrators who keep non-standard hours.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around the driver load?
  context: A driver registered as a service is one persistence mechanism; where the driver was placed
    deliberately, others are commonly added alongside it. This surfaces scheduled tasks, service creation,
    registry writes, and transfer jobs configured on the host within four hours of the load. Several mechanisms
    installed in one window points to intentional stacking; a single sc.exe invocation that registers the
    driver's own service fits installation of the tool.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
