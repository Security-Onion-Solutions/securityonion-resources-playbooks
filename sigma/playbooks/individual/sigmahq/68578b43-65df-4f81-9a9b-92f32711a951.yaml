name: UAC Bypass Using Windows Media Player - File
id: 5eab07e5-aee9-4259-bc41-cbb594637efa
description: |
  Detects the file artifacts of a User Account Control bypass that abuses the Windows Media Player accessibility path. The rule fires when EITHER a file named OskSupport.dll is written under a user profile ending in \AppData\Local\Temp\ (a search-order DLL planted for an auto-elevated process to load) OR DllHost.exe writes osk.exe into C:\Program Files\Windows Media Player\ (replacing the on-screen-keyboard binary the auto-elevated path invokes). Either branch stages a hijack whose end result is an attacker-chosen command running at high integrity, so the investigation should confirm which artifact was planted, whether the auto-elevated process loaded or ran it, what executed at High or System integrity afterward, and whether the writing process and its lineage are expected on this host.
type: detection
detection_id: 68578b43-65df-4f81-9a9b-92f32711a951
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does this alert match the Windows Media Player UAC-bypass file pattern, and which branch fired?
  context: >-
    The rule fires when EITHER a file named OskSupport.dll is written under a user profile path ending in \AppData\Local\Temp\ (a search-order DLL planted for the accessibility component to load) OR DllHost.exe writes osk.exe into C:\Program Files\Windows Media Player\ (replacing the on-screen-keyboard binary the auto-elevated path invokes). Note which branch matched: the Temp\OskSupport.dll branch points the investigation at the DLL being loaded by an elevated process, while the osk.exe branch points at that planted executable running at high integrity. Confirm the exact path and writing process against the detection before proceeding.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write executables or DLLs into the Windows Media Player directory or a user Temp folder?
  context: >-
    Writes into C:\Program Files\Windows Media Player\ come almost exclusively from installers and Windows servicing, and a DLL named OskSupport.dll appearing in a user's AppData\Local\Temp folder is not part of normal operation. Knowing whether the account and host function fit that activity is the fastest triage. User attribution is present on roughly 94% of endpoint file events; when it resolves to a machine account (HOST$) or SYSTEM, judge by the writing process (Image) and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the planted file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The artifact's post-alert lifecycle drives next steps. A DLL or replaced osk.exe still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests cleanup after the elevated payload ran. Interpret the operation type on each subsequent event for this path — a deletion shortly after creation is the cleanup signature.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What is the content of the planted file, and does it show obfuscation or known-bad indicators?
  context: >-
    Retrieve the written artifact (OskSupport.dll or the replaced osk.exe) and examine its content: imports, embedded strings, packer signatures, and signing status for a binary. A hijack DLL's exported functions reveal whether it proxies to the legitimate component or simply launches a command at elevated integrity. Content analysis requires manual retrieval from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was OskSupport.dll loaded by an auto-elevated process, and is that DLL signed and expected?
  context: >-
    The bypass completes when an auto-elevated binary loads OskSupport.dll from the user-writable location instead of a system copy — a search-order hijack against the accessibility component. Unlike a file-write event, a library-load event records the DLL's hash and signing status directly, so an unsigned or unexpected-signer OskSupport.dll loaded from a profile Temp path confirms the hijack fired. Submit the recorded hash to reputation services; if no load appears, the DLL was planted but has not yet been loaded by an elevated process.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\OskSupport.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What action ran at High or System integrity on this host after the artifact was planted?
  context: >-
    UAC bypass is a means to an end: once the replaced osk.exe or the hijacked DLL runs in the auto-elevated Windows Media Player path, the operator's command executes at High or System integrity. Processes appearing at High or System integrity on this host in the minutes after the write reveal the objective — persistence installation, credential access, security-tool tampering, or protected-resource access. Correlate their start time against the planted file's write time.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What other files did the writing process create or delete around the alert?
  context: >-
    A process that plants one hijack artifact often stages several — the loader DLL, a payload, a batch or config file. The breadth, paths, and extensions of the writing process's other file activity (and that of its direct children) distinguish a single planted file from a fuller staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has recently been written into the Windows Media Player directory, and by which processes?
  context: >-
    The Windows Media Player program folder under C:\Program Files\ is written to almost exclusively by installers and Windows servicing, so any other recent arrivals there — or an unfamiliar writing process — stand out sharply. Recent writes to this protected directory reveal whether the osk.exe replacement is an isolated action or part of broader tampering with the media-player path. For the Temp\OskSupport.dll branch, the equivalent location is the user's AppData\Local\Temp folder, which is far noisier and needs the writing process to carry the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows Media Player\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this file been seen on this host before?
  context: >-
    A first appearance of OskSupport.dll in a Temp folder, or of an osk.exe write into the media-player directory, is more suspicious than a path with a long benign history. Zero or very low historical counts indicate a first-time or rare artifact on this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: When this host has fired this exact pattern before, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's own selection scoped to this host, so the resulting program and
    user distribution reflects how this specific Windows Media Player file pattern has appeared
    here — not generic file activity. A new acting program process, an unexpected user account,
    or an unusual writer for this pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection1:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
      selection2:
        Image: C:\Windows\system32\DllHost.exe
        TargetFilename: C:\Program Files\Windows Media Player\osk.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - Image
    - User
- question: Did other privilege-escalation or UAC-bypass detections fire on this host in the same window?
  context: >-
    Operators often try multiple elevation methods until one succeeds, especially when an OS build blocks a given technique. Additional UAC-bypass or privilege-escalation alerts on this host near the same time confirm deliberate escalation activity rather than an isolated false positive, and reveal which methods were attempted.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- always_include: true
  question: Has this user produced this file pattern before, and does that fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving the account's 90-day history of this specific Windows Media Player file pattern (not generic file writes), grouped by host. A user who has never produced this pattern is more suspicious than one who does so routinely; weigh the count against the account's role. When the alert fires under a machine or service account, user identity does not attribute the behavior — read the parent-mechanism history instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection1:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
      selection2:
        Image: C:\Windows\system32\DllHost.exe
        TargetFilename: C:\Program Files\Windows Media Player\osk.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven this file pattern before on this host or across the environment?
  context: >-
    When the write occurs under a service principal, the launch mechanism attributes the behavior, not the user. The query mirrors the rule's selection scoped to the alerting program, giving the 90-day history of that program producing this specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program already accounting for many prior events is OS or vendor automation. Grouped by host to surface host concentration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection1:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
      selection2:
        Image: C:\Windows\system32\DllHost.exe
        TargetFilename: C:\Program Files\Windows Media Player\osk.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window reveals whether the elevation attempt is isolated or part of movement across multiple endpoints. If the same user drove similar activity elsewhere, the scope is broader than this host. When the alert fires under SYSTEM or a computer account, this pivot returns agent-telemetry noise — read the parent-mechanism rollout view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven file pattern fire on other hosts in the same window?
  context: >-
    Under a service principal, network-wide user activity is agent noise; the meaningful question is whether the same launch mechanism produced this pattern elsewhere at the same time. The query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection1:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
      selection2:
        Image: C:\Windows\system32\DllHost.exe
        TargetFilename: C:\Program Files\Windows Media Player\osk.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (1 of selection*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this file pattern in the past week, and does the spread look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this Windows Media Player file pattern (not generic file activity). Many hosts firing the same pattern suggests scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host spread to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection1:
        TargetFilename|startswith: C:\Users\
        TargetFilename|endswith: \AppData\Local\Temp\OskSupport.dll
      selection2:
        Image: C:\Windows\system32\DllHost.exe
        TargetFilename: C:\Program Files\Windows Media Player\osk.exe
      condition: 1 of selection*
    fields:
    - host.name
