name: Potential DLL Sideloading Via JsSchHlp
id: 1abb7f3e-749e-4286-b6e2-bc4b839b287f
description: |
  Detects a module named JSESPR.dll being loaded from a directory other than the legitimate
  JUSTSYSTEMS JsSchHlp install path (C:\Program Files\Common Files\Justsystem\JsSchHlp\). JSESPR.dll
  ships as a signed component of a Japanese word-processor helper; when a copy is loaded from any
  other location it indicates DLL search-order hijacking (side-loading), where a benign-looking host
  executable is placed in a user-writable or non-standard directory next to a same-named malicious DLL
  so the DLL resolves first and runs with the trust of its host process. The rule fires when a
  JSESPR.dll load is observed AND the load path does not begin with the legitimate Justsystem directory.
  Investigation should determine which process loaded the module, the exact path it loaded from, whether
  the DLL is genuinely signed and matches the known-good component, whether the host has loaded it
  before, and what launched the loading process.
type: detection
detection_id: 68654bf0-4412-43d5-bfe8-5eaa393cd939
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects — a JSESPR.dll load from outside the legitimate Justsystem directory?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it. The rule matches any load of a module named
    JSESPR.dll whose path does not begin with C:\Program Files\Common Files\Justsystem\JsSchHlp\. Verify
    the load path is genuinely outside that directory and note the loading process; DLL loads carry a
    hash and signing status on the load event, so capture those here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run the process that loaded JSESPR.dll?
  context: >-
    Legitimate installations of the JUSTSYSTEMS software load JSESPR.dll from its own program directory;
    a load from elsewhere is rarely expected on a normal endpoint. Knowing whether the account and host
    function fit that activity is often the fastest path to separating a true positive from an unusual
    but sanctioned software layout. User attribution is present on most endpoint events; when it resolves
    to a machine account or SYSTEM, pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did the loading process pull in, and which loaded from non-canonical or user-writable paths?
  context: >-
    The set of modules a process loads reveals side-loading. Look for JSESPR.dll and any companion DLLs
    loaded from Temp, AppData, ProgramData, Public, or a user-profile folder rather than the Justsystem
    install path or a system directory; unsigned modules where signed ones are expected; and system-named
    DLLs resolved from non-system paths. A benign host executable relocated into a writable directory next
    to a same-named malicious DLL is the search-order-hijack pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded JSESPR.dll and any companion modules, what are the signing status, hash, and reputation?
  context: >-
    Module reputation separates the genuine signed component from a side-loaded copy. The legitimate
    JSESPR.dll carries a valid vendor signature; an unsigned module, a broken or mismatched signature, or
    a hash that does not match the known-good component loaded from a non-standard path is a strong
    side-loading indicator. The load event carries the hash directly, so pivot it against threat
    intelligence without waiting for an execution event. SignatureStatus values to watch: Unsigned,
    Expired, Distrusted, and Invalid (tampered).
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the full command line and working directory of the process that loaded this module?
  context: >-
    The loading process's command line and working directory show where the host executable ran from. A
    side-load typically launches a legitimately-named binary from a user-writable or non-standard
    directory so that a co-located DLL of the expected name resolves first. A CurrentDirectory or launch
    path outside the vendor's install location, especially under a user profile or temporary folder,
    corroborates search-order hijacking.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the process that loaded JSESPR.dll, and is that parent chain expected?
  context: >-
    The parent reveals how the loading process was launched. A side-loaded host executable is often
    started by a script host, an archive or extractor, an Office application, or a user double-click from
    a download or temp folder rather than a normal installer or service. Trace the parent to judge whether
    the launch is routine. If the parent process identifier resolves to NODATA, fall back to the loading
    process name and host within a time window.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Has JSESPR.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If JSESPR.dll has
    loaded repeatedly from the Justsystem directory under the same host executable over the past 90 days,
    this load is likely routine. If this is the first occurrence, or the module has only ever loaded from
    a different path or under different processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is JSESPR.dll being loaded on other hosts, and under what processes?
  context: >-
    Cross-host correlation surfaces the spread. The same module loading from a non-standard path across
    multiple hosts points to a distributed foothold or a shared staging package; a single-host load is
    more consistent with a localized event. Pay attention to the variety of loading processes — the same
    module loaded by different or unexpected executables on other hosts suggests the side-load was
    replicated.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Does this host normally run the process that loaded this module?
  context: >-
    A loading process that has never been seen on a host is more suspicious than one that runs regularly.
    Zero or very low historical counts for this executable indicate first-time or rare execution, which
    fits a dropped or relocated binary; a long, steady history fits installed software.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were any DLL-load-influencing registry keys modified on this host around the alert?
  context: >-
    Search-order hijacking can also be arranged through the registry — KnownDLLs, AppInit_DLLs, Image
    File Execution Options, and ExcludeFromKnownDlls entries redirect or force library loads independently
    of on-disk placement. Modifications to these keys near the time of the JSESPR.dll load would indicate
    a registry-assisted variant of the technique rather than a pure drop-alongside side-load. Correlate
    any writing process here with the process that loaded the module.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
          - '\Session Manager\ExcludeFromKnownDlls'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Is the side-loaded DLL or a co-located payload still on disk for analysis?
  context: >-
    If the loaded module or a companion file is still present, it can be hashed, submitted for analysis,
    or retrieved for a reputation lookup. Correlating file activity by the loading process and its
    children shows files it created in the same session; the side-loaded DLL is often written by a
    separate dropper beforehand, so also check the directory the module loaded from for the host
    executable and DLL pair. The file-write event carries no hash, so recover it from a later execution
    of the payload.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Loads rarely occur in isolation. Aggregating process activity around the alert surfaces what launched
    the loading process and what followed — an archive extraction, a download or dropper, reconnaissance,
    or additional persistence. Novel parent-child pairs stand out at low counts against the high-count
    agent and operating-system telemetry that dominates the host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, an archive extraction, reconnaissance,
    or defense tampering — may reveal the stages that preceded the side-load and help reconstruct the
    timeline. A JSESPR.dll load that follows an earlier delivery or execution alert reads very
    differently from one with no prior activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Side-loading gives an actor a foothold that runs whenever the host executable launches; operators
    commonly add backup persistence through different techniques. Scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions created in the same timeframe point to intentional stacking
    rather than an isolated software layout.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses process-based detection: dropping an executable or script into a
    Startup folder or a path named by a Run value achieves autostart without running a scheduling or
    registry tool. A Startup-folder drop alongside the side-loaded module points to stacked persistence
    established in the same session.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, deployment, or documented approval for installing or updating this software?
  context: >-
    Legitimate software installs and updates can place a signed JSESPR.dll and its host executable in a
    custom directory. A corresponding change or deployment record suggests authorized activity; the
    absence of one, especially for a load from a user-writable folder, points toward an unsanctioned
    side-load. This check can quickly close a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing or running software that would load this module?
  context: >-
    Direct confirmation from the person behind the account is often the fastest way to establish
    legitimacy. If the user recalls installing the JUSTSYSTEMS software or running an application that
    bundles this component, the load path and signer should match that product; if no one recalls it, the
    activity may be automated or the account may be compromised. When the action confirms, capture what
    was installed and from where.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
