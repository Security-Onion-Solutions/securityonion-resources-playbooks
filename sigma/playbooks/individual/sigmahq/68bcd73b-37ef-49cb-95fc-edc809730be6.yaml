name: Potential Unquoted Service Path Reconnaissance Via Wmic.EXE
id: 17413f6b-5b07-4498-817a-ab1d22e88502
description: |
  Detects wmic.exe running a service-enumeration query that returns name, displayname, pathname, and startmode for installed
  services. The rule fires when all of [selection_img, selection_cli] match: the process is wmic.exe (by OriginalFileName or
  Image) AND the command line contains both ' service get ' and the field list name,displayname,pathname,startmode. This is a
  known reconnaissance method used to find unquoted service paths — a local privilege-escalation precondition — and appears in
  pentest and adversary enumeration scripts. It is also occasionally run by administrators auditing service configuration, so
  the investigation should establish who ran it, what parent invoked it, and whether the enumeration was followed by an attempt
  to write into a vulnerable service path or by other discovery activity.
type: detection
detection_id: 68bcd73b-37ef-49cb-95fc-edc809730be6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the wmic service-path enumeration this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when wmic.exe (matched by
    OriginalFileName or an Image ending in WMIC.exe) runs a command line containing both ' service get ' and the field list
    name,displayname,pathname,startmode. Confirm both the binary identity and the full field list are present in the alerting
    event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to enumerate service configuration with wmic?
  context: Legitimate administrative auditing of service paths and start modes can trigger this rule. Knowing whether the user's
    role and the host's function are consistent with service-configuration review is often the fastest way to separate routine
    administration from operator reconnaissance. Service accounts and workstations rarely run this enumeration on their own.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this wmic command enumerate, and was the query scope or service list broader than the rule pattern alone?
  context: The full command line reveals the precise enumeration. Decode the ' service get ' field list and any added clauses
    (where filters, namespace such as \root\cimv2, or output redirection to a file). Adversary tooling commonly pairs this
    service-path query with broader discovery — patterns like wmic process call or Invoke-WmiMethod in the surrounding activity
    indicate hands-on enumeration rather than a one-off configuration check.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: ' service get '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic instance and is that parent chain expected?
  context: The parent process reveals how wmic was invoked. Interactive administration typically descends from explorer.exe or
    a console shell launched by a logged-on admin. Parents such as cmd.exe or powershell.exe running an enumeration script,
    or office/script hosts (wscript.exe, mshta.exe), point to automated or operator-driven discovery rather than a manual
    configuration check.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did this host make outbound connections to remote endpoints from the wmic process around the alert time?
  context: WMI can execute against remote hosts as well as the local machine. A service-enumeration query that coincides with
    outbound connections from wmic suggests the operator is reaching across the network rather than auditing the local box.
    Correlate the connection window tightly with the enumeration; remote WMI activity within a short window of the process
    creation is the meaningful signal, and a high count of distinct remote destinations points to sweeping rather than a single
    targeted query.
  range: +/-10m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Did corresponding WMI activity operations fire on this host in the same window?
  context: WMI execution leaves provider-side records (operation events such as 5857, 5858, 5860, and 5861) that are separate
    from the process_creation evidence the rule fires on. Correlating those operation events with the enumeration confirms the
    query ran through the WMI subsystem and can surface namespace and provider details (for example \root\cimv2 or
    \root\subscription) that the command line alone does not show. If WMI activity logs are not ingested in this environment,
    treat an empty result as a visibility gap rather than evidence nothing ran.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: wmi
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - User
      - Operation
- question: What child processes did this wmic instance spawn afterward?
  context: A read-only service enumeration should not spawn children. wmic launching cmd.exe, powershell.exe, or another tool
    after the query indicates the enumeration fed directly into follow-on action — for example writing into an unquoted service
    path or pivoting to further discovery — which raises the activity well above a configuration audit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the wmic service-enumeration pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine tools get abused. This query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific enumeration pattern — not generic wmic usage — has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure against that history is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user ran service enumeration or other discovery on several hosts in this window, the scope of the
    operation is broader than a single machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the enumeration reveals the immediate context — what led
    to it and what followed — and whether it is part of a larger discovery or privilege-escalation sequence. Novel parent-child
    pairs at low counts are what to scan for amid the high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, credential access, or other discovery — may reveal the
    attack stages that preceded this enumeration and help reconstruct the timeline. Service-path reconnaissance often sits
    mid-chain between initial access and a privilege-escalation attempt, so prior alerts frame whether this is opportunistic
    auditing or a deliberate step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: wmic.exe run from a non-standard path — outside System32 or SysWOW64 — may indicate the binary was copied or renamed
    to evade path-based allowlists. The rule matches on OriginalFileName as well as Image, so a renamed copy can still trigger;
    compare the on-disk Image path against OriginalFileName to confirm whether the binary was relocated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Were other discovery or proxy-execution LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary for discovery often use several. If wmic enumerated services,
    check whether other LOLBins capable of discovery or proxy execution ran on the host in the same period. Multiple LOLBins
    performing reconnaissance or arbitrary code execution in sequence strengthens the case for hands-on-keyboard activity over
    a routine administrative query.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\control.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Have other hosts fired this wmic enumeration pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    enumeration pattern rather than generic wmic usage. Many hosts firing the same pattern points to scripted deployment or
    vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and
    parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      condition: all of selection*
    fields:
    - host.name
- question: How often has this host fired the wmic service-enumeration pattern over the past 90 days, and what command-line structures are typical?
  context: A LOLBin pattern with no prior history on a host is more notable than one used regularly under stable parents. This
    query mirrors the rule's selection structure scoped to this host, so the count reflects this specific enumeration pattern
    rather than generic wmic usage. The command-line projection lets the analyst compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - OriginalFileName: wmic.exe
      - Image|endswith: \WMIC.exe
      selection_cli:
        CommandLine|contains|all:
        - ' service get '
        - name,displayname,pathname,startmode
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
