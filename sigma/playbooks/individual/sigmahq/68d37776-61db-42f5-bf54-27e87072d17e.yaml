name: PUA - NPS Tunneling Tool Execution
id: 79954b5c-55ae-4832-9ab0-6947da894f35
description: |
  Detects execution of the NPS intranet penetration / reverse-proxy client (npc.exe), a Go-based
  tunneling tool that brokers TCP, UDP, HTTP(S), and SOCKS5 traffic between an internal host and an
  external server, typically over a control connection on a high port. The rule fires when EITHER the
  process image ends in npc.exe, OR the command line carries the provisioned client argument set
  (-server= and -vkey= and -password=), OR the command line contains -config=npc, OR the file hash
  matches a known NPS client build. Legitimate use exists for NAT traversal and remote administration,
  but the same client is routinely repurposed to tunnel RDP, SOCKS5, and other internal services back
  to attacker-controlled infrastructure. Investigation should confirm which branch fired, decode the
  server and tunnel parameters, identify the outbound destination and port, and determine whether the
  tool is authorized and explained by an active support or automation context.
type: detection
detection_id: 68d37776-61db-42f5-bf54-27e87072d17e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this execution match the rule by binary name, by the -server/-vkey/-password argument set, by -config=npc, or by file hash?
  context: >-
    The rule fires when at least one branch matches: the image ends in npc.exe, the command line
    contains all of -server=, -vkey=, and -password=, the command line contains -config=npc, or the
    file hash matches a known NPS client build. Confirm which branch fired before investing further
    time and note it, because the branch determines the rest of the investigation. A command-line branch
    match gives you the server, key, and tunnel parameters directly; an image-only or hash-only match
    means the tunnel parameters live in a config file rather than on the command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is this user and host expected to run an intranet tunneling or reverse-proxy client?
  context: >-
    Legitimate use of a tunneling client is usually limited to specific administrators, network
    engineers, or hosts with a documented NAT-traversal need. A tunneling client running under a
    general user account, a service account, or a host with no such role is a stronger signal than the
    same activity on a known jump host. Knowing whether the user role and host function fit this kind
    of tool is often the fastest path to separating a true positive from sanctioned use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this tunneling client on the organization's approved software list?
  context: >-
    Organizations typically sanction a small set of remote-access and tunneling tools for IT and
    network operations. A tunneling client that is not on that list may represent shadow IT or
    attacker-deployed access, regardless of the tool's reputation. NPS in particular supports
    registering itself as a system service, so an unapproved instance can also be a persistence
    foothold.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved use case, change ticket, or support session explaining this tunnel?
  context: >-
    Legitimate tunneling usually correlates with an active support ticket, a scheduled maintenance
    window, or a documented development or remote-access need. If no such context exists for this
    execution, the tool may have been deployed by an attacker for persistent access or by a user
    bypassing network controls. Check change-management and helpdesk records for an entry that names
    this host or this purpose.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What server, key, and tunnel parameters did this client invocation specify? Decode the full command line.
  context: >-
    The provisioned client startup command takes the form npc -server=<host>:<port> -vkey=<key>
    -type=<mode>, where the server and port identify the external control endpoint and the key
    authenticates the client to it. A -config=npc invocation instead loads parameters from a config
    file, so the command line alone will not reveal the destination. Decode every argument to identify
    the control server, the port (the tool's default control bridge is 8024 but any port can be set),
    and any tunnel mode. If parameters are absent because the image-only or hash branch fired, locate
    and read the referenced config file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this tunneling client and is that parent chain expected?
  context: >-
    The parent process reveals how the client was launched. A launch from explorer.exe or a service
    manager is consistent with interactive or service-installed use; a launch from a script host,
    Office application, mshta, or an unexpected staging directory points to delivery through another
    stage. NPS can register itself as a Windows service, so a services.exe parent may reflect installed
    persistence rather than a one-off run. Walk up the chain to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoint and port did this client connect to after launch?
  context: >-
    The outbound connection is where the tunnel becomes visible from inside the network. The control
    connection runs to the external server on a single high or non-standard port (the tool's default is
    8024, but operators commonly choose other ports such as 1080, 8080, or 4444). A destination that is
    a public IP on a high port, rather than a known internal relay, indicates traffic is being bridged
    to attacker-reachable infrastructure. Capture the destination IP, hostname, and port and compare
    them against expected egress.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Did this host make outbound connections to common proxy or high-numbered ports around the alert time?
  context: >-
    Tunneling and proxy traffic concentrates on a small set of operator-chosen ports. Connections to
    well-known proxy ports such as 1080, 8080, or 4444, or to other high-numbered non-standard ports,
    around the alert time help confirm that a bridge was actually established rather than just a client
    being launched. Correlate the destinations with the control endpoint identified from the command
    line to distinguish the control channel from any forwarded tunnel traffic.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 1080
          - 8080
          - 4444
          - 8024
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What child processes did this client spawn afterward?
  context: >-
    The processes a tunneling client spawns reveal whether it did more than open a connection. A proxy
    client that launches command interpreters, credential-access tooling, or reconnaissance binaries
    suggests the tunnel is being used for hands-on activity rather than passive forwarding. Unexpected
    children in the window after launch are worth tracing into their own command lines.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run this tunneling client?
  context: >-
    A client that has never run on this host before is more suspicious than one that appears regularly
    as part of a sanctioned tunnel. Zero or very low historical counts over the baseline window indicate
    first-time or rare execution and raise the priority of confirming authorization and destination.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: >-
    Even an authorized tunnel has a normal pattern. This view mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here rather than generic binary usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \npc.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -server='
        - ' -vkey='
        - ' -password='
      selection_cli_2:
        CommandLine|contains: ' -config=npc'
      selection_hashes:
        Hashes|contains:
        - MD5=AE8ACF66BFE3A44148964048B826D005
        - SHA1=CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181
        - SHA256=5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \npc.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -server='
        - ' -vkey='
        - ' -password='
      selection_cli_2:
        CommandLine|contains: ' -config=npc'
      selection_hashes:
        Hashes|contains:
        - MD5=AE8ACF66BFE3A44148964048B826D005
        - SHA1=CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181
        - SHA256=5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \npc.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -server='
        - ' -vkey='
        - ' -password='
      selection_cli_2:
        CommandLine|contains: ' -config=npc'
      selection_hashes:
        Hashes|contains:
        - MD5=AE8ACF66BFE3A44148964048B826D005
        - SHA1=CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181
        - SHA256=5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the surrounding window reveals lateral movement or
    parallel activity on other endpoints. If the same user established tunnels or ran related tooling on
    multiple hosts, the scope of the activity may be larger than the alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \npc.exe
      selection_cli_1:
        CommandLine|contains|all:
        - ' -server='
        - ' -vkey='
        - ' -password='
      selection_cli_2:
        CommandLine|contains: ' -config=npc'
      selection_hashes:
        Hashes|contains:
        - MD5=AE8ACF66BFE3A44148964048B826D005
        - SHA1=CEA49E9B9B67F3A13AD0BE1C2655293EA3C18181
        - SHA256=5A456283392FFCEEEACA3D3426C306EB470304637520D72FED1CC1FEBBBD6856
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    A tunnel rarely stands alone. Earlier detections on the same host — reconnaissance, credential
    access, or defense tampering — may reveal the stages that preceded the proxy setup and help
    reconstruct the timeline. Sequencing prior alerts against this one shows whether the tunnel is an
    entry point or a later stage of an ongoing operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
