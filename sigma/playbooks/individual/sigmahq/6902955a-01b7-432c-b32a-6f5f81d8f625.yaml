name: LSASS Process Dump Artefact In CrashDumps Folder
id: d86106b0-ba3e-410b-ad96-14483fb9e012
description: |
  Detects a .dmp file for lsass.exe landing in the SYSTEM profile's CrashDumps folder — the rule
  fires when a written file path starts with C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\
  AND contains "lsass.exe." AND ends with .dmp. Such a file is a memory dump of LSASS, whose contents
  are credential material (password hashes, Kerberos tickets, and any plaintext secrets held in LSASS
  memory). It can be produced legitimately when LSASS genuinely crashes and Windows Error Reporting
  writes the dump, or maliciously by a dumper that redirects its output here to blend in, by procdump,
  Task Manager, or a comsvcs.dll MiniDump, or by coercing WerFault into dumping LSASS without a real
  crash. Investigation should confirm the dump targets LSASS, identify which process wrote it and
  whether LSASS actually crashed, determine which accounts are exposed, and check whether the dump was
  moved off-host or followed by credential reuse and lateral movement.
type: detection
detection_id: 6902955a-01b7-432c-b32a-6f5f81d8f625
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting file path match an LSASS dump landing in the systemprofile CrashDumps folder?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    all three conditions hold together: the file path starts with
    C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\, the name contains "lsass.exe.",
    and it ends with .dmp. Review the exact TargetFilename and the responsible process on the triggering
    event to confirm the file is a .dmp for lsass.exe in that folder and note the writing process, since
    the systemprofile path means the writer was running in a SYSTEM context.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to produce an LSASS crash dump in this location?
  context: >-
    A genuine LSASS crash handled by Windows Error Reporting will legitimately drop a dump here, but that
    is rare on a healthy host. Knowing whether this host has a history of LSASS instability, or whether a
    diagnostic or endpoint tool is known to capture such dumps, is often the fastest way to separate a
    real crash from a forced dump. User attribution is present on roughly 94% of endpoint file events;
    because the path is under the systemprofile the writer is typically SYSTEM or a machine account, so
    judge by the writing process and host role rather than by the user name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dump still on disk, or was it deleted, renamed, or moved after the alert?
  context: >-
    The dump's post-alert lifecycle drives urgency and next steps. A dump still on disk can be retrieved,
    hashed, and analyzed to confirm its contents and scope the exposure; a dump deleted or renamed shortly
    after creation suggests the operator retrieved the credentials and cleaned up, and shifts the focus to
    what read or copied it first. Interpret the results by operation type on the same path in the hours
    after the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is this a genuine LSASS memory dump, and what does the file itself indicate?
  context: >-
    A real dump of LSASS memory is typically tens of megabytes and its contents are credential material —
    account hashes, Kerberos tickets, and any plaintext secrets held in LSASS. Confirm the file is a
    full-size memory dump rather than a small or truncated decoy, and note the writing process shown on the
    file event. Regardless of which tool produced it, treat the contents as captured secrets: any account
    with a session or cached credentials on this host should be considered exposed until proven otherwise.
    Reading the dump's actual contents requires manual retrieval from the host or endpoint tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which process wrote this dump, and by what method was LSASS memory captured?
  context: >-
    The file event carries no command line, so pivot to the writing process by its ProcessGuid to read the
    full command that produced the dump. The method reveals intent and sophistication: a WerFault.exe command
    line invoked by the error-reporting service points to a crash-handling path, while procdump, a rundll32
    comsvcs.dll MiniDump, Task Manager, or a custom dumper redirecting output into this folder points to a
    deliberate capture. Note that a WerFault.exe writer is not by itself exculpatory — the error-reporting
    flow can be coerced into dumping LSASS without a genuine crash. The read side of LSASS access (opening
    the process for memory read) has no reliable telemetry in this environment, so the writer's command line
    and the dump artifact are the observable evidence; the writing process and its parent lineage are examined
    alongside the crash-correlation view.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did lsass.exe actually crash, or was the dump forced without a real crash?
  context: >-
    A legitimate dump in this folder corresponds to a genuine LSASS crash: WerFault.exe is spawned by the
    error-reporting service with lsass as the faulting process, and lsass then exits and restarts. A forced
    or synthetic dump often shows no preceding LSASS crash, a WerFault invocation coerced against a healthy
    lsass, or a non-WerFault writer producing the file directly. Review WerFault.exe and lsass.exe process
    activity around the dump to establish whether a real crash occurred; the absence of a corresponding
    crash alongside a fresh LSASS dump is the signal that the dump was deliberately induced.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\WerFault.exe'
          - '\lsass.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was a SilentProcessExit dump trigger configured on this host?
  context: >-
    One way to coerce a memory dump without touching LSASS handles directly is to register a SilentProcessExit
    monitor under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\SilentProcessExit, which tells Windows to
    write a dump when the monitored process exits, then kill it. Review recent writes to that key path and read
    the TargetObject to see whether the monitored image is lsass.exe and whether a local dump folder was set.
    A SilentProcessExit entry for lsass shortly before this dump indicates the dump was pre-staged rather than
    the result of a spontaneous crash.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\SilentProcessExit\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Which accounts had sessions or cached credentials on this host, and do any have elevated privileges?
  context: >-
    An LSASS dump captures the secrets of every account with material in LSASS at the time — interactive and
    remote logons, service accounts, and cached domain credentials. Enumerate the accounts that were logged on
    or had sessions on this host and prioritize privileged ones: domain administrators, service accounts with
    broad access, and any account able to reach sensitive systems require credential rotation and incident
    escalation, while a lone standard-user session narrows the blast radius. Cross-reference the writing account
    and the host's active sessions against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by reuse against other hosts. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the
    hours after the dump; the originating Image and User show what drove each connection. Two limits apply:
    credentials extracted from the dump and replayed from another machine will not appear here (check logon
    events on suspected targets for the exposed accounts), and if network telemetry is not collected from this
    host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Has an LSASS dump appeared in this folder on this host before?
  context: >-
    A dump that has never been seen on this host is more suspicious than one that recurs. Repeated historical
    dumps of lsass here can indicate a genuinely unstable host where Windows Error Reporting periodically
    captures crashes; a first-time appearance with no prior history weighs toward a deliberate capture. Zero
    or very low counts indicate this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other files did the writing process create or delete around the alert?
  context: >-
    A process that produces one LSASS dump may write several — a dumper staging multiple dumps, compressing or
    renaming the output for exfiltration, or dropping additional tooling. The breadth, paths, and extensions of
    the writing process's other file activity distinguish a single captured dump from an active credential-theft
    operation and enumerate what else needs review. The correlation covers the writer and its direct children,
    since dumpers often delegate the copy or archive step.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the systemprofile CrashDumps folder recently, and by which processes?
  context: >-
    The systemprofile CrashDumps folder normally holds occasional crash dumps of SYSTEM-context processes. A
    cluster of dumps, dumps of other sensitive processes, or writes by an unexpected process reveal whether this
    is an isolated event or a location under active use for capturing memory. The aggregation groups by path and
    writing process; a single unfamiliar writer across multiple files in this folder is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\CrashDumps\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A credential dump rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what led up to the dump and what ran immediately after. Novel parent-child pairs stand out at
    low counts against high-count routine telemetry, which is what points to reconnaissance, the dumping tool
    itself, or staging around the capture.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting or dual-use tools, or defense
    tampering — may reveal the stages that preceded the dump and help reconstruct the timeline. Access to a
    privileged host followed by credential dumping is a common progression, and prior alerts help place this
    dump within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- always_include: true
  question: Has this user previously produced this dump pattern on any host, and does that fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of
    LSASS dumps landing in this folder, aggregated by host, not generic file activity. A user who has never
    produced this pattern is more suspicious than one who does so as part of a known diagnostic role. Because
    the systemprofile path means the alert frequently fires under SYSTEM or a machine account, this pivot may
    return little; weigh it alongside the parent-process history.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\
        TargetFilename|contains: lsass.exe.
        TargetFilename|endswith: .dmp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically produced this dump pattern, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the writing process's program,
    so the result is the 90-day history of this program driving LSASS dumps into this folder. A new or rare program
    for this pattern is the deviation worth chasing; a program that already accounts for many prior events is a
    diagnostic or vendor process that routinely captures crash dumps.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\
        TargetFilename|contains: lsass.exe.
        TargetFilename|endswith: .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the credential access is confined to this host
    or part of activity spanning multiple endpoints. Because the systemprofile path means the alert often fires
    under SYSTEM or a machine account, this pivot can return unbounded agent-telemetry noise; when that happens,
    the parent-process fleet view is the meaningful answer and this result should be read only if a real user
    account drove the write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven dump pattern fire on other hosts in the same window?
  context: >-
    The meaningful cross-host question under a service principal is whether the same launch mechanism produced
    LSASS dumps elsewhere. The query mirrors the rule's selection scoped to the writing process's program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to a pushed or scheduled operation
    dumping LSASS across the estate; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|startswith: C:\Windows\System32\config\systemprofile\AppData\Local\CrashDumps\
        TargetFilename|contains: lsass.exe.
        TargetFilename|endswith: .dmp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
