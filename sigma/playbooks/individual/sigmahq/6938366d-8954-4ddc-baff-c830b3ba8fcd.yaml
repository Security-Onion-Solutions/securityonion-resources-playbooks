name: HackTool - Certipy Execution
id: 2e0506a9-adf9-41f1-8ce9-07e0eb89b9a8
description: |
  Detects execution of Certipy, an Active Directory Certificate Services (AD CS) enumeration and abuse tool. The rule
  fires when EITHER the process metadata identifies the binary as Certipy (image name, original filename, or PE
  description) OR the command line carries Certipy's characteristic subcommands together with its characteristic flags.
  Certipy is used both for defensive review of certificate template and CA misconfigurations and for offensive
  certificate theft, forging, shadow-credentials, and NTLM relay against AD CS. The investigation should establish which
  branch of the rule fired, what Certipy subcommand and capability ran, which AD CS objects or accounts were targeted,
  and whether the activity is an authorized assessment or hands-on operator abuse.
type: detection
detection_id: 6938366d-8954-4ddc-baff-c830b3ba8fcd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this process match Certipy either by its binary metadata or by its command-line subcommands and flags?
  context: >-
    The rule fires when EITHER the binary metadata identifies Certipy (image name ends in Certipy.exe, original filename
    is Certipy.exe, or the PE description contains Certipy) OR the command line carries Certipy subcommands such as find,
    auth, req, shadow, forge, relay, or ptt together with its flags such as -dc-ip, -pfx, -target, -username, or
    -vulnerable. Note which branch fired: a metadata match means the binary is named or signed as Certipy regardless of
    arguments, while a command-line-only match means a renamed or repackaged binary was identified purely by its argument
    pattern, which carries the operational intent. Confirm the alert against these criteria before investing further time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
      - Description
- question: Is this Certipy execution part of an authorized penetration test or red team engagement?
  context: >-
    Certipy is used in authorized AD CS security assessments to enumerate and remediate certificate template and CA
    misconfigurations. Before investing investigation time, check whether a penetration test or red team exercise is
    currently active on this host or network segment. An authorized engagement with matching tool usage and timing
    resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run AD CS enumeration and certificate-abuse tooling?
  context: >-
    Certificate Services administration and security review can legitimately involve AD CS tooling, but it is normally
    performed by a small set of identity or PKI administrators from known management hosts. A standard user or a host
    with no PKI administration role running Certipy is the deviation worth chasing. Knowing whether the user role and
    host function fit the detected behavior is often the fastest path to distinguishing routine review from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which Certipy subcommand and capability was invoked?
  context: >-
    Certipy is multi-purpose: find enumerates vulnerable templates and CAs, req requests or forges certificates, auth
    authenticates with a certificate via PKINIT or Schannel, shadow performs a Shadow Credentials attack, relay targets
    AD CS web or RPC enrollment, and forge mints a Golden Certificate. The subcommand and flags reveal which capability
    ran, which determines the scope of potential compromise and the required response. Read the full command line to
    identify the subcommand and whether stealth or escalation flags such as -dc-only, -vulnerable, -ldap-shell, or -upn
    are present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which AD CS objects, certificates, or accounts did Certipy target?
  context: >-
    Different Certipy subcommands target different assets: find enumerates certificate templates and CAs, req and auth
    target a specific template and produce a certificate mappable to an account, shadow targets an account's key
    credentials, and forge targets the CA's signing key. Read the command line for -template, -ca, -target, -username,
    -upn, -dns, and -pfx values to identify exactly which certificate store, template, or account was the objective.
    This determines which identities may be compromised and what remediation the certificate environment needs.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned Certipy and is that parent chain expected?
  context: >-
    The parent process reveals how Certipy was invoked. Interactive administrative use typically descends from
    explorer.exe through a command prompt or PowerShell session. A parent such as a script interpreter, an Office
    application, a remote-execution host, or a service that does not normally launch interactive tooling points to
    automated or remote-triggered execution rather than hands-on administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Did Certipy write certificate, ticket, or BloodHound artifacts to disk on this host?
  context: >-
    Certipy leaves characteristic files: PFX certificate bundles from req and auth, .ccache or .kirbi ticket files from
    auth and ptt, and JSON or zip BloodHound collection output from find with -bloodhound or -old-bloodhound. Checking
    for these artifacts confirms what the tool produced and reveals the scope of activity even after the process exits.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was there registry access to certificate-store or certificate-mapping keys on this host around the alert?
  context: >-
    AD CS abuse and certificate-mapping manipulation touch certificate storage and Schannel mapping locations in the
    registry. Modifications to StrongCertificateBindingEnforcement under the Kdc service or to CertificateMappingMethods
    under the Schannel security provider weaken certificate-to-account binding and re-introduce the enrollment-mapping
    abuse surface. Registry changes to these keys near a Certipy execution suggest preparation or exploitation of weak
    mapping rather than read-only enumeration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\Kdc\StrongCertificateBindingEnforcement'
          - '\SecurityProviders\Schannel\CertificateMappingMethods'
          - '\SystemCertificates\'
          - '\Cryptography\Services\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Image
      - User
- question: Did certificate-request or Kerberos authentication events follow this execution on the domain?
  context: >-
    Certipy's req, auth, and shadow flows produce certificate enrollment requests and certificate-based Kerberos
    pre-authentication. Correlating subsequent security alerts on this host helps determine whether the tool only
    enumerated misconfigurations or actually requested a certificate and authenticated with it. Certificate-backed logons
    immediately following enumeration indicate the abuse moved from discovery to credential use. If domain controller
    security events are not ingested in this environment, treat absence of results as a visibility gap rather than
    evidence nothing happened.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The severity of certificate abuse depends on the privilege level of the targeted account. A forged or relayed
    certificate that maps to a domain controller machine account, a Domain or Enterprise Admin, or a CA signing key
    enables domain-wide compromise and requires escalation. A certificate mapped to a standard user may only need
    monitoring. Cross-reference the targeted -username, -upn, or -target values against directory group memberships.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    A single enumeration tool may be isolated review, but multiple reconnaissance commands in rapid succession is a
    signature pattern of post-compromise enumeration. AD CS discovery often runs alongside broader directory and host
    reconnaissance such as nltest, net, dsquery, setspn, and adfind. Three or more distinct recon binaries within a tight
    window points to automated enumeration rather than a one-off administrative check.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does this alert fit?
  context: >-
    Even legitimate AD CS review tooling has a baseline. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this rule's specific firing pattern has historically
    run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual
    command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certipy.exe
      - OriginalFileName: Certipy.exe
      - Description|contains: Certipy
      selection_cli_commands:
        CommandLine|contains:
        - ' account '
        - ' auth '
        - ' cert '
        - ' find '
        - ' forge '
        - ' ptt '
        - ' relay '
        - ' req '
        - ' shadow '
        - ' template '
      selection_cli_flags:
        CommandLine|contains:
        - ' -bloodhound'
        - ' -ca-pfx '
        - ' -dc-ip '
        - ' -kirbi'
        - ' -old-bloodhound'
        - ' -pfx '
        - ' -target'
        - ' -template'
        - ' -username '
        - ' -vulnerable'
        - auth -pfx
        - shadow auto
        - shadow list
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certipy.exe
      - OriginalFileName: Certipy.exe
      - Description|contains: Certipy
      selection_cli_commands:
        CommandLine|contains:
        - ' account '
        - ' auth '
        - ' cert '
        - ' find '
        - ' forge '
        - ' ptt '
        - ' relay '
        - ' req '
        - ' shadow '
        - ' template '
      selection_cli_flags:
        CommandLine|contains:
        - ' -bloodhound'
        - ' -ca-pfx '
        - ' -dc-ip '
        - ' -kirbi'
        - ' -old-bloodhound'
        - ' -pfx '
        - ' -target'
        - ' -template'
        - ' -username '
        - ' -vulnerable'
        - auth -pfx
        - shadow auto
        - shadow list
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certipy.exe
      - OriginalFileName: Certipy.exe
      - Description|contains: Certipy
      selection_cli_commands:
        CommandLine|contains:
        - ' account '
        - ' auth '
        - ' cert '
        - ' find '
        - ' forge '
        - ' ptt '
        - ' relay '
        - ' req '
        - ' shadow '
        - ' template '
      selection_cli_flags:
        CommandLine|contains:
        - ' -bloodhound'
        - ' -ca-pfx '
        - ' -dc-ip '
        - ' -kirbi'
        - ' -old-bloodhound'
        - ' -pfx '
        - ' -target'
        - ' -template'
        - ' -username '
        - ' -vulnerable'
        - auth -pfx
        - shadow auto
        - shadow list
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether stolen or forged certificates were used for lateral
    movement. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger
    than this single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \Certipy.exe
      - OriginalFileName: Certipy.exe
      - Description|contains: Certipy
      selection_cli_commands:
        CommandLine|contains:
        - ' account '
        - ' auth '
        - ' cert '
        - ' find '
        - ' forge '
        - ' ptt '
        - ' relay '
        - ' req '
        - ' shadow '
        - ' template '
      selection_cli_flags:
        CommandLine|contains:
        - ' -bloodhound'
        - ' -ca-pfx '
        - ' -dc-ip '
        - ' -kirbi'
        - ' -old-bloodhound'
        - ' -pfx '
        - ' -target'
        - ' -template'
        - ' -username '
        - ' -vulnerable'
        - auth -pfx
        - shadow auto
        - shadow list
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_img or all of selection_cli_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or
    credential access — may reveal the attack stages that preceded certificate abuse and help reconstruct the full
    timeline. Certificate theft is frequently a mid-chain step that follows initial access and precedes privileged
    authentication.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
