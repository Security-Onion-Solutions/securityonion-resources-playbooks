name: Potential Pikabot Discovery Activity
id: fc569e4b-8320-479d-bcad-f47be5a372ba
description: |
  Detects a built-in discovery utility running one of three exact command lines — `ipconfig.exe /all`,
  `netstat.exe -aon`, or `whoami.exe /all` — under a lineage that matches either a grandparent process
  ending in rundll32.exe or a parent process ending in SearchFilterHost.exe or SearchProtocolHost.exe.
  Either lineage branch satisfies the rule on its own; the command-line half must also match. These
  utilities are ordinary IT tools that run constantly in administrative work and scheduled automation,
  so no single command carries weight on its own — the discriminating signal is the burst, several of
  these commands issued by one parent inside a window of well under a minute, which is how loader code
  collects host addressing, network position, and token identity in one pass before contacting a remote
  controller. Establish which command and which lineage branch matched, whether one parent instance
  issued more than one of the three, whether the rundll32.exe or search-indexer lineage is explainable
  on this host, and whether the collecting process opened outbound connections afterwards.
type: detection
detection_id: 698d4431-514f-4c82-af4d-cf573872a9f5
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event match one of the three exact discovery command lines and either lineage branch this rule requires?
  context: >-
    The rule requires an exact command line of `ipconfig.exe /all`, `netstat.exe -aon`, or
    `whoami.exe /all`, together with either a grandparent process ending in rundll32.exe or a parent
    process ending in SearchFilterHost.exe or SearchProtocolHost.exe — either branch on its own
    satisfies the lineage half. Note which command fired and which branch matched, because the branch
    steers the rest of the investigation: a rundll32.exe grandparent points at the DLL and export
    rundll32 was asked to run, while a search-indexer parent points at how a content-indexing host came
    to spawn a console utility at all.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - CommandLine
      - GrandParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this parent expected to spawn a console discovery utility, and what started the parent?
  context: >-
    SearchFilterHost.exe and SearchProtocolHost.exe are content-indexing worker processes that parse
    file contents; they have no routine reason to spawn ipconfig, netstat, or whoami. Looking up the
    parent's own creation event returns its command line and its own parent, which distinguishes an
    indexer host started normally by the search service from an indexer host or rundll32.exe instance
    that has been used as a container for injected code.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Did the same parent instance spawn the other discovery commands, and how tightly were they clustered?
  context: >-
    A lone discovery command is routine; the pattern this rule targets is several of them issued
    back-to-back by one parent inside a window of well under a minute. Listing every child of the exact
    alerting parent instance shows whether ipconfig, netstat, and whoami ran as one automated collection
    sequence, and whether anything other than discovery came out of the same parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which of the three discovery commands ran on this host in the alert window, and what did each collect?
  context: >-
    `ipconfig.exe /all` returns full adapter, DNS, and DHCP configuration; `netstat.exe -aon` returns
    every listening and established socket with the owning process ID; `whoami.exe /all` returns the
    current token's SID, group memberships, and privileges. Together they answer addressing, network
    position, and identity in a single pass. The working directory is worth noting — collection driven
    by injected code inherits the host process's directory rather than a location a user would be
    working from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine:
          - ipconfig.exe /all
          - netstat.exe -aon
          - whoami.exe /all
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned the discovery command, and is this a normal launcher for it?
  context: >-
    Legitimate ipconfig, netstat, and whoami invocations descend from cmd.exe or powershell.exe under
    explorer.exe, a management agent, or a scheduled task. A content-indexing host or an
    rundll32.exe-rooted chain is not a normal launcher for console discovery utilities. The parent's
    command line frequently names the DLL path and the exported function or ordinal that was executed,
    which is the pivot to the code driving the collection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What DLL path and export did rundll32.exe run on this host around the alert, and where does that DLL live?
  context: >-
    One of the two lineage branches keys on a grandparent of rundll32.exe, and this activity pattern
    reaches discovery through a DLL that rundll32 loads and dispatches by exported function name or by
    ordinal. Listing rundll32.exe executions on the host in the surrounding window exposes the DLL path
    and the export argument. A DLL under a user-writable location such as a temporary or AppData
    directory, invoked with `#1` or an export name borrowed from an unrelated plugin API, is worth
    carrying into file and hash analysis; a system DLL invoked by a shell or control-panel handler is
    routine.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\rundll32.exe'
      condition: selection
    fields:
      - CommandLine
      - ParentImage
      - ProcessGuid
      - User
  answer_sources:
  - process_creation
  - manual_review
- question: Did other reconnaissance commands run on this host around the same time?
  context: >-
    The rule keys on only three exact command lines, but a collection routine rarely stops there —
    net.exe, nltest.exe, systeminfo.exe, tasklist.exe, arp.exe, and nslookup.exe commonly appear in the
    same sequence. Three or more distinct discovery binaries inside fifteen minutes is what separates
    automated enumeration from an administrator checking one thing, and the accounts running them show
    whether the burst belongs to one identity or several.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Is this user expected to run administrative discovery commands on this host?
  context: >-
    Administrators, help desk staff, and inventory or monitoring automation run ipconfig, netstat, and
    whoami routinely, and that is the main source of false positives on this rule. Establish whether the
    account is an administrator, a service principal, or a standard user, and whether the host is a
    server, an engineering workstation, or a general-purpose desktop. If the account is SYSTEM or a
    machine account, identity attributes nothing and the launch mechanism carries the investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
  answer_sources:
  - organizational_knowledge
  - asset_inventory
- question: Did the Security event log record local group membership enumeration on this host around the alert?
  context: >-
    `whoami.exe /all` and the API paths behind it read the caller's token groups and local group
    membership, and the Security channel records that independently of process creation as event 4798
    (a user's local group membership was enumerated) and 4799 (a security-enabled local group's
    membership was enumerated). These events name the enumerating process and the account enumerated, so
    they surface account discovery that left no console command line. If the Security channel is not
    collected in this environment, treat zero results as a visibility gap rather than evidence that
    nothing ran.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4798
          - 4799
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - TargetUserName
      - CallerProcessName
  answer_sources:
  - process_creation
  - active_directory
- question: Did the parent process open outbound network connections around the discovery burst?
  context: >-
    Addressing, socket, and identity data collected in one short pass is normally sent somewhere
    immediately — registration with a remote controller is the point of the collection. Scoping network
    events to the alerting parent instance shows whether the process that drove the discovery also
    opened egress in the same window, and returns the destinations and ports to weigh against what this
    host is expected to talk to. The console utilities themselves make no meaningful outbound
    connections, so the parent is the correct anchor.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
      - Image
  answer_sources:
  - network_connection
- question: What else did this parent binary launch on this host in the hours after the alert?
  context: >-
    Discovery is a staging step; what follows it is the substance — credential access, remote-access
    tooling, or a second-stage download. Listing every child of this parent binary on the host over the
    following hours shows whether the enumeration was the whole of the activity or the opening of a
    longer sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Have these exact discovery commands run on this host before, and under which accounts?
  context: >-
    This is the false-positive discriminator that matters most on this rule. Inventory and monitoring
    automation, logon scripts, and support tooling issue `ipconfig /all`, `netstat -aon`, and
    `whoami /all` on a schedule, and a host with a long history of them under a service or admin account
    is describing its own routine. A host with essentially no history of these commands, or history only
    under an account other than the alerting one, makes this execution the outlier.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine:
          - ipconfig.exe /all
          - netstat.exe -aon
          - whoami.exe /all
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's full selection — the three exact command lines together with either
    lineage branch — scoped to this account over 90 days and aggregated by host, so the count reflects
    the rule's specific firing pattern rather than generic use of the utilities. An account with no
    prior history of this pattern is the more interesting case; weigh any count against whether the role
    plausibly involves indexer-hosted or rundll32-hosted code driving enumeration.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_parent:
      - GrandParentImage|endswith: \rundll32.exe
      - ParentImage|endswith:
        - \SearchFilterHost.exe
        - \SearchProtocolHost.exe
      selection_child:
        CommandLine:
        - ipconfig.exe /all
        - netstat.exe -aon
        - whoami.exe /all
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process driven the rule's pattern before, on this host or anywhere in the environment?
  context: >-
    When the alert fires under SYSTEM or a machine account, user identity attributes nothing and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's full selection scoped to the
    alerting parent process over 90 days and aggregated by host, so the result is the history of this
    parent driving this specific pattern rather than generic parent-and-binary co-occurrence. A parent
    already responsible for thousands of prior matches is vendor or OS automation; a parent that is new
    to this pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_parent:
      - GrandParentImage|endswith: \rundll32.exe
      - ParentImage|endswith:
        - \SearchFilterHost.exe
        - \SearchProtocolHost.exe
      selection_child:
        CommandLine:
        - ipconfig.exe /all
        - netstat.exe -aon
        - whoami.exe /all
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account run across the environment in the hour around the alert?
  context: >-
    If the alert fired under a real user account, its activity on other hosts in the same window shows
    whether the enumeration is isolated or part of movement across endpoints. Aggregating by host and
    binary collapses routine repetition and leaves unusual host and binary pairs visible at low counts.
    If the alert fired under SYSTEM, a service principal, or a machine account, this view returns broad
    agent and OS telemetry rather than an answer, and the parent-anchored views are the ones to read.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the environment returns agent
    telemetry rather than an answer. The meaningful question is whether the same launch mechanism fired
    elsewhere: the query mirrors the rule's full selection scoped to the alerting parent process,
    fleet-wide, within the alert window. Several hosts matching at once points to scheduled or pushed
    automation reaching many endpoints; a single host points to a host-local trigger and keeps the
    investigation on this machine.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
      definition: 'Requirements: By default the process_creation type event might not contain the GrandParentImage. Make sure you collect such fields in order to use this rule'
    detection:
      selection_parent:
      - GrandParentImage|endswith: \rundll32.exe
      - ParentImage|endswith:
        - \SearchFilterHost.exe
        - \SearchProtocolHost.exe
      selection_child:
        CommandLine:
        - ipconfig.exe /all
        - netstat.exe -aon
        - whoami.exe /all
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by binary and parent in the surrounding window
    collapses repetitive service and agent telemetry into high-count rows and leaves novel parent-child
    pairs standing out at low counts. Those low-count rows are where a loader, a script host, or an
    unexpected launcher appears alongside the enumeration.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Enumeration usually sits in the middle of a sequence rather than at its start. Earlier detections on
    the same host — an unusual DLL load, a script host spawning unexpected children, defense tampering —
    help establish how execution reached this point and how far back the timeline runs.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
