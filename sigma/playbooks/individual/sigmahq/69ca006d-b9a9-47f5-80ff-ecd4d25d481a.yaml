name: HackTool - TruffleSnout Execution
id: 1e6daf81-9dcc-4d3c-bdbb-550a867a38cb
description: |
  Detects execution of TruffleSnout, an iterative Active Directory discovery toolkit built for low-noise,
  targeted enumeration of forests, domains, trusts, and global catalog / domain controllers. The rule fires
  when a running process is identified as this tool by either its original file name (TruffleSnout.exe) or an
  image path ending in \TruffleSnout.exe. Because the tool reads trust relationships and directory objects
  through LDAP and directory-service calls, the investigation should confirm the alert is the real tool,
  decode the subcommand and query scope that was run, establish whether the user and host are expected to
  enumerate Active Directory, and look for the follow-on authentication or lateral-movement staging that
  trust discovery typically precedes.
type: detection
detection_id: 69ca006d-b9a9-47f5-80ff-ecd4d25d481a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting process match what this rule detects, identified as TruffleSnout by its original file name or an image path ending in \TruffleSnout.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact image path and original file name against the rule's criteria. The rule fires when either the binary's original file name is TruffleSnout.exe or its image path ends in \TruffleSnout.exe, so a renamed copy is still caught by the embedded original file name. Confirm which identifier matched and that the running binary is the discovery tool rather than an unrelated file reusing the name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this TruffleSnout execution part of an authorized penetration test or red team engagement?
  context: Active Directory discovery toolkits are routinely run during authorized security assessments. Before deeper analysis, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage and timing resolves the alert without further work; the absence of any scheduled engagement raises the priority of the enumeration scope.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which TruffleSnout enumeration capability was invoked, and how broad was the query scope?
  context: The tool is multi-purpose and supports enumerating forests and trusts, domains and trusts, global catalog and domain controllers, and granular raw LDAP queries with attribute culling. The subcommand and arguments on the command line reveal which enumeration was performed and how broad it was, which determines what the operator now knows about the directory and how far the investigation must reach.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full TruffleSnout command line. What forests, domains, or LDAP filters were targeted, and what attribute set was requested?
  context: The full command line is the operator's enumeration plan. Decode the subcommand, any forest or domain targets, raw LDAP filter strings, and attribute selections to understand exactly what directory data was read. The tool is designed for low-noise, rate-limited queries that avoid defensive circuit breakers, so a narrow targeted query and a broad sweep carry very different scopes. This query returns all executions of the tool on this host within the window, which captures multi-invocation enumeration sequences as a single logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned TruffleSnout, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Interactive operator use typically descends from explorer.exe or a shell; an unusual parent such as a script interpreter (wscript.exe, cscript.exe, mshta.exe), wmiprvse.exe (WMI remote execution), wsmprovhost.exe (WinRM), or an Office application points to staged or remote execution rather than a hands-on administrator. The parent command line shows how the launch was orchestrated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this user expected to enumerate Active Directory trusts and directory objects?
  context: Domain administrators and identity engineers legitimately query forests, trusts, and global catalogs for troubleshooting and audits. Standard users and most service accounts have no routine need to run iterative trust enumeration. The user's role and typical behavior baseline determine whether this directory reconnaissance is routine or anomalous, and a non-admin or unexpected account performing it is the higher-priority case.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Did TruffleSnout write output or result files to disk on this host?
  context: Iterative enumeration toolkits commonly serialize their findings to disk as text, CSV, or JSON output describing the discovered forests, domains, trusts, and objects. Files created by the tool's process confirm execution and reveal the scope of what was collected even after the process exits, and the output location (a user profile, temp, or staging directory) indicates whether results are being prepared for exfiltration.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did this host or user generate directory-service-access auditing for trust or directory-object reads around the alert?
  context: Trust and directory enumeration through LDAP and directory-service calls is recorded server-side as directory-service-access auditing (Event 4662) against the accessed objects, independent of the endpoint command line. These records provide a domain-controller view of which objects the alerting user or host read, including trusted-domain and trust-relationship objects, and confirm whether the enumeration reached the directory rather than failing locally. If directory-service-access auditing is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing was read.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4662
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - ObjectName
      - AccessMask
- question: Which modules did the tool load, and do they indicate Win32 or .NET directory-enumeration APIs rather than a simple file read?
  context: Trust enumeration drives uncommon, low-prevalence directory APIs such as DSEnumerateDomainTrusts and GetAllTrustRelationships, which surface as loads of the networking and directory-service libraries (netapi32.dll, ntdsapi.dll, activeds.dll) and the .NET runtime that hosts them. The module-load sequence for the tool's process distinguishes genuine directory enumeration from an unrelated binary reusing the name, and an unexpected mix of loaded libraries is the inspection trigger. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence no APIs were used.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
- question: Did TruffleSnout, or any child process it spawned, write files beyond the output already checked, in the course of reaching token or memory data on other processes?
  context: Beyond pure directory reads, an enumeration toolkit may open handles into other processes to read tokens or memory while staging follow-on access, and that handle open is not observable here — Elastic Defend has no cross-process handle-access channel equivalent to Sysmon EID 10, so a reach into lsass.exe or another sensitive process cannot be confirmed or ruled out directly. This query scopes file writes to the tool's process and any child it spawns, which also catches output written by a helper process TruffleSnout launches, complementing the tool-image-only check already performed. A zero-row result does not prove no handle access occurred; treat it as a visibility gap rather than evidence.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery action may be legitimate troubleshooting, but several reconnaissance commands in rapid succession is a signature pattern of post-compromise enumeration. Native AD and host discovery binaries (nltest, net, dsquery, adfind, setspn, nslookup) running in the same window as the trust toolkit indicate the operator is building situational awareness before moving to the next stage. PowerShell directory cmdlets such as Get-ADTrust and Get-ADComputer may appear in command lines alongside the native binaries.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What child processes did the tool spawn afterward, and do any stage authentication or lateral movement?
  context: Trust discovery commonly precedes authentication staging or movement toward a discovered domain controller. Child processes spawned by the tool reveal its actual follow-on impact; a benign enumeration usually spawns nothing, while operator activity often launches cmd.exe, powershell.exe, or Kerberos and remote-access utilities to act on what was found. Review the children and their command lines for the next attack stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drove it, and does the current alert fit that pattern?
  context: Even sanctioned tooling can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific tool's firing pattern has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or a first-ever appearance is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: TruffleSnout.exe
      - Image|endswith: \TruffleSnout.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: TruffleSnout.exe
      - Image|endswith: \TruffleSnout.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: TruffleSnout.exe
      - Image|endswith: \TruffleSnout.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user ran similar enumeration or follow-on actions on other hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - OriginalFileName: TruffleSnout.exe
      - Image|endswith: \TruffleSnout.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, credential access, or initial access, may reveal the stages that preceded trust discovery and help reconstruct the timeline. Look for patterns: initial access followed by enumeration, or enumeration followed by lateral movement toward a domain controller.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
