name: LSASS Process Memory Dump Creation Via Taskmgr.EXE
id: 2370bb96-7e74-42d7-b62c-7887c0afd9cb
description: |
  Detects taskmgr.exe writing an lsass memory dump (a TargetFilename under \AppData\Local\Temp\
  that contains "lsass" and ends in .DMP). This is Task Manager's built-in "Create dump file"
  option pointed at lsass.exe — a no-tool method of capturing LSASS memory that requires local
  administrator rights and an interactive session; the resulting .dmp holds the credential material
  (hashes, Kerberos tickets, cached secrets) that logon leaves in LSASS. A legitimate case is rare
  troubleshooting of a hung lsass by IT or support; malicious use captures credentials for offline
  extraction and reuse. Investigate that the dump genuinely targets lsass and was written by
  taskmgr, who was logged on interactively, whether the dump was then copied, compressed, moved,
  or deleted, and whether credential reuse or lateral movement followed.
type: detection
detection_id: 69ca12af-119d-44ed-b50f-a47af0ebc364
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting file write create an lsass memory dump in a user Temp directory, and was taskmgr.exe the writer?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    taskmgr.exe (from System32 or SysWOW64) writes a file whose path is under \AppData\Local\Temp\
    and whose name contains "lsass" and ends in .DMP. Review the exact TargetFilename and the
    writing Image on the triggering event to confirm the dump targets lsass and that taskmgr, not a
    renamed or spoofed binary, produced it. The lsass-targeted .dmp on disk is itself the evidence
    that LSASS memory was read, since the dump could only be written by reading that process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to capture a memory dump of lsass with Task Manager?
  context: >-
    Task Manager's Create dump file on lsass requires local administrator rights and an interactive
    operator; support or IT dumping a genuinely hung lsass is very unusual and is investigated
    regardless. Knowing whether the account and host function match a plausible troubleshooting
    scenario is often the fastest way to separate a rare sanctioned action from credential theft.
    User attribution is present on roughly 94% of endpoint file events; when it is a machine account
    or missing, judge by the host role and the interactive logon on the host instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the lsass dump still on disk, or was it deleted, renamed, or moved after the alert?
  context: >-
    The dump's post-alert lifecycle drives urgency and next steps. A .dmp still on disk can be
    retrieved, hashed, and confirmed to hold LSASS memory; a dump deleted seconds after creation
    points to anti-forensic cleanup after the credential material was already read, and a rename or
    move can indicate staging for exfiltration. Interpret the returned operations by their type to
    see which of these occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was LSASS memory dumped by taskmgr, and does the writing process confirm the built-in dump method?
  context: >-
    This dump uses Task Manager's Create dump file rather than a command-line dumper, so there is no
    procdump, rundll32 comsvcs.dll MiniDump, or Invoke-Mimikatz command line to decode — the tell is
    the writer (taskmgr.exe) and the target (an lsass .dmp), not a dumping syntax. Pivot to the
    writing process by its ProcessGuid to confirm the image path is a genuine system taskmgr and read
    any arguments it carried. Direct handle-open and memory-read telemetry against lsass is not
    available in this environment, so the dump file on disk is the evidence that the read occurred.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What launched taskmgr.exe, and was it running elevated in an interactive session?
  context: >-
    Task Manager's dump option needs local administrator rights, so a legitimate dump comes from an
    interactive administrator who opened Task Manager from the desktop (explorer.exe) with an
    elevated token. Pivot to the taskmgr process by its ProcessGuid to read its parent and integrity
    level. A parent such as a script host, a remote-execution service, or an Office application, or a
    non-interactive or low-integrity launch, points to scripted or unattended abuse of the tool
    rather than an administrator troubleshooting a hung process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - IntegrityLevel
- question: Who was logged on interactively to this host around the time of the dump?
  context: >-
    Capturing an lsass dump through Task Manager requires an interactive session, so identifying the
    accounts with interactive or remote-interactive logons on this host near the alert attributes the
    action to a person. Correlate the logon accounts with the writing account and with what the host
    and user are expected to do. A remote-interactive (RDP) session from an unexpected source, or an
    account that has no operational reason to be on this host, reframes the dump from local
    troubleshooting to hands-on-keyboard credential theft.
  range: -12h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4624
        host.name|expand: '%hostname%'
        LogonType:
          - 2
          - 7
          - 10
      condition: selection
    fields:
      - TargetUserName
      - LogonType
      - IpAddress
- question: What other files did taskmgr write or delete on this host around the alert?
  context: >-
    A single lsass .dmp may be one of several artifacts. The writing process's other file activity in
    a tight window reveals whether more than one dump was produced, whether dumps of other processes
    were captured, or whether output was staged alongside it. The breadth and paths of the writes
    distinguish a one-off capture from a broader collection effort and enumerate what else needs
    review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after the dump?
  context: >-
    Credential theft is typically followed by lateral movement using the harvested material. The
    query returns outbound connections from this host to remote-access ports -- 3389 (RDP), 445
    (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating Image
    and User show what drove each connection. Two limits to keep in mind -- credentials extracted
    from the dump and replayed from another machine will not appear here (check interactive and
    network logons on suspected targets for this account), and the query requires host network
    telemetry; if that is not collected from this host, treat zero rows as a visibility gap, not as
    evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts had sessions on this host, and do any have elevated privileges?
  context: >-
    An lsass dump exposes the credential material of every account with an active or recent logon
    session on the host — interactive users, service accounts, and any cached domain credentials.
    The severity depends on the privilege of those accounts: domain administrator or broad service
    accounts require incident escalation and credential resets, while a single standard user may only
    need monitoring. Cross-reference the accounts seen on this host with directory group memberships
    to scope the exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- always_include: true
  question: Has this user produced an lsass-dump-via-taskmgr before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this exact firing pattern (taskmgr writing an lsass .dmp to Temp), aggregated by
    host, not generic Task Manager usage. A user who has never produced this pattern is more
    suspicious than one who does so as part of a defined support role; weigh the count against whether
    the account has any legitimate reason to capture process memory.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - :\Windows\system32\taskmgr.exe
        - :\Windows\SysWOW64\taskmgr.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - \lsass
        - .DMP
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven an lsass-dump-via-taskmgr before on this host or across the environment?
  context: >-
    When the alert cannot be attributed by user identity (a machine or service account), the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting program, so the result is the 90-day history of this program driving the lsass-dump
    pattern, aggregated by host — not generic program-and-taskmgr co-occurrence. A new or rare program
    for this pattern is the deviation worth chasing; a program that already accounts for many prior
    firings suggests an established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - :\Windows\system32\taskmgr.exe
        - :\Windows\SysWOW64\taskmgr.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - \lsass
        - .DMP
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: When this host has previously fired this pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program and user distribution reflects how this specific firing pattern (taskmgr writing an
    lsass .dmp to Temp) has historically run here, not generic Task Manager use. If the host has
    never produced this pattern, this is a first-time event and its weight rises; if a support
    process routinely captures such dumps here, a new acting program or an unexpected user
    account is the anomaly to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - :\Windows\system32\taskmgr.exe
        - :\Windows\SysWOW64\taskmgr.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - \lsass
        - .DMP
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this lsass-dump pattern in the past week, and does the distribution look coordinated or isolated?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of the lsass-dump-via-taskmgr pattern, not generic Task Manager usage. Many hosts producing
    the same pattern in a short window points to a scripted or pushed operation harvesting credentials
    broadly; a single host or a small unrelated set points to manual operator activity. Use the host
    distribution to judge whether this is an isolated action or part of a wider sweep.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - :\Windows\system32\taskmgr.exe
        - :\Windows\SysWOW64\taskmgr.exe
        TargetFilename|contains|all:
        - \AppData\Local\Temp\
        - \lsass
        - .DMP
      condition: selection
    fields:
    - host.name
- question: What else has been written to this Temp directory recently, and by which processes?
  context: >-
    The dump lands in the user's \AppData\Local\Temp\ directory. Other recent arrivals there — a
    second process dump, an archive, or a tool copied in to read or move the .dmp — reveal whether the
    location is being used to stage credential material for extraction or exfiltration rather than a
    single isolated write. The aggregation groups by path and writing process; an unfamiliar writer or
    additional dump and archive files alongside the lsass .dmp is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A credential dump rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the dump and what ran immediately after — for example
    archiving or copy tooling reading the .dmp, reconnaissance, or the launch of further credential
    tools. Novel parent-child pairs stand out at low counts against high-count routine telemetry,
    which is what points to hands-on activity around the dump.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, privilege escalation, defense tampering, or
    execution of scripting tools — may reveal the stages that preceded the dump and help reconstruct
    the timeline. Gaining local administrator rights and reaching an interactive session commonly
    precede a hands-on credential dump, and prior alerts help place this event within that sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
