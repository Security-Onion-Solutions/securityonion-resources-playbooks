name: Uninstall Sysinternals Sysmon
id: 719fcdc5-92e9-4289-b8d1-9fbcc72bd5c2
description: |
  Detects an execution of the Sysmon binary (Sysmon64.exe or Sysmon.exe, identified by Image or by the file Description
  "System activity monitor") with a command line containing the -u uninstall flag. Both the binary selection AND the -u
  command-line selection must match for the rule to fire. The -u switch removes the Sysmon driver and service, which
  silences the host's process, network, and registry telemetry feed. Legitimate administrators occasionally remove Sysmon
  during troubleshooting or version upgrades, so the investigation should confirm who ran the uninstall, whether it was a
  sanctioned change, what telemetry gap it created, and whether any activity exploited that gap once Sysmon stopped reporting.
type: detection
detection_id: 6a5f68d1-c4b5-46b9-94ee-5324892ea939
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with a Sysmon binary run together with the -u uninstall flag?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both halves match together, a Sysmon binary (Sysmon64.exe or Sysmon.exe by Image, or the file Description "System activity monitor") AND a command line carrying the -u uninstall switch. Confirm both are present in the actual event, since -u with a Sysmon binary removes the driver and service rather than reconfiguring them.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Description
- question: Is this user and host expected to uninstall or reconfigure host telemetry tooling?
  context: Removing Sysmon is a sanctioned action for a small set of administrators during upgrades or troubleshooting, and unusual for everyone else. Knowing whether the user role and host function involve managing endpoint telemetry is often the fastest path to separating a planned maintenance change from an operator quietly disabling visibility before further action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Confirm from the command line that this is a full Sysmon uninstall, and note whether the -u removes the driver and service or targets a specific configuration.
  context: The -u switch on a Sysmon binary removes the Sysmon driver and service, which stops process, network, file, and registry event collection for that host. Read the full command line to confirm the action is an uninstall and not a related management call, and capture any path or service-name argument. Identifying exactly what was removed determines the size of the telemetry gap and the remediation needed to restore monitoring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned this Sysmon uninstall, and is that parent chain expected?
  context: The parent process reveals how the uninstall was invoked. A sanctioned removal usually descends from an interactive admin shell, a deployment agent, or services.exe. Parents like mshta.exe, wscript.exe, an Office application, or an unexpected one-off script point to operator-driven or staged tampering rather than routine maintenance. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is Sysmon currently running on this host, or does it remain uninstalled?
  context: The uninstall may be temporary (part of a version upgrade that reinstalls Sysmon moments later) or persistent. Checking whether the Sysmon service and driver are present and reporting again reveals whether the host still has a telemetry blind spot. If Sysmon is still absent, monitoring should be restored before the investigation continues, since events generated in the interim were never recorded.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after Sysmon was uninstalled?
  context: Tooling is removed for a reason, to run actions that would normally be recorded. Examining activity in the window immediately after the uninstall reveals what the removal was meant to hide or enable. Because Sysmon-sourced events stop once the service is gone, a sudden drop in process telemetry followed by activity from other log sources points to operations deliberately run under reduced visibility.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the uninstall?
  context: An operator who removes one telemetry source often disables several, stopping Sysmon AND clearing event logs AND turning off Defender to maximize coverage of their activity. Finding additional tampering events from the same user or parent process in the same window indicates a deliberate visibility-reduction operation rather than an isolated administrative uninstall.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were the Sysmon configuration or driver registry keys modified or deleted on this host around the alert?
  context: Beyond a clean -u uninstall, Sysmon can be neutralized by editing or deleting its registry state, the SysmonDrv driver keys and the configuration values under the Sysmon service, which alters or silences collection without a tracked process. This file and registry view catches tampering that the process command line alone does not show, and pairs with the uninstall to reveal whether the operator also touched the underlying configuration.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\SysmonDrv'
          - '\Services\Sysmon'
          - '\Services\Sysmon64'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Does this host normally run the Sysmon binary?
  context: A Sysmon execution that has never been seen on a host is more notable than one that recurs on a predictable maintenance cadence. Zero or very low historical counts indicate first-time or rare invocation, which on a managed endpoint raises the priority of confirming this uninstall was a planned change.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a routine tool can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific Sysmon-uninstall firing pattern has historically run here, not generic Sysmon usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -u
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -u
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -u
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user removed telemetry tooling or ran other actions on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon64a.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -u
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging surrounding the telemetry removal.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this Sysmon-uninstall firing pattern, not generic Sysmon usage. Many hosts firing the same pattern points to a scripted deployment or sanctioned upgrade wave; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_pe:
      - Image|endswith:
        - \Sysmon64.exe
        - \Sysmon.exe
      - Description: System activity monitor
      selection_cli:
        CommandLine|contains|windash: -u
      condition: all of selection_*
    fields:
    - host.name
- question: Were process-based persistence mechanisms installed on this host around the uninstall?
  context: Removing telemetry is often paired with establishing or refreshing a foothold while the host is not reporting. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created in the same timeframe indicate intentional persistence stacking rather than an isolated maintenance uninstall. Reviewing these tools in the window around the alert reveals whether the operator used the visibility gap to install backup access.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, reconnaissance, credential access, or other tampering, may reveal the stages that preceded the telemetry removal and help reconstruct the timeline. Look for patterns: reconnaissance followed by tampering, or credential access followed by visibility reduction.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
