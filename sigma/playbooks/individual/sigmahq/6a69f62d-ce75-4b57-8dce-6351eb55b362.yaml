name: Esentutl Steals Browser Information
id: 70c89692-2ccf-473f-b510-f807ba416f48
description: |
  Fires when esentutl.exe (or a binary whose OriginalFileName is esentutl.exe) runs with a recursive flag (-r) and a command line referencing the Windows WebCache path. esentutl is a legitimate ESE database maintenance utility, but the same primitive copies a locked browser ESE database (WebCacheV01.dat) out of a user profile to harvest browsing history, cached credentials, and saved form data. The rule fires only when all three conditions match together. Investigation should confirm what file the command targeted and where the output was written, identify the parent that launched esentutl, and determine whether the user, host, and parent chain are consistent with legitimate database maintenance or with post-compromise data collection.
type: detection
detection_id: 6a69f62d-ce75-4b57-8dce-6351eb55b362
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects — esentutl with the recursive flag and a Windows WebCache path?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when the process is esentutl.exe (by image name or OriginalFileName) AND the command line carries the recursive flag (-r) AND it references the \Windows\WebCache path. Review the exact command line and process identity against all three criteria.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run esentutl against a browser cache database?
  context: Legitimate esentutl use is largely automated database maintenance against application and system ESE stores. A command line pointed at a browser WebCache database from an interactive user session or an unexpected host role is harder to explain as routine maintenance. Knowing whether the user role and host function fit this operation is often the fastest path to a disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this esentutl command do? Decode every argument, the target database path, and the output destination.
  context: The full command line reveals the specific action. Identify the source database (the \Windows\WebCache path), the recursive flag, any shadow-copy redirection (for example /vss to read a locked file), and the output file the copy was written to. The output path is the staged copy of the harvested browser data and is the pivot for tracking where that data went next.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned esentutl, and is that parent chain expected?
  context: The parent process reveals how esentutl was invoked. Legitimate maintenance usually descends from scheduled tasks, service hosts, or administrative shells. Parents such as wscript.exe, cscript.exe, an Office application, or a process injected into a routine binary (for example a remote-assistance or error-reporting executable acting outside its normal role) point to script-driven or implanted execution rather than maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What files did esentutl write on this host, and do they correspond to a copied browser database?
  context: The command-line WebCache path identifies the source database; this surfaces the files esentutl actually created so the analyst can locate the staged copy of the harvested data. Output written outside a maintenance context — a .dat or similarly named copy in a user temp, profile, or working directory — indicates collection of locked browser data rather than in-place database repair.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: Where was the copied database moved or staged after esentutl wrote it?
  context: Collection of browser data is typically followed by staging the copy locally and then moving it toward an exfiltration path. Reviewing files created by esentutl, and subsequent file moves or copies on the same host, reveals whether the output stayed in place or was relocated toward cloud storage, removable media, or a network destination. Pair this with outbound network activity from the same host in the same window.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What child processes did esentutl spawn afterward?
  context: The processes spawned after the copy reveal the actual impact. esentutl performing database maintenance rarely spawns children; a follow-on cmd.exe, powershell.exe, or an archiving or upload utility points to staging and movement of the harvested data as part of a larger collection-and-exfiltration sequence.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Browser-data theft via esentutl usually sits inside a longer hands-on sequence. Activity in the surrounding window may reveal credential access, reconnaissance commands, defense tampering, or staging that provides broader context. Correlating timing across nearby executions helps establish whether the esentutl run is isolated or one step in a multi-stage operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: esentutl.exe
      selection_flag:
        CommandLine|contains|windash: -r
      selection_webcache:
        CommandLine|contains: \Windows\WebCache
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: esentutl.exe
      selection_flag:
        CommandLine|contains|windash: -r
      selection_webcache:
        CommandLine|contains: \Windows\WebCache
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in this window reveals whether the same identity drove similar collection or movement elsewhere. If the same user triggered comparable activity on multiple endpoints, the scope of compromise may be larger than the single alerting host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: esentutl.exe
      selection_flag:
        CommandLine|contains|windash: -r
      selection_webcache:
        CommandLine|contains: \Windows\WebCache
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs stand out against repetitive system telemetry and may surface reconnaissance, credential access, or staging adjacent to the browser-data theft.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Browser-data collection is usually a mid-stage action, not the entry point. Earlier detections on the same host — initial execution, defense tampering, or credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously fired this esentutl WebCache pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tools get abused. The query mirrors the rule's selection — esentutl with the recursive flag against the WebCache path — scoped to this host, so the parent and user distribution reflects how this specific firing pattern has historically run here, not generic esentutl usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \esentutl.exe
      - OriginalFileName: esentutl.exe
      selection_flag:
        CommandLine|contains|windash: -r
      selection_webcache:
        CommandLine|contains: \Windows\WebCache
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Were any other download or copy LOLBins used to move data on this host recently?
  context: Operators who use one living-off-the-land binary often reach for several. If esentutl was used to copy a locked browser database, check whether certutil, curl, bitsadmin, extrac32, makecab, or similar transfer and copy utilities also ran on this host. Multiple LOLBins serving the same collection or transfer objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was esentutl executed from its expected System32 or SysWOW64 path?
  context: esentutl run from a non-standard path — a user temp, profile, or download directory — may indicate the binary was copied or renamed to evade path-based allowlists. The OriginalFileName field confirms identity even when the on-disk name differs, so a mismatch between the image path or name and the original esentutl.exe identity is a strong signal of relocation or renaming.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
