name: Suspicious File Drop by Exchange
id: 775a8868-8136-471c-afa4-932749787d93
description: |
  Detects the Exchange IIS worker process (w3wp.exe running with MSExchange in its command line)
  writing a file with a web-executable or script extension (.aspx, .asp, .ashx, .ps1, .bat, .exe,
  .dll, .vbs). The rule fires only when all of these conditions hold together: the responsible
  process is the Exchange worker AND the written file carries one of those extensions. A web-facing
  Exchange server that is exploited (for example via the CVE-2022-41040 / CVE-2022-41082 request
  chain) lets an attacker reach the PowerShell backend and run code as w3wp.exe, which then drops a
  web shell into a proxy or auth directory for hands-on-keyboard access. Legitimate Exchange servicing
  writes some of these file types during updates, so the investigation should confirm what the dropped
  file is, what request drove the write, whether the worker then spawned command interpreters, whether
  the file executed or beaconed out, and how far the same pattern spread across the estate.
type: detection
detection_id: 6b269392-9eba-40b5-acb6-55c882b20ba6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alert show the Exchange worker writing a web-executable or script file?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only
    when the responsible process is the Exchange IIS worker (w3wp.exe with MSExchange in its command
    line) AND the written file ends in a web-executable or script extension (.aspx, .asp, .ashx, .ps1,
    .bat, .exe, .dll, .vbs) - both conditions together. Review the exact TargetFilename, its extension,
    and the responsible process on the triggering event. A worker process writing a servable script
    into a web directory is the planting step of a web shell; a routine Exchange update writing the
    same file type is the benign look-alike this check separates out.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host expected to have the Exchange worker drop web-executable or script files?
  context: >-
    Exchange servicing legitimately writes some of these file types during cumulative updates and
    provisioning, so knowing whether this host is a mail server under a maintenance window and whether
    the write aligns with a sanctioned update is often the fastest path to a verdict. The write is
    driven by the IIS worker service principal rather than an interactive user, so judge legitimacy by
    the host role and the writing process context, not by an individual account. A general-purpose or
    non-Exchange host producing this event is out of profile.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What web request drove the Exchange worker to write this file?
  context: >-
    A worker-process file drop of a servable script is typically the tail end of a public-facing
    exploitation chain: a crafted request reaches an internet-exposed endpoint, a server-side request
    forgery or deserialization flaw lets the request reach the PowerShell backend, and code runs as
    w3wp.exe. The originating request lives in the web server access logs, not in process telemetry -
    look there for the source address, method, and path around the write, focusing on abnormal patterns
    (path traversal, autodiscover abuse, unusual POST bodies, injection markers) from the fronting
    public addresses. Identifying the request enables blocking at the perimeter and finding other
    targeted endpoints.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this Exchange server patched against the known worker-process RCE chain?
  context: >-
    A worker process that can be driven to write arbitrary files usually means the server-side request
    forgery plus PowerShell remote-code-execution chain (CVE-2022-41040 and CVE-2022-41082, and the
    related proxy request-path flaws) is reachable. Confirming the installed cumulative update and
    security patch level establishes whether exploitation of a known vulnerability was possible and
    tells you whether other Exchange hosts at the same patch level are equally exposed. An up-to-date
    server points the investigation toward an as-yet-unknown vector or a legitimate write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What is in the dropped file, and is it a web shell or loader?
  context: >-
    Read the content at the written path. A web shell is a small server script that accepts commands
    through request parameters and runs them under the worker process; decode any base64, hex,
    character-concatenation, or otherwise obfuscated strings and look for command-execution primitives,
    inline interpreter calls, or an embedded second stage. For a dropped executable or library, examine
    imports, embedded strings, and packing. File-creation events carry no file content, so retrieve the
    artifact from its on-disk path or an endpoint console for the actual read; the query below confirms
    the path and responsible process so the analyst knows what to pull.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Confirm the writer is the Exchange worker, and what launched it?
  context: >-
    The file event carries the writing process's identifiers but not its full command line or parent, so
    pivot by ProcessGuid to the process_creation record to confirm the writer really is w3wp.exe hosting
    an Exchange application pool (rather than a renamed binary) and to read the parent chain. The Exchange
    worker is normally launched by the IIS service host; a worker whose command line lacks the expected
    Exchange application-pool arguments, or an unexpected parent, changes how much weight the drop carries.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Did the Exchange worker spawn cmd.exe, PowerShell, or other interpreters after the drop?
  context: >-
    The worker process serving web content has a narrow set of expected child processes; a known-good
    child list (for example a build tool in a CI role) should be short and stable. Once a web shell is in
    place, the worker instead spawns command interpreters (cmd.exe, powershell.exe) and reconnaissance or
    download utilities (certutil.exe, whoami, net, ipconfig) that carry out the operator's commands. Child
    processes of the worker on this host after the write, especially interpreters and LOLBins outside the
    known-good list, are the execution stage of the web shell and the strongest sign the drop is live.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the Exchange worker load any unsigned or non-standard modules around the alert?
  context: >-
    Public-facing application exploitation can install a native server module or inject a library rather
    than, or alongside, a script web shell - the rule's extension list includes .dll for this reason. A
    module loaded into the worker that is unsigned, signed by an unexpected authority, or written to a
    non-standard path is a persistence and code-execution mechanism that survives independently of the
    dropped script. Review the modules the worker loaded in the window around the write and focus on any
    that are not Microsoft-signed platform or Exchange components.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the worker or its child interpreters make outbound connections after the drop?
  context: >-
    Exploitation of a public-facing server frequently completes with an outbound callback - the web shell
    or a spawned utility retrieves additional tooling or beacons to an operator-controlled host. Outbound
    connections from the Exchange worker or its common post-exploitation children (command interpreters,
    certutil) to external or unfamiliar addresses after the write indicate the drop is being used
    interactively. Server processes normally talk to a predictable internal set, so an unexpected external
    destination or non-standard port is the signal; cross-reference the connecting process against the
    worker's child processes.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - \w3wp.exe
          - \cmd.exe
          - \powershell.exe
          - \certutil.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A web shell still on disk can be
    retrieved, hashed, and analyzed, and its presence means the persistence is live; a file deleted or
    renamed shortly after creation suggests anti-forensic cleanup or a self-replacing dropper and shifts
    the focus to what executed in between. Review the operations recorded against this path in the hours
    after the write to see whether it was removed, replaced, or left in place.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the Exchange worker write or delete around the alert?
  context: >-
    An operator who drops one web shell usually drops several - staging redundant shells across proxy and
    auth directories, writing helper scripts, or fetching a second-stage payload. The breadth, paths, and
    extensions of the worker's other file activity distinguish a single artifact from a set of planted
    backdoors and enumerate every file that now needs review. The alert's file event carries the
    responsible process identifiers, so the correlation covers the worker and any process it spawned.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other web-executable or script files were written on this host recently, and by which processes?
  context: >-
    Location and file type drive suspicion here. Web and auth directories under an Exchange install have a
    small set of processes that legitimately write servable scripts. Other recent arrivals with the same
    web-executable and script extensions reveal whether this is an isolated drop or a directory under
    active use, and which other artifacts belong to the same activity. A single unfamiliar writer producing
    several such files is the signal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .aspx
          - .asp
          - .ashx
          - .ps1
          - .bat
          - .exe
          - .dll
          - .vbs
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file executed, what is its hash and does it have known detections?
  context: >-
    A file's hash is recorded when it runs as a process, not when it is written, so a dropped executable or
    library that later executed can be matched by its path and its hash read from the execution event; submit
    that to reputation and threat-intel sources to judge whether it is known malicious, benign, or unseen. A
    script or web shell that runs inside the worker rather than as its own process will not appear here -
    retrieve it from its on-disk path and hash it manually. Absence of an execution record does not clear the
    file.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: When this host previously fired this pattern, what programs and accounts drove it, and does this event fit?
  context: >-
    Even a legitimate servicing write can resemble the rule's pattern, so the meaningful
    comparison is this host's own history of the exact firing pattern. The query mirrors the
    rule's selection - the Exchange worker with the MSExchange marker writing a web-executable
    or script file - scoped to this host, and summarizes which writing programs and accounts
    have historically produced it; expect w3wp.exe itself in the Image column. An unexpected
    account or a first-time appearance is the deviation worth chasing; a stable prior history
    points toward routine servicing. File events carry no parent lineage - pivot to the
    w3wp.exe start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
        - .ps1
        - .bat
        - .exe
        - .dll
        - .vbs
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired this same pattern in the past week, and does the spread look like servicing or an operation?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the same
    firing pattern - the Exchange worker writing a web-executable or script file. Many Exchange hosts
    producing the pattern in the same window points to estate-wide servicing or a mass-exploitation sweep;
    one host or a small unrelated set points to a targeted operation. Use the host distribution and the
    consistency of the writing pattern to calibrate severity and to find other servers that may hold
    dropped artifacts.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \w3wp.exe
        CommandLine|contains: MSExchange
      selection_types:
        TargetFilename|endswith:
        - .aspx
        - .asp
        - .ashx
        - .ps1
        - .bat
        - .exe
        - .dll
        - .vbs
      condition: all of selection*
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A server compromise rarely happens in isolation. Aggregating process activity in a tight window around
    the write surfaces what led up to it and what ran immediately after - reconnaissance, credential access,
    or lateral-movement tooling launched from the worker or its children. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the operator's actions on the
    host.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - exploitation attempts, reconnaissance, execution of scripting
    tools, or defense tampering - may reveal the stages that preceded the file drop and help reconstruct the
    timeline. A web shell is a foothold used to run privileged follow-on actions, so prior alerts help place
    this write within a larger intrusion sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    The web shell is itself a persistence mechanism, and operators commonly stack additional footholds once
    they have code execution on a server. Scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the drop indicate
    the intrusion is being made durable beyond the dropped file. Multiple persistence installations in the
    same timeframe point to intentional stacking rather than isolated servicing.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - \schtasks.exe
          - \at.exe
          - \sc.exe
          - \reg.exe
          - \bitsadmin.exe
          - \wmic.exe
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
