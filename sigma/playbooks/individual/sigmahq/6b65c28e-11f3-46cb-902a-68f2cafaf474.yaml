name: Odbcconf.EXE Suspicious DLL Location
id: 4d2ddf13-0efa-48c0-8438-293afa336044
description: |
  Detects execution of odbcconf.exe where the command line references a DLL (or response file) located in a
  user-writable or otherwise non-standard directory such as ProgramData, Temp, Users\Public, AppData, or various
  System32/SysWOW64 spool and task subfolders. The rule fires when the process is odbcconf.exe (by Image name or
  OriginalFileName) AND the command line contains one of these suspicious path patterns. odbcconf.exe is a signed
  Windows ODBC configuration utility; its REGSVR action calls DllRegisterServer on an arbitrary DLL, letting an
  operator proxy a malicious module load through a trusted binary while avoiding a direct regsvr32.exe call.
  Investigation should confirm the exact arguments and target path, identify what spawned odbcconf.exe, determine
  which module it loaded and whether that module is signed, and look for follow-on process or network activity.
type: detection
detection_id: 6b65c28e-11f3-46cb-902a-68f2cafaf474
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process odbcconf.exe, and does its command line reference a DLL or response file in a suspicious directory?
  context: Confirm the alert is a true positive before investing time. The rule fires only when both conditions hold
    together - the process is odbcconf.exe (by Image name or OriginalFileName) AND the command line contains one of
    the watched path fragments (ProgramData, Temp, Users\Public, AppData\Roaming, AppData\Local\Temp, or various
    System32/SysWOW64 spool and task subfolders). Read the full command line and identify the exact target path and
    whether a /A {REGSVR ...} or /F response-file action is present.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to configure ODBC drivers or register DLLs with odbcconf.exe?
  context: odbcconf.exe is a legacy data-access utility that most endpoints never run interactively. Legitimate use
    is largely confined to database tooling installers or administrators managing ODBC drivers. If the user role and
    host function have no relationship to ODBC or database administration, the execution is harder to explain as
    routine and warrants closer review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did odbcconf.exe do? Decode the full command line, the action, and the target DLL path.
  context: The full command line reveals the operation. Decode the action - /A {REGSVR <dll>} registers a DLL by
    calling DllRegisterServer, and /F <file> runs a response file that can itself contain a REGSVR line. Note the
    /S (silent) switch, which suppresses error output, and the exact target path. A renamed or non-DLL-extension
    file (for example a .txt that is actually a DLL) in a user-writable directory is a strong sign of proxy execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned odbcconf.exe, and is that parent chain expected?
  context: The parent process shows how odbcconf.exe was invoked. ODBC configuration normally descends from installer
    or administrative tooling. A parent such as mshta.exe, wscript.exe, cscript.exe, powershell.exe, or an Office
    application points to script-driven or macro-driven execution rather than legitimate database administration.
    Walk up the tree - what spawned the parent, and what else did it spawn?
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which modules did odbcconf.exe load on this host, and are any of them unsigned or in a non-standard location?
  context: The proxy-execution payload is the DLL that odbcconf.exe loads. After confirming the command line, pivot to
    module-load events for odbcconf.exe to identify the actual DLL pulled in by the REGSVR action. A module loaded
    from a user-writable directory, an unsigned module, or one whose name does not match a known ODBC driver is the
    payload worth analyzing. If module-load events are not collected in this environment, treat zero results as a
    visibility gap rather than evidence nothing loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What child processes did odbcconf.exe spawn afterward?
  context: A registered DLL can launch further activity. Legitimate ODBC configuration spawns essentially nothing;
    proxy execution often leads to follow-on processes such as cmd.exe, powershell.exe, regsvr32.exe, rundll32.exe,
    or other interpreters that carry the next stage. Any child process here is an investigation lead.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did odbcconf.exe or a module it loaded make outbound network connections shortly after this execution?
  context: A DLL loaded through odbcconf.exe may retrieve a further stage or beacon to an external host. Network
    activity attributed to odbcconf.exe is unusual for a local configuration utility and points to the loaded module
    initiating command-and-control or staging traffic. Review the destination address and port against known-good
    enterprise destinations. If network telemetry is not collected for this host, treat zero results as a visibility
    gap rather than evidence no connection occurred.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \odbcconf.exe
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run odbcconf.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. odbcconf.exe
    is rare on most endpoints, so zero or very low historical counts indicate first-time or rare execution and raise
    the priority of the alert.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a rare tool can have a routine local footprint. This query mirrors the rule's selection - odbcconf.exe
    with a suspicious DLL path - scoped to this host, so the resulting parent/user distribution reflects how this
    specific firing pattern has run here, not generic odbcconf usage. A new parent process, an unexpected user account,
    or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Registration\CRMLog
        - :\Windows\System32\com\dmp\
        - :\Windows\System32\FxsTmp\
        - :\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - :\Windows\System32\spool\drivers\color\
        - :\Windows\System32\spool\PRINTERS\
        - :\Windows\System32\spool\SERVERS\
        - :\Windows\System32\Tasks_Migrated\
        - :\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\SysWOW64\com\dmp\
        - :\Windows\SysWOW64\FxsTmp\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of this specific
    firing pattern rather than generic odbcconf.exe usage. Many hosts firing the same pattern points to scripted
    deployment or vendor automation; a single host or a small unrelated set points to manual operator activity. Use
    the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Registration\CRMLog
        - :\Windows\System32\com\dmp\
        - :\Windows\System32\FxsTmp\
        - :\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - :\Windows\System32\spool\drivers\color\
        - :\Windows\System32\spool\PRINTERS\
        - :\Windows\System32\spool\SERVERS\
        - :\Windows\System32\Tasks_Migrated\
        - :\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\SysWOW64\com\dmp\
        - :\Windows\SysWOW64\FxsTmp\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      condition: all of selection_*
    fields:
    - host.name
- question: What other tools ran on this host around the same time?
  context: Proxy execution rarely stands alone. Activity surrounding the odbcconf.exe execution may reveal the
    delivery vector that preceded it (script hosts, Office applications) or the post-execution stages that followed
    (reconnaissance, credential access, persistence), providing broader context for the investigation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Registration\CRMLog
        - :\Windows\System32\com\dmp\
        - :\Windows\System32\FxsTmp\
        - :\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - :\Windows\System32\spool\drivers\color\
        - :\Windows\System32\spool\PRINTERS\
        - :\Windows\System32\spool\SERVERS\
        - :\Windows\System32\Tasks_Migrated\
        - :\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\SysWOW64\com\dmp\
        - :\Windows\SysWOW64\FxsTmp\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Registration\CRMLog
        - :\Windows\System32\com\dmp\
        - :\Windows\System32\FxsTmp\
        - :\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - :\Windows\System32\spool\drivers\color\
        - :\Windows\System32\spool\PRINTERS\
        - :\Windows\System32\spool\SERVERS\
        - :\Windows\System32\Tasks_Migrated\
        - :\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\SysWOW64\com\dmp\
        - :\Windows\SysWOW64\FxsTmp\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope of the operation may be larger
    than the single alerting endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \odbcconf.exe
      - OriginalFileName: odbcconf.exe
      selection_cli:
        CommandLine|contains:
        - :\PerfLogs\
        - :\ProgramData\
        - :\Temp\
        - :\Users\Public\
        - :\Windows\Registration\CRMLog
        - :\Windows\System32\com\dmp\
        - :\Windows\System32\FxsTmp\
        - :\Windows\System32\Microsoft\Crypto\RSA\MachineKeys\
        - :\Windows\System32\spool\drivers\color\
        - :\Windows\System32\spool\PRINTERS\
        - :\Windows\System32\spool\SERVERS\
        - :\Windows\System32\Tasks_Migrated\
        - :\Windows\System32\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\SysWOW64\com\dmp\
        - :\Windows\SysWOW64\FxsTmp\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\PLA\System\
        - :\Windows\SysWOW64\Tasks\Microsoft\Windows\SyncCenter\
        - :\Windows\Tasks\
        - :\Windows\Temp\
        - :\Windows\Tracing\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context - what
    led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance,
    privilege escalation, or persistence mechanisms appearing as novel parent-child pairs.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access, or initial
    access via script hosts - may reveal the attack stages that preceded this proxy execution and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
