name: Potential Persistence Via Shim Database In Uncommon Location
id: 25bf3ac3-45d9-4f20-b985-614485f82e5a
description: |
  Detects a registry write that registers an application-compatibility shim database (.sdb) under
  HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\{GUID}\DatabasePath where the
  registered path is NOT the default C:\Windows\AppPatch\Custom location. The rule fires when a value whose path
  ends in \InstalledSDB\...\DatabasePath is written AND the value data does not contain the expected
  :\Windows\AppPatch\Custom directory. Shim databases are a durable persistence and privilege-escalation
  mechanism: a custom shim installed system-wide can inject a DLL into a high-frequency target process at every
  startup, surviving reboot and leaving no Run-key, scheduled-task, or service artifact. Registering the database
  from a user-writable or otherwise non-default directory is a stealth install path that bypasses the normal
  installer copy step. Legitimate app-compat patching also registers databases, so the investigation must determine
  which .sdb path was registered, which process wrote it and what launched that process, whether the .sdb payload
  exists on disk, whether an injected DLL loaded into a target process afterward, and whether the change was authorized.
type: detection
detection_id: 6b6976a3-b0e6-4723-ac24-ae38a737af41
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write register a shim database DatabasePath outside the default AppPatch\Custom location?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a value whose path
    ends in \SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\...\DatabasePath is written AND
    the value data does NOT contain :\Windows\AppPatch\Custom. Review the exact TargetObject and Details on the
    triggering event to confirm this registers a .sdb file in a non-default directory. A normal shim install writes the
    database under C:\Windows\AppPatch\Custom; a DatabasePath pointing anywhere else is the uncommon-location pattern
    this rule flags.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to install application-compatibility shim databases?
  context: >-
    Registering a shim database requires administrative rights and is rare outside of legacy-application support or
    software packaging. Knowing whether the writing account and host function match any sanctioned app-compat work is
    the fastest way to separate a legitimate patch from a persistence install. Shim installs are frequently driven by
    an installer running as SYSTEM or a machine account, so when User attribution is a service principal or missing,
    pivot on the writing process instead. User attribution is present on roughly 94% of endpoint registry events.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which InstalledSDB DatabasePath value was written, and why is this key a persistence location?
  context: >-
    The key HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\InstalledSDB\{GUID}\DatabasePath records
    where a registered shim database file lives. The shim engine consults these registrations at process start and
    applies the database's fixes — including DLL injection — to matching target executables, so a database registered
    here runs on every launch of the shimmed process. The rule's own filter treats C:\Windows\AppPatch\Custom as the
    expected directory; confirming the exact key and the writing process establishes that this is a shim registration
    pointing outside that directory rather than an unrelated AppCompatFlags edit.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What .sdb file path was written to the DatabasePath value, and where does it point?
  context: >-
    The Details field holds the DatabasePath — the on-disk location of the registered shim database. Decode it: a path
    under a user-writable directory (Temp, AppData, ProgramData, a user profile) or any location other than
    C:\Windows\AppPatch\Custom is the anomaly the rule flags and indicates a stealth install that skipped the normal
    installer copy step. Note the file name and extension as well; a renamed database (a .sdb payload carrying a .tmp
    or .dat extension) is a further evasion signal. Details is present on roughly 79% of registry modifications and
    should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process registered the shim database, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its Image, full
    command, and parent. A shim registration made by sdbinst.exe follows the normal installer path; a registration
    written directly by reg.exe, powershell.exe, cmd.exe, or an unsigned binary — bypassing sdbinst entirely — is the
    stealth install path that plants the database in a non-default directory without the installer copy step. The
    parent chain distinguishes packaging or app-compat work launched from a management tool from a scripted install
    launched by a script host, an Office application, or other unexpected parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Does the shim database file referenced by DatabasePath exist on disk, and what process created it?
  context: >-
    The persistence is only active if the .sdb file exists at the registered path. Correlating file activity by the
    registry-writing process and its children reveals whether the database was staged in the same session and where it
    landed. The file-write event carries no hash; if the .sdb is present, retrieve it or hash it from a later access for
    a reputation lookup. Registry value deletions are not observable in this telemetry, so durability is judged from
    the registration's re-modification history and from whether the shimmed payload activated rather than from a delete
    event.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: After the shim was registered, did any process on this host load an unsigned DLL consistent with a shim-injected module?
  context: >-
    A custom shim's most common malicious effect is injecting an attacker DLL into a targeted application at process
    start, so the persistence taking effect shows up as a module load rather than a new process. This query surfaces
    unsigned DLL loads on the host in the window after the registration; review the loading process and the module path
    for an image loaded out of a user-writable directory or the same directory the .sdb was registered from. The
    targeted executable is chosen by the attacker (often a high-frequency process such as explorer.exe or services.exe),
    so focus on modules that are unsigned or loaded from non-standard locations by an otherwise-trusted process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Signed: 'false'
      condition: selection
    fields:
      - Image
      - ImageLoaded
      - SignatureStatus
- question: Was sdbinst.exe run on this host around the registration, or was the database registered by a direct registry write?
  context: >-
    A shim database registered under InstalledSDB without a corresponding sdbinst.exe execution indicates the
    registration was written directly to the registry, bypassing the built-in installer that would normally copy the
    .sdb into C:\Windows\AppPatch\Custom — which is consistent with the uncommon-location pattern this rule detects.
    This query lists sdbinst.exe executions on the host in the surrounding window; absence of sdbinst near a fresh
    InstalledSDB registration points to a stealth install, while its presence identifies the installer invocation and
    the database it committed.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\sdbinst.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: After this write, was the InstalledSDB registration modified again or the database re-registered?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged from the
    registration's re-modification history rather than from a delete event. A later write that removes or repoints the
    DatabasePath can indicate the operator cleaned up after the shim served its purpose, while the value persisting
    unchanged leaves the database primed to load its fixes on every launch of the targeted process. Compare the Details
    values written to this key over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this InstalledSDB registration been modified before on this host?
  context: >-
    Shim database registrations change rarely and only through deliberate action — an installer, a packaging job, or
    legacy-application support. A history with no prior writes to this key makes the registration a first-time change
    and raises its weight; a history of periodic writes to the same value points instead to a recurring management
    process. Compare the historical Details values to see whether the same database path was registered before or
    whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same shim database registered on other hosts in the environment?
  context: >-
    The same registration across many hosts suggests a broad software deployment or a mis-scoped packaging job; the
    same registration confined to one host suggests a targeted install. Compare the Details values across hosts to see
    whether they register the same database path and whether the writing process is consistent, which separates a
    single hands-on operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor establishing shim-based persistence often makes other configuration changes in the same session —
    additional AppCompatFlags entries, security-policy edits, or other autostart keys. Clustering the registry writes
    on this host in a short window around the alert reveals the full scope of changes and which process made them. The
    triggering key appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence install rarely happens in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the shim registration and what ran immediately after it. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the tool that staged the database and
    any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, privilege escalation, or
    defense tampering — may reveal the stages that preceded this change and help reconstruct the timeline. Shim
    persistence typically follows an initial foothold and administrative access, so prior alerts help place this
    registration within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering a shim database, they commonly install
    backup footholds using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Multiple persistence
    installations in the same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without invoking schtasks, sc, or reg. File
    writes to these locations near the shim registration indicate the operator established a parallel persistence
    mechanism on disk alongside the shim.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing or updating a shim database on this host?
  context: >-
    A shim database registration has no routine reason to appear, so direct confirmation from the account owner or the
    packaging team is a fast way to resolve the alert. If an administrator or packaging process installed an
    application-compatibility fix, that closes it; if no one recalls the action, the account may be compromised or the
    change was made by automated tooling, and the investigation should continue into the writing process, the .sdb
    payload, and any injected DLL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
