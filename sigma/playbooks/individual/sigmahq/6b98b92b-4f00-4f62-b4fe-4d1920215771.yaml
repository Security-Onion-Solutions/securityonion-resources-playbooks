name: Potential DLL Sideloading Of Non-Existent DLLs From System Folders
id: 7a145f47-fb51-47c7-a10a-3db0520f4a80
description: |
  Detects a Windows process loading one of a set of system DLLs that do not normally exist on
  disk (phantom DLLs) from a System32 path, where the loaded module is not signed by Microsoft
  with a valid signature. Legitimate system binaries and services reference these DLL names, but
  the files are absent by default; an actor with write access to System32 can plant a malicious
  DLL under one of these names so the referencing process loads and executes it at that process's
  integrity level, yielding persistence or privilege escalation. The rule fires when a module
  whose path ends in one of the known phantom DLL names is loaded AND the Microsoft-valid-signature
  filter does not match. Investigate whether the DLL was planted to disk and by what, whether the
  loading process legitimately references it, the module's hash and signature, and any follow-on
  execution or persistence.
type: detection
detection_id: 6b98b92b-4f00-4f62-b4fe-4d1920215771
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects in path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive. The rule fires when a module whose path ends in one of the
    known phantom system DLL names (for example oci.dll, wlbsctrl.dll, or axeonoffhelper.dll under
    System32) is loaded AND the load is NOT signed by Microsoft with a valid signature. These DLL
    names are referenced by legitimate Windows binaries and services but do not ship on disk by
    default, so the file existing at all in System32 while carrying a non-Microsoft or invalid
    signature is the anomaly. Review the exact ImageLoaded path, its signing fields, and the process
    that loaded it on the alert event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and loading process expected to load a DLL under this name?
  context: >-
    Some of these DLL names are legitimately referenced by specific services and utilities, but the
    file itself is normally absent, so a present, non-Microsoft-signed copy is unusual regardless of
    who runs the host. Knowing whether the loading process and host function have any sanctioned
    reason to stage a third-party DLL under this name is often the fastest way to separate a benign
    installer artifact from a planted payload. User attribution is present on most endpoint events;
    when it is a machine account or SYSTEM, judge expectation from the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load, and are any from non-canonical paths, unsigned, or first-seen?
  context: >-
    The full set of modules a process pulled in during this load session shows whether the phantom
    DLL arrived alongside other side-loaded or unsigned modules, which points to a staged loader
    rather than a single stray file. Look for additional modules from user-writable directories,
    unsigned modules where signed ones are expected, and system DLL names loaded from non-system
    paths. Scoping to this process instance surfaces every module it loaded in the window, not just
    the alerting one.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the phantom DLL's signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation separates a routine third-party DLL from a planted one. A DLL bearing one of
    these system names with no valid signature, an invalid or copied signature, or a signature from
    an unrelated signer is a strong masquerading indicator, since the legitimate namesakes ship
    Microsoft-signed or not at all. The load event carries the module hash directly, so pivot that
    hash to threat intelligence to surface known loaders. Comparing the hash and signer across every
    load of this name on the host also shows whether the on-disk file was substituted.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
      - Image
- question: What is the loading process and what command line launched it?
  context: >-
    The image-load event carries no command line, so pivot by process identity to the loading
    process's own execution record. Several of these phantom DLLs are triggered by a specific
    argument to a signed system binary, so the command line reveals whether the load was driven by
    an argument that intentionally reaches the phantom-DLL code path rather than routine service
    startup. Read the full command line, the working directory, and the image to establish how the
    load was invoked.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What spawned the loading process, and is that parent chain expected?
  context: >-
    The parent of the loading process shows how it was invoked. A phantom DLL loaded by a service
    process started at boot under services.exe is the common auto-load path, while the same DLL
    loaded by a binary launched from a script host, an Office application, or an interactive shell
    points to a deliberately triggered load. Retrieving the loading process's own record surfaces
    its parent image and parent command line for that judgment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: Was the phantom DLL written to System32 on this host, and by what process and when?
  context: >-
    Phantom DLL hijacking requires the DLL to be planted on disk before a referencing process loads
    it, so the file write is the origin of the chain. Locating the write establishes which process
    and account dropped the file and how far ahead of the load it occurred, and confirms the sample
    is on disk for collection and analysis. A null result can mean the plant predates the searched
    window rather than that no file was written, since a planted phantom DLL may sit unused until the
    next boot or service start triggers it.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: Were DLL-redirection or service-configuration registry keys modified on this host around this time?
  context: >-
    Some execution-flow hijacks work by changing a registry value that controls which DLL a service
    or component loads, rather than by relying on the default search path. Reviewing registry
    modifications on the host in a window around the load surfaces edits to service DLL paths,
    component load keys, or related configuration that could redirect a legitimate process to the
    planted file. The signal is a configuration write by an unexpected process near the load, so
    focus on which process made each change and whether it touched a DLL-load or service parameter.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Has a DLL under this name been loaded on this host before, and by which processes?
  context: >-
    A first-time load of this module name on the host is a stronger anomaly than a recurring one.
    If a DLL under this name has been loaded repeatedly by the same process over the past 90 days,
    the current load is more likely routine; if this is the first occurrence, or prior loads came
    from entirely different processes, the current load stands out. Because the legitimate namesakes
    are normally absent, any prior history of this name loading also warrants scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is a DLL under this name being loaded on other hosts in the environment?
  context: >-
    Cross-host correlation shows deployment breadth. The same phantom DLL name loading on a single
    host suggests a localized event, while the same name loading across many hosts suggests a wider
    deployment or a shared build process staging the file. Pay attention to the variety of loading
    processes: a single expected loader per host is less concerning than the same name loaded by
    differing or unexpected processes across hosts, which points to spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A phantom DLL load rarely happens in isolation. Aggregating process activity in a tight window
    around the load surfaces what ran before and after it, including the write of the DLL, the tool
    that staged it, and any high-integrity actions taken once the loaded code executed. Novel
    parent-child pairs stand out at low counts against routine, high-count telemetry, which is what
    points to the staging activity.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as file writes to protected directories, defense
    tampering, or execution of scripting tools, may reveal the stages that preceded the phantom DLL
    load and help reconstruct the timeline. Because planting a DLL in System32 requires elevated
    write access, prior alerts pointing to privilege escalation or protected-path writes place this
    load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    A phantom DLL loaded by an auto-starting service is itself a persistence and execution primitive,
    and code running from it frequently installs additional footholds. Scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the load indicate the loaded code was used to establish further
    persistence rather than acting in isolation.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely by dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key. File writes to these
    locations near the phantom DLL load indicate the loaded code established a parallel persistence
    mechanism on disk alongside the DLL hijack itself.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does an administrator recall installing or updating software that would place this DLL in System32?
  context: >-
    A DLL under one of these system names does not appear in System32 through normal operation, but
    a small number of third-party products and installers do stage signed helper DLLs there. Direct
    confirmation that a known software install, update, or maintenance action placed the file closes
    the alert quickly; if no one recalls an action that explains it, the file is more likely planted
    and the investigation should continue into the writing process and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Was there a change ticket, deployment, or maintenance window that would explain this DLL being staged?
  context: >-
    Many environments require a change record for software deployments and system-directory changes.
    A corresponding ticket or deployment record covering the timeframe suggests the DLL was staged by
    sanctioned tooling; the absence of one where policy requires it suggests the file was placed
    outside normal process. This check can close a benign installer artifact or escalate an
    unexplained System32 write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
