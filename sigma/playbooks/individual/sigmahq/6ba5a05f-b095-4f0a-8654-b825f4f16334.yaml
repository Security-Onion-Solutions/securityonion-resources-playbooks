name: Potential MSTSC Shadowing Activity
id: b5a5b332-3f43-4fb0-acf6-35ac2001667b
description: |
  Detects use of the Remote Desktop client (mstsc.exe) for session shadowing, identified by a command line that contains
  both 'shadow:' (the target session ID to attach to) and 'noconsentprompt' (which suppresses the user-consent dialog
  normally shown before a shadow session begins). Combined, these allow an operator to silently attach to and control an
  existing interactive RDP session without the logged-on user being prompted or warned. The same flags can appear in
  legitimate IT support and help-desk tooling, so the investigation should decode the targeted session ID, confirm the
  initiating user and host are authorized to shadow sessions, correlate the activity with logon and session-reassignment
  events, and determine whether the shadowed session was used to run follow-on commands. The rule fires whenever a single
  command line carries both tokens together.
type: detection
detection_id: 6ba5a05f-b095-4f0a-8654-b825f4f16334
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, carrying both 'shadow:' and 'noconsentprompt' together?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when a single command line contains both the 'shadow:' token (naming the target session ID) and 'noconsentprompt' (which suppresses the consent dialog). Confirm both tokens are present in the actual event and note the session ID following 'shadow:'.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to shadow Remote Desktop sessions?
  context: Help-desk and IT support staff legitimately shadow user sessions for remote assistance, but silent shadowing without consent is uncommon outside sanctioned support tooling and is unexpected from general user accounts or workstations. Knowing whether the initiating user's role and the host's function include session shadowing is often the fastest path to separating sanctioned support from session hijacking.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What session is being shadowed, and what are the full shadowing arguments?
  context: 'The full command line reveals exactly which session is being attached to and how. Read the session ID that follows shadow: to identify the victim session, then map that session ID to its logged-on user via session-enumeration or logon records. Note whether control (not just view) was requested and confirm noconsentprompt was set so the target user received no prompt. The host-scoped, pattern-matched query returns every shadow invocation on this host in the window, which together can form a single hijack operation.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
          - noconsentprompt
          - 'shadow:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the shadowing client, and is that parent chain expected?
  context: The parent process reveals how the shadow session was launched. Interactive support work typically descends from explorer.exe or a sanctioned remote-support application; invocation from a script host, a remote-execution service, or an unexpected shell suggests scripted or operator-driven hijacking rather than a help-desk action. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even sanctioned shadowing recurs with a stable pattern. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how silent shadowing has historically run here, not generic Remote Desktop client usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - noconsentprompt
        - 'shadow:'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the silent-shadowing firing pattern, not generic Remote Desktop client usage. Many hosts firing the same pattern points to a sanctioned support platform or scripted deployment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - noconsentprompt
        - 'shadow:'
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - noconsentprompt
        - 'shadow:'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - noconsentprompt
        - 'shadow:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user shadowed sessions or ran follow-on tooling on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - noconsentprompt
        - 'shadow:'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, or follow-on execution that accompanied the shadow session.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, credential access, reconnaissance, or defense tampering, may reveal the stages that preceded the session takeover and help reconstruct the timeline. Look for patterns: credential access followed by lateral movement, or reconnaissance followed by session hijacking.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Around the shadow invocation, was there a corresponding interactive or remote logon, or a session reassignment with no matching authentication?
  context: 'A genuine support session is preceded by the operator''s own authenticated logon; a hijacked session is reassigned to an existing logged-on user with no fresh authentication for the operator. Correlate the shadow command time against Security logon events: type 10 (RemoteInteractive/RDP) and type 7 (unlock) for the operator, and 4648 (explicit-credential logon) for the targeted account. A session takeover that lacks a corresponding successful logon for the initiating identity is the anomaly. If Security logon events are not ingested in this environment, treat the absence as a visibility gap rather than evidence nothing happened.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
      - LogonType
      - IpAddress
- question: What host initiated the Remote Desktop connection into this system, and is it an expected administrative source?
  context: Session shadowing usually happens from a host the operator already has remote access to. Identifying the originating RDP source reveals whether the connection came from a known admin jump box, a help-desk workstation, or an unexpected source. An operator who compromised one host commonly uses it as a pivot to reach and shadow sessions on others.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3389
          - 445
          - 135
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account initiated the shadow session, and does it map to a legitimate support operator or to the targeted session's own user?
  context: The initiating identity reveals how access was obtained. A support operator using their own credentials is expected; an account that matches the targeted session's user, or one that shows no separate logon of its own, suggests the operator is borrowing an existing session rather than authenticating. Pair the command-line user with logon records to confirm the operator authenticated independently.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes were spawned on this host after the shadow session was established?
  context: Session shadowing is a means to an end. Once attached to a session, an operator can run commands, deploy tools, or access data under the targeted user's context. Examining processes spawned shortly after the shadow event, especially under the shadowed user's account, reveals what the operator did inside the hijacked session.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account connected to or shadowed sessions on other hosts in the environment?
  context: Operators rarely stop at one target. If the initiating account is reaching multiple systems with remote-access and session tooling, the scope of compromise is larger. Finding the same account driving Remote Desktop and shadow tooling across many hosts in a short window indicates active lateral movement.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\mstsc.exe'
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Where has this user authenticated recently?
  context: Authentication events show which systems the user accessed before and after the shadow activity. An account authenticating to many systems in a short period, especially around session-hijacking activity, suggests lateral movement in progress. Logon type 10 (RDP) and type 3 (network) across multiple hosts are the patterns of interest.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
