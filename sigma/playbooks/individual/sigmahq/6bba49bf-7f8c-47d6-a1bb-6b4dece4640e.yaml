name: Suspicious RASdial Activity
id: 940e9ad4-2b02-4d15-aa02-a855031b0104
description: |
  Detects execution of rasdial.exe, the Windows Remote Access dialer that establishes dial-up and VPN
  connections from the command line. The rule fires whenever a process whose Image ends in rasdial.exe runs,
  with no command-line constraint, so any invocation triggers it. rasdial accepts a connection (phonebook)
  entry name and can carry a username and password directly on the command line, which makes it a dual-use
  tool: administrators and login scripts use it to bring up connectivity, while an operator can use it to
  open an attacker-controlled tunnel, supply harvested credentials, or chain it into follow-on execution.
  Investigation should decode the full command line, confirm the connection entry and any credentials are
  expected, verify the parent and user normally drive this activity, and check what ran before and after.
type: detection
detection_id: 6bba49bf-7f8c-47d6-a1bb-6b4dece4640e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event match what this rule detects, a process whose image ends in rasdial.exe?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact image path. The rule fires on any execution of rasdial.exe with no command-line constraint, so confirm the binary is the genuine Windows dialer running from its expected system path rather than a renamed copy planted elsewhere.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is this user and host expected to establish dial-up or VPN connections from the command line?
  context: Legitimate administrative scripts and remote-access setups do invoke rasdial, but on most endpoints command-line dialing is uncommon. Knowing whether the user role and host function involve scripted connectivity is often the fastest path to separating routine operations from an operator opening an unsanctioned tunnel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did rasdial do? Decode the connection entry, credentials, and any other arguments on the command line.
  context: The full command line reveals the specific dial operation. rasdial takes a phonebook (connection) entry name and can carry a username and a password directly as arguments, so read the entry being dialed, whether credentials are passed inline, and whether the entry is a known corporate connection or an unfamiliar one. An unknown entry name or inline credentials on an interactive workstation points to operator activity rather than a managed login script. This host-scoped view shows every rasdial invocation in the window, which for scripted connect or disconnect sequences may span several sequential calls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned rasdial, and is that parent chain expected?
  context: The parent process reveals how rasdial was invoked. Login scripts and connection managers typically descend from userinit.exe, explorer.exe, or a service host; an interactive shell, a script host such as wscript.exe or powershell.exe, or an Office application as parent points to ad hoc or staged execution rather than managed connectivity. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did rasdial spawn afterward, and do any launch shells or other tools?
  context: rasdial itself only brings up or tears down a connection and normally spawns no children. Processes launched by it, or launched immediately after connectivity comes up, reveal the actual objective. A shell, a download utility such as certutil.exe or curl.exe, or a remote-access binary appearing right after the dial is the follow-on execution worth chasing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run rasdial?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on an endpoint without managed dial-up connectivity raises the priority of the command-line decode.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a routine tool can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how rasdial has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: rasdial.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: rasdial.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: rasdial.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: rasdial.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging that surrounds the dial activity.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of rasdial executions rather than generic usage of an unrelated binary. Many hosts firing the same pattern points to scripted deployment or connection-manager automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: rasdial.exe
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by an outbound connection.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
