name: HackTool - LocalPotato Execution
id: 7101790d-1fd3-4fa0-9832-2df74a046443
description: |
  Detects execution of the LocalPotato local privilege-escalation tool, which abuses
  NTLM reflection over loopback to gain an arbitrary file write/read as SYSTEM and is
  typically weaponized into user-to-SYSTEM escalation via DLL hijacking. The rule fires
  when EITHER the process image ends in LocalPotato.exe, OR the command line contains the
  default arbitrary-write argument pair (an "-i" source and an "-o" output under Windows\),
  OR the binary's import hash matches a known LocalPotato build. Confirm which branch
  matched, decode the file-copy arguments to identify the source and target paths, verify
  the binary is the real tool rather than a renamed one, and reconstruct surrounding host
  activity to determine whether a SYSTEM-level escalation was achieved and what was done
  with it.
type: detection
detection_id: 6bd75993-9888-4f91-9404-e1e4e4e34b77
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did this alert fire on the LocalPotato image name, its default copy arguments, or a known build hash?
  context: This rule matches when EITHER the image ends in LocalPotato.exe, OR the command
    line contains both an "-i C:\" source argument and an "-o Windows\" output argument,
    OR the file's import hash matches a known LocalPotato build. Note which branch fired,
    because a hash-only or arguments-only match on a renamed binary means the image name
    will not say LocalPotato, while a name-only match may carry non-default arguments worth
    decoding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is this user and host expected to run a local privilege-escalation tool?
  context: LocalPotato is an offensive escalation tool with essentially no legitimate
    administrative use. Knowing whether this user and host belong to a security tester or
    are an ordinary endpoint is often the fastest path to distinguishing an authorized
    assessment from a real escalation attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this LocalPotato execution part of an authorized penetration test or red team engagement?
  context: Offensive escalation tools are used in authorized security assessments. Before
    investing investigation time, check whether a pentest or red team exercise is currently
    active on this host or network segment. An authorized engagement with matching tool
    usage and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which LocalPotato mode and target paths were used in this invocation?
  context: LocalPotato supports an SMB arbitrary-write mode (-i source file, -o output path
    under a share) and an HTTP/WebDAV mode (-r listener host, -u WebDAV URL), with optional
    -c CLSID and -p port overrides. The specific arguments reveal which file was written
    where, and whether the write targeted a high-value DLL load path that would yield SYSTEM
    code execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full LocalPotato command line - what source file is being copied to what SYSTEM-writable target?
  context: The full command line reveals the arbitrary-write operation. Decode the -i source
    path and the -o output path; an output path under Windows\System32 (for example a DLL
    that an auto-elevated COM object loads) indicates an attempt to plant SYSTEM-executed
    code rather than a benign file copy. Optional -c and -p values name the COM trigger
    CLSID and listener port.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Confirm the binary is the real LocalPotato tool - check its size, hash, signing status, and strings.
  context: The rule can match on filename or import hash, so the on-disk binary may be the
    genuine tool, a renamed copy, or a decoy. Retrieve the executable and verify it against
    the known build by checking file size, full hash, whether it is signed, and
    characteristic strings. Confirming the real tool firms up the disposition; a mismatch suggests a
    renamed or modified variant worth deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
      - CommandLine
- question: What is the file hash and does it have known AV or threat intel detections?
  context: The import hashes the rule keys on identify specific LocalPotato builds, but the
    exact on-disk binary may differ. Submit the full file hash to reputation services to
    determine whether this specific sample is known malicious, a known tool build, or
    previously unseen, which calibrates how widely this binary may be circulating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is the file written by LocalPotato still on disk for analysis?
  context: LocalPotato's arbitrary write places attacker-controlled content at a SYSTEM-writable
    path, commonly a DLL that an auto-elevated process loads. Checking whether that written
    file still exists enables hash lookup, sandbox submission, and content review, and tells
    you whether the planted payload is still staged for execution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned LocalPotato and is that parent chain expected?
  context: The parent process reveals how the tool was launched. An interactive shell
    (cmd.exe, powershell.exe) under a logged-on user points to hands-on-keyboard operation,
    while a script host, scheduled task, or remote-execution parent points to automated or
    remote delivery. Walk up the chain to see what spawned the parent and what else it
    launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What ran at High or System integrity on this host after the escalation attempt?
  context: LocalPotato is a means to obtain SYSTEM. Processes appearing at High or System
    integrity shortly after the tool ran reveal what the operator did with the elevated
    context - installing persistence, dumping credentials, tampering with security tools,
    or accessing protected resources. Correlate the timing and parent of any such process
    with the LocalPotato execution.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: What child processes did LocalPotato spawn afterward?
  context: Processes spawned by the tool reveal its hands-on impact. Post-escalation
    activity often includes command interpreters, credential-access utilities, or
    persistence tooling launched immediately after the SYSTEM write succeeds.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What files did the LocalPotato process create on this host?
  context: The tool's arbitrary-write primitive leaves file-creation artifacts - the copied
    payload at its SYSTEM-writable destination and any staging files. Enumerating files
    created by the tool's process confirms what was written even if the original process
    has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were registry-based UAC bypass attempts also made on this host around this time?
  context: An operator pursuing SYSTEM may try several escalation methods in sequence.
    Registry-key UAC bypasses write a command to a key that an auto-elevated process reads,
    targeting locations such as ms-settings\Shell, mscfile\shell, or Environment. Finding
    such writes alongside the LocalPotato execution shows a deliberate, multi-method
    escalation effort rather than an isolated event.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \LocalPotato.exe
      selection_cli:
        CommandLine|contains|all:
        - .exe -i C:\
        - -o Windows\
      selection_hash_plain:
        Hashes|contains:
        - IMPHASH=E1742EE971D6549E8D4D81115F88F1FC
        - IMPHASH=DD82066EFBA94D7556EF582F247C8BB5
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: \LocalPotato.exe
      selection_cli:
        CommandLine|contains|all:
        - .exe -i C:\
        - -o Windows\
      selection_hash_plain:
        Hashes|contains:
        - IMPHASH=E1742EE971D6549E8D4D81115F88F1FC
        - IMPHASH=DD82066EFBA94D7556EF582F247C8BB5
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    parallel escalation attempts. If the same user triggered similar activity on multiple
    endpoints, the scope of the operation may be larger than this single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Escalation tools rarely run in isolation. Earlier detections on the same host -
    initial access, reconnaissance, or defense tampering - may reveal the stages that
    preceded this attempt and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
