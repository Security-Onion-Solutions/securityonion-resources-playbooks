name: Potential SentinelOne Shell Context Menu Scan Command Tampering
id: b093e868-4153-4d43-a037-72ab7e48e03f
description: |
  Detects a registry write to a shell context-menu command key ending in
  \shell\SentinelOneScan\command\ made by a process other than the SentinelOne agent, or that
  points the command at something other than the legitimate SentinelScanFromContextMenu.exe under
  the SentinelOne install path. This key holds the command that runs when a user right-clicks a
  file and chooses the security product's "Scan for Threats" option; because the value is read and
  executed on demand, replacing it makes the trusted menu entry run an arbitrary command instead of
  the real scan. The technique is persistence and defense evasion disguised behind a trusted UI
  element, and the registry location is not covered by the product's tamper protection. Investigate
  what command was written, which process wrote it and what launched that process, whether the
  configured command subsequently ran, whether a payload landed on disk, and whether the value was
  reverted afterward.
type: detection
detection_id: 6c304b02-06e6-402d-8be4-d5833cdf8198
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write set the SentinelOneScan menu command to a value other than the legitimate scan binary?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when a
    value under a key path ending in \shell\SentinelOneScan\command\ is written AND the write does
    not come from the SentinelOne agent AND the value does not start with the SentinelOne install
    path pointing at SentinelScanFromContextMenu.exe. Review the exact TargetObject on the
    triggering event to confirm it is the SentinelOneScan command key; the value data and writing
    process are decoded as the next analytical step.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the SentinelOne context-menu scan command?
  context: >-
    The SentinelOneScan command key is set by the security product's installer and effectively never
    changes through normal use. A user account or unrelated process writing this key is the
    preparatory move of the menu hijack, so knowing whether the writing account and host function
    match any sanctioned change is the fastest way to separate a deployment or test from tampering.
    User attribution is present on roughly 94% of endpoint registry events; when it is a machine
    account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the SentinelOneScan command key, and why is this a context-menu hijack location?
  context: >-
    The key under \shell\SentinelOneScan\command holds the command that executes when a user
    right-clicks a file and selects the "Scan for Threats" menu entry. The auto-invoked command runs
    with the user's trust in the security product, and this registry location is not covered by the
    product's tamper protection, so a value placed here replaces the real scan. Confirming the exact
    key path and the writing process establishes that this is the menu-command hijack rather than an
    unrelated Classes edit, and sets up decoding the planted command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command or binary path is now configured to run when the scan menu entry is clicked?
  context: >-
    The Details field holds the command the shell will run when the "Scan for Threats" entry is
    chosen. Decode it: a legitimate value points at SentinelScanFromContextMenu.exe under the
    SentinelOne install path, while a value naming cmd.exe, powershell.exe, an inline or encoded
    payload, or a binary in a user-writable location means the trusted menu entry now runs attacker
    code. If it references a file path, that path becomes a lead for confirming a payload on disk.
    Details is present on roughly 79% of registry modifications and should be populated for this
    string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this registry value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent. A write from reg.exe, powershell.exe, or cmd.exe
    launched by an Office application, a browser, a script host such as wscript.exe or mshta.exe, or
    an unsigned binary points to the menu command being altered programmatically rather than a
    deliberate administrator action. The parent chain distinguishes a scripted hijack from an
    interactive console edit.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: After this change, did Explorer launch the process configured in the hijacked scan command?
  context: >-
    The context menu is invoked from the shell, so the command stored in this key runs as a child of
    explorer.exe when a user clicks the entry. Listing processes spawned by explorer.exe on this host
    after the write shows whether the configured command actually executed; compare the child Image
    and command line against the value decoded from the key. A non-SentinelOne binary launched by
    explorer.exe here indicates the hijacked menu entry fired and the payload ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\explorer.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: After this write, was the scan command restored to the legitimate SentinelOne binary or changed again?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. A later write that
    restores the value to SentinelScanFromContextMenu.exe under the SentinelOne install path suggests
    the change was reverted to hide it, while the value remaining a non-SentinelOne command leaves the
    menu entry primed to run the planted command the next time it is clicked. Compare the Details
    values written over the following window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has the SentinelOneScan command value been modified before on this host?
  context: >-
    This command key is written by the security product's installer and should change rarely and only
    through deliberate action, so a history with no prior writes makes this a first-time change and
    raises its weight. A history of periodic writes of the same legitimate value points instead to a
    management or update process. Compare the historical Details values to see whether a
    non-SentinelOne command was ever set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same command key modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad tool run or a mis-scoped deployment; the same
    write confined to one host suggests targeted tampering. Compare the Details values across hosts to
    see whether they all set the same command and whether the writing process is consistent, which
    separates a single hands-on operation from repeated use of the technique across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who tampers with one trusted menu command often makes other configuration changes in the
    same session - additional Classes or shell hijacks for other menu entries, security-product policy
    edits, or persistence keys. Clustering the registry writes on this host in a short window around
    the alert reveals the full scope of changes and which process made them. The triggering key
    appears in the results; the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the binary referenced by the hijacked command present on disk, and did the writing process drop it?
  context: >-
    The menu command is only effective if the binary or script it names exists on disk; unlike a Run
    key it triggers when a user clicks the scan entry rather than at reboot. Correlating file activity
    by the writing process and its children shows whether the referenced payload was dropped in the
    same session as the registry write. The file-write event carries no hash; if the payload is
    present, hash it from a later execution or retrieve it for a reputation lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Tampering with a trusted menu command rarely happens in isolation. Aggregating process activity in
    a tight window around the alert surfaces what led up to the registry write and what ran
    immediately after it. Novel parent-child pairs stand out at low counts against high-count routine
    telemetry, which is what points to the tool that staged the change and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other persistence mechanisms installed on this host around this change?
  context: >-
    Actors rarely rely on a single foothold. Scheduled tasks, services, registry Run keys, BITS jobs,
    or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    menu-command change indicate the tampering was part of establishing durable access rather than an
    isolated action. Multiple persistence installations in the same timeframe point to intentional
    stacking.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Tampering with a security product's menu command is often one step in a larger sequence, so prior
    alerts help place this registry write in context.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket, maintenance window, or documented deployment for this menu-command change?
  context: >-
    The SentinelOneScan command is normally set only by the security product's own installer or
    update, so a documented deployment, packaging change, or approved maintenance is the most likely
    benign explanation. A corresponding ticket suggests authorized activity; absence of one when
    policy requires it suggests the change was unauthorized and should be escalated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall changing the SentinelOne scan menu command?
  context: >-
    This command key has no routine reason to change outside of a product install or update, so direct
    confirmation from the account owner or an administrator is a fast way to resolve the alert. If
    someone testing or repackaging the agent set the value, that closes it; if no one recalls the
    action, the account may be compromised or the change was made by automated tooling, and the
    investigation should continue into the writing process and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
