        - Hidden
        - bypass
      - CommandLine|re:
        - net\s+user
        - net\s+group
        - query\s+session
      - CommandLine|contains:
        - whoami
        - systeminfo
        - dsquery
        - localgroup administrators
        - nltest
        - samaccountname=
        - adscredentials
        - o365accountconfiguration
        - .DownloadString(
        - .DownloadFile(
        - FromBase64String(
        - System.IO.Compression
        - System.IO.MemoryStream
        - curl
      selection_child_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - powershell
        - whoami
        - net.exe
        - net1.exe
        - rundll32
        - quser
        - nltest
        - curl
      selection_child_others:
        CommandLine|contains:
        - bitsadmin
        - certutil
        - mshta
        - cscript
        - wscript
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_parent and (all of selection_powershell_* or 1 of selection_child_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    If the execution ran under a named account rather than the service principal, that account's activity on
    other hosts in the same window shows whether the alert is one step of a wider session — administrative
    work spanning several servers, or credentials reused after the file transfer host was reached. When the
    alert fires under SYSTEM, a local service principal, or a machine account, this view returns routine
    agent telemetry across the fleet and the parent-scoped fleet view is the meaningful answer instead.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
