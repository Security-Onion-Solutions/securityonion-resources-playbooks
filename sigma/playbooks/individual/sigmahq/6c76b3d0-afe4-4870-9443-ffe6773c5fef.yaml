name: Potential Exploitation of GoAnywhere MFT Vulnerability
id: 43d28fa6-0c11-445a-a689-dbd575852260
description: |
  Detects a process whose parent path runs under \GoAnywhere\tomcat\ spawning a child that matches one of
  three branches: EITHER a PowerShell process (powershell.exe, powershell_ise.exe, pwsh.exe) whose command
  line carries IEX, enc, Hidden and bypass together or one of the discovery and download tokens the rule
  lists, OR a cmd.exe whose command line carries powershell, whoami, net.exe, net1.exe, rundll32, quser,
  nltest or curl, OR any child whose command line references bitsadmin, certutil, mshta, cscript or wscript.
  The Tomcat process that hosts a managed file transfer application has no routine reason to launch a command
  interpreter or a script and transfer utility; when it does, the usual cause is that a crafted request
  reached the application and drove server-side command execution, which is the post-exploitation stage of
  CVE-2025-10035 and of file-transfer server exploitation generally. The investigation should establish which
  branch fired, decode what the child actually executed, determine whether the service reached out to an
  external host or dropped an artifact afterwards, and check the deployed version against the patched
  releases.
type: detection
detection_id: 6c76b3d0-afe4-4870-9443-ffe6773c5fef
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Did a process under the GoAnywhere Tomcat path spawn either a PowerShell child carrying the
    rule's command tokens, a cmd.exe carrying a discovery token, or a child referencing a script or transfer
    utility?
  context: >-
    The rule fires only when ParentImage contains \GoAnywhere\tomcat\ AND at least one of three child branches
    matches, so confirm the parent path first and then record which branch fired. The PowerShell branch needs
    an Image of powershell.exe, powershell_ise.exe or pwsh.exe together with a command line carrying either
    IEX, enc, Hidden and bypass all at once, or a net user / net group / query session pattern, or one of the
    discovery and download tokens such as whoami, systeminfo, nltest, dsquery, .DownloadString(,
    FromBase64String( or curl. The cmd.exe branch needs one of powershell, whoami, net.exe, net1.exe,
    rundll32, quser, nltest or curl. The third branch matches on the command line alone (bitsadmin, certutil,
    mshta, cscript, wscript) regardless of the child binary, so for that branch the command-decoding and
    egress questions carry the investigative weight.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this host expected to run a managed file transfer server, and is the account behind this
    execution expected to launch command interpreters from it?
  context: >-
    A managed file transfer server normally runs its Java service under a dedicated service account with a
    narrow, repetitive process tree. An interpreter launched under that account is either an administrator
    working through the application, a scheduled project or trigger the product invokes by design, or command
    execution driven from a request. The account identity and the host's role narrow which of those is
    plausible before deeper analysis; a server whose only purpose is file transfer has a much shorter list of
    legitimate explanations than a general-purpose host.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What request to the file transfer application preceded this execution?
  context: >-
    Exploitation of a public-facing file transfer application begins with a crafted HTTP(S) request to an
    administrative or licensing endpoint, which the application then turns into deserialization of
    attacker-controlled objects and server-side command execution. That request is not visible in process
    telemetry — the parent's own command line only identifies the Tomcat service instance and its service
    wrapper arguments. Reconstruct it from the application's own request and admin logs for the minutes
    before the spawn, looking for unauthenticated calls to admin console or licensing endpoints, an
    unexpected error or status burst from one client, request bodies carrying serialized-object markers, and
    the source address that issued them.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the GoAnywhere MFT installation on this host patched against CVE-2025-10035?
  context: >-
    CVE-2025-10035 is a deserialization flaw in the License Servlet of the GoAnywhere MFT admin console,
    reachable without authentication by forging a license response signature, and yielding command injection
    and remote code execution on versions up to 7.8.3. An unpatched build confirms the execution path was
    available and identifies every other server in the estate running the same version. A patched build moves
    the investigation toward an authenticated administrator action, a product feature that legitimately runs
    commands, or an unknown execution path — all of which change what the rest of the investigation is
    looking for.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: What other child processes did this same Tomcat instance spawn around the alert?
  context: >-
    Server-side command execution rarely stops at one process. The same service instance commonly spawns a
    short sequence — an interpreter, then discovery commands such as whoami, systeminfo or nltest, then a
    transfer utility to pull the next stage, then a remote management agent installer. Listing every child of
    this exact parent instance in the surrounding window shows whether the alert is one step of such a
    sequence or an isolated event, and the ordering of those children is the clearest evidence of how far the
    execution progressed.
  range: +/-15m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this same detection fire on other file transfer servers in the estate?
  context: >-
    Internet-exposed file transfer servers are located by scanning and probed in bulk, so the same execution
    pattern reaching several servers points at opportunistic exploitation of a shared version rather than a
    single administrator action. Each additional host returned here is a server that needs the same version
    check and request-log review, and the spread over time distinguishes a single probe from sustained
    targeting.
  range: -24h
  answer_sources:
  - alert
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What files did the alerting process or its own children write, and are they still on disk?
  context: >-
    The rule's command-line tokens include .DownloadFile(, .DownloadString(, certutil and bitsadmin, which
    all end in something written to disk, and file drops directly under the application's own installation
    directories — including .jsp files placed where the web application will serve them — are a recurring
    outcome of this execution path. Correlating file activity to the alerting process and its direct children
    by process lineage identifies the paths without relying on the command line being readable. Any file
    still present can be hashed, submitted for analysis, or read for content.
  range: +/-15m
  answer_sources:
  - file_event
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What did the spawned command line actually do, and did other command lines carrying the rule's
    tokens run on this host in the same window?
  context: >-
    Read every argument on the alerting command line and resolve it to an operation — the URL an IEX cradle
    fetches, the file certutil, bitsadmin or curl transfers, the script mshta, cscript or wscript executes,
    the account, group or session a net or quser command enumerates. Scoping by the rule's own command-line
    tokens rather than by binary name keeps powershell.exe and cmd.exe from drowning the result in routine
    executions, and shows whether the execution arrived as one command or as a sequence of related
    invocations. CurrentDirectory identifies the working directory the server handed the child, which for
    this parent is typically the application's own installation path.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cli:
        CommandLine|contains:
          - 'IEX'
          - 'enc'
          - 'Hidden'
          - 'bypass'
          - 'whoami'
          - 'systeminfo'
          - 'dsquery'
          - 'localgroup administrators'
          - 'nltest'
          - 'samaccountname='
          - 'adscredentials'
          - 'o365accountconfiguration'
          - '.DownloadString('
          - '.DownloadFile('
          - 'FromBase64String('
          - 'System.IO.Compression'
          - 'System.IO.MemoryStream'
          - 'curl'
          - 'net.exe'
          - 'net1.exe'
          - 'rundll32'
          - 'quser'
          - 'bitsadmin'
          - 'certutil'
          - 'mshta'
          - 'cscript'
          - 'wscript'
      condition: selection and selection_cli
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the payload passed as an encoded blob or as a download cradle, and what does it resolve to?
  context: >-
    The PowerShell branch of this rule accepts either IEX, enc, Hidden and bypass in one command line — the
    download-cradle form, a base64 argument to -EncodedCommand or an inline expression that fetches a remote
    script and runs it in memory with the window hidden and execution policy bypassed — or plain-text tokens
    such as .DownloadString(, .DownloadFile( and FromBase64String( that are already readable. Decode any
    base64 to UTF-16LE, then read the resulting script for the source URL, the local path anything is written
    to, and any System.IO.MemoryStream or System.IO.Compression handling, which indicates a payload staged
    and expanded in memory rather than written to disk.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did script block logging capture the deobfuscated script that ran on this host?
  context: >-
    Event ID 4104 records the script text PowerShell actually compiled, after any encoding or concatenation
    the command line used, so it is the ground truth for what a hidden, encoded cradle executed. If PowerShell
    operational logs are not ingested in this environment, treat an empty result as a visibility gap rather
    than as evidence nothing ran, and fall back to decoding the alerting command line directly. Script block
    text is also the only place an in-memory .NET load or a reflectively loaded assembly becomes readable.
  range: +/-5m
  answer_sources:
  - powershell_script_block
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls weakened on this host in the hour before the spawn?
  context: >-
    Execution-policy bypass, AMSI patching, antimalware real-time exclusions and version-2 downgrade are the
    controls an operator removes before running a payload, and on an exploited server they usually arrive
    through the same execution path moments earlier. Hits here place the alerting command inside a sequence
    and identify what visibility was reduced before it ran; an empty result means the operator relied only on
    the flags already present on the alerting command line, such as the Hidden and bypass tokens the rule's
    PowerShell branch requires.
  range: -1h
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Which scripting and .NET runtime modules were loaded on this host around the alert, and by which
    processes?
  context: >-
    PowerShell also runs without powershell.exe — any process that loads System.Management.Automation.dll
    together with the CLR hosts the same engine while presenting a command line this rule never sees, and a
    Java-hosted application server is a plausible host for exactly that. Loads of the VBScript, JScript or
    MSHTML engines identify the script-host branch, and an amsi.dll load next to a rare or unsigned module
    points at the interpreter being prepared rather than merely used. Check the loading process, the module
    signer, and whether the assembly is one this server loads routinely.
  range: +/-15m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_modules:
        ImageLoaded|endswith:
          - '\System.Management.Automation.dll'
          - '\clr.dll'
          - '\coreclr.dll'
          - '\mscoree.dll'
          - '\amsi.dll'
          - '\vbscript.dll'
          - '\jscript.dll'
          - '\mshtml.dll'
      condition: selection and selection_modules
    fields:
      - Image
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
- question: Did the spawned interpreters or transfer utilities open outbound connections after the server
    launched them?
  context: >-
    Exploitation of an internet-facing application typically ends with the executed command reaching back out
    — to fetch the next stage, or to open a channel the operator drives, including a remote management agent
    that then maintains access on its own. A fifteen-minute window around the spawn is the useful correlation
    horizon between the request, the child process and the callback. Destinations outside the addresses this
    server normally exchanges files with, and ports outside its published service ports, are the rows to
    pursue; a transfer utility connecting anywhere at all is worth resolving to the file it moved.
  range: +/-15m
  answer_sources:
  - network_connection
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tools:
        Image|endswith:
          - '\powershell.exe'
          - '\powershell_ise.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
          - '\mshta.exe'
          - '\cscript.exe'
          - '\wscript.exe'
          - '\curl.exe'
          - '\rundll32.exe'
      condition: selection and selection_tools
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What remote logon activity was recorded on this host around the alert, and did any of it succeed
    from an unexpected source?
  context: >-
    A file transfer server is an externally reachable service, and the persistence path after server-side
    command execution is usually a durable remote-access channel — a new or reused account logging on, or a
    remote management agent authenticating. Event 4625 records failed logons, 4624 the successful session
    with its logon type and source address, and 4776 credential validation; a cluster of failures followed by
    a success, or an interactive or network logon from an address this server does not normally accept, marks
    where remote access was established. Correlate the timestamps against the spawn rather than reading the
    counts alone, and note that hosts not shipping the Security channel return nothing here regardless of
    what occurred.
  range: -1h
  answer_sources:
  - active_directory
  - manual_review
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4625
          - 4776
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - LogonType
      - IpAddress
- always_include: true
  question: Has this account previously produced this parent-and-child combination, and does that history fit
    the account's role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this specific firing pattern rather than generic use of the binaries, aggregated by
    host. An account that has produced it regularly points at an integration, a product trigger, or an
    administrator who works through the application; a first occurrence for an account that otherwise only
    runs the file transfer service points the other way. Weigh the count against what the account is
    provisioned to do.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|contains: \GoAnywhere\tomcat\
      selection_powershell_img:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
      selection_powershell_cmd:
      - CommandLine|contains|all:
        - IEX
        - enc
        - Hidden
        - bypass
      - CommandLine|re:
        - net\s+user
        - net\s+group
        - query\s+session
      - CommandLine|contains:
        - whoami
        - systeminfo
        - dsquery
        - localgroup administrators
        - nltest
        - samaccountname=
        - adscredentials
        - o365accountconfiguration
        - .DownloadString(
        - .DownloadFile(
        - FromBase64String(
        - System.IO.Compression
        - System.IO.MemoryStream
        - curl
      selection_child_cmd:
        Image|endswith: \cmd.exe
        CommandLine|contains:
        - powershell
        - whoami
        - net.exe
        - net1.exe
        - rundll32
        - quser
        - nltest
        - curl
      selection_child_others:
        CommandLine|contains:
        - bitsadmin
        - certutil
        - mshta
        - cscript
        - wscript
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_parent and (all of selection_powershell_* or 1 of selection_child_*)) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this Tomcat parent historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    A managed file transfer service usually runs under a service principal, and under a service principal the
    user identity attributes nothing — the launch mechanism does. The query mirrors the rule's selection
    structure scoped to the alerting parent process, so the result is the 90-day history of this server
    driving this specific pattern rather than generic parent-and-binary co-occurrence. A parent that already
    accounts for thousands of prior events is an integration or a vendor job worth confirming once and then
    tuning; a parent that has never driven the pattern before is the deviation to chase.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
