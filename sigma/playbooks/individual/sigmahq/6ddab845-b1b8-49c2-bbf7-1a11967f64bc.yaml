name: File Deleted Via Sysinternals SDelete
id: fd735789-f3cf-464a-9e51-51f4bcf52476
description: |
  Detects file deletions that carry the Sysinternals SDelete rename signature. As SDelete
  securely overwrites a file it renames the target to a repeating-letter name (for example
  AAAAAAAA.AAA or ZZZZZZZZ.ZZZ) before removing it, so the rule fires on a file deletion whose
  TargetFilename ends in .AAA or .ZZZ, excluding a known-benign Wireshark dictionary file that
  legitimately ends in .aaa. Secure deletion is occasionally used by administrators for genuine
  data disposal, but as an anti-forensic step it destroys dropped payloads, logs, or tooling so
  they cannot be recovered (T1070.004, Indicator Removal). Investigate what was deleted, which
  process and parent chain performed the wipe, whether other files or forensic sources were also
  destroyed, and whether the activity fits an authorized data-disposal task or an evidence-removal
  step in a larger operation.
type: detection
detection_id: 6ddab845-b1b8-49c2-bbf7-1a11967f64bc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the deleted file name end in the SDelete rename pattern (.AAA or .ZZZ), and was it removed by a real deletion event?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a file deletion carries a TargetFilename ending in .AAA or .ZZZ, the repeating-letter name
    SDelete assigns while it overwrites data, and the path is not the known-benign Wireshark radius
    dictionary that legitimately uses a .aaa extension. Review the exact TargetFilename, the
    operation type, and the responsible process on the triggering event to confirm this is a secure
    wipe rather than an ordinary file with a coincidental extension.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to securely wipe files with SDelete-style tooling?
  context: >-
    Secure overwrite-and-delete is a deliberate action with a narrow set of legitimate uses -
    decommissioning, sanitizing sensitive data before disposal, or a sanctioned administrative task.
    Knowing whether the acting account and host function match any approved data-disposal process is
    the fastest way to separate authorized cleanup from anti-forensic evidence destruction. User
    attribution is present on roughly 94% of endpoint file events; when it is a machine account or
    missing, judge by the deleting process and the host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What was the full command line of the deleting process, and which files did it target?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the responsible process to
    read what it actually ran. SDelete and similar utilities take their targets as command-line
    arguments, so the command reveals the specific files or directories being wiped and any switches
    such as recursive or accept-EULA flags. This distinguishes a one-file disposal from a bulk
    directory wipe and identifies exactly what evidence was destroyed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What category of file was destroyed - logs, backups, shadow copies, or dropped tooling?
  context: >-
    This alert is a deletion, so the file's content can no longer be read from disk; the
    investigative value is in what was removed and why. Deletion of security logs, backups, or
    shadow copies is an anti-forensic or impact signal, while secure deletion of a just-dropped
    payload or the attacker's own tooling is self-cleanup. Focus on the pre-rename path and the
    deleting process to classify the target - staging directories, temp paths, and known indicator
    locations weigh differently from a user document.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did this file exist or execute before it was wiped, and is any copy recoverable?
  context: >-
    A deletion event carries no hash and the on-disk content is gone, but the file's prior life may
    still be visible. Look backward for the file being created or executed before the wipe: if it
    ever ran, its hash was recorded on that earlier process event and can still be looked up and
    reputation-checked. For on-disk recovery, point to volume shadow copies, backups, or the recycle
    bin - though SDelete's secure overwrite is specifically designed to defeat file-level recovery.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Was the deleted file recreated or restored on this host after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A file that reappears - restored from backup,
    re-dropped by a dropper, or recreated by a legitimate process - shifts the investigation toward
    what put it back, while a path that stays gone is consistent with a one-time destruction. The
    query returns every operation on this path for the following window so the recreation, if any,
    is visible with its responsible process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What launched the process that performed the deletion, and is that parent chain expected?
  context: >-
    The parent process reveals how the wipe was invoked. Secure deletion run deliberately usually
    descends from an interactive console (explorer.exe launching cmd.exe or powershell.exe), whereas
    a chain through script hosts such as wscript.exe or mshta.exe, an Office application, or an
    unexpected elevated process points to programmatic invocation as part of an operation. The file
    event carries the deleting process's own GUID, so pivot to its process_creation record to read
    its parent lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - ParentCommandLine
- question: Is telemetry collection on this host still intact, or did the activity also disrupt logging and recovery data?
  context: >-
    Secure file deletion is often one step in a broader evidence-removal effort. Confirming that
    event logs, shadow copies, and endpoint telemetry are still being collected establishes whether
    the rest of the investigation is working from an intact host or one that has been partially
    blinded. If logging or recovery data was also destroyed, restoring visibility and preserving
    what remains becomes the immediate priority before deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after the file was wiped?
  context: >-
    Evidence is destroyed for a reason - to hide what ran before it or to clear the way for what
    runs after. Examining process activity immediately following the deletion reveals whether the
    wipe was the final cleanup of an operation or a mid-sequence step before further action such as
    credential access, lateral movement, or an impact payload. A cluster of new processes in the
    window after the wipe is the activity the deletion was meant to obscure.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other anti-forensic actions performed on this host, such as log clearing or shadow copy deletion?
  context: >-
    An actor who securely wipes one artifact often destroys several - clearing event logs, deleting
    shadow copies, disabling recovery, or stopping defensive services in the same operation. Finding
    other indicator-removal tooling running from the same user or parent process around the wipe
    indicates a coordinated cleanup rather than an isolated file disposal, and enumerates the full
    set of controls and evidence that were targeted.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that securely wipes one file often wipes many - a tool clearing a staging directory, a
    dropper removing its components, or a wiper touching thousands of paths. The breadth, locations,
    and extensions of the deleting process's other file activity distinguish a single artifact
    disposal from a bulk destruction sequence and enumerate everything else that was removed. The
    correlation covers the responsible process and its direct children, since cleanup is often
    delegated.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: How many other files matching the SDelete rename pattern were deleted on this host?
  context: >-
    A single .AAA or .ZZZ deletion may be an isolated wipe, but a run of them is a bulk secure-erase
    sweep. Counting deletions on this host whose names carry the repeating-letter SDelete pattern
    reveals the scale of the destruction and which processes performed it. A cluster of such
    deletions from one process points to a directory or dataset being systematically wiped rather
    than a one-file disposal.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .AAA
          - .ZZZ
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this SDelete deletion pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day
    history of producing this specific secure-wipe pattern - not generic file activity - aggregated
    by host. A user who has never triggered this pattern is more suspicious than one who does so
    routinely as part of a sanctioned disposal process; weigh the count against the account's role
    and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith:
        - .AAA
        - .ZZZ
      filter_wireshark:
        TargetFilename|endswith: \Wireshark\radius\dictionary.alcatel-lucent.aaa
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program driven this deletion pattern before, or is the program new for this activity?
  context: >-
    When the wipe fires under a service or machine principal, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection
    scoped to the alerting program, so the result is the 90-day history of this program driving
    this secure-wipe pattern, aggregated by host. A new or rare program for this pattern is the
    deviation worth chasing, while a program that already accounts for many prior events is likely
    automation or a scheduled maintenance task.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith:
        - .AAA
        - .ZZZ
      filter_wireshark:
        TargetFilename|endswith: \Wireshark\radius\dictionary.alcatel-lucent.aaa
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around the time of the alert?
  context: >-
    Tracking the acting user's activity across all hosts reveals whether the deletion is part of
    wider movement or confined to one endpoint. If the same account triggered similar wipes or other
    notable activity on multiple hosts in the same window, the scope of the operation is larger than
    a single-host cleanup. The query intentionally omits the host filter and aggregates by host and
    process to summarize where the user was active.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven deletion pattern fire on other hosts in the same window?
  context: >-
    Under a service or machine principal, asking what else the user did returns agent-telemetry noise
    because every host runs system-owned processes constantly. The meaningful question is whether the
    same launch mechanism fired elsewhere: the query mirrors the rule's selection scoped to the
    alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation, while a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_delete
    detection:
      selection:
        TargetFilename|endswith:
        - .AAA
        - .ZZZ
      filter_wireshark:
        TargetFilename|endswith: \Wireshark\radius\dictionary.alcatel-lucent.aaa
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - host.name
- question: Is this same secure-wipe deletion pattern present on other hosts in the environment?
  context: >-
    The same wipe pattern appearing across many hosts suggests a distributed destruction effort - a
    wiper, ransomware cleanup, or a tool run broadly - while a pattern confined to one host suggests
    targeted disposal. The query matches the SDelete rename pattern fleet-wide without a host filter
    and aggregates by host, so a spread across endpoints and its timeline stand out against a
    single-host occurrence.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_delete
      product: windows
    detection:
      selection:
        TargetFilename|endswith:
          - .AAA
          - .ZZZ
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Deletions rarely happen in isolation. Earlier detections on the same host - reconnaissance,
    execution of scripting tools, credential access, or other defense tampering - may reveal the
    stages that preceded the wipe and help reconstruct the timeline. Secure deletion is typically a
    cleanup step, so prior alerts help place this destruction within a larger sequence of activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
