name: PUA - Restic Backup Tool Execution
id: 3149bb30-b8ad-4a43-bd53-0d1b63b5edb3
description: |
  Detects execution of the restic backup tool against a remote repository, identified entirely from the command line. The rule fires when EITHER a repository-initialization or snapshot-backup invocation is present (a command line containing --password-file with init and -r, OR --use-fs-snapshot with backup and -r) OR a remote-repository target is configured (an init/-r command line referencing a remote backend such as sftp:, rest:http, an s3 endpoint, azure:, gs:, rclone:, swift:, or b2:). restic is a legitimate backup utility, but operators reuse it to stage and stream sensitive data to attacker-controlled object storage or self-hosted repositories, so its presence outside a sanctioned backup program may indicate exfiltration. Confirm which branch fired, decode the full command line to recover the repository target and what was backed up, determine whether the destination is sanctioned, and check the surrounding host and user activity for a broader operation.
type: detection
detection_id: 6ddff2e8-ea1a-45d0-8938-93dfc1d67ae7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with either a restic init/backup invocation or a remote-repository target configured?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line. The rule fires when EITHER a repository-initialization or snapshot-backup pattern is present (--password-file together with init and -r, OR --use-fs-snapshot together with backup and -r) OR an init/-r command line names a remote backend (sftp:, rest:http, an s3 endpoint, azure:, gs:, rclone:, swift:, or b2:). Confirm which branch matched and note it, because the destination branch makes the repository-classification and outbound-transfer questions load-bearing, while the init/backup branch makes the data-scope and repository-authentication questions load-bearing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run the restic backup tool?
  context: Sanctioned backup automation can legitimately run restic on a fixed set of servers under a known service or backup account. The same invocation on a workstation, a domain controller, or under an unexpected interactive user is far more likely to be operator-driven data staging. Knowing whether the user role and host function fit running a command-line backup-and-exfiltration tool is often the fastest path to separating a true positive from a routine backup job.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is restic on the organization's approved software list for this host?
  context: Organizations that use restic typically sanction it for a specific backup program on a defined set of systems, often with an allow-listed set of repository protocols. restic running on a host outside that program, or pointed at a protocol or backend that is not part of the sanctioned configuration, may represent shadow IT or operator-staged exfiltration. Check the tool against the approved-software inventory regardless of restic's legitimate reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a sanctioned backup job, change ticket, or maintenance window that explains this restic execution?
  context: Legitimate restic usage correlates with a scheduled backup window, a documented backup program, or an approved change ticket. If no backup context exists for this host and time, the invocation may be operator-staged exfiltration rather than a sanctioned job. Match the host, user, repository target, and time against backup-program records and the change calendar.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Decode the full restic command line. What repository target, password source, and backup paths did it specify?
  context: 'The full command line is the operation. Parse the restic invocation to recover three things: the repository target after -r (a remote backend URL such as rest:http://..., an s3/azure/gs/b2/swift endpoint, an sftp or rclone target, or a local path), the credential source (--password-file points at a file holding the repository password), and the action (init creates a new repository, backup with --use-fs-snapshot snapshots and streams data). Note any embedded host, port, bucket, or file path. This decode is distinct from confirming the alert matched.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: restic
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned restic and is that parent chain expected?
  context: The parent process reveals how restic was invoked. A sanctioned backup job typically descends from a scheduler or service host (taskeng.exe, svchost.exe, a backup-product service); an interactive operator chain or an anomalous parent (a shell launched from an Office application, a script host such as wscript.exe or mshta.exe, or a side-loaded binary) points to hands-on staging rather than scheduled backup. An unexpected parent for restic is a reason to walk the chain upward and see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What files or directories were selected for backup?
  context: 'The backup arguments reveal what data was targeted: a specific share or directory (a finance or HR share, a source-code tree, a user profile), specific file types, or a broad root path indicating bulk collection. restic with --use-fs-snapshot reads through a volume snapshot, so even open or locked files are captured. The scope of targeted data determines the severity of potential data loss and which business units need to be notified.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How is the restic repository authenticated, and is the password source under operator control?
  context: 'restic always encrypts repository contents, and --password-file supplies the repository password from a file on disk rather than an interactive prompt. A password file dropped into a temp or user-writable directory alongside the invocation is consistent with automated, unattended staging by an operator. Recover the --password-file path from the command line and determine who created it and when; the encryption itself means the repository contents cannot be inspected from the wire, so the password source and repository target are the available pivots.'
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What repository backend was configured, and is it self-hosted infrastructure or a third-party cloud storage service?
  context: 'The repository target after -r classifies the exfiltration path. Cloud object-storage backends (an s3 endpoint, azure:, gs:, b2:, swift:, or an rclone target fronting a cloud provider) move data to a third-party service and correspond to exfiltration to cloud storage; a rest:http or sftp target points at self-hosted or operator-controlled infrastructure. Identify the backend scheme and the concrete host, bucket, or URL, then determine whether that destination is part of any sanctioned backup configuration. An unsanctioned cloud bucket or an unfamiliar REST/sftp host is the strongest single indicator that this is staging for theft rather than backup.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
        - 'sftp:'
        - rest:http
        - s3:s3.
        - s3.http
        - 'azure:'
        - ' gs:'
        - 'rclone:'
        - 'swift:'
        - ' b2:'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint did restic connect to while running?
  context: 'A remote restic repository requires an outbound connection to the backend host. The destination reveals whether restic reached sanctioned backup infrastructure or an unfamiliar external address or cloud-storage endpoint. Correlate the network connections from the restic process against the repository target recovered from the command line: the destination IP, hostname, and port should match the configured backend. A connection to an address that is not part of any sanctioned backup configuration is the exfiltration channel.'
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: How much outbound data left this host from the restic process, and did the transfer happen during expected backup hours?
  context: A backup-and-stream tool reading a volume snapshot produces a sustained, high outbound-to-inbound traffic ratio to the repository host. A large outbound volume to a single external destination, especially outside any scheduled backup window or during off-hours, is consistent with bulk data exfiltration rather than an incremental sanctioned backup. Review the connection volume and timing from the restic process and compare against when sanctioned backups are expected to run.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Has this host run restic before, and how often?
  context: A restic invocation that has never been seen on a host is more suspicious than one that recurs on a known backup schedule. Scoping the baseline to the restic command-line token rather than to a launching binary keeps the count specific to this tool. Zero or very low historical counts indicate first-time or rare execution, which on a host outside the backup program raises the priority of the destination classification.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: restic
      condition: selection
    fields:
      - User
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even a sanctioned backup tool can be repurposed. The query mirrors the rule's full selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific restic firing pattern has historically run here, not generic backup activity. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific:
      - CommandLine|contains|all:
        - --password-file
        - init
        - ' -r '
      - CommandLine|contains|all:
        - --use-fs-snapshot
        - backup
        - ' -r '
      selection_restic:
        CommandLine|contains:
        - 'sftp:'
        - rest:http
        - s3:s3.
        - s3.http
        - 'azure:'
        - ' gs:'
        - 'rclone:'
        - 'swift:'
        - ' b2:'
        CommandLine|contains|all:
        - ' init '
        - ' -r '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific:
      - CommandLine|contains|all:
        - --password-file
        - init
        - ' -r '
      - CommandLine|contains|all:
        - --use-fs-snapshot
        - backup
        - ' -r '
      selection_restic:
        CommandLine|contains:
        - 'sftp:'
        - rest:http
        - s3:s3.
        - s3.http
        - 'azure:'
        - ' gs:'
        - 'rclone:'
        - 'swift:'
        - ' b2:'
        CommandLine|contains|all:
        - ' init '
        - ' -r '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific:
      - CommandLine|contains|all:
        - --password-file
        - init
        - ' -r '
      - CommandLine|contains|all:
        - --use-fs-snapshot
        - backup
        - ' -r '
      selection_restic:
        CommandLine|contains:
        - 'sftp:'
        - rest:http
        - s3:s3.
        - s3.http
        - 'azure:'
        - ' gs:'
        - 'rclone:'
        - 'swift:'
        - ' b2:'
        CommandLine|contains|all:
        - ' init '
        - ' -r '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or data staging spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the operation may be larger than a single alert, which matters when the activity is data collection and exfiltration.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection_specific:
      - CommandLine|contains|all:
        - --password-file
        - init
        - ' -r '
      - CommandLine|contains|all:
        - --use-fs-snapshot
        - backup
        - ' -r '
      selection_restic:
        CommandLine|contains:
        - 'sftp:'
        - rest:http
        - s3:s3.
        - s3.http
        - 'azure:'
        - ' gs:'
        - 'rclone:'
        - 'swift:'
        - ' b2:'
        CommandLine|contains|all:
        - ' init '
        - ' -r '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Exfiltration is usually a late stage. Earlier detections on the same host, such as credential access, reconnaissance, defense tampering, or collection activity, may reveal the stages that preceded the data staging and help reconstruct the timeline. Look for patterns: discovery followed by collection, or credential access followed by staging to a remote repository.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
