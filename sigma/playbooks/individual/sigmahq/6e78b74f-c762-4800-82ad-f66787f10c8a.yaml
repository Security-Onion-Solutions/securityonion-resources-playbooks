name: Potential Rcdll.DLL Sideloading
id: e0e8754a-d8dd-413f-8891-82b73e5d5b5c
description: |
  Detects a process loading a module named rcdll.dll from a path outside the directories where
  the legitimate Microsoft Resource Compiler support library normally ships (under Visual Studio
  and Windows Kits install trees). rcdll.dll is a signed helper loaded by the resource compiler
  binary rc.exe; when a copy of rc.exe is staged in an attacker-controlled directory alongside a
  malicious rcdll.dll, the signed host binary loads the planted library from its own directory
  through the DLL search order, executing attacker code under the trust of a signed process. The
  rule fires when ImageLoaded ends with rcdll.dll AND the load path does not start with the known
  Visual Studio or Windows Kits directories. Investigate the exact load path, signature, and hash
  of the loaded module; identify the loading process and its parent chain; determine whether the
  DLL was recently written to disk and by what; and check for follow-on execution or persistence.
type: detection
detection_id: 6e78b74f-c762-4800-82ad-f66787f10c8a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — an rcdll.dll loaded from a path outside the Visual Studio and Windows Kits directories?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires when a module whose
    path ends in rcdll.dll is loaded AND that path does not start with the legitimate
    C:\Program Files (x86)\Microsoft Visual Studio\ or C:\Program Files (x86)\Windows Kits\ install
    trees. Review the exact ImageLoaded path, its code-signature status, and the loading process on
    the triggering event. A genuine rcdll.dll under the SDK directories is the tool-chain support
    library; the same filename loaded from an application directory, a user-writable location, or a
    temporary path is the side-loading pattern this rule targets. DLL loads carry a hash and signing
    status directly on the load event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and process expected to load the resource compiler support library from this location?
  context: >-
    Loading rcdll.dll is normal only for the resource compiler tool chain running from its installed
    Visual Studio or Windows Kits location, typically on a developer or build host. If this host is
    not a development or build system, or the loading process is not the resource compiler running
    from its expected install path, the load is anomalous and the analysis should continue into the
    module's origin and signature. Knowing the host function and the account context is often the
    fastest path to separating a legitimate build-tool invocation from a staged side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What modules did this process load, and did rcdll.dll come from the loading application's own directory rather than the expected SDK path?
  context: >-
    The set of modules a process loads tells the story when the trigger alone is opaque. For a
    search-order side-load, the key signal is a system or tool-chain DLL name resolved from the
    loading binary's own directory instead of the canonical install path for that DLL. Look for
    rcdll.dll and any companion modules loaded from a user-writable directory, a staging folder, or
    a temporary path, and for unsigned modules loaded where signed ones are expected. A copy of the
    signed host binary staged next to a planted DLL is what redirects the load.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded rcdll.dll, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes the genuine signed resource compiler library from a planted
    replacement. A validly signed Microsoft rcdll.dll loaded from an unexpected location may still be
    a relocated legitimate file, while an unsigned or invalidly signed module carrying the rcdll.dll
    name is a strong masquerading indicator. The Hashes field on the load event supports a
    threat-intel pivot, and comparing the hash to the known-good resource compiler library reveals
    substitution. Watch SignatureStatus values of Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What did the process that loaded this module run — decode its full command line and working directory?
  context: >-
    The loading process's command line and working directory reveal how the side-load was staged.
    A resource compiler binary invoked from a build pipeline in its install tree looks different
    from the same binary run out of a user-writable or temporary directory with an unusual working
    directory. Decode any arguments, referenced file paths, and the directory the process ran from,
    since the current directory is what governs the DLL search order that resolved rcdll.dll.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the binary that loaded this module, and is that parent chain expected?
  context: >-
    The parent process reveals how the loading binary was invoked. A resource compiler running under
    a build system, a developer shell, or an installer has a predictable lineage; the same binary
    launched by a script host such as wscript.exe or mshta.exe, an Office application, a browser, or
    an unsigned dropper points to the side-load being staged programmatically rather than through
    normal tool-chain use. Walk up the parent chain to see what initiated the execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the binary that loaded this module?
  context: >-
    A loading binary that has never run on this host before is more suspicious than one that runs
    regularly. On a developer or build host the resource compiler tool chain may execute routinely;
    on a system that has no development role, a first-time or rare execution of that binary indicates
    the process was placed there to carry the side-load. Zero or very low historical counts point to
    first-time or rare execution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this rcdll.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same
    rcdll.dll path has been loaded by the same tool-chain binary repeatedly over the past 90 days,
    this load is probably routine build activity. If this is the first occurrence, or the DLL has
    only ever been loaded by different or unexpected processes, the current load is anomalous and
    consistent with a newly staged side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is an rcdll.dll being loaded on other hosts in the environment, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces deployment scope. The same DLL name loaded on a single host may
    be a localized incident, while the same load appearing across multiple hosts indicates broader
    distribution or shared tooling. Pay attention to the variety of loading processes: rcdll.dll
    loaded only by the resource compiler in its install path across build hosts is benign, whereas
    the same DLL loaded by unexpected processes on other hosts suggests the side-load was deployed
    more widely.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Was this rcdll.dll written to disk on this host, and by what process?
  context: >-
    A side-loaded library has to reach the loading binary's directory before it can be loaded, so a
    recent file write of rcdll.dll to that path is the staging step of the technique. Correlating the
    file write of this module reveals which process dropped it and when relative to the load; a write
    by a script host, an archive utility, a downloader, or an unsigned binary shortly before the load
    ties the drop to the execution. If no write is visible in the window, the file may predate the
    window or have been placed by a mechanism outside file telemetry.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Were registry keys that influence DLL search order or module loading modified on this host around the alert?
  context: >-
    Beyond staging a DLL next to its host binary, module-load redirection can be reinforced through
    registry keys that steer which library a process resolves — the KnownDLLs list, AppInit_DLLs,
    per-application App Paths entries, and Image File Execution Options. Modifications to these keys
    near the alert indicate the loading behavior was deliberately redirected rather than an
    incidental search-order result, and reveal which process made the change. Registry key deletions are not
    observable in this telemetry, so judge tampering from the modification history.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\CurrentVersion\App Paths\'
          - '\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to the side-load and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool
    that staged the DLL and any follow-on execution once the signed host binary ran attacker code.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, delivery of
    an archive or downloader, or defense tampering — may reveal the stages that preceded the
    side-load and help reconstruct the timeline. DLL side-loading is commonly the execution step of a
    delivery chain, so prior alerts help place this load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single foothold. After executing code through a side-loaded DLL, they
    commonly install backup persistence using different techniques — scheduled tasks, services,
    registry Run keys, BITS jobs, or WMI subscriptions. Persistence tools running on this host near
    the load indicate the side-load was used to establish durable access rather than being an
    isolated action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File writes to these locations near the side-load indicate
    the executed payload established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does an administrator or the application owner recall installing or running the software that loaded this module?
  context: >-
    Direct confirmation from the people responsible for the host is often the fastest way to resolve
    the alert. If a developer, build engineer, or administrator recalls installing or running the
    tool chain that loaded rcdll.dll from this location, that context may close the alert; if no one
    recalls placing the binary or DLL there, the account or host may be compromised and the analysis
    should continue into the loading process and any follow-on activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
