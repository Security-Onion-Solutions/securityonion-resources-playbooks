name: BaaUpdate.exe Suspicious DLL Load
id: 8cfc4cbc-e7c0-473e-9cdd-a9de4b549c77
description: |
  Detects the BitLocker Access Agent Update Utility (baaupdate.exe), a trusted signed Windows
  binary, loading a DLL that ends in .dll from a publicly writable or user-writable directory such
  as C:\PerfLogs, C:\Users\Public, C:\Windows\Temp, ProgramData, or a user AppData path. On a clean
  system baaupdate.exe loads its modules from system directories, so a load from one of these
  locations is the payload step of a COM/DCOM hijack: a COM class configured to run as the
  interactive user is abused to launch baaupdate.exe, which then side-loads an attacker-planted DLL
  and executes code in the logged-on user's session for lateral movement. The rule fires when the
  loading process ends in \BaaUpdate.exe AND the loaded module ends in .dll AND its path contains one
  of the user-writable location markers. Investigate which DLL was loaded and its signature and hash,
  how baaupdate.exe was invoked and by what parent, whether a remote DCOM/RPC connection preceded the
  load, whether the DLL is still on disk, and whether the same pattern appears on other hosts.
type: detection
detection_id: 6e8fe0a8-ba0b-4a93-8f9e-82657e7a5984
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did baaupdate.exe load a .dll from a user-writable path, matching what this rule detects?
  context: >-
    Confirm the alert is a true positive before investing time. The rule fires only when the loading
    process ends in \BaaUpdate.exe AND the loaded module ends in .dll AND its path contains a
    user-writable marker such as \Users\Public\, \Windows\Temp\, \ProgramData\, \AppData\Local\Temp\,
    or \PerfLogs\. Review the exact ImageLoaded path, its code-signature status, and the loading
    process on the triggering event. baaupdate.exe normally loads modules from system directories, so
    a DLL from one of these writable locations is the side-load the rule targets. DLL load events
    carry the module hash and signing status directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run baaupdate.exe and load third-party DLLs into it?
  context: >-
    baaupdate.exe is the BitLocker Access Agent update utility and runs rarely in normal operations;
    it has no routine reason to load a DLL from a user-writable directory. Knowing whether the account
    and host function are consistent with legitimate BitLocker administration is often the fastest way
    to separate a sanctioned maintenance action from a COM hijack that uses this signed binary as a
    proxy. When the loading context runs under a machine account or SYSTEM, pivot on the loading
    process and its parent rather than the user name.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which DLL did baaupdate.exe load, from what path, and is it unsigned or from a user-writable directory?
  context: >-
    The module baaupdate.exe loaded tells the operator's story. A DLL staged in %TEMP%, AppData,
    ProgramData, Public, or PerfLogs is a strong side-loading signal, especially when the file name
    mimics a legitimate system library or the module is unsigned in a location where a signed one is
    expected. Search-order and COM hijacks work by placing an attacker DLL where the trusted binary
    will resolve it first, so the load path and file name here identify the specific module to analyze
    for signature and reputation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the DLL loaded from the user-writable path, what is its signing status, hash, and reputation?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A
    genuinely signed Microsoft module loaded from an unexpected location may still be legitimate, but
    an unsigned module with a system-style file name and no valid signature is a strong masquerading
    indicator. SignatureStatus values to watch are Unsigned, Expired, Distrusted, and Invalid
    (tampered); a Valid Microsoft signature lowers suspicion. The Hashes value gives the module hash
    for a threat-intel pivot, which surfaces known loader families reused across intrusions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: How was baaupdate.exe invoked, and do its command-line arguments show a COM-triggered launch?
  context: >-
    The COM hijack that abuses this binary launches baaupdate.exe with input parameters, and it is
    those arguments that make it vulnerable to loading a planted DLL. Decode the full command line and
    working directory for every baaupdate.exe execution on this host in the window: flags, referenced
    paths, or an unusual current directory pointing at a user-writable location indicate the binary
    was driven programmatically rather than by a normal BitLocker maintenance task. A launch with no
    arguments from a system context is the expected benign case.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is the loaded DLL still on disk, and when was it written by which process?
  context: >-
    The side-loaded module is the primary artifact for deeper analysis. Correlating file writes to the
    loading process and its direct children shows when the DLL landed in the user-writable path and
    which process dropped it, which links the load back to the delivery step. If the file is still
    present it can be hashed, submitted for detonation, or reviewed statically; if it was deleted after
    the load, that cleanup is itself part of the operation. File hashes are not carried on the write
    event, so obtain the module hash from the load event and confirm the file's continued presence
    here.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process launched baaupdate.exe, and is that parent chain expected?
  context: >-
    baaupdate.exe carries no command line on the load event, so pivot by ProcessGuid to its
    process_creation record to read its parent and full command. A COM/DCOM hijack that runs as the
    interactive user typically has the binary spawned by a COM surrogate such as dllhost.exe or by a
    service host rather than by a user opening a BitLocker tool. An unexpected parent, a script host,
    or an unsigned launching binary points to the signed utility being used as an execution proxy
    rather than performing routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Has this DLL been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If the same DLL has
    been loaded repeatedly by baaupdate.exe or by known processes over the past 90 days, this load is
    more likely routine. If this is the first occurrence, or the module has only ever been loaded by
    unrelated processes, the current load stands out as the planted payload. Grouping the historical
    loads by loading process shows whether baaupdate.exe loading this module is itself new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously fired this rule's pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even a signed maintenance binary can be abused. This query mirrors the rule's own selection
    scoped to this host, so the resulting program and user distribution reflects how this
    specific baaupdate.exe-loads-a-writable-DLL pattern has run here historically, not generic
    baaupdate.exe usage — expect baaupdate.exe itself in the Image column. An unexpected
    account or a first-ever appearance of the pattern is the deviation worth chasing; a stable
    recurring user suggests an established, if unusual, local process. Image-load events carry
    no parent lineage — pivot to the baaupdate.exe start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \BaaUpdate.exe
        ImageLoaded|endswith: .dll
        ImageLoaded|contains:
        - :\Perflogs\
        - :\Users\Default\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \Contacts\
        - \Favorites\
        - \Favourites\
        - \Links\
        - \Music\
        - \Pictures\
        - \ProgramData\
        - \Temporary Internet
        - \Videos\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What child processes did baaupdate.exe spawn after loading the DLL?
  context: >-
    The value of proxy execution and COM hijacking is what the planted code goes on to do. Listing the
    processes spawned by baaupdate.exe on this host after the load reveals whether the side-loaded DLL
    launched a command interpreter, a script host, a reconnaissance tool, or a remote-access utility.
    baaupdate.exe legitimately spawns little; unexpected children such as cmd.exe, powershell.exe, or
    rundll32.exe indicate the module executed follow-on actions in the user's session.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What remote host initiated a DCOM/RPC connection to this system before the load, and is it an expected admin source?
  context: >-
    Lateral movement via BitLocker DCOM and COM hijacking is driven from a remote host that reaches
    this system over RPC. The endpoint mapper on port 135 negotiates the DCOM invocation that launches
    baaupdate.exe as the interactive user, so inbound connections to 135 shortly before the load
    identify the originating system. A connection from a known administrative jump box is expected; one
    from a workstation or an unusual internal source is consistent with an attacker using a compromised
    host as a pivot point to reach this one.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host in the minutes after the remote connection and DLL load?
  context: >-
    Remote code execution via DCOM is a means to an end: once baaupdate.exe loads the planted module in
    the user's session, the operator uses that foothold to run commands, deploy tools, or reach data.
    Examining the processes created on this host in the short window after the connection and load
    reveals the objectives pursued once execution succeeded. Correlating the remote invocation with
    process creation within a few minutes ties the network step to on-host activity; group by account
    and binary to separate routine background processes from operator-driven execution.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account run lateral-movement tooling against other hosts recently?
  context: >-
    Attackers rarely stop at one target. If the account tied to this activity is also invoking
    remote execution utilities against other systems, the scope of compromise is wider than this
    host. Finding the same account using tools such as psexec, mstsc, wmic, plink, or ssh across
    several hosts in a short window indicates active lateral movement across the environment
    rather than an isolated event on this system. If this alert fired under SYSTEM, LOCAL
    SERVICE, NETWORK SERVICE, or a machine account (name ending in $), this query intentionally
    returns nothing — a user pivot on a service principal matches every host's background
    automation, not an actor; assess movement through the host- and program-scoped questions
    instead.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: How and from where did the account driving this activity authenticate to this host?
  context: >-
    A DCOM-based lateral movement leaves a logon on the target. The authentication method and
    source reveal how access was obtained: a network logon (type 3) from a remote host is
    expected for a DCOM/RPC invocation, while the logon account and its origin show whether
    valid credentials, a reused hash, or an unexpected privileged account drove the connection.
    A single account authenticating to many systems in a short period, particularly a privileged
    one, points to lateral movement in progress. If Windows Security logon events are not
    collected in this environment, treat zero results as a visibility gap rather than evidence
    nothing occurred. If the alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a
    machine account (name ending in $), this query intentionally returns nothing — service-
    principal logons are background noise, not an actor trail. For a human account, zero results
    can also mean the Security channel is not ingested for the relevant hosts; confirm 4624
    visibility before reading zero as "no authentications".
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
        - 4624
        - 4625
        TargetUserName|expand: '%User%'
      filter_svcprin_builtin:
        TargetUserName:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        TargetUserName|endswith: $
      condition: (selection) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - IpAddress
    - EventID
    - LogonType
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to the baaupdate.exe launch and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to the tooling that staged the hijack, any reconnaissance, and follow-on execution once the
    module ran in the user's session.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host, such as reconnaissance, credential access, or defense
    tampering, may reveal the stages that preceded this load and help reconstruct the timeline. Lateral
    movement is usually a step within a larger operation, so prior alerts help place this
    signed-binary DLL load within the sequence of an intrusion that started elsewhere.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is baaupdate.exe running on other hosts in the environment right now?
  context: >-
    Automated lateral movement often drives the same signed-binary proxy across many systems in a short
    timeframe. Finding baaupdate.exe executing on other hosts around the same time shows the activity is
    not isolated and helps determine the scope for containment. A single host points to a targeted
    action; the same binary appearing on several hosts in a narrow window points to scripted deployment
    across the environment.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith|expand: '%Image%'
      filter_self:
        host.name|expand: '%hostname%'
      condition: selection and not filter_self
    fields:
      - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    This query mirrors the rule's own selection with no host scope, giving a fleet-wide count of the
    baaupdate.exe-loads-a-writable-DLL pattern rather than generic use of the binary. Many hosts firing
    the same pattern points to scripted deployment or a shared vendor process; one host or a small
    unrelated set points to hands-on operator activity. Use the host distribution and the consistency
    of the loaded module and parent to calibrate severity and scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \BaaUpdate.exe
        ImageLoaded|endswith: .dll
        ImageLoaded|contains:
        - :\Perflogs\
        - :\Users\Default\
        - :\Users\Public\
        - :\Windows\Temp\
        - \AppData\Local\Temp\
        - \AppData\Roaming\
        - \Contacts\
        - \Favorites\
        - \Favourites\
        - \Links\
        - \Music\
        - \Pictures\
        - \ProgramData\
        - \Temporary Internet
        - \Videos\
      condition: selection
    fields:
    - host.name
