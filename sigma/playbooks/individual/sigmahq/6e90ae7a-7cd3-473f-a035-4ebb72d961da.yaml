name: PCRE.NET Package Temp Files
id: 1d141bf3-0d05-42bf-8a8f-68329b2f7d56
description: |
  Detects a file written under \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\, a fixed-name
  directory that the PCRE.NET regular-expression library extracts its native components into at runtime.
  Because several .NET post-exploitation and reconnaissance utilities embed this library, the directory
  is a reliable fingerprint that such a tool ran even though the tool's own executable name and command
  line vary. Legitimate .NET applications can also use PCRE.NET and would produce the same files, so the
  investigation should determine which process created them, whether that process is an expected
  application or an offensive tool, and what it did once it was running.
type: detection
detection_id: 6e90ae7a-7cd3-473f-a035-4ebb72d961da
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting file write land in the PCRE.NET temp directory, and which process created it?
  context: >-
    Before investing investigation time, confirm the alert is a true positive by reviewing the exact
    file path and the responsible process. The rule fires when a file is written under
    \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\, a fixed-name directory that the PCRE.NET
    regular-expression library extracts its native components into at runtime. Confirm the write targets
    that directory and note the creating process, which is the application that loaded the library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to run .NET tooling that extracts the PCRE.NET native library?
  context: >-
    Legitimate .NET applications can bundle the PCRE.NET regular-expression library and would produce
    the same temp files, but on most endpoints nothing routinely writes to this directory. Knowing
    whether the account and host normally run .NET development tools or applications that use this
    library is often the fastest way to separate benign use from an offensive utility that happens to
    embed it. User attribution is present on roughly 94% of endpoint file events; when it is a machine
    account or missing, judge by the creating process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which process created these temp files, and what was its full command line and parent process?
  context: >-
    The file event carries no command line, so pivot by the responsible process identifier to its
    process-creation record to read the Image, full command line, and parent. Because this temp directory
    is a fingerprint shared by several .NET tools, the creating process is what identifies the specific
    application - a known line-of-business program, a developer tool, or an offensive utility used for
    reconnaissance or credential access. The parent chain distinguishes an interactive launch from one
    driven by a script host or another process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What is the creating process's on-disk hash, and does it have known threat-intelligence detections?
  context: >-
    The temp files themselves carry no hash on the write event, and they are the library's native
    components rather than the tool of interest, so the hash worth checking is the creating process's
    own executable. Its hash is recorded when it runs; submit that to reputation and threat-intelligence
    sources to determine whether the binary is a known-good application, a known offensive tool, or
    previously unseen. If the process is no longer running, retrieve its image from the recorded path and
    hash it manually.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Are the PCRE.NET temp files still on disk, or were they deleted after the alert?
  context: >-
    The library commonly cleans up its extracted components when the process exits, so the files may be
    short-lived and a rapid deletion is expected behavior rather than anti-forensic cleanup here. What
    matters is whether anything in the directory persisted long enough to retrieve and examine, and
    whether the creating process remained active. If the files are gone, the investigation shifts to the
    process that wrote them and what it executed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the process that wrote these files spawn any child processes afterward?
  context: >-
    Many .NET reconnaissance and credential tools operate in a single process and perform their work in
    memory, producing no child processes, so an empty result does not clear the alert. When child
    processes are present they are secondary execution worth examining - a spawned command interpreter, a
    network utility, or a dropped binary indicates the tool progressed from its initial function to
    follow-on actions.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A tool that extracts a native library into Temp usually writes several related components at once,
    and may also stage output, drop additional payloads, or write captured data to disk. The breadth,
    paths, and extensions of the process's other file activity distinguish a self-contained utility from
    one that is collecting or staging data. The correlation covers the writing process and any child
    processes it delegated the writes to.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the PCRE.NET temp directory on this host, and by which processes?
  context: >-
    This fixed-name directory is used only by processes that load the PCRE.NET library, so the set of
    processes that have written here is small and telling. A single unfamiliar writer, or repeated
    appearances tied to one process, shows whether this is an isolated run or a location under active
    use. Grouping by path and writing process separates a one-off extraction from a resident application
    that uses the library regularly.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this temp directory been written to before on this host?
  context: >-
    A directory that has never appeared on a host before is more notable than one that shows up
    periodically. No prior writes make this a first-time extraction and raise its weight; a history of
    regular writes points to a resident application that legitimately uses the library. Compare the
    historical writing processes to see whether the same application is responsible each time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Was this temp directory created on any other hosts in the environment?
  context: >-
    The same fingerprint directory appearing on many hosts suggests a tool run broadly across the
    environment or an application deployed widely; confined to one host it suggests a targeted or
    hands-on operation. Compare the writing processes across hosts to see whether the same application is
    responsible everywhere, which separates a deployed line-of-business program from repeated use of an
    offensive tool.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: '\AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this user produced this same PCRE.NET fingerprint before, and does that fit their role?
  context: >-
    The query mirrors the rule's detection scoped to this user - the result is the user's 90-day history
    of writing into this specific fingerprint directory, aggregated by host, not generic file activity. A
    user who has never produced this pattern is more notable than one who does so routinely; weigh the
    count against whether the account belongs to a developer or administrator whose toolset would
    legitimately include this library.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this fingerprint on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's detection scoped
    to the alerting program, so the result is the 90-day history of this program driving this
    specific pattern. A new or rare program for this pattern is the deviation worth chasing; a program that
    already accounts for many prior events is a resident application or platform automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around the time of the alert?
  context: >-
    Tracking the account's activity across all hosts in a tight window reveals whether this extraction
    was isolated or part of broader hands-on activity. The same user driving similar activity on several
    hosts around the same time widens the likely scope. When the alert fires under a service or machine
    account, this view returns routine agent telemetry and the parent-driven view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven fingerprint appear on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what else the user did returns constant agent telemetry
    rather than a lead. The useful question is whether the same launch mechanism produced this fingerprint
    elsewhere in the alert window: several hosts point to pushed or scheduled automation, a single host
    points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|contains: \AppData\Local\Temp\ba9ea7344a4a5f591d6e5dc32a13494b\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The extraction rarely happens in isolation. Aggregating process activity in a tight window around the
    alert surfaces what launched the tool and what ran immediately after it. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the tool that
    produced the fingerprint and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Offensive .NET tooling is typically one step in a longer sequence. Earlier detections on the same
    host - reconnaissance, execution of scripting tools, or credential access - may reveal the stages
    that preceded this activity and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
