name: HackTool - Typical HiveNightmare SAM File Export
id: 5f3b2acc-8d3a-4eb7-a012-ef95f403ecdf
description: |
  Detects a copy of the SAM registry hive written to disk under one of the filenames the HiveNightmare exploit for CVE-2021-36934 uses by default — for example hive_sam_*, SAM-2021-*, Sam.save, or C:\windows\temp\sam. That vulnerability leaves the SAM, SECURITY, and SYSTEM hives readable by unprivileged users through a Volume Shadow Copy because of an over-permissive access-control list, letting a low-privileged account export the local account password hashes without administrative rights. The exported file is credential material: the SAM hive yields local account hashes, and a paired SYSTEM hive supplies the boot key needed to decrypt them. The investigation should confirm the file is a SAM hive, identify the process and account that produced it, determine whether the matching SYSTEM and SECURITY hives were also copied, establish whether the local hashes are now exposed and reusable, and check whether the same activity reached other hosts. Because the exploit deliberately runs under a standard user, do not discount the alert merely because the writing account is not privileged.
type: detection
detection_id: 6ea858a8-ba71-4a12-b2cc-5d83312404c7
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a file written whose name matches a known HiveNightmare SAM-export pattern, and which pattern matched?
  context: >-
    The rule fires when a file is created whose name matches one of the default HiveNightmare outputs — a name containing hive_sam_, SAM-2021-, SAM-2022-, SAM-2023-, SAM-haxx, or Sam.save, or the exact path C:\windows\temp\sam. Confirm the written file name and note which pattern matched, then read the file's path; the false-positive case is a benign file that incidentally contains one of these strings, which the content and location will quickly distinguish from an actual hive copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Under what account and on what host was this file written?
  context: >-
    The exploit for this vulnerability is designed to run as a standard, unprivileged user — that is the point of the flaw — so a non-administrative account writing the file does not lower the concern; it fits the technique. Read the account and the host role: a general workstation user exporting a SAM hive is exactly the abuse this detects, while a backup or imaging process on a designated host may be a benign match to confirm. When the account is a machine or service account, judge by the writing process and host function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this activity part of an authorized penetration test or red team engagement?
  context: >-
    Exploitation of this SAM-exposure flaw is a common step in authorized security assessments. Before deeper analysis, check whether a penetration test or red team exercise covering this host is active; an engagement whose scope and timing match resolves the alert, while its absence keeps this a live credential-exposure investigation. The re-displayed event carries the writing process context to match against engagement records.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the written file actually a SAM registry hive?
  context: >-
    Retrieve and inspect the file. A saved registry hive begins with the regf signature and carries recognizable hive structure; confirming the exported file is a genuine SAM hive rather than an unrelated file that happens to match the name pattern is what separates a true positive from the documented false-positive case. Preserve the file as evidence and note its size and structure. The file-write event carries no hash, so identification is by retrieved content.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: How was the SAM hive obtained — does the writing command show a Volume Shadow Copy read?
  context: >-
    This exploit reads the SAM from a Volume Shadow Copy path, since the live hive is locked; the writing process command line frequently shows a source path referencing HarddiskVolumeShadowCopy or the shadow device, or a copy of the config hives. Read the command that produced the file to confirm the shadow-copy source and to see whether the SYSTEM and SECURITY hives were read in the same operation — the SYSTEM hive supplies the boot key needed to decrypt the SAM, so its presence raises the exposure from a hive file to usable hashes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which local accounts are exposed by the SAM hive, and do any hold administrative rights?
  context: >-
    The SAM hive holds the password hashes of every local account on this host, including the built-in administrator and any local admin accounts. Enumerate those accounts and identify which hold administrative rights; if the same local credentials or a shared local administrator password are used across other machines, the exposure extends beyond this host. Treat exposed privileged local accounts as compromised and prioritize resetting them. The writing command re-displayed here does not list the accounts, so build the list from the host's local account inventory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote the file, and what started that process?
  context: >-
    Identify the writing process and trace its parent. A script host, a downloaded executable, or a command shell launched from an unexpected parent producing a SAM export points to the exploit tool; a recognized backup or administrative utility points toward a benign explanation to confirm. If the parent process identifier resolves to NODATA on this alert, fall back to the writing process name and host with a short time window around the write.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the process that wrote the file?
  context: >-
    A writing process that has never run on this host before is more suspicious than one that appears regularly. This counts how often the alerting writer has executed here over the past three months, grouped by account. A zero or very low count marks a first-time or rare execution consistent with an exploit tool being introduced; a high count for a known backup or management binary suggests a benign match to confirm against its purpose.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Is the exported SAM file still on disk, or was it deleted or moved after the alert?
  context: >-
    The file's post-alert lifecycle drives next steps. A hive copy still on disk can be retrieved, confirmed, and preserved as evidence; a file deleted or renamed shortly after creation suggests the operator collected it and cleaned up, shifting the focus to whether it was exfiltrated and to the accounts exposed. Read the operation type on the file's later events to distinguish a lingering copy from a collect-and-delete pattern.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were outbound remote-access connections initiated from this host after this event?
  context: >-
    Extracted local hashes are commonly used to authenticate to other machines, especially where a local administrator password is shared. Outbound sessions from this host after the export — RDP on 3389, SMB on 445, WinRM on 5985 or 5986, SSH on 22 — may show those credentials being exercised or the hive being copied off the host. Read the destinations and the initiating account; new sessions to hosts this one does not normally contact point to credential reuse or exfiltration in progress.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: What other files did the writing process create or delete around the alert?
  context: >-
    A usable credential extraction needs more than the SAM hive: the SYSTEM hive supplies the boot key and the SECURITY hive holds LSA secrets and cached logons, so exploit tools typically export all three together. Enumerating every file the writing process and its direct children produced in the surrounding window exposes the full set of exported hives and where they landed. Three config-hive copies appearing together confirm a complete credential-extraction rather than an isolated write.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file matching this SAM-export name appeared on any other hosts?
  context: >-
    The same export name appearing across multiple hosts points to a sweep — the exploit run against several machines — rather than an isolated action, and widens the set of hosts whose local accounts are exposed. A single-host occurrence is more consistent with a targeted or manual test. Compare the writing process and account across any hosts that match to gauge whether this is one operator working across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- always_include: true
  question: Has this account previously produced this SAM-export pattern, and does that history fit its role?
  context: >-
    This counts how often the attributed account has produced the rule's exact pattern — a file matching a HiveNightmare SAM-export name — over the past three months, grouped by host. Almost no account legitimately produces this, so any prior history is itself informative; a first-ever occurrence for the account is the anomaly to pursue. Weigh the result against the account's role and read it together with the parent-driven view when the write is attributed to a service or machine account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains:
        - \hive_sam_
        - \SAM-2021-
        - \SAM-2022-
        - \SAM-2023-
        - \SAM-haxx
        - \Sam.save
      - TargetFilename: C:\windows\temp\sam
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this SAM-export pattern, or is the launch mechanism new for this activity?
  context: >-
    When the write is attributed to a service or machine account, the meaningful pivot is the launch mechanism rather than the identity. This counts how often the alerting program has driven the same SAM-export pattern over the past three months, grouped by host. A program that already accounts for prior events is routine; a new or rare program for this pattern is the deviation. Emit this alongside the account-history view — they answer different questions and neither replaces the other.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains:
        - \hive_sam_
        - \SAM-2021-
        - \SAM-2022-
        - \SAM-2023-
        - \SAM-haxx
        - \Sam.save
      - TargetFilename: C:\windows\temp\sam
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this account do across the environment around this time?
  context: >-
    Tracking the attributed account's activity across all hosts in the surrounding window shows whether this export is isolated or part of activity spanning multiple endpoints. When the write is attributed to SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account, this account-pivot returns unbounded service-telemetry volume and the parent-driven cross-host view is the one to trust for scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service or machine account, asking what the account did across the environment returns service-telemetry noise, so the meaningful question is whether the same launch mechanism produced the export elsewhere. This counts the same SAM-export pattern scoped to the alerting program across all hosts in the alert window. Several hosts in the same window points to a scripted sweep across the environment; a single host points to a targeted extraction. Emit this alongside the account-pivot view — the pair is not deduplicable.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
      - TargetFilename|contains:
        - \hive_sam_
        - \SAM-2021-
        - \SAM-2022-
        - \SAM-2023-
        - \SAM-haxx
        - \Sam.save
      - TargetFilename: C:\windows\temp\sam
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a suspicious download, reconnaissance, shadow-copy creation, or a privilege-check tool — may reveal the stages that preceded this export and place it in a timeline. A SAM export following an earlier execution or reconnaissance alert reads very differently from one with no prior activity on the host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
