name: Amsi.DLL Loaded Via LOLBIN Process
id: 998b636e-9406-4870-99e1-50310d44f471
description: |
  Detects one of a small set of living-off-the-land binaries (ExtExport.exe, odbcconf.exe, or
  rundll32.exe) loading amsi.dll. The rule fires when the loading process (Image) is one of those
  utilities AND the loaded module (ImageLoaded) ends in amsi.dll. amsi.dll is the Antimalware Scan
  Interface library that a scripting engine pulls in as it initializes, so its load by a signed proxy
  binary is the module-load signature of hosting the .NET PowerShell engine
  (System.Management.Automation.dll) inside a LOLBIN rather than powershell.exe. This "PowerShell
  without PowerShell" pattern lets an operator run script functionality while evading controls that
  block or monitor powershell.exe. Legitimate loads of amsi.dll by these three binaries are unusual.
  Investigate the full command line the utility ran, whether the .NET automation assembly loaded
  alongside amsi.dll, the signing status and hash of the loaded modules, the parent chain that
  launched the utility, any conhost.exe or compiler children it spawned, script or project files it
  wrote to disk, and whether the same load pattern recurs on this host or across the fleet.
type: detection
detection_id: 6ec86d9e-912e-4726-91a2-209359b999b9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting event show one of the monitored utilities loading amsi.dll?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    loading process ends in ExtExport.exe, odbcconf.exe, or rundll32.exe AND the loaded module ends in
    amsi.dll. Review the exact ImageLoaded path, its code-signature status, and the loading Image on the
    triggering event. A DLL load carries the module hash and signing status directly, so this event
    already tells you whether the amsi.dll that loaded is the genuine system library and which utility
    pulled it in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run these utilities in a way that loads the scripting engine?
  context: >-
    Legitimate administrative activity can trigger this detection, but ExtExport.exe, odbcconf.exe, and
    rundll32.exe rarely have a routine reason to load amsi.dll. Knowing whether the account and host
    function are consistent with running these utilities against the .NET scripting engine is often the
    fastest way to separate testing or a sanctioned tool from a proxy-execution attempt. When the account
    is a machine account or missing, pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load alongside amsi.dll, and did the .NET PowerShell engine load with it?
  context: >-
    The set of modules a proxy binary loads tells the story the command line alone hides. The load that
    confirms scripting-engine hosting is System.Management.Automation.dll appearing under the same utility
    shortly before or after amsi.dll. Also look for clr.dll or mscoree.dll (the .NET runtime), and for any
    module loaded from %TEMP%, AppData, ProgramData, or another user-writable directory, which points to a
    side-loaded payload rather than a system library.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the amsi.dll and any companion modules this process loaded, what is the signing status, hash, and reputation?
  context: >-
    Module reputation separates a genuine Microsoft library from a masqueraded or side-loaded one. A
    validly signed amsi.dll loaded from system32 is the normal library; an unsigned module with a
    system-style filename, or a module loaded from a user-writable path, is a masquerading or
    search-order-hijack signal. Hash lookups against threat intelligence surface known loaders and
    tooling. Signing-status values worth flagging are Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line the utility ran, and what target did it invoke?
  context: >-
    The image_load event carries no command line, so read the loading process's command line to see what
    it was actually told to do. For rundll32.exe, note the DLL path and the exported entry point it was
    given (an entry point such as main pointing at a non-system DLL is a strong proxy-execution signal).
    For odbcconf.exe, note a /a regsvr action naming a DLL to register-and-run. For ExtExport.exe, note
    the directory argument it was pointed at, since it loads DLLs by name from that path. Decode any
    encoded or obfuscated arguments and record the referenced file paths for the disk-artifact check.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this utility, and is that parent chain expected?
  context: >-
    The parent process reveals how the utility was invoked. Legitimate use of these binaries usually has a
    predictable parent (explorer.exe for an interactive action, services.exe or an installer for a system
    task). A parent such as an Office application, wscript.exe, mshta.exe, a browser, or an unsigned binary
    points to the load being staged programmatically rather than launched deliberately. Walk up the chain
    by querying the parent's own parent when the immediate parent is itself a script host or shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did this utility spawn after loading amsi.dll?
  context: >-
    The processes a proxy binary spawns reveal its actual effect. rundll32.exe or odbcconf.exe hosting a
    console script commonly spawns conhost.exe, an unusual child for these utilities. A .NET or MSBuild
    style operation frequently spawns csc.exe (the C# compiler) to build code on the fly. cmd.exe,
    powershell.exe, or an arbitrary binary spawned here is post-execution activity worth chasing. Scoping
    to the alerting process's children ties any follow-on directly to this load.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did this utility or its children write script or project files to disk, and are they still present?
  context: >-
    A scripting-engine host frequently drops the code it runs: a .ps1 or .psm1 script, or a .csproj
    project that a compiler consumes. Files written by the loading process or its direct children are
    leads for deeper analysis - content review, hashing, or sandbox submission. This correlates file
    writes to the alerting process and its children by process lineage rather than by any command-line
    path placeholder, which is not reliably populated in this telemetry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has loaded amsi.dll via one of these utilities before, what programs and users drove it, and does this alert fit?
  context: >-
    Even common utilities can be abused. This query mirrors the rule's exact load pattern scoped
    to this host, so the resulting program and user distribution reflects how this specific
    pattern - not generic rundll32.exe usage - has run here historically. A new loading
    utility, an unexpected user account, or a first-ever occurrence is the deviation worth
    chasing; a steady, recognized utility-and-user profile argues for an established local
    process. Image-load events carry no parent lineage - pivot to the loading utility's start
    event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith: \amsi.dll
        Image|endswith:
        - \ExtExport.exe
        - \odbcconf.exe
        - \rundll32.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Does this host normally run this utility at all?
  context: >-
    A binary that has never run on a host is a stronger signal than one that runs regularly. A zero or
    very low historical count for this utility indicates a first-time or rare execution and raises the
    weight of the alert. A steady history suggests the binary has a routine role on this host, in which
    case the anomaly is the amsi.dll load rather than the binary itself.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has amsi.dll been loaded on this host before, and by which processes?
  context: >-
    amsi.dll is normally loaded by the scripting hosts and scanners that integrate with the Antimalware
    Scan Interface - powershell.exe, wscript.exe, cscript.exe, and antivirus components. A history of
    amsi.dll loading only under those expected processes makes a load by ExtExport.exe, odbcconf.exe, or
    rundll32.exe stand out. If this is the first time the module has ever loaded on the host, the current
    load carries more weight.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity in a tight window around the load
    surfaces what led up to it and what ran immediately after. Novel parent-child pairs stand out at low
    counts against the high-count routine telemetry, which is what points to the tooling that staged the
    proxy execution and any follow-on such as reconnaissance, credential access, or persistence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - defense tampering, reconnaissance, or credential access - may
    reveal the stages that preceded this load and help reconstruct the timeline. Hosting the scripting
    engine outside powershell.exe is typically a means to run follow-on actions while evading monitoring,
    so prior alerts help place this load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts loaded amsi.dll via these utilities in the past week, and does the spread look like automation or one-off activity?
  context: >-
    This query mirrors the rule's exact load pattern with no host scope, so the result is a fleet-wide
    count of the same pattern rather than generic usage of these binaries. Many hosts loading amsi.dll
    through these utilities points to a scripted deployment or a vendor tool that legitimately relies on
    this behavior; one host or a small unrelated set points to hands-on operator activity. Use the host
    distribution and the consistency of the parents and binaries to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith: \amsi.dll
        Image|endswith:
        - \ExtExport.exe
        - \odbcconf.exe
        - \rundll32.exe
      condition: selection
    fields:
    - host.name
