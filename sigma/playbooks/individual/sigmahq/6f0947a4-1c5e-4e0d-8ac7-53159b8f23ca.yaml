name: Potentially Suspicious Child Process Of Regsvr32
id: 9b212d7e-4176-49ba-9095-21d23685484c
description: |
  Detects regsvr32.exe spawning a child process drawn from a list of interpreters, recon, and persistence tools that it should almost never launch — calc.exe, cscript.exe, explorer.exe, mshta.exe, net.exe, net1.exe, nltest.exe, notepad.exe, powershell.exe, pwsh.exe, reg.exe, schtasks.exe, werfault.exe, or wscript.exe — excluding the benign WerFault crash-reporting case (werfault.exe with -u -p). regsvr32 is the signed COM registration utility; a common abuse loads a local or remote scriptlet or DLL (for example regsvr32 /s /i:<url> scrobj.dll), runs attacker code through the trusted binary, and that code then spawns one of these children. Because only one child fires per alert, the investigation pivots on which child it is: confirm it, decode regsvr32's own command line to recover the scriptlet or DLL it loaded and from where, decode what the child did, and look at the network fetch, the module loaded, and the sibling and follow-on activity.
type: detection
detection_id: 6f0947a4-1c5e-4e0d-8ac7-53159b8f23ca
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-03
questions:
- question: Does this match the rule — regsvr32.exe spawning a suspicious child process?
  context: Confirm the alert before investing time. The rule fires when the parent is regsvr32.exe and the child is one of calc.exe, cscript.exe, explorer.exe, mshta.exe, net.exe, net1.exe, nltest.exe, notepad.exe, powershell.exe, pwsh.exe, reg.exe, schtasks.exe, werfault.exe, or wscript.exe — with the benign WerFault case (werfault.exe -u -p) excluded. Note which child fired, because it determines the rest of the investigation — a script host or PowerShell points to script execution, net/nltest/reg point to discovery or persistence, and an interpreter points to a follow-on stage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: What did regsvr32 load, and what launched regsvr32 itself?
  context: regsvr32's own command line is the proxy mechanism — recover whether it registered a local DLL, loaded a scriptlet (the /i switch, often with an http(s) URL and scrobj.dll), or ran silently (/s). The grandparent shows how regsvr32 was started — an interactive admin or installer is routine, while an Office application, a script host, or a download cradle spawning regsvr32 that then spawns one of these children is the proxy-execution chain. This parent context is the core signal for the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What did the spawned child process actually do? Decode its command line.
  context: Decode the child's full command line and match the analysis to which child fired. For powershell.exe or pwsh.exe, look for an encoded or obfuscated command and a download or in-memory load. For reg.exe, identify the key and value being written. For schtasks.exe, identify the task name, trigger, and action. For net/net1/nltest, identify the enumeration target. For wscript/cscript/mshta, identify the script or URL. A child launched by regsvr32 that performs any of these is running through a proxy and should be treated as attacker-controlled until shown otherwise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Is regsvr32 expected to spawn interpreters or admin tools on this host?
  context: regsvr32 legitimately registers COM components, usually as a child of an installer or setup routine, and it rarely spawns command interpreters, recon utilities, or persistence tools. Knowing whether this user's role and this host's function involve software that drives regsvr32 this way helps separate an unusual installer from proxied execution. A developer or packaging host differs from an end-user workstation where regsvr32 spawning powershell is anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did regsvr32 make outbound network connections to fetch a remote scriptlet or DLL?
  context: regsvr32 can load a scriptlet or DLL straight from a URL, so a network connection from the regsvr32 parent is a strong sign the code it proxied was remotely hosted rather than a local COM registration. Correlating the regsvr32 process to its connections recovers the destination host, IP, and port; compare them against known software-distribution endpoints. An external or newly seen address is the signal to chase, while no connection points to a local scriptlet or DLL instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Did regsvr32 load a DLL or scriptlet module from a user-writable or temp location?
  context: Beyond registering a system COM DLL, regsvr32 is abused to load attacker code — a payload DLL or the scriptlet runtime backing a remote .sct. A module loaded by the regsvr32 parent from a temp, AppData, ProgramData, or public path, rather than from a signed system directory, indicates proxied execution of attacker-supplied code. Matching such a load to the regsvr32 instance corroborates the chain; loads only from standard locations are consistent with a normal registration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
        ImageLoaded|contains:
          - '\AppData\Local\Temp\'
          - '\AppData\Roaming\'
          - '\Windows\Temp\'
          - '\Users\Public\'
          - '\ProgramData\'
      condition: selection
    fields:
      - ImageLoaded
- question: What other child processes did this regsvr32 instance spawn?
  context: If regsvr32 proxied execution, the script or DLL it loaded may have spawned more than one child. Listing the siblings of the alerting child — all children of this exact regsvr32 instance — reveals the full scope of what the proxied code did. Multiple suspicious children from one regsvr32 strongly suggests orchestration rather than a one-off, and a recon-then-persistence pattern across the siblings tells the operational story.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: If the child was PowerShell, was the command encoded or obfuscated, and what does it decode to?
  context: When the child is powershell.exe or pwsh.exe, attackers frequently hide intent with -EncodedCommand (-enc), string concatenation, or backticks. Base64-encoded commands are the most common form. Decoding reveals the actual payload — a download cradle, a reverse shell, or in-memory execution of a .NET assembly — which is the real action proxied through regsvr32. If the child was not PowerShell, this question does not apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: Several of the children this rule fires on (net, net1, nltest, reg) are discovery tools, and a burst of reconnaissance in a tight window — whoami, ipconfig, net user, systeminfo, nltest — is the signature of post-compromise enumeration. If the regsvr32-spawned child sits inside such a burst, the proxied execution is more likely one step in hands-on activity than an isolated event.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Were process-based persistence mechanisms installed on this host around this time?
  context: Several children this rule fires on (reg, schtasks) directly establish persistence, and proxied execution is frequently used to install a foothold. This surfaces persistence tool executions — schtasks, sc, reg, at, bitsadmin, wmic — clustered around the alert. Multiple persistence installations in the same window indicate intentional stacking rather than an isolated action, and identify footholds to remediate.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Does regsvr32 normally spawn this child on this host?
  context: Some parent-child pairings are routine and others are inherently suspicious. This counts how often regsvr32 has spawned this specific child binary on this host historically — zero or very low counts mean a novel and suspicious spawning relationship, while a recurring count may reflect a particular installer or application that drives regsvr32 this way. regsvr32 spawning an interpreter or recon tool with no prior history is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Is this regsvr32-spawning-child pattern occurring on other hosts?
  context: The same regsvr32-to-child pairing appearing on multiple hosts may indicate a deployed package that uses regsvr32 or a campaign proxying execution the same way; a single occurrence is more likely targeted. Comparing the pairing enterprise-wide helps calibrate severity and identify the scope of any compromise.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \regsvr32.exe
        Image|endswith:
        - \calc.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      filter_main_werfault:
        Image|endswith: \werfault.exe
        CommandLine|contains: ' -u -p '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \regsvr32.exe
        Image|endswith:
        - \calc.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      filter_main_werfault:
        Image|endswith: \werfault.exe
        CommandLine|contains: ' -u -p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in a tight window reveals lateral movement or activity spanning multiple endpoints. If the same user drove proxied execution or tooling on other hosts in the same window, the scope is larger than a single machine. This pivot is meaningful only when a real user account fired the alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \regsvr32.exe
        Image|endswith:
        - \calc.exe
        - \cscript.exe
        - \explorer.exe
        - \mshta.exe
        - \net.exe
        - \net1.exe
        - \nltest.exe
        - \notepad.exe
        - \powershell.exe
        - \pwsh.exe
        - \reg.exe
        - \schtasks.exe
        - \werfault.exe
        - \wscript.exe
      filter_main_werfault:
        Image|endswith: \werfault.exe
        CommandLine|contains: ' -u -p '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a download cradle, a macro-spawned shell, defense tampering, or reconnaissance — may reveal how regsvr32 came to proxy execution and help reconstruct the timeline. A high-severity proxy-execution event is usually a stage in a larger chain, so what came before and after is what tells the story.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
