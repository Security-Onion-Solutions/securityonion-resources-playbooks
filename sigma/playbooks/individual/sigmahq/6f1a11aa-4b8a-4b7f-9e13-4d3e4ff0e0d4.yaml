name: WSL Kali-Linux Usage
id: 50c45601-4437-4965-a48c-2beee5680d8f
description: |
  Detects use of the Kali Linux distribution under Windows Subsystem for Linux, either by the Kali launcher or
  distribution binary running from its install path (an AppData package directory, the WindowsApps store path, or
  kali.exe under WindowsApps) or by wsl.exe / wslhost.exe spawning a child whose Image or command line references the
  Kali distribution while excluding the install and unregister invocations. WSL provides a Linux execution environment
  that runs Bash and offensive tooling natively on a Windows host, which sidesteps Windows-centric process and command
  monitoring, so the technique is a form of indirect command execution. Legitimate administrators and security teams do
  install and use Kali WSL, so the investigation should confirm who launched it, decode what was actually run inside the
  distribution, and determine whether the Linux process reached out to the network or spawned follow-on Windows tooling.
type: detection
detection_id: 6f1a11aa-4b8a-4b7f-9e13-4d3e4ff0e0d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this event match what the rule detects, either a Kali launcher or distribution binary running from its install path, or wsl.exe or wslhost.exe spawning a Kali-referencing child outside of install or unregister?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires on either of two independent branches, so note which one fired because it changes what matters downstream. The first branch matches when the Image is the Kali distribution binary running from an AppData package directory or the WindowsApps store path. The second branch matches when the parent is wsl.exe or wslhost.exe and the child Image or command line references the Kali distribution, and the command line is not an install or unregister invocation. If the second branch fired, the parent wsl.exe command line and the spawned child are the load-bearing detail; if the first branch fired, the launcher path and its arguments are.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Is this user and host expected to run Kali Linux under WSL?
  context: Administrators, penetration testers, and security teams legitimately install and run Kali WSL, but it is uncommon on general-purpose workstations and servers. Knowing whether the user role and host function involve offensive tooling or Linux development is often the fastest path to separating sanctioned use from an actor staging a Linux toolchain to evade Windows monitoring.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is wsl.exe or wslhost.exe expected to spawn this Kali process here, and what started the WSL parent itself?
  context: The parent-child relationship is the core signal for the WSL-parent branch of this detection. Tracing the WSL parent's own origin shows whether the chain is interactive (a user launched a shell or terminal that started WSL) or automated and unattended (a script, scheduled task, or remote management tool drove it). An unexpected grandparent such as a script host, an Office application, or a remote-access tool reframes the activity from analyst-driven testing to staged execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same WSL parent spawn around the time of the alert?
  context: If wsl.exe or wslhost.exe spawned the detected Kali process, it likely spawned other processes too. Examining siblings of the same parent instance reveals the full scope of what was launched through the WSL bridge, including additional distribution binaries or Windows tools invoked from inside the Linux environment.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did the WSL parent actually invoke? Decode its command line and arguments.
  context: The wsl.exe or wslhost.exe command line shows what was requested of the distribution. Read its arguments for a distribution selector, a run flag, or an inline Linux command passed through to Kali, since wsl.exe can run a single command inside a distro directly from the Windows side. Decode any inline command or referenced script to understand the operation rather than just confirming the distribution was launched.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What exactly did the Kali distribution binary do? Decode its command line and arguments.
  context: 'The full command line of the Kali launcher or distribution binary reveals the specific action taken. Decode any flags, an inline command, a referenced script path, or a tool name passed to the distribution. Distinguish setup-style invocations from operational ones: a bare launch that opens an interactive shell looks different from one that runs a named tool or pipes a Linux command, and the latter is where reconnaissance, tunneling, or payload staging would appear.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
        CommandLine|contains:
          - Kali.exe
          - Kali-linux
          - kalilinux
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the WSL or Kali process write or drop files on the Windows filesystem around the time of the alert?
  context: Indirect execution through WSL frequently crosses back to the Windows side to stage tools, drop payloads, or write output. File events authored by the WSL bridge or the distribution binary on the mounted Windows filesystem reveal artifacts that survive the Linux session, such as downloaded binaries, scripts, or exfiltration staging. Review the written paths and any that land in user-writable or temporary directories.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - \wsl.exe
          - \wslhost.exe
          - \kali.exe
          - \KaliLinux
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the WSL or Kali process open outbound network connections around the time of the alert, and to where?
  context: Offensive Linux tooling run under WSL commonly reaches the network for reconnaissance, command-and-control, tunneling, or data transfer, and because the traffic originates from the WSL bridge it can be missed by Windows-process-centric monitoring. Reviewing outbound connections from the WSL or Kali process and their destinations distinguishes a local-only launch from active network operations. Internal targets suggest lateral reconnaissance; external destinations suggest egress or remote access.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains:
          - \wsl.exe
          - \wslhost.exe
          - \kali.exe
          - \KaliLinux
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: What other child processes did the WSL parent binary spawn on this host over the following hours?
  context: An actor using a compromised or operator-driven WSL session often launches multiple tools in sequence through the same bridge. Seeing all children of the WSL parent binary over a longer window reveals follow-on stages such as reconnaissance utilities, additional distribution invocations, or Windows tools proxied out of the Linux environment that did not coincide with the initial alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally see wsl.exe or wslhost.exe spawn the Kali distribution?
  context: Some parent-child pairings are routine on a host that is provisioned for WSL development, while a first-time or rare wsl.exe to Kali spawn is the deviation worth chasing. Historical frequency of this specific parent-to-child pairing on this host distinguishes a sanctioned, recurring workflow from a novel introduction of the distribution.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%ParentImage%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run the Kali distribution binary at all?
  context: A distribution binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a host with no sanctioned WSL or offensive-tooling role raises the priority of the launch.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|contains|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_appdata:
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\packages\KaliLinux
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\WindowsApps\kali.exe
      selection_img_windowsapps:
        Image|contains: :\Program Files\WindowsApps\KaliLinux.
        Image|endswith: \kali.exe
      selection_kali_wsl_parent:
        ParentImage|endswith:
        - \wsl.exe
        - \wslhost.exe
      selection_kali_wsl_child:
      - Image|contains:
        - \kali.exe
        - \KaliLinux
      - CommandLine|contains:
        - Kali.exe
        - Kali-linux
        - kalilinux
      filter_main_install_uninstall:
        CommandLine|contains:
        - ' -i '
        - ' --install '
        - ' --unregister '
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_img_* or all of selection_kali_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_appdata:
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\packages\KaliLinux
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\WindowsApps\kali.exe
      selection_img_windowsapps:
        Image|contains: :\Program Files\WindowsApps\KaliLinux.
        Image|endswith: \kali.exe
      selection_kali_wsl_parent:
        ParentImage|endswith:
        - \wsl.exe
        - \wslhost.exe
      selection_kali_wsl_child:
      - Image|contains:
        - \kali.exe
        - \KaliLinux
      - CommandLine|contains:
        - Kali.exe
        - Kali-linux
        - kalilinux
      filter_main_install_uninstall:
        CommandLine|contains:
        - ' -i '
        - ' --install '
        - ' --unregister '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_img_* or all of selection_kali_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user launched Kali or other tooling on multiple hosts in the same window, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img_appdata:
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\packages\KaliLinux
      - Image|contains|all:
        - :\Users\
        - \AppData\Local\Microsoft\WindowsApps\kali.exe
      selection_img_windowsapps:
        Image|contains: :\Program Files\WindowsApps\KaliLinux.
        Image|endswith: \kali.exe
      selection_kali_wsl_parent:
        ParentImage|endswith:
        - \wsl.exe
        - \wslhost.exe
      selection_kali_wsl_child:
      - Image|contains:
        - \kali.exe
        - \KaliLinux
      - CommandLine|contains:
        - Kali.exe
        - Kali-linux
        - kalilinux
      filter_main_install_uninstall:
        CommandLine|contains:
        - ' -i '
        - ' --install '
        - ' --unregister '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_img_* or all of selection_kali_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging that brackets the WSL launch.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by lateral movement.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
