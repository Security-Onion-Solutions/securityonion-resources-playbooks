name: Suspicious Msiexec Execute Arbitrary DLL
id: 7458115d-7698-423d-a80e-a2c117dbb9be
description: |
  Fires when msiexec.exe runs with a /Y (or windash-equivalent) argument and the command line does not match a known
  legitimate installer path under Program Files, System32, or SysWOW64. The /Y switch invokes DllRegisterServer and /Z
  invokes DllUnregisterServer against an arbitrary DLL; neither is documented by Microsoft, so their presence is a proxy
  for running attacker-supplied code through a Microsoft-signed binary rather than installing a package. Determine which DLL
  was passed, where it lives, what spawned msiexec, and whether any network retrieval or module load followed, since
  legitimate scripted installs occasionally use the same call form.
type: detection
detection_id: 6f4191bb-912b-48a8-9ce7-682769541e6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show msiexec.exe invoked with a /Y switch against a DLL outside the standard installer paths?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires on msiexec.exe with a /Y
    argument (DllRegisterServer) that is not one of the documented installer paths under Program Files, System32, or SysWOW64.
    Note the DLL path the /Y switch points at and whether it sits in a user-writable location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to register or unregister DLLs through msiexec.exe?
  context: Legitimate software installation and patching can drive msiexec.exe, but the /Y DllRegisterServer call form is
    rarely used by routine installers. Knowing whether this user role and host function involve packaging, software
    deployment, or developer activity is often the fastest way to separate a scripted install from proxy execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What DLL did msiexec.exe register, and where does that DLL file live?
  context: The full command line names the DLL passed to /Y (DllRegisterServer) or /Z (DllUnregisterServer). Resolve the
    DLL path and decode any remaining arguments. A DLL under %TEMP%, %APPDATA%, %ProgramData%, %USERPROFILE%, or a UNC share
    indicates the binary was staged rather than shipped by a signed installer.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned msiexec.exe and is that parent chain expected for an installer call?
  context: The parent process reveals how msiexec was invoked. Legitimate installs are usually launched by explorer.exe,
    services.exe, a software-deployment agent, or an installer bootstrapper. Parents like mshta.exe, wscript.exe, cscript.exe,
    a Office application, or a shell launched from a download directory point to proxy execution rather than packaging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the msiexec /Y pattern, what parents and users drove it, and does the current
    alert fit that pattern?
  context: Even signed installer binaries get reused for proxy execution. The query mirrors the rule's selection scoped to
    this host, so the parent and user distribution reflects how this specific firing pattern has run here before. A new parent
    process, an unexpected account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: ' /Y'
      filter_main_legit_path:
        CommandLine|contains:
        - \MsiExec.exe" /Y "C:\Program Files\
        - \MsiExec.exe" /Y "C:\Program Files (x86)\
        - \MsiExec.exe" /Y "C:\Windows\System32\
        - \MsiExec.exe" /Y "C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: What child processes did msiexec.exe spawn after this execution?
  context: The DLL registered through msiexec can trigger further execution. Legitimate installers rarely spawn interactive
    children, so cmd.exe, powershell.exe, rundll32.exe, certutil.exe, or a process running from a temporary directory
    appearing as a child points to post-execution activity worth following.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did msiexec.exe make outbound network connections around the time of this alert?
  context: Proxy execution through msiexec often pairs with pulling a payload from a remote MSI, a UNC share, or an HTTP(S)
    URL before or alongside the DLL call. Outbound connections from msiexec.exe to previously unseen destinations indicate
    payload retrieval rather than a local install. If network telemetry is not collected in this environment, treat zero
    results as a visibility gap rather than evidence nothing was fetched.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \msiexec.exe
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What modules did msiexec.exe load around the time of this alert, and were any loaded from a user-writable path?
  context: The /Y switch drives msiexec to load and call DllRegisterServer on the named DLL. Module loads from %TEMP%,
    %APPDATA%, %ProgramData%, %USERPROFILE%, or a UNC path, or an unsigned module, confirm that attacker-supplied code was
    mapped into the signed process. If module-load telemetry is not collected, fall back to the DLL path recorded on the
    triggering command line.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \msiexec.exe
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: What other tools ran on this host around the same time as the msiexec call?
  context: Proxy execution rarely stands alone. Activity surrounding the msiexec call may reveal reconnaissance, payload
    staging, credential access, or persistence that provides broader context for the investigation. Scan for novel
    parent-child pairs rather than the high-count system noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: ' /Y'
      filter_main_legit_path:
        CommandLine|contains:
        - \MsiExec.exe" /Y "C:\Program Files\
        - \MsiExec.exe" /Y "C:\Program Files (x86)\
        - \MsiExec.exe" /Y "C:\Windows\System32\
        - \MsiExec.exe" /Y "C:\Windows\SysWOW64\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: ' /Y'
      filter_main_legit_path:
        CommandLine|contains:
        - \MsiExec.exe" /Y "C:\Program Files\
        - \MsiExec.exe" /Y "C:\Program Files (x86)\
        - \MsiExec.exe" /Y "C:\Windows\System32\
        - \MsiExec.exe" /Y "C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints.
    If the same user triggered similar activity on several hosts, the scope of the operation may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: ' /Y'
      filter_main_legit_path:
        CommandLine|contains:
        - \MsiExec.exe" /Y "C:\Program Files\
        - \MsiExec.exe" /Y "C:\Program Files (x86)\
        - \MsiExec.exe" /Y "C:\Windows\System32\
        - \MsiExec.exe" /Y "C:\Windows\SysWOW64\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who use one signed binary to proxy code often use several. If msiexec.exe was used to run a DLL, check
    whether rundll32, regsvr32, mshta, installutil, or similar binaries were also used to execute arbitrary code. Multiple
    proxy-execution LOLBins performing the same objective strengthens the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was msiexec.exe executed from its expected System32 or SysWOW64 path?
  context: msiexec.exe executed from a path outside System32 or SysWOW64 may indicate the binary was copied or renamed to
    evade path-based allowlists. Compare the Image path and OriginalFileName against the expected installer location; a
    msiexec running from a user directory is more suspicious than one in System32.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the msiexec /Y pattern over the past 90 days, and what command-line structures are
    typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used daily under stable parents. The
    query mirrors the rule's selection scoped to this host, so the count reflects this specific firing pattern rather than
    generic msiexec usage. The command-line projection lets the analyst compare typical invocation patterns against the
    alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \msiexec.exe
        CommandLine|contains|windash: ' /Y'
      filter_main_legit_path:
        CommandLine|contains:
        - \MsiExec.exe" /Y "C:\Program Files\
        - \MsiExec.exe" /Y "C:\Program Files (x86)\
        - \MsiExec.exe" /Y "C:\Windows\System32\
        - \MsiExec.exe" /Y "C:\Windows\SysWOW64\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
