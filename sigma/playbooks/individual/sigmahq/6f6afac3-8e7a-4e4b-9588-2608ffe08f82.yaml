name: Potential CSharp Streamer RAT Loading .NET Executable Image
id: 431aca9e-7c84-4b28-9017-939b85551aef
description: |
  Detects a .NET executable image being loaded from a file whose path matches
  %AppData%\Local\Temp\dat####.tmp, the default staging path and randomized filename CSharp
  Streamer uses when it loads its .NET payload. CSharp Streamer is an open-source-based C#
  remote access tool delivered by an obfuscated PowerShell stager that performs an AMSI bypass,
  fetches a disguised payload, and loads the decoded .NET assembly; it beacons to external
  command-and-control over a rotating set of ports and supports credential theft, SOCKS proxying,
  screenshotting, and remote shell execution. A .NET image loading from a user-writable temp path
  is rarely legitimate, so the investigation should confirm the module and its signature, identify
  the loading process and its parent chain, determine whether the process established outbound
  connections or installed persistence, and check whether the payload file remains on disk.
type: detection
detection_id: 6f6afac3-8e7a-4e4b-9588-2608ffe08f82
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match the rule's pattern, a .NET image loaded from a dat####.tmp file under AppData\Local\Temp?
  context: >-
    Confirm the alert is a true positive by reviewing the exact loaded-module path (ImageLoaded) on
    the triggering event. The rule fires when a module whose path ends in AppData\Local\Temp\dat####.tmp
    (a four-character alphanumeric name) is loaded. This staging path and randomized filename is the
    default CSharp Streamer uses for its .NET payload; a genuine application almost never loads an
    executable image from a randomly named temp file, so the path match itself is the primary triage
    signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to load a .NET image from a user temp directory?
  context: >-
    Legitimate administrative or developer activity can occasionally stage code in temp, but a .NET
    executable image loaded from a randomly named dat####.tmp file is not a normal pattern for any
    sanctioned software. Knowing whether the account and host function are consistent with any expected
    build, test, or deployment workflow is often the fastest way to separate a benign edge case from a
    live RAT load. User attribution is present on roughly 94% of endpoint events; when it resolves to a
    machine account or SYSTEM, pivot on the loading process instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process pull in, and are any .NET assemblies loaded from user-writable temp paths?
  context: >-
    The full set of modules a process loads tells the story when the loading binary alone is opaque.
    CSharp Streamer's stager loads its decoded assembly reflectively, so look for .NET runtime modules
    (clr.dll, mscoree.dll, mscorlib) alongside the dat####.tmp image, and for any additional DLLs or
    assemblies pulled from %TEMP%, AppData, ProgramData, or Public. A managed image loaded from a temp
    path by a process that would not normally host .NET is the reflective-load pattern this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signing status, hash, and reputation of the module loaded from the temp path?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a side-loaded payload. The DLL load
    event carries the module's signing status and hash directly, so no execution pivot is needed. An
    unsigned image loaded from a temp path, or one whose SignatureStatus is Unsigned, Expired, or Invalid,
    is a strong indicator of a staged payload. Compare the module hash against threat intelligence; known
    CSharp Streamer sample SHA256 values include 056cf0d4afdf17648e83739e3e96b53fa802bd0750fe6e74cdbe2fcea2b03c7e
    and 6a082dd209ec019de653f71e0ee22e6613ce5e9010b8fa089b02f79a1a90652a.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process loaded this image, and what launched that process?
  context: >-
    The image_load event names the loading process but not how it was invoked, so pivot by ProcessGuid
    to the process's own creation record to read its Image, full command line, and parent. CSharp Streamer
    is loaded by an obfuscated PowerShell stager, so a powershell.exe or other script-host loading a .NET
    image from temp, especially one launched from an Office application, a browser, wscript.exe, mshta.exe,
    or an unsigned binary, points to a staged execution rather than a legitimate developer action. The
    parent chain distinguishes a scripted delivery from an interactive console session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was a service or scheduled task created on this host around the alert to relaunch the payload?
  context: >-
    CSharp Streamer can install itself as a Windows service via a --service argument to relaunch after
    reboot, and observed intrusions have used a scheduled task or service to start it (sometimes deleted
    shortly afterward to remove the trace). Clustering service- and task-control tooling in a window around
    the load reveals whether the elevation was used to establish a foothold. A schtasks.exe or sc.exe
    invocation, or the loaded payload subsequently running under services.exe, indicates persistence was
    installed rather than the load being an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\sc.exe'
          - '\at.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What child processes did the loading process spawn afterward?
  context: >-
    The processes spawned by the loading process reveal the RAT's interactive control. CSharp Streamer
    supports remote shell and command execution and can inject into or spawn msiexec.exe as an injection
    target, so watch for cmd.exe, powershell.exe, msiexec.exe, or other post-exploitation children under
    the loading process. Unexpected shell children spawned by a process that loaded a .NET image from temp
    are the operator issuing commands through the established channel.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What external endpoints did the loading process connect to?
  context: >-
    On startup CSharp Streamer establishes a tunneled connection to external command-and-control, trying a
    rotating set of ports in sequence (80, 443, 25, 2525, 110, 993, 3389, 139, 135) and encrypting its
    protocol packets, then optionally scanning the local network for peer relays on ports 6667, 6669, 6670,
    and 6671. Review the destinations the loading process contacted: connections to an unfamiliar external
    host, long-lived sessions, or beaconing across these ports corroborate an active C2 channel. Destination
    hostnames resolve through a separate lookup and are frequently absent, so anchor on the destination IP
    and port.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Is the dat####.tmp payload file still on disk for analysis?
  context: >-
    The loaded .NET image is written to a temp file before it is loaded, so checking whether that file
    still exists enables deeper analysis - hashing, sandbox submission, or content review to confirm it is
    the CSharp Streamer assembly. The query correlates file writes to the loading process and its direct
    children by process lineage. Temp payloads are often deleted shortly after loading, so absence is not
    exonerating; recovery from the process that wrote it may still be possible.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which process wrote the dat-prefixed image to AppData\Local\Temp, and were other files staged there in the same window?
  context: >-
    Before the .NET image can be loaded it must be written to the temp path, and that write names the
    process that staged the payload. Surfacing file writes to dat-prefixed files under AppData\Local\Temp
    identifies the writer (the stager) and any sibling files dropped in the same session. If the writing
    process differs from the loading process, the parent chain of the writer is the next lead; a stager
    that both writes and loads the image confirms the reflective-load workflow.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\AppData\Local\Temp\dat'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: When this host has previously loaded an image matching this pattern, what programs and users drove it, and does the current alert fit?
  context: >-
    Even where a temp .NET load has been seen before, the program and user distribution reveals
    whether it is a recurring benign workflow or an anomaly. The query mirrors the rule's exact
    match structure scoped to this host, so the resulting program/user distribution reflects how
    this specific firing pattern has historically run here. A new acting program process, an
    unexpected account, or a first-ever occurrence is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|re: \\AppData\\Local\\Temp\\dat[0-9A-Z]{4}\.tmp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts loaded an image matching this pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's exact match structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic temp usage. Many hosts loading a dat####.tmp image in
    the same window points to scripted deployment across the environment; one host or a small unrelated set
    points to targeted operator activity. Use the host distribution and parent consistency to calibrate the
    scope and severity of the incident.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|re: \\AppData\\Local\\Temp\\dat[0-9A-Z]{4}\.tmp
      condition: selection
    fields:
    - host.name
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A RAT load rarely happens in isolation. Aggregating process activity in a tight window around the alert
    surfaces what led up to the load and what ran immediately after it. Novel parent-child pairs stand out
    at low counts against high-count routine telemetry, which is what points to the stager that delivered
    the payload and any reconnaissance, credential access, or persistence taken once the channel was live.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - AMSI or defense tampering, scripting-tool execution, or ingress
    tool transfer - may reveal the stages that preceded this load and help reconstruct the timeline. CSharp
    Streamer arrives through a PowerShell stager that disables AMSI and downloads its payload, so prior
    alerts for those behaviors place this load within a larger delivery sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is any remote access or remote-control tooling approved to run on this host?
  context: >-
    Organizations typically sanction a specific remote support tool and no others. CSharp Streamer is a
    remote access tool with no legitimate deployment path - it is loaded reflectively from a temp file, not
    installed - so confirming that no approved remote-control software could account for a .NET image loaded
    from temp closes off the benign explanation quickly. Any remote access capability not on the approved
    list, regardless of reputation, should be treated as attacker-deployed until shown otherwise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a support ticket or maintenance window that explains remote access activity on this host now?
  context: >-
    Legitimate remote support correlates with an active ticket, a scheduled maintenance window, or a user
    request. No sanctioned remote-support session manifests as a .NET image loaded from a randomly named
    temp file, so the absence of any support context for activity on this host at this time strengthens the
    case that the load is attacker-controlled rather than an operator using approved tooling.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
