name: HackTool - CrackMapExec PowerShell Obfuscation
id: 9a6d15d0-121d-483f-81d4-3edda574034b
description: |
  Detects PowerShell (powershell.exe or pwsh.exe, identified by Image or OriginalFileName) invoked with command-line
  fragments matching a known offensive-framework obfuscation routine that builds strings from indexed environment and
  automatic variables (for example join/split chains, $ShellId and $PSHome character indexing, and $env:ComSpec slicing).
  The rule fires only when both halves match together, a PowerShell interpreter AND one of the obfuscation static strings,
  so neither condition alone triggers it. This string-building obfuscation hides the real payload from casual inspection
  and from naive command-line signatures, and is characteristic of tooling that wraps lateral-movement and post-exploitation
  PowerShell. Legitimate activity rarely produces these exact concatenation patterns, so the investigation should reconstruct
  what the obfuscated command actually does, confirm whether the user and host are part of an authorized assessment, and
  determine whether follow-on execution or defense tampering accompanied it.
type: detection
detection_id: 6f8b3439-a203-45dc-a88b-abf57ea15ccf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with PowerShell running one of the framework obfuscation string-building fragments?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both conditions hold together, a PowerShell interpreter (powershell.exe or pwsh.exe by Image or OriginalFileName) AND a command line containing one of the obfuscation fragments such as a join/split chain, $ShellId or $PSHome character indexing, $env:Public indexing, or $env:ComSpec slicing. Confirm both halves are present in the actual event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run PowerShell that builds commands from indexed environment and automatic variables?
  context: Legitimate administrative and automation scripts occasionally use string manipulation, but the specific pattern of indexing $ShellId, $PSHome, $env:Public, and $env:ComSpec to reassemble characters is an obfuscation technique rather than ordinary scripting. Knowing whether the user role and host function involve PowerShell development or red-team tooling is often the fastest path to distinguishing an authorized assessment from a live intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this PowerShell obfuscation part of an authorized penetration test or red team engagement?
  context: The obfuscation routine this rule matches is emitted by an offensive pentesting framework used in authorized security assessments. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Reconstruct the obfuscated PowerShell command. What does the string-building routine resolve to, and what operation does the deobfuscated command perform?
  context: The full command line is the operator's payload hidden behind character indexing and concatenation. Resolve the $ShellId, $PSHome, $env:Public, and $env:ComSpec index expressions and the join/split chains to recover the literal string they assemble, then read the resulting command. The deobfuscated content reveals the actual intent, whether a download cradle, an in-memory loader, credential access, or lateral-movement staging. The query scopes to PowerShell executions on this host that carry these obfuscation fragments, so multi-stage invocations that together form one logical operation appear alongside the triggering event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'join*split'
          - '( $ShellId[1]+$ShellId[13]'
          - '( $PSHome['
          - '( $env:Public[13]+$env:Public[5]'
          - '( $env:ComSpec[4,'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Beyond the obfuscation fragments the rule matched, does the command carry encoded or further-obfuscated content, and what does the fully resolved payload do?
  context: Attackers frequently layer obfuscation, so the indexed-variable string building this rule matched may itself reassemble an -EncodedCommand value, a base64 blob, or a download cradle. Resolve every layer until the script is human-readable, then identify the operation, a download cradle (IEX over Invoke-WebRequest or Net.WebClient), an in-memory .NET assembly load via [Reflection.Assembly]::Load, a reverse shell, or credential theft. Note any embedded URLs, IP addresses, file paths, or child binary names the decoded content references.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the deobfuscated script content?
  context: Script block logging records the deobfuscated script content that PowerShell actually executes, even when the command line is built from indexed variables or otherwise obfuscated. This provides ground truth about what ran, bypassing the string-building obfuscation entirely. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran, and fall back to manual reconstruction of the obfuscated command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before this execution?
  context: Operators frequently disable or bypass PowerShell security controls before running an obfuscated payload. Common precursors include AMSI bypass (patching amsi.dll in memory), execution-policy changes (Set-ExecutionPolicy or the -ep bypass flag), constrained-language-mode escapes, and PowerShell v2 downgrade attacks that evade script block logging. Finding these precursor events on this host strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Are file artifacts characteristic of this offensive framework present on the host?
  context: The framework that emits this obfuscation routine leaves characteristic artifacts on hosts it operates from or against, including a local results database and per-run log files written under the operator profile, plus staged scripts and output files in temporary directories. Checking for these artifacts confirms tool execution and reveals the scope of activity even if the PowerShell process has already exited. File creation events from the PowerShell process narrow the search to artifacts this execution wrote.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did this PowerShell process load .NET or automation assemblies consistent with in-memory or indirect execution?
  context: PowerShell abuse is not limited to direct powershell.exe command lines; the same capability can be driven through .NET automation by loading the System.Management.Automation assembly into another host process. Image-load events on the alerting host around the alert time reveal whether the obfuscated execution loaded the automation runtime or other rarely-seen assemblies, which points to an in-memory or .NET-hosted cradle rather than a simple script invocation. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_module:
        ImageLoaded|contains:
          - 'System.Management.Automation'
          - 'amsi.dll'
          - 'clr.dll'
          - 'System.Reflection'
      condition: selection and selection_module
    fields:
      - Image
      - ImageLoaded
      - Signed
- question: Did host antivirus or endpoint protection raise its own detection for this activity on this host around the alert time?
  context: Indicator-removal tradecraft often shows up as an antivirus or endpoint-protection detection that fires just before or alongside a modified, re-run payload. Correlating native AV application events on this host within the alert window surfaces whether protection already flagged the same tooling, and whether the operator then dropped or re-ran a modified variant to evade it. A vendor detection paired with continued execution is a stronger signal than the obfuscation match alone.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Channel: Application
      condition: selection
    fields:
      - Provider_Name
      - EventID
      - Message
- question: What process spawned this PowerShell instance, and is that parent chain expected?
  context: The parent process reveals how PowerShell was invoked. User-driven administration typically descends from explorer.exe or a shell; service automation from services.exe. Parents like winword.exe, mshta.exe, wscript.exe, an archive tool, or a remote-execution service host indicate macro-driven, staged, or lateral-movement execution rather than interactive use. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even common interpreters can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific obfuscation firing pattern has historically run here, not generic PowerShell usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - join*split
        - ( $ShellId[1]+$ShellId[13]+'x')
        - ( $PSHome[*]+$PSHOME[*]+
        - ( $env:Public[13]+$env:Public[5]+'x')
        - ( $env:ComSpec[4,*,25]-Join'')
        - '[1,3]+''x''-Join'''')'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this obfuscation firing pattern, not generic PowerShell usage. Many hosts firing the same pattern points to scripted deployment or sanctioned security tooling; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - join*split
        - ( $ShellId[1]+$ShellId[13]+'x')
        - ( $PSHome[*]+$PSHOME[*]+
        - ( $env:Public[13]+$env:Public[5]+'x')
        - ( $env:ComSpec[4,*,25]-Join'')
        - '[1,3]+''x''-Join'''')'
      condition: all of selection_*
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - join*split
        - ( $ShellId[1]+$ShellId[13]+'x')
        - ( $PSHome[*]+$PSHOME[*]+
        - ( $env:Public[13]+$env:Public[5]+'x')
        - ( $env:ComSpec[4,*,25]-Join'')
        - '[1,3]+''x''-Join'''')'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - join*split
        - ( $ShellId[1]+$ShellId[13]+'x')
        - ( $PSHome[*]+$PSHOME[*]+
        - ( $env:Public[13]+$env:Public[5]+'x')
        - ( $env:ComSpec[4,*,25]-Join'')
        - '[1,3]+''x''-Join'''')'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts in the same window, the scope of the operation may be larger than a single endpoint. The same-window view is the temporal-correlation pivot, tying this execution to surrounding activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      selection_cli:
        CommandLine|contains:
        - join*split
        - ( $ShellId[1]+$ShellId[13]+'x')
        - ( $PSHome[*]+$PSHOME[*]+
        - ( $env:Public[13]+$env:Public[5]+'x')
        - ( $env:ComSpec[4,*,25]-Join'')
        - '[1,3]+''x''-Join'''')'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this execution and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by lateral movement.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
