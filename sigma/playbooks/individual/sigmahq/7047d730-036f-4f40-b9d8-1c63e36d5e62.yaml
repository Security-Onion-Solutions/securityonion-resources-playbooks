name: Potential Binary Or Script Dropper Via PowerShell
id: 6c4a85e2-31da-4f25-ab62-ee76699a9575
description: |
  Detects one of PowerShell's engines (powershell.exe, powershell_ise.exe, or pwsh.exe) creating a
  file on disk with an executable or script extension (.bat, .chm, .cmd, .com, .dll, .exe, .hta, .jar,
  .js, .ocx, .scr, .sys, .vbe, .vbs, .wsf). The rule fires only when the write lands outside a set of
  known-benign locations — user and Windows temp paths for .dll/.exe, the WindowsPowerShell Modules
  path, and the NuGet provider assembly — so the surviving events are PowerShell dropping a program or
  script to an unexpected location. Legitimately this occurs during software installation, packaging,
  and administrative scripting; maliciously it is the staging step of a delivery chain where an
  obfuscated script decodes an embedded payload and writes it to disk for later execution. Investigate
  what the PowerShell command actually did, the content and hash of the dropped file, whether it went
  on to execute, what launched the PowerShell process, and whether the same pattern is isolated to this
  host or appears across the environment.
type: detection
detection_id: 7047d730-036f-4f40-b9d8-1c63e36d5e62
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Did a PowerShell engine create the alerting file, and is its extension one of the executable or script types the rule flags?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    powershell.exe, powershell_ise.exe, or pwsh.exe writes a file whose name ends in an executable or
    script extension (.bat, .chm, .cmd, .com, .dll, .exe, .hta, .jar, .js, .ocx, .scr, .sys, .vbe,
    .vbs, .wsf) AND the path is not one of the excluded benign locations — a user or Windows temp path
    for .dll/.exe, the WindowsPowerShell Modules path, or the NuGet provider assembly. Review the exact
    TargetFilename and the writing process on the triggering event to confirm both conditions hold.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to have PowerShell write executable or script files to this location?
  context: >-
    Legitimate packaging, software installation, and administrative scripting can all have PowerShell
    drop programs or scripts to disk. Knowing whether the account and host function are consistent with
    that activity is often the fastest way to separate routine automation from a live delivery chain.
    User attribution is present on roughly 94% of endpoint file events; when it is a machine account or
    missing, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the dropped file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The dropped file's post-alert lifecycle drives both urgency and next steps. A payload still on disk
    can be retrieved, hashed, and analyzed; a file deleted seconds after it was written suggests a
    self-deleting dropper or anti-forensic cleanup and shifts the investigation toward what executed in
    between. Read the operation type on each event for this path to see whether a creation was followed
    by a deletion or rename.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the PowerShell command that wrote this file encoded or obfuscated, and what does it decode to?
  context: >-
    The file event carries no command line, so pivot by ProcessGuid to the PowerShell process that
    performed the write and read its full command. Attackers frequently use -EncodedCommand (-enc),
    string concatenation, backtick escaping, or variable substitution to hide the write. Decode any
    base64 payload and look at how the file was produced — an inline byte-array write, a download cradle
    such as Net.WebClient.DownloadFile or Invoke-WebRequest saving to disk, or a decode-and-write of an
    embedded blob points to a delivery chain rather than a benign packaging step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full script that wrote this file?
  context: >-
    Script block logging (Event ID 4104) records the deobfuscated script content PowerShell actually
    executed, even when the command line is encoded or obfuscated, giving ground truth about how the
    file was produced and what else the script did. If PowerShell operational logs are not ingested in
    this environment, treat zero results as a visibility gap rather than evidence that nothing ran.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What is the content of the dropped file? Check for obfuscation, encoded strings, and known malware indicators.
  context: >-
    Read and analyze the file that was written. For scripts and text files, check for base64 encoding,
    obfuscated strings, embedded URLs or IP addresses, and known malicious string patterns. For
    binaries, check imports, embedded strings, packer signatures, and signing status. Content retrieval
    is done from the endpoint or an EDR console; this query confirms the on-disk path and the writing
    process. This is distinct from a hash or reputation lookup — it answers what is IN the file, not
    whether the file is already known.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash and does it have known AV or threat-intel detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written — file-creation events carry no hash.
    This query looks for the dropped file executing by its name and reads the hash from that execution
    event; submit that hash to a reputation or threat-intel source to determine whether it is known
    malicious, benign, or previously unseen. If the file is present but has not executed, retrieve it
    from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: What launched the PowerShell process that wrote this file?
  context: >-
    The parent process reveals how PowerShell was invoked. A powershell.exe, powershell_ise.exe, or
    pwsh.exe launched from explorer.exe or a management agent is consistent with interactive or
    administrative use, while an Office application, a browser, or a script host such as wscript.exe or
    mshta.exe as the parent points to the write being staged by a document or downloaded script rather
    than a deliberate operator action. Pivot by ProcessGuid to the PowerShell process's own record to
    read its parent lineage.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - ParentCommandLine
- question: What child processes did this PowerShell process spawn after writing the file?
  context: >-
    A dropper commonly executes what it just wrote. Listing the child processes of the same PowerShell
    instance reveals whether the dropped binary or script was launched, or whether other tools (cmd.exe,
    another interpreter, a signed LOLBin) were spawned as later stages. Children scoped to this exact
    process avoid the volume that a name-based powershell.exe parent lookup would return.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did this PowerShell process write or delete around the alert?
  context: >-
    A process that drops one executable often drops several — a dropper unpacking components, staging a
    loader alongside its payload, or writing a persistence artifact next to the flagged file. The
    breadth, paths, and extensions of this process's other file activity distinguish a single artifact
    from a staging operation and enumerate what else needs review. The correlation covers both the
    writer and any direct child process it delegated the writes to.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host around the alert?
  context: >-
    This rule fires under a persistence tactic, and dropping a program or script into a Startup folder
    or a path referenced by a registry Run key achieves persistence without ever invoking schtasks, sc,
    or reg. File writes to these locations near the alert — whether by the same PowerShell process or a
    payload it launched — indicate the dropped code established a foothold that survives reboot.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall running a script that wrote executable or script files here?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to resolving the
    alert. If an administrator or a packaging or deployment job legitimately produced the file, that
    closes it; if no one recalls the activity, the account may be compromised or the write was made by
    automated tooling, and the investigation should continue into the PowerShell command and any
    execution of the dropped file. For a service or machine account, ask the team that owns the
    responsible process rather than an end user.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously produced this drop pattern, what programs and users drove it, and does the current alert fit that history?
  context: >-
    Even common tools can be abused. The query mirrors the rule's selection and its benign-
    location filters scoped to this host, so the resulting program and user distribution
    reflects how this specific firing pattern — PowerShell dropping an executable or script
    outside the excluded paths — has historically run here, not generic PowerShell usage. A new
    acting program process, an unexpected account, or a first-time appearance of the pattern is
    the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .jar
        - .js
        - .ocx
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .wsf
      filter_main_user_temp:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_other_temp:
        TargetFilename|startswith:
        - C:\Windows\Temp\
        - C:\Windows\SystemTemp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_powershell_module:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \WindowsPowerShell\Modules\
        TargetFilename|endswith: .dll
      filter_main_nuget:
        TargetFilename|startswith: C:\Program Files\PackageManagement\ProviderAssemblies\nuget\
        TargetFilename|endswith: \Microsoft.PackageManagement.NuGetProvider.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: Has this file been seen before on this host or in the environment?
  context: >-
    A file that has never appeared on a host is more suspicious than one that is part of normal
    operations. First-time appearance of an executable or script should be checked even when the
    filename looks benign, since droppers frequently mimic legitimate names. Zero or very low historical
    counts for this path indicate a new or unusual artifact.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- always_include: true
  question: Has this user previously produced the rule's drop pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection and benign-location filters scoped to this user, so the
    result is the user's 90-day history of this specific pattern — PowerShell dropping an executable or
    script outside the excluded paths — aggregated by host. A user who has never produced this pattern
    is more suspicious than one who does so regularly; weigh the count against the user's role and
    typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .jar
        - .js
        - .ocx
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .wsf
      filter_main_user_temp:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_other_temp:
        TargetFilename|startswith:
        - C:\Windows\Temp\
        - C:\Windows\SystemTemp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_powershell_module:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \WindowsPowerShell\Modules\
        TargetFilename|endswith: .dll
      filter_main_nuget:
        TargetFilename|startswith: C:\Program Files\PackageManagement\ProviderAssemblies\nuget\
        TargetFilename|endswith: \Microsoft.PackageManagement.NuGetProvider.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's drop pattern on this host or across the environment, or is the program new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the
    meaningful pivot is the launch mechanism. The query mirrors the rule's selection and benign-location
    filters scoped to the alerting program, so the result is the 90-day history of this program
    driving this specific drop pattern. A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for thousands of prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith:
        - \powershell.exe
        - \powershell_ise.exe
        - \pwsh.exe
        TargetFilename|endswith:
        - .bat
        - .chm
        - .cmd
        - .com
        - .dll
        - .exe
        - .hta
        - .jar
        - .js
        - .ocx
        - .scr
        - .sys
        - .vbe
        - .vbs
        - .wsf
      filter_main_user_temp:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \AppData\Local\Temp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_other_temp:
        TargetFilename|startswith:
        - C:\Windows\Temp\
        - C:\Windows\SystemTemp\
        TargetFilename|endswith:
        - .dll
        - .exe
      filter_main_powershell_module:
        TargetFilename|startswith: C:\Users\
        TargetFilename|contains: \WindowsPowerShell\Modules\
        TargetFilename|endswith: .dll
      filter_main_nuget:
        TargetFilename|startswith: C:\Program Files\PackageManagement\ProviderAssemblies\nuget\
        TargetFilename|endswith: \Microsoft.PackageManagement.NuGetProvider.dll
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or parallel activity on
    multiple endpoints. If the same user drove similar writes or tool execution on other hosts in the
    same window, the scope of the activity is larger than this one alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven drop pattern fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise, since every
    host runs the same system-owned agents constantly. The meaningful question is whether the same
    launch mechanism produced this drop pattern elsewhere: the query mirrors the rule's selection scoped
    to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window
    points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
