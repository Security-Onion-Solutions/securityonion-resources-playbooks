name: Cloudflared Tunnel Connections Cleanup
id: 01434bc7-fb25-4c39-a7bb-4b96e4598728
description: |
  Detects execution of the cloudflared tunnel client with the tunnel cleanup flag together with a -config or -connector-id
  argument, which tears down or reconfigures the connectors that bridge an internal host to Cloudflare's edge over an
  outbound-only proxy. Legitimately, administrators and developers run cloudflared to front internal web, SSH, RDP, or
  arbitrary-TCP services; the same outbound-only, no-inbound-pinhole model also makes it an attractive covert remote-access
  and tunneling primitive that evades most egress and inbound firewall controls. Cleanup activity is interesting because it
  often marks an operator restarting, rotating, or removing connectors, so the investigation should establish who ran it,
  whether the tunnel use is authorized, what endpoints the tunnel reaches, and what else happened on the host around it.
type: detection
detection_id: 7050bba1-1aed-454e-8f73-3f46f09ce56a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line contain a cloudflared tunnel cleanup invocation with a -config or -connector-id argument?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line.
    The rule fires when the command line carries both ' tunnel ' and 'cleanup ' and at least one of '-config' or '-connector-id';
    read the full argument string to confirm all required tokens are present in a single invocation rather than spread across
    unrelated text.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to operate cloudflared tunnels?
  context: Legitimate tunnel administration is usually limited to specific developers, IT staff, or service accounts on hosts
    that are sanctioned to front internal services. Knowing whether the user role and host function are consistent with running
    a tunnel client is often the fastest path to distinguishing routine connector maintenance from operator-deployed covert
    access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What does the full cloudflared command line specify - which tunnel, config file, and connector is being cleaned up?
  context: The full command line reveals the specific connectors and tunnel being torn down or reconfigured. Decode the value
    after -connector-id (the connector UUID), the path given to -config (the tunnel configuration file, which names the
    ingress rules and origins), and any tunnel name or UUID. These identify which tunnel and which fronted origins the operator
    is managing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is cloudflared an approved tunneling tool on this host, and what business purpose does it serve?
  context: Organizations typically sanction a specific set of remote access and tunneling tools for IT or development use.
    Cloudflared not appearing on that list - even though it is a Cloudflare-signed, entirely legitimate binary - may represent
    shadow IT or operator-deployed persistence. Because the binary can be renamed and still retain its signature, authorization
    should be judged on documented business need, not on the binary name or signer alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there an approved change, ticket, or development use case explaining this tunnel cleanup?
  context: Legitimate tunnel maintenance usually correlates with an active change request, a scheduled maintenance window,
    or a documented development or testing use case. If no such context exists for this connector cleanup, the tunnel may have
    been stood up by an attacker for persistent outbound-only access or by a user circumventing egress controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What outbound endpoints and ports did this host's tunnel client connect to around the alert?
  context: Cloudflared dials out from the origin to Cloudflare's edge, then bidirectional traffic flows over that persistent
    connection. The default transport is QUIC on port 7844 to Cloudflare address space, alongside HTTPS on 443; tunnel-discovery
    DNS uses argotunnel.com patterns. Connections to Cloudflare infrastructure are expected for legitimate tunnels, while the
    destinations and ports reveal what is actually being fronted and whether the egress path matches sanctioned use.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What process spawned this tunnel client and is that parent chain expected?
  context: The parent process reveals how the tunnel client was invoked. Predictable parents such as services.exe (a tunnel
    run as a Windows service), explorer.exe, or an administrative shell fit routine operation, while parents like script hosts,
    Office applications, or unfamiliar launchers point toward scripted deployment or operator hands-on-keyboard staging of
    the tunnel.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host previously fired the tunnel cleanup pattern, what parents and users drove it, and does the current
    alert fit that pattern?
  context: Even sanctioned tunnel tools can be abused. This query mirrors the rule's selection scoped to this host, so the
    resulting parent and user distribution reflects how this specific cleanup pattern has historically run here - not generic
    binary usage. A new parent process, an unexpected account, or an unfamiliar command structure relative to that history is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
        CommandLine|contains:
        - '-config '
        - '-connector-id '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this tunnel cleanup pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the cleanup pattern rather
    than generic use of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation;
    one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
        CommandLine|contains:
        - '-config '
        - '-connector-id '
      condition: selection
    fields:
    - host.name
- question: What child processes did the tunnel client spawn afterward?
  context: The processes spawned by the tunnel client reveal its actual impact. A connector that simply manages tunnel state
    has few or no children, while spawned interpreters or utilities such as cmd.exe, powershell.exe, or certutil.exe can
    indicate post-exploitation activity layered on top of the tunnel.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other tools ran on this host around the same time?
  context: Tunnel cleanup rarely happens in isolation. Activity surrounding the detected command may reveal reconnaissance,
    credential access, persistence installation, or the original tunnel setup, giving broader context for whether this is
    routine maintenance or one stage of a larger operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
        CommandLine|contains:
        - '-config '
        - '-connector-id '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
        CommandLine|contains:
        - '-config '
        - '-connector-id '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user established or tore down tunnels on several hosts, the scope of the activity may be larger than this single
    alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
        CommandLine|contains:
        - '-config '
        - '-connector-id '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is the binary behind this command line the genuine cloudflared client or a renamed copy, and what is its path and
    signing state?
  context: The rule matches on command-line tokens, not on the binary name, so the executing image may be cloudflared.exe or
    a renamed copy that retains the Cloudflare signature. Review the image path and signer to determine whether the binary
    lives in an expected install location and whether its name has been changed to blend in, which is a common way operators
    stage this tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Does the tunnel configuration referenced here route arbitrary TCP, SSH, RDP, or a private network range rather
    than a single web origin?
  context: Protocol tunneling hides one protocol inside another, and cloudflared can front HTTP, SSH, RDP, and arbitrary TCP,
    or route an entire internal CIDR through the tunnel via its private-network feature. Inspect the connector and config
    referenced in the command line to determine what is being carried; layer-4 origins and private-network routing give a
    remote client a network pivot into internal subnets and are a stronger signal than a single fronted web service.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - ' tunnel '
        - 'cleanup '
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other detections fire on this host in the hours before this alert?
  context: Tunnel cleanup rarely happens in isolation. Earlier detections on the same host - defense tampering, reconnaissance,
    credential access, or the original tunnel setup - may reveal the stages that preceded this event and help reconstruct the
    full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
