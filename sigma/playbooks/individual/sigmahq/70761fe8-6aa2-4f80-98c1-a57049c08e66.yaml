name: Potential SocGholish Second Stage C2 DNS Query
id: 276b0546-4c44-4608-9411-733bb7c303df
description: |
  Detects a DNS query issued by wscript.exe for a domain matching a specific pattern - a short 4-8
  character hexadecimal label followed by at least three further dot-separated labels - that has been
  observed carrying SocGholish second-stage command-and-control traffic. SocGholish begins as a fake
  browser-update lure: malicious JavaScript on a compromised website prompts a download whose archive
  contains a .js file; when the victim runs it, a native script host (wscript.exe) executes the script,
  performs WMI-based system profiling, and beacons to attacker infrastructure over DNS to gate delivery
  of the full payload. Legitimate domains can match the pattern by chance (for example a domain
  controller name), so the investigation should confirm the queried domain and querying process, decode
  what the script host actually ran, trace the parent download chain, determine whether the host went on
  to connect to the resolved address, and look for follow-on recon, dropped payloads, and persistence.
type: detection
detection_id: 70761fe8-6aa2-4f80-98c1-a57049c08e66
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the queried domain match the SocGholish C2 pattern, and did wscript.exe issue the lookup?
  context: >-
    Confirm the alert before investing time. The rule fires only when wscript.exe issues a DNS query for
    a domain whose leftmost label is 4-8 hexadecimal characters followed by at least three more
    dot-separated labels. Review the exact QueryName and the querying process on the triggering event,
    and check whether the lookup resolved. A domain controller or other benign host can match the pattern
    by chance, so read the domain and confirm the querying process is a script host rather than a browser
    or system resolver before treating it as C2.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - Image
      - QueryName
- question: Is this user and host expected to run a script host that executes downloaded scripts and reaches external domains?
  context: >-
    SocGholish relies on a user running a downloaded .js file through wscript.exe. Knowing whether this
    account and host function normally involve script-host execution of downloaded content and outbound
    DNS to unfamiliar domains is often the fastest way to separate a benign automation or admin script
    from a fake-update infection. If the account is a service or machine account rather than the
    interactive user who would have run a downloaded file, weight the alert higher and pivot on the
    writing process.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What domain was queried, is it known-malicious, and did it resolve?
  context: >-
    The alert is a DNS lookup, not a connection - investigate the queried domain itself: registration age,
    algorithmically-generated structure, passive DNS history, and threat intelligence. The pattern the
    rule matches (a short hex label under a multi-label parent) is consistent with the disposable domains
    SocGholish rotates for second-stage C2. A recently registered, generated-looking, or known-C2 domain
    points to attacker infrastructure. Check whether the query resolved and, if so, to which address, so
    the connection pivot can determine whether the host actually communicated.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What script did wscript.exe run, and where was that script loaded from?
  context: >-
    A DNS event carries no command line, so pull the script host's process_creation records on this host
    in a tight window to read the full wscript.exe command. The argument is normally a path to the .js
    file it is executing; a file dropped under a user Downloads, Desktop, or Temp directory is consistent
    with the SocGholish fake-update chain, while a script under an administrative or software-deployment
    path may be benign automation. The path and any inline arguments are the lead for confirming the
    payload on disk.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What launched wscript.exe, and does that parent chain look like a browser-driven download?
  context: >-
    Pivot by ProcessGuid to the script host's own process_creation record to read its parent. SocGholish
    delivery runs a downloaded .js file, so a wscript.exe whose parent traces back to a browser, an
    archive utility, or explorer.exe opening a freshly downloaded file fits the fake-update lure. A script
    host launched by a scheduled task, a management agent, or a signed deployment tool points instead to
    sanctioned automation. The parent command line distinguishes a user double-clicking a downloaded
    script from a programmatic launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What child processes did wscript.exe spawn after the alert?
  context: >-
    The children of the script host reveal what the script actually did. SocGholish second-stage scripts
    profile the system - enumerating domain trusts, username, and computer name, often through WMI - and
    may launch cmd.exe, powershell.exe, or additional script hosts to run follow-on stages. Listing the
    processes parented to this wscript.exe instance shows whether recon or further execution followed the
    C2 lookup, or whether the script exited after beaconing.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: After the domain resolved, did wscript.exe connect out, and to what address?
  context: >-
    A DNS lookup only shows intent to communicate; the connection event shows whether the host acted on
    it. Pull outbound connections made by the script host to see whether it reached the address the C2
    domain resolved to, on which port, and whether the traffic looks like short beaconing or a sustained
    session. A connection from wscript.exe to an external address shortly after the flagged lookup
    corroborates active second-stage C2 rather than a stray or pre-fetched resolution.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What files did wscript.exe write to disk on this host around the alert?
  context: >-
    The SocGholish chain lands a .js file on disk that the script host executes, and the second stage can
    drop further payloads. File writes attributed to wscript.exe near the C2 lookup reveal whether the
    script staged additional executables, scripts, or archives - particularly in user-writable locations
    such as Downloads, Desktop, Temp, or AppData. A dropped binary or script here becomes the next
    execution lead; no writes point to a fileless in-memory follow-on.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wscript.exe'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is scripted execution of downloaded content followed by external DNS an approved activity on this host?
  context: >-
    Some hosts legitimately run wscript.exe or cscript.exe for sanctioned automation, logon scripts, or
    software packaging that reaches external services. Determine whether script-host execution of
    downloaded files with outbound DNS to unfamiliar domains is on the approved-activity list for this
    host's role. Activity that is not covered by any sanctioned automation - especially a user endpoint
    running a script from a browser-download path - should be treated as a fake-update infection until
    proven otherwise, regardless of how ordinary wscript.exe itself is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, deployment, or user action that explains this script reaching an external domain?
  context: >-
    Sanctioned script-host activity that talks to external infrastructure usually correlates with a known
    software deployment, a maintenance window, or a user-initiated task. If a helpdesk record, a packaging
    job, or the user's own account of what they were doing explains the download and execution, the alert
    resolves quickly. If no context exists - the user recalls only clicking a browser update prompt, or no
    one can account for the script - the host is likely running an attacker-delivered second stage, and
    the investigation should continue into the dropped script and any follow-on execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Has this host queried this domain before?
  context: >-
    First-time lookups of a domain are more suspicious than routine resolutions. SocGholish rotates
    disposable second-stage domains, so a domain with no prior query history on this host is consistent
    with newly delivered C2, whereas a long tail of prior lookups from varied processes points to an
    established, likely benign destination. The querying process over time also shows whether a script
    host has ever reached this domain before or whether this is the first time.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: When this host has previously matched this DNS pattern, what processes and users drove it, and does the current alert fit?
  context: >-
    Even a legitimate script host can occasionally match the pattern by chance. This query mirrors the
    rule's own selection scoped to this host, so the resulting process and user distribution reflects how
    the rule's specific firing pattern - not generic wscript.exe usage - has historically appeared here,
    with wscript.exe itself in the Image column. A new user account or a first-ever match is the deviation
    worth chasing; a recurring benign match (for example an internal name that happens to fit the regex)
    reduces urgency. DNS events carry no parent lineage - pivot to the wscript.exe start event for ancestry.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        Image|endswith: \wscript.exe
        QueryName|re: '[a-f0-9]{4,8}\.(?:[a-z0-9\-]+\.){2}[a-z0-9\-]+'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A second-stage C2 lookup rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the script execution - a browser session and a download - and
    what ran immediately after, such as WMI recon, additional script hosts, or follow-on payloads. Novel
    parent-child pairs stand out at low counts against routine telemetry, which is what points to the
    stages of the infection chain surrounding the DNS beacon.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts matched this DNS pattern in the past week, and does the spread look like a wider campaign or an isolated hit?
  context: >-
    This query mirrors the rule's selection with no host scope, giving a fleet-wide count of the same
    firing pattern rather than generic script-host usage. SocGholish is delivered by drive-by compromise
    of legitimate sites, so multiple unrelated hosts matching the same pattern in a short window can
    indicate several users hit the same compromised site or update lure; a single host points to an
    isolated infection. Compare the host distribution and querying processes to gauge scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        Image|endswith: \wscript.exe
        QueryName|re: '[a-f0-9]{4,8}\.(?:[a-z0-9\-]+\.){2}[a-z0-9\-]+'
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - a browser-driven download, script-host execution, or
    reconnaissance activity - may reveal the stages that preceded this C2 lookup and help reconstruct the
    infection timeline. A second-stage beacon implies an earlier delivery and execution step, so prior
    alerts help place this DNS query within the larger fake-update chain rather than treating it as a
    standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
