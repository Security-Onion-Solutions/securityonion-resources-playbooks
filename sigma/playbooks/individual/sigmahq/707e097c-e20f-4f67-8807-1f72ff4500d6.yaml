name: Potential Persistence Via App Paths Default Property
id: d3f5f190-ef71-469a-b398-90c490865394
description: |
  Detects a registry write that sets the (Default) or Path value of a key under
  \SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths to a command or file path that lives in a
  user-writable or temporary location (Public, AppData\Local\Temp, Windows\Temp, Desktop, Downloads,
  %temp%/%tmp%) or that references a scripting or proxy-execution helper (iex, Invoke-, rundll32,
  regsvr32, mshta, cscript, wscript, .bat, .hta, .dll, .ps1). The rule fires only when all three
  conditions match together: the key is under App Paths, the value name is (Default) or Path, and the
  written data contains one of those markers. App Paths entries normally let an installed application
  register the fully qualified path to its executable so the program can be launched by name (for
  example from the Run dialog); legitimate registrations point at Program Files locations. Rewriting
  the (Default) value to a payload in a suspicious location redirects what runs when the associated app
  name is invoked, giving execution and persistence. Investigate what value was written, which process
  wrote it and what launched that process, whether the referenced payload exists on disk and later ran,
  and whether the change persisted or was reverted.
type: detection
detection_id: 707e097c-e20f-4f67-8807-1f72ff4500d6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting write target an App Paths (Default) or Path value AND set it to a suspicious location or helper?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when
    all conditions hold together: the TargetObject is under \SOFTWARE\Microsoft\Windows\CurrentVersion\App
    Paths, the value name is (Default) or Path, and the written Details data contains a user-writable or
    temporary path (Public, AppData\Local\Temp, Windows\Temp, Desktop, Downloads, %temp%/%tmp%) or a
    scripting/proxy-execution helper (iex, Invoke-, rundll32, regsvr32, mshta, cscript, wscript, .bat,
    .hta, .dll, .ps1). Review the exact TargetObject and Details on the triggering event to confirm the
    written value points somewhere other than an installed program location.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register or modify App Paths entries?
  context: >-
    App Paths registrations are normally written by application installers, not by interactive users or ad
    hoc scripts. Knowing whether the writing account and host function match a sanctioned software
    deployment is often the fastest way to separate an installer or packaging job from a hands-on
    persistence setup. User attribution is present on roughly 94% of endpoint registry events; when it is a
    machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which App Paths subkey and value were written, and why is this a persistence location?
  context: >-
    The App Paths subkey is named after an executable (for example \App Paths\calc.exe), and its (Default)
    value holds the fully qualified path that Windows launches when that name is invoked from the Run
    dialog. Because the resolver reads this value ahead of a normal path search, a per-user or system-wide
    entry placed here is inherited and executed whenever the associated name is run. Confirming the exact
    subkey (which application name is being impersonated) and the value name establishes that this is the
    App Paths redirect location and sets up decoding the payload that was written.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What path or command was written to the App Paths value, and what would it launch?
  context: >-
    The Details field holds the target that will run when the associated app name is invoked. Decode it: a
    legitimate entry points at an installed program under Program Files, while an abused entry points at a
    binary or script in a user-writable or temporary location, or at a proxy-execution helper such as
    rundll32, regsvr32, mshta, cscript, wscript, or a PowerShell one-liner (iex / Invoke-). If it
    references a file path, that path becomes the lead for confirming a payload on disk; if it is an inline
    interpreter command, the operation may be fileless. Details is present on roughly 79% of registry
    modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process wrote this App Paths value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to read its
    Image, full command, and parent. An installer or msiexec writing an App Paths entry during a software
    deployment is expected; a reg.exe, powershell.exe, or cmd.exe write launched from an Office
    application, a browser, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to
    the entry being staged programmatically rather than through a normal installation. The parent chain
    distinguishes a packaged install from a scripted hijack.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is the executable or script referenced by the App Paths value actually present on disk?
  context: >-
    The App Paths redirect is only effective if the payload it points to exists at the written path. If the
    value references a binary or script in Public, AppData\Local\Temp, Windows\Temp, Desktop, or Downloads,
    confirming that a file was created at that path determines whether the mechanism is armed and what it
    would execute. Registry and file-write events carry no hash, so if the payload is present, hash it from
    a later execution or retrieve it for a reputation lookup. This query correlates file activity by the
    registry-writing process and its children, since the payload commonly lands in the same session as the
    registry write.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did the redirected binary named in the App Paths value subsequently execute on this host?
  context: >-
    App Paths persistence takes effect when the associated application name is invoked and the redirected
    target runs in place of the expected program. Checking for execution of the binary named in the Details
    value confirms whether the mechanism actually fired and the payload ran, rather than sitting dormant.
    The query matches process starts whose command line carries the written value data; note the
    parent of any hit - a payload launched because the app name was typed will typically be spawned
    from explorer.exe or another shell context. A zero here means the redirect is armed but has not
    yet been invoked, not that the persistence is benign.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: After this write, was the App Paths value changed again or restored to a legitimate path?
  context: >-
    Registry key and value deletions are not observable in this telemetry, so durability is judged from the
    value's re-modification history rather than from a delete event. A later write that restores the value
    to an installed-program path can indicate the redirect was reverted to hide it after the payload ran,
    while the value remaining a suspicious path or command leaves the entry primed to run again the next
    time the associated name is invoked. Compare the Details values written to this key over the following
    window.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Has this App Paths value been modified before on this host?
  context: >-
    An App Paths entry for a given application name normally changes only when that application is installed
    or updated, so a history with no prior writes makes this a first-time change and raises its weight. A
    history of periodic writes that all set an installed-program path points instead to a management or
    update process. Compare the historical Details values to see whether a suspicious path or command was
    set before or whether this redirect is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same App Paths value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a broad software deployment or a mis-scoped management action;
    the same write confined to one host suggests a targeted redirect. Compare the Details values across
    hosts to see whether they all set the same installed-program path (consistent with legitimate software)
    or the same suspicious payload path, and whether the writing process is consistent, which separates a
    single hands-on operation from routine fleet-wide software management.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who plants an App Paths redirect often makes other configuration changes in the same session -
    additional autostart or Run keys, image-hijack keys, or security-policy edits. Clustering the registry
    writes on this host in a short window around the alert reveals the full scope of changes and which
    process made them. The triggering key appears in the results; the signal is what else was modified and
    by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A persistence write rarely happens in isolation. Aggregating process activity in a tight window around
    the alert surfaces what led up to the App Paths write and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tool that staged the redirect and any follow-on actions.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - reconnaissance, execution of scripting tools, or defense
    tampering - may reveal the stages that preceded this change and help reconstruct the timeline.
    Establishing persistence is typically one step in a longer sequence, so prior alerts help place this App
    Paths write within a larger operation rather than treating it as an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After planting an App Paths redirect, they
    commonly install backup mechanisms using different techniques - scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. Executions of schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or
    wmic.exe near the App Paths write indicate persistence stacking rather than an isolated administrative
    action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script into
    a Startup folder or a path referenced by a registry Run key achieves persistence without invoking
    schtasks, sc, or reg. File writes to these locations near the App Paths redirect indicate the actor
    established a parallel persistence mechanism on disk alongside the registry entry.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing or configuring this application entry?
  context: >-
    App Paths entries are normally created by software installers, so direct confirmation from the account
    owner or the responsible team is a fast way to resolve the alert. If an administrator installed or
    packaged an application that legitimately registered this path, that closes it; if no one recalls the
    action and the value points at a user-writable or temporary location, the account may be compromised or
    the change was made by automated tooling, and the investigation should continue into the writing process
    and any payload execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
