name: Console CodePage Lookup Via CHCP
id: b9c7fae1-6c95-4151-9814-c2f3b512a5b0
description: |
  Detects chcp.com spawned by cmd.exe (with an inline command switch such as -c, -r, or -k) where the
  command line ends in a bare chcp invocation. Run without a code-page argument, chcp prints the active
  console code page, which reveals the system's language and locale — a quick host-fingerprinting step.
  Legitimately, installers and applications (for example package managers or chat clients) call chcp to
  set up console encoding, so the same pattern appears in benign automation. The investigation should
  determine what spawned the parent shell, whether the locale lookup sits inside a burst of other
  discovery commands, and whether this user and host normally run this sequence.
type: detection
detection_id: 7090adee-82e2-4269-bd59-80691e7c6338
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did cmd.exe spawn chcp.com with a bare chcp command line and an inline command switch?
  context: Confirm the alert is a true positive by reviewing the exact event against the rule's criteria —
    the parent is cmd.exe with an inline switch (one of -c, -r, or -k), the child Image ends in chcp.com,
    and the child command line ends in chcp with no code-page number. A bare chcp reads the active code
    page rather than setting one, which is the locale-fingerprinting behavior this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is cmd.exe expected to spawn chcp.com here, and what started cmd.exe?
  context: The parent-child relationship is the core signal for this detection. Tracing the parent shell's
    own origin reveals whether the chain is legitimate (a user or script opened a command prompt) or
    suspicious (a macro, loader DLL, or download cradle spawned cmd.exe, which then ran the locale lookup
    as its first discovery step).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same cmd.exe parent spawn?
  context: If a loader or script used this shell to fingerprint the locale, it likely used the same shell
    to run additional discovery or staging. Examining the other children of this exact parent instance
    reveals the full scope of activity orchestrated through it; several discovery binaries from one parent
    points to automated enumeration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What did every chcp.com execution on this host do, and how was the parent command packaged?
  context: Decode the chcp invocations on this host around the alert and read them against the alert's
    parent command line. A bare chcp (no number) reads the active code page and fingerprints the locale; a
    chcp followed by a code-page number sets the console encoding, the common benign use by installers and
    applications. Note which inline switch (-c, -r, or -k) carried the call and whether chcp was chained
    with other commands (for example redirected with >&2 or followed by more recon) — a switch plus a
    multi-command string is more consistent with scripted discovery. Launch frequency and the time window
    that separate automation from one-off use are not directly queryable; judge them from the command structure.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single locale lookup may be benign encoding setup, but several discovery commands in quick
    succession — whoami, ipconfig, systeminfo, net, nltest — is a signature of post-compromise enumeration.
    Locale fingerprinting frequently opens such a burst, used to decide whether to continue based on the
    host's region or language.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Did processes on this host read the system language and locale registry keys around this time?
  context: Beyond running chcp, the same locale-discovery technique can be carried out by reading the
    language registry keys directly (for example HKLM\SYSTEM\CurrentControlSet\Control\Nls\Language and the
    related locale values). Surfacing registry sets against those keys around the alert shows whether the
    locale fingerprint was a one-off command-line lookup or part of broader programmatic enumeration. If
    registry-set events for these keys are not ingested in this environment, treat zero results as a
    visibility gap rather than evidence nothing read them.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains:
          - '\Control\Nls\Language'
          - '\Control\Nls\Locale'
          - '\International\LocaleName'
          - '\International\sLanguage'
      condition: selection
    fields:
      - Image
      - TargetObject
      - User
- question: Is this user expected to run administrative discovery commands?
  context: Administrators and IT staff legitimately query host configuration for troubleshooting, and
    application installers run locale lookups under whatever account launched them. Standard users rarely
    invoke chcp from a shell directly. The user's role and typical behavior determine whether this locale
    lookup is routine or anomalous.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
- question: Does cmd.exe normally spawn chcp.com on this host?
  context: Some parent-child pairings are routine while others are novel. Historical frequency of this
    specific cmd.exe-to-chcp.com pairing on this host distinguishes recurring automation (an installer or
    application that always sets up console encoding) from a first-time spawn worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run chcp.com?
  context: A binary that has rarely or never run on a host is more notable than one that runs regularly.
    Zero or very low historical counts indicate first-time or rare execution of the locale lookup; high
    counts driven by a recurring parent suggest routine application or installer behavior.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains|windash:
        - ' -c '
        - ' -r '
        - ' -k '
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - chcp
        - 'chcp '
        - 'chcp  '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains|windash:
        - ' -c '
        - ' -r '
        - ' -k '
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - chcp
        - 'chcp '
        - 'chcp  '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the same actor triggered similar
    locale or discovery activity on multiple endpoints, which would widen the apparent scope. A single host
    is more consistent with localized benign automation.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \cmd.exe
        ParentCommandLine|contains|windash:
        - ' -c '
        - ' -r '
        - ' -k '
        Image|endswith: \chcp.com
        CommandLine|endswith:
        - chcp
        - 'chcp '
        - 'chcp  '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the locale lookup reveals the
    immediate context: what led to it, what happened after, and whether it sits inside a larger sequence.
    Look for reconnaissance, credential access, or persistence in the surrounding window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Locale fingerprinting often opens a post-compromise sequence. Earlier detections on the same
    host — execution, reconnaissance, or credential access — may reveal the stages that preceded this
    lookup and help reconstruct the timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
