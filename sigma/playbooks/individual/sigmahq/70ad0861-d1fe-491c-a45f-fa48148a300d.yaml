name: File Download via CertOC.EXE
id: 342e5d8f-f4e0-403a-96f4-9aa8c694f421
description: |
  Detects certoc.exe (identified by Image ending in certoc.exe or OriginalFileName CertOC.exe) invoked
  with the -GetCACAPS switch and an http URL on the command line, the documented download function of this
  signed Windows certificate utility. The rule fires only when both halves match together, the certoc.exe
  identity AND a command line containing both -GetCACAPS and http. Using a trusted system binary to fetch a
  remote file is a living-off-the-land transfer that blends with normal traffic, so the investigation should
  recover the full URL and destination, confirm whether the file landed on disk, check whether the host or
  user has any legitimate reason to run this utility this way, and trace what executed afterward.
type: detection
detection_id: 70ad0861-d1fe-491c-a45f-fa48148a300d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the event match what this rule detects, with certoc.exe run using -GetCACAPS and an http URL on the command line?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both conditions hold together, certoc.exe (by Image ending in certoc.exe or OriginalFileName CertOC.exe) AND a command line containing both -GetCACAPS and http. Confirm both halves are present and read the full URL the switch points at.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to download files with command-line certificate utilities?
  context: Legitimate administration rarely uses certoc.exe to fetch remote files; the -GetCACAPS download path is an uncommon use of a certificate-installation tool. Knowing whether the user role and host function involve certificate management or scripted downloads is often the fastest path to distinguishing routine work from a living-off-the-land transfer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line, and what URL does the -GetCACAPS switch download from?
  context: The full command line reveals the transfer target. Read the http URL passed alongside -GetCACAPS, note the host, port, path, and the filename or extension being pulled (scripts, webshells, and text-formatted payloads are the documented abuse). Record the destination so it can be checked against threat intelligence and pivoted on in network and file evidence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - -GetCACAPS
          - http
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did certoc.exe establish an outbound network connection to the URL host, and what external destination did it reach?
  context: The download proceeds by certoc.exe opening an outbound connection to the URL host. Correlate the alerting process with network telemetry to confirm the transfer actually reached the external destination and to capture the resolved IP, port, and whether the endpoint is known infrastructure. If network telemetry is not collected for this host, treat the absence of a connection record as a visibility gap rather than evidence the download failed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: Was the download successful, and is the file still on disk? Check for file creation by certoc.exe at the destination path.
  context: A download command does not guarantee the file was retrieved. Network errors, blocked URLs, or security controls may have prevented the transfer. Confirming file creation at the target path establishes whether the activity progressed past the delivery stage, and whether the file is still present for deeper analysis, hash lookups, or sandbox submission. If no specific destination path is recoverable from the command line, look for file writes by certoc.exe in the same window. File paths here are derived from the command line and the downloading process.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What file did CertOC download, and can you retrieve and analyze its content?
  context: CertOC's documented abuse pulls scripts and web shells — interpreted or served content, not run
    as their own process, so there is no execution hash and file-creation events carry no hash. Retrieve the
    file from the path below, inspect its content, and hash it manually for reputation. If the download was
    instead an executable that ran, its hash is on its process event; a web shell is served by the web
    process, so review the web root and IIS logs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the download target directory?
  context: Operators often download multiple files to the same staging directory, or the downloaded file triggers further writes (extraction, decompression, additional downloads). Examining directory-level file activity reveals the broader scope of the delivery, especially when the drop lands in a user-writable staging path.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What process spawned certoc.exe, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate certificate work usually descends from explorer.exe or a management shell; parents like mshta.exe, wscript.exe, cmd.exe driven by a script, or an Office application point to staged or macro-driven execution rather than an administrator running the utility by hand. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did certoc.exe spawn afterward?
  context: The processes spawned after the transfer reveal its actual impact. A benign certificate operation usually spawns nothing; a delivery commonly leads to the downloaded payload being launched, or to cmd.exe, powershell.exe, or another living-off-the-land binary running follow-on staging. Review the children and their command lines.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run certoc.exe?
  context: A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution of this certificate utility, which on a host with no certificate-management role raises the priority of the transfer.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a signed system tool can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific certoc.exe download pattern has historically run here, not generic certoc.exe usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|all:
        - -GetCACAPS
        - http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|all:
        - -GetCACAPS
        - http
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|all:
        - -GetCACAPS
        - http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|all:
        - -GetCACAPS
        - http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this certoc.exe download pattern, not generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \certoc.exe
      - OriginalFileName: CertOC.exe
      selection_cli:
        CommandLine|contains|all:
        - -GetCACAPS
        - http
      condition: all of selection*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by a download.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
