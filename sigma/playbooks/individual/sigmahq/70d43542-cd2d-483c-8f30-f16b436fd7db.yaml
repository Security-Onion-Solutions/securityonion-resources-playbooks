name: Leviathan Registry Key Activity
id: 63bef4e4-a45d-43ca-b065-6737ab963741
description: |
  Detects creation or modification of a Run key value named ntkd under
  HKCU\Software\Microsoft\Windows\CurrentVersion\Run. A value written to this key establishes
  logon persistence: the referenced binary or command runs each time the user signs in. This
  specific value name is associated with Leviathan (APT40) activity in a Malaysian-focused
  campaign, where a side-loaded backdoor registered ntkd so an in-memory second-stage payload
  would survive reboot. Legitimate software does not use this value name, so the write is almost
  always the persistence step of an intrusion. Investigate the exact value data written, which
  process wrote it and what launched that process, whether the referenced payload landed on disk
  and executed, and whether other persistence or configuration changes were made in the same
  session.
type: detection
detection_id: 70d43542-cd2d-483c-8f30-f16b436fd7db
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the alerting registry write create or modify the ntkd value under the CurrentVersion\Run key?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a registry value whose path contains \Software\Microsoft\Windows\CurrentVersion\Run\ntkd is
    written. Review the exact TargetObject on the triggering event to confirm the ntkd Run value is
    the key that changed. Legitimate software does not register this value name, so a genuine match
    is the persistence step of an intrusion rather than routine autostart configuration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register a logon autostart entry?
  context: >-
    Writing a per-user Run key value is a persistence action that normal user activity almost never
    performs directly. Knowing whether the writing account and host function are consistent with any
    sanctioned software deployment is often the fastest way to separate testing or a managed install
    from adversary persistence. User attribution is present on roughly 94% of endpoint registry
    events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value and data were written to the ntkd key, and why is a CurrentVersion\Run entry a persistence location?
  context: >-
    The key HKCU\Software\Microsoft\Windows\CurrentVersion\Run holds commands that run at every user
    logon, which is one of the most common autostart persistence locations. Confirming the exact
    value name (ntkd) and its data establishes that this is a logon persistence entry rather than an
    unrelated software setting, and identifies the writing process. The value data typically points
    at the binary or command that will execute on the next sign-in.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What binary path or command does the ntkd value point to?
  context: >-
    The Details field holds what will run at logon. Decode it: the value commonly references a
    dropped executable in a user-writable directory (Temp, AppData, Public), a script host with an
    inline or encoded command, or a DLL loaded through a launcher. A path to an executable becomes a
    lead for confirming the payload on disk and checking whether it ran. Details is present on
    roughly 79% of registry modifications and should be populated for this string value.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Which process wrote the ntkd value, and what launched that process?
  context: >-
    The registry event carries no command line, so pivot by ProcessGuid to the writing process to
    read its Image, full command, and parent lineage. A write launched from an Office application, a
    script host such as wscript.exe or mshta.exe, an unsigned binary in a user-writable directory, or
    a side-loaded helper points to the persistence being staged programmatically rather than a
    deliberate administrative change. The parent chain distinguishes a scripted implant from an
    interactive console action.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was the executable or script referenced by the ntkd value created on disk in this session?
  context: >-
    Run key persistence is only effective if the referenced payload exists at the path stored in the
    value. Correlating file activity by the registry-writing process and its children reveals whether
    the payload was dropped in the same session as the registry write, which is the pattern for a
    dropper that stages a binary and then registers it to auto-run. The file-write event carries no
    hash; if the payload is present, hash it from a later execution or retrieve it for a reputation
    lookup.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did a process execute from the path referenced by the ntkd value after it was registered?
  context: >-
    Run key persistence executes its payload at the next logon, and an operator staging it manually
    often runs the binary immediately as well. The query matches process starts whose command line
    carries the path stored in the ntkd value data, confirming whether the persistence is live and
    what the payload does. Execution from a user-writable directory such as Temp, AppData, or
    Public is consistent with the registered value. A zero means the payload has not yet run in
    this window - persistence fires at the next logon, so absence is not an all-clear.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has the ntkd Run value been written before on this host?
  context: >-
    A legitimate autostart entry tends to be created once by an installer and left alone, while a
    value that has never existed before points to a first-time change. A history with no prior writes
    to this value raises its weight; a repeating pattern of writes to the same value would instead
    suggest a management process. Compare the historical Details values to see whether this data is
    new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the ntkd Run value written on other hosts in the environment?
  context: >-
    The same value appearing across several hosts points to a spreading implant or repeated use of
    the same persistence technique, while a single-host write suggests a targeted foothold. Compare
    the Details values and writing processes across hosts to see whether they all register the same
    payload path, which separates a coordinated multi-host operation from an isolated one.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other registry modifications were made on this host in the same window?
  context: >-
    An actor who plants a Run key often makes other registry changes in the same session, such as
    additional autostart entries, defense or firewall policy edits, or service configuration. Clustering
    the registry writes on this host in a short window around the alert reveals the full scope of
    changes and which process made them. The ntkd key appears in the results; the signal is what else
    was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Persistence rarely lands in isolation. Aggregating process activity in a tight window around the
    registry write surfaces what led up to it and what ran immediately after. Novel parent-child pairs
    stand out at low counts against high-count routine telemetry, which is what points to the dropper
    that staged the persistence and to any follow-on execution once it was in place.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Were other process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After registering a Run key, they
    commonly install backups using different techniques - scheduled tasks, services, BITS jobs, or WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than an
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely - dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the ntkd registration indicate
    the payload established a parallel persistence mechanism on disk alongside the Run key.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host - phishing document execution, script host activity, DLL
    side-loading, or ingress tool transfer - may reveal the stages that preceded this registry write
    and help reconstruct the timeline. Logon persistence is typically established after an initial
    foothold, so prior alerts help place the ntkd registration within a larger multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or an administrator recall installing anything that would register this logon entry?
  context: >-
    A per-user Run key value named ntkd has no routine reason to exist, so direct confirmation from
    the account owner is a fast way to resolve the alert. If no one recalls installing software or
    running a tool that would create this autostart entry, the account may be compromised or the write
    was made by automated tooling, and the investigation should continue into the writing process and
    the referenced payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this registry write align with normal work hours or a maintenance window?
  context: >-
    Legitimate software installs and configuration changes usually occur during business hours or a
    scheduled maintenance window. A logon persistence entry written outside those times, or when the
    associated user was not active, is harder to explain as routine activity and raises the weight of
    the alert.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
