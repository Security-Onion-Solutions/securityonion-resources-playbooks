name: VMGuestLib DLL Sideload
id: cf26b6a5-8b57-4e55-8534-98367e916a80
description: |
  Detects the WmiApSrv service host (\Windows\System32\wbem\WmiApSrv.exe) loading an unsigned
  vmGuestLib.dll from the VMware Tools vmStatsProvider\win32 directory. The rule fires when the
  loading process is WmiApSrv.exe AND the loaded module path contains the VMware Tools
  vmStatsProvider\win32 path AND ends in vmGuestLib.dll AND the module is not signed. On a system
  with genuine VMware Tools this DLL is present and validly signed by the vendor; an unsigned module
  of the same name in the same path is the hallmark of DLL search-order / sideload hijacking, where a
  library is planted where a trusted service will load it and run code in that service's context.
  Investigate the module's signature and hash, when and by what process the DLL was written to that
  path, what the service process did after the load, and whether the same unsigned load appears on
  other hosts.
type: detection
detection_id: 70e8e9b4-6a93-4cb7-8cde-da69502e7aff
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Does the loaded module match what this rule detects — the VMware Tools DLL path, an unsigned status, and WmiApSrv.exe as the loading process?
  context: >-
    Confirm the alert is a true positive against the rule's criteria, which require all conditions
    together: the loading process is \Windows\System32\wbem\WmiApSrv.exe, the loaded module path
    contains \VMware\VMware Tools\vmStatsProvider\win32 and ends in \vmGuestLib.dll, and the module is
    not signed. Review the exact ImageLoaded path, its signing status, and the Image on the triggering
    event. DLL load events carry the module's signature status and hash directly, so the unsigned
    status can be confirmed from the alert itself. A genuinely signed vmGuestLib.dll in this path is the
    legitimate VMware Tools file and would not fire.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to run WmiApSrv loading a vmGuestLib module from the VMware Tools directory?
  context: >-
    WmiApSrv is the WMI Performance Adapter service and normally loads a validly signed vmGuestLib.dll
    only on hosts running genuine VMware Tools. Knowing whether this host is a VMware guest with Tools
    installed, and whether the account and host function are consistent with the load, is often the
    fastest way to separate a routine performance-provider load from a planted library. User attribution
    on endpoint module-load events is frequently a machine account or SYSTEM for service-driven loads;
    when it is, pivot on the loading process and the module's signature instead.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this WmiApSrv process instance load, and are any unsigned or from non-canonical directories?
  context: >-
    The full set of modules a trusted service loads tells the story when a single flagged DLL is not the
    whole picture. Enumerate every module this WmiApSrv instance loaded and look for additional unsigned
    modules, DLLs pulled from user-writable or application-staging directories rather than System32, and
    system DLL names loaded from non-system paths. A cluster of unsigned or misplaced modules alongside
    the flagged vmGuestLib.dll widens the search-order hijack beyond the one library the rule matched.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: What is the signature status, hash, and reputation of the vmGuestLib.dll that was loaded?
  context: >-
    Module reputation separates a routine vendor DLL from a planted one. A validly signed VMware
    vmGuestLib.dll is the legitimate file; an unsigned module bearing that filename in the VMware Tools
    path is a masquerade. Pull the module's hash and signing status for a threat-intel lookup and to
    compare against a known-good VMware Tools build. Signature-status values worth noting are Unsigned,
    Expired, Distrusted, and Invalid; a copied-but-invalid signature is a common sideload disguise.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: When and by what process was vmGuestLib.dll written to the VMware Tools vmStatsProvider path?
  context: >-
    DLL sideloading begins with the malicious library being written into the directory a trusted process
    will search. Correlating the file write of vmGuestLib.dll to that path with the module load places
    the drop in time and names the writing process. A write by a VMware Tools installer or updater around
    a documented maintenance window points to a legitimate update; a write by an unrelated process, a
    script host, or an unsigned binary points to a planted library. File hashes are not present on the
    write event, so use the module hash from the load event for reputation and confirm recovery of the
    file from the endpoint for deeper analysis.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Has this vmGuestLib.dll path been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this module path is a stronger anomaly than a recurring one. If the same DLL
    path has been loaded by WmiApSrv.exe repeatedly over the past 90 days, the current load is probably
    the routine performance-provider behavior; if this is the first occurrence, or the path has only
    loaded under different processes historically, the load is anomalous and aligns with a newly planted
    library. Compare the historical loading processes to the current one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: When this host has previously matched the rule's pattern, what programs and users normally drive that load, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting
    program and user distribution reflects how this specific unsigned-vmGuestLib-under-WmiApSrv
    load has historically occurred here rather than generic module activity — expect
    WmiApSrv.exe itself in the Image column. An unexpected account or a first appearance of the
    pattern is the deviation worth chasing; module loads carry no parent lineage (pivot to the
    WmiApSrv.exe start event for ancestry), and user attribution can be sparse — treat thin
    results as a telemetry limit rather than proof of absence.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains|all:
        - \VMware\VMware Tools\vmStatsProvider\win32
        - \vmGuestLib.dll
        Image|endswith: \Windows\System32\wbem\WmiApSrv.exe
      filter:
        Signed: 'true'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not filter) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts matched the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of the unsigned
    vmGuestLib-under-WmiApSrv load rather than generic VMware Tools usage. Many hosts matching the same
    pattern can indicate a mis-deployed or unsigned Tools build rolled out broadly; one host or a small
    unrelated set points to targeted sideload activity. Use the host spread to calibrate whether this is
    an environment-wide software problem or a focused intrusion.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|contains|all:
        - \VMware\VMware Tools\vmStatsProvider\win32
        - \vmGuestLib.dll
        Image|endswith: \Windows\System32\wbem\WmiApSrv.exe
      filter:
        Signed: 'true'
      condition: selection and not filter
    fields:
    - host.name
- question: What child processes did WmiApSrv.exe spawn after the module load?
  context: >-
    Code that executes inside a hijacked service runs with that service's privileges and often spawns
    follow-on processes. WmiApSrv is a short-lived performance-adapter helper that does not normally
    launch command interpreters or scripting hosts, so children such as cmd.exe, powershell.exe,
    rundll32.exe, or any unsigned binary appearing shortly after the load indicate the sideloaded module
    executed and moved on to its next stage. List the processes parented by WmiApSrv.exe on this host in
    the hours after the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were DLL search-order or WmiApSrv service-configuration registry keys modified on this host around the load?
  context: >-
    DLL-hijack analytics correlate module loads with registry changes that influence which library a
    process resolves. Modifications to the WmiApSrv service keys, the KnownDLLs or AppCertDlls lists, or
    Image File Execution Options near the load can redirect a trusted process to an attacker-controlled
    library or otherwise alter its execution flow. Cluster these registry writes on this host in the
    window around the alert and note which process made them and whether they align with a documented
    software change.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Services\WmiApSrv'
          - '\Session Manager\KnownDLLs'
          - '\Session Manager\AppCertDlls'
          - '\Image File Execution Options\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens in isolation. Aggregating process activity in a tight window around the
    load surfaces what led up to the DLL being planted and what ran immediately after it. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what points
    to the tooling that staged the library and to any privileged actions taken once code ran inside the
    service.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, defense tampering,
    or the file write that staged the library — may reveal the stages that preceded this load and help
    reconstruct the timeline. A service sideload is typically a means to persist and run privileged
    follow-on actions, so prior alerts help place this module load within a larger sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or maintenance window covering a VMware Tools installation or update on this host?
  context: >-
    A validly signed vmGuestLib.dll is written and loaded during genuine VMware Tools installs and
    upgrades, so a corresponding change record for Tools deployment or guest maintenance around the alert
    time strongly suggests authorized activity. Absence of any documented software change when the load
    is unsigned raises the likelihood that the library was planted rather than delivered by the vendor
    installer.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this load align with normal maintenance windows or expected service activity?
  context: >-
    The WMI Performance Adapter service starts on demand, so a load that coincides with routine
    performance-counter collection or a documented maintenance window is less suspicious than the same
    load at an unusual hour with no scheduled activity. Compare the load time against this host's normal
    operating hours and any VMware Tools maintenance schedule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the team responsible for this host recall installing or updating VMware Tools or the vmStatsProvider component?
  context: >-
    Direct confirmation from the team that owns the host is often the fastest way to resolve the alert.
    If an administrator or a virtualization-management process installed or updated VMware Tools, that
    explains a legitimate signed load and closes the alert; if no one recalls a Tools change and the
    module is unsigned, the library may have been planted and the investigation should continue into the
    writing process and any privileged follow-on.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Running code inside a trusted service is often used to establish a durable foothold. Scheduled tasks,
    services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe, sc.exe, reg.exe,
    bitsadmin.exe, or wmic.exe near the sideloaded module load indicate the execution was used to install
    persistence rather than being an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without
    invoking schtasks, sc, or reg. File writes to these locations near the sideloaded module load
    indicate the code that ran inside the service established a parallel persistence mechanism on disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
