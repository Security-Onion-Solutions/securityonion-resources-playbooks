name: Potential Waveedit.DLL Sideloading
id: 43652409-30a4-491d-b00a-cc559de3ba47
description: |
  Detects a module load of waveedit.dll (a library shipped with the Nero WaveEditor audio
  editing software) by any process or from any path other than the legitimate Nero WaveEditor
  install location. The rule fires when a DLL whose name ends in \waveedit.dll is loaded AND the
  loading process is not the signed waveedit.exe running from the Program Files Nero WaveEditor
  directory. This is the DLL search-order sideloading pattern: a benign, often signed executable is
  placed alongside an attacker-supplied DLL of a name the executable imports, so the malicious
  library is loaded into a trusted process without a separate execution event. Investigation should
  determine where the DLL was loaded from, what process loaded it, whether that library is signed
  and matches the known Nero file, how it arrived on disk, and whether the same library appears on
  other hosts.
type: detection
detection_id: 71b31e99-9ad0-47d4-aeb5-c0ca3928eeeb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-10
questions:
- question: Was waveedit.dll loaded from a path or by a process outside the legitimate Nero WaveEditor install?
  context: >-
    Confirm the alert is a true positive before investing analysis time. The rule fires when a module
    ending in \waveedit.dll is loaded AND the load did not come from the signed waveedit.exe under the
    Program Files Nero WaveEditor directory. Review the exact ImageLoaded path and the loading Image on
    the triggering event: a load from a user-writable location such as a user profile, Public,
    ProgramData, or a temporary directory, or by a process other than the genuine Nero binary, is the
    sideloading condition. A load from the normal Nero install path by waveedit.exe would have been
    filtered and is not what fired here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Nero WaveEditor or the process that loaded this library?
  context: >-
    Legitimate use of Nero WaveEditor is uncommon on most endpoints, and the sideloading pattern
    relies on a benign executable loading the library from an unexpected place. Knowing whether the
    account and host function have any reason to run this audio software, or the specific loading
    process, is often the fastest way to separate an installed application from an attacker staging a
    trusted binary next to a malicious DLL. User attribution is present on roughly 94% of endpoint
    module-load events; when it is a machine account or SYSTEM, pivot on the loading process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did this process load, and are any from non-canonical, unsigned, or user-writable paths?
  context: >-
    The full set of modules a process loads shows whether waveedit.dll is an isolated anomaly or part of
    a cluster of side-loaded libraries. Look for additional DLLs loaded from the same user-writable
    directory as waveedit.dll, unsigned modules in locations where signed ones are expected, and system
    DLL names resolved from a non-system path, all of which reinforce a search-order hijack. A process
    that loads several unexpected libraries from one staging directory is a stronger sideloading signal
    than a single mislocated file.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: How was the loading process launched — from what directory and with what command line?
  context: >-
    The loading process is frequently a legitimate, signed executable that has been copied next to the
    malicious DLL so the library loads under a trusted name. Reviewing its command line, working
    directory, and on-disk location shows whether it was run from the normal Nero install path or from a
    user-writable staging directory such as a user profile, Public, or a temporary folder. A trusted
    binary executing from an unusual directory alongside waveedit.dll is the hallmark of the sideload
    being staged rather than a normal application run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the signing status, hash, and reputation of the loaded waveedit.dll?
  context: >-
    Module reputation separates the genuine Nero library from a substituted one. The load event carries
    the DLL's signing status and hash directly, so compare them against a known-good Nero WaveEditor
    build: an unsigned, expired, distrusted, or invalidly signed waveedit.dll, or a hash that does not
    match the legitimate file, indicates the library was replaced. A valid signature from the expected
    software vendor points toward a benign but mislocated install, while any signature mismatch is a
    strong substitution indicator worth a threat-intelligence lookup on the hash.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What process spawned the process that loaded this library, and is that parent chain expected?
  context: >-
    The parent of the loading process shows how the trusted binary came to run. A launch from
    explorer.exe or a normal application path fits ordinary use, while a parent such as a script host,
    an Office application, an archive utility, or a scheduled task points to the sideload being driven by
    a delivery chain. Walking the parent chain distinguishes a user opening installed software from an
    automated or scripted invocation that positioned and ran the binary to load the malicious DLL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Is waveedit.dll still on disk, and what process wrote it to that location?
  context: >-
    Whether the library still exists on disk determines if it can be hashed, submitted for analysis, or
    reviewed directly. Correlating file writes to the loading process and its direct children by process
    lineage shows which process created waveedit.dll in the loading directory and when, tying the module
    load back to how the file arrived. If the file was downloaded from the internet, its origin and any
    mark-of-the-web or alternate-data-stream metadata are a manual or endpoint-console follow-up, since
    that stream metadata is not available in this query telemetry.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has waveedit.dll been loaded on this host before, and under what processes?
  context: >-
    A first-time load of this library on the host is a stronger anomaly than a recurring one. If
    waveedit.dll has been loaded repeatedly over the past 90 days by the same genuine Nero process, the
    current load is more likely routine; if this is the first occurrence, or the library has previously
    loaded only under the legitimate install path and now loads elsewhere, the current event is
    anomalous. The loading-process history also shows whether the library has always been tied to the
    real application or is newly associated with an unexpected binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Does this host normally run the process that loaded the library?
  context: >-
    A loading process that has never run on the host, or runs only rarely, is more suspicious than one
    seen regularly. Zero or very low historical counts indicate a first-time or rare execution, which
    fits a trusted binary that was dropped specifically to sideload the DLL. A binary with a long,
    consistent run history is more likely an installed application, though a legitimate name run from a
    new location still warrants comparison against the expected install path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Were registry keys that influence DLL search order or module loading modified on this host around the alert?
  context: >-
    DLL hijacking is not limited to placing a file next to an executable; module resolution can also be
    steered through registry settings such as KnownDLLs, AppInit_DLLs, application-specific DLL
    redirection, and per-application paths. Modifications to these keys near the time of the load may
    show the search order being manipulated to force the trusted process onto the attacker's library, or
    a second, parallel hijack mechanism being staged. The triggering activity is a file-based sideload;
    a registry redirection in the same window would indicate a broader effort to control which modules
    load.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_dll_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Windows\AppInit_DLLs'
          - '\Image File Execution Options\'
          - '\App Paths\'
      condition: selection and selection_dll_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    A sideload rarely happens in isolation, and file creation, the launch of the loading process, and any
    registry changes tend to cluster within a short window. Aggregating process activity around the alert
    collapses routine telemetry into high-count rows while novel parent-child pairs stand out at low
    counts, which is what points to the tool that staged the binary and the DLL, and to any follow-on
    actions taken once the malicious library was running inside the trusted process.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — delivery of an archive or installer, execution of scripting
    tools, or defense tampering — may reveal the stages that preceded the sideload and help reconstruct
    the timeline. Sideloading is typically a means to run code inside a trusted process, so prior alerts
    help place this module load within a larger sequence rather than treating it as a standalone event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is waveedit.dll being loaded on other hosts, and under what processes?
  context: >-
    Cross-host correlation shows the scope of the activity. The same library loaded on a single host
    could be a localized incident, while the same waveedit.dll loading across multiple hosts indicates
    distribution of the same sideloaded package or shared delivery infrastructure. Pay attention to the
    variety of loading processes: the library appearing only under the genuine Nero binary is consistent
    with installed software, while loads under unexpected processes on other hosts point to the same
    technique being reused across the environment.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    Code running inside a trusted process via sideloading is frequently used to establish a foothold.
    Scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions created by schtasks.exe,
    sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the module load indicate the sideloaded payload was
    used to install persistence rather than being an isolated event. Multiple persistence installations in
    the same timeframe point to intentional stacking.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or script
    into a Startup folder or a path referenced by a registry Run key achieves persistence without running
    schtasks, sc, or reg. File writes to these locations near the sideload indicate the payload
    established a parallel persistence mechanism on disk, which is common after a foothold is gained inside
    a trusted process.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or an administrator recall installing or running Nero WaveEditor on this host?
  context: >-
    Direct confirmation from the account owner is often the fastest way to resolve the alert. If the user
    or an administrator installed Nero WaveEditor or deliberately ran the audio software, that provides
    benign context to weigh against the load path and signature findings; if no one recalls the software
    being present, the trusted binary and its DLL were likely placed by tooling, and the investigation
    should continue into how the files arrived and what the loaded library did.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
