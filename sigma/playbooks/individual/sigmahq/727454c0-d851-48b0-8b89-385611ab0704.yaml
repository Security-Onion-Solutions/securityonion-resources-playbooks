name: Lolbin Unregmp2.exe Use As Proxy
id: 1de50764-de4b-4bf1-a2bc-08297c7da71a
description: |
  Detects the signed Windows Media Player setup utility unregmp2.exe (matched by Image or OriginalFileName) invoked
  with the ' /HideWMP' argument. Both the binary identity and the command-line flag must match together for the rule to
  fire. This invocation is the trigger for a known proxy-execution pattern: an operator copies a payload to a controlled
  directory named like a Media Player path, sets the ProgramW6432 environment variable to that directory, then runs
  unregmp2.exe /HideWMP, which spawns wmpnscfg.exe from the hijacked path rather than the system location. The result is
  attacker code running under the lineage of a trusted signed binary. Legitimate Media Player setup occasionally runs this
  utility, so the investigation should confirm the flag and binary identity, decode the surrounding command context,
  identify the child process and the path it launched from, and determine whether the spawned binary is the expected
  system wmpnscfg.exe or a relocated payload.
type: detection
detection_id: 727454c0-d851-48b0-8b89-385611ab0704
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the alerting event match this rule, with unregmp2.exe (by Image or OriginalFileName) run together with the ' /HideWMP' argument?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both halves match together, the binary is unregmp2.exe identified by Image ending in \unregmp2.exe or by OriginalFileName, AND the command line contains ' /HideWMP'. Confirm both are present in the actual event and note the full command line for later decoding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run the Windows Media Player setup utility?
  context: Legitimate Media Player setup and servicing occasionally runs unregmp2.exe, but the /HideWMP proxy pattern is uncommon on general-purpose endpoints and servers. Knowing whether the user role and host function involve Media Player configuration is often the fastest path to distinguishing routine servicing from a proxy-execution attempt.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full unregmp2.exe command line and surrounding context. What path is it running from, and is there evidence of a hijacked ProgramW6432 environment variable?
  context: The /HideWMP invocation causes unregmp2.exe to spawn wmpnscfg.exe from the directory named by the ProgramW6432 environment variable. An operator abusing this copies a payload into a controlled 'Windows Media Player' directory and points ProgramW6432 there before launching. Read the working directory and surrounding command context to see whether the launch path is a system location or a user-writable staging directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|windash: ' /HideWMP'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned unregmp2.exe, and is that parent chain expected?
  context: The parent process reveals how the utility was invoked. Legitimate Media Player servicing usually descends from explorer.exe, a setup host, or services.exe. A parent such as cmd.exe with a /V /C ProgramW6432 assignment, a script host, or an Office application points to scripted proxy execution rather than routine servicing. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did unregmp2.exe spawn, and did wmpnscfg.exe launch from a system path or a user-writable staging directory?
  context: The proxy mechanism completes when unregmp2.exe spawns a child from the path named by ProgramW6432. The expected system child is %SystemRoot%\System32\wmpnscfg.exe or its SysWOW64 counterpart. A child named wmpnscfg.exe launching from a temp, profile, or other user-writable directory is the hijacked payload, and any other spawned child binary is itself the proxied code. Review each child Image, its launch path, and its command line for follow-on staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the alerting host make outbound network connections from the spawned child binary or from unregmp2.exe around the time of the alert?
  context: Proxy execution under a trusted signed binary is often used to retrieve or beacon to externally hosted content while the parent lineage looks benign. Outbound connections from wmpnscfg.exe, from unregmp2.exe, or from a child binary launched at the hijacked path point to download or command-and-control activity rather than local Media Player servicing. Excluding well-known system endpoints, review the destinations and whether they resolve to enterprise infrastructure.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_system:
        Image|endswith:
          - \svchost.exe
          - \System
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Does this host normally run unregmp2.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a host that does not routinely service Media Player raises the priority of the proxy-execution finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a signed system utility can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific unregmp2.exe /HideWMP firing pattern has historically run here, not generic Media Player activity. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \unregmp2.exe
      - OriginalFileName: unregmp2.exe
      selection_cmd:
        CommandLine|contains|windash: ' /HideWMP'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \unregmp2.exe
      - OriginalFileName: unregmp2.exe
      selection_cmd:
        CommandLine|contains|windash: ' /HideWMP'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \unregmp2.exe
      - OriginalFileName: unregmp2.exe
      selection_cmd:
        CommandLine|contains|windash: ' /HideWMP'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \unregmp2.exe
      - OriginalFileName: unregmp2.exe
      selection_cmd:
        CommandLine|contains|windash: ' /HideWMP'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, file staging into a controlled directory, environment-variable manipulation, or persistence installation.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this unregmp2.exe /HideWMP firing pattern, not generic Media Player usage. Many hosts firing the same pattern points to scripted deployment or vendor servicing automation, the kind of activity an allowlist of expected parents and destinations would normally suppress; one host or a small unrelated set points to manual operator activity. Use host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \unregmp2.exe
      - OriginalFileName: unregmp2.exe
      selection_cmd:
        CommandLine|contains|windash: ' /HideWMP'
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this proxy-execution event and help reconstruct the timeline. Look for patterns: file staging or environment manipulation followed by execution, or tampering followed by payload launch.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
