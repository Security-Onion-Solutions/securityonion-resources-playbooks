name: Suspicious MSExchangeMailboxReplication ASPX Write
id: 76a6a789-7ec5-41ca-b4a7-3d4887f30157
description: |
  Detects the Microsoft Exchange mailbox-replication service (MSExchangeMailboxReplication.exe)
  writing a .aspx or .asp file to disk. This service replicates mailbox data and has no legitimate
  reason to author web-script files; the pattern is a known outcome of public-facing Exchange
  exploitation, where a forged mailbox export drops a web shell into an OWA/ECP front-end
  directory to establish a persistent, browser-reachable foothold on the server. Investigation
  should confirm the target path and its web-server exposure, analyze the file's content for
  web-shell code, and determine whether the exploited server subsequently spawned command
  interpreters or made outbound connections.
type: detection
detection_id: 7280c9f3-a5af-45d0-916a-bc01cb4151c9
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did MSExchangeMailboxReplication.exe write a .aspx or .asp file, and where does that path sit?
  context: Confirm the alert is a true positive by reviewing the exact target path, the operation
    performed (created, renamed, or deleted), and the responsible process against the rule's
    criteria. The write is only meaningful if the destination is inside a web-served directory
    (an OWA, ECP, or other front-end virtual directory); a path outside any web root changes the
    interpretation entirely.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this host an Exchange server expected to have its mailbox-replication service author web-script files?
  context: The writing account on a service-driven event is typically a machine or service
    identity, so judge legitimacy by the host role and the responsible process rather than by the
    user. A production Exchange server writing .aspx files through the mailbox-replication service
    has no supported administrative workflow; on a lab or migration host the same event still
    warrants confirming what task produced it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What is inside the written file? Check for web-shell code, encoded strings, and command-execution logic.
  context: Read the file's actual content. A web shell embeds server-side script that accepts
    attacker input and runs it under the web-server worker, often hidden behind base64, hex, or
    string-concatenation obfuscation and short parameter names. Look for request-parameter
    handling, process-launch calls, file upload/download logic, and eval-style constructs. The
    file content itself is retrieved manually from the host or endpoint tooling.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A web shell still on
    disk can be retrieved, hashed, and analyzed; a file deleted or renamed shortly after creation
    suggests cleanup after use or staging under a different extension, and shifts the focus to what
    the server did while the file existed.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A forged mailbox export commonly writes more than a single artifact — a .pst staging
    file, additional script files, or supporting content. The breadth, paths, and extensions of
    the process's other file activity distinguish a single planted web shell from a broader
    staging operation and enumerate what else needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other .aspx or .asp files have been written on this host recently, and by which processes?
  context: On an Exchange server the front-end virtual directories legitimately contain many web
    scripts, but those are placed by setup and patching, not written at runtime by the
    mailbox-replication service. Recent web-script writes by unexpected processes reveal whether
    this is an isolated drop or one of several, and which artifacts belong to the same activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
        - .aspx
        - .asp
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: After the write, did the Exchange web-server worker process spawn command interpreters or script hosts on this host?
  context: A dropped web shell is invoked by the web-server worker process (w3wp.exe), which then
    spawns whatever the attacker requests — most often a command shell or scripting host used for
    reconnaissance, credential access, or further payload staging. The worker spawning these
    children is the clearest evidence the shell was not just planted but used.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: \w3wp.exe
        Image|endswith:
        - \cmd.exe
        - \powershell.exe
        - \pwsh.exe
        - \cscript.exe
        - \wscript.exe
        - \mshta.exe
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Did this host make outbound network connections after the file was written, and are any to unfamiliar destinations?
  context: Exploitation of a public-facing server is frequently followed by an outbound callback —
    a command-and-control channel opened from the web-server worker or from a process it injected
    into. Focus on connections to destinations the host does not normally reach. Network telemetry
    mixes sensor-derived flows (no process attribution) with endpoint-derived connections that
    carry the initiating process, so process fields populate only on the endpoint subset.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_known_good:
        Image|endswith:
        - \svchost.exe
      condition: selection and not filter_known_good
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What request or operation drove the mailbox-replication service to write this file?
  context: The mailbox-replication service writes files as a side effect of mailbox operations, so
    a web-script write points back to an abused export or replication request against the
    Internet-facing server. The parent process context here is limited; the originating request is
    reconstructed from the web-server access logs — look for the client, path, and method that
    preceded the write to identify the entry point and any additional targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is this Exchange server patched against the known proxy-request and mailbox-export exploitation CVEs?
  context: This write pattern is the documented result of chained Exchange vulnerabilities
    (CVE-2021-34473, CVE-2021-34523, CVE-2021-31207) that let an unauthenticated request reach the
    mailbox-export path. Confirming the server's build and update level tells you whether a known
    CVE made this possible and whether other similarly unpatched servers are exposed, versus a
    zero-day or a misconfiguration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Did the same detection fire on other Exchange servers?
  context: Exploitation of Internet-facing servers rarely stops at one host. The same rule firing
    across other servers reveals how many are affected and whether the activity is a coordinated
    sweep of the estate's Exchange fleet rather than an isolated event, and identifies additional
    systems that need the same review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: The write rarely occurs in isolation. Examining process activity around the alert
    reveals what led to it and what followed — reconnaissance, credential access, defense
    tampering, or additional persistence — and helps place the web-shell drop within a larger
    sequence on the server.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same server — exploitation attempts, reconnaissance, or
    defense tampering — may reveal the stages that preceded the web-shell drop and help
    reconstruct the timeline of how the host was reached.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: When this host has previously produced this write pattern, what programs and users drove it, and does the current alert fit that history?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and
    user distribution reflects how this specific pattern — the mailbox-replication service writing
    web scripts — has historically run here, not generic service activity; expect the Image column
    to show MSExchangeMailboxReplication.exe itself. On a healthy Exchange server this pattern
    should be absent or vanishingly rare; a first-ever occurrence or an unexpected account is the
    anomaly worth chasing. File events carry no parent lineage — pivot to the service's
    process-start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \MSExchangeMailboxReplication.exe
        TargetFilename|endswith:
        - .aspx
        - .asp
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this write pattern in the past week, and does the cross-host distribution look like automation or targeted activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this specific pattern rather than generic use of the service. Because the pattern has no
    legitimate baseline, any hosts appearing here are candidates for the same exploitation; use the
    host distribution to gauge how far the activity has spread.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \MSExchangeMailboxReplication.exe
        TargetFilename|endswith:
        - .aspx
        - .asp
      condition: selection
    fields:
    - host.name
- always_include: true
  question: Has this user account previously produced this write pattern, and does that history fit its role?
  context: The query mirrors the rule's selection scoped to this account, returning its 90-day
    history of this specific pattern aggregated by host. The event usually fires under a machine or
    service identity; a user account that has never produced this pattern is more suspicious than
    one with an established history, but weigh the count against whether that identity has any
    business writing web scripts at all.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \MSExchangeMailboxReplication.exe
        TargetFilename|endswith:
        - .aspx
        - .asp
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this write pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service identity, user attribution is not meaningful, so the
    launch mechanism is the pivot. The query mirrors the rule's selection scoped to the alerting
    program, returning the 90-day history of that program driving this specific pattern. A new
    or rare program for this activity is the deviation worth chasing; a program that already accounts
    for prior events points to established automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        Image|endswith: \MSExchangeMailboxReplication.exe
        TargetFilename|endswith:
        - .aspx
        - .asp
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Does the timing of this write align with a documented maintenance window or migration activity?
  context: Administrators do run mailbox exports and migrations during planned windows, though those
    produce .pst output rather than web scripts. A write that lines up with a documented maintenance
    or migration window is easier to explain; the same event outside business hours with no
    corresponding change record raises the priority of the other findings.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
