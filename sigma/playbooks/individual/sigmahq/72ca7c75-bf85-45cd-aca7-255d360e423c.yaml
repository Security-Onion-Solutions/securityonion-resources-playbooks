name: Potential Chrome Frame Helper DLL Sideloading
id: 59169985-6b92-4f02-a5ac-e989e81ea786
description: |
  Detects Windows image loads of chrome_frame_helper.dll from any path other than the legitimate
  Google Chrome application directories (Program Files\Google\Chrome\Application, the 32-bit
  Program Files (x86) equivalent, and the per-user AppData\Local\Google\Chrome\Application folder).
  This module normally loads only from those Chrome directories; a load from elsewhere is consistent
  with DLL side-loading, where a trusted signed executable is copied to a user-writable folder
  alongside an attacker-supplied copy of this DLL so the trusted process loads and runs the
  attacker's code. Because the loading binary is trusted and signed, this technique is used to bypass
  application allow-listing and reputation-based controls, so the investigation should establish where
  the DLL and its loading process reside, whether the DLL is legitimately signed, and what the trusted
  process did after the load.
type: detection
detection_id: 72ca7c75-bf85-45cd-aca7-255d360e423c
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match this rule's detection criteria for path, signature, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it. The rule fires when chrome_frame_helper.dll
    loads from a path outside the legitimate Chrome application directories
    (Program Files\Google\Chrome\Application, Program Files (x86)\Google\Chrome\Application, and the
    per-user AppData\Local\Google\Chrome\Application folder). A load from a user-writable or otherwise
    non-Chrome directory is the core signal; DLL loads carry a hash and signing status on the load event
    itself, so verify both here.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this host and user expected to run the application that loaded this module?
  context: >-
    Legitimate administrative or developer activity can trigger this detection. Knowing whether the
    host function and the user account are consistent with running the loading application from a
    non-standard directory is often the fastest way to separate a true positive from a benign relocated
    install or a test build.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Besides the flagged DLL, what other modules did this process load, and are any from user-writable or non-canonical directories?
  context: >-
    The full set of modules a process loads tells the operator's story. For search-order hijacking,
    look for additional DLLs pulled from the application's own working folder instead of the system path
    expected for that DLL name, unsigned modules where signed ones are expected, and modules loaded from
    %TEMP%, AppData, ProgramData, or Public. A cluster of side-loaded modules alongside
    chrome_frame_helper.dll strengthens the case that the loading directory was staged by an attacker.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded chrome_frame_helper.dll, what is its signing status, hash, and reputation?
  context: >-
    Module reputation separates a copied-legitimate DLL from a side-loaded malicious one. A
    genuinely-signed DLL loaded from an unexpected location may still be a benign relocated file; an
    unsigned DLL, or one carrying this filename with an invalid or distrusted signature, is a strong
    masquerading indicator. Use the hash to check reputation and to compare against a known-good baseline
    of the legitimate DLL. Signature statuses to watch are Unsigned, Expired, Distrusted, and Invalid.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What is the loading process, where does it run from, and what was its full command line?
  context: >-
    In a side-load the loading binary is typically a trusted signed executable copied to a user-writable
    folder next to the malicious DLL. Its on-disk location (Image), working directory (CurrentDirectory),
    and command line reveal whether it was relocated out of its normal install path and how it was
    invoked. A trusted binary running from AppData, a download folder, or another user-writable directory
    is the hallmark of this technique.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: What process spawned the loading application, and is that parent chain expected?
  context: >-
    The parent process reveals how the loading binary was launched. Legitimate usage often has
    predictable parents (explorer.exe for user actions, services.exe for services). An unusual parent
    such as an Office application, a script host (wscript.exe, mshta.exe), or an archive/installer utility
    suggests the trusted binary was dropped and executed as part of an intrusion rather than a normal
    install.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What files did the loading process or its children write around the alert, and do they remain on disk?
  context: >-
    Once the hijacked DLL executes inside the trusted process, that process (or a child it spawns) may
    drop secondary payloads, configuration, or staging files. Correlating file writes to the loading
    process and its direct children locates those artifacts while they are still on disk, enabling hash
    lookups, reputation checks, and content review of both the side-loaded DLL and any follow-on files.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has chrome_frame_helper.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time module load on a host is a stronger anomaly than a recurring one. If this DLL has loaded
    repeatedly under the same Chrome binary over the past 90 days, the current load is probably routine.
    If this is the first occurrence, or the DLL has only ever loaded under different processes, the
    current load is anomalous and consistent with a newly staged side-load.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Were registry keys that control DLL search order or application launch paths modified on this host around the alert?
  context: >-
    Hijacking execution flow can also run through the registry rather than a colocated file. Modifications
    to KnownDLLs, Image File Execution Options, or App Paths can force a trusted process to load an
    attacker DLL or launch an attacker binary, and may accompany or substitute for the file-based
    side-load. Focus on modifications near the load time; registry value deletion is not observable on
    this telemetry, so treat re-modification history and payload execution as the cleanup signal instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Session Manager\KnownDLLs'
          - '\Image File Execution Options\'
          - '\App Paths\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity in the minutes around the load reveals what led
    to it and what followed, and whether the DLL load, a file drop, and any registry change fall inside a
    single correlation window. Look for reconnaissance, privilege escalation, or additional persistence
    established close to the same time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may
    reveal the stages that preceded this load and help reconstruct the timeline. A side-load is often a
    mid-chain execution step, so a preceding delivery or discovery alert changes how this event should be
    triaged.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is chrome_frame_helper.dll being loaded by other hosts in the environment, and under what processes?
  context: >-
    Cross-host correlation surfaces how widely the DLL is present. The same DLL loading on a single host
    could be a localized incident; the same DLL loading across multiple hosts suggests broader
    distribution or shared tooling. Pay attention to the variety of loading processes: a DLL loaded only
    by its expected Chrome binary is benign, while the same DLL loaded by unrelated processes on other
    hosts points to a spreading side-load.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing one foothold — such as a
    side-loaded DLL running inside a trusted process — they commonly install backup mechanisms via
    scheduled tasks, services, registry Run keys, or BITS jobs. Multiple persistence installations in the
    same timeframe indicate intentional stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence bypasses command-line detection entirely. Dropping an executable or script
    into the Startup folder or a path referenced by a registry Run key achieves persistence without
    running schtasks, sc, or reg. File-event monitoring captures these drops even when the attacker
    avoids standard persistence tooling, and pairs naturally with a side-load that already writes files
    to disk.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Does the user or administrator recall performing this action?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If
    the user does not recall running the application from this location, their credentials may be
    compromised or the activity may be automated malware. If they do recall it, capture why the binary
    was run from a non-standard directory and where it came from.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the timing of this activity align with normal work hours and maintenance windows?
  context: >-
    Legitimate software runs and updates typically occur during business hours or scheduled maintenance
    windows. A trusted binary loading a relocated DLL at an unusual hour, with no maintenance window and
    no corresponding user activity, is harder to explain as routine and raises the priority of the other
    provenance and reputation checks.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
