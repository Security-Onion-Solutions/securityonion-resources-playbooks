name: Psexec Execution
id: 01f10402-c607-4c93-861b-1f1b03183aa3
description: |
  Detects execution of PsExec, identified by a process whose image ends in psexec.exe or whose original
  file name is psexec.c (the latter catching the tool after it has been renamed on disk). PsExec is a
  legitimate remote-administration utility that installs a temporary PSEXESVC service on the target and
  runs commands under it, so administrative scripting, software deployment, and IT maintenance routinely
  trigger this pattern. The same mechanism is heavily abused for hands-on-keyboard lateral movement and
  for fan-out execution of payloads and encryptors across many hosts using a host-list file and supplied
  credentials. Investigation should confirm the command line and target scope, identify the initiating
  user and source, and determine whether the execution fits known administrative automation or looks like
  operator-driven movement.
type: detection
detection_id: 730fc21b-eaff-474b-ad23-90fd265d4988
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Is the alerting process PsExec, either by an image ending in psexec.exe or by an original file name of psexec.c?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    image ends in psexec.exe or when the embedded original file name is psexec.c. The original-file-name branch
    matters because it catches the tool after the on-disk file has been renamed; note which field actually
    matched, since a name mismatch between image and original file name is itself an evasion signal.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Is this user and host expected to run PsExec for remote administration?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the user role and host
    function are consistent with running a remote-execution utility is often the fastest path to distinguishing
    routine administration from operator-driven movement. PsExec on a dedicated admin jump box run by an
    administrator is routine; PsExec from a standard user workstation or a server that has no administrative
    role is the deviation worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did this PsExec invocation do? Decode the full command line.
  context: The full command line reveals the operational intent. Decode the target specification (a single
    host, or a host-list file referenced with the @file syntax), the supplied credentials (-u and -p), the
    -accepteula switch used to suppress the license prompt, detached launch (-d), and the actual command being
    run on the remote host. Mass fan-out using a host list combined with a copy-then-launch sequence is a
    common payload and encryptor deployment pattern; a single targeted command is more consistent with
    routine administration.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Does the on-disk file name match the embedded original file name, or has the binary been renamed?
  context: PsExec carries an original file name of psexec.c regardless of what the file on disk is called, so a
    process whose original file name is psexec.c but whose image is not psexec.exe has been renamed on disk to
    blend in. Renaming the binary is a common way to evade name-based controls and to obscure the tool during
    fan-out execution. Compare the image path against the original file name and treat a mismatch as an
    additional indicator that the execution was not routine administration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: What process spawned PsExec and is that parent chain expected?
  context: The parent process reveals how PsExec was invoked. Interactive administration typically shows
    explorer.exe or a console shell launched by a logged-on administrator, while deployment tooling shows a
    scripting or management agent as the parent. Unusual parents such as wmic.exe, mshta.exe, wscript.exe, or
    an Office application suggest the invocation was driven by a script or remote command channel rather than a
    person at the keyboard.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Was a PSEXESVC service installed on this host around the time of the alert?
  context: PsExec executes remote commands by installing a temporary service (PSEXESVC by default, though the
    service name can be customized) and running the command under it. Correlating service-installation evidence
    in the Windows System log (Event ID 7045) with this process execution confirms the service-execution
    mechanism and reveals the path of the binary the service launched. A service install for a non-standard or
    renamed executable, or one outside the allowlist of known-good installers and management tools, raises the
    suspicion that this was not routine administration.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        EventID: 7045
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - ServiceType
- question: What child processes did PsExec spawn on this host afterward?
  context: The processes launched after PsExec runs reveal its actual impact. Legitimate administration tends to
    run a predictable, scoped command, while malicious use often spawns cmd.exe, powershell.exe, or a copied
    executable from a staging path such as a temp directory. Examine the children and their command lines to
    determine what was actually executed under the service. The correlation window between the PsExec
    invocation and the resulting execution is the key timing signal for this stage.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What host initiated this remote connection, and is it an expected administrative source?
  context: Lateral movement requires a source and destination. PsExec reaches a target over SMB on port 445
    (with 135 for the service-control RPC), so inbound connections on those ports reveal the originating host.
    Identifying the source shows whether the connection came from a known admin jump box, a deployment server,
    or an unexpected workstation. Allowlisting the known administrative sources and jump boxes lets the unusual
    origin stand out as the one worth chasing.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account and authentication method did this PsExec execution use?
  context: The authentication method reveals how access was obtained. PsExec drives a network logon (type 3) on
    the target; credentials supplied on the command line with -u and -p indicate the operator already held a
    valid account, whether obtained legitimately or through dumping or theft. Constraining the expected actors
    to service accounts and known administrators raises fidelity, because a privileged or unexpected account
    driving the execution is the higher-concern case. Authoritative logon detail lives in the Windows Security
    log (4624 network logon, 4648 explicit credentials).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes were spawned on this host shortly after the remote connection was established?
  context: Lateral movement is a means to an end. After PsExec establishes access, look for processes whose
    parent is PSEXESVC.exe, since those are the commands actually executed under the installed service. The
    forward-looking window captures the post-access activity that reveals the operator's objective on this
    host, whether that is reconnaissance, tool deployment, data access, or payload execution.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account run remote-execution tooling against other hosts in the environment?
  context: Attackers rarely stop at one target, and PsExec fan-out across a host list is a common way to push a
    payload or encryptor to many systems at once. If the same account is driving PsExec or related
    remote-execution utilities across multiple hosts in a short window, the scope of compromise is larger and
    the activity points to active lateral movement rather than a single administrative task.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: Does this host normally run PsExec?
  context: A remote-execution utility that has never been seen on a host is more suspicious than one that runs
    regularly as part of administration or deployment. Zero or very low historical counts indicate first-time
    or rare execution. Use the surrounding history to build the allowlist of hosts and management tools that
    routinely run PsExec, so that an execution falling outside that known-good baseline stands out.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired this PsExec pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even legitimate tools can be abused. The query mirrors the rule's selection structure scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here, not generic binary usage. A new parent process, an unexpected user account, or an
    unusual command-line structure relative to that history is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \psexec.exe
      - OriginalFileName: psexec.c
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired this PsExec pattern in the past week, and does the distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic usage of the binary. Many hosts firing the same pattern
    points to scripted deployment or vendor automation; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \psexec.exe
      - OriginalFileName: psexec.c
      condition: selection
    fields:
    - host.name
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \psexec.exe
      - OriginalFileName: psexec.c
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \psexec.exe
      - OriginalFileName: psexec.c
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering,
    reconnaissance, or credential access, may reveal the attack stages that preceded a remote-execution event
    and help reconstruct the timeline. Credential access followed by lateral movement is a common ordering that
    this view can surface.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Where has this user authenticated recently?
  context: Authentication events show which systems the user accessed before and after the detected activity.
    Network logons (type 3) of this account across many hosts in a short period, especially following credential
    access, are consistent with lateral movement in progress. The Windows Security log carries the
    authoritative logon record (4624 success, 4625 failure) with the source address and logon type for each
    system the account touched.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4625
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - EventID
      - LogonType
