name: Remote PowerShell Session Host Process (WinRM)
id: 689f121a-031b-4c63-9d80-df5b08f4994d
description: |
  Detects an active PowerShell remoting session over WinRM by flagging the host process wsmprovhost.exe when it appears
  either as the process that started OR as the parent of another process. When wsmprovhost.exe is the process itself, the
  WinRM service has initialized a remote PowerShell session on this host; when it is the parent, that remote session is
  executing commands as child processes. Remote PowerShell is routine for management tooling (Exchange, configuration
  management, jump-box administration), so the investigation should determine the originating host and account, whether
  that source is an approved administrative path, and what commands ran inside the session.
type: detection
detection_id: 734f8d9b-42b8-41b2-bcf5-abaf49d5a3c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this event show wsmprovhost.exe as either the running process or the parent of a child process?
  context: >-
    The rule fires on either of two roles for wsmprovhost.exe (the WinRM remote-session host): the process itself starting,
    or wsmprovhost.exe spawning a child. Confirm which role fired here. If wsmprovhost.exe is the process, the WinRM service
    initialized a remote PowerShell session on this host; if it is the parent, the remote session is running a command as a
    child process. Which branch fired determines where the rest of the investigation looks: the parent-role fire makes the
    child command line and the spawned binary the load-bearing evidence, while the process-role fire points to the source
    host and account that opened the session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: Is this user and host expected to be a source or target of remote PowerShell management?
  context: >-
    Remote PowerShell over WinRM is a standard administration channel. Knowing whether this host is a managed endpoint that
    legitimately receives remote sessions, and whether the account is an administrator or service identity authorized to use
    WinRM, is often the fastest way to separate routine management from unexpected remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What spawned wsmprovhost.exe, or what did wsmprovhost.exe spawn, and is that chain expected?
  context: >-
    The wsmprovhost.exe host is normally started by the WinRM service (svchost.exe hosting the WinRM service). If
    wsmprovhost.exe was started by an unexpected parent, the chain is suspicious. When wsmprovhost.exe is the parent, the
    child it launched is the command executed inside the remote session; an abnormal child (command interpreters, script
    hosts, or reconnaissance binaries) reveals what the remote operator ran.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Was any command run in this session encoded or obfuscated, and what does it decode to?
  context: >-
    Commands executed inside a remote PowerShell session can carry the -EncodedCommand (-enc) parameter, string
    concatenation, backtick escaping, or variable substitution to hide intent. Base64-encoded commands are the most common
    form. Decoding reveals the actual payload such as download cradles, reverse shells, or in-memory execution of .NET
    assemblies. Inspect the alerting event and its child commands for these patterns.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture the full content of what ran in this remote session?
  context: >-
    Windows Event ID 4104 (script block logging) records the deobfuscated script content PowerShell actually executes, even
    when the command line is encoded or obfuscated. For a remote session this is the ground truth of what the operator ran
    on this host. If PowerShell operational logs are not ingested in this environment, treat zero results as a visibility gap
    rather than evidence nothing executed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened on this host before the session ran?
  context: >-
    Operators often disable or bypass PowerShell security controls before running a payload. Common techniques include AMSI
    bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or -ep bypass), constrained language
    mode escape, and downgrade attacks (powershell.exe v2, which lacks logging). Finding these precursor events on the host
    strengthens the case that the remote session activity is malicious.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What other child processes did this wsmprovhost.exe session spawn?
  context: >-
    A remote PowerShell session that runs more than one command will spawn several children from the same wsmprovhost.exe
    instance. Examining all children of that exact parent reveals the full set of actions the remote operator took on this
    host. Multiple distinct tools launched from one session points to hands-on activity rather than a single routine task.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally see wsmprovhost.exe in this parent-child relationship?
  context: >-
    A host that regularly receives remote PowerShell management will show recurring wsmprovhost.exe activity in this
    spawning pattern; a host that has never hosted a remote session before makes this a novel event. Zero or very low
    historical counts indicate first-time remote-session activity worth scrutiny.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What account authenticated over WinRM to open this session, and from which source host?
  context: >-
    A WinRM remote session is preceded by a network logon. Windows Security events 4624 (logon) and 4648 (explicit
    credential logon) recorded around the alert reveal the account and source address that opened the session. Network and
    remote-interactive logon types from an unexpected source, or a service or non-administrator account, indicate the remote
    access may not be sanctioned. If Security logs are not ingested in this environment, treat zero results as a visibility
    gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4624
          - 4648
      condition: selection
    fields:
      - TargetUserName
      - IpAddress
      - LogonType
      - WorkstationName
- question: What inbound connections reached the WinRM listener on this host around the alert?
  context: >-
    WinRM listens on 5985 (HTTP) and 5986 (HTTPS) by default. Inbound connections to these ports identify the originating
    host of the remote session. Comparing that source against the known administrative jump boxes determines whether the
    session came from an approved management path or from a compromised or unexpected workstation acting as a pivot.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 5985
          - 5986
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \wsmprovhost.exe
      - ParentImage|endswith: \wsmprovhost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \wsmprovhost.exe
      - ParentImage|endswith: \wsmprovhost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity across all hosts reveals whether the remote session is isolated or part of movement
    across multiple endpoints. The same account triggering remote PowerShell or related activity on several hosts in a short
    window suggests the scope of access is larger than this one host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \wsmprovhost.exe
      - ParentImage|endswith: \wsmprovhost.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this user account run lateral movement tooling against other hosts recently?
  context: >-
    Operators rarely stop at one target. If the same account is running lateral movement utilities across multiple systems,
    the scope of compromise is larger. Finding remote-execution and remote-desktop tools used by this account against many
    hosts in a short window indicates active movement across the environment rather than a single management action.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: What .NET and scripting assemblies were loaded into wsmprovhost.exe during this session?
  context: >-
    A remote PowerShell session host loads the .NET and PowerShell automation assemblies it runs. In-memory tradecraft
    surfaces here as rare or never-before-seen modules loaded into wsmprovhost.exe, which process command-line evidence
    alone does not show. Reviewing the loaded-module list distinguishes a baseline session from one reflectively loading
    additional assemblies. If image-load telemetry is not ingested in this environment, treat zero results as a visibility
    gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wsmprovhost.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host such as defense tampering, reconnaissance, or
    credential access may reveal the stages that preceded the remote session and help reconstruct the timeline. The sequence
    of alerts on the host tells the broader story of the activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this wsmprovhost.exe spawning pattern occurring on other hosts?
  context: >-
    The same remote-session spawning relationship appearing on multiple hosts may indicate an operator moving laterally
    across the environment, while a single occurrence is more likely a targeted or routine management action. Environment-wide
    comparison helps calibrate the scope of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
