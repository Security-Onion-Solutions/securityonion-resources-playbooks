name: HackTool - CrackMapExec File Indicators
id: e158eb1d-b3d3-4ebe-b4ff-39a4b0adcf5d
description: |
  This rule fires when a file is created under C:\Windows\Temp\ whose name matches a pattern CrackMapExec
  leaves behind — EITHER one of its known script names (temp.ps1, msol.ps1) OR a generated name matching its
  output conventions (a GUID-named .txt file, or an eight-character .tmp file). CrackMapExec is a
  post-exploitation framework used to execute commands over SMB/WMI/WinRM, enumerate accounts and sessions,
  and dump credentials, and these temporary files are the on-disk residue of its modules running on a target.
  The investigation should confirm the file matches the tool's pattern, identify the process that wrote it and
  how it was invoked, determine what the dropped script or output contains, and establish whether credential
  access or lateral movement followed.
type: detection
detection_id: 736ffa74-5f6f-44ca-94ef-1c0df4f51d2a
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Was a file created under C:\Windows\Temp\ whose name matches either a known CrackMapExec script name or its generated .txt/.tmp pattern?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when the
    path is under C:\Windows\Temp\ AND the name matches EITHER a known script name (temp.ps1, msol.ps1) OR the
    generated patterns (a GUID-named .txt, or an eight-character .tmp). Note which branch fired — a fixed
    script name points at a specific module, while a randomly named .txt/.tmp points at harvested output or
    staging, and that distinction steers the downstream questions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write files into C:\Windows\Temp\ from this process?
  context: >-
    Legitimate administrative activity and installers do write to C:\Windows\Temp\, so knowing whether the
    responsible process, the user, and the host function are consistent with the detected behavior is often the
    fastest path to distinguishing a true positive from routine operations. When the user is a machine or
    service account, judge by the writing process and the host role instead of the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this CrackMapExec activity part of an authorized penetration test or red team engagement?
  context: >-
    Offensive frameworks like CrackMapExec are routinely used in authorized security assessments. Before
    investing investigation time, check whether a penetration test or red team exercise is currently active on
    this host or network segment. An authorized engagement with matching tool usage and timing resolves the
    alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What CrackMapExec capability or module produced this file?
  context: >-
    CrackMapExec is multi-purpose — it enumerates shares and sessions, executes commands over SMB/WMI/WinRM, and
    dumps credentials through its modules. The command line of the process that wrote this file, read together
    with the file's name, indicates which module ran, which determines the scope of potential compromise and the
    required response actions. A msol.ps1 points at cloud/directory enumeration; a temp.ps1 or a randomly named
    output file often accompanies credential or session harvesting.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What other files did the writing process create on this host?
  context: >-
    CrackMapExec leaves characteristic on-disk artifacts — PowerShell modules staged as scripts (temp.ps1,
    msol.ps1), GUID-named output files, and short random .tmp files under C:\Windows\Temp. Enumerating the other
    files written by the same process confirms tool execution and reveals the breadth of the activity even after
    the original process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What does the dropped file contain?
  context: >-
    Read the file's actual content. For the script files (temp.ps1, msol.ps1), check for base64 or otherwise
    obfuscated strings, embedded credentials, host or account lists, module signatures, and the commands the
    script runs. For the .txt/.tmp output files, check whether they hold harvested credentials, session data, or
    enumeration results. Content is not carried in the file-creation event itself — retrieve the file from disk or
    the endpoint console for analysis, and compare distinctive strings against threat intelligence.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Which credential stores did this activity target?
  context: >-
    CrackMapExec dumps credentials through several paths — LSASS memory (via its own dumper or comsvcs.dll), the
    SAM/SYSTEM/SECURITY registry hives, and cached or domain credentials. Read the command line of the process
    that wrote this file, together with the file's name and location, to determine the target and the method.
    Direct LSASS memory reads are not visible in this telemetry, so the absence of a read-side event does not
    rule out LSASS access — corroborate with the dropped file's content and any dump output on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the process that wrote this file also modify registry values around the same time?
  context: >-
    Credential-dumping activity often touches the registry alongside file drops — saving the SAM, SYSTEM, and
    SECURITY hives, or reading and modifying LSA-related keys. Correlating registry modifications by the same
    writing process reveals a registry-based credential-access path running next to the file artifact. Registry
    value or key deletion is not observable in this telemetry, so frame cleanup checks around what was modified
    rather than what was removed.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Was the dropped file later executed or referenced by another process?
  context: >-
    A staged script is meaningful only once it runs. The .ps1 files are executed by an interpreter, so the script
    name appears in a subsequent process command line rather than as the process image itself. This query looks
    for any process whose command line references the dropped filename, revealing execution, copying, or further
    tooling. A match on a short, generic .tmp or .txt name can be coincidental — confirm the referencing process
    and its parent before treating it as related.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What other files did the responsible process write or delete around the alert?
  context: >-
    A process that drops one CrackMapExec artifact often writes several — staged scripts, output files, and
    temporary staging data. The breadth, paths, and extensions of the process's other file activity distinguish a
    single artifact from a running operation and enumerate what else needs review. The correlation covers the
    writer and its direct children, since droppers often delegate the actual writes.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to C:\Windows\Temp\ recently, and by which processes?
  context: >-
    C:\Windows\Temp\ is writable by many processes but only a small set legitimately stage tooling there. Other
    recent arrivals in the same directory reveal whether this is an isolated drop or a location under active use,
    and which other artifacts belong to the same activity. A single unfamiliar writer accounting for many files
    is the pattern worth chasing.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Windows\Temp\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    Credential theft is typically followed by lateral movement. The query returns outbound connections from this
    host to remote-access ports — 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) — in the hours after
    the event; the originating Image and User show what drove each connection. Two limits to keep in mind:
    credentials exfiltrated and replayed from another machine will not appear here (check 4624 logons on suspected
    targets for this account and any accounts with sessions on this host), and the query requires
    network-connection telemetry from this host — if that is not collected, treat zero rows as a visibility gap,
    not as evidence that no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be compromised, and do any have elevated privileges?
  context: >-
    The severity of credential theft depends on the privilege level of the compromised accounts. Domain admin
    credentials require incident escalation; a standard user account may only need monitoring. Service accounts
    with broad access are also frequent targets. Cross-reference the involved accounts with directory group
    memberships to judge the exposure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: >-
    The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved,
    hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting
    dropper and shifts the investigation to what executed in between. Read the operation type on each later event
    for this path to tell creation from deletion or rename.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this user account produced this CrackMapExec file pattern before, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user — the result is the user's 90-day history of the
    rule's specific firing pattern (not generic use of C:\Windows\Temp\), aggregated by host. A user who has never
    produced this pattern is more notable than one who does so regularly; weigh the count against the user's role
    and typical toolset.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_path:
        TargetFilename|startswith: C:\Windows\Temp\
      selection_names_str:
        TargetFilename|endswith:
        - \temp.ps1
        - \msol.ps1
      selection_names_re:
      - TargetFilename|re: \\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$
      - TargetFilename|re: \\[a-zA-Z]{8}\.tmp$
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_path and 1 of selection_names_*) and _pb_scope
    fields:
    - host.name
- question: Has the program that drove this file drop produced this pattern before on this host or across the environment?
  context: >-
    When the alert fires under a service principal, user identity does not attribute behavior; the meaningful
    pivot is the launch mechanism. The query mirrors the rule's selection scoped to the alerting program,
    so the result is the 90-day history of this program driving this specific pattern (not generic program-and-file
    co-occurrence). A new or rare program for this pattern is the deviation worth chasing; a program that already
    accounts for thousands of prior events is vendor or operating-system automation.
  range: -90d
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_path:
        TargetFilename|startswith: C:\Windows\Temp\
      selection_names_str:
        TargetFilename|endswith:
        - \temp.ps1
        - \msol.ps1
      selection_names_re:
      - TargetFilename|re: \\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$
      - TargetFilename|re: \\[a-zA-Z]{8}\.tmp$
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_path and 1 of selection_names_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts reveals lateral movement or coordinated activity across multiple
    endpoints. If the same user drove similar activity on several hosts, the scope of compromise may be larger.
    When the alert fires under SYSTEM, a service account, or a machine account, this user-pivot returns broad
    agent-telemetry noise and the parent-driven fleet question is the meaningful answer instead.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did the same program-driven file pattern fire on other hosts in this window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what else the user did across the network returns agent-telemetry noise
    (every host runs system-owned agents constantly). The meaningful question is whether the same launch mechanism
    fired elsewhere: the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in
    the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host
    points to a host-local trigger.
  range: +/-1h
  always_include: true
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection_path:
        TargetFilename|startswith: C:\Windows\Temp\
      selection_names_str:
        TargetFilename|endswith:
        - \temp.ps1
        - \msol.ps1
      selection_names_re:
      - TargetFilename|re: \\[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\.txt$
      - TargetFilename|re: \\[a-zA-Z]{8}\.tmp$
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection_path and 1 of selection_names_*) and _pb_scope
    fields:
    - host.name
