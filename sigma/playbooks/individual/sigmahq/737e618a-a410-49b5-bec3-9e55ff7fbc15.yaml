name: Suspicious Calculator Usage
id: 5efe3697-7e7d-4916-a1ec-1e55117459c6
description: |
  Detects suspicious execution of calc.exe in one of two independent ways: either the Windows calculator is invoked with
  command-line arguments (the genuine calculator takes none, so any arguments suggest a renamed or substituted binary or a
  proof-of-concept wrapper), or a binary named calc.exe runs from a directory other than the standard system locations
  (System32, SysWOW64, WinSxS). Both patterns point to masquerading, where an actor relies on a trusted-looking name to
  blend in or to verify that endpoint detection can be evaded. Legitimate calc.exe launches descend from the standard
  shell and run argument-free from a system directory, so the investigation should confirm which branch fired, decode any
  arguments, and verify the binary's true identity via its embedded metadata, signature, and hash.
type: detection
detection_id: 737e618a-a410-49b5-bec3-9e55ff7fbc15
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does this event match the rule, with either calc.exe carrying command-line arguments or a calc.exe binary running outside the standard Windows system directories?
  context: Before investing investigation time, confirm the alert is a true positive and note which branch fired, because the branch steers the rest of the investigation. The rule fires when the command line contains an invocation of calc.exe with arguments, OR when a binary named calc.exe runs from a location other than System32, SysWOW64, or WinSxS. The argument branch makes the command-line decode load-bearing; the location branch makes the identity, signature, and origin questions load-bearing because the genuine calculator does not live outside those directories.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run calc.exe in this way?
  context: Legitimate calculator launches are argument-free and run from a system directory under an interactive user. Knowing whether the user role and host function would ever invoke calc.exe with arguments or from a non-standard path is often the fastest way to separate a benign quirk from a deliberately renamed or relocated binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this calc.exe based on its metadata, signature, and hash?
  context: When a binary is renamed or substituted, the embedded PE metadata still reflects its real origin. Compare the Image path against OriginalFileName, which for the genuine calculator reports CALC.EXE and a Microsoft signature. A mismatch, an unexpected signer, or an unsigned file indicates the on-disk binary is not the real calculator. The hash enables a reputation lookup to determine whether this is the legitimate tool, a known sample, or a novel binary needing deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What arguments were passed to calc.exe, and what do they reveal about the operation?
  context: The genuine calculator accepts no command-line arguments, so any arguments are anomalous and reveal what the substituted binary actually is or does. Decode any flags, file paths, URLs, or encoded content on the command line. For the location branch, this surfaces every calc.exe execution on the host in the surrounding window so a single logical operation spread across multiple invocations stays visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: How did this calc.exe arrive on the host, and when was it created relative to execution?
  context: 'A calculator running from a non-standard path or carrying mismatched metadata did not appear on its own; it was copied, downloaded, or dropped by another process. Tracing the file creation event by basename over a long window reveals the delivery mechanism and the writing process, and the gap between file creation and execution is itself a signal: a binary created moments before it ran points to staging rather than a long-installed tool.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did this calc.exe do after execution, and is the same binary present on other hosts?
  context: The purpose of masquerading as the calculator is to perform some other function under a trusted name. Examining the child processes and follow-on activity from this binary reveals its actual objective. The same renamed or relocated calc.exe appearing on multiple hosts suggests deliberate distribution rather than an isolated test or quirk.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this calc.exe, and is that parent chain expected?
  context: The parent process reveals how the calculator was launched. A genuine user-initiated calculator descends from explorer.exe; an instance spawned by a shell, a script host such as wscript.exe or mshta.exe, or an Office application points to scripted or staged execution rather than interactive use. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did this calc.exe spawn afterward?
  context: The genuine calculator spawns nothing. A substituted binary masquerading under the calc.exe name often spawns cmd.exe, powershell.exe, certutil.exe, or other living-off-the-land binaries to carry out its real objective. Review the children and their command lines for follow-on staging or post-exploitation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run calc.exe in this way?
  context: A calculator that runs argument-free from a system directory is routine; one that has never before run with arguments or from this path on this host is the anomaly. Zero or very low historical counts for this binary on this host indicate first-time or rare execution and raise the priority of the identity result.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even a common binary name can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific calc.exe firing pattern has historically run here, not generic calculator usage. A new parent process, an unexpected user account, or an unusual command-line structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: '\calc.exe '
      selection_2:
        Image|endswith: \calc.exe
      filter_main_known_locations:
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_1 or ( selection_2 and not filter_main_known_locations )) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: '\calc.exe '
      selection_2:
        Image|endswith: \calc.exe
      filter_main_known_locations:
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_1 or ( selection_2 and not filter_main_known_locations )) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: '\calc.exe '
      selection_2:
        Image|endswith: \calc.exe
      filter_main_known_locations:
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_1 or ( selection_2 and not filter_main_known_locations )) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: '\calc.exe '
      selection_2:
        Image|endswith: \calc.exe
      filter_main_known_locations:
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_1 or ( selection_2 and not filter_main_known_locations )) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, persistence installation, or data staging surrounding the calc.exe execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of this calc.exe firing pattern, not generic calculator usage. Many hosts firing the same pattern points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: '\calc.exe '
      selection_2:
        Image|endswith: \calc.exe
      filter_main_known_locations:
        Image|contains:
        - :\Windows\System32\
        - :\Windows\SysWOW64\
        - :\Windows\WinSxS\
      condition: selection_1 or ( selection_2 and not filter_main_known_locations )
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: tampering followed by execution, or reconnaissance followed by exploitation.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
