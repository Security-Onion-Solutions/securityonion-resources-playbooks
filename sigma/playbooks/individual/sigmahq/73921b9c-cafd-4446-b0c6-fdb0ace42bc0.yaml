name: Windows Credential Guard Disabled - Registry
id: 383e280a-1be1-4b0a-9ae0-fa1294dc0ff5
description: |
  Detects a registry write that sets one of the Credential Guard / virtualization-based
  security values to DWORD 0x00000000 — specifically a TargetObject ending in
  \DeviceGuard\EnableVirtualizationBasedSecurity, \DeviceGuard\LsaCfgFlags, or \Lsa\LsaCfgFlags
  with value data of 0. Credential Guard uses VBS to isolate NTLM hashes and Kerberos tickets so
  only privileged system software can reach them; setting these values to 0 turns that isolation
  off (the change generally applies after reboot). Legitimate changes come from policy management
  or an administrator deliberately opting a host out; malicious use disables the protection so
  cached secrets can be dumped and reused for pass-the-hash, pass-the-ticket, and lateral movement.
  Investigate which value was written, the process and command that wrote it, whether the control
  is now disabled, and what activity followed on the host.
type: detection
detection_id: 73921b9c-cafd-4446-b0c6-fdb0ace42bc0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting registry write set a Credential Guard or VBS value to DWORD 0?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires when
    a registry value whose path ends in \DeviceGuard\EnableVirtualizationBasedSecurity,
    \DeviceGuard\LsaCfgFlags, or \Lsa\LsaCfgFlags is written with Details of DWORD (0x00000000).
    Review the exact TargetObject and Details on the triggering event to verify the value data is
    0 and note which of the three keys was targeted, since that distinguishes an LsaCfgFlags
    (Credential Guard) change from an EnableVirtualizationBasedSecurity (whole-VBS) change.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify Credential Guard or VBS policy values?
  context: >-
    Legitimate opt-out of Credential Guard happens through policy management or a deliberate
    administrator action, typically on a defined set of hosts and by a small set of accounts.
    Knowing whether the writing account and host function match that expectation is often the
    fastest way to separate a sanctioned configuration change from tampering. User attribution is
    present on roughly 94% of endpoint registry events; when it is a machine account or missing,
    pivot on the writing process instead. Expected administrative tooling and the accounts that run
    it form the baseline that separates routine changes from tampering.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which specific Credential Guard value was written, and what does that key control?
  context: >-
    The specific path determines the impact. A value ending in \Lsa\LsaCfgFlags or
    \DeviceGuard\LsaCfgFlags controls the Credential Guard LSA configuration, while
    \DeviceGuard\EnableVirtualizationBasedSecurity governs the underlying virtualization-based
    security that Credential Guard depends on. Setting LsaCfgFlags to 0 turns off Credential Guard;
    setting EnableVirtualizationBasedSecurity to 0 disables the VBS layer entirely, which also
    removes other VBS-backed protections. The value data and writing process together identify what
    setting changed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value data was written to this key, and does it disable the protection?
  context: >-
    Read the Details field on the triggering write. A DWORD of 0x00000000 in these policy values
    means the protection is being turned off rather than configured; a non-zero value would enable
    or require it. Details is present on roughly 79% of registry modifications and is absent only
    for binary or empty value data, so for this DWORD policy value it should be populated. Confirm
    the value is 0 and note which key received it.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: After this write, was the same value re-set, reverted, or re-enabled on this host?
  context: >-
    Registry key or value deletions are not observable in this telemetry, so durability is judged
    from the key's re-modification history rather than from a delete event. Look at later writes to
    the same value over the following window: a single 0 write that is never restored leaves the
    protection off, while a later non-zero write would indicate the setting was re-enabled (by
    remediation, policy refresh, or an administrator). Repeated flip-flopping of the value can
    indicate a policy fighting a manual change.
  range: +24h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: What command performed this registry write, and how was the value set?
  context: >-
    The registry event carries no command line, so pivot to the writing process by its ProcessGuid
    to read the full command that made the change. This distinguishes a reg.exe or PowerShell
    one-liner that sets LsaCfgFlags to 0 from a policy-driven write, and reveals whether the same
    invocation touched more than one Credential Guard or VBS value. Decode the arguments to identify
    exactly which value and data were written.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process wrote this value, and is its parent chain expected?
  context: >-
    The writing process and its parent reveal how the change was invoked. Policy-driven changes and
    administrator actions have predictable lineage (management agents, services.exe, an interactive
    console launched from explorer.exe). A reg.exe or powershell.exe write whose parent is an Office
    application, a script host such as wscript.exe or mshta.exe, or an unsigned binary points to
    scripted tampering rather than sanctioned configuration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is Credential Guard currently disabled on this host, or has it been restored?
  context: >-
    The tampering may be a transient step or a lasting configuration. LsaCfgFlags and VBS changes
    generally take effect after a reboot, so the current running state may differ from the value in
    the registry. Confirm whether Credential Guard is presently enforcing on the host through direct
    inspection or endpoint tooling; if it is off, the host's cached secrets are exposed and the
    control should be restored before deeper investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after Credential Guard was disabled?
  context: >-
    Disabling credential isolation is usually a means to an end — reading LSASS secrets, dumping
    cached hashes and Kerberos tickets, or reusing them for lateral movement. Examining process
    activity in the window after the write reveals what the tampering enabled. Credential-access
    tooling, LSASS access, or authentication attempts to other hosts appearing shortly after the
    change tie the registry edit to a larger operation. The correlation window links the registry
    edit to the activity that followed.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host?
  context: >-
    An actor who disables Credential Guard often weakens several controls in the same operation —
    stopping or reconfiguring services, clearing event logs, deleting shadow copies, or turning off
    other protections. Finding additional tampering from the same user or writing process indicates
    multiple controls were targeted together rather than an isolated policy change. Named security
    service changes in this window are worth correlating with the Credential Guard write.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: What other registry modifications were made on this host in the same window?
  context: >-
    Actors who change one security policy value often change several — disabling Credential Guard
    alongside Defender policy, firewall, or persistence keys. Clustering the registry writes on this
    host within a short window around the alert reveals the full scope of configuration changes and
    whether multiple objectives were pursued together. The triggering key appears in the results;
    the signal is what else was modified and by which process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has this Credential Guard value been modified before on this host?
  context: >-
    Security policy values such as LsaCfgFlags and EnableVirtualizationBasedSecurity should change
    rarely and only through deliberate action. A history that shows no prior writes makes this a
    first-time change and raises its weight; a history of periodic writes to the same value points
    to a management process that routinely sets it. Compare the historical Details values to see
    whether the same 0 value was set before or whether this is new.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this same value modified on other hosts in the environment?
  context: >-
    The same write across many hosts suggests a centrally managed policy or an opt-out rolled out by
    administration; the same write confined to one host suggests a targeted change. Compare the
    Details values across hosts to see whether they all set 0 or whether values differ, and whether
    the writing process is consistent with a management deployment or with ad-hoc tampering.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    A registry tamper rarely happens in isolation. Aggregating process activity in a tight window
    around the alert surfaces what led up to the change and what ran immediately after. Novel
    parent-child pairs stand out at low counts against high-count routine telemetry, which is what
    points to reconnaissance, credential access, or staging around the configuration change.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — reconnaissance, execution of scripting tools, or other
    defense tampering — may reveal the stages that preceded this change and help reconstruct the
    timeline. Defense tampering followed by credential access is a common progression, and prior
    alerts help place this registry edit within it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were process-based persistence mechanisms installed on this host in the same window?
  context: >-
    An actor who weakens credential protection to harvest secrets frequently establishes persistence
    in the same operation. Scheduled tasks, services, registry Run keys, BITS jobs, and WMI
    subscriptions created by schtasks.exe, sc.exe, reg.exe, bitsadmin.exe, or wmic.exe near the
    tampering indicate the change was part of a footholding effort rather than an isolated
    configuration edit.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup or scheduled-task locations on this host in the same window?
  context: >-
    File-based persistence bypasses command-line detection entirely — dropping an executable or
    script into a Startup folder or a path referenced by a registry Run key achieves persistence
    without invoking schtasks, sc, or reg. File writes to these locations near the credential-control
    tampering indicate a parallel persistence mechanism was established alongside it.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
