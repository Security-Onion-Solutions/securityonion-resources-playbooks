name: Potential Registry Persistence Attempt Via Windows Telemetry
id: 824a3571-08f6-45c0-a87f-fe2948eff17b
description: |
  Detects a registry value being set under HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\TelemetryController
  where the value name ends in \Command and the value data references an executable or script extension (.bat, .exe, .dll,
  .ps, .js, .hta, and similar), excluding the legitimate telemetry binaries CompatTelRunner.exe and DeviceCensus.exe. The
  Windows compatibility telemetry runner reads this key and executes the configured Command as SYSTEM on a recurring
  schedule, so an attacker with local admin (HKLM write) gains stealthy persistence and an admin-to-SYSTEM escalation that
  does not appear in autoruns. Determine what payload the value points at, whether it was written by an unexpected process,
  and whether the telemetry runner has already executed it.
type: detection
detection_id: 73a883d0-0348-4be4-a8d8-51031c2564f8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path and value data match what this rule detects?
  context: Confirm the alert is a true positive before investing time. The rule fires when a value under the AppCompatFlags\TelemetryController
    key ends in \Command AND its data references an executable or script extension AND the data is not one of the legitimate
    telemetry binaries (CompatTelRunner.exe, DeviceCensus.exe). Review the exact key path (TargetObject) and value data (Details)
    against those criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify the Windows telemetry command-configuration registry key?
  context: Writing under this HKLM key requires local administrator rights, and legitimate software almost never registers
    an arbitrary Command value here. Knowing whether the writing account and host function are consistent with such a change
    is often the fastest way to separate a real deployment from abuse. User attribution is present on most endpoint registry
    events; when it is a machine account or SYSTEM, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry key and value were modified, and is this a known persistence or evasion location?
  context: The AppCompatFlags\TelemetryController\<subkey>\Command value is a SYSTEM-context persistence primitive - the
    compatibility telemetry runner executes whatever path or command it holds. The arbitrary subkey name and the value data
    together determine what will run. Identify the exact key and writing process to judge whether this is an authorized
    telemetry configuration or a planted persistence entry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What executable or command does the registry value data reference, and what would it run?
  context: The Details field holds the Command string the telemetry runner will launch. Look for a payload path in user-writable
    locations (Temp, AppData, ProgramData), a script or interpreter invocation, or base64/hex-encoded content concealing a
    download cradle or loader. If Details points at an executable, that path becomes the artifact to verify further. Details
    is present on most registry modifications but is absent for binary or empty value data, so note when it is missing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What was the full command line of the process that wrote this registry value?
  context: The registry event carries the writing process identity but not its command line; pivoting to that process's
    creation event reveals how the value was set - a direct reg.exe write, a PowerShell Set-ItemProperty, or an implant.
    The command line often contains the value data itself (for example a reg add with the payload path in the /d argument),
    which shows both the mechanism and the payload in one place.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other registry values written under this telemetry key in the same session?
  context: The Command value alone does not fire the payload - the runner also checks companion DWORD values (Nightly, Maintenance,
    Oobe) in the same subkey, with Nightly alone enough to run the command roughly every 24 hours. Finding those arming values,
    or other registry changes from the same process within a short window, reveals whether the persistence was fully configured
    and whether additional objectives were pursued.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is this a known persistence location, and does the value stay in place or get re-modified?
  context: Values under the telemetry controller key are a documented persistence and privilege-escalation vector and are
    not visible in autoruns, so they warrant scrutiny. Registry key/value deletion is not observable on this telemetry, so
    judge persistence from the key's re-modification history over a longer window and from whether the configured payload
    actually executed, rather than expecting a deletion event if it were cleaned up.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Did the telemetry runner execute the command configured in this registry value?
  context: CompatTelRunner.exe reads the Command subkey and launches the configured command as SYSTEM at the next telemetry
    task trigger. A child process of CompatTelRunner.exe that is not a normal telemetry component indicates the planted command
    ran. Execution can lag the registry write by up to a day when only the Nightly trigger is set, so a wide lookback is
    appropriate.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\CompatTelRunner.exe'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the executable or script referenced by the registry value present on disk?
  context: The persistence is only effective if the payload the Command value points at exists at that path. Correlating
    file activity from the registry-writing process and its children usually surfaces the dropped payload, since it typically
    lands in the same session as the registry write. The file-write event carries no hash; if the payload is present, hash
    it from a later execution or retrieve it for a reputation lookup. Reboot survival is a judgment from the value data and
    its re-modification history, since key deletion is not observable here.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this telemetry command key been modified before on this host?
  context: A first-time modification is more suspicious than a routine one. The AppCompatFlags\TelemetryController Command
    value should almost never change on a normal host, so zero or very low history indicates a key that has not been touched
    before. Compare the historical Details values to see whether the same data is routinely set or this write is unique.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same modification across multiple hosts may indicate a management push or widespread implant deployment; a
    single affected host suggests targeted activity. Compare the Details values across hosts to see whether the same payload
    path is being set fleet-wide or each host carries a distinct command.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What other process activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity in a tight window around the registry write reveals
    what led to it and what followed - reconnaissance, privilege escalation, or the tooling used to stage the payload. Novel
    parent-child pairs stand out against the repetitive agent and service noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, or credential access - may reveal the
    attack stages that preceded the persistence write and help reconstruct the timeline. Persistence is often installed
    after an initial foothold and privilege escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single persistence mechanism. After configuring the telemetry Command value, they
    commonly install backup footholds using scheduled tasks, services, registry Run keys, BITS jobs, or WMI. Multiple
    persistence installations in the same timeframe indicate intentional stacking rather than isolated administration.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations such as the Startup folder or scheduled-task definition paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into a Startup
    folder or a path referenced by a registry Run key achieves persistence without any persistence tool running. File event
    monitoring captures these drops even when the attacker avoids standard tooling, revealing parallel footholds.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for this registry change?
  context: Registering a command under the telemetry controller key is the kind of system modification that a mature
    environment would authorize through change management, if it is done at all. A corresponding ticket suggests sanctioned
    activity; the absence of one when policy requires it points toward unauthorized persistence. This check can quickly close
    a false positive or escalate a true one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
