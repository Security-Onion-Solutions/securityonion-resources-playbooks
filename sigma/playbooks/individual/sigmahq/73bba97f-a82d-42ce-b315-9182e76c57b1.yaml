name: Imports Registry Key From a File
id: dc899ce2-3d4a-4205-94e9-fbc9ff0ea3cd
description: |
  Detects regedit.exe importing registry data from a file, where the command line contains an import switch
  (/i or /s) or a .reg file reference, AND does not match the export switches or the alternate-data-stream path
  pattern that the rule filters out. Importing a .reg file writes arbitrary registry keys and values in one
  action, which is a common way to install persistence (Run keys, services), reapply or weaken security policy,
  or relocate configuration during legitimate administration; it is also a low-effort way for an operator to
  apply a prepared registry payload without typing individual reg add commands. Investigation should establish
  who ran the import, what file was imported and what keys it wrote, whether the parent chain and user are
  expected, and whether the change is a known persistence or evasion location.
type: detection
detection_id: 73bba97f-a82d-42ce-b315-9182e76c57b1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show regedit.exe importing a registry file with an import switch or a .reg reference?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires when the
    process is regedit.exe (by image name or original filename REGEDIT.EXE) AND the command line contains an
    import switch (/i or /s) or a .reg reference, AND it is not an export operation and not an import from an
    alternate data stream. Review the returned image, original filename, and full command line to verify which
    file was imported and that this is a genuine import rather than a benign command-line collision.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to import registry data with regedit.exe?
  context: Importing a .reg file is a routine administrative action in some environments (software deployment,
    configuration baselining) and unusual in others. Knowing whether the user role and host function are
    consistent with hands-on registry administration is often the fastest path to distinguishing an authorized
    change from operator activity. Regedit.exe is not normally launched interactively by standard end users.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Was there a change ticket, maintenance window, or documented approval for this registry import?
  context: Many organizations require change tickets for registry modifications, especially those that affect
    persistence, security policy, or service configuration. A corresponding ticket suggests authorized
    deployment activity; absence of one when policy requires it suggests the import was unauthorized. This check
    can quickly close false positives or escalate true positives.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry file was imported and which keys and values did it write, and are these known persistence or evasion locations?
  context: The imported file determines intent. Identify the .reg file path from the command line, then determine
    which keys it wrote. Run/RunOnce keys and Services keys indicate persistence; keys under Windows Defender or
    firewall policy paths indicate security tampering; Image File Execution Options keys indicate debugger-based
    hijacking. Because the import happens in one process, the registry write events linked to this process show
    the actual key paths and value data rather than requiring them to be parsed from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned regedit.exe, and is that parent chain expected for a registry import?
  context: The parent process reveals how the import was launched. A launch from explorer.exe or a deployment
    agent differs sharply from a launch by a script host, an Office application, or a remote-execution
    mechanism. Tracing the parent's own origin shows whether the chain is an interactive administrator action or
    an automated or scripted invocation. The technique's tuning commonly allowlists regedit.exe and msiexec.exe
    as legitimate registry writers, so the parent and lineage are what separate routine use from abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did the same parent spawn around this time?
  context: If a suspicious parent spawned regedit.exe, it likely spawned other processes too. Examining sibling
    processes reveals the full scope of activity from that parent. Multiple registry, scheduling, or service
    tools spawned by the same parent within a short window points to a staged configuration change rather than an
    isolated import. The host.name scope is included because the parent identifier may be unavailable.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is the parent that launched regedit.exe a signed, expected binary, or an unsigned or unusual launcher?
  context: The technique's tuning flags unsigned executables or abnormal parent-child lineage performing registry
    modification. A regedit.exe import launched by a signed deployment agent or by explorer.exe under an
    administrator differs from one launched by an unsigned binary running from a user-writable path. Review the
    parent image path, its signing status, and where it lives on disk to judge whether the launcher itself is
    trustworthy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Hashes
- question: Were other registry write operations performed on this host in the same session?
  context: An operator who imports one registry file often makes several related changes -- for example setting a
    Run key for persistence and also disabling a security setting. Finding clusters of registry write operations
    from reg.exe and regedit.exe on the same host within a short window reveals the full scope of the
    configuration changes and whether multiple objectives were pursued beyond the single triggering import.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Does the imported registry change reference an executable or script, and is that file present on disk?
  context: A registry import is only an active persistence mechanism if the referenced payload exists at the path
    written to the registry value. If the import wrote a Run key or service pointing to an executable in a
    user-writable path, checking whether that file exists and analyzing its hash determines whether the
    persistence is live and what it would execute on next logon or service start.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%file_paths%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What processes started on this host shortly after the registry import?
  context: A registry modification often takes effect through a follow-on action -- a service restart, a process
    relaunch, or a logon that reads the newly written key. Reviewing what executed in the window after the import
    helps confirm whether the change was activated and what it caused to run. Unexpected interpreters or tooling
    started right after the import point to the change being part of an operator workflow.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folder or scheduled-task definition paths on this host around this time?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into
    the Startup folder or into a path referenced by a registry Run key achieves persistence without an additional
    persistence tool. File event monitoring captures these drops even when the operator avoids running reg or
    schtasks, and they may accompany or replace the registry change written by the import.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even routine registry imports recur on a host. The query mirrors the rule's selection scoped to this
    host, so the resulting parent and user distribution reflects how this specific firing pattern has
    historically run here rather than generic regedit.exe usage. A new parent process, an unexpected user
    account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - ' /s '
        - .reg
      filter_1:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      filter_2:
        CommandLine|re: :[^ \\]
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not all of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - ' /s '
        - .reg
      filter_1:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      filter_2:
        CommandLine|re: :[^ \\]
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not all of filter_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - ' /s '
        - .reg
      filter_1:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      filter_2:
        CommandLine|re: :[^ \\]
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not all of filter_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope of the operation may be
    larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - ' /s '
        - .reg
      filter_1:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      filter_2:
        CommandLine|re: :[^ \\]
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not all of filter_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    import pattern rather than generic regedit.exe usage. Many hosts firing the same pattern points to scripted
    deployment or a shared baseline image; one host or a small unrelated set points to manual operator activity.
    Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \regedit.exe
      - OriginalFileName: REGEDIT.EXE
      selection_cli:
        CommandLine|contains:
        - ' /i '
        - ' /s '
        - .reg
      filter_1:
        CommandLine|contains|windash:
        - ' -e '
        - ' -a '
        - ' -c '
      filter_2:
        CommandLine|re: :[^ \\]
      condition: all of selection_* and not all of filter_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or credential access -- may
    reveal the attack stages that preceded the registry import and help reconstruct the timeline. The sequence of
    alerts often shows how an operator reached the point of writing registry persistence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
