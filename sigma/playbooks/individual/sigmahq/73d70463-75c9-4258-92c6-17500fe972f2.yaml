name: Winnti Pipemon Characteristics
id: 05da32aa-13c4-4e23-8b59-30c3879abd12
description: |
  Detects process creations whose command line matches either of two argument patterns used by the
  Pipemon backdoor's staged installer: a command line containing `setup0.exe -p`, or one containing
  `setup.exe` that also ends in `-x:0`, `-x:1`, or `-x:2`. The first pattern is a launcher passing a
  decryption password to a first-stage installer that was extracted into a randomly named directory
  under the temporary path; the second is the extracted stage selecting a privilege mode, where
  `-x:1` and `-x:2` request driver-load privilege and `-x:2` is started under a spoofed parent.
  Legitimate setup programs occasionally use similar flags, so the investigation should establish
  which branch fired, recover the full argument set and the installer's origin, and determine
  whether loader DLLs were dropped under the print spooler's processor directories and registered
  through print processor registry values for persistence.
type: detection
detection_id: 73d70463-75c9-4258-92c6-17500fe972f2
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the command line match either of the two argument patterns this rule detects?
  context: >-
    The rule fires when at least one branch matches: a command line containing `setup0.exe -p`, or a
    command line containing `setup.exe` that also ends in `-x:0`, `-x:1`, or `-x:2` (that branch
    requires both conditions together). Read the full command line and record which branch fired,
    because the branch determines what to chase next. A `-p` branch fire points at an archive
    extraction driven by a per-sample password, so the password value and the extraction directory
    are the artifacts to recover. An `-x:n` branch fire points at an installer selecting a privilege
    path, so the specific mode and the parent process are the artifacts to recover.
  range: +/-30d
  answer_sources:
  - alert
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to run software installers that pass password or elevation-mode arguments?
  context: >-
    Packaged installers that take a password argument or an elevation-mode switch are normal on
    build machines, software-packaging hosts, and developer workstations, and unusual on a general
    user endpoint with no install activity scheduled. Knowing whether the account and the host
    function fit an install workflow is often the fastest way to separate a routine setup from an
    unattended one.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this installer execution part of an authorized penetration test or red team engagement?
  context: >-
    Staged loaders and password-protected payload droppers are also used in authorized security
    assessments. Check whether a pentest or red team exercise is currently active on this host or
    network segment. An authorized engagement whose tooling and timing match this execution resolves
    the alert without further analysis.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or an administrator recall installing software on this host around this time?
  context: >-
    The documented false-positive path for this rule is a legitimate setup program that happens to
    use the same argument structure. Direct confirmation from the person behind the account — what
    was being installed, where the package came from, and why — usually settles that faster than log
    analysis. If nobody recalls it, treat the installer's origin as unknown and trace how the file
    reached the host.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which password or elevation-mode argument was passed to this installer?
  context: >-
    The argument selects the behavior. `-p` supplies a per-sample password used to extract a
    password-protected archive embedded in the launcher. In this family, `-x:0`, `-x:1`, and `-x:2`
    select how the installer obtains privilege: `-x:1` and `-x:2` enable driver-load privilege, and
    `-x:2` is additionally started under a spoofed parent. The exact argument tells you what
    privilege was requested and therefore how far the response has to reach.
  range: +/-30d
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files did this installer write to disk on this host?
  context: >-
    This family's launcher extracts a password-protected archive into a randomly named directory
    under the temporary path, and the installer stage drops payload loader DLLs into the print
    spooler's processor directories under `\Windows\System32\spool\prtprocs\`. Enumerating
    everything the process wrote gives you the file set to hash, submit, and hunt for elsewhere, and
    it survives the original process exiting. File writes carry no hash, so pivot each dropped path
    to its later execution or load event for the hash.
  range: +1h
  answer_sources:
  - file_event
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What exactly did this installer do across the setup0.exe and setup.exe stages on this host?
  context: >-
    The staged pattern normally runs as two invocations seconds apart: a launcher writes an
    extracted first-stage installer into a randomly named temporary directory and runs it with `-p`
    plus a decryption password, and the extracted stage then runs with `-x:n`. Reading both command
    lines together, with the working directory, recovers the password, the extraction path, and the
    privilege mode, none of which a single event shows on its own. The rule constrains only the
    command line, so this query is scoped by the setup0.exe / setup.exe command-line strings rather
    than by an image path.
  range: +/-5m
  answer_sources:
  - process_creation
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_cli:
        CommandLine|contains:
          - setup0.exe
          - setup.exe
      condition: selection and selection_cli
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process launched this installer, and is that parent chain expected?
  context: >-
    The parent shows how the installer was invoked: an interactive shell, a browser download path,
    or a software-deployment agent each imply a different story. One branch of this family's
    installer is started under a spoofed parent, so a plausible-looking parent does not by itself
    clear the alert. Corroborate with the parent's own command line and start time, and check
    whether the parent could actually have produced this child.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which DLLs did this process load, and were any loaded from a non-standard directory or carrying an unexpected signer?
  context: >-
    The installer stage of this family loads a companion DLL from its own extraction directory
    rather than from a system path, and the loader DLLs it installs have been signed with a stolen
    code-signing certificate. Compare each loaded module's path against the directories legitimate
    software loads from on this host, and read the signer name rather than only the signature
    status. DLL load events carry the module hash directly, so unfamiliar modules can be hashed and
    checked without waiting for an execution event.
  range: +/-15m
  answer_sources:
  - process_creation
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Were registry values written on this host that redirect which DLL a system service loads?
  context: >-
    This family persists by registering a print processor whose `Driver` value names a loader DLL
    dropped under the spooler's processor directory; the print spooler service then loads that DLL
    at every service start, under SYSTEM, without a scheduled task or Run key. Compare the print
    processor, print monitor, and service DLL values written in this window against what this host
    had before, and treat an unfamiliar entry pointing at a recently dropped file as the link
    between the installer and persistence. Value deletion is not visible in this telemetry, so
    absence of a cleanup event says nothing about whether an entry is still present.
  range: +/-4h
  answer_sources:
  - registry_event
  - asset_inventory
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Control\Print\Environments\'
          - '\Control\Print\Monitors\'
          - '\Print\Components\'
          - '\CurrentControlSet\Services\'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: When this host has previously produced either of the rule's argument patterns, what parents and users drove that activity?
  context: >-
    The query mirrors the rule's two selection branches scoped to this host, so the parent/user
    distribution reflects how this specific argument pattern has run here before, not installer
    activity in general. A recurring packaging or deployment parent with a stable account points at
    the documented false-positive path. A first-ever occurrence, a new parent, or an account that
    has never driven this pattern is the deviation worth chasing.
  range: -14d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: setup0.exe -p
      selection_2:
        CommandLine|contains: setup.exe
        CommandLine|endswith:
        - -x:0
        - -x:1
        - -x:2
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced either of the rule's argument patterns, and does that history fit their role?
  context: >-
    The query mirrors the rule's two selection branches scoped to this user, so the result is the
    account's 90-day history of this specific pattern, aggregated by host, rather than generic
    installer usage. An account that routinely produces it across packaging or lab hosts reads
    differently from one that has never produced it. Weigh the count against the user's role and
    normal toolset.
  range: -90d
  answer_sources:
  - process_creation
  - organizational_knowledge
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: setup0.exe -p
      selection_2:
        CommandLine|contains: setup.exe
        CommandLine|endswith:
        - -x:0
        - -x:1
        - -x:2
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this parent process historically driven either of the rule's argument patterns on this host or across the environment?
  context: >-
    When the alert fires under SYSTEM or a machine account, user identity attributes nothing and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's two selection branches
    scoped to the alerting parent process, so the result is the 90-day history of this parent
    driving this pattern, aggregated by host. A parent that already accounts for the pattern on many
    hosts is deployment automation; a parent that is new for this pattern is the deviation.
  range: -90d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: setup0.exe -p
      selection_2:
        CommandLine|contains: setup.exe
        CommandLine|endswith:
        - -x:0
        - -x:1
        - -x:2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the same
    identity drove activity on more than one endpoint, which sets the scope of the investigation. If
    the alert fired under a service principal or machine account, expect this to return routine
    agent telemetry and read the parent-scoped fleet question instead.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, a user-scoped fleet sweep returns agent telemetry from every host and
    answers nothing. The query mirrors the rule's two selection branches scoped to the alerting
    parent process, fleet-wide, within the alert window. Several hosts in the same window points at
    scheduled or pushed deployment; a single host points at a host-local trigger and narrows the
    initial scope.
  range: +/-1h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: setup0.exe -p
      selection_2:
        CommandLine|contains: setup.exe
        CommandLine|endswith:
        - -x:0
        - -x:1
        - -x:2
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The aggregation collapses repetitive agent and service telemetry into high-count rows while
    novel parent-child pairs stand out at low counts. Look for the launcher that wrote the
    installer, the extracted stage running from a temporary directory, and anything the installer
    started afterward. This window is also where the file, registry, and module-load steps of the
    technique line up in time.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  - registry_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts produced either of the rule's argument patterns in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's two selection branches with no host scope, so the result is a
    fleet-wide count of this argument pattern rather than generic installer usage. Many hosts
    producing it points at a packaged deployment matching the rule's false-positive path; one host,
    or a small unrelated set, points at operator-driven activity and sets the containment scope.
  range: -7d
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains: setup0.exe -p
      selection_2:
        CommandLine|contains: setup.exe
        CommandLine|endswith:
        - -x:0
        - -x:1
        - -x:2
      condition: 1 of selection_*
    fields:
    - host.name
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    The persistence this family installs is registry-driven and leaves no command-line trace, but
    operators rarely rely on a single mechanism. Scheduled tasks, services, Run keys, or BITS jobs
    created in the same window as the installer indicate stacked footholds rather than an isolated
    administrative action. Each mechanism found here needs its own removal step.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
