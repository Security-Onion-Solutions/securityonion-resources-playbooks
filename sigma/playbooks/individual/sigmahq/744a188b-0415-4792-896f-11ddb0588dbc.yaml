name: Potential Process Injection Via Msra.EXE
id: b914e6c5-174c-4f50-b5b5-58eee42d6f0a
description: |
  Detects discovery and administrative binaries (arp.exe, cmd.exe, net.exe, netstat.exe, nslookup.exe, route.exe, schtasks.exe, whoami.exe) spawned by Microsoft Remote Assistance (msra.exe). The rule fires when msra.exe is both the parent image and its own command line, AND it spawns one of the listed binaries. Msra.exe legitimately runs only during interactive Remote Assistance sessions and rarely launches command-line tools; when an unrelated process injects into msra.exe, the discovery commands it runs appear as children of msra.exe. The investigation should determine whether msra.exe was driven by a real Remote Assistance session, confirm or rule out injection into the msra.exe process, and characterize the child command and any surrounding reconnaissance, persistence, or network activity.
type: detection
detection_id: 744a188b-0415-4792-896f-11ddb0588dbc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Did msra.exe spawn the alerting child, and is the child one of the discovery or administrative binaries this rule watches for?
  context: Confirm the alert is a true positive by reviewing the exact event. The rule requires msra.exe as both the parent image and parent command line, AND a child whose image ends in arp.exe, cmd.exe, net.exe, netstat.exe, nslookup.exe, route.exe, schtasks.exe, or whoami.exe. Verify the parent is genuinely msra.exe and read the child command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
- question: Is this host running an interactive Remote Assistance session, and is the user expected to drive msra.exe to launch command-line tools?
  context: Msra.exe normally runs only when a user starts a Remote Assistance session. If no session was active and the host or user is not associated with remote-support workflows, the parent context is unexplained. Check whether the user role and host function are consistent with interactive remote assistance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did the child command do? Decode its full command-line arguments.
  context: The child command line reveals the specific action taken inside the msra.exe context. Decode flags, parameters, target hosts, and any encoded or chained content. Discovery binaries such as arp, net, netstat, nslookup, route, and whoami map to network and system enumeration; cmd.exe may carry a longer chained command; schtasks.exe configures persistence. Identify what the operator was attempting to learn or establish.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: If the alerting child was schtasks.exe, what task was created and what command does it execute?
  context: When the child is schtasks.exe, the command line contains the task name, schedule, and the command or program to run. Identify the task name (/TN), the executed command (/TR), the schedule type (/SC, e.g. ONLOGON, MINUTE, DAILY), and the run-as account (/RU, where SYSTEM is high-risk). Injected msra.exe processes are documented to drop randomly-named persistence tasks, so the task payload often points to the staged binary or script. If the child was not schtasks.exe, this question does not apply.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What started the msra.exe parent, and is that origin consistent with a real Remote Assistance session?
  context: Legitimate msra.exe is started by user action through the Remote Assistance UI or a support workflow. Tracing the msra.exe process back to its own parent (grandparent) shows whether the chain is a genuine interactive session or whether msra.exe was launched and then hijacked. A loader such as regsvr32.exe or rundll32.exe in the ancestry, or msra.exe running from a non-interactive context, points away from a real session.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other child processes did this same msra.exe instance spawn?
  context: An injected msra.exe typically runs a sequence of discovery and tooling commands, not a single one. Listing every child of this exact msra.exe instance reveals the full scope of activity driven through it. Multiple discovery binaries, a persistence tool, and network utilities spawned from one msra.exe strongly indicate scripted post-injection enumeration rather than an isolated command.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did another process call injection-capable APIs against msra.exe around the alert time — WriteProcessMemory, QueueUserAPC, or SetWindowsHookEx?
  context: Process injection requires the source process to write code into the target and start it executing, typically via WriteProcessMemory paired with QueueUserAPC or a remote thread, or via a SetWindowsHookEx hook chain. Reviewing behavioral API-call telemetry for this host surfaces which process invoked these calls; a source process other than msra.exe itself calling one of these APIs in this window is the direct evidence of the injection this rule infers from the child commands.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        event.dataset: endpoint.events.api
        process.Ext.api.name:
          - WriteProcessMemory
          - QueueUserAPC
          - SetWindowsHookEx
      condition: selection
    fields:
      - process.executable
      - process.Ext.api.name
      - Image
- question: Were unexpected modules loaded into msra.exe around the alert time?
  context: After injection, attacker code in msra.exe frequently pulls in modules it would never load during a normal Remote Assistance session, and discovery commands run from the injected context. Reviewing image-load events for the msra.exe process surfaces unsigned or unusual DLLs and unexpected library loads that accompany injected execution. If image-load telemetry is not collected in this environment, treat zero results as a visibility gap rather than evidence nothing loaded, and rely on the process-access and child-command evidence instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: '\msra.exe'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single discovery command may be routine, but several reconnaissance binaries running in quick succession is a signature of post-compromise enumeration. Injected msra.exe is documented to run a burst of discovery commands (whoami, arp, net, netstat, nslookup, route) to map the host and network before the next stage. Three or more distinct discovery binaries within the window points to automated enumeration rather than ad-hoc troubleshooting.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\route.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: What outbound network connections did msra.exe make around the alert time?
  context: Msra.exe in a real Remote Assistance session connects to the peer endpoint, but an injected msra.exe is documented to carry command-and-control and to perform collection activity. Outbound connections from msra.exe to external hosts, especially on uncommon high ports, indicate the injected process is communicating rather than serving an interactive session. Correlate the destinations with the timing of the child discovery commands.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\msra.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \msra.exe
        ParentCommandLine|endswith: msra.exe
        Image|endswith:
        - \arp.exe
        - \cmd.exe
        - \net.exe
        - \netstat.exe
        - \nslookup.exe
        - \route.exe
        - \schtasks.exe
        - \whoami.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \msra.exe
        ParentCommandLine|endswith: msra.exe
        Image|endswith:
        - \arp.exe
        - \cmd.exe
        - \net.exe
        - \netstat.exe
        - \nslookup.exe
        - \route.exe
        - \schtasks.exe
        - \whoami.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar msra.exe-parented activity on other hosts, the scope is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \msra.exe
        ParentCommandLine|endswith: msra.exe
        Image|endswith:
        - \arp.exe
        - \cmd.exe
        - \net.exe
        - \netstat.exe
        - \nslookup.exe
        - \route.exe
        - \schtasks.exe
        - \whoami.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is this msra.exe-to-discovery-binary spawning pattern occurring on other hosts?
  context: The same parent-child relationship appearing on multiple hosts suggests a wave of injected msra.exe activity rather than a single targeted endpoint. Enterprise-wide comparison calibrates severity and identifies the scope of any compromise. A single occurrence is more likely targeted or a one-off.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — a loader execution, defense tampering, or a download cradle — may reveal the stages that preceded the injection and help reconstruct the timeline. Process injection into msra.exe is typically downstream of an initial loader, so a preceding regsvr32 or rundll32 alert is especially relevant.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What other activity occurred on this host around the time of the alert?
  context: Examining activity around the alert reveals what led to this event, what happened after, and whether it is part of a larger sequence. Novel parent-child pairs stand out at low counts against the repetitive baseline of agent telemetry. Look for loader execution, additional persistence, or credential-access tooling near the alert time.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
