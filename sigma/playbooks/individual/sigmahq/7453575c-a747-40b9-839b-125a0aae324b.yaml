name: APT29 2018 Phishing Campaign CommandLine Indicators
id: 6c476830-a124-4abc-82b3-0d082832c81a
description: |
  Fires when a process command line matches either of two literal indicator patterns: a PowerShell
  invocation containing `-noni -ep bypass $` — non-interactive, execution-policy bypass, immediately
  followed by a variable assignment — or a command line containing both `cyzfc.dat,` and
  `PointFunctionCall`, which is rundll32.exe running a named export out of a specific DLL filename.
  Only one branch has to match for the rule to fire. Both branches are literal string matches on
  specific indicator values rather than behavioral heuristics, so a hit is either the indicator
  itself or a benign string collision, and the branch that matched determines what to investigate:
  the PowerShell branch points at decoded script content, the rundll32 branch at proxy execution of
  a module through a signed system binary (T1218.011). Confirm which pattern matched, decode the
  full command line, and establish whether the referenced module was written to a user-writable
  path, what it loaded, and whether the process reached an external host.
type: detection
detection_id: 7453575c-a747-40b9-839b-125a0aae324b
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting command line match either indicator pattern this rule detects, and which of the two matched?
  context: >-
    The rule fires on either of two alternative branches, and which one matched drives the rest of
    the investigation. One branch matches a PowerShell command line containing `-noni -ep bypass $`;
    the other matches a command line containing both `cyzfc.dat,` and `PointFunctionCall`, which is
    rundll32.exe invoking that export. Note the branch that fired — a PowerShell match points the
    work at the decoded script content, while the rundll32 match points it at the module on disk,
    its origin, and its network activity. Both are literal strings, so rule out a benign collision
    before escalating.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run PowerShell with an execution-policy bypass, or to execute module exports through rundll32.exe?
  context: >-
    Legitimate administrative scripting and installer activity both produce execution-policy
    bypasses and rundll32 invocations. Knowing whether the user's role and the host's function
    account for that activity is often the fastest way to separate routine operations from the
    literal indicator this rule matches.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling reproduces the same loader and proxy-execution patterns this rule matches,
    including execution-policy bypasses and rundll32 export calls, and assessment payloads are
    sometimes staged with the exact filenames published in public reporting. Check whether an
    assessment is active on this host or network segment; an authorized engagement with matching
    timing and scope resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What specific capability was invoked — which PowerShell expression was assembled and run, or which module export was called?
  context: >-
    The command-line arguments identify the operation. On the PowerShell branch, the text after the
    `$` is a variable assignment feeding a decode-and-invoke expression; reconstruct what it
    resolves to, watching for string concatenation used to assemble method names. On the rundll32
    branch, the export name `PointFunctionCall` and the full module path identify the payload's
    entry point and where it lives on disk.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: Are the file artifacts these indicators reference present on the host?
  context: >-
    The rundll32 branch names a module by filename, which means the file existed on disk before it
    was executed. Files written by the alerting binary in the hour after execution reveal whether a
    payload, a decoy document, or staging output landed on the host and in which directory —
    user-writable locations such as the local AppData and temp trees are the ones to check against
    the referenced filename.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What exactly did the matching command do? Decode the command-line arguments in full.
  context: >-
    The query returns every command line on this host that matches either indicator branch inside
    the alert window, so if both stages ran they appear together. Decode any base64 or
    string-concatenation obfuscation, resolve the variable assignment on the PowerShell branch, and
    record the full module path and export name on the rundll32 branch. The working directory shows
    where the process was launched from.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this one, and is that parent chain expected?
  context: >-
    The parent identifies how the command was invoked. A shortcut file, an archive utility, a
    browser, or an Office application as the launcher is a different situation from explorer.exe or
    a management agent. Walk up from the parent to see what started it; a parent with no plausible
    business reason to launch a script host or rundll32 is the deviation worth chasing, and a
    trusted installer parent is the most common benign explanation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Which modules did the alerting process map into memory, and are they signed?
  context: >-
    Proxy execution through a signed system binary works by mapping an unusual or unsigned module
    into that binary's process. The modules loaded by the alerting process, with signature status
    and hashes, show whether something outside the normal set for this binary was mapped; a baseline
    of the modules rundll32 legitimately loads in this environment is what makes the outlier
    visible. Module loads carry hashes on the load event itself, so reputation can be checked
    directly.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
  answer_sources:
  - manual_review
  - external_threat_intel
- question: Did the alerting process connect to an external host, and to what address and port?
  context: >-
    Proxy execution through a signed binary is frequently followed by outbound traffic from that
    binary, either to retrieve a further payload or to reach a controller. Connections from the
    alerting process, with destination address, port, and direction, show whether egress occurred.
    Compare the destination against the external address ranges and domains that are normal here —
    a signed system binary reaching an unfamiliar external address is the deviation, not the
    connection itself.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
  - external_threat_intel
- question: What child processes did the alerting process spawn afterward?
  context: >-
    The processes spawned reveal the operation's actual effect. A script host that spawns
    rundll32.exe, or a rundll32 instance that spawns a command shell or another script host,
    indicates the next stage ran. The query is anchored on the alerting process's own identifier,
    so it returns only its direct children rather than every execution of the same binary.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity in the fifteen minutes either side of the alert collapses routine
    agent telemetry into high-count rows while novel parent-child pairs stand out at low counts.
    Tying the alerting invocation to module loads, file writes, and network activity that fall
    within a short window of each other is what establishes whether separate events belong to one
    operation.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — a download, an archive
    extraction, a shortcut execution, or script-host activity — may show the stages that preceded
    this one and help reconstruct the timeline. An empty result narrows the entry point to something
    that produced no detection at all.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: When this host has previously matched these indicator patterns, what parents and users drove that activity?
  context: >-
    The query mirrors the rule's indicator branches scoped to this host, so the parent and user
    distribution reflects how these specific patterns — not generic PowerShell or rundll32 usage —
    have run here before. For a literal indicator match, any prior history is notable: it usually
    means either a recurring benign string collision from a deployed script, or that the activity
    has been present longer than this single alert suggests.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced either indicator pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's indicator branches scoped to this user across all hosts, so the
    result is the user's 90-day history of these specific patterns rather than generic use of a
    script host. A user with no prior history is a different situation from one who produces the
    pattern regularly; weigh the count against the user's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven these indicator patterns here or elsewhere, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior;
    the launch mechanism does. The query mirrors the rule's indicator branches scoped to the
    alerting parent process over 90 days, aggregated by host. A parent that already accounts for
    many prior events is vendor or operating-system automation; a new or rare parent for this
    pattern is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the user's activity across all hosts in the hour either side of the alert shows whether
    the same account was active on other endpoints, which bounds the scope. If the alert fires under
    SYSTEM, a service account, or a computer account, this returns broad agent telemetry rather than
    an attributable answer — in that case rely on the parent-process pivot instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, a user-based pivot returns agent-telemetry noise. The meaningful
    question is whether the same launch mechanism produced the same indicator match elsewhere: the
    query mirrors the rule's indicator branches scoped to the alerting parent process, fleet-wide,
    inside the alert window. Multiple hosts in the same window points to pushed or scheduled
    automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: Have other hosts matched these indicator patterns in the past week, and what does the cross-host distribution look like?
  context: >-
    The query mirrors the rule's indicator branches with no host scope, giving a fleet-wide count of
    these specific patterns rather than the generic footprint of the binaries involved. For literal
    indicator strings, a wide spread across unrelated hosts usually means a benign collision or a
    deployed script that happens to carry the text; one host, or a small set that shares a role,
    is consistent with targeted delivery. Use the distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - CommandLine|contains: -noni -ep bypass $
      - CommandLine|contains|all:
        - cyzfc.dat,
        - PointFunctionCall
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
