name: Lace Tempest Malware Loader Execution
id: cc8a06d5-90a9-4311-b129-795d57c767b7
description: |
  Fires when a process starts that matches either of two independent criteria: an executable path ending in
  `:\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe`, or a file hash of
  SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D. Both criteria describe the same malware loader —
  one by the location it is dropped to inside a Tomcat web-application directory, the other by the exact binary — and either
  match alone is sufficient, so the branch that fired tells the analyst whether the file was identified by where it sits or by
  what it contains. Loaders like this typically run briefly, unpack or decrypt a payload, inject it into a long-running system
  process such as msiexec.exe or svchost.exe, and then remove themselves and the archive they came from; the investigation
  should establish what launched the binary, what it spawned or injected into, and what remains on disk to recover.
type: detection
detection_id: 745ea50b-9673-4ba7-9426-cb45cf4a8e6d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting process match this rule either by its executable path or by its file hash, and which of the two fired?
  context: >-
    The rule matches on two independent criteria and needs only one of them: an executable path ending in
    `:\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe`, or a Hashes value containing
    SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D. Note which branch fired, because it changes what
    matters next. A path-only match means a file sitting at the known drop location whose contents differ from the known
    sample, so establishing what the binary actually is carries the weight. A hash-only match means the exact known binary
    running from somewhere else, which makes its path and its parent the load-bearing detail.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run executables from inside a Tomcat web-application directory, and is this account expected to launch them?
  context: >-
    Web-application directories under a Tomcat webroot hold served content; executables started from them are not part of
    normal serving. An application vendor that genuinely ships a helper binary there would run it under the application's own
    service account on a predictable trigger. An execution under a different account, or one with no matching change or
    maintenance record, does not fit that description and is worth carrying forward.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    Offensive tooling is also run during authorized security assessments, and an assessment demonstrating a file-upload path
    into a web-application directory would produce this alert. Check whether an engagement is active against this host or
    network segment and whether its scope and timing line up with the event. A confirmed match resolves the alert without
    further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What does this binary actually do when it runs, and were any arguments passed to it?
  context: >-
    This rule identifies the binary by location and hash rather than by its command line, so the capability question is about
    what the file is, not which subcommand ran. Establish that from the hash through reputation data or by detonating a copy in
    an isolated environment. Then read the command line: a loader invoked bare is consistent with a script simply running the
    dropped file, while arguments naming a payload file, a key, or an injection target hand over the next artifact to collect.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did this binary create, modify, or delete on the host after it ran?
  context: >-
    Loaders leave a short trail: the archive they were extracted from, a payload unpacked to disk before injection, and often
    a self-delete of both once the payload is running. Files touched by this process in the hour after execution identify what
    to recover for analysis. An absence of surviving artifacts is itself informative, pointing at in-memory execution or
    cleanup rather than at nothing having happened.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What exactly did this binary do — what was its full command line and working directory?
  context: >-
    The command line and working directory show how the binary was invoked and from where. Decode any flags, paths, or encoded
    content that appear. This query returns every execution of the binary on this host in the surrounding five minutes rather
    than only the alerting event, so repeated invocations that together form a single operation are visible.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this binary, and is that parent chain expected?
  context: >-
    The parent reveals how the execution was driven. A web-application server process, a script host, or a command interpreter
    as the parent of an executable inside a webroot indicates the invocation came through the served application rather than
    from an administrator at the console. Walk further up from the parent to establish where the chain originated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What child processes did this binary spawn afterward?
  context: >-
    Children reveal what the execution accomplished. A loader that injects into an existing process may spawn nothing at all,
    so an empty result does not close the question. Command interpreters, script hosts, or download utilities appearing as
    children instead point at a second stage being retrieved or at cleanup of the dropped files.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this host ever run this binary before?
  context: >-
    A binary at this location appearing for the first time is a different situation from one with months of history. Zero or
    very low counts over 90 days indicate first-time execution. A long history under a single account would instead suggest
    the file is a fixture of the application's own operation and shift the question toward when it first appeared.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: When this host has previously fired the rule's pattern, what parents and users drove it, and does the current alert fit that history?
  context: >-
    The query mirrors the rule's own selection criteria scoped to this host, so the resulting parent and user distribution
    reflects how this specific pattern has run here before rather than generic executable activity. A parent process or account
    that has never driven it is the deviation worth chasing. No prior history at all means this alert is the first occurrence
    on the host.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
      selection_hash:
        Hashes|contains: SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user account previously produced the rule's pattern, and does that history fit the account's role?
  context: >-
    The query mirrors the rule's selection criteria scoped to this user and aggregated by host, so the result is the account's
    90-day history of this specific pattern rather than its general activity. An account with no prior history here is more
    notable than one that produces it routinely. Weigh the count against what the account exists to do, keeping in mind that an
    application service account will look nothing like a human administrator.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
      selection_hash:
        Hashes|contains: SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern here or elsewhere, or is the parent new for this activity?
  context: >-
    When an alert fires under a service principal such as SYSTEM, a service account, or a computer account, the user field does
    not attribute the behavior and the launch mechanism becomes the meaningful pivot. This query scopes the rule's selection
    criteria to the alerting parent process over 90 days, aggregated by host. A parent that already accounts for a large volume
    of prior events is automation; a parent that has never driven this before is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
      selection_hash:
        Hashes|contains: SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user account do across the environment around this time?
  context: >-
    Tracking the account's activity on every host in the surrounding hour shows whether the same identity was active elsewhere,
    which would widen the scope past this server. If the alert fired under a service principal, this result is dominated by
    routine service and agent activity and should be read alongside the parent-mechanism pivot rather than on its own.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal, asking what the user did across the environment returns telemetry noise, because every host runs
    service-owned processes constantly. The meaningful question is whether the same launch mechanism produced this pattern
    elsewhere. The query scopes the rule's selection criteria to the alerting parent process, fleet-wide, within the alert
    window. Several hosts in the same window points to pushed or scheduled activity; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
      selection_hash:
        Hashes|contains: SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other tools ran on this host around the same time?
  context: >-
    A loader execution is one step in a sequence. Processes running in the surrounding fifteen minutes may show the application
    server process spawning command interpreters, commands enumerating installed security software, or scripts removing files.
    Each of those places the alert inside a larger operation and identifies further evidence to collect.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-child pair on the host in the surrounding fifteen minutes collapses routine service telemetry into
    high-count rows and leaves novel pairs standing out at low counts, which is what the analyst is scanning for. On a server,
    look in particular for the application service process appearing as the parent of interpreters or utilities it does not
    normally launch.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier alerts on the same host often show the stages that led here, such as an upload or exploitation attempt against the
    served application, a script host spawned by the server process, or checks for installed security software. Reconstructing
    that order tells the analyst whether this execution begins the activity or continues it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts fired the rule's pattern in the past week, and is the cross-host distribution isolated or widespread?
  context: >-
    The query mirrors the rule's selection criteria with no host scope, so the result is a fleet-wide count of this specific
    pattern rather than of generic executable activity. Several hosts running the same application firing the same pattern
    indicates the exposure is not limited to this server; a single host keeps the scope local. Use the distribution to decide
    how far to extend containment and hunting.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
        Image|endswith: :\Program Files\SysAidServer\tomcat\webapps\usersfiles\user.exe
      selection_hash:
        Hashes|contains: SHA256=B5ACF14CDAC40BE590318DEE95425D0746E85B1B7B1CBD14DA66F21F2522BF4D
      condition: 1 of selection_*
    fields:
    - host.name
  answer_sources:
  - process_creation
