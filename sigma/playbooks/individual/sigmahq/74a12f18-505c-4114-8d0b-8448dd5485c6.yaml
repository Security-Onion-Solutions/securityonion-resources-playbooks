name: PUA - Nimgrab Execution
id: 0787f557-633d-4fc2-8a1b-f804b163ac5d
description: |
  Detects execution of nimgrab.exe, a file-download utility bundled with the Nim programming framework, identified
  either by an Image path ending in nimgrab.exe OR by a process whose Hashes match the known MD5, SHA256, or IMPHASH
  values for the tool. The rule fires when at least one of those two branches matches, so a renamed or relocated copy
  is still caught by the hash branch even when the file name differs. Nimgrab pulls files from a remote URL over
  HTTP(S), which makes it a convenient ingress-transfer tool for retrieving additional payloads onto a host; legitimate
  use is limited to Nim developers building or testing software. Investigation should confirm what was downloaded and
  from where, whether the file landed and ran, and whether the user, host, and parent chain are consistent with
  legitimate Nim development rather than operator-driven tool staging.
type: detection
detection_id: 74a12f18-505c-4114-8d0b-8448dd5485c6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did this process fire on the nimgrab.exe file name, on the known nimgrab hash set, or both?
  context: The rule fires when at least one branch matches, either an Image path ending in nimgrab.exe OR a process whose MD5, SHA256, or IMPHASH equals the known nimgrab values. Confirm which branch fired by reading the Image path and the Hashes field. If only the hash branch matched, the binary has been renamed or relocated and the file name will not say nimgrab, which makes the signature and origin questions load-bearing. If only the name matched, treat an unexpected hash as a sign the file was replaced.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: Is this user and host expected to run a Nim file-download utility?
  context: Legitimate nimgrab use is limited to developers building or testing Nim software. Knowing whether the user role and host function involve Nim development is often the fastest path to separating a routine developer action from operator-driven tool staging on a general-purpose endpoint or server.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did nimgrab download? Read the full command line for the source URL and the destination path.
  context: The full command line carries the download target and where the file was written. Nimgrab takes a remote URL and a local destination, so reading the arguments reveals what was fetched and where it landed. A URL pointing at unfamiliar infrastructure, a raw IP, or a destination in a user-writable staging directory shifts the disposition toward tool delivery rather than development.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned nimgrab, and is that parent chain expected?
  context: The parent process reveals how nimgrab was invoked. Developer use typically descends from explorer.exe, a shell, or a build tool such as nim.exe or a terminal. Parents like mshta.exe, wscript.exe, powershell.exe, or an Office application point to scripted or macro-driven staging rather than interactive development. Tune out known-good updaters, then walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What external endpoint did nimgrab connect to, and is the destination internal or external infrastructure?
  context: Nimgrab establishes an outbound HTTP(S) connection to retrieve the requested file. The destination reveals whether the transfer targeted a recognized internal mirror or update host versus an external, unfamiliar, or raw-IP endpoint. Filter by internal against external address blocks to separate routine internal fetches from external tool retrieval, which is the higher-priority case for ingress transfer.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Where did the downloaded file land on disk, and is the drop path an uncommon staging location?
  context: Ingress transfer tools commonly write into user-writable staging directories rather than managed install paths. A file dropped into a world-writable or per-user profile location, for example a public profile directory or a temp folder, is a stronger signal of tool staging than a write into a managed application directory. Identify the destination written by nimgrab and judge whether the path is a routine location for this host.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Was the download successful? Check for file creation at the destination path.
  context: A nimgrab invocation does not guarantee the file was retrieved. Network errors, blocked URLs, or security controls may have stopped the transfer. Confirming file creation at the target path establishes whether the activity progressed past the delivery stage into a payload sitting on disk.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If the file nimgrab downloaded was executed, what is its hash and reputation?
  context: The hash for a reputation lookup is recorded when the payload runs, not when nimgrab writes it to disk — file-creation events carry no hash. nimgrab only fetches; the payload is usually run by the same shell as a sibling or child process, so this query returns those processes with their executable hashes — match the downloaded file name and submit its hash. If it was run later by an unrelated process, retrieve it from disk and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      selection_siblings:
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: 1 of selection_*
    fields:
      - Image
      - Hashes
      - Hashes
- question: Is the file referenced by the nimgrab command line still on disk for analysis?
  context: If the nimgrab command line names a download destination, checking whether that file still exists on disk enables deeper analysis, hash lookups, sandbox submission, or content review. The file path here is derived from the command line itself.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other file activity occurred in the download target directory?
  context: Operators often download multiple files to the same staging directory, or the first file triggers further writes through extraction, decompression, or chained downloads. Examining directory-level file activity reveals the broader scope of the delivery rather than the single fetched file.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is nimgrab on the organization's approved software list for this host?
  context: Many environments scope developer toolchains such as Nim to specific build machines or developer workstations. Nimgrab running outside that approved footprint may represent shadow IT or operator-deployed tooling, regardless of the binary's benign reputation. An unauthorized presence on a general-purpose host should be checked even when the file is the genuine Nim utility.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket, build job, or developer activity that explains this nimgrab run?
  context: Legitimate nimgrab usage usually correlates with a documented build, a developer working on a Nim project, or a scheduled software task. If no such context exists for this execution, the tool may have been staged by an operator to pull additional payloads or by a user circumventing software controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does this host normally run nimgrab?
  context: A download utility that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a non-developer endpoint raises the priority of the download destination and payload.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit?
  context: Even a legitimate developer tool can be abused. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how this specific nimgrab firing pattern, by name or by hash, has historically run here rather than generic binary usage. A new parent process, an unexpected user account, or an unusual command structure is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \nimgrab.exe
      selection_hashes:
        Hashes|contains:
        - MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B
        - SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559
        - IMPHASH=C07FDDD21D123EA9B3A08EEF44AAAC45
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \nimgrab.exe
      selection_hashes:
        Hashes|contains:
        - MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B
        - SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559
        - IMPHASH=C07FDDD21D123EA9B3A08EEF44AAAC45
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \nimgrab.exe
      selection_hashes:
        Hashes|contains:
        - MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B
        - SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559
        - IMPHASH=C07FDDD21D123EA9B3A08EEF44AAAC45
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_name:
        Image|endswith: \nimgrab.exe
      selection_hashes:
        Hashes|contains:
        - MD5=2DD44C3C29D667F5C0EF5F9D7C7FFB8B
        - SHA256=F266609E91985F0FE3E31C5E8FAEEEC4FFA5E0322D8B6F15FE69F4C5165B9559
        - IMPHASH=C07FDDD21D123EA9B3A08EEF44AAAC45
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
