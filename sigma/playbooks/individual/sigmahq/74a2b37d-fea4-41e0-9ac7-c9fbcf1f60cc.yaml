name: WinRAR Creating Files in Startup Locations
id: 717e02dd-39c6-443b-9964-b32fa259b3d1
description: |
  Detects WinRAR.exe or Rar.exe writing a file into a per-user or system Startup folder. Extraction
  utilities have essentially no legitimate reason to place files there, and anything landing in Startup
  runs automatically at the next logon. Crafted archives that abuse WinRAR path-traversal handling
  (CVE-2025-6218, CVE-2025-8088) redirect an extracted payload outside the expected folder and into
  Startup to establish persistence. Investigation should confirm the drop, identify and triage the
  dropped payload, determine what launched WinRAR and how the archive reached the host, and check
  whether the payload has executed or additional persistence was staged.
type: detection
detection_id: 74a2b37d-fea4-41e0-9ac7-c9fbcf1f60cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Did WinRAR or Rar.exe create a file in a Startup folder, and what is the full path of the dropped file?
  context: Before investing investigation time, confirm the alert by reviewing the exact file path, the
    operation performed, and that the responsible process is WinRAR.exe or Rar.exe. An archive tool
    writing into a per-user or system Startup folder is the anomaly this rule keys on, and the dropped
    path is what will execute at the next logon.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to extract archives that place files into a Startup folder?
  context: Legitimate deployment tooling occasionally writes shortcuts into Startup, but it is almost
    never done by an archive utility. Knowing whether this user routinely extracts archives on this host,
    and whether the host has any software-deployment role, is often the fastest way to separate a benign
    extraction from exploitation of a crafted archive. When the user is a machine or service account,
    judge by the writing process and host role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What launched WinRAR, and is that parent chain expected? What started the parent?
  context: The parent reveals how the archive was opened. A mail client, browser, chat application, or a
    grandparent under Downloads or Temp points to a user opening a delivered archive, which is the typical
    delivery route for a crafted archive that abuses path traversal. Tracing the parent's own origin
    reconstructs how the archive reached the host.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What is the dropped Startup file, and what does it contain?
  context: Read the payload written to Startup. For scripts, check for base64 or otherwise obfuscated
    content, embedded URLs, IP addresses, and command sequences; for executables, check embedded strings,
    imports, packer signatures, and signing status. The file name may be disguised as a benign shortcut
    while the content is a loader or script that runs at logon. Content retrieval requires pulling the
    file from the endpoint.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: If the dropped file has executed, what is its hash and does it have known threat-intel detections?
  context: A file's hash is recorded when it runs, not when it is written, so file-creation events carry
    no hash. This looks for the dropped payload executing, which for a Startup drop typically happens at
    the next logon, and reads its hash to submit for a reputation lookup. If the file has not run yet,
    retrieve it from its on-disk Startup path and hash it manually before the next logon triggers it.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith|expand: '%TargetFilename%'
      selection_interpreter:
        CommandLine|contains|expand: '%TargetFilename%'
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
- question: Is the dropped file still in the Startup folder, or was it deleted or renamed after the alert?
  context: The payload's post-alert lifecycle drives both urgency and next steps. A file still present
    will execute at the next logon and can be retrieved, hashed, and analyzed now; a file deleted or
    renamed shortly after creation suggests cleanup or a staged swap and shifts focus to what ran in
    between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did WinRAR write or delete around the time of the alert?
  context: A path-traversal archive can drop several files in one extraction, the visible decoy the user
    expected plus one or more payloads redirected outside the extraction directory. The breadth and
    locations of the responsible process's other file writes reveal whether this is a single Startup drop
    or a multi-file extraction that placed payloads elsewhere as well.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the Startup folder recently, and by which processes?
  context: A small set of processes legitimately writes into Startup, installers and management tooling
    rather than archive utilities. Other recent arrivals in the same folder show whether this is an
    isolated drop or a location under active use, and which other artifacts may belong to the same
    activity. A single unfamiliar writer across several files is the signal to focus on.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Start Menu\Programs\Startup\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Were other files dropped to Startup or Run-key paths on this host?
  context: File-based persistence bypasses command-line detection entirely. Beyond the Startup folder that
    fired this alert, check whether other files were written to additional Startup locations or to paths
    referenced by registry Run and RunOnce keys, which would indicate stacked or redundant persistence
    placed without running standard persistence tools.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Were other process-based persistence mechanisms installed on this host around the same time?
  context: Attackers rarely rely on a single foothold. After a Startup drop, backup persistence is commonly
    installed with different techniques, scheduled tasks, services, registry Run keys, or BITS jobs.
    Executions of these persistence tools in the same timeframe indicate deliberate stacking rather than
    an isolated event.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- always_include: true
  question: Has this user previously produced this Startup-drop pattern, and does that history fit their role?
  context: The query counts this user's prior file writes matching the rule's exact pattern, WinRAR or
    Rar.exe writing into a Startup folder, aggregated by host. A user who has never produced this pattern
    is more notable than one who does so routinely; weigh the count against the user's role. A machine or
    service account producing this pattern points to automation rather than an interactive user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \WinRAR.exe
        - \Rar.exe
        TargetFilename|contains: \Start Menu\Programs\Startup\
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven this Startup-drop pattern here or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the
    behavior; the launch mechanism does. This counts the 90-day history of the alerting program
    driving this exact pattern, aggregated by host. A new or rare program for this pattern is the deviation
    worth chasing; a program already responsible for many prior events is more likely routine automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \WinRAR.exe
        - \Rar.exe
        TargetFilename|contains: \Start Menu\Programs\Startup\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the environment around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals whether the same
    account extracted archives or ran tools on other endpoints, which would widen the scope beyond a
    single host. If the alert fired under a machine or service account, the parent-process pivot is the
    meaningful view, since a service principal's cross-host activity is dominated by routine agent
    telemetry.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, indicating a coordinated rollout rather than isolated activity?
  context: Under a service or machine account, cross-host user activity is mostly agent noise; the
    meaningful question is whether the same launch mechanism produced this pattern elsewhere at the same
    time. Multiple hosts in the window point to pushed or scheduled automation, or to a delivery campaign
    reaching several users, while a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \WinRAR.exe
        - \Rar.exe
        TargetFilename|contains: \Start Menu\Programs\Startup\
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Process activity immediately before and after the drop shows
    what led to it, the archive being opened, the extraction, and any follow-on execution, and whether
    reconnaissance or additional tooling accompanied it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: When this host has previously produced this Startup-drop pattern, what programs and users drove it, and does the current alert fit that history?
  context: The query counts prior file writes matching the rule's exact pattern on this host, broken out
    by the writing archive tool and user. If this pattern has run here before under the same tool and a
    known account, the current alert may be routine; a new writing program, an unexpected user, or no
    prior history at all is the deviation worth pursuing. File events carry no parent lineage — pivot to
    the archive tool's process-start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \WinRAR.exe
        - \Rar.exe
        TargetFilename|contains: \Start Menu\Programs\Startup\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts produced this Startup-drop pattern in the past week, and does the cross-host distribution look like automation or isolated activity?
  context: The query counts file writes matching the rule's exact pattern fleet-wide, with no host scope.
    Many hosts producing the same pattern can indicate either a software-deployment process to exclude or
    a delivery campaign reaching multiple users; one host or a small unrelated set points to a targeted or
    manual event. Use the host distribution to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        Image|endswith:
        - \WinRAR.exe
        - \Rar.exe
        TargetFilename|contains: \Start Menu\Programs\Startup\
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, a suspicious download, script execution, or reconnaissance,
    may reveal the stages that preceded the Startup drop and help reconstruct how the archive reached the
    host and what followed it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
