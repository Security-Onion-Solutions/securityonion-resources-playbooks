name: Suspicious Executable File Creation
id: 005a8c8c-56c1-49a0-958d-3e8e161f313f
description: |
  Detects creation of an executable whose name is built to deceive: a deceptive double extension
  (.bat.exe, .sys.exe) that presents as a script or driver while the real content is a PE, or a
  drive/folder-root name that mimics a top-level system directory (:\$Recycle.Bin.exe, :\PerfLogs.exe,
  :\Recovery.exe, :\MSOCache.exe, :\Documents and Settings.exe). These names support two behaviors:
  masquerading a file's true type to slip past a reviewer, and planting an executable at an intermediate
  prefix of an unquoted, space-containing service binary path so it runs with the service's privilege
  level (often SYSTEM) at the next service start. Confirm the file's real type and location, whether it
  executed, and whether an auto-start service would resolve to it before treating the alert as benign.
type: detection
detection_id: 74babdd6-a758-4549-9632-26535279e654
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the created file's path and name correspond to one of the double-extension or system-directory look-alike names the rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact file path, the operation performed (created, deleted, or renamed), and the responsible process against the rule's detection criteria. Note which category fired — a double extension such as .bat.exe or .sys.exe, or a drive-root name that mimics a system directory such as $Recycle.Bin.exe or PerfLogs.exe — because the two patterns point the rest of the investigation in different directions.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to write an executable with this name to this location?
  context: Legitimate administrative or installer activity can drop executables, but names of this form rarely appear in routine operations. Knowing whether the user role and host function are consistent with writing an executable here is often the fastest path to distinguishing a true positive from a benign build or deployment artifact. When the writer is a machine or service account, judge by the writing process and the host's role instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is the file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved, hashed, and analyzed; a file deleted seconds after creation suggests anti-forensic cleanup or a self-deleting dropper and shifts the investigation to what executed in between. Interpret the operation type on each returned event.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is the created file the type its name implies, or is the name a masquerade?
  context: The rule matches names that hide a file's real nature. A double extension such as .bat.exe or .sys.exe presents as a batch script or driver while the on-disk content is typically a PE; a drive-root name such as $Recycle.Bin.exe places an executable where a system directory would be. Retrieve the file and confirm its real type, signer, and embedded strings, and decide whether it is a renamed legitimate binary, a decoy, or an unfamiliar payload. File content is not in the alert and must be pulled from the endpoint or a controlled analysis environment.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: If this file has executed, what is its hash and does it have known threat-intel or AV detections?
  context: A file's hash is recorded when it runs, not when it is written, because file-creation events carry no hash. This query looks for the file executing by its name and reads its hash and the command line it ran with; submit the hash to reputation and internal threat-intel sources to determine whether it is known malicious, benign, or previously unseen. A file that is present but has not executed will not appear here — retrieve it from its on-disk path and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - Image
      - Hashes
      - CommandLine
- question: What command line did the process that created this file run with?
  context: The file-creation event names the responsible process but not its arguments. Pivoting to that process by its unique identifier reveals the full command line and working directory, which show whether the write came from an installer, a build step, a script host unpacking a payload, or a hands-on-keyboard command. Decode any flags, encoded content, paths, or URLs in the arguments.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - Image
- question: What process spawned the process that created this file, and is that parent chain expected?
  context: The parent process reveals how the writer was invoked. Legitimate writes often have predictable parents (explorer.exe for user actions, services.exe or an installer for deployments). Unusual parents such as mshta.exe, wscript.exe, or an Office application point to exploitation or a malicious script delivering the file.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does an auto-start service with an unquoted, space-containing binary path resolve to this file's location?
  context: When a service's binary path contains spaces and is not wrapped in quotes, Windows tries each space-delimited prefix with .exe appended before the intended binary — for a path like C:\Program Files\A Sub\Service.exe it attempts C:\Program.exe, then C:\Program Files\A.exe, and so on. A file planted at one of those prefixes, including a drive root such as :\PerfLogs.exe or :\Recovery.exe, runs with the service's privilege level (often SYSTEM) at the next start. Review auto-start service configuration for unquoted, space-containing paths whose intermediate segments line up with this file's location, and check whether the file sits in a directory the writing user can modify.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: What other files did the responsible process write or delete around the alert?
  context: A process that drops one deceptively named file often drops several — a dropper unpacking components, a tool staging output, or a batch of plants across multiple service-path prefixes. The breadth, paths, and extensions of the process's other file activity distinguish a single artifact from a staged operation and enumerate what else needs review. This covers both the writer and its direct children, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has a file with this name appeared before on this host?
  context: A file that has never been seen on a host is more suspicious than one that is part of normal operations. First-time appearance of an executable with this name, even where an installer or build routine might plausibly explain it, is worth confirming. Zero or very low historical counts indicate a new or unusual file.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to the file being written, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence activity in the same window. Aggregating by process and parent collapses repetitive agent telemetry while novel parent-child pairs stand out at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- always_include: true
  question: Has this user previously produced the rule's file-creation pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user, so the result is the user's 90-day history of this specific naming pattern (not generic file writes), aggregated by host. A user who has never produced this pattern is more suspicious than one who does so regularly; weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\$Recycle.Bin.exe
        - :\Documents and Settings.exe
        - :\MSOCache.exe
        - :\PerfLogs.exe
        - :\Recovery.exe
        - .bat.exe
        - .sys.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's file-creation pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service or machine account, user identity does not attribute behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule''s selection scoped to the alerting program, so the result is the 90-day history of this program driving this specific pattern (not generic use of the binary). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is vendor or operating-system automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\$Recycle.Bin.exe
        - :\Documents and Settings.exe
        - :\MSOCache.exe
        - :\PerfLogs.exe
        - :\Recovery.exe
        - .bat.exe
        - .sys.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user triggered similar activity on more than one host, the scope of the incident may be larger than the single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: 'Under a service or machine account, asking what else the user did across the network returns agent-telemetry noise, because every host runs system-owned agents constantly. The meaningful question is whether the same launch mechanism fired elsewhere: the query mirrors the rule''s selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|endswith:
        - :\$Recycle.Bin.exe
        - :\Documents and Settings.exe
        - :\MSOCache.exe
        - :\PerfLogs.exe
        - :\Recovery.exe
        - .bat.exe
        - .sys.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Is a file with this name present on any other hosts in the environment?
  context: Finding the same deceptively named file on multiple hosts may indicate distribution, a shared deployment mechanism, or a repeated privilege-escalation attempt against similarly misconfigured services. If the file is only on one host, it may be targeted; if on many, determine the distribution pattern and timeline.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith|expand: '%file_basename%'
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the stages that preceded the file drop and help reconstruct the timeline leading up to it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
