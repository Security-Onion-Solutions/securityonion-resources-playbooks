name: Windows Recall Feature Enabled - Registry
id: 1d070d1f-a48c-41eb-b169-860bc90c60ec
description: |
  Detects a registry write that enables the Windows Recall feature by setting the WindowsAI policy value
  DisableAIDataAnalysis to 0 (DWORD 0x00000000) under \Software\Policies\Microsoft\Windows\WindowsAI. Recall
  periodically captures and locally OCR-indexes screen snapshots into a searchable timeline; on managed devices it is
  disabled by policy, so re-enabling it turns the host's built-in screen-capture-and-search feature into a persistent
  local archive of everything displayed on screen that an operator can later collect. Legitimate context is an
  administrator intentionally activating Recall; the investigation should confirm who made the change, whether the
  companion AllowRecallEnablement policy or the Recall optional feature were also enabled, and whether the snapshot
  store began to grow afterward.
type: detection
detection_id: 75180c5f-4ea1-461a-a4f6-6e4700c065d4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the registry key path and value data match what this rule detects — DisableAIDataAnalysis set to DWORD 0?
  context: Confirm the alert is a true positive before investing time. The rule fires when TargetObject ends in
    \Software\Policies\Microsoft\Windows\WindowsAI\DisableAIDataAnalysis AND the written value (Details) is DWORD
    (0x00000000), which turns snapshot saving back on. Review the exact key path, value data, and writing process on the
    triggering event. Details is present on roughly four in five registry modifications and is absent only for binary or
    empty value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to change Windows AI / Recall policy?
  context: Recall policy is normally managed centrally by administrators or a device-management baseline, not flipped by
    an interactive user. Knowing whether this account and host role legitimately administer Windows AI settings is often
    the fastest way to separate an authorized activation from an operator re-enabling capture. User attribution is
    present on about 94 percent of endpoint registry events; when it is a machine account or missing, pivot on the
    writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What value was written to the DisableAIDataAnalysis policy key, and what does this setting control?
  context: This value under \Policies\Microsoft\Windows\WindowsAI governs whether Recall saves screen snapshots. Setting
    it to 0 (DWORD 0x00000000) permits snapshot saving; on a device where policy previously disabled Recall, that flip
    is the enablement step. The writing process (Image) shows what performed the change — a management agent, reg.exe, a
    script host, or an unexpected binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What other Windows AI / Recall policy values were modified on this host around the same time?
  context: Recall does not become active from a single value. Availability is gated by AllowRecallEnablement, and export
    of snapshots is gated by AllowRecallExport, alongside storage, duration, and app/URI filter policies under the same
    WindowsAI key. Seeing which of these companion values were also written shows whether the change was a complete
    enable-and-widen of the capture surface or a single isolated flip.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\Microsoft\Windows\WindowsAI\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: Were other registry modifications made on this host in the same session?
  context: Operators who re-enable a capture feature often make several changes together — enabling the feature,
    weakening a protection, and adding persistence. Registry modifications clustered from the same writing process within
    a short window reveal the full scope of configuration changes and whether multiple objectives were pursued at once.
    The triggering key will appear in the results; the signal is what else changed alongside it.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What process wrote this value, and what launched that process?
  context: The registry event names the writing process, but its command line and parent are not carried on the registry
    record itself. Pivoting to that process's creation event shows how the change was invoked — a management agent or
    login script is expected, while a shell, script host, or Office child launching reg.exe or a PowerShell policy write
    points to hands-on activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - CommandLine
- question: Does the Recall enablement remain in place, or was the value re-modified afterward?
  context: Endpoint telemetry emits no registry key or value deletion events, so a cleanup that removes the key is not
    directly observable. Judge whether the setting stuck by the key's re-modification history — a later write returning
    DisableAIDataAnalysis to 1 would indicate the change was reverted, while no further writes mean the enablement
    persists. Pair this with whether Recall actually began capturing.
  range: +7d
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that made this change?
  context: A writing process that has never been seen on this host is more notable than a management binary that runs
    routinely. Low or zero historical counts for the tool that performed the policy write indicate a first-time or rare
    execution worth scrutinizing; a steady daily count is consistent with a management or update path.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this Recall policy key been modified before on this host?
  context: Security and AI policy keys should change rarely, so a first-time write is more notable than a routine one. A
    history that shows the value repeatedly toggled points to a management process or user preference; zero prior
    history means the key has never been touched on this host before this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same write appearing across many hosts is consistent with a policy or management rollout, while a change
    confined to this one host looks targeted. Compare the value data and writing process across hosts to tell a fleet
    configuration change apart from a single-host enablement.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did anything run to deploy or further enable Recall after the policy change?
  context: On some devices Recall must also be staged as an optional component or its availability policy set before
    capture starts. Look for command lines that reference Recall or the optional-feature tooling after the registry
    write, which would indicate the enablement was carried through to an operational state rather than a stray policy
    edit.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'Recall'
          - 'WindowsOptionalFeature'
          - 'DisableAIDataAnalysis'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has the Recall snapshot store appeared or grown on this host since the change?
  context: When Recall captures, it writes encrypted snapshots and a vector index under the local CoreAIPlatform snapshot
    store. New files or growth there after the policy flip confirm the feature is actively collecting screen content
    rather than merely being permitted. Recall records snapshots into this store rather than as loose image files, so
    growth under the store path — not stray .png or .bmp writes — is the collection signal here.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\CoreAIPlatform.00\UKP\'
      condition: selection
    fields:
      - TargetFilename
      - EventType
- question: What other process activity occurred on this host around the time of the change?
  context: Alerts rarely occur in isolation. Aggregating process executions in a window around the registry write reveals
    what led up to it and what followed — reconnaissance, privilege escalation, or additional collection tooling.
    Repetitive agent telemetry collapses into high-count rows while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded the Recall enablement and help reconstruct the timeline. Enabling a local screen-capture archive
    is usually a collection step that follows initial access and privilege escalation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
