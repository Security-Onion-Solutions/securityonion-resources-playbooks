name: Custom File Open Handler Executes PowerShell
id: fd09b02e-a754-43a5-882a-98b7f19acc19
description: |
  Detects a registry write whose key path contains \shell\open\command\ AND whose value data contains both 'powershell'
  and '-command' — a file-class open handler rewritten so that opening an ordinary-looking file runs a PowerShell command
  instead of the application the file type normally launches. Windows resolves the double-click action for a file
  extension through its ProgID's \shell\open\command\(Default) value, so whatever command sits there executes with the
  file path handed to it; installers legitimately register handlers for their own file types, but a handler that invokes
  powershell.exe with an inline -command payload executes attacker code under the user's own action rather than at boot,
  and stays in place until the value is rewritten. The investigation should determine what the handler command actually
  invokes, whether it is encoded or references a file on disk, which file class was hijacked, which process wrote the
  value and what launched it, and whether powershell.exe subsequently ran on the host with Explorer as its parent.
type: detection
detection_id: 7530b96f-ad8e-431d-a04d-ac85cc461fdc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting registry write set a file open handler to a PowerShell command?
  context: >-
    Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions
    hold on the same event: the key path (TargetObject) contains \shell\open\command\ AND the value data (Details)
    contains 'powershell' and '-command' together. Review the exact key path, the value data, and the writing process on
    the triggering event. Value data is populated on roughly 79% of endpoint registry modifications; if it is absent
    here, read the key directly on the host to confirm what command the handler now runs.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user or host expected to register or repair file type open handlers?
  context: >-
    Handler registrations are normally written by application installers, repair flows, or imaging scripts — not by an
    interactive account working ad hoc. A developer packaging software or an administrator running a deployment could
    plausibly touch these keys; a standard user on a workstation has no routine reason to. Weigh the account role and
    the host function against the writing process shown here. User attribution is present on roughly 94% of endpoint
    registry events; when it is a machine account, SYSTEM, or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which file class was hijacked, and is that a file type users routinely double-click?
  context: >-
    The key path names the target. A \shell\open\command\ value under a ProgID (or under HKCR\<extension>) defines what
    Windows runs when a file of that class is opened, so the hijacked class determines what user action triggers the
    payload — a document, archive, or media type that users open by habit gives the handler frequent, low-suspicion
    execution, while an obscure or attacker-invented class implies the file is delivered alongside it. Read the signer
    columns for coherence with the class being registered rather than as a verdict: a vendor-signed installer
    registering its own file type is self-consistent; a signed system LOLBin or script host writing a PowerShell command
    into a common document class is not.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What does the handler command actually invoke, and does it reference a file on disk?
  context: >-
    The value data is the payload. Read it as a command line and account for every element: what PowerShell is asked to
    run after -command, whether the argument is inline script or a call to a file, whether a path points at a
    user-writable location (AppData, Temp, ProgramData, Users\Public) or a UNC share, and whether %1 is passed through
    so the opened file itself becomes the input. A handler that ends by launching the expected application after running
    its command is built to stay unnoticed, since the file still opens the way the user expects. Any path recovered here
    becomes the artifact for the on-disk check. If value data is absent on the alert, read the key directly on the
    endpoint to recover the command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Is the handler's PowerShell command encoded or obfuscated, and what does it decode to?
  context: >-
    A handler command is written once and read rarely, which makes it a convenient place to park an encoded payload.
    Look for -EncodedCommand or -enc with a base64 blob, string concatenation, backtick escaping, format operators, or
    variable substitution used to hide a download cradle or an in-memory .NET load. This query returns the command line
    of the process that performed the registry write, which for reg.exe, powershell.exe, or an installer typically
    contains the handler string it wrote — read it alongside the value data itself, and decode any base64 to recover
    what the handler will actually execute.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did PowerShell script block logging capture what the handler ran?
  context: >-
    Event ID 4104 records the deobfuscated script content PowerShell actually compiled, which is the ground truth when
    the handler command is encoded or built at runtime. Because the handler fires on user action rather than at write
    time, look across the hours after the registry change rather than only the alert moment, and compare any captured
    script against the value data. If PowerShell operational logs are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: What process wrote the handler value, and is its parent chain expected?
  context: >-
    The registry event names the writing process but not its origin; this query retrieves that process's own creation
    record with its command line and parent. An installer or servicing process under a deployment framework points to a
    sanctioned registration. reg.exe, powershell.exe, or a script host launched from a document, an archive extractor, a
    browser download, or an unfamiliar dropper points to delivery rather than software setup. Long-running parents can
    start well before the write, which is why the lookup window is wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - ParentCommandLine
- question: Did powershell.exe or another interpreter run on this host after the handler was written, and what launched it?
  context: >-
    A hijacked open handler executes only when someone opens a file of that class, so the write and the payload are
    separated by however long it takes a user to double-click. powershell.exe appearing with explorer.exe as its parent
    after the change is the direct evidence the handler fired, since Explorer is what invokes the registered command on
    a user's file open. The child images filtered here — powershell.exe, cmd.exe, rundll32.exe, regsvr32.exe, mshta.exe,
    msiexec.exe, curl.exe, bitsadmin.exe — are the interpreters and downloaders that indicate abuse when reached
    indirectly. No matching execution means the handler is planted but not yet triggered, which is still a live
    exposure.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_children:
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
          - '\cmd.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msiexec.exe'
          - '\curl.exe'
          - '\bitsadmin.exe'
      condition: selection and selection_children
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Was a script or payload file written to disk by the process that registered the handler, or by its children?
  context: >-
    When the handler command calls a file rather than carrying an inline script, that file has to reach the disk, and it
    is usually written in the same session as the registration. This query follows file activity from the writing
    process and anything it spawned. Match what appears here against the path recovered from the value data, and treat
    writes into user-writable directories or a file whose name imitates the hijacked application as the artifact to
    retrieve. File write events carry no hash; obtain one from the later execution of that path or by collecting the
    file.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
- question: Did PowerShell open outbound connections from this host after the handler was registered?
  context: >-
    An indirectly launched PowerShell command commonly fetches its next stage rather than carrying it, so egress from
    powershell.exe after the registration indicates the handler ran and reached out. Compare destinations against the
    egress ranges this host legitimately uses — update services, internal automation, and known management networks
    account for most routine PowerShell traffic, and destinations outside them, especially raw IP addresses or
    high-numbered ports, are what to pursue. Pair the destination with the timing of the file open that triggered it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\powershell.exe'
          - '\pwsh.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
- question: Were PowerShell security controls bypassed or weakened before this handler was registered?
  context: >-
    Execution policy changes, AMSI tampering, and version downgrades are commonly staged before a PowerShell payload is
    planted, because a handler that fails on policy or gets scanned mid-run defeats the point. Finding these in the hour
    before the registration links the write to a deliberate preparation sequence rather than an installer action; note
    that the handler's own command may also carry a bypass flag inline, which the value data will show.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: Were other registry modifications made on this host in the same session?
  context: >-
    Handler hijacks are frequently one of several registry changes in a session — additional file classes redirected,
    Run keys added, security settings weakened, or a ProgID and its extension mapping written together, since a new
    class needs both an extension association and a command to be reachable. The triggering key will appear in these
    results; the signal is what else was modified and by which process. If the host is registry-noisy, narrow to the
    alerting write's process or to security-relevant paths.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    The registration rarely happens alone — a dropper writing the payload, a script host driving the change, or an
    archive extractor delivering both typically run in the same window. Aggregating by parent and child image collapses
    repetitive agent telemetry into high-count rows while novel pairs stand out at low counts. Scan those low-count
    pairs for loaders, extractors, script interpreters, and unfamiliar binaries, and correlate the timing against the
    registry write.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this file open handler been modified before on this host?
  context: >-
    Open handlers are written at install time and then left alone, so a value with no prior history is a first-touch
    event on this host. Where history exists, compare the earlier value data and writing processes against the alerting
    event — a recurring identical registration from a known installer points to software maintenance, while a new
    PowerShell command replacing a previously ordinary application path is the deviation to pursue. Because registry
    deletions are not observable in endpoint telemetry, this re-modification history is also how to judge whether the
    handler was later reverted.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Does this host normally run the process that wrote the handler value?
  context: >-
    A writing process with no execution history on this host is more consistent with a freshly delivered tool than with
    installed software, while a binary that runs regularly points to an existing application or agent making the change.
    If the writer is a ubiquitous utility such as reg.exe, powershell.exe, or msiexec.exe, frequency alone carries no
    meaning — judge it from its command line and parent chain instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Was the same file open handler modified on other hosts in the environment?
  context: >-
    The same key rewritten across many hosts points to a software deployment, a group policy action, or an imaging
    artifact; a single host points to targeted activity. Compare the value data across hosts — identical commands on
    many machines suggest one distribution mechanism, while differing commands on a small set suggest independent
    tampering. Note which writing process appears on each host, since a consistent installer across the fleet reads
    differently from a script host on one machine.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — initial access, defense tampering, reconnaissance, or credential access — may
    reveal the stages that preceded the handler registration and help reconstruct the timeline. A handler hijack sits
    after execution and before the user-triggered payload run, so the preceding alert sequence indicates how the actor
    reached the point of configuring indirect execution.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
