name: Suspicious PowerShell Parent Process
id: 6664678a-88d7-428b-a16a-5260aad5047c
description: |
  Detects PowerShell (powershell.exe or pwsh.exe, or a /c powershell wrapper) spawned by a parent process that does not
  normally launch a command shell, such as web servers (w3wp.exe, httpd.exe, nginx.exe, tomcat, php-cgi.exe, jbosssvc.exe),
  browsers (chrome.exe, firefox.exe, iexplore.exe, edge, safari, vivaldi, amigo), document and scripting hosts
  (outlook.exe, mshta.exe, rundll32.exe, regsvr32.exe), database services (sqlservr.exe, sqlagent.exe), or services.exe.
  The rule fires only when both conditions hold: the parent matches the suspicious-parent list AND the child is identified
  as PowerShell. This parent-child pairing is a common entry point for exploitation of an internet-facing service, a
  malicious document or macro, or a script-host download cradle, since these parents rarely have a legitimate reason to
  start an interactive shell. The investigation should establish what the PowerShell command did, why the parent launched
  it, and whether the same pairing appears elsewhere.
type: detection
detection_id: 754ed792-634f-40ae-b3bc-e0448d33f695
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the parent process and PowerShell child match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The rule requires both halves to
    match at once - the parent is one of the suspicious launchers (a web server, browser, Office or scripting host, database
    service, or services.exe) AND the child is PowerShell (Image ending in powershell.exe or pwsh.exe, a /c powershell or
    /c pwsh command line, or PowerShell version markers in Description, Product, or OriginalFileName). Confirm both the
    ParentImage and the PowerShell identity against the event before proceeding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
      - CommandLine
      - Description
      - Product
- question: Is this user and host expected to launch PowerShell from this parent process?
  context: Legitimate activity can trigger this detection - a web application that shells out to a maintenance script, an
    administrator running a deployment from a database service account, or a developer tool. Knowing whether the user role
    and host function plausibly involve PowerShell being launched by this specific parent is often the fastest path to
    distinguishing a true positive from routine operations.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this parent expected to spawn PowerShell, and what started the parent itself?
  context: The parent-child relationship is the core signal for this detection. Web servers, browsers, document hosts, and
    database services do not normally launch a command shell, so tracing the parent's own origin (the grandparent process)
    reveals whether the chain is legitimate or whether the parent was driven by an exploit, a malicious document, or an
    injected payload.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What exactly did this PowerShell invocation do? Decode the full command line.
  context: The full command line reveals the specific action taken. Read every flag and argument, including the /c powershell
    or /c pwsh wrapper if present, and decode any encoded, compressed, or obfuscated content. Download cradles
    (Net.WebClient, Invoke-WebRequest, Start-BitsTransfer), in-memory assembly loads ([Reflection.Assembly]::Load), and
    Invoke-Expression of fetched content are common payloads launched through these parents.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was the command encoded or obfuscated? What does it decode to?
  context: Attackers frequently use PowerShell's -EncodedCommand (-enc) parameter or string concatenation, backtick escaping,
    and variable substitution to hide intent. Note that partial flag forms (-e, -ec, -en, -enc, ...) are all accepted by
    PowerShell. Base64-encoded commands are the most common form; decoding reveals the actual payload such as a download
    cradle, reverse shell, or in-memory execution of a .NET assembly.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What web request, document, or email triggered this execution?
  context: When the parent is an internet-facing service (a web server such as w3wp.exe, httpd.exe, nginx.exe, tomcat, or
    php-cgi.exe), PowerShell spawning from it commonly follows exploitation of a server vulnerability or a deployed web
    shell - review the web server access logs for the originating request and source address. When the parent is a document
    or mail host (outlook.exe, mshta.exe), look for the attachment or link that triggered it via the parent command line.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Has this parent process launched PowerShell on this host before?
  context: This parent-child pairing is inherently suspicious - the parents in this rule (web servers, browsers, document
    hosts, database services) rarely have a legitimate reason to start PowerShell. Historical frequency distinguishes a
    one-off that has never happened from a recurring pattern that may reflect a sanctioned automation or deployment job.
    Zero or very low counts indicate a novel spawning relationship.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: What other child processes did the same parent instance spawn?
  context: If the parent spawned PowerShell, it likely spawned other processes too. Examining the siblings of this exact
    parent instance reveals the full scope of activity driven through it - reconnaissance binaries, additional script hosts,
    or credential-access tooling launched alongside the alerting PowerShell strongly suggest orchestrated malicious activity
    rather than a single benign call.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did PowerShell script block logging capture the full script content?
  context: Windows Event ID 4104 (script block logging) records the deobfuscated script content that PowerShell actually
    executed, even when the command line is encoded or obfuscated, giving ground truth about what ran. If PowerShell
    operational logs are not ingested in this environment, treat zero results as a visibility gap rather than evidence that
    nothing ran, and fall back to manual decoding of the alerting command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: powershell
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 4104
      condition: selection
    fields:
      - ScriptBlockText
      - ScriptBlockId
      - Path
- question: Were PowerShell security controls bypassed or weakened before this execution?
  context: Attackers often disable or bypass PowerShell security controls before running a payload. Common precursors
    include AMSI bypass (patching amsi.dll in memory), execution policy changes (Set-ExecutionPolicy or an -ep bypass
    flag), constrained language mode escape, and a downgrade to PowerShell v2 which lacks logging. Finding these on the
    host shortly before the alert strengthens the case for malicious activity.
  range: -1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_bypass:
        CommandLine|contains:
          - 'Set-MpPreference'
          - 'DisableRealtimeMonitoring'
          - '-ExecutionPolicy Bypass'
          - '-ep bypass'
          - 'AmsiUtils'
          - 'amsiInitFailed'
          - 'Invoke-Obfuscation'
          - '-Version 2'
          - '-v 2'
      condition: selection and selection_bypass
    fields:
      - CommandLine
- question: What .NET and automation assemblies did the PowerShell process load?
  context: PowerShell hosted indirectly (for example a .NET automation runspace, or a payload that loads management
    assemblies reflectively) can leave its trace in module-load telemetry rather than in the command line. Loaded modules
    such as System.Management.Automation.dll, amsi.dll, clr.dll, or rare or never-before-seen assemblies tied to this
    process indicate how PowerShell was hosted and whether in-memory or reflective code loading occurred. If module-load
    telemetry is not collected in this environment, treat zero results as a visibility gap.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
      - ParentImage|contains: tomcat
      - ParentImage|endswith:
        - \amigo.exe
        - \browser.exe
        - \chrome.exe
        - \firefox.exe
        - \httpd.exe
        - \iexplore.exe
        - \jbosssvc.exe
        - \microsoftedge.exe
        - \microsoftedgecp.exe
        - \MicrosoftEdgeSH.exe
        - \mshta.exe
        - \nginx.exe
        - \outlook.exe
        - \php-cgi.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \safari.exe
        - \services.exe
        - \sqlagent.exe
        - \sqlserver.exe
        - \sqlservr.exe
        - \vivaldi.exe
        - \w3wp.exe
      selection_powershell:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - CommandLine|contains:
        - /c powershell
        - /c pwsh
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
      - ParentImage|contains: tomcat
      - ParentImage|endswith:
        - \amigo.exe
        - \browser.exe
        - \chrome.exe
        - \firefox.exe
        - \httpd.exe
        - \iexplore.exe
        - \jbosssvc.exe
        - \microsoftedge.exe
        - \microsoftedgecp.exe
        - \MicrosoftEdgeSH.exe
        - \mshta.exe
        - \nginx.exe
        - \outlook.exe
        - \php-cgi.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \safari.exe
        - \services.exe
        - \sqlagent.exe
        - \sqlserver.exe
        - \sqlservr.exe
        - \vivaldi.exe
        - \w3wp.exe
      selection_powershell:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - CommandLine|contains:
        - /c powershell
        - /c pwsh
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts in the alert window reveals lateral movement or activity spanning
    multiple endpoints. If the same user triggered similar activity on other hosts at the same time, the scope of compromise
    may be larger than this single event.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
      - ParentImage|contains: tomcat
      - ParentImage|endswith:
        - \amigo.exe
        - \browser.exe
        - \chrome.exe
        - \firefox.exe
        - \httpd.exe
        - \iexplore.exe
        - \jbosssvc.exe
        - \microsoftedge.exe
        - \microsoftedgecp.exe
        - \MicrosoftEdgeSH.exe
        - \mshta.exe
        - \nginx.exe
        - \outlook.exe
        - \php-cgi.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \safari.exe
        - \services.exe
        - \sqlagent.exe
        - \sqlserver.exe
        - \sqlservr.exe
        - \vivaldi.exe
        - \w3wp.exe
      selection_powershell:
      - Image|endswith:
        - \powershell.exe
        - \pwsh.exe
      - CommandLine|contains:
        - /c powershell
        - /c pwsh
      - Description: Windows PowerShell
      - Product: PowerShell Core 6
      - OriginalFileName:
        - PowerShell.EXE
        - pwsh.dll
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Did this same detection fire on other hosts or for other users?
  context: When PowerShell spawning from one of these parents reflects exploitation of an internet-facing service or a
    phishing wave, the same pattern rarely hits a single system. Correlating this detection across the environment reveals
    how many hosts and users are affected and identifies additional systems that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host - reconnaissance, exploitation of a
    service, defense tampering, or credential access - may reveal the stages that preceded this PowerShell execution and
    help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
