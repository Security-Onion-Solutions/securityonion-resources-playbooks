name: Serv-U Exploitation CVE-2021-35211 by DEV-0322
id: fc6bfaf0-c1ac-4e71-901c-f3266bf85787
description: |
  Detects command lines associated with post-exploitation of CVE-2021-35211, a remote code execution flaw in
  the SSH service of SolarWinds Serv-U FTP. The rule fires only when a command line contains "whoami" AND
  either a path into the Serv-U Client\Common directory (in forward-slash or backslash form) or a reference to
  C:\Windows\Temp\Serv-U.bat. Both branches describe the same pattern from different angles: an operator with
  code execution under an internet-facing file-transfer service runs an identity check and either redirects the
  output into a directory the service itself publishes over the internet, or pairs it with a batch file staged
  in the Windows temp directory. The service process runs with high privilege, so execution obtained through it
  starts privileged. The investigation should establish which branch fired, confirm whether the parent is in
  fact the Serv-U service process and at what patch level, recover and read the referenced files, and determine
  what followed on the host — the exploitation of a public-facing service is an entry point rather than an end
  state, and this rule's persistence tag reflects that the same access is used to add a Serv-U user record.
type: detection
detection_id: 75578840-9526-4b2a-9462-af469a45e767
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting command line contain whoami together with either a Serv-U Client\Common path or a
    reference to C:\Windows\Temp\Serv-U.bat, and which of the two matched?
  context: >-
    The rule requires whoami in the command line and then at least one of two independent indicators, so record
    which one matched — the branch determines where the rest of the investigation goes. A Client\Common match
    (either "./Client/Common/" or ".\Client\Common\") means command output was redirected into a directory the
    file-transfer service publishes over the internet by default, which the operator can then read back over
    HTTP with no outbound connection from the host; the file written there is the next artifact to recover. A
    C:\Windows\Temp\Serv-U.bat match means the command line also names a batch file staged in the Windows temp
    directory, which is the launcher artifact to recover and read. Both branches carry the same whoami, so an
    identity check ran either way; note the account it returned.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this host running Serv-U FTP, and is this account expected to run reconnaissance commands on it?
  context: >-
    A file-transfer server has a narrow and well-known job. Confirm the host actually runs Serv-U and whether
    its SSH service is reachable from the internet, since that reachability is what makes the exploitation path
    available. Note the account as well — command execution obtained through the service inherits the service's
    identity and privilege, so an account that is neither the service identity nor a named administrator changes
    what the alert means.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What process spawned the alerting command, and is it the Serv-U service process?
  context: >-
    The rule matches on the command line alone and places no constraint on the parent, so the parent is the
    first thing to establish rather than something the alert already tells you. The Serv-U FTP service process
    spawning a command interpreter or a reconnaissance binary means the service itself was driven into executing
    code, which is the durable statement behind this rule regardless of who did it. A parent of conhost.exe or
    another interpreter means walking one level further up the tree. An interactive parent such as explorer.exe
    or a remote-management agent points instead at an administrator or a responder typing the indicator, which
    is a different finding. Note what started the parent too, and whether the service process crashed shortly
    after the command ran.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: Is this Serv-U installation patched against CVE-2021-35211, and does its debug log carry the
    exception the exploit leaves behind?
  context: >-
    Patch state tells you whether the execution path this rule's pattern follows was open on this host, and
    which other file-transfer servers still have it open. The vulnerability sits in the SSH implementation, so
    an installation with SSH disabled or not exposed is not reachable by this path even when unpatched. The
    exploit also leaves a distinctive server-side artifact when the corrupted packet is processed — an
    "EXCEPTION" line naming C0000005 and CSUSSHSocket::ProcessReceive() is written into
    DebugSocketLog.txt under the Serv-U data directory (%ProgramData%\RhinoSoft\Serv-U\). That line, with its
    timestamp, is what ties the process-creation alert to the packet that produced it, and it must be read from
    the host — it is a text log, not process telemetry.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - asset_inventory
  - manual_review
  - edr_console
- question: What did the full command sequence do — where was the output sent, and what else ran alongside the
    whoami?
  context: >-
    Read the whole command, not just the matched substring. A redirection into the Client\Common directory names
    the exact output file the operator intends to fetch over the internet, and that filename is the artifact to
    recover; the same pattern is typically repeated with dir and other enumeration commands, so the alerting
    command is usually one of several. A command line naming Serv-U.bat names the batch file being launched or
    written. Watch for a "type" of a remote path redirected into an .Archive file under the Serv-U user store,
    which is how a new service account gets created without touching the management interface. This query is
    scoped to the host and to the rule's command-line indicators rather than to a binary, because the operation
    typically spans a cmd.exe wrapper and whatever it launches.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - whoami
          - ./Client/Common/
          - .\Client\Common\
          - Serv-U.bat
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is the referenced file still on disk for analysis?
  context: >-
    Both branches of this rule name a file — an output file staged under Client\Common, or the batch file under
    the Windows temp directory. This query lists what the alerting process and its direct children wrote, which
    is how you find the actual filenames rather than the pattern. Preserve anything new before it is removed;
    output files staged in a web-served directory are commonly deleted once collected, and the batch file is
    often cleaned up after it runs.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What was written into the Serv-U Client\Common directory or dropped as a batch file under the
    Windows temp directory?
  context: >-
    This question is about content, not reputation. Files appearing under Client\Common are the staged output of
    commands run on the server and are readable by anyone who can reach the service over the internet — read
    them to see exactly what was enumerated and what the operator learned. A batch file under the Windows temp
    directory is a launcher; read it for the payload path, any URL or IP it contacts, and any encoded or
    obfuscated content. The paths here are the literal ones from the rule's own command-line indicators, since a
    process alert carries no file path of its own. Retrieving the content itself requires pulling the file from
    the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - \Client\Common\
          - \Windows\Temp\Serv-U.bat
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If the Serv-U.bat batch file has run, what is its hash and does it have known detections?
  context: >-
    A file's hash is recorded when it runs, not when it is written, so this query looks for the batch file
    executing and reads the hash from that event. A batch file executes through an interpreter, so the hash
    returned belongs to cmd.exe or powershell.exe rather than to the batch file itself — use it to confirm which
    interpreter ran, and hash the batch file from its on-disk path for the artifact's own hash. Submit that hash
    to reputation services or internal threat intel. A file that was written but never executed will not appear
    here at all, and one already deleted has to be recovered from backups or volume shadow copies.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_direct:
        Image|endswith: \Serv-U.bat
      selection_interpreter:
        CommandLine|contains: Serv-U.bat
      condition: selection and 1 of selection_*
    fields:
      - Image
      - CommandLine
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Was a local account created on this host around the time of the alert, and was a new Serv-U user
    record added?
  context: >-
    An identity check on a compromised server is usually followed by an attempt to hold the access. Local account
    creation raises event 4720 on the Security channel, and this query lists those events on the host in the
    surrounding four hours with the created account and the account that created it. The file-transfer service
    keeps its own user records as .Archive files under its Global Users directory
    (C:\ProgramData\RhinoSoft\Serv-U\Users\), and writing one of those files creates a service user without
    going through the management interface and without raising 4720 — audit that directory for unrecognised
    files as well. If the Security channel is not collected from this host, treat an empty result as a
    visibility gap rather than evidence no account was added.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4720
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetUserName
      - SubjectUserName
      - SubjectLogonId
  answer_sources:
  - active_directory
  - manual_review
- question: Has this host produced the rule's pattern before, and if so under what parents and accounts?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the result is the host's own
    14-day history of this exact pattern rather than generic use of an interpreter. Because both branches of
    this rule are exploitation indicators rather than tunable administrative behavior, any prior history here is
    itself a finding — it means the pattern fired before and those earlier events need the same treatment as
    this one. A first occurrence, with a parent and account that do not match anything the host normally does,
    is the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_whoami:
        CommandLine|contains: whoami
      selection_cmd_1:
        CommandLine|contains:
        - ./Client/Common/
        - .\Client\Common\
      selection_cmd_2:
        CommandLine|contains: C:\Windows\Temp\Serv-U.bat
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection_whoami and 1 of selection_cmd*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection structure scoped to this account, so the result is the account's
    90-day history of this specific pattern rather than generic use of a shell, aggregated by host. On a
    file-transfer server the account is most often the service identity, which attributes the launch mechanism
    rather than a person, so a zero here is expected and not by itself informative. A named administrative
    account with prior history is a different situation and worth resolving against what that person does.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_whoami:
        CommandLine|contains: whoami
      selection_cmd_1:
        CommandLine|contains:
        - ./Client/Common/
        - .\Client\Common\
      selection_cmd_2:
        CommandLine|contains: C:\Windows\Temp\Serv-U.bat
      _pb_scope:
        User|expand: '%User%'
      condition: (selection_whoami and 1 of selection_cmd*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this parent process historically driven the rule's pattern here or elsewhere, or is the parent
    new for this activity?
  context: >-
    When the alert fires under a service identity, the account does not attribute the behavior; the launch
    mechanism does. This query mirrors the rule's selection structure scoped to the alerting parent process, so
    the result is the 90-day history of that parent driving this specific pattern rather than generic
    parent-and-child co-occurrence. If the parent is the file-transfer service process, any count above zero
    means the service has driven this pattern before and those events need review. A parent that already
    accounts for a large volume of prior matches points instead at an internal script or vendor automation that
    happens to use the same paths.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_whoami:
        CommandLine|contains: whoami
      selection_cmd_1:
        CommandLine|contains:
        - ./Client/Common/
        - .\Client\Common\
      selection_cmd_2:
        CommandLine|contains: C:\Windows\Temp\Serv-U.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_whoami and 1 of selection_cmd*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account run across the environment around the time of the alert?
  context: >-
    Tracking the account across all hosts shows whether the activity stayed on this server or moved. Read the
    result against the identity first — a service or machine account returns broad service-owned volume from
    every host and answers little, whereas a named account appearing on several hosts in this window is a lead
    worth following. Credentials recovered from a file-transfer server are commonly reused for the next hop, so
    the same account touching a second host shortly after this alert is the pattern to look for.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did the same parent-driven pattern fire on other hosts in the same window, or is this isolated to
    one server?
  context: >-
    Under a service identity, asking what else the account did across the network returns service-owned volume
    from every host. The answerable question is whether the same launch mechanism fired elsewhere. This query
    mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, in the alert
    window. Several file-transfer servers matching at once points at a scripted sweep across whatever is
    reachable from the internet, and each of those hosts needs the same treatment; a single host points at a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_whoami:
        CommandLine|contains: whoami
      selection_cmd_1:
        CommandLine|contains:
        - ./Client/Common/
        - .\Client\Common\
      selection_cmd_2:
        CommandLine|contains: C:\Windows\Temp\Serv-U.bat
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection_whoami and 1 of selection_cmd*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every parent-and-child pairing on the host in the surrounding 15 minutes collapses the server's
    routine service and agent volume into a few high-count rows and leaves novel pairings visible at low counts.
    On a file-transfer server, whose workload is narrow and repetitive, that contrast is the point. Scan for
    further enumeration, script hosts, archive utilities, credential access tooling, and for anything at all
    running under the file-transfer service process.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Exploitation of an internet-facing service is an entry point, so earlier detections on the same host frame
    what this one belongs to. Look for scanning or probing of the file-transfer service, other exploitation or
    web-shell detections, and for the sequence that typically follows a foothold on a server — reconnaissance,
    then credential access, then movement to a second host. Their absence is informative too, pointing at a
    first-touch event rather than a later stage.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Access obtained through a service exploit is lost when the service restarts, so an operator who wants to
    keep it installs something that survives. Adding a user record to the file-transfer service's own user store
    is one route and leaves no process trace; the other routes do — scheduled tasks, services, registry Run
    keys, BITS jobs, or WMI subscriptions. This query surfaces those tool executions on the host within four
    hours either side of the alert. On a server whose function is narrow, any of them appearing in the same
    window as the alert should be accounted for individually.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Have other hosts fired the rule's pattern in the past week, and how is it distributed across them?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this specific pattern rather than generic shell usage. Every host that appears is running or has run the
    file-transfer service and needs the same treatment as this one, including a patch-state check and a review
    of its user store. A spread across several servers in a short window points at a sweep of whatever was
    reachable from the internet; a single host points at a targeted or opportunistic one-off.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_whoami:
        CommandLine|contains: whoami
      selection_cmd_1:
        CommandLine|contains:
        - ./Client/Common/
        - .\Client\Common\
      selection_cmd_2:
        CommandLine|contains: C:\Windows\Temp\Serv-U.bat
      condition: selection_whoami and 1 of selection_cmd*
    fields:
    - host.name
  answer_sources:
  - process_creation
