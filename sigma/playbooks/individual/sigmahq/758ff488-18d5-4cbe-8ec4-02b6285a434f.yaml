name: Remote Access Tool - NetSupport Execution
id: 6be451fb-1e5c-4186-b527-5bc0146177fa
description: |
  Detects execution of the NetSupport remote control client, identified by its PE metadata: a Description of
  'NetSupport Client Configurator', a Product of 'NetSupport Remote Control', a Company of 'NetSupport Ltd', or an
  OriginalFileName of PCICFGUI.EXE. The rule fires when any one of these metadata fields matches, so confirm which
  field carried the match. NetSupport is sold as legitimate remote support software and is also repurposed by operators
  as a remote access tool to establish persistent interactive control of an endpoint. The investigation should determine
  whether the tool is sanctioned and tied to a real support session, where it was installed from, what external endpoint
  it talks to, and whether it spawned interactive child processes consistent with hands-on-keyboard control.
type: detection
detection_id: 758ff488-18d5-4cbe-8ec4-02b6285a434f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the process match the NetSupport metadata this rule detects, and which field carried the match?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the event's PE metadata
    against the rule's criteria. The rule fires when any one of these matches, a Description of 'NetSupport Client
    Configurator', a Product of 'NetSupport Remote Control', a Company of 'NetSupport Ltd', or an OriginalFileName of
    PCICFGUI.EXE. Note which field matched; a renamed or repacked binary may match on Company or Product while the on-disk
    name differs, which is itself worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
      - Company
      - Description
      - Product
- question: Is this user and host expected to run remote support software?
  context: Legitimate remote support tools are routine on help-desk workstations, jump hosts, and admin endpoints but
    unusual on general-purpose user machines and servers. Knowing whether the user role and host function involve providing
    or receiving remote support is often the fastest path to distinguishing sanctioned use from operator-deployed access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is NetSupport on the organization's approved remote access software list?
  context: Organizations typically sanction a single remote support tool for IT use. NetSupport not being on that list,
    even though it is well-known commercial software, may represent shadow IT or operator-deployed persistence.
    Unauthorized remote access tools should be checked regardless of the tool's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: Legitimate NetSupport usage typically correlates with an active support ticket, a scheduled maintenance window,
    or a user request. If no support context exists for this session, the tool may have been installed by an operator for
    persistent interactive access or by a user circumventing security controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What did this NetSupport process actually do? Review its full command line and working directory.
  context: The command line and working directory reveal how the client was invoked and configured, whether it pointed at
    a configuration file, a gateway or relay address, or ran in unattended mode. A configurator launched from a temp or
    user-profile path, or pointed at an unfamiliar gateway, indicates operator setup rather than a sanctioned install.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What external endpoint is this tool connecting to, and on what port?
  context: Remote access tools establish outbound connections to relay servers, vendor cloud infrastructure, or
    operator-controlled gateways. Connections to NetSupport's own infrastructure are expected for a sanctioned deployment;
    connections to an unfamiliar address or a non-standard high port suggest a custom gateway under operator control. RMM
    software may use configurable or random high ports outside the standard range, so do not treat a known port as the only
    legitimate case.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: Were NetSupport client files written to disk on this host, and from what install path?
  context: Remote access tool deployment leaves file artifacts, the client executable, configuration files, and supporting
    DLLs being written before or around first execution. An install that lands under a user-writable or temporary directory
    rather than Program Files points to operator staging rather than a managed software deployment. Review the writing
    process to see whether an installer, an archive tool, or a script dropped the files.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      filter_netsupport:
        TargetFilename|contains:
          - 'NetSupport'
          - 'PCICFGUI'
          - 'client32'
          - 'nsm.ini'
          - 'NSM.LIC'
      condition: selection and filter_netsupport
    fields:
      - TargetFilename
      - Image
      - User
- question: What process spawned this NetSupport client, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A sanctioned install descends from an installer or a
    managed software-deployment service; explorer.exe indicates interactive user launch. Parents like an Office application,
    mshta.exe, wscript.exe, an archive tool, or a script host indicate macro-driven or staged deployment. Walk up the tree
    to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did the NetSupport client spawn, and do any of them launch shells or living-off-the-land binaries?
  context: Interactive control through a remote access tool surfaces as child processes spawned by the tool's parent, a
    command shell, a script host, or a file-manager action proxied through the agent. A sanctioned support session may spawn
    nothing or only expected diagnostic tools; a shell, powershell.exe, certutil.exe, or reconnaissance binary spawned by the
    agent indicates hands-on-keyboard activity. Review the children and their command lines for follow-on staging.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run the NetSupport client?
  context: A remote access tool that has never been seen on a host is more suspicious than one that runs regularly. Zero or
    very low historical counts indicate first-time or rare execution, which on an endpoint with no support history raises the
    priority of the install-path and connection-destination findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously matched the NetSupport pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even sanctioned remote support tools can be abused. The query mirrors the rule's selection structure scoped to
    this host, so the resulting parent and user distribution reflects how the NetSupport metadata match has historically
    fired here, not generic process activity. A new parent process, an unexpected user account, or an unusual launch pattern is
    the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: NetSupport Client Configurator
      - Product: NetSupport Remote Control
      - Company: NetSupport Ltd
      - OriginalFileName: PCICFGUI.EXE
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: NetSupport Client Configurator
      - Product: NetSupport Remote Control
      - Company: NetSupport Ltd
      - OriginalFileName: PCICFGUI.EXE
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: NetSupport Client Configurator
      - Product: NetSupport Remote Control
      - Company: NetSupport Ltd
      - OriginalFileName: PCICFGUI.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user established remote access on multiple hosts, the scope of the operation may be larger than a single
    endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: NetSupport Client Configurator
      - Product: NetSupport Remote Control
      - Company: NetSupport Ltd
      - OriginalFileName: PCICFGUI.EXE
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege
    escalation, persistence installation, or data staging surrounding the remote access tool execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts matched the NetSupport pattern in the past week, and does the cross-host distribution look like a managed rollout or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    NetSupport metadata match, not generic process activity. Many hosts matching the same pattern points to a managed
    software deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the
    host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Description: NetSupport Client Configurator
      - Product: NetSupport Remote Control
      - Company: NetSupport Ltd
      - OriginalFileName: PCICFGUI.EXE
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or
    credential access, may reveal the stages that preceded the remote access tool execution and help reconstruct the
    timeline. Look for patterns: reconnaissance followed by tool deployment, or tampering followed by persistent access.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
