name: ADSI-Cache File Creation By Uncommon Tool
id: 1af60795-7804-46dd-839b-2323c0109959
description: |
  Detects creation of an Active Directory Schema Cache file (.sch, written under the user's
  \AppData\Local\Microsoft\Windows\SchCache\ directory) by a process outside the expected set of
  AD-aware administrative and management tools. Windows writes this cache when a process enumerates
  the AD schema during ADSI/LDAP operations, so an uncommon writer can indicate a tool performing
  LDAP-based reconnaissance or abusing directory attribute reads and writes as a covert
  command-and-control channel. The rule fires when the .sch write occurs AND the creating process is
  none of the allowlisted system, endpoint-agent, management, or Office binaries; investigation
  should identify the writing process, confirm whether its LDAP activity is expected for this host
  and user, and determine whether it established outbound directory connections.
type: detection
detection_id: 75bf09fa-1dd7-4d18-9af9-dd9e492562eb
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the cache-file path and creating process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the
    exact file path (a .sch file under \Local\Microsoft\Windows\SchCache\), the operation performed,
    and the responsible process against the rule's detection criteria. The rule already excludes the
    common system, endpoint-agent, management console, and Office writers, so the responsible process
    should be one not on that allowlist.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to perform ADSI or LDAP directory operations?
  context: Legitimate administrative activity can trigger this detection. AD schema enumeration is
    routine for directory-management workstations and domain administrators but unusual for a typical
    endpoint or standard user. Knowing whether the user role and host function involve directory
    tooling is often the fastest path to distinguishing a true positive from routine operations; when
    the writer runs as a machine or service account, judge by the writing process and host role.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What did the process that created this cache file do? Decode its command line.
  context: The full command line of the writing process reveals what directory operation was
    performed. Decode any flags, target domain, credential arguments, or connection parameters. The
    file event itself carries no command line, so this pivots to the process-creation record for the
    same process instance. A tool that enumerates the AD schema and then reads or writes user-object
    attributes over LDAP is the pattern this artifact accompanies.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the hash of the writing binary, and does it have known AV or threat-intel detections?
  context: The .sch cache file itself is a passive byproduct and carries no hash. The investigative
    object is the process that wrote it, which is an executable that ran on this host. Its hash is
    recorded on the process-creation event; submit that hash to reputation and threat-intel sources to
    determine whether the writer is a known administrative tool, a renamed or relocated binary, or a
    previously unseen executable.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
- question: What process spawned the writing tool, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate AD tooling usually has
    predictable parents (explorer.exe for interactive administration, a management console, or a
    service host). Unusual parents such as scripting hosts, Office applications, or a hollowed process
    can indicate that the directory activity was launched by a macro, a loader, or injected code
    rather than an administrator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What outbound network connections did the writing process establish, and to which destinations and ports?
  context: A tool that enumerates the AD schema is preparing for LDAP directory reads and writes.
    Outbound connections to a domain controller on 389 (LDAP) or 636 (LDAPS) around the cache-file
    write corroborate directory activity; when directory attribute reads and writes are used as a
    covert command-and-control channel, the traffic looks like ordinary LDAP to the domain controller
    rather than a direct external channel. This lands on endpoint-collected connections that carry the
    process identifier; network-sensor-only records lack process fields and will not appear here.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: Is the cache file still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle informs next steps. A cache still on disk can be located,
    timestamped, and correlated with the writing process; a file deleted shortly after creation can
    indicate anti-forensic cleanup and shifts attention to what the process did in between.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did the responsible process write or delete around the alert?
  context: A process performing directory operations may touch several files - cache artifacts,
    staging output, or dropped components. The breadth, paths, and extensions of the process's other
    file activity distinguish an isolated cache write from broader tooling activity and enumerate what
    else needs review. This covers the writer and its direct children, since droppers often delegate.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What else has been written to the SchCache directory recently, and by which processes?
  context: The SchCache directory holds AD schema cache files and normally sees writes only from a
    small set of directory-aware system and management processes. Other recent arrivals in the same
    directory, and especially unfamiliar writing processes, reveal whether this is an isolated write
    or a location under active use by an uncommon tool.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\Local\Microsoft\Windows\SchCache\'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Does this host normally run the writing tool?
  context: A process that has never been seen on a host is more notable than one that runs regularly.
    Zero or very low historical counts for this binary indicate first-time or rare execution, which
    for a directory-enumeration tool outside the expected administrative set is worth confirming
    against the host's normal function.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection scoped to this user - the result is the user's
    90-day history of this specific cache-write pattern (not generic file activity), aggregated by
    host. A user who has never produced this pattern is more notable than one who does so regularly;
    weigh the count against the user's role and whether directory tooling is part of their normal work.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Local\Microsoft\Windows\SchCache\
        TargetFilename|endswith: .sch
      filter_main_generic:
      - Image|endswith:
        - :\Program Files\Cylance\Desktop\CylanceSvc.exe
        - :\Windows\CCM\CcmExec.exe
        - :\windows\system32\dllhost.exe
        - :\Windows\system32\dsac.exe
        - :\Windows\system32\efsui.exe
        - :\windows\system32\mmc.exe
        - :\windows\system32\svchost.exe
        - :\Windows\System32\wbem\WmiPrvSE.exe
        - :\windows\system32\WindowsPowerShell\v1.0\powershell.exe
      - Image|contains:
        - :\Windows\ccmsetup\autoupgrade\ccmsetup
        - :\Program Files\SentinelOne\Sentinel Agent
      filter_main_office:
        Image|contains|all:
        - :\Program Files\
        - \Microsoft Office
        Image|endswith: \OUTLOOK.EXE
      filter_optional_ldapwhoami:
        Image|endswith: \LANDesk\LDCLient\ldapwhoami.exe
      filter_optional_citrix:
        Image|endswith: :\Program Files\Citrix\Receiver StoreFront\Services\DefaultDomainServices\Citrix.DeliveryServices.DomainServices.ServiceHost.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute
    behavior; the meaningful pivot is the launch mechanism. The query mirrors the rule's selection
    scoped to the alerting program, so the result is the 90-day history of this program driving
    this specific cache-write pattern. A new or rare program for this pattern is the deviation worth
    chasing; a program that already accounts for many prior events is vendor or OS automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Local\Microsoft\Windows\SchCache\
        TargetFilename|endswith: .sch
      filter_main_generic:
      - Image|endswith:
        - :\Program Files\Cylance\Desktop\CylanceSvc.exe
        - :\Windows\CCM\CcmExec.exe
        - :\windows\system32\dllhost.exe
        - :\Windows\system32\dsac.exe
        - :\Windows\system32\efsui.exe
        - :\windows\system32\mmc.exe
        - :\windows\system32\svchost.exe
        - :\Windows\System32\wbem\WmiPrvSE.exe
        - :\windows\system32\WindowsPowerShell\v1.0\powershell.exe
      - Image|contains:
        - :\Windows\ccmsetup\autoupgrade\ccmsetup
        - :\Program Files\SentinelOne\Sentinel Agent
      filter_main_office:
        Image|contains|all:
        - :\Program Files\
        - \Microsoft Office
        Image|endswith: \OUTLOOK.EXE
      filter_optional_ldapwhoami:
        Image|endswith: \LANDesk\LDCLient\ldapwhoami.exe
      filter_optional_citrix:
        Image|endswith: :\Program Files\Citrix\Receiver StoreFront\Services\DefaultDomainServices\Citrix.DeliveryServices.DomainServices.ServiceHost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals whether the directory activity is
    isolated or part of movement across multiple endpoints. If the same user triggered similar
    activity on several hosts in the same window, the scope of the investigation grows.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: Did this same program-driven pattern fire on other hosts in the same window - is this a coordinated automation rollout, or is the activity isolated to this host?
  context: Under a service or machine account, asking what the user did across the network returns
    agent-telemetry noise. The meaningful question is whether the same launch mechanism produced this
    cache-write pattern elsewhere, and the query mirrors the rule's selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts point to scheduled or pushed automation; a
    single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains: \Local\Microsoft\Windows\SchCache\
        TargetFilename|endswith: .sch
      filter_main_generic:
      - Image|endswith:
        - :\Program Files\Cylance\Desktop\CylanceSvc.exe
        - :\Windows\CCM\CcmExec.exe
        - :\windows\system32\dllhost.exe
        - :\Windows\system32\dsac.exe
        - :\Windows\system32\efsui.exe
        - :\windows\system32\mmc.exe
        - :\windows\system32\svchost.exe
        - :\Windows\System32\wbem\WmiPrvSE.exe
        - :\windows\system32\WindowsPowerShell\v1.0\powershell.exe
      - Image|contains:
        - :\Windows\ccmsetup\autoupgrade\ccmsetup
        - :\Program Files\SentinelOne\Sentinel Agent
      filter_main_office:
        Image|contains|all:
        - :\Program Files\
        - \Microsoft Office
        Image|endswith: \OUTLOOK.EXE
      filter_optional_ldapwhoami:
        Image|endswith: \LANDesk\LDCLient\ldapwhoami.exe
      filter_optional_citrix:
        Image|endswith: :\Program Files\Citrix\Receiver StoreFront\Services\DefaultDomainServices\Citrix.DeliveryServices.DomainServices.ServiceHost.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection and not 1 of filter_main_* and not 1 of filter_optional_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the cache write reveals
    what led to this event and what followed - reconnaissance, credential access, or additional tooling
    - and whether the directory activity is one step in a larger sequence. Aggregating by process and
    parent collapses routine agent noise while novel parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access -
    may reveal the stages that preceded the directory activity and help reconstruct the timeline. A
    covert directory channel is typically established after an initial foothold, so prior alerts on the
    host provide context for how the writing process arrived.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
