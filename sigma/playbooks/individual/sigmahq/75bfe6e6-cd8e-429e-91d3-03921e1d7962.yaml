name: Remote Access Tool - ScreenConnect Installation Execution
id: ac03b532-6a35-41cc-836b-032008501e48
description: |
  Detects a ScreenConnect client started with a full set of embedded launch
  parameters (session type, guest process role, port, custom-field tag, and
  encryption-key thumbprint) that configure it to establish remote access back
  to a relay server. Legitimately, IT and managed-service providers deploy
  ScreenConnect with such parameters for sanctioned remote support. Used
  maliciously, the same parameterized install turns commercial remote-management
  software into an external remote-access foothold for persistence and
  hands-on-keyboard access. The investigation should determine whether this
  deployment was authorized, which relay endpoint it connects to, and what
  parent process and user account drove the install.
type: detection
detection_id: 75bfe6e6-cd8e-429e-91d3-03921e1d7962
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line carry the full ScreenConnect remote-access parameter set this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive
    by reviewing the exact command line. The rule fires only when all five launch
    parameters are present together — the Access session type, the Guest process
    role, the relay port field, a custom tagging field, and the encryption-key
    thumbprint field. Confirm these appear in one invocation and read the relay
    server and custom field values for the downstream questions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to install and run a remote access tool?
  context: Legitimate remote access deployments are usually limited to IT support
    staff and managed endpoints. Knowing whether this user role and host function
    are consistent with running remote-management software is often the fastest path
    to distinguishing sanctioned support activity from unauthorized or attacker-deployed access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is ScreenConnect on the organization's approved remote access software list for this host?
  context: Organizations typically maintain a list of sanctioned remote access tools
    and the endpoints they may run on. A ScreenConnect client that appears on a host
    not covered by an approved managed-service or IT-support arrangement may represent
    shadow IT or attacker-deployed persistence. Unauthorized remote access tooling
    should be checked regardless of the tool's commercial reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access install?
  context: Legitimate remote access tool usage typically correlates with an active
    support ticket, a scheduled maintenance window, or a user request. If no support
    context exists for this install, the tool may have been deployed by an attacker
    for persistent access or by a user circumventing security controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What relay server, session GUID, and custom tag are encoded in the ScreenConnect launch parameters?
  context: The launch parameters fully configure the remote session. Decode each
    field from the command line — the relay server URI and port the client calls
    back to, the session GUID, the encryption-key thumbprint, and the custom field
    used to tag this victim. A relay that is not the organization's sanctioned
    ScreenConnect instance, or a custom field that encodes a target identifier,
    reframes this from routine support to operator-controlled access.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What external relay endpoint does this remote access client connect to?
  context: Remote access tools establish outbound connections to relay servers or
    cloud infrastructure. The destination reveals whether the client is reaching the
    organization's sanctioned ScreenConnect relay or a custom relay instance under
    operator control. Compare the connected endpoint against the relay URI decoded
    from the launch parameters. If network telemetry is not collected for this host,
    derive the intended relay from the command-line port and server fields instead.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What process spawned this remote access install and is that parent chain expected?
  context: The parent process reveals how the install was invoked. Vendor or IT
    deployment usually has a predictable parent chain — a software-distribution
    agent, an installer launched from explorer.exe, or a service. A parent such as
    a browser, an Office application, a script host, or an archive utility points to
    a downloaded-and-run delivery consistent with phishing rather than managed deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What email, document, or download brought this remote access installer onto the host?
  context: External remote services are frequently established through an installer
    delivered by phishing — a malicious attachment or a link to a file-sharing
    service that drops a preconfigured remote access client. Identifying the
    delivery vector through the parent process and its command line enables blocking
    at the perimeter and finding other recipients who received the same lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Were there failed-then-successful authentication events on this host around the install time?
  context: External remote access often follows an authentication phase — repeated
    failed logons followed by a successful session, sometimes from an uncommon
    source or outside business hours. Correlating credential-validation and logon
    failure or success events on this host within a short window of the install
    helps establish whether the remote access was preceded by access attempts. If
    these authentication events are not collected in this environment, treat zero
    results as a visibility gap rather than evidence none occurred.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4625
          - 4624
          - 4776
      condition: selection
    fields:
      - EventID
      - User
      - IpAddress
- question: Do VPN, gateway, or remote-access application logs show an external session to this host near the install?
  context: Remote access gateways, VPN concentrators, and remote-access application
    logs record sessions originating from external IP addresses. An external session
    that lands on this host close to the install time helps establish how the actor
    reached the endpoint and whether the source IP or geolocation is consistent with
    sanctioned support. If gateway or remote-access application logs are not ingested
    in this environment, this path must be checked on the gateway directly.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      service: application
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SourceIp
      - User
      - EventID
- question: When this host has previously fired this ScreenConnect parameter pattern, what parents and users drove it, and does this alert fit?
  context: Even sanctioned remote access tools leave a baseline. The query mirrors
    the rule's full parameter pattern scoped to this host, so the resulting
    parent/user distribution reflects how this specific firing pattern has run here
    before — not generic ScreenConnect usage. A new parent process, an unexpected
    user account, or a first-ever appearance of this pattern on the host is the
    deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or
    activity across multiple endpoints. If the same user triggered similar activity
    on several hosts, the scope of access may be larger than this one install.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this ScreenConnect parameter pattern in the past week, and does the distribution look like automation or one-off activity?
  context: The query mirrors the rule's full parameter pattern with no host scope,
    so the result is a fleet-wide count of this specific firing pattern rather than
    generic ScreenConnect usage. Many hosts firing the same pattern points to a
    scripted or vendor deployment; one host or a small unrelated set points to manual
    operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - e=Access&
        - y=Guest&
        - '&p='
        - '&c='
        - '&k='
      condition: selection
    fields:
    - host.name
- question: Were other hosts or users hit by this same ScreenConnect install pattern in the past day?
  context: Remote access deployments delivered by phishing rarely target a single
    user. If one host received a preconfigured remote access installer, others may
    have too. Correlating the same detection across hosts reveals the breadth of the
    activity and identifies additional endpoints that need investigation.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Did other detections fire on this host in the hours before this remote access install?
  context: Alerts rarely happen in isolation. Earlier detections on the same host —
    reconnaissance, defense tampering, or credential access — may reveal the attack
    stages that preceded the remote access install and help reconstruct the full
    timeline of how the foothold was established.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
