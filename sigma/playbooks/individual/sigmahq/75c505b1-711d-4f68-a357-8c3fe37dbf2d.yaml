name: HackTool - SILENTTRINITY Stager DLL Load
id: aaa8df36-4b75-4ace-8a55-0e222bb253fb
description: |
  Detects a loaded module whose file-description metadata contains the string "st2stager", a marker embedded in SILENTTRINITY stager DLLs. SILENTTRINITY is a .NET post-exploitation and command-and-control framework whose implant (Naga) hosts a Boo/.NET runtime in a victim process and compiles post-exploitation modules in memory, sidestepping script-based defenses. A load of this module by a host process is high-confidence offensive-tool activity with essentially no benign explanation; the investigation should confirm the module, characterize the loading process and its command line, enumerate the other modules it pulled in, and determine whether the process established outbound command-and-control.
type: detection
detection_id: 75c505b1-711d-4f68-a357-8c3fe37dbf2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects in its path, description metadata, signing status, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the loaded module path (ImageLoaded), its code-signature status, and the process that loaded it. The rule keys on the module's file-description version metadata containing the marker "st2stager"; verify that marker is present and note whether the module is unsigned and loaded by an unexpected host process. DLL loads carry a hash and signing status on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Description
- question: Is this user and host expected to run software that loads a .NET post-exploitation runtime module?
  context: >-
    Legitimate administrative activity can trigger many detections, but a module carrying the SILENTTRINITY stager marker has no routine business use. Knowing whether the user role and host function are consistent with security tooling, developer workflows, or authorized testing is often the fastest path to distinguishing a sanctioned assessment from a live intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this SILENTTRINITY stager load part of an authorized penetration test or red team engagement?
  context: >-
    Offensive command-and-control frameworks are used in authorized security assessments. Before investing investigation time, check whether a penetration test or red team exercise is currently active on this host or network segment. An authorized engagement with matching tooling, host, and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What capability of the framework was invoked by the process hosting this stager?
  context: >-
    The framework is modular: its in-memory Boo/.NET runtime can compile and run recon (a Seatbelt port), credential-dumping (a Pypykatz port), and AMSI-patching modules. The loading process command line and the set of modules it subsequently loaded reveal which capability was exercised, which determines the scope of potential compromise and the required response actions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What files did the loading process write to the host after the stager module loaded?
  context: >-
    A framework implant writes staging and module artifacts to disk or drops helper tooling even when its primary execution is in memory. Enumerating files created by the loading process confirms activity and reveals its scope even if the original process has exited. Directories under the user profile, ProgramData, and Public are common staging locations.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What DLLs, .NET assemblies, or COM components did this process load, and are any from non-canonical paths, unsigned, or from user-writable directories?
  context: >-
    The set of modules a process loads tells the operator's story when the process itself looks ordinary. The implant hosts a Boo/.NET compiler and loads its runtime assemblies (for example Boo.Lang.Compiler.dll, Boo.Lang.dll, Boo.Lang.Parser.dll) plus the .NET CLR. Look for modules loaded from user-writable directories, unsigned assemblies where signed ones are expected, and .NET runtime components loaded by a process that has no normal reason to host managed code.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For each suspicious module loaded, what is its signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes a routine third-party DLL from a side-loaded malicious one. A genuinely signed DLL loaded from an unexpected location may still be legitimate, while an unsigned module with a system-style filename is a masquerading indicator. Hash lookups against threat intelligence surface known loaders and the Boo/.NET runtime assemblies this framework carries.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What was the full command line of the process that loaded the stager module, and what does it reveal about how it was launched?
  context: >-
    The command line of the host process reveals how the implant was staged and run. Decode any flags, encoded content, file paths, or URLs. This query returns all executions of this binary on the host within the window, which for a process staged in several steps may span multiple sequential invocations that together form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Did the process that loaded the stager module establish outbound network connections consistent with command-and-control?
  context: >-
    The framework's default channel is HTTP/HTTPS (including HTTP/2) with an ECDHE-encrypted body between implant and teamserver, so the loading process reaching out over web ports is the payoff stage of this activity. Watch for a process not normally associated with network activity making outbound connections, asymmetric traffic weighted heavily outbound, and repeated connections to a single external host. IP-anchored review is the most reliable pivot; treat the destination address, port, and direction as the starting point.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What process spawned the process that loaded the stager module, and is that parent chain expected?
  context: >-
    The parent process reveals how the implant host was invoked. Legitimate usage has predictable parent chains (explorer.exe for user actions, services.exe for services). Unusual parents such as mshta.exe, wscript.exe, or an Office application may indicate exploitation or a malicious loader launching the process that hosts the stager.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the process that loaded the stager module?
  context: >-
    A process that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution of the binary hosting the stager.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Has this specific module been loaded on this host before, and under what processes?
  context: >-
    A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same module has been loaded by the same process binary repeatedly over the baseline window, this load is probably routine. If this is the first occurrence, or the module has only been loaded by entirely different processes historically, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Is this module being loaded by other hosts in the environment, especially under unexpected loading processes?
  context: >-
    Cross-host correlation surfaces deployment scope. A module loaded on one host could be a localized incident; the same module loaded across multiple hosts suggests broader deployment or shared offensive tooling. Pay attention to the variety of loading processes: a single module loaded only by its expected process is benign, while the same module loaded by unexpected processes on other hosts suggests lateral progression.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation, or persistence mechanisms near the module load.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
