- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity within roughly fifteen minutes of the connection can
    reveal what led to the Office egress and what followed - reconnaissance, credential access, additional payloads, or
    persistence. Aggregating by parent and child image collapses routine agent telemetry into high-count rows while novel
    process pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, or credential access - may reveal the
    stages that preceded this connection and help reconstruct the timeline. A cluster of alerts leading up to the Office
    egress reframes it as one step in a longer operation rather than an isolated event.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection and exclusion structure with no host scope, so the result is a fleet-wide
    count of this firing pattern rather than generic Office usage. Many hosts reaching the same class of destination points
    to a shared document template, an add-in, or vendor automation worth allow-listing; a single host or a small unrelated
    set points to targeted or operator-driven activity.
