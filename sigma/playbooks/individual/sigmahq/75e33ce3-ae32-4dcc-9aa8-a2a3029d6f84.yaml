name: Office Application Initiated Network Connection To Non-Local IP
id: fb690ab6-fa0f-4782-ae3e-57443218359b
description: |
  Detects an Office application (winword.exe, excel.exe, powerpnt.exe, outlook.exe, wordview.exe)
  initiating an outbound network connection whose destination is neither a private/link-local range
  nor a published Microsoft or Office 365 service range. Office processes normally talk only to
  Microsoft-owned endpoints and internal resources, so an initiated connection to unlisted external
  infrastructure can reflect macro- or exploit-driven download and command-and-control activity,
  including client-execution exploits that make an Office app fetch a second stage over HTTP. The
  destination allow-list is broad and organization-specific, so this rule requires baselining and
  tuning; the investigation should confirm the initiating document, the reputation of the destination,
  and whether the Office process dropped files or spawned interpreters around the connection.
type: detection
detection_id: 75e33ce3-ae32-4dcc-9aa8-a2a3029d6f84
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the destination and port match what this rule detects, and which Office process initiated the connection?
  context: Confirm the alert by reviewing the exact destination IP and port, the connection direction, and the initiating
    Office process against the rule's criteria. The rule fires only when the initiating image is an Office application, the
    connection is outbound (initiated), and the destination falls outside both private/link-local ranges and the published
    Microsoft/Office 365 service ranges. Destination domain is sparsely populated on this telemetry, so anchor on the IP.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to have an Office application reaching out to external infrastructure?
  context: Office applications routinely connect to Microsoft-owned endpoints, but outbound connections to unlisted external
    infrastructure are unusual for most users and hosts. Knowing whether this workstation and user routinely open documents
    that pull remote content (templates, linked images, add-in updaters) is often the fastest way to separate a benign
    business use case from exploit- or macro-driven egress.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What document, email, or link caused this Office application to open and connect?
  context: Client-execution exploitation and malicious macros begin with a delivered file - a document opened from an email
    attachment, a downloaded file, or a link. The parent command line for the Office process usually carries the document
    path or URL it opened; identifying that file enables blocking it at the perimeter and searching for other recipients who
    received the same lure.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Is the Office application up to date with security patches?
  context: Several client-execution techniques abuse known Office parsing and OLE/macro vulnerabilities, including CVE-2021-42292,
    where an Office app is made to fetch and open a second malicious file over HTTP. An unpatched Office install confirms the
    exploitation path was open and flags other similarly unpatched hosts; patch status also helps separate exploitation of a
    known CVE from a possible zero-day.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
- question: Were other users or hosts driven to the same external destination by an Office application?
  context: Phishing and exploitation campaigns rarely target one user. If one Office document initiated a connection to
    unlisted infrastructure, other recipients likely opened the same file. Correlating this rule across the fleet reveals the
    breadth of the delivery and identifies additional hosts that need review.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What document did the Office application open, and what was its full command line?
  context: The Office process command line typically carries the path or URL of the document it opened. Decode it to identify
    the specific file that initiated the outbound request, including any remote template reference or embedded link. This is
    the artifact to pull for further analysis and to search for on other hosts.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is this destination, and what do DNS, WHOIS, and threat intelligence reveal about it?
  context: 'Investigate the destination the Office process reached: passive DNS history, registration age, TLS certificate
    details, and known threat-intelligence hits. Recently registered domains, self-signed certificates, or infrastructure
    with prior malicious history point to attacker-controlled endpoints. Resolved domain is sparsely recorded on this
    telemetry, so run the reputation lookup on the destination IP itself.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process launched this Office application, and is that parent chain expected?
  context: The parent process reveals how the Office application started. A user double-clicking a document usually produces
    an explorer.exe parent; an Office app spawned by an email client, a browser, a script host, or another Office process can
    indicate an automated open of a delivered file. Walk up the chain if the immediate parent is itself unexpected.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Did the alerting Office process spawn any high-risk child processes?
  context: Office applications rarely launch command interpreters or script hosts on their own. Client-execution exploitation
    and malicious macros commonly spawn one of these to run a downloaded payload, so their presence as a child of the Office
    process is a strong pivot toward the next stage. The watched binaries here are powershell.exe, cmd.exe, wscript.exe,
    mshta.exe, rundll32.exe, regsvr32.exe, msiexec.exe, and curl.exe.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
        Image|endswith:
          - \powershell.exe
          - \cmd.exe
          - \wscript.exe
          - \mshta.exe
          - \rundll32.exe
          - \regsvr32.exe
          - \msiexec.exe
          - \curl.exe
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did the alerting Office process write executable or script files to user-writable locations around the connection?
  context: Client-execution exploitation frequently drops a payload into a user-writable path - Downloads, the TEMP or APPDATA
    directories, OneDrive, or Office startup folders - shortly before or after the outbound connection. Files written by the
    Office process itself to these locations, especially executables, scripts, or documents, are candidate second-stage
    artifacts to isolate and analyze.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
- question: Does this host normally communicate with this destination?
  context: A first-time connection to an external destination is more notable than routine, recurring traffic. Zero or very
    low historical counts point to new infrastructure for this host. Known update and content-delivery endpoints and add-in
    updater traffic form the expected baseline; a destination absent from that history warrants the reputation and delivery
    checks.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: When this host has previously fired this rule's pattern, what Office processes and users drove that activity, and does the current alert fit?
  context: Even routine Office egress to unlisted destinations can recur on a given host. The query mirrors the rule's
    selection and exclusion structure scoped to this host, so the resulting program/user distribution reflects how this
    specific firing pattern has historically run here. A new user account, an unexpected Office process, or a first-of-its-kind
    destination is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Image|endswith:
        - \excel.exe
        - \outlook.exe
        - \powerpnt.exe
        - \winword.exe
        - \wordview.exe
        Initiated: 'true'
      filter_main_local_ranges:
