name: DLL Loaded From Suspicious Location Via Cmspt.EXE
id: d6a01b14-d88f-409e-929f-23a77496d2da
description: |
  Detects cmstp.exe loading a DLL or OCX module from a user-writable or non-standard location — PerfLogs, ProgramData, a user profile, Windows\Temp, or C:\Temp. cmstp.exe is a signed Microsoft utility that installs Connection Manager service profiles from an INF file; adversaries abuse it to proxy execution of attacker-supplied code through a trusted binary, loading a malicious module referenced by a crafted INF or retrieved from a remote host. Investigation should confirm the loaded module's path, signature, and hash, identify how cmstp was invoked and by which parent, and look for the file drop, outbound retrieval, or follow-on execution that accompanies proxy-execution abuse.
type: detection
detection_id: 75e508f7-932d-4ebc-af77-269237a84ce1
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its code-signature status, and that the loading process is cmstp.exe. The rule fires when cmstp.exe loads a .dll or .ocx from a user-writable or non-standard location (PerfLogs, ProgramData, a user profile, Windows\Temp, or C:\Temp). Library load events carry the module hash and signing status directly, so a signed Microsoft module loaded from an expected staging path reads differently from an unsigned module dropped into a user directory.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this user and host expected to run cmstp.exe and load Connection Manager profile modules?
  context: cmstp.exe legitimately runs during VPN or dial-up profile installation, usually driven by an installer or management tooling. A profile-installation module loading on a workstation with no such deployment, or under an interactive user who does not manage connections, points away from routine administration. Knowing the host role and the account is often the fastest way to separate a genuine profile install from proxy-execution abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Are files written by cmstp.exe or its child processes still on disk for analysis?
  context: If cmstp staged an INF, scriptlet, or payload as part of the profile-installation flow, capturing those files enables hash lookups, content review, or sandbox submission before they are cleaned up. This correlates file writes to the alerting process and its direct children by process lineage rather than by a path guess.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What DLLs, .NET assemblies, or COM components did cmstp.exe load, and are any unsigned or from user-writable directories?
  context: The full set of modules a process loads tells the operator's story when the command line alone is opaque. Look for modules loaded from a user profile, ProgramData, PerfLogs, or a temp directory; unsigned modules where signed ones are expected; and system-style DLL names loaded from non-system paths, which points to search-order hijacking or a side-loaded payload proxied through the trusted binary.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the module cmstp.exe loaded, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation distinguishes a routine third-party module from a side-loaded malicious one. A validly signed Microsoft module loaded from an unexpected location may still be benign, but an unsigned module — or one whose signature is expired, distrusted, or invalid — carrying a system-style filename is a masquerading indicator. The hash supports a reputation lookup that surfaces known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: What command line launched cmstp.exe, and does it reference an INF file or a remote resource?
  context: The command line reveals how cmstp was driven — a local or remote INF path, a silent-install flag, or a URL indicates the profile-installation flow was invoked to proxy code rather than to configure a real connection. The command line is read from the process-creation record of the same cmstp instance; if process telemetry is not collected, this returns nothing and the module-load evidence carries the analysis. This query returns every cmstp.exe execution on the host in the window, which for a single invocation is the one triggering process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned cmstp.exe and is that parent chain expected?
  context: The parent process reveals how cmstp was invoked. Profile installation is normally driven by an installer, a management agent, or explorer.exe. Office applications, browsers, or scripting hosts (mshta.exe, wscript.exe, powershell.exe) as the parent point to a document-borne or scripted launch rather than legitimate connection management.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did cmstp.exe spawn after the module load?
  context: Proxy execution through a trusted binary often surfaces as unexpected children — cmd.exe, powershell.exe, or other interpreters launched by cmstp for post-exploitation. A profile installation that legitimately configures a connection rarely spawns interactive shells or download utilities.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did cmstp.exe make outbound network connections around the time of the module load?
  context: One CMSTP abuse procedure loads a DLL or scriptlet hosted on a remote server, so an outbound connection initiated by cmstp.exe near the load time is a strong sign the module was retrieved rather than staged locally. Correlate the connection timing with the load and check the destination against known-good infrastructure. Process-attributed network records come from endpoint telemetry; network-sensor events for the same flow carry no process fields.
  range: +/-10m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: Was the loaded DLL or OCX written to disk before it was loaded, and by which process?
  context: The module cmstp loaded had to reach disk first. Finding the write event identifies the dropper process and timing — a payload written by a browser, mail client, archive tool, or script host shortly before the load indicates the file was delivered, not installed by a trusted deployment. Anchor on the module path so the writer is found regardless of which process performed the drop.
  range: -7d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - TargetFilename
      - ProcessGuid
- question: Did cmstp.exe modify any registry values around the time of the module load?
  context: CMSTP abuse can register a malicious Connection Manager profile through registry writes as part of the installation flow. Reviewing values written by the alerting cmstp instance shows whether a profile was registered and where it points. Value data is present on most registry modifications but absent for binary or empty data; registry deletions are not observable here, so frame cleanup checks around re-modification history rather than key removal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Has this specific module been loaded on this host before, and under what processes?
  context: A first-time module load on a host is a stronger anomaly signal than a recurring one. If the same module path has been loaded by cmstp.exe repeatedly over the past 90 days, this load is probably routine profile activity. If this is the first occurrence, or the module has only ever been loaded by unrelated processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity around the load reveals what led to the event and what followed — reconnaissance, privilege escalation, or persistence — and whether the cmstp load is one step in a larger sequence. Novel parent-child pairs stand out at low counts against high-count routine noise.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or a delivery event — may reveal the stages that preceded the module load and help reconstruct the timeline. Proxy execution through a trusted binary is often a mid-chain step rather than the entry point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of the same cmstp module-load pattern rather than generic usage of the binary. Many hosts loading modules from the same suspicious locations points to scripted deployment or vendor automation; one host or a small unrelated set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \cmstp.exe
        ImageLoaded|contains:
        - \PerfLogs\
        - \ProgramData\
        - \Users\
        - \Windows\Temp\
        - C:\Temp\
        ImageLoaded|endswith:
        - .dll
        - .ocx
      condition: selection
    fields:
    - host.name
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Attackers who abuse one signed binary to proxy code often reach for several. If cmstp.exe was used to load an attacker module, check whether rundll32, regsvr32, mshta, msbuild, or similar proxy-execution utilities also ran nearby. Multiple proxy-execution LOLBins in the same window strengthens the case for deliberate abuse over routine administration.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\msdt.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was cmstp.exe executed from its expected system path?
  context: cmstp.exe living outside System32 or SysWOW64 may indicate the binary was copied or renamed to evade path-based allowlists. A cmstp.exe running from a user profile or temp directory is more suspicious than one in the system directory, and the original filename field confirms whether a renamed copy is masquerading as cmstp.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host loaded a module matching this rule's pattern over the past 90 days?
  context: A cmstp module-load pattern with no prior history on a host is more suspicious than one that recurs under stable conditions. The query mirrors the rule's selection scoped to this host, so the count reflects the rule's specific firing pattern rather than generic cmstp usage. A zero or very low historical count points to first-time activity worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        Image|endswith: \cmstp.exe
        ImageLoaded|contains:
        - \PerfLogs\
        - \ProgramData\
        - \Users\
        - \Windows\Temp\
        - C:\Temp\
        ImageLoaded|endswith:
        - .dll
        - .ocx
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - CommandLine
