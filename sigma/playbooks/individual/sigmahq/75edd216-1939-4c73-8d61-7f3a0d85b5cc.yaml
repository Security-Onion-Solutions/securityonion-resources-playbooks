name: File Download Via InstallUtil.EXE
id: 6cb969c9-88ae-48c9-92cc-4fedcd19613e
description: |
  Detects the .NET installer utility InstallUtil.exe (identified by Image ending in \InstallUtil.exe or by OriginalFileName)
  invoked with a command line that contains a ftp://, http://, or https:// URL. The rule fires only when both conditions
  hold together: the InstallUtil.exe binary AND a network URL on the command line. This is a living-off-the-land download
  pattern that proxies file retrieval through a trusted, Microsoft-signed binary, with downloaded content landing in the
  INetCache path. Legitimate InstallUtil use installs or uninstalls local .NET assemblies and rarely takes a remote URL, so
  the investigation should decode the full command line, identify and reputation-check the destination, confirm the parent
  and user are expected to invoke InstallUtil, and determine whether the downloaded content was staged for follow-on execution.
type: detection
detection_id: 75edd216-1939-4c73-8d61-7f3a0d85b5cc
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with InstallUtil.exe carrying a ftp, http, or https URL?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and
    process details. The rule fires only when both halves hold together, an InstallUtil.exe binary (by Image ending in
    \InstallUtil.exe or by OriginalFileName) AND a command line containing ftp://, http://, or https://. Confirm both are
    present in the actual event and read off the full URL.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run InstallUtil.exe against a remote URL?
  context: Legitimate InstallUtil use installs or uninstalls local .NET assemblies and almost never references a remote URL.
    Knowing whether the user role and host function involve .NET assembly management, and whether remote retrieval through this
    utility is ever expected here, is often the fastest path to separating a true positive from routine developer or admin work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Decode the full InstallUtil.exe command line. What URL is referenced and what is being retrieved or installed?
  context: The full command line reveals the specific action taken. Read off the complete ftp/http/https URL, the file or
    assembly being pulled, and any install or uninstall switches. Downloaded content lands in the INetCache path under the
    user profile, so note the expected on-disk artifact for follow-up. The query scopes to all InstallUtil.exe executions on
    this host carrying a URL within the window so sequential staging invocations stay together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'ftp://'
          - 'http://'
          - 'https://'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the destination on the command line? What do DNS, WHOIS, and threat intel reveal about it?
  context: 'Investigate the URL host extracted from the command line: DNS resolution history, registration age, TLS certificate
    details, and known threat intelligence hits. Recently registered domains, raw IP literals, self-signed certificates, or
    known C2 infrastructure point to attacker-controlled download servers; an internal mirror or a well-known software vendor
    points toward legitimate retrieval.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains:
          - 'ftp://'
          - 'http://'
          - 'https://'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Did this host actually make the outbound connection, and does it normally communicate with that destination?
  context: First-time connections to a destination are more suspicious than routine communication. Correlate the InstallUtil.exe
    process with network telemetry to confirm the transfer occurred and establish whether this host has talked to that endpoint
    before. A new destination paired with a trusted-binary download is the combination worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
- question: What process spawned InstallUtil.exe, and is that parent chain expected?
  context: The parent process reveals how InstallUtil.exe was invoked. Legitimate usage often descends from build tooling,
    an installer, or an interactive shell run by an administrator. Parents like mshta.exe, wscript.exe, an Office application,
    or an archive tool indicate macro-driven or staged execution rather than routine assembly management. Walk up the tree
    to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did InstallUtil.exe spawn afterward?
  context: The processes spawned after the download reveal its actual impact. A benign install usually spawns nothing notable;
    a download cradle commonly spawns cmd.exe, powershell.exe, certutil.exe, or the freshly retrieved payload itself to
    continue staging. Review the children and their command lines for follow-on execution.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally run InstallUtil.exe?
  context: An InstallUtil.exe execution that has never been seen on a host is more suspicious than one that runs regularly as
    part of software deployment. Zero or very low historical counts indicate first-time or rare execution, which on a host with
    no .NET deployment role raises the priority of the download finding.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even a trusted binary can be abused. The query mirrors the rule's selection structure scoped to this host, so the
    resulting parent and user distribution reflects how this specific InstallUtil-with-URL firing pattern has historically run
    here, not generic InstallUtil usage. A new parent process, an unexpected user account, or an unusual command structure is the
    anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \InstallUtil.exe
      - OriginalFileName: InstallUtil.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \InstallUtil.exe
      - OriginalFileName: InstallUtil.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \InstallUtil.exe
      - OriginalFileName: InstallUtil.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity across multiple endpoints. If
    the same user triggered similar activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \InstallUtil.exe
      - OriginalFileName: InstallUtil.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    persistence installation, or data staging that surrounds the download.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or
    credential access, may reveal the stages that preceded this download and help reconstruct the timeline. Look for patterns:
    tampering followed by execution, or reconnaissance followed by retrieval and staging.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were any other download LOLBins used on this host recently?
  context: Attackers who use one living-off-the-land binary to fetch a payload often use several. If InstallUtil.exe pulled a
    file via URL, check whether certutil, bitsadmin, curl, or other trusted binaries with download capability were also used.
    Finding multiple download LOLBins performing the same retrieval objective strengthens the case for malicious staging.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\esentutl.exe'
          - '\expand.exe'
          - '\extrac32.exe'
          - '\makecab.exe'
          - '\replace.exe'
          - '\hh.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Was InstallUtil.exe executed from its expected System32 or SysWOW64 path?
  context: InstallUtil.exe normally lives under the .NET Framework directories within System32 or SysWOW64. A copy running from
    a user temp directory, a download folder, or another user-writable path may indicate the binary was relocated or renamed to
    evade path-based allowlists. Compare the Image path against OriginalFileName to spot a renamed copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the rule's InstallUtil-with-URL pattern over the past 90 days, and what command-line
    patterns are typical?
  context: A LOLBin download pattern with no prior history on a host is more suspicious than one used regularly under stable
    parents. The query mirrors the rule's selection structure scoped to this host, so the resulting count reflects the rule's
    specific firing pattern, not generic InstallUtil usage. The command-line projection lets the analyst compare typical
    invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \InstallUtil.exe
      - OriginalFileName: InstallUtil.exe
      selection_cli:
        CommandLine|contains:
        - ftp://
        - http://
        - https://
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
