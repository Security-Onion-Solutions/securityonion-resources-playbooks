name: Write Protect For Storage Disabled
id: 47b95edd-460d-4b4c-8010-faf65613d1dc
description: |
  Detects a command line that modifies the StorageDevicePolicies\WriteProtect value under
  HKLM\System\CurrentControlSet\Control to re-enable writes to removable storage. Setting this
  flag to 0 removes a machine-wide write-block on removable media; IT administrators clear it
  legitimately when imaging or deploying systems, but adversaries clear it to stage or exfiltrate
  data to USB devices. Determine which process issued the change, whether the user and host are
  expected to manage removable-media policy, and whether the modification is accompanied by other
  defense-tampering or data-staging activity.
type: detection
detection_id: 75f7a0e2-7154-4c4d-9eae-5cdb4e0a5c13
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing
    the exact command line against the rule's criteria. The rule fires when a single command line
    contains all of the StorageDevicePolicies path under \System\CurrentControlSet\Control, the
    "Write Protection" string, the value 0, and the word storage — i.e. a command setting the
    removable-storage WriteProtect flag to 0 (writes allowed).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to manage removable-storage write-protection policy?
  context: Legitimate administrative activity can trigger this detection — imaging, deployment, and
    USB-policy management all touch StorageDevicePolicies. Knowing whether the user role and host
    function are consistent with changing removable-media policy is often the fastest path to
    distinguishing a routine operation from operator tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exact value was written to the storage write-protect setting, and what control did
    it weaken?
  context: Decode the full command line to confirm the WriteProtect DWORD under
    StorageDevicePolicies was set to 0 (writes allowed) rather than 1 (write-protected), and note
    whether the key was created or an existing value overwritten. Setting it to 0 removes a
    machine-wide block on writing to removable media, which is a precondition for staging or
    exfiltrating data to USB devices.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What registry key and value were modified, and is StorageDevicePolicies a known
    evasion location?
  context: The registry path reveals intent. HKLM\System\CurrentControlSet\Control\StorageDevicePolicies
    with the WriteProtect DWORD governs whether removable media can be written machine-wide; a value
    of 0 enables writes. If a corresponding registry write event exists, the TargetObject and Details
    fields give the exact key path and data without parsing them from the command line.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What process spawned the tool that made this change, and is that parent chain expected?
  context: The parent process reveals how the registry modification was invoked. A change driven by
    explorer.exe during interactive administration looks different from one spawned by a script host,
    Office application, or remote-execution utility. An unusual parent points to automated or
    operator-driven tampering rather than routine maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Which binary issued the storage write-protect change, and is it an expected
    administrative tool for this operation?
  context: The rule keys on the command line, not on a specific binary, so identify the executable
    that carried the modification — reg.exe, powershell.exe, cmd.exe, or another interpreter — and
    confirm it is a tool an administrator would legitimately use here. Authorized maintenance
    utilities that touch StorageDevicePolicies can be excluded from suspicion; an unexpected or
    renamed binary issuing the same change is the deviation worth chasing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: selection and _pb_scope
    fields:
      - Image
      - CommandLine
      - User
- question: When this host has previously fired this storage write-protect pattern, what parents and
    users normally drive it, and does the current alert fit that pattern?
  context: Even routine policy changes leave a baseline. The query mirrors the rule's selection
    scoped to this host, so the parent/user distribution reflects how this specific write-protect
    change has historically run here rather than generic tool usage. A new parent process, an
    unexpected user account, or a first-time appearance of the pattern is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Is removable-storage write protection currently restored, or is the host still left
    writable?
  context: The change may be temporary (for a specific maintenance action) or persistent. Confirm
    the current StorageDevicePolicies\WriteProtect state — whether write protection has been
    re-enabled or the host still allows unrestricted writes to removable media. If the host remains
    writable without a justified business reason, the policy should be restored before further
    investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What activity occurred on this host after removable-storage writes were re-enabled?
  context: Re-enabling writes to removable media is typically a precursor to using that capability.
    Examining process activity immediately after the change reveals what it was meant to enable —
    archiving utilities, file-copy operations to removable volumes, or staging tools. A burst of
    file or copy activity in this window points to data staging for exfiltration over physical media.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense-tampering actions performed on this host around the same time?
  context: An actor who weakens one control often weakens several — clearing logs, stopping
    security services, deleting shadow copies, or changing firewall rules alongside the storage
    policy change. Finding multiple tampering events from the same user or parent process within a
    short window indicates a coordinated effort to remove controls rather than an isolated
    administrative action.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Were other registry modifications made on this host in the same session?
  context: Actors who modify one registry value often modify several — pairing a removable-storage
    policy change with security-tool, persistence, or firewall registry edits. Clusters of registry
    write operations from the same user within a short window reveal the full scope of configuration
    changes and whether multiple objectives were pursued. The triggering StorageDevicePolicies change
    itself can be set aside to surface the additional edits.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_reg:
        Image|endswith:
          - '\reg.exe'
          - '\regedit.exe'
        CommandLine|contains:
          - ' add '
          - ' delete '
          - ' import '
          - '/s '
      condition: selection and selection_reg
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or coordinated
    action across multiple endpoints. If the same user triggered similar policy changes or staging
    activity on multiple hosts, the scope of the operation may be larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around the alert reveals the
    immediate context — what led to the storage policy change, what happened after, and whether it
    is part of a larger sequence. Look for reconnaissance, additional defense tampering, or data
    staging that provides broader context.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — reconnaissance, credential access, or other defense
    tampering — may reveal the attack stages that preceded re-enabling removable-storage writes and
    help reconstruct the full timeline. The sequence of alerts often tells the story leading up to
    data staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts fired this storage write-protect pattern in the past week, and does the
    cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide
    count of this specific write-protect change rather than generic tool usage. Many hosts firing the
    same pattern points to scripted deployment or imaging automation; one host or a small unrelated
    set points to manual operator activity. Use the host distribution to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        CommandLine|contains|all:
        - \System\CurrentControlSet\Control
        - Write Protection
        - '0'
        - storage
      condition: selection
    fields:
    - host.name
