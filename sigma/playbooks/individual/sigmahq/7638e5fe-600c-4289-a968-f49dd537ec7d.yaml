name: HackTool - NetExec Execution
id: 56028cec-c0c4-4396-b6d1-07d446890c25
description: |
  Detects execution of NetExec (nxc.exe, formerly CrackMapExec), a post-exploitation framework for Active
  Directory enumeration and lateral movement. The rule fires when the process image ends in nxc.exe AND the
  command line carries one of the protocol subcommands the tool drives (ftp, ldap, mssql, nfs, rdp, smb, ssh,
  vnc, winrm, or wmi). NetExec automates host discovery, credential validation, and remote command execution
  across many systems, so legitimate firings come from security staff running authorized assessments. The
  investigation should decode which protocol and action were invoked, confirm whether the operator and host
  are expected to run offensive network tooling, identify the source of the activity, and determine how far
  the enumeration or lateral movement spread.
type: detection
detection_id: 7638e5fe-600c-4289-a968-f49dd537ec7d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line match what this rule detects, with an nxc.exe process carrying a NetExec protocol subcommand?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when both halves match together, a process whose image ends in nxc.exe AND a command line containing one of the protocol subcommands (ftp, ldap, mssql, nfs, rdp, smb, ssh, vnc, winrm, or wmi). Confirm the binary and the subcommand are both present in the actual event.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Is this user and host expected to run offensive network tooling like NetExec?
  context: Legitimate use comes from penetration testers, red teams, and network administrators running authorized assessments; standard users and general-purpose endpoints rarely run a multi-protocol enumeration framework. Knowing whether the user role and host function involve security testing is often the fastest path to distinguishing an authorized engagement from hands-on-keyboard activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this NetExec execution part of an authorized penetration test or red team engagement?
  context: NetExec is a standard tool in authorized network assessments. Before investing investigation time, check whether a pentest or red team exercise is currently active on this host or network segment. An authorized engagement with matching tool usage, source host, and timing resolves the alert without further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly did NetExec do? Decode the command line to identify the protocol, targets, and credentials supplied.
  context: 'The full command line reveals the specific operation. Read the protocol subcommand (smb, ssh, winrm, mssql, etc.), the target range or host list, and the authentication material passed via -u/-p, -H (hash), or -k (Kerberos). The arguments distinguish a read-only host sweep from credential spraying or remote command execution. The query scopes to all nxc.exe executions on this host within the window, since a single operation often spans several sequential invocations against different protocols or ranges.'
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned nxc.exe, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. Interactive operator use typically descends from explorer.exe or a shell (cmd.exe, powershell.exe); remote-driven execution descends from wmiprvse.exe, wsmprovhost.exe, or a service process. An office application, script host, or archive tool as parent points to staged or macro-driven launch. Walk up the tree to see what spawned the parent.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What child processes did nxc.exe spawn afterward?
  context: The processes spawned by NetExec reveal its actual impact. Remote command execution modules launch cmd.exe or powershell.exe to run payloads on targets, and credential modules may write output to local files. A run that spawns shells or living-off-the-land binaries points to active exploitation rather than a read-only enumeration sweep.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did other reconnaissance commands run on this host around the same time?
  context: A single enumeration run may be troubleshooting, but multiple reconnaissance commands in rapid succession, net user, nltest, nslookup, arp, nbtstat alongside NetExec, is a signature pattern of post-compromise enumeration. The presence of several different recon binaries within a tight window points to automated reconnaissance preceding lateral movement. This also surfaces the bursty-execution timing the technique is tuned around.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_recon:
        Image|endswith:
          - '\whoami.exe'
          - '\systeminfo.exe'
          - '\ipconfig.exe'
          - '\net.exe'
          - '\net1.exe'
          - '\nltest.exe'
          - '\dsquery.exe'
          - '\nbtstat.exe'
          - '\arp.exe'
          - '\netstat.exe'
          - '\tasklist.exe'
          - '\qprocess.exe'
          - '\query.exe'
          - '\quser.exe'
          - '\hostname.exe'
          - '\nslookup.exe'
          - '\adfind.exe'
          - '\csvde.exe'
          - '\ldifde.exe'
          - '\dnscmd.exe'
          - '\cmdkey.exe'
          - '\setspn.exe'
      condition: selection and selection_recon
    fields:
      - Image
      - User
- question: Are known NetExec artifacts present on the host?
  context: NetExec leaves characteristic artifacts even after the process exits. It writes a per-protocol results database under the operator profile (for example a workspaces smb.db file in an nxc directory) and stages dumped credentials, shares listings, and command output to disk. Checking for these files confirms execution and reveals the scope of what was enumerated or harvested.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What inbound remote connections reached this host, and is the source an expected administrative origin?
  context: Lateral movement requires a source and destination. If NetExec is being driven against this host, or if a remote operator landed here first, inbound connections on remote-service ports reveal whether the activity came from a known admin jump box, a compromised workstation, or an unexpected source. The protocol subcommands NetExec drives map onto these ports, so the source identity helps separate authorized administration from pivoting.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: Did a remote logon for this user precede the NetExec activity, and what logon type and source address was used?
  context: NetExec frequently runs after an operator has authenticated to the host over a remote service. Correlating the process activity with authentication events shows whether a network or remote-interactive logon (type 3 or type 10) for the same account immediately preceded the tool run, and from what source address. A remote logon followed by offensive tooling, especially from an unexpected address, points to operator-driven lateral movement rather than local administration. If security logon events are not collected in this environment, treat the absence of results as a visibility gap rather than evidence no remote logon occurred.
  range: -1h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID:
          - 4624
          - 4648
        TargetUserName|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - IpAddress
      - LogonType
      - EventID
- question: Does this host normally run nxc.exe?
  context: A binary that has never been seen on a host is more suspicious than one that runs regularly. Zero or very low historical counts indicate first-time or rare execution, which on a host outside the security team's assessment scope raises the priority of the decoded operation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and does the current alert fit that pattern?
  context: Even sanctioned tooling has a baseline. The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user distribution reflects how NetExec's specific firing pattern has historically run here, not generic binary usage. A new parent process, an unexpected user account, or an unusual command-line structure is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \nxc.exe
        CommandLine|contains:
        - ' ftp '
        - ' ldap '
        - ' mssql '
        - ' nfs '
        - ' rdp '
        - ' smb '
        - ' ssh '
        - ' vnc '
        - ' winrm '
        - ' wmi '
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \nxc.exe
        CommandLine|contains:
        - ' ftp '
        - ' ldap '
        - ' mssql '
        - ' nfs '
        - ' rdp '
        - ' smb '
        - ' ssh '
        - ' vnc '
        - ' winrm '
        - ' wmi '
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \nxc.exe
        CommandLine|contains:
        - ' ftp '
        - ' ldap '
        - ' mssql '
        - ' nfs '
        - ' rdp '
        - ' smb '
        - ' ssh '
        - ' vnc '
        - ' winrm '
        - ' wmi '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If the same user drove NetExec or follow-on commands on multiple hosts in the same window, the scope of the operation is larger than a single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \nxc.exe
        CommandLine|contains:
        - ' ftp '
        - ' ldap '
        - ' mssql '
        - ' nfs '
        - ' rdp '
        - ' smb '
        - ' ssh '
        - ' vnc '
        - ' winrm '
        - ' wmi '
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the NetExec firing pattern, not generic usage of the binary. Many hosts firing the same pattern points to scripted deployment or a sanctioned assessment; one host or a small unrelated set points to manual operator activity. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \nxc.exe
        CommandLine|contains:
        - ' ftp '
        - ' ldap '
        - ' mssql '
        - ' nfs '
        - ' rdp '
        - ' smb '
        - ' ssh '
        - ' vnc '
        - ' winrm '
        - ' wmi '
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: 'Alerts rarely happen in isolation. Earlier detections on the same host, defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. Look for patterns: reconnaissance followed by lateral movement, or credential access followed by remote execution.'
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
