name: Wmiprvse Wbemcomn DLL Hijack
id: 3cc1e181-9ebc-44f8-8473-5c16144d07af
description: |
  Detects the WMI provider host process (wmiprvse.exe) loading a module named wbemcomn.dll from
  the C:\Windows\System32\wbem\ directory. Legitimately, wmiprvse.exe loads the signed system
  wbemcomn.dll as part of normal WMI operation; a load of that module after it has been replaced
  on disk indicates a DLL search-order hijack, where an actor has remotely written a malicious
  wbemcomn.dll over an administrative share to run code inside the WMI provider host. Because the
  provider host handles network requests under the NETWORK SERVICE account, a successful hijack
  yields code execution on the target as that account. Investigation should confirm the loaded
  module's signature and hash, identify the remote source that wrote the DLL, and determine what
  the provider host executed afterward.
type: detection
detection_id: 7707a579-e0d8-4886-a853-ce47e4575aaa
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded module match what this rule detects — path, signature, and loading process?
  context: Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded),
    its code-signature status, and the loading process against the detection criteria. The rule fires
    when wmiprvse.exe loads a module whose path ends in \wbem\wbemcomn.dll, so both conditions must
    hold together. A load event carries the module's signing status and hash directly, so the
    genuine signed system wbemcomn.dll can be distinguished from a planted replacement on this event.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
      - ImageLoaded
- question: Is this host expected to service remote WMI operations, and under what account did the load occur?
  context: WMI provider hosts run on essentially every Windows system, but remote WMI activity against
    a given host is not always routine. Knowing whether the host is a normal target of remote
    management, and whether the load ran under NETWORK SERVICE (remote-connection handling) versus an
    interactive user, is often the fastest way to separate routine operation from an attacker-planted
    module load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which modules did the WMI provider host load, and are any unsigned or from non-canonical paths?
  context: The set of modules wmiprvse.exe loads tells the operator's story. Look for the wbem\wbemcomn.dll
    module loaded with an unexpected signature or from a rewritten on-disk copy, and for any additional
    unsigned DLLs the provider host pulled in during the same window. The legitimate wbemcomn.dll is a
    signed Microsoft component in System32\wbem; an unsigned or altered copy at that path is the
    hijack signal.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded wbemcomn.dll, what is its signing status, hash, and threat-intel reputation?
  context: Module reputation separates the routine signed system DLL from a side-loaded malicious one.
    A genuinely signed Microsoft wbemcomn.dll loaded from System32\wbem is expected; an unsigned module,
    an expired or invalid signature, or a Microsoft-style filename with no valid signature at that path
    is a masquerading indicator. Hash lookups against threat intelligence surface known loaders.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Is the planted wbemcomn.dll still on disk, and which process wrote it?
  context: If a malicious wbemcomn.dll was written into System32\wbem, checking whether it still exists
    enables deeper analysis — hash lookup, sandbox submission, content review. The writing process is
    also informative, since a remote share write typically surfaces as the local System process creating
    the file, distinct from the WMI provider host that later loads it.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\wbem\wbemcomn.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What launched this WMI provider host instance, and is that parent chain expected?
  context: The parent reveals how the provider host was started. Normal wmiprvse.exe instances are
    launched by the DCOM/WMI service infrastructure (svchost.exe hosting the WMI service). A provider
    host with an unexpected parent, or one spawned in an unusual way, is worth scrutiny alongside the
    hijacked module load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did the WMI provider host spawn afterward?
  context: Code running inside the hijacked provider host frequently launches follow-on processes to
    carry out its objective. Command interpreters, script hosts, or reconnaissance binaries spawned by
    wmiprvse.exe after the module load reveal the actual commands executed under the NETWORK SERVICE
    account. The child command lines are the concrete record of what ran.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously loaded wbemcomn.dll into the WMI provider host, what programs and users normally drive it, and does the current alert fit?
  context: Even the legitimate wbemcomn.dll is loaded routinely by wmiprvse.exe. The query mirrors the
    rule's selection scoped to this host, so the resulting program/user distribution reflects how this
    specific load pattern has historically run here — expect wmiprvse.exe itself in the Image column.
    An unexpected account or an otherwise unusual profile is the deviation worth chasing; image-load
    events carry no parent lineage, so pivot to the wmiprvse.exe start event if ancestry matters.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \wmiprvse.exe
        ImageLoaded|endswith: \wbem\wbemcomn.dll
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Has wbemcomn.dll been loaded on this host before, and under which processes?
  context: A first-time or rare load of this module is a stronger anomaly than a recurring one. If
    wbemcomn.dll has been loaded by wmiprvse.exe repeatedly over the past 90 days, this load is likely
    routine. If it is the first occurrence, or the module has historically been loaded only by
    different processes, the current load is anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Have other hosts fired this same load pattern in the past week, and does the distribution look like automation or targeted activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this
    specific load pattern rather than the generic footprint of wmiprvse.exe. Many hosts loading a
    replaced wbemcomn.dll in the same window points to broad automated deployment or a spreading
    operation; a single host or small unrelated set points to targeted activity. Use the distribution
    to calibrate scope.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: image_load
    detection:
      selection:
        Image|endswith: \wmiprvse.exe
        ImageLoaded|endswith: \wbem\wbemcomn.dll
      condition: selection
    fields:
    - host.name
- question: What host initiated the remote connection to this system, and is it an expected administrative source?
  context: A remote wbemcomn.dll hijack starts with a write over an administrative share (C$), which
    arrives as an inbound connection on SMB or related remote-management ports. Identifying the
    originating host reveals whether the connection came from a known admin jump box or an unexpected
    source. An attacker who has compromised one host uses it as a pivot to reach others.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account and authentication method were used to reach this host — valid credentials, pass-the-hash, or Kerberos ticket?
  context: Writing to an administrative share and driving remote WMI both require authentication. The
    account and logon method reveal how access was obtained. Pass-the-hash and pass-the-ticket bypass
    password entry; legitimate credential use suggests the attacker already holds valid passwords from
    dumping, phishing, or prior compromise.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What processes were spawned on this host after the remote access was established?
  context: Lateral movement is a means to an end — attackers move to execute commands, deploy tools, or
    access data on the target. Examining processes that started shortly after the remote-write and
    module-load window reveals the objective pursued on this host beyond the provider-host children
    alone.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account connected to or run remote-execution tools against other hosts?
  context: >-
    Attackers rarely stop at one target. If the account tied to this activity is moving to If
    this alert fired under SYSTEM, LOCAL SERVICE, NETWORK SERVICE, or a machine account (name
    ending in $), this query intentionally returns nothing — a user pivot on a service principal
    matches every host's background automation, not an actor; assess movement through the host-
    and program-scoped questions instead.

    multiple systems with remote-execution tooling, the scope of compromise is larger. Many hosts
    reached from one account in a short window indicates active lateral movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
        - \psexec.exe
        - \psexec64.exe
        - \mstsc.exe
        - \ssh.exe
        - \plink.exe
        - \wmic.exe
      filter_svcprin_builtin:
        User:
        - SYSTEM
        - LOCAL SERVICE
        - NETWORK SERVICE
      filter_svcprin_machine:
        User|endswith: $
      condition: (selection and selection_lateral) and not 1 of filter_svcprin_*
    fields:
    - host.name
    - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate
    context: what led to this event, what happened after, and whether it is part of a larger sequence.
    Look for reconnaissance, privilege escalation, or persistence activity in the same window.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, credential access —
    may reveal the stages that preceded this event and help reconstruct the timeline. Remote code
    execution via a provider-host hijack is often one step in a longer multi-stage operation.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: What WMI provider-load and event-subscription activity occurred on this host around the alert?
  context: Code running inside a hijacked wbemcomn.dll executes within the WMI provider host, so the
    operational WMI channel records the provider load and any event-subscription the intruding code
    registers. Provider-load records (event 5857) name the module the provider host bound; permanent
    and temporary subscription records (events 5861 and 5860) reveal WMI-based persistence created in
    the same window, often against the \root\subscription namespace. This channel is host-dependent —
    if the operational WMI log is not collected here, treat an empty result as a visibility gap rather
    than evidence nothing happened.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - Operation
      - User
