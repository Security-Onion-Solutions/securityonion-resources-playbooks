name: WMIC Remote Command Execution
id: 5687bfb8-1518-404b-b7b5-80c11b8ca14b
description: |
  Detects wmic.exe (by image name or original filename) invoked with a /node: argument that targets a remote system, while excluding loopback references (localhost, 127.0.0.1). The /node: switch directs WMI operations at a named remote host, so this pattern represents command execution or information gathering reaching across the network rather than against the local machine. Legitimate administrators and management tooling do use wmic /node: for inventory and remote queries, but the same pattern is heavily abused for remote process creation, discovery, and lateral movement; the investigation should determine the remote target, the WMI operation requested, who ran it, and whether the activity fits established administrative automation.
type: detection
detection_id: 7773b877-5abb-4a3e-b9c9-fd0369b59b00
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line show wmic invoked with a /node argument against a non-loopback target?
  context: Confirm the alert is a true positive by reviewing the exact command line and process
    details. The rule fires when the process is wmic.exe (by image name or original filename)
    AND the command line contains the /node switch AND its value is not localhost or 127.0.0.1.
    Read the /node argument to identify the remote host being targeted and the WMI verb or
    alias that follows.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to run remote WMI queries via wmic with a /node argument?
  context: Legitimate remote administration and inventory tooling uses wmic with /node to query or
    manage other systems. Knowing whether this user's role and this host's function involve
    remote WMI management is often the fastest way to separate routine administration from
    operator activity. Workstations and non-management servers rarely originate remote WMI
    commands.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What remote target and WMI operation did this wmic invocation request? Decode the full command line.
  context: The full command line reveals the specific remote action. Read the /node value to
    identify the remote host or host list, then decode the alias or verb that follows -- for
    example process call create (remote process execution), an aliased query such as process,
    service, useraccount, share, or qfe (remote discovery), or a class/path escape into raw
    WMI. Note any embedded /user and /password credentials, the namespace, and whether the command
    writes output or launches a payload on the target.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains: '/node:'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was wmic.exe executed from its expected System32 wbem path?
  context: wmic.exe normally lives at C:\Windows\System32\wbem\WMIC.exe. Execution from a
    user-writable or non-standard directory may indicate the binary was copied or renamed to
    evade path-based allowlists. The rule also matches on OriginalFileName, so a renamed copy
    will still alert; compare the Image path against the expected location.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: Did this host make outbound connections to the remote target around the time of the alert?
  context: Remote WMI execution opens a DCOM/RPC session to the target over port 135 followed by
    a dynamically assigned high port, so a genuine remote operation produces a corresponding
    outbound connection. Correlating the wmic process with network connections to the remote
    target confirms the command reached a live host and identifies which system was contacted.
    No matching connection suggests the call failed or the target was unreachable.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\WMIC.exe'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
      - User
- question: Did WMI activity operation events appear on the targeted remote host in the same window?
  context: >-
    Remote WMI execution leaves operational traces on the target as WMI provider and
    subscription events. If telemetry from the targeted system is collected, look for provider
    starts (5857) and subscription registrations (5860, 5861) that line up in time with this
    command -- the host.name column identifies the target, and winlog.user_data.ProviderName,
    winlog.user_data.Query, winlog.user_data.CONSUMER, and the message narrative confirm what
    ran there. If WMI operational logging is not ingested for the target, treat the absence as a
    visibility gap rather than evidence nothing happened.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      product: windows
    detection:
      selection:
        Channel: 'Microsoft-Windows-WMI-Activity/Operational'
        EventID:
          - 5857
          - 5860
          - 5861
      condition: selection
    fields:
      - host.name
      - EventID
      - winlog.user_data.ProviderName
      - winlog.user_data.CONSUMER
      - winlog.user_data.Query
      - message
- question: How often has this host run wmic over the past 90 days?
  context: A process that has never been seen on a host is more suspicious than one that runs
    regularly. Zero or very low historical counts for wmic on this host indicate first-time or
    rare execution, which raises the priority of the remote-execution pattern. Stable recurring
    counts point to established management tooling.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: How often has this host fired the rule's wmic remote-node pattern over the past 90 days, and what command-line structures are typical?
  context: A remote-WMI pattern with no prior history on a host is more suspicious than one used
    regularly under stable parents. The query mirrors the rule's selection structure scoped to
    this host, so the resulting count reflects the rule's specific firing pattern -- wmic with
    a /node argument against non-loopback targets -- not generic wmic usage. The command-line projection
    lets you compare typical remote-target patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|windash: '/node:'
      filter_main_localhost:
        CommandLine|contains:
        - localhost
        - 127.0.0.1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - CommandLine
- question: When this host has previously fired the rule's wmic remote-node pattern, what parents and users drive it, and does this alert fit?
  context: Even routine remote-management tooling produces a stable parent/user fingerprint. The
    query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific remote-WMI pattern has historically run
    here. A new parent process, an unexpected user account, or an unusual command-line structure is
    the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|windash: '/node:'
      filter_main_localhost:
        CommandLine|contains:
        - localhost
        - 127.0.0.1
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|windash: '/node:'
      filter_main_localhost:
        CommandLine|contains:
        - localhost
        - 127.0.0.1
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|windash: '/node:'
      filter_main_localhost:
        CommandLine|contains:
        - localhost
        - 127.0.0.1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity
    spanning multiple endpoints. If the same user triggered similar remote-WMI activity on
    multiple hosts, the scope of the operation may be larger than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \WMIC.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|windash: '/node:'
      filter_main_localhost:
        CommandLine|contains:
        - localhost
        - 127.0.0.1
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_* and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
- question: Were any other lateral-movement or remote-execution binaries used on this host recently?
  context: Operators who use wmic for remote execution often reach for other remote-execution and
    lateral-movement utilities in the same operation -- if wmic ran with a /node argument here, check whether
    psexec-style services, sc, schtasks against remote targets, or other proxy-execution LOLBins
    were also used. Finding several utilities aimed at the same objective strengthens the case
    for operator activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\certutil.exe'
          - '\bitsadmin.exe'
          - '\curl.exe'
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\msiexec.exe'
          - '\installutil.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\schtasks.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\reg.exe'
          - '\mavinject.exe'
          - '\xwizard.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining activity around this event reveals the
    immediate context -- what led to the remote-WMI command, what happened after, and whether it
    is part of a larger sequence. Look for preceding reconnaissance, credential access, or
    follow-on remote execution.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense
    tampering, reconnaissance, or credential access -- may reveal the stages that preceded this
    remote-WMI command and help reconstruct the timeline. Remote execution is often a mid-chain
    action that follows initial access and discovery.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
