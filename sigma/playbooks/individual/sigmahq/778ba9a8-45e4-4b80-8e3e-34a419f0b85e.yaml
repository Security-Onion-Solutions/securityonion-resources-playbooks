name: TeamViewer Domain Query By Non-TeamViewer Application
id: 1c9c0fb7-a687-4f97-99e5-cb16ce278897
description: |
  Detects a DNS query for a TeamViewer infrastructure domain (taf.teamviewer.com or udp.ping.teamviewer.com) made by a
  process whose image name does not contain "TeamViewer". These domains are normally resolved only by the genuine TeamViewer
  client, so a lookup from any other process can indicate a renamed or masquerading binary using remote-access infrastructure
  for command and control, shadow-IT remote support, or a misconfigured third-party application. Investigation should identify
  the querying process and its lineage, whether the lookup resolved and the host then connected out, and whether the remote
  access is authorized.
type: detection
detection_id: 778ba9a8-45e4-4b80-8e3e-34a419f0b85e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the queried domain match a TeamViewer infrastructure domain, and which non-TeamViewer process queried it?
  context: Confirm the alert by reviewing the exact domain (QueryName) against the rule's targets — taf.teamviewer.com and
    udp.ping.teamviewer.com — and the querying process. The rule fires only when one of these domains is resolved AND the
    querying process image does not contain "TeamViewer", so verify both the domain and that the process is not the genuine
    client.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
- question: Is this user and host expected to run an application that resolves TeamViewer infrastructure domains?
  context: Legitimate remote-support activity is usually confined to known support staff and jump hosts. Knowing whether the
    user role and host function are consistent with remote-access software helps distinguish sanctioned support from shadow
    IT or an implant running under an unexpected account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is the querying application an approved remote access or support tool on this host?
  context: Organizations typically sanction a specific remote-access tool for IT support. A process that resolves TeamViewer-only
    infrastructure domains yet is not named TeamViewer may be a renamed remote-management binary, shadow IT, or attacker-deployed
    persistence. Unauthorized tools should be checked regardless of the underlying product's reputation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a current helpdesk ticket or support session explaining this remote access?
  context: Legitimate remote-access usage usually correlates with an active support ticket, a scheduled maintenance window,
    or a user request. If no support context exists, the tool may have been installed for persistent access or by a user
    circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the queried TeamViewer domain resolving to expected infrastructure, and does threat intel flag it?
  context: The alert is a DNS lookup, not a connection. Assess the domain itself — passive DNS, resolution history, and threat
    intel — and whether the lookup actually resolved. taf.teamviewer.com and udp.ping.teamviewer.com normally resolve to
    TeamViewer-operated infrastructure; a lookup that fails, resolves to unexpected space, or is flagged points to abuse or
    redirection rather than routine client traffic.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What is the full command line and working directory of the process that made this query?
  context: The command line and launch directory reveal what the querying binary is and how it was invoked. Decode any flags,
    paths, or embedded URLs, and note whether the process runs from a user-writable or temporary directory, which is a common
    install location for masquerading remote-access binaries.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the querying application, and is that parent chain expected?
  context: The parent process reveals how the querying binary was launched. A user-initiated remote-support tool typically
    descends from explorer.exe or a services chain; parents such as script hosts, Office applications, or archive utilities
    suggest the process was dropped and run as part of an intrusion. Expected parents vary by environment, so compare against
    the host's normal launch pattern.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What external endpoint did the querying process connect to, and on which port?
  context: After resolving the domain the process may open an outbound session. DNS resolution is a separate event, so anchor
    on the process and review the destination it reaches. Remote-access tools may use non-standard or configurable high ports
    (for example 7070 or 5650) in addition to standard web ports; connections to unexpected addresses or ports, rather than
    to established TeamViewer infrastructure, indicate custom command-and-control.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What other domains did this process query around the time of the alert?
  context: A single lookup may be part of a broader resolution pattern. Reviewing every domain the same process queried in
    the window can reveal beaconing, additional remote-access infrastructure, or algorithmically varied domains that point
    to automated command-and-control rather than a one-off client action.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: What files did the querying process create on this host?
  context: A remote-access or masquerading binary often drops additional payloads, configuration, or installer artifacts.
    Correlating file creation by the same process surfaces staged delivery or an installation footprint that a DNS lookup
    alone does not show.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: Has this host queried this TeamViewer domain before?
  context: A first-time resolution of TeamViewer infrastructure by a process on this host is more suspicious than a recurring
    lookup tied to sanctioned support. Zero or very low historical counts indicate a new or unusual domain lookup for this
    host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Does this host normally run the querying binary?
  context: A process that has rarely or never run on this host is more suspicious than one that executes routinely. Zero or
    very low historical counts over the baseline period indicate first-time or rare execution of the querying binary.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did other hosts in the environment query this same TeamViewer domain?
  context: If only one host resolves this domain it may be targeted or an isolated masquerading tool; if many hosts resolve
    it, it may reflect a sanctioned deployment or widespread activity. The distribution across hosts informs whether this
    is a contained event or a fleet-wide pattern.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - host.name
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the surrounding window reveals what led to the
    lookup and what followed — reconnaissance, persistence, or execution of additional tooling — and whether the query is
    one step in a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host — defense tampering, reconnaissance, or credential access — may reveal the
    stages that preceded this lookup and help reconstruct the timeline leading to the remote-access activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
