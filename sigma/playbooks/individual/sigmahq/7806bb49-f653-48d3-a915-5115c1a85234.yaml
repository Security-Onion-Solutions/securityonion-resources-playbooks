name: Potential APT Mustang Panda Activity Against Australian Gov
id: 6f8e0ebe-df79-45e6-9503-b677195951dc
description: |
  Detects a command line that either copies a DLL named SolidPDFCreator.dll into the user-writable
  directory C:\Users\Public\Libraries\PhotoTvRHD\, or writes a CurrentVersion\Run value named SolidPDF
  that points into that same directory. Both branches belong to one staging pattern: a signed
  application executable is placed in a directory any user can write to, an operator-supplied DLL
  carrying the name that executable imports is dropped beside it, and a Run key — frequently paired
  with a scheduled task — then launches the signed executable so the DLL is side-loaded on every logon.
  The matched strings are hardcoded literals with no routine administrative use, so the investigation
  should establish which branch fired, whether the DLL was written and subsequently loaded, and which
  persistence entries now reference the directory.
type: detection
detection_id: 7806bb49-f653-48d3-a915-5115c1a85234
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the command line either copy SolidPDFCreator.dll into C:\Users\Public\Libraries\PhotoTvRHD\,
    or write a CurrentVersion\Run value named SolidPDF pointing into that directory?
  context: >-
    The rule fires when either branch matches on its own, so read the full command line and note which
    one did. A copy-branch match means the side-load payload is being staged and persistence may not
    exist yet, which puts the weight on the file-write and DLL-load questions. A Run-branch match means
    persistence is being written and the payload was likely staged earlier, which puts the weight on
    the registry and prior-staging questions. A single command line frequently satisfies both, since
    the copy and the reg add are commonly chained together.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: >-
    Is this user or host expected to copy DLLs into C:\Users\Public\Libraries or write application Run
    keys from the command line?
  context: >-
    Software deployment and packaging occasionally stage files under C:\Users\Public and register
    startup entries, so confirming whether this account and host have any such role is the fastest way
    to separate a sanctioned install from an operator staging a side-load. The directory name and value
    name here are specific literals rather than a vendor path, which makes a legitimate explanation
    narrow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this activity part of an authorized penetration test or red team engagement?
  context: >-
    Offensive-security teams replay published intrusion command lines during authorized assessments and
    detection-validation exercises, and these literal strings are a common test case. Check whether an
    engagement or a detection test is active on this host or segment with matching timing before
    investing further analysis; an authorized exercise resolves the alert without deeper work.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which files did the alerting command and its children write, and is the staged DLL still on disk?
  context: >-
    A copy into the staging directory produces a file write that can be recovered for analysis, and the
    same command chain often lands more than one file — the signed executable it side-loads into, plus
    any additional payload. Correlating file activity to the alerting process and its direct children
    enumerates what was placed on disk and whether it is still there to collect.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Which operations are chained into this single command line beyond the one that matched the rule?
  context: >-
    This staging pattern is typically issued as one command interpreter invocation with several
    operations joined by the shell's separator — a copy of the DLL, a reg add of a Run value, and a
    schtasks create for a second persistence path. Reading the whole line identifies every operation
    that ran under the alerting process, including any the rule's selections do not cover, which is what
    determines how many persistence mechanisms need to be removed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: >-
    What other commands on this host referenced the C:\Users\Public\Libraries\PhotoTvRHD\ directory
    around the alert?
  context: >-
    The staging operation frequently spans several sequential invocations that together form one logical
    action — the file copy, the registry write, and a scheduled-task creation. Scoping to the staging
    path rather than to the command interpreter itself avoids the interpreter's routine volume while
    still returning every command that touched the directory, so the full operation can be read in one
    place.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'C:\Users\Public\Libraries\PhotoTvRHD\'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Was SolidPDFCreator.dll written into the staging directory, and what does the file contain?
  context: >-
    The command line asserts a copy; the file event confirms it happened and names the process that
    performed it. Retrieve the file from the endpoint and examine it — a side-load payload exports the
    symbols the legitimate host executable imports while carrying loader code, so check imports and
    exports, embedded strings, URLs, and packer or signing status. Compare it against the vendor's
    genuine DLL of the same name; the file being unsigned or a different size from the legitimate one
    is what distinguishes a payload from a relocated copy.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: '\PhotoTvRHD\SolidPDFCreator.dll'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: Did a process load SolidPDFCreator.dll from the staging directory, and what are its hash and signing status?
  context: >-
    A DLL carries its hash on the load event, so this returns the loading process, the hash, and the
    signature state without needing the file itself. Submit the hash to threat intelligence to
    determine whether it is known. A load from C:\Users\Public\Libraries rather than the application's
    install directory, by a signed executable of the matching name, is the side-load completing — which
    means the payload is executing rather than merely staged. If the DLL was written but never loaded,
    the operation was interrupted before execution.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith: '\SolidPDFCreator.dll'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: Was a Run key value written on this host around the alert, and what does it point at?
  context: >-
    The command line states an intended registry write; the registry event confirms whether it landed
    and records the value data. A CurrentVersion\Run entry whose data points into a user-writable
    directory rather than an install path is a persistence entry that survives reboot and must be
    removed. Other Run values written in the same window may reveal additional persistence from the
    same operation. Value deletion is not observable in this telemetry, so verify current key state on
    the host directly rather than inferring removal from an absence of events.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentVersion\Run\'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
- question: What process spawned this command, and is that parent chain expected?
  context: >-
    The parent identifies how the staging command was invoked. An interactive shell under explorer.exe
    points to hands-on-keyboard activity or a user opening a lure; a script host, an archive utility, an
    Office application, or a signed binary running from a temporary directory points to a delivery
    document or loader that reached the host earlier. Walking up from the parent reconstructs the entry
    point that preceded the staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Staging and persistence sit in the middle of an intrusion, not at its start. Activity in the
    surrounding window reveals what delivered the payload and what followed it — archive extraction,
    document handling, scheduled-task creation, or discovery commands. Repetitive high-count rows are
    routine host and agent telemetry; novel parent-child pairs at low counts are what to read.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host may show the delivery and execution stages that preceded the
    staging — a document or archive spawning an interpreter, a download, or a loader running from a
    temporary path. Their sequence reconstructs how the host was reached and how much of the chain
    completed before this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: >-
    Has this host previously produced the rule's pattern, and if so what parents and users drove that
    activity?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the result is this host's 14-day
    history of these specific literal strings rather than generic command interpreter usage. Because the
    strings have no routine administrative use, any prior occurrence is itself worth reading: a
    repeating parent and user suggests a detection test or a replayed sample, while a first-ever
    occurrence under an ordinary user account is the deviation to pursue.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - copy SolidPDFCreator.dll
        - C:\Users\Public\Libraries\PhotoTvRHD\SolidPDFCreator.dll
      selection_2:
        CommandLine|contains|all:
        - 'reg '
        - \Windows\CurrentVersion\Run
        - SolidPDF
        - C:\Users\Public\Libraries\PhotoTvRHD\
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- always_include: true
  question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their 90-day history of these
    literal strings across all hosts rather than generic use of a command interpreter. A security
    engineer or packager with a repeating history points toward testing; a first occurrence under an
    account with no such role, or the same account producing the pattern on several hosts, points toward
    an operator using that identity.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - copy SolidPDFCreator.dll
        - C:\Users\Public\Libraries\PhotoTvRHD\SolidPDFCreator.dll
      selection_2:
        CommandLine|contains|all:
        - 'reg '
        - \Windows\CurrentVersion\Run
        - SolidPDF
        - C:\Users\Public\Libraries\PhotoTvRHD\
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: >-
    Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and
    the launch mechanism is the meaningful pivot. The query mirrors the rule's selection scoped to the
    alerting parent, giving that parent's 90-day history of driving this pattern, aggregated by host. A
    parent that has never done this before is the deviation to pursue; a parent already accounting for
    many prior events across many hosts points to a test harness or deployment mechanism.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - copy SolidPDFCreator.dll
        - C:\Users\Public\Libraries\PhotoTvRHD\SolidPDFCreator.dll
      selection_2:
        CommandLine|contains|all:
        - 'reg '
        - \Windows\CurrentVersion\Run
        - SolidPDF
        - C:\Users\Public\Libraries\PhotoTvRHD\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- always_include: true
  question: What else did this user do across the network around this time?
  context: >-
    Tracking the account's activity on every host in the alert window shows whether the staging is
    confined to one endpoint or whether the same identity is operating elsewhere, which sets the scope
    of the response. If the alert fired under a machine account or a built-in service principal, expect
    this to return routine agent telemetry rather than operator activity, and read the parent-scoped
    fleet question instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- always_include: true
  question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity
    isolated to this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host
    rather than operator activity. The query instead mirrors the rule's selection scoped to the alerting
    parent, fleet-wide, in the alert window. Several hosts in the same window points to a pushed or
    scheduled rollout — automation or a fleet-wide detection test; a single host points to a host-local
    trigger such as a document opened by one user.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - copy SolidPDFCreator.dll
        - C:\Users\Public\Libraries\PhotoTvRHD\SolidPDFCreator.dll
      selection_2:
        CommandLine|contains|all:
        - 'reg '
        - \Windows\CurrentVersion\Run
        - SolidPDF
        - C:\Users\Public\Libraries\PhotoTvRHD\
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution
    look like consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, giving a fleet-wide count of these
    literal strings. Many hosts firing the same pattern in a short window points to a scripted push or a
    detection-validation run; one host or a small unrelated set points to manual activity on a specific
    endpoint. The host list also defines how far remediation of the staging directory and the Run value
    has to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains|all:
        - copy SolidPDFCreator.dll
        - C:\Users\Public\Libraries\PhotoTvRHD\SolidPDFCreator.dll
      selection_2:
        CommandLine|contains|all:
        - 'reg '
        - \Windows\CurrentVersion\Run
        - SolidPDF
        - C:\Users\Public\Libraries\PhotoTvRHD\
      condition: 1 of selection_*
    fields:
    - host.name
