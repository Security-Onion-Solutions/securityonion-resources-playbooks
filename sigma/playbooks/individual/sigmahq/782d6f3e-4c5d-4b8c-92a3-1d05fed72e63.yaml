name: RDP Port Forwarding Rule Added Via Netsh.EXE
id: 3ea97ca8-20d7-4846-8a3d-c7a433902f1a
description: |
  Detects netsh.exe configuring an interface portproxy rule that forwards a listening
  port to TCP 3389 (RDP). The rule fires when the process is netsh (by Image or
  OriginalFileName) AND the command line carries the abbreviated portproxy arguments
  together with the 3389 destination. On a jump box this lets an operator pivot RDP into a
  segmented network without disrupting concurrent legitimate sessions; netsh accepts
  heavily truncated arguments, so the surrounding command line should be decoded for the
  listen port, listen address, and connect address. Legitimate administration can produce
  this, so the investigation should establish who ran it, what the forward maps to, and
  whether the host is an expected source of remote-access changes.
type: detection
detection_id: 782d6f3e-4c5d-4b8c-92a3-1d05fed72e63
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match the rule — netsh being used with portproxy arguments that forward a listening port to 3389?
  context: Before investing investigation time, confirm the alert is a true positive. The
    rule fires only when the process is netsh and the command line contains the abbreviated
    portproxy switches together with the 3389 destination. Read the full command line and
    confirm it is configuring a port-forward to RDP rather than an unrelated netsh
    operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to configure port-forwarding or remote-access rules?
  context: Legitimate administrative activity routinely triggers this detection. A network
    or IT engineer configuring portproxy on a designated jump box is far less concerning
    than the same command under a standard user or on a workstation that has no
    administrative role. Knowing whether the account and host function are consistent with
    remote-access configuration is often the fastest path to a disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is netsh portproxy forwarding to RDP an approved configuration on this host?
  context: Organizations typically restrict where inbound RDP and port-forwarding rules may
    be configured, often to a small set of designated jump boxes. A portproxy-to-3389 rule
    on a host that is not a sanctioned pivot point may represent shadow administration or
    operator-deployed lateral-movement infrastructure, and should be checked regardless of
    who configured it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a change ticket or maintenance window explaining this port-forwarding change?
  context: Legitimate portproxy changes usually correlate with a documented administrative
    task, a firewall or remote-access change request, or a scheduled maintenance window. If
    no operational context exists for configuring a forward to RDP on this host, the rule
    may have been added to provide persistent or covert remote access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What exactly does this netsh command configure? Decode the listen port, listen address, and connect address.
  context: netsh accepts heavily abbreviated arguments (for example `i p a v l=8001
    listena=<IP> connectp=3389 c=<IP>`), so the literal command line must be parsed rather
    than read at a glance. Decode which local port is being opened, on what address it
    listens, and which host and port 3389 forwards to — the connect address identifies the
    internal RDP target the operator is bridging to. Scoping to all netsh executions on
    this host within the window captures any preceding or follow-up portproxy commands that
    form one logical operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned netsh, and is that parent chain expected for a configuration change?
  context: The parent process reveals how netsh was invoked. Interactive administration
    usually descends from explorer.exe or a console shell run by a named user; portproxy
    configuration spawned by a script host, a remote-execution service, or an unexpected
    automation parent points to non-interactive or operator-driven activity. Legitimate
    system processes such as svchost rarely spawn network-capable configuration commands,
    so an unusual parent is worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: After this rule was added, did this host make or receive RDP-bridging connections, or outbound connections on common proxy ports?
  context: A portproxy rule only matters once traffic flows through it. Look for connections
    involving 3389 that route through the configured listen port, and for outbound
    connections on high-numbered or well-known proxy ports such as 1080, 8080, and 4444,
    which indicate the bridged path is in use. A forward that is configured but never
    carries traffic is a weaker signal than one with an active session behind it.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 3389
          - 1080
          - 8080
          - 4444
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
- question: What internal or external endpoint does this forward bridge RDP traffic to?
  context: A portproxy forward exposes one address-and-port to another. The connect address
    reveals whether RDP is being bridged to an internal host in a segmented network (jump-box
    pivoting) or to an unexpected destination. Network connections from this host to 3389
    around the alert time identify the destination side of the bridge.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort: 3389
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What hosts connected inbound to this host on remote-access ports around the alert?
  context: A port-forward needs a source feeding it and a destination behind it. Identifying
    inbound connections on RDP and other remote-access ports reveals whether the traffic
    arriving at this jump box comes from a known administrative source or from an unexpected
    or localhost-routed origin. A source address of 127.0.0.0/8 on an RDP logon indicates a
    tunneled session routed from a local listening port rather than a direct remote login.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
          - 3389
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What processes were spawned on this host after the port-forwarding rule was added?
  context: Configuring a forward is a means to an end. Examining processes that start shortly
    after the portproxy rule is added reveals whether an interactive RDP session followed, or
    whether tooling, reconnaissance, or further pivoting was launched through the bridged
    path. Quiet hosts with no follow-on activity weaken the case; new interactive or
    administrative processes strengthen it.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - User
      - Image
- question: Has this user account used remote-access or tunneling tools against other hosts?
  context: Attackers rarely stop at one pivot. If the same account is also running RDP
    clients, SSH, or tunneling utilities against multiple systems, the scope of activity is
    larger than this single host. Connections to many hosts from one account in a short
    window indicate active lateral movement rather than an isolated configuration change.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
- question: When this host has previously fired this portproxy-to-RDP pattern, what parents and users drove it, and does the current alert fit?
  context: Even routine administrative tooling can be abused. This query mirrors the rule's
    selection scoped to this host, so the resulting parent and user distribution reflects how
    this specific firing pattern has historically run here — not generic netsh usage. A new
    parent process, an unexpected account, or an unusual command-line structure is the deviation
    worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' i'
        - ' p'
        - =3389
        - ' c'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' i'
        - ' p'
        - =3389
        - ' c'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' i'
        - ' p'
        - =3389
        - ' c'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or
    parallel activity on multiple endpoints. If the same user configured forwards or ran
    remote-access tooling on several hosts in the same window, the scope of the activity is
    larger than this single configuration change.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' i'
        - ' p'
        - =3389
        - ' c'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts configured this portproxy-to-RDP pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: This query mirrors the rule's selection with no host scope, so the result is a
    fleet-wide count of the same firing pattern rather than generic netsh usage. Many hosts
    configuring identical forwards points to scripted deployment or vendor automation; one
    host or a small unrelated set points to manual operator activity. Use the host
    distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \netsh.exe
      - OriginalFileName: netsh.exe
      selection_cli:
        CommandLine|contains|all:
        - ' i'
        - ' p'
        - =3389
        - ' c'
      condition: all of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense
    tampering, reconnaissance, or credential access — may reveal the stages that preceded the
    port-forwarding change and help reconstruct the full timeline leading up to the pivot.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
