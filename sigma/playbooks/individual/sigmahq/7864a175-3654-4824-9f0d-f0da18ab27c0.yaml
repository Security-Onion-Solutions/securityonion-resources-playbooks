name: Password Set to Never Expire via WMI
id: e41e1397-e8af-4a46-a914-6233eda89911
description: |
  Detects wmic.exe modifying a user account so its password never expires, via a command line that contains all of useraccount, set, passwordexpires, and false. Disabling password expiration on an account keeps a credential valid indefinitely and is a common way to durably preserve access to a compromised or attacker-controlled account, including built-in accounts that were re-enabled. Legitimate administrators do occasionally set this attribute, so the investigation should establish which account was changed, who and what process drove the change, and whether surrounding account-manipulation or re-enablement activity occurred on the host.
type: detection
detection_id: 7864a175-3654-4824-9f0d-f0da18ab27c0
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does the command line match a wmic useraccount set passwordexpires=false invocation?
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact command line and process details. The rule fires only when wmic.exe (or a binary with OriginalFileName wmic.exe) runs with a command line containing all of useraccount, set, passwordexpires, and false, so verify those tokens are present and read which account name the change targeted.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - CommandLine
- question: Is this user and host expected to modify account password-expiration settings from the command line?
  context: Legitimate administrative activity can trigger this detection. Knowing whether the acting user role and host function include account administration is often the fastest path to distinguishing a routine change from an attacker preserving access. Account-management hosts (domain controllers, admin jump boxes) and identity-admin users make this routine; an arbitrary workstation and a non-admin user do not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Which account did this wmic command target, and what exactly was changed?
  context: The full command line reveals which account was modified and how the WMI query was scoped. Read the where clause to identify the target account name (built-in accounts such as Guest or other re-enabled default accounts are a notable case), and confirm the set operation only disabled password expiration rather than chaining additional attribute changes. The query scopes to wmic executions carrying the useraccount/set/passwordexpires/false pattern on this host so multiple sequential account-change invocations that form one operation are visible together.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        CommandLine|contains|all:
          - useraccount
          - ' set '
          - passwordexpires
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned this wmic execution and is that parent chain expected?
  context: The parent process reveals how wmic was invoked. Account changes driven from an interactive cmd.exe or powershell.exe launched by a remote-access tool, or from an unusual scripting host, point to operator activity, while management tooling or a documented automation parent points to routine administration. Walk the parent up further if the immediate parent is itself a shell.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What other account-manipulation commands ran on this host in the surrounding window?
  context: Disabling password expiration rarely stands alone. The same operator commonly re-enables or creates an account, sets a password, and adds it to a privileged local group around the same time. Surfacing net.exe and net1.exe activity (user creation, /active:yes re-enablement, localgroup membership changes) in the surrounding window shows whether this password-expiration change is one step in an account-takeover sequence or an isolated administrative tweak.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\net.exe'
          - '\net1.exe'
        CommandLine|contains:
          - 'user '
          - 'localgroup '
      condition: selection
    fields:
      - CommandLine
- question: Do account-management security events on this host confirm which account was changed, enabled, or added to a privileged group?
  context: Process command lines show the tool that was run, but the authoritative record of the resulting account change lives in account-management audit events. Correlate the wmic change with user-account-changed, user-account-enabled, and member-added-to-security-group events for the same target account to confirm the modification took effect and to catch companion changes (a re-enabled built-in account, or a new membership in Administrators or Remote Desktop Users) that the process logs alone may not reveal. If account-management auditing is not collected in this environment, treat the absence of these events as a visibility gap rather than evidence nothing changed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      service: security
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4722
          - 4738
          - 4732
          - 4728
      condition: selection
    fields:
      - EventID
      - TargetUserName
      - SubjectUserName
- question: Did wmic on this host make a remote connection consistent with a remote WMI operation rather than a local account change?
  context: WMI can target remote hosts as well as the local machine. A local password-expiration change produces no outbound WMI connection, so an outbound DCOM/WMI connection (typically TCP 135 plus a high ephemeral port) originating from wmic around the alert time indicates the operation reached across the network and may have changed an account on another host. Correlate connection timing with the wmic process to separate local-only changes from remote account manipulation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: '\wmic.exe'
        Initiated: true
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - CommandLine
- question: Do WMI provider operational events on this host corroborate a user-account modification through the WMI provider?
  context: The WMI service emits operational events when a provider executes a method or query, independent of the process_creation record for wmic. Reviewing WMI activity events around the alert time corroborates that the account change went through the WMI provider and can reveal additional WMI-driven operations (subscriptions, remote method calls) that the command line alone does not show. If WMI operational logging is not ingested in this environment, treat zero results as a visibility gap rather than evidence nothing ran.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      product: windows
      service: wmi
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - EventID
      - User
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - useraccount
        - ' set '
        - passwordexpires
        - 'false'
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - useraccount
        - ' set '
        - passwordexpires
        - 'false'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting user's activity across all hosts in the surrounding window reveals whether the account change is part of broader hands-on activity or lateral movement. The same user driving similar account or tool activity on multiple hosts widens the apparent scope.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - useraccount
        - ' set '
        - passwordexpires
        - 'false'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Was wmic.exe executed from its expected System32 or SysWOW64 path?
  context: wmic.exe executed from a non-standard path (outside System32 or SysWOW64) may indicate the binary was copied or renamed to evade path-based allowlists. A wmic.exe running from a user temp or download directory is more notable than one in System32, and the OriginalFileName field confirms whether a renamed binary triggered the rule.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: How often has this host fired the wmic password-expiration pattern over the past 90 days, and what command-line structures are typical?
  context: A pattern with no prior history on a host is more notable than one used regularly under stable parents. The query mirrors the rule's selection structure scoped to this host, so the count reflects the rule's specific firing pattern rather than generic wmic usage. The command-line projection lets the analyst compare typical invocation patterns against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_img:
      - Image|endswith: \wmic.exe
      - OriginalFileName: wmic.exe
      selection_cli:
        CommandLine|contains|all:
        - useraccount
        - ' set '
        - passwordexpires
        - 'false'
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were any other proxy-execution or persistence LOLBins used on this host recently?
  context: Operators who use one living-off-the-land binary often use several. After an account-manipulation step via wmic, check whether other proxy-execution or persistence binaries (rundll32, mshta, schtasks, reg, sc, bitsadmin) ran on the host in the same day. Multiple LOLBins working toward the same objective strengthen the case for malicious activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\schtasks.exe'
          - '\reg.exe'
          - '\sc.exe'
          - '\at.exe'
          - '\bitsadmin.exe'
          - '\certutil.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After keeping a credential valid by disabling password expiration, they commonly install backup mechanisms using scheduled tasks, services, registry Run keys, BITS jobs, or WMI subscriptions. Multiple persistence installations from the same timeframe indicate intentional stacking rather than an isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host (defense tampering, account re-enablement, reconnaissance, credential access) may reveal the attack stages that preceded this account change and help reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
