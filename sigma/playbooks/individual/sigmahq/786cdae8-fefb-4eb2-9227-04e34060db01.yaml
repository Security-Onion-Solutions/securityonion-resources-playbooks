name: Suspicious Wordpad Outbound Connections
id: fc82462a-9916-495d-90c0-eaccc655fec0
description: |
  Detects wordpad.exe initiating an outbound network connection to a destination
  port that is not one of the common service ports (80, 139, 443, 445, 465, 587,
  993, 995). Wordpad is a document viewer with no routine need to reach external
  hosts, so an initiated egress from it - especially over an uncommon port - often
  reflects injected code (a beacon or other command-and-control stager) running
  inside the wordpad process. Investigation should identify the destination and its
  reputation, determine whether the wordpad process was launched and behaving
  normally or shows signs of injection, characterize the connection cadence for
  beacon-like timing, and scope the pattern across the host and fleet.
type: detection
detection_id: 786cdae8-fefb-4eb2-9227-04e34060db01
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the destination and port match what this rule detects, and which process initiated it?
  context: Confirm the alert by reviewing the exact destination and port, the connection direction,
    and the initiating process against the rule's criteria - an initiated (egress) connection from
    wordpad.exe to a destination port outside the common set (80, 139, 443, 445, 465, 587, 993, 995).
    The initiating-process fields are present only when the connection was recorded by endpoint
    telemetry; a network-sensor record of the same flow may carry no process attribution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to make outbound connections from wordpad.exe?
  context: Wordpad reaching an external host is unusual regardless of user, but knowing the host's
    role and the logged-in user still helps calibrate. A workstation where a user opened a document
    differs from a server with no interactive document use; either way, wordpad has no built-in
    reason to initiate egress on a non-standard port.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is this destination? What do DNS, WHOIS, and threat intel reveal?
  context: Investigate the contacted host - passive DNS history, registration age, TLS certificate
    details, and any threat-intelligence matches. Recently registered domains, self-signed
    certificates, or infrastructure already flagged as command-and-control point to an
    attacker-controlled endpoint. The resolved hostname is frequently absent on the connection
    record because name resolution is logged as a separate event; pivot through the host's DNS
    lookups if only the IP is present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: How was wordpad.exe launched on this host, and what document or arguments did it carry?
  context: The command line shows whether wordpad was opened against a document (a normal user
    action) or launched with no file argument, which is more consistent with a process created only
    to host injected code. Decode any file path or argument present. Process fields resolve only for
    executions recorded by endpoint telemetry.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned wordpad.exe and is that parent chain expected?
  context: A legitimate wordpad launch typically descends from explorer.exe or another user-facing
    shell. Parents such as script hosts, Office applications, mshta.exe, or a service process are
    unusual for a document viewer and may indicate the process was started to carry injected code or
    was hollowed after launch.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What destinations and ports did wordpad.exe connect to on this host around the alert?
  context: A single external destination is consistent with one command-and-control channel; several
    internal destinations or a spread of ports can indicate the injected code is also performing
    reconnaissance or lateral movement. Reviewing the full set of connections wordpad initiated
    characterizes the intent beyond the one flow that fired the rule.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith|expand: '%Image%'
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: How many times did wordpad.exe connect to this destination, and is the timing regular?
  context: Repeated connections from wordpad to the same destination at consistent intervals are a
    hallmark of automated beaconing rather than a one-off transfer. A high, evenly spaced count
    strengthens the command-and-control interpretation; a single connection points toward a
    one-time action to characterize on its own merits.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith|expand: '%Image%'
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
- question: Does this host normally communicate with this destination?
  context: First-time connections to a destination are more notable than routine traffic. A history
    of communication to this endpoint from other processes may indicate an established business
    service, whereas no prior contact is consistent with newly introduced attacker infrastructure.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: Does this host normally run wordpad.exe?
  context: Wordpad is a common document viewer, so its presence alone is not the signal here - the
    outbound connection is. Still, a host that has never run wordpad interactively, yet shows it
    executing and reaching the network, is more consistent with the process being created solely to
    host injected code. Read this baseline alongside the egress questions.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What child processes did wordpad.exe spawn afterward?
  context: Wordpad legitimately spawns few or no children. Injected code often reaches out to
    command interpreters or living-off-the-land utilities such as cmd.exe, powershell.exe, or
    certutil.exe for follow-on execution, so any children of wordpad warrant scrutiny.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and
    user distribution reflects how this specific firing pattern - wordpad egress on an uncommon port
    - has historically run here, not generic wordpad usage. Expect the Image column to show
    wordpad.exe itself; an unexpected user account or a sudden burst against a quiet history is the
    deviation worth chasing. Network events carry no parent lineage - pivot to wordpad's
    process-creation event if you need to know what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \wordpad.exe
      filter_main_ports:
        DestinationPort:
        - 80
        - 139
        - 443
        - 445
        - 465
        - 587
        - 993
        - 995
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - Image
    - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the surrounding process activity reveals what
    led to this event and what followed - reconnaissance, privilege escalation, or persistence that
    provides broader context. Aggregating by process and parent collapses routine telemetry so that
    novel parent-child pairs stand out.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of
    this firing pattern rather than generic wordpad usage. Many hosts showing the same wordpad-egress
    pattern can point to a shared cause such as software packaged with wordpad; a single host or a
    small unrelated set points to targeted operator activity. Use the distribution to calibrate
    severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        Initiated: 'true'
        Image|endswith: \wordpad.exe
      filter_main_ports:
        DestinationPort:
        - 80
        - 139
        - 443
        - 445
        - 465
        - 587
        - 993
        - 995
      condition: selection and not 1 of filter_main_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access,
    or an initial-access delivery - may reveal the stages that preceded this connection and help
    reconstruct the timeline that led to wordpad reaching the network.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
