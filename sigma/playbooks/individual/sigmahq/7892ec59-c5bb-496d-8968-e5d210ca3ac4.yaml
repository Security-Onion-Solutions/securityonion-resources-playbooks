name: DPAPI Backup Keys And Certificate Export Activity IOC
id: f774c158-44b6-4b23-ad31-1365c7afc926
description: |
  Detects file writes whose name both contains one of the ntds_capi_, ntds_legacy_, or ntds_unknown_ prefixes and ends in .cer, .key, .pfx, or .pvk -- the output naming produced when domain DPAPI backup keys and their associated certificates and private keys are exported to disk. The domain DPAPI backup key is the master recovery key that can decrypt any domain user's DPAPI-protected secrets across every domain-joined machine, so its export is a high-impact credential-access event with essentially no benign equivalent under this naming. Investigation should confirm the file-name pattern and responsible process, identify how the key was retrieved and by which account, scope the domain-wide secrets now exposed, and check for follow-on lateral movement.
type: detection
detection_id: 7892ec59-c5bb-496d-8968-e5d210ca3ac4
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the file-name pattern and writing process match what this rule detects?
  context: Before investing investigation time, confirm the alert is a true positive. The file name must both contain one of the ntds_capi_, ntds_legacy_, or ntds_unknown_ prefixes and end in .cer, .key, .pfx, or .pvk -- the output naming produced when domain DPAPI backup keys and their certificates are exported to disk. Review the exact path, the operation performed, and the responsible process against these criteria.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this user and host expected to export domain DPAPI backup keys or certificate private-key files?
  context: Legitimate export of a domain DPAPI backup key is an administrative disaster-recovery operation performed only from domain controllers or dedicated directory/PKI administration hosts. On any other host, or under an unexpected account, these writes are anomalous. When the writer is a machine or service account, judge by the writing process and the host's role rather than the account name.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Are the exported key and certificate files still on disk, or were they deleted or renamed after the alert?
  context: The exported files' post-alert lifecycle drives next steps. Files still on disk can be retrieved, hashed, and their key material scoped for revocation; files deleted seconds after creation suggest the operator staged them for exfiltration and then cleaned up. The query returns the full creation, rename, and deletion history for this path in the hours after the alert.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: What is the actual content of the exported file, and does it confirm a genuine DPAPI backup-key export?
  context: Retrieve and examine the file's on-disk bytes rather than trusting the name. A genuine export is a DER-encoded certificate (.cer), a PVK private-key blob (.pvk, header magic 0xb0b5f11e), or a PKCS#12 bundle (.pfx/.key); confirm the content matches one of these and is real key material, not a decoy or unrelated file that merely fits the naming. This content check answers "what is IN the file", which is distinct from the reputation lookup on the responsible tool.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: What process wrote these files, and does its hash match a known credential-export tool or a legitimate signed utility?
  context: The exported key and certificate files are data blobs and never execute, so they carry no hash of their own; instead identify the process that wrote them and read its hash from its execution event. Check that hash against reputation and threat-intel services to determine whether the responsible binary is a known credential-export tool, a renamed copy, or a legitimate signed utility. If the writer is a script host or interpreter, the hash identifies the interpreter, not the script -- pull the script path from its command line instead.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What credential store did the responsible process target?
  context: This alert marks the on-disk output of an export; the responsible process's command line reveals the specific store and method. Domain DPAPI backup keys are retrieved from Active Directory over LSARPC or via directory replication, and the command often carries indicators such as a backup-key retrieval command, a DPAPI or LSA-secret module name, or a domain backup-key cmdlet. Because the domain backup key decrypts every domain user's DPAPI master keys, identifying the exact store scopes what secrets are now exposed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What process spawned the tool that exported these files, and is that parent chain expected?
  context: The parent reveals how the export tool was launched. Legitimate certificate management (certutil.exe, ssh-keygen, PKI enrollment) and directory administration have predictable parents. A key-export process spawned by a script host (wscript.exe, mshta.exe, powershell.exe), an Office application, or a remote-execution service points to hands-on-keyboard or automated credential theft. Walk further up the tree by querying the parent's own parent where needed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A single RSA domain backup-key export writes several companion files together -- a .pvk private key, a .pfx bundle, and a .cer certificate -- so a tight burst of related writes in the same window is the automated-export signature, and multiple key IDs exported at once indicates bulk harvesting. The breadth, paths, and extensions of the process's other writes enumerate what else was staged and needs review.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What other certificate and private-key files have been written to this host recently, and by which processes?
  context: Credential-export tooling and legitimate certificate operations both write these extensions, so location and writer disambiguate them. Enrollment tools (certutil.exe, ssh-keygen) legitimately produce key and certificate files; a single unfamiliar writer producing many key or certificate files, or writes landing in staging directories like user Temp or Public, distinguishes an export dump from routine PKI activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
        - .cer
        - .key
        - .pfx
        - .pvk
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections from this host to remote-access ports -- 3389 (RDP), 445 (SMB), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating Image and User show what drove each connection. Two limits to keep in mind. First, credentials exfiltrated and replayed from another machine will not appear here, so check authentication logs for 4624 logons of this account on suspected targets. Second, if endpoint network-connection telemetry is not collected from this host, treat zero rows as a visibility gap rather than evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Which accounts and secrets are exposed by this key theft, and which carry elevated privileges?
  context: The domain DPAPI backup key is the master recovery key for the entire domain -- with it, an attacker can decrypt any domain user's DPAPI-protected secrets offline, including saved browser and Wi-Fi passwords, stored RDP credentials, and certificate private keys, for every domain-joined machine. Treat this as domain-wide credential exposure rather than a single-account compromise; cross-reference the responsible account against directory group memberships and prioritize rotation of the domain backup key and high-privilege secrets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- always_include: true
  question: Has this user previously produced these DPAPI backup-key export writes, and does that history fit their role?
  context: The query mirrors the rule's file-name selection scoped to this user -- the result is the account's 90-day history of this specific export pattern (not generic file activity), aggregated by host. A user who has never produced these exports is more anomalous than one who does so as part of a documented backup or recovery duty; weigh the count against the account's role and expected toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ntds_capi_
        - ntds_legacy_
        - ntds_unknown_
        TargetFilename|endswith:
        - .cer
        - .key
        - .pfx
        - .pvk
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- always_include: true
  question: Has this program historically driven these export writes on this host or across the environment, or is the program new for this activity?
  context: When the alert fires under a service or machine account, user identity does not attribute the behavior -- the launch mechanism does. The query mirrors the rule's file-name selection scoped to the alerting program, so the result is the 90-day history of this program producing this export pattern, aggregated by host. A new or rare program for this pattern is the deviation worth chasing; a program that already accounts for thousands of prior events is backup or PKI automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ntds_capi_
        - ntds_legacy_
        - ntds_unknown_
        TargetFilename|endswith:
        - .cer
        - .key
        - .pfx
        - .pvk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- always_include: true
  question: What else did this user do across the network around this time?
  context: Tracking the account's activity across all hosts reveals whether the export is isolated or part of broader hands-on activity -- credential harvesting on one host followed by logons or tool execution elsewhere widens the scope. If the alert fires under SYSTEM, a machine account, or another service principal, this user pivot returns agent-telemetry noise and the parent-process view is the meaningful one.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- always_include: true
  question: Did this same program-driven export pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did returns constant agent-telemetry noise; the meaningful question is whether the same launch mechanism produced these exports elsewhere. The query mirrors the rule's file-name selection scoped to the alerting program, fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: file_event
    detection:
      selection:
        TargetFilename|contains:
        - ntds_capi_
        - ntds_legacy_
        - ntds_unknown_
        TargetFilename|endswith:
        - .cer
        - .key
        - .pfx
        - .pvk
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating process activity on this host in the surrounding window collapses repetitive agent noise into high-count rows while novel parent-child pairs stand out at low counts -- reconnaissance, privilege escalation, or remote-execution tooling launched near the export is what to scan for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance, or other credential-access activity -- may reveal the stages that preceded the key export and help reconstruct the timeline. Look for a progression such as recon followed by credential access, or defense tampering followed by collection.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
