name: COM Object Hijacking Via Modification Of Default System CLSID Default Value
id: 130af90c-af3c-4dfb-b967-e3bebfdf9f3a
description: |
  Detects modification of the default value of a built-in system COM object's CLSID under an
  InprocServer32 or LocalServer32 key, where the written value data points to a user-writable or
  otherwise staging location. COM hijacking overrides the DLL or executable that Windows loads when a
  legitimate COM component is instantiated; the attacker's code then runs inside the hosting process,
  which provides persistence, stealth, and inherited privileges. The rule fires when the modified key
  is one of a set of known-abused built-in CLSIDs AND the value data references EITHER a common staging
  location (Perflogs, AppData\Local, Desktop, Downloads, the Startup folder, the color-profile spooler
  directory, Public, Windows\Temp, or an %appdata%/%temp%/%tmp% variable) OR a user-profile subfolder
  such as Favorites, Contacts, or Pictures. Investigate what payload the value points to, whether that
  payload exists on disk, whether the hijacked COM object was subsequently loaded into a host process,
  and what process wrote the key.
type: detection
detection_id: 790317c0-0a36-4a6a-a105-6e576bf99a14
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Do the modified CLSID key and its value data match what this rule detects?
  context: >-
    Confirm the alert is a true positive. The modified TargetObject should be the default value of an
    InprocServer32 or LocalServer32 subkey under one of the known-abused built-in CLSIDs, and the Details
    value data should point EITHER to a common staging location (Temp, AppData\Local, Public, Startup, and
    similar) OR to a user-profile subfolder such as Favorites, Contacts, or Pictures. Note which branch the
    value matched, since that path is where the dropped payload should be found.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to register or modify system COM object CLSID entries?
  context: >-
    Software installers register COM components, but a per-user override of a built-in system CLSID
    pointing at a user-writable path is rarely routine for an ordinary user or workstation. Knowing
    whether the account and host function fit this operation is often the fastest way to separate an
    install from an intrusion. When User is a machine account or missing, pivot on the writing process
    instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Which built-in CLSID was hijacked, and what does that COM object normally do?
  context: >-
    The CLSID in the key path identifies which legitimate component is being impersonated. Windows
    resolves a COM CLSID to a DLL (InprocServer32) or executable (LocalServer32) path, and a per-user
    entry under HKCU takes precedence over the system-wide HKLM association, so the attacker-controlled
    path loads whenever the original component is invoked. Identify the CLSID and the host process that
    normally instantiates it, since that is the process the hijacked code will run inside.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What payload path or command is written in the CLSID default value?
  context: >-
    The Details field holds the DLL or executable path the hijacked COM object will load. Decode any
    environment-variable paths (%appdata%, %temp%, %userprofile%) to their real location, note whether
    the target is a DLL (InprocServer32) or an EXE (LocalServer32), and treat that path as a derived
    artifact to hunt on disk and in later execution. Details is populated for most registry
    modifications but is absent for binary or empty value data.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: >-
    An operator who hijacks one COM CLSID often makes several registry changes together — staging a
    payload value under another key, adding a second persistence entry, or weakening a security setting.
    Grouping all registry modifications on the host in a short window by key path and writing process
    reveals whether this key was changed in isolation or as part of a cluster of configuration changes
    from the same process.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Is the referenced payload still present on disk, and was it written by the same process activity?
  context: >-
    COM hijacking is only effective if the DLL or executable named in the value data exists at that path.
    Correlating file activity by the registry-writing process and its children shows whether the payload
    was dropped in the same session as the key change. The file-write event carries no hash; if the payload
    is present, hash it from a later execution. Key or value deletion is not observable here, so judge
    persistence from the payload's presence and the key's re-modification history.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has this CLSID key been modified before on this host?
  context: >-
    A per-user override of a built-in system CLSID should rarely change. A first-time modification is
    more suspicious than a value that is rewritten routinely by a known application. Compare the historical
    Details values and writing processes; zero prior history for this key indicates it has never been
    touched before, which raises the weight of this event.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this CLSID key modified on other hosts in the environment?
  context: >-
    The same CLSID override appearing on multiple hosts may indicate a widespread implant or a pushed
    configuration; a single-host modification is more consistent with targeted activity. Compare the
    Details values across hosts, since a shared legitimate value differs from a payload path that varies
    per host.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did a DLL load from a user-writable path into a COM host process on this host after the key was written?
  context: >-
    A COM InprocServer32 hijack takes effect when the object is next instantiated: the hosting process
    (commonly explorer.exe, a COM surrogate such as dllhost.exe, or rundll32.exe) loads the DLL named in
    the value data. Surfacing DLL loads from user-writable or staging locations, together with the
    loading process and the module's signing state and hash, ties the registry change to actual code
    execution and flags unsigned or unknown modules loaded from paths that legitimate COM components do
    not use.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_paths:
        ImageLoaded|contains:
          - '\AppData\Local\'
          - '\Users\Public\'
          - '\Windows\Temp\'
          - ':\Perflogs\'
          - '\System32\spool\drivers\color\'
      condition: selection and selection_paths
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - Hashes
- question: Did a COM surrogate, rundll32.exe, or a restarted explorer.exe run on this host after the key was written?
  context: >-
    The hijacked COM object loads its payload through the process that instantiates it. Attackers
    frequently force this by restarting explorer.exe or by invoking the object through rundll32.exe or a
    COM surrogate (dllhost.exe). Reviewing these processes and their command lines in the window after the
    key change shows whether the persistence was triggered and which payload path was referenced.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_hosts:
        Image|endswith:
          - '\rundll32.exe'
          - '\dllhost.exe'
          - '\explorer.exe'
      condition: selection and selection_hosts
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: What process spawned the process that wrote the CLSID key, and is that chain expected?
  context: >-
    The process that wrote the registry value is the immediate mechanism; tracing its own parent reveals
    how the modification was initiated. A chain rooted in a document handler, script host, or a downloader
    dropped in a user-writable directory points to an intrusion, whereas an installer launched by the user
    or a management agent points to routine software registration.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What other processes did the responsible process spawn?
  context: A process that performs this action rarely stops there. Listing the children it launched shows
    whether the activity was an isolated change or one step in a longer chain - payload execution,
    additional persistence, or follow-on tooling. Note this shows what the acting process started,
    not what started alongside it. Sibling processes cannot be identified from this telemetry,
    because registry and library events do not record the acting process's parent.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Attackers rarely rely on a single persistence mechanism. After establishing a COM hijack, they
    commonly add backups using scheduled tasks, services, registry Run keys, or BITS jobs. Multiple
    persistence installations in the same timeframe point to intentional stacking rather than isolated
    administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating the processes that ran on the host in a tight window
    around the registry change collapses repetitive agent telemetry into high-count rows while novel
    parent-child pairs stand out at low counts, which is where recon, staging, or a payload launch would
    appear alongside the COM hijack.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — a delivery event, reconnaissance, defense tampering, or
    credential access — may reveal the stages that preceded the persistence and help reconstruct the
    timeline. A COM hijack is usually a mid-chain step that follows initial access and payload staging.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Does the user or administrator recall registering or modifying this COM object?
  context: >-
    Direct confirmation from the person behind the account is often the fastest path to legitimacy. If no
    one recalls registering or updating this COM component, the account may be compromised or the change
    may be automated implant activity. If someone does recall it, capture what software or task required a
    per-user override of a built-in system CLSID.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
