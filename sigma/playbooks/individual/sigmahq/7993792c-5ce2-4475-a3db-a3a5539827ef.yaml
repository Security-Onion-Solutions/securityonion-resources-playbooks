name: Exploit for CVE-2015-1641
id: 84a95422-a8f5-446a-8221-8dd3e15bd983
description: |
  Detects WINWORD.EXE spawning a child process named MicroScMgmt.exe. Both conditions must hold: the parent
  image ends in \WINWORD.EXE and the child image ends in \MicroScMgmt.exe. The pattern comes from document
  exploitation of CVE-2015-1641, an Office memory-corruption vulnerability where a crafted RTF or DOC causes
  Word to execute code that drops and runs an implant under a service-sounding name. CVE-2015-1641 is old and
  long-patched, so on a maintained estate the more likely explanations are a failed exploit attempt against an
  already-patched host, an unpatched legacy machine, or a document application legitimately launching a helper
  that happens to carry this name. The investigation should establish which of those it is: identify the
  document Word had open, determine what the child binary actually is and did, and confirm the patch level of
  the Office installation before concluding anything about compromise.
type: detection
detection_id: 7993792c-5ce2-4475-a3db-a3a5539827ef
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the alerting event actually show WINWORD.EXE as the parent and MicroScMgmt.exe as the child?
  context: >-
    The rule requires both halves together: a parent image ending in \WINWORD.EXE and a child image ending in
    \MicroScMgmt.exe. Confirm both on the triggering event before investing further time. Note the full paths —
    a child running from a user profile directory such as AppData is a different starting point than one under
    an application install directory.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open documents that launch helper executables from Word?
  context: >-
    Some line-of-business Office deployments legitimately launch bundled helpers or add-in components from Word.
    Knowing whether this user routinely handles documents from outside the organization, and whether the host
    runs any Office add-in that spawns child executables, is often the fastest way to separate a real
    exploitation attempt from local software behavior.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is WINWORD.EXE expected to spawn MicroScMgmt.exe, and what started Word itself?
  context: >-
    The parent-child relationship is the core signal for this detection. Word's own command line usually names
    the document it was asked to open, which is the fastest route to the file that drove this execution. The
    grandparent tells you how Word was started — a user double-clicking an attachment from a mail client, a
    browser download handler, or another process relaunching a document from a temporary directory each imply
    a different delivery path.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What document or email attachment triggered this execution?
  context: >-
    Document exploitation begins with a file reaching the host — a mail attachment, a download, or a file copied
    from removable media or a share. Word's command line typically carries the document path directly, and that
    path is the pivot for finding other recipients and for blocking the file at the perimeter. Documents opened
    out of a temporary or profile directory rather than a user's own working folder often indicate the file was
    relaunched by something else rather than opened deliberately.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - manual_review
  - edr_console
- question: What files did this Word process write around the time of the alert?
  context: >-
    Beyond child processes, the Word instance itself leaves file activity. Exploitation of an Office
    memory-corruption flaw typically drops the payload to disk before executing it, and Word also writes its own
    recovery and temporary artifacts alongside. Correlating file writes to the same Word process instance
    surfaces both the dropped executable and the document copy Word was working from.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What is the actual identity of the MicroScMgmt.exe binary based on its metadata and hash?
  context: >-
    The name MicroScMgmt.exe resembles a Microsoft service-management component but corresponds to no shipping
    Windows or Office binary, which is the masquerade this rule keys on. Compare the Image path against the
    embedded OriginalFileName and check the signing party and signature status — an unsigned binary in a
    user-writable directory points one way, a signed vendor helper another. Submit the hash for reputation
    review to distinguish a known sample from a novel binary needing deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: What did MicroScMgmt.exe run with, and what directory did it run from?
  context: >-
    Read the full command line and working directory of the child process. Arguments, paths, and any embedded
    URLs describe what the binary was asked to do. The working directory is informative on its own — execution
    out of a profile or temporary directory is consistent with a dropped payload, while execution from an
    application install directory suggests a bundled component. Multiple invocations in the window may be one
    logical operation split across calls.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: How did this binary arrive on the host?
  context: >-
    A binary under this name does not ship with the operating system or Office, so it was written to disk by
    something. The file creation event names the writing process, which separates the delivery paths: a document
    application writing it directly, a download or extraction tool, an installer, or a copy from a share. Match
    on the basename over a long window — the file may have landed well before it ran, and the path it landed at
    may differ from the path it executed from.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - process_creation
- question: What did MicroScMgmt.exe do after execution, and is the same binary present on other hosts?
  context: >-
    The purpose of a service-sounding name is to blend into a process listing while the binary does its actual
    work. Its own child processes show what that work was — registry writes for run-key persistence, network
    tooling, or further staging are common follow-ons for a dropped implant. If the binary produced no children
    at all, that is equally informative and points toward an exploit attempt that failed or a payload that ran
    entirely in-process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same Word instance spawn?
  context: >-
    A Word process driven into executing code rarely spawns just one thing. Sibling processes from the same
    instance — command interpreters relaunching the document from a temporary directory, script hosts, or
    additional dropped executables — reveal the full extent of what the document set in motion. An otherwise
    ordinary Word session with a single unexpected child is a narrower finding than one with several.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Is this Office installation patched against CVE-2015-1641?
  context: >-
    CVE-2015-1641 was fixed in a 2015 Office security update, so a maintained installation is not vulnerable to
    it. This makes patch level load-bearing rather than routine here. On a patched host, an exploit document
    would fail and this alert more likely reflects a failed attempt or a benign helper sharing the binary name.
    On an unpatched legacy installation, code execution was possible and the rest of the investigation carries
    more weight. Establish the Office build and update level before drawing a conclusion either way.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - asset_inventory
  - edr_console
- question: Has this user previously had Word spawn this binary, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of Word spawning this specific child, aggregated by host — not generic Office use. A user who has
    never produced it is a different starting point than one who produces it routinely, which would point toward
    a locally installed helper rather than exploitation. Weigh the count against what this person's work
    normally involves.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|endswith: \MicroScMgmt.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this activity on this host or across the environment, or is it new?
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior and the launch
    mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the alerting
    parent process, giving the 90-day history of Word driving this specific child, aggregated by host. A parent
    that already accounts for a steady volume of prior events points to installed software; a first occurrence
    is the deviation worth chasing.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|endswith: \MicroScMgmt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's process activity across all hosts in the alert window shows whether the document was
    opened in one place or whether the same person was active on several systems at once. Activity on multiple
    endpoints widens the scope of what needs review. If the alert fired under a machine or service account, this
    view fills with routine agent telemetry and the parent-anchored view is the one that answers the question.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven activity fire on other hosts in the same window, or is it isolated to this host?
  context: >-
    Under a service principal, a user-scoped network view returns agent telemetry rather than an answer. The
    query mirrors the rule's selection structure scoped to the alerting parent process, fleet-wide, within the
    alert window. Several hosts in the same window is consistent with a document distributed to multiple
    recipients or with software pushed across the estate; a single host points to a local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \WINWORD.EXE
        Image|endswith: \MicroScMgmt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Aggregating process activity by parent-child pairing around the alert collapses routine telemetry into
    high-count rows while novel pairings stand out at low counts. That is what to scan for here — other document
    applications spawning executables, script hosts, or staging tools in the same window place this event in a
    sequence rather than leaving it isolated.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did this same detection fire for other users or on other systems?
  context: >-
    A document that reaches one mailbox has usually reached others. Correlating this rule across hosts shows how
    many systems saw the same behavior and which users were involved, which is what separates a single legacy
    host or a single misidentified helper from a document that circulated. Aggregation by host and user gives
    the breadth in one view.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - alert
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help reconstruct what led here. For document-driven execution, the
    useful precursors are mail or browser activity that delivered a file, other Office applications spawning
    processes, or script interpreters running shortly before. An empty result is meaningful too — it argues
    against this being one step in a longer sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
