name: Potential SysInternals ProcDump Evasion
id: 263b7e2b-4b40-4de1-82ba-f5f2b5cb4f82
description: |
  Detects command lines that copy or rename ProcDump or its dump output, a technique used to defeat
  endpoint protection that quarantines memory dumps shortly after they are written. The rule fires
  when EITHER a command copies or moves a file named procdump, OR a copy of a .dmp file references
  an lsass / out.dmp / 2.dmp name, OR a command copies or moves a renamed lsass.exe_ artifact —
  any one branch is sufficient. Legitimate use exists (an operator relocating a dump for analysis),
  but the rename-and-copy pattern is most often an attempt to race AV quarantine and preserve LSASS
  credential material, so the investigation should determine whether a real memory dump was produced
  and where the copy landed.
type: detection
detection_id: 79b06761-465f-4f88-9ef2-150e24d3d737
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Does the command line copy or rename ProcDump or an lsass/.dmp dump file as this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact command line. The rule fires on
    any one of three patterns - a copy/move of a file named procdump, a copy of a .dmp file naming lsass
    or out.dmp or 2.dmp, or a copy/move of a renamed lsass.exe_ artifact. Note which branch fired, because
    it determines whether the focus is the renamed tool (procdump branch) or the dump output itself (.dmp
    and lsass.exe_ branches).
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is this user and host expected to copy or relocate memory dump files?
  context: Legitimate administrative or support activity can move a dump for offline analysis. Knowing
    whether the user role and host function include diagnostics, crash-dump collection, or incident
    response work is often the fastest way to separate a routine relocation from credential-theft staging.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of the binary referenced in this command - is it really ProcDump?
  context: The copy/move target may be ProcDump renamed to evade name-based detection. Compare the on-disk
    name against the PE OriginalFileName and signing details - a Microsoft-signed file whose OriginalFileName
    is procdump.exe confirms the real tool under an arbitrary name. The hash enables a reputation lookup to
    distinguish the genuine SysInternals utility from a decoy or a trojanized copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Was LSASS memory the dump target, and what dumping method produced the file being copied?
  context: This rule's .dmp and lsass.exe_ branches point at LSASS credential material. Decode the command
    line to identify the dump source and method - ProcDump against lsass, a renamed dumper, comsvcs.dll
    MiniDump, or direct memory access. The method indicates operator sophistication and confirms whether
    credentials in memory were captured before the copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Did the copy/rename command's source process or its parent chain produce a dump artifact on disk, since the LSASS handle open itself cannot be observed?
  context: A memory dump of LSASS requires a full-access handle open (0x1F0FFF) against lsass.exe, but
    Elastic Defend has no cross-process handle telemetry — that access is invisible regardless of whether
    it happened, and a zero result here is not evidence the dump was benign. The file the alerting process
    or its children wrote is the observable proxy — a .dmp or renamed lsass.exe_ artifact on disk corroborates
    that a real memory dump was produced before the copy/rename this rule detected.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Where did the copied dump file land, and is it still on disk for analysis?
  context: The point of the copy is to preserve the dump before AV quarantine removes it. Recovering the
    destination file enables hash lookup, strings review, and credential-exposure assessment. Dumps are
    commonly written to user-writable or temporary locations such as %TEMP% or C:\Windows\Temp; a file
    surviving in one of these directories means the credential material is recoverable and the exposure
    is live.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Where did the copied dump or relocated binary land, and how do you hash it?
  context: Copying a file with cmd.exe writes a new file but records no hash, so the dump or relocated binary
    cannot be hashed from telemetry. This locates what the command wrote so you can retrieve it from the
    destination path. A memory dump is data -- its value is the credential material it holds (see the
    credential-exposure questions), and being per-capture-unique it rarely matches a hash lookup; retrieve
    and inspect it rather than relying on its hash. If the relocated file is a renamed ProcDump executable,
    its true identity and hash are read when it runs -- see the binary-identity questions.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: How did the renamed ProcDump or dump file arrive on this host?
  context: A renamed tool or a relocated dump does not appear spontaneously - it was downloaded, extracted,
    or dropped by a parent process. Tracing the file-creation event by basename over a long window reveals
    the delivery mechanism, whether a download tool, an archive extraction, a remote admin copy, or a
    malware dropper. The creating process shown in the file event identifies who placed the file.
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What process spawned this command, and is that parent chain expected?
  context: The parent process reveals how the copy/rename was invoked. An interactive shell launched from
    explorer.exe suggests hands-on-keyboard operator activity, while parents like wscript.exe, mshta.exe,
    or an Office application point toward scripted or macro-driven execution. An unexpected parent for a
    dump-handling command is the anomaly worth chasing.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after
    this event?
  context: Credential theft is typically followed by lateral movement. The query returns outbound connections
    from this host to remote-access ports -- 3389 (RDP), 445 (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH)
    -- in the hours after the event; the originating Image and User show what drove each connection. Two
    limits to keep in mind -- credentials exfiltrated and replayed from another machine will not appear
    here (check security 4624 logons on suspected targets for this account and any accounts with sessions
    on this host), and the query requires Sysmon network telemetry (EID 3); if that is not collected from
    this host, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
- question: Which accounts may be exposed by this dump, and do any have elevated privileges?
  context: An LSASS dump exposes every credential cached in memory on the host - interactive logons,
    service accounts, and any cached domain credentials. Cross-reference the accounts that logged on to
    this host with directory group memberships; domain admin or broad service-account exposure requires
    escalation, while a single standard-user session may only need a password reset.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: When this host has previously fired this copy/rename pattern, what parents and users drove it,
    and does the current alert fit?
  context: The query mirrors the rule's selection structure scoped to this host, so the resulting
    parent/user distribution reflects how this specific dump-handling pattern has historically run here -
    not generic file-copy activity. A new parent process, an unexpected user, or an unusual command structure
    against an otherwise quiet baseline is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - copy procdump
        - move procdump
      selection_2:
        CommandLine|contains|all:
        - 'copy '
        - '.dmp '
        CommandLine|contains:
        - 2.dmp
        - lsass
        - out.dmp
      selection_3:
        CommandLine|contains:
        - copy lsass.exe_
        - move lsass.exe_
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - copy procdump
        - move procdump
      selection_2:
        CommandLine|contains|all:
        - 'copy '
        - '.dmp '
        CommandLine|contains:
        - 2.dmp
        - lsass
        - out.dmp
      selection_3:
        CommandLine|contains:
        - copy lsass.exe_
        - move lsass.exe_
      _pb_scope:
        User|expand: '%User%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - copy procdump
        - move procdump
      selection_2:
        CommandLine|contains|all:
        - 'copy '
        - '.dmp '
        CommandLine|contains:
        - 2.dmp
        - lsass
        - out.dmp
      selection_3:
        CommandLine|contains:
        - copy lsass.exe_
        - move lsass.exe_
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (1 of selection_*) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this copy/rename pattern in the past week, and does the spread look like
    automation or one-off activity?
  context: The query mirrors the rule's selection structure with no host scope, so the result is a
    fleet-wide count of this dump-handling pattern - not generic file-copy usage. Many hosts firing the
    same pattern points to scripted deployment or a vendor diagnostic routine; one host or a small
    unrelated set points to manual operator activity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_1:
        CommandLine|contains:
        - copy procdump
        - move procdump
      selection_2:
        CommandLine|contains|all:
        - 'copy '
        - '.dmp '
        CommandLine|contains:
        - 2.dmp
        - lsass
        - out.dmp
      selection_3:
        CommandLine|contains:
        - copy lsass.exe_
        - move lsass.exe_
      condition: 1 of selection_*
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: A credential dump is usually one stage of a longer operation. Earlier detections on the same
    host - defense tampering, reconnaissance, privilege escalation - help reconstruct what preceded the
    dump and whether protection was weakened first.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
