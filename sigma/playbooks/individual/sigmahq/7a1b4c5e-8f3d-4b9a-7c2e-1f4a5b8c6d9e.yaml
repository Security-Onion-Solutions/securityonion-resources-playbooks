name: Suspicious Space Characters in RunMRU Registry Path - ClickFix
id: b8971bd0-0393-495d-a6ad-79165fe58c72
description: |
  Detects RunMRU registry values that carry both a '#' comment prefix and a long run of space
  characters. That combination is the artifact left when a command is pasted into the Windows Run
  dialog (Win+R) whose real payload is pushed out of view by leading whitespace after a benign-looking
  comment, so the user sees only the harmless-looking prefix. RunMRU records every command entered in
  the Run dialog; this padding trick is used by ClickFix-style copy-and-paste lures to run an
  attacker-supplied command while hiding it from the person who pasted it. Investigation should
  reconstruct the full hidden command from the value data, identify the child process that executed,
  and follow any files it dropped or connections it made.
type: detection
detection_id: 7a1b4c5e-8f3d-4b9a-7c2e-1f4a5b8c6d9e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the alerting RunMRU value contain the '#' comment prefix and the long run of leading
    space characters this rule detects?
  context: Before investing analysis time, confirm the alert is a true positive. The rule fires only
    when the value under the RunMRU key holds a '#' comment prefix AND a long padding of space
    characters together. Read the exact key path (TargetObject) and the value data (Details) on the
    triggering event and confirm both are present.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command is actually stored in the RunMRU value once the leading whitespace is stripped?
  context: The visible portion of the value is only the '#' comment decoy and its expected path; the
    Run dialog auto-scrolls to the end, so the operative command sits after the space padding. Strip
    the leading spaces and read what follows the comment to recover the command that ran. Watch for an
    interpreter invocation (powershell, cmd, conhost) with encoding or a download instruction.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Is the modified key the RunMRU list, and what does a Run-dialog history entry tell you
    about how the command was launched?
  context: RunMRU (HKCU\Software\Microsoft\Windows\CurrentVersion\Explorer\RunMRU) is the most-recently-used
    list of commands typed or pasted into the Run dialog; the writing process is the desktop shell
    (explorer.exe). Unlike Run/RunOnce this is not a persistence location, but a value here is direct
    evidence that a command was entered interactively or pasted from the clipboard, which is exactly
    the copy-and-paste execution pattern.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command did the Run dialog execute, and does the reconstructed command line hold a
    second obfuscation layer?
  context: The pasted command runs as a child of the writing shell process. Beyond the whitespace-and-comment
    trick in the value data, the executed command often adds a second layer such as base64 (-enc,
    FromBase64String), Invoke-Expression (IEX), or a download cradle (DownloadString, Invoke-WebRequest);
    conhost with --headless can also run the interpreter with no visible window. Expected interpreters
    are powershell.exe, cmd.exe, conhost.exe, mshta.exe, and rundll32.exe. Decode any inner layer to
    the readable command.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
- question: Is this user and host expected to launch commands through the Run dialog, and who was the
    logged-on user?
  context: Interactive Run-dialog use is normal for administrators and power users but rare for most
    accounts. Knowing whether the user role and host function fit ad-hoc command entry is often the
    fastest way to separate a routine action from a pasted lure. User attribution is present on most
    endpoint registry events; when it is a machine account or missing, pivot on the writing process.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What web page, message, or document instructed the user to paste this command?
  context: Copy-and-paste lures present a fake human-verification prompt or a fake error dialog that
    tells the user to press Win+R and paste a command the page has quietly staged on the clipboard.
    Identifying the originating page or message enables blocking it and finding other recipients.
    Check browser history and mail around the time of the alert; the parent context here is only the
    desktop shell, so the lure itself is found through manual review.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
- question: Did the RunMRU key receive repeated or follow-up padded entries after this one?
  context: RunMRU is a legitimately churning list, so a single entry is expected; the signal is
    whether additional '#'-comment or whitespace-padded values were written, which points to repeated
    lure attempts or operator retries. Value deletion is not observable on this telemetry, so judge
    activity from the key's re-modification history over a longer window and from whether the pasted
    command's payload executed.
  range: +6h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: What files did the shell process and its direct children write to disk around this event?
  context: The pasted command frequently drops a payload on disk. Correlating file writes by the
    writing process and its immediate children by process lineage surfaces staged files and where they
    live, enabling retrieval and deeper analysis. The desktop shell writes many files of its own, so
    focus on the child-process writes and on unusual locations; artifacts produced further down the
    execution chain are covered by the user-writable-path drop question.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did any process on this host drop files into user-writable directories around the time of
    the Run-dialog execution?
  context: First-stage copy-and-paste payloads land in user-writable directories such as %TEMP%,
    %APPDATA%, %LOCALAPPDATA%, and %PUBLIC%. A cache-smuggling variant copies already-cached data into
    an application folder and reconstructs an archive locally rather than downloading, so a drop can
    appear with no network fetch at all. Anchoring on the path fragments (rather than lineage) also
    catches writes made by grandchild interpreters.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains:
          - '\AppData\Local\'
          - '\AppData\Roaming\'
          - '\Temp\'
          - '\Users\Public\'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - User
- question: Did any process on this host make outbound network connections in the minutes around the
    Run-dialog execution?
  context: Copy-and-paste execution chains often end in outbound HTTP(S)/DNS to fetch a next stage or
    exfiltrate. Focus on interpreter source images (powershell, conhost, cmd) and on destinations
    outside corporate update or proxy ranges. Note that some variants make no outbound request at all
    (reconstructing the payload from local cache), so an absence of egress does not clear the alert.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      condition: selection
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: Were other registry modifications made on this host in the same session?
  context: A pasted command that runs may itself alter the registry for persistence, defense
    evasion, or configuration. Listing registry modifications on the host in the surrounding window,
    grouped by key path and writing process, reveals whether the RunMRU entry was a one-off or part of
    a broader set of changes landing together.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity in the surrounding window
    reveals what led to the Run-dialog entry and what followed it, and whether the event is part of a
    larger sequence. Aggregating by process and parent collapses routine agent noise while novel
    parent-child pairs stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Has this RunMRU key been modified before on this host, and with what values?
  context: RunMRU changes routinely as users type commands, so raw modification counts are expected to
    be non-zero; the useful comparison is whether previous values also carried a '#' comment or
    whitespace padding. Historical values that look nothing like the current padded entry make this
    one stand out as anomalous.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was the same padded RunMRU pattern written on other hosts in the environment?
  context: The same padded RunMRU value appearing on multiple hosts points to a shared lure reaching
    several users rather than a single targeted action. Comparing the value data across hosts shows
    whether identical or varied commands were pasted, which helps size the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host may reveal the stages that preceded the pasted command
    or activity that followed it. A run of alerts around one host helps reconstruct the timeline and
    tells you whether this event is isolated or one step in a sequence.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Did the same detection fire for other users or hosts?
  context: Copy-and-paste lures rarely reach a single user. Correlating this same rule across the
    environment shows how many systems recorded the padded RunMRU pattern, identifying additional
    hosts that need review and sizing the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        rule.uuid|expand: '%rule_uuid%'
      condition: selection
    fields:
      - host.name
      - User
