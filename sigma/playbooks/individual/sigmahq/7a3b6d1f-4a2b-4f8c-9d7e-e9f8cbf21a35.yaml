name: Potential JLI.dll Side-Loading
id: 5ebbbb34-2285-4d61-8d0b-abafd482989b
description: |
  Detects a Windows process loading jli.dll from a directory outside the standard OpenJDK/Java
  installation paths and the Eclipse plugin directory. jli.dll is a launcher-support library that
  legitimate Java binaries (java.exe, javaw.exe, jsadebugd.exe) load from their own install folder
  under Program Files; when a signed Java executable is copied into a user-writable location with a
  malicious jli.dll placed beside it, the trusted process side-loads the attacker's library and runs
  a second-stage payload in memory under a legitimate signer. Determine where the DLL and its loading
  process reside, whether the DLL is signed and reputable, what launched the Java binary, and whether
  the load was followed by persistence or additional payload activity.
type: detection
detection_id: 7a3b6d1f-4a2b-4f8c-9d7e-e9f8cbf21a35
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the loaded jli.dll match the rule's detection criteria for path, signer, and loading process?
  context: >-
    Confirm the alert is a true positive by reviewing the exact module path (ImageLoaded), its
    code-signature status, and the process that loaded it against the rule's detection criteria. The
    rule fires only when jli.dll loads from a path outside the standard OpenJDK install locations
    (Program Files\Java\...\bin, ...\jre\bin) and outside the Eclipse plugin directory; a load from a
    user profile, Temp, Public, or ProgramData folder is the anomaly. DLL loads carry a hash and
    signing status on the load event itself.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
- question: Is this user and host expected to run Java applications that load jli.dll from this location?
  context: >-
    Legitimate administrative activity can trigger many detections. Java development tools and some
    enterprise applications bundle a private JRE and may load jli.dll from non-standard but benign
    paths. Knowing whether this host runs Java-based software and whether this user installs or runs
    developer tooling is often the fastest way to separate a benign private-JRE layout from a
    side-load staged in a user-writable folder.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What other modules did the loading process pull in around the time it loaded jli.dll, and are any from user-writable or non-canonical paths?
  context: >-
    The set of modules the Java process loaded tells the operator's story when the launch alone looks
    benign. A side-loaded jli.dll typically sits in the same user-writable directory as a copied,
    signed Java binary and in turn loads or decrypts a second-stage payload. Look for additional DLLs
    loaded from %TEMP%, AppData, ProgramData, Public, or the user's profile; unsigned modules where
    signed ones are expected; and a payload container loaded from the same folder as jli.dll.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: For the loaded jli.dll and any other suspicious module, what is the signing status, hash, and threat-intel reputation?
  context: >-
    Module reputation distinguishes a routine Oracle/OpenJDK jli.dll from a side-loaded malicious one.
    A genuinely signed jli.dll under an OpenJDK install is expected; an unsigned jli.dll, or one signed
    by an unrelated party, loaded from a user-writable folder is a strong side-loading indicator. Hash
    lookups against threat intelligence surface known loaders, and comparing the loaded DLL's hash
    against a baseline of the legitimate library detects substitution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: How was the Java process that loaded jli.dll launched, and from what working directory?
  context: >-
    The command line and working directory of the loading process reveal where the trusted Java binary
    ran from. Side-loading depends on the DLL sitting in the same directory as the executable, so a
    Java binary launched from a user profile, Temp, Public, or Downloads folder rather than its Program
    Files install path is the pattern to confirm. Note any unusual current directory or an executable
    name that has been renamed away from java.exe/javaw.exe/jsadebugd.exe.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What process spawned the Java binary, and is that parent chain expected?
  context: >-
    The parent reveals how the trusted binary was launched. A Java process started by a script host
    (wscript.exe, cscript.exe, cmd.exe) or a shortcut-driven launcher often indicates a lure that
    staged and executed the side-load, whereas a Java process started by a service or its own updater
    is more likely routine. Walk up the tree to see what dropped and launched the binary.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Are jli.dll and any dropped payload still on disk for analysis?
  context: >-
    If the loading process or its children wrote jli.dll, a copied Java binary, or a payload container
    to disk, capturing those files enables hash lookups, sandbox submission, and content review.
    Side-load components are often staged together in one user-writable directory, so preserving the
    whole folder is useful.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Has jli.dll been loaded on this host before, and by which processes?
  context: >-
    A first-time jli.dll load from this path is a stronger anomaly than a recurring one. If jli.dll has
    loaded repeatedly under a Program Files Java install over the past 90 days, a load from that same
    canonical path is routine; a first occurrence, or loads only by binaries sitting in user-writable
    directories, marks the current load as anomalous. Keeping a list of the directories where jli.dll
    legitimately loads (the OpenJDK install and any bundled private JRE) reduces recurring false positives.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Image
- question: Which other hosts are loading jli.dll, and from what process paths?
  context: >-
    Cross-host correlation surfaces distribution scope. jli.dll loaded from Program Files Java paths
    across many hosts is a normal Java fleet; the same DLL loaded by binaries in Public, Temp, or
    user-profile directories on multiple hosts points to a shared delivery mechanism or staged tooling.
    Scan the returned loading-process paths for the ones that fall outside canonical install locations.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were autorun registry Run-key values written on this host, and does any reference the side-loading binary or its directory?
  context: >-
    Side-loading of a trusted Java binary is frequently paired with a Run-key value that re-launches
    the copied executable at logon, giving persistence under a legitimate-looking process. Review any
    Run or RunOnce values written around the alert: a value whose data points at a Java binary in a
    user-writable folder, or at the directory holding jli.dll, ties the persistence to this load.
    Registry value data is present on most modifications but absent for binary or empty values.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_run:
        TargetObject|contains:
          - '\CurrentVersion\Run'
          - '\CurrentVersion\RunOnce'
      condition: selection and selection_run
    fields:
      - TargetObject
      - Details
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining process activity in the minutes around the load reveals
    what launched the Java binary, what the side-loaded payload did next, and whether reconnaissance,
    credential access, or additional persistence followed. The correlation interval between the file
    drop, the DLL load, and any follow-on execution is what ties the stages together.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering,
    reconnaissance, or credential access — may reveal the attack stages that preceded this load and
    help reconstruct the full timeline leading up to the side-load.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Was there a change ticket or approved deployment that explains a Java installation in this location?
  context: >-
    Some organizations deploy Java-based software or developer tooling outside Program Files through
    documented processes. A change ticket or approved software-deployment record covering a Java
    install at this path suggests authorized activity; the absence of one, for a binary running from a
    user-writable folder, supports treating the load as a side-load.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user recall running the application that loaded this DLL?
  context: >-
    Side-loading commonly starts with a user opening a disguised file — a document or installer that is
    really a copied, signed Java binary with a malicious jli.dll beside it. If the user does not recall
    launching a Java application, or recalls opening what they believed was a document, the load likely
    came from a lure rather than legitimate use. If they do recall it, get context on what they were
    trying to accomplish.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were other process-based persistence mechanisms installed on this host around this time?
  context: >-
    Attackers rarely rely on a single persistence mechanism. Alongside a side-loaded execution, they
    commonly register scheduled tasks, services, or registry-writing commands to survive reboot.
    Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to Startup folders or scheduled-task definition paths on this host?
  context: >-
    File-based persistence bypasses command-line detection. Dropping the copied Java binary or a
    launcher into a Startup folder, or writing a file to a path referenced by a registry Run key,
    achieves persistence without invoking schtasks, sc, or reg. File event monitoring captures these
    drops even when standard persistence tools are avoided.
    Run-key persistence itself is a registry write, not a file drop, so it does not appear in file telemetry; this query covers Startup folders and scheduled-task definition files, and Run-key writes surface in registry questions instead.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
