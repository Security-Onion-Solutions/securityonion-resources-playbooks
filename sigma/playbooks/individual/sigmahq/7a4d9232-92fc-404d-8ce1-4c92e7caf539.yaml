name: HackTool - Stracciatella Execution
id: 0b2a3213-5607-4113-8491-e943005e2516
description: |
  Detects execution of Stracciatella, a C# implementation of the SharpPick technique that hosts a PowerShell
  runspace inside a managed assembly and disables AMSI, ETW providers, Script Block Logging, and Constrained
  Language Mode before running operator-supplied PowerShell. The rule fires when a process matches the tool by
  image name, original filename, embedded description, or known file hash. Because the runspace executes
  in-process rather than spawning powershell.exe, script-block and process-creation telemetry for the actual
  payload is suppressed by design; investigation should establish who ran the binary, what command or script it
  was given, which defenses it disabled, and what activity followed under the resulting visibility gap.
type: detection
detection_id: 7a4d9232-92fc-404d-8ce1-4c92e7caf539
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Does this process match Stracciatella by image name, original filename, embedded description, or known hash?
  context: Confirm the alert is a true positive before investing investigation time. The rule matches on any one of
    four indicators - an image path ending in Stracciatella.exe, an original filename of Stracciatella.exe, an
    embedded PE description of Stracciatella, or one of two known SHA256 hashes. Review the returned image,
    original filename, description, and hashes to verify which indicator fired and that it is not a benign file
    name collision.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Description
      - Hashes
- question: Is this user and host expected to run an in-process PowerShell hosting tool that disables AMSI, ETW, and Script Block Logging?
  context: Legitimate administrative activity rarely involves a binary whose stated purpose is to suppress security
    instrumentation. Knowing whether the user role and host function are consistent with security testing or
    custom tooling is often the fastest way to distinguish an authorized assessment from operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: Is this Stracciatella execution part of an authorized penetration test or red team engagement?
  context: This binary is an offensive PowerShell-hosting tool used in authorized security assessments. Before
    investing further analysis, check whether a penetration test or red team exercise is active on this host or
    network segment. An authorized engagement with matching tool usage and timing resolves the alert without
    further analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which Stracciatella capability was invoked - inline command, downloaded script, XOR-decoded input, or named-pipe command source?
  context: The command line reveals how the tool was driven. Key switches are -c for an inline command, -s for a
    script path or HTTPS URL, -x for single-byte XOR decoding of input (with -e extending that to the -c command),
    and -p to read commands from a named pipe. The -f flag forces execution even if defense disabling failed,
    -n / --nocleanup leaves the Constrained Language Mode bypass artifacts behind, and -C / --leaveclm skips the
    CLM bypass entirely. The chosen capability determines the scope of what the runspace executed.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What PowerShell command or script did the runspace execute, and was the input XOR-encoded?
  context: Because the payload runs inside an in-process runspace with AMSI, ETW, and Script Block Logging disabled,
    the command-line arguments are the most reliable record of what executed. Decode the value passed to -c or the
    path or URL passed to -s. If -x is present, the input is single-byte XOR-encoded (key in decimal or 0x-hex)
    and base64-wrapped and must be decoded to recover the plaintext. Identify whether the runspace was driven to
    run reconnaissance, credential access, download, or further tampering.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Were Script Block Logging policy keys or transient COM CLSID keys created or modified on this host around the alert?
  context: The Constrained Language Mode bypass drops DLLs and creates temporary COM registry keys under
    HKCU\Software\Classes\CLSID\<GUID> and HKCU\Software\Classes\<ProgId>, and the Script Block Logging disable
    can overwrite the ScriptBlockLogging policy value. These registry modifications are visible even though the
    in-process runspace suppresses script-block telemetry. Correlate the timing with the alert; transient COM keys
    that appear and vanish around execution point to the CLM bypass routine.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\Software\Classes\CLSID\'
          - '\ScriptBlockLogging'
          - '\Software\Microsoft\Windows\PowerShell\ScriptBlockLogging'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
- question: Are AMSI, ETW, and Script Block Logging currently healthy on this host, or do they remain impaired?
  context: The tool patches amsi.dll and ntdll.dll EtwEventWrite in memory within its own process, so those patches
    do not persist after the process exits; the Script Block Logging policy registry change and any dropped CLM
    artifacts can persist. Verify current logging and AMSI status, and confirm whether the ScriptBlockLogging
    policy value and any leftover COM CLSID keys or %TEMP% DLLs were removed. If the tool ran with -n, the CLM
    bypass artifacts were intentionally left in place.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What process spawned Stracciatella, and is that parent chain expected?
  context: The parent process reveals how the tool was launched. A launch from explorer.exe or a services chain
    differs sharply from a launch by a script host, an Office application, or a remote-execution mechanism. An
    unexpected parent points to delivery via a macro, a downloaded loader, or hands-on-keyboard operator activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: What activity occurred on this host after the runspace disabled AMSI, ETW, and Script Block Logging?
  context: Defenses are disabled to enable actions that would otherwise be blocked or logged. Because the in-process
    runspace itself leaves little script-block evidence, look at process creation in the window after execution for
    the actual impact - reconnaissance, credential access, lateral movement tooling, or download activity. A gap in
    expected telemetry followed by new process creation points to what the tampering was meant to conceal.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
- question: Were other defense tampering actions performed on this host around the same time?
  context: Operators who suppress one set of defenses often disable several. Beyond the AMSI/ETW/SBL patching this
    tool performs in-process, look for separate command-line tampering on the host - clearing event logs, deleting
    shadow copies, disabling Defender, or stopping security services - within the surrounding window. Multiple
    tampering actions from the same user or parent indicate a coordinated effort to blind the host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
- question: Did Stracciatella drop DLLs to %TEMP% or write other files on this host?
  context: The Constrained Language Mode bypass drops random-named DLLs into %TEMP% (left behind when run with -n).
    File creation events from the tool's process confirm execution and reveal artifacts that persist after the
    process exits, even though the in-process runspace suppresses most execution telemetry.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
- question: When this host has previously fired this rule's pattern, what parents and users normally drive it, and does the current alert fit?
  context: Even tools that appear in security testing can recur on a host. The query mirrors the rule's selection
    scoped to this host, so the resulting parent and user distribution reflects how this specific tool's firing
    pattern has historically run here. A new parent process, an unexpected user account, or an unusual command-line
    pattern is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Stracciatella.exe
      - OriginalFileName: Stracciatella.exe
      - Description: Stracciatella
      - Hashes|contains:
        - SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956
        - SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Stracciatella.exe
      - OriginalFileName: Stracciatella.exe
      - Description: Stracciatella
      - Hashes|contains:
        - SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956
        - SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Stracciatella.exe
      - OriginalFileName: Stracciatella.exe
      - Description: Stracciatella
      - Hashes|contains:
        - SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956
        - SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple
    endpoints. If the same user triggered similar activity on other hosts, the scope of the operation may be larger
    than this single alert.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Stracciatella.exe
      - OriginalFileName: Stracciatella.exe
      - Description: Stracciatella
      - Hashes|contains:
        - SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956
        - SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Have other hosts fired this rule's pattern in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of this
    tool's firing pattern. Many hosts firing the same pattern points to scripted deployment or a shared testing
    image; one host or a small unrelated set points to manual operator activity. Use the host distribution to
    calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
      - Image|endswith: \Stracciatella.exe
      - OriginalFileName: Stracciatella.exe
      - Description: Stracciatella
      - Hashes|contains:
        - SHA256=9d25e61ec1527e2a69d7c2a4e3fe2fe15890710c198a66a9f25d99fdf6c7b956
        - SHA256=fd16609bd9830c63b9413671678bb159b89c357d21942ddbb6b93add808d121a
      condition: selection
    fields:
    - host.name
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, credential access, or other defense tampering - may
    reveal the attack stages that preceded the tool's execution and help reconstruct the timeline. The sequence of
    alerts often tells the story of how the operator reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
