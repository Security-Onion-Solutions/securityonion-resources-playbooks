name: Suspicious MSDT Parent Process
id: 22fa4ecb-a9c6-4a91-bb8e-b214558c1543
description: |
  Detects msdt.exe (the Microsoft Support Diagnostic Tool) spawned by a command interpreter, script host, or proxy-execution
  binary (cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe, schtasks.exe, wmic.exe,
  wscript.exe, or wsl.exe). The rule fires when both the parent is one of these binaries AND the child is msdt.exe (matched by
  Image name or OriginalFileName). msdt.exe launched this way is the proxy-execution pattern behind the ms-msdt URI handler abuse,
  where a malicious document or script invokes msdt.exe to run attacker-supplied code under a trusted, signed binary. Legitimate
  msdt.exe runs are normally started by the Windows troubleshooting framework or by a user opening a diagnostic, not by a scripting
  engine. Determine what the parent was doing, what msdt.exe was instructed to execute, and whether code ran outside the diagnostic
  workflow.
type: detection
detection_id: 7a74da6b-ea76-47db-92cc-874ad90df734
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is the parent one of the flagged interpreters or proxy binaries, and is the child msdt.exe?
  context: Confirm the alert is a true positive by reviewing the exact parent and child of the triggering event. The rule fires
    only when ParentImage ends in one of cmd.exe, cscript.exe, mshta.exe, powershell.exe, pwsh.exe, regsvr32.exe, rundll32.exe,
    schtasks.exe, wmic.exe, wscript.exe, or wsl.exe AND the child resolves to msdt.exe by Image name or OriginalFileName metadata.
    Note which parent fired -- a script host (wscript, cscript, mshta) points toward document or scriptlet delivery, while a
    shell (cmd, powershell) points toward hands-on or staged execution.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - OriginalFileName
- question: Is this user and host expected to launch the diagnostic tool from a scripting or proxy-execution parent?
  context: Legitimate msdt.exe activity is normally initiated by the Windows troubleshooting framework or a user opening a
    diagnostic, not by a command interpreter or script host. Knowing whether this user role and host function routinely involve
    scripted diagnostics or support automation is often the fastest way to separate a true positive from a benign administrative
    or vendor workflow.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What exactly did msdt.exe do? Decode its full command line and any referenced answer file or payload.
  context: The full command line reveals what msdt.exe was instructed to execute. Look for an answer file (/af) or PCWDiagnostic
    package reference, embedded or encoded strings, IT_BrowseForFile or IT_RebrowseForFile parameters, and any path or URL the
    invocation pulls in. The ms-msdt proxy-execution pattern smuggles a command into these parameters so code runs under the
    signed binary; decode every argument to identify what would actually run.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Is this parent expected to spawn msdt.exe, and what started the parent itself?
  context: The parent-child relationship is the core signal for this detection. Tracing the parent's own origin (the grandparent
    process) shows whether the chain is legitimate -- a user opening a diagnostic -- or whether the interpreter was itself spawned
    by a document, a macro, or a remote-access tool. A scripting engine or shell launched by an Office application, a browser,
    or an email client and then spawning msdt.exe is the delivery pattern this rule targets.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: What did the parent interpreter or script host execute that led it to spawn msdt.exe?
  context: The parent's own command line shows how the activity was initiated. For a script host (wscript, cscript, mshta) the
    command line names the script or scriptlet that ran; for a shell (cmd, powershell) it shows the command or encoded payload.
    For regsvr32.exe or rundll32.exe it shows the DLL or scriptlet loaded. This is what triggered the chain that reached msdt.exe.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Does the child's metadata and hash confirm it is the genuine Microsoft-signed msdt.exe?
  context: The rule matches both the Image name msdt.exe and the OriginalFileName metadata, so a renamed copy of msdt.exe is
    also in scope. Comparing the Image path against OriginalFileName, and checking the signing party and hash, confirms whether
    this is the genuine Microsoft-signed system binary or a relocated or replaced copy. Submit the hash for reputation lookup
    to distinguish the legitimate tool from a tampered or planted one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: Was msdt.exe executed from its expected system path?
  context: msdt.exe normally runs from System32 or SysWOW64. A copy running from a user-writable directory (Desktop, Downloads,
    Temp, AppData) or any non-standard path suggests it was copied or staged to evade path-based controls, which raises the
    suspicion beyond the parent-child signal alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
- question: What other child processes did the same parent instance spawn?
  context: If the interpreter or script host spawned msdt.exe as part of an attack, it likely spawned other processes too.
    Examining the siblings of the alerting process from the same parent instance reveals the full scope of what that parent
    launched -- additional LOLBins, reconnaissance commands, or payload stages point to deliberate orchestration rather than
    a one-off diagnostic.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Did msdt.exe make any network connections after it launched?
  context: Proxy execution through a signed binary often pulls in a remotely hosted payload or beacons out after the smuggled
    command runs. Network connections initiated by msdt.exe -- which has no routine need to reach external hosts -- point to
    download or command-and-control activity rather than a local diagnostic. Pivot on the alerting process to its outbound
    connections and review the destinations against known-good enterprise endpoints.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - DestinationHostname
      - Initiated
- question: What modules did msdt.exe load, and were any unsigned or loaded from a user-writable path?
  context: When a signed binary is used to proxy-execute code, the payload frequently arrives as a DLL or scriptlet loaded into
    the process. Reviewing the modules msdt.exe loaded -- specifically any unsigned DLL or one loaded from a temp, AppData, or
    other user-writable directory rather than System32 -- helps distinguish a genuine diagnostic run from in-process code execution.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ImageLoaded
      - Signed
      - Signature
- question: Has this parent binary spawned msdt.exe on this host before?
  context: Some parent-child pairings are routine while others are inherently suspicious. A command interpreter or script host
    spawning msdt.exe is rare in normal operation; a zero or very low historical count for this specific pairing on this host
    marks a novel spawning relationship worth chasing, while a high count may reflect an established support or vendor workflow.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      selection_msdt:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      selection_msdt:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - host.name
- question: How often has this host fired this msdt.exe parent pattern over the past 90 days, and what command-line structures are
    typical?
  context: A LOLBin pattern with no prior history on a host is more suspicious than one used regularly under stable parents.
    This query mirrors the rule's full selection structure scoped to this host, so the count reflects the rule's specific firing
    pattern rather than generic msdt.exe usage. The CommandLine projection lets the analyst compare typical invocation patterns
    against the alerting one.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_parent:
        ParentImage|endswith:
        - \cmd.exe
        - \cscript.exe
        - \mshta.exe
        - \powershell.exe
        - \pwsh.exe
        - \regsvr32.exe
        - \rundll32.exe
        - \schtasks.exe
        - \wmic.exe
        - \wscript.exe
        - \wsl.exe
      selection_msdt:
      - Image|endswith: \msdt.exe
      - OriginalFileName: msdt.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (all of selection_*) and _pb_scope
    fields:
    - CommandLine
- question: Were any other proxy-execution LOLBins used on this host recently?
  context: Operators who abuse one signed binary for proxy execution often use several. If msdt.exe was used to run smuggled
    code, check whether rundll32, regsvr32, mshta, msbuild, cmstp, installutil, or similar binaries were also used to execute
    code in the same window. Multiple proxy-execution LOLBins on one host strengthens the case for deliberate activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_img:
        Image|endswith:
          - '\rundll32.exe'
          - '\regsvr32.exe'
          - '\mshta.exe'
          - '\msbuild.exe'
          - '\cmstp.exe'
          - '\installutil.exe'
          - '\msiexec.exe'
          - '\forfiles.exe'
          - '\pcalua.exe'
          - '\presentationhost.exe'
          - '\control.exe'
          - '\infdefaultinstall.exe'
          - '\mavinject.exe'
          - '\wmic.exe'
          - '\xwizard.exe'
          - '\ie4uinit.exe'
      condition: selection and selection_img
    fields:
      - Image
      - CommandLine
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- a malicious document opening, defense
    tampering, reconnaissance, or credential access -- may reveal the stages that preceded the msdt.exe execution and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
