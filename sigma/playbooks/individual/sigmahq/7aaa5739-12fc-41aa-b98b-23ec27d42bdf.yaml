name: Ursnif Redirection Of Discovery Commands
id: e4deea56-79d8-4137-9c0b-1b318668e2c1
description: |
  Detects cmd.exe launched by explorer.exe with a /C argument whose command line appends output
  (>>) into a .bin file under AppData\Local\Temp. All three conditions must hold together. The
  durable behavior is discovery output redirected to a file on disk: an operator runs systeminfo,
  net view, tasklist, whoami, ipconfig or similar and captures the results into a staging file
  rather than reading them interactively (T1082, T1057, T1016, T1005). Staged discovery output is
  only useful once it leaves the host, so the investigation should establish what the command
  actually enumerated, what file it wrote, whether other discovery commands ran under the same
  parent, and whether the staged file was later read, archived, or transmitted.
type: detection
detection_id: 7aaa5739-12fc-41aa-b98b-23ec27d42bdf
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: >-
    Does the alerting command line show cmd.exe running with /C and appending its output into a
    .bin file under AppData\Local\Temp, with explorer.exe as the parent?
  context: >-
    All three criteria must be present together for this rule to fire: the explorer.exe parent, the
    cmd.exe image, and a command line carrying both '/C ' and a '>>' append into a .bin path under
    the user temp directory. Confirm each one against the raw event before investing further time,
    and read the command that precedes the redirect operator — that verb is what was enumerated.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to run enumeration commands that write their output to a temp file?
  context: >-
    Scripted inventory, logon scripts, and support tooling do capture command output to temp files,
    but they are normally launched by a scheduler, a management agent, or a script host rather than
    by the interactive shell. A user with no scripting or administrative role producing this pattern
    from explorer.exe is the deviation worth confirming with the user or their manager.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is explorer.exe expected to spawn cmd.exe here, and what started this explorer.exe instance?
  context: >-
    explorer.exe spawning cmd.exe normally means a user typed a command, ran a shortcut, or opened a
    downloaded file. Because explorer.exe is the shell for the interactive session, a child cmd.exe
    inherits that user context and looks user-driven even when it was launched programmatically by
    an injected thread or a file the user double-clicked. Retrieving the parent's own creation event
    shows when the session started and what launched it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did this same explorer.exe instance spawn around the alert?
  context: >-
    Discovery rarely arrives as a single command. A burst of short-lived children under one parent —
    several cmd.exe invocations, or cmd.exe alongside a downloader or archiver — is the pattern that
    distinguishes an automated enumeration sequence from a user running one ad-hoc command. Note the
    ordering and the gaps between siblings.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did this command actually enumerate, and where exactly did the output land?
  context: >-
    Read the command between /C and the redirect operator to identify what was collected — host and
    OS inventory, running processes, network configuration, domain or share listings, or local files.
    Then read the full redirect target: the directory, the file name, and whether the append operator
    suggests a file that several commands write into in turn. The query is scoped to the same
    redirect-to-temp pattern rather than to all cmd.exe on the host, because cmd.exe runs constantly
    and an image-scoped result would answer nothing.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What other commands on this host redirected their output to a file in the same window?
  context: >-
    The rule only fires on appends into a .bin file under the user temp directory, but an enumeration
    sequence usually mixes redirect operators and target paths — a single '>' to create the staging
    file followed by several '>>' appends, sometimes into a different extension or directory. Widening
    to any file redirect from cmd.exe recovers the parts of the sequence the rule did not match and
    shows the full list of what was collected.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_cmd:
        host.name|expand: '%hostname%'
        Image|endswith: \cmd.exe
      selection_redirect:
        CommandLine|contains:
        - ' > '
        - ' >> '
      condition: selection_cmd and selection_redirect
    fields:
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What files did this cmd.exe process actually write?
  context: >-
    The redirect target named on the command line is the intended staging file, but the write itself
    is the confirmation, and a command can write more than the one path it advertises. Correlating
    file activity to this process instance shows the real file name, its directory, and any additional
    artifacts the command produced. Track the resulting path — it is the object the rest of the
    investigation follows.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Was the staged temp file later read, copied, compressed, or handed to a transfer tool?
  context: >-
    Discovery output written to disk has no value to the technique until it is retrieved. A later
    command line naming the same temp path — an archiver, certutil, curl, a copy to a share, or a
    script that reads the file — turns local enumeration into collection and staging for exfiltration
    (T1005). No follow-on reference to the path suggests the collection stalled or the retrieval used
    an in-process read that leaves no command line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - \AppData\Local\Temp\
        - .bin
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
  - file_event
- question: Did this host make outbound connections from non-system binaries after the output was staged?
  context: >-
    If the staged file left the host, the transfer shows as an egress connection in the window after
    the redirect. Filtering out processes running from the system and program directories leaves the
    connections made from user-writable locations, which is where a retrieval component would run
    from. Compare the destinations against the host's normal egress profile.
  range: +4h
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|startswith:
        - C:\Windows\System32\
        - C:\Windows\SysWOW64\
        - C:\Program Files\
        - C:\Program Files (x86)\
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
  answer_sources:
  - network_connection
- question: Has this host produced this redirect-to-temp command pattern before?
  context: >-
    Counting every cmd.exe execution on the host would return a number that means nothing — the shell
    runs constantly. Counting only commands carrying both /C and the append into a .bin file under the
    user temp directory measures the rule's actual pattern. Zero or near-zero over 90 days marks this
    as novel for the host; a steady recurring count points at a script or support tool that behaves
    this way routinely.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  always_include: true
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's
    90-day history of this exact redirect-to-temp pattern rather than generic cmd.exe use, aggregated
    by host. A user who has never produced it is a deviation; a user who produces it regularly is
    likely running a script or tool that stages command output by design. Weigh the count against
    what the user's role would explain.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \explorer.exe
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven the rule's pattern, or is the parent new for this activity?
  always_include: true
  context: >-
    When the alert fires under a service principal, user identity does not attribute the behavior; the
    launch mechanism does. The query mirrors the rule's selection structure scoped to the alerting
    parent process, so the result is the 90-day history of this parent driving this specific pattern
    rather than generic parent-and-binary co-occurrence. A parent that is new or rare for the pattern
    is the deviation worth chasing; a parent already accounting for thousands of prior events is
    routine automation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \explorer.exe
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  always_include: true
  context: >-
    Tracking the user's process activity across every host in the alert window shows whether the
    enumeration was confined to this endpoint or the same account was active elsewhere at the same
    time. Concentrated activity on one host fits a local trigger; the same account driving processes
    on several hosts at once fits credentialed movement. If the alert fired under a machine account or
    a built-in service identity, this result is agent telemetry rather than a person's actions.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
- question: Did this same parent-driven pattern fire on other hosts in the same window?
  always_include: true
  context: >-
    Under a service principal, asking what else the user did returns agent-telemetry noise, since every
    host runs service-owned processes constantly. The meaningful pivot is whether the same launch
    mechanism produced the same pattern elsewhere: the query mirrors the rule's selection structure
    scoped to the alerting parent, fleet-wide, in the alert window. Several hosts at once points to
    pushed or scheduled automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \explorer.exe
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by image and parent collapses repetitive agent
    telemetry into single high-count rows and leaves novel parent-child pairs visible at low counts.
    Scan for what preceded the enumeration — a document handler, an archive extractor, a script host —
    and for what followed it. The +/-15m window is the immediate context; widen it if the sequence
    appears to extend past the edges.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Enumeration is usually a stage rather than a starting point. Earlier detections on the same host —
    delivery, script execution, or defense tampering — help place this command in a sequence and
    establish when the activity began. An empty result narrows the entry point to something that
    produced no detection, which is itself worth noting.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Have other hosts run cmd.exe with this same redirect-to-temp pattern in the last day?
  context: >-
    The same enumeration pattern appearing on several hosts within a day points to a distributed
    trigger — a common delivery mechanism, a pushed script, or an operator working through a set of
    endpoints. This query drops the parent constraint so it catches the pattern regardless of what
    launched the shell, which is what a broader sweep needs. A single host keeps the finding local.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \cmd.exe
        CommandLine|contains|all:
        - '/C '
        - ' >> *\AppData\local\temp\*.bin'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
