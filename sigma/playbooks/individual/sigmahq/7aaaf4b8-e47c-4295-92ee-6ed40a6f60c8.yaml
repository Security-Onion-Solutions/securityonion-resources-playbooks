name: Vulnerable Driver Load
id: 97b035d6-01d4-4722-bb54-459ad6f4f9d1
description: |
  Detects a Windows kernel driver loading whose file content matches a large published list of known-vulnerable
  and known-attacker-supplied drivers, keyed by hash rather than by file name. Most entries on such lists are
  legitimately signed vendor drivers — hardware utilities, BIOS and firmware flashers, anti-cheat components,
  performance monitors — that expose a kernel primitive such as arbitrary physical memory read/write, MSR access,
  or process and handle manipulation; an operator loads one deliberately to gain kernel code execution, terminate
  security tooling, or escalate privileges without needing signing infrastructure of their own. A valid signature
  is therefore the expected result and settles nothing on its own, and file names are frequently renamed, so the
  investigation should establish which product legitimately bundles this driver, whether that product belongs on
  this host's build, what wrote and registered the driver, and whether privilege use or security-tool interference
  followed the load.
type: detection
detection_id: 7aaaf4b8-e47c-4295-92ee-6ed40a6f60c8
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-16
questions:
- question: Does the loaded driver match the catalogued vulnerable-driver content this rule detects?
  context: >-
    The rule matches on the content of the loaded driver against a published catalogue of drivers with documented
    kernel primitives, not on its file name, so start by reading the driver's hash and file path from the load
    event and confirming they describe a real driver file rather than a stale or partial record. Because the match
    is content-based, the file name on disk may be anything the operator chose and may not resemble the vendor's
    original name. Treat a valid signature as expected rather than as a result that closes the alert — the drivers
    on these lists are abused precisely because they are signed.
  range: +/-5m
  answer_sources:
  - alert
  - driver_load
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - Hashes
- question: Is this host expected to run software that installs a kernel driver of this kind?
  context: >-
    Hardware monitoring utilities, overclocking and fan-control tools, firmware and BIOS flashers, anti-cheat
    components in games, and some backup and virtualization products all install drivers that appear on
    vulnerable-driver catalogues, and on a workstation whose build includes one of them the load is routine. The
    same driver on a server, a domain controller, a kiosk, or a managed endpoint whose software inventory contains
    no such product is the case to resolve. The host's function and the account's role usually decide this faster
    than any query.
  range: +/-30d
  answer_sources:
  - asset_inventory
  - organizational_knowledge
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: >-
    Was there a change ticket, maintenance window, or documented approval for installing this driver or the
    software that carries it?
  context: >-
    Kernel drivers reach a host through a software installation, a firmware or diagnostic session, or a driver
    package pushed by a deployment tool, and organizations that require change records for endpoint software
    normally have one for each of those. A matching record names the product and the person, which answers the
    central question of this investigation directly. No record where policy requires one, on a host whose build
    should not carry driver-installing software, moves the origin questions forward.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Does the user or administrator recall installing or running the software that loaded this driver?
  context: >-
    Direct confirmation from the person behind the account is often the fastest route to a verdict here, because
    driver-installing software is usually something someone chose to run — a hardware utility, a diagnostic tool,
    a game, a firmware update. If they confirm, ask which product it was and where they obtained it, since a
    utility downloaded from a search result rather than the vendor is a different situation from a packaged
    install. If nobody recalls any such software, the driver arrived by another route and the writing and
    registering processes become the thread to pull.
  range: +/-30d
  answer_sources:
  - organizational_knowledge
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: From what path did the driver load, who signed it, and which process triggered the load?
  context: >-
    The install path is the strongest early discriminator. A driver under Program Files or the system driver
    directory, next to a product you can name, fits installed software; a driver loaded from a temporary,
    user-writable, or download directory fits a file brought to the host for one purpose, since these drivers need
    no formal install to be usable. Read the signer alongside the path — the driver's own valid signature is what
    makes it loadable where driver signature enforcement is active, so a valid status narrows nothing by itself,
    while a signer that belongs to a product on this host's build does. An unsigned or distrusted status is the
    exception worth noting, as it means the load happened despite enforcement.
  range: +/-5m
  answer_sources:
  - driver_load
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Image
      - Signed
      - Signature
      - SignatureStatus
      - Hashes
- question: >-
    Has this driver file loaded on this host before, and has it always carried the same hash and signer?
  context: >-
    Driver loads carry the file's hash and signing data directly, so the ninety-day history of this file name on
    this host answers both the reputation and the tampering questions at once. One hash and one signer across a
    long run of loads fits a product that installed the driver and keeps it; a single load with no prior history
    fits a file that arrived for this event. Several distinct hashes under one file name, or a signer unrelated to
    any product on the build, mean the name is being reused for different content and are worth resolving through
    hash reputation lookups before treating the load as routine. Absence from a public catalogue does not clear a
    driver — newly weaponized ones are added continuously.
  range: -90d
  answer_sources:
  - driver_load
  - external_threat_intel
  query: |
    aggregation: false
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ImageLoaded|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
      - Signature
      - SignatureStatus
- question: Was a service installed on this host around the load, and what binary path and start type did it register?
  context: >-
    A kernel driver reaches memory through a service entry, so a service installation recorded near the load
    normally names the driver file, the start type, and the account that registered it. Compare the registered
    name and image path against products you can account for — an entry pointing at a driver in a temporary or
    user-writable directory, a randomly named service, or one matching no installed software is the result to
    pursue, while a name that matches a hardware utility or anti-cheat component explains the load. A start type
    of auto means the driver reloads at every boot. Some tooling registers the service, loads the driver, and
    deletes the entry within seconds, so a short-lived service name is itself worth noting.
  range: +/-5m
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      product: windows
      service: system
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID: 7045
      condition: selection
    fields:
      - ServiceName
      - ImagePath
      - StartType
      - AccountName
- question: Is the driver's service still registered and running on this host, and under what account?
  context: >-
    A driver service may have been created, used, and removed within a short window, or it may still be present
    and set to load at boot. Establishing the current state tells you whether the kernel access is ongoing or was
    a one-time operation, which changes the response. Query the service state on the host directly and compare the
    registered image path against the driver path from the load event; a service that no longer exists while the
    driver file remains on disk means the entry was cleaned up after the load, which installed software does not
    normally do.
  range: +/-30d
  answer_sources:
  - manual_review
  - edr_console
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Which process triggered the driver load, and what launched that process?
  context: >-
    The acting process is named in the alert but its origin is not, and retrieving that process's own start event
    names the parent. A product's own executable or service, started by services.exe or by a person through
    explorer.exe, fits installed software. A script host, an archive utility, a remote-management agent, a console
    started under an administrative session, or an unfamiliar binary as parent is the case to pursue, since
    loading one of these drivers requires only administrative rights and a handle to the file. The long window is
    intentional — service and shell parents often start well before the load.
  range: +/-30d
  answer_sources:
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Which process wrote the driver file to this host, and when?
  context: >-
    A driver written by a product installer or a software deployment agent fits managed or self-service
    installation, and the writing process usually names the product outright. A driver written by a browser, an
    archive utility, a script host, a remote-management agent, or an unsigned binary points to the file arriving
    for this load rather than to installed software. A write into a drivers or temporary directory shortly before
    the load is the pattern to look for. File writes carry no hash, so take the writing process, the path, and the
    timing from here and read the signing and hash data from the load event itself.
  range: -7d
  answer_sources:
  - file_event
  - process_creation
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%ImageLoaded%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - ProcessGuid
      - User
- question: >-
    Were service registry values naming a driver image written on this host around the load, and what paths do
    they point at?
  context: >-
    Service entries live under the CurrentControlSet\Services key, and a driver registration writes the image path
    value there whether it was made through service-control tooling or by writing the key directly. The query
    returns values under that key whose data names a .sys image, so it surfaces registrations that leave no
    service-installation record. Read the path in the value data against the driver path from the load event — a
    registration pointing into a user profile, a temporary directory, or a download folder is the result to
    pursue, while one under the system driver directory alongside a named product is not. Value data is not
    recorded for every registry write, so entries with empty data are still worth reading by key path alone.
  range: +/-4h
  answer_sources:
  - manual_review
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|contains: '\CurrentControlSet\Services\'
      selection_driver_image:
        Details|contains: '.sys'
      condition: selection and selection_driver_image
    fields:
      - TargetObject
      - Details
      - Image
      - User
- question: Which accounts were granted administrative privileges on this host around the driver load?
  context: >-
    Loading a kernel driver requires administrative rights, and the point of loading a vulnerable one is usually
    to obtain more than that. The query returns the privileges assigned to logons on this host in the hour either
    side of the load, so it establishes which account held the rights that made the load possible and whether any
    account picked up privileges it does not normally hold. Correlate the timestamps against the load and against
    the loading process — an administrative logon by a person who was working on the host, minutes before a
    utility they installed loaded its driver, fits the benign form; an account gaining privileges immediately
    after a load, or a service account elevating without a corresponding logon, does not. If Security-channel
    auditing is not collected from this host, treat zero rows as a visibility gap rather than as evidence nothing
    elevated.
  range: +/-1h
  answer_sources:
  - manual_review
  - active_directory
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        EventID: 4672
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - SubjectUserName
      - SubjectLogonId
      - PrivilegeList
- question: What other process activity occurred on this host around the driver load?
  context: >-
    A vulnerable driver is a means, not an end, so the activity around the load is the evidence of what it was
    for. The aggregation collapses repetitive agent and service telemetry into high-count rows while novel
    parent-child pairs stand out at low counts. Look for security tooling stopping or restarting, credential
    access utilities, unfamiliar binaries running from user-writable paths, or a short burst of tooling around the
    load time. An installer or a hardware utility running immediately before the load, with nothing else
    unexpected, points the other way.
  range: +/-15m
  answer_sources:
  - process_creation
  - file_event
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place the load in a sequence. Defense tampering, reconnaissance, or
    credential access before a driver load suggests the driver is a stage in an ongoing operation rather than an
    isolated event; software installation or administrative tooling alerts before it fit a person working on the
    host. Read the earlier alerts and their timing against the load rather than counting them.
  range: -6h
  answer_sources:
  - alert
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Is this driver loading on other hosts in the environment, and under which processes?
  context: >-
    Cross-host distribution separates a locally installed utility from something being deployed. The same driver
    on many hosts, loaded by the same named product process, fits software in the standard build or a tool a team
    installs routinely — worth confirming with the owning team, but not an incident. The same driver on a handful
    of unrelated hosts, loaded by different or unnamed processes, fits deliberate placement and widens the scope
    of the response. Pay attention to the variety of loading processes as much as to the host count.
  range: -7d
  answer_sources:
  - driver_load
  query: |
    aggregation: true
    logsource:
      category: driver_load
      product: windows
    detection:
      selection:
        ImageLoaded|endswith|expand: '%dll_basename%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Were other persistence mechanisms installed on this host around the driver load?
  context: >-
    A driver service that loads at boot is itself persistence, and operators rarely stop at one mechanism. The
    query surfaces persistence tooling run on the host within four hours either side of the load — scheduled
    tasks, service control, registry writes, background transfers, management instrumentation. Several mechanisms
    installed in the same window point to deliberate stacking; a single service-control invocation that registered
    the driver and nothing else fits a utility installing itself.
  range: +/-4h
  answer_sources:
  - process_creation
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: >-
    File-based persistence leaves no command line to detect. Dropping an executable into a Startup folder or
    writing a scheduled-task definition directly achieves persistence without running service-control or
    task-scheduling tools, and it is a parallel mechanism to the driver service rather than a substitute for it.
    Read the writing process against the one that placed the driver file — the same process behind both is a
    stronger result than either alone.
  range: +/-4h
  answer_sources:
  - file_event
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
