name: Visual Basic Command Line Compiler Usage
id: 0d1e2f3a-4b5c-6d7e-8f90-1a2b3c4d5e6f
description: |
  Detects the Visual Basic command-line compiler (vbc.exe) spawning the Windows
  Resource to Object Converter (cvtres.exe). The rule fires when a process whose
  parent image ends in \vbc.exe creates a child whose image ends in \cvtres.exe,
  which is the on-host signal that vbc.exe successfully compiled Visual Basic
  source into an object file. Compilation on an endpoint is normal on developer
  workstations and build servers but unusual elsewhere; it is also a known
  defense-evasion primitive in which an actor delivers source code as text,
  compiles it locally to evade signature and reputation checks, and then runs the
  freshly built binary. The investigation should determine what source file was
  compiled, where the compiler output was written, what spawned vbc.exe, whether
  the host and user perform compilation routinely, and whether a newly written
  binary executed or made network connections shortly afterward.
type: detection
detection_id: 7b10f171-7f04-47c7-9fa2-5be43c76e535
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Did a process whose parent is vbc.exe spawn cvtres.exe on this host?
  context: Before investing investigation time, confirm the alert is a true positive.
    The rule fires when the parent image ends in \vbc.exe and the child image ends in
    \cvtres.exe - the signal that the Visual Basic compiler ran the resource-to-object
    converter during a successful compilation. Confirm both ends of the pair and note
    the path vbc.exe ran from; the legitimate compiler lives under
    C:\Windows\Microsoft.NET\Framework, so a vbc.exe running from a user-writable or
    unusual path is itself notable.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
- question: What spawned vbc.exe, and is that parent chain expected for compilation on
    this host?
  context: The vbc.exe parent is the core signal for this detection. Legitimate
    compilation is typically driven by a developer's IDE, a build process, or an
    installer that compiles components at setup time. Tracing vbc.exe's own origin
    reveals whether the chain is a normal build workflow or whether a script host, an
    Office application, or an unexpected process drove the compile - the latter is the
    compile-after-delivery pattern where source is dropped and built locally to evade
    detection.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
- question: Is this user and host expected to compile code with the Visual Basic
    compiler?
  context: On-host compilation is routine on developer workstations and build servers
    and for accounts that do software development, but most endpoints and most user
    accounts never run vbc.exe. Knowing whether the acting account and the host
    function involve building software is often the fastest path to separating normal
    development activity from source dropped and compiled locally to evade signature
    and reputation checks.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What Visual Basic source file did vbc.exe compile, and what output binary
    did it produce?
  context: The compiler reads source from the path passed on the vbc.exe command line
    (the .vb file) and writes an executable or library to its output path. Read
    vbc.exe's full command line to recover the source path, any /target and /out
    options, and referenced assemblies. Source compiled from a temporary, public, or
    user-profile directory rather than a project tree points to delivered-and-compiled
    code; the output path is where the freshly built binary will be found for hashing
    and analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '\vbc.exe'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
      - ParentImage
- question: Is the compiled source or its command line encoded or obfuscated, and what
    operation does the decoded content perform?
  context: Compile-after-delivery is itself an obfuscation step - source delivered as
    text evades binary signatures until it is built locally. The source file or the
    compiler command line may also carry encoded or concatenated content. Read the
    vbc.exe command line for inline source, base64 or hex blobs, character
    concatenation, or referenced files, and review the .vb source on disk. Decoding
    reveals the built binary's intent - download cradle, loader, reverse shell, or
    credential theft.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is the compiler output binary still on disk for analysis?
  context: A successful vbc.exe/cvtres.exe compilation writes an object file and an
    output binary to the path given on the compiler command line. If that binary still
    exists on disk it can be hashed, reputation-checked, and submitted for analysis.
    Scope the search to the output directory recovered from the compiler command line
    rather than all file events on the host.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Did a newly written binary execute on this host shortly after the
    compilation?
  context: The point of compile-after-delivery is to run the freshly built binary. In
    the window right after vbc.exe/cvtres.exe runs, look for execution of a new
    executable - especially one launched from a temporary, public, or user-profile
    directory or from the compiler's output path. Execution of a binary that did not
    exist before the compile links the compile step to its payload and is the
    transition from building code to running it.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did this host make outbound network connections shortly after the
    compilation?
  context: A binary compiled on delivery commonly reaches out for command and control,
    additional payloads, or exfiltration once it runs. Outbound connections in the
    window after the compile - particularly from a process running out of a temporary
    or user-writable directory or from the compiler output path - tie the freshly
    built binary to network activity. Exclude known-good system processes when reading
    the results so operator-driven connections stand out.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
      filter_system:
        Image|endswith:
          - '\svchost.exe'
          - '\System'
      condition: selection and not filter_system
    fields:
      - Image
      - DestinationIp
      - DestinationPort
- question: What other child processes did the same vbc.exe instance spawn?
  context: If the vbc.exe invocation was driven by a malicious or scripted parent, that
    compiler instance and its parent may have spawned other processes too. Examining
    the children of the exact vbc.exe instance reveals whether the compile was a single
    step or one of several actions - additional compiles, the execution of the built
    binary, or staging tools launched alongside it point to orchestration rather than
    an isolated build.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vbc.exe
        Image|endswith: \cvtres.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vbc.exe
        Image|endswith: \cvtres.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the acting account's activity across all hosts reveals whether the
    compilation was a single event or part of activity spanning multiple endpoints. If
    the same user triggered similar activity on other hosts, the scope of the incident
    is larger than one machine and may indicate a coordinated rollout of
    delivered-and-compiled code.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \vbc.exe
        Image|endswith: \cvtres.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the activity surrounding the
    compilation reveals what led to it and what followed - the parent that staged the
    source, reconnaissance, or the execution of the built binary. Novel parent-child
    pairs at low counts are what to scan for against the high-count noise of routine
    system processes.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - reconnaissance, delivery of a script
    or archive, or defense tampering - may reveal the attack stages that preceded the
    compilation and help reconstruct the full timeline. Compiling delivered source is
    often one step in a sequence, so prior alerts give the context for why code was
    built on this host.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Have other hosts run the vbc.exe-to-cvtres.exe compilation pattern in the
    past week, and does the cross-host distribution look like consistent build
    automation or one-off activity?
  context: This query counts the vbc.exe-to-cvtres.exe pair fleet-wide with no host
    scope. Many hosts running the same pattern points to a software-deployment or
    build workflow that compiles components by design; one host or a small unrelated
    set points to manual or targeted activity. Use the host distribution to calibrate
    severity and decide whether this fits a build baseline or stands out as isolated
    on-host compilation.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '\cvtres.exe'
      condition: selection
    fields:
      - host.name
      - CommandLine
