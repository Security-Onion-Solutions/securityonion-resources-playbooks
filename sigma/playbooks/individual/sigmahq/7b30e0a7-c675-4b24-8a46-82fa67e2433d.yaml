name: Conti Volume Shadow Listing
id: daa86eba-ac60-4d84-b3c2-bd074fe242b0
description: |
  Detects a command line that contains both `vssadmin list shadows` and `log.txt`. Both substrings must be
  present in the same command line for the rule to fire; the binary and its path are not constrained, so the
  match is on the argument pattern alone — an enumeration of the volume shadow copies present on the system
  with the output redirected into a log file for later reading. Listing shadow copies reads recovery state,
  it does not alter it: in ransomware tradecraft this is the survey step that precedes deletion of the shadow
  copies, and the destructive command (`vssadmin delete shadows`, `wmic shadowcopy delete`, backup-catalog or
  boot-recovery changes) is a separate invocation that may or may not have followed. The same listing command
  is also standard practice for backup software validation and for administrators checking restore points, so
  the investigation should confirm the exact command line, identify what launched it and where the log file
  was written, determine whether the output collection was part of a wider enumeration sweep, and establish
  whether any command that removes recovery options ran on the host afterward.
type: detection
detection_id: 7b30e0a7-c675-4b24-8a46-82fa67e2433d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting command line contain both `vssadmin list shadows` and `log.txt`, and how is the output
    redirected?
  context: >-
    The rule requires both substrings in the same command line and constrains nothing else. Confirm both are
    present, then read the whole line: the redirection operator and the path beside `log.txt` tell you where
    the listing output was written, and any additional commands chained onto the same line show what else the
    invocation did.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to enumerate volume shadow copies and write the output to a log file?
  context: >-
    Backup products, restore-point validation, and storage administration all run this listing routinely, but
    such use is normally tied to a backup or infrastructure role, a known maintenance window, or a service
    account on a server that holds the backup function. Establish whether the account and host in the alert
    have any such role, and whether the account is interactive, a service principal, or a machine account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: >-
    What did the vssadmin invocation actually ask for, and did other vssadmin commands run on this host in the
    same window?
  context: >-
    vssadmin is a multi-command tool, and a single logical operation often spans several sequential
    invocations — list the shadow copies, read the storage association, then act on them. Scoping to all
    vssadmin command lines on this host in the surrounding minutes shows whether the listing stood alone or
    sat inside a longer sequence, and CurrentDirectory shows where a relative `log.txt` path resolves to.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'vssadmin'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What process spawned this command and is that parent chain expected?
  context: >-
    The parent shows how the listing was invoked. Backup and administrative use typically descends from a
    scheduled task host, a service, a management agent, or an interactive shell opened by an administrator.
    A script host, an Office application, a remote-execution service, or a binary in a user-writable directory
    as the parent points to the command being driven by something other than the host's own maintenance.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other commands on this host redirected output into log.txt around the time of the alert?
  context: >-
    Redirecting output to a log file collects results for later reading rather than for a screen, and the same
    file is commonly reused as the sink for a run of enumeration commands. If several unrelated commands wrote
    to log.txt in the same window, the shadow-copy listing is one line item in a broader survey of the host;
    if only this command did, the collection is narrower. The paths in the results show where the file landed.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'log.txt'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Did any command that deletes shadow copies or disables recovery options run on this host after the
    listing?
  context: >-
    Listing shadow copies reads the recovery state; removing it is a separate command. Whether one followed is
    what separates a survey of restore points from the start of recovery inhibition, and it is the single fact
    that most changes the response. Look for shadow-copy deletion or resizing, backup-catalog deletion, and
    boot-recovery configuration changes, and check the account and parent behind them against the alerting
    invocation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains:
          - 'delete shadows'
          - 'resize shadowstorage'
          - 'shadowcopy delete'
          - 'delete catalog'
          - 'delete systemstatebackup'
          - 'recoveryenabled no'
          - 'bootstatuspolicy ignoreallfailures'
      condition: selection
    fields:
      - Image
      - CommandLine
      - User
  answer_sources:
  - process_creation
- question: What child processes did the alerting process spawn afterward?
  context: >-
    Children of the alerting process show what the invocation led to. A shell that ran the listing and then
    exited leaves nothing; a shell that went on to spawn further enumeration, transfer, or recovery-altering
    commands shows the listing was one step in a sequence driven from the same process.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Does this host normally run vssadmin at all?
  context: >-
    The rule matches a specific argument pattern, but the broader question for a tool with routine backup and
    administrative uses is whether the host runs vssadmin as a matter of course. A host with a 90-day history
    of vssadmin activity under a backup or administrative account has an established reason for the binary to
    run; zero or near-zero history means this invocation is the first, which weighs against a maintenance
    explanation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains: 'vssadmin'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: >-
    When this host has previously produced the rule's exact pattern, what parents and users drove it, and does
    the current alert fit that history?
  context: >-
    This counts the rule's own argument pattern on this host over the past two weeks rather than generic
    vssadmin usage, so the parent and user distribution reflects how this specific listing-plus-log-file
    pattern has run here. A backup or monitoring routine produces a consistent parent and account; a new
    parent, an unexpected account, or no prior history at all is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - vssadmin list shadows
        - log.txt
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    This is the user's 90-day history of the rule's specific argument pattern, aggregated by host, rather than
    generic use of the binary. An account that produces this pattern regularly across the same set of hosts is
    running something established; an account with no history of it that produced it once, on one host, is the
    case to weigh against the account's role and normal toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - vssadmin list shadows
        - log.txt
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a machine account, the user name attributes
    nothing and the launch mechanism is the meaningful pivot. This is the 90-day history of the alerting
    parent driving this specific pattern, aggregated by host. A parent already responsible for thousands of
    prior events is backup or management automation; a parent that is new for this pattern is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - vssadmin list shadows
        - log.txt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the environment around this time?
  context: >-
    Following the account across all hosts in the surrounding hour shows whether the shadow-copy listing was
    an isolated action or one of several the same account took on multiple endpoints. The same account
    enumerating recovery state on several hosts in one window points to a survey being run at scale rather
    than to a host-local maintenance check.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    Under a service principal, following the user account across the environment returns agent telemetry
    rather than an answer, so the launch mechanism is the pivot instead. This counts the rule's pattern driven
    by the alerting parent fleet-wide inside the alert window. Several hosts at once points to scheduled or
    pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - vssadmin list shadows
        - log.txt
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Recovery-state enumeration is rarely the only thing running when it matters. Aggregating parent-child
    pairs on the host in the surrounding half hour collapses routine agent telemetry into high-count rows and
    leaves novel pairs standing out at low counts — account and share enumeration, credential access, defense
    tampering, or transfer tooling appearing alongside the listing changes what the listing means.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: >-
    Have other hosts produced the rule's pattern in the past week, and does the cross-host distribution look
    like consistent automation or one-off activity?
  context: >-
    This is a fleet-wide count of the rule's own argument pattern with no host scope. A wide, even spread
    across many hosts is the signature of a backup or monitoring routine that logs its shadow-copy check the
    same way everywhere, and calibrates the alert down. A handful of unrelated hosts, or this host alone,
    points to activity driven per-host rather than by a deployed routine.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains|all:
        - vssadmin list shadows
        - log.txt
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host give the listing its place in a timeline. Reconnaissance, credential
    access, or defense tampering in the preceding hours indicates the recovery-state check sits inside an
    ongoing sequence rather than standing alone as a maintenance action.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
