name: Network Connection Initiated From Process Located In Potentially Suspicious Or Uncommon Location
id: 23d851cc-3713-4c3c-aabc-5f36dd607b74
description: |
  Detects an outbound network connection initiated by a process whose executable path lies in a
  suspicious or uncommon file-system location - such as the Recycle Bin, the Public or Default user
  profiles, Temp, Perflogs, the Fonts or IME directories, or Task folders - where the destination is
  not one of a set of excluded public file-sharing and paste-site domains. A small number of updaters
  or helper utilities occasionally run from these paths; malicious use fits ingress tool transfer,
  where a payload dropped into a world-writable directory beacons out or pulls a second stage.
  Determine which process initiated the connection, whether its location and parent chain are
  expected, what it did, and whether a file was written or executed as a result.
type: detection
detection_id: 7b434893-c57d-4f41-908d-6a17bf1ae98f
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Which process initiated this outbound connection, and is its executable path one of the suspicious or uncommon locations this rule flags?
  context: Confirm the alert by reviewing the initiating process image path and the connection direction against the rule's criteria. The rule fires on outbound (egress) connections from a process whose path contains one of the flagged locations - Recycle Bin, Public or Default user profiles, Temp, Perflogs, Fonts, IME, or Task directories. On this telemetry the network category mixes sensor-level events that carry no process fields with endpoint events that do; a populated image path means the alerting event came from the endpoint subset.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - Image
      - Initiated
- question: Is this user and host expected to run a program from this location that reaches out to the network?
  context: Legitimate administrative activity can trigger this detection - some updaters and helper utilities do run from Temp or profile directories and make outbound calls. Knowing whether the user role and host function are consistent with a process in this location initiating a connection is often the fastest way to separate a true positive from routine operation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the full command line of the process that initiated the connection?
  context: The command line reveals what the process in the suspicious location was actually doing - download flags, target URLs, encoded arguments, or the working directory it operated from. The network event itself carries no command line, so this pivots to process activity for the same binary on the host. For a single invocation this returns one row; for a multi-step utility it surfaces the sequential commands that together form one operation.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: What is the destination, and what do DNS, WHOIS, and threat intelligence reveal about it?
  context: Investigate the destination IP and any resolved hostname - registration age, passive DNS history, TLS certificate details, and known-infrastructure hits. Destination hostname is sparsely recorded on this telemetry because name resolution is a separate event, so treat an empty hostname as expected and pivot through the DNS lookup for the domain. An unusual or high-numbered destination port paired with an untrusted initiating process is the meaningful signal; the port alone is weak because benign software reuses many of the same ports. Distinguishing an internal destination from an external one narrows whether this is external command-and-control or internal movement.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - DestinationPort
- question: What process spawned this one, and is that parent chain expected?
  context: The parent process reveals how the program in the suspicious location was launched. Predictable parents (explorer.exe for user actions, services.exe for services, a known updater) point to routine activity, while a script host, Office application, or an unexpected parent points to exploitation or a delivered payload. Tune out known-good updater parents such as bundled application updaters before treating an unfamiliar parent as significant.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: What child processes did this program spawn afterward?
  context: The processes launched by the program after it connected reveal its actual impact. A downloader that fetched a second stage often spawns a shell, a script host, or another utility to run what it retrieved; unexpected children point to post-exploitation rather than a benign helper finishing its work.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Was a file created by this process or its children, confirming a download completed?
  context: An outbound connection does not guarantee a file was retrieved - network errors, blocked destinations, or security controls may have stopped the transfer. A file creation by the alerting process or a child it spawned establishes that the delivery stage succeeded and gives a path to analyze. This correlates file creation to the process and its direct children by lineage, not to unrelated writers.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: Is a file written by this process still on disk for analysis?
  context: If the process retrieved or produced a file, checking whether it still exists on disk enables deeper analysis - hash lookup, sandbox submission, or content review. This correlates file activity to the alerting process and its direct children by lineage; a file that was written and then deleted will show the write and its removal.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: What other files did this process or its children write to disk around the alert?
  context: A delivery rarely arrives as a single file - the same process, or a child it spawns, often writes further files during extraction, decompression, or a follow-on transfer. Surfacing the full file-write footprint of the process and its direct children reveals the broader scope of the operation. This catches the process and its direct children, not grandchildren or unrelated writers.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
- question: If a downloaded payload was executed, what is its hash, and is it known to threat intelligence?
  context: The hash needed for a reputation lookup or detonation is recorded when a payload runs, not when it is written - file-creation events carry no hash in this telemetry. This returns the processes the alerting process and its parent spawned - its children and siblings - with their executable hashes; for a download-and-execute that is the payload. If the payload was run later by an unrelated process it will not appear here; retrieve the file from the on-disk path and hash it manually.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection_children:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection_children
    fields:
      - Image
      - Hashes
- question: Does this host normally run this program from this location?
  context: A program that has never been seen running from this path on this host is more notable than one that runs regularly. Zero or very low historical counts over the baseline window indicate first-time or rare execution, which raises the weight of the other findings.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Does this host normally communicate with this destination?
  context: A first-time connection to a destination is more notable than routine communication. Establishing whether this host has reached this destination before helps separate newly stood-up infrastructure from regular business traffic. The destination port variation across prior connections shows whether the service being contacted is consistent with normal use.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the alert reveals what led to this event and what happened after, and whether it is part of a larger sequence such as reconnaissance, privilege escalation, or persistence. Aggregating by parent-child pairs collapses repetitive agent noise into high-count rows while novel pairings stand out at low counts.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host - defense tampering, reconnaissance, credential access - may reveal the stages that preceded this event and help reconstruct the timeline. Ingress tool transfer is typically a mid-operation step, so a preceding execution or delivery alert often explains how the process reached this location.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
