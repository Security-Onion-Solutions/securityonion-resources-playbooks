name: Renamed Vmnat.exe Execution
id: 3c180771-5cce-4227-b627-4386a17d2fe2
description: |
  Detects a process whose embedded PE metadata identifies it as vmnat.exe (the
  VMware NAT service binary) but which runs under a different filename on disk —
  the rule fires when OriginalFileName is vmnat.exe AND the Image does not end in
  vmnat.exe. Legitimate vmnat.exe ships with VMware Workstation/Player and runs
  from its install directory under its real name; a renamed copy is a hallmark of
  DLL side-loading, where a trusted, signed binary is dropped beside an
  attacker-controlled DLL so the malicious code loads inside a process that looks
  benign. The investigation should confirm the name/metadata mismatch, identify
  the binary's hash and signer, determine how it arrived on the host, and — most
  importantly — establish which DLLs it loaded from non-standard directories.
type: detection
detection_id: 7b4f794b-590a-4ad4-ba18-7964a2832205
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-08
questions:
- question: Is this binary running under a name other than vmnat.exe while its OriginalFileName metadata still reads vmnat.exe?
  context: Confirm the alert is a true positive before investing investigation time. The rule fires when the embedded OriginalFileName
    is vmnat.exe AND the on-disk Image name does not end in vmnat.exe. Compare the Image path against OriginalFileName on the
    triggering event — a genuine match means the VMware NAT binary was copied and renamed, which is the precondition for DLL
    side-loading.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - OriginalFileName
- question: Is this user and host expected to run a VMware component such as vmnat.exe?
  context: Legitimate vmnat.exe runs on machines with VMware Workstation or Player installed, under its real name from the
    VMware install directory. A renamed copy running on a host that does not run VMware, or under a user who has no reason
    to invoke virtualization tooling, is harder to explain as routine activity.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What is the actual identity of this binary based on its metadata, signer, and hash?
  context: When a binary is renamed, the PE metadata (OriginalFileName) and code-signing details still reflect the original
    tool. The Image path is the name on disk; OriginalFileName reads vmnat.exe. The signing party and signature status indicate
    whether this is the genuine VMware-signed binary that was merely relocated and renamed, or an unsigned/tampered copy. The
    file hash enables a reputation lookup to determine whether this is the known-good VMware binary, a known malicious sample,
    or a novel file requiring deeper analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - OriginalFileName
      - Hashes
- question: What command line did the renamed vmnat.exe run with, and what does it reveal about its operation?
  context: The full command line reveals the specific action taken by the renamed binary. Decode any flags, parameters, file
    paths, or URLs. For a side-loading host process, the arguments often look benign — the malicious behavior comes from the
    DLL it loads rather than from its own command line — so an empty or trivial command line does not clear the alert; pair
    this with the DLL-load review.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which DLLs did the renamed vmnat.exe load, and were any loaded from a non-standard directory?
  context: DLL side-loading works by placing an attacker-controlled DLL in the same directory as a trusted binary so it loads
    in place of, or ahead of, the legitimate library. Module-load telemetry for this process shows every DLL it mapped; DLLs
    loaded from the binary's own drop directory, a user-writable path, or any location outside System32/SysWOW64 and the
    genuine VMware install tree are the side-loading evidence. Compare the load paths and, where available, the loaded-module
    signatures against what a genuine vmnat.exe loads. If module-load events are not ingested in this environment, treat zero
    results as a visibility gap rather than evidence nothing was side-loaded.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ImageLoaded
      - Hashes
      - Signed
- question: How did this renamed binary arrive on the host?
  context: 'Renamed binaries do not appear spontaneously — they were copied, downloaded, or dropped by a parent process. Tracing
    the file-creation event for this binary by name reveals the delivery mechanism: a download tool, a malware dropper, a
    manual copy via explorer or remote access, or lateral movement from another host. The process that created the file
    (Image in the file event) is the dropper, installer, or copy operation; the drop directory matters because a side-loaded
    DLL typically lands in the same folder.'
  range: -30d
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains|expand: '%file_name%'
      condition: selection
    fields:
      - TargetFilename
      - Image
- question: What did the renamed binary do after execution, and is the same renamed binary present on other hosts?
  context: The purpose of renaming a binary is to evade detection while still performing its function — here, hosting a
    side-loaded DLL. Examining the child processes, file operations, and network connections originating from the renamed
    binary reveals its actual objective. The same renamed binary appearing on multiple hosts suggests deliberate distribution
    rather than an isolated incident; the cross-host pattern is covered by the fleet-scope question.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What process spawned this renamed binary, and is that parent chain expected?
  context: The parent process reveals how the binary was invoked. A signed VMware component launched by a VMware installer
    or service is routine; a renamed copy launched by a script host (wscript.exe, mshta.exe), an Office application, an
    archive utility, or a remote-access tool points to delivery via a loader or an interactive operator.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
- question: When this host has previously fired the rule's pattern, what parents and users normally drive that activity, and
    does the current alert fit that pattern?
  context: Even legitimate VMware components can be relocated by an admin. This query mirrors the rule's selection structure
    scoped to this host — the resulting parent/user distribution reflects how the rule's specific firing pattern (a vmnat.exe-metadata
    process running under a different name) has historically run here. A new parent process, an unexpected user account, or
    a first-ever occurrence is the anomaly worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: vmnat.exe
      filter_rename:
        Image|endswith: vmnat.exe
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection and not 1 of filter_*) and _pb_scope
    fields:
    - ParentImage
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent
    automation or one-off activity?
  context: This query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of the
    rule's firing pattern, not generic vmnat.exe usage. Many hosts firing the same pattern points to a scripted deployment
    or a packaged tool that legitimately ships a renamed VMware binary; one host or a small unrelated set points to targeted
    side-loading. Use the host distribution and parent consistency to calibrate severity.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        OriginalFileName: vmnat.exe
      filter_rename:
        Image|endswith: vmnat.exe
      condition: selection and not 1 of filter_*
    fields:
    - host.name
- question: Does this user normally run this binary anywhere in the environment?
  context: Compare this user's current action against their historical behavior. A user who has never run this binary is more
    suspicious than one who does so regularly, and a user's role and typical toolset should align with running a VMware
    component. Zero or very low historical counts indicate first-time or rare execution for this account.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- question: Is this parent+binary combination historically routine on this host or across the environment, or is the parent
    unusual for this binary?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful pivot
    is the launch mechanism: which parent process spawned this binary, and is that pair historically common. A new or rare
    parent for this binary on this host or environment-wide is the deviation worth chasing; a pair that already accounts for
    thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or activity spanning multiple endpoints. If
    the same user triggered similar activity on several hosts, the scope of compromise may be larger than the single alerting
    host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent+binary combination fire on other hosts in the same window — i.e., is this a coordinated automation
    rollout, or is the activity isolated to this host?
  context: Under a service principal, asking what else the user did across the network returns agent-telemetry noise, because
    every host runs service-owned processes constantly. The meaningful question is whether the same launch mechanism — parent
    process plus spawned binary — fired on other hosts in the alert window. Multiple hosts in the same window points to
    scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to
    this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, privilege escalation,
    or persistence mechanisms appearing as novel parent-child pairs at low counts.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — defense tampering, reconnaissance,
    credential access — may reveal the attack stages that preceded the side-loading attempt and help reconstruct the full
    timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. After establishing a side-loading foothold, they commonly
    install backup mechanisms using different techniques — scheduled tasks, services, registry Run keys, BITS jobs, or WMI
    subscriptions. Multiple persistence installations in the same timeframe indicate intentional stacking rather than
    isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
