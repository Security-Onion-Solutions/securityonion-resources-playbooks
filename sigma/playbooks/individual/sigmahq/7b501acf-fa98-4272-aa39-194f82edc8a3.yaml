name: CVE-2021-44077 POC Default Dropped File
id: fbb2ddee-a467-4465-a547-72d3fb26e13f
description: |
  Detects the creation of a file named msiexec.exe inside the bin directory of ManageEngine SupportCenter Plus
  (\ManageEngine\SupportCenterPlus\bin\msiexec.exe), a plant associated with exploitation of CVE-2021-44077. The
  genuine Windows Installer binary lives in the system directory and the application does not ship its own copy here,
  so a write to this path stages an attacker-controlled binary under a trusted name that the application then runs
  through a working-directory-relative invocation (name masquerading / path manipulation). A benign cause is
  unlikely; investigation should confirm the drop, analyze the planted binary, determine whether it executed, and
  reconstruct what the writing process and host did around the alert, since web shell installation, credential access,
  and follow-on tooling frequently accompany this drop.
type: detection
detection_id: 7b501acf-fa98-4272-aa39-194f82edc8a3
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: 'Does the created file match what this rule detects: msiexec.exe written into the ManageEngine SupportCenter Plus bin directory?'
  context: Before investing investigation time, confirm the alert is a true positive by reviewing the exact on-disk path
    and the process responsible for the write. The rule fires on the creation of a file named msiexec.exe inside the
    application's bin directory. The legitimate Windows Installer binary lives in the system directory, so a copy under
    this application path is the plant this rule targets.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - alert
  - file_event
- question: Is this host and its writing process expected to place an msiexec.exe binary in the application's bin directory?
  context: Legitimate administrative or servicing activity can write executables, but the application does not deliver
    its own msiexec.exe into this directory. Knowing whether the host role and the responsible process are consistent
    with routine operation is often the fastest path to separating a true positive from a benign event. When the writer
    is a machine or service account, judge by the writing process and the host's function instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is the planted msiexec.exe still on disk, or was it deleted or renamed after the alert?
  context: The file's post-alert lifecycle drives both urgency and next steps. A payload still on disk can be retrieved,
    hashed, and analyzed; a file deleted shortly after creation suggests anti-forensic cleanup or a self-deleting
    dropper and shifts the focus to what executed in between. Interpret the operation type on each event to see whether
    a deletion followed the creation.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith|expand: '%TargetFilename%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - manual_review
- question: Which process wrote this file, and what is its full command line and parent?
  context: The file event carries the identifiers of the process that performed the write, so its launch record can be
    retrieved to confirm whether the writer is the application's own web service or an unexpected process. A drop into
    the application's bin directory driven by the public-facing service points to exploitation of that application
    rather than a local install or a manual copy.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
  - manual_review
- question: What is the content of the planted msiexec.exe, and is it the genuine Windows Installer binary or an unrelated payload?
  context: Read and analyze the file's actual content rather than trusting the filename. Check whether it is a signed
    Microsoft-published Installer binary or an unsigned, renamed executable; for a payload, examine imports, embedded
    strings, packer or .NET assembly markers, and any encoded or embedded secondary content. A binary carrying the
    msiexec name but built as a small .NET dropper is the masquerade this technique relies on. Content retrieval
    requires pulling the file from the endpoint or an EDR console for offline analysis.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
  - manual_review
  - safe_environment
  - external_threat_intel
- question: If this binary executed, what is its hash and does it have known threat intelligence detections?
  context: A file's hash is recorded when it runs, not when it is written, since file-creation events carry no hash.
    This query looks for the planted binary executing from its on-disk path and reads its hash; submit that to threat
    intelligence to determine whether it is known malicious, benign, or previously unseen. If the binary is present but
    has not executed, retrieve it from disk and hash it manually.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      condition: selection
    fields:
      - Image
      - Hashes
  answer_sources:
  - process_creation
  - external_threat_intel
- question: Was the planted msiexec.exe executed after it was written?
  context: A binary dropped into the application's bin directory can be run when the application invokes msiexec by name
    and resolves it from its own working directory first, executing the planted file instead of the system one. Confirm
    whether the binary ran from this path and capture the command line it launched with, which reveals what the payload
    was directed to do.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
  - image_load
- question: What process spawned the process that wrote this file, and is that parent chain expected?
  context: The parent of the writing process shows how the write was initiated. A write driven by the application's own
    service parent chain is consistent with exploitation of the running application; an unexpected interactive shell,
    script host, or office application as the parent points to a different delivery path that changes the scope of the
    investigation.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What other files did the responsible process write or delete around the alert?
  context: A process that plants one binary often writes several — a web shell, staging output, or additional tooling.
    The breadth, paths, and extensions of the writing process's other file activity distinguish a single artifact from
    an in-progress intrusion and enumerate what else needs review. This covers both the writer and any child processes
    it delegated the writes to.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection_self:
        ProcessGuid|expand: '%ProcessGuid%'
      selection_child:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: 1 of selection_*
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
- question: What else has been written to the SupportCenter Plus bin directory recently, and by which processes?
  context: The application's bin directory has a small set of processes that legitimately write there. Other recent
    arrivals — additional executables, scripts, or web-accessible files — reveal whether this is an isolated plant or a
    directory under active use, and which other artifacts belong to the same activity. A single unfamiliar writer
    across several files is the signal to follow.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|contains: '\ManageEngine\SupportCenterPlus\bin\'
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has a file been written to this bin path on this host before?
  context: A binary that has never appeared at this path is more notable than one that is part of normal operations.
    First-time appearance of an executable in the application's bin directory should be treated as new even though the
    filename matches a common system binary; a zero or very low historical count points to a first-time write.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      condition: selection
    fields:
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: Has this same bin path been written on any other hosts?
  context: Finding the same plant on multiple hosts suggests exploitation of more than one application server or
    deliberate distribution; a single host suggests a targeted drop. Determine the distribution across hosts and the
    timeline to size the potential compromise.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      condition: selection
    fields:
      - host.name
      - TargetFilename
      - Image
  answer_sources:
  - file_event
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what
    led to the write, what happened after, and whether it is part of a larger sequence. Look for reconnaissance
    commands, credential-access tooling, or persistence mechanisms in the same window, which commonly follow a
    web-application compromise.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's 90-day
    history of this specific write pattern (not generic activity), aggregated by host. A user who has never produced
    this pattern is more notable than one who does so regularly; weigh the count against the user's role and the fact
    that this write is normally driven by a service account rather than an interactive user.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this program historically driven the rule's pattern on this host or across the environment, or is the program new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior. The meaningful
    pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped to the alerting program, so the result is the 90-day history of this program driving this specific write (not generic program+path
    co-occurrence). A new or rare program for this pattern is the deviation worth chasing; a program that already accounts
    for many prior events is application or servicing automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: Tracking the user's activity across all hosts reveals lateral movement or parallel actions on multiple
    endpoints. If the same user triggered similar activity on several hosts, the scope of compromise may be larger than
    this single alert. When the alert fires under a machine or service account, this view returns broad agent-telemetry
    activity and the parent-driven view is the meaningful answer instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same program-driven pattern fire on other hosts in the same window, indicating a coordinated automation rollout rather than isolated activity?
  context: 'Under a service principal, asking what else the user did across the network returns agent-telemetry noise
    (every host runs service-owned agents constantly). The meaningful question is whether the same launch mechanism
    fired elsewhere: the query mirrors the rule''s selection structure scoped to the alerting program,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scripted or pushed automation; a single
    host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        TargetFilename|endswith: \ManageEngine\SupportCenterPlus\bin\msiexec.exe
      _pb_scope:
        Image|endswith|expand: '%Image%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host — exploitation of a public-facing
    service, reconnaissance, or credential access — may reveal the attack stages that preceded this write and help
    reconstruct the full timeline.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
