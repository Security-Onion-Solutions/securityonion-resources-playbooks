name: Potential Ke3chang/TidePool Malware Activity
id: 2a7ab028-ed1a-42c6-b5de-3eeb110e55fb
description: |
  Detects command lines that rewrite Internet Explorer security and first-run registry settings through
  -Property/-name/-value arguments: setting IEHarden to 0, writing Check_Associations, or setting
  DisableFirstRunCustomize to 2. Setting IEHarden to 0 turns off Internet Explorer Enhanced Security
  Configuration, which otherwise blocks scripting, ActiveX controls, file downloads, and the HTML virtual
  machine; the TidePool malware family writes this combination of values to relax browser restrictions before
  retrieving browser-hosted content. Provisioning scripts and golden-image build steps also relax these
  settings on servers, so the investigation should establish which process issued the command, whether the
  registry values actually changed, whether the change corresponds to a known build or provisioning task, and
  what ran on the host in the window after the change.
type: detection
detection_id: 7b544661-69fc-419f-9a59-82ccc328f205
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the command line contain one of the Internet Explorer registry settings this rule detects?
  context: >-
    Confirm the alert before investing investigation time. The rule fires on a command line carrying any one of
    three argument strings: DisableFirstRunCustomize set to 2, Check_Associations being written, or IEHarden set
    to 0. Read the full command line and note which of the three is present and what process carried it.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to relax Internet Explorer security settings from the command line?
  context: >-
    Build engineers, image-provisioning accounts, and server administrators legitimately disable Internet
    Explorer Enhanced Security Configuration during host setup. An interactive workstation user, or a service
    account with no provisioning role, has no routine reason to rewrite these values.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Which Internet Explorer setting was targeted, and what value was written?
  context: >-
    The three targets carry different impact. IEHarden set to 0 removes the Enhanced Security Configuration
    restrictions on scripting, ActiveX, and downloads, leaving the browser able to fetch and run remote content.
    Check_Associations and DisableFirstRunCustomize suppress the browser's first-run and default-handler prompts,
    which keeps a scripted browser launch from stalling on a dialog. Read the command line and record the exact
    value written for each.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Did the Internet Explorer hardening registry values actually change on this host?
  context: >-
    The rule matches the command line, not the outcome — a failed or blocked invocation still fires it. Registry
    write events under the ZoneMap\IEHarden value and the Internet Explorer Main key confirm the settings were
    committed and show the data written. A write to all three values in one window is a tighter finding than a
    single value being touched.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_keys:
        TargetObject|contains:
          - '\ZoneMap\IEHarden'
          - '\Internet Explorer\Main\Check_Associations'
          - '\Internet Explorer\Main\DisableFirstRunCustomize'
      condition: selection and selection_keys
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - manual_review
- question: Is Internet Explorer Enhanced Security Configuration still disabled on this host, or has it been restored?
  context: >-
    The change may have been momentary — set for one retrieval and reverted — or it may still stand. Check the
    current value of IEHarden on the host directly or through the endpoint management console. If Enhanced
    Security Configuration is still off, restore it before continuing, since the host remains able to fetch and
    execute remote browser content without the usual restrictions.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - edr_console
  - manual_review
- question: What process spawned the command that rewrote these registry settings, and is that parent chain expected?
  context: >-
    The parent reveals how the command was invoked. A deployment agent, configuration-management client, or
    setup script is a routine launcher for Internet Explorer hardening changes. An Office application, a script
    host, rundll32.exe, or a browser process as parent points to the settings being relaxed by delivered code
    rather than by a build step.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What did the alerting process spawn after it wrote the registry settings?
  context: >-
    Children of the alerting process show what the relaxed browser restrictions were for. A browser launch,
    rundll32.exe loading a DLL from a user-writable or shared directory, or a download utility appearing in the
    minutes after the change ties the setting change to the operation it enabled. Scoped by the alerting
    process identity rather than by binary name, since the rule constrains only the command line.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What activity occurred on this host after the Internet Explorer settings were changed?
  context: >-
    Browser restrictions are relaxed in order to run something that the restrictions would otherwise block. The
    hour after the change is the correlation window where that follow-on activity appears; widen it toward +4h if
    the host is quiet. Aggregated by binary and user so a new or rare process stands out against the routine
    background.
  range: +1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: Were other defense tampering actions performed on this host?
  context: >-
    An operator who relaxes browser restrictions often relaxes others in the same session — stopping a service,
    changing a firewall profile, or clearing a log. This query covers the common tampering utilities and
    argument patterns; treat hits from the environment's own administrative tooling and security service names
    as expected and focus on the ones with no matching change record.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_tamper:
        Image|endswith:
          - '\wevtutil.exe'
          - '\vssadmin.exe'
          - '\bcdedit.exe'
          - '\wbadmin.exe'
          - '\netsh.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\powershell.exe'
        CommandLine|contains:
          - 'cl '
          - 'clear-log'
          - 'delete shadows'
          - 'recoveryenabled'
          - 'DisableRealtimeMonitoring'
          - 'advfirewall'
          - 'stop'
          - 'delete'
      condition: selection and selection_tamper
    fields:
      - Image
      - User
  answer_sources:
  - process_creation
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    The activity immediately surrounding the change shows what led to it and what followed. Aggregating by
    binary and parent collapses repetitive background telemetry into single high-count rows while novel
    parent-child pairs stand out at low counts — document delivery, script hosts, and DLL loaders are the pairs
    worth reading first.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: When this host has previously written these Internet Explorer settings, what parents and users drove it, and does the current alert fit?
  context: >-
    The query mirrors the rule's selection scoped to this host, so the parent/user distribution reflects how
    these specific registry-writing commands have historically run here rather than generic command-line usage.
    A repeat of the same provisioning parent and account is routine; a new parent process, an unexpected account,
    or a first-ever occurrence on a host that has run this pattern for years is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -Property DWORD -name DisableFirstRunCustomize -value 2 -Force
        - -Property String -name Check_Associations -value
        - -Property DWORD -name IEHarden -value 0 -Force
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously written these Internet Explorer settings, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection scoped to this user, giving their 90-day history of these specific
    registry-writing commands aggregated by host. An account that performs this across many hosts is likely a
    provisioning identity; an account that has never produced it before, or produces it on a single workstation,
    warrants checking the account's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -Property DWORD -name DisableFirstRunCustomize -value 2 -Force
        - -Property String -name Check_Associations -value
        - -Property DWORD -name IEHarden -value 0 -Force
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven these registry writes here or across the environment, or is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM, a service account, or a computer account, user identity does not
    attribute the behavior and the launch mechanism is the meaningful pivot. This gives the 90-day history of
    the alerting parent driving these specific registry-writing commands, aggregated by host. A parent that
    already accounts for hundreds of prior events is build or vendor automation; a parent that is new for this
    activity is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -Property DWORD -name DisableFirstRunCustomize -value 2 -Force
        - -Property String -name Check_Associations -value
        - -Property DWORD -name IEHarden -value 0 -Force
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the environment around this time?
  context: >-
    Tracking the account's activity across all hosts in the alert window shows whether the settings change was
    an isolated act or one step in a sequence touching several endpoints. Repetition of the same activity across
    many hosts under one account usually reflects a provisioning sweep; a scattered mix of tooling on unrelated
    hosts reflects hands-on operator activity.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did this same parent-driven registry-write activity fire on other hosts in the same window?
  context: >-
    Under a service principal, pivoting on the user account returns the constant background of agent telemetry
    rather than an answer. This query mirrors the rule's selection scoped to the alerting parent process,
    fleet-wide, in the alert window. Multiple hosts in the same window points to scheduled or pushed automation;
    a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -Property DWORD -name DisableFirstRunCustomize -value 2 -Force
        - -Property String -name Check_Associations -value
        - -Property DWORD -name IEHarden -value 0 -Force
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Have other hosts written these Internet Explorer settings in the past week, and does the cross-host distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's selection with no host scope, so the result is a fleet-wide count of these
    specific registry-writing commands. Many hosts producing them points to imaging or configuration-management
    rollout; one host, or a small set with no build role in common, points to manual activity. Use the host
    distribution to calibrate how much of the investigation is environmental noise.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        CommandLine|contains:
        - -Property DWORD -name DisableFirstRunCustomize -value 2 -Force
        - -Property String -name Check_Associations -value
        - -Property DWORD -name IEHarden -value 0 -Force
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Relaxing browser restrictions is rarely the first step. Earlier detections on the same host — document-borne
    execution, script hosts, DLL side-loading, or other tampering — help reconstruct how the code that issued
    this command arrived and what stage the host is at.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Were other process-based persistence mechanisms installed on this host?
  context: >-
    Relaxing browser restrictions prepares a host for content retrieval; the retrieved code generally needs to
    survive a reboot. Registry autostart writes, scheduled-task creation, and service installation appearing in
    the same few hours as the settings change indicate the two are steps in one operation rather than unrelated
    administrative actions.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
