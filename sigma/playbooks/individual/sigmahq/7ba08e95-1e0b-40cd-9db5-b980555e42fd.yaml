name: SOURGUM Actor Behaviours
id: 1b84d85b-f861-4aa2-ba7e-2d4e1f3cf340
description: |
  Fires when a process-creation event matches either of two independent conditions: the image path
  references a physical-memory-access driver (windows\system32\Physmem.sys) or a WimBootConfigurations.ini
  under a C:\Windows\System32\IME subfolder (SHARED, IMEJP, IMETC); or a process whose image sits under
  System32\IME (or System32\filepath2) runs `reg add` against one of two specific COM CLSID InprocServer32
  keys. Both branches correspond to COM hijacking for persistence and privilege escalation (T1546.015):
  a first-stage DLL is written into a subfolder whose names blend with legitimate input-method files, the
  InprocServer32 value of a COM class is repointed at that DLL so a host process such as svchost.exe loads
  it under SYSTEM, and a signed physical-memory-access driver is used to proxy API calls through the kernel.
  Determine which branch fired, whether either CLSID key was actually written and to what value, whether a
  DLL subsequently loaded out of those directories, and whether the referenced driver or INI file exists on
  disk.
type: detection
detection_id: 7ba08e95-1e0b-40cd-9db5-b980555e42fd
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the alerting event match either detection branch — a path reference to Physmem.sys or an IME
    WimBootConfigurations.ini, or a `reg add` writing a COM CLSID InprocServer32 key?
  context: >-
    The rule fires when at least one of two conditions holds. Either the image path contains
    windows\system32\Physmem.sys or a WimBootConfigurations.ini under System32\ime\SHARED, \IMEJP, or
    \IMETC; or the image sits under windows\system32\ime (or windows\system32\filepath2) AND the command
    line contains both `reg add` and one of the two CLSID InprocServer32 key paths — that second branch
    requires both halves together. Note which branch fired, because they lead to different evidence: the
    driver/INI branch points at files staged on disk, while the reg-add branch points at the COM class
    repoint itself.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to register COM classes or write into System32\IME directories?
  context: >-
    The System32\IME tree holds input-method files shipped with the operating system; third-party software
    and administrators rarely add binaries there, and COM class registration is normally done by an
    installer running under a documented deployment. A host whose role includes software packaging or
    language-pack servicing has a plausible explanation; a general workstation does not.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this execution part of an authorized penetration test or red team engagement?
  context: >-
    COM hijacking and vulnerable-driver loading are both exercised during authorized security assessments.
    The file paths and CLSID keys this rule matches are narrow, so a matching engagement action would have
    been deliberate and scoped. Check whether an assessment covering persistence or kernel-driver testing
    is active on this host or network segment before investing further analysis time.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What specific capability was invoked — which file path or which CLSID key does the command line name?
  context: >-
    The two matched CLSIDs are distinct COM classes, and the value written to InprocServer32 names the DLL
    that will be loaded in place of the legitimate component. Read the full command line to establish which
    key was targeted, what DLL path the value points at, and whether the invocation writes the key or merely
    references one of the staged file paths. That determines whether the outcome is a persistence
    installation or file staging that has not yet been wired up.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What else did this binary run on this host in the same window, and do those invocations form one operation?
  context: >-
    Registry-writing tools are invoked repeatedly: a COM repoint is often one of several sequential
    invocations that together stage a DLL, write the class value, and clean up. This returns every execution
    of the alerting binary on this host inside the alert window, so the analyst can read the invocations as a
    unit rather than as a single line. Decode each command line, including quoted DLL paths and any value
    data passed to `reg add`.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: Is this parent expected to spawn this child? What started the parent?
  context: >-
    A COM class repoint driven by an installer or a packaging tool has a parent chain that reflects it —
    msiexec.exe, a setup binary, a management agent. A repoint driven from an interactive shell, a script
    host, a browser child, or an Office application reflects hands-on activity instead. Tracing the parent's
    own origin shows which of the two this is.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
      - ParentCommandLine
  answer_sources:
  - process_creation
- question: What other child processes did the same parent spawn?
  context: >-
    Installing this form of persistence takes more than one step — the DLL is copied into place, the class
    value is written, and the original component may be renamed or preserved so the host process keeps
    working. Siblings under the same parent expose the steps that did not themselves match the rule, such as
    copy operations into the IME tree or additional registry writes.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What files did the alerting process write on this host after it ran?
  context: >-
    The artifacts of this technique are a DLL placed in a subfolder of System32\IME whose name imitates a
    legitimate input-method component, encrypted second-stage files (commonly .dat, sized to a multiple of
    16) under subfolders of System32\config, a physical-memory-access driver under System32\drivers, and a
    WimBootConfigurations.ini holding the hijack command. File writes from the alerting process confirm which
    of these were staged even if the process has exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: >-
    Were either of the two targeted COM CLSID InprocServer32 keys actually modified on this host, and what
    DLL path was written?
  context: >-
    The command line shows the intent to write the key; the registry event shows whether the write landed and
    what value it carries. An InprocServer32 default value pointing at a DLL under System32\IME, System32\config,
    or any path outside the component's own install directory is the repoint itself. Compare the value against
    the DLL the legitimate class normally loads. Key deletion is not observable on endpoint telemetry, so read
    the modification history rather than looking for a removal event.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_clsid:
        TargetObject|contains:
          - \CLSID\{7c857801-7381-11cf-884d-00aa004b2e24}\InprocServer32
          - \CLSID\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\InprocServer32
      condition: selection and selection_clsid
    fields:
      - TargetObject
      - Details
      - Image
  answer_sources:
  - process_creation
  - manual_review
- question: Did any DLL load out of the System32\IME tree on this host, and was it signed?
  context: >-
    A repointed COM class only takes effect when a host process instantiates it and loads the DLL, so the load
    event is what converts a registry write into running code. First-stage DLLs staged in this tree carry names
    modelled on genuine input-method components but are unsigned, while the real components are signed by the
    operating system vendor. An unsigned load out of these directories, especially into svchost.exe, is the
    execution half of the technique. If library-load telemetry is not collected in this environment, treat an
    empty result as a visibility gap rather than evidence nothing loaded.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: image_load
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_path:
        ImageLoaded|contains: \Windows\System32\IME\
      filter_signed:
        Signed: 'true'
      condition: selection and selection_path and not filter_signed
    fields:
      - ImageLoaded
      - Image
      - Signature
      - Hashes
  answer_sources:
  - process_creation
  - manual_review
- question: >-
    Which account performed the registry and task-trigger changes recorded on the security channel for this
    host, and was it SYSTEM or an interactive user?
  context: >-
    Event-triggered execution is worth separating by the identity that defined the trigger: a change made by
    SYSTEM or LOCAL SERVICE points at a service or an installer acting on someone's behalf, while a change made
    by an interactive account points at hands-on activity that a person can be asked about. Registry-value
    modification (4657) and scheduled-task creation or update (4698, 4702) records name the subject account and
    the program that made the change. These records depend on object-level audit policy being configured; if it
    is not, or the security channel is not collected, an empty result is a visibility gap.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      product: windows
      service: security
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 4657
          - 4698
          - 4702
      condition: selection
    fields:
      - EventID
      - SubjectUserName
      - ObjectName
      - ProcessName
  answer_sources:
  - manual_review
  - organizational_knowledge
- question: Were WMI event subscriptions registered on this host around the same time?
  context: >-
    A COM repoint is one way to get code launched on an event; a permanent WMI subscription is
    another, and operators frequently stack more than one so that removing the first does not end
    access. Subscription records — 5859 filter-to-consumer activity, 5860 temporary and 5861
    permanent consumer registrations — show whether a second trigger was installed alongside the
    one that alerted; read the CONSUMER, Query, and message columns for what was bound and what
    it runs. Hosts that do not ship the WMI activity channel return nothing here, so an empty
    result is a visibility gap rather than evidence no subscription exists.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: wmi
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        EventID:
          - 5859
          - 5860
          - 5861
      condition: selection
    fields:
      - EventID
      - winlog.user_data.CONSUMER
      - winlog.user_data.ESS
      - winlog.user_data.Query
      - winlog.user_data.NamespaceName
      - message
  answer_sources:
  - manual_review
  - edr_console
- question: >-
    When this host has previously fired the rule's pattern, what parents and users drove that activity, and
    does the current alert fit that history?
  context: >-
    The query mirrors the rule's own selection structure scoped to this host, so the parent and user
    distribution it returns reflects how this specific pattern has run here before rather than generic use of
    the binary. For a rule this narrow, the expected answer is nothing at all — a prior history would point at
    a servicing routine or a packaging job that touches the IME tree, and that becomes the allowlist. A new
    parent or an unexpected account against an existing history is the deviation worth chasing.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|contains:
        - windows\system32\Physmem.sys
        - Windows\system32\ime\SHARED\WimBootConfigurations.ini
        - Windows\system32\ime\IMEJP\WimBootConfigurations.ini
        - Windows\system32\ime\IMETC\WimBootConfigurations.ini
      registry_image:
        Image|contains:
        - windows\system32\filepath2
        - windows\system32\ime
        CommandLine|contains: reg add
      registry_key:
        CommandLine|contains:
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection or all of registry_*) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is their 90-day
    history of this specific pattern, aggregated by host, rather than generic use of the binary. A user who
    has never produced it is a different proposition from one who does so routinely; weigh the count against
    their role, and note that a packaging or servicing account may legitimately touch the IME tree while a
    general user account should not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|contains:
        - windows\system32\Physmem.sys
        - Windows\system32\ime\SHARED\WimBootConfigurations.ini
        - Windows\system32\ime\IMEJP\WimBootConfigurations.ini
        - Windows\system32\ime\IMETC\WimBootConfigurations.ini
      registry_image:
        Image|contains:
        - windows\system32\filepath2
        - windows\system32\ime
        CommandLine|contains: reg add
      registry_key:
        CommandLine|contains:
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32
      _pb_scope:
        User|expand: '%User%'
      condition: (selection or all of registry_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: >-
    Has this parent process historically driven the rule's pattern on this host or across the environment, or
    is the parent new for this activity?
  context: >-
    When the alert fires under SYSTEM or another service principal, the user field attributes nothing and the
    launch mechanism is the meaningful pivot. The query mirrors the rule's selection structure scoped to the
    alerting parent, so the result is the 90-day history of that parent driving this pattern. A parent already
    accounting for a large volume of prior events is vendor or operating-system automation; a parent that is
    new for this pattern is the deviation to pursue.
  range: -90d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|contains:
        - windows\system32\Physmem.sys
        - Windows\system32\ime\SHARED\WimBootConfigurations.ini
        - Windows\system32\ime\IMEJP\WimBootConfigurations.ini
        - Windows\system32\ime\IMETC\WimBootConfigurations.ini
      registry_image:
        Image|contains:
        - windows\system32\filepath2
        - windows\system32\ime
        CommandLine|contains: reg add
      registry_key:
        CommandLine|contains:
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection or all of registry_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this user do across the network around this time?
  context: >-
    Persistence is normally installed after access is already established, so the same account's activity on
    other hosts in the same window shows whether this is one endpoint or several. If the alert fires under a
    service principal, this returns routine agent telemetry and attributes nothing — read the parent-driven
    view instead.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    Under a service principal, asking what else the user did returns agent telemetry from every host. The
    meaningful question is whether the same launch mechanism produced this pattern elsewhere: the query mirrors
    the rule's selection structure scoped to the alerting parent, fleet-wide, in the alert window. Multiple
    hosts point to scheduled or pushed automation; a single host points to a host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|contains:
        - windows\system32\Physmem.sys
        - Windows\system32\ime\SHARED\WimBootConfigurations.ini
        - Windows\system32\ime\IMEJP\WimBootConfigurations.ini
        - Windows\system32\ime\IMETC\WimBootConfigurations.ini
      registry_image:
        Image|contains:
        - windows\system32\filepath2
        - windows\system32\ime
        CommandLine|contains: reg add
      registry_key:
        CommandLine|contains:
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection or all of registry_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: >-
    Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like
    consistent automation or one-off activity?
  context: >-
    The query mirrors the rule's selection structure with no host scope, so the result is a fleet-wide count of
    this pattern rather than generic use of the binary. Many hosts firing the same pattern with the same parent
    points to scripted deployment or vendor automation; one host, or a small unrelated set, points to manual
    operator activity. Use the host distribution and parent consistency to calibrate how far the investigation
    needs to reach.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: process_creation
    detection:
      selection:
        Image|contains:
        - windows\system32\Physmem.sys
        - Windows\system32\ime\SHARED\WimBootConfigurations.ini
        - Windows\system32\ime\IMEJP\WimBootConfigurations.ini
        - Windows\system32\ime\IMETC\WimBootConfigurations.ini
      registry_image:
        Image|contains:
        - windows\system32\filepath2
        - windows\system32\ime
        CommandLine|contains: reg add
      registry_key:
        CommandLine|contains:
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{7c857801-7381-11cf-884d-00aa004b2e24}\inprocserver32
        - HKEY_LOCAL_MACHINE\software\classes\clsid\{cf4cc405-e2c5-4ddd-b3ce-5e7582d8c9fa}\inprocserver32
      condition: selection or all of registry_*
    fields:
    - host.name
  answer_sources:
  - process_creation
