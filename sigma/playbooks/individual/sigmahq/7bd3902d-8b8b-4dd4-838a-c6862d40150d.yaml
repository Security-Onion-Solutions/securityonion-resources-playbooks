name: DNS HybridConnectionManager Service Bus
id: a75967c4-4442-4a1d-bc8a-49f787c4de1e
description: |
  Detects a Hybrid Connection Manager process (Image contains HybridConnectionManager) issuing a DNS
  query for an Azure Service Bus namespace (QueryName contains servicebus.windows.net); both conditions
  must be present for the rule to fire. Hybrid Connection Manager establishes an outbound relay from an
  on-premises host into Azure Service Bus, and while it has legitimate hybrid-connectivity uses, the same
  relay can be stood up to maintain a persistent covert channel and reach internal hosts from outside the
  network, including remote command execution surfaced through wsmprovhost.exe. Determine whether the
  querying process is the genuine signed listener from its expected install path, whether Hybrid Connection
  Manager is approved on this host, whether the relay connection was actually established, and whether the
  process spawned command interpreters.
type: detection
detection_id: 7bd3902d-8b8b-4dd4-838a-c6862d40150d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the queried domain match a Service Bus namespace and is the querying process Hybrid Connection Manager?
  context: Confirm the alert by reviewing the exact queried domain (QueryName ending in servicebus.windows.net)
    together with the querying process (Image containing HybridConnectionManager). The rule requires both
    conditions, so verify each is present and note the full Service Bus namespace and whether the lookup resolved.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - Image
      - QueryName
- question: Is this host expected to run Azure Hybrid Connection Manager and reach the Service Bus relay?
  context: Hybrid Connection Manager is deployed intentionally on hosts that bridge on-premises resources to
    Azure. Knowing whether this host has an approved hybrid-connectivity role is often the fastest way to separate
    a sanctioned installation from an attacker standing up a relay for persistent access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What Service Bus namespace was queried, is it an approved endpoint, and did it resolve?
  context: The alert is a DNS lookup, not a connection. Read the full namespace in QueryName (the label before
    servicebus.windows.net identifies the specific Service Bus relay) and check it against known-approved
    namespaces, registration age, and threat intel. An unfamiliar or attacker-controlled namespace points to a
    relay that was not provisioned by the organization; confirm whether the lookup resolved and to which address.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: Is the process issuing these lookups the legitimate signed Hybrid Connection Manager listener from its expected install path?
  context: The rule matches on the process image name only, which a masqueraded binary can imitate. Confirm the
    full Image path resolves to the expected install location (under Program Files for the Microsoft-installed
    listener) and that the binary carries a valid Microsoft signature; a copy running from a user-writable or
    temporary directory, or an unsigned binary, indicates tampering or masquerade rather than a sanctioned
    installation. Reviewing how and when the process started also shows whether it runs as an installed service.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - ParentImage
      - User
- question: Did the Hybrid Connection Manager process actually establish an outbound connection to the Service Bus relay?
  context: A DNS lookup alone does not confirm a relay was established. Look at outbound connections initiated by
    the same process to see whether it reached Service Bus (relay traffic commonly uses TCP 443, 5671/5672, and
    9350-9354). Anchoring on the process avoids the DNS resolver trap, since the resolved relay address is not
    present on the DNS event itself. Established, sustained outbound sessions indicate the covert channel is live.
  range: +/-24h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
        Initiated: 'true'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
- question: What launched the Hybrid Connection Manager process, and is that parent chain expected for a service?
  context: A legitimate listener runs as an installed service and is launched by services.exe. A Hybrid Connection
    Manager process started from an interactive shell, a script host, or an Office application points to on-demand
    execution rather than a managed installation and reframes the alert toward hands-on-keyboard activity.
  range: -30d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - User
- question: What child processes did the Hybrid Connection Manager process spawn, and did any command interpreters or wsmprovhost.exe appear?
  context: Children of the listener reveal what the relay actually carried. Remote WinRM or PowerShell sessions
    tunneled through the relay surface as wsmprovhost.exe, and command interpreters such as cmd.exe or
    powershell.exe spawned under the listener indicate remote command execution reaching this host through the
    Service Bus channel.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Does this host normally query this Service Bus namespace?
  context: First-time lookups of a Service Bus namespace are more notable than routine ones. A host that has
    queried this namespace regularly over the baseline window is likely running an established hybrid connection;
    zero or very low historical counts point to a newly provisioned relay worth confirming.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|expand: '%dns_query_name%'
      condition: selection
    fields:
      - QueryName
      - Image
- question: When this host has previously fired the rule's pattern, what programs and users normally drive that activity, and does the current alert fit?
  context: The query mirrors the rule's selection scoped to this host, so the resulting program and user distribution
    reflects how this specific Hybrid Connection Manager to Service Bus pattern has historically run here. A
    HybridConnectionManager binary in an unfamiliar path or an unexpected user account driving the lookup is the
    deviation worth chasing; DNS events carry no parent lineage, so pivot to the binary's process-creation event
    if you need to know what launched it.
  range: -14d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        QueryName|contains: servicebus.windows.net
        Image|contains: HybridConnectionManager
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - Image
    - User
- question: Have other hosts fired the rule's pattern in the past week, and does the cross-host distribution look like consistent automation or one-off activity?
  context: The query mirrors the rule's selection with no host scope, giving a fleet-wide count of this Hybrid
    Connection Manager to Service Bus pattern rather than generic binary usage. Many hosts firing the same pattern
    points to a sanctioned hybrid-connectivity rollout; a single host or a small unrelated set points to a
    targeted relay stood up by an operator.
  range: -7d
  query: |
    aggregation: true
    logsource:
      product: windows
      category: dns_query
    detection:
      selection:
        QueryName|contains: servicebus.windows.net
        Image|contains: HybridConnectionManager
      condition: selection
    fields:
    - host.name
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Aggregating the surrounding process activity collapses repetitive
    agent noise into high-count rows while novel parent-child pairs stand out at low counts, revealing
    reconnaissance, privilege escalation, or staging that ran in the same window as the relay lookup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access,
    may reveal the stages that preceded the relay lookup and help reconstruct how the host reached this point.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: Were other process-based persistence mechanisms installed on this host?
  context: Attackers rarely rely on a single persistence mechanism. Alongside a relay foothold, they commonly
    install backup mechanisms using different techniques such as scheduled tasks, services, registry Run keys,
    BITS jobs, or WMI subscriptions. Multiple persistence installations in the same timeframe indicate intentional
    stacking rather than isolated administrative action.
  range: +/-4h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist:
        Image|endswith:
          - '\schtasks.exe'
          - '\at.exe'
          - '\sc.exe'
          - '\reg.exe'
          - '\bitsadmin.exe'
          - '\wmic.exe'
      condition: selection and selection_persist
    fields:
      - Image
      - CommandLine
- question: Were files dropped to persistence locations (Startup folders, scheduled-task definitions) on this host?
  context: File-based persistence bypasses command-line detection entirely. Dropping an executable or script into
    the Startup folder or a path referenced by a registry Run key achieves persistence without running schtasks,
    sc, or reg. File event monitoring captures these drops even when standard persistence tools are avoided.
  range: +/-4h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      selection_persist_paths:
        TargetFilename|contains:
          - '\Start Menu\Programs\Startup\'
          - '\Windows\System32\Tasks\'
          - '\Windows\Tasks\'
      condition: selection and selection_persist_paths
    fields:
      - TargetFilename
      - Image
- question: Was there a change ticket, maintenance window, or documented approval for deploying this hybrid connection?
  context: Many organizations require change tickets for connectivity and persistence changes. A corresponding
    ticket for provisioning Hybrid Connection Manager and its Service Bus namespace suggests authorized activity;
    absence of one when policy requires it suggests the relay was set up outside sanctioned processes.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: Is standing up a Service Bus relay on this host consistent with how the organization normally provisions hybrid connectivity?
  context: Organizations that use hybrid connectivity typically provision it through a defined process and on
    designated hosts. A Hybrid Connection Manager relay appearing on a host outside that process, or a namespace
    not tied to a known project, may indicate an attacker bypassing normal tooling rather than a sanctioned
    deployment.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
