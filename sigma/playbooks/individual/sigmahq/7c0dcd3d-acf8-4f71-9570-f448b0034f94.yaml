name: PsExec Service Child Process Execution as LOCAL SYSTEM
id: 0cb1ccf0-c456-42b4-a713-2da4afd0a43e
description: |
  Detects a process spawned by the PsExec service binary (PSEXESVC.exe running
  from C:\Windows) where the running account resolves to the LocalSystem
  principal (the User value contains the localized "NT AUTHORITY" / "AUTORITA"
  prefix). This is the artifact of a remote operator running a command on this
  host as SYSTEM via PsExec's -s flag, which executes with the highest local
  privileges rather than the privileges of the connecting account. PsExec is a
  signed Microsoft Sysinternals tool used routinely by administrators for remote
  management, but the same -s SYSTEM shell is a standard step in hands-on-keyboard
  lateral movement and ransomware deployment. The investigation should determine
  what command the service ran, which host and account initiated the remote
  session, whether the service binary or name was renamed to evade detection, and
  whether the activity is isolated administration or part of multi-host movement.
type: detection
detection_id: 7c0dcd3d-acf8-4f71-9570-f448b0034f94
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-06-05
questions:
- question: Was this child process spawned by PSEXESVC.exe and running as the LocalSystem account?
  context: Before investing investigation time, confirm the alert is a true positive. The rule fires only when both conditions hold together. The parent process must be C:\Windows\PSEXESVC.exe and the running User must resolve to the LocalSystem principal (the value contains the "NT AUTHORITY" / localized "AUTORI" prefix). Confirm both the parent path and the SYSTEM account on the triggering event, since that pairing is what indicates a remote command was run with the -s SYSTEM flag rather than under the connecting user's own privileges.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - User
- question: Is this host expected to receive remote PsExec execution running commands as SYSTEM?
  context: Legitimate administrative activity can trigger this detection. Remote management tooling, software-deployment workflows, and IT troubleshooting do sometimes run PsExec with the -s flag, which is normal on servers and managed endpoints administered over SMB but unusual on ordinary user workstations. Knowing whether this host is a routine target of remote PsExec administration is often the fastest path to disposition.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What command did the PsExec service run as SYSTEM? Decode the full command line of the spawned process.
  context: The spawned child is the operator's actual payload, executing with the highest local privileges. Decode the full command line including any flags, encoded content, file paths, or URLs. A SYSTEM-context cmd.exe or powershell.exe shell, a download cradle, a credential-dumping tool, or a binary launched from a user-writable or temporary directory each point to different objectives. Single-step administration (a specific maintenance command) reads very differently from an interactive shell or loader.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - CurrentDirectory
- question: Where was the PsExec service binary running from, and was it installed under the default PSEXESVC name?
  context: The service binary is normally dropped to C:\Windows\PSEXESVC.exe and registered as a service named PSEXESVC, but operators frequently rename both the binary (-c with a custom name) and the service (-r) to evade signatures keyed on "PSEXESVC". Retrieve the parent's own process event to confirm the on-disk path and how the service itself was launched. A PsExec-equivalent service binary running from a non-default path, or a renamed service entry, indicates deliberate evasion rather than stock administrative use.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
- question: Which host initiated the remote SMB session that delivered this PsExec service, and is it an expected administrative source?
  context: PsExec installs and starts its service over SMB to the ADMIN$ share, so an inbound connection to this host on SMB and RPC ports immediately precedes the SYSTEM execution. Identifying the originating address reveals whether the session came from a known admin jump box, a compromised workstation being used as a pivot, or an unexpected source. An unfamiliar internal source connecting on SMB right before the service starts is the lateral-movement pattern.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationPort:
          - 445
          - 135
      condition: selection
    fields:
      - SourceIp
      - DestinationPort
- question: What account authenticated the remote session, and was it a network logon consistent with PsExec?
  context: PsExec authenticates to the target over SMB and runs the remote process as SYSTEM (-s), so the account that connected is distinct from the SYSTEM principal the child runs under. The connecting credentials reveal how access was obtained -- a legitimate admin account, or one acquired through dumping, phishing, or prior compromise. PsExec produces a network logon (type 3) on the target; correlating that logon's account and source against expected administrators distinguishes routine management from credential abuse.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - User
      - CommandLine
- question: What other processes did this PsExec service spawn on the host?
  context: A single remote session often runs several commands in sequence -- reconnaissance, credential access, tool staging, then impact. Listing every child of PSEXESVC.exe on this host reveals the full scope of what was executed through the remote SYSTEM session rather than just the one process that tripped the alert. Several distinct tools spawned under the service in a short window points to hands-on-keyboard activity, not a single maintenance command.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: Has this user previously produced the rule's pattern, and does that history fit their role?
  context: The query mirrors the rule's selection structure scoped to this user — the result is the user's
    90-day history of the rule's specific firing pattern (not generic use of the binary), aggregated by
    host. A user who has never produced this pattern is more suspicious than one who does so regularly;
    weigh the count against the user's role and typical toolset.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\PSEXESVC.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has this parent process historically driven the rule's pattern on this host or across the
    environment, or is the parent new for this activity?
  context: 'When the alert fires under a service principal, user identity does not attribute behavior.
    The meaningful pivot is the launch mechanism: the query mirrors the rule''s selection structure scoped
    to the alerting parent process, so the result is the 90-day history of this parent driving this specific
    pattern (not generic parent+binary co-occurrence). A new or rare parent for this pattern is the deviation
    worth chasing; a parent that already accounts for thousands of prior events is vendor or OS automation.'
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\PSEXESVC.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: What else did the connecting account do across the network around this time?
  context: Tracking the account's activity across all hosts reveals lateral movement or staging across multiple endpoints. If the same account drove remote execution or ran other tooling on several hosts in the same window, the scope of compromise may be larger than this single endpoint.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
- question: Did this same parent-driven pattern fire on other hosts in the same window — i.e., is this
    a coordinated automation rollout, or is the activity isolated to this host?
  context: 'Under a service principal, "what else did this user do across the network" returns agent-telemetry
    noise (every host runs SYSTEM-owned agents constantly). The meaningful question is whether the same
    launch mechanism fired elsewhere: the query mirrors the rule''s selection structure scoped to the
    alerting parent process, fleet-wide, in the alert window. Multiple hosts in the same window points
    to scheduled or pushed automation; a single host points to a host-local trigger.'
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage: C:\Windows\PSEXESVC.exe
        User|contains:
        - AUTHORI
        - AUTORI
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
- question: Has the PsExec service run on this host before, or is this the first time?
  context: A host that has never seen PSEXESVC.exe is more suspicious than one where remote PsExec administration is routine. Zero or very low historical counts on this host indicate first-time remote SYSTEM execution, which raises the priority of identifying who connected and why. A host with regular PsExec history is more likely a managed system administered over SMB.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - CommandLine
- question: Is PsExec service execution as SYSTEM occurring on other hosts in the environment?
  context: The same PsExec service running as SYSTEM across multiple hosts in a short window may indicate an operator moving laterally or pushing tooling fleet-wide rather than performing targeted, one-off administration. A single occurrence is more likely routine management. Comparing across hosts helps calibrate severity and identify the spread of the activity.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        User|contains:
          - AUTHORI
          - AUTORI
      condition: selection
    fields:
      - host.name
      - Image
- question: What activity ran on this host under the SYSTEM account after the remote session was established?
  context: Remote SYSTEM execution is a means to an end -- operators land to run commands, deploy tools, or access data. Examining what executed on the host under the SYSTEM principal in the window after the alert reveals the objectives pursued through the remote session, including processes that may have been launched by the child rather than directly by the service.
  range: +30m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        User|contains:
          - AUTHORI
          - AUTORI
      condition: selection
    fields:
      - User
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: 'Alerts rarely occur in isolation. Examining activity around the alert reveals the immediate context: what led to this event, what happened after, and whether it is part of a larger sequence. Look for reconnaissance, credential access, or persistence mechanisms surrounding the remote SYSTEM execution.'
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Alerts rarely happen in isolation. Earlier detections on the same host -- defense tampering, reconnaissance, credential access -- may reveal the attack stages that preceded the remote SYSTEM execution and help reconstruct the full timeline. Lateral movement and privileged execution typically follow an initial foothold elsewhere in the environment.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
