name: Potential CVE-2026-33829 Exploitation - Windows Snipping Tool Remote File Path URI
id: e70c1c8e-a97e-4909-a4e0-5a6c82721676
description: |
  Detects SnippingTool.exe running with a command line that carries an ms-screensketch:edit URI whose filePath
  parameter points at a remote resource — either a UNC path (written with literal backslashes or percent-encoded
  as %5C) or an http URL. This is the observable surface of CVE-2026-33829: the URI handler accepts a
  caller-supplied remote path, so a link delivered by mail, chat, or a web page can make the host reach out to a
  destination the user never chose. A UNC destination causes the host to attempt outbound NTLM authentication,
  exposing the running account's Net-NTLMv2 hash to whoever controls that destination; an http destination causes
  a fetch of a remote resource. The rule matches the URI pattern only — it does not observe whether the
  connection succeeded or what was returned. The investigation must recover the destination from the command
  line, determine whether the host actually contacted it, establish how the URI reached the user, and assess
  which account's credentials were exposed.
type: detection
detection_id: 7c3a5b1d-9e2f-4a8c-b5d7-1e0f3c6a9b2d
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: >-
    Does the command line contain an ms-screensketch:edit URI whose filePath points at either a UNC path or an
    http URL?
  context: >-
    Confirm the alert before investing further time. The rule matches SnippingTool.exe launched with
    filePath set to a remote target, written either as backslashes (literal or percent-encoded as %5C) or as an
    http URL. A filePath referencing a local file on a fixed drive is not what this rule matches; read the raw
    command line and note which form is present, because a UNC target and an http target expose different things.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - alert
  - process_creation
- question: Is this user and host expected to open Snipping Tool through a URI handler that references a remote path?
  context: >-
    Snipping Tool is normally launched by a keyboard shortcut or from the Start menu, and its filePath argument
    normally points at a local screenshot. A URI-driven launch pointing at a remote host is not a pattern users
    produce on their own. Knowing whether this user was clicking links in mail, chat, or a browser at the time
    is often the fastest way to separate a delivered lure from a test or a tooling artifact.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: What destination does the filePath parameter resolve to, and what would the host hand over on reaching it?
  context: >-
    Decode the filePath value to recover the destination — percent-encoded sequences are common, and %5C decodes
    to a backslash, so a value beginning with %5C%5C is a UNC path. A UNC destination makes the host attempt NTLM
    authentication to that server, which exposes the Net-NTLMv2 hash of the account running the process to
    whoever operates it; the hash can be relayed to another service or cracked offline. An http destination
    instead causes a remote fetch, which can reach an internal endpoint the user could not otherwise address.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - file_event
- question: What process spawned Snipping Tool, and does that parent identify how the URI was delivered?
  context: >-
    A URI handler is invoked by whatever rendered the link, so the parent names the delivery channel — a browser,
    a mail client, a chat application, or an Office application all invoke handlers on the user's behalf. The
    parent chain also tells the analyst where to go looking for the original message or page that carried the
    link, and whether other recipients received the same one.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Did this host initiate an outbound SMB connection around the time of the alert, and was the destination a sanctioned file server?
  context: >-
    The credential exposure only occurs if the host actually reached the UNC destination, so this is the question
    that separates an attempted lure from a completed one. Outbound SMB on 139 or 445 to a destination outside
    the environment's known file servers is the forced-authentication attempt itself; compare each destination
    against the sanctioned file-server and WebDAV-gateway list for this environment, and treat workstation-to-
    workstation or workstation-to-internet SMB as abnormal. The window is set to 30 minutes because the
    authentication follows the URI handling almost immediately. The connection is often attributed to the SMB
    redirector rather than to Snipping Tool, so the query is host-scoped rather than process-scoped. An http
    filePath produces a WebDAV request over 80 or 443 instead, which port alone cannot separate from routine web
    traffic — for that form, pivot on the destination recovered from the command line. If network connection
    telemetry is not collected from this host, treat zero rows as a visibility gap rather than as evidence that
    nothing was contacted.
  range: +/-30m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 139
          - 445
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
  - organizational_knowledge
- question: Was a link or document file that could carry the URI written to a user-exposed folder on this host before the alert?
  context: >-
    Forced-authentication lures are usually delivered as a file the user opens or that the shell renders on its
    own — .lnk, .url, .scf, saved web pages, and Office documents are the common carriers, and they land in
    Desktop, Downloads, Public, Temp, or Start Menu and Startup folders. A file written shortly before the alert
    identifies the delivery vehicle and the process that dropped it, which points at the mail client, browser, or
    archive tool the message arrived through. Adjust the folder list to this environment's profile layout if it
    differs from the defaults.
  range: -24h
  query: |
    aggregation: false
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetFilename|endswith:
          - .lnk
          - .url
          - .scf
          - .html
          - .htm
          - .doc
          - .docx
          - .xls
          - .xlsx
          - .ppt
          - .pptx
          - .pdf
      folders:
        TargetFilename|contains:
          - \Desktop\
          - \Downloads\
          - \Public\
          - \Temp\
          - \Start Menu\
          - \Startup\
      condition: selection and folders
    fields:
      - TargetFilename
      - Image
      - User
  answer_sources:
  - file_event
  - manual_review
- question: What child processes did Snipping Tool spawn after the URI was handled?
  context: >-
    Snipping Tool has no routine reason to spawn children. A command interpreter, script host, or download
    utility appearing under it in the minutes after the URI was processed points at execution beyond the file
    reference the rule matched, and changes the investigation from credential exposure to code execution on the
    host.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith|expand: '%Image%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: Were outbound remote-access connections (RDP, SMB, WinRM, SSH) initiated from this host after this event?
  context: >-
    A captured Net-NTLMv2 hash is typically relayed or cracked and then reused, so movement often follows the
    exposure. The query returns outbound connections from this host to remote-access ports -- 3389 (RDP), 445
    (SMB/PsExec), 5985/5986 (WinRM), 22 (SSH) -- in the hours after the event; the originating Image and User
    show what drove each connection. Two limits to keep in mind -- a hash relayed from the attacker's own machine
    will not appear here, so check 4624 logons on suspected targets for this account and for any accounts with
    sessions on this host, and the query depends on network connection telemetry from this host; if that is not
    collected, treat zero rows as a visibility gap, not as evidence no movement occurred.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Initiated: 'true'
        DestinationPort:
          - 3389
          - 445
          - 5985
          - 5986
          - 22
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Image
      - User
  answer_sources:
  - network_connection
- question: Which account's credentials were exposed, and does that account have elevated privileges?
  context: >-
    The account exposed is the one Snipping Tool ran as — the interactive user, not a service identity. What that
    exposure costs depends on the account: a domain administrator or an account with broad service access
    warrants escalation and a password reset, while a standard user account with no privileged group membership
    may only need monitoring. Cross-reference the user against directory group memberships before deciding.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - active_directory
  - organizational_knowledge
- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Aggregating process activity around the alert collapses routine telemetry
    into high-count rows and leaves novel parent-child pairs standing out at low counts. Look for what led to the
    URI being opened and for reconnaissance, credential access, or persistence following it.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
  - file_event
  - registry_event
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host help place this event in a sequence. Phishing and link delivery often
    generate their own detections upstream, and credential access is frequently followed by lateral movement, so
    the alert timeline around this event tells the analyst whether this is the first observable step or a later
    one.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
- question: Does this host normally run Snipping Tool, and which users drive that usage?
  context: >-
    Snipping Tool is present on every modern Windows install, so a nonzero count here is expected and is not by
    itself informative. The value is in the user distribution: an account that has never run it before, or a
    count that is zero on a host where nobody takes screenshots, tells the analyst the launch was driven by
    something other than the user's normal habits.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: >-
    When this host has previously produced this URI pattern, what parents and users drove it, and does the
    current alert fit that history?
  context: >-
    The query mirrors the rule's selection structure scoped to this host, so the resulting parent and user
    distribution reflects how this specific URI pattern — not general Snipping Tool usage — has run here before.
    Any prior history at all is worth reading closely, since the pattern is not one normal usage produces; a new
    parent process or an unexpected user account against an otherwise empty history is the deviation to chase.
  range: -14d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SnippingTool.exe
        CommandLine|contains:
        - ms-screensketch:edit?&filePath=\\\\
        - ms-screensketch:edit?&filePath=%%5C
        - ms-screensketch:edit?&filePath=%5C
        - ms-screensketch:edit?&filePath=http
      _pb_scope:
        host.name|expand: '%hostname%'
      condition: (selection) and _pb_scope
    fields:
    - ParentImage
    - User
  answer_sources:
  - process_creation
- question: Has this user previously produced this URI pattern, and does that history fit their role?
  context: >-
    The query mirrors the rule's selection structure scoped to this user, so the result is the user's 90-day
    history of this specific pattern across hosts rather than their general use of the binary. A user with no
    prior history is the common case and is consistent with a delivered link; repeated prior occurrences point
    instead at a tool or workflow in this environment that emits the URI, which is worth identifying before
    treating the alert as delivery.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SnippingTool.exe
        CommandLine|contains:
        - ms-screensketch:edit?&filePath=\\\\
        - ms-screensketch:edit?&filePath=%%5C
        - ms-screensketch:edit?&filePath=%5C
        - ms-screensketch:edit?&filePath=http
      _pb_scope:
        User|expand: '%User%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
  - organizational_knowledge
- question: Has this parent process historically driven this URI pattern here or across the environment, or is the parent new for this activity?
  context: >-
    User identity does not attribute behavior when the alert fires under a service principal, and for a
    URI-handler launch the launch mechanism is the more informative pivot regardless. The query mirrors the
    rule's selection structure scoped to the alerting parent, giving the 90-day history of that parent driving
    this pattern. A parent that already accounts for many prior events is automation worth identifying; a parent
    seen for the first time is the deviation.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SnippingTool.exe
        CommandLine|contains:
        - ms-screensketch:edit?&filePath=\\\\
        - ms-screensketch:edit?&filePath=%%5C
        - ms-screensketch:edit?&filePath=%5C
        - ms-screensketch:edit?&filePath=http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts in the alert window shows whether the exposure was isolated or
    whether the same account was active elsewhere at the same time. If the account's hash was captured and
    replayed, later activity under that account on other hosts is what the analyst is looking for.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  always_include: true
  answer_sources:
  - process_creation
- question: Did the same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to this host?
  context: >-
    Under a service principal the user pivot returns agent telemetry rather than an answer, so the useful
    question is whether the same launch mechanism fired elsewhere. The query mirrors the rule's selection
    structure scoped to the alerting parent, fleet-wide, in the alert window. Several hosts in the same window
    points at a link delivered to multiple recipients or at pushed automation; a single host points at a
    host-local trigger.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SnippingTool.exe
        CommandLine|contains:
        - ms-screensketch:edit?&filePath=\\\\
        - ms-screensketch:edit?&filePath=%%5C
        - ms-screensketch:edit?&filePath=%5C
        - ms-screensketch:edit?&filePath=http
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection) and _pb_scope
    fields:
    - host.name
  always_include: true
  answer_sources:
  - process_creation
- question: Have other hosts produced this URI pattern in the past week, and how is it distributed across them?
  context: >-
    The query mirrors the rule's selection structure with no host scope, giving a fleet-wide count of this
    specific pattern rather than general Snipping Tool usage. Multiple hosts firing in a short span is consistent
    with a link sent to a distribution list, and identifies the other accounts whose hashes may also have been
    exposed; a single host points at a targeted or opportunistic delivery. Use the host distribution to size the
    response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        Image|endswith: \SnippingTool.exe
        CommandLine|contains:
        - ms-screensketch:edit?&filePath=\\\\
        - ms-screensketch:edit?&filePath=%%5C
        - ms-screensketch:edit?&filePath=%5C
        - ms-screensketch:edit?&filePath=http
      condition: selection
    fields:
    - host.name
  answer_sources:
  - process_creation
