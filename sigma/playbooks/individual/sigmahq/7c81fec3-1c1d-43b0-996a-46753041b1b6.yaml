name: UAC Bypass via Event Viewer
id: b9d50517-1f5d-43e3-ad75-90c655bee901
description: |
  Fires when a registry value is written to a key path ending in \mscfile\shell\open\command. Auto-elevating, Microsoft-signed eventvwr.exe queries HKCU\Software\Classes\mscfile\shell\open\command before falling through to the machine-wide HKCR entry when it launches the Event Viewer snap-in; a medium-integrity user who plants a command in that HKCU default value has it inherited and run by the high-integrity eventvwr.exe in place of mmc.exe, yielding elevated code execution with no file dropped to disk and no process injection. On a clean system this key does not exist, so any write to it is unusual. Determine what command string was planted, whether eventvwr.exe subsequently spawned a child other than mmc.exe, and what that elevated child did.
type: detection
detection_id: 7c81fec3-1c1d-43b0-996a-46753041b1b6
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the registry key path and value data match what this rule detects?
  context: Confirm the alert is a true positive by reviewing the exact key path (TargetObject), which should end in \mscfile\shell\open\command, along with the value data and the writing process. On a clean system this HKCU class key does not exist, so a write to it is the core of what the rule flags.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: Is this user and host expected to modify shell-open-command class keys under HKCU?
  context: Legitimate software installers and file-association changes can touch class keys, but the mscfile shell-open-command default value is rarely a benign target. Knowing whether the user role and host function are consistent with this change is often the fastest way to separate a genuine bypass attempt from routine activity. User attribution is present on roughly 94 percent of endpoint registry events; when it is a machine account or missing, pivot on the writing process instead.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - User
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What specific registry key and value were modified, and is this a known evasion location?
  context: The mscfile\shell\open\command class key is a known user-account-control bypass location. HKEY_CLASSES_ROOT is a merged view of the machine-wide and per-user class hives, so a value planted under HKCU\Software\Classes\<class>\shell\open\command overrides the machine default for any process that reads it under the user's context. The value name and data written determine exactly what executes at high integrity.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
      - Image
      - process.code_signature.subject_name
      - process.code_signature.trusted
- question: What command string was written to the mscfile shell-open-command default value?
  context: The Details field holds the command that the auto-elevated Event Viewer process will run in place of mmc.exe. A value such as powershell.exe, cmd.exe, wscript.exe, or any path outside the expected mmc.exe invocation is the planted payload. Decode any flags, encoded content, file paths, or URLs in the value. Details is present on roughly 79 percent of registry modifications and is absent for binary or empty value data, so an empty Details does not by itself clear the key.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Does the planted value persist, and did the configured command run?
  context: Bypass tooling commonly writes the class key, launches Event Viewer, and then deletes the key to clean up. Key and value deletions are not observable on this telemetry, so judge persistence from the key's re-modification history over a longer window and from whether the configured command actually executed at high integrity. A value that was set, used, and never re-touched is consistent with a one-shot bypass rather than durable persistence.
  range: +15m
  query: |
    aggregation: false
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - TargetObject
      - Details
- question: Were other registry modifications made on this host in the same session?
  context: A user-account-control bypass is often one step in a sequence. Attackers who plant the mscfile key frequently follow with autorun entries, security-tool tampering, or proxy and Internet-settings changes in the same window. Clusters of registry changes from the same writing process reveal the full scope of what was reconfigured and whether multiple objectives were pursued. The time_correlation dimension favors a tight window between the class-key write and any elevated follow-on.
  range: +/-30m
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - TargetObject
      - Image
      - User
- question: Has the mscfile shell-open-command key been modified before on this host?
  context: This class key should effectively never change on a normal system, so a first-time modification is more significant than a routine one. Zero history indicates a key that has never been touched here, which fits a targeted bypass; a recurring history from a known installer would point toward benign software behavior instead.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - Details
      - Image
- question: Was this registry key modified on other hosts in the environment?
  context: The same class-key modification across multiple hosts may indicate widespread tooling or a scripted rollout rather than a single targeted bypass. If only this host carries the change, it is more likely to be operator-driven activity here. Compare the value data across hosts to see whether the same command was planted everywhere or each host differs.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: registry_set
      product: windows
    detection:
      selection:
        TargetObject|expand: '%TargetObject%'
      condition: selection
    fields:
      - host.name
      - Image
      - Details
- question: What process wrote this registry value, and is that parent chain expected?
  context: The writing process and its parent reveal how the key was planted. A medium-integrity user writes the value, so common origins include reg.exe, powershell.exe, cmd.exe, or a script host launched from an interactive shell. An unusual parent such as a scripting engine or an Office application spawning the writer points toward automated or malicious setup. The parent-child lineage is a defined dimension for this technique because auto-elevation paths without a standard parent are what the analytic flags.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally run the process that wrote this value?
  context: A writing process that has never been seen on this host is more notable than one that runs regularly. Zero or very low historical counts for the writer indicate first-time or rare execution, which raises the significance of it touching a bypass-relevant class key.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: Did eventvwr.exe spawn a child process other than mmc.exe on this host?
  context: A legitimate Event Viewer launch spawns only mmc.exe to load eventvwr.msc. A child such as powershell.exe, cmd.exe, wscript.exe, or any other executable indicates the planted class-key value was inherited and run by the auto-elevated Event Viewer process at high integrity. This is the execution payoff of the registry write the alert flagged, and the auto-elevated binaries associated with this bypass family include eventvwr.exe, sdclt.exe, and computerdefaults.exe.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentImage|endswith: '\eventvwr.exe'
      filter_mmc:
        Image|endswith: '\mmc.exe'
      condition: selection and not filter_mmc
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
      - User
- question: Did the command configured in the key execute after the write?
  context: For this bypass, the payoff is the command planted in the class key running at high integrity when Event Viewer launches. The query matches process starts whose command line carries the value data written to the class key. If the configured command ran, the bypass took effect and the elevated payload is active; a zero means the setup may have been aborted or blocked, or eventvwr.exe has not yet launched to trigger it.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        CommandLine|contains|expand: '%Details%'
      condition: selection
    fields:
      - Image
      - CommandLine
- question: What action was performed with elevated privileges after the bypass?
  context: A user-account-control bypass is a means to an end. Examining processes running at high or system integrity shortly after the class-key write reveals the objective, whether that is installing persistence, dumping credentials, tampering with security tools, or reaching protected resources. The time between the registry write and the elevated spawn is the correlation window this technique's analytic tunes on.
  range: +30m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        IntegrityLevel:
          - 'High'
          - 'System'
          - 'S-1-16-16384'
          - 'S-1-16-12288'
      condition: selection
    fields:
      - Image
      - CommandLine
      - IntegrityLevel
- question: Were command-line registry writes made to set up this bypass?
  context: The class-key value is often planted from the command line. Look backward for reg.exe, powershell.exe, or cmd.exe invocations referencing mscfile, shell\open\command, or related class-key paths. Finding the setup command confirms the bypass mechanism and shows the exact payload configured to run with elevated privileges. Related auto-elevate variants plant equivalent values under ms-settings and Folder class keys, so a broader match helps catch tooling that tries multiple methods.
  range: -15m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith:
          - '\reg.exe'
          - '\powershell.exe'
          - '\cmd.exe'
        CommandLine|contains:
          - 'ms-settings'
          - 'mscfile'
          - 'Classes\exefile'
          - 'Classes\Folder'
          - 'Environment'
          - 'Shell\Open\command'
          - 'DelegateExecute'
      condition: selection
    fields:
      - CommandLine
      - Image
- question: Were other privilege escalation techniques attempted on this host?
  context: Operators who try one user-account-control bypass often attempt several methods until one succeeds, especially when the operating system version or configuration blocks a particular technique. Other bypass or privilege-escalation detections on the same host, in rapid succession or interleaved with defense-tampering and credential-access alerts, point to deliberate escalation rather than an isolated false positive.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - rule.name
      - rule.uuid
      - event.severity_label
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining the process activity surrounding this event reveals what led to it, what followed, and whether it is part of a larger sequence. Aggregating by process and parent collapses routine agent telemetry into high-count rows while novel parent-child pairs stand out at low counts, which is what the analyst is scanning for.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host, such as defense tampering, reconnaissance, or credential access, may reveal the stages that preceded this event and help reconstruct the timeline. The sequence of alerts on the host often tells the fuller story of how the activity reached the elevation step.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
