name: Mint Sandstorm - Log4J Wstomcat Process Execution
id: 85bd63d3-987a-46a1-b786-7ff04315a5dc
description: |
  Detects a child process spawned by the Tomcat service wrapper ws_tomcatservice.exe, with repadmin.exe excluded as a
  known administrative child. A Java application server normally spawns few or no children, so a Tomcat service that
  launches a command interpreter, script host, or discovery utility is the process-level signature of server-side
  exploitation — a Log4j JNDI injection or similar deserialization path executes its payload as a child of the service,
  running under the application's service account. The investigation should determine what the spawned process was asked
  to do, whether the Tomcat installation on this host has a configured reason to launch it, and whether the same service
  process drove further children, network retrievals, or file writes in the same window.
type: detection
detection_id: 7c97c625-0350-4f0a-8943-f6cadc88125e
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-17
questions:
- question: Does the alerting event match what this rule detects — a process whose parent is ws_tomcatservice.exe and which
    is not repadmin.exe?
  context: >-
    Confirm the ParentImage on the alerting event ends in \ws_tomcatservice.exe and that the child is not repadmin.exe,
    which the rule excludes. The rule fires on the parent-child relationship alone and requires no command-line pattern,
    so the identity of the child binary and the arguments it was given are the first things to read.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
  answer_sources:
  - alert
  - process_creation
- question: Is this host expected to run a Tomcat service that launches child processes, and is the account behind this
    execution consistent with that role?
  context: >-
    Application servers run under dedicated service accounts, and any child-process behavior they show is normally driven
    by the application's own configuration — an installer helper, a scheduled maintenance script, or a vendor integration.
    If the host is a known application server and the child matches a documented integration, the finding is routine; if
    the Tomcat installation has no configured reason to launch this binary, this is unexplained execution under the
    service account.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
  answer_sources:
  - asset_inventory
  - organizational_knowledge
- question: Is this child process launch under the Tomcat service part of an authorized penetration test or vulnerability
    assessment?
  context: >-
    Application-server exploitation is a standard component of authorized testing, and scanners that check for Log4j
    injection commonly prove the finding by making the server spawn a command interpreter. Check whether a test is active
    against this host or network segment and whether its scope and timing match the alert before investing further
    analysis.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - organizational_knowledge
- question: What specific capability did the process spawned by the Tomcat service invoke?
  context: >-
    Read the full command line on the alerting event and identify what the child was actually asked to do: account and
    host enumeration (whoami, net user, systeminfo), retrieval and execution of remote content (DownloadString,
    FromBase64String, certutil, bitsadmin), or an interactive follow-on. The child binary's identity alone does not
    establish scope; the arguments do, and they separate a configuration helper from post-exploitation discovery.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
  - manual_review
- question: What files did the spawned process write to disk in the hour after it started?
  context: >-
    Post-exploitation stages routinely place content on disk before or while running it: the output of a discovery
    script, a downloaded implant, or an archive of collected data. Files written by the spawned process identify what was
    staged and where, and give the next pivot even if the process itself has already exited.
  range: +1h
  query: |
    aggregation: false
    logsource:
      category: file_activity
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
      - Image
      - EventType
  answer_sources:
  - file_event
  - process_creation
  - manual_review
- question: What else did this binary execute on this host in the minutes around the alert?
  context: >-
    Server-side exploitation usually drives several sequential commands through the same spawned interpreter rather than
    one self-contained invocation. Scoping to every execution of this binary on the host in the surrounding ten minutes
    shows the whole operation instead of the single event that fired, and CurrentDirectory shows whether execution ran
    from the application's own directory tree or from a location the service has no reason to use.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
  answer_sources:
  - process_creation
  - manual_review
- question: What is the Tomcat service process itself, and what started it?
  context: >-
    This retrieves the parent's own creation event: the full path and command line of the ws_tomcatservice.exe instance
    and what launched it. The path identifies which application installation is running the service and confirms the
    parent is the vendor's service wrapper in its expected install location rather than a same-named binary elsewhere.
    Service processes commonly start days before an alert, so the lookup window is deliberately wide.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ParentProcessGuid%'
      condition: selection
    fields:
      - Image
      - CommandLine
      - ParentImage
  answer_sources:
  - process_creation
- question: What other child processes did the Tomcat service spawn on this host after the alert?
  context: >-
    Exploitation of a web application typically produces a sequence of children through the same service process —
    reconnaissance, then retrieval of tooling, then persistence or credential access — rather than a single process.
    Reviewing every child the service launched over the following four hours shows how far the activity progressed and
    whether the alerting process was the first of several or an isolated one.
  range: +4h
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
      condition: selection
    fields:
      - Image
      - CommandLine
  answer_sources:
  - process_creation
- question: What network connections did the Tomcat service process make around the time of the alert?
  context: >-
    A Java application server exploited through a JNDI lookup or a similar deserialization path retrieves its payload
    over the network before the child process appears — an outbound LDAP, RMI, or HTTP fetch made by the service process
    itself, to a destination it does not otherwise contact. Outbound connections from the service in the window around
    the alert separate an externally driven payload retrieval from a locally configured helper.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%ParentImage%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationPort
      - Initiated
  answer_sources:
  - network_connection
- question: How often has the Tomcat service spawned this child binary on this host over the last 90 days?
  context: >-
    Application servers that legitimately launch helpers do so repeatedly and predictably — an install-time helper, a
    scheduled maintenance job, or a vendor integration accumulates a substantial history. A count of zero or a handful
    means this parent-child pairing is new on the host, which is the deviation to chase regardless of which child binary
    it is.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
  answer_sources:
  - process_creation
- question: Has this child binary run on this host before, and under which accounts?
  context: >-
    A binary that runs regularly on the host under interactive or administrative accounts is part of the environment; the
    same binary appearing for the first time, or appearing for the first time under the application's service account,
    narrows the question to how it was invoked. Grouping the 90-day history by account separates routine administrative
    use from execution driven through the service.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
  answer_sources:
  - process_creation
- question: Has this account previously produced the rule's pattern, and does that history fit its role?
  context: >-
    The query mirrors the rule's selection scoped to the alerting account, so the result is that account's 90-day history
    of the Tomcat service spawning a non-repadmin child, aggregated by host — not generic use of the binary. An account
    with no prior history for this pattern is the deviation; weigh any existing count against whether the account is the
    application's service principal or a human operator.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_tomcatservice.exe
      filter_main_repadmin:
        Image|endswith: \repadmin.exe
      _pb_scope:
        User|expand: '%User%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  - organizational_knowledge
  always_include: true
- question: Has this Tomcat service parent historically driven the rule's pattern on this host or across the environment,
    or is the parent new for this activity?
  context: >-
    An application server runs under a service account, so user identity attributes little and the meaningful pivot is
    the launch mechanism. The query mirrors the rule's selection scoped to the alerting parent process, giving the
    90-day history of this service driving this specific pattern, aggregated by host. A parent that already accounts for
    thousands of prior events is application or vendor automation; a parent that is new for this pattern is not.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_tomcatservice.exe
      filter_main_repadmin:
        Image|endswith: \repadmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What else did this account do across the environment around the time of the alert?
  context: >-
    If the account is a human operator, its activity on other hosts in the same hour shows whether this was one step in a
    wider administrative session or an isolated event. When the alert fires under the application's service account, a
    machine account, or SYSTEM, this view returns routine service and agent telemetry from every host and answers little
    — in that case the parent-driven cross-host view is the one that carries information.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
  answer_sources:
  - process_creation
  always_include: true
- question: Did this same parent-driven pattern fire on other hosts in the same window, or is the activity isolated to
    this host?
  context: >-
    The query mirrors the rule's selection scoped to the alerting parent process, fleet-wide, in the window around the
    alert. Several application servers producing the same parent-child pattern within the hour points either to pushed
    automation or to one vulnerability being exercised against every host running the application at once; a single host
    points to a host-local trigger and keeps the investigation on this server.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentImage|endswith: \ws_tomcatservice.exe
      filter_main_repadmin:
        Image|endswith: \repadmin.exe
      _pb_scope:
        ParentName|expand: '%ParentName%'
      condition: (selection and not 1 of filter_main_*) and _pb_scope
    fields:
    - host.name
  answer_sources:
  - process_creation
  always_include: true
- question: What other process activity occurred on this host around the time of the alert?
  context: >-
    Aggregating every process creation on the host by binary and parent in the surrounding window collapses routine
    service and agent telemetry into a few high-count rows and leaves novel parent-child pairings standing out at low
    counts. Look for other services spawning interpreters, discovery utilities, or account-enumeration commands that
    would place this event inside a larger sequence.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
  answer_sources:
  - process_creation
- question: Is this parent-child spawning pattern occurring on other hosts in the environment?
  context: >-
    The same service wrapper spawning the same child binary across several hosts within a day points to either a
    fleet-wide configuration change or the same server-side vulnerability being exercised against every host running the
    application. A single occurrence points to a host-specific trigger. The query deliberately omits the host filter so
    the comparison runs across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ParentName|expand: '%ParentName%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - host.name
      - CommandLine
  answer_sources:
  - process_creation
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Exploitation of an application server is often preceded by observable activity: scanning, repeated request failures,
    or earlier execution attempts under the same service. Earlier detections on this host in the preceding six hours help
    place this event in a timeline and may identify the initial access path.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
  answer_sources:
  - alert
