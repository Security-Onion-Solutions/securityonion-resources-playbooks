- question: What other activity occurred on this host around the time of the alert?
  context: >-
    Alerts rarely occur in isolation. Examining activity around the alert reveals what led to this event and what happened
    after. Aggregating process and parent pairs collapses repetitive agent noise into high-count rows while novel
    parent-child pairs stand out at low counts, which is where reconnaissance, privilege escalation, or staging would show.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: >-
    Earlier detections on the same host — defense tampering, reconnaissance, credential access — may reveal the attack
    stages that preceded this event and help reconstruct the timeline. A renamed administrative tool is frequently a
    middle stage; prior alerts indicate what came before it.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
- question: If the impersonated tool is a remote-admin utility, has this user account driven remote-execution tooling against other hosts?
  context: >-
    Several of the Sysinternals names this rule covers are remote-execution and remote-management utilities. When the
    alerting binary impersonates one of those, the relevant scope question is whether the same account has run
    remote-admin tooling across multiple hosts in the past day. Connections fanning out from one account to many hosts in a
    short window indicate active movement across the environment.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      selection_lateral:
        Image|endswith:
          - '\psexec.exe'
          - '\psexec64.exe'
          - '\mstsc.exe'
          - '\ssh.exe'
          - '\plink.exe'
          - '\wmic.exe'
      condition: selection and selection_lateral
    fields:
      - host.name
      - Image
