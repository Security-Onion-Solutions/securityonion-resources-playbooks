- question: What else did this user do across the network around this time?
  context: >-
    Tracking the user's activity across all hosts reveals whether the same account is operating on multiple endpoints. If
    the same user triggered similar activity on several hosts in a short window, the scope of the event is larger than a
    single host.
  range: +/-1h
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        User|expand: '%User%'
      condition: selection
    fields:
      - host.name
      - Image
