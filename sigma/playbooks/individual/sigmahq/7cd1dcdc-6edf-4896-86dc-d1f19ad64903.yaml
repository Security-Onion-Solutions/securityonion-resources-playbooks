name: Network Connection Initiated To Cloudflared Tunnels Domains
id: ac367ede-fdf7-4ae6-8554-582a55f3a9c4
description: |
  Detects a Windows host initiating an outbound network connection to a hostname
  belonging to Cloudflare's tunnel infrastructure -- the argotunnel.com discovery
  domains (.v2.argotunnel.com, protocol-v2.argotunnel.com, update.argotunnel.com)
  or a trycloudflare.com quick tunnel. The rule fires when an egress connection is
  initiated AND the destination hostname ends in one of these domains. Legitimate
  developers and IT teams use Cloudflare tunnels for sanctioned remote access and
  testing, but the same tooling is abused to establish a reverse tunnel that exposes
  internal services (RDP, SMB, SSH) to an operator or to move data over an encrypted
  QUIC channel to Cloudflare-owned addresses. Because the tunnel's ingress rules live
  off-host in a cloud dashboard, the on-host command line may reveal only a token and
  not which services are exposed; investigation should confirm the destination and
  initiating process, decode the tunnel command, establish whether the tool and tunnel
  are authorized, and scope host and fleet reach.
type: detection
detection_id: 7cd1dcdc-6edf-4896-86dc-d1f19ad64903
detection_category: ''
detection_type: sigma
contributors:
- SecurityOnionSolutions
created: 2026-07-09
questions:
- question: Does the destination and port match a Cloudflare tunnel endpoint, and which process initiated the connection?
  context: Confirm the alert by reviewing the destination the connection was made to,
    the port, the egress direction, and the initiating process. The destination
    hostname is only sparsely recorded on connection telemetry, so anchor on the
    destination IP and port and use the DNS view to confirm which tunnel domain was
    resolved; the alerting event may originate from network-level telemetry that
    carries no process fields.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationHostname
      - Initiated
- question: Is this user and host expected to run a network tunneling tool?
  context: Legitimate administrative or development activity can trigger this
    detection. Knowing whether the user role and host function are consistent with
    running a tunneling utility that reaches Cloudflare infrastructure is often the
    fastest path to separating sanctioned use from attacker-deployed access.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - host.name
      - User
- question: What did the tunneling command do? Decode the full command line.
  context: The full command line reveals whether the tool ran as a token-based tunnel
    (tunnel run --token), a quick tunnel (--url pointing at a local service port), or another
    form. The ingress configuration that decides which local services are exposed
    lives off-host in a cloud dashboard, so the absence of RDP, SMB, or SSH arguments
    on the command line does not rule out that those services were exposed.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - CommandLine
      - CurrentDirectory
- question: Which Cloudflare tunnel domain was resolved, and which local process issued the query?
  context: DNS resolution is recorded separately from the connection and is reliably
    populated, so the query name identifies which tunnel domain was contacted and
    attributes it to a process on the host. The argotunnel.com discovery domains are
    queried at tunnel initialization; trycloudflare.com covers account-less quick
    tunnels. Attribution to a specific process here confirms an on-host tunnel client
    rather than an unrelated reference to the domain.
  range: +/-5m
  query: |
    aggregation: false
    logsource:
      category: dns_query
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        QueryName|endswith:
        - .v2.argotunnel.com
        - protocol-v2.argotunnel.com
        - trycloudflare.com
        - update.argotunnel.com
      condition: selection
    fields:
      - QueryName
      - Image
- question: Is this tunneling tool on the organization's approved software list?
  context: Organizations typically maintain a list of approved remote access and
    tunneling tools. A tunnel client that reaches Cloudflare infrastructure but is not
    on that list may represent shadow IT or attacker-deployed access, and should be
    checked regardless of the binary's reputation. The client is a signed binary and
    can be renamed to blend in, so identify it by the tunnel destination and behavior
    rather than the file name alone.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - Image
- question: Is there a helpdesk ticket, maintenance window, or approved use case explaining this tunnel?
  context: Legitimate tunnel usage typically correlates with an active support ticket,
    a scheduled maintenance window, or a documented development or testing task. If no
    such context exists for this session, the tunnel may have been established by an
    attacker for persistent access or by a user circumventing controls.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - CommandLine
- question: What external endpoint and port is this tool connecting to?
  context: The tunnel client defaults to QUIC over port 7844 to Cloudflare-owned
    addresses, typically the two geographically nearest data centers. The destination
    hostname is sparsely recorded on connection telemetry, so rely on the destination
    IP and port together with the DNS view. Process-anchored results land only on the
    endpoint subset of connection telemetry that carries process fields.
  range: +/-15m
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - DestinationIp
      - DestinationHostname
      - DestinationPort
- question: What process spawned this tunneling tool, and is that parent chain expected?
  context: The parent process reveals how the tool was invoked. Legitimate usage often
    has predictable parents (explorer.exe for user actions, a service host for managed
    installs). Unusual parents such as script hosts, Office applications, or a shell
    launched from a download directory may indicate the tunnel was deployed as part of
    an intrusion.
  range: +/-30d
  query: |
    aggregation: false
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        ProcessGuid|expand: '%ProcessGuid%'
      condition: selection
    fields:
      - ParentImage
      - ParentCommandLine
      - Image
      - CommandLine
- question: Does this host normally connect to this destination?
  context: First-time connections to a destination are more notable than routine
    communication. A baseline distinguishes new tunnel infrastructure from established
    business traffic; maintaining a list of legitimately used web services for the
    environment helps separate expected endpoints from novel ones. Zero or very low
    historical counts indicate a new destination for this host.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
- question: What other connections were made to this destination or from this process?
  context: A single connection may be part of a larger pattern. Repeated or
    high-volume outbound traffic to the same Cloudflare endpoint over a short window,
    or a strong asymmetry between bytes sent and received, is consistent with an
    active tunnel session or data movement. Check for other ports, other processes,
    and what other destinations the same process contacted.
  range: +/-1h
  query: |
    aggregation: false
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - DestinationPort
      - Image
      - Initiated
- question: Does this host normally run this tunneling tool?
  context: A tunnel client that has never been seen on a host is more notable than one
    that runs regularly as part of sanctioned tooling. Zero or very low historical
    counts indicate first-time or rare execution, which raises the priority of
    confirming authorization for the session.
  range: -90d
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - User
- question: What files did the tunneling process create on this host?
  context: A dropped tunnel client may write configuration or certificate files or
    fetch secondary tooling. Files written by the same process can reveal on-host
    artifacts of the tunnel setup or additional payloads. Results appear only where
    the connection carried endpoint process fields; a network-level alert may not
    attribute the connection to a process.
  range: -24h
  query: |
    aggregation: true
    logsource:
      category: file_event
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
        Image|endswith|expand: '%Image%'
      condition: selection
    fields:
      - TargetFilename
- question: Do other hosts in the environment connect to this destination?
  context: If only one host connects to a destination, it may be targeted access. If
    many hosts connect, it may be a sanctioned service or a wider deployment of the
    same tooling. The distribution across hosts and ports informs how broadly the
    tunnel activity has spread and guides the response.
  range: -7d
  query: |
    aggregation: true
    logsource:
      category: network_connection
      product: windows
    detection:
      selection:
        DestinationIp|expand: '%dst_ip%'
      condition: selection
    fields:
      - host.name
      - DestinationPort
      - Image
- question: What other activity occurred on this host around the time of the alert?
  context: Alerts rarely occur in isolation. Examining process activity around the
    alert reveals what led to the tunnel being established and what followed. Look for
    reconnaissance, privilege escalation, or persistence mechanisms that accompany the
    tunnel setup.
  range: +/-15m
  query: |
    aggregation: true
    logsource:
      category: process_creation
      product: windows
    detection:
      selection:
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - Image
      - ParentImage
- question: Did other detections fire on this host in the hours before this alert?
  context: Earlier detections on the same host -- defense tampering, reconnaissance,
    or credential access -- may reveal the stages that preceded the tunnel and help
    reconstruct the timeline. Establishing remote access often follows an initial
    foothold and precedes hands-on-keyboard activity.
  range: -6h
  query: |
    aggregation: false
    logsource:
      category: alert
    detection:
      selection:
        event.module: sigma
        host.name|expand: '%hostname%'
      condition: selection
    fields:
      - event.severity_label
      - rule.name
      - rule.uuid
