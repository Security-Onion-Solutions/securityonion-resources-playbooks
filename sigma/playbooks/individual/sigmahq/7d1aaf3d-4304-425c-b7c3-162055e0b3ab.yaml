- question: Have other hosts fired this rule's pattern in the past week, and does the distribution look like automation or one-off activity?
  context: >-
    The query mirrors the rule's full selection structure with no host scope, so the result is a
    fleet-wide count of this specific recon-and-POST pattern -- not generic usage of the binaries.
    Many hosts firing the same pattern points to scripted deployment or vendor automation that should
    be confirmed and tuned; one host or a small unrelated set points to manual operator activity.
    Use the host distribution to calibrate severity.
